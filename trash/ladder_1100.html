<script>
    const PROBLEMS = [{"contestId": 158, "index": "B", "name": "Taxi", "rating": 1100, "solvedCount": 107877, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Taxi<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>After the lessons <span class=\"tex-span\"><i>n<\/i><\/span> groups of schoolchildren went outside and decided to visit Polycarpus to celebrate his birthday. We know that the <span class=\"tex-span\"><i>i<\/i><\/span>-th group consists of <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> friends (<span class=\"tex-span\">1\u2009\u2264\u2009<i>s<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u20094<\/span>), and they want to go to Polycarpus together. They decided to get there by taxi. Each car can carry at most four passengers. What minimum number of cars will the children need if all members of each group should ride in the same taxi (but one taxi can take more than one group)?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the number of groups of schoolchildren. The second line contains a sequence of integers <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>s<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>s<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>s<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u20094<\/span>). The integers are separated by a space, <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is the number of children in the <span class=\"tex-span\"><i>i<\/i><\/span>-th group.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the single number \u2014 the minimum number of taxis necessary to drive all children to Polycarpus.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1 2 4 3 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>8<br/>2 3 4 4 2 1 3 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>5<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test we can sort the children into four cars like this:<\/p><ul> <li> the third group (consisting of four children), <\/li><li> the fourth group (consisting of three children), <\/li><li> the fifth group (consisting of three children), <\/li><li> the first and the second group (consisting of one and two children, correspondingly). <\/li><\/ul><p>There are other ways to sort the groups into four cars.<\/p><\/div><\/div>"}, {"contestId": 706, "index": "B", "name": "Interesting drink", "rating": 1100, "solvedCount": 90623, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Interesting drink<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Vasiliy likes to rest after a hard work, so you may often meet him in some bar nearby. As all programmers do, he loves the famous drink \"<span class=\"tex-font-style-tt\">Beecola<\/span>\", which can be bought in <span class=\"tex-span\"><i>n<\/i><\/span> different shops in the city. It's known that the price of one bottle in the shop <span class=\"tex-span\"><i>i<\/i><\/span> is equal to <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> coins.<\/p><p>Vasiliy plans to buy his favorite drink for <span class=\"tex-span\"><i>q<\/i><\/span> consecutive days. He knows, that on the <span class=\"tex-span\"><i>i<\/i><\/span>-th day he will be able to spent <span class=\"tex-span\"><i>m<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> coins. Now, for each of the days he want to know in how many different shops he can buy a bottle of \"<span class=\"tex-font-style-tt\">Beecola<\/span>\".<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains a single integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009100\u2009000<\/span>)\u00a0\u2014 the number of shops in the city that sell Vasiliy's favourite drink.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009100\u2009000<\/span>)\u00a0\u2014 prices of the bottles of the drink in the <span class=\"tex-span\"><i>i<\/i><\/span>-th shop.<\/p><p>The third line contains a single integer <span class=\"tex-span\"><i>q<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>q<\/i>\u2009\u2264\u2009100\u2009000<\/span>)\u00a0\u2014 the number of days Vasiliy plans to buy the drink.<\/p><p>Then follow <span class=\"tex-span\"><i>q<\/i><\/span> lines each containing one integer <span class=\"tex-span\"><i>m<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>m<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>)\u00a0\u2014 the number of coins Vasiliy can spent on the <span class=\"tex-span\"><i>i<\/i><\/span>-th day.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>q<\/i><\/span> integers. The <span class=\"tex-span\"><i>i<\/i><\/span>-th of them should be equal to the number of shops where Vasiliy will be able to buy a bottle of the drink on the <span class=\"tex-span\"><i>i<\/i><\/span>-th day.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>3 10 8 6 11<br/>4<br/>1<br/>10<br/>3<br/>11<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/>4<br/>1<br/>5<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>On the first day, Vasiliy won't be able to buy a drink in any of the shops.<\/p><p>On the second day, Vasiliy can buy a drink in the shops <span class=\"tex-span\">1<\/span>, <span class=\"tex-span\">2<\/span>, <span class=\"tex-span\">3<\/span> and <span class=\"tex-span\">4<\/span>.<\/p><p>On the third day, Vasiliy can buy a drink only in the shop number <span class=\"tex-span\">1<\/span>.<\/p><p>Finally, on the last day Vasiliy can buy a drink in any shop.<\/p><\/div><\/div>"}, {"contestId": 363, "index": "B", "name": "Fence", "rating": 1100, "solvedCount": 71353, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Fence<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>There is a fence in front of Polycarpus's home. The fence consists of <span class=\"tex-span\"><i>n<\/i><\/span> planks of the same width which go one after another from left to right. The height of the <span class=\"tex-span\"><i>i<\/i><\/span>-th plank is <span class=\"tex-span\"><i>h<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> meters, distinct planks can have distinct heights.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/ff4898e61fdca3713f04ee1d3db5a83ac2b3ebcd.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <span class=\"tex-font-size-small\">Fence for <span class=\"tex-span\"><i>n<\/i>\u2009=\u20097<\/span> and <span class=\"tex-span\"><i>h<\/i>\u2009=\u2009[1,\u20092,\u20096,\u20091,\u20091,\u20097,\u20091]<\/span><\/span> <\/center><p>Polycarpus has bought a posh piano and is thinking about how to get it into the house. In order to carry out his plan, he needs to take exactly <span class=\"tex-span\"><i>k<\/i><\/span> consecutive planks from the fence. Higher planks are harder to tear off the fence, so Polycarpus wants to find such <span class=\"tex-span\"><i>k<\/i><\/span> consecutive planks that the sum of their heights is minimal possible.<\/p><p>Write the program that finds the indexes of <span class=\"tex-span\"><i>k<\/i><\/span> consecutive planks with minimal total height. Pay attention, the fence is not around Polycarpus's home, it is in front of home (in other words, the fence isn't cyclic).<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20091.5\u00b710<sup class=\"upper-index\">5<\/sup>,\u20091\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>) \u2014 the number of planks in the fence and the width of the hole for the piano. The second line contains the sequence of integers <span class=\"tex-span\"><i>h<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>h<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>h<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>h<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009100<\/span>), where <span class=\"tex-span\"><i>h<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is the height of the <span class=\"tex-span\"><i>i<\/i><\/span>-th plank of the fence.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print such integer <span class=\"tex-span\"><i>j<\/i><\/span> that the sum of the heights of planks <span class=\"tex-span\"><i>j<\/i><\/span>, <span class=\"tex-span\"><i>j<\/i>\u2009+\u20091<\/span>, ..., <span class=\"tex-span\"><i>j<\/i>\u2009+\u2009<i>k<\/i>\u2009-\u20091<\/span> is the minimum possible. If there are multiple such <span class=\"tex-span\"><i>j<\/i><\/span>'s, print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>7 3<br/>1 2 6 1 1 7 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the sample, your task is to find three consecutive planks with the minimum sum of heights. In the given case three planks with indexes 3, 4 and 5 have the required attribute, their total height is 8.<\/p><\/div><\/div>"}, {"contestId": 456, "index": "A", "name": "Laptops", "rating": 1100, "solvedCount": 58901, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. Laptops<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>One day Dima and Alex had an argument about the price and quality of laptops. Dima thinks that the more expensive a laptop is, the better it is. Alex disagrees. Alex thinks that there are two laptops, such that the price of the first laptop is less (strictly smaller) than the price of the second laptop but the quality of the first laptop is higher (strictly greater) than the quality of the second laptop.<\/p><p>Please, check the guess of Alex. You are given descriptions of <span class=\"tex-span\"><i>n<\/i><\/span> laptops. Determine whether two described above laptops exist.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the number of laptops.<\/p><p>Next <span class=\"tex-span\"><i>n<\/i><\/span> lines contain two integers each, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>)<\/span>, where <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is the price of the <span class=\"tex-span\"><i>i<\/i><\/span>-th laptop, and <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is the number that represents the quality of the <span class=\"tex-span\"><i>i<\/i><\/span>-th laptop (the larger the number is, the higher is the quality).<\/p><p>All <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> are distinct. All <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> are distinct. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If Alex is correct, print \"<span class=\"tex-font-style-tt\">Happy Alex<\/span>\", otherwise print \"<span class=\"tex-font-style-tt\">Poor Alex<\/span>\" (without the quotes).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/>1 2<br/>2 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>Happy Alex<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 313, "index": "B", "name": "Ilya and Queries", "rating": 1100, "solvedCount": 57478, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Ilya and Queries<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Ilya the Lion wants to help all his friends with passing exams. They need to solve the following problem to pass the IT exam.<\/p><p>You've got string <span class=\"tex-span\"><i>s<\/i>\u2009=\u2009<i>s<\/i><sub class=\"lower-index\">1<\/sub><i>s<\/i><sub class=\"lower-index\">2<\/sub>... <i>s<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\"><i>n<\/i><\/span> is the length of the string), consisting only of characters \"<span class=\"tex-font-style-tt\">.<\/span>\" and \"<span class=\"tex-font-style-tt\">#<\/span>\" and <span class=\"tex-span\"><i>m<\/i><\/span> queries. Each query is described by a pair of integers <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009&lt;\u2009<i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>)<\/span>. The answer to the query <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is the number of such integers <span class=\"tex-span\"><i>i<\/i><\/span> <span class=\"tex-span\">(<i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>i<\/i>\u2009&lt;\u2009<i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>)<\/span>, that <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009=\u2009<i>s<\/i><sub class=\"lower-index\"><i>i<\/i>\u2009+\u20091<\/sub><\/span>.<\/p><p>Ilya the Lion wants to help his friends but is there anyone to help him? Help Ilya, solve the problem.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains string <span class=\"tex-span\"><i>s<\/i><\/span> of length <span class=\"tex-span\"><i>n<\/i><\/span> <span class=\"tex-span\">(2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>)<\/span>. It is guaranteed that the given string only consists of characters \"<span class=\"tex-font-style-tt\">.<\/span>\" and \"<span class=\"tex-font-style-tt\">#<\/span>\".<\/p><p>The next line contains integer <span class=\"tex-span\"><i>m<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>)<\/span> \u2014 the number of queries. Each of the next <span class=\"tex-span\"><i>m<\/i><\/span> lines contains the description of the corresponding query. The <span class=\"tex-span\"><i>i<\/i><\/span>-th line contains integers <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009&lt;\u2009<i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>)<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>m<\/i><\/span> integers \u2014 the answers to the queries in the order in which they are given in the input.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>......<br/>4<br/>3 4<br/>2 3<br/>1 6<br/>2 6<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/>1<br/>5<br/>4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>#..###<br/>5<br/>1 3<br/>5 6<br/>1 5<br/>3 6<br/>3 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/>1<br/>2<br/>2<br/>0<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 270, "index": "A", "name": "Fancy Fence", "rating": 1100, "solvedCount": 52019, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. Fancy Fence<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Emuskald needs a fence around his farm, but he is too lazy to build it himself. So he purchased a fence-building robot.<\/p><p>He wants the fence to be a regular polygon. The robot builds the fence along a single path, but it can only make fence corners at a single angle <span class=\"tex-span\"><i>a<\/i><\/span>.<\/p><p>Will the robot be able to build the fence Emuskald wants? In other words, is there a regular polygon which angles are equal to <span class=\"tex-span\"><i>a<\/i><\/span>?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains an integer <span class=\"tex-span\"><i>t<\/i><\/span> (<span class=\"tex-span\">0\u2009&lt;\u2009<i>t<\/i>\u2009&lt;\u2009180<\/span>) \u2014 the number of tests. Each of the following <span class=\"tex-span\"><i>t<\/i><\/span> lines contains a single integer <span class=\"tex-span\"><i>a<\/i><\/span> (<span class=\"tex-span\">0\u2009&lt;\u2009<i>a<\/i>\u2009&lt;\u2009180<\/span>) \u2014 the angle the robot can make corners at measured in degrees.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test, output on a single line \"<span class=\"tex-font-style-tt\">YES<\/span>\" (without quotes), if the robot can build a fence Emuskald wants, and \"<span class=\"tex-font-style-tt\">NO<\/span>\" (without quotes), if it is impossible.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>30<br/>60<br/>90<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>NO<br/>YES<br/>YES<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, it is impossible to build the fence, since there is no regular polygon with angle <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/df5f4b07dd5316fde165b43657b2696e2919e791.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>.<\/p><p>In the second test case, the fence is a regular triangle, and in the last test case \u2014 a square.<\/p><\/div><\/div>"}, {"contestId": 368, "index": "B", "name": "Sereja and Suffixes", "rating": 1100, "solvedCount": 51550, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Sereja and Suffixes<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Sereja has an array <span class=\"tex-span\"><i>a<\/i><\/span>, consisting of <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub><\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">2<\/sub><\/span>, <span class=\"tex-span\">...<\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span>. The boy cannot sit and do nothing, he decided to study an array. Sereja took a piece of paper and wrote out <span class=\"tex-span\"><i>m<\/i><\/span> integers <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>l<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>l<\/i><sub class=\"lower-index\"><i>m<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>)<\/span>. For each number <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> he wants to know how many distinct numbers are staying on the positions <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009+\u20091<\/span>, ..., <span class=\"tex-span\"><i>n<\/i><\/span>. Formally, he want to find the number of distinct numbers among <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009+\u20091<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span>.?<\/p><p>Sereja wrote out the necessary array elements but the array was so large and the boy was so pressed for time. Help him, find the answer for the described question for each <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>m<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>)<\/span>. The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub><\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">2<\/sub><\/span>, <span class=\"tex-span\">...<\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>)<\/span> \u2014 the array elements.<\/p><p>Next <span class=\"tex-span\"><i>m<\/i><\/span> lines contain integers <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>l<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>l<\/i><sub class=\"lower-index\"><i>m<\/i><\/sub><\/span>. The <span class=\"tex-span\"><i>i<\/i><\/span>-th line contains integer <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>)<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>m<\/i><\/span> lines \u2014 on the <span class=\"tex-span\"><i>i<\/i><\/span>-th line print the answer to the number <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>10 10<br/>1 2 3 4 1 2 3 4 100000 99999<br/>1<br/>2<br/>3<br/>4<br/>5<br/>6<br/>7<br/>8<br/>9<br/>10<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6<br/>6<br/>6<br/>6<br/>6<br/>5<br/>4<br/>3<br/>2<br/>1<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1873, "index": "E", "name": "Building an Aquarium", "rating": 1100, "solvedCount": 47981, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Building an Aquarium<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You love fish, that's why you have decided to build an aquarium. You have a piece of coral made of $$$n$$$ columns, the $$$i$$$-th of which is $$$a_i$$$ units tall. Afterwards, you will build a tank around the coral as follows: <\/p><ul> <li> Pick an integer $$$h \\geq 1$$$\u00a0\u2014 the <span class=\"tex-font-style-it\">height<\/span> of the tank. Build walls of height $$$h$$$ on either side of the tank. <\/li><li> Then, fill the tank up with water so that the height of each column is $$$h$$$, unless the coral is taller than $$$h$$$; then no water should be added to this column. <\/li><\/ul> For example, with $$$a=[3,1,2,4,6,2,5]$$$ and a height of $$$h=4$$$, you will end up using a total of $$$w=8$$$ units of water, as shown. <center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/09066a721673d03ce81c6cbf6841aabc5a329206.png\" style=\"zoom: 20.0%;max-width: 100.0%;max-height: 100.0%;\"/> <\/center> You can use at most $$$x$$$ units of water to fill up the tank, but you want to build the biggest tank possible. What is the largest value of $$$h$$$ you can select?<\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains two positive integers $$$n$$$ and $$$x$$$ ($$$1 \\leq n \\leq 2 \\cdot 10^5$$$; $$$1 \\leq x \\leq 10^9$$$)\u00a0\u2014 the number of columns of the coral and the maximum amount of water you can use.<\/p><p>The second line of each test case contains $$$n$$$ space-separated integers $$$a_i$$$ ($$$1 \\leq a_i \\leq 10^9$$$)\u00a0\u2014 the heights of the coral.<\/p><p>The sum of $$$n$$$ over all test cases doesn't exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single positive integer $$$h$$$ ($$$h \\geq 1$$$)\u00a0\u2014 the maximum height the tank can have, so you need at most $$$x$$$ units of water to fill up the tank.<\/p><p>We have a proof that under these constraints, such a value of $$$h$$$ always exists.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">7 9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 1 2 4 6 2 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 4 3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 1984<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 6 5 9 1 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 1000000000<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n4\n2\n335\n1000000001\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The first test case is pictured in the statement. With $$$h=4$$$ we need $$$8$$$ units of water, but if $$$h$$$ is increased to $$$5$$$ we need $$$13$$$ units of water, which is more than $$$x=9$$$. So $$$h=4$$$ is optimal.<\/p><p>In the second test case, we can pick $$$h=4$$$ and add $$$3$$$ units to each column, using a total of $$$9$$$ units of water. It can be shown that this is optimal.<\/p><p>In the third test case, we can pick $$$h=2$$$ and use all of our water, so it is optimal.<\/p><\/div><\/div>"}, {"contestId": 1327, "index": "A", "name": "Sum of Odd Integers", "rating": 1100, "solvedCount": 47142, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. Sum of Odd Integers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given two integers $$$n$$$ and $$$k$$$. Your task is to find if $$$n$$$ can be represented as a sum of $$$k$$$ <span class=\"tex-font-style-bf\">distinct positive odd<\/span> (not divisible by $$$2$$$) integers or not.<\/p><p>You have to answer $$$t$$$ independent test cases.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains one integer $$$t$$$ ($$$1 \\le t \\le 10^5$$$) \u2014 the number of test cases.<\/p><p>The next $$$t$$$ lines describe test cases. The only line of the test case contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le n, k \\le 10^7$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print the answer \u2014 \"<span class=\"tex-font-style-tt\">YES<\/span>\" (without quotes) if $$$n$$$ can be represented as a sum of $$$k$$$ <span class=\"tex-font-style-bf\">distinct positive odd<\/span> (not divisible by $$$2$$$) integers and \"<span class=\"tex-font-style-tt\">NO<\/span>\" otherwise.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n3 1\n4 2\n10 3\n10 2\n16 4\n16 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nYES\nNO\nYES\nYES\nNO\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, you can represent $$$3$$$ as $$$3$$$.<\/p><p>In the second test case, the only way to represent $$$4$$$ is $$$1+3$$$.<\/p><p>In the third test case, you cannot represent $$$10$$$ as the sum of three distinct positive odd integers.<\/p><p>In the fourth test case, you can represent $$$10$$$ as $$$3+7$$$, for example.<\/p><p>In the fifth test case, you can represent $$$16$$$ as $$$1+3+5+7$$$.<\/p><p>In the sixth test case, you cannot represent $$$16$$$ as the sum of five distinct positive odd integers.<\/p><\/div><\/div>"}, {"contestId": 519, "index": "B", "name": "A and B and Compilation Errors", "rating": 1100, "solvedCount": 44533, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. A and B and Compilation Errors<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p><span class=\"tex-font-style-it\">A and B are preparing themselves for programming contests.<\/span><\/p><p>B loves to debug his code. But before he runs the solution and starts debugging, he has to first compile the code.<\/p><p>Initially, the compiler displayed <span class=\"tex-span\"><i>n<\/i><\/span> compilation errors, each of them is represented as a positive integer. After some effort, B managed to fix some mistake and then another one mistake.<\/p><p>However, despite the fact that B is sure that he corrected the two errors, he can not understand exactly what compilation errors disappeared \u2014 the compiler of the language which B uses shows errors in the new order every time! B is sure that unlike many other programming languages, compilation errors for his programming language do not depend on each other, that is, if you correct one error, the set of other error does not change.<\/p><p>Can you help B find out exactly what two errors he corrected?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">3\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the initial number of compilation errors.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> space-separated integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) \u2014 the errors the compiler displayed for the first time. <\/p><p>The third line contains <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> space-separated integers <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>b<\/i><sub class=\"lower-index\"><i>n<\/i>\u2009-\u20091<\/sub><\/span> \u2014 the errors displayed at the second compilation. It is guaranteed that the sequence in the third line contains all numbers of the second string except for exactly one. <\/p><p>The fourth line contains <span class=\"tex-span\"><i>n<\/i>\u2009-\u20092<\/span> space-separated integers <span class=\"tex-span\"><i>\u0441<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>\u0441<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>\u0441<\/i><sub class=\"lower-index\"><i>n<\/i>\u2009-\u20092<\/sub><\/span> \u2014 the errors displayed at the third compilation. It is guaranteed that the sequence in the fourth line contains all numbers of the third line except for exactly one. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print two numbers on a single line: the numbers of the compilation errors that disappeared after B made the first and the second correction, respectively. <\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1 5 8 123 7<br/>123 7 5 1<br/>5 1 7<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>8<br/>123<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>6<br/>1 4 3 3 5 7<br/>3 7 5 4 3<br/>4 3 7 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/>3<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test sample B first corrects the error number 8, then the error number 123.<\/p><p>In the second test sample B first corrects the error number 1, then the error number 3. Note that if there are multiple errors with the same number, B can correct only one of them in one step. <\/p><\/div><\/div>"}, {"contestId": 1791, "index": "E", "name": "Negatives and Positives", "rating": 1100, "solvedCount": 44427, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Negatives and Positives<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Given an array $$$a$$$ consisting of $$$n$$$ elements, find the maximum possible sum the array can have after performing the following operation <span class=\"tex-font-style-bf\">any number of times<\/span>: <\/p><ul> <li> Choose $$$2$$$ <span class=\"tex-font-style-bf\">adjacent<\/span> elements and flip both of their signs. In other words choose an index $$$i$$$ such that $$$1 \\leq i \\leq n - 1$$$ and assign $$$a_i = -a_i$$$ and $$$a_{i+1} = -a_{i+1}$$$. <\/li><\/ul><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The input consists of multiple test cases. The first line contains an integer $$$t$$$ ($$$1 \\leq t \\leq 1000$$$)\u00a0\u2014 the number of test cases. The descriptions of the test cases follow.<\/p><p>The first line of each test case contains an integer $$$n$$$ ($$$2 \\leq n \\leq 2\\cdot10^5$$$)\u00a0\u2014 the length of the array.<\/p><p>The following line contains $$$n$$$ space-separated integers $$$a_1,a_2,\\dots,a_n$$$ ($$$-10^9 \\leq a_i \\leq 10^9$$$).<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2\\cdot10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output the maximum possible sum the array can have after performing the described operation any number of times.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">-1 -1 -1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 5 -5 0 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">-1 10 9 8 7 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">-1 -1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n13\n6\n39\n2\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first test case, by performing the operation on the first two elements, we can change the array from $$$[-1, -1, -1]$$$ to $$$[1, 1, -1]$$$, and it can be proven this array obtains the maximum possible sum which is $$$1 + 1 + (-1) = 1$$$.<\/p><p>For the second test case, by performing the operation on $$$-5$$$ and $$$0$$$, we change the array from $$$[1, 5, -5, 0, 2]$$$ to $$$[1, 5, -(-5), -0, 2] = [1, 5, 5, 0, 2]$$$, which has the maximum sum since all elements are non-negative. So, the answer is $$$1 + 5 + 5 + 0 + 2 = 13$$$.<\/p><p>For the third test case, the array already contains only positive numbers, so performing operations is unnecessary. The answer is just the sum of the whole array, which is $$$1 + 2 + 3 = 6$$$.<\/p><\/div><\/div>"}, {"contestId": 467, "index": "B", "name": "Fedor and New Game", "rating": 1100, "solvedCount": 44056, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Fedor and New Game<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>After you had helped George and Alex to move in the dorm, they went to help their friend Fedor play a new computer game \u00abCall of Soldiers 3\u00bb.<\/p><p>The game has <span class=\"tex-span\">(<i>m<\/i>\u2009+\u20091)<\/span> players and <span class=\"tex-span\"><i>n<\/i><\/span> types of soldiers in total. Players \u00abCall of Soldiers 3\u00bb are numbered form <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\">(<i>m<\/i>\u2009+\u20091)<\/span>. Types of soldiers are numbered from <span class=\"tex-span\">0<\/span> to <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span>. Each player has an army. Army of the <span class=\"tex-span\"><i>i<\/i><\/span>-th player can be described by non-negative integer <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. Consider binary representation of <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>: if the <span class=\"tex-span\"><i>j<\/i><\/span>-th bit of number <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> equal to one, then the army of the <span class=\"tex-span\"><i>i<\/i><\/span>-th player has soldiers of the <span class=\"tex-span\"><i>j<\/i><\/span>-th type. <\/p><p>Fedor is the <span class=\"tex-span\">(<i>m<\/i>\u2009+\u20091)<\/span>-th player of the game. He assume that two players can become friends if their armies differ in at most <span class=\"tex-span\"><i>k<\/i><\/span> types of soldiers (in other words, binary representations of the corresponding numbers differ in at most <span class=\"tex-span\"><i>k<\/i><\/span> bits). Help Fedor and count how many players can become his friends.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains three integers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>m<\/i><\/span>, <span class=\"tex-span\"><i>k<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200920;\u00a01\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u20091000)<\/span>.<\/p><p>The <span class=\"tex-span\"><i>i<\/i><\/span>-th of the next <span class=\"tex-span\">(<i>m<\/i>\u2009+\u20091)<\/span> lines contains a single integer <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u20092<sup class=\"upper-index\"><i>n<\/i><\/sup>\u2009-\u20091)<\/span>, that describes the <span class=\"tex-span\"><i>i<\/i><\/span>-th player's army. We remind you that Fedor is the <span class=\"tex-span\">(<i>m<\/i>\u2009+\u20091)<\/span>-th player.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u2014 the number of Fedor's potential friends.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>7 3 1<br/>8<br/>5<br/>111<br/>17<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 3 3<br/>1<br/>2<br/>3<br/>4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1914, "index": "C", "name": "Quests", "rating": 1100, "solvedCount": 43604, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Quests<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Monocarp is playing a computer game. In order to level up his character, he can complete quests. There are $$$n$$$ quests in the game, numbered from $$$1$$$ to $$$n$$$.<\/p><p>Monocarp can complete quests according to the following rules: <\/p><ul> <li> the $$$1$$$-st quest is always available for completion; <\/li><li> the $$$i$$$-th quest is available for completion if all quests $$$j  \\lt  i$$$ have been completed at least once. <\/li><\/ul><p>Note that Monocarp can complete the same quest multiple times.<\/p><p>For each completion, the character gets some amount of experience points: <\/p><ul> <li> for the first completion of the $$$i$$$-th quest, he gets $$$a_i$$$ experience points; <\/li><li> for each subsequent completion of the $$$i$$$-th quest, he gets $$$b_i$$$ experience points. <\/li><\/ul><p>Monocarp is a very busy person, so he has free time to complete no more than $$$k$$$ quests. Your task is to calculate the maximum possible total experience Monocarp can get if he can complete no more than $$$k$$$ quests.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$; $$$1 \\le k \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of quests and the maximum number of quests Monocarp can complete, respectively.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^3$$$).<\/p><p>The third line contains $$$n$$$ integers $$$b_1, b_2, \\dots, b_n$$$ ($$$1 \\le b_i \\le 10^3$$$).<\/p><p>Additional constraint on the input: the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print a single integer\u00a0\u2014 the maximum possible total experience Monocarp can get if he can complete no more than $$$k$$$ quests.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 3 1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1 1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 1 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 2 4 1 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 3 1 4 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 4 5 4 5 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 5 1 2 5 1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n13\n4\n15\n15\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, one of the possible quest completion sequences is as follows: $$$1, 1, 2, 3, 2, 4, 4$$$; its total experience is equal to $$$\\underline{4} + 1 + \\underline{3} + \\underline{1} + 1 + \\underline{2} + 1 = 13$$$ (the underlined numbers correspond to the instances when we complete a quest for the first time).<\/p><p>In the second test case, one of the possible quest completion sequences is as follows: $$$1, 1$$$; its total experience is equal to $$$\\underline{1} + 3 = 4$$$.<\/p><p>In the third test case, one of the possible quest completion sequences is as follows: $$$1, 2, 2, 2, 3$$$; its total experience is equal to $$$\\underline{3} + \\underline{2} + 3 + 3 + \\underline{4} = 15$$$.<\/p><\/div><\/div>"}, {"contestId": 1669, "index": "F", "name": "Eating Candies", "rating": 1100, "solvedCount": 43467, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Eating Candies<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are $$$n$$$ candies put from left to right on a table. The candies are numbered from left to right. The $$$i$$$-th candy has weight $$$w_i$$$. Alice and Bob eat candies. <\/p><p>Alice can eat any number of candies from the left (she can't skip candies, she eats them in a row). <\/p><p>Bob can eat any number of candies from the right (he can't skip candies, he eats them in a row). <\/p><p>Of course, if Alice ate a candy, Bob can't eat it (and vice versa).<\/p><p>They want to be fair. Their goal is to eat the same total weight of candies. What is the most number of candies they can eat in total?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$t$$$ ($$$1 \\leq t \\leq 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains an integer $$$n$$$ ($$$1 \\leq n \\leq 2\\cdot10^5$$$)\u00a0\u2014 the number of candies on the table.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$w_1, w_2, \\dots, w_n$$$ ($$$1 \\leq w_i \\leq 10^4$$$)\u00a0\u2014 the weights of candies from left to right.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2\\cdot10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print a single integer\u00a0\u2014 the maximum number of candies Alice and Bob can eat in total while satisfying the condition.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">10 20 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 1 4 2 4 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 4 8 16<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">9<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">7 3 20 5 15 1 11 8 10<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n6\n0\n7\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first test case, Alice will eat one candy from the left and Bob will eat one candy from the right. There is no better way for them to eat the same total amount of weight. The answer is $$$2$$$ because they eat two candies in total.<\/p><p>For the second test case, Alice will eat the first three candies from the left (with total weight $$$7$$$) and Bob will eat the first three candies from the right (with total weight $$$7$$$). They cannot eat more candies since all the candies have been eaten, so the answer is $$$6$$$ (because they eat six candies in total).<\/p><p>For the third test case, there is no way Alice and Bob will eat the same non-zero weight so the answer is $$$0$$$.<\/p><p>For the fourth test case, Alice will eat candies with weights $$$[7, 3, 20]$$$ and Bob will eat candies with weights $$$[10, 8, 11, 1]$$$, they each eat $$$30$$$ weight. There is no better partition so the answer is $$$7$$$.<\/p><\/div><\/div>"}, {"contestId": 1335, "index": "C", "name": "Two Teams Composing", "rating": 1100, "solvedCount": 39981, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Two Teams Composing<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You have $$$n$$$ students under your control and you have to compose <span class=\"tex-font-style-bf\">exactly two teams<\/span> consisting of some subset of your students. Each student had his own skill, the $$$i$$$-th student skill is denoted by an integer $$$a_i$$$ (different students can have the same skills).<\/p><p>So, about the teams. Firstly, these two teams should have the same size. Two more constraints:<\/p><ul> <li> The first team should consist of students with <span class=\"tex-font-style-bf\">distinct<\/span> skills (i.e. all skills in the first team are unique). <\/li><li> The second team should consist of students with <span class=\"tex-font-style-bf\">the same<\/span> skills (i.e. all skills in the second team are equal). <\/li><\/ul><p>Note that it is permissible that some student of the first team has the same skill as a student of the second team.<\/p><p>Consider some examples (skills are given):<\/p><ul> <li> $$$[1, 2, 3]$$$, $$$[4, 4]$$$ is not a good pair of teams because sizes should be the same; <\/li><li> $$$[1, 1, 2]$$$, $$$[3, 3, 3]$$$ is not a good pair of teams because the first team should not contain students with the same skills; <\/li><li> $$$[1, 2, 3]$$$, $$$[3, 4, 4]$$$ is not a good pair of teams because the second team should contain students with the same skills; <\/li><li> $$$[1, 2, 3]$$$, $$$[3, 3, 3]$$$ is a good pair of teams; <\/li><li> $$$[5]$$$, $$$[6]$$$ is a good pair of teams. <\/li><\/ul><p>Your task is to find the maximum possible size $$$x$$$ for which it is possible to compose a valid pair of teams, where each team size is $$$x$$$ (skills in the first team needed to be unique, skills in the second team should be the same between them). A student cannot be part of more than one team.<\/p><p>You have to answer $$$t$$$ independent test cases.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains one integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$) \u2014 the number of test cases. Then $$$t$$$ test cases follow.<\/p><p>The first line of the test case contains one integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$) \u2014 the number of students. The second line of the test case contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le n$$$), where $$$a_i$$$ is the skill of the $$$i$$$-th student. Different students can have the same skills.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$ ($$$\\sum n \\le 2 \\cdot 10^5$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print the answer \u2014 the maximum possible size $$$x$$$ for which it is possible to compose a valid pair of teams, where each team size is $$$x$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n7\n4 2 4 1 4 3 4\n5\n2 1 5 4 3\n1\n1\n4\n1 1 1 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n1\n0\n2\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case of the example, it is possible to construct two teams of size $$$3$$$: the first team is $$$[1, 2, 4]$$$ and the second team is $$$[4, 4, 4]$$$. Note, that there are some other ways to construct two valid teams of size $$$3$$$.<\/p><\/div><\/div>"}, {"contestId": 1917, "index": "B", "name": "Erase First or Second Letter", "rating": 1100, "solvedCount": 39965, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Erase First or Second Letter<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a string $$$s$$$ of length $$$n$$$. Let's define two operations you can apply on the string:<\/p><ul> <li> remove the first character of the string; <\/li><li> remove the second character of the string. <\/li><\/ul><p>Your task is to find the number of distinct <span class=\"tex-font-style-bf\">non-empty<\/span> strings that can be generated by applying the given operations on the initial string any number of times (possibly zero), in any order.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test consists of multiple test cases. The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 10^4$$$) \u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains $$$n$$$ ($$$1 \\leq n \\leq 10^5$$$) \u2014 the length of the string.<\/p><p>The second line of each test case contains the string $$$s$$$. It is guaranteed that the string only contains lowercase letters of the English alphabet.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer: the number of distinct non-empty strings you can get.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">aaaaa<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">z<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">ababa<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">14<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">bcdaaaabcdaaaa<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">20<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">abcdefghijklmnopqrst<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5\n1\n9\n50\n210\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, we can get the following strings: $$$a$$$, $$$aa$$$, $$$aaa$$$, $$$aaaa$$$, $$$aaaaa$$$.<\/p><p>In the third test case, for example, the word $$$ba$$$ can be reached in the following way:<\/p><ul> <li> remove the first character of the current string $$$ababa$$$, getting $$$baba$$$; <\/li><li> remove the second character of the current string $$$baba$$$, getting $$$bba$$$; <\/li><li> remove the second character of the current string $$$bba$$$, getting $$$ba$$$. <\/li><\/ul><\/div><\/div>"}, {"contestId": 1490, "index": "C", "name": "Sum of Cubes", "rating": 1100, "solvedCount": 39902, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Sum of Cubes<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a positive integer $$$x$$$. Check whether the number $$$x$$$ is representable as the sum of the cubes of two positive integers.<\/p><p>Formally, you need to check if there are two integers $$$a$$$ and $$$b$$$ ($$$1 \\le a, b$$$) such that $$$a^3+b^3=x$$$.<\/p><p>For example, if $$$x = 35$$$, then the numbers $$$a=2$$$ and $$$b=3$$$ are suitable ($$$2^3+3^3=8+27=35$$$). If $$$x=4$$$, then no pair of numbers $$$a$$$ and $$$b$$$ is suitable.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 100$$$)\u00a0\u2014 the number of test cases. Then $$$t$$$ test cases follow.<\/p><p>Each test case contains one integer $$$x$$$ ($$$1 \\le x \\le 10^{12}$$$).<\/p><p>Please note, that the input for some test cases won't fit into $$$32$$$-bit integer type, so you should use at least $$$64$$$-bit integer type in your programming language.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output on a separate line: <\/p><ul> <li> \"<span class=\"tex-font-style-tt\">YES<\/span>\" if $$$x$$$ is representable as the sum of the cubes of two positive integers. <\/li><li> \"<span class=\"tex-font-style-tt\">NO<\/span>\" otherwise. <\/li><\/ul><p>You can output \"<span class=\"tex-font-style-tt\">YES<\/span>\" and \"<span class=\"tex-font-style-tt\">NO<\/span>\" in any case (for example, the strings <span class=\"tex-font-style-tt\">yEs<\/span>, <span class=\"tex-font-style-tt\">yes<\/span>, <span class=\"tex-font-style-tt\">Yes<\/span> and <span class=\"tex-font-style-tt\">YES<\/span> will be recognized as positive).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7\n1\n2\n4\n34\n35\n16\n703657519796\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nNO\nYES\nNO\nNO\nYES\nYES\nYES\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The number $$$1$$$ is not representable as the sum of two cubes.<\/p><p>The number $$$2$$$ is represented as $$$1^3+1^3$$$.<\/p><p>The number $$$4$$$ is not representable as the sum of two cubes.<\/p><p>The number $$$34$$$ is not representable as the sum of two cubes.<\/p><p>The number $$$35$$$ is represented as $$$2^3+3^3$$$.<\/p><p>The number $$$16$$$ is represented as $$$2^3+2^3$$$.<\/p><p>The number $$$703657519796$$$ is represented as $$$5779^3+7993^3$$$.<\/p><\/div><\/div>"}, {"contestId": 1832, "index": "B", "name": "Maximum Sum", "rating": 1100, "solvedCount": 39292, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Maximum Sum<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a_1, a_2, \\dots, a_n$$$, where all elements are different.<\/p><p>You have to perform <span class=\"tex-font-style-bf\">exactly<\/span> $$$k$$$ operations with it. During each operation, you do <span class=\"tex-font-style-bf\">exactly one<\/span> of the following two actions (you choose which to do yourself):<\/p><ul> <li> find <span class=\"tex-font-style-bf\">two minimum elements<\/span> in the array, and delete them; <\/li><li> find <span class=\"tex-font-style-bf\">the maximum element<\/span> in the array, and delete it. <\/li><\/ul><p>You have to calculate the maximum possible sum of elements in the resulting array.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$) \u2014 the number of test cases.<\/p><p>Each test case consists of two lines: <\/p><ul> <li> the first line contains two integers $$$n$$$ and $$$k$$$ ($$$3 \\le n \\le 2 \\cdot 10^5$$$; $$$1 \\le k \\le 99999$$$; $$$2k  \\lt  n$$$) \u2014 the number of elements and operations, respectively. <\/li><li> the second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$; all $$$a_i$$$ are different) \u2014 the elements of the array. <\/li><\/ul><p>Additional constraint on the input: the sum of $$$n$$$ does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print one integer \u2014 the maximum possible sum of elements in the resulting array.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 5 1 10 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 5 1 10 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">15 22 12 10 13 11<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">6 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">15 22 12 10 13 11<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">5 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">999999996 999999999 999999997 999999998 999999995<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n21\n11\n3\n62\n46\n3999999986\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first testcase, applying the first operation produces the following outcome: <\/p><ul> <li> two minimums are $$$1$$$ and $$$2$$$; removing them leaves the array as $$$[5, 10, 6]$$$, with sum $$$21$$$; <\/li><li> a maximum is $$$10$$$; removing it leaves the array as $$$[2, 5, 1, 6]$$$, with sum $$$14$$$. <\/li><\/ul><p>$$$21$$$ is the best answer.<\/p><p>In the second testcase, it's optimal to first erase two minimums, then a maximum.<\/p><\/div><\/div>"}, {"contestId": 1899, "index": "C", "name": "Yarik and Array", "rating": 1100, "solvedCount": 38424, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Yarik and Array<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>A <span class=\"tex-font-style-it\">subarray<\/span> is a continuous part of array.<\/p><p>Yarik recently found an array $$$a$$$ of $$$n$$$ elements and became very interested in finding the maximum sum of a <span class=\"tex-font-style-bf\">non empty<\/span> subarray. However, Yarik doesn't like consecutive integers with the same parity, so the subarray he chooses must have alternating parities for adjacent elements.<\/p><p>For example, $$$[1, 2, 3]$$$ is acceptable, but $$$[1, 2, 4]$$$ is not, as $$$2$$$ and $$$4$$$ are both even and adjacent.<\/p><p>You need to help Yarik by finding the maximum sum of such a subarray.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$t$$$ $$$(1 \\le t \\le 10^4)$$$\u00a0\u2014 number of test cases. Each test case is described as follows.<\/p><p>The first line of each test case contains an integer $$$n$$$ $$$(1 \\le n \\le 2 \\cdot 10^5)$$$\u00a0\u2014 length of the array.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ $$$(-10^3 \\le a_i \\le 10^3)$$$\u00a0\u2014 elements of the array.<\/p><p>It is guaranteed that the sum of $$$n$$$ for all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer\u00a0\u2014 the answer to the problem.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 3 4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">9 9 8 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">-1 4 -1 0 5 -4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">-1 2 4 -3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">-1000<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">101 -99 101<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">20<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">-10 5 -8 10 6 -10 7 9 -2 -6 7 2 -4 6 -1 7 -6 -7 4 1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n15\n17\n8\n4\n-1000\n101\n10\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1850, "index": "E", "name": "Cardboard for Pictures", "rating": 1100, "solvedCount": 38196, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Cardboard for Pictures<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Mircea has $$$n$$$ pictures. The $$$i$$$-th picture is a square with a side length of $$$s_i$$$ centimeters. <\/p><p>He mounted each picture on a square piece of cardboard so that each picture has a border of $$$w$$$ centimeters of cardboard on all sides. In total, he used $$$c$$$ square centimeters of cardboard. Given the picture sizes and the value $$$c$$$, can you find the value of $$$w$$$?<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/ca3af639b1185e8c68ad3a1db4b4270c7a63bc44.png\" style=\"zoom: 50.0%;max-width: 100.0%;max-height: 100.0%;\"/> <span class=\"tex-font-size-small\">A picture of the first test case. Here $$$c = 50 = 5^2 + 4^2 + 3^2$$$, so $$$w=1$$$ is the answer.<\/span> <\/center><p>Please note that the piece of cardboard goes behind each picture, not just the border.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 1000$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains two positive integers $$$n$$$ ($$$1 \\leq n \\leq 2 \\cdot 10^5$$$) and $$$c$$$ ($$$1 \\leq c \\leq 10^{18}$$$)\u00a0\u2014 the number of paintings, and the amount of used square centimeters of cardboard.<\/p><p>The second line of each test case contains $$$n$$$ space-separated integers $$$s_i$$$ ($$$1 \\leq s_i \\leq 10^4$$$)\u00a0\u2014 the sizes of the paintings.<\/p><p>The sum of $$$n$$$ over all test cases doesn't exceed $$$2 \\cdot 10^5$$$.<\/p><p><span class=\"tex-font-style-bf\">Additiona

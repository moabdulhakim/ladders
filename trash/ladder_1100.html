5$$$).<\/p><p>The second line of each test case contains $$$a_1,a_2,\\ldots,a_n$$$ ($$$1 \\le a_i \\le 10^9$$$).<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If it is possible to make the sequence <span class=\"tex-font-style-bf\">non-decreasing<\/span>, print \"<span class=\"tex-font-style-tt\">YES<\/span>\" on a new line. Otherwise, print \"<span class=\"tex-font-style-tt\">NO<\/span>\" on a new line.<\/p><p>You can output the answer in any case. For example, the strings \"<span class=\"tex-font-style-tt\">yEs<\/span>\", \"<span class=\"tex-font-style-tt\">yes<\/span>\", and \"<span class=\"tex-font-style-tt\">Yes<\/span>\" will also be recognized as positive responses.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 3 4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 3 2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 5 2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">8<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 5 4 5 4 5 4 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">9 9 8 2 4 4 3 5 3<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nNO\nYES\nYES\nNO\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the array is already sorted.<\/p><p>In the second test case, we can show that it is impossible.<\/p><p>In the third test case, after performing an operation on $$$i=1$$$, the array becomes $$$[0,1,2,3]$$$, which is now in nondecreasing order.<\/p><\/div><\/div>"}, {"contestId": 1948, "index": "B", "name": "Array Fix", "rating": 1100, "solvedCount": 26678, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Array Fix<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an integer array $$$a$$$ of length $$$n$$$.<\/p><p>You can perform the following operation any number of times (possibly zero): take any element of the array $$$a$$$, which is at least $$$10$$$, delete it, and instead insert the digits that element consisted of in the same position, in order they appear in that element.<\/p><p>For example:<\/p><ul> <li> if we apply this operation to the $$$3$$$-rd element of the array $$$[12, 3, 45, 67]$$$, then the array becomes $$$[12, 3, 4, 5, 67]$$$. <\/li><li> if we apply this operation to the $$$2$$$-nd element of the array $$$[2, 10]$$$, then the array becomes $$$[2, 1, 0]$$$. <\/li><\/ul><p>Your task is to determine whether it is possible to make $$$a$$$ sorted in non-descending order using the aforementioned operation <span class=\"tex-font-style-bf\">any number of times (possibly zero)<\/span>. In other words, you have to determine if it is possible to transform the array $$$a$$$ in such a way that $$$a_1 \\le a_2 \\le \\dots \\le a_k$$$, where $$$k$$$ is the current length of the array $$$a$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^3$$$)\u00a0\u2014 the number of test cases.<\/p><p>Each test case consists of two lines:<\/p><ul> <li> the first line contains a single integer $$$n$$$ ($$$2 \\le n \\le 50$$$). <\/li><li> the second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$0 \\le a_i \\le 99$$$). <\/li><\/ul><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print <span class=\"tex-font-style-tt\">YES<\/span> if it is possible to make $$$a$$$ sorted in non-decreasing order using the aforementioned operation; otherwise, print <span class=\"tex-font-style-tt\">NO<\/span>.<\/p><p>You can print each letter in any case. For example, <span class=\"tex-font-style-tt\">yes<\/span>, <span class=\"tex-font-style-tt\">Yes<\/span>, <span class=\"tex-font-style-tt\">YeS<\/span> will all be recognized as a positive answer.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">12 3 45 67<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">12 28 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0 0<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nNO\nYES\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, you can split the first element, then the array becomes $$$[1, 2, 3, 45, 67]$$$.<\/p><p>In the second example, there is no way to get a sorted array.<\/p><p>In the third example, the array is already sorted.<\/p><\/div><\/div>"}, {"contestId": 296, "index": "A", "name": "Yaroslav and Permutations", "rating": 1100, "solvedCount": 26533, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. Yaroslav and Permutations<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Yaroslav has an array that consists of <span class=\"tex-span\"><i>n<\/i><\/span> integers. In one second Yaroslav can swap two neighboring array elements. Now Yaroslav is wondering if he can obtain an array where any two neighboring elements would be distinct in a finite time.<\/p><p>Help Yaroslav.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integer <span class=\"tex-span\"><i>n<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009100)<\/span> \u2014 the number of elements in the array. The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u20091000)<\/span> \u2014 the array elements.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In the single line print \"<span class=\"tex-font-style-tt\">YES<\/span>\" (without the quotes) if Yaroslav can obtain the array he needs, and \"<span class=\"tex-font-style-tt\">NO<\/span>\" (without the quotes) otherwise.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>1<br/>1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>1 1 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>7 7 7 7<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>NO<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample the initial array fits well.<\/p><p>In the second sample Yaroslav can get array: <span class=\"tex-span\">1<\/span>, <span class=\"tex-span\">2<\/span>, <span class=\"tex-span\">1<\/span>. He can swap the last and the second last elements to obtain it.<\/p><p>In the third sample Yarosav can't get the array he needs.<\/p><p> <\/p><p> <\/p><p> <\/p><p> <\/p><p> <\/p><p> <\/p><\/div><\/div>"}, {"contestId": 1382, "index": "B", "name": "Sequential Nim", "rating": 1100, "solvedCount": 26504, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Sequential Nim<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are $$$n$$$ piles of stones, where the $$$i$$$-th pile has $$$a_i$$$ stones. Two people play a game, where they take alternating turns removing stones.<\/p><p>In a move, a player may remove a positive number of stones from the <span class=\"tex-font-style-bf\">first non-empty pile<\/span> (the pile with the minimal index, that has at least one stone). The first player who cannot make a move (because all piles are empty) loses the game. If both players play optimally, determine the winner of the game.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1\\le t\\le 1000$$$) \u00a0\u2014 the number of test cases. Next $$$2t$$$ lines contain descriptions of test cases.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1\\le n\\le 10^5$$$) \u00a0\u2014 the number of piles.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1,\\ldots,a_n$$$ ($$$1\\le a_i\\le 10^9$$$) \u00a0\u2014 $$$a_i$$$ is equal to the number of stones in the $$$i$$$-th pile.<\/p><p>It is guaranteed that the sum of $$$n$$$ for all test cases does not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, if the player who makes the first move will win, output \"<span class=\"tex-font-style-tt\">First<\/span>\". Otherwise, output \"<span class=\"tex-font-style-tt\">Second<\/span>\".<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7\n3\n2 5 4\n8\n1 1 1 1 1 1 1 1\n6\n1 2 3 4 5 6\n6\n1 1 2 1 2 2\n1\n1000000000\n5\n1 2 2 1 1\n3\n1 1 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nFirst\nSecond\nSecond\nFirst\nFirst\nSecond\nFirst\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the first player will win the game. His winning strategy is: <\/p><ol> <li> The first player should take the stones from the first pile. He will take $$$1$$$ stone. The numbers of stones in piles will be $$$[1, 5, 4]$$$. <\/li><li> The second player should take the stones from the first pile. He will take $$$1$$$ stone because he can't take any other number of stones. The numbers of stones in piles will be $$$[0, 5, 4]$$$. <\/li><li> The first player should take the stones from the second pile because the first pile is empty. He will take $$$4$$$ stones. The numbers of stones in piles will be $$$[0, 1, 4]$$$. <\/li><li> The second player should take the stones from the second pile because the first pile is empty. He will take $$$1$$$ stone because he can't take any other number of stones. The numbers of stones in piles will be $$$[0, 0, 4]$$$. <\/li><li> The first player should take the stones from the third pile because the first and second piles are empty. He will take $$$4$$$ stones. The numbers of stones in piles will be $$$[0, 0, 0]$$$. <\/li><li> The second player will lose the game because all piles will be empty. <\/li><\/ol><\/div><\/div>"}, {"contestId": 1986, "index": "C", "name": "Update Queries", "rating": 1100, "solvedCount": 26435, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Update Queries<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Let's consider the following simple problem. You are given a string $$$s$$$ of length $$$n$$$, consisting of lowercase Latin letters, as well as an array of indices $$$ind$$$ of length $$$m$$$ ($$$1 \\leq ind_i \\leq n$$$) and a string $$$c$$$ of length $$$m$$$, consisting of lowercase Latin letters. Then, in order, you perform the update operations, namely, during the $$$i$$$-th operation, you set $$$s_{ind_i} = c_i$$$. Note that you perform all $$$m$$$ operations from the first to the last.<\/p><p>Of course, if you change the order of indices in the array $$$ind$$$ and/or the order of letters in the string $$$c$$$, you can get different results. Find the lexicographically smallest string $$$s$$$ that can be obtained after $$$m$$$ update operations, if you can rearrange the indices in the array $$$ind$$$ and the letters in the string $$$c$$$ as you like.<\/p><p>A string $$$a$$$ is lexicographically less than a string $$$b$$$ if and only if one of the following conditions is met:<\/p><ul><li> $$$a$$$ is a prefix of $$$b$$$, but $$$a \\neq b$$$;<\/li><li> in the first position where $$$a$$$ and $$$b$$$ differ, the symbol in string $$$a$$$ is earlier in the alphabet than the corresponding symbol in string $$$b$$$.<\/li><\/ul><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test consists of several sets of input data. The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 10^4$$$)\u00a0\u2014 the number of sets of input data. Then follows their description.<\/p><p>The first line of each set of input data contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\leq n, m \\leq 10^5$$$)\u00a0\u2014 the length of the string $$$s$$$ and the number of updates.<\/p><p>The second line of each set of input data contains a string $$$s$$$ of length $$$n$$$, consisting of lowercase Latin letters.<\/p><p>The third line of each set of input data contains $$$m$$$ integers $$$ind_1, ind_2, \\ldots, ind_m$$$ ($$$1 \\leq ind_i \\leq n$$$)\u00a0\u2014 the array of indices $$$ind$$$.<\/p><p>The fourth line of each set of input data contains a string $$$c$$$ of length $$$m$$$, consisting of lowercase Latin letters.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all sets of input data does not exceed $$$2 \\cdot 10^5$$$. Similarly, the sum of $$$m$$$ over all sets of input data does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each set of input data, output the lexicographically smallest string $$$s$$$ that can be obtained by rearranging the indices in the array $$$ind$$$ and the letters in the string $$$c$$$ as you like.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">a<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">cb<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">meow<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2 1 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">zcwz<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">abacaba<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 3 5 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">damn<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">7 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">traktor<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">7 6 5 4 3 2 1 6 4 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">codeforces<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nb\ncwoz\nabdcmbn\nccdeefo\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first set of input data, you can leave the array $$$ind$$$ and the string $$$c$$$ unchanged and simply perform all operations in that order.<\/p><p>In the second set of input data, you can set the array $$$ind = [1, 1, 4, 2]$$$ and $$$c =$$$ \"<span class=\"tex-font-style-tt\">zczw<\/span>\". Then the string $$$s$$$ will change as follows: $$$meow \\rightarrow zeow \\rightarrow ceow \\rightarrow ceoz \\rightarrow cwoz$$$.<\/p><p>In the third set of input data, you can leave the array $$$ind$$$ unchanged and set $$$c = $$$ \"<span class=\"tex-font-style-tt\">admn<\/span>\". Then the string $$$s$$$ will change as follows: $$$abacaba \\rightarrow abacaba \\rightarrow abdcaba \\rightarrow abdcmba \\rightarrow abdcmbn$$$.<\/p><\/div><\/div>"}, {"contestId": 1669, "index": "D", "name": "Colorful Stamp", "rating": 1100, "solvedCount": 26067, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Colorful Stamp<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>A row of $$$n$$$ cells is given, all initially white. Using a stamp, you can stamp any two neighboring cells such that one becomes red and the other becomes blue. A stamp can be rotated, i.e. it can be used in both ways: as $$$\\color{blue}{\\texttt{B}}\\color{red}{\\texttt{R}}$$$ and as $$$\\color{red}{\\texttt{R}}\\color{blue}{\\texttt{B}}$$$.<\/p><p>During use, the stamp must completely fit on the given $$$n$$$ cells (it cannot be partially outside the cells). The stamp can be applied multiple times to the same cell. Each usage of the stamp recolors both cells that are under the stamp.<\/p><p>For example, one possible sequence of stamps to make the picture $$$\\color{blue}{\\texttt{B}}\\color{red}{\\texttt{R}}\\color{blue}{\\texttt{B}}\\color{blue}{\\texttt{B}}\\texttt{W}$$$ could be $$$\\texttt{WWWWW} \\to \\texttt{WW}\\color{brown}{\\underline{\\color{red}{\\texttt{R}}\\color{blue}{\\texttt{B}}}}\\texttt{W} \\to \\color{brown}{\\underline{\\color{blue}{\\texttt{B}}\\color{red}{\\texttt{R}}}}\\color{red}{\\texttt{R}}\\color{blue}{\\texttt{B}}\\texttt{W} \\to \\color{blue}{\\texttt{B}}\\color{brown}{\\underline{\\color{red}{\\texttt{R}}\\color{blue}{\\texttt{B}}}}\\color{blue}{\\texttt{B}}\\texttt{W}$$$. Here $$$\\texttt{W}$$$, $$$\\color{red}{\\texttt{R}}$$$, and $$$\\color{blue}{\\texttt{B}}$$$ represent a white, red, or blue cell, respectively, and the cells that the stamp is used on are marked with an underline.<\/p><p>Given a final picture, is it possible to make it using the stamp zero or more times?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$t$$$ ($$$1 \\leq t \\leq 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains an integer $$$n$$$ ($$$1 \\leq n \\leq 10^5$$$)\u00a0\u2014 the length of the picture.<\/p><p>The second line of each test case contains a string $$$s$$$\u00a0\u2014 the picture you need to make. It is guaranteed that the length of $$$s$$$ is $$$n$$$ and that $$$s$$$ only consists of the characters $$$\\texttt{W}$$$, $$$\\texttt{R}$$$, and $$$\\texttt{B}$$$, representing a white, red, or blue cell, respectively.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output $$$t$$$ lines, each of which contains the answer to the corresponding test case. As an answer, output \"<span class=\"tex-font-style-tt\">YES<\/span>\" if it possible to make the picture using the stamp zero or more times, and \"<span class=\"tex-font-style-tt\">NO<\/span>\" otherwise.<\/p><p>You can output the answer in any case (for example, the strings \"<span class=\"tex-font-style-tt\">yEs<\/span>\", \"<span class=\"tex-font-style-tt\">yes<\/span>\", \"<span class=\"tex-font-style-tt\">Yes<\/span>\" and \"<span class=\"tex-font-style-tt\">YES<\/span>\" will be recognized as a positive answer).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">12<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">BRBBW<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">B<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">WB<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">RW<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">BRB<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">RBB<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">WWWWWWW<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">9<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">RBWBWRRBW<\/div><div class=\"test-example-line test-example-line-odd test-example-line-9\">10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-9\">BRBRBRBRRB<\/div><div class=\"test-example-line test-example-line-even test-example-line-10\">12<\/div><div class=\"test-example-line test-example-line-even test-example-line-10\">BBBRWWRRRWBR<\/div><div class=\"test-example-line test-example-line-odd test-example-line-11\">10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-11\">BRBRBRBRBW<\/div><div class=\"test-example-line test-example-line-even test-example-line-12\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-12\">RBWBW<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nNO\nNO\nNO\nYES\nYES\nYES\nNO\nYES\nNO\nYES\nNO\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The first test case is explained in the statement.<\/p><p>For the second, third, and fourth test cases, it is not possible to stamp a single cell, so the answer is \"<span class=\"tex-font-style-tt\">NO<\/span>\".<\/p><p>For the fifth test case, you can use the stamp as follows: $$$\\texttt{WWW} \\to \\texttt{W}\\color{brown}{\\underline{\\color{red}{\\texttt{R}}\\color{blue}{\\texttt{B}}}} \\to \\color{brown}{\\underline{\\color{blue}{\\texttt{B}}\\color{red}{\\texttt{R}}}}\\color{blue}{\\texttt{B}}$$$.<\/p><p>For the sixth test case, you can use the stamp as follows: $$$\\texttt{WWW} \\to \\texttt{W}\\color{brown}{\\underline{\\color{red}{\\texttt{R}}\\color{blue}{\\texttt{B}}}} \\to \\color{brown}{\\underline{\\color{red}{\\texttt{R}}\\color{blue}{\\texttt{B}}}}\\color{blue}{\\texttt{B}}$$$.<\/p><p>For the seventh test case, you don't need to use the stamp at all.<\/p><\/div><\/div>"}, {"contestId": 1997, "index": "C", "name": "Even Positions", "rating": 1100, "solvedCount": 25891, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Even Positions<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Monocarp had a regular bracket sequence $$$s$$$ of length $$$n$$$ ($$$n$$$ is even). He even came up with his own way to calculate its cost.<\/p><p>He knows that in a regular bracket sequence (RBS), each opening bracket is paired up with the corresponding closing bracket. So he decided to calculate the <span class=\"tex-font-style-it\">cost<\/span> of RBS as the sum of distances between pairs of corresponding bracket pairs.<\/p><p>For example, let's look at RBS <span class=\"tex-font-style-tt\">(())()<\/span>. It has three pairs of brackets: <\/p><ul> <li> <span class=\"tex-font-style-tt\">(__)__<\/span>: the distance between brackets at position $$$1$$$ and at $$$4$$$ is $$$4 - 1 = 3$$$; <\/li><li> <span class=\"tex-font-style-tt\">_()___<\/span>: the distance is $$$3 - 2 = 1$$$; <\/li><li> <span class=\"tex-font-style-tt\">____()<\/span>: the distance is $$$6 - 5 = 1$$$. <\/li><\/ul> So the cost of <span class=\"tex-font-style-tt\">(())()<\/span> is $$$3 + 1 + 1 = 5$$$.<p>Unfortunately, due to data corruption, Monocarp lost all characters on odd positions $$$s_1, s_3, \\dots, s_{n-1}$$$. Only characters on even positions ($$$s_2, s_4, \\dots, s_{n}$$$) remain. For example, <span class=\"tex-font-style-tt\">(())()<\/span> turned to <span class=\"tex-font-style-tt\">_(_)_)<\/span>.<\/p><p>Monocarp wants to restore his RBS by placing brackets on the odd positions. But since the restored RBS may not be unique, he wants to choose one with <span class=\"tex-font-style-bf\">minimum cost<\/span>. It's too hard to do for Monocarp alone, so can you help him?<\/p><p>Reminder: A <span class=\"tex-font-style-it\">regular bracket sequence<\/span> is a string consisting of only brackets, such that this sequence, when inserted <span class=\"tex-font-style-tt\">1<\/span>-s and <span class=\"tex-font-style-tt\">+<\/span>-s, gives a valid mathematical expression. For example, <span class=\"tex-font-style-tt\">()<\/span>, <span class=\"tex-font-style-tt\">(())<\/span> or <span class=\"tex-font-style-tt\">(()())()<\/span> are RBS, while <span class=\"tex-font-style-tt\">)<\/span>, <span class=\"tex-font-style-tt\">()(<\/span> or <span class=\"tex-font-style-tt\">())(()<\/span> are not.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 5000$$$)\u00a0\u2014 the number of test cases. Next $$$t$$$ cases follow.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$; $$$n$$$ is even)\u00a0\u2014 the length of string $$$s$$$.<\/p><p>The second line of each test case contains a string $$$s$$$ of length $$$n$$$, where all characters on the odd positions are '<span class=\"tex-font-style-tt\">_<\/span>' and all characters on the even positions are either '<span class=\"tex-font-style-tt\">(<\/span>' or '<span class=\"tex-font-style-tt\">)<\/span>'.<\/p><p>Additional constraints: <\/p><ul> <li> $$$s$$$ can be restored to at least one regular bracket sequence; <\/li><li> the total sum of $$$n$$$ over all test cases doesn't exceed $$$2 \\cdot 10^5$$$. <\/li><\/ul><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print one integer\u00a0\u2014 the minimum cost of the regular bracket sequence that can be obtained from $$$s$$$ by replacing '<span class=\"tex-font-style-tt\">_<\/span>'-s with brackets.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">_(_)_)<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">_)<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">_)_)_)_)<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">8<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">_(_)_(_)<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5\n1\n4\n8\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, it's optimal to make $$$s$$$ equal to <span class=\"tex-font-style-tt\">(())()<\/span>. The cost of $$$s$$$ will be equal to $$$3 + 1 + 1 = 5$$$.<\/p><p>In the second test case, the only option is to make $$$s$$$ equal to <span class=\"tex-font-style-tt\">()<\/span> with cost $$$1$$$.<\/p><p>In the third test case, the only possible RBS is <span class=\"tex-font-style-tt\">()()()()<\/span> with cost $$$1 + 1 + 1 + 1 = 4$$$.<\/p><p>In the fourth test case, it's optimal to make $$$s$$$ equal to <span class=\"tex-font-style-tt\">(())(())<\/span> with cost $$$3 + 1 + 3 + 1 = 8$$$.<\/p><\/div><\/div>"}, {"contestId": 1933, "index": "C", "name": "Turtle Fingers: Count the Values of k", "rating": 1100, "solvedCount": 25827, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Turtle Fingers: Count the Values of k<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given three <span class=\"tex-font-style-bf\">positive<\/span> integers $$$a$$$, $$$b$$$ and $$$l$$$ ($$$a,b,l \\gt 0$$$). <\/p><p>It can be shown that there always exists a way to choose <span class=\"tex-font-style-bf\">non-negative<\/span> (i.e. $$$\\ge 0$$$) integers $$$k$$$, $$$x$$$, and $$$y$$$ such that $$$l = k \\cdot a^x \\cdot b^y$$$. <\/p><p>Your task is to find the number of distinct possible values of $$$k$$$ across all such ways.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains the integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The following $$$t$$$ lines contain three integers, $$$a$$$, $$$b$$$ and $$$l$$$ ($$$2 \\le a, b \\le 100$$$, $$$1 \\le l \\le 10^6$$$)\u00a0\u2014 description of a test case.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output $$$t$$$ lines, with the $$$i$$$-th ($$$1 \\le i \\le t$$$) line containing an integer, the answer to the $$$i$$$-th test case.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">11<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 5 20<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 5 21<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 6 48<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 3 72<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3 5 75<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">2 2 1024<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">3 7 83349<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">100 100 1000000<\/div><div class=\"test-example-line test-example-line-odd test-example-line-9\">7 3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-10\">2 6 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-11\">17 3 632043<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n1\n5\n12\n6\n11\n24\n4\n1\n3\n24\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, $$$a=2, b=5, l=20$$$. The possible values of $$$k$$$ (and corresponding $$$x,y$$$) are as follows: <\/p><ul> <li> Choose $$$k = 1, x = 2, y = 1$$$. Then $$$k \\cdot a^x \\cdot b^y = 1 \\cdot 2^2 \\cdot 5^1 = 20 = l$$$. <\/li><li> Choose $$$k = 2, x = 1, y = 1$$$. Then $$$k \\cdot a^x \\cdot b^y = 2 \\cdot 2^1 \\cdot 5^1 = 20 = l$$$. <\/li><li> Choose $$$k = 4, x = 0, y = 1$$$. Then $$$k \\cdot a^x \\cdot b^y = 4 \\cdot 2^0 \\cdot 5^1 = 20 = l$$$. <\/li><li> Choose $$$k = 5, x = 2, y = 0$$$. Then $$$k \\cdot a^x \\cdot b^y = 5 \\cdot 2^2 \\cdot 5^0 = 20 = l$$$. <\/li><li> Choose $$$k = 10, x = 1, y = 0$$$. Then $$$k \\cdot a^x \\cdot b^y = 10 \\cdot 2^1 \\cdot 5^0 = 20 = l$$$. <\/li><li> Choose $$$k = 20, x = 0, y = 0$$$. Then $$$k \\cdot a^x \\cdot b^y = 20 \\cdot 2^0 \\cdot 5^0 = 20 = l$$$. <\/li><\/ul><p>In the second test case, $$$a=2, b=5, l=21$$$. Note that $$$l = 21$$$ is not divisible by either $$$a = 2$$$ or $$$b = 5$$$. Therefore, we can only set $$$x = 0, y = 0$$$, which corresponds to $$$k = 21$$$.<\/p><p>In the third test case, $$$a=4, b=6, l=48$$$. The possible values of $$$k$$$ (and corresponding $$$x,y$$$) are as follows: <\/p><ul> <li> Choose $$$k = 2, x = 1, y = 1$$$. Then $$$k \\cdot a^x \\cdot b^y = 2 \\cdot 4^1 \\cdot 6^1 = 48 = l$$$. <\/li><li> Choose $$$k = 3, x = 2, y = 0$$$. Then $$$k \\cdot a^x \\cdot b^y = 3 \\cdot 4^2 \\cdot 6^0 = 48 = l$$$. <\/li><li> Choose $$$k = 8, x = 0, y = 1$$$. Then $$$k \\cdot a^x \\cdot b^y = 8 \\cdot 4^0 \\cdot 6^1 = 48 = l$$$. <\/li><li> Choose $$$k = 12, x = 1, y = 0$$$. Then $$$k \\cdot a^x \\cdot b^y = 12 \\cdot 4^1 \\cdot 6^0 = 48 = l$$$. <\/li><li> Choose $$$k = 48, x = 0, y = 0$$$. Then $$$k \\cdot a^x \\cdot b^y = 48 \\cdot 4^0 \\cdot 6^0 = 48 = l$$$. <\/li><\/ul><\/div><\/div>"}, {"contestId": 2184, "index": "B", "name": "Hourglass", "rating": 1100, "solvedCount": 25738, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Hourglass<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Vadim's hourglass measures $$$s$$$ minutes. He flipped it over, and the time started. Every $$$k$$$ minutes, Vadim will flip his hourglass again. He will do this even if the sand is still falling. Also, if the sand has already finished falling but there are still some minutes left, Vadim will wait for the required time and only then flip the hourglass. Each flip is done instantly.<\/p><p>However, Vadim needs to leave for errands in $$$m$$$ minutes, and he will stop flipping the hourglass (if Vadim needs to flip the hourglass in the last minute, he will do so). Determine how many minutes the sand will continue to fall after Vadim leaves.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test consists of several test cases. The first line contains a single integer $$$t$$$ $$$(1 \\le t \\le 10^4)$$$\u00a0\u2014 the number of test cases. The following lines describe the test cases.<\/p><p>In a single line of each test case, there are three integers $$$s$$$, $$$k$$$, and $$$m$$$\u00a0\u2014 the number of minutes the hourglass measures, the number of minutes after which the hourglass flips, and the number of minutes after which Vadim will leave for errands $$$(1 \\le s, k, m \\le 10^9)$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output how many minutes the sand will continue to fall after Vadim leaves.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">8 8 12<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 10 17<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">12 2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">16 7 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 1 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">2 60 15<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n<div class=\"test-example-line test-example-line-odd test-example-line-1\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">0<\/div><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, Vadim will flip the hourglass just as the sand stops falling, then $$$4$$$ minutes pass, Vadim leaves, and $$$4$$$ minutes will remain.<\/p><p>In the second test case, Vadim will flip the hourglass at the $$$10$$$-th minute, in the next $$$5$$$ minutes the sand will completely finish falling, and in $$$2$$$ minutes Vadim will leave, resulting in $$$0$$$ minutes remaining.<\/p><p>In the third test case, $$$2$$$ minutes of sand have already fallen before the first flip, so after the flip, this sand will continue to fall. After $$$1$$$ minute, $$$1$$$ minute will remain.<\/p><p>In the fourth test case, $$$7$$$ minutes of sand have already fallen before the first flip, Vadim will perform it and immediately leave, so $$$7$$$ minutes will remain.<\/p><\/div><\/div>"}, {"contestId": 1702, "index": "C", "name": "Train and Queries", "rating": 1100, "solvedCount": 25731, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Train and Queries<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Along the railroad there are stations indexed from $$$1$$$ to $$$10^9$$$. An express train always travels along a route consisting of $$$n$$$ stations with indices $$$u_1, u_2, \\dots, u_n$$$, where ($$$1 \\le u_i \\le 10^9$$$). The train travels along the route from left to right. It starts at station $$$u_1$$$, then stops at station $$$u_2$$$, then at $$$u_3$$$, and so on. Station $$$u_n$$$\u00a0\u2014 the terminus.<\/p><p>It is possible that the train will visit the same station more than once. That is, there may be duplicates among the values $$$u_1, u_2, \\dots, u_n$$$.<\/p><p>You are given $$$k$$$ queries, each containing two different integers $$$a_j$$$ and $$$b_j$$$ ($$$1 \\le a_j, b_j \\le 10^9$$$). For each query, determine whether it is possible to travel by train from the station with index $$$a_j$$$ to the station with index $$$b_j$$$.<\/p><p>For example, let the train route consist of $$$6$$$ of stations with indices [$$$3, 7, 1, 5, 1, 4$$$] and give $$$3$$$ of the following queries: <\/p><ul> <li> $$$a_1 = 3$$$, $$$b_1 = 5$$$<p>It is possible to travel from station $$$3$$$ to station $$$5$$$ by taking a section of the route consisting of stations [$$$3, 7, 1, 5$$$]. Answer: <span class=\"tex-font-style-tt\">YES<\/span>. <\/p><\/li><li> $$$a_2 = 1$$$, $$$b_2 = 7$$$<p>You cannot travel from station $$$1$$$ to station $$$7$$$ because the train cannot travel in the opposite direction. Answer: <span class=\"tex-font-style-tt\">NO<\/span>. <\/p><\/li><li> $$$a_3 = 3$$$, $$$b_3 = 10$$$<p>It is not possible to travel from station $$$3$$$ to station $$$10$$$ because station $$$10$$$ is not part of the train's route. Answer: <span class=\"tex-font-style-tt\">NO<\/span>. <\/p><\/li><\/ul><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains an integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014the number of test cases in the test.<\/p><p>The descriptions of the test cases follow.<\/p><p>The first line of each test case is empty.<\/p><p>The second line of each test case contains two integers: $$$n$$$ and $$$k$$$ ($$$1 \\le n \\le 2 \\cdot 10^5, 1 \\le k \\le 2 \\cdot 10^5$$$)\u00a0\u2014the number of stations the train route consists of and the number of queries.<\/p><p>The third line of each test case contains exactly $$$n$$$ integers $$$u_1, u_2, \\dots, u_n$$$ ($$$1 \\le u_i \\le 10^9$$$). The values $$$u_1, u_2, \\dots, u_n$$$ are not necessarily different.<\/p><p>The following $$$k$$$ lines contain two different integers $$$a_j$$$ and $$$b_j$$$ ($$$1 \\le a_j, b_j \\le 10^9$$$) describing the query with index $$$j$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ values over all test cases in the test does not exceed $$$2 \\cdot 10^5$$$. Similarly, it is guaranteed that the sum of $$$k$$$ values over all test cases in the test also does not exceed $$$2 \\cdot 10^5$$$<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output on a separate line:<\/p><ul> <li> <span class=\"tex-font-style-tt\">YES<\/span>, if you can travel by train from the station with index $$$a_j$$$ to the station with index $$$b_j$$$<\/li><li> <span class=\"tex-font-style-tt\">NO<\/span> otherwise. <\/li><\/ul><p>You can output <span class=\"tex-font-style-tt\">YES<\/span> and <span class=\"tex-font-style-tt\">NO<\/span> in any case (for example, strings <span class=\"tex-font-style-tt\">yEs<\/span>, <span class=\"tex-font-style-tt\">yes<\/span>, <span class=\"tex-font-style-tt\">Yes<\/span> and <span class=\"tex-font-style-tt\">YES<\/span> will be recognized as a positive response).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\"><br/><\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">6 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 7 1 5 1 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\"><br/><\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\"><br/><\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 1 1 1 2 4 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nNO\nNO\nYES\nYES\nNO\nNO\nYES\nYES\nNO\nYES\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The first test case is explained in the problem statement.<\/p><\/div><\/div>"}, {"contestId": 1610, "index": "B", "name": "Kalindrome Array", "rating": 1100, "solvedCount": 25565, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Kalindrome Array<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>An array $$$[b_1, b_2, \\ldots, b_m]$$$ is a palindrome, if $$$b_i = b_{m+1-i}$$$ for each $$$i$$$ from $$$1$$$ to $$$m$$$. Empty array is also a palindrome.<\/p><p>An array is called <span class=\"tex-font-style-bf\">kalindrome<\/span>, if the following condition holds:<\/p><ul><li> <p>It's possible to select some integer $$$x$$$ and delete some of the elements of the array equal to $$$x$$$, so that the remaining array (after gluing together the remaining parts) is a palindrome. <\/p><\/li><\/ul><p>Note that you don't have to delete all elements equal to $$$x$$$, and you don't have to delete at least one element equal to $$$x$$$.<\/p><p>For example : <\/p><ul> <li> $$$[1, 2, 1]$$$ is kalindrome because you can simply not delete a single element. <\/li><li> $$$[3, 1, 2, 3, 1]$$$ is kalindrome because you can choose $$$x = 3$$$ and delete both elements equal to $$$3$$$, obtaining array $$$[1, 2, 1]$$$, which is a palindrome. <\/li><li> $$$[1, 2, 3]$$$ is not kalindrome. <\/li><\/ul><p>You are given an array $$$[a_1, a_2, \\ldots, a_n]$$$. Determine if $$$a$$$ is kalindrome or not.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the length of the array.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le n$$$)\u00a0\u2014 elements of the array.<\/p><p>It's guaranteed that the sum of $$$n$$$ over all test cases won't exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print <span class=\"tex-font-style-tt\">YES<\/span> if $$$a$$$ is kalindrome and <span class=\"tex-font-style-tt\">NO<\/span> otherwise. You can print each letter in any case.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n1\n1\n2\n1 2\n3\n1 2 3\n5\n1 4 4 1 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nYES\nNO\nYES\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, array $$$[1]$$$ is already a palindrome, so it's a kalindrome as well.<\/p><p>In the second test case, we can choose $$$x = 2$$$, delete the second element, and obtain array $$$[1]$$$, which is a palindrome.<\/p><p>In the third test case, it's impossible to obtain a palindrome.<\/p><p>In the fourth test case, you can choose $$$x = 4$$$ and delete the fifth element, obtaining $$$[1, 4, 4, 1]$$$. You also can choose $$$x = 1$$$, delete the first and the fourth elements, and obtain $$$[4, 4, 4]$$$.<\/p><\/div><\/div>"}, {"contestId": 1108, "index": "B", "name": "Divisors of Two Integers", "rating": 1100, "solvedCount": 25545, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Divisors of Two Integers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Recently you have received two <span class=\"tex-font-style-bf\">positive<\/span> integer numbers $$$x$$$ and $$$y$$$. You forgot them, but you remembered a <span class=\"tex-font-style-bf\">shuffled<\/span> list containing all divisors of $$$x$$$ (including $$$1$$$ and $$$x$$$) and all divisors of $$$y$$$ (including $$$1$$$ and $$$y$$$). If $$$d$$$ is a divisor of both numbers $$$x$$$ and $$$y$$$ at the same time, there are two occurrences of $$$d$$$ in the list.<\/p><p>For example, if $$$x=4$$$ and $$$y=6$$$ then the given list can be any permutation of the list $$$[1, 2, 4, 1, 2, 3, 6]$$$. Some of the possible lists are: $$$[1, 1, 2, 4, 6, 3, 2]$$$, $$$[4, 6, 1, 1, 2, 3, 2]$$$ or $$$[1, 6, 3, 2, 4, 1, 2]$$$.<\/p><p>Your problem is to restore suitable <span class=\"tex-font-style-bf\">positive<\/span> integer numbers $$$x$$$ and $$$y$$$ that would yield the same list of divisors (possibly in different order).<\/p><p>It is guaranteed that the answer exists, i.e. the given list of divisors corresponds to some <span class=\"tex-font-style-bf\">positive<\/span> integers $$$x$$$ and $$$y$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$2 \\le n \\le 128$$$) \u2014 the number of divisors of $$$x$$$ and $$$y$$$.<\/p><p>The second line of the input contains $$$n$$$ integers $$$d_1, d_2, \\dots, d_n$$$ ($$$1 \\le d_i \\le 10^4$$$), where $$$d_i$$$ is either divisor of $$$x$$$ or divisor of $$$y$$$. If a number is divisor of both numbers $$$x$$$ and $$$y$$$ then there are two copies of this number in the list.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print two <span class=\"tex-font-style-bf\">positive<\/span> integer numbers $$$x$$$ and $$$y$$$ \u2014 such numbers that merged list of their divisors is the permutation of the given list of integers. It is guaranteed that the answer exists.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n10\n10 2 8 1 2 4 1 20 4 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n20 8\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1976, "index": "B", "name": "Increase/Decrease/Copy", "rating": 1100, "solvedCount": 25424, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Increase/Decrease/Copy<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given two integer arrays: array $$$a$$$ of length $$$n$$$ and array $$$b$$$ of length $$$n+1$$$.<\/p><p>You can perform the following operations any number of times in any order: <\/p><ul> <li> choose any element of the array $$$a$$$ and increase it by $$$1$$$; <\/li><li> choose any element of the array $$$a$$$ and decrease it by $$$1$$$; <\/li><li> choose any element of the array $$$a$$$, copy it and append the copy to the end of the array $$$a$$$. <\/li><\/ul><p>Your task is to calculate the minimum number of aforementioned operations (possibly zero) required to transform the array $$$a$$$ into the array $$$b$$$. It can be shown that under the constraints of the problem, it is always possible.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>Each test case consists of three lines:<\/p><ul> <li> the first line contains a single integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$); <\/li><li> the second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$); <\/li><li> the third line contains $$$n + 1$$$ integers $$$b_1, b_2, \\dots, b_{n + 1}$$$ ($$$1 \\le b_i \\le 10^9$$$). <\/li><\/ul><p>Additional constraint on the input: the sum of $$$n$$$ over all test cases doesn't exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print a single integer\u00a0\u2014 the minimum number of operations (possibly zero) required to transform the array $$$a$$$ into the array $$$b$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 3 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 2 1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 1 5 2 3<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n1\n8\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, you can transform $$$a$$$ into $$$b$$$ as follows: $$$[2] \\rightarrow [2, 2] \\rightarrow [1, 2] \\rightarrow [1, 3]$$$.<\/p><\/div><\/div>"}, {"contestId": 1370, "index": "B", "name": "GCD Compression", "rating": 1100, "solvedCount": 25423, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. GCD Compression<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Ashish has an array $$$a$$$ of consisting of $$$2n$$$ positive integers. He wants to compress $$$a$$$ into an array $$$b$$$ of size $$$n-1$$$. To do this, he first discards exactly $$$2$$$ (any two) elements from $$$a$$$. He then performs the following operation until there are no elements left in $$$a$$$: <\/p><ul> <li> Remove any two elements from $$$a$$$ and append their sum to $$$b$$$. <\/li><\/ul><p>The compressed array $$$b$$$ has to have a special property. The greatest common divisor ($$$\\mathrm{gcd}$$$) of all its elements should be greater than $$$1$$$.<\/p><p>Recall that the $$$\\mathrm{gcd}$$$ of an array of positive integers is the biggest integer that is a divisor of all integers in the array.<\/p><p>It can be proven that it is always possible to compress array $$$a$$$ into an array $$$b$$$ of size $$$n-1$$$ such that $$$gcd(b_1, b_2..., b_{n-1})  \\gt  1$$$. <\/p><p>Help Ashish find a way to do so.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 10$$$)\u00a0\u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$2 \\leq n \\leq 1000$$$).<\/p><p>The second line of each test case contains $$$2n$$$ integers $$$a_1, a_2, \\ldots, a_{2n}$$$ ($$$1 \\leq a_i \\leq 1000$$$)\u00a0\u2014 the elements of the array $$$a$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output $$$n-1$$$ lines\u00a0\u2014 the operations performed to compress the array $$$a$$$ to the array $$$b$$$. <span class=\"tex-font-style-bf\">The initial discard of the two elements is not an operation, you don't need to output anything about it.<\/span><\/p><p>The $$$i$$$-th line should contain two integers, the indices ($$$1$$$\u00a0\u2014based) of the two elements from the array $$$a$$$ that are used in the $$$i$$$-th operation. All $$$2n-2$$$ indices should be distinct integers from $$$1$$$ to $$$2n$$$.<\/p><p>You don't need to output two initially discarded elements from $$$a$$$.<\/p><p>If there are multiple answers, you can find any.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n3\n1 2 3 4 5 6\n2\n5 7 9 10\n5\n1 3 3 4 5 90 100 101 2 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3 6\n4 5\n3 4\n1 9\n2 3\n4 5\n6 10\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, $$$b = \\{3+6, 4+5\\} = \\{9, 9\\}$$$ and $$$\\mathrm{gcd}(9, 9) = 9$$$.<\/p><p>In the second test case, $$$b = \\{9+10\\} = \\{19\\}$$$ and $$$\\mathrm{gcd}(19) = 19$$$.<\/p><p>In the third test case, $$$b = \\{1+2, 3+3, 4+5, 90+3\\} = \\{3, 6, 9, 93\\}$$$ and $$$\\mathrm{gcd}(3, 6, 9, 93) = 3$$$.<\/p><\/div><\/div>"}, {"contestId": 1365, "index": "A", "name": "Matrix Game", "rating": 1100, "solvedCount": 25252, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. Matrix Game<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Ashish and Vivek play a game on a matrix consisting of $$$n$$$ rows and $$$m$$$ columns, where they take turns claiming cells. Unclaimed cells are represented by $$$0$$$, while claimed cells are represented by $$$1$$$. The initial state of the matrix is given. There can be some claimed cells in the initial state.<\/p><p>In each turn, a player must claim a cell. A cell may be claimed if it is unclaimed and does not share a row or column with any other already claimed cells. When a player is unable to make a move, he loses and the game ends.<\/p><p>If Ashish and Vivek take turns to move and Ashish goes first, determine the winner of the game if both of them are playing optimally.<\/p><p>Optimal play between two players means that both players choose the best possible strategy to achieve the best possible outcome for themselves.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line consists of a single integer $$$t$$$ $$$(1 \\le t \\le 50)$$$\u00a0\u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case consists of two space-separated integers $$$n$$$, $$$m$$$ $$$(1 \\le n, m \\le 50)$$$\u00a0\u2014 the number of rows and columns in the matrix.<\/p><p>The following $$$n$$$ lines consist of $$$m$$$ integers each, the $$$j$$$-th integer on the $$$i$$$-th line denoting $$$a_{i,j}$$$ $$$(a_{i,j} \\in \\{0, 1\\})$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case if Ashish wins the game print \"<span class=\"tex-font-style-tt\">Ashish<\/span>\" otherwise print \"<span class=\"tex-font-style-tt\">Vivek<\/span>\" (without quotes).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n2 2\n0 0\n0 0\n2 2\n0 0\n0 1\n2 3\n1 0 1\n1 1 0\n3 3\n1 0 0\n0 0 0\n1 0 0\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nVivek\nAshish\nVivek\nAshish\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first case: One possible scenario could be: Ashish claims cell $$$(1, 1)$$$, Vivek then claims cell $$$(2, 2)$$$. Ashish can neither claim cell $$$(1, 2)$$$, nor cell $$$(2, 1)$$$ as cells $$$(1, 1)$$$ and $$$(2, 2)$$$ are already claimed. Thus Ashish loses. It can be shown that no matter what Ashish plays in this case, Vivek will win. <\/p><p>For the second case: Ashish claims cell $$$(1, 1)$$$, the only cell that can be claimed in the first move. After that Vivek has no moves left.<\/p><p>For the third case: Ashish cannot make a move, so Vivek wins.<\/p><p>For the fourth case: If Ashish claims cell $$$(2, 3)$$$, Vivek will have no moves left.<\/p><\/div><\/div>"}, {"contestId": 1820, "index": "B", "name": "JoJo's Incredible Adventures", "rating": 1100, "solvedCount": 25185, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. JoJo's Incredible Adventures<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Did you think there was going to be a JoJo legend here? But no, that was me, Dio!<\/p><p>Given a binary string $$$s$$$ of length $$$n$$$, consisting of characters <span class=\"tex-font-style-tt\">0<\/span> and <span class=\"tex-font-style-tt\">1<\/span>. Let's build a <span class=\"tex-font-style-bf\">square<\/span> table of size $$$n \\times n$$$, consisting of <span class=\"tex-font-style-tt\">0<\/span> and <span class=\"tex-font-style-tt\">1<\/span> characters as follows.<\/p><p>In the first row of the table write the original string $$$s$$$. In the second row of the table write <span class=\"tex-font-style-it\">cyclic shift<\/span> of the string $$$s$$$ by one to the right. In the third row of the table, write the cyclic shift of line $$$s$$$ by two to the right. And so on. Thus, the row with number $$$k$$$ will contain a cyclic shift of string $$$s$$$ by $$$k$$$ to the right. The rows <span class=\"tex-font-style-bf\">are numbered from $$$0$$$ to $$$n - 1$$$ top-to-bottom<\/span>.<\/p><p>In the resulting table we need to find the rectangle consisting only of ones that has the largest area.<\/p><p>We call a rectangle the set of all cells $$$(i, j)$$$ in the table, such that $$$x_1 \\le i \\le x_2$$$ and $$$y_1 \\le j \\le y_2$$$ for some integers $$$0 \\le x_1 \\le x_2  \\lt  n$$$ and $$$0 \\le y_1 \\le y_2  \\lt  n$$$.<\/p><p>Recall that the cyclic shift of string $$$s$$$ by $$$k$$$ to the right is the string $$$s_{n-k+1} \\ldots s_n s_1 s_2 \\ldots s_{n-k}$$$. For example, the cyclic shift of the string \"<span class=\"tex-font-style-tt\">01011<\/span>\" by $$$0$$$ to the right is the string itself \"<span class=\"tex-font-style-tt\">01011<\/span>\", its cyclic shift by $$$3$$$ to the right is the string \"<span class=\"tex-font-style-tt\">01101<\/span>\".<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test consists of multiple test cases. The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 2 \\cdot 10^4$$$)\u00a0\u2014 the number of test cases. The description of test cases follows.<\/p><p>The first and the only line of each test case contains a single binary string $$$s$$$ ($$$1 \\le \\lvert s \\rvert \\le 2 \\cdot 10^5$$$), consisting of characters <span class=\"tex-font-style-tt\">0<\/span> and <span class=\"tex-font-style-tt\">1<\/span>.<\/p><p>It is guaranteed that the sum of string lengths $$$|s|$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer\u00a0\u2014 the maximum area of a rectangle consisting only of ones. If there is no such rectangle, output $$$0$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">0<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">101<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">011110<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">101010<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n1\n2\n6\n1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, there is a table $$$1 \\times 1$$$ consisting of a single character <span class=\"tex-font-style-tt\">0<\/span>, so there are no rectangles consisting of ones, and the answer is $$$0$$$.<\/p><p>In the second test case, there is a table $$$1 \\times 1$$$, consisting of a single character <span class=\"tex-font-style-tt\">1<\/span>, so the answer is $$$1$$$.<\/p><p>In the third test case, there is a table:<\/p><center> <table class=\"tex-tabular\"><tbody><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-bf\">1<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">0<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">1<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-bf\">1<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">1<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">0<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">0<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">1<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">1<\/td><\/tr><\/tbody><\/table> <\/center><p>In the fourth test case, there is a table:<\/p><center> <table class=\"tex-tabular\"><tbody><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">0<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-

xt-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">0<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">0<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">1<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">0<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">1<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">0<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">1<\/td><\/tr><\/tbody><\/table> <\/center><p>Rectangles with maximum area are shown in bold.<\/p><\/div><\/div>"}, {"contestId": 483, "index": "A", "name": "Counterexample ", "rating": 1100, "solvedCount": 25168, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. Counterexample <\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Your friend has recently learned about coprime numbers. A pair of numbers <span class=\"tex-span\">{<i>a<\/i>,\u2009<i>b<\/i>}<\/span> is called <span class=\"tex-font-style-it\">coprime<\/span> if the maximum number that divides both <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span> is equal to one. <\/p><p>Your friend often comes up with different statements. He has recently supposed that if the pair <span class=\"tex-span\">(<i>a<\/i>,\u2009<i>b<\/i>)<\/span> is coprime and the pair <span class=\"tex-span\">(<i>b<\/i>,\u2009<i>c<\/i>)<\/span> is coprime, then the pair <span class=\"tex-span\">(<i>a<\/i>,\u2009<i>c<\/i>)<\/span> is coprime. <\/p><p>You want to find a counterexample for your friend's statement. Therefore, your task is to find three distinct numbers <span class=\"tex-span\">(<i>a<\/i>,\u2009<i>b<\/i>,\u2009<i>c<\/i>)<\/span>, for which the statement is false, and the numbers meet the condition <span class=\"tex-span\"><i>l<\/i>\u2009\u2264\u2009<i>a<\/i>\u2009&lt;\u2009<i>b<\/i>\u2009&lt;\u2009<i>c<\/i>\u2009\u2264\u2009<i>r<\/i><\/span>. <\/p><p>More specifically, you need to find three numbers <span class=\"tex-span\">(<i>a<\/i>,\u2009<i>b<\/i>,\u2009<i>c<\/i>)<\/span>, such that <span class=\"tex-span\"><i>l<\/i>\u2009\u2264\u2009<i>a<\/i>\u2009&lt;\u2009<i>b<\/i>\u2009&lt;\u2009<i>c<\/i>\u2009\u2264\u2009<i>r<\/i><\/span>, pairs <span class=\"tex-span\">(<i>a<\/i>,\u2009<i>b<\/i>)<\/span> and <span class=\"tex-span\">(<i>b<\/i>,\u2009<i>c<\/i>)<\/span> are coprime, and pair <span class=\"tex-span\">(<i>a<\/i>,\u2009<i>c<\/i>)<\/span> is not coprime.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The single line contains two positive space-separated integers <span class=\"tex-span\"><i>l<\/i><\/span>, <span class=\"tex-span\"><i>r<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">18<\/sup><\/span>; <span class=\"tex-span\"><i>r<\/i>\u2009-\u2009<i>l<\/i>\u2009\u2264\u200950<\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print three positive space-separated integers <span class=\"tex-span\"><i>a<\/i><\/span>, <span class=\"tex-span\"><i>b<\/i><\/span>, <span class=\"tex-span\"><i>c<\/i><\/span>\u00a0\u2014 three distinct numbers <span class=\"tex-span\">(<i>a<\/i>,\u2009<i>b<\/i>,\u2009<i>c<\/i>)<\/span> that form the counterexample. If there are several solutions, you are allowed to print any of them. The numbers must be printed in ascending order. <\/p><p>If the counterexample does not exist, print the single number -1.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2 3 4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>10 11<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>-1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>900000000000000009 900000000000000029<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>900000000000000009 900000000000000010 900000000000000021<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample pair <span class=\"tex-span\">(2,\u20094)<\/span> is not coprime and pairs <span class=\"tex-span\">(2,\u20093)<\/span> and <span class=\"tex-span\">(3,\u20094)<\/span> are. <\/p><p>In the second sample you cannot form a group of three distinct integers, so the answer is -1. <\/p><p>In the third sample it is easy to see that numbers <span class=\"tex-span\">900000000000000009<\/span> and <span class=\"tex-span\">900000000000000021<\/span> are divisible by three. <\/p><\/div><\/div>"}, {"contestId": 1840, "index": "B", "name": "Binary Cafe", "rating": 1100, "solvedCount": 25111, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Binary Cafe<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Once upon a time, Toma found himself in a binary cafe. It is a very popular and unusual place.<\/p><p>The cafe offers visitors $$$k$$$ different delicious desserts. The desserts are numbered from $$$0$$$ to $$$k-1$$$. The cost of the $$$i$$$-th dessert is $$$2^i$$$ coins, because it is a binary cafe! Toma is willing to spend no more than $$$n$$$ coins on tasting desserts. At the same time, he is not interested in buying any dessert more than once, because one is enough to evaluate the taste.<\/p><p>In how many different ways can he buy several desserts <span class=\"tex-font-style-bf\">(possibly zero)<\/span> for tasting?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains a single integer $$$t$$$ ($$$1 \\le t \\le 1000$$$)\u00a0\u2014 the number of test cases.<\/p><p>Then follows $$$t$$$ lines, each of which describes one test case.<\/p><p>Each test case is given on a single line and consists of two integers $$$n$$$ and $$$k$$$ ($$$1 \\le n, k \\le 10^9$$$)\u00a0\u2014 the number of coins Toma is willing to spend and the number of desserts in the binary cafe.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output $$$t$$$ integers, the $$$i$$$-th of which should be equal to the answer for the $$$i$$$-th test case\u00a0\u2014 the number of ways to buy desserts for tasting.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">10 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">179 100<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n2\n3\n4\n180\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Variants for 1st sample: {}, {1}<\/p><p>Variants for 2nd sample: {}, {1}<\/p><p>Variants for 3rd sample: {}, {1}, {2}<\/p><p>Variants for 4th sample: {}, {1}, {2}, {1, 2}<\/p><\/div><\/div>"}, {"contestId": 1511, "index": "B", "name": "GCD Length", "rating": 1100, "solvedCount": 25037, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. GCD Length<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given three integers $$$a$$$, $$$b$$$ and $$$c$$$.<\/p><p>Find two positive integers $$$x$$$ and $$$y$$$ ($$$x  \\gt  0$$$, $$$y  \\gt  0$$$) such that: <\/p><ul> <li> the decimal representation of $$$x$$$ without leading zeroes consists of $$$a$$$ digits; <\/li><li> the decimal representation of $$$y$$$ without leading zeroes consists of $$$b$$$ digits; <\/li><li> the decimal representation of $$$gcd(x, y)$$$ without leading zeroes consists of $$$c$$$ digits. <\/li><\/ul><p>$$$gcd(x, y)$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Greatest_common_divisor\">greatest common divisor (GCD)<\/a> of integers $$$x$$$ and $$$y$$$.<\/p><p>Output $$$x$$$ and $$$y$$$. If there are multiple answers, output any of them.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 285$$$)\u00a0\u2014 the number of testcases.<\/p><p>Each of the next $$$t$$$ lines contains three integers $$$a$$$, $$$b$$$ and $$$c$$$ ($$$1 \\le a, b \\le 9$$$, $$$1 \\le c \\le min(a, b)$$$)\u00a0\u2014 the required lengths of the numbers.<\/p><p>It can be shown that the answer exists for all testcases under the given constraints.<\/p><p>Additional constraint on the input: all testcases are different.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each testcase print two positive integers\u00a0\u2014 $$$x$$$ and $$$y$$$ ($$$x  \\gt  0$$$, $$$y  \\gt  0$$$) such that <\/p><ul> <li> the decimal representation of $$$x$$$ without leading zeroes consists of $$$a$$$ digits; <\/li><li> the decimal representation of $$$y$$$ without leading zeroes consists of $$$b$$$ digits; <\/li><li> the decimal representation of $$$gcd(x, y)$$$ without leading zeroes consists of $$$c$$$ digits. <\/li><\/ul><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n2 3 1\n2 2 2\n6 6 2\n1 1 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n11 492\n13 26\n140133 160776\n1 1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the example: <\/p><ol> <li> $$$gcd(11, 492) = 1$$$ <\/li><li> $$$gcd(13, 26) = 13$$$ <\/li><li> $$$gcd(140133, 160776) = 21$$$ <\/li><li> $$$gcd(1, 1) = 1$$$ <\/li><\/ol><\/div><\/div>"}, {"contestId": 1857, "index": "B", "name": "Maximum Rounding", "rating": 1100, "solvedCount": 24999, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Maximum Rounding<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Given a natural number $$$x$$$. You can perform the following operation: <\/p><ul> <li> choose a positive integer $$$k$$$ and round $$$x$$$ to the $$$k$$$-th digit <\/li><\/ul><p>Note that the positions are numbered from right to left, starting from zero. If the number has $$$k$$$ digits, it is considered that the digit at the $$$k$$$-th position is equal to $$$0$$$.<\/p><p>The rounding is done as follows: <\/p><ul> <li> if the digit at the $$$(k-1)$$$-th position is greater than or equal to $$$5$$$, then the digit at the $$$k$$$-th position is increased by $$$1$$$, otherwise the digit at the $$$k$$$-th position remains unchanged (mathematical rounding is used).<p> <\/p><\/li><li> if before the operations the digit at the $$$k$$$-th position was $$$9$$$, and it should be increased by $$$1$$$, then we search for the least position $$$k'$$$ ($$$k' \\gt k$$$), where the digit at the $$$k'$$$-th position is less than $$$9$$$ and add $$$1$$$ to the digit at the $$$k'$$$-th position. Then we assign $$$k=k'$$$.<p> <\/p><\/li><li> after that, all digits which positions are less than $$$k$$$ are replaced with zeros.<\/li><\/ul><p>Your task is to make $$$x$$$ as large as possible, if you can perform the operation as many times as you want.<\/p><p>For example, if $$$x$$$ is equal to $$$3451$$$, then if you choose consecutively: <\/p><ul> <li> $$$k=1$$$, then after the operation $$$x$$$ will become $$$3450$$$ <\/li><li> $$$k=2$$$, then after the operation $$$x$$$ will become $$$3500$$$ <\/li><li> $$$k=3$$$, then after the operation $$$x$$$ will become $$$4000$$$ <\/li><li> $$$k=4$$$, then after the operation $$$x$$$ will become $$$0$$$ <\/li><\/ul> To maximize the answer, you need to choose $$$k=2$$$ first, and then $$$k=3$$$, then the number will become $$$4000$$$.<\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1\\le t\\le 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>Each test case consists of positive integer $$$x$$$ with a length of up to $$$2 \\cdot 10^5$$$. It is guaranteed that there are no leading zeros in the integer.<\/p><p>It is guaranteed that the sum of the lengths of all integers $$$x$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each set of input data, output the maximum possible value of $$$x$$$ after the operations. The number should not have leading zeros in its representation.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">99<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">913<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1980<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">20444<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">20445<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">60947<\/div><div class=\"test-example-line test-example-line-odd test-example-line-9\">419860<\/div><div class=\"test-example-line test-example-line-even test-example-line-10\">40862016542130810467<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n10\n100\n1000\n2000\n20444\n21000\n100000\n420000\n41000000000000000000\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample, it is better not to perform any operations.<\/p><p>In the second sample, you can perform one operation and obtain $$$10$$$.<\/p><p>In the third sample, you can choose $$$k=1$$$ or $$$k=2$$$. In both cases the answer will be $$$100$$$.<\/p><\/div><\/div>"}, {"contestId": 1557, "index": "B", "name": "Moamen and k-subarrays", "rating": 1100, "solvedCount": 24970, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Moamen and k-subarrays<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Moamen has an array of $$$n$$$ <span class=\"tex-font-style-bf\">distinct<\/span> integers. He wants to sort that array in non-decreasing order by doing the following operations in order <span class=\"tex-font-style-bf\">exactly once<\/span>:<\/p><ol> <li> Split the array into exactly $$$k$$$ non-empty subarrays such that each element belongs to exactly one subarray. <\/li><li> Reorder these subarrays arbitrary. <\/li><li> Merge the subarrays in their new order. <\/li><\/ol><p>A sequence $$$a$$$ is a subarray of a sequence $$$b$$$ if $$$a$$$ can be obtained from $$$b$$$ by deletion of several (possibly, zero or all) elements from the beginning and several (possibly, zero or all) elements from the end.<\/p><p>Can you tell Moamen if there is a way to sort the array in non-decreasing order using the operations written above?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^3$$$)\u00a0\u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le k \\le n \\le 10^5$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$0 \\le |a_i| \\le 10^9$$$). It is guaranteed that all numbers are <span class=\"tex-font-style-bf\">distinct<\/span>.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$3\\cdot10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, you should output a single string.<\/p><p>If Moamen can sort the array in non-decreasing order, output \"<span class=\"tex-font-style-tt\">YES<\/span>\" (without quotes). Otherwise, output \"<span class=\"tex-font-style-tt\">NO<\/span>\" (without quotes).<\/p><p>You can print each letter of \"<span class=\"tex-font-style-tt\">YES<\/span>\" and \"<span class=\"tex-font-style-tt\">NO<\/span>\" in any case (upper or lower).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n5 4\n6 3 4 2 1\n4 2\n1 -4 0 -2\n5 1\n1 2 3 4 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYes\nNo\nYes\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, $$$a = [6, 3, 4, 2, 1]$$$, and $$$k = 4$$$, so we can do the operations as follows: <\/p><ol> <li> Split $$$a$$$ into $$$\\{ [6], [3, 4], [2], [1] \\}$$$. <\/li><li> Reorder them: $$$\\{ [1], [2], [3,4], [6] \\}$$$. <\/li><li> Merge them: $$$[1, 2, 3, 4, 6]$$$, so now the array is sorted. <\/li><\/ol><p>In the second test case, there is no way to sort the array by splitting it into only $$$2$$$ subarrays.<\/p><p>As an example, if we split it into $$$\\{ [1, -4], [0, -2] \\}$$$, we can reorder them into $$$\\{ [1, -4], [0, -2] \\}$$$ or $$$\\{ [0, -2], [1, -4] \\}$$$. However, after merging the subarrays, it is impossible to get a sorted array.<\/p><\/div><\/div>"}, {"contestId": 1921, "index": "D", "name": "Very Different Array", "rating": 1100, "solvedCount": 24830, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Very Different Array<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Petya has an array $$$a_i$$$ of $$$n$$$ integers. His brother Vasya became envious and decided to make his own array of $$$n$$$ integers.<\/p><p>To do this, he found $$$m$$$ integers $$$b_i$$$ ($$$m\\ge n$$$), and now he wants to choose some $$$n$$$ integers of them and arrange them in a certain order to obtain an array $$$c_i$$$ of length $$$n$$$.<\/p><p>To avoid being similar to his brother, Vasya wants to make his array as different as possible from Petya's array. Specifically, he wants the total difference $$$D = \\sum_{i=1}^{n} |a_i - c_i|$$$ to be as large as possible.<\/p><p>Help Vasya find the maximum difference $$$D$$$ he can obtain.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test consists of multiple test cases. The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 100$$$) \u2014 the number of test cases. This is followed by a description of the test cases.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$m$$$ ($$$1\\le n\\le m\\le 2 \\cdot 10^5$$$).<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_i$$$ ($$$1\\le a_i\\le 10^9$$$). The third line of each test case contains $$$m$$$ integers $$$b_i$$$ ($$$1\\le b_i\\le 10^9$$$).<\/p><p>It is guaranteed that in a test, the sum of $$$m$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer \u2014 the maximum total difference $$$D$$$ that can be obtained.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">6 1 2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 5 1 7 2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 1 1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 3 4 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 3 4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">8 7 5 8 2 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">9 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">4 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">8 10 6 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">3 10 6 1 8 9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">3 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">6 5 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">1 7 9 7 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">5 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">9 10 6 3 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">5 9 2 3 9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-9\">1 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-9\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-9\">2 7 10 1 1 5<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n16\n0\n12\n11\n10\n23\n15\n25\n7\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, Vasya can, for example, create the array $$$(1, 5, 7, 2)$$$. Then the total difference will be $$$D = |6-1|+|1-5|+|2-7|+|4-2| = 5+4+5+2 = 16$$$.<\/p><p>In the second example, all the integers available to Vasya are equal to 1, so he can only create the array $$$(1, 1, 1)$$$, for which the difference $$$D = 0$$$.<\/p><p>In the third example, Vasya can, for example, create the array $$$(5, 4, 3, 2, 1)$$$. Then the total difference will be $$$D = |1-5|+|2-4|+|3-3|+|4-2|+|5-1| = 4+2+0+2+4 = 12$$$.<\/p><\/div><\/div>"}];
    let currentProblem = null;
    let editor = null;
    const STORAGE_KEY = `cf_ladder_done_1100`;
    let doneSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));

    // Retrieve the template securely from the hidden textarea
    const DEFAULT_TEMPLATE = document.getElementById('cpp-template').value.trim();

    function initEditor() {
        editor = ace.edit("editor");
        editor.setTheme("ace/theme/tomorrow_night_eighties");
        editor.session.setMode("ace/mode/c_cpp");
        editor.setFontSize(15);
        editor.setValue(DEFAULT_TEMPLATE, 1);
    }

    function renderSidebar() {
        const list = document.getElementById('problem-list');
        list.innerHTML = '';
        PROBLEMS.forEach((prob, idx) => {
            const div = document.createElement('div');
            div.className = `problem-item ${currentProblem === prob ? 'active' : ''}`;
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox'; checkbox.className = 'done-checkbox'; checkbox.checked = doneSet.has(prob.name);
            checkbox.onclick = (e) => { e.stopPropagation(); toggleDone(prob.name, checkbox.checked); };
            const title = document.createElement('div');
            title.innerHTML = `<span class="text-xs text-slate-500">#${idx + 1}</span> <span class="font-semibold text-slate-200">${prob.name}</span>`;
            div.appendChild(checkbox); div.appendChild(title); div.onclick = () => loadProblem(prob);
            list.appendChild(div);
        });
        updateProgress();
    }

    function toggleDone(name, isDone) {
        if(isDone) { doneSet.add(name); confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#4ade80', '#38bdf8'] }); } 
        else { doneSet.delete(name); }
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...doneSet]));
        updateProgress();
    }

    function updateProgress() { document.getElementById('progress-text').innerText = `${doneSet.size} / ${PROBLEMS.length} Solved`; }

    function loadProblem(prob) {
        currentProblem = prob; renderSidebar();
        document.getElementById('welcome-screen').style.display = 'none';
        const contentDiv = document.getElementById('problem-content');
        contentDiv.style.display = 'block'; contentDiv.innerHTML = prob.html;
        const titleEl = contentDiv.querySelector('.header .title');
        if(titleEl) {
            const originalText = titleEl.innerText;
            titleEl.innerHTML = `<a href="https://codeforces.com/contest/${prob.contestId}/problem/${prob.index}" target="_blank" title="Open in Codeforces">${originalText} 🔗</a>`;
        }
        contentDiv.querySelectorAll('.sample-tests .input pre').forEach(pre => {
            const btn = document.createElement('button'); btn.innerText = 'Copy'; btn.className = 'copy-btn';
            btn.onclick = () => { navigator.clipboard.writeText(pre.innerText); btn.innerText = 'Copied!'; btn.style.background = '#4ade80'; setTimeout(() => { btn.innerText = 'Copy'; btn.style.background = 'var(--neon-blue)'; }, 2000); };
            pre.parentElement.appendChild(btn);
        });
        if (window.MathJax) { MathJax.typesetPromise([contentDiv]); }
        editor.setValue(DEFAULT_TEMPLATE, 1);
    }

    function toggleSettings() {
        const modal = document.getElementById('settings-modal');
        if(modal.style.display === 'flex') { modal.style.display = 'none'; } 
        else { modal.style.display = 'flex'; document.getElementById('api-key').value = localStorage.getItem('cf_api_key') || ''; document.getElementById('api-secret').value = localStorage.getItem('cf_api_secret') || ''; }
    }

    function saveSettings() {
        localStorage.setItem('cf_api_key', document.getElementById('api-key').value);
        localStorage.setItem('cf_api_secret', document.getElementById('api-secret').value);
        toggleSettings(); alert('API Credentials Saved!');
    }

    async function sha512(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-512', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function submitCode() {
        if(!currentProblem) return alert('Select a problem first!');
        const apiKey = localStorage.getItem('cf_api_key'); const apiSecret = localStorage.getItem('cf_api_secret');
        if(!apiKey || !apiSecret) { alert('Please configure your API Key and Secret first.'); toggleSettings(); return; }
        const code = editor.getValue(); const time = Math.floor(Date.now() / 1000); const rand = Math.floor(Math.random() * 900000) + 100000;
        const params = { apiKey: apiKey, contestId: currentProblem.contestId.toString(), languageId: "54", problemIndex: currentProblem.index, source: code, time: time.toString() };
        const sortedKeys = Object.keys(params).sort();
        let paramString = sortedKeys.map(k => `${k}=${encodeURIComponent(params[k])}`).join('&');
        const sigPlain = `${rand}/problemset.submit?${paramString}#${apiSecret}`;
        const apiSig = `${rand}` + await sha512(sigPlain);
        try {
            const formData = new URLSearchParams();
            for (const key in params) formData.append(key, params[key]);
            formData.append("apiSig", apiSig);
            const res = await fetch("https://codeforces.com/api/problemset.submit", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: formData.toString() });
            const data = await res.json();
            if(data.status === 'OK') { alert('Code submitted successfully! 🎉 Check your Codeforces submissions.'); confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } }); } 
            else { alert('Submission failed: ' + data.comment); }
        } catch (err) { console.error(err); alert('Network error during submission.'); }
    }

    window.onload = () => { initEditor(); renderSidebar(); };
</script>

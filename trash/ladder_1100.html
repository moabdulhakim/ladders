ass=\"lower-index\">2<\/sub><\/span> <span class=\"tex-span\">(<i>n<\/i><sub class=\"lower-index\">2<\/sub>\u2009&gt;\u20090)<\/span> \u2014 the number of elements in the second set. Then print <span class=\"tex-span\"><i>n<\/i><sub class=\"lower-index\">2<\/sub><\/span> numbers \u2014 the elements that got to the second set.<\/p><p>In the next line print integer <span class=\"tex-span\"><i>n<\/i><sub class=\"lower-index\">3<\/sub><\/span> <span class=\"tex-span\">(<i>n<\/i><sub class=\"lower-index\">3<\/sub>\u2009&gt;\u20090)<\/span> \u2014 the number of elements in the third set. Then print <span class=\"tex-span\"><i>n<\/i><sub class=\"lower-index\">3<\/sub><\/span> numbers \u2014 the elements that got to the third set.<\/p><p>The printed sets must meet the described conditions. It is guaranteed that the solution exists. If there are several solutions, you are allowed to print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>-1 2 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1 -1<br/>1 2<br/>1 0<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>-1 -2 -3 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1 -1<br/>2 -3 -2<br/>1 0<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1829, "index": "E", "name": "The Lakes", "rating": 1100, "solvedCount": 28109, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. The Lakes<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an $$$n \\times m$$$ grid $$$a$$$ of non-negative integers. The value $$$a_{i,j}$$$ represents the depth of water at the $$$i$$$-th row and $$$j$$$-th column. <\/p><p>A lake is a set of cells such that:<\/p><ul> <li> each cell in the set has $$$a_{i,j}  \\gt  0$$$, and <\/li><li> there exists a path between any pair of cells in the lake by going up, down, left, or right a number of times and without stepping on a cell with $$$a_{i,j} = 0$$$. <\/li><\/ul><p>The volume of a lake is the sum of depths of all the cells in the lake.<\/p><p>Find the largest volume of a lake in the grid.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains two integers $$$n, m$$$ ($$$1 \\leq n, m \\leq 1000$$$)\u00a0\u2014 the number of rows and columns of the grid, respectively.<\/p><p>Then $$$n$$$ lines follow each with $$$m$$$ integers $$$a_{i,j}$$$ ($$$0 \\leq a_{i,j} \\leq 1000$$$)\u00a0\u2014 the depth of the water at each cell.<\/p><p>It is guaranteed that the sum of $$$n \\cdot m$$$ over all test cases does not exceed $$$10^6$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer\u00a0\u2014 the largest volume of a lake in the grid.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 4 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">0 0 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0 1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 0 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 1 1 1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 0 0 0 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 0 5 0 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 0 0 0 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 1 1 1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 1 1 1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 0 0 0 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 1 4 0 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 0 0 0 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 1 1 1 1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n10\n0\n7\n16\n21\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1800, "index": "C2", "name": "Powering the Hero (hard version)", "rating": 1100, "solvedCount": 28041, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C2. Powering the Hero (hard version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is a hard version of the problem. It differs from the easy one only by constraints on $$$n$$$ and $$$t$$$<\/span>.<\/p><p>There is a deck of $$$n$$$ cards, each of which is characterized by its power. There are two types of cards:<\/p><ul> <li> a hero card, the power of such a card is always equal to $$$0$$$; <\/li><li> a bonus card, the power of such a card is always positive. <\/li><\/ul><p>You can do the following with the deck:<\/p><ul> <li> take a card from the top of the deck; <\/li><li> if this card is a bonus card, you can put it <span class=\"tex-font-style-bf\">on top<\/span> of your bonus deck or discard; <\/li><li> if this card is a hero card, then the power of <span class=\"tex-font-style-bf\">the top<\/span> card from your bonus deck is added to his power (if it is not empty), after that the hero is added to your army, and the used bonus discards. <\/li><\/ul><p>Your task is to use such actions to gather an army with the maximum possible total power.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input data contains single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases in the test.<\/p><p>The first line of each test case contains one integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of cards in the deck.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$s_1, s_2, \\dots, s_n$$$ ($$$0 \\le s_i \\le 10^9$$$)\u00a0\u2014 card powers in top-down order.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output $$$t$$$ numbers, each of which is the answer to the corresponding test case \u2014 the maximum possible total power of the army that can be achieved.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 3 3 0 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">0 3 3 0 0 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 3 0 4 5 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">7<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 2 5 0 4 3 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3 1 0 0 4<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n6\n8\n9\n4\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample, you can take bonuses $$$1$$$ and $$$2$$$. Both hero cards will receive $$$3$$$ power. If you take all the bonuses, one of them will remain unused.<\/p><p>In the second sample, the hero's card on top of the deck cannot be powered up, and the rest can be powered up with $$$2$$$ and $$$3$$$ bonuses and get $$$6$$$ total power.<\/p><p>In the fourth sample, you can take bonuses $$$1$$$, $$$2$$$, $$$3$$$, $$$5$$$ and skip the bonus $$$6$$$, then the hero $$$4$$$ will be enhanced with a bonus $$$3$$$ by $$$5$$$, and the hero $$$7$$$ with a bonus $$$5$$$ by $$$4$$$. $$$4+5=9$$$.<\/p><\/div><\/div>"}, {"contestId": 1780, "index": "B", "name": "GCD Partition", "rating": 1100, "solvedCount": 28041, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. GCD Partition<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>While at Kira's house, Josuke saw a piece of paper on the table with a task written on it.<\/p><p>The task sounded as follows. There is an array $$$a$$$ of length $$$n$$$. On this array, do the following:<\/p><ul> <li> select an integer $$$k  \\gt  1$$$; <\/li><li> split the array into $$$k$$$ subsegments $$$^\\dagger$$$; <\/li><li> calculate the sum in each of $$$k$$$ subsegments and write these sums to another array $$$b$$$ (where the sum of the subsegment $$$(l, r)$$$ is $$${\\sum_{j = l}^{r}a_j}$$$); <\/li><li> the final score of such a split will be $$$\\gcd(b_1, b_2, \\ldots, b_k)^\\ddagger$$$. <\/li><\/ul><p>The task is to find such a partition that the score is <span class=\"tex-font-style-bf\">maximum possible<\/span>. Josuke is interested in this task but is not strong in computer science. Help him to find the maximum possible score.<\/p><p>$$$^\\dagger$$$ A division of an array into $$$k$$$ subsegments is $$$k$$$ pairs of numbers $$$(l_1, r_1), (l_2, r_2), \\ldots, (l_k, r_k)$$$ such that $$$l_i \\le r_i$$$ and for every $$$1 \\le j \\le k - 1$$$ $$$l_{j + 1} = r_j + 1$$$, also $$$l_1 = 1$$$ and $$$r_k = n$$$. These pairs represent the subsegments.<\/p><p>$$$^\\ddagger$$$ $$$\\gcd(b_1, b_2, \\ldots, b_k)$$$ stands for the <a href=\"https://en.wikipedia.org/wiki/Greatest_common_divisor\">greatest common divisor (GCD)<\/a> of the array $$$b$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single number $$$t$$$ ($$$1 \\le t \\le 10^4$$$) \u2014 the number of test cases.<\/p><p>For each test case, the first line contains one integer $$$n$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$) \u2014 the length of the array $$$a$$$.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, a_3, \\ldots, a_n$$$ ($$$1 \\le a_i \\le 10^9 $$$) \u2014 the array $$$a$$$ itself.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case print a single integer \u2014 the maximum score for the optimal partition.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 2 1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 2 1 1 1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">12 30 37 88 12 78 89 17 2 12<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">6<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">7 7 7 7 7 7<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n1\n5\n3\n1\n21\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, you can choose $$$k = 2$$$ and split the array into subsegments $$$(1, 2)$$$ and $$$(3, 4)$$$.<\/p><p>Then the score of such a partition will be equal to $$$\\gcd(a_1 + a_2, a_3 + a_4) = \\gcd(2 + 2, 1 + 3) = \\gcd(4, 4) = 4$$$.<\/p><p>In the fourth test case, you can choose $$$k = 3$$$ and split the array into subsegments $$$(1, 2), (3, 5), (6, 6)$$$.<\/p><p>The split score is $$$\\gcd(1 + 2, 1 + 1 + 1, 3) = 3$$$.<\/p><\/div><\/div>"}, {"contestId": 1842, "index": "B", "name": "Tenzing and Books", "rating": 1100, "solvedCount": 28035, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Tenzing and Books<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Tenzing received $$$3n$$$ books from his fans. The books are arranged in $$$3$$$ stacks with $$$n$$$ books in each stack. Each book has a non-negative integer difficulty rating.<\/p><p>Tenzing wants to read some (possibly zero) books. At first, his <span class=\"tex-font-style-it\">knowledge<\/span> is $$$0$$$.<\/p><p>To read the books, Tenzing will choose a non-empty stack, read the book on the top of the stack, and then discard the book. If Tenzing's knowledge is currently $$$u$$$, then his knowledge will become $$$u|v$$$ after reading a book with difficulty rating $$$v$$$. Here $$$|$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#OR\">bitwise OR operation<\/a>. Note that Tenzing can stop reading books whenever he wants.<\/p><p>Tenzing's favourite number is $$$x$$$. Can you help Tenzing check if it is possible for his knowledge to become $$$x$$$?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line of input contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases. The description of test cases follows.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$x$$$ ($$$1 \\leq n \\leq 10^5$$$, $$$0 \\leq x \\leq 10^9$$$)\u00a0\u2014 the number of books in each stack and Tenzing's favourite number.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1,a_2,\\ldots,a_n$$$ ($$$0 \\leq a_i \\leq 10^9$$$) \u00a0\u2014 the difficulty rating of the books in the first stack, from top to bottom.<\/p><p>The third line of each test case contains $$$n$$$ integers $$$b_1,b_2,\\ldots,b_n$$$ ($$$0 \\leq b_i \\leq 10^9$$$) \u00a0\u2014 the difficulty rating of the books in the second stack, from top to bottom.<\/p><p>The fourth line of each test case contains $$$n$$$ integers $$$c_1,c_2,\\ldots,c_n$$$ ($$$0 \\leq c_i \\leq 10^9$$$) \u00a0\u2014 the difficulty rating of the books in the third stack, from top to bottom.<\/p><p>It is guaranteed that the sum of $$$n$$$ does not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output \"<span class=\"tex-font-style-tt\">Yes<\/span>\" (without quotes) if Tenzing can make his knowledge equal to $$$x$$$, and \"<span class=\"tex-font-style-tt\">No<\/span>\" (without quotes) otherwise.<\/p><p>You can output the answer in any case (upper or lower). For example, the strings \"<span class=\"tex-font-style-tt\">yEs<\/span>\", \"<span class=\"tex-font-style-tt\">yes<\/span>\", \"<span class=\"tex-font-style-tt\">Yes<\/span>\", and \"<span class=\"tex-font-style-tt\">YES<\/span>\" will be recognized as positive responses.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 3 4 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 4 3 2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 3 5 7 9<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 2 3 4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 4 3 2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 3 5 7 9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 2 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYes\nNo\nYes\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first test case, Tenzing can read the following $$$4$$$ books: <\/p><ul> <li> read the book with difficulty rating $$$1$$$ on the top of the first stack. Tenzing's knowledge changes to $$$0|1=1$$$. <\/li><li> read the book with difficulty rating $$$1$$$ on the top of the third stack. Tenzing's knowledge changes to $$$1|1=1$$$. <\/li><li> read the book with difficulty rating $$$2$$$ on the top of the first stack. Tenzing's knowledge changes to $$$1|2=3$$$. <\/li><li> read the book with difficulty rating $$$5$$$ on the top of the second stack. Tenzing's knowledge changes to $$$3|5=7$$$. <\/li><\/ul><p>After reading all books, Tenzing's knowledge is $$$7$$$.<\/p><p>For the third test case, Tenzing can read $$$0$$$ books to make his final knowledge equals to $$$0$$$.<\/p><\/div><\/div>"}, {"contestId": 630, "index": "C", "name": "Lucky Numbers", "rating": 1100, "solvedCount": 27979, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Lucky Numbers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>0.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>64 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>The numbers of all offices in the new building of the Tax Office of IT City will have lucky numbers.<\/p><p>Lucky number is a number that consists of digits <span class=\"tex-span\">7<\/span> and <span class=\"tex-span\">8<\/span> only. Find the maximum number of offices in the new building of the Tax Office given that a door-plate can hold a number not longer than <span class=\"tex-span\"><i>n<\/i><\/span> digits.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line of input contains one integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200955<\/span>) \u2014 the maximum length of a number that a door-plate can hold.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output one integer \u2014 the maximum number of offices, than can have unique lucky numbers not longer than <span class=\"tex-span\"><i>n<\/i><\/span> digits.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 2050, "index": "B", "name": "Transfusion", "rating": 1100, "solvedCount": 27916, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Transfusion<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ of length $$$n$$$. In one operation, you can pick an index $$$i$$$ from $$$2$$$ to $$$n-1$$$ inclusive, and do one of the following actions:<\/p><ul> <li> Decrease $$$a_{i-1}$$$ by $$$1$$$, then increase $$$a_{i+1}$$$ by $$$1$$$.<p> <\/p><\/li><li> Decrease $$$a_{i+1}$$$ by $$$1$$$, then increase $$$a_{i-1}$$$ by $$$1$$$. <\/li><\/ul><p>After each operation, all the values must be non-negative. Can you make all the elements equal after any number of operations?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>First line of input consists of one integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$) \u00a0\u2014 the number of test cases.<\/p><p>First line of each test case consists of one integer $$$n$$$ ($$$3 \\le n \\le 2\\cdot 10^5$$$).<\/p><p>Second line of each test case consists of $$$n$$$ integers $$$a_i$$$ ($$$1 \\le a_i \\le 10^9$$$).<\/p><p>It is guaranteed that the sum of $$$n$$$ of all test cases doesn't exceed $$$2\\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print \"<span class=\"tex-font-style-tt\">YES<\/span>\" without quotation marks if it is possible to make all the elements equal after any number of operations; otherwise, print \"<span class=\"tex-font-style-tt\">NO<\/span>\" without quotation marks.<\/p><p>You can print answers in any register: \"<span class=\"tex-font-style-tt\">yes<\/span>\", \"<span class=\"tex-font-style-tt\">YeS<\/span>\", \"<span class=\"tex-font-style-tt\">nO<\/span>\" \u00a0\u2014 will also be considered correct.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 5 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 6 6 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">6 2 1 4 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">1 4 2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">3 1 2 1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">2 4 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nNO\nYES\nNO\nYES\nNO\nNO\nNO\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1334, "index": "B", "name": "Middle Class", "rating": 1100, "solvedCount": 27903, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Middle Class<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Many years ago Berland was a small country where only $$$n$$$ people lived. Each person had some savings: the $$$i$$$-th one had $$$a_i$$$ burles.<\/p><p>The government considered a person as wealthy if he had at least $$$x$$$ burles. To increase the number of wealthy people Berland decided to carry out several reforms. Each reform looked like that: <\/p><ul> <li> the government chooses some subset of people (maybe all of them); <\/li><li> the government takes all savings from the chosen people and redistributes the savings among the chosen people equally. <\/li><\/ul><p>For example, consider the savings as list $$$[5, 1, 2, 1]$$$: if the government chose the $$$1$$$-st and the $$$3$$$-rd persons then it, at first, will take all $$$5 + 2 = 7$$$ burles and after that will return $$$3.5$$$ burles to the chosen people. As a result, the savings will become $$$[3.5, 1, 3.5, 1]$$$.<\/p><p>A lot of data was lost from that time, so we don't know how many reforms were implemented and to whom. All we can do is ask you to calculate the maximum possible number of wealthy people after several (maybe zero) reforms.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains single integer $$$T$$$ ($$$1 \\le T \\le 1000$$$) \u2014 the number of test cases.<\/p><p>Next $$$2T$$$ lines contain the test cases \u2014 two lines per test case. The first line contains two integers $$$n$$$ and $$$x$$$ ($$$1 \\le n \\le 10^5$$$, $$$1 \\le x \\le 10^9$$$) \u2014 the number of people and the minimum amount of money to be considered as wealthy.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$) \u2014 the initial savings of each person.<\/p><p>It's guaranteed that the total sum of $$$n$$$ doesn't exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$T$$$ integers \u2014 one per test case. For each test case print the maximum possible number of wealthy people after several (maybe zero) reforms.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n4 3\n5 1 2 1\n4 10\n11 9 11 9\n2 5\n4 3\n3 7\n9 4 9\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n4\n0\n3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The first test case is described in the statement.<\/p><p>In the second test case, the government, for example, could carry out two reforms: $$$[\\underline{11}, \\underline{9}, 11, 9] \\rightarrow [10, 10, \\underline{11}, \\underline{9}] \\rightarrow [10, 10, 10, 10]$$$.<\/p><p>In the third test case, the government couldn't make even one person wealthy.<\/p><p>In the fourth test case, the government could choose all people to carry out a reform: $$$[\\underline{9}, \\underline{4}, \\underline{9}] \\rightarrow [7\\frac{1}{3}, 7\\frac{1}{3}, 7\\frac{1}{3}]$$$.<\/p><\/div><\/div>"}, {"contestId": 2004, "index": "C", "name": "Splitting Items", "rating": 1100, "solvedCount": 27651, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Splitting Items<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Alice and Bob have $$$n$$$ items they'd like to split between them, so they decided to play a game. All items have a cost, and the $$$i$$$-th item costs $$$a_i$$$. Players move in turns starting from Alice.<\/p><p>In each turn, the player chooses one of the remaining items and takes it. The game goes on until no items are left.<\/p><p>Let's say that $$$A$$$ is the total cost of items taken by Alice and $$$B$$$ is the total cost of Bob's items. The resulting <span class=\"tex-font-style-it\">score<\/span> of the game then will be equal to $$$A - B$$$.<\/p><p>Alice wants to maximize the score, while Bob wants to minimize it. Both Alice and Bob will play optimally.<\/p><p>But the game will take place tomorrow, so today Bob can modify the costs a little. He can increase the costs $$$a_i$$$ of several (possibly none or all) items by an integer value (possibly, by the same value or by different values for each item). However, the total increase must be less than or equal to $$$k$$$. Otherwise, Alice may suspect something. Note that Bob <span class=\"tex-font-style-bf\">can't decrease<\/span> costs, only increase.<\/p><p>What is the minimum possible score Bob can achieve?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 5000$$$)\u00a0\u2014 the number of test cases. Then $$$t$$$ cases follow.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$k$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$; $$$0 \\le k \\le 10^9$$$)\u00a0\u2014 the number of items and the maximum total increase Bob can make.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$)\u00a0\u2014 the initial costs of the items.<\/p><p>It's guaranteed that the sum of $$$n$$$ over all test cases doesn't exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print a single integer\u00a0\u2014 the minimum possible score $$$A - B$$$ after Bob increases the costs of several (possibly none or all) items.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">10 15 12<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 1 2 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 9<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n13\n0\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, Bob can increase $$$a_1$$$ by $$$5$$$, making costs equal to $$$[6, 10]$$$. Tomorrow, Alice will take $$$10$$$ and Bob will take $$$6$$$. The total score will be equal to $$$10 - 6 = 4$$$, and it's the minimum possible.<\/p><p>In the second test case, Bob can't change costs. So the score will be equal to $$$(15 + 10) - 12 = 13$$$, since Alice will take $$$15$$$, Bob will take $$$12$$$, and Alice\u00a0\u2014 $$$10$$$.<\/p><p>In the third test case, Bob, for example, can increase $$$a_1$$$ by $$$1$$$, $$$a_2$$$ by $$$3$$$, and $$$a_3$$$ by $$$2$$$. The total change is equal to $$$1 + 3 + 2 \\le 6$$$ and costs will be equal to $$$[4, 4, 4, 4]$$$. Obviously, the score will be equal to $$$(4 + 4) - (4 + 4) = 0$$$.<\/p><p>In the fourth test case, Bob can increase $$$a_1$$$ by $$$3$$$, making costs equal to $$$[9, 9]$$$. The score will be equal to $$$9 - 9 = 0$$$.<\/p><\/div><\/div>"}, {"contestId": 478, "index": "A", "name": "Initial Bet", "rating": 1100, "solvedCount": 27442, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. Initial Bet<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>There are five people playing a game called \"Generosity\". Each person gives some non-zero number of coins <span class=\"tex-span\"><i>b<\/i><\/span> as an initial bet. After all players make their bets of <span class=\"tex-span\"><i>b<\/i><\/span> coins, the following operation is repeated for several times: a coin is passed from one player to some other player.<\/p><p>Your task is to write a program that can, given the number of coins each player has at the end of the game, determine the size <span class=\"tex-span\"><i>b<\/i><\/span> of the initial bet or find out that such outcome of the game cannot be obtained for any positive number of coins <span class=\"tex-span\"><i>b<\/i><\/span> in the initial bet.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The input consists of a single line containing five integers <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\">2<\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\">3<\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\">4<\/sub><\/span> and <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\">5<\/sub><\/span> \u2014 the number of coins that the first, second, third, fourth and fifth players respectively have at the end of the game (<span class=\"tex-span\">0\u2009\u2264\u2009<i>c<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\">2<\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\">3<\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\">4<\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\">5<\/sub>\u2009\u2264\u2009100<\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the only line containing a single positive integer <span class=\"tex-span\"><i>b<\/i><\/span> \u2014 the number of coins in the initial bet of each player. If there is no such value of <span class=\"tex-span\"><i>b<\/i><\/span>, then print the only value \"<span class=\"tex-font-style-tt\">-1<\/span>\" (quotes for clarity).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 5 4 0 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 5 9 2 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>-1<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample the following sequence of operations is possible:<\/p><ol> <li> One coin is passed from the fourth player to the second player; <\/li><li> One coin is passed from the fourth player to the fifth player; <\/li><li> One coin is passed from the first player to the third player; <\/li><li> One coin is passed from the fourth player to the second player. <\/li><\/ol><\/div><\/div>"}, {"contestId": 1624, "index": "C", "name": "Division by Two and Permutation", "rating": 1100, "solvedCount": 27218, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Division by Two and Permutation<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ consisting of $$$n$$$ positive integers. You can perform operations on it.<\/p><p>In one operation you can replace any element of the array $$$a_i$$$ with $$$\\lfloor \\frac{a_i}{2} \\rfloor$$$, that is, by an integer part of dividing $$$a_i$$$ by $$$2$$$ (rounding down).<\/p><p>See if you can apply the operation some number of times (possible $$$0$$$) to make the array $$$a$$$ become a permutation of numbers from $$$1$$$ to $$$n$$$\u00a0\u2014that is, so that it contains all numbers from $$$1$$$ to $$$n$$$, each exactly once.<\/p><p>For example, if $$$a = [1, 8, 25, 2]$$$, $$$n = 4$$$, then the answer is yes. You could do the following:<\/p><ol> <li> Replace $$$8$$$ with $$$\\lfloor \\frac{8}{2} \\rfloor = 4$$$, then $$$a = [1, 4, 25, 2]$$$. <\/li><li> Replace $$$25$$$ with $$$\\lfloor \\frac{25}{2} \\rfloor = 12$$$, then $$$a = [1, 4, 12, 2]$$$. <\/li><li> Replace $$$12$$$ with $$$\\lfloor \\frac{12}{2} \\rfloor = 6$$$, then $$$a = [1, 4, 6, 2]$$$. <\/li><li> Replace $$$6$$$ with $$$\\lfloor \\frac{6}{2} \\rfloor = 3$$$, then $$$a = [1, 4, 3, 2]$$$. <\/li><\/ol><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input data contains an integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014the number of test cases.<\/p><p>Each test case contains exactly two lines. The first one contains an integer $$$n$$$ ($$$1 \\le n \\le 50$$$), the second one contains integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output on a separate line:<\/p><ul> <li> <span class=\"tex-font-style-tt\">YES<\/span> if you can make the array $$$a$$$ become a permutation of numbers from $$$1$$$ to $$$n$$$, <\/li><li> <span class=\"tex-font-style-tt\">NO<\/span> otherwise. <\/li><\/ul><p>You can output <span class=\"tex-font-style-tt\">YES<\/span> and <span class=\"tex-font-style-tt\">NO<\/span> in any case (for example, strings <span class=\"tex-font-style-tt\">yEs<\/span>, <span class=\"tex-font-style-tt\">yes<\/span>, <span class=\"tex-font-style-tt\">Yes<\/span> and <span class=\"tex-font-style-tt\">YES<\/span> will be recognized as a positive response).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 8 25 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">9 8 3 4 2 7 1 5 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">8 2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">24 7 16 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">22 6 22 4 22<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nNO\nYES\nNO\nNO\nYES\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The first test case is explained in the text of the problem statement.<\/p><p>In the second test case, it is not possible to get a permutation.<\/p><\/div><\/div>"}, {"contestId": 535, "index": "B", "name": "Tavas and SaDDas", "rating": 1100, "solvedCount": 27212, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Tavas and SaDDas<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-underline\">Once again Tavas started eating coffee mix without water! Keione told him that it smells awful, but he didn't stop doing that. That's why Keione told his smart friend, SaDDas to punish him! SaDDas took Tavas' headphones and told him: \"If you solve the following problem, I'll return it to you.\"<\/span><\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/c8938635797853264a1bb0d364b3d5366a109b56.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>The problem is: <\/p><p>You are given a <span class=\"tex-font-style-it\">lucky number<\/span> <span class=\"tex-span\"><i>n<\/i><\/span>. <span class=\"tex-font-style-it\">Lucky numbers<\/span> are the positive integers whose decimal representations contain only the lucky digits 4 and 7. For example, numbers <span class=\"tex-font-style-bf\">47<\/span>, <span class=\"tex-font-style-bf\">744<\/span>, <span class=\"tex-font-style-bf\">4<\/span> are lucky and <span class=\"tex-font-style-bf\">5<\/span>, <span class=\"tex-font-style-bf\">17<\/span>, <span class=\"tex-font-style-bf\">467<\/span> are not.<\/p><p>If we sort all lucky numbers in increasing order, what's the 1-based index of <span class=\"tex-span\"><i>n<\/i><\/span>? <\/p><p>Tavas is not as smart as SaDDas, so he asked you to do him a favor and solve this problem so he can have his headphones back.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first and only line of input contains a lucky number <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the index of <span class=\"tex-span\"><i>n<\/i><\/span> among all lucky numbers.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>7<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>77<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 2126, "index": "C", "name": "I Will Definitely Make It", "rating": 1100, "solvedCount": 27124, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. I Will Definitely Make It<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given $$$n$$$ towers, numbered from $$$1$$$ to $$$n$$$. Tower $$$i$$$ has a height of $$$h_i$$$. At time $$$0$$$, you are on the tower with index $$$k$$$, and the current water level is $$$1$$$.<\/p><p>Every second, the water level rises by $$$1$$$ unit. At any moment, if the water level becomes <span class=\"tex-font-style-bf\">strictly greater<\/span> than the height of the tower you are on, you perish.<\/p><p>You have a magical ability: at moment $$$x$$$, you can start teleporting from tower $$$i$$$ to tower $$$j$$$, which will take $$$\\lvert h_i - h_j \\rvert$$$ seconds. That is, until moment $$$x + \\lvert h_i - h_j \\rvert$$$, you will be on tower $$$i$$$, and at moment $$$x + \\lvert h_i - h_j \\rvert$$$, you will move to tower $$$j$$$. You can start a new teleportation at the same moment you just arrived at tower $$$j$$$.<\/p><p>For example, if $$$n=k=4$$$, $$$h=[4, 4, 4, 2]$$$, then if you start teleporting from tower $$$4$$$ to tower $$$1$$$ at moment $$$0$$$, the movement will look as follows: <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/93a9fcf710028ea862e93a2ab50ac2f9ba42b212.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>Note that if the height of tower $$$1$$$ were $$$5$$$, you would not be able to teleport to it immediately, as you would be submerged at moment $$$2$$$.<\/p><p>Your goal is to reach any tower with the maximum height before the water covers you.<\/p><p>Determine if this is possible.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test consists of several test cases. The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$) \u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le k \\le n \\le 10^5$$$) \u2014 the number of towers and the index of the tower you are initially on.<\/p><p>The second line contains $$$n$$$ integers $$$h_1, h_2, \\dots, h_n$$$ ($$$1 \\le h_i \\le 10^9$$$) \u2014 the heights of the towers.<\/p><p>It is guaranteed that the sum of all $$$n$$$ across all test cases does not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output one line: \"<span class=\"tex-font-style-tt\">YES<\/span>\", if you can reach the tower with the maximum height before the water covers you, or \"<span class=\"tex-font-style-tt\">NO<\/span>\" otherwise.<\/p><p>You may output each letter in any case (lowercase or uppercase). For example, the strings \"<span class=\"tex-font-style-tt\">yEs<\/span>\", \"<span class=\"tex-font-style-tt\">yes<\/span>\", \"<span class=\"tex-font-style-tt\">Yes<\/span>\", and \"<span class=\"tex-font-style-tt\">YES<\/span>\" will be accepted as a positive answer.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 2 1 4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 3 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 4 4 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 3 6 9 1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 2 5 6<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nNO\nYES\nYES\nNO\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the only possible path is: $$$3 \\rightarrow 2 \\rightarrow 1 \\rightarrow 4 \\rightarrow 5$$$.<\/p><p>In the second test case, regardless of the order, it will not be possible to reach the tallest tower.<\/p><p>In the third test case, one of the possible paths is: $$$4 \\rightarrow 1$$$.<\/p><\/div><\/div>"}, {"contestId": 1722, "index": "D", "name": "Line", "rating": 1100, "solvedCount": 27084, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Line<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are $$$n$$$ people in a horizontal line, each looking either to the left or the right. Each person counts the number of people in the direction they are looking. The <span class=\"tex-font-style-bf\">value<\/span> of the line is the sum of each person's count.<\/p><p>For example, in the arrangement <span class=\"tex-font-style-tt\">LRRLL<\/span>, where <span class=\"tex-font-style-tt\">L<\/span> stands for a person looking left and <span class=\"tex-font-style-tt\">R<\/span> stands for a person looking right, the counts for each person are $$$[0, 3, 2, 3, 4]$$$, and the value is $$$0+3+2+3+4=12$$$.<\/p><p>You are given the initial arrangement of people in the line. For each $$$k$$$ from $$$1$$$ to $$$n$$$, determine the maximum value of the line if you can change the direction of <span class=\"tex-font-style-bf\">at most<\/span> $$$k$$$ people.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The input consists of multiple test cases. The first line contains an integer $$$t$$$ ($$$1 \\leq t \\leq 100$$$)\u00a0\u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains an integer $$$n$$$ ($$$1 \\leq n \\leq 2\\cdot10^5$$$)\u00a0\u2014 the length of the line.<\/p><p>The following line contains a string consisting of $$$n$$$ characters, each of which is either <span class=\"tex-font-style-tt\">L<\/span> or <span class=\"tex-font-style-tt\">R<\/span>, representing a person facing left or right, respectively\u00a0\u2014 the description of the line.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2\\cdot10^5$$$.<\/p><p>Please note that the answer for some test cases won't fit into 32-bit integer type, so you should use at least 64-bit integer type in your programming language (like <span class=\"tex-font-style-tt\">long long<\/span> for C++).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output $$$n$$$ space-separated non-negative integers\u00a0\u2014 the maximum value of the line if you can change the direction of <span class=\"tex-font-style-bf\">at most<\/span> $$$k$$$ people for each $$$k$$$ from $$$1$$$ to $$$n$$$, inclusive.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">LLR<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">LRRLL<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">L<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">12<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">LRRRLLLRLLRL<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">LLLLLRRRRR<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">9<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">LRLRLRLRL<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3 5 5 \n16 16 16 16 16 \n0 \n86 95 98 101 102 102 102 102 102 102 102 102 \n29 38 45 52 57 62 65 68 69 70 \n44 50 54 56 56 56 56 56 56 \n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case: <\/p><ul> <li> $$$k=1$$$: change the direction of $$$1$$$ person to make the line <span class=\"tex-font-style-tt\">RLR<\/span>. The total value is $$$2+1+0=3$$$. <\/li><li> $$$k=2$$$: change the direction of $$$2$$$ people to make the line <span class=\"tex-font-style-tt\">RLL<\/span>. The total value is $$$2+1+2=5$$$. <\/li><li> $$$k=3$$$: change the direction of $$$2$$$ people to make the line <span class=\"tex-font-style-tt\">RLL<\/span>. The total value is $$$2+1+2=5$$$. Note that you have to change the direction of <span class=\"tex-font-style-bf\">at most<\/span> $$$k$$$ people. <\/li><\/ul><p>In the second test case, it is optimal to only change the direction of the first person for all $$$k$$$ from $$$1$$$ to $$$5$$$ (that is, make the line <span class=\"tex-font-style-tt\">RRRLL<\/span>).<\/p><\/div><\/div>"}, {"contestId": 258, "index": "A", "name": "Little Elephant and Bits", "rating": 1100, "solvedCount": 27016, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. Little Elephant and Bits<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>The Little Elephant has an integer <span class=\"tex-span\"><i>a<\/i><\/span>, written in the binary notation. He wants to write this number on a piece of paper.<\/p><p>To make sure that the number <span class=\"tex-span\"><i>a<\/i><\/span> fits on the piece of paper, the Little Elephant <span class=\"tex-font-style-bf\">ought<\/span> to delete exactly one any digit from number <span class=\"tex-span\"><i>a<\/i><\/span> in the binary record. At that a new number appears. It consists of the remaining binary digits, written in the corresponding order (possible, with leading zeroes).<\/p><p>The Little Elephant wants the number he is going to write on the paper to be as large as possible. Help him find the maximum number that he can obtain after deleting exactly one binary digit and print it in the binary notation.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The single line contains integer <span class=\"tex-span\"><i>a<\/i><\/span>, written in the binary notation without leading zeroes. This number contains more than <span class=\"tex-span\">1<\/span> and at most <span class=\"tex-span\">10<sup class=\"upper-index\">5<\/sup><\/span> digits.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In the single line print the number that is written without leading zeroes in the binary notation \u2014 the answer to the problem.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>101<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>11<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>110010<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>11010<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample the best strategy is to delete the second digit. That results in number <span class=\"tex-span\">11<sub class=\"lower-index\">2<\/sub>\u2009=\u20093<sub class=\"lower-index\">10<\/sub><\/span>.<\/p><p>In the second sample the best strategy is to delete the third or fourth digits \u2014 that results in number <span class=\"tex-span\">11010<sub class=\"lower-index\">2<\/sub>\u2009=\u200926<sub class=\"lower-index\">10<\/sub><\/span>.<\/p><\/div><\/div>"}, {"contestId": 1993, "index": "B", "name": "Parity and Sum", "rating": 1100, "solvedCount": 27008, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Parity and Sum<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Given an array $$$a$$$ of $$$n$$$ positive integers.<\/p><p>In one operation, you can pick any pair of indexes $$$(i, j)$$$ such that $$$a_i$$$ and $$$a_j$$$ have <span class=\"tex-font-style-bf\">distinct<\/span> parity, then replace the smaller one with the sum of them. More formally: <\/p><ul> <li> If $$$a_i  \\lt  a_j$$$, replace $$$a_i$$$ with $$$a_i + a_j$$$; <\/li><li> Otherwise, replace $$$a_j$$$ with $$$a_i + a_j$$$. <\/li><\/ul><p>Find the minimum number of operations needed to make all elements of the array have the same parity.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$)\u00a0\u2014 the elements of array $$$a$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer\u00a0\u2014 the minimum number of operations required.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 3 5 7 9<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 4 4 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 2 2 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4 3 6 1 2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">6<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">3 6 1 2 1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">999999996 999999997 999999998 999999999 1000000000<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n0\n2\n4\n3\n3\n3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, all integers already have the same parity. Therefore, no operation is needed.<\/p><p>In the third test case, we can perform two operations $$$(1, 2)$$$ and $$$(1, 3)$$$. The array $$$a$$$ transforms as follows: $$$a = [\\color{red}2, \\color{red}3, 4] \\longrightarrow [\\color{red}5, 3, \\color{red}4] \\longrightarrow [5, 3, 9]$$$.<\/p><p>In the fourth test case, an example of an optimal sequence of operations is $$$(1, 2)$$$, $$$(1, 3)$$$, $$$(1, 4)$$$, and $$$(1, 4)$$$. The array $$$a$$$ transforms as follows: $$$a = [\\color{red}3, \\color{red}2, 2, 8] \\longrightarrow [\\color{red}3, 5, \\color{red}2, 8] \\longrightarrow [\\color{red}3, 5, 5, \\color{red}8] \\longrightarrow [\\color{red}{11}, 5, 5, \\color{red}8] \\longrightarrow [11, 5, 5, 19]$$$.<\/p><\/div><\/div>"}, {"contestId": 1797, "index": "B", "name": "Li Hua and Pattern", "rating": 1100, "solvedCount": 26913, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Li Hua and Pattern<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Li Hua has a pattern of size $$$n\\times n$$$, each cell is either blue or red. He can perform <span class=\"tex-font-style-bf\">exactly $$$k$$$<\/span> operations. In each operation, he chooses a cell and changes its color from red to blue or from blue to red. Each cell can be chosen as many times as he wants. Is it possible to make the pattern, that matches its rotation by $$$180^{\\circ}$$$?<\/p><p>Suppose you were Li Hua, please solve this problem.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains the single integer $$$t$$$ ($$$1 \\le t \\le 100$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains two integers $$$n,k$$$ ($$$1\\le n\\le 10^3,0\\le k \\le 10^9$$$)\u00a0\u2014 the size of the pattern and the number of operations.<\/p><p>Each of next $$$n$$$ lines contains $$$n$$$ integers $$$a_{i,j}$$$ ($$$a_{i,j}\\in\\{0,1\\}$$$)\u00a0\u2014 the initial color of the cell, $$$0$$$ for blue and $$$1$$$ for red.<\/p><p>It's guaranteed that sum of $$$n$$$ over all test cases does not exceed $$$10^3$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each set of input, print \"<span class=\"tex-font-style-tt\">YES<\/span>\" if it's possible to make the pattern, that matches its rotation by $$$180^{\\circ}$$$ after applying exactly $$$k$$$ of operations, and \"<span class=\"tex-font-style-tt\">NO<\/span>\" otherwise.<\/p><p>You can output the answer in any case (upper or lower). For example, the strings \"<span class=\"tex-font-style-tt\">yEs<\/span>\", \"<span class=\"tex-font-style-tt\">yes<\/span>\", \"<span class=\"tex-font-style-tt\">Yes<\/span>\", and \"<span class=\"tex-font-style-tt\">YES<\/span>\" will be recognized as positive responses.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1 1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">0 0 0 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 0 1 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1 1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 0 1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 0 0 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">0 1 0 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 1 0 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0 0 0 0 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0 1 1 1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0 1 0 0 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 1 1 1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0 0 0 0 0<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nNO\nYES\nYES\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In test case 1, you can't perform any operation. The pattern after rotation is on the right.<\/p><center> <table class=\"tex-tabular\"><tbody><tr><td class=\"tex-tabular-text-align-center\"><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/b8a55c515207bed5306d82b17215dbfce2a9773f.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/td><td class=\"tex-tabular-text-align-center\"><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/8f25ab2894f53023ecee6b5bc3355d2b7bba3400.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/td><\/tr><\/tbody><\/table> <\/center><p>In test case 2, you can perform operations on $$$(2,1),(3,2),(3,4)$$$. The pattern after operations is in the middle and the pattern after rotation is on the right.<\/p><center> <table class=\"tex-tabular\"><tbody><tr><td class=\"tex-tabular-text-align-center\"><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/f59c8b4dcbbf8282e40b1b67615dee69326736ef.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/td><td class=\"tex-tabular-text-align-center\"><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/75b6edd5a439107b28411153d96abf4bd59ded7a.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/td><td><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/75b6edd5a439107b28411153d96abf4bd59ded7a.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/td><\/tr><\/tbody><\/table> <\/center><\/div><\/div>"}, {"contestId": 1872, "index": "C", "name": "Non-coprime Split", "rating": 1100, "solvedCount": 26905, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Non-coprime Split<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given two integers $$$l \\le r$$$. You need to find <span class=\"tex-font-style-bf\">positive<\/span> integers $$$a$$$ and $$$b$$$ such that the following conditions are simultaneously satisfied:<\/p><ul><li> $$$l \\le a + b \\le r$$$<\/li><li> $$$\\gcd(a, b) \\neq 1$$$<\/li><\/ul><p>or report that they do not exist.<\/p><p>$$$\\gcd(a, b)$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Greatest_common_divisor\">greatest common divisor<\/a> of numbers $$$a$$$ and $$$b$$$. For example, $$$\\gcd(6, 9) = 3$$$, $$$\\gcd(8, 9) = 1$$$, $$$\\gcd(4, 2) = 2$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains an integer $$$t$$$ ($$$1 \\le t \\le 500$$$)\u00a0\u2014 the number of test cases.<\/p><p>Then the descriptions of the test cases follow.<\/p><p>The only line of the description of each test case contains $$$2$$$ integers $$$l, r$$$ ($$$1 \\le l \\le r \\le 10^7$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output the integers $$$a, b$$$ that satisfy all the conditions on a separate line. If there is no answer, instead output a single number $$$-1$$$.<\/p><p>If there are multiple answers, you can output any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">11<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">11 15<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">18 19<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">41 43<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">777 777<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">8000000 10000000<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">2000 2023<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">1791791 1791791<\/div><div class=\"test-example-line test-example-line-odd test-example-line-9\">1 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-10\">2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-11\">9840769 9840769<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6 9\n-1\n14 4\n36 6\n111 666\n4000000 5000000 \n2009 7\n-1\n2 2\n-1\n6274 9834495<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, $$$11 \\le 6 + 9 \\le 15$$$, $$$\\gcd(6, 9) = 3$$$, and all conditions are satisfied. Note that this is not the only possible answer, for example, $$$\\{4, 10\\}, \\{5, 10\\}, \\{6, 6\\}$$$ are also valid answers for this test case.<\/p><p>In the second test case, the only pairs $$$\\{a, b\\}$$$ that satisfy the condition $$$1 \\le a + b \\le 3$$$ are $$$\\{1, 1\\}, \\{1, 2\\}, \\{2, 1\\}$$$, but in each of these pairs $$$\\gcd(a, b)$$$ equals $$$1$$$, so there is no answer.<\/p><p>In the third sample test, $$$\\gcd(14, 4) = 2$$$.<\/p><\/div><\/div>"}, {"contestId": 1950, "index": "D", "name": "Product of Binary Decimals", "rating": 1100, "solvedCount": 26885, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Product of Binary Decimals<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Let's call a number a <span class=\"tex-font-style-it\">binary decimal<\/span> if it is a positive integer and all digits in its decimal notation are either $$$0$$$ or $$$1$$$. For example, $$$1\\,010\\,111$$$ is a binary decimal, while $$$10\\,201$$$ and $$$787\\,788$$$ are not.<\/p><p>Given a number $$$n$$$, you are asked whether or not it is possible to represent $$$n$$$ as a product of some (not necessarily distinct) binary decimals.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 5 \\cdot 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The only line of each test case contains a single integer $$$n$$$ ($$$1 \\leq n \\leq 10^5$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output \"<span class=\"tex-font-style-tt\">YES<\/span>\" (without quotes) if $$$n$$$ can be represented as a product of binary decimals, and \"<span class=\"tex-font-style-tt\">NO<\/span>\" (without quotes) otherwise.<\/p><p>You can output \"<span class=\"tex-font-style-tt\">YES<\/span>\" and \"<span class=\"tex-font-style-tt\">NO<\/span>\" in any case (for example, strings \"<span class=\"tex-font-style-tt\">yES<\/span>\", \"<span class=\"tex-font-style-tt\">yes<\/span>\", and \"<span class=\"tex-font-style-tt\">Yes<\/span>\" will be recognized as a positive response).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">11<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">121<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">14641<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">12221<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">10110<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">100000<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">99<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">112<\/div><div class=\"test-example-line test-example-line-odd test-example-line-9\">2024<\/div><div class=\"test-example-line test-example-line-even test-example-line-10\">12421<\/div><div class=\"test-example-line test-example-line-odd test-example-line-11\">1001<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nYES\nYES\nYES\nYES\nYES\nNO\nNO\nNO\nNO\nYES\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The first five test cases can be represented as a product of binary decimals as follows: <\/p><ul> <li> $$$121 = 11 \\times 11$$$. <\/li><li> $$$1 = 1$$$ is already a binary decimal. <\/li><li> $$$14\\,641 = 11 \\times 11 \\times 11 \\times 11$$$. <\/li><li> $$$12\\,221 = 11 \\times 11 \\times 101$$$. <\/li><li> $$$10\\,110 = 10\\,110$$$ is already a binary decimal. <\/li><\/ul><\/div><\/div>"}, {"contestId": 2060, "index": "D", "name": "Subtract Min Sort", "rating": 1100, "solvedCount": 26849, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Subtract Min Sort<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a sequence $$$a$$$ consisting of $$$n$$$ positive integers.<\/p><p>You can perform the following operation any number of times.<\/p><ul> <li> Select an index $$$i$$$ ($$$1 \\le i  \\lt  n$$$), and subtract $$$\\min(a_i,a_{i+1})$$$ from both $$$a_i$$$ and $$$a_{i+1}$$$. <\/li><\/ul><p>Determine if it is possible to make the sequence <span class=\"tex-font-style-bf\">non-decreasing<\/span> by using the operation any number of times.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$2 \\le n \\le 2 \\cdot 10^

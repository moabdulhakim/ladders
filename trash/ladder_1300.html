tyle-tt\">000<\/span>\" $$$\\to$$$ \"<span class=\"tex-font-style-tt\">001<\/span>\". The cost is $$$1 + 1 = 2$$$.<\/p><p>The other optimal solution is to swap bits and indices $$$1$$$ and $$$3$$$, the string $$$a$$$ changes then \"<span class=\"tex-font-style-tt\">100<\/span>\" $$$\\to$$$ \"<span class=\"tex-font-style-tt\">001<\/span>\", the cost is also $$$|1 - 3| = 2$$$.<\/p><p>In the second example, the optimal solution is to swap bits at indices $$$2$$$ and $$$3$$$, the string $$$a$$$ changes as \"<span class=\"tex-font-style-tt\">0101<\/span>\" $$$\\to$$$ \"<span class=\"tex-font-style-tt\">0011<\/span>\". The cost is $$$|2 - 3| = 1$$$.<\/p><\/div><\/div>"}, {"contestId": 1433, "index": "E", "name": "Two Round Dances", "rating": 1300, "solvedCount": 20143, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Two Round Dances<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>One day, $$$n$$$ people ($$$n$$$ is an even number) met on a plaza and made two round dances, each round dance consists of exactly $$$\\frac{n}{2}$$$ people. Your task is to find the number of ways $$$n$$$ people can make two round dances if each round dance consists of exactly $$$\\frac{n}{2}$$$ people. Each person should belong to exactly one of these two round dances.<\/p><p>Round dance is a dance circle consisting of $$$1$$$ or more people. Two round dances are indistinguishable (equal) if one can be transformed to another by choosing the first participant. For example, round dances $$$[1, 3, 4, 2]$$$, $$$[4, 2, 1, 3]$$$ and $$$[2, 1, 3, 4]$$$ are indistinguishable.<\/p><p>For example, if $$$n=2$$$ then the number of ways is $$$1$$$: one round dance consists of the first person and the second one of the second person.<\/p><p>For example, if $$$n=4$$$ then the number of ways is $$$3$$$. Possible options:<\/p><ul> <li> one round dance \u2014 $$$[1,2]$$$, another \u2014 $$$[3,4]$$$; <\/li><li> one round dance \u2014 $$$[2,4]$$$, another \u2014 $$$[3,1]$$$; <\/li><li> one round dance \u2014 $$$[4,1]$$$, another \u2014 $$$[3,2]$$$. <\/li><\/ul><p>Your task is to find the number of ways $$$n$$$ people can make two round dances if each round dance consists of exactly $$$\\frac{n}{2}$$$ people.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The input contains one integer $$$n$$$ ($$$2 \\le n \\le 20$$$), $$$n$$$ is an even number.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the number of ways to make two round dances. It is guaranteed that the answer fits in the $$$64$$$-bit integer data type.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>8<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1260<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>20<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>12164510040883200<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1698, "index": "C", "name": "3SUM Closure", "rating": 1300, "solvedCount": 19991, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. 3SUM Closure<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ of length $$$n$$$. The array is called <span class=\"tex-font-style-it\">3SUM-closed<\/span> if for all distinct indices $$$i$$$, $$$j$$$, $$$k$$$, the sum $$$a_i + a_j + a_k$$$ is an element of the array. More formally, $$$a$$$ is 3SUM-closed if for all integers $$$1 \\leq i  \\lt  j  \\lt  k \\leq n$$$, there exists some integer $$$1 \\leq l \\leq n$$$ such that $$$a_i + a_j + a_k = a_l$$$.<\/p><p>Determine if $$$a$$$ is 3SUM-closed.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$t$$$ ($$$1 \\leq t \\leq 1000$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains an integer $$$n$$$ ($$$3 \\leq n \\leq 2 \\cdot 10^5$$$)\u00a0\u2014 the length of the array.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$-10^9 \\leq a_i \\leq 10^9$$$)\u00a0\u2014 the elements of the array.<\/p><p>It is guaranteed that the sum of $$$n$$$ across all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output \"<span class=\"tex-font-style-tt\">YES<\/span>\" (without quotes) if $$$a$$$ is 3SUM-closed and \"<span class=\"tex-font-style-tt\">NO<\/span>\" (without quotes) otherwise.<\/p><p>You can output \"<span class=\"tex-font-style-tt\">YES<\/span>\" and \"<span class=\"tex-font-style-tt\">NO<\/span>\" in any case (for example, strings \"<span class=\"tex-font-style-tt\">yEs<\/span>\", \"<span class=\"tex-font-style-tt\">yes<\/span>\" and \"<span class=\"tex-font-style-tt\">Yes<\/span>\" will be recognized as a positive response).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">-1 0 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 -2 -2 1 -3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0 0 0 0 0 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">-1 2 -3 4<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nNO\nYES\nNO\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, there is only one triple where $$$i=1$$$, $$$j=2$$$, $$$k=3$$$. In this case, $$$a_1 + a_2 + a_3 = 0$$$, which is an element of the array ($$$a_2 = 0$$$), so the array is 3SUM-closed.<\/p><p>In the second test case, $$$a_1 + a_4 + a_5 = -1$$$, which is not an element of the array. Therefore, the array is not 3SUM-closed.<\/p><p>In the third test case, $$$a_i + a_j + a_k = 0$$$ for all distinct $$$i$$$, $$$j$$$, $$$k$$$, and $$$0$$$ is an element of the array, so the array is 3SUM-closed.<\/p><\/div><\/div>"}, {"contestId": 96, "index": "B", "name": "Lucky Numbers (easy)", "rating": 1300, "solvedCount": 19872, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Lucky Numbers (easy)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Petya loves lucky numbers. Everybody knows that positive integers are <span class=\"tex-font-style-underline\">lucky<\/span> if their decimal representation doesn't contain digits other than <span class=\"tex-span\">4<\/span> and <span class=\"tex-span\">7<\/span>. For example, numbers <span class=\"tex-span\">47<\/span>, <span class=\"tex-span\">744<\/span>, <span class=\"tex-span\">4<\/span> are lucky and <span class=\"tex-span\">5<\/span>, <span class=\"tex-span\">17<\/span>, <span class=\"tex-span\">467<\/span> are not.<\/p><p>Lucky number is <span class=\"tex-font-style-underline\">super lucky<\/span> if it's decimal representation contains equal amount of digits <span class=\"tex-span\">4<\/span> and <span class=\"tex-span\">7<\/span>. For example, numbers <span class=\"tex-span\">47<\/span>, <span class=\"tex-span\">7744<\/span>, <span class=\"tex-span\">474477<\/span> are super lucky and <span class=\"tex-span\">4<\/span>, <span class=\"tex-span\">744<\/span>, <span class=\"tex-span\">467<\/span> are not.<\/p><p>One day Petya came across a positive integer <span class=\"tex-span\"><i>n<\/i><\/span>. Help him to find the least super lucky number which is not less than <span class=\"tex-span\"><i>n<\/i><\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line contains a positive integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>). This number doesn't have leading zeroes.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output the least super lucky number that is more than or equal to <span class=\"tex-span\"><i>n<\/i><\/span>.<\/p><p>Please, do not use the %lld specificator to read or write 64-bit integers in C++. It is preferred to use the cin, cout streams or the %I64d specificator.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4500<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4747<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>47<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>47<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 330, "index": "B", "name": "Road Construction", "rating": 1300, "solvedCount": 19848, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Road Construction<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>A country has <span class=\"tex-span\"><i>n<\/i><\/span> cities. Initially, there is no road in the country. One day, the king decides to construct some roads connecting pairs of cities. Roads can be traversed either way. He wants those roads to be constructed in such a way that it is possible to go from each city to any other city by traversing at most two roads. You are also given <span class=\"tex-span\"><i>m<\/i><\/span> pairs of cities \u2014 roads cannot be constructed between these pairs of cities.<\/p><p>Your task is to construct the minimum number of roads that still satisfy the above conditions. The constraints will guarantee that this is always possible.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line consists of two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/94f406a06721e89d57a14b6dfade59c6341e93e8.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>.<\/p><p>Then <span class=\"tex-span\"><i>m<\/i><\/span> lines follow, each consisting of two integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2260\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>), which means that it is not possible to construct a road connecting cities <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. Consider the cities are numbered from 1 to <span class=\"tex-span\"><i>n<\/i><\/span>.<\/p><p>It is guaranteed that every pair of cities will appear at most once in the input.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>You should print an integer <span class=\"tex-span\"><i>s<\/i><\/span>: the minimum number of roads that should be constructed, in the first line. Then <span class=\"tex-span\"><i>s<\/i><\/span> lines should follow, each consisting of two integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>,\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2260\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>), which means that a road should be constructed between cities <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>.<\/p><p>If there are several solutions, you may print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 1<br/>1 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/>1 2<br/>4 2<br/>2 3<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>This is one possible solution of the example: <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/733d8c3eb9daddddea01eb45bc5e9f432c31ee45.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>These are examples of wrong solutions:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/1f6a6f67a98ba7144b22a4396f530c0512ce6083.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center> The above solution is wrong because it doesn't use the minimum number of edges (<span class=\"tex-span\">4<\/span> vs <span class=\"tex-span\">3<\/span>). In addition, it also tries to construct a road between cities <span class=\"tex-span\">1<\/span> and <span class=\"tex-span\">3<\/span>, while the input specifies that it is not allowed to construct a road between the pair.<center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/1682a2451ec68ed1d2f2fe67485812eff63d2055.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center> The above solution is wrong because you need to traverse at least <span class=\"tex-span\">3<\/span> roads to go from city <span class=\"tex-span\">1<\/span> to city <span class=\"tex-span\">3<\/span>, whereas in your country it must be possible to go from any city to another by traversing at most <span class=\"tex-span\">2<\/span> roads.<center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/95923f7b5de3838c63610bd3b9015403913cbad7.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center> Finally, the above solution is wrong because it must be possible to go from any city to another, whereas it is not possible in this country to go from city <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\">3<\/span>, <span class=\"tex-span\">2<\/span> to <span class=\"tex-span\">3<\/span>, and <span class=\"tex-span\">4<\/span> to <span class=\"tex-span\">3<\/span>.<\/div><\/div>"}, {"contestId": 1788, "index": "C", "name": "Matching Numbers", "rating": 1300, "solvedCount": 19754, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Matching Numbers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an integer $$$n$$$. Pair the integers $$$1$$$ to $$$2n$$$ (i.e. each integer should be in exactly one pair) so that each sum of matched pairs is consecutive and distinct. <\/p><p>Formally, let $$$(a_i, b_i)$$$ be the pairs that you matched. $$$\\{a_1, b_1, a_2, b_2, \\ldots, a_n, b_n\\}$$$ should be a permutation of $$$\\{1, 2, \\ldots, 2n\\}$$$. Let the sorted list of $$$\\{a_1+b_1, a_2+b_2, \\ldots, a_n+b_n\\}$$$ be $$$s_1  \\lt  s_2  \\lt  \\ldots  \\lt  s_n$$$. We must have $$$s_{i+1}-s_i = 1$$$ for $$$1 \\le i \\le n - 1$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 500$$$). The description of the test cases follows.<\/p><p>For each test case, a single integer $$$n$$$ ($$$1 \\leq n \\leq 10^5$$$) is given.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases doesn't exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, if it is impossible to make such a pairing, print \"<span class=\"tex-font-style-tt\">No<\/span>\".<\/p><p>Otherwise, print \"<span class=\"tex-font-style-tt\">Yes<\/span>\" followed by $$$n$$$ lines.<\/p><p>At each line, print two integers that are paired.<\/p><p>You can output the answer in any case (upper or lower). For example, the strings \"<span class=\"tex-font-style-tt\">yEs<\/span>\", \"<span class=\"tex-font-style-tt\">yes<\/span>\", \"<span class=\"tex-font-style-tt\">Yes<\/span>\", and \"<span class=\"tex-font-style-tt\">YES<\/span>\" will be recognized as positive responses.<\/p><p>If there are multiple solutions, print any.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n1\n2\n3\n4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYes\n1 2\nNo\nYes\n1 6\n3 5\n4 2\nNo\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the third test case, each integer from $$$1$$$ to $$$6$$$ appears once. The sums of matched pairs are $$$4+2=6$$$, $$$1+6=7$$$, and $$$3+5=8$$$, which are consecutive and distinct.<\/p><\/div><\/div>"}, {"contestId": 1560, "index": "D", "name": "Make a Power of Two", "rating": 1300, "solvedCount": 19679, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Make a Power of Two<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an integer $$$n$$$. In $$$1$$$ move, you can do one of the following actions:<\/p><ul> <li> erase any digit of the number (it's acceptable that the number before the operation has exactly one digit and after the operation, it is \"empty\"); <\/li><li> add one digit <span class=\"tex-font-style-bf\">to the right<\/span>. <\/li><\/ul><p>The actions may be performed in any order any number of times.<\/p><p>Note that if, after deleting some digit from a number, it will contain leading zeroes, they will <span class=\"tex-font-style-bf\">not<\/span> be deleted. E.g. if you delete from the number $$$301$$$ the digit $$$3$$$, the result is the number $$$01$$$ (not $$$1$$$).<\/p><p>You need to perform the <span class=\"tex-font-style-bf\">minimum<\/span> number of actions to make the number any power of $$$2$$$ (i.e. there's an integer $$$k$$$ ($$$k \\ge 0$$$) such that the resulting number is equal to $$$2^k$$$). <span class=\"tex-font-style-bf\">The resulting number must not have leading zeroes<\/span>.<\/p><p>E.g. consider $$$n=1052$$$. The answer is equal to $$$2$$$. First, let's add to the right one digit $$$4$$$ (the result will be $$$10524$$$). Then let's erase the digit $$$5$$$, so the result will be $$$1024$$$ which is a power of $$$2$$$.<\/p><p>E.g. consider $$$n=8888$$$. The answer is equal to $$$3$$$. Let's erase any of the digits $$$8$$$ three times. The result will be $$$8$$$ which is a power of $$$2$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$) \u2014 the number of test cases. Then $$$t$$$ test cases follow.<\/p><p>Each test case consists of one line containing one integer $$$n$$$ ($$$1 \\le n \\le 10^9$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output in a separate line one integer $$$m$$$ \u2014 the minimum number of moves to transform the number into any power of $$$2$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n12\n1052\n8888\n6\n75\n128\n1\n301\n12048\n1504\n6656\n1000000000\n687194767\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n3\n1\n3\n0\n0\n2\n1\n3\n4\n9\n2\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The answer for the first test case was considered above.<\/p><p>The answer for the second test case was considered above.<\/p><p>In the third test case, it's enough to add to the right the digit $$$4$$$ \u2014 the number $$$6$$$ will turn into $$$64$$$.<\/p><p>In the fourth test case, let's add to the right the digit $$$8$$$ and then erase $$$7$$$ and $$$5$$$ \u2014 the taken number will turn into $$$8$$$.<\/p><p>The numbers of the fifth and the sixth test cases are already powers of two so there's no need to make any move.<\/p><p>In the seventh test case, you can delete first of all the digit $$$3$$$ (the result is $$$01$$$) and then the digit $$$0$$$ (the result is $$$1$$$).<\/p><\/div><\/div>"}, {"contestId": 2050, "index": "D", "name": "Digital string maximization", "rating": 1300, "solvedCount": 19625, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Digital string maximization<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a string $$$s$$$, consisting of digits from $$$0$$$ to $$$9$$$. In one operation, you can pick any digit in this string, except for $$$0$$$ or the leftmost digit, decrease it by $$$1$$$, and then swap it with the digit left to the picked.<\/p><p>For example, in one operation from the string $$$1023$$$, you can get $$$1103$$$ or $$$1022$$$.<\/p><p>Find the lexicographically maximum string you can obtain after any number of operations.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input consists of an integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$) \u00a0\u2014 the number of test cases.<\/p><p>Each test case consists of a single line consisting of a digital string $$$s$$$ ($$$1 \\le |s| \\le 2\\cdot 10^5$$$), where $$$|s|$$$ denotes the length of $$$s$$$. The string does not contain leading zeroes.<\/p><p>It is guaranteed that the sum of $$$|s|$$$ of all test cases doesn't exceed $$$2\\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print the answer on a separate line.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">19<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1709<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">11555<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">51476<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">9876543210<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">5891917899<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n81\n6710\n33311\n55431\n9876543210\n7875567711\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, the following sequence of operations is suitable: $$$19 \\rightarrow 81$$$.<\/p><p>In the second example, the following sequence of operations is suitable: $$$1709 \\rightarrow 1780 \\rightarrow 6180 \\rightarrow 6710$$$.<\/p><p>In the fourth example, the following sequence of operations is suitable: $$$51476 \\rightarrow 53176 \\rightarrow 53616 \\rightarrow 53651 \\rightarrow 55351 \\rightarrow 55431$$$.<\/p><\/div><\/div>"}, {"contestId": 2025, "index": "C", "name": "New Game", "rating": 1300, "solvedCount": 19623, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. New Game<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There's a new game Monocarp wants to play. The game uses a deck of $$$n$$$ cards, where the $$$i$$$-th card has exactly one integer $$$a_i$$$ written on it.<\/p><p>At the beginning of the game, on the first turn, Monocarp can take any card from the deck. During each subsequent turn, Monocarp can take exactly one card that has either the same number as on the card taken on the previous turn or a number that is one greater than the number on the card taken on the previous turn.<\/p><p>In other words, if on the previous turn Monocarp took a card with the number $$$x$$$, then on the current turn he can take either a card with the number $$$x$$$ or a card with the number $$$x + 1$$$. Monocarp can take any card which meets that condition, regardless of its position in the deck.<\/p><p>After Monocarp takes a card on the current turn, it is removed from the deck.<\/p><p>According to the rules of the game, the number of distinct numbers written on the cards that Monocarp has taken must not exceed $$$k$$$.<\/p><p>If, after a turn, Monocarp cannot take a card without violating the described rules, the game ends.<\/p><p>Your task is to determine the maximum number of cards that Monocarp can take from the deck during the game, given that on the first turn he can take any card from the deck.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le k \\le n \\le 200\\,000$$$)\u00a0\u2014 the number of cards in the deck and the maximum number of distinct numbers that can be written on the cards that Monocarp takes.<\/p><p>The second line contains a sequence of integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^{9}$$$), where $$$a_i$$$ is the number written on the $$$i$$$-th card.<\/p><p>Additional constraint of the input: the sum of $$$n$$$ over all test cases doesn't exceed $$$200\\,000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print the maximum number of cards that Monocarp can take from the deck during the game, given that on the first turn he can take any card from the deck.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">10 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 2 4 3 4 3 4 5 3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">10 11 10 11 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">9 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 5 4 4 6 5 4 4 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 3 1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n3\n9\n2\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, Monocarp needs to take any of the cards with the number $$$3$$$. On the next two turns, he needs to take the two remaining cards with the number $$$3$$$. On the next three turns, he needs to take three cards with the number $$$4$$$. After that, Monocarp will not be able to take any more cards from the deck, and he will have $$$6$$$ cards.<\/p><\/div><\/div>"}, {"contestId": 1373, "index": "C", "name": "Pluses and Minuses", "rating": 1300, "solvedCount": 19569, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Pluses and Minuses<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a string $$$s$$$ consisting only of characters <span class=\"tex-font-style-tt\">+<\/span> and <span class=\"tex-font-style-tt\">-<\/span>. You perform some process with this string. This process can be described by the following pseudocode: <\/p><pre class=\"lstlisting\"><code class=\"prettyprint\">res = 0<br/>for init = 0 to inf<br/>    cur = init<br/>    ok = true<br/>    for i = 1 to |s|<br/>        res = res + 1<br/>        if s[i] == '+'<br/>            cur = cur + 1<br/>        else<br/>            cur = cur - 1<br/>        if cur &lt; 0<br/>            ok = false<br/>            break<br/>    if ok<br/>        break<br/><\/code><\/pre><p>Note that the $$$inf$$$ denotes infinity, and the characters of the string are numbered from $$$1$$$ to $$$|s|$$$.<\/p><p>You have to calculate the value of the $$$res$$$ after the process ends.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 1000$$$) \u2014 the number of test cases.<\/p><p>The only lines of each test case contains string $$$s$$$ ($$$1 \\le |s| \\le 10^6$$$) consisting only of characters <span class=\"tex-font-style-tt\">+<\/span> and <span class=\"tex-font-style-tt\">-<\/span>.<\/p><p>It's guaranteed that sum of $$$|s|$$$ over all test cases doesn't exceed $$$10^6$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case print one integer \u2014 the value of the $$$res$$$ after the process ends.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n--+-\n---\n++--+-\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n7\n9\n6\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 486, "index": "B", "name": "OR in Matrix", "rating": 1300, "solvedCount": 19466, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. OR in Matrix<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Let's define logical <span class=\"tex-span\"><i>OR<\/i><\/span> as an operation on two logical values (i. e. values that belong to the set <span class=\"tex-span\">{0,\u20091}<\/span>) that is equal to <span class=\"tex-span\">1<\/span> if either or both of the logical values is set to <span class=\"tex-span\">1<\/span>, otherwise it is <span class=\"tex-span\">0<\/span>. We can define logical <span class=\"tex-span\"><i>OR<\/i><\/span> of three or more logical values in the same manner:<\/p><p><img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/661f67f4b56b351d145dce2e9a87cd7c5f6a4d64.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> where <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/7bcdd7440cc300269a3395fa037d5af6351c3221.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> is equal to <span class=\"tex-span\">1<\/span> if some <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009=\u20091<\/span>, otherwise it is equal to <span class=\"tex-span\">0<\/span>.<\/p><p>Nam has a matrix <span class=\"tex-span\"><i>A<\/i><\/span> consisting of <span class=\"tex-span\"><i>m<\/i><\/span> rows and <span class=\"tex-span\"><i>n<\/i><\/span> columns. The rows are numbered from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>m<\/i><\/span>, columns are numbered from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span>. Element at row <span class=\"tex-span\"><i>i<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>m<\/i><\/span>) and column <span class=\"tex-span\"><i>j<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>j<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>) is denoted as <span class=\"tex-span\"><i>A<\/i><sub class=\"lower-index\"><i>ij<\/i><\/sub><\/span>. All elements of <span class=\"tex-span\"><i>A<\/i><\/span> are either 0 or 1. From matrix <span class=\"tex-span\"><i>A<\/i><\/span>, Nam creates another matrix <span class=\"tex-span\"><i>B<\/i><\/span> of the same size using formula:<\/p><p><img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/4332dfa4828fa3b9679abe53387834c43c801689.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>.<\/p><p>(<span class=\"tex-span\"><i>B<\/i><sub class=\"lower-index\"><i>ij<\/i><\/sub><\/span> is <span class=\"tex-span\"><i>OR<\/i><\/span> of all elements in row <span class=\"tex-span\"><i>i<\/i><\/span> and column <span class=\"tex-span\"><i>j<\/i><\/span> of matrix <span class=\"tex-span\"><i>A<\/i><\/span>)<\/p><p>Nam gives you matrix <span class=\"tex-span\"><i>B<\/i><\/span> and challenges you to guess matrix <span class=\"tex-span\"><i>A<\/i><\/span>. Although Nam is smart, he could probably make a mistake while calculating matrix <span class=\"tex-span\"><i>B<\/i><\/span>, since size of <span class=\"tex-span\"><i>A<\/i><\/span> can be large.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integer <span class=\"tex-span\"><i>m<\/i><\/span> and <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>m<\/i>,\u2009<i>n<\/i>\u2009\u2264\u2009100<\/span>), number of rows and number of columns of matrices respectively.<\/p><p>The next <span class=\"tex-span\"><i>m<\/i><\/span> lines each contain <span class=\"tex-span\"><i>n<\/i><\/span> integers separated by spaces describing rows of matrix <span class=\"tex-span\"><i>B<\/i><\/span> (each element of <span class=\"tex-span\"><i>B<\/i><\/span> is either <span class=\"tex-span\">0<\/span> or <span class=\"tex-span\">1<\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In the first line, print \"<span class=\"tex-font-style-tt\">NO<\/span>\" if Nam has made a mistake when calculating <span class=\"tex-span\"><i>B<\/i><\/span>, otherwise print \"<span class=\"tex-font-style-tt\">YES<\/span>\". If the first line is \"<span class=\"tex-font-style-tt\">YES<\/span>\", then also print <span class=\"tex-span\"><i>m<\/i><\/span> rows consisting of <span class=\"tex-span\"><i>n<\/i><\/span> integers representing matrix <span class=\"tex-span\"><i>A<\/i><\/span> that can produce given matrix <span class=\"tex-span\"><i>B<\/i><\/span>. If there are several solutions print any one.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 2<br/>1 0<br/>0 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>NO<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 3<br/>1 1 1<br/>1 1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/>1 1 1<br/>1 1 1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 3<br/>0 1 0<br/>1 1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/>0 0 0<br/>0 1 0<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 2075, "index": "B", "name": "Array Recoloring", "rating": 1300, "solvedCount": 19453, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Array Recoloring<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an integer array $$$a$$$ of size $$$n$$$. Initially, all elements of the array are colored red.<\/p><p>You have to choose exactly $$$k$$$ elements of the array and paint them blue. Then, while there is at least one red element, you have to select any red element with a blue neighbor and make it blue.<\/p><p>The cost of painting the array is defined as the sum of the first $$$k$$$ chosen elements and the last painted element. <\/p><p>Your task is to calculate the maximum possible cost of painting for the given array. <\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^3$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$k$$$ ($$$2 \\le n \\le 5000$$$; $$$1 \\le k  \\lt  n$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$).<\/p><p>Additional constraint on the input: the sum of $$$n$$$ over all test cases doesn't exceed $$$5000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print a single integer\u00a0\u2014 the maximum possible cost of painting for the given array. <\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 2 3 1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 2 2 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5\n10\n8\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, you can initially color the $$$2$$$-nd element, and then color the elements in the order $$$1, 3$$$. Then the cost of painting is equal to $$$2+3=5$$$.<\/p><p>In the second example, you can initially color the elements $$$1$$$ and $$$5$$$, and then color the elements in the order $$$2, 4, 3$$$. Then the cost of painting is equal to $$$4+3+3=10$$$.<\/p><p>In the third example, you can initially color the elements $$$2, 3, 4$$$, and then color the $$$1$$$-st element. Then the cost of painting is equal to $$$2+2+2+2=8$$$.<\/p><\/div><\/div>"}, {"contestId": 2065, "index": "C2", "name": "Skibidus and Fanum Tax (hard version)", "rating": 1300, "solvedCount": 19426, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C2. Skibidus and Fanum Tax (hard version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is the hard version of the problem. In this version, $$$m \\leq 2\\cdot 10^5$$$.<\/span><\/p><p>Skibidus has obtained two arrays $$$a$$$ and $$$b$$$, containing $$$n$$$ and $$$m$$$ elements respectively. For <span class=\"tex-font-style-bf\">each<\/span> integer $$$i$$$ from $$$1$$$ to $$$n$$$, he is allowed to perform the operation <span class=\"tex-font-style-bf\">at most once<\/span>:<\/p><ul> <li> Choose an integer $$$j$$$ such that $$$1 \\leq j \\leq m$$$. Set $$$a_i := b_j - a_i$$$. Note that $$$a_i$$$ may become non-positive as a result of this operation. <\/li><\/ul><p>Skibidus needs your help determining whether he can sort $$$a$$$ in non-decreasing order$$$^{\\text{\u2217}}$$$ by performing the above operation some number of times.<\/p><div class=\"statement-footnote\"><p>$$$^{\\text{\u2217}}$$$$$$a$$$ is sorted in non-decreasing order if $$$a_1 \\leq a_2 \\leq \\ldots \\leq a_n$$$.<\/p><\/div><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$t$$$ ($$$1 \\leq t \\leq 10^4$$$) \u2014 the number of test cases.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\leq n \\leq 2 \\cdot 10^5$$$, $$$1 \\leq m \\leq 2\\cdot 10^5$$$).<\/p><p>The following line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\leq a_i \\leq 10^9$$$).<\/p><p>The following line of each test case contains $$$m$$$ integers $$$b_1, b_2, \\ldots, b_m$$$ ($$$1 \\leq b_i \\leq 10^9$$$).<\/p><p>It is guaranteed that the sum of $$$n$$$ and the sum of $$$m$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, if it is possible to sort $$$a$$$ in non-decreasing order, print \"<span class=\"tex-font-style-tt\">YES<\/span>\" on a new line. Otherwise, print \"<span class=\"tex-font-style-tt\">NO<\/span>\" on a new line.<\/p><p>You can output the answer in any case. For example, the strings \"<span class=\"tex-font-style-tt\">yEs<\/span>\", \"<span class=\"tex-font-style-tt\">yes<\/span>\", and \"<span class=\"tex-font-style-tt\">Yes<\/span>\" will also be recognized as positive responses.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">9 1 1000000000<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 4 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 4 6 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6 1 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 4 5 4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 1000<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">9 8 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">8<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nNO\nYES\nNO\nYES\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, $$$[5]$$$ is already sorted.<\/p><p>In the second test case, it can be shown that it is impossible.<\/p><p>In the third test case, we can set $$$a_2:=b_1-a_2=6-4=2$$$ and $$$a_3:=b_3-a_3=8-6=2$$$. The sequence $$$[2,2,2,5]$$$ is in nondecreasing order.<\/p><p>In the last case, we can apply operations on each index. The sequence becomes $$$[-1,0,1]$$$, which is in nondecreasing order.<\/p><\/div><\/div>"}, {"contestId": 2049, "index": "B", "name": "pspspsps", "rating": 1300, "solvedCount": 19371, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. pspspsps<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p> <\/p><p><span class=\"tex-font-style-it\">Cats are attracted to pspspsps, but Evirir, being a dignified dragon, is only attracted to pspspsps with oddly specific requirements...<\/span><\/p><p>Given a string $$$s = s_1s_2\\ldots s_n$$$ of length $$$n$$$ consisting of characters <span class=\"tex-font-style-tt\">p<\/span>, <span class=\"tex-font-style-tt\">s<\/span>, and <span class=\"tex-font-style-tt\">.<\/span> (dot), determine whether a permutation$$$^{\\text{\u2217}}$$$ $$$p$$$ of length $$$n$$$ exists, such that for all integers $$$i$$$ ($$$1 \\le i \\le n$$$): <\/p><ul> <li> If $$$s_i$$$ is <span class=\"tex-font-style-tt\">p<\/span>, then $$$[p_1, p_2, \\ldots, p_i]$$$ forms a permutation (of length $$$i$$$); <\/li><li> If $$$s_i$$$ is <span class=\"tex-font-style-tt\">s<\/span>, then $$$[p_i, p_{i+1}, \\ldots, p_{n}]$$$ forms a permutation (of length $$$n-i+1$$$); <\/li><li> If $$$s_i$$$ is <span class=\"tex-font-style-tt\">.<\/span>, then there is no additional restriction. <\/li><\/ul><div class=\"statement-footnote\"><p>$$$^{\\text{\u2217}}$$$A permutation of length $$$n$$$ is an array consisting of $$$n$$$ distinct integers from $$$1$$$ to $$$n$$$ in arbitrary order. For example, $$$[2,3,1,5,4]$$$ is a permutation, but $$$[1,2,2]$$$ is not a permutation ($$$2$$$ appears twice in the array), and $$$[1,3,4]$$$ is also not a permutation ($$$n=3$$$ but there is $$$4$$$ in the array). <\/p><\/div><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 500$$$), the length of $$$s$$$.<\/p><p>The second line of each test case contains a string $$$s$$$ of length $$$n$$$ that consists of the characters <span class=\"tex-font-style-tt\">p<\/span>, <span class=\"tex-font-style-tt\">s<\/span>, and <span class=\"tex-font-style-tt\">.<\/span>.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$5000$$$. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output <span class=\"tex-font-style-tt\">YES<\/span> or <span class=\"tex-font-style-tt\">NO<\/span> on a line. Output <span class=\"tex-font-style-tt\">YES<\/span> if there is such a permutation and <span class=\"tex-font-style-tt\">NO<\/span> otherwise.<\/p><p>You can output the answer in any case (upper or lower). For example, the strings \"<span class=\"tex-font-style-tt\">yEs<\/span>\", \"<span class=\"tex-font-style-tt\">yes<\/span>\", \"<span class=\"tex-font-style-tt\">Yes<\/span>\", and \"<span class=\"tex-font-style-tt\">YES<\/span>\" will be recognized as positive responses.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">s.sp<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">pss..s<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">ppppp<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">sp<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">.sp.<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">8<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">psss....<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">.<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">8<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">pspspsps<\/div><div class=\"test-example-line test-example-line-odd test-example-line-9\">20<\/div><div class=\"test-example-line test-example-line-odd test-example-line-9\">....................<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nNO\nYES\nYES\nNO\nNO\nYES\nNO\nYES\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first test case, one permutation that works is $$$p = [3, 4, 1, 2]$$$. The restrictions are as follows: <\/p><ul> <li> $$$s_1 =$$$ <span class=\"tex-font-style-tt\">s<\/span>: $$$[p_1, p_2, p_3, p_4] = [3, 4, 1, 2]$$$ forms a permutation. <\/li><li> $$$s_2 =$$$ <span class=\"tex-font-style-tt\">.<\/span>: No additional restriction. <\/li><li> $$$s_3 =$$$ <span class=\"tex-font-style-tt\">s<\/span>: $$$[p_3, p_4] = [1, 2]$$$ forms a permutation. <\/li><li> $$$s_4 =$$$ <span class=\"tex-font-style-tt\">p<\/span>: $$$[p_1, p_2, p_3, p_4] = [3, 4, 1, 2]$$$ forms a permutation. <\/li><\/ul><p>For the second test case, it can be proven that there is no permutation that satisfies all restrictions.<\/p><p>For the third test case, one permutation that satisfies the constraints is $$$p = [1, 2, 3, 4, 5]$$$.<\/p><\/div><\/div>"}, {"contestId": 1420, "index": "C1", "name": "Pok\u00e9mon Army (easy version)", "rating": 1300, "solvedCount": 19323, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C1. Pok\u00e9mon Army (easy version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is the easy version of the problem. The difference between the versions is that the easy version has no swap operations. You can make hacks only if all versions of the problem are solved.<\/span><\/p><p>Pikachu is a cute and friendly pok\u00e9mon living in the wild pikachu herd.<\/p><p>But it has become known recently that infamous team R wanted to steal all these pok\u00e9mon! Pok\u00e9mon trainer Andrew decided to help Pikachu to build a pok\u00e9mon army to resist.<\/p><p>First, Andrew counted all the pok\u00e9mon\u00a0\u2014 there were exactly $$$n$$$ pikachu. The strength of the $$$i$$$-th pok\u00e9mon is equal to $$$a_i$$$, and all these numbers are distinct.<\/p><p>As an army, Andrew can choose any non-empty subsequence of pokemons. In other words, Andrew chooses some array $$$b$$$ from $$$k$$$ indices such that $$$1 \\le b_1  \\lt  b_2  \\lt  \\dots  \\lt  b_k \\le n$$$, and his army will consist of pok\u00e9mons with forces $$$a_{b_1}, a_{b_2}, \\dots, a_{b_k}$$$.<\/p><p>The strength of the army is equal to the alternating sum of elements of the subsequence; that is, $$$a_{b_1} - a_{b_2} + a_{b_3} - a_{b_4} + \\dots$$$.<\/p><p>Andrew is experimenting with pok\u00e9mon order. He performs $$$q$$$ operations. In $$$i$$$-th operation Andrew swaps $$$l_i$$$-th and $$$r_i$$$-th pok\u00e9mon.<\/p><p><span class=\"tex-font-style-bf\">Note: $$$q=0$$$ in this version of the task.<\/span><\/p><p>Andrew wants to know the maximal stregth of the army he can achieve with the initial pok\u00e9mon placement. He also needs to know the maximal strength after each operation.<\/p><p>Help Andrew and the pok\u00e9mon, or team R will realize their tricky plan!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases.<\/p><p>The first line contains one positive integer $$$t$$$ ($$$1 \\le t \\le 10^3$$$) denoting the number of test cases. Description of the test cases follows.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$q$$$ ($$$1 \\le n \\le 3 \\cdot 10^5, q = 0$$$) denoting the number of pok\u00e9mon and number of operations respectively.<\/p><p>The second line contains $$$n$$$ distinct positive integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le n$$$) denoting the strengths of the pok\u00e9mon.<\/p><p>$$$i$$$-th of the last $$$q$$$ lines contains two positive integers $$$l_i$$$ and $$$r_i$$$ ($$$1 \\le l_i \\le r_i \\le n$$$) denoting the indices of pok\u00e9mon that were swapped in the $$$i$$$-th operation.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$3 \\cdot 10^5$$$, and the sum of $$$q$$$ over all test cases does not exceed $$$3 \\cdot 10^5$$$. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print $$$q+1$$$ integers: the maximal strength of army before the swaps and after each swap.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n3 0\n1 3 2\n2 0\n1 2\n7 0\n1 2 5 4 3 6 7\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n2\n9\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In third test case we can build an army in such way: [1 2 <span class=\"tex-font-style-bf\">5<\/span> 4 <span class=\"tex-font-style-bf\">3<\/span> 6 <span class=\"tex-font-style-bf\">7<\/span>], its strength will be $$$5\u22123+7=9$$$.<\/p><\/div><\/div>"}, {"contestId": 2059, "index": "B", "name": "Cost of the Array", "rating": 1300, "solvedCount": 19254, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Cost of the Array<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ of length $$$n$$$ and an <span class=\"tex-font-style-bf\">even<\/span> integer $$$k$$$ ($$$2 \\le k \\le n$$$). You need to split the array $$$a$$$ into exactly $$$k$$$ non-empty subarrays$$$^{\\dagger}$$$ such that each element of the array $$$a$$$ belongs to exactly one subarray.<\/p><p>Next, all subarrays with even indices (second, fourth, $$$\\ldots$$$, $$$k$$$-th) are concatenated into a single array $$$b$$$. After that, $$$0$$$ is <span class=\"tex-font-style-bf\">added<\/span> to the end of the array $$$b$$$.<\/p><p>The <span class=\"tex-font-style-it\">cost<\/span> of the array $$$b$$$ is defined as the minimum index $$$i$$$ such that $$$b_i \\neq i$$$. For example, the cost of the array $$$b = [1, 2, 4, 5, 0]$$$ is $$$3$$$, since $$$b_1 = 1$$$, $$$b_2 = 2$$$, and $$$b_3 \\neq 3$$$. Determine <span class=\"tex-font-style-bf\">the minimum<\/span> cost of the array $$$b$$$ that can be obtained with an optimal partitioning of the array $$$a$$$ into subarrays.<\/p><p>$$$^{\\dagger}$$$An array $$$x$$$ is a subarray of an array $$$y$$$ if $$$x$$$ can be obtained from $$$y$$$ by the deletion of several (possibly, zero or all) elements from the beginning and several (possibly, zero or all) elements from the end. <\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test consists of multiple test cases. The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$k$$$ ($$$2 \\le k \\le n \\le 2 \\cdot 10^5$$$, $$$k$$$ is even)\u00a0\u2014 the length of the array $$$a$$$ and the number of subarrays.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$)\u00a0\u2014 the elements of the array $$$a$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer\u00a0\u2014 the minimum cost of the array $$$b$$$ that can be obtained.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">8 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 1 2 2 3 3 4 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 1 1 2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 1 1000000000 2 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n5\n2\n1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, there are only two possible partitionings: $$$[[1], [1, 1]]$$$ and $$$[[1, 1], [1]]$$$. In either case, $$$b_1 = 1$$$, and $$$b_2 \\ne 2$$$, so the cost is $$$2$$$.<\/p><p>In the second test case, there is only one possible partitioning, where $$$b = [1, 2, 3, 4, 0]$$$, so the cost is $$$5$$$ ($$$b_5 = 0 \\ne 5$$$).<\/p><p>In the third test case, the following partitioning works: $$$[[1], [1, 1], [2], [2]]$$$. Then $$$b = [1, 1, 2, 0]$$$, and the cost is $$$2$$$.<\/p><\/div><\/div>"}, {"contestId": 2118, "index": "C", "name": "Make It Beautiful", "rating": 1300, "solvedCount": 19173, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Make It Beautiful<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ of $$$n$$$ integers. We define the $$$\\text{beauty}$$$ of a number $$$x$$$ to be the number of $$$1$$$ bits in its binary representation. We define the beauty of an array to be the sum of beauties of the numbers it contains. <\/p><p>In one operation, you can select an index $$$i$$$\u00a0$$$(1 \\le i \\le n)$$$ and increase $$$a_i$$$ by $$$1$$$. <\/p><p>Find the maximum beauty of the array after doing <span class=\"tex-font-style-bf\">at most<\/span> $$$k$$$ operations.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 5000$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le n \\le 5000$$$, $$$0 \\le k \\le 10^{18}$$$)\u00a0\u2014 the length of the array and the maximal number of operations. <\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots a_n$$$ ($$$0 \\le a_i \\le 10^9$$$)\u00a0\u2014denoting the array $$$a$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$5000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer, the maximum beauty after at most $$$k$$$ operations.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">0 1 7 2 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">0 1 7 2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 0 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 100000000000<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">0<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n8\n9\n2\n3\n36\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, $$$a = [0, 1, 7, 2, 4]$$$. <\/p><ul> <li> apply the first operation at $$$i = 1$$$, the new array is $$$a = [1, 1, 7, 2, 4]$$$ <\/li><li> apply the second operation at $$$i = 4$$$, the new array is $$$a = [1, 1, 7, 3, 4]$$$ <\/li><\/ul> The beauty of this array is $$$1 + 1 + 3 + 2 + 1 = 8$$$. One of the other valid solutions with the same beauty is $$$[0, 1, 7, 3, 5]$$$.<p>In the third test case, $$$a = [3]$$$. Since you are not required to use exactly $$$k$$$ operations, it is optimal to do none.<\/p><\/div><\/div>"}, {"contestId": 2129, "index": "A", "name": "Double Perspective", "rating": 1300, "solvedCount": 19172, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. Double Perspective<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>For a set of pairs $$$S = \\{(a_1, b_1), (a_2, b_2), \\ldots, (a_m, b_m)\\}$$$, where $$$a_i  \\lt  b_i$$$ for all $$$1 \\le i \\le m$$$, we define $$$f(S)$$$ and $$$g(S)$$$ as follows:<\/p><ul> <li> Treating each $$$(a_i, b_i)$$$ as a segment on the number line, $$$f(S)$$$ is the length of their union. Formally, $$$f(S)$$$ is the number of integers $$$x$$$ such that there exists an $$$i$$$ ($$$1 \\leq i \\leq m$$$) where $$$[x, x+1] \\subseteq [a_i, b_i]$$$.<p> <\/p><\/li><li> Treating each $$$(a_i, b_i)$$$ as an undirected edge in a graph, $$$g(S)$$$ is the number of nodes that lie on at least one simple cycle with at least $$$3$$$ edges. Formally, $$$g(S)$$$ is the number of nodes $$$x_1$$$ such that there exists a path $$$x_1 \\to x_2 \\to \\ldots \\to x_k \\to x_1$$$ in the graph, where $$$k \\geq 3$$$ and all $$$x_1, x_2, \\ldots, x_k$$$ are distinct. <\/li><\/ul><p>For example, $$$S = \\{(1,2), (2,4), (1,4), (4,5),(6,7)\\}$$$, we can get $$$f(S) = 5$$$ and $$$g(S) = 3$$$.<\/p><p>You are given $$$n$$$ <span class=\"tex-font-style-bf\">distinct<\/span> pairs. Your task is to select a subset $$$S'$$$ of these pairs such that $$$f(S') - g(S')$$$ is maximized. You need to output the indices of the selected pairs.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains an integer $$$n$$$ ($$$1 \\le n \\le 3 \\cdot 10^3$$$).<\/p><p>Next $$$n$$$ lines each contain two integers $$$a_i$$$ and $$$b_i$$$ ($$$1 \\le a_i  \\lt  b_i \\le 2n$$$), representing a pair.<\/p><p>It is guaranteed that all pairs are <span class=\"tex-font-style-bf\">distinct<\/span> within the same test case.<\/p><p>It is guaranteed that the sum of $$$n^2$$$ over all test cases will not exceed $$$9 \\cdot 10^6$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, the first line contains an integer $$$k$$$ ($$$0 \\le k \\le n$$$)\u00a0\u2014 the size of the subset $$$S'$$$.<\/p><p>Next line contains $$$k$$$ integers $$$i_1, i_2, \\ldots, i_m$$$ ($$$1 \\le i_1 , i_2 , \\ldots , i_k \\le n$$$)\u00a0\u2014 the indices of the selected pairs. Note the indices must be <span class=\"tex-font-style-bf\">distinct<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 5<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n1\n3\n1 2 4\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, if no pair is selected (i.e. $$$S'=\\varnothing$$$), $$$f(S')-g(S')=0-0=0$$$. If the first pair is selected, $$$f (S') - g (S')=1-0=1$$$. So the optimal solution is to select the first pair.<\/p><\/div><\/div>"}, {"contestId": 665, "index": "C", "name": "Simple Strings", "rating": 1300, "solvedCount": 19066, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Simple Strings<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-tt\">zscoder<\/span> loves simple strings! A string <span class=\"tex-span\"><i>t<\/i><\/span> is called simple if every pair of adjacent characters are distinct. For example <span class=\"tex-font-style-tt\">ab<\/span>, <span class=\"tex-font-style-tt\">aba<\/span>, <span class=\"tex-font-style-tt\">zscoder<\/span> are simple whereas <span class=\"tex-font-style-tt\">aa<\/span>, <span class=\"tex-font-style-tt\">add<\/span> are not simple.<\/p><p><span class=\"tex-font-style-tt\">zscoder<\/span> is given a string <span class=\"tex-span\"><i>s<\/i><\/span>. He wants to change a minimum number of characters so that the string <span class=\"tex-span\"><i>s<\/i><\/span> becomes simple. Help him with this task!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line contains the string <span class=\"tex-span\"><i>s<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009|<i>s<\/i>|\u2009\u2264\u20092\u00b710<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the string given to <span class=\"tex-font-style-tt\">zscoder<\/span>. The string <span class=\"tex-span\"><i>s<\/i><\/span> consists of only lowercase English letters.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the simple string <span class=\"tex-span\"><i>s<\/i>'<\/span> \u2014 the string <span class=\"tex-span\"><i>s<\/i><\/span> after the minimal number of changes. If there are multiple solutions, you may output any of them.<\/p><p>Note that the string <span class=\"tex-span\"><i>s<\/i>'<\/span> should also consist of only lowercase English letters.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>aab<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>bab<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>caaab<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>cabab<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>zscoder<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>zscoder<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1466, "index": "C", "name": "Canine poetry", "rating": 1300, "solvedCount": 18950, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Canine poetry<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>After his wife's tragic death, Eurydice, Orpheus descended to the realm of death to see her. Reaching its gates was uneasy, but passing through them proved to be even more challenging. Mostly because of Cerberus, the three-headed hound of Hades. <\/p><p>Orpheus, a famous poet, and musician plans to calm Cerberus with his poetry and safely walk past him. He created a very peculiar poem for Cerberus. It consists only of lowercase English letters. <\/p><p>We call a poem's substring a palindrome if and only if it reads the same backwards and forwards. A string $$$a$$$ is a substring of a string $$$b$$$ if $$$a$$$ can be obtained from $$$b$$$ by deleting several (possibly zero or all) characters from the beginning and several (possibly zero or all) characters from the end.<\/p><p>Unfortunately, Cerberus dislikes palindromes of length greater than $$$1$$$. For example in the poem <span class=\"tex-font-style-tt\">abaa<\/span> the hound of Hades wouldn't like substrings <span class=\"tex-font-style-tt\">aba<\/span> and <span class=\"tex-font-style-tt\">aa<\/span>.<\/p><p>Orpheus can only calm Cerberus if the hound likes his poetry. That's why he wants to change his poem so that it does not contain any palindrome substrings of length <span class=\"tex-font-style-bf\">greater than $$$1$$$<\/span>.<\/p><p>Orpheus can modify the poem by replacing a letter at any position with any lowercase English letter. He can use this operation arbitrarily many times (possibly zero). Since there can be many palindromes in his poem, he may have to make some corrections. But how many, exactly? Given the poem, determine the minimal number of letters that have to be changed so that the poem does not contain any palindromes of length greater than $$$1$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 10^5$$$) denoting the number of test cases, then $$$t$$$ test cases follow.<\/p><p>The first and only line of each test case contains a non-empty string of lowercase English letters, Orpheus' poem.<\/p><p>The sum of the length of Orpheus' poems in all test cases will not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>You should output $$$t$$$ lines, $$$i$$$-th line should contain a single integer, answer to the $$$i$$$-th test case.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7\nbabba\nabaac\ncodeforces\nzeroorez\nabcdcba\nbbbbbbb\na\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n1\n0\n1\n1\n4\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, we can replace the third character with <span class=\"tex-font-style-tt\">c<\/span> and obtain a palindrome-less poem <span class=\"tex-font-style-tt\">bacba<\/span>.<\/p><p>In the second test case, we can replace the third character with <span class=\"tex-font-style-tt\">d<\/span> and obtain a palindrome-less poem <span class=\"tex-font-style-tt\">abdac<\/span>.<\/p><p>In the third test case, the initial poem already doesn't contain any palindromes, so Orpheus doesn't need to change anything there.<\/p><\/div><\/div>"}, {"contestId": 1547, "index": "D", "name": "Co-growing Sequence", "rating": 1300, "solvedCount": 18937, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Co-growing Sequence<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>A sequence of non-negative integers $$$a_1, a_2, \\dots, a_n$$$ is called <span class=\"tex-font-style-it\">growing<\/span> if for all $$$i$$$ from $$$1$$$ to $$$n - 1$$$ all ones (of binary representation) in $$$a_i$$$ are in the places of ones (of binary representation) in $$$a_{i + 1}$$$

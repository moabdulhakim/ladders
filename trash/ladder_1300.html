tion\"><div class=\"section-title\">Output<\/div><p>For each test case output one integer\u00a0\u2014 the number of tables that you can occupy so as not to violate the rules of the restaurant. If additional tables cannot be taken, then, obviously, you need to output $$$0$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n6 1\n100010\n6 2\n000000\n5 1\n10101\n3 1\n001\n2 2\n00\n1 1\n0\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n2\n0\n1\n1\n1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The first test case is explained in the statement.<\/p><p>In the second test case, the answer is $$$2$$$, since you can choose the first and the sixth table.<\/p><p>In the third test case, you cannot take any free table without violating the rules of the restaurant.<\/p><\/div><\/div>"}, {"contestId": 1850, "index": "F", "name": "We Were Both Children", "rating": 1300, "solvedCount": 25667, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. We Were Both Children<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Mihai and Slavic were looking at a group of $$$n$$$ frogs, numbered from $$$1$$$ to $$$n$$$, all initially located at point $$$0$$$. Frog $$$i$$$ has a hop length of $$$a_i$$$. <\/p><p>Each second, frog $$$i$$$ hops $$$a_i$$$ units forward. Before any frogs start hopping, Slavic and Mihai can place <span class=\"tex-font-style-bf\">exactly one<\/span> trap in a coordinate in order to catch all frogs that will ever pass through the corresponding coordinate.<\/p><p>However, the children can't go far away from their home so they can only place a trap in the first $$$n$$$ points (that is, in a point with a coordinate between $$$1$$$ and $$$n$$$) and the children can't place a trap in point $$$0$$$ since they are scared of frogs.<\/p><p>Can you help Slavic and Mihai find out what is the maximum number of frogs they can catch using a trap?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains a single integer $$$t$$$ ($$$1 \\le t \\le 100$$$) \u2014 the number of test cases. The description of test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\leq n \\leq 2 \\cdot 10^5$$$) \u2014 the number of frogs, which equals the distance Slavic and Mihai can travel to place a trap.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, \\ldots, a_n$$$ ($$$1 \\leq a_i \\leq 10^9$$$) \u2014 the lengths of the hops of the corresponding frogs.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case output a single integer\u00a0\u2014 the maximum number of frogs Slavic and Mihai can catch using a trap.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 3 4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 2 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 1 3 4 9 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">9<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 3 2 4 2 3 7 8 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">10<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">8<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">7 11 6 8 12 4 4 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">9 11 9 12 1 7 2 5 8 10<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n3\n3\n5\n0\n4\n4\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the frogs will hop as follows: <\/p><ul> <li> Frog 1: $$$0 \\to 1 \\to 2 \\to 3 \\to \\mathbf{\\color{red}{4}} \\to \\cdots$$$ <\/li><li> Frog 2: $$$0 \\to 2 \\to \\mathbf{\\color{red}{4}} \\to 6 \\to 8 \\to \\cdots$$$ <\/li><li> Frog 3: $$$0 \\to 3 \\to 6 \\to 9 \\to 12 \\to \\cdots$$$ <\/li><li> Frog 4: $$$0 \\to \\mathbf{\\color{red}{4}} \\to 8 \\to 12 \\to 16 \\to \\cdots$$$ <\/li><li> Frog 5: $$$0 \\to 5 \\to 10 \\to 15 \\to 20 \\to \\cdots$$$ <\/li><\/ul> Therefore, if Slavic and Mihai put a trap at coordinate $$$4$$$, they can catch three frogs: frogs 1, 2, and 4. It can be proven that they can't catch any more frogs.<p>In the second test case, Slavic and Mihai can put a trap at coordinate $$$2$$$ and catch all three frogs instantly.<\/p><\/div><\/div>"}, {"contestId": 1203, "index": "C", "name": "Common Divisors", "rating": 1300, "solvedCount": 25497, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Common Divisors<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ consisting of $$$n$$$ integers.<\/p><p>Your task is to say the number of such positive integers $$$x$$$ such that $$$x$$$ divides <span class=\"tex-font-style-bf\">each<\/span> number from the array. In other words, you have to find the number of common divisors of all elements in the array.<\/p><p>For example, if the array $$$a$$$ will be $$$[2, 4, 6, 2, 10]$$$, then $$$1$$$ and $$$2$$$ divide each number from the array (so the answer for this test is $$$2$$$).<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains one integer $$$n$$$ ($$$1 \\le n \\le 4 \\cdot 10^5$$$) \u2014 the number of elements in $$$a$$$.<\/p><p>The second line of the input contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^{12}$$$), where $$$a_i$$$ is the $$$i$$$-th element of $$$a$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the number of such positive integers $$$x$$$ such that $$$x$$$ divides <span class=\"tex-font-style-bf\">each<\/span> number from the given array (in other words, the answer is the number of common divisors of all elements in the array).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n1 2 3 4 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n6 90 12 18 30 18\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1955, "index": "C", "name": "Inhabitant of the Deep Sea", "rating": 1300, "solvedCount": 25166, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Inhabitant of the Deep Sea<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>$$$n$$$ ships set out to explore the depths of the ocean. The ships are numbered from $$$1$$$ to $$$n$$$ and follow each other in ascending order; the $$$i$$$-th ship has a durability of $$$a_i$$$.<\/p><p>The Kraken attacked the ships $$$k$$$ times in a specific order. First, it attacks the first of the ships, then the last, then the first again, and so on.<\/p><p>Each attack by the Kraken reduces the durability of the ship by $$$1$$$. When the durability of the ship drops to $$$0$$$, it sinks and is no longer subjected to attacks (thus the ship ceases to be the first or last, and the Kraken only attacks the ships that have not yet sunk). If all the ships have sunk, the Kraken has nothing to attack and it swims away.<\/p><p>For example, if $$$n=4$$$, $$$k=5$$$, and $$$a=[1, 2, 4, 3]$$$, the following will happen:<\/p><ol> <li> The Kraken attacks the first ship, its durability becomes zero and now $$$a = [2, 4, 3]$$$; <\/li><li> The Kraken attacks the last ship, now $$$a = [2, 4, 2]$$$; <\/li><li> The Kraken attacks the first ship, now $$$a = [1, 4, 2]$$$; <\/li><li> The Kraken attacks the last ship, now $$$a = [1, 4, 1]$$$; <\/li><li> The Kraken attacks the first ship, its durability becomes zero and now $$$a = [4, 1]$$$. <\/li><\/ol><p>How many ships were sunk after the Kraken's attack?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$, $$$1 \\le k \\le 10^{15}$$$)\u00a0\u2014 the number of ships and how many times the Kraken will attack the ships.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$)\u00a0\u2014 the durability of the ships.<\/p><p>It is guaranteed that the sum of $$$n$$$ for all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output the number of ships sunk by the Kraken on a separate line.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 4 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2 4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 20<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 7 1 8 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2 15<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">2 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">5 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n3\n5\n0\n2\n2\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1498, "index": "B", "name": "Box Fitting", "rating": 1300, "solvedCount": 25154, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Box Fitting<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given $$$n$$$ rectangles, each of height $$$1$$$. Each rectangle's width is a power of $$$2$$$ (i.\u2009e. it can be represented as $$$2^x$$$ for some non-negative integer $$$x$$$). <\/p><p>You are also given a two-dimensional box of width $$$W$$$. Note that $$$W$$$ may or may not be a power of $$$2$$$. Moreover, $$$W$$$ is at least as large as the width of the largest rectangle.<\/p><p>You have to find the smallest height of this box, such that it is able to fit all the given rectangles. It is allowed to have some empty space left in this box after fitting all the rectangles.<\/p><p>You cannot rotate the given rectangles to make them fit into the box. Moreover, any two distinct rectangles must not overlap, i.\u2009e., any two distinct rectangles must have zero intersection area.<\/p><p>See notes for visual explanation of sample input.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains one integer $$$t$$$ ($$$1 \\le t \\le 5 \\cdot 10^3$$$) \u2014 the number of test cases. Each test case consists of two lines.<\/p><p>For each test case:<\/p><ul><li> the first line contains two integers $$$n$$$ ($$$1 \\le n \\le 10^5$$$) and $$$W$$$ ($$$1 \\le W \\le 10^9$$$);<\/li><li> the second line contains $$$n$$$ integers $$$w_1, w_2, \\dots, w_n$$$ ($$$1 \\le w_i \\le 10^6$$$), where $$$w_i$$$ is the width of the $$$i$$$-th rectangle. Each $$$w_i$$$ is a power of $$$2$$$;<\/li><li> additionally, $$$\\max\\limits_{i=1}^{n} w_i \\le W$$$. <\/li><\/ul><p>The sum of $$$n$$$ over all test cases does not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output $$$t$$$ integers. The $$$i$$$-th integer should be equal to the answer to the $$$i$$$-th test case \u2014 the smallest height of the box.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n5 16\n1 2 8 4 8\n6 10\n2 8 8 2 2 8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first test case in the sample input, the following figure shows one way to fit the given five rectangles into the 2D box with minimum height:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/e6ff9bc67e9a82aa90cd065e09fdbfb370eefb4f.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>In the figure above, the number inside each rectangle is its width. The width of the 2D box is $$$16$$$ (indicated with arrow below). The minimum height required for the 2D box in this case is $$$2$$$ (indicated on the left).<\/p><p>In the second test case, you can have a minimum height of three by keeping two blocks (one each of widths eight and two) on each of the three levels.<\/p><\/div><\/div>"}, {"contestId": 1237, "index": "B", "name": "Balanced Tunnel", "rating": 1300, "solvedCount": 24706, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Balanced Tunnel<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Consider a tunnel on a one-way road. During a particular day, $$$n$$$ cars numbered from $$$1$$$ to $$$n$$$ entered and exited the tunnel exactly once. All the cars passed through the tunnel at constant speeds.<\/p><p>A traffic enforcement camera is mounted at the tunnel entrance. Another traffic enforcement camera is mounted at the tunnel exit. <span class=\"tex-font-style-it\">Perfectly balanced<\/span>.<\/p><p>Thanks to the cameras, the order in which the cars entered and exited the tunnel is known. No two cars entered or exited at the same time.<\/p><p>Traffic regulations prohibit overtaking inside the tunnel. If car $$$i$$$ overtakes any other car $$$j$$$ inside the tunnel, car $$$i$$$ must be fined. However, each car can be fined at most once.<\/p><p>Formally, let's say that car $$$i$$$ <span class=\"tex-font-style-it\">definitely overtook<\/span> car $$$j$$$ if car $$$i$$$ entered the tunnel later than car $$$j$$$ and exited the tunnel earlier than car $$$j$$$. Then, car $$$i$$$ must be fined if and only if it definitely overtook at least one other car.<\/p><p>Find the number of cars that must be fined. <\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$2 \\le n \\le 10^5$$$), denoting the number of cars.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le n$$$), denoting the ids of cars in order of entering the tunnel. All $$$a_i$$$ are pairwise distinct.<\/p><p>The third line contains $$$n$$$ integers $$$b_1, b_2, \\ldots, b_n$$$ ($$$1 \\le b_i \\le n$$$), denoting the ids of cars in order of exiting the tunnel. All $$$b_i$$$ are pairwise distinct.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output the number of cars to be fined.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n3 5 2 1 4\n4 3 2 5 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7\n5 2 3 6 7 1 4\n2 3 6 7 1 4 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n1 2\n1 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The first example is depicted below:<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/b8f505b38707f87ac16773bccb0b71793cba0965.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>Car $$$2$$$ definitely overtook car $$$5$$$, while car $$$4$$$ definitely overtook cars $$$1$$$, $$$2$$$, $$$3$$$ and $$$5$$$. Cars $$$2$$$ and $$$4$$$ must be fined.<\/p><p>In the second example car $$$5$$$ was definitely overtaken by all other cars.<\/p><p>In the third example no car must be fined.<\/p><\/div><\/div>"}, {"contestId": 1555, "index": "C", "name": "Coin Rows", "rating": 1300, "solvedCount": 24574, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Coin Rows<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Alice and Bob are playing a game on a matrix, consisting of $$$2$$$ rows and $$$m$$$ columns. The cell in the $$$i$$$-th row in the $$$j$$$-th column contains $$$a_{i, j}$$$ coins in it.<\/p><p>Initially, both Alice and Bob are standing in a cell $$$(1, 1)$$$. They are going to perform a sequence of moves to reach a cell $$$(2, m)$$$.<\/p><p>The possible moves are: <\/p><ul> <li> Move right\u00a0\u2014 from some cell $$$(x, y)$$$ to $$$(x, y + 1)$$$; <\/li><li> Move down\u00a0\u2014 from some cell $$$(x, y)$$$ to $$$(x + 1, y)$$$. <\/li><\/ul><p>First, Alice makes <span class=\"tex-font-style-bf\">all her moves<\/span> until she reaches $$$(2, m)$$$. She collects the coins in all cells she visit (including the starting cell).<\/p><p>When Alice finishes, Bob starts his journey. He also performs the moves to reach $$$(2, m)$$$ and collects the coins in all cells that he visited, <span class=\"tex-font-style-bf\">but Alice didn't<\/span>.<\/p><p>The score of the game is the total number of coins Bob collects.<\/p><p>Alice wants to minimize the score. Bob wants to maximize the score. What will the score of the game be if both players play optimally?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of testcases.<\/p><p>Then the descriptions of $$$t$$$ testcases follow.<\/p><p>The first line of the testcase contains a single integer $$$m$$$ ($$$1 \\le m \\le 10^5$$$)\u00a0\u2014 the number of columns of the matrix.<\/p><p>The $$$i$$$-th of the next $$$2$$$ lines contain $$$m$$$ integers $$$a_{i,1}, a_{i,2}, \\dots, a_{i,m}$$$ ($$$1 \\le a_{i,j} \\le 10^4$$$)\u00a0\u2014 the number of coins in the cell in the $$$i$$$-th row in the $$$j$$$-th column of the matrix.<\/p><p>The sum of $$$m$$$ over all testcases doesn't exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each testcase print a single integer\u00a0\u2014 the score of the game if both players play optimally.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n3\n1 3 7\n3 5 1\n3\n1 3 9\n3 5 1\n1\n4\n7\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n7\n8\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The paths for the testcases are shown on the following pictures. Alice's path is depicted in red and Bob's path is depicted in blue.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/b4f742c0500010b79f12902767f16863d1fe3d3c.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 1999, "index": "E", "name": "Triple Operations", "rating": 1300, "solvedCount": 24448, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Triple Operations<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>On the board Ivy wrote down all integers from $$$l$$$ to $$$r$$$, inclusive.<\/p><p>In an operation, she does the following: <\/p><ul> <li> pick two numbers $$$x$$$ and $$$y$$$ on the board, erase them, and in their place write the numbers $$$3x$$$ and $$$\\lfloor \\frac{y}{3} \\rfloor$$$. (Here $$$\\lfloor \\bullet \\rfloor$$$ denotes rounding down to the nearest integer).<\/li><\/ul> <p>What is the minimum number of operations Ivy needs to make all numbers on the board equal $$$0$$$? We have a proof that this is always possible.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$t$$$ ($$$1 \\leq t \\leq 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The only line of each test case contains two integers $$$l$$$ and $$$r$$$ ($$$1 \\leq l  \\lt  r \\leq 2 \\cdot 10^5$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer\u00a0\u2014 the minimum number of operations needed to make all numbers on the board equal $$$0$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">199999 200000<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">19 84<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5\n6\n36\n263\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, we can perform $$$5$$$ operations as follows: $$$$$$ 1,2,3 \\xrightarrow[x=1,\\,y=2]{} 3,0,3 \\xrightarrow[x=0,\\,y=3]{} 1,0,3 \\xrightarrow[x=0,\\,y=3]{} 1,0,1 \\xrightarrow[x=0,\\,y=1]{} 0,0,1 \\xrightarrow[x=0,\\,y=1]{} 0,0,0 .$$$$$$<\/p><\/div><\/div>"}, {"contestId": 508, "index": "B", "name": "Anton and currency you all know", "rating": 1300, "solvedCount": 24232, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Anton and currency you all know<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>0.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Berland, 2016. The exchange rate of <span class=\"tex-font-style-underline\">currency you all know<\/span> against the burle has increased so much that to simplify the calculations, its fractional part was neglected and the exchange rate is now assumed to be an integer.<\/p><p>Reliable sources have informed the financier Anton of some information about the exchange rate of <span class=\"tex-font-style-underline\">currency you all know<\/span> against the burle for tomorrow. Now Anton knows that tomorrow the exchange rate will be an even number, which can be obtained from the present rate by swapping exactly two distinct digits in it. Of all the possible values that meet these conditions, the exchange rate for tomorrow will be the maximum possible. It is guaranteed that today the exchange rate is an <span class=\"tex-font-style-underline\">odd<\/span> positive integer <span class=\"tex-span\"><i>n<\/i><\/span>. Help Anton to determine the exchange rate of <span class=\"tex-font-style-underline\">currency you all know<\/span> for tomorrow!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an odd positive integer <span class=\"tex-span\"><i>n<\/i><\/span>\u00a0\u2014 the exchange rate of <span class=\"tex-font-style-underline\">currency you all know<\/span> for today. The length of number <span class=\"tex-span\"><i>n<\/i><\/span>'s representation is within range from <span class=\"tex-span\">2<\/span> to <span class=\"tex-span\">10<sup class=\"upper-index\">5<\/sup><\/span>, inclusive. The representation of <span class=\"tex-span\"><i>n<\/i><\/span> doesn't contain any leading zeroes.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If the information about tomorrow's exchange rate is inconsistent, that is, there is no integer that meets the condition, print <span class=\"tex-span\">\u2009-\u20091<\/span>.<\/p><p>Otherwise, print the exchange rate of <span class=\"tex-font-style-underline\">currency you all know<\/span> against the burle for tomorrow. This should be the maximum possible number of those that are even and that are obtained from today's exchange rate by swapping exactly two digits. Exchange rate representation should not contain leading zeroes.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>527<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>572<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4573<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3574<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>1357997531<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>-1<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1794, "index": "C", "name": "Scoring Subsequences", "rating": 1300, "solvedCount": 24027, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Scoring Subsequences<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>The <span class=\"tex-font-style-it\">score<\/span> of a sequence $$$[s_1, s_2, \\ldots, s_d]$$$ is defined as $$$\\displaystyle \\frac{s_1\\cdot s_2\\cdot \\ldots \\cdot s_d}{d!}$$$, where $$$d!=1\\cdot 2\\cdot \\ldots \\cdot d$$$. In particular, the score of an empty sequence is $$$1$$$.<\/p><p>For a sequence $$$[s_1, s_2, \\ldots, s_d]$$$, let $$$m$$$ be the maximum score among all its subsequences. Its <span class=\"tex-font-style-it\">cost<\/span> is defined as the maximum length of a subsequence with a score of $$$m$$$.<\/p><p>You are given a <span class=\"tex-font-style-bf\">non-decreasing<\/span> sequence $$$[a_1, a_2, \\ldots, a_n]$$$ of integers of length $$$n$$$. In other words, the condition $$$a_1 \\leq a_2 \\leq \\ldots \\leq a_n$$$ is satisfied. For each $$$k=1, 2, \\ldots , n$$$, find the cost of the sequence $$$[a_1, a_2, \\ldots , a_k]$$$. <\/p><p>A sequence $$$x$$$ is a subsequence of a sequence $$$y$$$ if $$$x$$$ can be obtained from $$$y$$$ by deletion of several (possibly, zero or all) elements.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows.<\/p><p>The first line of each test case contains an integer $$$n$$$ ($$$1\\le n\\le 10^5$$$)\u00a0\u2014 the length of the given sequence. <\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1,a_2,\\ldots,a_n$$$ ($$$1\\le a_i\\leq n$$$)\u00a0\u2014 the given sequence. It is guaranteed that its elements are in non-decreasing order.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$5\\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output $$$n$$$ integers\u00a0\u2014 the costs of sequences $$$[a_1, a_2, \\ldots , a_k]$$$ in ascending order of $$$k$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 5 5 5 5<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 1 2 \n1 1 \n1 2 3 4 5 \n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case: <\/p><ul> <li> The maximum score among the subsequences of $$$[1]$$$ is $$$1$$$. The subsequences $$$[1]$$$ and $$$[]$$$ (the empty sequence) are the only ones with this score. Thus, the cost of $$$[1]$$$ is $$$1$$$. <\/li><li> The maximum score among the subsequences of $$$[1, 2]$$$ is $$$2$$$. The only subsequence with this score is $$$[2]$$$. Thus, the cost of $$$[1, 2]$$$ is $$$1$$$. <\/li><li> The maximum score among the subsequences of $$$[1, 2, 3]$$$ is $$$3$$$. The subsequences $$$[2, 3]$$$ and $$$[3]$$$ are the only ones with this score. Thus, the cost of $$$[1, 2, 3]$$$ is $$$2$$$. <\/li><\/ul> Therefore, the answer to this case is $$$1\\:\\:1\\:\\:2$$$, which are the costs of $$$[1], [1, 2]$$$ and $$$[1, 2, 3]$$$ in this order.<\/div><\/div>"}, {"contestId": 1178, "index": "B", "name": "WOW Factor", "rating": 1300, "solvedCount": 23477, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. WOW Factor<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Recall that string $$$a$$$ is a subsequence of a string $$$b$$$ if $$$a$$$ can be obtained from $$$b$$$ by deletion of several (possibly zero or all) characters. For example, for the string $$$a$$$=\"<span class=\"tex-font-style-tt\">wowwo<\/span>\", the following strings are subsequences: \"<span class=\"tex-font-style-tt\">wowwo<\/span>\", \"<span class=\"tex-font-style-tt\">wowo<\/span>\", \"<span class=\"tex-font-style-tt\">oo<\/span>\", \"<span class=\"tex-font-style-tt\">wow<\/span>\", \"\", and others, but the following are not subsequences: \"<span class=\"tex-font-style-tt\">owoo<\/span>\", \"<span class=\"tex-font-style-tt\">owwwo<\/span>\", \"<span class=\"tex-font-style-tt\">ooo<\/span>\".<\/p><p>The <span class=\"tex-font-style-it\">wow factor<\/span> of a string is the number of its subsequences equal to the word \"<span class=\"tex-font-style-tt\">wow<\/span>\". Bob wants to write a string that has a large <span class=\"tex-font-style-it\">wow factor<\/span>. However, the \"<span class=\"tex-font-style-tt\">w<\/span>\" key on his keyboard is broken, so he types two \"<span class=\"tex-font-style-tt\">v<\/span>\"s instead. <\/p><p>Little did he realise that he may have introduced more \"<span class=\"tex-font-style-tt\">w<\/span>\"s than he thought. Consider for instance the string \"<span class=\"tex-font-style-tt\">ww<\/span>\". Bob would type it as \"<span class=\"tex-font-style-tt\">vvvv<\/span>\", but this string actually contains three occurrences of \"<span class=\"tex-font-style-tt\">w<\/span>\": <\/p><ul> <li> \"<span class=\"tex-font-style-tt\"><span class=\"tex-font-style-underline\"><span class=\"tex-font-style-bf\">vv<\/span><\/span>vv<\/span>\" <\/li><li> \"<span class=\"tex-font-style-tt\">v<span class=\"tex-font-style-underline\"><span class=\"tex-font-style-bf\">vv<\/span><\/span>v<\/span>\" <\/li><li> \"<span class=\"tex-font-style-tt\">vv<span class=\"tex-font-style-underline\"><span class=\"tex-font-style-bf\">vv<\/span><\/span><\/span>\" <\/li><\/ul><p>For example, the <span class=\"tex-font-style-it\">wow factor<\/span> of the word \"<span class=\"tex-font-style-tt\">vvvovvv<\/span>\" equals to four because there are four <span class=\"tex-font-style-it\">wow<\/span>s:<\/p><ul> <li> \"<span class=\"tex-font-style-tt\"><span class=\"tex-font-style-underline\"><span class=\"tex-font-style-bf\">vv<\/span><\/span>v<span class=\"tex-font-style-underline\"><span class=\"tex-font-style-bf\">o<\/span><span class=\"tex-font-style-bf\">vv<\/span><\/span>v<\/span>\" <\/li><li> \"<span class=\"tex-font-style-tt\"><span class=\"tex-font-style-underline\"><span class=\"tex-font-style-bf\">vv<\/span><\/span>v<span class=\"tex-font-style-underline\"><span class=\"tex-font-style-bf\">o<\/span><\/span>v<span class=\"tex-font-style-underline\"><span class=\"tex-font-style-bf\">vv<\/span><\/span><\/span>\" <\/li><li> \"<span class=\"tex-font-style-tt\">v<span class=\"tex-font-style-underline\"><span class=\"tex-font-style-bf\">vv<\/span><span class=\"tex-font-style-bf\">o<\/span><span class=\"tex-font-style-bf\">vv<\/span><\/span>v<\/span>\" <\/li><li> \"<span class=\"tex-font-style-tt\">v<span class=\"tex-font-style-underline\"><span class=\"tex-font-style-bf\">vv<\/span><span class=\"tex-font-style-bf\">o<\/span><\/span>v<span class=\"tex-font-style-underline\"><span class=\"tex-font-style-bf\">vv<\/span><\/span><\/span>\" <\/li><\/ul><p>Note that the subsequence \"<span class=\"tex-font-style-tt\"><span class=\"tex-font-style-underline\"><span class=\"tex-font-style-bf\">v<\/span><\/span>v<span class=\"tex-font-style-underline\"><span class=\"tex-font-style-bf\">v<\/span><span class=\"tex-font-style-bf\">o<\/span><span class=\"tex-font-style-bf\">vv<\/span><\/span>v<\/span>\" does not count towards the <span class=\"tex-font-style-it\">wow factor<\/span>, as the \"<span class=\"tex-font-style-tt\">v<\/span>\"s have to be consecutive.<\/p><p>For a given string $$$s$$$, compute and output its <span class=\"tex-font-style-it\">wow factor<\/span>. Note that it is <span class=\"tex-font-style-bf\">not<\/span> guaranteed that it is possible to get $$$s$$$ from another string replacing \"<span class=\"tex-font-style-tt\">w<\/span>\" with \"<span class=\"tex-font-style-tt\">vv<\/span>\". For example, $$$s$$$ can be equal to \"<span class=\"tex-font-style-tt\">vov<\/span>\".<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The input contains a single non-empty string $$$s$$$, consisting only of characters \"<span class=\"tex-font-style-tt\">v<\/span>\" and \"<span class=\"tex-font-style-tt\">o<\/span>\". The length of $$$s$$$ is at most $$$10^6$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output a single integer, the <span class=\"tex-font-style-it\">wow factor<\/span> of $$$s$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\nvvvovvv\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\nvvovooovovvovoovoovvvvovovvvov\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n100\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The first example is explained in the legend.<\/p><\/div><\/div>"}, {"contestId": 1561, "index": "C", "name": "Deep Down Below", "rating": 1300, "solvedCount": 23346, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Deep Down Below<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>In a certain video game, the player controls a hero characterized by a single integer value: <span class=\"tex-font-style-it\">power<\/span>. The hero will have to beat monsters that are also characterized by a single integer value: <span class=\"tex-font-style-it\">armor<\/span>.<\/p><p>On the current level, the hero is facing $$$n$$$ caves. To pass the level, the hero must enter all the caves in some order, each cave exactly once, and exit every cave safe and sound. When the hero enters cave $$$i$$$, he will have to fight $$$k_i$$$ monsters in a row: first a monster with armor $$$a_{i, 1}$$$, then a monster with armor $$$a_{i, 2}$$$ and so on, finally, a monster with armor $$$a_{i, k_i}$$$.<\/p><p>The hero can beat a monster if and only if the hero's power is strictly greater than the monster's armor. If the hero can't beat the monster he's fighting, the game ends and the player loses. Note that once the hero enters a cave, he can't exit it before he fights all the monsters in it, strictly in the given order.<\/p><p>Each time the hero beats a monster, the hero's power increases by $$$1$$$.<\/p><p>Find the smallest possible power the hero must start the level with to be able to enter all the caves in some order and beat all the monsters.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^5$$$). Description of the test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 10^5$$$)\u00a0\u2014 the number of caves.<\/p><p>The $$$i$$$-th of the next $$$n$$$ lines contains an integer $$$k_i$$$ ($$$1 \\le k_i \\le 10^5$$$)\u00a0\u2014 the number of monsters in the $$$i$$$-th cave, followed by $$$k_i$$$ integers $$$a_{i, 1}, a_{i, 2}, \\ldots, a_{i, k_i}$$$ ($$$1 \\le a_{i, j} \\le 10^9$$$)\u00a0\u2014 armor levels of the monsters in cave $$$i$$$ in order the hero has to fight them.<\/p><p>It is guaranteed that the sum of $$$k_i$$$ over all test cases does not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case print a single integer\u00a0\u2014 the smallest possible power the hero must start the level with to be able to enter all the caves in some order and beat all the monsters.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n1\n1 42\n2\n3 10 15 8\n2 12 11\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n43\n13\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the hero has to beat a single monster with armor $$$42$$$, it's enough to have power $$$43$$$ to achieve that.<\/p><p>In the second test case, the hero can pass the level with initial power $$$13$$$ as follows: <\/p><ul> <li> enter cave $$$2$$$: <ul> <li> beat a monster with armor $$$12$$$, power increases to $$$14$$$; <\/li><li> beat a monster with armor $$$11$$$, power increases to $$$15$$$; <\/li><\/ul> <\/li><li> enter cave $$$1$$$: <ul> <li> beat a monster with armor $$$10$$$, power increases to $$$16$$$; <\/li><li> beat a monster with armor $$$15$$$, power increases to $$$17$$$; <\/li><li> beat a monster with armor $$$8$$$, power increases to $$$18$$$. <\/li><\/ul> <\/li><\/ul><\/div><\/div>"}, {"contestId": 1521, "index": "B", "name": "Nastia and a Good Array", "rating": 1300, "solvedCount": 23252, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Nastia and a Good Array<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-it\">Nastia has received an array of $$$n$$$ positive integers as a gift<\/span>.<\/p><p>She calls such an array $$$a$$$ good that for all $$$i$$$ ($$$2 \\le i \\le n$$$) takes place $$$gcd(a_{i - 1}, a_{i}) = 1$$$, where $$$gcd(u, v)$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Greatest_common_divisor\">greatest common divisor (GCD)<\/a> of integers $$$u$$$ and $$$v$$$.<\/p><p>You can perform the operation: select two <span class=\"tex-font-style-bf\">different<\/span> indices $$$i, j$$$ ($$$1 \\le i, j \\le n$$$, $$$i \\neq j$$$) and two integers $$$x, y$$$ ($$$1 \\le x, y \\le 2 \\cdot 10^9$$$) so that $$$\\min{(a_i, a_j)} = \\min{(x, y)}$$$. Then change $$$a_i$$$ to $$$x$$$ and $$$a_j$$$ to $$$y$$$.<\/p><p>The girl asks you to make the array good using <span class=\"tex-font-style-bf\">at most<\/span> $$$n$$$ operations.<\/p><p>It can be proven that this is always possible.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10\\,000$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 10^5$$$)\u00a0\u2014 the length of the array.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_{n}$$$ ($$$1 \\le a_i \\le 10^9$$$)\u00a0\u2014 the array which Nastia has received as a gift.<\/p><p>It's guaranteed that the sum of $$$n$$$ in one test doesn't exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each of $$$t$$$ test cases print a single integer $$$k$$$ ($$$0 \\le k \\le n$$$)\u00a0\u2014 the number of operations. You don't need to minimize this number.<\/p><p>In each of the next $$$k$$$ lines print $$$4$$$ integers $$$i$$$, $$$j$$$, $$$x$$$, $$$y$$$ ($$$1 \\le i \\neq j \\le n$$$, $$$1 \\le x, y \\le 2 \\cdot 10^9$$$) so that $$$\\min{(a_i, a_j)} = \\min{(x, y)}$$$\u00a0\u2014 in this manner you replace $$$a_i$$$ with $$$x$$$ and $$$a_j$$$ with $$$y$$$.<\/p><p>If there are multiple answers, print any.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n5\n9 6 3 11 15\n3\n7 5 13\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n1 5 11 9\n2 5 7 6\n0<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Consider the first test case.<\/p><p>Initially $$$a = [9, 6, 3, 11, 15]$$$.<\/p><p>In the first operation replace $$$a_1$$$ with $$$11$$$ and $$$a_5$$$ with $$$9$$$. It's valid, because $$$\\min{(a_1, a_5)} = \\min{(11, 9)} = 9$$$.<\/p><p>After this $$$a = [11, 6, 3, 11, 9]$$$.<\/p><p>In the second operation replace $$$a_2$$$ with $$$7$$$ and $$$a_5$$$ with $$$6$$$. It's valid, because $$$\\min{(a_2, a_5)} = \\min{(7, 6)} = 6$$$.<\/p><p>After this $$$a = [11, 7, 3, 11, 6]$$$\u00a0\u2014 a good array.<\/p><p>In the second test case, the initial array is already good.<\/p><\/div><\/div>"}, {"contestId": 1601, "index": "A", "name": "Array Elimination", "rating": 1300, "solvedCount": 22811, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. Array Elimination<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given array $$$a_1, a_2, \\ldots, a_n$$$, consisting of non-negative integers.<\/p><p>Let's define operation of \"elimination\" with integer parameter $$$k$$$ ($$$1 \\leq k \\leq n$$$) as follows:<\/p><ul> <li> Choose $$$k$$$ distinct array indices $$$1 \\leq i_1  \\lt  i_2  \\lt  \\ldots  \\lt  i_k \\le n$$$. <\/li><li> Calculate $$$x = a_{i_1} ~ \\&amp; ~ a_{i_2} ~ \\&amp; ~ \\ldots ~ \\&amp; ~ a_{i_k}$$$, where $$$\\&amp;$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#AND\">bitwise AND operation<\/a> (notes section contains formal definition). <\/li><li> Subtract $$$x$$$ from each of $$$a_{i_1}, a_{i_2}, \\ldots, a_{i_k}$$$; all other elements remain untouched. <\/li><\/ul><p>Find all possible values of $$$k$$$, such that it's possible to make all elements of array $$$a$$$ equal to $$$0$$$ using a finite number of elimination operations with parameter $$$k$$$. It can be proven that exists at least one possible $$$k$$$ for any array $$$a$$$.<\/p><p>Note that you <span class=\"tex-font-style-bf\">firstly choose $$$k$$$ and only after that perform elimination operations with value $$$k$$$ you've chosen initially<\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\leq t \\leq 10^4$$$). Description of the test cases follows.<\/p><p>The first line of each test case contains one integer $$$n$$$ ($$$1 \\leq n \\leq 200\\,000$$$)\u00a0\u2014 the length of array $$$a$$$.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$0 \\leq a_i  \\lt  2^{30}$$$)\u00a0\u2014 array $$$a$$$ itself.<\/p><p>It's guaranteed that the sum of $$$n$$$ over all test cases doesn't exceed $$$200\\,000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print all values $$$k$$$, such that it's possible to make all elements of $$$a$$$ equal to $$$0$$$ in a finite number of elimination operations with the given parameter $$$k$$$.<\/p><p><span class=\"tex-font-style-bf\">Print them in increasing order.<\/span><\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n4\n4 4 4 4\n4\n13 7 25 19\n6\n3 5 3 1 7 1\n1\n1\n5\n0 0 0 0 0\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 2 4\n1 2\n1\n1\n1 2 3 4 5\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case:<\/p><ul> <li> If $$$k = 1$$$, we can make four elimination operations with sets of indices $$$\\{1\\}$$$, $$$\\{2\\}$$$, $$$\\{3\\}$$$, $$$\\{4\\}$$$. Since $$$\\&amp;$$$ of one element is equal to the element itself, then for each operation $$$x = a_i$$$, so $$$a_i - x = a_i - a_i = 0$$$. <\/li><li> If $$$k = 2$$$, we can make two elimination operations with, for example, sets of indices $$$\\{1, 3\\}$$$ and $$$\\{2, 4\\}$$$: $$$x = a_1 ~ \\&amp; ~ a_3$$$ $$$=$$$ $$$a_2 ~ \\&amp; ~ a_4$$$ $$$=$$$ $$$4 ~ \\&amp; ~ 4 = 4$$$. For both operations $$$x = 4$$$, so after the first operation $$$a_1 - x = 0$$$ and $$$a_3 - x = 0$$$, and after the second operation\u00a0\u2014 $$$a_2 - x = 0$$$ and $$$a_4 - x = 0$$$. <\/li><li> If $$$k = 3$$$, it's impossible to make all $$$a_i$$$ equal to $$$0$$$. After performing the first operation, we'll get three elements equal to $$$0$$$ and one equal to $$$4$$$. After that, all elimination operations won't change anything, since at least one chosen element will always be equal to $$$0$$$. <\/li><li> If $$$k = 4$$$, we can make one operation with set $$$\\{1, 2, 3, 4\\}$$$, because $$$x = a_1 ~ \\&amp; ~ a_2 ~ \\&amp; ~ a_3 ~ \\&amp; ~ a_4$$$ $$$= 4$$$. <\/li><\/ul><p>In the second test case, if $$$k = 2$$$ then we can make the following elimination operations:<\/p><ul> <li> Operation with indices $$$\\{1, 3\\}$$$: $$$x = a_1 ~ \\&amp; ~ a_3$$$ $$$=$$$ $$$13 ~ \\&amp; ~ 25 = 9$$$. $$$a_1 - x = 13 - 9 = 4$$$ and $$$a_3 - x = 25 - 9 = 16$$$. Array $$$a$$$ will become equal to $$$[4, 7, 16, 19]$$$. <\/li><li> Operation with indices $$$\\{3, 4\\}$$$: $$$x = a_3 ~ \\&amp; ~ a_4$$$ $$$=$$$ $$$16 ~ \\&amp; ~ 19 = 16$$$. $$$a_3 - x = 16 - 16 = 0$$$ and $$$a_4 - x = 19 - 16 = 3$$$. Array $$$a$$$ will become equal to $$$[4, 7, 0, 3]$$$. <\/li><li> Operation with indices $$$\\{2, 4\\}$$$: $$$x = a_2 ~ \\&amp; ~ a_4$$$ $$$=$$$ $$$7 ~ \\&amp; ~ 3 = 3$$$. $$$a_2 - x = 7 - 3 = 4$$$ and $$$a_4 - x = 3 - 3 = 0$$$. Array $$$a$$$ will become equal to $$$[4, 4, 0, 0]$$$. <\/li><li> Operation with indices $$$\\{1, 2\\}$$$: $$$x = a_1 ~ \\&amp; ~ a_2$$$ $$$=$$$ $$$4 ~ \\&amp; ~ 4 = 4$$$. $$$a_1 - x = 4 - 4 = 0$$$ and $$$a_2 - x = 4 - 4 = 0$$$. Array $$$a$$$ will become equal to $$$[0, 0, 0, 0]$$$. <\/li><\/ul><p><span class=\"tex-font-style-bf\">Formal definition of bitwise AND:<\/span><\/p><p>Let's define bitwise AND ($$$\\&amp;$$$) as follows. Suppose we have two non-negative integers $$$x$$$ and $$$y$$$, let's look at their binary representations (possibly, with leading zeroes): $$$x_k \\dots x_2 x_1 x_0$$$ and $$$y_k \\dots y_2 y_1 y_0$$$. Here, $$$x_i$$$ is the $$$i$$$-th bit of number $$$x$$$, and $$$y_i$$$ is the $$$i$$$-th bit of number $$$y$$$. Let $$$r = x ~ \\&amp; ~ y$$$ is a result of operation $$$\\&amp;$$$ on number $$$x$$$ and $$$y$$$. Then binary representation of $$$r$$$ will be $$$r_k \\dots r_2 r_1 r_0$$$, where:<\/p><p>$$$$$$ r_i = \\begin{cases} 1, ~ \\text{if} ~ x_i = 1 ~ \\text{and} ~ y_i = 1 \\\\ 0, ~ \\text{if} ~ x_i = 0 ~ \\text{or} ~ y_i = 0 \\end{cases} $$$$$$<\/p><\/div><\/div>"}, {"contestId": 1454, "index": "D", "name": "Number into Sequence", "rating": 1300, "solvedCount": 22652, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Number into Sequence<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an integer $$$n$$$ ($$$n  \\gt  1$$$).<\/p><p>Your task is to find a sequence of integers $$$a_1, a_2, \\ldots, a_k$$$ such that:<\/p><ul> <li> each $$$a_i$$$ is strictly greater than $$$1$$$; <\/li><li> $$$a_1 \\cdot a_2 \\cdot \\ldots \\cdot a_k = n$$$ (i.\u00a0e. the product of this sequence is $$$n$$$); <\/li><li> $$$a_{i + 1}$$$ is divisible by $$$a_i$$$ for each $$$i$$$ from $$$1$$$ to $$$k-1$$$; <\/li><li> $$$k$$$ is the <span class=\"tex-font-style-bf\">maximum<\/span> possible (i.\u00a0e. the length of this sequence is the <span class=\"tex-font-style-bf\">maximum<\/span> possible). <\/li><\/ul><p>If there are several such sequences, any of them is acceptable. It can be proven that at least one valid sequence always exists for any integer $$$n  \\gt  1$$$.<\/p><p>You have to answer $$$t$$$ independent test cases.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains one integer $$$t$$$ ($$$1 \\le t \\le 5000$$$) \u2014 the number of test cases. Then $$$t$$$ test cases follow.<\/p><p>The only line of the test case contains one integer $$$n$$$ ($$$2 \\le n \\le 10^{10}$$$).<\/p><p>It is guaranteed that the sum of $$$n$$$ does not exceed $$$10^{10}$$$ ($$$\\sum n \\le 10^{10}$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print the answer: in the first line, print one positive integer $$$k$$$ \u2014 the <span class=\"tex-font-style-bf\">maximum<\/span> possible length of $$$a$$$. In the second line, print $$$k$$$ integers $$$a_1, a_2, \\ldots, a_k$$$ \u2014 the sequence of length $$$k$$$ satisfying the conditions from the problem statement.<\/p><p>If there are several answers, you can print any. It can be proven that at least one valid sequence always exists for any integer $$$n  \\gt  1$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n2\n360\n4999999937\n4998207083\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n2 \n3\n2 2 90 \n1\n4999999937 \n1\n4998207083 \n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1829, "index": "F", "name": "Forever Winter", "rating": 1300, "solvedCount": 22624, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Forever Winter<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>A <span class=\"tex-font-style-it\">snowflake<\/span> graph is generated from two integers $$$x$$$ and $$$y$$$, both greater than $$$1$$$, as follows: <\/p><ul> <li> Start with one central vertex. <\/li><li> Connect $$$x$$$ new vertices to this central vertex. <\/li><li> Connect $$$y$$$ new vertices to <span class=\"tex-font-style-bf\">each<\/span> of these $$$x$$$ vertices. <\/li><\/ul> For example, below is a snowflake graph for $$$x=5$$$ and $$$y=3$$$. <center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/9f2183c62c4c713927bb18746d1f5455da90f612.png\" style=\"zoom: 75.0%;max-width: 100.0%;max-height: 100.0%;\"/><p><span class=\"tex-font-size-small\">The snowflake graph above has a central vertex $$$15$$$, then $$$x=5$$$ vertices attached to it ($$$3$$$, $$$6$$$, $$$7$$$, $$$8$$$, and $$$20$$$), and then $$$y=3$$$ vertices attached to each of those.<\/span> <\/p><\/center> Given a snowflake graph, determine the values of $$$x$$$ and $$$y$$$.<\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 1000$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$m$$$ ($$$2 \\leq n \\leq 200$$$; $$$1 \\leq m \\leq \\min\\left(1000, \\frac{n(n-1)}{2}\\right)$$$)\u00a0\u2014 the number of vertices and edges in the graph, respectively.<\/p><p>The next $$$m$$$ lines each contain two integers each $$$u$$$ and $$$v$$$ ($$$1 \\leq u, v \\leq n$$$, $$$u \\neq v$$$)\u00a0\u2014 the numbers of vertices connected by an edge. The graph does not contain multiple edges and self-loops.<\/p><p><span class=\"tex-font-style-bf\">It is guaranteed that this graph is a snowflake graph for some integers $$$x$$$ and $$$y$$$ both greater than $$$1$$$.<\/span><\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, on a separate line output the values of $$$x$$$ and $$$y$$$, in that order, separated by a space.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">21 20<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">21 20<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 20<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">13 20<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">11 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">10 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">19 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">14 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">9 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">12 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">17 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">18 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">16 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">6 15<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">7 15<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">8 15<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">20 15<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 15<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">7 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">9 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">9 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 8<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5 3\n2 2\n2 3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The first test case is pictured in the statement. Note that the output <span class=\"tex-font-style-tt\">3 5<\/span> is <span class=\"tex-font-style-bf\">incorrect<\/span>, since $$$x$$$ should be output before $$$y$$$.<\/p><\/div><\/div>"}, {"contestId": 1922, "index": "C", "name": "Closest Cities", "rating": 1300, "solvedCount": 22554, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Closest Cities<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are $$$n$$$ cities located on the number line, the $$$i$$$-th city is in the point $$$a_i$$$. The coordinates of the cities are given in ascending order, so $$$a_1  \\lt  a_2  \\lt  \\dots  \\lt  a_n$$$.<\/p><p>The distance between two cities $$$x$$$ and $$$y$$$ is equal to $$$|a_x - a_y|$$$.<\/p><p>For each city $$$i$$$, let's define the <span class=\"tex-font-style-bf\">closest<\/span> city $$$j$$$ as the city such that the distance between $$$i$$$ and $$$j$$$ is not greater than the distance between $$$i$$$ and each other city $$$k$$$. For example, if the cities are located in points $$$[0, 8, 12, 15, 20]$$$, then:<\/p><ul> <li> the closest city to the city $$$1$$$ is the city $$$2$$$; <\/li><li> the closest city to the city $$$2$$$ is the city $$$3$$$; <\/li><li> the closest city to the city $$$3$$$ is the city $$$4$$$; <\/li><li> the closest city to the city $$$4$$$ is the city $$$3$$$; <\/li><li> the closest city to the city $$$5$$$ is the city $$$4$$$. <\/li><\/ul><p>The cities are located in such a way that for every city, the closest city is unique. For example, it is impossible for the cities to be situated in points $$$[1, 2, 3]$$$, since this would mean that the city $$$2$$$ has two closest cities ($$$1$$$ and $$$3$$$, both having distance $$$1$$$).<\/p><p>You can travel between cities. Suppose you are currently in the city $$$x$$$. Then you can perform one of the following actions:<\/p><ul> <li> travel to any other city $$$y$$$, paying $$$|a_x - a_y|$$$ coins; <\/li><li> travel to the city which is the closest to $$$x$$$, paying $$$1$$$ coin. <\/li><\/ul><p>You are given $$$m$$$ queries. In each query, you will be given two cities, and you have to calculate the minimum number of coins you have to spend to travel from one city to the other city.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$) \u2014 the number of test cases.<\/p><p>Each test case is given in the following format:<\/p><ul> <li> the first line contains one integer $$$n$$$ ($$$2 \\le n \\le 10^5$$$); <\/li><li> the second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$0 \\le a_1  \\lt  a_2  \\lt  \\dots  \\lt  a_n \\le 10^9$$$); <\/li><li> the third line contains one integer $$$m$$$ ($$$1 \\le m \\le 10^5$$$); <\/li><li> then $$$m$$$ lines follow; the $$$i$$$-th of them contains two integers $$$x_i$$$ and $$$y_i$$$ ($$$1 \\le x_i, y_i \\le n$$$; $$$x_i \\ne y_i$$$), denoting that in the $$$i$$$-th query, you have to calculate the minimum number of coins you have to spend to travel from the city $$$x_i$$$ to the city $$$y_i$$$. <\/li><\/ul><p>Additional constraints on the input:<\/p><ul> <li> in every test case, for each city, the closest city is determined uniquely; <\/li><li> the sum of $$$n$$$ over all test cases does not exceed $$$10^5$$$; <\/li><li> the sum of $$$m$$$ over all test cases does not exceed $$$10^5$$$. <\/li><\/ul><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query, print one integer \u2014 the minimum number of coins you have to spend.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">0 8 12 15 20<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n8\n1\n4\n14\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Let's consider the first two queries in the example from the statement:<\/p><ul> <li> in the first query, you are initially in the city $$$1$$$. You can travel to the closest city (which is the city $$$2$$$), paying $$$1$$$ coin. Then you travel to the closest city (which is the city $$$3$$$) again, paying $$$1$$$ coin. Then you travel to the closest city (which is the city $$$4$$$) again, paying $$$1$$$ coin. In total, you spend $$$3$$$ coins to get from the city $$$1$$$ to the city $$$4$$$; <\/li><li> in the second query, you can use the same way to get from the city $$$1$$$ to the city $$$4$$$, and then spend $$$5$$$ coins to travel from the city $$$4$$$ to the city $$$5$$$. <\/li><\/ul><\/div><\/div>"}, {"contestId": 1459, "index": "B", "name": "Move and Turn", "rating": 1300, "solvedCount": 22464, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Move and Turn<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>A robot is standing at the origin of the infinite two-dimensional plane. Each second the robot moves exactly $$$1$$$ meter in one of the four cardinal directions: north, south, west, and east. For the first step the robot <span class=\"tex-font-style-bf\">can choose any of the four directions<\/span>, but then at the end of every second it <span class=\"tex-font-style-bf\">has to turn<\/span> 90 degrees left or right with respect to the direction it just moved in. For example, if the robot has just moved north or south, the next step it takes has to be either west or east, and vice versa.<\/p><p>The robot makes <span class=\"tex-font-style-bf\">exactly<\/span> $$$n$$$ steps from its starting position according to the rules above. How many different points can the robot arrive to at the end? The final orientation of the robot can be ignored.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line contains a single integer $$$n$$$ ($$$1 \\leq n \\leq 1000$$$)\u00a0\u2014 the number of steps the robot makes.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer\u00a0\u2014 the number of different possible locations after <span class=\"tex-font-style-bf\">exactly<\/span> $$$n$$$ steps.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n12\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample case, the robot will end up 1 meter north, south, west, or east depending on its initial direction.<\/p><p>In the second sample case, the robot will always end up $$$\\sqrt{2}$$$ meters north-west, north-east, south-west, or south-east.<\/p><\/div><\/div>"}, {"contestId": 1775, "index": "B", "name": "Gardener and the Array", "rating": 1300, "solvedCount": 22461, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Gardener and the Array<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>The gardener Kazimir Kazimirovich has an array of $$$n$$$ integers $$$c_1, c_2, \\dots, c_n$$$.<\/p><p>He wants to check if there are two different subsequences $$$a$$$ and $$$b$$$ of the original array, for which $$$f(a) = f(b)$$$, where $$$f(x)$$$ is the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#OR\">bitwise OR<\/a> of all of the numbers in the sequence $$$x$$$.<\/p><p>A sequence $$$q$$$ is a subsequence of $$$p$$$ if $$$q$$$ can be obtained from $$$p$$$ by deleting several (possibly none or all) elements.<\/p><p>Two subsequences are considered different if the sets of indexes of their elements in the original sequence are different, that is, the values of the elements are not considered when comparing the subsequences.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/1b2c9f7f30c1da5f3323946441cf37988d22ee3a.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^5$$$). The description of the test cases follows.<\/p><p>The first line of each test case contains one integer $$$n$$$ ($$$1 \\le n \\le 10^5$$$)\u00a0\u2014 the size of the array $$$c$$$.<\/p><p>The description of the array $$$c$$$ in this problem is given implicitly to speed up input.<\/p><p>The $$$(i + 1)$$$-st of the following $$$n$$$ lines of the test case begins with an integer $$$k_i$$$ ($$$1 \\le k_i \\le 10^5$$$)\u00a0\u2014 the number of set bits in the number $$$c_i$$$. Next follow $$$k_i$$$ distinct integers $$$p_{i, 1}, p_{i, 2}, \\dots, p_{i, k_i}$$$ ($$$1 \\le p_i \\le 2 \\cdot 10^5$$$)\u00a0\u2014the numbers of bits that are set to one in number $$$c_i$$$. In other words, $$$c_i = 2^{p_{i, 1}} + 2^{p_{i, 2}} + \\ldots + 2^{p_{i, k_i}}$$$.<\/p><p>It is guaranteed that the total sum of $$$k_i$$$ in all tests does not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each set of input, print \"<span class=\"tex-font-style-tt\">Yes<\/span>\" if there exist two different subsequences for which $$$f(a) = f(b)$$$, and \"<span class=\"tex-font-style-tt\">No<\/span>\" otherwise.<\/p><p>You can output the answer in any case (upper or lower). For example, the strings \"<span class=\"tex-font-style-tt\">yEs<\/span>\", \"<span class=\"tex-font-style-tt\">yes<\/span>\", \"<span class=\"tex-font-style-tt\">Yes<\/span>\", and \"<span class=\"tex-font-style-tt\">YES<\/span>\" will be recognized as positive responses.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 1 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 1 2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 1 2 5 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 2 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 3 1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 2 5 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 7 2 3 1 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 1 2 6 3 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 2 6 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nNo\nYes\nYes\nYes\nNo\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>It can be proven that in the first test case there are no two different subsequences $$$a$$$ and $$$b$$$ for which $$$f(a) = f(b)$$$.<\/p><p>In the second test case, one of the possible answers are following subsequences: the subsequence $$$a$$$ formed by the element at position $$$1$$$, and the subsequence $$$b$$$ formed by the elements at positions $$$1$$$ and $$$2$$$.<\/p><p>In the third test case, one of the possible answers are following subsequences: the subsequence $$$a$$$ formed by elements at positions $$$1$$$, $$$2$$$, $$$3$$$ and $$$4$$$, and the subsequence $$$b$$$ formed by elements at positions $$$2$$$, $$$3$$$ and $$$4$$$.<\/p><\/div><\/div>"}, {"contestId": 1660, "index": "C", "name": "Get an Even String", "rating": 1300, "solvedCount": 22367, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Get an Even String<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>A string $$$a=a_1a_2\\dots a_n$$$ is called <span class=\"tex-font-style-it\">even<\/span> if it consists of a concatenation (joining) of strings of length $$$2$$$ consisting of the same characters. In other words, a string $$$a$$$ is even if two conditions are satisfied <span class=\"tex-font-style-bf\">at the same time<\/span>:<\/p><ul> <li> its length $$$n$$$ is even; <\/li><li> for all odd $$$i$$$ ($$$1 \\le i \\le n - 1$$$), $$$a_i = a_{i+1}$$$ is satisfied. <\/

<script>
    const PROBLEMS = [{"contestId": 4, "index": "C", "name": "Registration System", "rating": 1300, "solvedCount": 115295, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Registration system<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>64 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>A new e-mail service \"Berlandesk\" is going to be opened in Berland in the near future. The site administration wants to launch their project as soon as possible, that's why they ask you to help. You're suggested to implement the prototype of site registration system. The system should work on the following principle. <\/p><p>Each time a new user wants to register, he sends to the system a request with his <span class=\"tex-font-style-tt\">name<\/span>. If such a <span class=\"tex-font-style-tt\">name<\/span> does not exist in the system database, it is inserted into the database, and the user gets the response <span class=\"tex-font-style-tt\">OK<\/span>, confirming the successful registration. If the <span class=\"tex-font-style-tt\">name<\/span> already exists in the system database, the system makes up a new user name, sends it to the user as a prompt and <span class=\"tex-font-style-it\">also inserts the prompt into the database<\/span>. The new name is formed by the following rule. Numbers, starting with 1, are appended one after another to <span class=\"tex-font-style-tt\">name<\/span> (<span class=\"tex-font-style-tt\">name1<\/span>, <span class=\"tex-font-style-tt\">name2<\/span>, ...), among these numbers the least <span class=\"tex-span\"><i>i<\/i><\/span> is found so that <span class=\"tex-font-style-tt\">name<\/span><span class=\"tex-span\"><i>i<\/i><\/span> does not yet exist in the database.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains number <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>). The following <span class=\"tex-span\"><i>n<\/i><\/span> lines contain the requests to the system. Each request is a non-empty line, and consists of not more than 32 characters, which are all lowercase Latin letters.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>n<\/i><\/span> lines, which are system responses to the requests: <span class=\"tex-font-style-tt\">OK<\/span> in case of successful registration, or a prompt with a new name, if the requested name is already taken.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>abacaba<br/>acaba<br/>abacaba<br/>acab<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>OK<br/>OK<br/>abacaba1<br/>OK<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>6<br/>first<br/>first<br/>second<br/>second<br/>third<br/>third<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>OK<br/>first1<br/>OK<br/>second1<br/>OK<br/>third1<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 25, "index": "A", "name": "IQ test", "rating": 1300, "solvedCount": 107270, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. IQ test<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Bob is preparing to pass IQ test. The most frequent task in this test is to find out which one of the given <span class=\"tex-span\"><i>n<\/i><\/span> numbers differs from the others. Bob observed that one number usually differs from the others in evenness. Help Bob \u2014 to check his answers, he needs a program that among the given <span class=\"tex-span\"><i>n<\/i><\/span> numbers finds one that is different in evenness.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">3\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009100<\/span>) \u2014 amount of numbers in the task. The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> space-separated natural numbers, not exceeding 100. It is guaranteed, that exactly one of these numbers differs from the others in evenness.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output index of number that differs from the others in evenness. Numbers are numbered from 1 in the input order.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>2 4 7 8 10<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>1 2 1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 230, "index": "B", "name": "T-primes", "rating": 1300, "solvedCount": 101104, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. T-primes<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>We know that prime numbers are positive integers that have exactly two distinct positive divisors. Similarly, we'll call a positive integer <span class=\"tex-span\"><i>t<\/i><\/span> <span class=\"tex-font-style-underline\">\u0422-prime<\/span>, if <span class=\"tex-span\"><i>t<\/i><\/span> has exactly three distinct positive divisors.<\/p><p>You are given an array of <span class=\"tex-span\"><i>n<\/i><\/span> positive integers. For each of them determine whether it is \u0422-prime or not.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single positive integer, <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>), showing how many numbers are in the array. The next line contains <span class=\"tex-span\"><i>n<\/i><\/span> space-separated integers <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">12<\/sup><\/span>).<\/p><p>Please, do not use the <span class=\"tex-font-style-tt\">%lld<\/span> specifier to read or write 64-bit integers in \u0421++. It is advised to use the <span class=\"tex-font-style-tt\">cin<\/span>, <span class=\"tex-font-style-tt\">cout<\/span> streams or the <span class=\"tex-font-style-tt\">%I64d<\/span> specifier.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>n<\/i><\/span> lines: the <span class=\"tex-span\"><i>i<\/i><\/span>-th line should contain \"<span class=\"tex-font-style-tt\">YES<\/span>\" (without the quotes), if number <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is \u0422-prime, and \"<span class=\"tex-font-style-tt\">NO<\/span>\" (without the quotes), if it isn't.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>4 5 6<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/>NO<br/>NO<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The given test has three numbers. The first number 4 has exactly three divisors \u2014 1, 2 and 4, thus the answer for this number is \"<span class=\"tex-font-style-tt\">YES<\/span>\". The second number 5 has two divisors (1 and 5), and the third number 6 has four divisors (1, 2, 3, 6), hence the answer for them is \"<span class=\"tex-font-style-tt\">NO<\/span>\".<\/p><\/div><\/div>"}, {"contestId": 189, "index": "A", "name": "Cut Ribbon", "rating": 1300, "solvedCount": 84784, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. Cut Ribbon<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Polycarpus has a ribbon, its length is <span class=\"tex-span\"><i>n<\/i><\/span>. He wants to cut the ribbon in a way that fulfils the following two conditions: <\/p><ul> <li> After the cutting each ribbon piece should have length <span class=\"tex-span\"><i>a<\/i><\/span>, <span class=\"tex-span\"><i>b<\/i><\/span> or <span class=\"tex-span\"><i>c<\/i><\/span>. <\/li><li> After the cutting the number of ribbon pieces should be maximum. <\/li><\/ul><p>Help Polycarpus and find the number of ribbon pieces after the required cutting.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains four space-separated integers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>a<\/i><\/span>, <span class=\"tex-span\"><i>b<\/i><\/span> and <span class=\"tex-span\"><i>c<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>a<\/i>,\u2009<i>b<\/i>,\u2009<i>c<\/i>\u2009\u2264\u20094000)<\/span> \u2014 the length of the original ribbon and the acceptable lengths of the ribbon pieces after the cutting, correspondingly. The numbers <span class=\"tex-span\"><i>a<\/i><\/span>, <span class=\"tex-span\"><i>b<\/i><\/span> and <span class=\"tex-span\"><i>c<\/i><\/span> can coincide.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single number \u2014 the maximum possible number of ribbon pieces. It is guaranteed that at least one correct ribbon cutting exists.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 5 3 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>7 5 5 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example Polycarpus can cut the ribbon in such way: the first piece has length 2, the second piece has length 3.<\/p><p>In the second example Polycarpus can cut the ribbon in such way: the first piece has length 5, the second piece has length 2.<\/p><\/div><\/div>"}, {"contestId": 451, "index": "B", "name": "Sort the Array", "rating": 1300, "solvedCount": 54660, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Sort the Array<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Being a programmer, you like arrays a lot. For your birthday, your friends have given you an array <span class=\"tex-span\"><i>a<\/i><\/span> consisting of <span class=\"tex-span\"><i>n<\/i><\/span> <span class=\"tex-font-style-bf\">distinct<\/span> integers.<\/p><p>Unfortunately, the size of <span class=\"tex-span\"><i>a<\/i><\/span> is too small. You want a bigger array! Your friends agree to give you a bigger array, but only if you are able to answer the following question correctly: is it possible to sort the array <span class=\"tex-span\"><i>a<\/i><\/span> (in increasing order) by reversing <span class=\"tex-font-style-bf\">exactly one<\/span> segment of <span class=\"tex-span\"><i>a<\/i><\/span>? See definitions of segment and reversing in the notes.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains an integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the size of array <span class=\"tex-span\"><i>a<\/i><\/span>.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> distinct space-separated integers: <span class=\"tex-span\"><i>a<\/i>[1],\u2009<i>a<\/i>[2],\u2009...,\u2009<i>a<\/i>[<i>n<\/i>]<\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i>[<i>i<\/i>]\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print \"<span class=\"tex-font-style-tt\">yes<\/span>\" or \"<span class=\"tex-font-style-tt\">no<\/span>\" (without quotes), depending on the answer.<\/p><p>If your answer is \"<span class=\"tex-font-style-tt\">yes<\/span>\", then also print two space-separated integers denoting start and end (start must not be greater than end) indices of the segment to be reversed. If there are multiple ways of selecting these indices, print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>3 2 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>yes<br/>1 3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>2 1 3 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>yes<br/>1 2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>3 1 2 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>no<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/>1 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>yes<br/>1 1<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Sample 1. You can reverse the entire array to get <span class=\"tex-span\">[1,\u20092,\u20093]<\/span>, which is sorted.<\/p><p>Sample 3. No segment can be reversed such that the array will be sorted.<\/p><p><span class=\"tex-font-style-it\">Definitions<\/span><\/p><p>A segment <span class=\"tex-span\">[<i>l<\/i>,\u2009<i>r<\/i>]<\/span> of array <span class=\"tex-span\"><i>a<\/i><\/span> is the sequence <span class=\"tex-span\"><i>a<\/i>[<i>l<\/i>],\u2009<i>a<\/i>[<i>l<\/i>\u2009+\u20091],\u2009...,\u2009<i>a<\/i>[<i>r<\/i>]<\/span>.<\/p><p>If you have an array <span class=\"tex-span\"><i>a<\/i><\/span> of size <span class=\"tex-span\"><i>n<\/i><\/span> and you reverse its segment <span class=\"tex-span\">[<i>l<\/i>,\u2009<i>r<\/i>]<\/span>, the array will become:<\/p><p><span class=\"tex-span\"><i>a<\/i>[1],\u2009<i>a<\/i>[2],\u2009...,\u2009<i>a<\/i>[<i>l<\/i>\u2009-\u20092],\u2009<i>a<\/i>[<i>l<\/i>\u2009-\u20091],\u2009<i>a<\/i>[<i>r<\/i>],\u2009<i>a<\/i>[<i>r<\/i>\u2009-\u20091],\u2009...,\u2009<i>a<\/i>[<i>l<\/i>\u2009+\u20091],\u2009<i>a<\/i>[<i>l<\/i>],\u2009<i>a<\/i>[<i>r<\/i>\u2009+\u20091],\u2009<i>a<\/i>[<i>r<\/i>\u2009+\u20092],\u2009...,\u2009<i>a<\/i>[<i>n<\/i>\u2009-\u20091],\u2009<i>a<\/i>[<i>n<\/i>].<\/span><\/p><\/div><\/div>"}, {"contestId": 1294, "index": "C", "name": "Product of Three Numbers", "rating": 1300, "solvedCount": 49496, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Product of Three Numbers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given one integer number $$$n$$$. Find three <span class=\"tex-font-style-bf\">distinct integers<\/span> $$$a, b, c$$$ such that $$$2 \\le a, b, c$$$ and $$$a \\cdot b \\cdot c = n$$$ or say that it is impossible to do it.<\/p><p>If there are several answers, you can print any.<\/p><p>You have to answer $$$t$$$ independent test cases.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains one integer $$$t$$$ ($$$1 \\le t \\le 100$$$) \u2014 the number of test cases.<\/p><p>The next $$$n$$$ lines describe test cases. The $$$i$$$-th test case is given on a new line as one integer $$$n$$$ ($$$2 \\le n \\le 10^9$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print the answer on it. Print \"<span class=\"tex-font-style-tt\">NO<\/span>\" if it is impossible to represent $$$n$$$ as $$$a \\cdot b \\cdot c$$$ for some <span class=\"tex-font-style-bf\">distinct integers<\/span> $$$a, b, c$$$ such that $$$2 \\le a, b, c$$$.<\/p><p>Otherwise, print \"<span class=\"tex-font-style-tt\">YES<\/span>\" and <span class=\"tex-font-style-bf\">any<\/span> possible such representation.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n64\n32\n97\n2\n12345\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\n2 4 8 \nNO\nNO\nNO\nYES\n3 5 823 \n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 459, "index": "B", "name": "Pashmak and Flowers", "rating": 1300, "solvedCount": 49107, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Pashmak and Flowers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Pashmak decided to give Parmida a pair of flowers from the garden. There are <span class=\"tex-span\"><i>n<\/i><\/span> flowers in the garden and the <span class=\"tex-span\"><i>i<\/i><\/span>-th of them has a beauty number <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. Parmida is a very strange girl so she doesn't want to have the two most beautiful flowers necessarily. She wants to have those pairs of flowers that their beauty difference is maximal possible!<\/p><p>Your task is to write a program which calculates two things:<\/p><ol> <li> The maximum beauty difference of flowers that Pashmak can give to Parmida. <\/li><li> The number of ways that Pashmak can pick the flowers. Two ways are considered different if and only if there is at least one flower that is chosen in the first way and not chosen in the second way. <\/li><\/ol><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains <span class=\"tex-span\"><i>n<\/i><\/span> <span class=\"tex-span\">(2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20092\u00b710<sup class=\"upper-index\">5<\/sup>)<\/span>. In the next line there are <span class=\"tex-span\"><i>n<\/i><\/span> space-separated integers <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\">1<\/sub><\/span>, <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\">2<\/sub><\/span>, ..., <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup>)<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>The only line of output should contain two integers. The maximum beauty difference and the number of ways this may happen, respectively.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/>1 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1 1<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>1 4 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4 1<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>3 1 2 3 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2 4<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the third sample the maximum beauty difference is <span class=\"tex-span\">2<\/span> and there are <span class=\"tex-span\">4<\/span> ways to do this:<\/p><ol> <li> choosing the first and the second flowers; <\/li><li> choosing the first and the fifth flowers; <\/li><li> choosing the fourth and the second flowers; <\/li><li> choosing the fourth and the fifth flowers. <\/li><\/ol><\/div><\/div>"}, {"contestId": 1360, "index": "D", "name": "Buying Shovels", "rating": 1300, "solvedCount": 45676, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Buying Shovels<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Polycarp wants to buy <span class=\"tex-font-style-bf\">exactly<\/span> $$$n$$$ shovels. The shop sells packages with shovels. The store has $$$k$$$ types of packages: the package of the $$$i$$$-th type consists of exactly $$$i$$$ shovels ($$$1 \\le i \\le k$$$). The store has an infinite number of packages of each type.<\/p><p>Polycarp wants to choose <span class=\"tex-font-style-bf\">one<\/span> type of packages and then buy several (one or more) packages of this type. What is the smallest number of packages Polycarp will have to buy to get exactly $$$n$$$ shovels?<\/p><p>For example, if $$$n=8$$$ and $$$k=7$$$, then Polycarp will buy $$$2$$$ packages of $$$4$$$ shovels.<\/p><p>Help Polycarp find the minimum number of packages that he needs to buy, given that he: <\/p><ul> <li> will buy exactly $$$n$$$ shovels in total; <\/li><li> the sizes of <span class=\"tex-font-style-bf\">all<\/span> packages he will buy are all the same and the number of shovels in each package is an integer from $$$1$$$ to $$$k$$$, inclusive. <\/li><\/ul><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$t$$$ ($$$1 \\le t \\le 100$$$)\u00a0\u2014 the number of test cases in the input. Then, $$$t$$$ test cases follow, one per line.<\/p><p>Each test case consists of two positive integers $$$n$$$ ($$$1 \\le n \\le 10^9$$$) and $$$k$$$ ($$$1 \\le k \\le 10^9$$$)\u00a0\u2014 the number of shovels and the number of types of packages.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$t$$$ answers to the test cases. Each answer is a positive integer\u00a0\u2014 the minimum number of packages.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n8 7\n8 1\n6 10\n999999733 999999732\n999999733 999999733\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n8\n1\n999999733\n1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The answer to the first test case was explained in the statement.<\/p><p>In the second test case, there is only one way to buy $$$8$$$ shovels\u00a0\u2014 $$$8$$$ packages of one shovel.<\/p><p>In the third test case, you need to buy a $$$1$$$ package of $$$6$$$ shovels.<\/p><\/div><\/div>"}, {"contestId": 478, "index": "B", "name": "Random Teams", "rating": 1300, "solvedCount": 42326, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Random Teams<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p><span class=\"tex-span\"><i>n<\/i><\/span> participants of the competition were split into <span class=\"tex-span\"><i>m<\/i><\/span> teams in some manner so that each team has at least one participant. After the competition each pair of participants from the same team became friends.<\/p><p>Your task is to write a program that will find the minimum and the maximum number of pairs of friends that could have formed by the end of the competition.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line of input contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span>, separated by a single space (<span class=\"tex-span\">1\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) \u2014 the number of participants and the number of teams respectively. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>The only line of the output should contain two integers <span class=\"tex-span\"><i>k<\/i><sub class=\"lower-index\"><i>min<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>k<\/i><sub class=\"lower-index\"><i>max<\/i><\/sub><\/span> \u2014 the minimum possible number of pairs of friends and the maximum possible number of pairs of friends respectively.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>10 10<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1 1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>6 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3 6<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample all the participants get into one team, so there will be exactly ten pairs of friends.<\/p><p>In the second sample at any possible arrangement one team will always have two participants and the other team will always have one participant. Thus, the number of pairs of friends will always be equal to one.<\/p><p>In the third sample minimum number of newly formed friendships can be achieved if participants were split on teams consisting of <span class=\"tex-span\">2<\/span> people, maximum number can be achieved if participants were split on teams of <span class=\"tex-span\">1<\/span>, <span class=\"tex-span\">1<\/span> and <span class=\"tex-span\">4<\/span> people.<\/p><\/div><\/div>"}, {"contestId": 600, "index": "B", "name": "Queries about less or equal elements", "rating": 1300, "solvedCount": 41598, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Queries about less or equal elements<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given two arrays of integers <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span>. For each element of the second array <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span> you should find the number of elements in array <span class=\"tex-span\"><i>a<\/i><\/span> that are less than or equal to the value <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i>,\u2009<i>m<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>m<\/i>\u2009\u2264\u20092\u00b710<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the sizes of arrays <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span>.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers \u2014 the elements of array <span class=\"tex-span\"><i>a<\/i><\/span> (<span class=\"tex-span\">\u2009-\u200910<sup class=\"upper-index\">9<\/sup>\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>).<\/p><p>The third line contains <span class=\"tex-span\"><i>m<\/i><\/span> integers \u2014 the elements of array <span class=\"tex-span\"><i>b<\/i><\/span> (<span class=\"tex-span\">\u2009-\u200910<sup class=\"upper-index\">9<\/sup>\u2009\u2264\u2009<i>b<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>m<\/i><\/span> integers, separated by spaces: the <span class=\"tex-span\"><i>j<\/i><\/span>-th of which is equal to the number of such elements in array <span class=\"tex-span\"><i>a<\/i><\/span> that are less than or equal to the value <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 4<br/>1 3 5 7 9<br/>6 4 2 8<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3 2 1 4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 5<br/>1 2 1 2 5<br/>3 1 4 1 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4 2 4 2 5<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1372, "index": "B", "name": "Omkar and Last Class of Math", "rating": 1300, "solvedCount": 38610, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Omkar and Last Class of Math<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>In Omkar's last class of math, he learned about the least common multiple, or $$$LCM$$$. $$$LCM(a, b)$$$ is the smallest positive integer $$$x$$$ which is divisible by both $$$a$$$ and $$$b$$$.<\/p><p>Omkar, having a laudably curious mind, immediately thought of a problem involving the $$$LCM$$$ operation: given an integer $$$n$$$, find positive integers $$$a$$$ and $$$b$$$ such that $$$a + b = n$$$ and $$$LCM(a, b)$$$ is the minimum value possible.<\/p><p>Can you help Omkar solve his ludicrously challenging math problem?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\leq t \\leq 10$$$). Description of the test cases follows.<\/p><p>Each test case consists of a single integer $$$n$$$ ($$$2 \\leq n \\leq 10^{9}$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output two positive integers $$$a$$$ and $$$b$$$, such that $$$a + b = n$$$ and $$$LCM(a, b)$$$ is the minimum possible.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n4\n6\n9\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2 2\n3 3\n3 6\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first test case, the numbers we can choose are $$$1, 3$$$ or $$$2, 2$$$. $$$LCM(1, 3) = 3$$$ and $$$LCM(2, 2) = 2$$$, so we output $$$2 \\ 2$$$.<\/p><p>For the second test case, the numbers we can choose are $$$1, 5$$$, $$$2, 4$$$, or $$$3, 3$$$. $$$LCM(1, 5) = 5$$$, $$$LCM(2, 4) = 4$$$, and $$$LCM(3, 3) = 3$$$, so we output $$$3 \\ 3$$$.<\/p><p>For the third test case, $$$LCM(3, 6) = 6$$$. It can be shown that there are no other pairs of numbers which sum to $$$9$$$ that have a lower $$$LCM$$$.<\/p><\/div><\/div>"}, {"contestId": 476, "index": "B", "name": "Dreamoon and WiFi", "rating": 1300, "solvedCount": 38510, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Dreamoon and WiFi<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Dreamoon is standing at the position <span class=\"tex-span\">0<\/span> on a number line. Drazil is sending a list of commands through Wi-Fi to Dreamoon's smartphone and Dreamoon follows them.<\/p><p>Each command is one of the following two types: <\/p><ol> <li> Go 1 unit towards the positive direction, denoted as <span class=\"tex-font-style-tt\">'+'<\/span> <\/li><li> Go 1 unit towards the negative direction, denoted as <span class=\"tex-font-style-tt\">'-'<\/span> <\/li><\/ol><p>But the Wi-Fi condition is so poor that Dreamoon's smartphone reports some of the commands can't be recognized and Dreamoon knows that some of them might even be wrong though successfully recognized. Dreamoon decides to follow every recognized command and toss a fair coin to decide those unrecognized ones (that means, he moves to the <span class=\"tex-span\">1<\/span> unit to the negative or positive direction with the same probability <span class=\"tex-span\">0.5<\/span>). <\/p><p>You are given an original list of commands sent by Drazil and list received by Dreamoon. What is the probability that Dreamoon ends in the position originally supposed to be final by Drazil's commands?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a string <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\">1<\/sub><\/span> \u2014 the commands Drazil sends to Dreamoon, this string consists of only the characters in the set {<span class=\"tex-font-style-tt\">'+'<\/span>, <span class=\"tex-font-style-tt\">'-'<\/span>}. <\/p><p>The second line contains a string <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\">2<\/sub><\/span> \u2014 the commands Dreamoon's smartphone recognizes, this string consists of only the characters in the set {<span class=\"tex-font-style-tt\">'+'<\/span>, <span class=\"tex-font-style-tt\">'-'<\/span>, <span class=\"tex-font-style-tt\">'?'<\/span>}. <span class=\"tex-font-style-tt\">'?'<\/span> denotes an unrecognized command.<\/p><p>Lengths of two strings are equal and do not exceed <span class=\"tex-span\">10<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output a single real number corresponding to the probability. The answer will be considered correct if its relative or absolute error doesn't exceed <span class=\"tex-span\">10<sup class=\"upper-index\">\u2009-\u20099<\/sup><\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>++-+-<br/>+-+-+<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1.000000000000<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>+-+-<br/>+-??<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0.500000000000<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>+++<br/>??-<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0.000000000000<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first sample, both <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\">1<\/sub><\/span> and <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\">2<\/sub><\/span> will lead Dreamoon to finish at the same position <span class=\"tex-span\">\u2009+\u20091<\/span>. <\/p><p>For the second sample, <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\">1<\/sub><\/span> will lead Dreamoon to finish at position 0, while there are four possibilites for <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\">2<\/sub><\/span>: {<span class=\"tex-font-style-tt\">\"+-++\"<\/span>, <span class=\"tex-font-style-tt\">\"+-+-\"<\/span>, <span class=\"tex-font-style-tt\">\"+--+\"<\/span>, <span class=\"tex-font-style-tt\">\"+---\"<\/span>} with ending position {+2, 0, 0, -2} respectively. So there are <span class=\"tex-span\">2<\/span> correct cases out of <span class=\"tex-span\">4<\/span>, so the probability of finishing at the correct position is <span class=\"tex-span\">0.5<\/span>. <\/p><p>For the third sample, <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\">2<\/sub><\/span> could only lead us to finish at positions {+1, -1, -3}, so the probability to finish at the correct position <span class=\"tex-span\">\u2009+\u20093<\/span> is <span class=\"tex-span\">0<\/span>.<\/p><\/div><\/div>"}, {"contestId": 1915, "index": "E", "name": "Romantic Glasses", "rating": 1300, "solvedCount": 37825, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Romantic Glasses<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Iulia has $$$n$$$ glasses arranged in a line. The $$$i$$$-th glass has $$$a_i$$$ units of juice in it. Iulia drinks only from odd-numbered glasses, while her date drinks only from even-numbered glasses.<\/p><p>To impress her date, Iulia wants to find a contiguous subarray of these glasses such that both Iulia and her date will have the same amount of juice in total if only the glasses in this subarray are considered. Please help her to do that.<\/p><p>More formally, find out if there exists two indices $$$l$$$, $$$r$$$ such that $$$1 \\leq l \\leq r \\leq n$$$, and $$$a_l + a_{l + 2} + a_{l + 4} + \\dots + a_{r} = a_{l + 1} + a_{l + 3} + \\dots + a_{r-1}$$$ if $$$l$$$ and $$$r$$$ have the same parity and $$$a_l + a_{l + 2} + a_{l + 4} + \\dots + a_{r - 1} = a_{l + 1} + a_{l + 3} + \\dots + a_{r}$$$ otherwise.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\leq n \\leq 2 \\cdot 10^5$$$)\u00a0\u2014 the total number of glasses.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, \\ldots, a_n$$$ ($$$1 \\leq a_i \\leq 10^9$$$)\u00a0\u2014 the amount of juice in each glass.<\/p><p>The sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output \"<span class=\"tex-font-style-tt\">YES<\/span>\" if there exists a subarray satisfying the condition, and \"<span class=\"tex-font-style-tt\">NO<\/span>\" otherwise.<\/p><p>You can output the answer in any case (for example, the strings \"<span class=\"tex-font-style-tt\">yEs<\/span>\", \"<span class=\"tex-font-style-tt\">yes<\/span>\", \"<span class=\"tex-font-style-tt\">Yes<\/span>\" and \"<span class=\"tex-font-style-tt\">YES<\/span>\" will be recognized as a positive answer).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 1 1 1 1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 6 9 8 55 3 14 2 7 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">8<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 2 11 4 1 5 1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2 6 1 5 7 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">9<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">2 5 10 4 4 9 6 7 8<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nYES\nNO\nYES\nNO\nYES\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, Iulia can pick $$$l=1$$$ and $$$r=3$$$. Then she drinks $$$a_1+a_3=1+2=3$$$ units and her date drinks $$$a_2=3$$$ units of juice.<\/p><p>In the second test case, Iulia can pick $$$l=2$$$ and $$$r=5$$$. Then she drinks $$$a_3+a_5=1+1=2$$$ units and her date drinks $$$a_2+a_4=1+1=2$$$ units of juice.<\/p><p>In the third test case no such contiguous subarray works.<\/p><p>In the fourth test case, Iulia can pick $$$l=2$$$ and $$$r=8$$$. Then she drinks $$$a_3+a_5+a_7=11+1+1=13$$$ units and her date drinks $$$a_2+a_4+a_6+a_8=2+4+5+2=13$$$ units of juice.<\/p><\/div><\/div>"}, {"contestId": 1538, "index": "C", "name": "Number of Pairs", "rating": 1300, "solvedCount": 36235, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Number of Pairs<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ of $$$n$$$ integers. Find the number of pairs $$$(i, j)$$$ ($$$1 \\le i  \\lt  j \\le n$$$) where the sum of $$$a_i + a_j$$$ is greater than or equal to $$$l$$$ and less than or equal to $$$r$$$ (that is, $$$l \\le a_i + a_j \\le r$$$).<\/p><p>For example, if $$$n = 3$$$, $$$a = [5, 1, 2]$$$, $$$l = 4$$$ and $$$r = 7$$$, then two pairs are suitable: <\/p><ul> <li> $$$i=1$$$ and $$$j=2$$$ ($$$4 \\le 5 + 1 \\le 7$$$); <\/li><li> $$$i=1$$$ and $$$j=3$$$ ($$$4 \\le 5 + 2 \\le 7$$$). <\/li><\/ul><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$). Then $$$t$$$ test cases follow.<\/p><p>The first line of each test case contains three integers $$$n, l, r$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$, $$$1 \\le l \\le r \\le 10^9$$$)\u00a0\u2014 the length of the array and the limits on the sum in the pair.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$).<\/p><p>It is guaranteed that the sum of $$$n$$$ overall test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer\u00a0\u2014 the number of index pairs $$$(i, j)$$$ ($$$i  \\lt  j$$$), such that $$$l \\le a_i + a_j \\le r$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n3 4 7\n5 1 2\n5 5 8\n5 1 2 4 3\n4 100 1000\n1 1 1 1\n5 9 13\n2 5 5 1 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n7\n0\n1\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1927, "index": "D", "name": "Find the Different Ones!", "rating": 1300, "solvedCount": 36201, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Find the Different Ones!<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ of $$$n$$$ integers, and $$$q$$$ queries.<\/p><p>Each query is represented by two integers $$$l$$$ and $$$r$$$ ($$$1 \\le l \\le r \\le n$$$). Your task is to find, for each query, two indices $$$i$$$ and $$$j$$$ (or determine that they do not exist) such that:<\/p><ul> <li> $$$l \\le i \\le r$$$; <\/li><li> $$$l \\le j \\le r$$$; <\/li><li> $$$a_i \\ne a_j$$$. <\/li><\/ul><p>In other words, for each query, you need to find a pair of different elements among $$$a_l, a_{l+1}, \\dots, a_r$$$, or report that such a pair does not exist.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases. The descriptions of the test cases follow.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the length of the array $$$a$$$.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^6$$$)\u00a0\u2014 the elements of the array $$$a$$$.<\/p><p>The third line of each test case contains a single integer $$$q$$$ ($$$1 \\le q \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of queries.<\/p><p>The next $$$q$$$ lines contain two integers each, $$$l$$$ and $$$r$$$ ($$$1 \\le l  \\lt  r \\le n$$$)\u00a0\u2014 the boundaries of the query.<\/p><p>It is guaranteed that the sum of the values of $$$n$$$ across all test cases does not exceed $$$2 \\cdot 10^5$$$. Similarly, it is guaranteed that the sum of the values of $$$q$$$ across all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query, output two integers separated by space: $$$i$$$ and $$$j$$$ ($$$l \\le i, j \\le r$$$), for which $$$a_i \\ne a_j$$$. If such a pair does not exist, output $$$i=-1$$$ and $$$j=-1$$$.<\/p><p>You may separate the outputs for the test cases with empty lines. This is not a mandatory requirement.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1 2 1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">30 20 20 10 10 20<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 2 3 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 4 3 2 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2 3 1 4 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4 5<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2 3\n-1 -1\n1 3\n\n2 1\n-1 -1\n4 2\n4 6\n5 3\n\n1 2\n1 2\n2 3\n3 2\n\n1 3\n2 4\n3 4\n5 3\n5 4\n\n1 2\n4 2\n1 3\n2 3\n3 2\n5 4\n5 4\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1931, "index": "D", "name": "Divisible Pairs", "rating": 1300, "solvedCount": 33682, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Divisible Pairs<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Polycarp has two favorite integers $$$x$$$ and $$$y$$$ (they can be equal), and he has found an array $$$a$$$ of length $$$n$$$.<\/p><p>Polycarp considers a pair of indices $$$\\langle i, j \\rangle$$$ ($$$1 \\le i  \\lt  j \\le n$$$) <span class=\"tex-font-style-it\">beautiful<\/span> if: <\/p><ul> <li> $$$a_i + a_j$$$ is divisible by $$$x$$$; <\/li><li> $$$a_i - a_j$$$ is divisible by $$$y$$$. <\/li><\/ul><p>For example, if $$$x=5$$$, $$$y=2$$$, $$$n=6$$$, $$$a=$$$[$$$1, 2, 7, 4, 9, 6$$$], then the only <span class=\"tex-font-style-it\">beautiful<\/span> pairs are: <\/p><ul> <li> $$$\\langle 1, 5 \\rangle$$$: $$$a_1 + a_5 = 1 + 9 = 10$$$ ($$$10$$$ is divisible by $$$5$$$) and $$$a_1 - a_5 = 1 - 9 = -8$$$ ($$$-8$$$ is divisible by $$$2$$$); <\/li><li> $$$\\langle 4, 6 \\rangle$$$: $$$a_4 + a_6 = 4 + 6 = 10$$$ ($$$10$$$ is divisible by $$$5$$$) and $$$a_4 - a_6 = 4 - 6 = -2$$$ ($$$-2$$$ is divisible by $$$2$$$). <\/li><\/ul> Find the number of <span class=\"tex-font-style-it\">beautiful<\/span> pairs in the array $$$a$$$.<\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases. Then the descriptions of the test cases follow.<\/p><p>The first line of each test case contains three integers $$$n$$$, $$$x$$$, and $$$y$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$, $$$1 \\le x, y \\le 10^9$$$)\u00a0\u2014 the size of the array and Polycarp's favorite integers.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$)\u00a0\u2014 the elements of the array.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer\u00a0\u2014 the number of <span class=\"tex-font-style-it\">beautiful<\/span> pairs in the array $$$a$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">6 5 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 7 4 9 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">7 9 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 10 15 3 8 12 15<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">9 4 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">14 10 2 2 11 11 13 5 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">9 5 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">10 7 6 7 9 7 7 10 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">9 6 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4 9 7 1 2 2 13 3 15<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">9 2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">14 6 1 15 12 15 8 2 15<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">10 5 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">13 3 3 2 12 11 3 7 13 14<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n0\n1\n3\n5\n7\n0\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1285, "index": "B", "name": "Just Eat It!", "rating": 1300, "solvedCount": 33118, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Just Eat It!<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Today, Yasser and Adel are at the shop buying cupcakes. There are $$$n$$$ cupcake types, arranged from $$$1$$$ to $$$n$$$ on the shelf, and there are infinitely many of each type. The tastiness of a cupcake of type $$$i$$$ is an integer $$$a_i$$$. There are both tasty and nasty cupcakes, so the tastiness can be positive, zero or negative.<\/p><p>Yasser, of course, wants to try them all, so he will buy exactly one cupcake of each type.<\/p><p>On the other hand, Adel will choose some segment $$$[l, r]$$$ $$$(1 \\le l \\le r \\le n)$$$ that does not include all of cupcakes (he can't choose $$$[l, r] = [1, n]$$$) and buy exactly one cupcake of each of types $$$l, l + 1, \\dots, r$$$.<\/p><p>After that they will compare the total tastiness of the cupcakes each of them have bought. Yasser will be happy if the total tastiness of cupcakes he buys is <span class=\"tex-font-style-bf\">strictly<\/span> greater than the total tastiness of cupcakes Adel buys <span class=\"tex-font-style-bf\">regardless of Adel's choice<\/span>.<\/p><p>For example, let the tastinesses of the cupcakes be $$$[7, 4, -1]$$$. Yasser will buy all of them, the total tastiness will be $$$7 + 4 - 1 = 10$$$. Adel can choose segments $$$[7], [4], [-1], [7, 4]$$$ or $$$[4, -1]$$$, their total tastinesses are $$$7, 4, -1, 11$$$ and $$$3$$$, respectively. Adel can choose segment with tastiness $$$11$$$, and as $$$10$$$ is not strictly greater than $$$11$$$, Yasser won't be happy :(<\/p><p>Find out if Yasser will be happy after visiting the shop.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows.<\/p><p>The first line of each test case contains $$$n$$$ ($$$2 \\le n \\le 10^5$$$).<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$-10^9 \\le a_i \\le 10^9$$$), where $$$a_i$$$ represents the tastiness of the $$$i$$$-th type of cupcake.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases doesn't exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print \"<span class=\"tex-font-style-tt\">YES<\/span>\", if the total tastiness of cupcakes Yasser buys will always be <span class=\"tex-font-style-bf\">strictly<\/span> greater than the total tastiness of cupcakes Adel buys regardless of Adel's choice. Otherwise, print \"<span class=\"tex-font-style-tt\">NO<\/span>\".<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n4\n1 2 3 4\n3\n7 4 -1\n3\n5 -5 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nNO\nNO\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, the total tastiness of any segment Adel can choose is less than the total tastiness of all cupcakes.<\/p><p>In the second example, Adel will choose the segment $$$[1, 2]$$$ with total tastiness $$$11$$$, which is not less than the total tastiness of all cupcakes, which is $$$10$$$.<\/p><p>In the third example, Adel can choose the segment $$$[3, 3]$$$ with total tastiness of $$$5$$$. Note that Yasser's cupcakes' total tastiness is also $$$5$$$, so in that case, the total tastiness of Yasser's cupcakes isn't strictly greater than the total tastiness of Adel's cupcakes.<\/p><\/div><\/div>"}, {"contestId": 276, "index": "B", "name": "Little Girl and Game", "rating": 1300, "solvedCount": 32875, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Little Girl and Game<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>The Little Girl loves problems on games very much. Here's one of them.<\/p><p>Two players have got a string <span class=\"tex-span\"><i>s<\/i><\/span>, consisting of lowercase English letters. They play a game that is described by the following rules:<\/p><ul> <li> The players move in turns; In one move the player can remove an arbitrary letter from string <span class=\"tex-span\"><i>s<\/i><\/span>. <\/li><li> If the player before his turn can reorder the letters in string <span class=\"tex-span\"><i>s<\/i><\/span> so as to get a palindrome, this player wins. A palindrome is a string that reads the same both ways (from left to right, and vice versa). For example, string \"<span class=\"tex-font-style-tt\">abba<\/span>\" is a palindrome and string \"<span class=\"tex-font-style-tt\">abc<\/span>\" isn't. <\/li><\/ul><p>Determine which player will win, provided that both sides play optimally well \u2014 the one who moves first or the one who moves second.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The input contains a single line, containing string <span class=\"tex-span\"><i>s<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009|<i>s<\/i>|\u2009\u2009\u2264\u2009\u200910<sup class=\"upper-index\">3<\/sup><\/span>). String <span class=\"tex-span\"><i>s<\/i><\/span> consists of lowercase English letters.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In a single line print word \"<span class=\"tex-font-style-tt\">First<\/span>\" if the first player wins (provided that both players play optimally well). Otherwise, print word \"<span class=\"tex-font-style-tt\">Second<\/span>\". Print the words without the quotes.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>aba<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>First<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>abca<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>Second<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1703, "index": "F", "name": "Yet Another Problem About Pairs Satisfying an Inequality", "rating": 1300, "solvedCount": 32774, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Yet Another Problem About Pairs Satisfying an Inequality<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a_1, a_2, \\dots a_n$$$. Count the number of pairs of indices $$$1 \\leq i, j \\leq n$$$ such that $$$a_i  \\lt  i  \\lt  a_j  \\lt  j$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$t$$$ ($$$1 \\leq t \\leq 1000$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains an integer $$$n$$$ ($$$2 \\leq n \\leq 2 \\cdot 10^5$$$)\u00a0\u2014 the length of the array.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$0 \\leq a_i \\leq 10^9$$$)\u00a0\u2014 the elements of the array.<\/p><p>It is guaranteed that the sum of $$$n$$$ across all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer\u00a0\u2014 the number of pairs of indices satisfying the condition in the statement.<\/p><p>Please note, that the answer for some test cases won't fit into 32-bit integer type, so you should use at least 64-bit integer type in your programming language (like <span class=\"tex-font-style-tt\">long long<\/span> for C++).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1 2 3 8 2 1 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0 2 1 6 3 4 1 2 8 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 1000000000<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">0 1000000000 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n0\n10\n0\n1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first test cases the pairs are $$$(i, j)$$$ = $$$\\{(2, 4), (2, 8), (3, 8)\\}$$$. <\/p><ul> <li> The pair $$$(2, 4)$$$ is true because $$$a_2 = 1$$$, $$$a_4 = 3$$$ and $$$1  \\lt  2  \\lt  3  \\lt  4$$$. <\/li><li> The pair $$$(2, 8)$$$ is true because $$$a_2 = 1$$$, $$$a_8 = 4$$$ and $$$1  \\lt  2  \\lt  4  \\lt  8$$$. <\/li><li> The pair $$$(3, 8)$$$ is true because $$$a_3 = 2$$$, $$$a_8 = 4$$$ and $$$2  \\lt  3  \\lt  4  \\lt  8$$$. <\/li><\/ul><\/div><\/div>"}, {"contestId": 1328, "index": "B", "name": "K-th Beautiful String", "rating": 1300, "solvedCount": 32671, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. K-th Beautiful String<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>For the given integer $$$n$$$ ($$$n  \\gt  2$$$) let's write down all the strings of length $$$n$$$ which contain $$$n-2$$$ letters '<span class=\"tex-font-style-tt\">a<\/span>' and two letters '<span class=\"tex-font-style-tt\">b<\/span>' in <span class=\"tex-font-style-bf\">lexicographical<\/span> (alphabetical) order.<\/p><p>Recall that the string $$$s$$$ of length $$$n$$$ is lexicographically less than string $$$t$$$ of length $$$n$$$, if there exists such $$$i$$$ ($$$1 \\le i \\le n$$$), that $$$s_i  \\lt  t_i$$$, and for any $$$j$$$ ($$$1 \\le j  \\lt  i$$$) $$$s_j = t_j$$$. The lexicographic comparison of strings is implemented by the operator <span class=\"tex-font-style-tt\">&lt;<\/span> in modern programming languages.<\/p><p>For example, if $$$n=5$$$ the strings are (the order does matter):<\/p><ol> <li> <span class=\"tex-font-style-tt\">aaabb<\/span> <\/li><li> <span class=\"tex-font-style-tt\">aabab<\/span> <\/li><li> <span class=\"tex-font-style-tt\">aabba<\/span> <\/li><li> <span class=\"tex-font-style-tt\">abaab<\/span> <\/li><li> <span class=\"tex-font-style-tt\">ababa<\/span> <\/li><li> <span class=\"tex-font-style-tt\">abbaa<\/span> <\/li><li> <span class=\"tex-font-style-tt\">baaab<\/span> <\/li><li> <span class=\"tex-font-style-tt\">baaba<\/span> <\/li><li> <span class=\"tex-font-style-tt\">babaa<\/span> <\/li><li> <span class=\"tex-font-style-tt\">bbaaa<\/span> <\/li><\/ol><p>It is easy to show that such a list of strings will contain exactly $$$\\frac{n \\cdot (n-1)}{2}$$$ strings.<\/p><p>You are given $$$n$$$ ($$$n  \\gt  2$$$) and $$$k$$$ ($$$1 \\le k \\le \\frac{n \\cdot (n-1)}{2}$$$). Print the $$$k$$$-th string from the list.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The input contains one or more test cases.<\/p><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$) \u2014 the number of test cases in the test. Then $$$t$$$ test cases follow.<\/p><p>Each test case is written on the the separate line containing two integers $$$n$$$ and $$$k$$$ ($$$3 \\le n \\le 10^5, 1 \\le k \\le \\min(2\\cdot10^9, \\frac{n \\cdot (n-1)}{2})$$$.<\/p><p>The sum of values $$$n$$$ over all test cases in the test doesn't exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case print the $$$k$$$-th string from the list of all described above strings of length $$$n$$$. Strings in the list are sorted lexicographically (alphabetically).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7\n5 1\n5 2\n5 8\n5 10\n3 1\n3 2\n20 100\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\naaabb\naabab\nbaaba\nbbaaa\nabb\nbab\naaaaabaaaaabaaaaaaaa\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1669, "index": "H", "name": "Maximal AND", "rating": 1300, "solvedCount": 31896, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">H. Maximal AND<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Let $$$\\mathsf{AND}$$$ denote the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#AND\">bitwise AND operation<\/a>, and $$$\\mathsf{OR}$$$ denote the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#OR\">bitwise OR operation<\/a>.<\/p><p>You are given an array $$$a$$$ of length $$$n$$$ and a non-negative integer $$$k$$$. You can perform <span class=\"tex-font-style-bf\">at most<\/span> $$$k$$$ operations on the array of the following type:<\/p><ul> <li> Select an index $$$i$$$ ($$$1 \\leq i \\leq n$$$) and replace $$$a_i$$$ with $$$a_i$$$ $$$\\mathsf{OR}$$$ $$$2^j$$$ where $$$j$$$ is any integer between $$$0$$$ and $$$30$$$ <span class=\"tex-font-style-bf\">inclusive<\/span>. In other words, in an operation you can choose an index $$$i$$$ ($$$1 \\leq i \\leq n$$$) and set the $$$j$$$-th bit of $$$a_i$$$ to $$$1$$$ ($$$0 \\leq j \\leq 30$$$). <\/li><\/ul><p>Output the maximum possible value of $$$a_1$$$ $$$\\mathsf{AND}$$$ $$$a_2$$$ $$$\\mathsf{AND}$$$ $$$\\dots$$$ $$$\\mathsf{AND}$$$ $$$a_n$$$ after performing <span class=\"tex-font-style-bf\">at most<\/span> $$$k$$$ operations. <\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains a single integer $$$t$$$ ($$$1 \\le t \\le 100$$$) \u2014 the number of test cases. The description of test cases follows.<\/p><p>The first line of each test case contains the integers $$$n$$$ and $$$k$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$, $$$0 \\le k \\le 10^9$$$).<\/p><p>Then a single line follows, containing $$$n$$$ integers describing the arrays $$$a$$$ ($$$0 \\leq a_i  \\lt  2^{31}$$$).<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single line containing the maximum possible $$$\\mathsf{AND}$$$ value of $$$a_1$$$ $$$\\mathsf{AND}$$$ $$$a_2$$$ $$$\\mathsf{AND}$$$ $$$\\dots$$$ $$$\\mathsf{AND}$$$ $$$a_n$$$ after performing <span class=\"tex-font-style-bf\">at most<\/span> $$$k$$$ operations.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">7 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 6 6 28 6 6 12<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 30<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 1 3 1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n4\n2147483646\n1073741825\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first test case, we can set the bit $$$1$$$ ($$$2^1$$$) of the last $$$2$$$ elements using the $$$2$$$ operations, thus obtaining the array [$$$2$$$, $$$3$$$, $$$3$$$], which has $$$\\mathsf{AND}$$$ value equal to $$$2$$$.<\/p><p>For the second test case, we can't perform any operations so the answer is just the $$$\\mathsf{AND}$$$ of the whole array which is $$$4$$$.<\/p><\/div><\/div>"}, {"contestId": 1470, "index": "A", "name": "Strange Birthday Party", "rating": 1300, "solvedCount": 31299, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. Strange Birthday Party<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Petya organized a strange birthday party. He invited $$$n$$$ friends and assigned an in

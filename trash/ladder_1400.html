<script>
    const PROBLEMS = [{"contestId": 279, "index": "B", "name": "Books", "rating": 1400, "solvedCount": 79218, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Books<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>When Valera has got some free time, he goes to the library to read some books. Today he's got <span class=\"tex-span\"><i>t<\/i><\/span> free minutes to read. That's why Valera took <span class=\"tex-span\"><i>n<\/i><\/span> books in the library and for each book he estimated the time he is going to need to read it. Let's number the books by integers from 1 to <span class=\"tex-span\"><i>n<\/i><\/span>. Valera needs <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> minutes to read the <span class=\"tex-span\"><i>i<\/i><\/span>-th book.<\/p><p>Valera decided to choose an arbitrary book with number <span class=\"tex-span\"><i>i<\/i><\/span> and read the books one by one, starting from this book. In other words, he will first read book number <span class=\"tex-span\"><i>i<\/i><\/span>, then book number <span class=\"tex-span\"><i>i<\/i>\u2009+\u20091<\/span>, then book number <span class=\"tex-span\"><i>i<\/i>\u2009+\u20092<\/span> and so on. He continues the process until he either runs out of the free time or finishes reading the <span class=\"tex-span\"><i>n<\/i><\/span>-th book. Valera reads each book up to the end, that is, he doesn't start reading the book if he doesn't have enough free time to finish reading it. <\/p><p>Print the maximum number of books Valera can read.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>t<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>;\u00a01\u2009\u2264\u2009<i>t<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup>)<\/span> \u2014 the number of books and the number of free minutes Valera's got. The second line contains a sequence of <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">4<\/sup>)<\/span>, where number <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> shows the number of minutes that the boy needs to read the <span class=\"tex-span\"><i>i<\/i><\/span>-th book.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u2014 the maximum number of books Valera can read.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 5<br/>3 1 2 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 3<br/>2 2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 520, "index": "B", "name": "Two Buttons", "rating": 1400, "solvedCount": 65962, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Two Buttons<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Vasya has found a strange device. On the front panel of a device there are: a red button, a blue button and a display showing some positive integer. After clicking the red button, device multiplies the displayed number by two. After clicking the blue button, device subtracts one from the number on the display. If at some point the number stops being positive, the device breaks down. The display can show arbitrarily large numbers. Initially, the display shows number <span class=\"tex-span\"><i>n<\/i><\/span>.<\/p><p>Bob wants to get number <span class=\"tex-span\"><i>m<\/i><\/span> on the display. What minimum number of clicks he has to make in order to achieve this result?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first and the only line of the input contains two distinct integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>m<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">4<\/sup><\/span>), separated by a space .<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single number \u2014 the minimum number of times one needs to push the button required to get the number <span class=\"tex-span\"><i>m<\/i><\/span> out of number <span class=\"tex-span\"><i>n<\/i><\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 6<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>10 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>9<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example you need to push the blue button once, and then push the red button once.<\/p><p>In the second example, doubling the number is unnecessary, so we need to push the blue button nine times.<\/p><\/div><\/div>"}, {"contestId": 489, "index": "C", "name": "Given Length and Sum of Digits...", "rating": 1400, "solvedCount": 53073, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Given Length and Sum of Digits...<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>You have a positive integer <span class=\"tex-span\"><i>m<\/i><\/span> and a non-negative integer <span class=\"tex-span\"><i>s<\/i><\/span>. Your task is to find the smallest and the largest of the numbers that have length <span class=\"tex-span\"><i>m<\/i><\/span> and sum of digits <span class=\"tex-span\"><i>s<\/i><\/span>. The required numbers should be non-negative integers written in the decimal base without leading zeroes.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The single line of the input contains a pair of integers <span class=\"tex-span\"><i>m<\/i><\/span>, <span class=\"tex-span\"><i>s<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u2009100,\u20090\u2009\u2264\u2009<i>s<\/i>\u2009\u2264\u2009900<\/span>) \u2014 the length and the sum of the digits of the required numbers.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In the output print the pair of the required non-negative integer numbers \u2014 first the minimum possible number, then \u2014 the maximum possible number. If no numbers satisfying conditions required exist, print the pair of numbers \"<span class=\"tex-font-style-tt\">-1 -1<\/span>\" (without the quotes).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 15<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>69 96<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>-1 -1<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 698, "index": "A", "name": "Vacations", "rating": 1400, "solvedCount": 40200, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. Vacations<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Vasya has <span class=\"tex-span\"><i>n<\/i><\/span> days of vacations! So he decided to improve his IT skills and do sport. Vasya knows the following information about each of this <span class=\"tex-span\"><i>n<\/i><\/span> days: whether that gym opened and whether a contest was carried out in the Internet on that day. For the <span class=\"tex-span\"><i>i<\/i><\/span>-th day there are four options:<\/p><ol> <li> on this day the gym is closed and the contest is not carried out; <\/li><li> on this day the gym is closed and the contest is carried out; <\/li><li> on this day the gym is open and the contest is not carried out; <\/li><li> on this day the gym is open and the contest is carried out. <\/li><\/ol><p>On each of days Vasya can either have a rest or write the contest (if it is carried out on this day), or do sport (if the gym is open on this day).<\/p><p>Find the minimum number of days on which Vasya will have a rest (it means, he will not do sport and write the contest at the same time). The only limitation that Vasya has \u2014 <span class=\"tex-font-style-it\">he does not want to do the same activity on two consecutive days: it means, he will not do sport on two consecutive days, and write the contest on two consecutive days<\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a positive integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009100<\/span>) \u2014 the number of days of Vasya's vacations.<\/p><p>The second line contains the sequence of integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u20093<\/span>) separated by space, where: <\/p><ul> <li> <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> equals 0, if on the <span class=\"tex-span\"><i>i<\/i><\/span>-th day of vacations the gym is closed and the contest is not carried out; <\/li><li> <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> equals 1, if on the <span class=\"tex-span\"><i>i<\/i><\/span>-th day of vacations the gym is closed, but the contest is carried out; <\/li><li> <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> equals 2, if on the <span class=\"tex-span\"><i>i<\/i><\/span>-th day of vacations the gym is open and the contest is not carried out; <\/li><li> <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> equals 3, if on the <span class=\"tex-span\"><i>i<\/i><\/span>-th day of vacations the gym is open and the contest is carried out.<\/li><\/ul><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the minimum possible number of days on which Vasya will have a rest. Remember that Vasya refuses:<\/p><ul> <li> to do sport on any two consecutive days, <\/li><li> to write the contest on any two consecutive days. <\/li><\/ul><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>1 3 2 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>7<br/>1 3 3 2 1 2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/>2 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test Vasya can write the contest on the day number 1 and do sport on the day number 3. Thus, he will have a rest for only 2 days.<\/p><p>In the second test Vasya should write contests on days number 1, 3, 5 and 7, in other days do sport. Thus, he will not have a rest for a single day.<\/p><p>In the third test Vasya can do sport either on a day number 1 or number 2. He can not do sport in two days, because it will be contrary to the his limitation. Thus, he will have a rest for only one day.<\/p><\/div><\/div>"}, {"contestId": 1526, "index": "B", "name": "I Hate 1111", "rating": 1400, "solvedCount": 38023, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. I Hate 1111<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an integer $$$x$$$. Can you make $$$x$$$ by summing up some number of $$$11, 111, 1111, 11111, \\ldots$$$? (You can use any number among them any number of times).<\/p><p>For instance, <\/p><ul> <li> $$$33=11+11+11$$$ <\/li><li> $$$144=111+11+11+11$$$ <\/li><\/ul><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains a single integer $$$t$$$ $$$(1 \\leq t \\leq 10000)$$$ \u2014 the number of testcases.<\/p><p>The first and only line of each testcase contains a single integer $$$x$$$ $$$(1 \\leq x \\leq 10^9)$$$ \u2014 the number you have to make.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each testcase, you should output a single string. If you can make $$$x$$$, output \"YES\" (without quotes). Otherwise, output \"NO\".<\/p><p>You can print each letter of \"YES\" and \"NO\" in any case (upper or lower).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n33\n144\n69\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nYES\nNO\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Ways to make $$$33$$$ and $$$144$$$ were presented in the statement. It can be proved that we can't present $$$69$$$ this way.<\/p><\/div><\/div>"}, {"contestId": 1195, "index": "C", "name": "Basketball Exercise", "rating": 1400, "solvedCount": 37616, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Basketball Exercise<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Finally, a basketball court has been opened in SIS, so Demid has decided to hold a basketball exercise session. $$$2 \\cdot n$$$ students have come to Demid's exercise session, and he lined up them into two rows of the same size (there are exactly $$$n$$$ people in each row). Students are numbered from $$$1$$$ to $$$n$$$ in each row in order from left to right.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/d86d754d6d2d8028a5014de45c1921110ba0b6dd.png\" style=\"zoom: 75.0%;max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>Now Demid wants to choose a team to play basketball. He will choose players from left to right, and the index of each chosen player (excluding the first one <span class=\"tex-font-style-bf\">taken<\/span>) will be strictly greater than the index of the previously chosen player. To avoid giving preference to one of the rows, Demid chooses students in such a way that no consecutive chosen students belong to the same row. The first student can be chosen among all $$$2n$$$ students (there are no additional constraints), and a team can consist of any number of students. <\/p><p>Demid thinks, that in order to compose a perfect team, he should choose students in such a way, that the total height of all chosen students is maximum possible. Help Demid to find the maximum possible total height of players in a team he can choose.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains a single integer $$$n$$$ ($$$1 \\le n \\le 10^5$$$)\u00a0\u2014 the number of students in each row.<\/p><p>The second line of the input contains $$$n$$$ integers $$$h_{1, 1}, h_{1, 2}, \\ldots, h_{1, n}$$$ ($$$1 \\le h_{1, i} \\le 10^9$$$), where $$$h_{1, i}$$$ is the height of the $$$i$$$-th student in the first row.<\/p><p>The third line of the input contains $$$n$$$ integers $$$h_{2, 1}, h_{2, 2}, \\ldots, h_{2, n}$$$ ($$$1 \\le h_{2, i} \\le 10^9$$$), where $$$h_{2, i}$$$ is the height of the $$$i$$$-th student in the second row.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u2014 the maximum possible total height of players in a team Demid can choose.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n9 3 5 7 3\n5 8 1 4 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n29\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n1 2 9\n10 1 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n19\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1\n7\n4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n7\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example Demid can choose the following team as follows: <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/4e91cbc6d188bea6a651a3ee663b4842b5a853d6.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>In the second example Demid can choose the following team as follows: <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/05e00446ce2bc15b43dee54633824f909a6e8695.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 1201, "index": "C", "name": "Maximum Median", "rating": 1400, "solvedCount": 36636, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Maximum Median<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ of $$$n$$$ integers, where $$$n$$$ is odd. You can make the following operation with it:<\/p><ul> <li> Choose one of the elements of the array (for example $$$a_i$$$) and increase it by $$$1$$$ (that is, replace it with $$$a_i + 1$$$). <\/li><\/ul><p>You want to make the median of the array the largest possible using at most $$$k$$$ operations.<\/p><p>The median of the odd-sized array is the middle element after the array is sorted in non-decreasing order. For example, the median of the array $$$[1, 5, 2, 3, 5]$$$ is $$$3$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$, $$$n$$$ is odd, $$$1 \\le k \\le 10^9$$$)\u00a0\u2014 the number of elements in the array and the largest number of operations you can make.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer\u00a0\u2014 the maximum possible median after the operations.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 2\n1 3 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 5\n1 2 1 1 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7 7\n4 1 2 4 3 4 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, you can increase the second element twice. Than array will be $$$[1, 5, 5]$$$ and it's median is $$$5$$$.<\/p><p>In the second example, it is optimal to increase the second number and than increase third and fifth. This way the answer is $$$3$$$.<\/p><p>In the third example, you can make four operations: increase first, fourth, sixth, seventh element. This way the array will be $$$[5, 1, 2, 5, 3, 5, 5]$$$ and the median will be $$$5$$$.<\/p><\/div><\/div>"}, {"contestId": 1324, "index": "D", "name": "Pair of Topics", "rating": 1400, "solvedCount": 35486, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Pair of Topics<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>The next lecture in a high school requires two topics to be discussed. The $$$i$$$-th topic is interesting by $$$a_i$$$ units for the teacher and by $$$b_i$$$ units for the students.<\/p><p>The pair of topics $$$i$$$ and $$$j$$$ ($$$i  \\lt  j$$$) is called <span class=\"tex-font-style-bf\">good<\/span> if $$$a_i + a_j  \\gt  b_i + b_j$$$ (i.e. it is more interesting for the teacher).<\/p><p>Your task is to find the number of <span class=\"tex-font-style-bf\">good<\/span> pairs of topics.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains one integer $$$n$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$) \u2014 the number of topics.<\/p><p>The second line of the input contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$), where $$$a_i$$$ is the interestingness of the $$$i$$$-th topic for the teacher.<\/p><p>The third line of the input contains $$$n$$$ integers $$$b_1, b_2, \\dots, b_n$$$ ($$$1 \\le b_i \\le 10^9$$$), where $$$b_i$$$ is the interestingness of the $$$i$$$-th topic for the students.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the number of <span class=\"tex-font-style-bf\">good<\/span> pairs of topic.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n4 8 2 6 2\n4 5 4 1 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n7\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n1 3 2 4\n1 3 2 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 479, "index": "C", "name": "Exams", "rating": 1400, "solvedCount": 33871, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Exams<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Student Valera is an undergraduate student at the University. His end of term exams are approaching and he is to pass exactly <span class=\"tex-span\"><i>n<\/i><\/span> exams. Valera is a smart guy, so he will be able to pass any exam he takes on his first try. Besides, he can take several exams on one day, and in any order.<\/p><p>According to the schedule, a student can take the exam for the <span class=\"tex-span\"><i>i<\/i><\/span>-th subject on the day number <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. However, Valera has made an arrangement with each teacher and the teacher of the <span class=\"tex-span\"><i>i<\/i><\/span>-th subject allowed him to take an exam before the schedule time on day <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009&lt;\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>). Thus, Valera can take an exam for the <span class=\"tex-span\"><i>i<\/i><\/span>-th subject either on day <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, or on day <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. All the teachers put the record of the exam in the student's record book on the day of the actual exam and write down the date of the mark as number <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>.<\/p><p>Valera believes that it would be rather strange if the entries in the record book did not go in the order of non-decreasing date. Therefore Valera asks you to help him. Find the minimum possible value of the day when Valera can take the final exam if he takes exams so that all the records in his record book go in the order of non-decreasing date.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single positive integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20095000<\/span>) \u2014 the number of exams Valera will take.<\/p><p>Each of the next <span class=\"tex-span\"><i>n<\/i><\/span> lines contains two positive space-separated integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009&lt;\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) \u2014 the date of the exam in the schedule and the early date of passing the <span class=\"tex-span\"><i>i<\/i><\/span>-th exam, correspondingly.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u2014 the minimum possible number of the day when Valera can take the last exam if he takes all the exams so that all the records in his record book go in the order of non-decreasing date.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>5 2<br/>3 1<br/>4 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>6 1<br/>5 2<br/>4 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample Valera first takes an exam in the second subject on the first day (the teacher writes down the schedule date that is 3). On the next day he takes an exam in the third subject (the teacher writes down the schedule date, 4), then he takes an exam in the first subject (the teacher writes down the mark with date 5). Thus, Valera takes the last exam on the second day and the dates will go in the non-decreasing order: 3, 4, 5.<\/p><p>In the second sample Valera first takes an exam in the third subject on the fourth day. Then he takes an exam in the second subject on the fifth day. After that on the sixth day Valera takes an exam in the first subject.<\/p><\/div><\/div>"}, {"contestId": 1374, "index": "D", "name": "Zero Remainder Array", "rating": 1400, "solvedCount": 32968, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Zero Remainder Array<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ consisting of $$$n$$$ positive integers.<\/p><p>Initially, you have an integer $$$x = 0$$$. During one move, you can do one of the following two operations:<\/p><ol> <li> Choose <span class=\"tex-font-style-bf\">exactly one<\/span> $$$i$$$ from $$$1$$$ to $$$n$$$ and increase $$$a_i$$$ by $$$x$$$ ($$$a_i := a_i + x$$$), then increase $$$x$$$ by $$$1$$$ ($$$x := x + 1$$$). <\/li><li> Just increase $$$x$$$ by $$$1$$$ ($$$x := x + 1$$$). <\/li><\/ol><p>The first operation can be applied <span class=\"tex-font-style-bf\">no more than once<\/span> to each $$$i$$$ from $$$1$$$ to $$$n$$$.<\/p><p>Your task is to find the minimum number of moves required to obtain such an array that each its element is <span class=\"tex-font-style-bf\">divisible by<\/span> $$$k$$$ (the value $$$k$$$ is given).<\/p><p>You have to answer $$$t$$$ independent test cases. <\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains one integer $$$t$$$ ($$$1 \\le t \\le 2 \\cdot 10^4$$$) \u2014 the number of test cases. Then $$$t$$$ test cases follow.<\/p><p>The first line of the test case contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le n \\le 2 \\cdot 10^5; 1 \\le k \\le 10^9$$$) \u2014 the length of $$$a$$$ and the required divisior. The second line of the test case contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$), where $$$a_i$$$ is the $$$i$$$-th element of $$$a$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ does not exceed $$$2 \\cdot 10^5$$$ ($$$\\sum n \\le 2 \\cdot 10^5$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print the answer \u2014 the minimum number of moves required to obtain such an array that each its element is <span class=\"tex-font-style-bf\">divisible by<\/span> $$$k$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n4 3\n1 2 1 3\n10 6\n8 7 1 8 3 7 5 10 8 9\n5 10\n20 100 50 20 100500\n10 25\n24 24 24 24 24 24 24 24 24 24\n8 8\n1 2 3 4 5 6 7 8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n18\n0\n227\n8\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Consider the first test case of the example:<\/p><ol> <li> $$$x=0$$$, $$$a = [1, 2, 1, 3]$$$. Just increase $$$x$$$; <\/li><li> $$$x=1$$$, $$$a = [1, 2, 1, 3]$$$. Add $$$x$$$ to the second element and increase $$$x$$$; <\/li><li> $$$x=2$$$, $$$a = [1, 3, 1, 3]$$$. Add $$$x$$$ to the third element and increase $$$x$$$; <\/li><li> $$$x=3$$$, $$$a = [1, 3, 3, 3]$$$. Add $$$x$$$ to the fourth element and increase $$$x$$$; <\/li><li> $$$x=4$$$, $$$a = [1, 3, 3, 6]$$$. Just increase $$$x$$$; <\/li><li> $$$x=5$$$, $$$a = [1, 3, 3, 6]$$$. Add $$$x$$$ to the first element and increase $$$x$$$; <\/li><li> $$$x=6$$$, $$$a = [6, 3, 3, 6]$$$. We obtained the required array. <\/li><\/ol><p><span class=\"tex-font-style-bf\">Note that you can't add $$$x$$$ to the same element more than once<\/span>.<\/p><\/div><\/div>"}, {"contestId": 1350, "index": "B", "name": "Orac and Models", "rating": 1400, "solvedCount": 31282, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Orac and Models<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are $$$n$$$ models in the shop numbered from $$$1$$$ to $$$n$$$, with sizes $$$s_1, s_2, \\ldots, s_n$$$.<\/p><p>Orac will buy some of the models and will arrange them in the order of increasing numbers (i.e. indices, but not sizes).<\/p><p>Orac thinks that the obtained arrangement is <span class=\"tex-font-style-bf\">beatiful<\/span>, if for any two adjacent models with indices $$$i_j$$$ and $$$i_{j+1}$$$ (note that $$$i_j  \\lt  i_{j+1}$$$, because Orac arranged them properly), $$$i_{j+1}$$$ is divisible by $$$i_j$$$ and $$$s_{i_j}  \\lt  s_{i_{j+1}}$$$.<\/p><p>For example, for $$$6$$$ models with sizes $$$\\{3, 6, 7, 7, 7, 7\\}$$$, he can buy models with indices $$$1$$$, $$$2$$$, and $$$6$$$, and the obtained arrangement will be beautiful. Also, note that the arrangement with exactly one model is also considered beautiful.<\/p><p>Orac wants to know the maximum number of models that he can buy, and he may ask you these queries many times.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t\\ (1 \\le t\\le 100)$$$: the number of queries.<\/p><p>Each query contains two lines. The first line contains one integer $$$n\\ (1\\le n\\le 100\\,000)$$$: the number of models in the shop, and the second line contains $$$n$$$ integers $$$s_1,\\dots,s_n\\ (1\\le s_i\\le 10^9)$$$: the sizes of models.<\/p><p>It is guaranteed that the total sum of $$$n$$$ is at most $$$100\\,000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$t$$$ lines, the $$$i$$$-th of them should contain the maximum number of models that Orac can buy for the $$$i$$$-th query.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n4\n5 3 4 6\n7\n1 4 2 3 6 4 9\n5\n5 4 3 2 1\n1\n9\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n3\n1\n1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first query, for example, Orac can buy models with indices $$$2$$$ and $$$4$$$, the arrangement will be beautiful because $$$4$$$ is divisible by $$$2$$$ and $$$6$$$ is more than $$$3$$$. By enumerating, we can easily find that there are no beautiful arrangements with more than two models. <\/p><p>In the second query, Orac can buy models with indices $$$1$$$, $$$3$$$, and $$$6$$$. By enumerating, we can easily find that there are no beautiful arrangements with more than three models. <\/p><p>In the third query, there are no beautiful arrangements with more than one model.<\/p><\/div><\/div>"}, {"contestId": 414, "index": "B", "name": "Mashmokh and ACM", "rating": 1400, "solvedCount": 31054, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Mashmokh and ACM<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p><span class=\"tex-font-style-it\">Mashmokh's boss, Bimokh, didn't like Mashmokh. So he fired him. Mashmokh decided to go to university and participate in ACM instead of finding a new job. He wants to become a member of Bamokh's team. In order to join he was given some programming tasks and one week to solve them. Mashmokh is not a very experienced programmer. Actually he is not a programmer at all. So he wasn't able to solve them. That's why he asked you to help him with these tasks. One of these tasks is the following.<\/span><\/p><p>A sequence of <span class=\"tex-span\"><i>l<\/i><\/span> integers <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>b<\/i><sub class=\"lower-index\"><i>l<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>b<\/i><sub class=\"lower-index\">1<\/sub>\u2009\u2264\u2009<i>b<\/i><sub class=\"lower-index\">2<\/sub>\u2009\u2264\u2009...\u2009\u2264\u2009<i>b<\/i><sub class=\"lower-index\"><i>l<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>)<\/span> is called <span class=\"tex-font-style-it\">good<\/span> if each number divides (without a remainder) by the next number in the sequence. More formally <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/d70c60c547e2902d317d1b6b902e3ed28e695ae0.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> for all <span class=\"tex-span\"><i>i<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>l<\/i>\u2009-\u20091)<\/span>.<\/p><p>Given <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> find the number of good sequences of length <span class=\"tex-span\"><i>k<\/i><\/span>. As the answer can be rather large print it modulo <span class=\"tex-span\">1000000007<\/span> <span class=\"tex-span\">(10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097)<\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains two space-separated integers <span class=\"tex-span\"><i>n<\/i>,\u2009<i>k<\/i>\u00a0(1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>k<\/i>\u2009\u2264\u20092000)<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output a single integer \u2014 the number of good sequences of length <span class=\"tex-span\"><i>k<\/i><\/span> modulo <span class=\"tex-span\">1000000007<\/span> <span class=\"tex-span\">(10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097)<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>5<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>6 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>39<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample the good sequences are: <span class=\"tex-span\">[1,\u20091],\u2009[2,\u20092],\u2009[3,\u20093],\u2009[1,\u20092],\u2009[1,\u20093]<\/span>.<\/p><\/div><\/div>"}, {"contestId": 1919, "index": "C", "name": "Grouping Increases", "rating": 1400, "solvedCount": 30987, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Grouping Increases<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ of size $$$n$$$. You will do the following process to calculate your penalty: <\/p><ol> <li> Split array $$$a$$$ into two (possibly empty) subsequences$$$^\\dagger$$$ $$$s$$$ and $$$t$$$ such that every element of $$$a$$$ is either in $$$s$$$ or $$$t^\\ddagger$$$. <\/li><li> For an array $$$b$$$ of size $$$m$$$, define the penalty $$$p(b)$$$ of an array $$$b$$$ as the number of indices $$$i$$$ between $$$1$$$ and $$$m - 1$$$ where $$$b_i  \\lt  b_{i + 1}$$$. <\/li><li> The total penalty you will receive is $$$p(s) + p(t)$$$. <\/li><\/ol><p>If you perform the above process optimally, find the minimum possible penalty you will receive.<\/p><p>$$$^\\dagger$$$ A sequence $$$x$$$ is a subsequence of a sequence $$$y$$$ if $$$x$$$ can be obtained from $$$y$$$ by the deletion of several (possibly, zero or all) elements.<\/p><p>$$$^\\ddagger$$$ Some valid ways to split array $$$a=[3,1,4,1,5]$$$ into $$$(s,t)$$$ are $$$([3,4,1,5],[1])$$$, $$$([1,1],[3,4,5])$$$ and $$$([\\,],[3,1,4,1,5])$$$ while some invalid ways to split $$$a$$$ are $$$([3,4,5],[1])$$$, $$$([3,1,4,1],[1,5])$$$ and $$$([1,3,4],[5,1])$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 10^4$$$)\u00a0\u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1\\le n\\le 2\\cdot 10^5$$$)\u00a0\u2014 the size of the array $$$a$$$.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le n$$$)\u00a0\u2014 the elements of the array $$$a$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2\\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer representing the minimum possible penalty you will receive.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 3 4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">8<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">8 2 3 1 1 7 4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 3 3 3 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2 1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n1\n0\n0\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, a possible way to split $$$a$$$ is $$$s=[2,4,5]$$$ and $$$t=[1,3]$$$. The penalty is $$$p(s)+p(t)=2 + 1 =3$$$.<\/p><p>In the second test case, a possible way to split $$$a$$$ is $$$s=[8,3,1]$$$ and $$$t=[2,1,7,4,3]$$$. The penalty is $$$p(s)+p(t)=0 + 1 =1$$$.<\/p><p>In the third test case, a possible way to split $$$a$$$ is $$$s=[\\,]$$$ and $$$t=[3,3,3,3,3]$$$. The penalty is $$$p(s)+p(t)=0 + 0 =0$$$.<\/p><\/div><\/div>"}, {"contestId": 1520, "index": "E", "name": "Arranging The Sheep", "rating": 1400, "solvedCount": 30504, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Arranging The Sheep<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are playing the game \"Arranging The Sheep\". The goal of this game is to make the sheep line up. The level in the game is described by a string of length $$$n$$$, consisting of the characters '<span class=\"tex-font-style-tt\">.<\/span>' (empty space) and '<span class=\"tex-font-style-tt\">*<\/span>' (sheep). In one move, you can move any sheep one square to the left or one square to the right, if the corresponding square <span class=\"tex-font-style-bf\">exists and is empty<\/span>. The game ends as soon as the sheep are lined up, that is, there should be no empty cells between any sheep.<\/p><p>For example, if $$$n=6$$$ and the level is described by the string \"<span class=\"tex-font-style-tt\">**.*..<\/span>\", then the following game scenario is possible: <\/p><ul> <li> the sheep at the $$$4$$$ position moves to the right, the state of the level: \"<span class=\"tex-font-style-tt\">**..*.<\/span>\"; <\/li><li> the sheep at the $$$2$$$ position moves to the right, the state of the level: \"<span class=\"tex-font-style-tt\">*.*.*.<\/span>\"; <\/li><li> the sheep at the $$$1$$$ position moves to the right, the state of the level: \"<span class=\"tex-font-style-tt\">.**.*.<\/span>\"; <\/li><li> the sheep at the $$$3$$$ position moves to the right, the state of the level: \"<span class=\"tex-font-style-tt\">.*.**.<\/span>\"; <\/li><li> the sheep at the $$$2$$$ position moves to the right, the state of the level: \"<span class=\"tex-font-style-tt\">..***.<\/span>\"; <\/li><li> the sheep are lined up and the game ends. <\/li><\/ul><p>For a given level, determine the minimum number of moves you need to make to complete the level.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$). Then $$$t$$$ test cases follow.<\/p><p>The first line of each test case contains one integer $$$n$$$ ($$$1 \\le n \\le 10^6$$$).<\/p><p>The second line of each test case contains a string of length $$$n$$$, consisting of the characters '<span class=\"tex-font-style-tt\">.<\/span>' (empty space) and '<span class=\"tex-font-style-tt\">*<\/span>' (sheep)\u00a0\u2014 the description of the level.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$10^6$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case output the minimum number of moves you need to make to complete the level.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n6\n**.*..\n5\n*****\n3\n.*.\n3\n...\n10\n*.*...*.**\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n0\n0\n0\n9\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 816, "index": "B", "name": "Karen and Coffee", "rating": 1400, "solvedCount": 30166, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Karen and Coffee<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>To stay woke and attentive during classes, Karen needs some coffee!<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/d3ec9da91288120e5f9bf542a33dfb52f6abc639.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>Karen, a coffee aficionado, wants to know the optimal temperature for brewing the perfect cup of coffee. Indeed, she has spent some time reading several recipe books, including the universally acclaimed \"The Art of the Covfefe\".<\/p><p>She knows <span class=\"tex-span\"><i>n<\/i><\/span> coffee recipes. The <span class=\"tex-span\"><i>i<\/i><\/span>-th recipe suggests that coffee should be brewed between <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> degrees, inclusive, to achieve the optimal taste.<\/p><p>Karen thinks that a temperature is <span class=\"tex-font-style-it\">admissible<\/span> if at least <span class=\"tex-span\"><i>k<\/i><\/span> recipes recommend it.<\/p><p>Karen has a rather fickle mind, and so she asks <span class=\"tex-span\"><i>q<\/i><\/span> questions. In each question, given that she only wants to prepare coffee with a temperature between <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span>, inclusive, can you tell her how many admissible integer temperatures fall within the range?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains three integers, <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009200000<\/span>), and <span class=\"tex-span\"><i>q<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>q<\/i>\u2009\u2264\u2009200000<\/span>), the number of recipes, the minimum number of recipes a certain temperature must be recommended by to be admissible, and the number of questions Karen has, respectively.<\/p><p>The next <span class=\"tex-span\"><i>n<\/i><\/span> lines describe the recipes. Specifically, the <span class=\"tex-span\"><i>i<\/i><\/span>-th line among these contains two integers <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009200000<\/span>), describing that the <span class=\"tex-span\"><i>i<\/i><\/span>-th recipe suggests that the coffee be brewed between <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> degrees, inclusive.<\/p><p>The next <span class=\"tex-span\"><i>q<\/i><\/span> lines describe the questions. Each of these lines contains <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span>, (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i>\u2009\u2264\u2009<i>b<\/i>\u2009\u2264\u2009200000<\/span>), describing that she wants to know the number of admissible integer temperatures between <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span> degrees, inclusive.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each question, output a single integer on a line by itself, the number of admissible integer temperatures between <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span> degrees, inclusive.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 2 4<br/>91 94<br/>92 97<br/>97 99<br/>92 94<br/>93 97<br/>95 96<br/>90 100<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/>3<br/>0<br/>4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 1 1<br/>1 1<br/>200000 200000<br/>90 100<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, Karen knows <span class=\"tex-span\">3<\/span> recipes.<\/p><ol> <li> The first one recommends brewing the coffee between <span class=\"tex-span\">91<\/span> and <span class=\"tex-span\">94<\/span> degrees, inclusive. <\/li><li> The second one recommends brewing the coffee between <span class=\"tex-span\">92<\/span> and <span class=\"tex-span\">97<\/span> degrees, inclusive. <\/li><li> The third one recommends brewing the coffee between <span class=\"tex-span\">97<\/span> and <span class=\"tex-span\">99<\/span> degrees, inclusive. <\/li><\/ol><p>A temperature is <span class=\"tex-font-style-it\">admissible<\/span> if at least <span class=\"tex-span\">2<\/span> recipes recommend it.<\/p><p>She asks <span class=\"tex-span\">4<\/span> questions.<\/p><p>In her first question, she wants to know the number of admissible integer temperatures between <span class=\"tex-span\">92<\/span> and <span class=\"tex-span\">94<\/span> degrees, inclusive. There are <span class=\"tex-span\">3<\/span>: <span class=\"tex-span\">92<\/span>, <span class=\"tex-span\">93<\/span> and <span class=\"tex-span\">94<\/span> degrees are all admissible.<\/p><p>In her second question, she wants to know the number of admissible integer temperatures between <span class=\"tex-span\">93<\/span> and <span class=\"tex-span\">97<\/span> degrees, inclusive. There are <span class=\"tex-span\">3<\/span>: <span class=\"tex-span\">93<\/span>, <span class=\"tex-span\">94<\/span> and <span class=\"tex-span\">97<\/span> degrees are all admissible.<\/p><p>In her third question, she wants to know the number of admissible integer temperatures between <span class=\"tex-span\">95<\/span> and <span class=\"tex-span\">96<\/span> degrees, inclusive. There are none.<\/p><p>In her final question, she wants to know the number of admissible integer temperatures between <span class=\"tex-span\">90<\/span> and <span class=\"tex-span\">100<\/span> degrees, inclusive. There are <span class=\"tex-span\">4<\/span>: <span class=\"tex-span\">92<\/span>, <span class=\"tex-span\">93<\/span>, <span class=\"tex-span\">94<\/span> and <span class=\"tex-span\">97<\/span> degrees are all admissible.<\/p><p>In the second test case, Karen knows <span class=\"tex-span\">2<\/span> recipes.<\/p><ol> <li> The first one, \"wikiHow to make Cold Brew Coffee\", recommends brewing the coffee at exactly <span class=\"tex-span\">1<\/span> degree. <\/li><li> The second one, \"What good is coffee that isn't brewed at at least <span class=\"tex-span\">36.3306<\/span> times the temperature of the surface of the sun?\", recommends brewing the coffee at exactly <span class=\"tex-span\">200000<\/span> degrees. <\/li><\/ol><p>A temperature is <span class=\"tex-font-style-it\">admissible<\/span> if at least <span class=\"tex-span\">1<\/span> recipe recommends it.<\/p><p>In her first and only question, she wants to know the number of admissible integer temperatures that are actually reasonable. There are none.<\/p><\/div><\/div>"}, {"contestId": 515, "index": "C", "name": "Drazil and Factorial", "rating": 1400, "solvedCount": 29164, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Drazil and Factorial<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Drazil is playing a math game with Varda.<\/p><p>Let's define <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/7020b94c48be2ee5b8eeca05f379c8911bb0e7c4.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> for positive integer <span class=\"tex-span\"><i>x<\/i><\/span> as a product of factorials of its digits. For example, <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/6784d861d9a724d0aeddefcb00b7d0c3442ae586.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>.<\/p><p>First, they choose a decimal number <span class=\"tex-span\"><i>a<\/i><\/span> consisting of <span class=\"tex-span\"><i>n<\/i><\/span> digits that contains at least one digit larger than <span class=\"tex-span\">1<\/span>. This number may possibly start with leading zeroes. Then they should find maximum positive number <span class=\"tex-span\"><i>x<\/i><\/span> satisfying following two conditions:<\/p><p>1. <span class=\"tex-span\"><i>x<\/i><\/span> doesn't contain neither digit <span class=\"tex-span\">0<\/span> nor digit <span class=\"tex-span\">1<\/span>.<\/p><p>2. <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/7020b94c48be2ee5b8eeca05f379c8911bb0e7c4.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> = <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/aa57e017a6c74d06b0a54bc47e3f6990e5af38c1.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>.<\/p><p>Help friends find such number.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200915<\/span>) \u2014 the number of digits in <span class=\"tex-span\"><i>a<\/i><\/span>.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> digits of <span class=\"tex-span\"><i>a<\/i><\/span>. There is at least one digit in <span class=\"tex-span\"><i>a<\/i><\/span> that is larger than <span class=\"tex-span\">1<\/span>. Number <span class=\"tex-span\"><i>a<\/i><\/span> may possibly contain leading zeroes.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output a maximum possible integer satisfying the conditions above. There should be no zeroes and ones in this number decimal representation.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>1234<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>33222<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>555<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>555<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first case, <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/f5a4207f23215fddce977ab5ea9e9d2e7578fb52.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><\/div><\/div>"}, {"contestId": 550, "index": "B", "name": "Preparing Olympiad", "rating": 1400, "solvedCount": 29140, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Preparing Olympiad<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You have <span class=\"tex-span\"><i>n<\/i><\/span> problems. You have estimated the difficulty of the <span class=\"tex-span\"><i>i<\/i><\/span>-th one as integer <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. Now you want to prepare a problemset for a contest, using some of the problems you've made.<\/p><p>A problemset for the contest must consist of at least two problems. You think that the total difficulty of the problems of the contest must be at least <span class=\"tex-span\"><i>l<\/i><\/span> and at most <span class=\"tex-span\"><i>r<\/i><\/span>. Also, you think that the difference between difficulties of the easiest and the hardest of the chosen problems must be at least <span class=\"tex-span\"><i>x<\/i><\/span>.<\/p><p>Find the number of ways to choose a problemset for the contest.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains four integers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>l<\/i><\/span>, <span class=\"tex-span\"><i>r<\/i><\/span>, <span class=\"tex-span\"><i>x<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200915<\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup><\/span>) \u2014 the number of problems you have, the minimum and maximum value of total difficulty of the problemset and the minimum difference in difficulty between the hardest problem in the pack and the easiest one, respectively.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>c<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup><\/span>) \u2014 the difficulty of each problem.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the number of ways to choose a suitable problemset for the contest. <\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 5 6 1<br/>1 2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 40 50 10<br/>10 20 30 25<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 25 35 10<br/>10 10 20 10 20<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example two sets are suitable, one consisting of the second and third problem, another one consisting of all three problems.<\/p><p>In the second example, two sets of problems are suitable \u2014 the set of problems with difficulties 10 and 30 as well as the set of problems with difficulties 20 and 30.<\/p><p>In the third example any set consisting of one problem of difficulty 10 and one problem of difficulty 20 is suitable.<\/p><\/div><\/div>"}, {"contestId": 1285, "index": "C", "name": "Fadi and LCM", "rating": 1400, "solvedCount": 29126, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Fadi and LCM<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Today, Osama gave Fadi an integer $$$X$$$, and Fadi was wondering about the minimum possible value of $$$max(a, b)$$$ such that $$$LCM(a, b)$$$ equals $$$X$$$. Both $$$a$$$ and $$$b$$$ should be positive integers.<\/p><p>$$$LCM(a, b)$$$ is the smallest positive integer that is divisible by both $$$a$$$ and $$$b$$$. For example, $$$LCM(6, 8) = 24$$$, $$$LCM(4, 12) = 12$$$, $$$LCM(2, 3) = 6$$$.<\/p><p>Of course, Fadi immediately knew the answer. Can you be just like Fadi and find any such pair?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first and only line contains an integer $$$X$$$ ($$$1 \\le X \\le 10^{12}$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print two positive integers, $$$a$$$ and $$$b$$$, such that the value of $$$max(a, b)$$$ is minimum possible and $$$LCM(a, b)$$$ equals $$$X$$$. If there are several possible such pairs, you can print any.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2 3\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 4\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 1\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1475, "index": "C", "name": "Ball in Berland", "rating": 1400, "solvedCount": 28770, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Ball in Berland<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>At the school where Vasya is studying, preparations are underway for the graduation ceremony. One of the planned performances is a ball, which will be attended by pairs of boys and girls.<\/p><p>Each class must present two couples to the ball. In Vasya's class, $$$a$$$ boys and $$$b$$$ girls wish to participate. But not all boys and not all girls are ready to dance in pairs.<\/p><p>Formally, you know $$$k$$$ possible one-boy-one-girl pairs. You need to choose two of these pairs so that no person is in more than one pair.<\/p><p>For example, if $$$a=3$$$, $$$b=4$$$, $$$k=4$$$ and the couples $$$(1, 2)$$$, $$$(1, 3)$$$, $$$(2, 2)$$$, $$$(3, 4)$$$ are ready to dance together (in each pair, the boy's number comes first, then the girl's number), then the following combinations of two pairs are possible (not all possible options are listed below): <\/p><ul> <li> $$$(1, 3)$$$ and $$$(2, 2)$$$; <\/li><li> $$$(3, 4)$$$ and $$$(1, 3)$$$; <\/li><\/ul><p>But the following combinations are not possible: <\/p><ul> <li> $$$(1, 3)$$$ and $$$(1, 2)$$$\u00a0\u2014 the first boy enters two pairs; <\/li><li> $$$(1, 2)$$$ and $$$(2, 2)$$$\u00a0\u2014 the second girl enters two pairs; <\/li><\/ul><p>Find the number of ways to select two pairs that match the condition above. Two ways are considered different if they consist of different pairs.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases. Then $$$t$$$ test cases follow.<\/p><p>The first line of each test case contains three integers $$$a$$$, $$$b$$$ and $$$k$$$ ($$$1 \\le a, b, k \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of boys and girls in the class and the number of couples ready to dance together.<\/p><p>The second line of each test case contains $$$k$$$ integers $$$a_1, a_2, \\ldots a_k$$$. ($$$1 \\le a_i \\le a$$$), where $$$a_i$$$ is the number of the boy in the pair with the number $$$i$$$.<\/p><p>The third line of each test case contains $$$k$$$ integers $$$b_1, b_2, \\ldots b_k$$$. ($$$1 \\le b_i \\le b$$$), where $$$b_i$$$ is the number of the girl in the pair with the number $$$i$$$.<\/p><p>It is guaranteed that the sums of $$$a$$$, $$$b$$$, and $$$k$$$ over all test cases do not exceed $$$2 \\cdot 10^5$$$.<\/p><p>It is guaranteed that each pair is specified at most once in one test case.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, on a separate line print one integer\u00a0\u2014 the number of ways to choose two pairs that match the condition above.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n3 4 4\n1 1 2 3\n2 3 2 4\n1 1 1\n1\n1\n2 2 4\n1 1 2 2\n1 2 1 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n0\n2\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the following combinations of pairs fit: <\/p><ul> <li> $$$(1, 2)$$$ and $$$(3, 4)$$$; <\/li><li> $$$(1, 3)$$$ and $$$(2, 2)$$$; <\/li><li> $$$(1, 3)$$$ and $$$(3, 4)$$$; <\/li><li> $$$(2, 2)$$$ and $$$(3, 4)$$$. <\/li><\/ul><p>There is only one pair in the second test case.<\/p><p>In the third test case, the following combinations of pairs fit: <\/p><ul> <li> $$$(1, 1)$$$ and $$$(2, 2)$$$; <\/li><li> $$$(1, 2)$$$ and $$$(2, 1)$$$. <\/li><\/ul><\/div><\/div>"}, {"contestId": 1692, "index": "G", "name": "2^Sort", "rating": 1400, "solvedCount": 28458, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. 2^Sort<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Given an array $$$a$$$ of length $$$n$$$ and an integer $$$k$$$, find the number of indices $$$1 \\leq i \\leq n - k$$$ such that the subarray $$$[a_i, \\dots, a_{i+k}]$$$ with length $$$k+1$$$ (<span class=\"tex-font-style-bf\">not<\/span> with length $$$k$$$) has the following property: <\/p><ul> <li> If you multiply the first element by $$$2^0$$$, the second element by $$$2^1$$$, ..., and the ($$$k+1$$$)-st element by $$$2^k$$$, then this subarray is sorted in strictly increasing order. <\/li><\/ul> More formally, count the number of indices $$$1 \\leq i \\leq n - k$$$ such that $$$$$$2^0 \\cdot a_i  \\lt  2^1 \\cdot a_{i+1}  \\lt  2^2 \\cdot a_{i+2}  \\lt  \\dots  \\lt  2^k \\cdot a_{i+k}.$$$$$$ <\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$t$$$ ($$$1 \\leq t \\leq 1000$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains two integers $$$n$$$, $$$k$$$ ($$$3 \\leq n \\leq 2 \\cdot 10^5$$$, $$$1 \\leq k  \\lt  n$$$)\u00a0\u2014 the length of the array and the number of inequalities.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\leq a_i \\leq 10^9$$$)\u00a0\u2014 the elements of the array.<\/p><p>The sum of $$$n$$$ across all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer\u00a0\u2014 the number of indices satisfying the condition in the statement.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">20 22 19 84<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">9 5 3 2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">9 5 3 2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">7 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">22 12 16 4 3 22 12<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">7 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">22 12 16 4 3 22 12<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">9 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">3 9 12 3 9 12 3 9 12<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n3\n2\n3\n1\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, both subarrays satisfy the condition: <\/p><ul> <li> $$$i=1$$$: the subarray $$$[a_1,a_2,a_3] = [20,22,19]$$$, and $$$1 \\cdot 20  \\lt  2 \\cdot 22  \\lt  4 \\cdot 19$$$. <\/li><li> $$$i=2$$$: the subarray $$$[a_2,a_3,a_4] = [22,19,84]$$$, and $$$1 \\cdot 22  \\lt  2 \\cdot 19  \\lt  4 \\cdot 84$$$. <\/li><\/ul> In the second test case, three subarrays satisfy the condition: <ul> <li> $$$i=1$$$: the subarray $$$[a_1,a_2] = [9,5]$$$, and $$$1 \\cdot 9  \\lt  2 \\cdot 5$$$. <\/li><li> $$$i=2$$$: the subarray $$$[a_2,a_3] = [5,3]$$$, and $$$1 \\cdot 5  \\lt  2 \\cdot 3$$$. <\/li><li> $$$i=3$$$: the subarray $$$[a_3,a_4] = [3,2]$$$, and $$$1 \\cdot 3  \\lt  2 \\cdot 2$$$. <\/li><li> $$$i=4$$$: the subarray $$$[a_4,a_5] = [2,1]$$$, but $$$1 \\cdot 2 = 2 \\cdot 1$$$, so this subarray doesn't satisfy the condition. <\/li><\/ul><\/div><\/div>"}, {"contestId": 1931, "index": "E", "name": "Anna and the Valentine's Day Gift", "rating": 1400, "solvedCount": 28179, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Anna and the Valentine's Day Gift<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Sasha gave Anna a list $$$a$$$ of $$$n$$$ integers for Valentine's Day. Anna doesn't need

t, there is no solution.<\/p><\/div><\/div>"}, {"contestId": 1659, "index": "C", "name": "Line Empire", "rating": 1500, "solvedCount": 16256, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Line Empire<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-it\">You are an ambitious king who wants to be the Emperor of The Reals. But to do that, you must first become Emperor of The Integers.<\/span><\/p><p>Consider a number axis. The capital of your empire is initially at $$$0$$$. There are $$$n$$$ unconquered kingdoms at positions $$$0 \\lt x_1 \\lt x_2 \\lt \\ldots \\lt x_n$$$. You want to conquer all other kingdoms.<\/p><p>There are two actions available to you: <\/p><ul> <li> You can change the location of your capital (let its current position be $$$c_1$$$) to any other <span class=\"tex-font-style-bf\">conquered<\/span> kingdom (let its position be $$$c_2$$$) at a cost of $$$a\\cdot |c_1-c_2|$$$. <\/li><li> From the current capital (let its current position be $$$c_1$$$) you can conquer an unconquered kingdom (let its position be $$$c_2$$$) at a cost of $$$b\\cdot |c_1-c_2|$$$. You <span class=\"tex-font-style-bf\">cannot<\/span> conquer a kingdom if there is an unconquered kingdom between the target and your capital. <\/li><\/ul><p>Note that you <span class=\"tex-font-style-bf\">cannot<\/span> place the capital at a point without a kingdom. In other words, at any point, your capital can only be at $$$0$$$ or one of $$$x_1,x_2,\\ldots,x_n$$$. Also note that conquering a kingdom does not change the position of your capital.<\/p><p>Find the minimum total cost to conquer all kingdoms. Your capital can be anywhere at the end.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 1000$$$) \u00a0\u2014 the number of test cases. The description of each test case follows.<\/p><p>The first line of each test case contains $$$3$$$ integers $$$n$$$, $$$a$$$, and $$$b$$$ ($$$1 \\leq n \\leq 2 \\cdot 10^5$$$; $$$1 \\leq a,b \\leq 10^5$$$).<\/p><p>The second line of each test case contains $$$n$$$ integers $$$x_1, x_2, \\ldots, x_n$$$ ($$$1 \\leq x_1  \\lt  x_2  \\lt  \\ldots  \\lt  x_n \\leq 10^8$$$).<\/p><p>The sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer \u00a0\u2014 the minimum cost to conquer all kingdoms.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 2 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 5 12 13 21<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 6 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 5 6 21 30<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 9 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">10 15<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">11 27182 31415<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">16 18 33 98 874 989 4848 20458 34365 38117 72030<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n173\n171\n75\n3298918744\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Here is an optimal sequence of moves for the second test case:<\/p><ol> <li> Conquer the kingdom at position $$$1$$$ with cost $$$3\\cdot(1-0)=3$$$. <\/li><li> Move the capital to the kingdom at position $$$1$$$ with cost $$$6\\cdot(1-0)=6$$$. <\/li><li> Conquer the kingdom at position $$$5$$$ with cost $$$3\\cdot(5-1)=12$$$. <\/li><li> Move the capital to the kingdom at position $$$5$$$ with cost $$$6\\cdot(5-1)=24$$$. <\/li><li> Conquer the kingdom at position $$$6$$$ with cost $$$3\\cdot(6-5)=3$$$. <\/li><li> Conquer the kingdom at position $$$21$$$ with cost $$$3\\cdot(21-5)=48$$$. <\/li><li> Conquer the kingdom at position $$$30$$$ with cost $$$3\\cdot(30-5)=75$$$. <\/li><\/ol><p>The total cost is $$$3+6+12+24+3+48+75=171$$$. You cannot get a lower cost than this.<\/p><\/div><\/div>"}, {"contestId": 1391, "index": "C", "name": "Cyclic Permutations ", "rating": 1500, "solvedCount": 16222, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Cyclic Permutations <\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>A permutation of length $$$n$$$ is an array consisting of $$$n$$$ distinct integers from $$$1$$$ to $$$n$$$ in arbitrary order. For example, $$$[2,3,1,5,4]$$$ is a permutation, but $$$[1,2,2]$$$ is not a permutation ($$$2$$$ appears twice in the array) and $$$[1,3,4]$$$ is also not a permutation ($$$n=3$$$ but there is $$$4$$$ in the array).<\/p><p>Consider a permutation $$$p$$$ of length $$$n$$$, we build a graph of size $$$n$$$ using it as follows: <\/p><ul> <li> For every $$$1 \\leq i \\leq n$$$, find the <span class=\"tex-font-style-bf\">largest<\/span> $$$j$$$ such that $$$1 \\leq j  \\lt  i$$$ and $$$p_j  \\gt  p_i$$$, and add an undirected edge between node $$$i$$$ and node $$$j$$$ <\/li><li> For every $$$1 \\leq i \\leq n$$$, find the <span class=\"tex-font-style-bf\">smallest<\/span> $$$j$$$ such that $$$i  \\lt  j \\leq n$$$ and $$$p_j  \\gt  p_i$$$, and add an undirected edge between node $$$i$$$ and node $$$j$$$ <\/li><\/ul><p>In cases where no such $$$j$$$ exists, we make no edges. Also, note that we make edges between the corresponding indices, not the values at those indices.<\/p><p>For clarity, consider as an example $$$n = 4$$$, and $$$p = [3,1,4,2]$$$; here, the edges of the graph are $$$(1,3),(2,1),(2,3),(4,3)$$$.<\/p><p>A permutation $$$p$$$ is <span class=\"tex-font-style-bf\">cyclic<\/span> if the graph built using $$$p$$$ has at least one simple cycle. <\/p><p>Given $$$n$$$, find the number of cyclic permutations of length $$$n$$$. Since the number may be very large, output it modulo $$$10^9+7$$$.<\/p><p>Please refer to the Notes section for the formal definition of a simple cycle<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first and only line contains a single integer $$$n$$$ ($$$3 \\le n \\le 10^6$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output a single integer $$$0 \\leq x  \\lt  10^9+7$$$, the number of cyclic permutations of length $$$n$$$ modulo $$$10^9+7$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n16<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n583291\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n135712853<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>There are $$$16$$$ cyclic permutations for $$$n = 4$$$. $$$[4,2,1,3]$$$ is one such permutation, having a cycle of length four: $$$4 \\rightarrow 3 \\rightarrow 2 \\rightarrow 1 \\rightarrow 4$$$.<\/p><p>Nodes $$$v_1$$$, $$$v_2$$$, $$$\\ldots$$$, $$$v_k$$$ form a simple cycle if the following conditions hold: <\/p><ul> <li> $$$k \\geq 3$$$. <\/li><li> $$$v_i \\neq v_j$$$ for any pair of indices $$$i$$$ and $$$j$$$. ($$$1 \\leq i  \\lt  j \\leq k$$$) <\/li><li> $$$v_i$$$ and $$$v_{i+1}$$$ share an edge for all $$$i$$$ ($$$1 \\leq i  \\lt  k$$$), and $$$v_1$$$ and $$$v_k$$$ share an edge. <\/li><\/ul><\/div><\/div>"}, {"contestId": 576, "index": "A", "name": "Vasya and Petya's Game", "rating": 1500, "solvedCount": 16192, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. Vasya and Petya's Game<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Vasya and Petya are playing a simple game. Vasya thought of number <span class=\"tex-span\"><i>x<\/i><\/span> between <span class=\"tex-span\">1<\/span> and <span class=\"tex-span\"><i>n<\/i><\/span>, and Petya tries to guess the number.<\/p><p>Petya can ask questions like: \"Is the unknown number divisible by number <span class=\"tex-span\"><i>y<\/i><\/span>?\".<\/p><p>The game is played by the following rules: first Petya asks <span class=\"tex-font-style-bf\">all<\/span> the questions that interest him (also, he can ask no questions), and then Vasya responds to each question with a 'yes' or a 'no'. After receiving all the answers Petya should determine the number that Vasya thought of.<\/p><p>Unfortunately, Petya is not familiar with the number theory. Help him find the minimum number of questions he should ask to make a guaranteed guess of Vasya's number, and the numbers <span class=\"tex-span\"><i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, he should ask the questions about.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>A single line contains number <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">3<\/sup><\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the length of the sequence of questions <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>), followed by <span class=\"tex-span\"><i>k<\/i><\/span> numbers \u2014 the questions <span class=\"tex-span\"><i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>).<\/p><p>If there are several correct sequences of questions of the minimum length, you are allowed to print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/>2 4 3 <br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>6<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/>2 4 3 5 <br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The sequence from the answer to the first sample test is actually correct.<\/p><p>If the unknown number is not divisible by one of the sequence numbers, it is equal to <span class=\"tex-span\">1<\/span>.<\/p><p>If the unknown number is divisible by <span class=\"tex-span\">4<\/span>, it is <span class=\"tex-span\">4<\/span>.<\/p><p>If the unknown number is divisible by <span class=\"tex-span\">3<\/span>, then the unknown number is <span class=\"tex-span\">3<\/span>.<\/p><p>Otherwise, it is equal to <span class=\"tex-span\">2<\/span>. Therefore, the sequence of questions allows you to guess the unknown number. It can be shown that there is no correct sequence of questions of length 2 or shorter.<\/p><\/div><\/div>"}, {"contestId": 1791, "index": "F", "name": "Range Update Point Query", "rating": 1500, "solvedCount": 16036, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Range Update Point Query<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Given an array $$$a_1, a_2, \\dots, a_n$$$, you need to handle a total of $$$q$$$ updates and queries of two types:<\/p><ul> <li> $$$1$$$\u00a0$$$l$$$\u00a0$$$r$$$\u00a0\u2014 for each index $$$i$$$ with $$$l \\leq i \\leq r$$$, update the value of $$$a_i$$$ to the sum of the digits of $$$a_i$$$. <\/li><li> $$$2$$$\u00a0$$$x$$$\u00a0\u2014 output $$$a_x$$$. <\/li><\/ul><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains an integer $$$t$$$ ($$$1 \\leq t \\leq 1000$$$)\u00a0\u2014 the number of testcases.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$q$$$ ($$$1 \\le n, q \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the size of the array and the number of queries, respectively.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$).<\/p><p>The next $$$q$$$ lines of each test case are of two forms:<\/p><ul> <li> $$$1$$$\u00a0$$$l$$$\u00a0$$$r$$$ ($$$1 \\leq l \\leq r \\leq n$$$)\u00a0\u2014 it means, for each index $$$i$$$ with $$$l \\leq i \\leq r$$$, you should update the value of $$$a_i$$$ to the sum of its digits. <\/li><li> $$$2$$$\u00a0$$$x$$$ ($$$1 \\leq x \\leq n$$$)\u00a0\u2014 it means you should output $$$a_x$$$. <\/li><\/ul><p>There is at least one query of the second type.<\/p><p>The sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><p>The sum of $$$q$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output the answers of queries of the second type, in the order they are given.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 420 69 1434 2023<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">9999 1000<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n15\n1434\n1\n6\n7\n36\n1\n1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the following process occurs: <\/p><ul> <li> Initially, $$$a = [1, 420, 69, 1434, 2023]$$$. <\/li><li> The operation is performed for $$$l=2$$$, $$$r=3$$$, yielding $$$[1, \\color{red}{6}, \\color{red}{15}, 1434, 2023]$$$. <\/li><li> We are queried for $$$x=2$$$, $$$x=3$$$, and $$$x=4$$$, and output $$$6$$$, $$$15$$$, and $$$1434$$$. <\/li><li> The operation is performed for $$$l=2$$$, $$$r=5$$$, yielding $$$[1, \\color{red}{6}, \\color{red}{6}, \\color{red}{12}, \\color{red}{7}]$$$. <\/li><li> We are queried for $$$x=1$$$, $$$x=3$$$, and $$$x=5$$$, and output $$$1$$$, $$$6$$$, and $$$7$$$. <\/li><\/ul><\/div><\/div>"}, {"contestId": 1850, "index": "G", "name": "The Morning Star", "rating": 1500, "solvedCount": 15913, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. The Morning Star<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>A compass points directly toward the morning star. It can only point in one of eight directions: the four cardinal directions (N, S, E, W) or some combination (NW, NE, SW, SE). Otherwise, it will break.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/a9149f8421b99d863b7db7e4fbe53bd0dc54fb70.png\" style=\"zoom: 15.0%;max-width: 100.0%;max-height: 100.0%;\"/> <span class=\"tex-font-size-small\">The directions the compass can point.<\/span> <\/center><p>There are $$$n$$$ distinct points with integer coordinates on a plane. How many ways can you put a compass at one point and the morning star at another so that the compass does not break?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$2 \\leq n \\leq 2 \\cdot 10^5$$$)\u00a0\u2014 the number of points.<\/p><p>Then $$$n$$$ lines follow, each line containing two integers $$$x_i$$$, $$$y_i$$$ ($$$-10^9 \\leq x_i, y_i \\leq 10^9$$$)\u00a0\u2014 the coordinates of each point, all points have distinct coordinates.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases doesn't exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer\u00a0\u2014 the number of pairs of points that don't break the compass.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">0 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">-1 -1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">6 9<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">10 13<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">-1000000000 1000000000<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1000000000 -1000000000<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">0 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">-1 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">-1 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 11<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">0 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">-1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 -2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n2\n6\n8\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, any pair of points won't break the compass: <\/p><ul> <li> The compass is at $$$(0,0)$$$, the morning star is at $$$(-1,-1)$$$: the compass will point $$$\\text{SW}$$$. <\/li><li> The compass is at $$$(0,0)$$$, the morning star is at $$$(1,1)$$$: the compass will point $$$\\text{NE}$$$. <\/li><li> The compass is at $$$(-1,-1)$$$, the morning star is at $$$(0,0)$$$: the compass will point $$$\\text{NE}$$$. <\/li><li> The compass is at $$$(-1,-1)$$$, the morning star is at $$$(1,1)$$$: the compass will point $$$\\text{NE}$$$. <\/li><li> The compass is at $$$(1,1)$$$, the morning star is at $$$(0,0)$$$: the compass will point $$$\\text{SW}$$$. <\/li><li> The compass is at $$$(1,1)$$$, the morning star is at $$$(-1,-1)$$$: the compass will point $$$\\text{SW}$$$. <\/li><\/ul><p>In the second test case, only two pairs of points won't break the compass: <\/p><ul> <li> The compass is at $$$(6,9)$$$, the morning star is at $$$(10,13)$$$: the compass will point $$$\\text{NE}$$$. <\/li><li> The compass is at $$$(10,13)$$$, the morning star is at $$$(6,9)$$$: the compass will point $$$\\text{SW}$$$. <\/li><\/ul><\/div><\/div>"}, {"contestId": 1296, "index": "C", "name": "Yet Another Walking Robot", "rating": 1500, "solvedCount": 15863, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Yet Another Walking Robot<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There is a robot on a coordinate plane. Initially, the robot is located at the point $$$(0, 0)$$$. Its path is described as a string $$$s$$$ of length $$$n$$$ consisting of characters '<span class=\"tex-font-style-tt\">L<\/span>', '<span class=\"tex-font-style-tt\">R<\/span>', '<span class=\"tex-font-style-tt\">U<\/span>', '<span class=\"tex-font-style-tt\">D<\/span>'.<\/p><p>Each of these characters corresponds to some move: <\/p><ul> <li> '<span class=\"tex-font-style-tt\">L<\/span>' (left): means that the robot moves from the point $$$(x, y)$$$ to the point $$$(x - 1, y)$$$; <\/li><li> '<span class=\"tex-font-style-tt\">R<\/span>' (right): means that the robot moves from the point $$$(x, y)$$$ to the point $$$(x + 1, y)$$$; <\/li><li> '<span class=\"tex-font-style-tt\">U<\/span>' (up): means that the robot moves from the point $$$(x, y)$$$ to the point $$$(x, y + 1)$$$; <\/li><li> '<span class=\"tex-font-style-tt\">D<\/span>' (down): means that the robot moves from the point $$$(x, y)$$$ to the point $$$(x, y - 1)$$$. <\/li><\/ul><p>The company that created this robot asked you to optimize the path of the robot somehow. To do this, you can remove <span class=\"tex-font-style-bf\">any non-empty substring<\/span> of the path. But this company doesn't want their customers to notice the change in the robot behavior. It means that if before the optimization the robot ended its path at the point $$$(x_e, y_e)$$$, then after optimization (i.e. removing some single substring from $$$s$$$) the robot also ends its path at the point $$$(x_e, y_e)$$$.<\/p><p>This optimization is a low-budget project so you need to remove <span class=\"tex-font-style-bf\">the shortest<\/span> possible <span class=\"tex-font-style-bf\">non-empty<\/span> substring to optimize the robot's path such that the endpoint of his path doesn't change. It is possible that you can't optimize the path. Also, it is possible that after the optimization the target path is an empty string (i.e. deleted substring is the whole string $$$s$$$).<\/p><p>Recall that the substring of $$$s$$$ is such string that can be obtained from $$$s$$$ by removing some amount of characters (possibly, zero) from the prefix and some amount of characters (possibly, zero) from the suffix. For example, the substrings of \"<span class=\"tex-font-style-tt\">LURLLR<\/span>\" are \"<span class=\"tex-font-style-tt\">LU<\/span>\", \"<span class=\"tex-font-style-tt\">LR<\/span>\", \"<span class=\"tex-font-style-tt\">LURLLR<\/span>\", \"<span class=\"tex-font-style-tt\">URL<\/span>\", but not \"<span class=\"tex-font-style-tt\">RR<\/span>\" and \"<span class=\"tex-font-style-tt\">UL<\/span>\".<\/p><p>You have to answer $$$t$$$ independent test cases.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains one integer $$$t$$$ ($$$1 \\le t \\le 1000$$$) \u2014 the number of test cases.<\/p><p>The next $$$2t$$$ lines describe test cases. Each test case is given on two lines. The first line of the test case contains one integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$) \u2014 the length of the robot's path. The second line of the test case contains one string $$$s$$$ consisting of $$$n$$$ characters '<span class=\"tex-font-style-tt\">L<\/span>', '<span class=\"tex-font-style-tt\">R<\/span>', '<span class=\"tex-font-style-tt\">U<\/span>', '<span class=\"tex-font-style-tt\">D<\/span>' \u2014 the robot's path.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$ ($$$\\sum n \\le 2 \\cdot 10^5$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print the answer on it. If you cannot remove such <span class=\"tex-font-style-bf\">non-empty<\/span> substring that the endpoint of the robot's path doesn't change, print <span class=\"tex-font-style-tt\">-1<\/span>. Otherwise, print two integers $$$l$$$ and $$$r$$$ such that $$$1 \\le l \\le r \\le n$$$ \u2014 endpoints of the substring you remove. The value $$$r-l+1$$$ should be minimum possible. If there are several answers, print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n4\nLRUD\n4\nLURD\n5\nRRUDU\n5\nLLDDR\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 2\n1 4\n3 4\n-1\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1800, "index": "E2", "name": "Unforgivable Curse (hard version)", "rating": 1500, "solvedCount": 15705, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E2. Unforgivable Curse (hard version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is a complex version of the problem. This version has no additional restrictions on the number $$$k$$$.<\/span><\/p><p>The chief wizard of the Wizengamot once caught the evil wizard Drahyrt, but the evil wizard has returned and wants revenge on the chief wizard. So he stole <span class=\"tex-font-style-it\">spell<\/span> $$$s$$$ from his student Harry.<\/p><p>The <span class=\"tex-font-style-it\">spell<\/span>\u00a0\u2014 is a $$$n$$$-length string of lowercase Latin letters.<\/p><p>Drahyrt wants to replace <span class=\"tex-font-style-it\">spell<\/span> with an unforgivable curse\u00a0\u2014 string $$$t$$$.<\/p><p>Dragirt, using ancient magic, can swap letters at a distance $$$k$$$ or $$$k+1$$$ in <span class=\"tex-font-style-it\">spell<\/span> as many times as he wants. In other words, Drahyrt can change letters in positions $$$i$$$ and $$$j$$$ in <span class=\"tex-font-style-it\">spell<\/span> $$$s$$$ if $$$|i-j|=k$$$ or $$$|i-j|=k+1$$$.<\/p><p>For example, if $$$k = 3, s = $$$ \"<span class=\"tex-font-style-tt\">talant<\/span>\" and $$$t = $$$ \"<span class=\"tex-font-style-tt\">atltna<\/span>\", Drahyrt can act as follows:<\/p><ul> <li> swap the letters at positions $$$1$$$ and $$$4$$$ to get <span class=\"tex-font-style-it\">spell<\/span> \"<span class=\"tex-font-style-tt\">aaltnt<\/span>\". <\/li><li> swap the letters at positions $$$2$$$ and $$$6$$$ to get <span class=\"tex-font-style-it\">spell<\/span> \"<span class=\"tex-font-style-tt\">atltna<\/span>\". <\/li><\/ul><p>You are given <span class=\"tex-font-style-it\">spells<\/span> $$$s$$$ and $$$t$$$. Can Drahyrt change <span class=\"tex-font-style-it\">spell<\/span> $$$s$$$ to $$$t$$$?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input gives a single integer $$$T$$$ ($$$1 \\le T \\le 10^4$$$)\u00a0\u2014 the number of test cases in the test.<\/p><p>Descriptions of the test cases are follow.<\/p><p>The first line contains two integers $$$n, k$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$, $$$1 \\le k \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the length <span class=\"tex-font-style-it\">spells<\/span> and the number $$$k$$$ such that Drahyrt can change letters in a spell at a distance $$$k$$$ or $$$k+1$$$.<\/p><p>The second line gives <span class=\"tex-font-style-it\">spell<\/span> $$$s$$$\u00a0\u2014 a string of length $$$n$$$ consisting of lowercase Latin letters.<\/p><p>The third line gives <span class=\"tex-font-style-it\">spell<\/span> $$$t$$$\u00a0\u2014 a string of length $$$n$$$ consisting of lowercase Latin letters.<\/p><p>It is guaranteed that the sum of $$$n$$$ values over all test cases does not exceed $$$2 \\cdot 10^5$$$. Note that there is no limit on the sum of $$$k$$$ values over all test cases.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output on a separate line \"<span class=\"tex-font-style-tt\">YES<\/span>\" if Drahyrt can change <span class=\"tex-font-style-it\">spell<\/span> $$$s$$$ to $$$t$$$ and \"<span class=\"tex-font-style-tt\">NO<\/span>\" otherwise.<\/p><p>You can output the answer in any case (for example, lines \"<span class=\"tex-font-style-tt\">yEs<\/span>\", \"<span class=\"tex-font-style-tt\">yes<\/span>\", \"<span class=\"tex-font-style-tt\">Yes<\/span>\" and \"<span class=\"tex-font-style-tt\">YES<\/span>\" will be recognized as positive answer).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">6 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">talant<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">atltna<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">7 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">abacaba<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">aaaabbc<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">12 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">abracadabraa<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">avadakedavra<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">accio<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">cicao<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">lumos<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">molus<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">4 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">uwjt<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">twju<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">kvpx<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">vxpk<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nYES\nNO\nYES\nNO\nYES\nNO\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The first case is explained in the condition.<\/p><p>In the second case, we can swap adjacent letters, so we can sort the string using bubble sorting, for example.<\/p><p>In the third case, we can show that from the string $$$s$$$ we cannot get the string $$$t$$$ by swapping letters at a distance of $$$6$$$ or $$$7$$$.<\/p><p>In the fourth case, for example, the following sequence of transformations is appropriate:<\/p><ul> <li> \"<span class=\"tex-font-style-tt\">accio<\/span>\" $$$\\rightarrow$$$ \"<span class=\"tex-font-style-tt\">aocic<\/span>\" $$$\\rightarrow$$$ \"<span class=\"tex-font-style-tt\">cocia<\/span>\" $$$\\rightarrow$$$ \"<span class=\"tex-font-style-tt\">iocca<\/span>\" $$$\\rightarrow$$$ \"<span class=\"tex-font-style-tt\">aocci<\/span>\" $$$\\rightarrow$$$ \"<span class=\"tex-font-style-tt\">aicco<\/span>\" $$$\\rightarrow$$$ \"<span class=\"tex-font-style-tt\">cicao<\/span>\" <\/li><\/ul><p>In the fifth case, we can show that it is impossible to get the string $$$s$$$ from the string $$$t$$$.<\/p><p>In the sixth example, it is enough to swap the two outermost letters.<\/p><\/div><\/div>"}, {"contestId": 1462, "index": "E1", "name": "Close Tuples (easy version)", "rating": 1500, "solvedCount": 15679, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E1. Close Tuples (easy version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is the easy version of this problem. The only difference between easy and hard versions is the constraints on $$$k$$$ and $$$m$$$ (in this version $$$k=2$$$ and $$$m=3$$$). Also, in this version of the problem, you DON'T NEED to output the answer by modulo.<\/span><\/p><p>You are given a sequence $$$a$$$ of length $$$n$$$ consisting of integers from $$$1$$$ to $$$n$$$. <span class=\"tex-font-style-bf\">The sequence may contain duplicates (i.e. some elements can be equal)<\/span>.<\/p><p>Find the number of tuples of $$$m = 3$$$ elements such that the maximum number in the tuple differs from the minimum by no more than $$$k = 2$$$. Formally, you need to find the number of triples of indices $$$i  \\lt  j  \\lt  z$$$ such that<\/p><p>$$$$$$\\max(a_i, a_j, a_z) - \\min(a_i, a_j, a_z) \\le 2.$$$$$$<\/p><p>For example, if $$$n=4$$$ and $$$a=[1,2,4,3]$$$, then there are two such triples ($$$i=1, j=2, z=4$$$ and $$$i=2, j=3, z=4$$$). If $$$n=4$$$ and $$$a=[1,1,1,1]$$$, then all four possible triples are suitable.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of test cases. Then $$$t$$$ test cases follow.<\/p><p>The first line of each test case contains an integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the length of the sequence $$$a$$$.<\/p><p>The next line contains $$$n$$$ integers $$$a_1, a_2,\\ldots, a_n$$$ ($$$1 \\le a_i \\le n$$$)\u00a0\u2014 the sequence $$$a$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ for all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output $$$t$$$ answers to the given test cases. Each answer is the required number of triples of elements, such that the maximum value in the triple differs from the minimum by no more than $$$2$$$. Note that in difference to the hard version of the problem, you <span class=\"tex-font-style-bf\">don't need<\/span> to output the answer by modulo. You must output the exact value of the answer.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n4\n1 2 4 3\n4\n1 1 1 1\n1\n1\n10\n5 6 1 3 2 9 8 1 2 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n4\n0\n15\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1253, "index": "C", "name": "Sweets Eating", "rating": 1500, "solvedCount": 15676, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Sweets Eating<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Tsumugi brought $$$n$$$ delicious sweets to the Light Music Club. They are numbered from $$$1$$$ to $$$n$$$, where the $$$i$$$-th sweet has a sugar concentration described by an integer $$$a_i$$$.<\/p><p>Yui loves sweets, but she can eat at most $$$m$$$ sweets each day for health reasons.<\/p><p>Days are $$$1$$$-indexed (numbered $$$1, 2, 3, \\ldots$$$). Eating the sweet $$$i$$$ at the $$$d$$$-th day will cause a sugar penalty of $$$(d \\cdot a_i)$$$, as sweets become more sugary with time. A sweet can be eaten at most once.<\/p><p>The total sugar penalty will be the <span class=\"tex-font-style-bf\">sum<\/span> of the individual penalties of each sweet eaten.<\/p><p>Suppose that Yui chooses exactly $$$k$$$ sweets, and eats them in any order she wants. What is the <span class=\"tex-font-style-bf\">minimum<\/span> total sugar penalty she can get?<\/p><p>Since Yui is an undecided girl, she wants you to answer this question for every value of $$$k$$$ between $$$1$$$ and $$$n$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\le m \\le n \\le 200\\ 000$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le 200\\ 000$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>You have to output $$$n$$$ integers $$$x_1, x_2, \\ldots, x_n$$$ on a single line, separed by spaces, where $$$x_k$$$ is the minimum total sugar penalty Yui can get if she eats exactly $$$k$$$ sweets.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n9 2\n6 19 3 4 4 2 6 7 8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2 5 11 18 30 43 62 83 121\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1 1\n7\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n7\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Let's analyze the answer for $$$k = 5$$$ in the first example. Here is <span class=\"tex-font-style-bf\">one<\/span> of the possible ways to eat $$$5$$$ sweets that minimize total sugar penalty:<\/p><ul> <li> Day $$$1$$$: sweets $$$1$$$ and $$$4$$$ <\/li><li> Day $$$2$$$: sweets $$$5$$$ and $$$3$$$ <\/li><li> Day $$$3$$$ : sweet $$$6$$$ <\/li><\/ul><p>Total penalty is $$$1 \\cdot a_1 + 1 \\cdot a_4 + 2 \\cdot a_5 + 2 \\cdot a_3 + 3 \\cdot a_6 = 6 + 4 + 8 + 6 + 6 = 30$$$. We can prove that it's the minimum total sugar penalty Yui can achieve if she eats $$$5$$$ sweets, hence $$$x_5 = 30$$$.<\/p><\/div><\/div>"}, {"contestId": 1487, "index": "C", "name": "Minimum Ties", "rating": 1500, "solvedCount": 15603, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Minimum Ties<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>A big football championship will occur soon! $$$n$$$ teams will compete in it, and each pair of teams will play exactly one game against each other.<\/p><p>There are two possible outcomes of a game:<\/p><ul> <li> the game may result in a tie, then both teams get $$$1$$$ point; <\/li><li> one team might win in a game, then the winning team gets $$$3$$$ points and the losing team gets $$$0$$$ points. <\/li><\/ul><p>The score of a team is the number of points it gained during all games that it played.<\/p><p>You are interested in a hypothetical situation when all teams get the same score at the end of the championship. A simple example of that situation is when all games result in ties, but you want to minimize the number of ties as well.<\/p><p>Your task is to describe a situation (choose the result of each game) so that all teams get the same score, and the number of ties is the minimum possible.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 100$$$) \u2014 the number of test cases.<\/p><p>Then the test cases follow. Each test case is described by one line containing one integer $$$n$$$ ($$$2 \\le n \\le 100$$$) \u2014 the number of teams.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print $$$\\frac{n(n - 1)}{2}$$$ integers describing the results of the games in the following order: the first integer should correspond to the match between team $$$1$$$ and team $$$2$$$, the second \u2014 between team $$$1$$$ and team $$$3$$$, then $$$1$$$ and $$$4$$$, ..., $$$1$$$ and $$$n$$$, $$$2$$$ and $$$3$$$, $$$2$$$ and $$$4$$$, ..., $$$2$$$ and $$$n$$$, and so on, until the game between the team $$$n - 1$$$ and the team $$$n$$$.<\/p><p>The integer corresponding to the game between the team $$$x$$$ and the team $$$y$$$ should be $$$1$$$ if $$$x$$$ wins, $$$-1$$$ if $$$y$$$ wins, or $$$0$$$ if the game results in a tie.<\/p><p>All teams should get the same score, and the number of ties should be the minimum possible. If there are multiple optimal answers, print any of them. It can be shown that there always exists a way to make all teams have the same score.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n2\n3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0 \n1 -1 1 \n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case of the example, both teams get $$$1$$$ point since the game between them is a tie.<\/p><p>In the second test case of the example, team $$$1$$$ defeats team $$$2$$$ (team $$$1$$$ gets $$$3$$$ points), team $$$1$$$ loses to team $$$3$$$ (team $$$3$$$ gets $$$3$$$ points), and team $$$2$$$ wins against team $$$3$$$ (team $$$2$$$ gets $$$3$$$ points).<\/p><\/div><\/div>"}, {"contestId": 1397, "index": "B", "name": "Power Sequence", "rating": 1500, "solvedCount": 15589, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Power Sequence<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Let's call a list of positive integers $$$a_0, a_1, ..., a_{n-1}$$$ a <span class=\"tex-font-style-bf\">power sequence<\/span> if there is a positive integer $$$c$$$, so that for every $$$0 \\le i \\le n-1$$$ then $$$a_i = c^i$$$.<\/p><p>Given a list of $$$n$$$ positive integers $$$a_0, a_1, ..., a_{n-1}$$$, you are allowed to:<\/p><ul> <li> Reorder the list (i.e. pick a permutation $$$p$$$ of $$$\\{0,1,...,n - 1\\}$$$ and change $$$a_i$$$ to $$$a_{p_i}$$$), then <\/li><li> Do the following operation any number of times: pick an index $$$i$$$ and change $$$a_i$$$ to $$$a_i - 1$$$ or $$$a_i + 1$$$ (i.e. increment or decrement $$$a_i$$$ by $$$1$$$) with a cost of $$$1$$$. <\/li><\/ul><p>Find the minimum cost to transform $$$a_0, a_1, ..., a_{n-1}$$$ into a power sequence.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$n$$$ ($$$3 \\le n \\le 10^5$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_0, a_1, ..., a_{n-1}$$$ ($$$1 \\le a_i \\le 10^9$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the minimum cost to transform $$$a_0, a_1, ..., a_{n-1}$$$ into a power sequence.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n1 3 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n1000000000 1000000000 1000000000\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1999982505\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, we first reorder $$$\\{1, 3, 2\\}$$$ into $$$\\{1, 2, 3\\}$$$, then increment $$$a_2$$$ to $$$4$$$ with cost $$$1$$$ to get a power sequence $$$\\{1, 2, 4\\}$$$.<\/p><\/div><\/div>"}, {"contestId": 1809, "index": "C", "name": "Sum on Subarrays", "rating": 1500, "solvedCount": 15546, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Sum on Subarrays<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>For an array $$$a = [a_1, a_2, \\dots, a_n]$$$, let's denote its <span class=\"tex-font-style-it\">subarray<\/span> $$$a[l, r]$$$ as the array $$$[a_l, a_{l+1}, \\dots, a_r]$$$.<\/p><p>For example, the array $$$a = [1, -3, 1]$$$ has $$$6$$$ non-empty subarrays:<\/p><ul> <li> $$$a[1,1] = [1]$$$; <\/li><li> $$$a[1,2] = [1,-3]$$$; <\/li><li> $$$a[1,3] = [1,-3,1]$$$; <\/li><li> $$$a[2,2] = [-3]$$$; <\/li><li> $$$a[2,3] = [-3,1]$$$; <\/li><li> $$$a[3,3] = [1]$$$. <\/li><\/ul><p>You are given two integers $$$n$$$ and $$$k$$$. Construct an array $$$a$$$ consisting of $$$n$$$ integers such that:<\/p><ul> <li> all elements of $$$a$$$ are from $$$-1000$$$ to $$$1000$$$; <\/li><li> $$$a$$$ has exactly $$$k$$$ subarrays with positive sums; <\/li><li> the rest $$$\\dfrac{(n+1) \\cdot n}{2}-k$$$ subarrays of $$$a$$$ have negative sums. <\/li><\/ul><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 5000$$$) \u2014 the number of test cases.<\/p><p>Each test case consists of one line containing two integers $$$n$$$ and $$$k$$$ ($$$2 \\le n \\le 30$$$; $$$0 \\le k \\le \\dfrac{(n+1) \\cdot n}{2}$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print $$$n$$$ integers \u2014 the elements of the array meeting the constraints. It can be shown that the answer always exists. If there are multiple answers, print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 6<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 -3 1\n-13 -42\n-13 42\n-3 -4 10 -2\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1466, "index": "D", "name": "13th Labour of Heracles", "rating": 1500, "solvedCount": 15521, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. 13th Labour of Heracles<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You've probably heard about the twelve labors of Heracles, but do you have any idea about the thirteenth? It is commonly assumed it took him a dozen years to complete the twelve feats, so on average, a year to accomplish every one of them. As time flows faster these days, you have minutes rather than months to solve this task. But will you manage?<\/p><p>In this problem, you are given a tree with $$$n$$$ weighted vertices. A tree is a connected graph with $$$n - 1$$$ edges.<\/p><p>Let us define its $$$k$$$-coloring as an assignment of $$$k$$$ colors to the edges so that each edge has exactly one color assigned to it. Note that you don't have to use all $$$k$$$ colors.<\/p><p>A subgraph of color $$$x$$$ consists of these edges from the original tree, which are assigned color $$$x$$$, and only those vertices that are adjacent to at least one such edge. So there are no vertices of degree $$$0$$$ in such a subgraph.<\/p><p>The value of a connected component is the <span class=\"tex-font-style-bf\">sum<\/span> of weights of its vertices. Let us define the value of a subgraph as a <span class=\"tex-font-style-bf\">maximum<\/span> of values of its connected components. We will assume that the value of an empty subgraph equals $$$0$$$.<\/p><p>There is also a value of a $$$k$$$-coloring, which equals the <span class=\"tex-font-style-bf\">sum<\/span> of values of subgraphs of all $$$k$$$ colors. Given a tree, for each $$$k$$$ from $$$1$$$ to $$$n - 1$$$ calculate the maximal value of a $$$k$$$-coloring.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>In the first line of input, there is a single integer $$$t$$$ ($$$1 \\leq t \\leq 10^5$$$) denoting the number of test cases. Then $$$t$$$ test cases follow. <\/p><p>First line of each test case contains a single integer $$$n$$$ ($$$2 \\leq n \\leq 10^5$$$). The second line consists of $$$n$$$ integers $$$w_1, w_2, \\dots, w_n$$$ ($$$0 \\leq w_i \\leq 10^9$$$), $$$w_i$$$ equals the weight of $$$i$$$-th vertex. In each of the following $$$n - 1$$$ lines, there are two integers $$$u$$$, $$$v$$$ ($$$1 \\leq u,v \\leq n$$$) describing an edge between vertices $$$u$$$ and $$$v$$$. It is guaranteed that these edges form a tree. <\/p><p>The sum of $$$n$$$ in all test cases will not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For every test case, your program should print one line containing $$$n - 1$$$ integers separated with a single space. The $$$i$$$-th number in a line should be the maximal value of a $$$i$$$-coloring of the tree.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n4\n3 5 4 6\n2 1\n3 1\n4 3\n2\n21 32\n2 1\n6\n20 13 17 13 13 11\n2 1\n3 1\n4 1\n5 1\n6 1\n4\n10 6 6 6\n1 2\n2 3\n4 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n18 22 25\n53\n87 107 127 147 167\n28 38 44\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The optimal $$$k$$$-colorings from the first test case are the following:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/2ac52e525b19c19971141cf3af410bbb37aa175f.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>In the $$$1$$$-coloring all edges are given the same color. The subgraph of color $$$1$$$ contains all the edges and vertices from the original graph. Hence, its value equals $$$3 + 5 + 4 + 6 = 18$$$.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/caf8a7df4fd209a55dc2ea84e50bae3da6ad440d.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>In an optimal $$$2$$$-coloring edges $$$(2, 1)$$$ and $$$(3,1)$$$ are assigned color $$$1$$$. Edge $$$(4, 3)$$$ is of color $$$2$$$. Hence the subgraph of color $$$1$$$ consists of a single connected component (vertices $$$1, 2, 3$$$) and its value equals $$$3 + 5 + 4 = 12$$$. The subgraph of color $$$2$$$ contains two vertices and one edge. Its value equals $$$4 + 6 = 10$$$.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/23bf5696004d0ad2463ef5b17846a4aef4c21d0e.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>In an optimal $$$3$$$-coloring all edges are assigned distinct colors. Hence subgraphs of each color consist of a single edge. They values are as follows: $$$3 + 4 = 7$$$, $$$4 + 6 = 10$$$, $$$3 + 5 = 8$$$.<\/p><\/div><\/div>"}, {"contestId": 1760, "index": "F", "name": "Quests", "rating": 1500, "solvedCount": 15512, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Quests<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are $$$n$$$ quests. If you complete the $$$i$$$-th quest, you will gain $$$a_i$$$ coins. You can only complete at most one quest per day. However, once you complete a quest, you cannot do the same quest again for $$$k$$$ days. (For example, if $$$k=2$$$ and you do quest $$$1$$$ on day $$$1$$$, then you cannot do it on day $$$2$$$ or $$$3$$$, but you can do it again on day $$$4$$$.)<\/p><p>You are given two integers $$$c$$$ and $$$d$$$. Find the maximum value of $$$k$$$ such that you can gain at least $$$c$$$ coins over $$$d$$$ days. If no such $$$k$$$ exists, output <span class=\"tex-font-style-tt\">Impossible<\/span>. If $$$k$$$ can be arbitrarily large, output <span class=\"tex-font-style-tt\">Infinity<\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The input consists of multiple test cases. The first line contains an integer $$$t$$$ ($$$1 \\leq t \\leq 10^4$$$)\u00a0\u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains three integers $$$n,c,d$$$ ($$$2 \\leq n \\leq 2\\cdot10^5$$$; $$$1 \\leq c \\leq 10^{16}$$$; $$$1 \\leq d \\leq 2\\cdot10^5$$$)\u00a0\u2014 the number of quests, the number of coins you need, and the number of days.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\leq a_i \\leq 10^9$$$)\u00a0\u2014 the rewards for the quests.<\/p><p>The sum of $$$n$$$ over all test cases does not exceed $$$2\\cdot10^5$$$, and the sum of $$$d$$$ over all test cases does not exceed $$$2\\cdot10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output one of the following. <\/p><ul> <li> If no such $$$k$$$ exists, output <span class=\"tex-font-style-tt\">Impossible<\/span>. <\/li><li> If $$$k$$$ can be arbitrarily large, output <span class=\"tex-font-style-tt\">Infinity<\/span>. <\/li><li> Otherwise, output a single integer\u00a0\u2014 the maximum value of $$$k$$$ such that you can gain at least $$$c$$$ coins over $$$d$$$ days. <\/li><\/ul> Please note, the checker is <span class=\"tex-font-style-bf\">case-sensitive<\/span>, and you should output strings exactly as they are given.<\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 5 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 20 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">100 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 100 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 2 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 20 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 5 6 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4 100000000000 2022<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">8217734 927368 26389746 627896974<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">2 20 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">5 1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\nInfinity\nImpossible\n1\n12\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, one way to earn $$$5$$$ coins over $$$4$$$ days with $$$k=2$$$ is as follows: <\/p><ul> <li> Day 1: do quest 2, and earn $$$2$$$ coins. <\/li><li> Day 2: do quest 1, and earn $$$1$$$ coin. <\/li><li> Day 3: do nothing. <\/li><li> Day 4: do quest 2, and earn $$$2$$$ coins. <\/li><\/ul> In total, we earned $$$2+1+2=5$$$ coins.<p>In the second test case, we can make over $$$20$$$ coins on the first day itself by doing the first quest to earn $$$100$$$ coins, so the value of $$$k$$$ can be arbitrarily large, since we never need to do another quest.<\/p><p>In the third test case, no matter what we do, we can't earn $$$100$$$ coins over $$$3$$$ days.<\/p><\/div><\/div>"}, {"contestId": 2069, "index": "C", "name": "Beautiful Sequence", "rating": 1500, "solvedCount": 15435, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Beautiful Sequence<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Let's call an integer sequence <span class=\"tex-font-style-bf\">beautiful<\/span> if the following conditions hold: <\/p><ul> <li> its length is at least $$$3$$$; <\/li><li> for every element except the first one, there is an element to the left less than it; <\/li><li> for every element except the last one, there is an element to the right larger than it; <\/li><\/ul><p>For example, $$$[1, 4, 2, 4, 7]$$$ and $$$[1, 2, 4, 8]$$$ are beautiful, but $$$[1, 2]$$$, $$$[2, 2, 4]$$$, and $$$[1, 3, 5, 3]$$$ are not.<\/p><p>Recall that a subsequence is a sequence that can be obtained from another sequence by removing some elements without changing the order of the remaining elements.<\/p><p>You are given an integer array $$$a$$$ of size $$$n$$$, where <span class=\"tex-font-style-bf\">every element is from $$$1$$$ to $$$3$$$<\/span>. Your task is to calculate the number of beautiful subsequences of the array $$$a$$$. Since the answer might be large, print it modulo $$$998244353$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$3 \\le n \\le 2 \\cdot 10^5$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 3$$$).<\/p><p>Additional constraint on the input: the sum of $$$n$$$ over all test cases doesn't exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print a single integer\u00a0\u2014 the number of beautiful subsequences of the array $$$a$$$, taken modulo $$$998244353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 2 1 2 2 1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 1 2 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">9<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 2 3 2 1 3 2 2 3<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n0\n1\n22\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case of the example, the following subsequences are beautiful:<\/p><ul> <li> $$$[a_3, a_4, a_7]$$$; <\/li><li> $$$[a_3, a_5, a_7]$$$; <\/li><li> $$$[a_3, a_4, a_5, a_7]$$$. <\/li><\/ul><\/div><\/div>"}, {"contestId": 1926, "index": "E", "name": "Vlad and an Odd Ordering", "rating": 1500, "solvedCount": 15351, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Vlad and an Odd Ordering<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Vladislav has $$$n$$$ cards numbered $$$1, 2, \\dots, n$$$. He wants to lay them down in a row as follows: <\/p><ul> <li> First, he lays down all the odd-numbered cards from smallest to largest. <\/li><li> Next, he lays down all cards that are twice an odd number from smallest to largest (i.e. $$$2$$$ multiplied by an odd number). <\/li><li> Next, he lays down all cards that are $$$3$$$ times an odd number from smallest to largest (i.e. $$$3$$$ multiplied by an odd number). <\/li><li> Next, he lays down all cards that are $$$4$$$ times an odd number from smallest to largest (i.e. $$$4$$$ multiplied by an odd number). <\/li><li> And so on, until all cards are laid down. <\/li><\/ul> What is the $$$k$$$-th card he lays down in this process? Once Vladislav puts a card down, he cannot use that card again.<\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$t$$$ ($$$1 \\leq t \\leq 5 \\cdot 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The only line of each test case contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\leq k \\leq n \\leq 10^9$$$)\u00a0\u2014 the number of cards Vlad has, and the position of the card you need to output.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer\u00a0\u2014 the $$$k$$$-th card Vladislav lays down.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">11<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">7 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">7 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">7 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">7 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">7 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">7 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-9\">34 14<\/div><div class=\"test-example-line test-example-line-even test-example-line-10\">84 19<\/div><div class=\"test-example-line test-example-line-odd test-example-line-11\">1000000000 1000000000<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n3\n5\n7\n2\n6\n4\n1\n27\n37\n536870912\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first seven test cases, $$$n=7$$$. Vladislav lays down the cards as follows: <\/p><ul> <li> First\u00a0\u2014 all the odd-numbered cards in the order $$$1$$$, $$$3$$$, $$$5$$$, $$$7$$$. <\/li><li> Next\u00a0\u2014 all cards that are twice an odd number in the order $$$2$$$, $$$6$$$. <\/li><li> Next, there are no remaining cards that are $$$3$$$ times an odd number. (Vladislav has only one of each card.) <\/li><li> Next\u00a0\u2014 all cards that are $$$4$$$ times an odd number, and there is only one such card: $$$4$$$. <\/li><li> There are no more cards left, so Vladislav stops. <\/li><\/ul> Thus the order of cards is $$$1$$$, $$$3$$$, $$$5$$$, $$$7$$$, $$$2$$$, $$$6$$$, $$$4$$$.<\/div><\/div>"}, {"contestId": 1553, "index": "D", "name": "Backspace", "rating": 1500, "solvedCount": 15351, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Backspace<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given two strings $$$s$$$ and $$$t$$$, both consisting of lowercase English letters. You are going to type the string $$$s$$$ character by character, from the first character to the last one.<\/p><p>When typing a character, instead of pressing the button corresponding to it, you can press the \"Backspace\" button. It deletes the last character you have typed among those that aren't deleted yet (or does nothing if there are no characters in the current string). For example, if $$$s$$$ is \"<span class=\"tex-font-style-tt\">abcbd<\/span>\" and you press Backspace instead of typing the first and the fourth characters, you will get the string \"<span class=\"tex-font-style-tt\">bd<\/span>\" (the first press of Backspace deletes no character, and the second press deletes the character '<span class=\"tex-font-style-tt\">c<\/span>'). Another example, if $$$s$$$ is \"<span class=\"tex-font-style-tt\">abcaa<\/span>\" and you press Backspace instead of the last two letters, then the resulting text is \"<span class=\"tex-font-style-tt\">a<\/span>\".<\/p><p>Your task is to determine whether you can obtain the string $$$t$$$, if you type the string $$$s$$$ and press \"Backspace\" instead of typing several (maybe zero) characters of $$$s$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$q$$$ ($$$1 \\le q \\le 10^5$$$) \u2014 the number of test cases.<\/p><p>The first line of each test case contains the string $$$s$$$ ($$$1 \\le |s| \\le 10^5$$$). Each character of $$$s$$$ is a lowercase English letter.<\/p><p>The second line of each test case contains the string $$$t$$$ ($$$1 \\le |t| \\le 10^5$$$). Each character of $$$t$$$ is a lowercase English letter.<\/p><p>It is guaranteed that the total number of characters in the strings over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print \"<span class=\"tex-font-style-tt\">YES<\/span>\" if you can obtain the string $$$t$$$ by typing the string $$$s$$$ and replacing some characters with presses of \"Backspace\" button, or \"<span class=\"tex-font-style-tt\">NO<\/span>\" if you cannot.<\/p><p>You may print each letter in any case (<span class=\"tex-font-style-tt\">YES<\/span>, <span class=\"tex-font-style-tt\">yes<\/span>, <span class=\"tex-font-style-tt\">Yes<\/span> will all be recognized as positive answer, <span class=\"tex-font-style-tt\">NO<\/span>, <span class=\"tex-font-style-tt\">no<\/span> and <span class=\"tex-font-style-tt\">nO<\/span> will all be recognized as negative answer).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\nababa\nba\nababa\nbb\naaa\naaaa\naababa\nababa\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nNO\nNO\nYES\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Consider the example test from the statement.<\/p><p>In order to obtain \"<span class=\"tex-font-style-tt\">ba<\/span>\" from \"<span class=\"tex-font-style-tt\">ababa<\/span>\", you may press Backspace instead of typing the first and the fourth characters.<\/p><p>There's no way to obtain \"<span class=\"tex-font-style-tt\">bb<\/span>\" while typing \"<span class=\"tex-font-style-tt\">ababa<\/span>\".<\/p><p>There's no way to obtain \"<span class=\"tex-font-style-tt\">aaaa<\/span>\" while typing \"<span class=\"tex-font-style-tt\">aaa<\/span>\".<\/p><p>In order to obtain \"<span class=\"tex-font-style-tt\">ababa<\/span>\" while typing \"<span class=\"tex-font-style-tt\">aababa<\/span>\", you have to press Backspace instead of typing the first character, then type all the remaining characters.<\/p><\/div><\/div>"}, {"contestId": 2121, "index": "E", "name": "Sponsor of Your Problems", "rating": 1500, "solvedCount": 15348, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Sponsor of Your Problems<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>For two integers $$$a$$$ and $$$b$$$, we define $$$f(a, b)$$$ as the number of positions in the decimal representation of the numbers $$$a$$$ and $$$b$$$ where their digits are the same. For example, $$$f(12, 21) = 0$$$, $$$f(31, 37) = 1$$$, $$$f(19891, 18981) = 2$$$, $$$f(54321, 24361) = 3$$$.<\/p><p>You are given two integers $$$l$$$ and $$$r$$$ of the <span class=\"tex-font-style-bf\">same<\/span> length in decimal representation. Consider all integers $$$l \\leq x \\leq r$$$. Your task is to find the minimum value of $$$f(l, x) + f(x, r)$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test consists of multiple test cases. The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 10^4$$$)\u00a0\u2014 the number of test cases. The description of the test cases follows.<\/p><p>Each test case consists of a single line containing two integers $$$l$$$ and $$$r$$$ ($$$1 \\leq l \\leq r  \\lt  10^9$$$).<\/p><p>It is guaranteed that the numbers $$$l$$$ and $$$r$$$ have the same length in decimal representation and do not have leading zeros.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output the minimum value of $$$f(l, x) + f(x, r)$$$ among all integer values $$$l \\leq x \\leq r$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">14<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">15 16<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">17 19<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">199 201<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">899 999<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">1990 2001<\/div><div class=\"test-example-line test-example-line-odd test-example-line-9\">6309 6409<\/div><div class=\"test-example-line test-example-line-even test-example-line-10\">12345 12501<\/div><div class=\"test-example-line test-example-line-odd test-example-line-11\">19987 20093<\/div><div class=\"test-example-line test-example-line-even test-example-line-12\">746814 747932<\/div><div class=\"test-example-line test-example-line-odd test-example-line-13\">900990999 900991010<\/div><div class=\"test-example-line test-example-line-even test-example-line-14\">999999999 999999999<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n1\n0\n3\n2\n2\n1\n3\n3\n4\n3\n5\n12\n18\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, you can choose $$$x = 1$$$. Then $$$f(1, 1) + f(1, 1) = 1 + 1 = 2$$$.<\/p><p>In the second test case, you can choose $$$x = 2$$$. Then $$$f(2, 2) + f(2, 3) = 1 + 0 = 1$$$.<\/p><p>In the third test case, you can choose $$$x = 5$$$. Then $$$f(4, 5) + f(5, 6) = 0 + 0 = 0$$$.<\/p><p>In the fourth test case, you can choose $$$x = 15$$$. Then $$$f(15, 15) + f(15, 16) = 2 + 1 = 3$$$.<\/p><p>In the fifth test case, you can choose $$$x = 18$$$. Then $$$f(17, 18) + f(18, 19) = 1 + 1 = 2$$$.<\/p><p>In the sixth test case, you can choose $$$x = 200$$$. Then $$$f(199, 200) + f(200, 201) = 0 + 2 = 2$$$.<\/p><p>In the seventh test case, you can choose $$$x = 900$$$. Then $$$f(899, 900) + f(900, 999) = 0 + 1 = 1$$$.<\/p><p>In the eighth test case, you can choose $$$x = 1992$$$. Then $$$f(1990, 1992) + f(1992, 2001) = 3 + 0 = 3$$$.<\/p><\/div><\/div>"}, {"contestId": 2108, "index": "C", "name": "Neo's Escape", "rating": 1500, "solvedCount": 15329, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Neo's Escape<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><

<script>
    const PROBLEMS = [{"contestId": 455, "index": "A", "name": "Boredom", "rating": 1500, "solvedCount": 75942, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. Boredom<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Alex doesn't like boredom. That's why whenever he gets bored, he comes up with games. One long winter evening he came up with a game and decided to play it.<\/p><p>Given a sequence <span class=\"tex-span\"><i>a<\/i><\/span> consisting of <span class=\"tex-span\"><i>n<\/i><\/span> integers. The player can make several steps. In a single step he can choose an element of the sequence (let's denote it <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span>) and delete it, at that all elements equal to <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>\u2009+\u20091<\/span> and <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>\u2009-\u20091<\/span> also must be deleted from the sequence. That step brings <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span> points to the player. <\/p><p>Alex is a perfectionist, so he decided to get as many points as possible. Help him.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>) that shows how many numbers are in Alex's sequence. <\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub><\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">2<\/sub><\/span>, ..., <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u2014 the maximum number of points that Alex can earn.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/>1 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>1 2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>9<br/>1 2 1 3 2 2 2 2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>10<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Consider the third test example. At first step we need to choose any element equal to <span class=\"tex-span\">2<\/span>. After that step our sequence looks like this <span class=\"tex-span\">[2,\u20092,\u20092,\u20092]<\/span>. Then we do <span class=\"tex-span\">4<\/span> steps, on each step we choose any element equals to <span class=\"tex-span\">2<\/span>. In total we earn <span class=\"tex-span\">10<\/span> points.<\/p><\/div><\/div>"}, {"contestId": 580, "index": "C", "name": "Kefa and Park", "rating": 1500, "solvedCount": 59411, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Kefa and Park<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Kefa decided to celebrate his first big salary by going to the restaurant. <\/p><p>He lives by an unusual park. The park is a rooted tree consisting of <span class=\"tex-span\"><i>n<\/i><\/span> vertices with the root at vertex <span class=\"tex-span\">1<\/span>. Vertex <span class=\"tex-span\">1<\/span> also contains Kefa's house. Unfortunaely for our hero, the park also contains cats. Kefa has already found out what are the vertices with cats in them.<\/p><p>The leaf vertices of the park contain restaurants. Kefa wants to choose a restaurant where he will go, but unfortunately he is very afraid of cats, so there is no way he will go to the restaurant if the path from the restaurant to his house contains more than <span class=\"tex-span\"><i>m<\/i><\/span> <span class=\"tex-font-style-bf\">consecutive<\/span> vertices with cats. <\/p><p>Your task is to help Kefa count the number of restaurants where he can go.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers, <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>) \u2014 the number of vertices of the tree and the maximum number of consecutive vertices with cats that is still ok for Kefa.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span>, where each <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> either equals to <span class=\"tex-span\">0<\/span> (then vertex <span class=\"tex-span\"><i>i<\/i><\/span> has no cat), or equals to <span class=\"tex-span\">1<\/span> (then vertex <span class=\"tex-span\"><i>i<\/i><\/span> has a cat).<\/p><p>Next <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> lines contains the edges of the tree in the format \"<span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\"><i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>\" (without the quotes) (<span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2260\u2009<i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>), where <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> are the vertices of the tree, connected by an edge. <\/p><p>It is guaranteed that the given set of edges specifies a tree.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>A single integer \u2014 the number of distinct leaves of a tree the path to which from Kefa's home contains at most <span class=\"tex-span\"><i>m<\/i><\/span> consecutive vertices with cats.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 1<br/>1 1 0 0<br/>1 2<br/>1 3<br/>1 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>7 1<br/>1 0 1 1 0 0 0<br/>1 2<br/>1 3<br/>2 4<br/>2 5<br/>3 6<br/>3 7<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Let us remind you that a <span class=\"tex-font-style-it\">tree<\/span> is a connected graph on <span class=\"tex-span\"><i>n<\/i><\/span> vertices and <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> edge. A <span class=\"tex-font-style-it\">rooted<\/span> tree is a tree with a special vertex called <span class=\"tex-font-style-it\">root<\/span>. In a rooted tree among any two vertices connected by an edge, one vertex is a parent (the one closer to the root), and the other one is a child. A vertex is called a <span class=\"tex-font-style-it\">leaf<\/span>, if it has no children.<\/p><p>Note to the first sample test: <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/d5a8860bc0e7f2b3af6eb8d282651cf293b2ca73.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> The vertices containing cats are marked red. The restaurants are at vertices 2, 3, 4. Kefa can't go only to the restaurant located at vertex <span class=\"tex-span\">2<\/span>.<\/p><p>Note to the second sample test: <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/4e80ab2e30751bfa146f6b2be04649530164fd0a.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> The restaurants are located at vertices 4, 5, 6, 7. Kefa can't go to restaurants 6, 7.<\/p><\/div><\/div>"}, {"contestId": 550, "index": "A", "name": "Two Substrings", "rating": 1500, "solvedCount": 44799, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. Two Substrings<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given string <span class=\"tex-span\"><i>s<\/i><\/span>. Your task is to determine if the given string <span class=\"tex-span\"><i>s<\/i><\/span> contains two non-overlapping substrings \"<span class=\"tex-font-style-tt\">AB<\/span>\" and \"<span class=\"tex-font-style-tt\">BA<\/span>\" (the substrings can go in any order).<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line of input contains a string <span class=\"tex-span\"><i>s<\/i><\/span> of length between <span class=\"tex-span\">1<\/span> and <span class=\"tex-span\">10<sup class=\"upper-index\">5<\/sup><\/span> consisting of uppercase Latin letters.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print \"<span class=\"tex-font-style-tt\">YES<\/span>\" (without the quotes), if string <span class=\"tex-span\"><i>s<\/i><\/span> contains two non-overlapping substrings \"<span class=\"tex-font-style-tt\">AB<\/span>\" and \"<span class=\"tex-font-style-tt\">BA<\/span>\", and \"<span class=\"tex-font-style-tt\">NO<\/span>\" otherwise.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>ABA<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>NO<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>BACFAB<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>AXBYBXA<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>NO<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample test, despite the fact that there are substrings \"<span class=\"tex-font-style-tt\">AB<\/span>\" and \"<span class=\"tex-font-style-tt\">BA<\/span>\", their occurrences overlap, so the answer is \"<span class=\"tex-font-style-tt\">NO<\/span>\".<\/p><p>In the second sample test there are the following occurrences of the substrings: <span class=\"tex-font-style-bf\">BA<\/span>CF<span class=\"tex-font-style-bf\">AB<\/span>.<\/p><p>In the third sample test there is no substring \"<span class=\"tex-font-style-tt\">AB<\/span>\" nor substring \"<span class=\"tex-font-style-tt\">BA<\/span>\".<\/p><\/div><\/div>"}, {"contestId": 276, "index": "C", "name": "Little Girl and Maximum Sum", "rating": 1500, "solvedCount": 43109, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Little Girl and Maximum Sum<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>The little girl loves the problems on array queries very much.<\/p><p>One day she came across a rather well-known problem: you've got an array of $$$n$$$ elements (the elements of the array are indexed starting from 1); also, there are $$$q$$$ queries, each one is defined by a pair of integers $$$l_i$$$, $$$r_i$$$ $$$(1 \\le l_i \\le r_i \\le n)$$$. You need to find for each query the sum of elements of the array with indexes from $$$l_i$$$ to $$$r_i$$$, inclusive.<\/p><p>The little girl found the problem rather boring. She decided to reorder the array elements before replying to the queries in a way that makes the sum of query replies maximum possible. Your task is to find the value of this maximum sum.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two space-separated integers $$$n$$$ ($$$1 \\le n \\le 2\\cdot10^5$$$) and $$$q$$$ ($$$1 \\le q \\le 2\\cdot10^5$$$) \u2014 the number of elements in the array and the number of queries, correspondingly.<\/p><p>The next line contains $$$n$$$ space-separated integers $$$a_i$$$ ($$$1 \\le a_i \\le 2\\cdot10^5$$$) \u2014 the array elements.<\/p><p>Each of the following $$$q$$$ lines contains two space-separated integers $$$l_i$$$ and $$$r_i$$$ ($$$1 \\le l_i \\le r_i \\le n$$$) \u2014 the $$$i$$$-th query.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In a single line print, a single integer \u2014 the maximum sum of query replies after the array elements are reordered.<\/p><p>Please, do not use the <span class=\"tex-font-style-tt\">%lld<\/span> specifier to read or write 64-bit integers in C++. It is preferred to use the <span class=\"tex-font-style-tt\">cin<\/span>, <span class=\"tex-font-style-tt\">cout<\/span> streams or the <span class=\"tex-font-style-tt\">%I64d<\/span> specifier.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 3<br/>5 3 2<br/>1 2<br/>2 3<br/>1 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>25<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 3<br/>5 2 4 1 3<br/>1 5<br/>2 3<br/>2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>33<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 545, "index": "C", "name": "Woodcutters", "rating": 1500, "solvedCount": 34526, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Woodcutters<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Little Susie listens to fairy tales before bed every day. Today's fairy tale was about wood cutters and the little girl immediately started imagining the choppers cutting wood. She imagined the situation that is described below.<\/p><p>There are <span class=\"tex-span\"><i>n<\/i><\/span> trees located along the road at points with coordinates <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>x<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>x<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span>. Each tree has its height <span class=\"tex-span\"><i>h<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. Woodcutters can cut down a tree and fell it to the left or to the right. After that it occupies one of the segments <span class=\"tex-span\">[<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009-\u2009<i>h<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>]<\/span> or <span class=\"tex-span\">[<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>;<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009+\u2009<i>h<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>]<\/span>. The tree that is not cut down occupies a single point with coordinate <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. Woodcutters can fell a tree if the segment to be occupied by the fallen tree doesn't contain any occupied point. The woodcutters want to process as many trees as possible, so Susie wonders, what is the maximum number of trees to fell. <\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the number of trees.<\/p><p>Next <span class=\"tex-span\"><i>n<\/i><\/span> lines contain pairs of integers <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>h<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>h<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) \u2014 the coordinate and the height of the <span class=\"tex-span\"><i>\u0456<\/i><\/span>-th tree.<\/p><p>The pairs are given in the order of ascending <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. No two trees are located at the point with the same coordinate.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single number \u2014 the maximum number of trees that you can cut down by the given rules.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1 2<br/>2 1<br/>5 10<br/>10 9<br/>19 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1 2<br/>2 1<br/>5 10<br/>10 9<br/>20 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample you can fell the trees like that: <\/p><ul> <li> fell the <span class=\"tex-span\">1<\/span>-st tree to the left \u2014 now it occupies segment <span class=\"tex-span\">[\u2009-\u20091;1]<\/span> <\/li><li> fell the <span class=\"tex-span\">2<\/span>-nd tree to the right \u2014 now it occupies segment <span class=\"tex-span\">[2;3]<\/span> <\/li><li> leave the <span class=\"tex-span\">3<\/span>-rd tree \u2014 it occupies point <span class=\"tex-span\">5<\/span> <\/li><li> leave the <span class=\"tex-span\">4<\/span>-th tree \u2014 it occupies point <span class=\"tex-span\">10<\/span> <\/li><li> fell the <span class=\"tex-span\">5<\/span>-th tree to the right \u2014 now it occupies segment <span class=\"tex-span\">[19;20]<\/span> <\/li><\/ul><p>In the second sample you can also fell <span class=\"tex-span\">4<\/span>-th tree to the right, after that it will occupy segment <span class=\"tex-span\">[10;19]<\/span>.<\/p><\/div><\/div>"}, {"contestId": 580, "index": "B", "name": "Kefa and Company", "rating": 1500, "solvedCount": 33531, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Kefa and Company<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Kefa wants to celebrate his first big salary by going to restaurant. However, he needs company. <\/p><p>Kefa has <span class=\"tex-span\"><i>n<\/i><\/span> friends, each friend will agree to go to the restaurant if Kefa asks. Each friend is characterized by the amount of money he has and the friendship factor in respect to Kefa. The parrot doesn't want any friend to feel poor compared to somebody else in the company (Kefa doesn't count). A friend feels poor if in the company there is someone who has at least <span class=\"tex-span\"><i>d<\/i><\/span> units of money more than he does. Also, Kefa wants the total friendship factor of the members of the company to be maximum. Help him invite an optimal company!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains two space-separated integers, <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>d<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>, <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/dbb69b02906f9aa8e36ba613133328a16da7cfcb.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>) \u2014 the number of Kefa's friends and the minimum difference between the amount of money in order to feel poor, respectively.<\/p><p>Next <span class=\"tex-span\"><i>n<\/i><\/span> lines contain the descriptions of Kefa's friends, the <span class=\"tex-span\">(<i>i<\/i>\u2009+\u20091)<\/span>-th line contains the description of the <span class=\"tex-span\"><i>i<\/i><\/span>-th friend of type <span class=\"tex-span\"><i>m<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>m<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>s<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) \u2014 the amount of money and the friendship factor, respectively. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the maximum total friendship factir that can be reached.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 5<br/>75 5<br/>0 100<br/>150 20<br/>75 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>100<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 100<br/>0 7<br/>11 32<br/>99 10<br/>46 8<br/>87 54<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>111<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample test the most profitable strategy is to form a company from only the second friend. At all other variants the total degree of friendship will be worse.<\/p><p>In the second sample test we can take all the friends.<\/p><\/div><\/div>"}, {"contestId": 550, "index": "C", "name": "Divisibility by Eight", "rating": 1500, "solvedCount": 32961, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Divisibility by Eight<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a non-negative integer <span class=\"tex-span\"><i>n<\/i><\/span>, its decimal representation consists of at most <span class=\"tex-span\">100<\/span> digits and doesn't contain leading zeroes.<\/p><p>Your task is to determine if it is possible in this case to remove some of the digits (possibly not remove any digit at all) so that the result contains at least one digit, forms a non-negative integer, doesn't have leading zeroes and is divisible by 8. After the removing, it is forbidden to rearrange the digits.<\/p><p>If a solution exists, you should print it.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The single line of the input contains a non-negative integer <span class=\"tex-span\"><i>n<\/i><\/span>. The representation of number <span class=\"tex-span\"><i>n<\/i><\/span> doesn't contain any leading zeroes and its length doesn't exceed <span class=\"tex-span\">100<\/span> digits. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print \"<span class=\"tex-font-style-tt\">NO<\/span>\" (without quotes), if there is no such way to remove some digits from number <span class=\"tex-span\"><i>n<\/i><\/span>. <\/p><p>Otherwise, print \"<span class=\"tex-font-style-tt\">YES<\/span>\" in the first line and the resulting number after removing digits from number <span class=\"tex-span\"><i>n<\/i><\/span> in the second line. The printed number must be divisible by <span class=\"tex-span\">8<\/span>.<\/p><p>If there are multiple possible answers, you may print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3454<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/>344<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>10<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/>0<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>111111<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>NO<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 2, "index": "A", "name": "Winner", "rating": 1500, "solvedCount": 32139, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. Winner<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>64 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>The winner of the card game popular in Berland \"Berlogging\" is determined according to the following rules. If at the end of the game there is only one player with the maximum number of points, he is the winner. The situation becomes more difficult if the number of such players is more than one. During each round a player gains or loses a particular number of points. In the course of the game the number of points is registered in the line \"<span class=\"tex-font-style-tt\">name score<\/span>\", where <span class=\"tex-font-style-tt\">name<\/span> is a player's name, and <span class=\"tex-font-style-tt\">score<\/span> is the number of points gained in this round, which is an integer number. If score is negative, this means that the player has lost in the round. So, if two or more players have the maximum number of points (say, it equals to <span class=\"tex-span\"><i>m<\/i><\/span>) at the end of the game, than wins the one <span class=\"tex-font-style-it\">of them<\/span> who scored at least <span class=\"tex-span\"><i>m<\/i><\/span> points first. Initially each player has 0 points. It's guaranteed that at the end of the game at least one player has a positive number of points.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer number <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2009\u2264\u2009\u2009<i>n<\/i>\u2009\u2009\u2264\u2009\u20091000<\/span>), <span class=\"tex-span\"><i>n<\/i><\/span> is the number of rounds played. Then follow <span class=\"tex-span\"><i>n<\/i><\/span> lines, containing the information about the rounds in \"<span class=\"tex-font-style-tt\">name score<\/span>\" format in chronological order, where <span class=\"tex-font-style-tt\">name<\/span> is a string of lower-case Latin letters with the length from 1 to 32, and <span class=\"tex-font-style-tt\">score<\/span> is an integer number between -1000 and 1000, inclusive.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the name of the winner.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>mike 3<br/>andrew 5<br/>mike 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>andrew<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>andrew 3<br/>andrew 2<br/>mike 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>andrew<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1338, "index": "A", "name": "Powered Addition", "rating": 1500, "solvedCount": 32104, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. Powered Addition<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You have an array $$$a$$$ of length $$$n$$$. For every positive integer $$$x$$$ you are going to perform the following operation during the $$$x$$$-th second:<\/p><ul> <li> Select some distinct indices $$$i_{1}, i_{2}, \\ldots, i_{k}$$$ which are between $$$1$$$ and $$$n$$$ inclusive, and add $$$2^{x-1}$$$ to each corresponding position of $$$a$$$. Formally, $$$a_{i_{j}} := a_{i_{j}} + 2^{x-1}$$$ for $$$j = 1, 2, \\ldots, k$$$. <span class=\"tex-font-style-bf\">Note that you are allowed to not select any indices at all.<\/span> <\/li><\/ul><p>You have to make $$$a$$$ nondecreasing as fast as possible. Find the smallest number $$$T$$$ such that you can make the array nondecreasing after at most $$$T$$$ seconds.<\/p><p>Array $$$a$$$ is nondecreasing if and only if $$$a_{1} \\le a_{2} \\le \\ldots \\le a_{n}$$$.<\/p><p>You have to answer $$$t$$$ independent test cases.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^{4}$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains single integer $$$n$$$ ($$$1 \\le n \\le 10^{5}$$$)\u00a0\u2014 the length of array $$$a$$$. It is guaranteed that the sum of values of $$$n$$$ over all test cases in the input does not exceed $$$10^{5}$$$.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_{1}, a_{2}, \\ldots, a_{n}$$$ ($$$-10^{9} \\le a_{i} \\le 10^{9}$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print the minimum number of seconds in which you can make $$$a$$$ nondecreasing.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 7 6 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2 3 4 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0 -4<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n0\n3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, if you select indices $$$3, 4$$$ at the $$$1$$$-st second and $$$4$$$ at the $$$2$$$-nd second, then $$$a$$$ will become $$$[1, 7, 7, 8]$$$. There are some other possible ways to make $$$a$$$ nondecreasing in $$$2$$$ seconds, but you can't do it faster.<\/p><p>In the second test case, $$$a$$$ is already nondecreasing, so answer is $$$0$$$.<\/p><p>In the third test case, if you do nothing at first $$$2$$$ seconds and select index $$$2$$$ at the $$$3$$$-rd second, $$$a$$$ will become $$$[0, 0]$$$.<\/p><\/div><\/div>"}, {"contestId": 1418, "index": "C", "name": "Mortal Kombat Tower", "rating": 1500, "solvedCount": 30441, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Mortal Kombat Tower<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You and your friend are playing the game Mortal Kombat XI. You are trying to pass a challenge tower. There are $$$n$$$ bosses in this tower, numbered from $$$1$$$ to $$$n$$$. The type of the $$$i$$$-th boss is $$$a_i$$$. If the $$$i$$$-th boss is easy then its type is $$$a_i = 0$$$, otherwise this boss is hard and its type is $$$a_i = 1$$$.<\/p><p>During one session, either you or your friend can kill <span class=\"tex-font-style-bf\">one or two<\/span> bosses (neither you nor your friend can skip the session, so the minimum number of bosses killed during one session is at least one). After your friend session, your session begins, then again your friend session begins, your session begins, and so on. <span class=\"tex-font-style-bf\">The first session is your friend's session<\/span>.<\/p><p>Your friend needs to get good because he can't actually kill hard bosses. To kill them, he uses skip points. One skip point can be used to kill one hard boss.<\/p><p>Your task is to find the <span class=\"tex-font-style-bf\">minimum<\/span> number of skip points your friend needs to use so you and your friend kill all $$$n$$$ bosses in the given order.<\/p><p>For example: suppose $$$n = 8$$$, $$$a = [1, 0, 1, 1, 0, 1, 1, 1]$$$. Then the best course of action is the following:<\/p><ul> <li> your friend kills two first bosses, using one skip point for the first boss; <\/li><li> you kill the third and the fourth bosses; <\/li><li> your friend kills the fifth boss; <\/li><li> you kill the sixth and the seventh bosses; <\/li><li> your friend kills the last boss, using one skip point, so the tower is completed using two skip points. <\/li><\/ul><p>You have to answer $$$t$$$ independent test cases.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains one integer $$$t$$$ ($$$1 \\le t \\le 2 \\cdot 10^4$$$) \u2014 the number of test cases. Then $$$t$$$ test cases follow.<\/p><p>The first line of the test case contains one integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$) \u2014 the number of bosses. The second line of the test case contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$0 \\le a_i \\le 1$$$), where $$$a_i$$$ is the type of the $$$i$$$-th boss.<\/p><p>It is guaranteed that the sum of $$$n$$$ does not exceed $$$2 \\cdot 10^5$$$ ($$$\\sum n \\le 2 \\cdot 10^5$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print the answer: the <span class=\"tex-font-style-bf\">minimum<\/span> number of skip points your friend needs to use so you and your friend kill all $$$n$$$ bosses in the given order.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n8\n1 0 1 1 0 1 1 1\n5\n1 1 1 1 0\n7\n1 1 1 1 0 0 1\n6\n1 1 1 1 1 1\n1\n1\n1\n0\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n2\n2\n2\n1\n0\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1526, "index": "C1", "name": "Potions (Easy Version)", "rating": 1500, "solvedCount": 28316, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C1. Potions (Easy Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is the easy version of the problem. The only difference is that in this version $$$n \\leq 2000$$$. You can make hacks only if both versions of the problem are solved.<\/span><\/p><p>There are $$$n$$$ potions in a line, with potion $$$1$$$ on the far left and potion $$$n$$$ on the far right. Each potion increases your health by $$$a_i$$$ when drunk. $$$a_i$$$ can be negative, meaning that the potion decreases your health.<\/p><p>You start with $$$0$$$ health, and you will walk from left to right, from the first potion to the last one. At each potion, you may choose to drink it or ignore it. <span class=\"tex-font-style-bf\">You must ensure that your health is always non-negative<\/span>.<\/p><p>What is the largest number of potions you can drink?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$1 \\leq n \\leq 2000$$$) \u2014 the number of potions. <\/p><p>The next line contains $$$n$$$ integers $$$a_1$$$, $$$a_2$$$, ... ,$$$a_n$$$ ($$$-10^9 \\leq a_i \\leq 10^9$$$) which represent the change in health after drinking that potion.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output a single integer, the maximum number of potions you can drink without your health becoming negative.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">4 -4 1 -3 1 -3<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the sample, you can drink $$$5$$$ potions by taking potions $$$1$$$, $$$3$$$, $$$4$$$, $$$5$$$ and $$$6$$$. It is not possible to drink all $$$6$$$ potions because your health will go negative at some point<\/p><\/div><\/div>"}, {"contestId": 977, "index": "E", "name": "Cyclic Components", "rating": 1500, "solvedCount": 27161, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Cyclic Components<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an undirected graph consisting of $$$n$$$ vertices and $$$m$$$ edges. Your task is to find the number of connected components which are cycles.<\/p><p>Here are some definitions of graph theory.<\/p><p>An undirected graph consists of two sets: set of nodes (called vertices) and set of edges. Each edge connects a pair of vertices. All edges are bidirectional (i.e. if a vertex $$$a$$$ is connected with a vertex $$$b$$$, a vertex $$$b$$$ is also connected with a vertex $$$a$$$). An edge can't connect vertex with itself, there is at most one edge between a pair of vertices.<\/p><p>Two vertices $$$u$$$ and $$$v$$$ belong to the same connected component if and only if there is at least one path along edges connecting $$$u$$$ and $$$v$$$.<\/p><p>A connected component is a cycle if and only if its vertices can be reordered in such a way that:<\/p><ul> <li> the first vertex is connected with the second vertex by an edge, <\/li><li> the second vertex is connected with the third vertex by an edge, <\/li><li> ... <\/li><li> the last vertex is connected with the first vertex by an edge, <\/li><li> all the described edges of a cycle are distinct. <\/li><\/ul><p>A cycle doesn't contain any other edges except described above. By definition any cycle contains three or more vertices.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/2efb48fd56a6167cac3c5a8c51483513d9b48b30.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <span class=\"tex-font-size-small\">There are $$$6$$$ connected components, $$$2$$$ of them are cycles: $$$[7, 10, 16]$$$ and $$$[5, 11, 9, 15]$$$.<\/span> <\/center><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integer numbers $$$n$$$ and $$$m$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$, $$$0 \\le m \\le 2 \\cdot 10^5$$$) \u2014 number of vertices and edges.<\/p><p>The following $$$m$$$ lines contains edges: edge $$$i$$$ is given as a pair of vertices $$$v_i$$$, $$$u_i$$$ ($$$1 \\le v_i, u_i \\le n$$$, $$$u_i \\ne v_i$$$). There is no multiple edges in the given graph, i.e. for each pair ($$$v_i, u_i$$$) there no other pairs ($$$v_i, u_i$$$) and ($$$u_i, v_i$$$) in the list of edges.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the number of connected components which are also cycles.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 4<br/>1 2<br/>3 4<br/>5 4<br/>3 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>17 15<br/>1 8<br/>1 12<br/>5 11<br/>11 9<br/>9 15<br/>15 5<br/>4 13<br/>3 13<br/>4 3<br/>10 16<br/>7 10<br/>16 7<br/>14 3<br/>14 4<br/>17 6<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example only component $$$[3, 4, 5]$$$ is also a cycle.<\/p><p>The illustration above corresponds to the second example.<\/p><\/div><\/div>"}, {"contestId": 1516, "index": "B", "name": "AGAGA XOOORRR", "rating": 1500, "solvedCount": 27157, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. AGAGA XOOORRR<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Baby Ehab is known for his love for a certain operation. He has an array $$$a$$$ of length $$$n$$$, and he decided to keep doing the following operation on it: <\/p><ul> <li> he picks $$$2$$$ adjacent elements; he then removes them and places a single integer in their place: their <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#XOR\">bitwise XOR<\/a>. Note that the length of the array decreases by one. <\/li><\/ul><p>Now he asks you if he can make all elements of the array equal. Since babies like to make your life harder, he requires that you leave at least $$$2$$$ elements remaining.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$t$$$ ($$$1 \\le t \\le 15$$$)\u00a0\u2014 the number of test cases you need to solve.<\/p><p>The first line of each test case contains an integers $$$n$$$ ($$$2 \\le n \\le 2000$$$)\u00a0\u2014 the number of elements in the array $$$a$$$.<\/p><p>The second line contains $$$n$$$ space-separated integers $$$a_1$$$, $$$a_2$$$, $$$\\ldots$$$, $$$a_{n}$$$ ($$$0 \\le a_i  \\lt  2^{30}$$$)\u00a0\u2014 the elements of the array $$$a$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If Baby Ehab can make all elements equal while leaving at least $$$2$$$ elements standing, print \"<span class=\"tex-font-style-tt\">YES<\/span>\". Otherwise, print \"<span class=\"tex-font-style-tt\">NO<\/span>\".<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n3\n0 2 2\n4\n2 3 1 10\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nNO\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample, he can remove the first $$$2$$$ elements, $$$0$$$ and $$$2$$$, and replace them by $$$0 \\oplus 2=2$$$. The array will be $$$[2,2]$$$, so all the elements are equal.<\/p><p>In the second sample, there's no way to make all the elements equal.<\/p><\/div><\/div>"}, {"contestId": 1542, "index": "B", "name": "Plus and Multiply", "rating": 1500, "solvedCount": 27105, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Plus and Multiply<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There is an infinite set generated as follows:<\/p><ul> <li> $$$1$$$ is in this set. <\/li><li> If $$$x$$$ is in this set, $$$x \\cdot a$$$ and $$$x+b$$$ both are in this set. <\/li><\/ul><p>For example, when $$$a=3$$$ and $$$b=6$$$, the five smallest elements of the set are:<\/p><ul> <li> $$$1$$$, <\/li><li> $$$3$$$ ($$$1$$$ is in this set, so $$$1\\cdot a=3$$$ is in this set), <\/li><li> $$$7$$$ ($$$1$$$ is in this set, so $$$1+b=7$$$ is in this set), <\/li><li> $$$9$$$ ($$$3$$$ is in this set, so $$$3\\cdot a=9$$$ is in this set), <\/li><li> $$$13$$$ ($$$7$$$ is in this set, so $$$7+b=13$$$ is in this set). <\/li><\/ul><p>Given positive integers $$$a$$$, $$$b$$$, $$$n$$$, determine if $$$n$$$ is in this set.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The input consists of multiple test cases. The first line contains an integer $$$t$$$ ($$$1\\leq t\\leq 10^5$$$) \u2014 the number of test cases. The description of the test cases follows.<\/p><p>The only line describing each test case contains three integers $$$n$$$, $$$a$$$, $$$b$$$ ($$$1\\leq n,a,b\\leq 10^9$$$) separated by a single space.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print \"<span class=\"tex-font-style-tt\">Yes<\/span>\" if $$$n$$$ is in this set, and \"<span class=\"tex-font-style-tt\">No<\/span>\" otherwise. You can print each letter in any case.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n24 3 5\n10 3 6\n2345 1 4\n19260817 394 485\n19260817 233 264\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYes\nNo\nYes\nNo\nYes\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, $$$24$$$ is generated as follows:<\/p><ul> <li> $$$1$$$ is in this set, so $$$3$$$ and $$$6$$$ are in this set; <\/li><li> $$$3$$$ is in this set, so $$$9$$$ and $$$8$$$ are in this set; <\/li><li> $$$8$$$ is in this set, so $$$24$$$ and $$$13$$$ are in this set. <\/li><\/ul><p>Thus we can see $$$24$$$ is in this set.<\/p><p>The five smallest elements of the set in the second test case is described in statements. We can see that $$$10$$$ isn't among them.<\/p><\/div><\/div>"}, {"contestId": 1201, "index": "B", "name": "Zero Array", "rating": 1500, "solvedCount": 26967, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Zero Array<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a_1, a_2, \\ldots, a_n$$$.<\/p><p>In one operation you can choose two elements $$$a_i$$$ and $$$a_j$$$ ($$$i \\ne j$$$) and decrease each of them by one.<\/p><p>You need to check whether it is possible to make all the elements equal to zero or not.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$2 \\le n \\le 10^5$$$)\u00a0\u2014 the size of the array.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$)\u00a0\u2014 the elements of the array.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print \"<span class=\"tex-font-style-tt\">YES<\/span>\" if it is possible to make all elements zero, otherwise print \"<span class=\"tex-font-style-tt\">NO<\/span>\".<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n1 1 2 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n1 2 3 4 5 6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nNO<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, you can make all elements equal to zero in $$$3$$$ operations: <\/p><ul> <li> Decrease $$$a_1$$$ and $$$a_2$$$, <\/li><li> Decrease $$$a_3$$$ and $$$a_4$$$, <\/li><li> Decrease $$$a_3$$$ and $$$a_4$$$ <\/li><\/ul><p>In the second example, one can show that it is impossible to make all elements equal to zero.<\/p><\/div><\/div>"}, {"contestId": 166, "index": "E", "name": "Tetrahedron", "rating": 1500, "solvedCount": 26792, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Tetrahedron<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>You are given a tetrahedron. Let's mark its vertices with letters <span class=\"tex-span\"><i>A<\/i><\/span>, <span class=\"tex-span\"><i>B<\/i><\/span>, <span class=\"tex-span\"><i>C<\/i><\/span> and <span class=\"tex-span\"><i>D<\/i><\/span> correspondingly.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/3be56c11ee711a62cf3764b079d14a9dd16dac0e.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>An ant is standing in the vertex <span class=\"tex-span\"><i>D<\/i><\/span> of the tetrahedron. The ant is quite active and he wouldn't stay idle. At each moment of time he makes a step from one vertex to another one along some edge of the tetrahedron. The ant just can't stand on one place.<\/p><p>You do not have to do much to solve the problem: your task is to count the number of ways in which the ant can go from the initial vertex <span class=\"tex-span\"><i>D<\/i><\/span> to itself in exactly <span class=\"tex-span\"><i>n<\/i><\/span> steps. In other words, you are asked to find out the number of different cyclic paths with the length of <span class=\"tex-span\"><i>n<\/i><\/span> from vertex <span class=\"tex-span\"><i>D<\/i><\/span> to itself. As the number can be quite large, you should print it modulo <span class=\"tex-span\">1000000007<\/span> (<span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097<\/span>). <\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains the only integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">7<\/sup><\/span>) \u2014 the required length of the cyclic path.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the only integer \u2014 the required number of ways modulo <span class=\"tex-span\">1000000007<\/span> (<span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097<\/span>).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>21<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The required paths in the first sample are: <\/p><ul> <li> <span class=\"tex-span\"><i>D<\/i>\u2009-\u2009<i>A<\/i>\u2009-\u2009<i>D<\/i><\/span> <\/li><li> <span class=\"tex-span\"><i>D<\/i>\u2009-\u2009<i>B<\/i>\u2009-\u2009<i>D<\/i><\/span> <\/li><li> <span class=\"tex-span\"><i>D<\/i>\u2009-\u2009<i>C<\/i>\u2009-\u2009<i>D<\/i><\/span> <\/li><\/ul><\/div><\/div>"}, {"contestId": 1881, "index": "E", "name": "Block Sequence", "rating": 1500, "solvedCount": 26163, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Block Sequence<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Given a sequence of integers $$$a$$$ of length $$$n$$$.<\/p><p>A sequence is called <span class=\"tex-font-style-it\">beautiful<\/span> if it has the form of a series of blocks, each starting with its length, i.e., first comes the length of the block, and then its elements. For example, the sequences [$$$\\color{red}{3},\\ \\color{red}{3},\\ \\color{red}{4},\\ \\color{red}{5},\\ \\color{green}{2},\\ \\color{green}{6},\\ \\color{green}{1}$$$] and [$$$\\color{red}{1},\\ \\color{red}{8},\\ \\color{green}{4},\\ \\color{green}{5},\\ \\color{green}{2},\\ \\color{green}{6},\\ \\color{green}{1}$$$] are <span class=\"tex-font-style-it\">beautiful<\/span> (different blocks are colored differently), while [$$$1$$$], [$$$1,\\ 4,\\ 3$$$], [$$$3,\\ 2,\\ 1$$$] are not.<\/p><p>In one operation, you can remove any element from the sequence. What is the minimum number of operations required to make the given sequence <span class=\"tex-font-style-it\">beautiful<\/span>?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases. Then follows the descriptions of the test cases.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the length of the sequence $$$a$$$.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^6$$$)\u00a0\u2014 the elements of the sequence $$$a$$$.<\/p><p>It is guaranteed that the sum of the values of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single number\u00a0\u2014 the minimum number of deletions required to make the sequence $$$a$$$ <span class=\"tex-font-style-it\">beautiful<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 3 4 5 2 6 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 6 3 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 4 1 6 7 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 2 3 4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">1 2 3 1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">4 5 5 1 5<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n4\n1\n1\n2\n1\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case of the example, the given sequence is already <span class=\"tex-font-style-it\">beautiful<\/span>, as shown in the statement.<\/p><p>In the second test case of the example, the sequence can only be made beautiful by removing all elements from it.<\/p><p>In the fifth test case of the example, the sequence can be made beautiful by removing the first and last elements. Then the sequence will become [$$$2,\\ 3,\\ 4$$$].<\/p><\/div><\/div>"}, {"contestId": 702, "index": "C", "name": "Cellular Network", "rating": 1500, "solvedCount": 24804, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Cellular Network<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given <span class=\"tex-span\"><i>n<\/i><\/span> points on the straight line \u2014 the positions (<span class=\"tex-span\"><i>x<\/i><\/span>-coordinates) of the cities and <span class=\"tex-span\"><i>m<\/i><\/span> points on the same line \u2014 the positions (<span class=\"tex-span\"><i>x<\/i><\/span>-coordinates) of the cellular towers. All towers work in the same way \u2014 they provide cellular network for all cities, which are located at the distance which is no more than <span class=\"tex-span\"><i>r<\/i><\/span> from this tower.<\/p><p>Your task is to find minimal <span class=\"tex-span\"><i>r<\/i><\/span> that each city has been provided by cellular network, i.e. for each city there is at least one cellular tower at the distance which is no more than <span class=\"tex-span\"><i>r<\/i><\/span>.<\/p><p>If <span class=\"tex-span\"><i>r<\/i>\u2009=\u20090<\/span> then a tower provides cellular network only for the point where it is located. One tower can provide cellular network for any number of cities, but all these cities must be at the distance which is no more than <span class=\"tex-span\"><i>r<\/i><\/span> from this tower.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two positive integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>m<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the number of cities and the number of cellular towers.<\/p><p>The second line contains a sequence of <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">\u2009-\u200910<sup class=\"upper-index\">9<\/sup>\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) \u2014 the coordinates of cities. It is allowed that there are any number of cities in the same point. All coordinates <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> are given in non-decreasing order.<\/p><p>The third line contains a sequence of <span class=\"tex-span\"><i>m<\/i><\/span> integers <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>b<\/i><sub class=\"lower-index\"><i>m<\/i><\/sub><\/span> (<span class=\"tex-span\">\u2009-\u200910<sup class=\"upper-index\">9<\/sup>\u2009\u2264\u2009<i>b<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) \u2014 the coordinates of cellular towers. It is allowed that there are any number of towers in the same point. All coordinates <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span> are given in non-decreasing order.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print minimal <span class=\"tex-span\"><i>r<\/i><\/span> so that each city will be covered by cellular network.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 2<br/>-2 2 4<br/>-3 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 3<br/>1 5 10 14 17<br/>4 11 15<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1352, "index": "E", "name": "Special Elements", "rating": 1500, "solvedCount": 24689, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Special Elements<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>64 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-it\">Pay attention to the non-standard memory limit in this problem.<\/span><\/p><p><span class=\"tex-font-style-it\">In order to cut off efficient solutions from inefficient ones in this problem, the time limit is rather strict. Prefer to use compiled statically typed languages (e.g. C++). If you use Python, then submit solutions on PyPy. Try to write an efficient solution.<\/span><\/p><p>The array $$$a=[a_1, a_2, \\ldots, a_n]$$$ ($$$1 \\le a_i \\le n$$$) is given. Its element $$$a_i$$$ is called special if there exists a pair of indices $$$l$$$ and $$$r$$$ ($$$1 \\le l  \\lt  r \\le n$$$) such that $$$a_i = a_l + a_{l+1} + \\ldots + a_r$$$. In other words, an element is called special if it can be represented as the sum of <span class=\"tex-font-style-bf\">two or more consecutive elements<\/span> of an array (no matter if they are special or not).<\/p><p>Print the number of special elements of the given array $$$a$$$.<\/p><p>For example, if $$$n=9$$$ and $$$a=[3,1,4,1,5,9,2,6,5]$$$, then the answer is $$$5$$$:<\/p><ul> <li> $$$a_3=4$$$ is a special element, since $$$a_3=4=a_1+a_2=3+1$$$; <\/li><li> $$$a_5=5$$$ is a special element, since $$$a_5=5=a_2+a_3=1+4$$$; <\/li><li> $$$a_6=9$$$ is a special element, since $$$a_6=9=a_1+a_2+a_3+a_4=3+1+4+1$$$; <\/li><li> $$$a_8=6$$$ is a special element, since $$$a_8=6=a_2+a_3+a_4=1+4+1$$$; <\/li><li> $$$a_9=5$$$ is a special element, since $$$a_9=5=a_2+a_3=1+4$$$. <\/li><\/ul><p>Please note that some of the elements of the array $$$a$$$ may be equal \u2014 if several elements are equal and special, then all of them should be counted in the answer.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$t$$$ ($$$1 \\le t \\le 1000$$$) \u2014 the number of test cases in the input. Then $$$t$$$ test cases follow.<\/p><p>Each test case is given in two lines. The first line contains an integer $$$n$$$ ($$$1 \\le n \\le 8000$$$) \u2014 the length of the array $$$a$$$. The second line contains integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le n$$$).<\/p><p>It is guaranteed that the sum of the values of $$$n$$$ for all test cases in the input does not exceed $$$8000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$t$$$ numbers \u2014 the number of special elements for each of the given arrays.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n9\n3 1 4 1 5 9 2 6 5\n3\n1 1 2\n5\n1 1 1 1 1\n8\n8 7 6 5 4 3 2 1\n1\n1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5\n1\n0\n4\n0\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1915, "index": "F", "name": "Greetings", "rating": 1500, "solvedCount": 24097, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Greetings<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are $$$n$$$ people on the number line; the $$$i$$$-th person is at point $$$a_i$$$ and wants to go to point $$$b_i$$$. For each person, $$$a_i  \\lt  b_i$$$, and the starting and ending points of all people are distinct. (That is, all of the $$$2n$$$ numbers $$$a_1, a_2, \\dots, a_n, b_1, b_2, \\dots, b_n$$$ are distinct.) <\/p><p>All the people will start moving simultaneously at a speed of $$$1$$$ unit per second until they reach their final point $$$b_i$$$. When two people meet at the same point, they will greet each other once. How many greetings will there be?<\/p><p>Note that a person can still greet other people even if they have reached their final point.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases. The description of test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of people.<\/p><p>Then $$$n$$$ lines follow, the $$$i$$$-th of which contains two integers $$$a_i$$$ and $$$b_i$$$ ($$$-10^9 \\leq a_i  \\lt  b_i \\leq 10^9$$$)\u00a0\u2014 the starting and ending positions of each person.<\/p><p>For each test case, all of the $$$2n$$$ numbers $$$a_1, a_2, \\dots, a_n, b_1, b_2, \\dots, b_n$$$ are distinct.<\/p><p>The sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer denoting the number of greetings that will happen.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 9<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">7 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">-2 100<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">-10 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">-5 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">-12 12<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">-13 13<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">-4 9<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">-2 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">8 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">7 8<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n9\n6\n4\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the two people will meet at point $$$3$$$ and greet each other.<\/p><\/div><\/div>"}, {"contestId": 165, "index": "B", "name": "Burning Midnight Oil", "rating": 1500, "solvedCount": 24058, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Burning Midnight Oil<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>One day a highly important task was commissioned to Vasya \u2014 writing a program in a night. The program consists of <span class=\"tex-span\"><i>n<\/i><\/span> lines of code. Vasya is already exhausted, so he works like that: first he writes <span class=\"tex-span\"><i>v<\/i><\/span> lines of code, drinks a cup of tea, then he writes as much as <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/837a798d4a0c3fe486d62834783caae40b612564.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> lines, drinks another cup of tea, then he writes <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/6304306dbf5ca2b95ecc97210a073c7ce7046290.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> lines and so on: <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/2cdc02455a9281e93e689009c03121270d92d1bc.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>, <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/92bb2b6b977058290f73ae4b98682b9f08f27633.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>, <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/858a837a4b30b8578ae73e5bde2c4e213fa93c32.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>, ...<\/p><p>The expression <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/b5e5ef3e6404b5c0e793de54b932298d1825cced.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> is regarded as the integral part from dividing number <span class=\"tex-span\"><i>a<\/i><\/span> by number <span class=\"tex-span\"><i>b<\/i><\/span>.<\/p><p>The moment the current value <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/c126a89a41a4df209f523e85223b11f89735ebba.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> equals 0, Vasya immediately falls asleep and he wakes up only in the morning, when the program should already be finished.<\/p><p>Vasya is wondering, what minimum allowable value <span class=\"tex-span\"><i>v<\/i><\/span> can take to let him write <span class=\"tex-font-style-bf\">not less<\/span> than <span class=\"tex-span\"><i>n<\/i><\/span> lines of code before he falls asleep.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The input consists of two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span>, separated by spaces \u2014 the size of the program in lines and the productivity reduction coefficient, <span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>, <span class=\"tex-span\">2\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u200910<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the only integer \u2014 the minimum value of <span class=\"tex-span\"><i>v<\/i><\/span> that lets Vasya write the program in one night.<\/p><\/div><div class=\"sample-

div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p> <\/p><p>Neo wants to escape from the Matrix. In front of him are $$$n$$$ buttons arranged in a row. Each button has a weight given by an integer: $$$a_1, a_2, \\ldots, a_n$$$.<\/p><p>Neo is immobilized, but he can create and move clones. This means he can perform an unlimited number of actions of the following two types in any order: <\/p><ol> <li> Create a clone in front of a specific button. <\/li><li> Move an existing clone one position to the left or right. <\/li><\/ol><p>As soon as a clone is in front of another button that has not yet been pressed\u2014regardless of whether he was created or moved\u00a0\u2014 he <span class=\"tex-font-style-bf\">immediately<\/span> presses it. If the button has already been pressed, a clone does nothing\u00a0\u2014 buttons can only be pressed once.<\/p><p>For Neo to escape, he needs to press <span class=\"tex-font-style-bf\">all<\/span> the buttons in such an order that the sequence of their weights is <span class=\"tex-font-style-bf\">non-increasing<\/span>\u00a0\u2014 that is, if $$$b_1, b_2, \\ldots, b_n$$$ are the weights of the buttons in the order they are pressed, then it must hold that $$$b_1 \\geq b_2 \\geq \\cdots \\geq b_n$$$.<\/p><p>Your task is to determine the minimum number of clones that Neo needs to create in order to press all the buttons in a valid order.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains one integer $$$n$$$ ($$$1 \\leq n \\leq 2 \\cdot 10^5$$$)\u00a0\u2014 the number of buttons.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\leq a_i \\leq 10^9$$$)\u00a0\u2014 the weights of the buttons.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output one integer\u00a0\u2014 the minimum number of clones that need to be created to press all the buttons in a valid order.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 3 2 1 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 8 1 5 9 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">10<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 7 9 7 1 10 2 10 10 7<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n1\n2\n3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, Neo can act as follows: <\/p><ol> <li> Create a clone in front of the fifth button (with weight $$$5$$$). <\/li><li> Create a clone in front of the first button (with weight $$$4$$$). <\/li><li> Move the second clone from the first button to the second (with weight $$$3$$$). <\/li><li> Move the second clone from the second button to the third (with weight $$$2$$$). <\/li><li> Move the first clone from the fifth button to the fourth (with weight $$$1$$$). <\/li><\/ol> Thus, the sequence of button presses will be $$$5 \\rightarrow 4 \\rightarrow 3 \\rightarrow 2 \\rightarrow 1$$$, which meets the requirement. It can be shown that the number of clones created is the smallest possible.<p>In the second test case, Neo can act as follows: <\/p><ol> <li> Create a clone in front of the second button (with weight $$$1$$$). <\/li><li> Move the clone from the second button to the third (with weight $$$1$$$). <\/li><li> Move the clone from the third button to the second (already pressed). <\/li><li> Move the clone from the second button to the first (with weight $$$1$$$). <\/li><\/ol> Thus, the sequence of button presses will be $$$1 \\rightarrow 1 \\rightarrow 1$$$.<\/div><\/div>"}, {"contestId": 891, "index": "A", "name": "Pride", "rating": 1500, "solvedCount": 15301, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. Pride<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You have an array <span class=\"tex-span\"><i>a<\/i><\/span> with length <span class=\"tex-span\"><i>n<\/i><\/span>, you can perform operations. Each operation is like this: choose two <span class=\"tex-font-style-bf\">adjacent<\/span> elements from <span class=\"tex-span\"><i>a<\/i><\/span>, say <span class=\"tex-span\"><i>x<\/i><\/span> and <span class=\"tex-span\"><i>y<\/i><\/span>, and replace one of them with <span class=\"tex-span\"><i>gcd<\/i>(<i>x<\/i>,\u2009<i>y<\/i>)<\/span>, where <span class=\"tex-span\"><i>gcd<\/i><\/span> denotes the <a href=\"https://en.wikipedia.org/wiki/Greatest_common_divisor\">greatest common divisor<\/a>.<\/p><p>What is the minimum number of operations you need to make all of the elements equal to <span class=\"tex-span\">1<\/span>?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains one integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20092000<\/span>) \u2014 the number of elements in the array.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> space separated integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>)\u00a0\u2014 the elements of the array.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-font-style-tt\">-1<\/span>, if it is impossible to turn all numbers to <span class=\"tex-span\">1<\/span>. Otherwise, print the minimum number of operations needed to make all numbers equal to <span class=\"tex-span\">1<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>2 2 3 4 6<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>5<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>2 4 6 8<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>-1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>2 6 9<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample you can turn all numbers to <span class=\"tex-span\">1<\/span> using the following <span class=\"tex-span\">5<\/span> moves:<\/p><ul> <li> <span class=\"tex-span\">[2,\u20092,\u20093,\u20094,\u20096]<\/span>. <\/li><li> <span class=\"tex-span\">[2,\u20091,\u20093,\u20094,\u20096]<\/span> <\/li><li> <span class=\"tex-span\">[2,\u20091,\u20093,\u20091,\u20096]<\/span> <\/li><li> <span class=\"tex-span\">[2,\u20091,\u20091,\u20091,\u20096]<\/span> <\/li><li> <span class=\"tex-span\">[1,\u20091,\u20091,\u20091,\u20096]<\/span> <\/li><li> <span class=\"tex-span\">[1,\u20091,\u20091,\u20091,\u20091]<\/span> <\/li><\/ul><p>We can prove that in this case it is not possible to make all numbers one using less than <span class=\"tex-span\">5<\/span> moves.<\/p><\/div><\/div>"}, {"contestId": 1203, "index": "E", "name": "Boxers", "rating": 1500, "solvedCount": 15287, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Boxers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>There are $$$n$$$ boxers, the weight of the $$$i$$$-th boxer is $$$a_i$$$. Each of them can change the weight by no more than $$$1$$$ before the competition (the weight cannot become equal to zero, that is, it must remain positive). Weight is always an integer number.<\/p><p>It is necessary to choose the largest boxing team in terms of the number of people, that all the boxers' weights in the team are different (i.e. unique).<\/p><p>Write a program that for given current values \u200b$$$a_i$$$ will find the maximum possible number of boxers in a team.<\/p><p>It is possible that after some change the weight of some boxer is $$$150001$$$ (but no more).<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$n$$$ ($$$1 \\le n \\le 150000$$$) \u2014 the number of boxers. The next line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$, where $$$a_i$$$ ($$$1 \\le a_i \\le 150000$$$) is the weight of the $$$i$$$-th boxer.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u2014 the maximum possible number of people in a team.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>3 2 4 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>6<br/>1 1 1 4 4 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>5<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, boxers should not change their weights \u2014 you can just make a team out of all of them.<\/p><p>In the second example, one boxer with a weight of $$$1$$$ can be increased by one (get the weight of $$$2$$$), one boxer with a weight of $$$4$$$ can be reduced by one, and the other can be increased by one (resulting the boxers with a weight of $$$3$$$ and $$$5$$$, respectively). Thus, you can get a team consisting of boxers with weights of $$$5, 4, 3, 2, 1$$$.<\/p><\/div><\/div>"}, {"contestId": 1296, "index": "D", "name": "Fight with Monsters", "rating": 1500, "solvedCount": 15238, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Fight with Monsters<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are $$$n$$$ monsters standing in a row numbered from $$$1$$$ to $$$n$$$. The $$$i$$$-th monster has $$$h_i$$$ health points (hp). You have your attack power equal to $$$a$$$ hp and your opponent has his attack power equal to $$$b$$$ hp.<\/p><p>You and your opponent are fighting these monsters. Firstly, you and your opponent go to the first monster and fight it till his death, then you and your opponent go the second monster and fight it till his death, and so on. A monster is considered dead if its hp is less than or equal to $$$0$$$.<\/p><p>The fight with a monster happens in turns. <\/p><ol> <li> You hit the monster by $$$a$$$ hp. If it is dead after your hit, <span class=\"tex-font-style-bf\">you gain one point<\/span> and you both proceed to the next monster. <\/li><li> Your opponent hits the monster by $$$b$$$ hp. If it is dead after his hit, <span class=\"tex-font-style-bf\">nobody gains a point<\/span> and you both proceed to the next monster. <\/li><\/ol><p>You have some secret technique to force your opponent to skip his turn. You can use this technique at most $$$k$$$ times <span class=\"tex-font-style-bf\">in total<\/span> (for example, if there are two monsters and $$$k=4$$$, then you can use the technique $$$2$$$ times on the first monster and $$$1$$$ time on the second monster, but not $$$2$$$ times on the first monster and $$$3$$$ times on the second monster).<\/p><p>Your task is to determine the maximum number of points you can gain if you use the secret technique optimally.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains four integers $$$n, a, b$$$ and $$$k$$$ ($$$1 \\le n \\le 2 \\cdot 10^5, 1 \\le a, b, k \\le 10^9$$$) \u2014 the number of monsters, your attack power, the opponent's attack power and the number of times you can use the secret technique.<\/p><p>The second line of the input contains $$$n$$$ integers $$$h_1, h_2, \\dots, h_n$$$ ($$$1 \\le h_i \\le 10^9$$$), where $$$h_i$$$ is the health points of the $$$i$$$-th monster.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the maximum number of points you can gain if you use the secret technique optimally.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 2 3 3\n7 10 50 12 1 8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1 1 100 99\n100\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7 4 2 1\n1 3 5 4 2 7 6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n<\/pre><\/div><\/div><\/div><\/div>"}];

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox'; checkbox.className = 'done-checkbox'; checkbox.checked = doneSet.has(prob.name);
            checkbox.onclick = (e) => { e.stopPropagation(); toggleDone(prob.name, checkbox.checked); };
            const title = document.createElement('div');
            title.innerHTML = `<span class="text-xs text-slate-500">#${idx + 1}</span> <span class="font-semibold text-slate-200">${prob.name}</span>`;
            div.appendChild(checkbox); div.appendChild(title); div.onclick = () => loadProblem(prob);
            list.appendChild(div);
        });
        updateProgress();
    }

    function toggleDone(name, isDone) {
        if(isDone) { doneSet.add(name); confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#4ade80', '#38bdf8'] }); } 
        else { doneSet.delete(name); }
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...doneSet]));
        updateProgress();
    }

    function updateProgress() { document.getElementById('progress-text').innerText = `${doneSet.size} / ${PROBLEMS.length} Solved`; }

    function loadProblem(prob) {
        currentProblem = prob; renderSidebar();
        document.getElementById('welcome-screen').style.display = 'none';
        const contentDiv = document.getElementById('problem-content');
        contentDiv.style.display = 'block'; contentDiv.innerHTML = prob.html;
        const titleEl = contentDiv.querySelector('.header .title');
        if(titleEl) {
            const originalText = titleEl.innerText;
            titleEl.innerHTML = `<a href="https://codeforces.com/contest/${prob.contestId}/problem/${prob.index}" target="_blank" title="Open in Codeforces">${originalText} 🔗</a>`;
        }
        contentDiv.querySelectorAll('.sample-tests .input pre').forEach(pre => {
            const btn = document.createElement('button'); btn.innerText = 'Copy'; btn.className = 'copy-btn';
            btn.onclick = () => { navigator.clipboard.writeText(pre.innerText); btn.innerText = 'Copied!'; btn.style.background = '#4ade80'; setTimeout(() => { btn.innerText = 'Copy'; btn.style.background = 'var(--neon-blue)'; }, 2000); };
            pre.parentElement.appendChild(btn);
        });
        if (window.MathJax) { MathJax.typesetPromise([contentDiv]); }
        editor.setValue(DEFAULT_TEMPLATE, 1);
    }

    function toggleSettings() {
        const modal = document.getElementById('settings-modal');
        if(modal.style.display === 'flex') { modal.style.display = 'none'; } 
        else { modal.style.display = 'flex'; document.getElementById('api-key').value = localStorage.getItem('cf_api_key') || ''; document.getElementById('api-secret').value = localStorage.getItem('cf_api_secret') || ''; }
    }

    function saveSettings() {
        localStorage.setItem('cf_api_key', document.getElementById('api-key').value);
        localStorage.setItem('cf_api_secret', document.getElementById('api-secret').value);
        toggleSettings(); alert('API Credentials Saved!');
    }

    async function sha512(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-512', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function submitCode() {
        if(!currentProblem) return alert('Select a problem first!');
        const apiKey = localStorage.getItem('cf_api_key'); const apiSecret = localStorage.getItem('cf_api_secret');
        if(!apiKey || !apiSecret) { alert('Please configure your API Key and Secret first.'); toggleSettings(); return; }
        const code = editor.getValue(); const time = Math.floor(Date.now() / 1000); const rand = Math.floor(Math.random() * 900000) + 100000;
        const params = { apiKey: apiKey, contestId: currentProblem.contestId.toString(), languageId: "54", problemIndex: currentProblem.index, source: code, time: time.toString() };
        const sortedKeys = Object.keys(params).sort();
        let paramString = sortedKeys.map(k => `${k}=${encodeURIComponent(params[k])}`).join('&');
        const sigPlain = `${rand}/problemset.submit?${paramString}#${apiSecret}`;
        const apiSig = `${rand}` + await sha512(sigPlain);
        try {
            const formData = new URLSearchParams();
            for (const key in params) formData.append(key, params[key]);
            formData.append("apiSig", apiSig);
            const res = await fetch("https://codeforces.com/api/problemset.submit", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: formData.toString() });
            const data = await res.json();
            if(data.status === 'OK') { alert('Code submitted successfully! 🎉 Check your Codeforces submissions.'); confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } }); } 
            else { alert('Submission failed: ' + data.comment); }
        } catch (err) { console.error(err); alert('Network error during submission.'); }
    }

    window.onload = () => { initEditor(); renderSidebar(); };
</script>

a minimal $$$m$$$ ($$$m \\ge n$$$) that the equality on the board holds.<\/p><p>Unfortunately, Petya couldn't solve this problem in his head and decided to ask for computer help. He quickly wrote a program and found the answer.<\/p><p>Can you solve this difficult problem?<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/4a5e1ab1c08f0400bd260e438330e662751bdc07.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 2000$$$). The description of the test cases follows.<\/p><p>The only line of each test case contains two integers $$$n$$$, $$$x$$$ ($$$0\\le n, x \\le 10^{18}$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For every test case, output the smallest possible value of $$$m$$$ such that equality holds.<\/p><p>If the equality does not hold for any $$$m$$$, print $$$-1$$$ instead.<\/p><p>We can show that if the required $$$m$$$ exists, it does not exceed $$$5 \\cdot 10^{18}$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">10 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">10 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">10 42<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">20 16<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1000000000000000000 0<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n12\n10\n-1\n24\n1152921504606846976\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, $$$10\\ \\&amp;\\ 11 = 10$$$, but $$$10\\ \\&amp;\\ 11\\ \\&amp;\\ 12 = 8$$$, so the answer is $$$12$$$.<\/p><p>In the second example, $$$10 = 10$$$, so the answer is $$$10$$$.<\/p><p>In the third example, we can see that the required $$$m$$$ does not exist, so we have to print $$$-1$$$.<\/p><\/div><\/div>"}, {"contestId": 1374, "index": "E1", "name": "Reading Books (easy version)", "rating": 1600, "solvedCount": 15175, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E1. Reading Books (easy version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">Easy and hard versions are actually different problems, so read statements of both problems completely and carefully<\/span>.<\/p><p>Summer vacation has started so Alice and Bob want to play and joy, but... Their mom doesn't think so. She says that they have to read some amount of books before all entertainments. Alice and Bob will read each book <span class=\"tex-font-style-bf\">together<\/span> to end this exercise faster.<\/p><p>There are $$$n$$$ books in the family library. The $$$i$$$-th book is described by three integers: $$$t_i$$$ \u2014 the amount of time Alice and Bob need to spend to read it, $$$a_i$$$ (equals $$$1$$$ if Alice likes the $$$i$$$-th book and $$$0$$$ if not), and $$$b_i$$$ (equals $$$1$$$ if Bob likes the $$$i$$$-th book and $$$0$$$ if not).<\/p><p>So they need to choose some books from the given $$$n$$$ books in such a way that:<\/p><ul> <li> Alice likes <span class=\"tex-font-style-bf\">at least<\/span> $$$k$$$ books from the chosen set and Bob likes <span class=\"tex-font-style-bf\">at least<\/span> $$$k$$$ books from the chosen set; <\/li><li> the total reading time of these books is <span class=\"tex-font-style-bf\">minimized<\/span> (they are children and want to play and joy as soon a possible). <\/li><\/ul><p>The set they choose is <span class=\"tex-font-style-bf\">the same<\/span> for both Alice an Bob (it's shared between them) and they read all books <span class=\"tex-font-style-bf\">together<\/span>, so the total reading time is the sum of $$$t_i$$$ over all books that are in the chosen set.<\/p><p>Your task is to help them and find any suitable set of books or determine that it is impossible to find such a set.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le k \\le n \\le 2 \\cdot 10^5$$$).<\/p><p>The next $$$n$$$ lines contain descriptions of books, one description per line: the $$$i$$$-th line contains three integers $$$t_i$$$, $$$a_i$$$ and $$$b_i$$$ ($$$1 \\le t_i \\le 10^4$$$, $$$0 \\le a_i, b_i \\le 1$$$), where:<\/p><ul> <li> $$$t_i$$$ \u2014 the amount of time required for reading the $$$i$$$-th book; <\/li><li> $$$a_i$$$ equals $$$1$$$ if Alice likes the $$$i$$$-th book and $$$0$$$ otherwise; <\/li><li> $$$b_i$$$ equals $$$1$$$ if Bob likes the $$$i$$$-th book and $$$0$$$ otherwise. <\/li><\/ul><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If there is no solution, print only one integer <span class=\"tex-font-style-tt\">-1<\/span>. Otherwise print one integer $$$T$$$ \u2014 the minimum total reading time of the suitable set of books.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>8 4<br/>7 1 1<br/>2 1 1<br/>4 0 1<br/>8 1 1<br/>1 0 1<br/>1 1 1<br/>1 0 1<br/>3 0 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>18<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 2<br/>6 0 0<br/>9 0 0<br/>1 0 1<br/>2 1 1<br/>5 1 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>8<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 3<br/>3 0 0<br/>2 1 0<br/>3 1 0<br/>5 0 1<br/>3 0 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>-1<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1798, "index": "D", "name": "Shocking Arrangement", "rating": 1600, "solvedCount": 15105, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Shocking Arrangement<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a_1, a_2, \\ldots, a_n$$$ consisting of integers such that $$$a_1 + a_2 + \\ldots + a_n = 0$$$.<\/p><p>You have to rearrange the elements of the array $$$a$$$ so that the following condition is satisfied:<\/p><p>$$$$$$\\max\\limits_{1 \\le l \\le r \\le n} \\lvert a_l + a_{l+1} + \\ldots + a_r \\rvert  \\lt  \\max(a_1, a_2, \\ldots, a_n) - \\min(a_1, a_2, \\ldots, a_n),$$$$$$ where $$$|x|$$$ denotes the absolute value of $$$x$$$.<\/p><p>More formally, determine if there exists a permutation $$$p_1, p_2, \\ldots, p_n$$$ that for the array $$$a_{p_1}, a_{p_2}, \\ldots, a_{p_n}$$$, the condition above is satisfied, and find the corresponding array.<\/p><p>Recall that the array $$$p_1, p_2, \\ldots, p_n$$$ is called a permutation if for each integer $$$x$$$ from $$$1$$$ to $$$n$$$ there is exactly one $$$i$$$ from $$$1$$$ to $$$n$$$ such that $$$p_i = x$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 50\\,000$$$). The description of the test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 300\\,000$$$)\u00a0\u2014 the length of the array $$$a$$$.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$-10^9 \\le a_i \\le 10^9$$$)\u00a0\u2014 elements of the array $$$a$$$. It is guaranteed that the sum of the array $$$a$$$ is zero, in other words: $$$a_1 + a_2 + \\ldots + a_n = 0$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$300\\,000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, if it is impossible to rearrange the elements of the array $$$a$$$ in the required way, print \"<span class=\"tex-font-style-tt\">No<\/span>\" in a single line.<\/p><p>If possible, print \"<span class=\"tex-font-style-tt\">Yes<\/span>\" in the first line, and then in a separate line $$$n$$$ numbers\u00a0\u2014 elements $$$a_1, a_2, \\ldots, a_n$$$ rearranged in a valid order ($$$a_{p_1}, a_{p_2}, \\ldots, a_{p_n}$$$).<\/p><p>If there are several possible answers, you can output any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7\n4\n3 4 -2 -5\n5\n2 2 2 -3 -3\n8\n-3 -3 1 1 1 1 1 1\n3\n0 1 -1\n7\n-3 4 3 4 -4 -4 0\n1\n0\n7\n-18 13 -18 -17 12 15 13\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYes\n-5 -2 3 4\nYes\n-3 2 -3 2 2\nYes\n1 1 1 -3 1 1 1 -3\nYes\n-1 0 1\nYes\n4 -4 4 -4 0 3 -3\nNo\nYes\n13 12 -18 15 -18 13 -17\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case $$$\\max(a_1, \\ldots, a_n) - \\min(a_1, \\ldots, a_n) = 9$$$. Therefore, the elements can be rearranged as $$$[-5, -2, 3, 4]$$$. It is easy to see that for such an arrangement $$$\\lvert a_l + \\ldots + a_r \\rvert$$$ is always not greater than $$$7$$$, and therefore less than $$$9$$$.<\/p><p>In the second test case you can rearrange the elements of the array as $$$[-3, 2, -3, 2, 2]$$$. Then the maximum modulus of the sum will be reached on the subarray $$$[-3, 2, -3]$$$, and will be equal to $$$\\lvert -3 + 2 + -3 \\rvert = \\lvert -4 \\rvert = 4$$$, which is less than $$$5$$$.<\/p><p>In the fourth test example, any rearrangement of the array $$$a$$$ will be suitable as an answer, including $$$[-1, 0, 1]$$$.<\/p><\/div><\/div>"}, {"contestId": 348, "index": "A", "name": "Mafia", "rating": 1600, "solvedCount": 15042, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. Mafia<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>One day <span class=\"tex-span\"><i>n<\/i><\/span> friends gathered together to play \"Mafia\". During each round of the game some player must be the supervisor and other <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> people take part in the game. For each person we know in how many rounds he wants to be a player, not the supervisor: the <span class=\"tex-span\"><i>i<\/i><\/span>-th person wants to play <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> rounds. What is the minimum number of rounds of the \"Mafia\" game they need to play to let each person play at least as many rounds as they want?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integer <span class=\"tex-span\"><i>n<\/i><\/span> <span class=\"tex-span\">(3\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>)<\/span>. The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> space-separated integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup>)<\/span> \u2014 the <span class=\"tex-span\"><i>i<\/i><\/span>-th number in the list is the number of rounds the <span class=\"tex-span\"><i>i<\/i><\/span>-th person wants to play.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In a single line print a single integer \u2014 the minimum number of game rounds the friends need to let the <span class=\"tex-span\"><i>i<\/i><\/span>-th person play at least <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> rounds.<\/p><p>Please, do not use the <span class=\"tex-font-style-tt\">%lld<\/span> specifier to read or write 64-bit integers in \u0421++. It is preferred to use the <span class=\"tex-font-style-tt\">cin<\/span>, <span class=\"tex-font-style-tt\">cout<\/span> streams or the <span class=\"tex-font-style-tt\">%I64d<\/span> specifier.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>3 2 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>2 2 2 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>You don't need to know the rules of \"Mafia\" to solve this problem. If you're curious, it's a game Russia got from the Soviet times: <span class=\"tex-font-style-tt\">http://en.wikipedia.org/wiki/Mafia_(party_game)<\/span>.<\/p><\/div><\/div>"}, {"contestId": 1520, "index": "F1", "name": "Guess the K-th Zero (Easy version)", "rating": 1600, "solvedCount": 14923, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F1. Guess the K-th Zero (Easy version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is an interactive problem.<\/span><\/p><p><span class=\"tex-font-style-bf\">This is an easy version of the problem. The difference from the hard version is that in the easy version $$$t=1$$$ and the number of queries is limited to $$$20$$$.<\/span><\/p><p>Polycarp is playing a computer game. In this game, an array consisting of zeros and ones is hidden. Polycarp wins if he guesses the position of the $$$k$$$-th zero from the left $$$t$$$ times.<\/p><p>Polycarp can make no more than $$$20$$$ requests of the following type: <\/p><ul> <li> <span class=\"tex-font-style-tt\">?<\/span> $$$l$$$ $$$r$$$\u00a0\u2014 find out the sum of all elements in positions from $$$l$$$ to $$$r$$$ ($$$1 \\le l \\le r \\le n$$$) inclusive. <\/li><\/ul><p><span class=\"tex-font-style-it\">In this (easy version) of the problem, this paragraph doesn't really make sense since $$$t=1$$$ always.<\/span> To make the game more interesting, each guessed zero turns into one and the game continues on the changed array. More formally, if the position of the $$$k$$$-th zero was $$$x$$$, then after Polycarp guesses this position, the $$$x$$$-th element of the array will be replaced from $$$0$$$ to $$$1$$$. Of course, this feature affects something only for $$$t \\gt 1$$$.<\/p><p>Help Polycarp win the game.<\/p><\/div><div><div class=\"section-title\">Interaction<\/div><p>First, your program must read two integers $$$n$$$ and $$$t$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$, $$$t=1$$$).<\/p><p>Then $$$t$$$ lines follow, each of which contains one integer $$$k$$$ ($$$1 \\le k \\le n$$$). It is guaranteed that at the moment of the request the array contains at least $$$k$$$ zeros. In order to get the next value of $$$k$$$, you must output the answer for the current value of $$$k$$$.<\/p><p>After that, you can make no more than $$$20$$$ requests.<\/p><p>Use the following format to output the answer (it is not a request, it doesn't count in $$$20$$$): <\/p><ul> <li> <span class=\"tex-font-style-tt\">!<\/span> $$$x$$$\u00a0\u2014 position of the $$$k$$$-th zero. <\/li><\/ul><p>Positions in the array are numbered from left to right from $$$1$$$ to $$$n$$$ inclusive.<\/p><p>After printing $$$t$$$ answers, your program should exit immediately.<\/p><p>In this task, the interactor is <span class=\"tex-font-style-bf\">not adaptive<\/span>. This means that within the same test, the hidden array and the queries <span class=\"tex-font-style-bf\">do not change<\/span>.<\/p><p>In case of an incorrect query, <span class=\"tex-font-style-tt\">-1<\/span> will be displayed. When this value is received, your program must immediately exit normally (for example, by calling <span class=\"tex-font-style-tt\">exit(0)<\/span>), otherwise, the testing system may issue an arbitrary verdict.<\/p><p>If the number of requests is exceeded, the verdict <span class=\"tex-font-style-it\">wrong answer<\/span> will be displayed.<\/p><p>Your solution may get the verdict <span class=\"tex-font-style-it\">Idleness limit exceeded<\/span> if you don't print anything or forget to flush the output buffer.<\/p><p>To flush the output buffer, you need to do the following immediately after the query output and the end-of-line character:<\/p><ul> <li> <span class=\"tex-font-style-tt\">fflush(stdout)<\/span> or <span class=\"tex-font-style-tt\">cout.flush()<\/span> in C ++; <\/li><li> <span class=\"tex-font-style-tt\">System.out.flush()<\/span> in Java; <\/li><li> <span class=\"tex-font-style-tt\">flush(output)<\/span> in Pascal; <\/li><li> <span class=\"tex-font-style-tt\">stdout.flush()<\/span> in Python; <\/li><li> see the documentation for other languages. <\/li><\/ul><p><span class=\"tex-font-style-bf\">Hacks<\/span><\/p><p>Use the following format for hacks:<\/p><p>On the first line print the string $$$s$$$ ($$$1 \\le |s| \\le 2 \\cdot 10^5$$$), consisting of zeros and ones, and an integer $$$t$$$ ($$$t = 1$$$)\u00a0\u2014 hidden array and number of requests, respectively. In the next $$$t$$$ lines output the number $$$k$$$ ($$$1 \\le k \\le |s|$$$).<\/p><p>The hacked solution will not have direct access to the hidden array.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 1\n2\n\n2\n\n1\n\n1\n\n0\n\n0<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n? 4 6\n\n? 1 1\n\n? 1 2\n\n? 2 2\n\n? 5 5\n\n! 5<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test, the $$$[1, 0, 1, 1, 0, 1]$$$ array is hidden. In this test $$$k=2$$$.<\/p><\/div><\/div>"}, {"contestId": 1503, "index": "A", "name": "Balance the Bits", "rating": 1600, "solvedCount": 14923, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. Balance the Bits<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>A sequence of brackets is called balanced if one can turn it into a valid math expression by adding characters '<span class=\"tex-font-style-tt\">+<\/span>' and '<span class=\"tex-font-style-tt\">1<\/span>'. For example, sequences '<span class=\"tex-font-style-tt\">(())()<\/span>', '<span class=\"tex-font-style-tt\">()<\/span>', and '<span class=\"tex-font-style-tt\">(()(()))<\/span>' are balanced, while '<span class=\"tex-font-style-tt\">)(<\/span>', '<span class=\"tex-font-style-tt\">(()<\/span>', and '<span class=\"tex-font-style-tt\">(()))(<\/span>' are not.<\/p><p>You are given a binary string $$$s$$$ of length $$$n$$$. Construct two balanced bracket sequences $$$a$$$ and $$$b$$$ of length $$$n$$$ such that for all $$$1\\le i\\le n$$$: <\/p><ul> <li> if $$$s_i=1$$$, then $$$a_i=b_i$$$ <\/li><li> if $$$s_i=0$$$, then $$$a_i\\ne b_i$$$ <\/li><\/ul><p>If it is impossible, you should report about it.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1\\le t\\le 10^4$$$) \u2014 the number of test cases.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$2\\le n\\le 2\\cdot 10^5$$$, $$$n$$$ is even).<\/p><p>The next line contains a string $$$s$$$ of length $$$n$$$, consisting of characters <span class=\"tex-font-style-tt\">0<\/span> and <span class=\"tex-font-style-tt\">1<\/span>.<\/p><p>The sum of $$$n$$$ across all test cases does not exceed $$$2\\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If such two balanced bracked sequences exist, output \"<span class=\"tex-font-style-tt\">YES<\/span>\" on the first line, otherwise output \"<span class=\"tex-font-style-tt\">NO<\/span>\". You can print each letter in any case (upper or lower).<\/p><p>If the answer is \"<span class=\"tex-font-style-tt\">YES<\/span>\", output the balanced bracket sequences $$$a$$$ and $$$b$$$ satisfying the conditions on the next two lines.<\/p><p>If there are multiple solutions, you may print any.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n6\n101101\n10\n1001101101\n4\n1100\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\n()()()\n((()))\nYES\n()()((()))\n(())()()()\nNO\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, $$$a=$$$\"<span class=\"tex-font-style-tt\">()()()<\/span>\" and $$$b=$$$\"<span class=\"tex-font-style-tt\">((()))<\/span>\". The characters are equal in positions $$$1$$$, $$$3$$$, $$$4$$$, and $$$6$$$, which are the exact same positions where $$$s_i=1$$$.<\/p><p>In the second test case, $$$a=$$$\"<span class=\"tex-font-style-tt\">()()((()))<\/span>\" and $$$b=$$$\"<span class=\"tex-font-style-tt\">(())()()()<\/span>\". The characters are equal in positions $$$1$$$, $$$4$$$, $$$5$$$, $$$7$$$, $$$8$$$, $$$10$$$, which are the exact same positions where $$$s_i=1$$$.<\/p><p>In the third test case, there is no solution.<\/p><\/div><\/div>"}, {"contestId": 1779, "index": "C", "name": "Least Prefix Sum", "rating": 1600, "solvedCount": 14860, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Least Prefix Sum<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Baltic, a famous chess player who is also a mathematician, has an array $$$a_1,a_2, \\ldots, a_n$$$, and he can perform the following operation several (possibly $$$0$$$) times:<\/p><ul> <li> Choose some index $$$i$$$ ($$$1 \\leq i \\leq n$$$); <\/li><li> multiply $$$a_i$$$ with $$$-1$$$, that is, set $$$a_i := -a_i$$$. <\/li><\/ul><p>Baltic's favorite number is $$$m$$$, and he wants $$$a_1 + a_2 + \\cdots + a_m$$$ to be the smallest of all non-empty prefix sums. More formally, for each $$$k = 1,2,\\ldots, n$$$ it should hold that $$$$$$a_1 + a_2 + \\cdots + a_k \\geq a_1 + a_2 + \\cdots + a_m.$$$$$$<\/p><p>Please note that multiple smallest prefix sums may exist and that it is only required that $$$a_1 + a_2 + \\cdots + a_m$$$ is one of them.<\/p><p>Help Baltic find the minimum number of operations required to make $$$a_1 + a_2 + \\cdots + a_m$$$ the least of all prefix sums. It can be shown that a valid sequence of operations always exists.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\leq t \\leq 10\\,000$$$). The description of the test cases follows.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\leq m \\leq n \\leq 2\\cdot 10^5$$$)\u00a0\u2014 the size of Baltic's array and his favorite number.<\/p><p>The second line contains $$$n$$$ integers $$$a_1,a_2, \\ldots, a_n$$$ ($$$-10^9 \\leq a_i \\leq 10^9$$$)\u00a0\u2014 the array.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2\\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print a single integer\u00a0\u2014 the minimum number of required operations.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">-1 -2 -3 -4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2 3 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">-2 3 -5 1 -20<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">-2 3 -5 -5 -20<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">10 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">345875723 -48 384678321 -375635768 -35867853 -35863586 -358683842 -81725678 38576 -357865873<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n1\n0\n0\n3\n4\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, we perform the operation $$$a_4 := -a_4$$$. The array becomes $$$[-1,-2,-3,4]$$$ and the prefix sums, $$$[a_1, \\ a_1+a_2, \\ a_1+a_2+a_3, \\ a_1+a_2+a_3+a_4]$$$, are equal to $$$[-1,-3,-6,-2]$$$. Thus $$$a_1 + a_2 + a_3=-6$$$ is the smallest of all prefix sums.<\/p><p>In the second example, we perform the operation $$$a_3 := -a_3$$$. The array becomes $$$[1,2,-3,4]$$$ with prefix sums equal to $$$[1,3,0,4]$$$.<\/p><p>In the third and fourth examples, $$$a_1 + a_2 + \\cdots + a_m$$$ is already the smallest of the prefix sums\u00a0\u2014 no operation needs to be performed.<\/p><p>In the fifth example, a valid sequence of operations is:<\/p><ul> <li> $$$a_3 := -a_3$$$, <\/li><li> $$$a_2 := -a_2$$$, <\/li><li> $$$a_5 := -a_5$$$. <\/li><\/ul><p>The array becomes $$$[-2,-3,5,-5,20]$$$ and its prefix sums are $$$[-2,-5,0,-5,15]$$$. Note that $$$a_1+a_2=-5$$$ and $$$a_1+a_2+a_3+a_4=-5$$$ are both the smallest of the prefix sums (and this is a valid solution).<\/p><\/div><\/div>"}, {"contestId": 1251, "index": "C", "name": "Minimize The Integer", "rating": 1600, "solvedCount": 14763, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Minimize The Integer<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a huge integer $$$a$$$ consisting of $$$n$$$ digits ($$$n$$$ is between $$$1$$$ and $$$3 \\cdot 10^5$$$, inclusive). It may contain leading zeros.<\/p><p>You can swap two digits on adjacent (neighboring) positions if the swapping digits are of different parity (that is, they have different remainders when divided by $$$2$$$). <\/p><p>For example, if $$$a = 032867235$$$ you can get the following integers in a single operation: <\/p><ul> <li> $$$302867235$$$ if you swap the first and the second digits; <\/li><li> $$$023867235$$$ if you swap the second and the third digits; <\/li><li> $$$032876235$$$ if you swap the fifth and the sixth digits; <\/li><li> $$$032862735$$$ if you swap the sixth and the seventh digits; <\/li><li> $$$032867325$$$ if you swap the seventh and the eighth digits. <\/li><\/ul><p>Note, that you can't swap digits on positions $$$2$$$ and $$$4$$$ because the positions are not adjacent. Also, you can't swap digits on positions $$$3$$$ and $$$4$$$ because the digits have the same parity.<\/p><p>You can perform any number (possibly, zero) of such operations.<\/p><p>Find the minimum integer you can obtain.<\/p><p><span class=\"tex-font-style-bf\">Note that the resulting integer also may contain leading zeros.<\/span><\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$) \u2014 the number of test cases in the input.<\/p><p>The only line of each test case contains the integer $$$a$$$, its length $$$n$$$ is between $$$1$$$ and $$$3 \\cdot 10^5$$$, inclusive.<\/p><p>It is guaranteed that the sum of all values $$$n$$$ does not exceed $$$3 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case print line \u2014 the minimum integer you can obtain.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n0709\n1337\n246432\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0079\n1337\n234642\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, you can perform the following sequence of operations (the pair of swapped digits is highlighted): $$$0 \\underline{\\textbf{70}} 9 \\rightarrow 0079$$$.<\/p><p>In the second test case, the initial integer is optimal. <\/p><p>In the third test case you can perform the following sequence of operations: $$$246 \\underline{\\textbf{43}} 2 \\rightarrow 24 \\underline{\\textbf{63}}42 \\rightarrow 2 \\underline{\\textbf{43}} 642 \\rightarrow 234642$$$.<\/p><\/div><\/div>"}, {"contestId": 1857, "index": "F", "name": "Sum and Product", "rating": 1600, "solvedCount": 14732, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Sum and Product<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You have an array $$$a$$$ of length $$$n$$$.<\/p><p>Your task is to answer $$$q$$$ queries: given $$$x,y$$$, find the number of pairs $$$i$$$ and $$$j$$$ ($$$1 \\le i  \\lt  j \\le n$$$) that both $$$a_i + a_j = x$$$ and $$$a_i \\cdot a_j = y$$$.<\/p><p>That is, for the array $$$[1,3,2]$$$ and asking for $$$x=3,y=2$$$ the answer is $$$1$$$: <\/p><ul> <li> $$$i=1$$$ and $$$j=2$$$ fail because $$$1 + 3 = 4$$$ and not $$$3,$$$ also $$$1 \\cdot 3=3$$$ and not $$$2$$$; <\/li><li> $$$i=1$$$ and $$$j=3$$$ satisfies both conditions; <\/li><li> $$$i=2$$$ and $$$j=3$$$ fail because $$$3 + 2 = 5$$$ and not $$$3,$$$ also $$$3 \\cdot 2=6$$$ and not $$$2$$$; <\/li><\/ul><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1\\le t\\le 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The second line of each test case contains one integer $$$n$$$ ($$$1 \\le n \\le 2\\cdot 10^5$$$)\u00a0\u2014 the length of the array $$$a$$$.<\/p><p>The third line of each test case contains $$$n$$$ integers $$$a_1,a_2,\\dots,a_n$$$ ($$$1 \\le |a_i| \\le 10^9$$$)\u00a0\u2014 array $$$a$$$.<\/p><p>The fourth line of each test case contains the integer $$$q$$$ ($$$1 \\le q \\le 2\\cdot 10^5$$$)\u00a0\u2014 the number of requests.<\/p><p>The next $$$q$$$ lines contain two numbers each $$$x$$$ and $$$y$$$ ($$$1 \\le |x|\\le 2\\cdot 10^9,1\\le |y|\\le 10^{18}$$$)\u00a0\u2014 request.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2\\cdot 10^5$$$. This is also guaranteed for the sum of $$$q$$$ values.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case print a line with $$$q$$$ numbers \u2014 the answers to the queries.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 3 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 1 1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 4 -2 3 3 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 -8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">-1 -2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 12<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 1 0 0 \n6 \n1 1 3 \n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first test case, let's analyze each pair of numbers separately: <\/p><ul> <li> pair $$$(a_1,a_2)$$$: $$$a_1 + a_2 = 4$$$, $$$a_1 \\cdot a_2 = 3$$$ <\/li><li> pair $$$(a_1,a_3)$$$: $$$a_1 + a_3 = 3$$$, $$$a_1 \\cdot a_3 = 2$$$ <\/li><li> pair $$$(a_2,a_3)$$$: $$$a_2 + a_3 = 5$$$, $$$a_2 \\cdot a_3 = 6$$$ <\/li><\/ul> From this, we can see that for the first query, the pair $$$(a_1,a_3)$$$ is suitable, for the second query, it is $$$(a_2,a_3)$$$, and there are no suitable pairs for the third and fourth queries.<p>In the second test case, all combinations of pairs are suitable.<\/p><\/div><\/div>"}, {"contestId": 1623, "index": "C", "name": "Balanced Stone Heaps", "rating": 1600, "solvedCount": 14718, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Balanced Stone Heaps<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are $$$n$$$ heaps of stone. The $$$i$$$-th heap has $$$h_i$$$ stones. You want to change the number of stones in the heap by performing the following process once: <\/p><ul> <li> You go through the heaps from the $$$3$$$-rd heap to the $$$n$$$-th heap, in this order. <\/li><li> Let $$$i$$$ be the number of the current heap. <\/li><li> You can choose a number $$$d$$$ ($$$0 \\le 3 \\cdot d \\le h_i$$$), move $$$d$$$ stones from the $$$i$$$-th heap to the $$$(i - 1)$$$-th heap, and $$$2 \\cdot d$$$ stones from the $$$i$$$-th heap to the $$$(i - 2)$$$-th heap. <\/li><li> So after that $$$h_i$$$ is decreased by $$$3 \\cdot d$$$, $$$h_{i - 1}$$$ is increased by $$$d$$$, and $$$h_{i - 2}$$$ is increased by $$$2 \\cdot d$$$. <\/li><li> You can choose different or same $$$d$$$ for different operations. Some heaps may become empty, but they still count as heaps. <\/li><\/ul><p>What is the maximum number of stones in the smallest heap after the process?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 2\\cdot 10^5$$$). Description of the test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$3 \\le n \\le 2 \\cdot 10^5$$$).<\/p><p>The second lines of each test case contains $$$n$$$ integers $$$h_1, h_2, h_3, \\ldots, h_n$$$ ($$$1 \\le h_i \\le 10^9$$$).<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print the maximum number of stones that the smallest heap can contain.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 10 100<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">100 100 100 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 1 1 1 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 2 3 4 5 6<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n7\n1\n1\n3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the initial heap sizes are $$$[1, 2, 10, 100]$$$. We can move the stones as follows. <\/p><ul> <li> move $$$3$$$ stones and $$$6$$$ from the $$$3$$$-rd heap to the $$$2$$$-nd and $$$1$$$ heap respectively. The heap sizes will be $$$[7, 5, 1, 100]$$$; <\/li><li> move $$$6$$$ stones and $$$12$$$ stones from the last heap to the $$$3$$$-rd and $$$2$$$-nd heap respectively. The heap sizes will be $$$[7, 17, 7, 82]$$$. <\/li><\/ul><p>In the second test case, the last heap is $$$1$$$, and we can not increase its size.<\/p><p>In the third test case, it is better not to move any stones.<\/p><p>In the last test case, the final achievable configuration of the heaps can be $$$[3, 5, 3, 4, 3, 3]$$$.<\/p><\/div><\/div>"}, {"contestId": 1437, "index": "D", "name": "Minimal Height Tree", "rating": 1600, "solvedCount": 14681, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Minimal Height Tree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Monocarp had a tree which consisted of $$$n$$$ vertices and was rooted at vertex $$$1$$$. He decided to study BFS (<a href=\"https://en.wikipedia.org/wiki/Breadth-first_search\">Breadth-first search<\/a>), so he ran BFS on his tree, starting from the root. BFS can be described by the following pseudocode:<\/p><pre class=\"lstlisting\"><code class=\"prettyprint\">a = [] # the order in which vertices were processed<br/>q = Queue()<br/>q.put(1) # place the root at the end of the queue<br/>while not q.empty():<br/>    k = q.pop() # retrieve the first vertex from the queue<br/>    a.append(k) # append k to the end of the sequence in which vertices were visited<br/>    for y in g[k]: # g[k] is the list of all children of vertex k, sorted in ascending order<br/>        q.put(y)<br/><\/code><\/pre><p>Monocarp was fascinated by BFS so much that, in the end, he lost his tree. Fortunately, he still has a sequence of vertices, in which order vertices were visited by the BFS algorithm (the array <span class=\"tex-font-style-tt\">a<\/span> from the pseudocode). Monocarp knows that each vertex was visited exactly once (since they were put and taken from the queue exactly once). Also, he knows that all children of each vertex were viewed <span class=\"tex-font-style-it\">in ascending order<\/span>.<\/p><p>Monocarp knows that there are many trees (in the general case) with the same visiting order $$$a$$$, so he doesn't hope to restore his tree. Monocarp is okay with any tree that <span class=\"tex-font-style-bf\">has minimum height<\/span>.<\/p><p><span class=\"tex-font-style-it\">The height<\/span> of a tree is the maximum depth of the tree's vertices, and the depth of a vertex is the number of edges in the path from the root to it. For example, the depth of vertex $$$1$$$ is $$$0$$$, since it's the root, and the depth of all root's children are $$$1$$$.<\/p><p>Help Monocarp to find any tree with given visiting order $$$a$$$ and minimum height.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 1000$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of vertices in the tree.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le n$$$; $$$a_i \\neq a_j$$$; $$$a_1 = 1$$$)\u00a0\u2014 the order in which the vertices were visited by the BFS algorithm.<\/p><p>It's guaranteed that the total sum of $$$n$$$ over test cases doesn't exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case print the minimum possible height of a tree with the given visiting order $$$a$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n4\n1 4 3 2\n2\n1 2\n3\n1 2 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n1\n1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, there is only one tree with the given visiting order: <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/b293b1123957eaff414c059592d96a53244efdb7.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>In the second test case, there is only one tree with the given visiting order as well: <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/1420fda7c903dfd69b0658e0ba1a69c3a671d88f.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>In the third test case, an optimal tree with the given visiting order is shown below: <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/61b78f3e0f5eeab5bbb10e579c00dd80141fe794.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 1364, "index": "C", "name": "Ehab and Prefix MEXs", "rating": 1600, "solvedCount": 14584, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Ehab and Prefix MEXs<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Given an array $$$a$$$ of length $$$n$$$, find another array, $$$b$$$, of length $$$n$$$ such that:<\/p><ul> <li> for each $$$i$$$ $$$(1 \\le i \\le n)$$$ $$$MEX(\\{b_1$$$, $$$b_2$$$, $$$\\ldots$$$, $$$b_i\\})=a_i$$$. <\/li><\/ul><p>The $$$MEX$$$ of a set of integers is the smallest non-negative integer that doesn't belong to this set.<\/p><p>If such array doesn't exist, determine this.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$n$$$ ($$$1 \\le n \\le 10^5$$$)\u00a0\u2014 the length of the array $$$a$$$.<\/p><p>The second line contains $$$n$$$ integers $$$a_1$$$, $$$a_2$$$, $$$\\ldots$$$, $$$a_n$$$ ($$$0 \\le a_i \\le i$$$)\u00a0\u2014 the elements of the array $$$a$$$. <span class=\"tex-font-style-bf\">It's guaranteed that $$$a_i \\le a_{i+1}$$$ for $$$1\\le i  \\lt  n$$$.<\/span> <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If there's no such array, print a single line containing $$$-1$$$.<\/p><p>Otherwise, print a single line containing $$$n$$$ integers $$$b_1$$$, $$$b_2$$$, $$$\\ldots$$$, $$$b_n$$$ ($$$0 \\le b_i \\le 10^6$$$)<\/p><p>If there are multiple answers, print any.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n1 2 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0 1 2 <\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n0 0 0 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 3 4 0 <\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n1 1 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0 2 1 <\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the second test case, other answers like $$$[1,1,1,0]$$$, for example, are valid.<\/p><\/div><\/div>"}, {"contestId": 1486, "index": "C1", "name": "Guessing the Greatest (easy version)", "rating": 1600, "solvedCount": 14537, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C1. Guessing the Greatest (easy version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">The only difference between the easy and the hard version is the limit to the number of queries<\/span>.<\/p><p><span class=\"tex-font-style-bf\">This is an interactive problem.<\/span><\/p><p>There is an array $$$a$$$ of $$$n$$$ <span class=\"tex-font-style-bf\">different<\/span> numbers. In one query you can ask the position of the second maximum element in a subsegment $$$a[l..r]$$$. Find the position of the maximum element in the array in no more than <span class=\"tex-font-style-bf\">40<\/span> queries.<\/p><p>A subsegment $$$a[l..r]$$$ is all the elements $$$a_l, a_{l + 1}, ..., a_r$$$. After asking this subsegment you will be given the position of the second maximum from this subsegment <span class=\"tex-font-style-bf\">in the whole<\/span> array.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ $$$(2 \\leq n \\leq 10^5)$$$ \u2014 the number of elements in the array.<\/p><\/div><div><div class=\"section-title\">Interaction<\/div><p>You can ask queries by printing \"<span class=\"tex-font-style-tt\">? $$$l$$$ $$$r$$$<\/span>\" $$$(1 \\leq l  \\lt  r \\leq n)$$$. The answer is the index of the second maximum of all elements $$$a_l, a_{l + 1}, \\ldots, a_r$$$. Array $$$a$$$ is fixed beforehand and can't be changed in time of interaction.<\/p><p>You can output the answer by printing \"<span class=\"tex-font-style-tt\">! $$$p$$$<\/span>\", where <span class=\"tex-font-style-tt\">$$$p$$$<\/span> is the index of the maximum element in the array.<\/p><p>You can ask no more than <span class=\"tex-font-style-bf\">40<\/span> queries. <span class=\"tex-font-style-bf\">Printing the answer doesn't count as a query<\/span>.<\/p><p>After printing a query do not forget to output end of line and flush the output. Otherwise, you will get <span class=\"tex-font-style-tt\">Idleness limit exceeded<\/span>. To do this, use:<\/p><ul> <li> <span class=\"tex-font-style-tt\">fflush(stdout)<\/span> or <span class=\"tex-font-style-tt\">cout.flush()<\/span> in C++; <\/li><li> <span class=\"tex-font-style-tt\">System.out.flush()<\/span> in Java; <\/li><li> <span class=\"tex-font-style-tt\">flush(output)<\/span> in Pascal; <\/li><li> <span class=\"tex-font-style-tt\">stdout.flush()<\/span> in Python; <\/li><li> see documentation for other languages <\/li><\/ul><p><span class=\"tex-font-style-bf\"><span class=\"tex-font-style-section\">Hacks<\/span><\/span><\/p><p>To make a hack, use the following test format.<\/p><p>In the first line output a single integer $$$n$$$ $$$(2 \\leq n \\leq 10^5)$$$. In the second line output a permutation of $$$n$$$ integers $$$1$$$ to $$$n$$$. The position of $$$n$$$ in the permutation is the position of the maximum<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n\n3\n\n4\n\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n? 1 5\n\n? 4 5\n\n! 1<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the sample suppose $$$a$$$ is $$$[5, 1, 4, 2, 3]$$$. So after asking the $$$[1..5]$$$ subsegment $$$4$$$ is second to max value, and it's position is $$$3$$$. After asking the $$$[4..5]$$$ subsegment $$$2$$$ is second to max value and it's position in the whole array is $$$4$$$.<\/p><p>Note that there are other arrays $$$a$$$ that would produce the same interaction, and the answer for them might be different. Example output is given in purpose of understanding the interaction.<\/p><\/div><\/div>"}, {"contestId": 601, "index": "A", "name": "The Two Routes", "rating": 1600, "solvedCount": 14310, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. The Two Routes<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>In Absurdistan, there are <span class=\"tex-span\"><i>n<\/i><\/span> towns (numbered <span class=\"tex-span\">1<\/span> through <span class=\"tex-span\"><i>n<\/i><\/span>) and <span class=\"tex-span\"><i>m<\/i><\/span> bidirectional railways. There is also an absurdly simple road network\u00a0\u2014 for each pair of different towns <span class=\"tex-span\"><i>x<\/i><\/span> and <span class=\"tex-span\"><i>y<\/i><\/span>, there is a bidirectional road between towns <span class=\"tex-span\"><i>x<\/i><\/span> and <span class=\"tex-span\"><i>y<\/i><\/span> <span class=\"tex-font-style-bf\">if and only if<\/span> there is no railway between them. Travelling to a different town using one railway or one road always takes exactly one hour.<\/p><p>A train and a bus leave town <span class=\"tex-span\">1<\/span> at the same time. They both have the same destination, town <span class=\"tex-span\"><i>n<\/i><\/span>, and don't make any stops on the way (but they can wait in town <span class=\"tex-span\"><i>n<\/i><\/span>). The train can move only along railways and the bus can move only along roads.<\/p><p>You've been asked to plan out routes for the vehicles; each route can use any road/railway multiple times. One of the most important aspects to consider is safety\u00a0\u2014 in order to avoid accidents at railway crossings, the train and the bus must not arrive at the same town (except town <span class=\"tex-span\"><i>n<\/i><\/span>) simultaneously.<\/p><p>Under these constraints, what is the minimum number of hours needed for both vehicles to reach town <span class=\"tex-span\"><i>n<\/i><\/span> (the maximum of arrival times of the bus and the train)? Note, that bus and train are not required to arrive to the town <span class=\"tex-span\"><i>n<\/i><\/span> at the same moment of time, but are allowed to do so.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009400<\/span>, <span class=\"tex-span\">0\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u2009<i>n<\/i>(<i>n<\/i>\u2009-\u20091)\u2009/\u20092<\/span>)\u00a0\u2014 the number of towns and the number of railways respectively.<\/p><p>Each of the next <span class=\"tex-span\"><i>m<\/i><\/span> lines contains two integers <span class=\"tex-span\"><i>u<\/i><\/span> and <span class=\"tex-span\"><i>v<\/i><\/span>, denoting a railway between towns <span class=\"tex-span\"><i>u<\/i><\/span> and <span class=\"tex-span\"><i>v<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>u<\/i>,\u2009<i>v<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\"><i>u<\/i>\u2009\u2260\u2009<i>v<\/i><\/span>).<\/p><p>You may assume that there is at most one railway connecting any two towns.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output one integer\u00a0\u2014 the smallest possible time of the later vehicle's arrival in town <span class=\"tex-span\"><i>n<\/i><\/span>. If it's impossible for at least one of the vehicles to reach town <span class=\"tex-span\"><i>n<\/i><\/span>, output <span class=\"tex-span\">\u2009-\u20091<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 2<br/>1 3<br/>3 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 6<br/>1 2<br/>1 3<br/>1 4<br/>2 3<br/>2 4<br/>3 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>-1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 5<br/>4 2<br/>3 5<br/>4 5<br/>5 1<br/>1 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample, the train can take the route <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/7c0aa60a06309ef607b7159fd7f3687ea0d943ce.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> and the bus can take the route <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/a26c2f3e93c9d9be6c21cb5d2bd6ac1f99f4ff55.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>. Note that they can arrive at town <span class=\"tex-span\">4<\/span> at the same time.<\/p><p>In the second sample, Absurdistan is ruled by railwaymen. There are no roads, so there's no way for the bus to reach town <span class=\"tex-span\">4<\/span>.<\/p><\/div><\/div>"}, {"contestId": 1946, "index": "C", "name": "Tree Cutting", "rating": 1600, "solvedCount": 14286, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Tree Cutting<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a tree with $$$n$$$ vertices.<\/p><p>Your task is to find the maximum number $$$x$$$ such that it is possible to remove exactly $$$k$$$ edges from this tree in such a way that the size of each remaining connected component$$$^{\\dagger}$$$ is at least $$$x$$$.<\/p><p>$$$^{\\dagger}$$$ Two vertices $$$v$$$ and $$$u$$$ are in the same connected component if there exists a sequence of numbers $$$t_1, t_2, \\ldots, t_k$$$ of arbitrary length $$$k$$$, such that $$$t_1 = v$$$, $$$t_k = u$$$, and for each $$$i$$$ from $$$1$$$ to $$$k - 1$$$, vertices $$$t_i$$$ and $$$t_{i+1}$$$ are connected by an edge.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test consists of several sets of input data. The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of sets of input data. This is followed by a description of the sets of input data.<\/p><p>The first line of each set of input data contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le k  \\lt  n \\le 10^5$$$)\u00a0\u2014 the number of vertices in the tree and the number of edges to be removed.<\/p><p>Each of the next $$$n - 1$$$ lines of each set of input data contains two integers $$$v$$$ and $$$u$$$ ($$$1 \\le v, u \\le n$$$)\u00a0\u2014 the next edge of the tree.<\/p><p>It is guaranteed that the sum of the values of $$$n$$$ for all sets of input data does not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each set of input data, output a single line containing the maximum number $$$x$$$ such that it is possible to remove exactly $$$k$$$ edges from the tree in such a way that the size of each remaining connected component is at least $$$x$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">8 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">6 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">1 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">5 6<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n1\n3\n1\n1\n2\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The tree in the first set of input data:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/0d867aa6ca1261344a53fb61ed151f444bcb0a9f.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>After removing the edge $$$1$$$\u00a0\u2014 $$$3$$$, the tree will look as follows:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/aa63ee921b47137c69a9c33f9d84cccf85a386e5.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>The tree has split into two connected components. The first component consists of two vertices: $$$1$$$ and $$$2$$$. The second connected component consists of three vertices: $$$3, 4$$$ and $$$5$$$. In both connected components, there are at least two vertices. It can be shown that the answer $$$3$$$ is not achievable, so the answer is $$$2$$$.<\/p><\/div><\/div>"}, {"contestId": 1632, "index": "C", "name": "Strange Test", "rating": 1600, "solvedCount": 14277, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Strange Test<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Igor is in 11th grade. Tomorrow he will have to write an informatics test by the strictest teacher in the school, Pavel Denisovich. <\/p><p>Igor knows how the test will be conducted: first of all, the teacher will give each student two positive integers $$$a$$$ and $$$b$$$ ($$$a  \\lt  b$$$). After that, the student can apply any of the following operations any number of times: <\/p><ul> <li> $$$a := a + 1$$$ (increase $$$a$$$ by $$$1$$$), <\/li><li> $$$b := b + 1$$$ (increase $$$b$$$ by $$$1$$$), <\/li><li> $$$a := a \\ | \\ b$$$ (replace $$$a$$$ with the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#OR\">bitwise OR<\/a> of $$$a$$$ and $$$b$$$). <\/li><\/ul><p>To get full marks on the test, the student has to tell the teacher the minimum required number of operations to make $$$a$$$ and $$$b$$$ equal.<\/p><p>Igor already knows which numbers the teacher will give him. Help him figure out what is the minimum number of operations needed to make $$$a$$$ equal to $$$b$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). Description of the test cases follows.<\/p><p>The only line for each test case contains two integers $$$a$$$ and $$$b$$$ ($$$1 \\le a  \\lt  b \\le 10^6$$$).<\/p><p><span class=\"tex-font-style-bf\">It is guaranteed that the sum of $$$b$$$ over all test cases does not exceed $$$10^6$$$.<\/span><\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case print one integer \u2014 the minimum required number of operations to make $$$a$$$ and $$$b$$$ equal.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n1 3\n5 8\n2 5\n3 19\n56678 164422\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n3\n2\n1\n23329\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, it is optimal to apply the third operation.<\/p><p>In the second test case, it is optimal to apply the first operation three times.<\/p><p>In the third test case, it is optimal to apply the second operation and then the third operation.<\/p><\/div><\/div>"}, {"contestId": 1327, "index": "C", "name": "Game with Chips", "rating": 1600, "solvedCount": 14166, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Game with Chips<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Petya has a rectangular Board of size $$$n \\times m$$$. Initially, $$$k$$$ chips are placed on the board, $$$i$$$-th chip is located in the cell at the intersection of $$$sx_i$$$-th row and $$$sy_i$$$-th column.<\/p><p>In one action, Petya can move <span class=\"tex-font-style-bf\">all the chips<\/span> to the left, right, down or up by $$$1$$$ cell.<\/p><p>If the chip was in the $$$(x, y)$$$ cell, then after the operation: <\/p><ul> <li> left, its coordinates will be $$$(x, y - 1)$$$; <\/li><li> right, its coordinates will be $$$(x, y + 1)$$$; <\/li><li> down, its coordinates will be $$$(x + 1, y)$$$; <\/li><li> up, its coordinates will be $$$(x - 1, y)$$$. <\/li><\/ul><p>If the chip is located by the wall of the board, and the action chosen by Petya moves it towards the wall, then the chip remains in its current position.<\/p><p><span class=\"tex-font-style-bf\">Note that several chips can be located in the same cell.<\/span><\/p><p>For each chip, Petya chose the position which it should visit. Note that it's not necessary for a chip to end up in this position.<\/p><p>Since Petya does not have a lot of free time, he is ready to do no more than $$$2nm$$$ actions.<\/p><p>You have to find out what actions Petya should do so that each chip visits the position that Petya selected for it at least once. Or determine that it is not possible to do this in $$$2nm$$$ actions.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains three integers $$$n, m, k$$$ ($$$1 \\le n, m, k \\le 200$$$) \u2014 the number of rows and columns of the board and the number of chips, respectively.<\/p><p>The next $$$k$$$ lines contains two integers each $$$sx_i, sy_i$$$ ($$$ 1 \\le sx_i \\le n, 1 \\le sy_i \\le m$$$) \u2014 the starting position of the $$$i$$$-th chip.<\/p><p>The next $$$k$$$ lines contains two integers each $$$fx_i, fy_i$$$ ($$$ 1 \\le fx_i \\le n, 1 \\le fy_i \\le m$$$) \u2014 the position that the $$$i$$$-chip should visit at least once.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In the first line print the number of operations so that each chip visits the position that Petya selected for it at least once.<\/p><p>In the second line output the sequence of operations. To indicate operations left, right, down, and up, use the characters $$$L, R, D, U$$$ respectively.<\/p><p>If the required sequence does not exist, print <span class=\"tex-font-style-tt\">-1<\/span> in the single line.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 3 2\n1 2\n2 1\n3 3\n3 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\nDRD<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 4 3\n3 4\n3 1\n3 3\n5 3\n1 3\n1 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n9\nDDLUUUURR<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 2085, "index": "C", "name": "Serval and The Formula", "rating": 1600, "solvedCount": 14153, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Serval and The Formula<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p> <\/p><p>You are given two positive integers $$$x$$$ and $$$y$$$ ($$$1\\le x, y\\le 10^9$$$).<\/p><p>Find a <span class=\"tex-font-style-bf\">non-negative<\/span> integer $$$k\\le 10^{18}$$$, such that $$$(x+k) + (y+k) = (x+k)\\oplus (y+k)$$$ holds$$$^{\\text{\u2217}}$$$, or determine that such an integer does not exist.<\/p><div class=\"statement-footnote\"><p>$$$^{\\text{\u2217}}$$$$$$\\oplus$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#XOR\">bitwise XOR operation<\/a>. <\/p><\/div><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows. <\/p><p>The only line of each test case contains two integers $$$x$$$ and $$$y$$$ ($$$1\\le x, y\\le 10^9$$$) \u2014 the given integers.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer $$$k$$$ ($$$0\\le k\\le 10^{18}$$$) \u2014 the integer you found. Print $$$-1$$$ if it is impossible to find such an integer.<\/p><p>If there are multiple answers, you may print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">6 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">19 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1024 4096<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1198372 599188<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n-1\n1\n1024\n28\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, since $$$(2 + 0) + (5 + 0) = (2 + 0) \\oplus (5 + 0) = 7$$$, $$$k=0$$$ is a possible answer. Note that $$$k=4$$$ is also a possible answer because $$$(2 + 4) + (5 + 4) = (2 + 4) \\oplus (5 + 4) = 15$$$.<\/p><p>In the second test case, $$$(x+k)\\oplus (y+k) = (6+k)\\oplus (6+k) = 0$$$. However, $$$(x+k)+(y+k)  \\gt  0$$$ holds for every $$$k \\ge 0$$$, implying that such an integer $$$k$$$ does not exist.<\/p><\/div><\/div>"}, {"contestId": 165, "index": "C", "name": "Another Problem on Strings", "rating": 1600, "solvedCount": 14131, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Another Problem on Strings<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>A string is <span class=\"tex-font-style-underline\">binary<\/span>, if it consists only of characters \"<span class=\"tex-font-style-tt\">0<\/span>\" and \"<span class=\"tex-font-style-tt\">1<\/span>\".<\/p><p>String <span class=\"tex-span\"><i>v<\/i><\/span> is a <span class=\"tex-font-style-it\">substring<\/span> of string <span class=\"tex-span\"><i>w<\/i><\/span> if it has a non-zero length and can be read starting from some position in string <span class=\"tex-span\"><i>w<\/i><\/span>. For example, string \"<span class=\"tex-font-style-tt\">010<\/span>\" has six substrings: \"<span class=\"tex-font-style-tt\">0<\/span>\", \"<span class=\"tex-font-style-tt\">1<\/span>\", \"<span class=\"tex-font-style-tt\">0<\/span>\", \"<span class=\"tex-font-style-tt\">01<\/span>\", \"<span class=\"tex-font-style-tt\">10<\/span>\", \"<span class=\"tex-font-style-tt\">010<\/span>\". Two substrings are considered different if their positions of occurrence are different. So, if some string occurs multiple times, we should consider it the number of times it occurs.<\/p><p>You are given a binary string <span class=\"tex-span\"><i>s<\/i><\/span>. Your task is to find the number of its substrings, containing exactly <span class=\"tex-span\"><i>k<\/i><\/span> characters \"<span class=\"tex-font-style-tt\">1<\/span>\".<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains the single integer <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup><\/span>). The second line contains a non-empty binary string <span class=\"tex-span\"><i>s<\/i><\/span>. The length of <span class=\"tex-span\"><i>s<\/i><\/span> does not exceed <span class=\"tex-span\">10<sup class=\"upper-index\">6<\/sup><\/span> characters.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the single number \u2014 the number of substrings of the given string, containing exactly <span class=\"tex-span\"><i>k<\/i><\/span> characters \"<span class=\"tex-font-style-tt\">1<\/span>\".<\/p><p>Please do not use the <span class=\"tex-font-style-tt\">%lld<\/span> specifier to read or write 64-bit integers in \u0421++. It is preferred to use the <span class=\"tex-font-style-tt\">cin<\/span>, <span class=\"tex-font-style-tt\">cout<\/span> streams or the <span class=\"tex-font-style-tt\">%I64d<\/span> specifier.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>1<br/>1010<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/>01010<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>100<br/>01010<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample the sought substrings are: \"<span class=\"tex-font-style-tt\">1<\/span>\", \"<span class=\"tex-font-style-tt\">1<\/span>\", \"<span class=\"tex-font-style-tt\">10<\/span>\", \"<span class=\"tex-font-style-tt\">01<\/span>\", \"<span class=\"tex-font-style-tt\">10<\/span>\", \"<span class=\"tex-font-style-tt\">010<\/span>\".<\/p><p>In the second sample the sought substrings are: \"<span class=\"tex-font-style-tt\">101<\/span>\", \"<span class=\"tex-font-style-tt\">0101<\/span>\", \"<span class=\"tex-font-style-tt\">1010<\/span>\", \"<span class=\"tex-font-style-tt\">01010<\/span>\".<\/p><\/div><\/div>"}, {"contestId": 1689, "index": "C", "name": "Infected Tree", "rating": 1600, "solvedCount": 14107, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Infected Tree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span

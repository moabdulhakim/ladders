-line test-example-line-odd test-example-line-9\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-9\">6 3 2 5 4 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-10\">6<\/div><div class=\"test-example-line test-example-line-even test-example-line-10\">5 1 4 3 4 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 3\n2 2\n1 3\n1 1\n1 2\n1 1\n1 1\n2 2\n1 2\n1 1\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1497, "index": "C2", "name": "k-LCM (hard version)", "rating": 1600, "solvedCount": 19891, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C2. k-LCM (hard version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">It is the hard version of the problem. The only difference is that in this version $$$3 \\le k \\le n$$$.<\/span><\/p><p>You are given a positive integer $$$n$$$. Find $$$k$$$ positive integers $$$a_1, a_2, \\ldots, a_k$$$, such that:<\/p><ul> <li> $$$a_1 + a_2 + \\ldots + a_k = n$$$ <\/li><li> $$$LCM(a_1, a_2, \\ldots, a_k) \\le \\frac{n}{2}$$$ <\/li><\/ul><p>Here $$$LCM$$$ is the <a href=\"https://en.wikipedia.org/wiki/Least_common_multiple\">least common multiple<\/a> of numbers $$$a_1, a_2, \\ldots, a_k$$$.<\/p><p>We can show that for given constraints the answer always exists.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ $$$(1 \\le t \\le 10^4)$$$ \u00a0\u2014 the number of test cases.<\/p><p>The only line of each test case contains two integers $$$n$$$, $$$k$$$ ($$$3 \\le n \\le 10^9$$$, $$$3 \\le k \\le n$$$).<\/p><p>It is guaranteed that the sum of $$$k$$$ over all test cases does not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case print $$$k$$$ positive integers $$$a_1, a_2, \\ldots, a_k$$$, for which all conditions are satisfied.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n6 4\n9 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 2 2 1 \n1 3 3 1 1 \n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1234, "index": "D", "name": "Distinct Characters Queries", "rating": 1600, "solvedCount": 19654, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Distinct Characters Queries<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a string $$$s$$$ consisting of lowercase Latin letters and $$$q$$$ queries for this string.<\/p><p>Recall that the substring $$$s[l; r]$$$ of the string $$$s$$$ is the string $$$s_l s_{l + 1} \\dots s_r$$$. For example, the substrings of \"<span class=\"tex-font-style-tt\">codeforces<\/span>\" are \"<span class=\"tex-font-style-tt\">code<\/span>\", \"<span class=\"tex-font-style-tt\">force<\/span>\", \"<span class=\"tex-font-style-tt\">f<\/span>\", \"<span class=\"tex-font-style-tt\">for<\/span>\", but not \"<span class=\"tex-font-style-tt\">coder<\/span>\" and \"<span class=\"tex-font-style-tt\">top<\/span>\".<\/p><p>There are two types of queries: <\/p><ul> <li> $$$1~ pos~ c$$$ ($$$1 \\le pos \\le |s|$$$, $$$c$$$ is lowercase Latin letter): replace $$$s_{pos}$$$ with $$$c$$$ (set $$$s_{pos} := c$$$); <\/li><li> $$$2~ l~ r$$$ ($$$1 \\le l \\le r \\le |s|$$$): calculate the number of distinct characters in the substring $$$s[l; r]$$$. <\/li><\/ul><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains one string $$$s$$$ consisting of no more than $$$10^5$$$ lowercase Latin letters.<\/p><p>The second line of the input contains one integer $$$q$$$ ($$$1 \\le q \\le 10^5$$$) \u2014 the number of queries.<\/p><p>The next $$$q$$$ lines contain queries, one per line. Each query is given in the format described in the problem statement. It is guaranteed that there is at least one query of the second type.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query of the second type print the answer for it \u2014 the number of distinct characters in the required substring in this query.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\nabacaba\n5\n2 1 4\n1 4 b\n1 5 b\n2 4 6\n2 1 7\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n1\n2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\ndfcbbcfeeedbaea\n15\n1 6 e\n1 4 b\n2 6 14\n1 7 b\n1 12 c\n2 6 8\n2 1 6\n1 7 c\n1 2 f\n1 10 a\n2 7 9\n1 10 a\n1 14 b\n1 1 f\n2 1 11\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5\n2\n5\n2\n6\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1856, "index": "C", "name": "To Become Max", "rating": 1600, "solvedCount": 19616, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. To Become Max<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array of integers $$$a$$$ of length $$$n$$$.<\/p><p>In one operation you: <\/p><ul> <li> Choose an index $$$i$$$ such that $$$1 \\le i \\le n - 1$$$ and $$$a_i \\le a_{i + 1}$$$. <\/li><li> Increase $$$a_i$$$ by $$$1$$$. <\/li><\/ul><p>Find the maximum possible value of $$$\\max(a_1, a_2, \\ldots a_n)$$$ that you can get after performing this operation at most $$$k$$$ times.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line of input contains a single integer $$$t$$$ ($$$1 \\le t \\le 100$$$)\u00a0\u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$k$$$ ($$$2 \\le n \\le 1000$$$, $$$1 \\le k \\le 10^{8}$$$)\u00a0\u2014 the length of the array $$$a$$$ and the maximum number of operations that can be performed.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1,a_2,\\ldots,a_n$$$ ($$$1 \\le a_i \\le 10^{8}$$$)\u00a0\u2014 the elements of the array $$$a$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$1000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case output a single integer\u00a0\u2014 the maximum possible maximum of the array after performing at most $$$k$$$ operations.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 3 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 3 4 5 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 13<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 1 3 179<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 3 2 2 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">6 5 4 1 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">2 17<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">3 5<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n7\n179\n5\n7\n6\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, one possible optimal sequence of operations is: $$$[\\color{red}{1}, 3, 3] \\rightarrow [2, \\color{red}{3}, 3] \\rightarrow [\\color{red}{2}, 4, 3] \\rightarrow [\\color{red}{3}, 4, 3] \\rightarrow [4, 4, 3]$$$.<\/p><p>In the second test case, one possible optimal sequence of operations is: $$$[1, \\color{red}{3}, 4, 5, 1] \\rightarrow [1, \\color{red}{4}, 4, 5, 1] \\rightarrow [1, 5, \\color{red}{4}, 5, 1] \\rightarrow [1, 5, \\color{red}{5}, 5, 1] \\rightarrow [1, \\color{red}{5}, 6, 5, 1] \\rightarrow [1, \\color{red}{6}, 6, 5, 1] \\rightarrow [1, 7, 6, 5, 1]$$$.<\/p><\/div><\/div>"}, {"contestId": 1843, "index": "E", "name": "Tracking Segments", "rating": 1600, "solvedCount": 19221, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Tracking Segments<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ consisting of $$$n$$$ zeros. You are also given a set of $$$m$$$ not necessarily different segments. Each segment is defined by two numbers $$$l_i$$$ and $$$r_i$$$ ($$$1 \\le l_i \\le r_i \\le n$$$) and represents a subarray $$$a_{l_i}, a_{l_i+1}, \\dots, a_{r_i}$$$ of the array $$$a$$$.<\/p><p>Let's call the segment $$$l_i, r_i$$$ <span class=\"tex-font-style-it\">beautiful<\/span> if the number of ones on this segment <span class=\"tex-font-style-bf\">is strictly greater<\/span> than the number of zeros. For example, if $$$a = [1, 0, 1, 0, 1]$$$, then the segment $$$[1, 5]$$$ is <span class=\"tex-font-style-it\">beautiful<\/span> (the number of ones is $$$3$$$, the number of zeros is $$$2$$$), but the segment $$$[3, 4]$$$ is not is <span class=\"tex-font-style-it\">beautiful<\/span> (the number of ones is $$$1$$$, the number of zeros is $$$1$$$).<\/p><p>You also have $$$q$$$ changes. For each change you are given the number $$$1 \\le x \\le n$$$, which means that you must assign an element $$$a_x$$$ the value $$$1$$$.<\/p><p>You have to find the first change after which <span class=\"tex-font-style-bf\">at least one<\/span> of $$$m$$$ given segments becomes <span class=\"tex-font-style-it\">beautiful<\/span>, or report that none of them is beautiful after processing all $$$q$$$ changes.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\le m \\le n \\le 10^5$$$)\u00a0\u2014 the size of the array $$$a$$$ and the number of segments, respectively.<\/p><p>Then there are $$$m$$$ lines consisting of two numbers $$$l_i$$$ and $$$r_i$$$ ($$$1 \\le l_i \\le r_i \\le n$$$)\u00a0\u2014the boundaries of the segments.<\/p><p>The next line contains an integer $$$q$$$ ($$$1 \\le q \\le n$$$)\u00a0\u2014 the number of changes.<\/p><p>The following $$$q$$$ lines each contain a single integer $$$x$$$ ($$$1 \\le x \\le n$$$)\u00a0\u2014 the index of the array element that needs to be set to $$$1$$$. It is guaranteed that indexes in queries are distinct.<\/p><p>It is guaranteed that the sum of $$$n$$$ for all test cases does not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output one integer \u00a0\u2014 the minimum change number after which at least one of the segments will be beautiful, or $$$-1$$$ if none of the segments will be beautiful.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n-1\n3\n3\n3\n1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first case, after first 2 changes we won't have any beautiful segments, but after the third one on a segment $$$[1; 5]$$$ there will be 3 ones and only 2 zeros, so the answer is 3.<\/p><p>In the second case, there won't be any beautiful segments.<\/p><\/div><\/div>"}, {"contestId": 1702, "index": "E", "name": "Split Into Two Sets", "rating": 1600, "solvedCount": 19139, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Split Into Two Sets<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Polycarp was recently given a set of $$$n$$$ (number $$$n$$$\u00a0\u2014 even) dominoes. Each domino contains two integers from $$$1$$$ to $$$n$$$.<\/p><p>Can he divide all the dominoes into two sets so that all the numbers on the dominoes of each set are different? Each domino must go into exactly one of the two sets.<\/p><p>For example, if he has $$$4$$$ dominoes: $$$\\{1, 4\\}$$$, $$$\\{1, 3\\}$$$, $$$\\{3, 2\\}$$$ and $$$\\{4, 2\\}$$$, then Polycarp will be able to divide them into two sets in the required way. The first set can include the first and third dominoes ($$$\\{1, 4\\}$$$ and $$$\\{3, 2\\}$$$), and the second set\u00a0\u2014 the second and fourth ones ($$$\\{1, 3\\}$$$ and $$$\\{4, 2\\}$$$).<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The descriptions of the test cases follow.<\/p><p>The first line of each test case contains a single even integer $$$n$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$) \u2014 the number of dominoes.<\/p><p>The next $$$n$$$ lines contain pairs of numbers $$$a_i$$$ and $$$b_i$$$ ($$$1 \\le a_i, b_i \\le n$$$) describing the numbers on the $$$i$$$-th domino.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case print:<\/p><ul> <li> <span class=\"tex-font-style-tt\">YES<\/span>, if it is possible to divide $$$n$$$ dominoes into two sets so that the numbers on the dominoes of each set are different; <\/li><li> <span class=\"tex-font-style-tt\">NO<\/span> if this is not possible. <\/li><\/ul><p>You can print <span class=\"tex-font-style-tt\">YES<\/span> and <span class=\"tex-font-style-tt\">NO<\/span> in any case (for example, the strings <span class=\"tex-font-style-tt\">yEs<\/span>, <span class=\"tex-font-style-tt\">yes<\/span>, <span class=\"tex-font-style-tt\">Yes<\/span> and <span class=\"tex-font-style-tt\">YES<\/span> will be recognized as a positive answer).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">8 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">7 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">8<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">4 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">5 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">5 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">6 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">8 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">7 8<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nNO\nNO\nYES\nYES\nNO\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the dominoes can be divided as follows: <\/p><ul> <li> First set of dominoes: $$$[\\{1, 2\\}, \\{4, 3\\}]$$$ <\/li><li> Second set of dominoes: $$$[\\{2, 1\\}, \\{3, 4\\}]$$$ <\/li><\/ul> In other words, in the first set we take dominoes with numbers $$$1$$$ and $$$2$$$, and in the second set we take dominoes with numbers $$$3$$$ and $$$4$$$.<p>In the second test case, there's no way to divide dominoes into $$$2$$$ sets, at least one of them will contain repeated number.<\/p><\/div><\/div>"}, {"contestId": 1741, "index": "E", "name": "Sending a Sequence Over the Network", "rating": 1600, "solvedCount": 19049, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Sending a Sequence Over the Network<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>The sequence $$$a$$$ is sent over the network as follows:<\/p><ol> <li> sequence $$$a$$$ is split into segments (each element of the sequence belongs to exactly one segment, each segment is a group of consecutive elements of sequence); <\/li><li> for each segment, its length is written next to it, either to the left of it or to the right of it; <\/li><li> the resulting sequence $$$b$$$ is sent over the network. <\/li><\/ol><p>For example, we needed to send the sequence $$$a = [1, 2, 3, 1, 2, 3]$$$. Suppose it was split into segments as follows: $$$[\\color{red}{1}] + [\\color{blue}{2, 3, 1}] + [\\color{green}{2, 3}]$$$. Then we could have the following sequences: <\/p><ul> <li> $$$b = [1, \\color{red}{1}, 3, \\color{blue}{2, 3, 1}, \\color{green}{2, 3}, 2]$$$, <\/li><li> $$$b = [\\color{red}{1}, 1, 3, \\color{blue}{2, 3, 1}, 2, \\color{green}{2, 3}]$$$, <\/li><li> $$$b = [\\color{red}{1}, 1, \\color{blue}{2, 3, 1}, 3, 2, \\color{green}{2, 3}]$$$, <\/li><li> $$$b = [\\color{red}{1}, 1,\\color{blue}{2, 3, 1}, 3, \\color{green}{2, 3}, 2]$$$. <\/li><\/ul><p>If a different segmentation had been used, the sent sequence might have been different.<\/p><p>The sequence $$$b$$$ is given. Could the sequence $$$b$$$ be sent over the network? In other words, is there such a sequence $$$a$$$ that converting $$$a$$$ to send it over the network could result in a sequence $$$b$$$?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input data contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>Each test case consists of two lines.<\/p><p>The first line of the test case contains an integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the size of the sequence $$$b$$$.<\/p><p>The second line of test case contains $$$n$$$ integers $$$b_1, b_2, \\dots, b_n$$$ ($$$1 \\le b_i \\le 10^9$$$)\u00a0\u2014 the sequence $$$b$$$ itself.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case print on a separate line:<\/p><ul> <li> <span class=\"tex-font-style-tt\">YES<\/span> if sequence $$$b$$$ could be sent over the network, that is, if sequence $$$b$$$ could be obtained from some sequence $$$a$$$ to send $$$a$$$ over the network. <\/li><li> <span class=\"tex-font-style-tt\">NO<\/span> otherwise. <\/li><\/ul><p>You can output <span class=\"tex-font-style-tt\">YES<\/span> and <span class=\"tex-font-style-tt\">NO<\/span> in any case (for example, strings <span class=\"tex-font-style-tt\">yEs<\/span>, <span class=\"tex-font-style-tt\">yes<\/span>, <span class=\"tex-font-style-tt\">Yes<\/span> and <span class=\"tex-font-style-tt\">YES<\/span> will be recognized as positive response).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1 2 3 1 3 2 2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">12 1 2 7 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 7 8 9 10 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 8 6 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">10<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">4 6 2 1 9 4 9 3 4 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nYES\nYES\nNO\nYES\nYES\nNO\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first case, the sequence $$$b$$$ could be obtained from the sequence $$$a = [1, 2, 3, 1, 2, 3]$$$ with the following partition: $$$[\\color{red}{1}] + [\\color{blue}{2, 3, 1}] + [\\color{green}{2, 3}]$$$. The sequence $$$b$$$: $$$[\\color{red}{1}, 1, \\color{blue}{2, 3, 1}, 3, 2, \\color{green}{2, 3}]$$$.<\/p><p>In the second case, the sequence $$$b$$$ could be obtained from the sequence $$$a = [12, 7, 5]$$$ with the following partition: $$$[\\color{red}{12}] + [\\color{green}{7, 5}]$$$. The sequence $$$b$$$: $$$[\\color{red}{12}, 1, 2, \\color{green}{7, 5}]$$$.<\/p><p>In the third case, the sequence $$$b$$$ could be obtained from the sequence $$$a = [7, 8, 9, 10, 3]$$$ with the following partition: $$$[\\color{red}{7, 8, 9, 10, 3}]$$$. The sequence $$$b$$$: $$$[5, \\color{red}{7, 8, 9, 10, 3}]$$$.<\/p><p>In the fourth case, there is no sequence $$$a$$$ such that changing $$$a$$$ for transmission over the network could produce a sequence $$$b$$$.<\/p><\/div><\/div>"}, {"contestId": 1514, "index": "C", "name": "Product 1 Modulo N", "rating": 1600, "solvedCount": 19040, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Product 1 Modulo N<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Now you get Baby Ehab's first words: \"Given an integer $$$n$$$, find the longest subsequence of $$$[1,2, \\ldots, n-1]$$$ whose product is $$$1$$$ modulo $$$n$$$.\" Please solve the problem.<\/p><p>A sequence $$$b$$$ is a subsequence of an array $$$a$$$ if $$$b$$$ can be obtained from $$$a$$$ by deleting some (possibly all) elements. The product of an empty subsequence is equal to $$$1$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line contains the integer $$$n$$$ ($$$2 \\le n \\le 10^5$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>The first line should contain a single integer, the length of the longest subsequence.<\/p><p>The second line should contain the elements of the subsequence, <span class=\"tex-font-style-bf\">in increasing order<\/span>.<\/p><p>If there are multiple solutions, you can print any.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n1 2 3 <\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n1 3 5 7 <\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, the product of the elements is $$$6$$$ which is congruent to $$$1$$$ modulo $$$5$$$. The only longer subsequence is $$$[1,2,3,4]$$$. Its product is $$$24$$$ which is congruent to $$$4$$$ modulo $$$5$$$. Hence, the answer is $$$[1,2,3]$$$.<\/p><\/div><\/div>"}, {"contestId": 343, "index": "B", "name": "Alternating Current", "rating": 1600, "solvedCount": 18950, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Alternating Current<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Mad scientist Mike has just finished constructing a new device to search for extraterrestrial intelligence! He was in such a hurry to launch it for the first time that he plugged in the power wires without giving it a proper glance and started experimenting right away. After a while Mike observed that the wires ended up entangled and now have to be untangled again.<\/p><p>The device is powered by two wires \"plus\" and \"minus\". The wires run along the floor from the wall (on the left) to the device (on the right). Both the wall and the device have two contacts in them on the same level, into which the wires are plugged in some order. The wires are considered entangled if there are one or more places where one wire runs above the other one. For example, the picture below has four such places (top view):<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/1309816e52de0c0bf3660cd3ab3757d3db8267fb.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>Mike knows the sequence in which the wires run above each other. Mike also noticed that on the left side, the \"plus\" wire is always plugged into the top contact (as seen on the picture). He would like to untangle the wires without unplugging them and <span class=\"tex-font-style-bf\">without moving<\/span> the device. Determine if it is possible to do that. A wire can be freely moved and stretched on the floor, but cannot be cut.<\/p><p>To understand the problem better please read the notes to the test samples.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The single line of the input contains a sequence of characters \"<span class=\"tex-font-style-tt\">+<\/span>\" and \"<span class=\"tex-font-style-tt\">-<\/span>\" of length <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009100000<\/span>). The <span class=\"tex-span\"><i>i<\/i><\/span>-th (<span class=\"tex-span\">1\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>) position of the sequence contains the character \"<span class=\"tex-font-style-tt\">+<\/span>\", if on the <span class=\"tex-span\"><i>i<\/i><\/span>-th step from the wall the \"plus\" wire runs above the \"minus\" wire, and the character \"<span class=\"tex-font-style-tt\">-<\/span>\" otherwise.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print either \"<span class=\"tex-font-style-tt\">Yes<\/span>\" (without the quotes) if the wires can be untangled or \"<span class=\"tex-font-style-tt\">No<\/span>\" (without the quotes) if the wires cannot be untangled.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>-++-<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>Yes<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>+-<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>No<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>++<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>Yes<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>-<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>No<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The first testcase corresponds to the picture in the statement. To untangle the wires, one can first move the \"plus\" wire lower, thus eliminating the two crosses in the middle, and then draw it under the \"minus\" wire, eliminating also the remaining two crosses.<\/p><p>In the second testcase the \"plus\" wire makes one full revolution around the \"minus\" wire. Thus the wires cannot be untangled: <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/94481ff58b8789cb514d3430a4d76be9477aeff1.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>In the third testcase the \"plus\" wire simply runs above the \"minus\" wire twice in sequence. The wires can be untangled by lifting \"plus\" and moving it higher: <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/114e8a8b1f051256f7436bd6bec7b9ffd4525286.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>In the fourth testcase the \"minus\" wire runs above the \"plus\" wire once. The wires cannot be untangled without moving the device itself: <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/f75ea84222f5fce465aeb9cd90ee0a43ac529e1d.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 1475, "index": "E", "name": "Advertising Agency", "rating": 1600, "solvedCount": 18780, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Advertising Agency<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Masha works in an advertising agency. In order to promote the new brand, she wants to conclude contracts with some bloggers. In total, Masha has connections of $$$n$$$ different bloggers. Blogger numbered $$$i$$$ has $$$a_i$$$ followers.<\/p><p>Since Masha has a limited budget, she can only sign a contract with $$$k$$$ different bloggers. Of course, Masha wants her ad to be seen by as many people as possible. Therefore, she must hire bloggers with the maximum total number of followers.<\/p><p>Help her, find the number of ways to select $$$k$$$ bloggers so that the total number of their followers is maximum possible. Two ways are considered different if there is at least one blogger in the first way, which is not in the second way. Masha believes that all bloggers have different followers (that is, there is no follower who would follow two different bloggers).<\/p><p>For example, if $$$n=4$$$, $$$k=3$$$, $$$a=[1, 3, 1, 2]$$$, then Masha has two ways to select $$$3$$$ bloggers with the maximum total number of followers: <\/p><ul> <li> conclude contracts with bloggers with numbers $$$1$$$, $$$2$$$ and $$$4$$$. In this case, the number of followers will be equal to $$$a_1 + a_2 + a_4 = 6$$$. <\/li><li> conclude contracts with bloggers with numbers $$$2$$$, $$$3$$$ and $$$4$$$. In this case, the number of followers will be equal to $$$a_2 + a_3 + a_4 = 6$$$. <\/li><\/ul><p>Since the answer can be quite large, <span class=\"tex-font-style-bf\">output it modulo $$$10^9+7$$$<\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 1000$$$)\u00a0\u2014 the number of test cases. Then $$$t$$$ test cases follow.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le k \\le n \\le 1000$$$)\u00a0\u2014 the number of bloggers and how many of them you can sign a contract with.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots a_n$$$ ($$$1 \\le a_i \\le n$$$)\u00a0\u2014 the number of followers of each blogger.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$1000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, on a separate line output one integer\u00a0\u2014 the number of ways to select $$$k$$$ bloggers so that the total number of their followers is maximum possible.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n4 3\n1 3 1 2\n4 2\n1 1 1 1\n2 1\n1 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n6\n1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The test case is explained in the statements.<\/p><p>In the second test case, the following ways are valid: <\/p><ul> <li> conclude contracts with bloggers with numbers $$$1$$$ and $$$2$$$. In this case, the number of followers will be equal to $$$a_1 + a_2 = 2$$$; <\/li><li> conclude contracts with bloggers with numbers $$$1$$$ and $$$3$$$. In this case, the number of followers will be equal to $$$a_1 + a_3 = 2$$$; <\/li><li> conclude contracts with bloggers with numbers $$$1$$$ and $$$4$$$. In this case, the number of followers will be equal to $$$a_1 + a_4 = 2$$$; <\/li><li> conclude contracts with bloggers with numbers $$$2$$$ and $$$3$$$. In this case, the number of followers will be equal to $$$a_2 + a_3 = 2$$$; <\/li><li> conclude contracts with bloggers with numbers $$$2$$$ and $$$4$$$. In this case, the number of followers will be equal to $$$a_2 + a_4 = 2$$$; <\/li><li> conclude contracts with bloggers with numbers $$$3$$$ and $$$4$$$. In this case, the number of followers will be equal to $$$a_3 + a_4 = 2$$$. <\/li><\/ul><p>In the third test case, the following ways are valid: <\/p><ul> <li> concludes a contract with a blogger with the number $$$2$$$. In this case, the number of followers will be equal to $$$a_2 = 2$$$. <\/li><\/ul><\/div><\/div>"}, {"contestId": 1358, "index": "C", "name": "Celex Update", "rating": 1600, "solvedCount": 18535, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Celex Update<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>During the quarantine, Sicromoft has more free time to create the new functions in \"<span class=\"tex-font-style-tt\">Celex-2021<\/span>\". The developers made a new function <span class=\"tex-font-style-tt\">GAZ-GIZ<\/span>, which infinitely fills an infinite table to the right and down from the upper left corner as follows:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/50d992c26f376f2bde3505ba72d122b46ccc6688.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center> The cell with coordinates $$$(x, y)$$$ is at the intersection of $$$x$$$-th row and $$$y$$$-th column. Upper left cell $$$(1,1)$$$ contains an integer $$$1$$$.<p>The developers of the <span class=\"tex-font-style-tt\">SUM<\/span> function don't sleep either. Because of the boredom, they teamed up with the developers of the <span class=\"tex-font-style-tt\">RAND<\/span> function, so they added the ability to calculate the sum on an arbitrary path from one cell to another, moving down or right. Formally, from the cell $$$(x,y)$$$ in one step you can move to the cell $$$(x+1, y)$$$ or $$$(x, y+1)$$$. <\/p><p>After another Dinwows update, Levian started to study \"<span class=\"tex-font-style-tt\">Celex-2021<\/span>\" (because he wants to be an accountant!). After filling in the table with the <span class=\"tex-font-style-tt\">GAZ-GIZ<\/span> function, he asked you to calculate the quantity of possible different amounts on the path from a given cell $$$(x_1, y_1)$$$ to another given cell $$$(x_2, y_2$$$), if you can only move one cell down or right.<\/p><p>Formally, consider all the paths from the cell $$$(x_1, y_1)$$$ to cell $$$(x_2, y_2)$$$ such that each next cell in the path is located either to the down or to the right of the previous one. Calculate the number of different sums of elements for all such paths.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 57179$$$) \u2014 the number of test cases.<\/p><p>Each of the following $$$t$$$ lines contains four natural numbers $$$x_1$$$, $$$y_1$$$, $$$x_2$$$, $$$y_2$$$ ($$$1 \\le x_1 \\le x_2 \\le 10^9$$$, $$$1 \\le y_1 \\le y_2 \\le 10^9$$$) \u2014 coordinates of the start and the end cells. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, in a separate line, print the number of possible different sums on the way from the start cell to the end cell.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n1 1 2 2\n1 2 2 4\n179 1 179 100000\n5 7 5 7\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n3\n1\n1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case there are two possible sums: $$$1+2+5=8$$$ and $$$1+3+5=9$$$. <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/54f16af83cc4838bce87a408843f620cc45d5ee1.png\" style=\"zoom: 100.0%;max-width: 100.0%;max-height: 100.0%;\"/><\/p><\/div><\/div>"}, {"contestId": 1730, "index": "B", "name": "Meeting on the Line", "rating": 1600, "solvedCount": 18493, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Meeting on the Line<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>$$$n$$$ people live on the coordinate line, the $$$i$$$-th one lives at the point $$$x_i$$$ ($$$1 \\le i \\le n$$$). They want to choose a position $$$x_0$$$ to meet. The $$$i$$$-th person will spend $$$|x_i - x_0|$$$ minutes to get to the meeting place. Also, the $$$i$$$-th person needs $$$t_i$$$ minutes to get dressed, so in total he or she needs $$$t_i + |x_i - x_0|$$$ minutes. <\/p><p>Here $$$|y|$$$ denotes the absolute value of $$$y$$$.<\/p><p>These people ask you to find a position $$$x_0$$$ that minimizes the time in which all $$$n$$$ people can gather at the meeting place. <\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^3$$$) \u2014 the number of test cases. Then the test cases follow.<\/p><p>Each test case consists of three lines.<\/p><p>The first line contains a single integer $$$n$$$ ($$$1 \\le n \\le 10^5$$$)\u00a0\u2014 the number of people. <\/p><p>The second line contains $$$n$$$ integers $$$x_1, x_2, \\dots, x_n$$$ ($$$0 \\le x_i \\le 10^{8}$$$) \u2014 the positions of the people.<\/p><p>The third line contains $$$n$$$ integers $$$t_1, t_2, \\dots, t_n$$$ ($$$0 \\le t_i \\le 10^{8}$$$), where $$$t_i$$$ is the time $$$i$$$-th person needs to get dressed.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print a single real number\u00a0\u2014 the optimum position $$$x_0$$$. It can be shown that the optimal position $$$x_0$$$ is unique.<\/p><p>Your answer will be considered correct if its absolute or relative error does not exceed $$$10^{\u22126}$$$. Formally, let your answer be $$$a$$$, the jury's answer be $$$b$$$. Your answer will be considered correct if $$$\\frac{|a\u2212b|}{max(1,|b|)} \\le 10^{\u22126}$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">0 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">0 0 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4 1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">3 3 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">5 3 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">5 4 7 2 10 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">3 2 5 1 4 6<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n2\n2.5\n2\n1\n3\n6\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><ul> <li> In the $$$1$$$-st test case there is one person, so it is efficient to choose his or her position for the meeting place. Then he or she will get to it in $$$3$$$ minutes, that he or she need to get dressed. <\/li><li> In the $$$2$$$-nd test case there are $$$2$$$ people who don't need time to get dressed. Each of them needs one minute to get to position $$$2$$$. <\/li><li> In the $$$5$$$-th test case the $$$1$$$-st person needs $$$4$$$ minutes to get to position $$$1$$$ ($$$4$$$ minutes to get dressed and $$$0$$$ minutes on the way); the $$$2$$$-nd person needs $$$2$$$ minutes to get to position $$$1$$$ ($$$1$$$ minute to get dressed and $$$1$$$ minute on the way); the $$$3$$$-rd person needs $$$4$$$ minutes to get to position $$$1$$$ ($$$2$$$ minutes to get dressed and $$$2$$$ minutes on the way). <\/li><\/ul><\/div><\/div>"}, {"contestId": 1334, "index": "C", "name": "Circle of Monsters", "rating": 1600, "solvedCount": 18261, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Circle of Monsters<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are playing another computer game, and now you have to slay $$$n$$$ monsters. These monsters are standing in a circle, numbered clockwise from $$$1$$$ to $$$n$$$. Initially, the $$$i$$$-th monster has $$$a_i$$$ health.<\/p><p>You may shoot the monsters to kill them. Each shot requires exactly one bullet and decreases the health of the targeted monster by $$$1$$$ (deals $$$1$$$ damage to it). Furthermore, when the health of some monster $$$i$$$ becomes $$$0$$$ or less than $$$0$$$, it dies and explodes, dealing $$$b_i$$$ damage to the next monster (monster $$$i + 1$$$, if $$$i  \\lt  n$$$, or monster $$$1$$$, if $$$i = n$$$). If the next monster is already dead, then nothing happens. If the explosion kills the next monster, it explodes too, damaging the monster after it and possibly triggering another explosion, and so on.<\/p><p>You have to calculate the minimum number of bullets you have to fire to kill all $$$n$$$ monsters in the circle.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$T$$$ ($$$1 \\le T \\le 150000$$$) \u2014 the number of test cases.<\/p><p>Then the test cases follow, each test case begins with a line containing one integer $$$n$$$ ($$$2 \\le n \\le 300000$$$) \u2014 the number of monsters. Then $$$n$$$ lines follow, each containing two integers $$$a_i$$$ and $$$b_i$$$ ($$$1 \\le a_i, b_i \\le 10^{12}$$$) \u2014 the parameters of the $$$i$$$-th monster in the circle.<\/p><p>It is guaranteed that the total number of monsters in all test cases does not exceed $$$300000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print one integer \u2014 the minimum number of bullets you have to fire to kill all of the monsters.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1\n3\n7 15\n2 14\n5 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1373, "index": "D", "name": "Maximum Sum on Even Positions", "rating": 1600, "solvedCount": 18176, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Maximum Sum on Even Positions<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ consisting of $$$n$$$ integers. Indices of the array start from zero (i.\u2009e. the first element is $$$a_0$$$, the second one is $$$a_1$$$, and so on).<\/p><p>You can reverse <span class=\"tex-font-style-bf\">at most one<\/span> subarray (continuous subsegment) of this array. Recall that the subarray of $$$a$$$ with borders $$$l$$$ and $$$r$$$ is $$$a[l; r] = a_l, a_{l + 1}, \\dots, a_{r}$$$.<\/p><p>Your task is to reverse such a subarray that the sum of elements on <span class=\"tex-font-style-bf\">even<\/span> positions of the resulting array is <span class=\"tex-font-style-bf\">maximized<\/span> (i.\u2009e. the sum of elements $$$a_0, a_2, \\dots, a_{2k}$$$ for integer $$$k = \\lfloor\\frac{n-1}{2}\\rfloor$$$ should be maximum possible).<\/p><p>You have to answer $$$t$$$ independent test cases.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains one integer $$$t$$$ ($$$1 \\le t \\le 2 \\cdot 10^4$$$) \u2014 the number of test cases. Then $$$t$$$ test cases follow.<\/p><p>The first line of the test case contains one integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$) \u2014 the length of $$$a$$$. The second line of the test case contains $$$n$$$ integers $$$a_0, a_1, \\dots, a_{n-1}$$$ ($$$1 \\le a_i \\le 10^9$$$), where $$$a_i$$$ is the $$$i$$$-th element of $$$a$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ does not exceed $$$2 \\cdot 10^5$$$ ($$$\\sum n \\le 2 \\cdot 10^5$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print the answer on the separate line \u2014 the <span class=\"tex-font-style-bf\">maximum<\/span> possible sum of elements on <span class=\"tex-font-style-bf\">even<\/span> positions after reversing <span class=\"tex-font-style-bf\">at most one<\/span> subarray (continuous subsegment) of $$$a$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n8\n1 7 3 4 7 6 2 9\n5\n1 2 1 2 1\n10\n7 8 4 5 7 6 8 9 7 3\n4\n3 1 2 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n26\n5\n37\n5\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1519, "index": "D", "name": "Maximum Sum of Products", "rating": 1600, "solvedCount": 18031, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Maximum Sum of Products<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given two integer arrays $$$a$$$ and $$$b$$$ of length $$$n$$$.<\/p><p>You can reverse <span class=\"tex-font-style-bf\">at most one<\/span> subarray (continuous subsegment) of the array $$$a$$$. <\/p><p>Your task is to reverse such a subarray that the sum $$$\\sum\\limits_{i=1}^n a_i \\cdot b_i$$$ is <span class=\"tex-font-style-bf\">maximized<\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$1 \\le n \\le 5000$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^7$$$).<\/p><p>The third line contains $$$n$$$ integers $$$b_1, b_2, \\dots, b_n$$$ ($$$1 \\le b_i \\le 10^7$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print single integer \u2014 maximum possible sum after reversing <span class=\"tex-font-style-bf\">at most one<\/span> subarray (continuous subsegment) of $$$a$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n2 3 2 1 3\n1 3 2 4 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n29\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n13 37\n2 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n174\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n1 8 7 6 3 6\n5 9 6 8 8 6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n235\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, you can reverse the subarray $$$[4, 5]$$$. Then $$$a = [2, 3, 2, 3, 1]$$$ and $$$2 \\cdot 1 + 3 \\cdot 3 + 2 \\cdot 2 + 3 \\cdot 4 + 1 \\cdot 2 = 29$$$.<\/p><p>In the second example, you don't need to use the reverse operation. $$$13 \\cdot 2 + 37 \\cdot 4 = 174$$$.<\/p><p>In the third example, you can reverse the subarray $$$[3, 5]$$$. Then $$$a = [1, 8, 3, 6, 7, 6]$$$ and $$$1 \\cdot 5 + 8 \\cdot 9 + 3 \\cdot 6 + 6 \\cdot 8 + 7 \\cdot 8 + 6 \\cdot 6 = 235$$$.<\/p><\/div><\/div>"}, {"contestId": 1886, "index": "C", "name": "Decreasing String", "rating": 1600, "solvedCount": 17764, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Decreasing String<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Recall that string $$$a$$$ is lexicographically smaller than string $$$b$$$ if $$$a$$$ is a prefix of $$$b$$$ (and $$$a \\ne b$$$), or there exists an index $$$i$$$ ($$$1 \\le i \\le \\min(|a|, |b|)$$$) such that $$$a_i  \\lt  b_i$$$, and for any index $$$j$$$ ($$$1 \\le j  \\lt  i$$$) $$$a_j = b_j$$$.<\/p><p>Consider a sequence of strings $$$s_1, s_2, \\dots, s_n$$$, each consisting of lowercase Latin letters. String $$$s_1$$$ is given explicitly, and all other strings are generated according to the following rule: to obtain the string $$$s_i$$$, a character is removed from string $$$s_{i-1}$$$ in such a way that string $$$s_i$$$ is lexicographically minimal.<\/p><p>For example, if $$$s_1 = \\mathrm{dacb}$$$, then string $$$s_2 = \\mathrm{acb}$$$, string $$$s_3 = \\mathrm{ab}$$$, string $$$s_4 = \\mathrm{a}$$$.<\/p><p>After that, we obtain the string $$$S = s_1 + s_2 + \\dots + s_n$$$ ($$$S$$$ is the concatenation of all strings $$$s_1, s_2, \\dots, s_n$$$).<\/p><p>You need to output the character in position $$$pos$$$ of the string $$$S$$$ (i.\u2009e. the character $$$S_{pos}$$$).<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ \u2014 the number of test cases ($$$1 \\le t \\le 10^4$$$).<\/p><p>Each test case consists of two lines. The first line contains the string $$$s_1$$$ ($$$1 \\le |s_1| \\le 10^6$$$), consisting of lowercase Latin letters. The second line contains the integer $$$pos$$$ ($$$1 \\le pos \\le \\frac{|s_1| \\cdot (|s_1| +1)}{2}$$$). You may assume that $$$n$$$ is equal to the length of the given string ($$$n = |s_1|$$$).<\/p><p>Additional constraint on the input: the sum of $$$|s_1|$$$ over all test cases does not exceed $$$10^6$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print the answer \u2014 the character that is at position $$$pos$$$ in string $$$S$$$. <span class=\"tex-font-style-bf\">Note that the answers between different test cases are not separated by spaces or line breaks<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">cab<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">abcd<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">x<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nabx<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1537, "index": "E1", "name": "Erase and Extend (Easy Version)", "rating": 1600, "solvedCount": 17139, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E1. Erase and Extend (Easy Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is the easy version of the problem. The only difference is the constraints on $$$n$$$ and $$$k$$$. You can make hacks only if all versions of the problem are solved.<\/span><\/p><p>You have a string $$$s$$$, and you can do two types of operations on it: <\/p><ul> <li> Delete the last character of the string. <\/li><li> Duplicate the string: $$$s:=s+s$$$, where $$$+$$$ denotes concatenation. <\/li><\/ul><p>You can use each operation any number of times (possibly none).<\/p><p>Your task is to find the lexicographically smallest string of length exactly $$$k$$$ that can be obtained by doing these operations on string $$$s$$$.<\/p><p>A string $$$a$$$ is lexicographically smaller than a string $$$b$$$ if and only if one of the following holds:<\/p><ul> <li> $$$a$$$ is a prefix of $$$b$$$, but $$$a\\ne b$$$; <\/li><li> In the first position where $$$a$$$ and $$$b$$$ differ, the string $$$a$$$ has a letter that appears earlier in the alphabet than the corresponding letter in $$$b$$$. <\/li><\/ul><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$, $$$k$$$ ($$$1 \\leq n, k \\leq 5000$$$) \u2014 the length of the original string $$$s$$$ and the length of the desired string.<\/p><p>The second line contains the string $$$s$$$, consisting of $$$n$$$ lowercase English letters.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the lexicographically smallest string of length $$$k$$$ that can be obtained by doing the operations on string $$$s$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n8 16\ndbcadabc\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\ndbcadabcdbcadabc\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 5\nabcd\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\naaaaa\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test, it is optimal to make one duplication: \"<span class=\"tex-font-style-tt\">dbcadabc<\/span>\" $$$\\to$$$ \"<span class=\"tex-font-style-tt\">dbcadabcdbcadabc<\/span>\".<\/p><p>In the second test it is optimal to delete the last $$$3$$$ characters, then duplicate the string $$$3$$$ times, then delete the last $$$3$$$ characters to make the string have length $$$k$$$.<\/p><p>\"<span class=\"tex-font-style-tt\">abcd<\/span>\" $$$\\to$$$ \"<span class=\"tex-font-style-tt\">abc<\/span>\" $$$\\to$$$ \"<span class=\"tex-font-style-tt\">ab<\/span>\" $$$\\to$$$ \"<span class=\"tex-font-style-tt\">a<\/span>\" $$$\\to$$$ \"<span class=\"tex-font-style-tt\">aa<\/span>\" $$$\\to$$$ \"<span class=\"tex-font-style-tt\">aaaa<\/span>\" $$$\\to$$$ \"<span class=\"tex-font-style-tt\">aaaaaaaa<\/span>\" $$$\\to$$$ \"<span class=\"tex-font-style-tt\">aaaaaaa<\/span>\" $$$\\to$$$ \"<span class=\"tex-font-style-tt\">aaaaaa<\/span>\" $$$\\to$$$ \"<span class=\"tex-font-style-tt\">aaaaa<\/span>\".<\/p><\/div><\/div>"}, {"contestId": 1907, "index": "E", "name": "Good Triples", "rating": 1600, "solvedCount": 17085, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Good Triples<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Given a non-negative integer number $$$n$$$ ($$$n \\ge 0$$$). Let's say a triple of non-negative integers $$$(a, b, c)$$$ is good if $$$a + b + c = n$$$, and $$$digsum(a) + digsum(b) + digsum(c) = digsum(n)$$$, where $$$digsum(x)$$$ is the sum of digits of number $$$x$$$.<\/p><p>For example, if $$$n = 26$$$, then the pair $$$(4, 12, 10)$$$ is good, because $$$4 + 12 + 10 = 26$$$, and $$$(4) + (1 + 2) + (1 + 0) = (2 + 6)$$$.<\/p><p>Your task is to find the number of good triples for the given number $$$n$$$. The order of the numbers in a triple matters. For example, the triples $$$(4, 12, 10)$$$ and $$$(10, 12, 4)$$$ are two different triples.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases. Descriptions of test cases follow.<\/p><p>The first and only line of the test case contains one integer $$$n$$$ ($$$0 \\le n \\le 10^7$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case output one integer, the number of good triples for the given integer $$$n$$$. Order of integers in a triple matters.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">12<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">11<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">3141<\/div><div class=\"test-example-line test-example-line-odd test-example-line-9\">999<\/div><div class=\"test-example-line test-example-line-even test-example-line-10\">2718<\/div><div class=\"test-example-line test-example-line-odd test-example-line-11\">9999999<\/div><div class=\"test-example-line test-example-line-even test-example-line-12\">10000000<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n9\n1\n3\n6\n10\n15\n21\n1350\n166375\n29160\n1522435234375\n3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, the good triples are $$$(0, 0, 11)$$$, $$$(0, 1, 10)$$$, $$$(0, 10, 1)$$$, $$$(0, 11, 0)$$$, $$$(1, 0, 10)$$$, $$$(1, 10, 0)$$$, $$$(10, 0, 1)$$$, $$$(10, 1, 0)$$$, $$$(11, 0, 0)$$$.<\/p><p>In the second example, there is only one good triple $$$(0, 0, 0)$$$.<\/p><\/div><\/div>"}, {"contestId": 1513, "index": "C", "name": "Add One", "rating": 1600, "solvedCount": 17070, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Add One<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an integer $$$n$$$. You have to apply $$$m$$$ operations to it.<\/p><p>In a single operation, you <span class=\"tex-font-style-bf\">must<\/span> replace every digit $$$d$$$ of the number with the decimal representation of integer $$$d + 1$$$. For example, $$$1912$$$ becomes $$$21023$$$ after applying the operation once.<\/p><p>You have to find the length of $$$n$$$ after applying $$$m$$$ operations. Since the answer can be very large, print it modulo $$$10^9+7$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of test cases.<\/p><p>The only line of each test case contains two integers $$$n$$$ ($$$1 \\le n \\le 10^9$$$) and $$$m$$$ ($$$1 \\le m \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the initial number and the number of operations. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case output the length of the resulting number modulo $$$10^9+7$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n1912 1\n5 6\n999 1\n88 2\n12 100\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5\n2\n6\n4\n2115\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first test, $$$1912$$$ becomes $$$21023$$$ after $$$1$$$ operation which is of length $$$5$$$.<\/p><p>For the second test, $$$5$$$ becomes $$$21$$$ after $$$6$$$ operations which is of length $$$2$$$.<\/p><p>For the third test, $$$999$$$ becomes $$$101010$$$ after $$$1$$$ operation which is of length $$$6$$$.<\/p><p>For the fourth test, $$$88$$$ becomes $$$1010$$$ after $$$2$$$ operations which is of length $$$4$$$.<\/p><\/div><\/div>"}, {"contestId": 1396, "index": "A", "name": "Multiples of Length", "rating": 1600, "solvedCount": 16876, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. Multiples of Length<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ of $$$n$$$ integers.<\/p><p>You want to make all elements of $$$a$$$ equal to zero by doing the following operation <span class=\"tex-font-style-bf\">exactly three<\/span> times:<\/p><ul> <li> Select a segment, for each number in this segment we can add a multiple of $$$len$$$ to it, where $$$len$$$ is the length of this segment (added integers can be different). <\/li><\/ul><p>It can be proven that it is always possible to make all elements of $$$a$$$ equal to zero.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$1 \\le n \\le 100\\,000$$$): the number of elements of the array.<\/p><p>The second line contains $$$n$$$ elements of an array $$$a$$$ separated by spaces: $$$a_1, a_2, \\dots, a_n$$$ ($$$-10^9 \\le a_i \\le 10^9$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>The output should contain six lines representing three operations.<\/p><p>For each operation, print two lines:<\/p><ul><p> <\/p><li> The first line contains two integers $$$l$$$, $$$r$$$ ($$$1 \\le l \\le r \\le n$$$): the bounds of the selected segment.<p> <\/p><\/li><li> The second line contains $$$r-l+1$$$ integers $$$b_l, b_{l+1}, \\dots, b_r$$$ ($$$-10^{18} \\le b_i \\le 10^{18}$$$): the numbers to add to $$$a_l, a_{l+1}, \\ldots, a_r$$$, respectively; $$$b_i$$$ should be divisible by $$$r - l + 1$$$.<\/li><\/ul> <\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n1 3 2 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 1 \n-1\n3 4\n4 2\n2 4\n-3 -6 -6<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1344, "index": "A", "name": "Hilbert's Hotel", "rating": 1600, "solvedCount": 16653, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. Hilbert's Hotel<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Hilbert's Hotel is a very unusual hotel since the number of rooms is infinite! In fact, there is exactly one room for every integer, <span class=\"tex-font-style-bf\">including zero and negative integers<\/span>. Even stranger, the hotel is currently at full capacity, meaning there is exactly one guest in every room. The hotel's manager, David Hilbert himself, decides he wants to shuffle the guests around because he thinks this will create a vacancy (a room without a guest).<\/p><p>For any integer $$$k$$$ and positive integer $$$n$$$, let $$$k\\bmod n$$$ denote the remainder when $$$k$$$ is divided by $$$n$$$. More formally, $$$r=k\\bmod n$$$ is the smallest non-negative integer such that $$$k-r$$$ is divisible by $$$n$$$. It always holds that $$$0\\le k\\bmod n\\le n-1$$$. For example, $$$100\\bmod 12=4$$$ and $$$(-1337)\\bmod 3=1$$$.<\/p><p>Then the shuffling works as follows. There is an array of $$$n$$$ integers $$$a_0,a_1,\\ldots,a_{n-1}$$$. Then for each integer $$$k$$$, the guest in room $$$k$$$ is moved to room number $$$k+a_{k\\bmod n}

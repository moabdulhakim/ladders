tex-span\">1\u2009\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20095000<\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>w<\/i>,\u2009\u2009<i>h<\/i>\u2009\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup><\/span>) \u2014 amount of envelopes Peter has, the card width and height respectively. Then there follow <span class=\"tex-span\"><i>n<\/i><\/span> lines, each of them contains two integer numbers <span class=\"tex-span\"><i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>h<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> \u2014 width and height of the <span class=\"tex-span\"><i>i<\/i><\/span>-th envelope (<span class=\"tex-span\">1\u2009\u2264\u2009<i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009\u2009<i>h<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup><\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In the first line print the maximum chain size. In the second line print the numbers of the envelopes (separated by space), forming the required chain, starting with the number of the smallest envelope. Remember, please, that the card should fit into the smallest envelope. If the chain of maximum size is not unique, print any of the answers.<\/p><p>If the card does not fit into any of the envelopes, print number <span class=\"tex-span\">0<\/span> in the single line.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 1 1<br/>2 2<br/>2 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/>1 <br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 3 3<br/>5 4<br/>12 11<br/>9 8<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/>1 3 2 <br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 486, "index": "C", "name": "Palindrome Transformation", "rating": 1700, "solvedCount": 12492, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Palindrome Transformation<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Nam is playing with a string on his computer. The string consists of <span class=\"tex-span\"><i>n<\/i><\/span> lowercase English letters. It is meaningless, so Nam decided to make the string more beautiful, that is to make it be a palindrome by using 4 arrow keys: left, right, up, down.<\/p><p>There is a cursor pointing at some symbol of the string. Suppose that cursor is at position <span class=\"tex-span\"><i>i<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>, the string uses 1-based indexing) now. Left and right arrow keys are used to move cursor around the string. The string is cyclic, that means that when Nam presses left arrow key, the cursor will move to position <span class=\"tex-span\"><i>i<\/i>\u2009-\u20091<\/span> if <span class=\"tex-span\"><i>i<\/i>\u2009&gt;\u20091<\/span> or to the end of the string (i. e. position <span class=\"tex-span\"><i>n<\/i><\/span>) otherwise. The same holds when he presses the right arrow key (if <span class=\"tex-span\"><i>i<\/i>\u2009=\u2009<i>n<\/i><\/span>, the cursor appears at the beginning of the string).<\/p><p>When Nam presses up arrow key, the letter which the text cursor is pointing to will change to the next letter in English alphabet (assuming that alphabet is also cyclic, i. e. after '<span class=\"tex-font-style-tt\">z<\/span>' follows '<span class=\"tex-font-style-tt\">a<\/span>'). The same holds when he presses the down arrow key.<\/p><p>Initially, the text cursor is at position <span class=\"tex-span\"><i>p<\/i><\/span>. <\/p><p>Because Nam has a lot homework to do, he wants to complete this as fast as possible. Can you help him by calculating the minimum number of arrow keys presses to make the string to be a palindrome?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two space-separated integers <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>) and <span class=\"tex-span\"><i>p<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>p<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>), the length of Nam's string and the initial position of the text cursor.<\/p><p>The next line contains <span class=\"tex-span\"><i>n<\/i><\/span> lowercase characters of Nam's string.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the minimum number of presses needed to change string into a palindrome.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>8 3<br/>aeabcaez<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>A string is a palindrome if it reads the same forward or reversed.<\/p><p>In the sample test, initial Nam's string is: <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/7cd1b7b2498296406fff738215b48ddd9a12898d.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> (cursor position is shown bold).<\/p><p>In optimal solution, Nam may do <span class=\"tex-span\">6<\/span> following steps:<\/p><center class=\"tex-equation\"><img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/b8fc8b6f8a38719d0df2d8a7aa078900d99d855f.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/center><p>The result, <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/f998673d1ad2128f8e2de7ff01895c8ef9ee34ff.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>, is now a palindrome.<\/p><\/div><\/div>"}, {"contestId": 1336, "index": "B", "name": "Xenia and Colorful Gems", "rating": 1700, "solvedCount": 12359, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Xenia and Colorful Gems<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Xenia is a girl being born a noble. Due to the inflexibility and harshness of her family, Xenia has to find some ways to amuse herself.<\/p><center><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/9009014b014bf166009f795617ac1eb6354bdf7a.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/center>\u00a0<p>Recently Xenia has bought $$$n_r$$$ red gems, $$$n_g$$$ green gems and $$$n_b$$$ blue gems. Each of the gems has a weight.<\/p><p>Now, she is going to pick three gems.<\/p><p>Xenia loves colorful things, so she will pick exactly one gem of each color.<\/p><p>Xenia loves balance, so she will try to pick gems with little difference in weight.<\/p><p>Specifically, supposing the weights of the picked gems are $$$x$$$, $$$y$$$ and $$$z$$$, Xenia wants to find the minimum value of $$$(x-y)^2+(y-z)^2+(z-x)^2$$$. As her dear friend, can you help her?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1\\le t \\le 100$$$) \u00a0\u2014 the number of test cases. Then $$$t$$$ test cases follow.<\/p><p>The first line of each test case contains three integers $$$n_r,n_g,n_b$$$ ($$$1\\le n_r,n_g,n_b\\le 10^5$$$) \u00a0\u2014 the number of red gems, green gems and blue gems respectively.<\/p><p>The second line of each test case contains $$$n_r$$$ integers $$$r_1,r_2,\\ldots,r_{n_r}$$$ ($$$1\\le r_i \\le 10^9$$$) \u00a0\u2014 $$$r_i$$$ is the weight of the $$$i$$$-th red gem.<\/p><p>The third line of each test case contains $$$n_g$$$ integers $$$g_1,g_2,\\ldots,g_{n_g}$$$ ($$$1\\le g_i \\le 10^9$$$) \u00a0\u2014 $$$g_i$$$ is the weight of the $$$i$$$-th green gem.<\/p><p>The fourth line of each test case contains $$$n_b$$$ integers $$$b_1,b_2,\\ldots,b_{n_b}$$$ ($$$1\\le b_i \\le 10^9$$$) \u00a0\u2014 $$$b_i$$$ is the weight of the $$$i$$$-th blue gem.<\/p><p>It is guaranteed that $$$\\sum n_r \\le 10^5$$$, $$$\\sum n_g \\le 10^5$$$, $$$\\sum n_b \\le 10^5$$$ (the sum for all test cases).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print a line contains one integer \u00a0\u2014 the minimum value which Xenia wants to find. <\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n2 2 3\n7 8\n6 3\n3 1 4\n1 1 1\n1\n1\n1000000000\n2 2 2\n1 2\n5 4\n6 7\n2 2 2\n1 2\n3 4\n6 7\n3 4 1\n3 2 1\n7 3 3 4\n6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n14\n1999999996000000002\n24\n24\n14\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, Xenia has the following gems:<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/7e400036e7fb1bb1013d79825f1eb0157cb807e7.webp\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>If she picks the red gem with weight $$$7$$$, the green gem with weight $$$6$$$, and the blue gem with weight $$$4$$$, she will achieve the most balanced selection with $$$(x-y)^2+(y-z)^2+(z-x)^2=(7-6)^2+(6-4)^2+(4-7)^2=14$$$.<\/p><\/div><\/div>"}, {"contestId": 1700, "index": "C", "name": "Helping the Nature", "rating": 1700, "solvedCount": 12356, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Helping the Nature<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Little Leon lives in the forest. He has recently noticed that some trees near his favourite path are withering, while the other ones are overhydrated so he decided to learn how to control the level of the soil moisture to save the trees.<\/p><p>There are $$$n$$$ trees growing near the path, the current levels of moisture of each tree are denoted by the array $$$a_1, a_2, \\dots, a_n$$$. Leon has learned three abilities which will help him to dry and water the soil.<\/p><ul> <li> Choose a position $$$i$$$ and decrease the level of moisture of the trees $$$1, 2, \\dots, i$$$ by $$$1$$$. <\/li><li> Choose a position $$$i$$$ and decrease the level of moisture of the trees $$$i, i + 1, \\dots, n$$$ by $$$1$$$. <\/li><li> Increase the level of moisture of all trees by $$$1$$$. <\/li><\/ul><p>Leon wants to know the minimum number of actions he needs to perform to make the moisture of each tree equal to $$$0$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 2 \\cdot 10^4$$$) \u00a0\u2014 the number of test cases. The description of $$$t$$$ test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\leq n \\leq 200\\,000$$$).<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$-10^9 \\leq a_i \\leq 10^9$$$) \u2014 the initial levels of trees moisture. <\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases doesn't exceed $$$200\\,000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case output a single integer \u2014 the minimum number of actions. It can be shown that the answer exists.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n3\n-2 -2 -2\n3\n10 4 7\n4\n4 -4 4 -4\n5\n1 -2 3 -4 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n13\n36\n33\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case it's enough to apply the operation of adding $$$1$$$ to the whole array $$$2$$$ times. <\/p><p>In the second test case you can apply the operation of decreasing $$$4$$$ times on the prefix of length $$$3$$$ and get an array $$$6, 0, 3$$$. <\/p><p>After that apply the operation of decreasing $$$6$$$ times on the prefix of length $$$1$$$ and $$$3$$$ times on the suffix of length $$$1$$$. In total, the number of actions will be $$$4 + 6 + 3 = 13$$$. It can be shown that it's impossible to perform less actions to get the required array, so the answer is $$$13$$$. <\/p><\/div><\/div>"}, {"contestId": 1406, "index": "C", "name": "Link Cut Centroids", "rating": 1700, "solvedCount": 12245, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Link Cut Centroids<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Fishing Prince loves trees, and he especially loves trees with only one centroid. The tree is a connected graph without cycles.<\/p><p>A vertex is a <span class=\"tex-font-style-bf\">centroid<\/span> of a tree only when you cut this vertex (remove it and remove all edges from this vertex), the size of the largest connected component of the remaining graph is the smallest possible.<\/p><p>For example, the centroid of the following tree is $$$2$$$, because when you cut it, the size of the largest connected component of the remaining graph is $$$2$$$ and it can't be smaller.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/e26bc5c65a2b0cd51716f7c5c8261180cb5715fe.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>However, in some trees, there might be more than one centroid, for example:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/69ba15bed324eb45c0e873be5b6e6a4f6a7f3989.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>Both vertex $$$1$$$ and vertex $$$2$$$ are centroids because the size of the largest connected component is $$$3$$$ after cutting each of them.<\/p><p>Now Fishing Prince has a tree. He should cut one edge of the tree (it means to remove the edge). After that, he should add one edge. The resulting graph after these two operations should be a tree. He can add the edge that he cut.<\/p><p>He wants the centroid of the resulting tree to be unique. Help him and find any possible way to make the operations. It can be proved, that at least one such way always exists.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The input consists of multiple test cases. The first line contains an integer $$$t$$$ ($$$1\\leq t\\leq 10^4$$$) \u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains an integer $$$n$$$ ($$$3\\leq n\\leq 10^5$$$) \u2014 the number of vertices.<\/p><p>Each of the next $$$n-1$$$ lines contains two integers $$$x, y$$$ ($$$1\\leq x,y\\leq n$$$). It means, that there exists an edge connecting vertices $$$x$$$ and $$$y$$$.<\/p><p>It's guaranteed that the given graph is a tree.<\/p><p>It's guaranteed that the sum of $$$n$$$ for all test cases does not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print two lines.<\/p><p>In the first line print two integers $$$x_1, y_1$$$ ($$$1 \\leq x_1, y_1 \\leq n$$$), which means you cut the edge between vertices $$$x_1$$$ and $$$y_1$$$. There should exist edge connecting vertices $$$x_1$$$ and $$$y_1$$$.<\/p><p>In the second line print two integers $$$x_2, y_2$$$ ($$$1 \\leq x_2, y_2 \\leq n$$$), which means you add the edge between vertices $$$x_2$$$ and $$$y_2$$$.<\/p><p>The graph after these two operations should be a tree.<\/p><p>If there are multiple solutions you can print any.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n5\n1 2\n1 3\n2 4\n2 5\n6\n1 2\n1 3\n1 4\n2 5\n2 6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 2\n1 2\n1 3\n2 3<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Note that you can add the same edge that you cut.<\/p><p>In the first test case, after cutting and adding the same edge, the vertex $$$2$$$ is still the only centroid.<\/p><p>In the second test case, the vertex $$$2$$$ becomes the only centroid after cutting the edge between vertices $$$1$$$ and $$$3$$$ and adding the edge between vertices $$$2$$$ and $$$3$$$.<\/p><\/div><\/div>"}, {"contestId": 1969, "index": "C", "name": "Minimizing the Sum", "rating": 1700, "solvedCount": 12046, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Minimizing the Sum<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an integer array $$$a$$$ of length $$$n$$$.<\/p><p>You can perform the following operation: choose an element of the array and replace it with any of its neighbor's value.<\/p><p>For example, if $$$a=[3, 1, 2]$$$, you can get one of the arrays $$$[3, 3, 2]$$$, $$$[3, 2, 2]$$$ and $$$[1, 1, 2]$$$ using one operation, but not $$$[2, 1, 2$$$] or $$$[3, 4, 2]$$$. <\/p><p>Your task is to calculate the minimum possible total sum of the array if you can perform the aforementioned operation at most $$$k$$$ times.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le n \\le 3 \\cdot 10^5$$$; $$$0 \\le k \\le 10$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$).<\/p><p>Additional constraint on the input: the sum of $$$n$$$ over all test cases doesn't exceed $$$3 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print a single integer\u00a0\u2014 the minimum possible total sum of the array if you can perform the aforementioned operation at most $$$k$$$ times.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 2 1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 1 2 2 4 3<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n5\n5\n10\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, one of the possible sequences of operations is the following: $$$[3, 1, 2] \\rightarrow [1, 1, 2$$$].<\/p><p>In the second example, you do not need to apply the operation.<\/p><p>In the third example, one of the possible sequences of operations is the following: $$$[2, 2, 1, 3] \\rightarrow [2, 1, 1, 3] \\rightarrow [2, 1, 1, 1]$$$.<\/p><p>In the fourth example, one of the possible sequences of operations is the following: $$$[4, 1, 2, 2, 4, 3] \\rightarrow [1, 1, 2, 2, 4, 3] \\rightarrow [1, 1, 1, 2, 4, 3] \\rightarrow [1, 1, 1, 2, 2, 3]$$$.<\/p><\/div><\/div>"}, {"contestId": 1626, "index": "C", "name": "Monsters And Spells", "rating": 1700, "solvedCount": 12044, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Monsters And Spells<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Monocarp is playing a computer game once again. He is a wizard apprentice, who only knows a single spell. Luckily, this spell can damage the monsters.<\/p><p>The level he's currently on contains $$$n$$$ monsters. The $$$i$$$-th of them appears $$$k_i$$$ seconds after the start of the level and has $$$h_i$$$ health points. As an additional constraint, $$$h_i \\le k_i$$$ for all $$$1 \\le i \\le n$$$. All $$$k_i$$$ are different.<\/p><p>Monocarp can cast the spell at moments which are positive integer amounts of second after the start of the level: $$$1, 2, 3, \\dots$$$ The damage of the spell is calculated as follows. If he didn't cast the spell at the previous second, the damage is $$$1$$$. Otherwise, let the damage at the previous second be $$$x$$$. Then he can choose the damage to be either $$$x + 1$$$ or $$$1$$$. A spell uses mana: casting a spell with damage $$$x$$$ uses $$$x$$$ mana. Mana doesn't regenerate.<\/p><p>To kill the $$$i$$$-th monster, Monocarp has to cast a spell with damage at least $$$h_i$$$ at the exact moment the monster appears, which is $$$k_i$$$.<\/p><p>Note that Monocarp can cast the spell even when there is no monster at the current second.<\/p><p>The mana amount required to cast the spells is the sum of mana usages for all cast spells. Calculate the least amount of mana required for Monocarp to kill all monsters.<\/p><p>It can be shown that it's always possible to kill all monsters under the constraints of the problem.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of testcases.<\/p><p>The first line of the testcase contains a single integer $$$n$$$ ($$$1 \\le n \\le 100$$$)\u00a0\u2014 the number of monsters in the level.<\/p><p>The second line of the testcase contains $$$n$$$ integers $$$k_1  \\lt  k_2  \\lt  \\dots  \\lt  k_n$$$ ($$$1 \\le k_i \\le 10^9$$$)\u00a0\u2014 the number of second from the start the $$$i$$$-th monster appears at. All $$$k_i$$$ are different, $$$k_i$$$ are provided in the increasing order.<\/p><p>The third line of the testcase contains $$$n$$$ integers $$$h_1, h_2, \\dots, h_n$$$ ($$$1 \\le h_i \\le k_i \\le 10^9$$$)\u00a0\u2014 the health of the $$$i$$$-th monster.<\/p><p>The sum of $$$n$$$ over all testcases doesn't exceed $$$10^4$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each testcase, print a single integer\u00a0\u2014 the least amount of mana required for Monocarp to kill all monsters.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 7 9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 1 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n10\n6\n7\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first testcase of the example, Monocarp can cast spells $$$3, 4, 5$$$ and $$$6$$$ seconds from the start with damages $$$1, 2, 3$$$ and $$$4$$$, respectively. The damage dealt at $$$6$$$ seconds is $$$4$$$, which is indeed greater than or equal to the health of the monster that appears.<\/p><p>In the second testcase of the example, Monocarp can cast spells $$$3, 4$$$ and $$$5$$$ seconds from the start with damages $$$1, 2$$$ and $$$3$$$, respectively.<\/p><p>In the third testcase of the example, Monocarp can cast spells $$$4, 5, 7, 8$$$ and $$$9$$$ seconds from the start with damages $$$1, 2, 1, 1$$$ and $$$2$$$, respectively.<\/p><\/div><\/div>"}, {"contestId": 287, "index": "B", "name": "Pipeline", "rating": 1700, "solvedCount": 12043, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Pipeline<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>0.4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Vova, the Ultimate Thule new shaman, wants to build a pipeline. As there are exactly <span class=\"tex-span\"><i>n<\/i><\/span> houses in Ultimate Thule, Vova wants the city to have exactly <span class=\"tex-span\"><i>n<\/i><\/span> pipes, each such pipe should be connected to the water supply. A pipe can be connected to the water supply if there's water flowing out of it. Initially Vova has only one pipe with flowing water. Besides, Vova has several splitters.<\/p><p>A splitter is a construction that consists of one input (it can be connected to a water pipe) and <span class=\"tex-span\"><i>x<\/i><\/span> output pipes. When a splitter is connected to a water pipe, water flows from each output pipe. You can assume that the output pipes are ordinary pipes. For example, you can connect water supply to such pipe if there's water flowing out from it. At most one splitter can be connected to any water pipe.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/c0ed2dfca233f5178237c977e6afa00a5760235e.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <span class=\"tex-font-size-script\">The figure shows a <span class=\"tex-span\">4<\/span>-output splitter<\/span> <\/center><p>Vova has one splitter of each kind: with <span class=\"tex-span\">2<\/span>, <span class=\"tex-span\">3<\/span>, <span class=\"tex-span\">4<\/span>, ..., <span class=\"tex-span\"><i>k<\/i><\/span> outputs. Help Vova use the minimum number of splitters to build the required pipeline or otherwise state that it's impossible.<\/p><p>Vova needs the pipeline to have exactly <span class=\"tex-span\"><i>n<\/i><\/span> pipes with flowing out water. Note that some of those pipes can be the output pipes of the splitters.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two space-separated integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">18<\/sup><\/span>, <span class=\"tex-span\">2\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>).<\/p><p>Please, do not use the <span class=\"tex-font-style-tt\">%lld<\/span> specifier to read or write 64-bit integers in \u0421++. It is preferred to use the <span class=\"tex-font-style-tt\">cin<\/span>, <span class=\"tex-font-style-tt\">cout<\/span> streams or the <span class=\"tex-font-style-tt\">%I64d<\/span> specifier.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u2014 the minimum number of splitters needed to build the pipeline. If it is impossible to build a pipeline with the given splitters, print -1.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>8 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>-1<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1893, "index": "B", "name": "Neutral Tonality", "rating": 1700, "solvedCount": 11982, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Neutral Tonality<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ consisting of $$$n$$$ integers, as well as an array $$$b$$$ consisting of $$$m$$$ integers.<\/p><p>Let $$$\\text{LIS}(c)$$$ denote the length of the <a href=\"https://en.wikipedia.org/wiki/Longest_increasing_subsequence\">longest increasing subsequence<\/a> of array $$$c$$$. For example, $$$\\text{LIS}([2, \\underline{1}, 1, \\underline{3}])$$$ = $$$2$$$, $$$\\text{LIS}([\\underline{1}, \\underline{7}, \\underline{9}])$$$ = $$$3$$$, $$$\\text{LIS}([3, \\underline{1}, \\underline{2}, \\underline{4}])$$$ = $$$3$$$.<\/p><p>You need to insert the numbers $$$b_1, b_2, \\ldots, b_m$$$ into the array $$$a$$$, at any positions, in any order. Let the resulting array be $$$c_1, c_2, \\ldots, c_{n+m}$$$. You need to choose the positions for insertion in order to <span class=\"tex-font-style-bf\">minimize<\/span> $$$\\text{LIS}(c)$$$.<\/p><p>Formally, you need to find an array $$$c_1, c_2, \\ldots, c_{n+m}$$$ that simultaneously satisfies the following conditions:<\/p><ul><li> The array $$$a_1, a_2, \\ldots, a_n$$$ is a subsequence of the array $$$c_1, c_2, \\ldots, c_{n+m}$$$.<\/li><li> The array $$$c_1, c_2, \\ldots, c_{n+m}$$$ consists of the numbers $$$a_1, a_2, \\ldots, a_n, b_1, b_2, \\ldots, b_m$$$, possibly rearranged.<\/li><li> The value of $$$\\text{LIS}(c)$$$ is the <span class=\"tex-font-style-bf\">minimum<\/span> possible among all suitable arrays $$$c$$$.<\/li><\/ul><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains a single integer $$$t$$$ $$$(1 \\leq t \\leq 10^4)$$$\u00a0\u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains two integers $$$n, m$$$ $$$(1 \\leq n \\leq 2 \\cdot 10^5, 1 \\leq m \\leq 2 \\cdot 10^5)$$$\u00a0\u2014 the length of array $$$a$$$ and the length of array $$$b$$$.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ $$$(1 \\leq a_i \\leq 10^9)$$$\u00a0\u2014 the elements of the array $$$a$$$.<\/p><p>The third line of each test case contains $$$m$$$ integers $$$b_1, b_2, \\ldots, b_m$$$ $$$(1 \\leq b_i \\leq 10^9)$$$\u00a0\u2014 the elements of the array $$$b$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2\\cdot 10^5$$$, and the sum of $$$m$$$ over all test cases does not exceed $$$2\\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output $$$n + m$$$ numbers\u00a0\u2014 the elements of the final array $$$c_1, c_2, \\ldots, c_{n+m}$$$, obtained after the insertion, such that the value of $$$\\text{LIS}(c)$$$ is minimized. If there are several answers, you can output any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">6 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 7 2 4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 4 1 2 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 3 4 5 6 7 8 9<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 3 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">10 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 9 2 3 8 1 4 7 2 9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">7 8 5 4 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">6 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">1 1 1 1 1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">777<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6 5 4\n1 1 7 7 2 2 4 4 5 5\n9 8 7 7 6 5 4 3 2 1\n1 3 5 2 4\n1 9 2 3 8 8 1 4 4 7 7 2 9 6 5\n2 2 1\n777 1 1 1 1 1 1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, $$$\\text{LIS}(a) = \\text{LIS}([6, 4]) = 1$$$. We can insert the number $$$5$$$ between $$$6$$$ and $$$4$$$, then $$$\\text{LIS}(c) = \\text{LIS}([6, 5, 4]) = 1$$$.<\/p><p>In the second test case, $$$\\text{LIS}([\\underline{1}, 7, \\underline{2}, \\underline{4}, \\underline{5}])$$$ = $$$4$$$. After the insertion, $$$c = [1, 1, 7, 7, 2, 2, 4, 4, 5, 5]$$$. It is easy to see that $$$\\text{LIS}(c) = 4$$$. It can be shown that it is impossible to achieve $$$\\text{LIS}(c)$$$ less than $$$4$$$.<\/p><\/div><\/div>"}, {"contestId": 1093, "index": "D", "name": "Beautiful Graph", "rating": 1700, "solvedCount": 11963, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Beautiful Graph<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an undirected unweighted graph consisting of $$$n$$$ vertices and $$$m$$$ edges.<\/p><p>You have to write a number on each vertex of the graph. Each number should be $$$1$$$, $$$2$$$ or $$$3$$$. The graph becomes beautiful if for each edge the sum of numbers on vertices connected by this edge is odd.<\/p><p>Calculate the number of possible ways to write numbers $$$1$$$, $$$2$$$ and $$$3$$$ on vertices so the graph becomes beautiful. Since this number may be large, print it modulo $$$998244353$$$.<\/p><p><span class=\"tex-font-style-bf\">Note that you have to write exactly one number on each vertex<\/span>.<\/p><p>The graph does not have any self-loops or multiple edges.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 3 \\cdot 10^5$$$) \u2014 the number of tests in the input.<\/p><p>The first line of each test contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\le n \\le 3 \\cdot 10^5, 0 \\le m \\le 3 \\cdot 10^5$$$) \u2014 the number of vertices and the number of edges, respectively. Next $$$m$$$ lines describe edges: $$$i$$$-th line contains two integers $$$u_i$$$, $$$ v_i$$$ ($$$1 \\le u_i, v_i \\le n; u_i \\neq v_i$$$) \u2014 indices of vertices connected by $$$i$$$-th edge.<\/p><p>It is guaranteed that $$$\\sum\\limits_{i=1}^{t} n \\le 3 \\cdot 10^5$$$ and $$$\\sum\\limits_{i=1}^{t} m \\le 3 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test print one line, containing one integer \u2014 the number of possible ways to write numbers $$$1$$$, $$$2$$$, $$$3$$$ on the vertices of given graph so it becomes beautiful. Since answers may be large, print them modulo $$$998244353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n2 1\n1 2\n4 6\n1 2\n1 3\n1 4\n2 3\n2 4\n3 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Possible ways to distribute numbers in the first test: <\/p><ol> <li> the vertex $$$1$$$ should contain $$$1$$$, and $$$2$$$ should contain $$$2$$$; <\/li><li> the vertex $$$1$$$ should contain $$$3$$$, and $$$2$$$ should contain $$$2$$$; <\/li><li> the vertex $$$1$$$ should contain $$$2$$$, and $$$2$$$ should contain $$$1$$$; <\/li><li> the vertex $$$1$$$ should contain $$$2$$$, and $$$2$$$ should contain $$$3$$$. <\/li><\/ol><p>In the second test there is no way to distribute numbers.<\/p><\/div><\/div>"}, {"contestId": 559, "index": "B", "name": "Equivalent Strings", "rating": 1700, "solvedCount": 11913, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Equivalent Strings<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Today on a lecture about strings Gerald learned a new definition of string equivalency. Two strings <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span> of equal length are called <span class=\"tex-font-style-it\">equivalent<\/span> in one of the two cases: <\/p><ol> <li> They are equal. <\/li><li> If we split string <span class=\"tex-span\"><i>a<\/i><\/span> into two halves of the same size <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub><\/span> and <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">2<\/sub><\/span>, and string <span class=\"tex-span\"><i>b<\/i><\/span> into two halves of the same size <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\">1<\/sub><\/span> and <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\">2<\/sub><\/span>, then one of the following is correct: <ol> <li> <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub><\/span> is equivalent to <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\">1<\/sub><\/span>, and <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">2<\/sub><\/span> is equivalent to <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\">2<\/sub><\/span> <\/li><li> <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub><\/span> is equivalent to <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\">2<\/sub><\/span>, and <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">2<\/sub><\/span> is equivalent to <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\">1<\/sub><\/span> <\/li><\/ol> <\/li><\/ol><p>As a home task, the teacher gave two strings to his students and asked to determine if they are equivalent.<\/p><p>Gerald has already completed this home task. Now it's your turn!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first two lines of the input contain two strings given by the teacher. Each of them has the length from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\">200\u2009000<\/span> and consists of lowercase English letters. The strings have the same length.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print \"<span class=\"tex-font-style-tt\">YES<\/span>\" (without the quotes), if these two strings are equivalent, and \"<span class=\"tex-font-style-tt\">NO<\/span>\" (without the quotes) otherwise.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>aaba<br/>abaa<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>aabb<br/>abab<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>NO<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample you should split the first string into strings \"<span class=\"tex-font-style-tt\">aa<\/span>\" and \"<span class=\"tex-font-style-tt\">ba<\/span>\", the second one \u2014 into strings \"<span class=\"tex-font-style-tt\">ab<\/span>\" and \"<span class=\"tex-font-style-tt\">aa<\/span>\". \"<span class=\"tex-font-style-tt\">aa<\/span>\" is equivalent to \"<span class=\"tex-font-style-tt\">aa<\/span>\"; \"<span class=\"tex-font-style-tt\">ab<\/span>\" is equivalent to \"<span class=\"tex-font-style-tt\">ba<\/span>\" as \"<span class=\"tex-font-style-tt\">ab<\/span>\" = \"<span class=\"tex-font-style-tt\">a<\/span>\" + \"<span class=\"tex-font-style-tt\">b<\/span>\", \"<span class=\"tex-font-style-tt\">ba<\/span>\" = \"<span class=\"tex-font-style-tt\">b<\/span>\" + \"<span class=\"tex-font-style-tt\">a<\/span>\".<\/p><p>In the second sample the first string can be splitted into strings \"<span class=\"tex-font-style-tt\">aa<\/span>\" and \"<span class=\"tex-font-style-tt\">bb<\/span>\", that are equivalent only to themselves. That's why string \"<span class=\"tex-font-style-tt\">aabb<\/span>\" is equivalent only to itself and to string \"<span class=\"tex-font-style-tt\">bbaa<\/span>\".<\/p><\/div><\/div>"}, {"contestId": 1971, "index": "G", "name": "XOUR", "rating": 1700, "solvedCount": 11904, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. XOUR<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ consisting of $$$n$$$ nonnegative integers. <\/p><p>You can swap the elements at positions $$$i$$$ and $$$j$$$ if $$$a_i~\\mathsf{XOR}~a_j  \\lt  4$$$, where $$$\\mathsf{XOR}$$$ is the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#XOR\">bitwise XOR operation<\/a>.<\/p><p>Find the lexicographically smallest array that can be made with any number of swaps.<\/p><p>An array $$$x$$$ is lexicographically smaller than an array $$$y$$$ if in the first position where $$$x$$$ and $$$y$$$ differ, $$$x_i  \\lt  y_i$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\leq n \\leq 2\\cdot10^5$$$)\u00a0\u2014 the length of the array.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_i$$$ ($$$0 \\leq a_i \\leq 10^9$$$)\u00a0\u2014 the elements of the array.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output $$$n$$$ integers\u00a0\u2014 the lexicographically smallest array that can be made with any number of swaps.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 0 3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 7 1 5 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 1 2 1 2 1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">16 4 1 64<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0 1 2 3 \n1 5 2 6 7 \n1 1 1 1 2 2 2 2 \n16 4 1 64 \n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first test case, you can swap any two elements, so we can produce the sorted array.<\/p><p>For the second test case, you can swap $$$2$$$ and $$$1$$$ (their $$$\\mathsf{XOR}$$$ is $$$3$$$), $$$7$$$ and $$$5$$$ (their $$$\\mathsf{XOR}$$$ is $$$2$$$), and $$$7$$$ and $$$6$$$ (their $$$\\mathsf{XOR}$$$ is $$$1$$$) to get the lexicographically smallest array.<\/p><\/div><\/div>"}, {"contestId": 1335, "index": "E1", "name": "Three Blocks Palindrome (easy version)", "rating": 1700, "solvedCount": 11882, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E1. Three Blocks Palindrome (easy version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">The only difference between easy and hard versions is constraints<\/span>.<\/p><p>You are given a sequence $$$a$$$ consisting of $$$n$$$ positive integers.<\/p><p>Let's define a <span class=\"tex-font-style-bf\">three blocks palindrome<\/span> as the sequence, consisting of <span class=\"tex-font-style-it\">at most two<\/span> distinct elements (let these elements are $$$a$$$ and $$$b$$$, $$$a$$$ can be equal $$$b$$$) and is as follows: $$$[\\underbrace{a, a, \\dots, a}_{x}, \\underbrace{b, b, \\dots, b}_{y}, \\underbrace{a, a, \\dots, a}_{x}]$$$. There $$$x, y$$$ are integers greater than or equal to $$$0$$$. For example, sequences $$$[]$$$, $$$[2]$$$, $$$[1, 1]$$$, $$$[1, 2, 1]$$$, $$$[1, 2, 2, 1]$$$ and $$$[1, 1, 2, 1, 1]$$$ are <span class=\"tex-font-style-bf\">three block palindromes<\/span> but $$$[1, 2, 3, 2, 1]$$$, $$$[1, 2, 1, 2, 1]$$$ and $$$[1, 2]$$$ are not.<\/p><p>Your task is to choose the maximum by length <span class=\"tex-font-style-bf\">subsequence<\/span> of $$$a$$$ that is a <span class=\"tex-font-style-bf\">three blocks palindrome<\/span>.<\/p><p>You have to answer $$$t$$$ independent test cases.<\/p><p>Recall that the sequence $$$t$$$ is a a subsequence of the sequence $$$s$$$ if $$$t$$$ can be derived from $$$s$$$ by removing zero or more elements without changing the order of the remaining elements. For example, if $$$s=[1, 2, 1, 3, 1, 2, 1]$$$, then possible subsequences are: $$$[1, 1, 1, 1]$$$, $$$[3]$$$ and $$$[1, 2, 1, 3, 1, 2, 1]$$$, but not $$$[3, 2, 3]$$$ and $$$[1, 1, 1, 1, 2]$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains one integer $$$t$$$ ($$$1 \\le t \\le 2000$$$) \u2014 the number of test cases. Then $$$t$$$ test cases follow.<\/p><p>The first line of the test case contains one integer $$$n$$$ ($$$1 \\le n \\le 2000$$$) \u2014 the length of $$$a$$$. The second line of the test case contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 26$$$), where $$$a_i$$$ is the $$$i$$$-th element of $$$a$$$. <span class=\"tex-font-style-bf\">Note that the maximum value of $$$a_i$$$ can be up to $$$26$$$<\/span>.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2000$$$ ($$$\\sum n \\le 2000$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print the answer \u2014 the maximum possible length of some subsequence of $$$a$$$ that is a <span class=\"tex-font-style-bf\">three blocks palindrome<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n8\n1 1 2 2 3 2 1 1\n3\n1 3 3\n4\n1 10 10 1\n1\n26\n2\n2 1\n3\n1 1 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n7\n2\n4\n1\n1\n3\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1814, "index": "B", "name": "Long Legs", "rating": 1700, "solvedCount": 11870, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Long Legs<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>A robot is placed in a cell $$$(0, 0)$$$ of an infinite grid. This robot has adjustable length legs. Initially, its legs have length $$$1$$$.<\/p><p>Let the robot currently be in the cell $$$(x, y)$$$ and have legs of length $$$m$$$. In one move, it can perform one of the following three actions: <\/p><ul> <li> jump into the cell $$$(x + m, y)$$$; <\/li><li> jump into the cell $$$(x, y + m)$$$; <\/li><li> increase the length of the legs by $$$1$$$, i.\u2009e. set it to $$$m + 1$$$. <\/li><\/ul><p>What's the smallest number of moves robot has to make to reach a cell $$$(a, b)$$$?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 100$$$)\u00a0\u2014 the number of test cases.<\/p><p>The only line of each test case contains two integers $$$a$$$ and $$$b$$$ ($$$1 \\le a, b \\le 10^9$$$)\u00a0\u2014 the ending cell.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print a single integer\u00a0\u2014 the smallest number of moves the robot is required to make to reach a cell $$$(a, b)$$$ from a cell $$$(0, 0)$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">8 4<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n5\n6\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first testcase, the robot can first jump to $$$(0, 1)$$$, then to $$$(1, 1)$$$. If it ever increases the length of its legs, it will only be able to jump past $$$(1, 1)$$$.<\/p><p>In the second testcase, the robot can jump to $$$(1, 0)$$$, then increase the length of its length to $$$2$$$ and jump three times to reach $$$(1, 6)$$$.<\/p><p>In the third testcase, the robot can increase the length of its legs three times to make it $$$4$$$. Then jump to $$$(0, 4)$$$. Then jump twice to reach $$$(8, 4)$$$.<\/p><\/div><\/div>"}, {"contestId": 1462, "index": "E2", "name": "Close Tuples (hard version)", "rating": 1700, "solvedCount": 11799, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E2. Close Tuples (hard version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is the hard version of this problem. The only difference between the easy and hard versions is the constraints on $$$k$$$ and $$$m$$$. In this version of the problem, you need to output the answer by modulo $$$10^9+7$$$.<\/span><\/p><p>You are given a sequence $$$a$$$ of length $$$n$$$ consisting of integers from $$$1$$$ to $$$n$$$. <span class=\"tex-font-style-bf\">The sequence may contain duplicates (i.e. some elements can be equal)<\/span>.<\/p><p>Find the number of tuples of $$$m$$$ elements such that the maximum number in the tuple differs from the minimum by no more than $$$k$$$. Formally, you need to find the number of tuples of $$$m$$$ indices $$$i_1  \\lt  i_2  \\lt  \\ldots  \\lt  i_m$$$, such that<\/p><p>$$$$$$\\max(a_{i_1}, a_{i_2}, \\ldots, a_{i_m}) - \\min(a_{i_1}, a_{i_2}, \\ldots, a_{i_m}) \\le k.$$$$$$<\/p><p>For example, if $$$n=4$$$, $$$m=3$$$, $$$k=2$$$, $$$a=[1,2,4,3]$$$, then there are two such triples ($$$i=1, j=2, z=4$$$ and $$$i=2, j=3, z=4$$$). If $$$n=4$$$, $$$m=2$$$, $$$k=1$$$, $$$a=[1,1,1,1]$$$, then all six possible pairs are suitable.<\/p><p><span class=\"tex-font-style-bf\">As the result can be very large, you should print the value modulo $$$10^9 + 7$$$ (the remainder when divided by $$$10^9 + 7$$$)<\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of test cases. Then $$$t$$$ test cases follow.<\/p><p>The first line of each test case contains three integers $$$n$$$, $$$m$$$, $$$k$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$, $$$1 \\le m \\le 100$$$, $$$1 \\le k \\le n$$$)\u00a0\u2014 the length of the sequence $$$a$$$, number of elements in the tuples and the maximum difference of elements in the tuple.<\/p><p>The next line contains $$$n$$$ integers $$$a_1, a_2,\\ldots, a_n$$$ ($$$1 \\le a_i \\le n$$$)\u00a0\u2014 the sequence $$$a$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ for all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output $$$t$$$ answers to the given test cases. Each answer is the required number of tuples of $$$m$$$ elements modulo $$$10^9 + 7$$$, such that the maximum value in the tuple differs from the minimum by no more than $$$k$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n4 3 2\n1 2 4 3\n4 2 1\n1 1 1 1\n1 1 1\n1\n10 4 3\n5 6 1 3 2 9 8 1 2 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n6\n1\n20\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1400, "index": "B", "name": "RPG Protagonist", "rating": 1700, "solvedCount": 11779, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. RPG Protagonist<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are playing one RPG from the 2010s. You are planning to raise your smithing skill, so you need as many resources as possible. So how to get resources? By stealing, of course.<\/p><p>You decided to rob a town's blacksmith and you take a follower with you. You can carry at most $$$p$$$ units and your follower\u00a0\u2014 at most $$$f$$$ units.<\/p><p>In the blacksmith shop, you found $$$cnt_s$$$ swords and $$$cnt_w$$$ war axes. Each sword weights $$$s$$$ units and each war axe\u00a0\u2014 $$$w$$$ units. You don't care what to take, since each of them will melt into one steel ingot.<\/p><p>What is the maximum number of weapons (both swords and war axes) you and your follower can carry out from the shop?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains two integers $$$p$$$ and $$$f$$$ ($$$1 \\le p, f \\le 10^9$$$)\u00a0\u2014 yours and your follower's capacities.<\/p><p>The second line of each test case contains two integers $$$cnt_s$$$ and $$$cnt_w$$$ ($$$1 \\le cnt_s, cnt_w \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of swords and war axes in the shop.<\/p><p>The third line of each test case contains two integers $$$s$$$ and $$$w$$$ ($$$1 \\le s, w \\le 10^9$$$)\u00a0\u2014 the weights of each sword and each war axe.<\/p><p>It's guaranteed that the total number of swords and the total number of war axes in all test cases don't exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print the maximum number of weapons (both swords and war axes) you and your follower can carry.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n33 27\n6 10\n5 6\n100 200\n10 10\n5 5\n1 19\n1 3\n19 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n11\n20\n3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case: <\/p><ul> <li> you should take $$$3$$$ swords and $$$3$$$ war axes: $$$3 \\cdot 5 + 3 \\cdot 6 = 33 \\le 33$$$ <\/li><li> and your follower\u00a0\u2014 $$$3$$$ swords and $$$2$$$ war axes: $$$3 \\cdot 5 + 2 \\cdot 6 = 27 \\le 27$$$. <\/li><\/ul> $$$3 + 3 + 3 + 2 = 11$$$ weapons in total.<p>In the second test case, you can take all available weapons even without your follower's help, since $$$5 \\cdot 10 + 5 \\cdot 10 \\le 100$$$.<\/p><p>In the third test case, you can't take anything, but your follower can take $$$3$$$ war axes: $$$3 \\cdot 5 \\le 19$$$.<\/p><\/div><\/div>"}, {"contestId": 1999, "index": "G2", "name": "Ruler (hard version)", "rating": 1700, "solvedCount": 11686, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G2. Ruler (hard version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-it\">This is the hard version of the problem. The only difference between the two versions is that in this version, you can make at most<\/span> $$$\\mathbf{7}$$$ <span class=\"tex-font-style-it\">queries<\/span>.<\/p><p><span class=\"tex-font-style-it\">This is an interactive problem. If you are unsure how interactive problems work, then it is recommended to read <a href=\"https://codeforces.com/blog/entry/45307\">the guide for participants<\/a>.<\/span><\/p><p>We have a secret ruler that is missing one number $$$x$$$ ($$$2 \\leq x \\leq 999$$$). When you measure an object of length $$$y$$$, the ruler reports the following values: <\/p><ul> <li> If $$$y  \\lt  x$$$, the ruler (correctly) measures the object as having length $$$y$$$. <\/li><li> If $$$y \\geq x$$$, the ruler incorrectly measures the object as having length $$$y+1$$$. <\/li><\/ul><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/a98908c8e65eba44622cf7a3ee2ee84099990643.png\" style=\"zoom: 25.0%;max-width: 100.0%;max-height: 100.0%;\"/><p><span class=\"tex-font-size-small\">The ruler above is missing the number $$$4$$$, so it correctly measures the first segment as length $$$3$$$ but incorrectly measures the second segment as length $$$6$$$ even though it is actually $$$5$$$.<\/span> <\/p><\/center><p>You need to find the value of $$$x$$$. To do that, you can make queries of the following form:<\/p><ul> <li> $$$\\texttt{?}~a~b$$$\u00a0\u2014 in response, we will measure the side lengths of an $$$a \\times b$$$ rectangle with our ruler and multiply the results, reporting the measured area of the rectangle back to you. For example, if $$$x=4$$$ and you query a $$$3 \\times 5$$$ rectangle, we will measure its side lengths as $$$3 \\times 6$$$ and report $$$18$$$ back to you. <\/li><\/ul><p>Find the value of $$$x$$$. You can ask at most $$$\\mathbf{7}$$$ queries.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line of input contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 1000$$$)\u00a0\u2014 the number of test cases.<\/p><\/div><div><div class=\"section-title\">Interaction<\/div><p>There is no initial input for each test case. You should begin the interaction by asking a query.<\/p><p>To make a query, output a single line of the form $$$\\texttt{?}~a~b$$$ ($$$1 \\leq a, b \\leq 1000$$$). In response, you will be told the measured area of the rectangle, according to our secret ruler.<\/p><p>When you are ready to print the answer, output a single line of the form $$$\\texttt{!}~x$$$ ($$$2 \\leq x \\leq 999$$$). After that, proceed to process the next test case or terminate the program if it was the last test case. Printing the answer does not count as a query.<\/p><p>The interactor is <span class=\"tex-font-style-bf\">not<\/span> adaptive, meaning that the answer is known before the participant asks the queries and doesn't depend on the queries asked by the participant.<\/p><p>If your program makes more than $$$7$$$ queries for one set of input data, makes an invalid query, or prints the wrong value of $$$x$$$, then <span class=\"tex-font-style-bf\">the response to the query will be<\/span> $$$-1$$$. After receiving such a response, your program should immediately terminate to receive the verdict <span class=\"tex-font-style-tt\">Wrong Answer<\/span>. Otherwise, you can get an arbitrary verdict because your solution will continue to read from a closed stream.<\/p><p>After printing a query do not forget to output the end of line and flush the output. Otherwise, you may get <span class=\"tex-font-style-tt\">Idleness limit exceeded<\/span> verdict. To do this, use: <\/p><ul> <li> <span class=\"tex-font-style-tt\">fflush(stdout)<\/span> or <span class=\"tex-font-style-tt\">cout.flush()<\/span> in C++; <\/li><li> <span class=\"tex-font-style-tt\">System.out.flush()<\/span> in Java; <\/li><li> <span class=\"tex-font-style-tt\">flush(output)<\/span> in Pascal; <\/li><li> <span class=\"tex-font-style-tt\">stdout.flush()<\/span> in Python; <\/li><li> see the documentation for other languages. <\/li><\/ul><p><span class=\"tex-font-style-bf\">Hacks<\/span><\/p><p>To make a hack, use the following format.<\/p><p>The first line should contain a single integer $$$t$$$ ($$$1 \\leq t \\leq 1000$$$)\u00a0\u2014 the number of test cases.<\/p><p>The only line of each test case should contain a single integer $$$x$$$ ($$$2 \\leq x \\leq 999$$$)\u00a0\u2014 the missing number on the ruler.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n\n18\n\n25\n\n\n9999<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n? 3 5\n\n? 4 4\n\n! 4\n? 99 100\n\n! 100<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test, the interaction proceeds as follows.<\/p><center> <table class=\"tex-tabular\"><tbody><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">Solution<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">Jury<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">Explanation<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\texttt{2}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">There are 2 test cases.<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\texttt{? 3 5}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\texttt{18}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">Secretly, the jury picked $$$x=4$$$. The solution requests the $$$3 \\times 5$$$ rectangle, and the jury responds with $$$3 \\times 6 = 18$$$, as described in the statement.<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\texttt{? 4 4}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\texttt{25}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">The solution requests the $$$4 \\times 4$$$ rectangle, which the jury measures as $$$5 \\times 5$$$ and responds with $$$25$$$.<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\texttt{! 4}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">The solution has somehow determined that $$$x=4$$$, and outputs it. Since the output is correct, the jury continues to the next test case.<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\texttt{? 99 100}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\texttt{1}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">Secretly, the jury picked $$$x=100$$$. The solution requests the $$$99 \\times 100$$$ rectangle, which the jury measures as $$$99 \\times 101$$$ and responds with $$$9999$$$.<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\texttt{! 100}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">The solution has somehow determined that $$$x=100$$$, and outputs it. Since the output is correct and there are no more test cases, the jury and the solution exit.<\/td><\/tr><\/tbody><\/table> <\/center><p>Note that the line breaks in the example input and output are for the sake of clarity, and do not occur in the real interaction.<\/p><\/div><\/div>"}, {"contestId": 1983, "index": "D", "name": "Swap Dilemma", "rating": 1700, "solvedCount": 11671, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Swap Dilemma<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Given two arrays of distinct positive integers $$$a$$$ and $$$b$$$ of length $$$n$$$, we would like to make both the arrays the same. Two arrays $$$x$$$ and $$$y$$$ of length $$$k$$$ are said to be the same when for all $$$1 \\le i \\le k$$$, $$$x_i = y_i$$$.<\/p><p>Now in one move, you can choose some index $$$l$$$ and $$$r$$$ in $$$a$$$ ($$$l \\le r$$$) and swap $$$a_l$$$ and $$$a_r$$$, then choose some $$$p$$$ and $$$q$$$ ($$$p \\le q$$$) in $$$b$$$ such that $$$r-l=q-p$$$ and swap $$$b_p$$$ and $$$b_q$$$.<\/p><p>Is it possible to make both arrays the same?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 2 \\cdot 10^4$$$). The description of the test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 10^5$$$)\u00a0\u2014 the length of the arrays $$$a$$$ and $$$b$$$.<\/p><p>The second line of each test case contains $$$n$$$ distinct integers $$$a_1,a_2,a_3,\\ldots,a_n$$$ ($$$1 \\le a_i \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the integers in the array $$$a$$$.<\/p><p>The third line of each test case contains $$$n$$$ distinct integers $$$b_1,b_2,b_3,\\ldots,b_n$$$ ($$$1 \\le b_i \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the integers in the array $$$b$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each testcase, print \"<span class=\"tex-font-style-tt\">YES<\/span>\" if the arrays $$$a$$$ and $$$b$$$ can be made the same. Otherwise, print \"<span class=\"tex-font-style-tt\">NO<\/span>\". can output the answer in any case (upper or lower). For example, the strings \"<span class=\"tex-font-style-tt\">yEs<\/span>\", \"<span class=\"tex-font-style-tt\">yes<\/span>\", \"<span class=\"tex-font-style-tt\">Yes<\/span>\", and \"<span class=\"tex-font-style-tt\">YES<\/span>\" will be recognized as positive responses.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 3 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 3 4 2 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">7 1 2 5 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 3 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 3 2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 3 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 5 7 1000 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4 1 7 5 1000<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">1 4 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">1 3 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nNO\nYES\nNO\nNO\nNO\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first testcase, you don't need to perform any operations since the arrays are same.<\/p><p>In the second testcase, it can be proven there exists no way to make the arrays same.<\/p><p>In the third testcase, one of the ways to make the arrays same is to first choose $$$l=1$$$, $$$r=3$$$, $$$p=1$$$, $$$q=3$$$ then choose $$$l=1$$$, $$$r=2$$$, $$$p=3$$$, $$$q=4$$$.<\/p><\/div><\/div>"}, {"contestId": 1467, "index": "B", "name": "Hills And Valleys", "rating": 1700, "solvedCount": 11636, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Hills And Valleys<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a sequence of $$$n$$$ integers $$$a_1$$$, $$$a_2$$$, ..., $$$a_n$$$. Let us call an index $$$j$$$ ($$$2 \\le j \\le {{n-1}}$$$) a <span class=\"tex-font-style-it\">hill<\/span> if $$$a_j  \\gt  a_{{j+1}}$$$ and $$$a_j  \\gt  a_{{j-1}}$$$; and let us call it a <span class=\"tex-font-style-it\">valley<\/span> if $$$a_j  \\lt  a_{{j+1}}$$$ and $$$a_j  \\lt  a_{{j-1}}$$$.<\/p><p>Let us define the <span class=\"tex-font-style-it\">intimidation value<\/span> of a sequence as the sum of the number of hills and the number of valleys in the sequence. You can change <span class=\"tex-font-style-bf\">exactly one<\/span> integer in the sequence to any number that you want, or let the sequence remain unchanged. What is the minimum <span class=\"tex-font-style-it\">intimidation value<\/span> that you can achieve?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains a single integer $$$t$$$ ($$$1 \\le t \\le 10000$$$) \u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 3\\cdot10^5$$$).<\/p><p>The second line of each test case contains $$$n$$$ space-separated integers $$$a_1$$$, $$$a_2$$$, ..., $$$a_n$$$ ($$$1 \\le a_i \\le 10^9$$$).<\/p>

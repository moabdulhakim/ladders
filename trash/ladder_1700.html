<script>
    const PROBLEMS = [{"contestId": 466, "index": "C", "name": "Number of Ways", "rating": 1700, "solvedCount": 43330, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Number of Ways<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>You've got array <span class=\"tex-span\"><i>a<\/i>[1],\u2009<i>a<\/i>[2],\u2009...,\u2009<i>a<\/i>[<i>n<\/i>]<\/span>, consisting of <span class=\"tex-span\"><i>n<\/i><\/span> integers. Count the number of ways to split all the elements of the array into three contiguous parts so that the sum of elements in each part is the same. <\/p><p>More formally, you need to find the number of such pairs of indices <span class=\"tex-span\"><i>i<\/i>,\u2009<i>j<\/i><\/span> <span class=\"tex-span\">(2\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>j<\/i>\u2009\u2264\u2009<i>n<\/i>\u2009-\u20091)<\/span>, that <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/669a2f09a3b9e143f54b1f1d9fd6b7dddf403680.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integer <span class=\"tex-span\"><i>n<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20095\u00b710<sup class=\"upper-index\">5<\/sup>)<\/span>, showing how many numbers are in the array. The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i>[1]<\/span>, <span class=\"tex-span\"><i>a<\/i>[2]<\/span>, ..., <span class=\"tex-span\"><i>a<\/i>[<i>n<\/i>]<\/span> <span class=\"tex-span\">(|<i>a<\/i>[<i>i<\/i>]|\u2009\u2264\u2009\u200910<sup class=\"upper-index\">9<\/sup>)<\/span> \u2014 the elements of array <span class=\"tex-span\"><i>a<\/i><\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u2014 the number of ways to split the array into three parts with the same sum.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1 2 3 0 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>0 1 -1 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/>4 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 339, "index": "D", "name": "Xenia and Bit Operations", "rating": 1700, "solvedCount": 34481, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Xenia and Bit Operations<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Xenia the beginner programmer has a sequence <span class=\"tex-span\"><i>a<\/i><\/span>, consisting of <span class=\"tex-span\">2<sup class=\"upper-index\"><i>n<\/i><\/sup><\/span> non-negative integers: <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\">2<sup class=\"upper-index\"><i>n<\/i><\/sup><\/sub><\/span>. Xenia is currently studying bit operations. To better understand how they work, Xenia decided to calculate some value <span class=\"tex-span\"><i>v<\/i><\/span> for <span class=\"tex-span\"><i>a<\/i><\/span>.<\/p><p>Namely, it takes several iterations to calculate value <span class=\"tex-span\"><i>v<\/i><\/span>. At the first iteration, Xenia writes a new sequence <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>\u00a0<i>or<\/i>\u00a0<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">3<\/sub>\u00a0<i>or<\/i>\u00a0<i>a<\/i><sub class=\"lower-index\">4<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\">2<sup class=\"upper-index\"><i>n<\/i><\/sup>\u2009-\u20091<\/sub>\u00a0<i>or<\/i>\u00a0<i>a<\/i><sub class=\"lower-index\">2<sup class=\"upper-index\"><i>n<\/i><\/sup><\/sub><\/span>, consisting of <span class=\"tex-span\">2<sup class=\"upper-index\"><i>n<\/i>\u2009-\u20091<\/sup><\/span> elements. In other words, she writes down the bit-wise OR of adjacent elements of sequence <span class=\"tex-span\"><i>a<\/i><\/span>. At the second iteration, Xenia writes the bitwise <span class=\"tex-font-style-bf\">exclusive<\/span> OR of adjacent elements of the sequence obtained after the first iteration. At the third iteration Xenia writes the bitwise OR of the adjacent elements of the sequence obtained after the second iteration. And so on; the operations of bitwise exclusive OR and bitwise OR alternate. In the end, she obtains a sequence consisting of one element, and that element is <span class=\"tex-span\"><i>v<\/i><\/span>.<\/p><p>Let's consider an example. Suppose that sequence <span class=\"tex-span\"><i>a<\/i>\u2009=\u2009(1,\u20092,\u20093,\u20094)<\/span>. Then let's write down all the transformations <span class=\"tex-span\">(1,\u20092,\u20093,\u20094)<\/span> <span class=\"tex-span\">\u2009\u2192\u2009<\/span> <span class=\"tex-span\">(1\u00a0<i>or<\/i>\u00a02\u2009=\u20093,\u20093\u00a0<i>or<\/i>\u00a04\u2009=\u20097)<\/span> <span class=\"tex-span\">\u2009\u2192\u2009<\/span> <span class=\"tex-span\">(3\u00a0<i>xor<\/i>\u00a07\u2009=\u20094)<\/span>. The result is <span class=\"tex-span\"><i>v<\/i>\u2009=\u20094<\/span>.<\/p><p>You are given Xenia's initial sequence. But to calculate value <span class=\"tex-span\"><i>v<\/i><\/span> for a given sequence would be too easy, so you are given additional <span class=\"tex-span\"><i>m<\/i><\/span> queries. Each query is a pair of integers <span class=\"tex-span\"><i>p<\/i>,\u2009<i>b<\/i><\/span>. Query <span class=\"tex-span\"><i>p<\/i>,\u2009<i>b<\/i><\/span> means that you need to perform the assignment <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>p<\/i><\/sub>\u2009=\u2009<i>b<\/i><\/span>. After each query, you need to print the new value <span class=\"tex-span\"><i>v<\/i><\/span> for the new sequence <span class=\"tex-span\"><i>a<\/i><\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200917,\u20091\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>)<\/span>. The next line contains <span class=\"tex-span\">2<sup class=\"upper-index\"><i>n<\/i><\/sup><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\">2<sup class=\"upper-index\"><i>n<\/i><\/sup><\/sub><\/span> <span class=\"tex-span\">(0\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009&lt;\u20092<sup class=\"upper-index\">30<\/sup>)<\/span>. Each of the next <span class=\"tex-span\"><i>m<\/i><\/span> lines contains queries. The <span class=\"tex-span\"><i>i<\/i><\/span>-th line contains integers <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u20092<sup class=\"upper-index\"><i>n<\/i><\/sup>,\u20090\u2009\u2264\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009&lt;\u20092<sup class=\"upper-index\">30<\/sup>)<\/span> \u2014 the <span class=\"tex-span\"><i>i<\/i><\/span>-th query.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>m<\/i><\/span> integers \u2014 the <span class=\"tex-span\"><i>i<\/i><\/span>-th integer denotes value <span class=\"tex-span\"><i>v<\/i><\/span> for sequence <span class=\"tex-span\"><i>a<\/i><\/span> after the <span class=\"tex-span\"><i>i<\/i><\/span>-th query.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 4<br/>1 6 3 5<br/>1 4<br/>3 4<br/>1 2<br/>1 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/>3<br/>3<br/>3<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For more information on the bit operations, you can follow this link: <span class=\"tex-font-style-tt\">http://en.wikipedia.org/wiki/Bitwise_operation<\/span><\/p><\/div><\/div>"}, {"contestId": 474, "index": "D", "name": "Flowers", "rating": 1700, "solvedCount": 32331, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Flowers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>We saw the little game Marmot made for Mole's lunch. Now it's Marmot's dinner time and, as we all know, Marmot eats flowers. At every dinner he eats some red and white flowers. Therefore a dinner can be represented as a sequence of several flowers, some of them white and some of them red.<\/p><p>But, for a dinner to be tasty, there is a rule: Marmot wants to eat white flowers only in groups of size <span class=\"tex-span\"><i>k<\/i><\/span>.<\/p><p>Now Marmot wonders in how many ways he can eat between <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span> flowers. As the number of ways could be very large, print it modulo <span class=\"tex-span\">1000000007<\/span> (<span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097<\/span>).<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Input contains several test cases.<\/p><p>The first line contains two integers <span class=\"tex-span\"><i>t<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>t<\/i>,\u2009<i>k<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>), where <span class=\"tex-span\"><i>t<\/i><\/span> represents the number of test cases.<\/p><p>The next <span class=\"tex-span\"><i>t<\/i><\/span> lines contain two integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>), describing the <span class=\"tex-span\"><i>i<\/i><\/span>-th test.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>t<\/i><\/span> lines to the standard output. The <span class=\"tex-span\"><i>i<\/i><\/span>-th line should contain the number of ways in which Marmot can eat between <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> flowers at dinner modulo <span class=\"tex-span\">1000000007<\/span> (<span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097<\/span>).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 2<br/>1 3<br/>2 3<br/>4 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6<br/>5<br/>5<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><ul> <li> For <span class=\"tex-span\"><i>K<\/i><\/span> = <span class=\"tex-span\">2<\/span> and length <span class=\"tex-span\">1<\/span> Marmot can eat (<span class=\"tex-span\"><i>R<\/i><\/span>). <\/li><li> For <span class=\"tex-span\"><i>K<\/i><\/span> = <span class=\"tex-span\">2<\/span> and length <span class=\"tex-span\">2<\/span> Marmot can eat (<span class=\"tex-span\"><i>RR<\/i><\/span>) and (<span class=\"tex-span\"><i>WW<\/i><\/span>). <\/li><li> For <span class=\"tex-span\"><i>K<\/i><\/span> = <span class=\"tex-span\">2<\/span> and length <span class=\"tex-span\">3<\/span> Marmot can eat (<span class=\"tex-span\"><i>RRR<\/i><\/span>), (<span class=\"tex-span\"><i>RWW<\/i><\/span>) and (<span class=\"tex-span\"><i>WWR<\/i><\/span>). <\/li><li> For <span class=\"tex-span\"><i>K<\/i><\/span> = <span class=\"tex-span\">2<\/span> and length <span class=\"tex-span\">4<\/span> Marmot can eat, for example, (<span class=\"tex-span\"><i>WWWW<\/i><\/span>) or (<span class=\"tex-span\"><i>RWWR<\/i><\/span>), but for example he can't eat (<span class=\"tex-span\"><i>WWWR<\/i><\/span>). <\/li><\/ul><\/div><\/div>"}, {"contestId": 126, "index": "B", "name": "Password", "rating": 1700, "solvedCount": 26459, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Password<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Asterix, Obelix and their temporary buddies Suffix and Prefix has finally found the Harmony temple. However, its doors were firmly locked and even Obelix had no luck opening them.<\/p><p>A little later they found a string <span class=\"tex-span\"><i>s<\/i><\/span>, carved on a rock below the temple's gates. Asterix supposed that that's the password that opens the temple and read the string aloud. However, nothing happened. Then Asterix supposed that a password is some substring <span class=\"tex-span\"><i>t<\/i><\/span> of the string <span class=\"tex-span\"><i>s<\/i><\/span>.<\/p><p>Prefix supposed that the substring <span class=\"tex-span\"><i>t<\/i><\/span> is the beginning of the string <span class=\"tex-span\"><i>s<\/i><\/span>; Suffix supposed that the substring <span class=\"tex-span\"><i>t<\/i><\/span> should be the end of the string <span class=\"tex-span\"><i>s<\/i><\/span>; and Obelix supposed that <span class=\"tex-span\"><i>t<\/i><\/span> should be located somewhere inside the string <span class=\"tex-span\"><i>s<\/i><\/span>, that is, <span class=\"tex-span\"><i>t<\/i><\/span> is neither its beginning, nor its end.<\/p><p>Asterix chose the substring <span class=\"tex-span\"><i>t<\/i><\/span> so as to please all his companions. Besides, from all acceptable variants Asterix chose the longest one (as Asterix loves long strings). When Asterix read the substring <span class=\"tex-span\"><i>t<\/i><\/span> aloud, the temple doors opened. <\/p><p>You know the string <span class=\"tex-span\"><i>s<\/i><\/span>. Find the substring <span class=\"tex-span\"><i>t<\/i><\/span> or determine that such substring does not exist and all that's been written above is just a nice legend.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>You are given the string <span class=\"tex-span\"><i>s<\/i><\/span> whose length can vary from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\">10<sup class=\"upper-index\">6<\/sup><\/span> (inclusive), consisting of small Latin letters.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the string <span class=\"tex-span\"><i>t<\/i><\/span>. If a suitable <span class=\"tex-span\"><i>t<\/i><\/span> string does not exist, then print \"<span class=\"tex-font-style-tt\">Just a legend<\/span>\" without the quotes.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>fixprefixsuffix<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>fix<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>abcdabc<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>Just a legend<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 977, "index": "F", "name": "Consecutive Subsequence", "rating": 1700, "solvedCount": 26448, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Consecutive Subsequence<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an integer array of length $$$n$$$.<\/p><p>You have to choose some subsequence of this array of maximum length such that this subsequence forms a increasing sequence of consecutive integers. In other words the required sequence should be equal to $$$[x, x + 1, \\dots, x + k - 1]$$$ for some value $$$x$$$ and length $$$k$$$.<\/p><p>Subsequence of an array can be obtained by erasing some (possibly zero) elements from the array. You can erase any elements, not necessarily going successively. The remaining elements preserve their order. For example, for the array $$$[5, 3, 1, 2, 4]$$$ the following arrays are subsequences: $$$[3]$$$, $$$[5, 3, 1, 2, 4]$$$, $$$[5, 1, 4]$$$, but the array $$$[1, 3]$$$ is not.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input containing integer number $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$) \u2014 the length of the array. The second line of the input containing $$$n$$$ integer numbers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$) \u2014 the array itself.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>On the first line print $$$k$$$ \u2014 the maximum length of the subsequence of the given array that forms an increasing sequence of consecutive integers.<\/p><p>On the second line print the sequence of the indices of the <span class=\"tex-font-style-bf\">any<\/span> maximum length subsequence of the given array that forms an increasing sequence of consecutive integers.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>7<br/>3 3 4 7 5 6 8<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/>2 3 5 6 <br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>6<br/>1 3 5 2 4 6<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/>1 4 <br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>10 9 8 7<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/>1 <br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>9<br/>6 7 8 3 4 5 9 10 11<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6<br/>1 2 3 7 8 9 <br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>All valid answers for the first example (as sequences of indices): <\/p><ul> <li> $$$[1, 3, 5, 6]$$$ <\/li><li> $$$[2, 3, 5, 6]$$$ <\/li><\/ul><p>All valid answers for the second example: <\/p><ul> <li> $$$[1, 4]$$$ <\/li><li> $$$[2, 5]$$$ <\/li><li> $$$[3, 6]$$$ <\/li><\/ul><p>All valid answers for the third example: <\/p><ul> <li> $$$[1]$$$ <\/li><li> $$$[2]$$$ <\/li><li> $$$[3]$$$ <\/li><li> $$$[4]$$$ <\/li><\/ul><p>All valid answers for the fourth example: <\/p><ul> <li> $$$[1, 2, 3, 7, 8, 9]$$$ <\/li><\/ul><\/div><\/div>"}, {"contestId": 1365, "index": "D", "name": "Solve The Maze", "rating": 1700, "solvedCount": 21640, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Solve The Maze<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Vivek has encountered a problem. He has a maze that can be represented as an $$$n \\times m$$$ grid. Each of the grid cells may represent the following:<\/p><ul> <li> Empty\u00a0\u2014 '<span class=\"tex-font-style-tt\">.<\/span>' <\/li><li> Wall\u00a0\u2014 '<span class=\"tex-font-style-tt\">#<\/span>' <\/li><li> Good person \u00a0\u2014 '<span class=\"tex-font-style-tt\">G<\/span>' <\/li><li> Bad person\u00a0\u2014 '<span class=\"tex-font-style-tt\">B<\/span>' <\/li><\/ul><p>The only escape from the maze is at cell $$$(n, m)$$$.<\/p><p>A person can move to a cell only if it shares a side with their current cell and does not contain a wall. Vivek wants to block some of the empty cells by replacing them with walls in such a way, that all the good people are able to escape, while none of the bad people are able to. A cell that initially contains '<span class=\"tex-font-style-tt\">G<\/span>' or '<span class=\"tex-font-style-tt\">B<\/span>' <span class=\"tex-font-style-bf\">cannot be blocked<\/span> and <span class=\"tex-font-style-bf\">can be travelled through<\/span>.<\/p><p>Help him determine if there exists a way to replace some (zero or more) empty cells with walls to satisfy the above conditions.<\/p><p><span class=\"tex-font-style-bf\">It is guaranteed that the cell $$$(n,m)$$$ is empty.<\/span> Vivek can also block this cell.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ $$$(1 \\le t \\le 100)$$$\u00a0\u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains two integers $$$n$$$, $$$m$$$ $$$(1 \\le n, m \\le 50)$$$\u00a0\u2014 the number of rows and columns in the maze.<\/p><p>Each of the next $$$n$$$ lines contain $$$m$$$ characters. They describe the layout of the maze. If a character on a line equals '<span class=\"tex-font-style-tt\">.<\/span>', the corresponding cell is empty. If it equals '<span class=\"tex-font-style-tt\">#<\/span>', the cell has a wall. '<span class=\"tex-font-style-tt\">G<\/span>' corresponds to a good person and '<span class=\"tex-font-style-tt\">B<\/span>' corresponds to a bad person.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print \"<span class=\"tex-font-style-tt\">Yes<\/span>\" if there exists a way to replace some empty cells with walls to satisfy the given conditions. Otherwise print \"<span class=\"tex-font-style-tt\">No<\/span>\"<\/p><p>You may print every letter in any case (upper or lower).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n1 1\n.\n1 2\nG.\n2 2\n#B\nG.\n2 3\nG.#\nB#.\n3 3\n#B.\n#..\nGG.\n2 2\n#B\nB.\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYes\nYes\nNo\nNo\nYes\nYes\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first and second test cases, all conditions are already satisfied.<\/p><p>For the third test case, there is only one empty cell $$$(2,2)$$$, and if it is replaced with a wall then the good person at $$$(1,2)$$$ will not be able to escape.<\/p><p>For the fourth test case, the good person at $$$(1,1)$$$ cannot escape.<\/p><p>For the fifth test case, Vivek can block the cells $$$(2,3)$$$ and $$$(2,2)$$$.<\/p><p>For the last test case, Vivek can block the destination cell $$$(2, 2)$$$.<\/p><\/div><\/div>"}, {"contestId": 118, "index": "D", "name": "Caesar's Legions", "rating": 1700, "solvedCount": 21417, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Caesar's Legions<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Gaius Julius Caesar, a famous general, loved to line up his soldiers. Overall the army had <span class=\"tex-span\"><i>n<\/i><sub class=\"lower-index\">1<\/sub><\/span> footmen and <span class=\"tex-span\"><i>n<\/i><sub class=\"lower-index\">2<\/sub><\/span> horsemen. Caesar thought that an arrangement is <span class=\"tex-font-style-bf\">not<\/span> beautiful if somewhere in the line there are strictly more that <span class=\"tex-span\"><i>k<\/i><sub class=\"lower-index\">1<\/sub><\/span> footmen standing successively one after another, or there are strictly more than <span class=\"tex-span\"><i>k<\/i><sub class=\"lower-index\">2<\/sub><\/span> horsemen standing successively one after another. Find the number of <span class=\"tex-font-style-underline\">beautiful<\/span> arrangements of the soldiers. <\/p><p>Note that all <span class=\"tex-span\"><i>n<\/i><sub class=\"lower-index\">1<\/sub>\u2009+\u2009<i>n<\/i><sub class=\"lower-index\">2<\/sub><\/span> warriors should be present at each arrangement. All footmen are considered indistinguishable among themselves. Similarly, all horsemen are considered indistinguishable among themselves.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line contains four space-separated integers <span class=\"tex-span\"><i>n<\/i><sub class=\"lower-index\">1<\/sub><\/span>, <span class=\"tex-span\"><i>n<\/i><sub class=\"lower-index\">2<\/sub><\/span>, <span class=\"tex-span\"><i>k<\/i><sub class=\"lower-index\">1<\/sub><\/span>, <span class=\"tex-span\"><i>k<\/i><sub class=\"lower-index\">2<\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>n<\/i><sub class=\"lower-index\">2<\/sub>\u2009\u2264\u2009100,\u20091\u2009\u2264\u2009<i>k<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>k<\/i><sub class=\"lower-index\">2<\/sub>\u2009\u2264\u200910<\/span>) which represent how many footmen and horsemen there are and the largest acceptable number of footmen and horsemen standing in succession, correspondingly.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the number of beautiful arrangements of the army modulo <span class=\"tex-span\">100000000<\/span> <span class=\"tex-span\">(10<sup class=\"upper-index\">8<\/sup>)<\/span>. That is, print the number of such ways to line up the soldiers, that no more than <span class=\"tex-span\"><i>k<\/i><sub class=\"lower-index\">1<\/sub><\/span> footmen stand successively, and no more than <span class=\"tex-span\"><i>k<\/i><sub class=\"lower-index\">2<\/sub><\/span> horsemen stand successively.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 1 1 10<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 3 1 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>5<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 4 1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Let's mark a footman as <span class=\"tex-font-style-tt\">1<\/span>, and a horseman as <span class=\"tex-font-style-tt\">2<\/span>.<\/p><p>In the first sample the only beautiful line-up is: <span class=\"tex-font-style-tt\">121<\/span><\/p><p>In the second sample 5 beautiful line-ups exist: <span class=\"tex-font-style-tt\">12122<\/span>, <span class=\"tex-font-style-tt\">12212<\/span>, <span class=\"tex-font-style-tt\">21212<\/span>, <span class=\"tex-font-style-tt\">21221<\/span>, <span class=\"tex-font-style-tt\">22121<\/span><\/p><\/div><\/div>"}, {"contestId": 1037, "index": "D", "name": "Valid BFS?", "rating": 1700, "solvedCount": 20681, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Valid BFS?<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>The <a href=\"https://en.wikipedia.org/wiki/Breadth-first_search\">BFS<\/a> algorithm is defined as follows.<\/p><ol> <li> Consider an undirected graph with vertices numbered from $$$1$$$ to $$$n$$$. Initialize $$$q$$$ as a new <a href=\"http://gg.gg/queue_en\">queue<\/a> containing only vertex $$$1$$$, mark the vertex $$$1$$$ as used. <\/li><li> Extract a vertex $$$v$$$ from the head of the queue $$$q$$$. <\/li><li> Print the index of vertex $$$v$$$. <\/li><li> Iterate in arbitrary order through all such vertices $$$u$$$ that $$$u$$$ is a neighbor of $$$v$$$ and is not marked yet as used. Mark the vertex $$$u$$$ as used and insert it into the tail of the queue $$$q$$$. <\/li><li> If the queue is not empty, continue from step <span class=\"tex-font-style-tt\">2<\/span>. <\/li><li> Otherwise finish. <\/li><\/ol><p>Since the order of choosing neighbors of each vertex can vary, it turns out that there may be multiple sequences which <span class=\"tex-font-style-tt\">BFS<\/span> can print.<\/p><p>In this problem you need to check whether a given sequence corresponds to some valid <span class=\"tex-font-style-tt\">BFS<\/span> traversal of the given tree <span class=\"tex-font-style-bf\">starting from vertex $$$1$$$<\/span>. The <a href=\"http://gg.gg/tree_en\">tree<\/a> is an undirected graph, such that there is exactly one simple path between any two vertices.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$) which denotes the number of nodes in the tree. <\/p><p>The following $$$n - 1$$$ lines describe the edges of the tree. Each of them contains two integers $$$x$$$ and $$$y$$$ ($$$1 \\le x, y \\le n$$$)\u00a0\u2014 the endpoints of the corresponding edge of the tree. It is guaranteed that the given graph is a tree.<\/p><p>The last line contains $$$n$$$ distinct integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le n$$$)\u00a0\u2014 the sequence to check.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print \"<span class=\"tex-font-style-tt\">Yes<\/span>\" (quotes for clarity) if the sequence corresponds to some valid <span class=\"tex-font-style-tt\">BFS<\/span> traversal of the given tree and \"<span class=\"tex-font-style-tt\">No<\/span>\" (quotes for clarity) otherwise.<\/p><p>You can print each letter in any case (upper or lower).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>1 2<br/>1 3<br/>2 4<br/>1 2 3 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>Yes<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>1 2<br/>1 3<br/>2 4<br/>1 2 4 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>No<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Both sample tests have the same tree in them.<\/p><p>In this tree, there are two valid <span class=\"tex-font-style-tt\">BFS<\/span> orderings: <\/p><ul> <li> $$$1, 2, 3, 4$$$, <\/li><li> $$$1, 3, 2, 4$$$. <\/li><\/ul><p>The ordering $$$1, 2, 4, 3$$$ doesn't correspond to any valid <span class=\"tex-font-style-tt\">BFS<\/span> order.<\/p><\/div><\/div>"}, {"contestId": 295, "index": "B", "name": "Greg and Graph", "rating": 1700, "solvedCount": 18906, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Greg and Graph<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Greg has a weighed directed graph, consisting of <span class=\"tex-span\"><i>n<\/i><\/span> vertices. In this graph any pair of distinct vertices has an edge between them in both directions. Greg loves playing with the graph and now he has invented a new game:<\/p><ul> <li> The game consists of <span class=\"tex-span\"><i>n<\/i><\/span> steps. <\/li><li> On the <span class=\"tex-span\"><i>i<\/i><\/span>-th step Greg removes vertex number <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> from the graph. As Greg removes a vertex, he also removes all the edges that go in and out of this vertex. <\/li><li> Before executing each step, Greg wants to know the sum of lengths of the shortest paths between all pairs of the remaining vertices. The shortest path can go through any remaining vertex. In other words, if we assume that <span class=\"tex-span\"><i>d<\/i>(<i>i<\/i>,\u2009<i>v<\/i>,\u2009<i>u<\/i>)<\/span> is the shortest path between vertices <span class=\"tex-span\"><i>v<\/i><\/span> and <span class=\"tex-span\"><i>u<\/i><\/span> in the graph that formed before deleting vertex <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, then Greg wants to know the value of the following sum: <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/90b01d654bf6bf2750396d13f2082c090a85368a.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>. <\/li><\/ul><p>Help Greg, print the value of the required sum before each step.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integer <span class=\"tex-span\"><i>n<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009500)<\/span> \u2014 the number of vertices in the graph.<\/p><p>Next <span class=\"tex-span\"><i>n<\/i><\/span> lines contain <span class=\"tex-span\"><i>n<\/i><\/span> integers each \u2014 the graph adjacency matrix: the <span class=\"tex-span\"><i>j<\/i><\/span>-th number in the <span class=\"tex-span\"><i>i<\/i><\/span>-th line <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>ij<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>ij<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>,\u2009<i>a<\/i><sub class=\"lower-index\"><i>ii<\/i><\/sub>\u2009=\u20090)<\/span> represents the weight of the edge that goes from vertex <span class=\"tex-span\"><i>i<\/i><\/span> to vertex <span class=\"tex-span\"><i>j<\/i><\/span>.<\/p><p>The next line contains <span class=\"tex-span\"><i>n<\/i><\/span> distinct integers: <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>x<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>x<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>)<\/span> \u2014 the vertices that Greg deletes.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>n<\/i><\/span> integers \u2014 the <span class=\"tex-span\"><i>i<\/i><\/span>-th number equals the required sum before the <span class=\"tex-span\"><i>i<\/i><\/span>-th step.<\/p><p>Please, do not use the <span class=\"tex-font-style-tt\">%lld<\/span> specifier to read or write 64-bit integers in <span class=\"tex-font-style-it\">C++<\/span>. It is preferred to use the <span class=\"tex-font-style-tt\">cin<\/span>, <span class=\"tex-font-style-tt\">cout<\/span> streams of the <span class=\"tex-font-style-tt\">%I64d<\/span> specifier.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>1<br/>0<br/>1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0 <\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/>0 5<br/>4 0<br/>1 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>9 0 <\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>0 3 1 1<br/>6 0 400 1<br/>2 4 0 1<br/>1 1 1 0<br/>4 1 2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>17 23 404 0 <\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 427, "index": "C", "name": "Checkposts", "rating": 1700, "solvedCount": 17924, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Checkposts<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Your city has <span class=\"tex-span\"><i>n<\/i><\/span> junctions. There are <span class=\"tex-span\"><i>m<\/i><\/span> <span class=\"tex-font-style-bf\">one-way<\/span> roads between the junctions. As a mayor of the city, you have to ensure the security of all the junctions.<\/p><p>To ensure the security, you have to build some police checkposts. Checkposts can only be built in a junction. A checkpost at junction <span class=\"tex-span\"><i>i<\/i><\/span> can protect junction <span class=\"tex-span\"><i>j<\/i><\/span> if either <span class=\"tex-span\"><i>i<\/i>\u2009=\u2009<i>j<\/i><\/span> or the police patrol car can go to <span class=\"tex-span\"><i>j<\/i><\/span> from <span class=\"tex-span\"><i>i<\/i><\/span> and then come back to <span class=\"tex-span\"><i>i<\/i><\/span>.<\/p><p>Building checkposts costs some money. As some areas of the city are more expensive than others, building checkpost at some junctions might cost more money than other junctions.<\/p><p>You have to determine the minimum possible money needed to ensure the security of all the junctions. Also you have to find the number of ways to ensure the security in minimum price and <span class=\"tex-font-style-bf\">in addition in minimum number of checkposts<\/span>. Two ways are different if any of the junctions contains a checkpost in one of them and do not contain in the other.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>In the first line, you will be given an integer <span class=\"tex-span\"><i>n<\/i><\/span>, number of junctions <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>)<\/span>. In the next line, <span class=\"tex-span\"><i>n<\/i><\/span> space-separated integers will be given. The <span class=\"tex-span\"><i>i<\/i><sup class=\"upper-index\"><i>th<\/i><\/sup><\/span> integer is the cost of building checkpost at the <span class=\"tex-span\"><i>i<\/i><sup class=\"upper-index\"><i>th<\/i><\/sup><\/span> junction (costs will be non-negative and will not exceed <span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup><\/span>).<\/p><p>The next line will contain an integer <span class=\"tex-span\"><i>m<\/i>\u00a0(0\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u20093\u00b710<sup class=\"upper-index\">5<\/sup>)<\/span>. And each of the next <span class=\"tex-span\"><i>m<\/i><\/span> lines contains two integers <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u00a0(1\u2009\u2264\u2009<i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>;\u00a0<i>u<\/i>\u2009\u2260\u2009<i>v<\/i>)<\/span>. A pair <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> means, that there is a one-way road which goes from <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> to <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. There will not be more than one road between two nodes in the same direction.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print two integers separated by spaces. The first one is the minimum possible money needed to ensure the security of all the junctions. And the second one is the number of ways you can ensure the security modulo <span class=\"tex-span\">1000000007<\/span> <span class=\"tex-span\">(10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097)<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>1 2 3<br/>3<br/>1 2<br/>2 3<br/>3 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3 1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>2 8 0 6 0<br/>6<br/>1 4<br/>1 3<br/>2 4<br/>3 4<br/>4 5<br/>5 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>8 2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>10<br/>1 3 2 2 1 3 1 4 10 10<br/>12<br/>1 2<br/>2 3<br/>3 1<br/>3 4<br/>4 5<br/>5 6<br/>5 7<br/>6 4<br/>7 3<br/>8 9<br/>9 10<br/>10 9<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>15 6<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/>7 91<br/>2<br/>1 2<br/>2 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>7 1<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1324, "index": "E", "name": "Sleeping Schedule", "rating": 1700, "solvedCount": 17886, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Sleeping Schedule<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Vova had a pretty weird sleeping schedule. There are $$$h$$$ hours in a day. Vova will sleep exactly $$$n$$$ times. The $$$i$$$-th time he will sleep exactly after $$$a_i$$$ hours from the time he woke up. You can assume that Vova woke up exactly at the beginning of this story (the initial time is $$$0$$$). Each time Vova sleeps <span class=\"tex-font-style-bf\">exactly one day<\/span> (in other words, $$$h$$$ hours).<\/p><p>Vova thinks that the $$$i$$$-th sleeping time is <span class=\"tex-font-style-bf\">good<\/span> if he starts to sleep between hours $$$l$$$ and $$$r$$$ inclusive.<\/p><p>Vova can control himself and before the $$$i$$$-th time can choose between two options: go to sleep after $$$a_i$$$ hours or after $$$a_i - 1$$$ hours.<\/p><p>Your task is to say the maximum number of <span class=\"tex-font-style-bf\">good<\/span> sleeping times Vova can obtain if he acts optimally.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains four integers $$$n, h, l$$$ and $$$r$$$ ($$$1 \\le n \\le 2000, 3 \\le h \\le 2000, 0 \\le l \\le r  \\lt  h$$$) \u2014 the number of times Vova goes to sleep, the number of hours in a day and the segment of the <span class=\"tex-font-style-bf\">good<\/span> sleeping time.<\/p><p>The second line of the input contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i  \\lt  h$$$), where $$$a_i$$$ is the number of hours after which Vova goes to sleep the $$$i$$$-th time.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the maximum number of <span class=\"tex-font-style-bf\">good<\/span> sleeping times Vova can obtain if he acts optimally.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7 24 21 23\n16 17 14 20 20 11 22\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The maximum number of <span class=\"tex-font-style-bf\">good<\/span> times in the example is $$$3$$$.<\/p><p>The story starts from $$$t=0$$$. Then Vova goes to sleep after $$$a_1 - 1$$$ hours, now the time is $$$15$$$. This time is not good. Then Vova goes to sleep after $$$a_2 - 1$$$ hours, now the time is $$$15 + 16 = 7$$$. This time is also not good. Then Vova goes to sleep after $$$a_3$$$ hours, now the time is $$$7 + 14 = 21$$$. This time is <span class=\"tex-font-style-bf\">good<\/span>. Then Vova goes to sleep after $$$a_4 - 1$$$ hours, now the time is $$$21 + 19 = 16$$$. This time is not good. Then Vova goes to sleep after $$$a_5$$$ hours, now the time is $$$16 + 20 = 12$$$. This time is not good. Then Vova goes to sleep after $$$a_6$$$ hours, now the time is $$$12 + 11 = 23$$$. This time is <span class=\"tex-font-style-bf\">good<\/span>. Then Vova goes to sleep after $$$a_7$$$ hours, now the time is $$$23 + 22 = 21$$$. This time is also <span class=\"tex-font-style-bf\">good<\/span>.<\/p><\/div><\/div>"}, {"contestId": 467, "index": "C", "name": "George and Job", "rating": 1700, "solvedCount": 17135, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. George and Job<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>The new ITone 6 has been released recently and George got really keen to buy it. Unfortunately, he didn't have enough money, so George was going to work as a programmer. Now he faced the following problem at the work.<\/p><p>Given a sequence of <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>p<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>p<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span>. You are to choose <span class=\"tex-span\"><i>k<\/i><\/span> pairs of integers:<\/p><p> <\/p><center class=\"tex-equation\"><span class=\"tex-span\">[<i>l<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>r<\/i><sub class=\"lower-index\">1<\/sub>],\u2009[<i>l<\/i><sub class=\"lower-index\">2<\/sub>,\u2009<i>r<\/i><sub class=\"lower-index\">2<\/sub>],\u2009...,\u2009[<i>l<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>,\u2009<i>r<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>]\u00a0(1\u2009\u2264\u2009<i>l<\/i><sub class=\"lower-index\">1<\/sub>\u2009\u2264\u2009<i>r<\/i><sub class=\"lower-index\">1<\/sub>\u2009&lt;\u2009<i>l<\/i><sub class=\"lower-index\">2<\/sub>\u2009\u2264\u2009<i>r<\/i><sub class=\"lower-index\">2<\/sub>\u2009&lt;\u2009...\u2009&lt;\u2009<i>l<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>\u2009\u2264\u2009<i>r<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>;\u00a0<i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009-\u2009<i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009+\u20091\u2009=\u2009<i>m<\/i>),\u2009<\/span><\/center><p>in such a way that the value of sum <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/56a872d240fd0705aaee49aa3763026a40df8f6c.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> is maximal possible. Help George to cope with the task.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains three integers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>m<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009(<i>m<\/i>\u2009\u00d7\u2009<i>k<\/i>)\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20095000)<\/span>. The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>p<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>p<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> <span class=\"tex-span\">(0\u2009\u2264\u2009<i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup>)<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print an integer in a single line \u2014 the maximum possible value of sum.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 2 1<br/>1 2 3 4 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>9<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>7 1 3<br/>2 10 7 18 5 33 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>61<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 276, "index": "D", "name": "Little Girl and Maximum XOR", "rating": 1700, "solvedCount": 16973, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Little Girl and Maximum XOR<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>A little girl loves problems on bitwise operations very much. Here's one of them.<\/p><p>You are given two integers <span class=\"tex-span\"><i>l<\/i><\/span> and <span class=\"tex-span\"><i>r<\/i><\/span>. Let's consider the values of <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/9b77fab607849cb208cd8aab633b62d894fc3358.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> for all pairs of integers <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span> <span class=\"tex-span\">(<i>l<\/i>\u2009\u2264\u2009<i>a<\/i>\u2009\u2264\u2009<i>b<\/i>\u2009\u2264\u2009<i>r<\/i>)<\/span>. Your task is to find the maximum value among all considered ones.<\/p><p>Expression <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/b364f2e04c665b78b924ec10666327a4ef4635bc.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> means applying bitwise excluding or operation to integers <span class=\"tex-span\"><i>x<\/i><\/span> and <span class=\"tex-span\"><i>y<\/i><\/span>. The given operation exists in all modern programming languages, for example, in languages <span class=\"tex-span\"><i>C<\/i><\/span>++ and <span class=\"tex-span\"><i>Java<\/i><\/span> it is represented as \"<span class=\"tex-font-style-tt\">^<\/span>\", in <span class=\"tex-span\"><i>Pascal<\/i><\/span> \u2014 as \"<span class=\"tex-font-style-tt\">xor<\/span>\".<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The single line contains space-separated integers <span class=\"tex-span\"><i>l<\/i><\/span> and <span class=\"tex-span\"><i>r<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">18<\/sup><\/span>).<\/p><p>Please, do not use the <span class=\"tex-font-style-tt\">%lld<\/span> specifier to read or write 64-bit integers in C++. It is preferred to use the <span class=\"tex-font-style-tt\">cin<\/span>, <span class=\"tex-font-style-tt\">cout<\/span> streams or the <span class=\"tex-font-style-tt\">%I64d<\/span> specifier.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In a single line print a single integer \u2014 the maximum value of <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/9b77fab607849cb208cd8aab633b62d894fc3358.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> for all pairs of integers <span class=\"tex-span\"><i>a<\/i><\/span>, <span class=\"tex-span\"><i>b<\/i><\/span> <span class=\"tex-span\">(<i>l<\/i>\u2009\u2264\u2009<i>a<\/i>\u2009\u2264\u2009<i>b<\/i>\u2009\u2264\u2009<i>r<\/i>)<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>1 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>8 16<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>31<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1826, "index": "D", "name": "Running Miles", "rating": 1700, "solvedCount": 16141, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Running Miles<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There is a street with $$$n$$$ sights, with sight number $$$i$$$ being $$$i$$$ miles from the beginning of the street. Sight number $$$i$$$ has beauty $$$b_i$$$. You want to start your morning jog $$$l$$$ miles and end it $$$r$$$ miles from the beginning of the street. By the time you run, you will see sights you run by (including sights at $$$l$$$ and $$$r$$$ miles from the start). You are interested in the $$$3$$$ most beautiful sights along your jog, but every mile you run, you get more and more tired.<\/p><p>So choose $$$l$$$ and $$$r$$$, such that there are at least $$$3$$$ sights you run by, and the sum of beauties of the $$$3$$$ most beautiful sights minus the distance in miles you have to run is maximized. More formally, choose $$$l$$$ and $$$r$$$, such that $$$b_{i_1} + b_{i_2} + b_{i_3} - (r - l)$$$ is maximum possible, where $$$i_1, i_2, i_3$$$ are the indices of the three maximum elements in range $$$[l, r]$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 10^5$$$) \u2014 the number of test cases.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$3 \\leq n \\leq 10^5$$$).<\/p><p>The second line of each test case contains $$$n$$$ integers $$$b_i$$$ ($$$1 \\leq b_i \\leq 10^8$$$) \u2014 beauties of sights $$$i$$$ miles from the beginning of the street.<\/p><p>It's guaranteed that the sum of all $$$n$$$ does not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case output a single integer equal to the maximum value $$$b_{i_1} + b_{i_2} + b_{i_3} - (r - l)$$$ for some running range $$$[l, r]$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 1 4 2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 1 1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">9 8 7 6 5 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">7<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">100000000 1 100000000 1 100000000 1 100000000<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n8\n1\n22\n299999996\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, we can choose $$$l$$$ and $$$r$$$ to be $$$1$$$ and $$$5$$$. So we visit all the sights and the three sights with the maximum beauty are the sights with indices $$$1$$$, $$$3$$$, and $$$5$$$ with beauties $$$5$$$, $$$4$$$, and $$$3$$$, respectively. So the total value is $$$5 + 4 + 3 - (5 - 1) = 8$$$.<\/p><p>In the second example, the range $$$[l, r]$$$ can be $$$[1, 3]$$$ or $$$[2, 4]$$$, the total value is $$$1 + 1 + 1 - (3 - 1) = 1$$$.<\/p><\/div><\/div>"}, {"contestId": 1538, "index": "D", "name": "Another Problem About Dividing Numbers", "rating": 1700, "solvedCount": 15646, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Another Problem About Dividing Numbers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given two integers $$$a$$$ and $$$b$$$. In one turn, you can do one of the following operations: <\/p><ul> <li> Take an integer $$$c$$$ ($$$c  \\gt  1$$$ and <span class=\"tex-font-style-bf\">$$$a$$$ should be divisible by $$$c$$$<\/span>) and replace $$$a$$$ with $$$\\frac{a}{c}$$$; <\/li><li> Take an integer $$$c$$$ ($$$c  \\gt  1$$$ and <span class=\"tex-font-style-bf\">$$$b$$$ should be divisible by $$$c$$$<\/span>) and replace $$$b$$$ with $$$\\frac{b}{c}$$$. <\/li><\/ul><p>Your goal is to make $$$a$$$ equal to $$$b$$$ using exactly $$$k$$$ turns.<\/p><p>For example, the numbers $$$a=36$$$ and $$$b=48$$$ can be made equal in $$$4$$$ moves: <\/p><ul> <li> $$$c=6$$$, divide $$$b$$$ by $$$c$$$ $$$\\Rightarrow$$$ $$$a=36$$$, $$$b=8$$$; <\/li><li> $$$c=2$$$, divide $$$a$$$ by $$$c$$$ $$$\\Rightarrow$$$ $$$a=18$$$, $$$b=8$$$; <\/li><li> $$$c=9$$$, divide $$$a$$$ by $$$c$$$ $$$\\Rightarrow$$$ $$$a=2$$$, $$$b=8$$$; <\/li><li> $$$c=4$$$, divide $$$b$$$ by $$$c$$$ $$$\\Rightarrow$$$ $$$a=2$$$, $$$b=2$$$. <\/li><\/ul><p>For the given numbers $$$a$$$ and $$$b$$$, determine whether it is possible to make them equal using exactly $$$k$$$ turns.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$). Then $$$t$$$ test cases follow.<\/p><p>Each test case is contains three integers $$$a$$$, $$$b$$$ and $$$k$$$ ($$$1 \\le a, b, k \\le 10^9$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case output: <\/p><ul> <li> \"<span class=\"tex-font-style-tt\">Yes<\/span>\", if it is possible to make the numbers $$$a$$$ and $$$b$$$ equal in <span class=\"tex-font-style-bf\">exactly<\/span> $$$k$$$ turns; <\/li><li> \"<span class=\"tex-font-style-tt\">No<\/span>\" otherwise. <\/li><\/ul><p>The strings \"<span class=\"tex-font-style-tt\">Yes<\/span>\" and \"<span class=\"tex-font-style-tt\">No<\/span>\" can be output in any case.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n8\n36 48 2\n36 48 3\n36 48 4\n2 8 1\n2 8 2\n1000000000 1000000000 1000000000\n1 2 1\n2 2 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nYES\nYES\nYES\nYES\nNO\nYES\nNO\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1359, "index": "C", "name": "Mixing Water", "rating": 1700, "solvedCount": 15613, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Mixing Water<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are two infinite sources of water:<\/p><ul> <li> hot water of temperature $$$h$$$; <\/li><li> cold water of temperature $$$c$$$ ($$$c  \\lt  h$$$). <\/li><\/ul><p>You perform the following procedure of alternating moves:<\/p><ol> <li> take <span class=\"tex-font-style-bf\">one<\/span> cup of the <span class=\"tex-font-style-bf\">hot<\/span> water and pour it into an infinitely deep barrel; <\/li><li> take <span class=\"tex-font-style-bf\">one<\/span> cup of the <span class=\"tex-font-style-bf\">cold<\/span> water and pour it into an infinitely deep barrel; <\/li><li> take <span class=\"tex-font-style-bf\">one<\/span> cup of the <span class=\"tex-font-style-bf\">hot<\/span> water $$$\\dots$$$ <\/li><li> and so on $$$\\dots$$$ <\/li><\/ol><p><span class=\"tex-font-style-bf\">Note that you always start with the cup of hot water<\/span>.<\/p><p>The barrel is initially empty. You have to pour <span class=\"tex-font-style-bf\">at least one cup<\/span> into the barrel. The water temperature in the barrel is an average of the temperatures of the poured cups.<\/p><p>You want to achieve a temperature as close as possible to $$$t$$$. So if the temperature in the barrel is $$$t_b$$$, then the <span class=\"tex-font-style-bf\">absolute difference<\/span> of $$$t_b$$$ and $$$t$$$ ($$$|t_b - t|$$$) should be as small as possible.<\/p><p>How many cups should you pour into the barrel, so that the temperature in it is as close as possible to $$$t$$$? If there are multiple answers with the minimum absolute difference, then print the smallest of them.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$T$$$ ($$$1 \\le T \\le 3 \\cdot 10^4$$$)\u00a0\u2014 the number of testcases.<\/p><p>Each of the next $$$T$$$ lines contains three integers $$$h$$$, $$$c$$$ and $$$t$$$ ($$$1 \\le c  \\lt  h \\le 10^6$$$; $$$c \\le t \\le h$$$)\u00a0\u2014 the temperature of the hot water, the temperature of the cold water and the desired temperature in the barrel.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each testcase print a single positive integer\u00a0\u2014 the minimum number of cups required to be poured into the barrel to achieve the closest temperature to $$$t$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n30 10 20\n41 15 30\n18 13 18\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n7\n1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first testcase the temperature after $$$2$$$ poured cups: $$$1$$$ hot and $$$1$$$ cold is exactly $$$20$$$. So that is the closest we can achieve.<\/p><p>In the second testcase the temperature after $$$7$$$ poured cups: $$$4$$$ hot and $$$3$$$ cold is about $$$29.857$$$. Pouring more water won't get us closer to $$$t$$$ than that.<\/p><p>In the third testcase the temperature after $$$1$$$ poured cup: $$$1$$$ hot is $$$18$$$. That's exactly equal to $$$t$$$.<\/p><\/div><\/div>"}, {"contestId": 349, "index": "B", "name": "Color the Fence", "rating": 1700, "solvedCount": 15287, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Color the Fence<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Igor has fallen in love with Tanya. Now Igor wants to show his feelings and write a number on the fence opposite to Tanya's house. Igor thinks that the larger the number is, the more chance to win Tanya's heart he has. <\/p><p>Unfortunately, Igor could only get <span class=\"tex-span\"><i>v<\/i><\/span> liters of paint. He did the math and concluded that digit <span class=\"tex-span\"><i>d<\/i><\/span> requires <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>d<\/i><\/sub><\/span> liters of paint. Besides, Igor heard that Tanya doesn't like zeroes. That's why Igor won't use them in his number.<\/p><p>Help Igor find the maximum number he can write on the fence.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a positive integer <span class=\"tex-span\"><i>v<\/i><\/span> <span class=\"tex-span\">(0\u2009\u2264\u2009<i>v<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup>)<\/span>. The second line contains nine positive integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\">9<\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>)<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the maximum number Igor can write on the fence. If he has too little paint for any digit (so, he cannot write anything), print -1.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>5 4 3 2 1 2 3 4 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>55555<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/>9 11 1 12 5 8 9 10 6<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>33<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>0<br/>1 1 1 1 1 1 1 1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>-1<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1144, "index": "F", "name": "Graph Without Long Directed Paths", "rating": 1700, "solvedCount": 15026, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Graph Without Long Directed Paths<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a connected undirected graph consisting of $$$n$$$ vertices and $$$m$$$ edges. There are no self-loops or multiple edges in the given graph.<\/p><p>You have to direct its edges in such a way that the obtained directed graph does not contain any paths of length two or greater (where the length of path is denoted as the number of traversed edges).<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integer numbers $$$n$$$ and $$$m$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$, $$$n - 1 \\le m \\le 2 \\cdot 10^5$$$) \u2014 the number of vertices and edges, respectively.<\/p><p>The following $$$m$$$ lines contain edges: edge $$$i$$$ is given as a pair of vertices $$$u_i$$$, $$$v_i$$$ ($$$1 \\le u_i, v_i \\le n$$$, $$$u_i \\ne v_i$$$). There are no multiple edges in the given graph, i.\u2009e. for each pair ($$$u_i, v_i$$$) there are no other pairs ($$$u_i, v_i$$$) and ($$$v_i, u_i$$$) in the list of edges. It is also guaranteed that the given graph is connected (there is a path between any pair of vertex in the given graph).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If it is impossible to direct edges of the given graph in such a way that the obtained directed graph does not contain paths of length at least two, print \"<span class=\"tex-font-style-tt\">NO<\/span>\" in the first line.<\/p><p>Otherwise print \"<span class=\"tex-font-style-tt\">YES<\/span>\" in the first line, and then print <span class=\"tex-font-style-bf\">any<\/span> suitable orientation of edges: a binary string (the string consisting only of '<span class=\"tex-font-style-tt\">0<\/span>' and '<span class=\"tex-font-style-tt\">1<\/span>') of length $$$m$$$. The $$$i$$$-th element of this string should be '<span class=\"tex-font-style-tt\">0<\/span>' if the $$$i$$$-th edge of the graph should be directed from $$$u_i$$$ to $$$v_i$$$, and '<span class=\"tex-font-style-tt\">1<\/span>' otherwise. Edges are numbered in the order they are given in the input.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 5\n1 5\n2 1\n1 4\n3 1\n6 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\n10100\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The picture corresponding to the first example: <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/d38084716d7214e4107c06dac7fa126636937855.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>And one of possible answers: <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/6134e1d8526f4a574a8a2456fd040e1de8f892b8.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><\/div><\/div>"}, {"contestId": 1695, "index": "C", "name": "Zero Path", "rating": 1700, "solvedCount": 14728, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Zero Path<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a grid with $$$n$$$ rows and $$$m$$$ columns. We denote the square on the $$$i$$$-th ($$$1\\le i\\le n$$$) row and $$$j$$$-th ($$$1\\le j\\le m$$$) column by $$$(i, j)$$$ and the number there by $$$a_{ij}$$$. All numbers are equal to $$$1$$$ or to $$$-1$$$. <\/p><p>You start from the square $$$(1, 1)$$$ and can move one square down or one square to the right at a time. In the end, you want to end up at the square $$$(n, m)$$$.<\/p><p>Is it possible to move in such a way so that the sum of the values written in all the visited cells (including $$$a_{11}$$$ and $$$a_{nm}$$$) is $$$0$$$?<\/p><center><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/560459f1359d2f414325a61f7bdd72246cafae93.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/center><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\leq t \\leq 10^4$$$). Description of the test cases follows.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\le n, m \\le 1000$$$) \u00a0\u2014 the size of the grid.<\/p><p>Each of the following $$$n$$$ lines contains $$$m$$$ integers. The $$$j$$$-th integer on the $$$i$$$-th line is $$$a_{ij}$$$ ($$$a_{ij} = 1$$$ or $$$-1$$$) \u00a0\u2014 the element in the cell $$$(i, j)$$$.<\/p><p>It is guaranteed that the sum of $$$n\\cdot m$$$ over all test cases does not exceed $$$10^6$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print \"YES\" if there exists a path from the top left to the bottom right that adds up to $$$0$$$, and \"NO\" otherwise. You can output each letter in any case.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 -1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 -1 1 -1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 -1 -1 -1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">-1 1 1 -1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 1 1 -1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 -1 1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">-1 1 -1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 -1 1 1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nNO\nYES\nYES\nYES\nNO\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>One possible path for the fourth test case is given in the picture in the statement.<\/p><\/div><\/div>"}, {"contestId": 1516, "index": "C", "name": "Baby Ehab Partitions Again", "rati

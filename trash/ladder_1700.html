\">Input<\/div><p>The input consists of multiple test cases. The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 100$$$)\u00a0\u2014 the number of test cases. Description of the test cases follows.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$, $$$1 \\le k \\le n$$$)\u00a0\u2014 the number of traps and the number of jump overs that you are allowed to make.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$)\u00a0\u2014 base damage values of all traps.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case output a single integer \u2014 the minimal total damage that it is possible to get if you are allowed to jump over no more than $$$k$$$ traps.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">8 7 1 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 10 11 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">8 2 5 15 11 2 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 2 3 4 5 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">7<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n21\n9\n6\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case it is allowed to jump over all traps and take $$$0$$$ damage.<\/p><p>In the second test case there are $$$5$$$ ways to jump over some traps:<\/p><ol> <li> Do not jump over any trap.<p>Total damage: $$$5 + 10 + 11 + 5 = 31$$$.<\/p><\/li><li> Jump over the $$$1$$$-st trap.<p>Total damage: $$$\\underline{0} + (10 + 1) + (11 + 1) + (5 + 1) = 29$$$.<\/p><\/li><li> Jump over the $$$2$$$-nd trap.<p>Total damage: $$$5 + \\underline{0} + (11 + 1) + (5 + 1) = 23$$$.<\/p><\/li><li> Jump over the $$$3$$$-rd trap.<p>Total damage: $$$5 + 10 + \\underline{0} + (5 + 1) = 21$$$.<\/p><\/li><li> Jump over the $$$4$$$-th trap.<p>Total damage: $$$5 + 10 + 11 + \\underline{0} = 26$$$.<\/p><\/li><\/ol><p>To get minimal damage it is needed to jump over the $$$3$$$-rd trap, so the answer is $$$21$$$.<\/p><p>In the third test case it is optimal to jump over the traps $$$1$$$, $$$3$$$, $$$4$$$, $$$5$$$, $$$7$$$:<\/p><p>Total damage: $$$0 + (2 + 1) + 0 + 0 + 0 + (2 + 4) + 0 = 9$$$.<\/p><\/div><\/div>"}, {"contestId": 1598, "index": "D", "name": "Training Session", "rating": 1700, "solvedCount": 10903, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Training Session<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Monocarp is the coach of the Berland State University programming teams. He decided to compose a problemset for a training session for his teams.<\/p><p>Monocarp has $$$n$$$ problems that none of his students have seen yet. The $$$i$$$-th problem has a topic $$$a_i$$$ (an integer from $$$1$$$ to $$$n$$$) and a difficulty $$$b_i$$$ (an integer from $$$1$$$ to $$$n$$$). All problems are different, that is, there are no two tasks that have the same topic and difficulty at the same time.<\/p><p>Monocarp decided to select exactly $$$3$$$ problems from $$$n$$$ problems for the problemset. The problems should satisfy <span class=\"tex-font-style-bf\">at least one<\/span> of two conditions (possibly, both):<\/p><ul> <li> the topics of all three selected problems are different; <\/li><li> the difficulties of all three selected problems are different. <\/li><\/ul><p>Your task is to determine the number of ways to select three problems for the problemset.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 50000$$$)\u00a0\u2014 the number of testcases.<\/p><p>The first line of each testcase contains an integer $$$n$$$ ($$$3 \\le n \\le 2 \\cdot 10^5$$$) \u2014 the number of problems that Monocarp have.<\/p><p>In the $$$i$$$-th of the following $$$n$$$ lines, there are two integers $$$a_i$$$ and $$$b_i$$$ ($$$1 \\le a_i, b_i \\le n$$$)\u00a0\u2014 the topic and the difficulty of the $$$i$$$-th problem.<\/p><p>It is guaranteed that there are no two problems that have the same topic and difficulty at the same time.<\/p><p>The sum of $$$n$$$ over all testcases doesn't exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the number of ways to select three training problems that meet either of the requirements described in the statement.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n4\n2 4\n3 4\n2 1\n1 3\n5\n1 5\n2 4\n3 3\n4 2\n5 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n10\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, you can take the following sets of three problems:<\/p><ul> <li> problems $$$1$$$, $$$2$$$, $$$4$$$; <\/li><li> problems $$$1$$$, $$$3$$$, $$$4$$$; <\/li><li> problems $$$2$$$, $$$3$$$, $$$4$$$. <\/li><\/ul><p>Thus, the number of ways is equal to three.<\/p><\/div><\/div>"}, {"contestId": 1312, "index": "D", "name": "Count the Arrays", "rating": 1700, "solvedCount": 10883, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Count the Arrays<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Your task is to calculate the number of arrays such that:<\/p><ul> <li> each array contains $$$n$$$ elements; <\/li><li> each element is an integer from $$$1$$$ to $$$m$$$; <\/li><li> for each array, there is <span class=\"tex-font-style-bf\">exactly<\/span> one pair of equal elements; <\/li><li> for each array $$$a$$$, there exists an index $$$i$$$ such that the array is <span class=\"tex-font-style-bf\">strictly ascending<\/span> before the $$$i$$$-th element and <span class=\"tex-font-style-bf\">strictly descending<\/span> after it (formally, it means that $$$a_j  \\lt  a_{j + 1}$$$, if $$$j  \\lt  i$$$, and $$$a_j  \\gt  a_{j + 1}$$$, if $$$j \\ge i$$$). <\/li><\/ul><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$m$$$ ($$$2 \\le n \\le m \\le 2 \\cdot 10^5$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the number of arrays that meet all of the aforementioned conditions, taken modulo $$$998244353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n10\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n42 1337\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n806066790\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n100000 200000\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n707899035\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The arrays in the first example are:<\/p><ul> <li> $$$[1, 2, 1]$$$; <\/li><li> $$$[1, 3, 1]$$$; <\/li><li> $$$[1, 4, 1]$$$; <\/li><li> $$$[2, 3, 2]$$$; <\/li><li> $$$[2, 4, 2]$$$; <\/li><li> $$$[3, 4, 3]$$$. <\/li><\/ul><\/div><\/div>"}, {"contestId": 385, "index": "C", "name": "Bear and Prime Numbers", "rating": 1700, "solvedCount": 10871, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Bear and Prime Numbers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Recently, the bear started studying data structures and faced the following problem.<\/p><p>You are given a sequence of integers <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>x<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>x<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> of length <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> queries, each of them is characterized by two integers <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. Let's introduce <span class=\"tex-span\"><i>f<\/i>(<i>p<\/i>)<\/span> to represent the number of such indexes <span class=\"tex-span\"><i>k<\/i><\/span>, that <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span> is divisible by <span class=\"tex-span\"><i>p<\/i><\/span>. The answer to the query <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is the sum: <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/5e448f6c1a0e40843cecdbbeb95970464626032f.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>, where <span class=\"tex-span\"><i>S<\/i>(<i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>)<\/span> is a set of prime numbers from segment <span class=\"tex-span\">[<i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>]<\/span> (both borders are included in the segment).<\/p><p>Help the bear cope with the problem.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integer <span class=\"tex-span\"><i>n<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup>)<\/span>. The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>x<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>x<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> <span class=\"tex-span\">(2\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">7<\/sup>)<\/span>. The numbers are not necessarily distinct.<\/p><p>The third line contains integer <span class=\"tex-span\"><i>m<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u200950000)<\/span>. Each of the following <span class=\"tex-span\"><i>m<\/i><\/span> lines contains a pair of space-separated integers, <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\">(2\u2009\u2264\u2009<i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u20092\u00b710<sup class=\"upper-index\">9<\/sup>)<\/span> \u2014 the numbers that characterize the current query.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>m<\/i><\/span> integers \u2014 the answers to the queries on the order the queries appear in the input.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>6<br/>5 5 7 10 14 15<br/>3<br/>2 11<br/>3 12<br/>4 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>9<br/>7<br/>0<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>7<br/>2 3 5 7 11 4 8<br/>2<br/>8 10<br/>2 123<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/>7<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Consider the first sample. Overall, the first sample has 3 queries.<\/p><ol> <li> The first query <span class=\"tex-span\"><i>l<\/i>\u2009=\u20092<\/span>, <span class=\"tex-span\"><i>r<\/i>\u2009=\u200911<\/span> comes. You need to count <span class=\"tex-span\"><i>f<\/i>(2)\u2009+\u2009<i>f<\/i>(3)\u2009+\u2009<i>f<\/i>(5)\u2009+\u2009<i>f<\/i>(7)\u2009+\u2009<i>f<\/i>(11)\u2009=\u20092\u2009+\u20091\u2009+\u20094\u2009+\u20092\u2009+\u20090\u2009=\u20099<\/span>. <\/li><li> The second query comes <span class=\"tex-span\"><i>l<\/i>\u2009=\u20093<\/span>, <span class=\"tex-span\"><i>r<\/i>\u2009=\u200912<\/span>. You need to count <span class=\"tex-span\"><i>f<\/i>(3)\u2009+\u2009<i>f<\/i>(5)\u2009+\u2009<i>f<\/i>(7)\u2009+\u2009<i>f<\/i>(11)\u2009=\u20091\u2009+\u20094\u2009+\u20092\u2009+\u20090\u2009=\u20097<\/span>. <\/li><li> The third query comes <span class=\"tex-span\"><i>l<\/i>\u2009=\u20094<\/span>, <span class=\"tex-span\"><i>r<\/i>\u2009=\u20094<\/span>. As this interval has no prime numbers, then the sum equals 0. <\/li><\/ol><\/div><\/div>"}, {"contestId": 1699, "index": "C", "name": "The Third Problem", "rating": 1700, "solvedCount": 10869, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. The Third Problem<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a permutation $$$a_1,a_2,\\ldots,a_n$$$ of integers from $$$0$$$ to $$$n - 1$$$. Your task is to find how many permutations $$$b_1,b_2,\\ldots,b_n$$$ are <span class=\"tex-font-style-it\">similar<\/span> to permutation $$$a$$$. <\/p><p>Two permutations $$$a$$$ and $$$b$$$ of size $$$n$$$ are considered <span class=\"tex-font-style-it\">similar<\/span> if for all intervals $$$[l,r]$$$ ($$$1 \\le l \\le r \\le n$$$), the following condition is satisfied: $$$$$$\\operatorname{MEX}([a_l,a_{l+1},\\ldots,a_r])=\\operatorname{MEX}([b_l,b_{l+1},\\ldots,b_r]),$$$$$$ where the $$$\\operatorname{MEX}$$$ of a collection of integers $$$c_1,c_2,\\ldots,c_k$$$ is defined as the smallest non-negative integer $$$x$$$ which does not occur in collection $$$c$$$. For example, $$$\\operatorname{MEX}([1,2,3,4,5])=0$$$, and $$$\\operatorname{MEX}([0,1,2,4,5])=3$$$.<\/p><p>Since the total number of such permutations can be very large, you will have to print its remainder modulo $$$10^9+7$$$.<\/p><p>In this problem, a permutation of size $$$n$$$ is an array consisting of $$$n$$$ distinct integers from $$$0$$$ to $$$n-1$$$ in arbitrary order. For example, $$$[1,0,2,4,3]$$$ is a permutation, while $$$[0,1,1]$$$ is not, since $$$1$$$ appears twice in the array. $$$[0,1,3]$$$ is also not a permutation, since $$$n=3$$$ and there is a $$$3$$$ in the array.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line of input contains one integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases. The following lines contain the descriptions of the test cases.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 10^5$$$)\u00a0\u2014 the size of permutation $$$a$$$.<\/p><p>The second line of each test case contains $$$n$$$ distinct integers $$$a_1,a_2,\\ldots,a_n$$$ ($$$0 \\le a_i \\lt n$$$)\u00a0\u2014 the elements of permutation $$$a$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ across all test cases does not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print a single integer, the number of permutations <span class=\"tex-font-style-it\">similar<\/span> to permutation $$$a$$$, taken modulo $$$10^9+7$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 0 3 2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0 1 2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 2 4 0 5 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 3 7 2 5 0 6 4<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n1\n1\n4\n72\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first test case, the only permutations similar to $$$a=[4,0,3,2,1]$$$ are $$$[4,0,3,2,1]$$$ and $$$[4,0,2,3,1]$$$.<\/p><p>For the second and third test cases, the given permutations are only similar to themselves.<\/p><p>For the fourth test case, there are $$$4$$$ permutations similar to $$$a=[1,2,4,0,5,3]$$$: <\/p><ul> <li> $$$[1,2,4,0,5,3]$$$; <\/li><li> $$$[1,2,5,0,4,3]$$$; <\/li><li> $$$[1,4,2,0,5,3]$$$; <\/li><li> $$$[1,5,2,0,4,3]$$$. <\/li><\/ul><\/div><\/div>"}, {"contestId": 1955, "index": "E", "name": "Long Inversions", "rating": 1700, "solvedCount": 10858, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Long Inversions<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>A binary string $$$s$$$ of length $$$n$$$ is given. A binary string is a string consisting only of the characters '<span class=\"tex-font-style-tt\">1<\/span>' and '<span class=\"tex-font-style-tt\">0<\/span>'.<\/p><p>You can choose an integer $$$k$$$ ($$$1 \\le k \\le n$$$) and then apply the following operation any number of times: choose $$$k$$$ consecutive characters of the string and invert them, i.e., replace all '<span class=\"tex-font-style-tt\">0<\/span>' with '<span class=\"tex-font-style-tt\">1<\/span>' and vice versa.<\/p><p>Using these operations, you need to make all the characters in the string equal to '<span class=\"tex-font-style-tt\">1<\/span>'.<\/p><p>For example, if $$$n=5$$$, $$$s=00100$$$, you can choose $$$k=3$$$ and proceed as follows: <\/p><ul> <li> choose the substring from the $$$1$$$-st to the $$$3$$$-rd character and obtain $$$s=\\color{blue}{110}00$$$; <\/li><li> choose the substring from the $$$3$$$-rd to the $$$5$$$-th character and obtain $$$s=11\\color{blue}{111}$$$; <\/li><\/ul><p>Find the maximum value of $$$k$$$ for which it is possible to make all the characters in the string equal to '<span class=\"tex-font-style-tt\">1<\/span>' using the described operations. Note that the number of operations required to achieve this is not important.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains an integer $$$n$$$ ($$$1 \\le n \\le 5000$$$)\u00a0\u2014 the length of the string $$$s$$$.<\/p><p>The second line of each test case contains a string $$$s$$$ of length $$$n$$$, consisting of the characters '<span class=\"tex-font-style-tt\">1<\/span>' and '<span class=\"tex-font-style-tt\">0<\/span>'.<\/p><p>It is guaranteed that the sum of the values $$$n^2$$$ over all test cases in the test does not exceed $$$25 \\cdot 10^6$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output the maximum integer $$$k$$$ ($$$1 \\le k \\le n$$$) for which it is possible to obtain a string $$$s$$$ consisting only of the characters '<span class=\"tex-font-style-tt\">1<\/span>' using the described operations.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">00100<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">01000<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1011101<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">000<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">10<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n2\n4\n3\n1\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1661, "index": "C", "name": "Water the Trees", "rating": 1700, "solvedCount": 10845, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Water the Trees<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are $$$n$$$ trees in a park, numbered from $$$1$$$ to $$$n$$$. The initial height of the $$$i$$$-th tree is $$$h_i$$$.<\/p><p>You want to water these trees, so they all grow to the <span class=\"tex-font-style-bf\">same<\/span> height.<\/p><p>The watering process goes as follows. You start watering trees at day $$$1$$$. During the $$$j$$$-th day you can: <\/p><ul> <li> Choose a tree and water it. If the day is odd (e.g. $$$1, 3, 5, 7, \\dots$$$), then the height of the tree increases by $$$1$$$. If the day is even (e.g. $$$2, 4, 6, 8, \\dots$$$), then the height of the tree increases by $$$2$$$. <\/li><li> Or skip a day without watering any tree. <\/li><\/ul><p>Note that you can't water more than one tree in a day. <\/p><p>Your task is to determine the <span class=\"tex-font-style-bf\">minimum<\/span> number of days required to water the trees so they grow to the same height.<\/p><p>You have to answer $$$t$$$ independent test cases.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains one integer $$$t$$$ ($$$1 \\le t \\le 2 \\cdot 10^4$$$) \u2014 the number of test cases.<\/p><p>The first line of the test case contains one integer $$$n$$$ ($$$1 \\le n \\le 3 \\cdot 10^5$$$) \u2014 the number of trees.<\/p><p>The second line of the test case contains $$$n$$$ integers $$$h_1, h_2, \\ldots, h_n$$$ ($$$1 \\le h_i \\le 10^9$$$), where $$$h_i$$$ is the height of the $$$i$$$-th tree.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$3 \\cdot 10^5$$$ ($$$\\sum n \\le 3 \\cdot 10^5$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print one integer \u2014 the <span class=\"tex-font-style-bf\">minimum<\/span> number of days required to water the trees, so they grow to the same height.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 4 3 5 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 5 4 8 3 7 4<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n3\n16\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Consider the first test case of the example. The initial state of the trees is $$$[1, 2, 4]$$$.<\/p><ol> <li> During the first day, let's water the first tree, so the sequence of heights becomes $$$[2, 2, 4]$$$; <\/li><li> during the second day, let's water the second tree, so the sequence of heights becomes $$$[2, 4, 4]$$$; <\/li><li> let's skip the third day; <\/li><li> during the fourth day, let's water the first tree, so the sequence of heights becomes $$$[4, 4, 4]$$$. <\/li><\/ol><p>Thus, the answer is $$$4$$$.<\/p><\/div><\/div>"}, {"contestId": 1833, "index": "F", "name": "Ira and Flamenco", "rating": 1700, "solvedCount": 10774, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Ira and Flamenco<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Ira loves Spanish flamenco dance very much. She decided to start her own dance studio and found $$$n$$$ students, $$$i$$$th of whom has <span class=\"tex-font-style-it\">level<\/span> $$$a_i$$$.<\/p><p>Ira can choose several of her students and set a dance with them. So she can set a huge number of dances, but she is only interested in <span class=\"tex-font-style-it\">magnificent<\/span> dances. The dance is called <span class=\"tex-font-style-it\">magnificent<\/span> if the following is true: <\/p><ul> <li> <span class=\"tex-font-style-bf\">exactly<\/span> $$$m$$$ students participate in the dance; <\/li><li> <span class=\"tex-font-style-it\">levels<\/span> of all dancers are <span class=\"tex-font-style-bf\">pairwise distinct<\/span>; <\/li><li> <span class=\"tex-font-style-it\">levels<\/span> of every two dancers have an absolute difference <span class=\"tex-font-style-bf\">strictly less<\/span> than $$$m$$$. <\/li><\/ul><p>For example, if $$$m = 3$$$ and $$$a = [4, 2, 2, 3, 6]$$$, the following dances are <span class=\"tex-font-style-it\">magnificent<\/span> (students participating in the dance are highlighted in red): $$$[\\color{red}{4}, 2, \\color{red}{2}, \\color{red}{3}, 6]$$$, $$$[\\color{red}{4}, \\color{red}{2}, 2, \\color{red}{3}, 6]$$$. At the same time dances $$$[\\color{red}{4}, 2, 2, \\color{red}{3}, 6]$$$, $$$[4, \\color{red}{2}, \\color{red}{2}, \\color{red}{3}, 6]$$$, $$$[\\color{red}{4}, 2, 2, \\color{red}{3}, \\color{red}{6}]$$$ are not <span class=\"tex-font-style-it\">magnificent<\/span>.<\/p><p>In the dance $$$[\\color{red}{4}, 2, 2, \\color{red}{3}, 6]$$$ only $$$2$$$ students participate, although $$$m = 3$$$.<\/p><p>The dance $$$[4, \\color{red}{2}, \\color{red}{2}, \\color{red}{3}, 6]$$$ involves students with <span class=\"tex-font-style-it\">levels<\/span> $$$2$$$ and $$$2$$$, although <span class=\"tex-font-style-it\">levels<\/span> of all dancers must be pairwise distinct.<\/p><p>In the dance $$$[\\color{red}{4}, 2, 2, \\color{red}{3}, \\color{red}{6}]$$$ students with <span class=\"tex-font-style-it\">levels<\/span> $$$3$$$ and $$$6$$$ participate, but $$$|3 - 6| = 3$$$, although $$$m = 3$$$.<\/p><p>Help Ira count the number of <span class=\"tex-font-style-it\">magnificent<\/span> dances that she can set. Since this number can be very large, count it <span class=\"tex-font-style-bf\">modulo<\/span> $$$10^9 + 7$$$. Two dances are considered different if the sets of students participating in them are different.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 number of testcases.<\/p><p>The first line of each testcase contains integers $$$n$$$ and $$$m$$$ ($$$1 \\le m \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of Ira students and the number of dancers in the <span class=\"tex-font-style-it\">magnificent<\/span> dance.<\/p><p>The second line of each testcase contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$)\u00a0\u2014 <span class=\"tex-font-style-it\">levels<\/span> of students.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all testcases <span class=\"tex-font-style-bf\">does not exceed<\/span> $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each testcase, print a single integer\u00a0\u2014 the number of <span class=\"tex-font-style-it\">magnificent<\/span> dances. Since this number can be very large, print it <span class=\"tex-font-style-bf\">modulo<\/span> $$$10^9 + 7$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">7 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">8 10 10 9 6 11 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 2 2 3 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">8 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 5 2 2 3 1 3 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 3 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3 4 3 10 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">12 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">5 2 1 1 4 3 5 5 5 2 7 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">1 2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-9\">2 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-9\">1 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5\n2\n10\n0\n5\n11\n1\n2\n1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first testcase, Ira can set such <span class=\"tex-font-style-it\">magnificent<\/span> dances: $$$[\\color{red}{8}, 10, 10, \\color{red}{9}, \\color{red}{6}, 11, \\color{red}{7}]$$$, $$$[\\color{red}{8}, \\color{red}{10}, 10, \\color{red}{9}, 6, 11, \\color{red}{7}]$$$, $$$[\\color{red}{8}, 10, \\color{red}{10}, \\color{red}{9}, 6, 11, \\color{red}{7}]$$$, $$$[\\color{red}{8}, 10, \\color{red}{10}, \\color{red}{9}, 6, \\color{red}{11}, 7]$$$, $$$[\\color{red}{8}, \\color{red}{10}, 10, \\color{red}{9}, 6, \\color{red}{11}, 7]$$$.<\/p><p>The second testcase is explained in the statements.<\/p><\/div><\/div>"}, {"contestId": 1478, "index": "C", "name": "Nezzar and Symmetric Array", "rating": 1700, "solvedCount": 10770, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Nezzar and Symmetric Array<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Long time ago there was a symmetric array $$$a_1,a_2,\\ldots,a_{2n}$$$ consisting of $$$2n$$$ <span class=\"tex-font-style-bf\">distinct integers<\/span>. Array $$$a_1,a_2,\\ldots,a_{2n}$$$ is called symmetric if for each integer $$$1 \\le i \\le 2n$$$, there exists an integer $$$1 \\le j \\le 2n$$$ such that $$$a_i = -a_j$$$.<\/p><p>For each integer $$$1 \\le i \\le 2n$$$, Nezzar wrote down an integer $$$d_i$$$ equal to the sum of absolute differences from $$$a_i$$$ to all integers in $$$a$$$, i.\u00a0e. $$$d_i = \\sum_{j = 1}^{2n} {|a_i - a_j|}$$$.<\/p><p>Now a million years has passed and Nezzar can barely remember the array $$$d$$$ and totally forget $$$a$$$. Nezzar wonders if there exists any symmetric array $$$a$$$ consisting of $$$2n$$$ distinct integers that generates the array $$$d$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^5$$$) \u2014 the number of test cases. <\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 10^5$$$).<\/p><p>The second line of each test case contains $$$2n$$$ integers $$$d_1, d_2, \\ldots, d_{2n}$$$ ($$$0 \\le d_i \\le 10^{12}$$$).<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print \"<span class=\"tex-font-style-tt\">YES<\/span>\" in a single line if there exists a possible array $$$a$$$. Otherwise, print \"<span class=\"tex-font-style-tt\">NO<\/span>\".<\/p><p>You can print letters in any case (upper or lower).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n2\n8 12 8 12\n2\n7 7 9 11\n2\n7 11 7 11\n1\n1 1\n4\n40 56 48 40 80 56 80 48\n6\n240 154 210 162 174 154 186 240 174 186 162 210\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nNO\nNO\nNO\nNO\nYES\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, $$$a=[1,-3,-1,3]$$$ is one possible symmetric array that generates the array $$$d=[8,12,8,12]$$$.<\/p><p>In the second test case, it can be shown that there is no symmetric array consisting of distinct integers that can generate array $$$d$$$.<\/p><\/div><\/div>"}, {"contestId": 1709, "index": "D", "name": "Rorororobot", "rating": 1700, "solvedCount": 10753, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Rorororobot<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There is a grid, consisting of $$$n$$$ rows and $$$m$$$ columns. The rows are numbered from $$$1$$$ to $$$n$$$ from bottom to top. The columns are numbered from $$$1$$$ to $$$m$$$ from left to right. The $$$i$$$-th column has the bottom $$$a_i$$$ cells blocked (the cells in rows $$$1, 2, \\dots, a_i$$$), the remaining $$$n - a_i$$$ cells are unblocked.<\/p><p>A robot is travelling across this grid. You can send it commands\u00a0\u2014 move up, right, down or left. If a robot attempts to move into a blocked cell or outside the grid, it explodes.<\/p><p>However, the robot is broken\u00a0\u2014 it executes each received command $$$k$$$ times. So if you tell it to move up, for example, it will move up $$$k$$$ times ($$$k$$$ cells). You can't send it commands while the robot executes the current one.<\/p><p>You are asked $$$q$$$ queries about the robot. Each query has a start cell, a finish cell and a value $$$k$$$. Can you send the robot an arbitrary number of commands (possibly, zero) so that it reaches the finish cell from the start cell, given that it executes each command $$$k$$$ times?<\/p><p>The robot must stop in the finish cell. If it visits the finish cell while still executing commands, it doesn't count.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\le n \\le 10^9$$$; $$$1 \\le m \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of rows and columns of the grid.<\/p><p>The second line contains $$$m$$$ integers $$$a_1, a_2, \\dots, a_m$$$ ($$$0 \\le a_i \\le n$$$)\u00a0\u2014 the number of blocked cells on the bottom of the $$$i$$$-th column.<\/p><p>The third line contains a single integer $$$q$$$ ($$$1 \\le q \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of queries.<\/p><p>Each of the next $$$q$$$ lines contain five integers $$$x_s, y_s, x_f, y_f$$$ and $$$k$$$ ($$$a[y_s]  \\lt  x_s \\le n$$$; $$$1 \\le y_s \\le m$$$; $$$a[y_f]  \\lt  x_f \\le n$$$; $$$1 \\le y_f \\le m$$$; $$$1 \\le k \\le 10^9$$$)\u00a0\u2014 the row and the column of the start cell, the row and the column of the finish cell and the number of times each your command is executed. The start and the finish cell of each query are unblocked.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query, print \"<span class=\"tex-font-style-tt\">YES<\/span>\" if you can send the robot an arbitrary number of commands (possibly, zero) so that it reaches the finish cell from the start cell, given that it executes each command $$$k$$$ times. Otherwise, print \"<span class=\"tex-font-style-tt\">NO<\/span>\".<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n11 10\n9 0 0 10 3 4 8 11 10 8\n6\n1 2 1 3 1\n1 2 1 3 2\n4 3 4 5 2\n5 3 11 5 3\n5 3 11 5 2\n11 9 9 10 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nNO\nNO\nNO\nYES\nYES\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1715, "index": "C", "name": "Monoblock", "rating": 1700, "solvedCount": 10750, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Monoblock<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Stanley has decided to buy a new desktop PC made by the company \"Monoblock\", and to solve captcha on their website, he needs to solve the following task.<\/p><p>The <span class=\"tex-font-style-it\">awesomeness<\/span> of an array is the minimum number of blocks of consecutive identical numbers in which the array could be split. For example, the awesomeness of an array <\/p><ul> <li> $$$[1, 1, 1]$$$ is $$$1$$$; <\/li><li> $$$[5, 7]$$$ is $$$2$$$, as it could be split into blocks $$$[5]$$$ and $$$[7]$$$; <\/li><li> $$$[1, 7, 7, 7, 7, 7, 7, 7, 9, 9, 9, 9, 9, 9, 9, 9, 9]$$$ is 3, as it could be split into blocks $$$[1]$$$, $$$[7, 7, 7, 7, 7, 7, 7]$$$, and $$$[9, 9, 9, 9, 9, 9, 9, 9, 9]$$$. <\/li><\/ul><p>You are given an array $$$a$$$ of length $$$n$$$. There are $$$m$$$ queries of two integers $$$i$$$, $$$x$$$. A query $$$i$$$, $$$x$$$ means that from now on the $$$i$$$-th element of the array $$$a$$$ is equal to $$$x$$$.<\/p><p>After each query print the sum of awesomeness values among all subsegments of array $$$a$$$. In other words, after each query you need to calculate $$$$$$\\sum\\limits_{l = 1}^n \\sum\\limits_{r = l}^n g(l, r),$$$$$$ where $$$g(l, r)$$$ is the awesomeness of the array $$$b = [a_l, a_{l + 1}, \\ldots, a_r]$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>In the first line you are given with two integers $$$n$$$ and $$$m$$$ ($$$1 \\leq n, m \\leq 10^5$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$)\u00a0\u2014 the array $$$a$$$.<\/p><p>In the next $$$m$$$ lines you are given the descriptions of queries. Each line contains two integers $$$i$$$ and $$$x$$$ ($$$1 \\leq i \\leq n$$$, $$$1 \\leq x \\leq 10^9$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the answer to each query on a new line.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 5\n1 2 3 4 5\n3 2\n4 2\n3 1\n2 1\n2 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n29\n23\n35\n25\n35\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>After the first query $$$a$$$ is equal to $$$[1, 2, 2, 4, 5]$$$, and the answer is $$$29$$$ because we can split each of the subsegments the following way: <\/p><ol> <li> $$$[1; 1]$$$: $$$[1]$$$, 1 block; <\/li><li> $$$[1; 2]$$$: $$$[1] + [2]$$$, 2 blocks; <\/li><li> $$$[1; 3]$$$: $$$[1] + [2, 2]$$$, 2 blocks; <\/li><li> $$$[1; 4]$$$: $$$[1] + [2, 2] + [4]$$$, 3 blocks; <\/li><li> $$$[1; 5]$$$: $$$[1] + [2, 2] + [4] + [5]$$$, 4 blocks; <\/li><li> $$$[2; 2]$$$: $$$[2]$$$, 1 block; <\/li><li> $$$[2; 3]$$$: $$$[2, 2]$$$, 1 block; <\/li><li> $$$[2; 4]$$$: $$$[2, 2] + [4]$$$, 2 blocks; <\/li><li> $$$[2; 5]$$$: $$$[2, 2] + [4] + [5]$$$, 3 blocks; <\/li><li> $$$[3; 3]$$$: $$$[2]$$$, 1 block; <\/li><li> $$$[3; 4]$$$: $$$[2] + [4]$$$, 2 blocks; <\/li><li> $$$[3; 5]$$$: $$$[2] + [4] + [5]$$$, 3 blocks; <\/li><li> $$$[4; 4]$$$: $$$[4]$$$, 1 block; <\/li><li> $$$[4; 5]$$$: $$$[4] + [5]$$$, 2 blocks; <\/li><li> $$$[5; 5]$$$: $$$[5]$$$, 1 block; <\/li><\/ol> which is $$$1 + 2 + 2 + 3 + 4 + 1 + 1 + 2 + 3 + 1 + 2 + 3 + 1 + 2 + 1 = 29$$$ in total.<\/div><\/div>"}, {"contestId": 1253, "index": "D", "name": "Harmonious Graph", "rating": 1700, "solvedCount": 10672, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Harmonious Graph<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You're given an undirected graph with $$$n$$$ nodes and $$$m$$$ edges. Nodes are numbered from $$$1$$$ to $$$n$$$.<\/p><p>The graph is considered <span class=\"tex-font-style-it\">harmonious<\/span> if and only if the following property holds:<\/p><ul> <li> For every triple of integers $$$(l, m, r)$$$ such that $$$1 \\le l  \\lt  m  \\lt  r \\le n$$$, if there exists a <span class=\"tex-font-style-bf\">path<\/span> going from node $$$l$$$ to node $$$r$$$, then there exists a <span class=\"tex-font-style-bf\">path<\/span> going from node $$$l$$$ to node $$$m$$$. <\/li><\/ul><p>In other words, in a harmonious graph, if from a node $$$l$$$ we can reach a node $$$r$$$ through edges ($$$l  \\lt  r$$$), then we should able to reach nodes $$$(l+1), (l+2), \\ldots, (r-1)$$$ too.<\/p><p>What is the minimum number of edges we need to add to make the graph harmonious? <\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$m$$$ ($$$3 \\le n \\le 200\\ 000$$$ and $$$1 \\le m \\le 200\\ 000$$$).<\/p><p>The $$$i$$$-th of the next $$$m$$$ lines contains two integers $$$u_i$$$ and $$$v_i$$$ ($$$1 \\le u_i, v_i \\le n$$$, $$$u_i \\neq v_i$$$), that mean that there's an edge between nodes $$$u$$$ and $$$v$$$.<\/p><p>It is guaranteed that the given graph is simple (there is no self-loop, and there is at most one edge between every pair of nodes).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the minimum number of edges we have to add to the graph to make it harmonious.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n14 8\n1 2\n2 7\n3 4\n6 3\n5 7\n3 8\n6 8\n11 12\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n200000 3\n7 9\n9 8\n4 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, the given graph is not harmonious (for instance, $$$1  \\lt  6  \\lt  7$$$, node $$$1$$$ can reach node $$$7$$$ through the path $$$1 \\rightarrow 2 \\rightarrow 7$$$, but node $$$1$$$ can't reach node $$$6$$$). However adding the edge $$$(2, 4)$$$ is sufficient to make it harmonious.<\/p><p>In the second example, the given graph is already harmonious.<\/p><\/div><\/div>"}, {"contestId": 1216, "index": "C", "name": "White Sheet", "rating": 1700, "solvedCount": 10607, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. White Sheet<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There is a white sheet of paper lying on a rectangle table. The sheet is a rectangle with its sides parallel to the sides of the table. If you will take a look from above and assume that the bottom left corner of the table has coordinates $$$(0, 0)$$$, and coordinate axes are left and bottom sides of the table, then the bottom left corner of the white sheet has coordinates $$$(x_1, y_1)$$$, and the top right \u2014 $$$(x_2, y_2)$$$.<\/p><p>After that two black sheets of paper are placed on the table. Sides of both black sheets are also parallel to the sides of the table. Coordinates of the bottom left corner of the first black sheet are $$$(x_3, y_3)$$$, and the top right \u2014 $$$(x_4, y_4)$$$. Coordinates of the bottom left corner of the second black sheet are $$$(x_5, y_5)$$$, and the top right \u2014 $$$(x_6, y_6)$$$. <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/8e3c95a30e54f5d18c7521f4ef2c692756356d68.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <span class=\"tex-font-size-small\">Example of three rectangles.<\/span> <\/center><p>Determine if some part of the white sheet can be seen from the above after the two black sheets are placed. The part of the white sheet can be seen if there is at least one point lying <span class=\"tex-font-style-bf\">not strictly inside<\/span> the white sheet and <span class=\"tex-font-style-bf\">strictly outside<\/span> of both black sheets.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains four integers $$$x_1, y_1, x_2, y_2$$$ $$$(0 \\le x_1  \\lt  x_2 \\le 10^{6}, 0 \\le y_1  \\lt  y_2 \\le 10^{6})$$$ \u2014 coordinates of the bottom left and the top right corners of the white sheet.<\/p><p>The second line of the input contains four integers $$$x_3, y_3, x_4, y_4$$$ $$$(0 \\le x_3  \\lt  x_4 \\le 10^{6}, 0 \\le y_3  \\lt  y_4 \\le 10^{6})$$$ \u2014 coordinates of the bottom left and the top right corners of the first black sheet.<\/p><p>The third line of the input contains four integers $$$x_5, y_5, x_6, y_6$$$ $$$(0 \\le x_5  \\lt  x_6 \\le 10^{6}, 0 \\le y_5  \\lt  y_6 \\le 10^{6})$$$ \u2014 coordinates of the bottom left and the top right corners of the second black sheet.<\/p><p><span class=\"tex-font-style-bf\">The sides of each sheet of paper are parallel (perpendicular) to the coordinate axes.<\/span><\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If some part of the white sheet can be seen from the above after the two black sheets are placed, print \"<span class=\"tex-font-style-tt\">YES<\/span>\" (without quotes). Otherwise print \"<span class=\"tex-font-style-tt\">NO<\/span>\".<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2 2 4 4\n1 1 3 5\n3 1 5 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nNO\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 3 7 5\n0 0 4 6\n0 0 7 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 2 10 5\n3 1 7 6\n8 1 11 7\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n0 0 1000000 1000000\n0 0 499999 1000000\n500000 0 1000000 1000000\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example the white sheet is fully covered by black sheets.<\/p><p>In the second example the part of the white sheet can be seen after two black sheets are placed. For example, the point $$$(6.5, 4.5)$$$ lies not strictly inside the white sheet and lies strictly outside of both black sheets.<\/p><\/div><\/div>"}, {"contestId": 567, "index": "C", "name": "Geometric Progression", "rating": 1700, "solvedCount": 10603, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Geometric Progression<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Polycarp loves geometric progressions very much. Since he was only three years old, he loves only the progressions of length three. He also has a favorite integer <span class=\"tex-span\"><i>k<\/i><\/span> and a sequence <span class=\"tex-span\"><i>a<\/i><\/span>, consisting of <span class=\"tex-span\"><i>n<\/i><\/span> integers.<\/p><p>He wants to know how many subsequences of length three can be selected from <span class=\"tex-span\"><i>a<\/i><\/span>, so that they form a geometric progression with common ratio <span class=\"tex-span\"><i>k<\/i><\/span>.<\/p><p>A subsequence of length three is a combination of three such indexes <span class=\"tex-span\"><i>i<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>i<\/i><sub class=\"lower-index\">2<\/sub>,\u2009<i>i<\/i><sub class=\"lower-index\">3<\/sub><\/span>, that <span class=\"tex-span\">1\u2009\u2264\u2009<i>i<\/i><sub class=\"lower-index\">1<\/sub>\u2009&lt;\u2009<i>i<\/i><sub class=\"lower-index\">2<\/sub>\u2009&lt;\u2009<i>i<\/i><sub class=\"lower-index\">3<\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>. That is, a subsequence of length three are such groups of three elements that are not necessarily consecutive in the sequence, but their indexes are strictly increasing.<\/p><p>A geometric progression with common ratio <span class=\"tex-span\"><i>k<\/i><\/span> is a sequence of numbers of the form <span class=\"tex-span\"><i>b<\/i>\u00b7<i>k<\/i><sup class=\"upper-index\">0<\/sup>,\u2009<i>b<\/i>\u00b7<i>k<\/i><sup class=\"upper-index\">1<\/sup>,\u2009...,\u2009<i>b<\/i>\u00b7<i>k<\/i><sup class=\"upper-index\"><i>r<\/i>\u2009-\u20091<\/sup><\/span>.<\/p><p>Polycarp is only three years old, so he can not calculate this number himself. Help him to do it.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains two integers, <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>k<\/i>\u2009\u2264\u20092\u00b710<sup class=\"upper-index\">5<\/sup><\/span>), showing how many numbers Polycarp's sequence has and his favorite number.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">\u2009-\u200910<sup class=\"upper-index\">9<\/sup>\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) \u2014 elements of the sequence.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output a single number \u2014 the number of ways to choose a subsequence of length three, such that it forms a geometric progression with a common ratio <span class=\"tex-span\"><i>k<\/i><\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 2<br/>1 1 2 2 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 1<br/>1 1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>10 3<br/>1 2 6 2 3 6 9 18 3 9<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample test the answer is four, as any of the two 1s can be chosen as the first element, the second element can be any of the 2s, and the third element of the subsequence must be equal to 4.<\/p><\/div><\/div>"}, {"contestId": 1849, "index": "D", "name": "Array Painting", "rating": 1700, "solvedCount": 10589, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Array Painting<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array of $$$n$$$ integers, where each integer is either $$$0$$$, $$$1$$$, or $$$2$$$. Initially, each element of the array is blue.<\/p><p>Your goal is to paint each element of the array red. In order to do so, you can perform operations of two types:<\/p><ul> <li> pay one coin to choose a blue element and paint it red; <\/li><li> choose a red element which is not equal to $$$0$$$ and a blue element <span class=\"tex-font-style-bf\">adjacent<\/span> to it, decrease the chosen red element by $$$1$$$, and paint the chosen blue element red. <\/li><\/ul><p>What is the minimum number of coins you have to spend to achieve your goal?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$0 \\le a_i \\le 2$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the minimum number of coins you have to spend in order to paint all elements red.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n0 2 0\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n0 0 1 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7\n0 1 0 0 1 0 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, you can paint all elements red with having to spend only one coin as follows:<\/p><ol> <li> paint the $$$2$$$-nd element red by spending one coin; <\/li><li> decrease the $$$2$$$-nd element by $$$1$$$ and paint the $$$1$$$-st element red; <\/li><li> decrease the $$$2$$$-nd element by $$$1$$$ and paint the $$$3$$$-rd element red. <\/li><\/ol><p>In the second example, you can paint all elements red spending only two coins as follows:<\/p><ol> <li> paint the $$$4$$$-th element red by spending one coin; <\/li><li> decrease the $$$4$$$-th element by $$$1$$$ and paint the $$$3$$$-rd element red; <\/li><li> paint the $$$1$$$-st element red by spending one coin; <\/li><li> decrease the $$$3$$$-rd element by $$$1$$$ and paint the $$$2$$$-nd element red. <\/li><\/ol><\/div><\/div>"}, {"contestId": 2122, "index": "C", "name": "Manhattan Pairs", "rating": 1700, "solvedCount": 10500, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Manhattan Pairs<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p> <\/p><p>You are given $$$n$$$ points $$$(x_i, y_i)$$$ on a 2D plane, where $$$n$$$ is even. Select $$$\\tfrac{n}{2}$$$ disjoint pairs $$$(a_i, b_i)$$$ to maximize the sum of Manhattan distances between points in pairs. In other words, maximize $$$$$$\\sum_{i=1}^{n/2} |x_{a_i} - x_{b_i}| + |y_{a_i} - y_{b_i}|.$$$$$$<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains a single even integer $$$n$$$ ($$$2 \\leq n \\leq 2 \\cdot 10^5$$$)\u00a0\u2014 the number of points.<\/p><p>The $$$i$$$-th of the next $$$n$$$ lines contains two integers $$$x_i$$$ and $$$y_i$$$ ($$$-10^6 \\le x_i, y_i \\le 10^6$$$)\u00a0\u2014 the coordinates of the $$$i$$$-th point.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output $$$\\tfrac{n}{2}$$$ lines, the $$$i$$$-th line containing two integers $$$a_i$$$ and $$$b_i$$$\u00a0\u2014 the indices of points in the $$$i$$$-th pair.<\/p><p>If there are multiple solutions, print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">10<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">-1 -1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">-1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">-2 -2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">-2 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">0 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 -3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">-4 -4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">-4 -2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">0 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">-4 -2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4 1\n2 3\n8 1\n9 10\n7 5\n2 3\n6 4\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, an optimal solution is to select the pairs $$$(1, 4)$$$ and $$$(2, 3)$$$, which achieves a distance sum of $$$5 + 3 = 8$$$.<\/p><p>In the second test case, an optimal solution is to select the pairs $$$(1, 8)$$$, $$$(9, 10)$$$, $$$(5, 7)$$$, $$$(2, 3)$$$, $$$(4, 6)$$$, which achieves a distance sum of $$$4 + 7 + 10 + 5 + 7 = 33$$$.<\/p><\/div><\/div>"}, {"contestId": 1619, "index": "E", "name": "MEX and Increments", "rating": 1700, "solvedCount": 10398, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. MEX and Increments<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Dmitry has an array of $$$n$$$ non-negative integers $$$a_1, a_2, \\dots, a_n$$$.<\/p><p>In one operation, Dmitry can choose any index $$$j$$$ ($$$1 \\le j \\le n$$$) and increase the value of the element $$$a_j$$$ by $$$1$$$. He can choose the same index $$$j$$$ multiple times.<\/p><p>For each $$$i$$$ from $$$0$$$ to $$$n$$$, determine whether Dmitry can make the $$$\\mathrm{MEX}$$$ of the array equal to exactly $$$i$$$. If it is possible, then determine the minimum number of operations to do it.<\/p><p>The $$$\\mathrm{MEX}$$$ of the array is equal to the minimum non-negative integer that is not in the array. For example, the $$$\\mathrm{MEX}$$$ of the array $$$[3, 1, 0]$$$ is equal to $$$2$$$, and the array $$$[3, 3, 1, 4]$$$ is equal to $$$0$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input data contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases in the input. <\/p><p>The descriptions of the test cases follow.<\/p><p>The first line of the description of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the length of the array $$$a$$$.<\/p><p>The second line of the description of each test case contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$0 \\le a_i \\le n$$$)\u00a0\u2014 elements of the array $$$a$$$.<\/p><p>It is guaranteed that the sum of the values $$$n$$$ over all test cases in the test does not exceed $$$2\\cdot10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output $$$n + 1$$$ integer\u00a0\u2014 $$$i$$$-th number is equal to the minimum number of operations for which you can make the array $$$\\mathrm{MEX}$$$ equal to $$$i$$$ ($$$0 \\le i \\le n$$$), or <span class=\"tex-font-style-tt\">-1<\/span> if this cannot be done.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n3\n0 1 3\n7\n0 1 2 3 4 3 2\n4\n3 0 0 0\n7\n4 6 2 3 5 0 5\n5\n4 0 1 0 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 1 0 -1 \n1 1 2 2 1 0 2 6 \n3 0 1 4 3 \n1 0 -1 -1 -1 -1 -1 -1 \n2 1 0 2 -1 -1 \n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first set of example inputs, $$$n=3$$$:<\/p><ul> <li> to get $$$\\mathrm{MEX}=0$$$, it is enough to perform one increment: $$$a_1$$$<span class=\"tex-font-style-tt\">++<\/span>; <\/li><li> to get $$$\\mathrm{MEX}=1$$$, it is enough to perform one increment: $$$a_2$$$<span class=\"tex-font-style-tt\">++<\/span>; <\/li><li> $$$\\mathrm{MEX}=2$$$ for a given array, so there is no need to perform increments; <\/li><li> it is impossible to get $$$\\mathrm{MEX}=3$$$ by performing increments. <\/li><\/ul><\/div><\/div>"}, {"contestId": 2018, "index": "C", "name": "Tree Pruning", "rating": 1700, "solvedCount": 10381, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Tree Pruning<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><div class=\"epigraph\"><div class=\"epigraph-text\"><span class=\"tex-font-style-it\"><a href=\"https://soundcloud.com/fractalex-gd/ginkiha-paved-garden-little\">t+pazolite, ginkiha, Hommarju - Paved Garden<\/a><\/span><\/div><div class=\"epigraph-source\">\u2800<\/div><\/div><p>You are given a tree with $$$n$$$ nodes, rooted at node $$$1$$$. In this problem, a leaf is a non-root node with degree $$$1$$$.<\/p><p>In one operation, you can remove a leaf and the edge adjacent to it (possibly, new leaves appear). What is the minimum number of operations that you have to perform to get a tree, also rooted at node $$$1$$$, where all the leaves are at the same distance from the root?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$3 \\leq n \\leq 5 \\cdot 10^5$$$)\u00a0\u2014 the number of nodes.<\/p><p>Each of the next $$$n-1$$$ lines contains two integers $$$u$$$, $$$v$$$ ($$$1 \\leq u, v \\leq n$$$, $$$u \\neq v$$$), describing an edge that connects $$$u$$$ and $$$v$$$. It is guaranteed that the given edges form a tree.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$5 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer: the minimum number of operations needed to achieve your goal.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">7<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">15<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">12 9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6 14<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">9 11<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">8 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">13 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">13 15<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">13 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">14 12<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">8 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 4<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n2\n5\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first two examples, the tree is as follows:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/a428c7bdf3ba5490a44914a039d11603cfb1c9df.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"567px\"/> <\/center><p>In the first example, by removing edges $$$(1, 3)$$$ and $$$(2, 5)$$$, the resulting tree has all leaves (nodes $$$6$$$ and $$$7$$$) at the same distance from the root (node $$$1$$$), which is $$$3$$$. The answer is $$$2$$$, as it is the minimum number of edges that need to be removed to achieve the goal.<\/p><p>In the second example, removing edges $$$(1, 4)$$$ and $$$(5, 7)$$$ results in a tree where all leaves (nodes $$$4$$$ and $$$5$$$) are at the same distance from the root (node $$$1$$$), which is $$$2$$$.<\/p><\/div><\/div>"}];
    let currentProblem = null;
    let editor = null;
    const STORAGE_KEY = `cf_ladder_done_1700`;
    let doneSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));

    // Retrieve the template securely from the hidden textarea
    const DEFAULT_TEMPLATE = document.getElementById('cpp-template').value.trim();

    function initEditor() {
        editor = ace.edit("editor");
        editor.setTheme("ace/theme/tomorrow_night_eighties");
        editor.session.setMode("ace/mode/c_cpp");
        editor.setFontSize(15);
        editor.setValue(DEFAULT_TEMPLATE, 1);
    }

    function renderSidebar() {
        const list = document.getElementById('problem-list');
        list.innerHTML = '';
        PROBLEMS.forEach((prob, idx) => {
            const div = document.createElement('div');
            div.className = `problem-item ${currentProblem === prob ? 'active' : ''}`;
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox'; checkbox.className = 'done-checkbox'; checkbox.checked = doneSet.has(prob.name);
            checkbox.onclick = (e) => { e.stopPropagation(); toggleDone(prob.name, checkbox.checked); };
            const title = document.createElement('div');
            title.innerHTML = `<span class="text-xs text-slate-500">#${idx + 1}</span> <span class="font-semibold text-slate-200">${prob.name}</span>`;
            div.appendChild(checkbox); div.appendChild(title); div.onclick = () => loadProblem(prob);
            list.appendChild(div);
        });
        updateProgress();
    }

    function toggleDone(name, isDone) {
        if(isDone) { doneSet.add(name); confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#4ade80', '#38bdf8'] }); } 
        else { doneSet.delete(name); }
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...doneSet]));
        updateProgress();
    }

    function updateProgress() { document.getElementById('progress-text').innerText = `${doneSet.size} / ${PROBLEMS.length} Solved`; }

    function loadProblem(prob) {
        currentProblem = prob; renderSidebar();
        document.getElementById('welcome-screen').style.display = 'none';
        const contentDiv = document.getElementById('problem-content');
        contentDiv.style.display = 'block'; contentDiv.innerHTML = prob.html;
        const titleEl = contentDiv.querySelector('.header .title');
        if(titleEl) {
            const originalText = titleEl.innerText;
            titleEl.innerHTML = `<a href="https://codeforces.com/contest/${prob.contestId}/problem/${prob.index}" target="_blank" title="Open in Codeforces">${originalText} 🔗</a>`;
        }
        contentDiv.querySelectorAll('.sample-tests .input pre').forEach(pre => {
            const btn = document.createElement('button'); btn.innerText = 'Copy'; btn.className = 'copy-btn';
            btn.onclick = () => { navigator.clipboard.writeText(pre.innerText); btn.innerText = 'Copied!'; btn.style.background = '#4ade80'; setTimeout(() => { btn.innerText = 'Copy'; btn.style.background = 'var(--neon-blue)'; }, 2000); };
            pre.parentElement.appendChild(btn);
        });
        if (window.MathJax) { MathJax.typesetPromise([contentDiv]); }
        editor.setValue(DEFAULT_TEMPLATE, 1);
    }

    function toggleSettings() {
        const modal = document.getElementById('settings-modal');
        if(modal.style.display === 'flex') { modal.style.display = 'none'; } 
        else { modal.style.display = 'flex'; document.getElementById('api-key').value = localStorage.getItem('cf_api_key') || ''; document.getElementById('api-secret').value = localStorage.getItem('cf_api_secret') || ''; }
    }

    function saveSettings() {
        localStorage.setItem('cf_api_key', document.getElementById('api-key').value);
        localStorage.setItem('cf_api_secret', document.getElementById('api-secret').value);
        toggleSettings(); alert('API Credentials Saved!');
    }

    async function sha512(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-512', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function submitCode() {
        if(!currentProblem) return alert('Select a problem first!');
        const apiKey = localStorage.getItem('cf_api_key'); const apiSecret = localStorage.getItem('cf_api_secret');
        if(!apiKey || !apiSecret) { alert('Please configure your API Key and Secret first.'); toggleSettings(); return; }
        const code = editor.getValue(); const time = Math.floor(Date.now() / 1000); const rand = Math.floor(Math.random() * 900000) + 100000;
        const params = { apiKey: apiKey, contestId: currentProblem.contestId.toString(), languageId: "54", problemIndex: currentProblem.index, source: code, time: time.toString() };
        const sortedKeys = Object.keys(params).sort();
        let paramString = sortedKeys.map(k => `${k}=${encodeURIComponent(params[k])}`).join('&');
        const sigPlain = `${rand}/problemset.submit?${paramString}#${apiSecret}`;
        const apiSig = `${rand}` + await sha512(sigPlain);
        try {
            const formData = new URLSearchParams();
            for (const key in params) formData.append(key, params[key]);
            formData.append("apiSig", apiSig);
            const res = await fetch("https://codeforces.com/api/problemset.submit", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: formData.toString() });
            const data = await res.json();
            if(data.status === 'OK') { alert('Code submitted successfully! 🎉 Check your Codeforces submissions.'); confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } }); } 
            else { alert('Submission failed: ' + data.comment); }
        } catch (err) { console.error(err); alert('Network error during submission.'); }
    }

    window.onload = () => { initEditor(); renderSidebar(); };
</script>

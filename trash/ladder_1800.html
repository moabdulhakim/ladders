<script>
    const PROBLEMS = [{"contestId": 478, "index": "C", "name": "Table Decorations", "rating": 1800, "solvedCount": 21053, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Table Decorations<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>You have <span class=\"tex-span\"><i>r<\/i><\/span> red, <span class=\"tex-span\"><i>g<\/i><\/span> green and <span class=\"tex-span\"><i>b<\/i><\/span> blue balloons. To decorate a single table for the banquet you need exactly three balloons. Three balloons attached to some table shouldn't have the same color. What maximum number <span class=\"tex-span\"><i>t<\/i><\/span> of tables can be decorated if we know number of balloons of each color?<\/p><p>Your task is to write a program that for given values <span class=\"tex-span\"><i>r<\/i><\/span>, <span class=\"tex-span\"><i>g<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span> will find the maximum number <span class=\"tex-span\"><i>t<\/i><\/span> of tables, that can be decorated in the required manner.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The single line contains three integers <span class=\"tex-span\"><i>r<\/i><\/span>, <span class=\"tex-span\"><i>g<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>r<\/i>,\u2009<i>g<\/i>,\u2009<i>b<\/i>\u2009\u2264\u20092\u00b710<sup class=\"upper-index\">9<\/sup><\/span>) \u2014 the number of red, green and blue baloons respectively. The numbers are separated by exactly one space.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer <span class=\"tex-span\"><i>t<\/i><\/span> \u2014 the maximum number of tables that can be decorated in the required manner.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 4 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>1 1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 3 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample you can decorate the tables with the following balloon sets: \"<span class=\"tex-font-style-tt\">rgg<\/span>\", \"<span class=\"tex-font-style-tt\">gbb<\/span>\", \"<span class=\"tex-font-style-tt\">brr<\/span>\", \"<span class=\"tex-font-style-tt\">rrg<\/span>\", where \"<span class=\"tex-font-style-tt\">r<\/span>\", \"<span class=\"tex-font-style-tt\">g<\/span>\" and \"<span class=\"tex-font-style-tt\">b<\/span>\" represent the red, green and blue balls, respectively.<\/p><\/div><\/div>"}, {"contestId": 161, "index": "D", "name": "Distance in Tree", "rating": 1800, "solvedCount": 20557, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Distance in Tree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>A <span class=\"tex-font-style-it\">tree<\/span> is a connected graph that doesn't contain any cycles.<\/p><p>The <span class=\"tex-font-style-it\">distance<\/span> between two vertices of a tree is the length (in edges) of the shortest path between these vertices.<\/p><p>You are given a tree with <span class=\"tex-span\"><i>n<\/i><\/span> vertices and a positive number <span class=\"tex-span\"><i>k<\/i><\/span>. Find the number of distinct pairs of the vertices which have a distance of exactly <span class=\"tex-span\"><i>k<\/i><\/span> between them. Note that pairs (<span class=\"tex-span\"><i>v<\/i><\/span>, <span class=\"tex-span\"><i>u<\/i><\/span>) and (<span class=\"tex-span\"><i>u<\/i><\/span>, <span class=\"tex-span\"><i>v<\/i><\/span>) are considered to be the same pair.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200950000<\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u2009500<\/span>) \u2014 the number of vertices and the required distance between the vertices.<\/p><p>Next <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> lines describe the edges as \"<span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>\" (without the quotes) (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2260\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>), where <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> are the vertices connected by the <span class=\"tex-span\"><i>i<\/i><\/span>-th edge. All given edges are different.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u2014 the number of distinct pairs of the tree's vertices which have a distance of exactly <span class=\"tex-span\"><i>k<\/i><\/span> between them.<\/p><p>Please do not use the <span class=\"tex-font-style-tt\">%lld<\/span> specifier to read or write 64-bit integers in \u0421++. It is preferred to use the <span class=\"tex-font-style-tt\">cin<\/span>, <span class=\"tex-font-style-tt\">cout<\/span> streams or the <span class=\"tex-font-style-tt\">%I64d<\/span> specifier.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 2<br/>1 2<br/>2 3<br/>3 4<br/>2 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 3<br/>1 2<br/>2 3<br/>3 4<br/>4 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample the pairs of vertexes at distance 2 from each other are (1, 3), (1, 5), (3, 5) and (2, 4).<\/p><\/div><\/div>"}, {"contestId": 448, "index": "D", "name": "Multiplication Table", "rating": 1800, "solvedCount": 17375, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Multiplication Table<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Bizon the Champion isn't just charming, he also is very smart.<\/p><p>While some of us were learning the multiplication table, Bizon the Champion had fun in his own manner. Bizon the Champion painted an <span class=\"tex-span\"><i>n<\/i>\u2009\u00d7\u2009<i>m<\/i><\/span> multiplication table, where the element on the intersection of the <span class=\"tex-span\"><i>i<\/i><\/span>-th row and <span class=\"tex-span\"><i>j<\/i><\/span>-th column equals <span class=\"tex-span\"><i>i<\/i>\u00b7<i>j<\/i><\/span> (the rows and columns of the table are numbered starting from 1). Then he was asked: what number in the table is the <span class=\"tex-span\"><i>k<\/i><\/span>-th largest number? Bizon the Champion always answered correctly and immediately. Can you repeat his success?<\/p><p>Consider the given multiplication table. If you write out all <span class=\"tex-span\"><i>n<\/i>\u00b7<i>m<\/i><\/span> numbers from the table in the non-decreasing order, then the <span class=\"tex-span\"><i>k<\/i><\/span>-th number you write out is called the <span class=\"tex-span\"><i>k<\/i><\/span>-th largest number.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The single line contains integers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>m<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>m<\/i>\u2009\u2264\u20095\u00b710<sup class=\"upper-index\">5<\/sup>;\u00a01\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u2009<i>n<\/i>\u00b7<i>m<\/i>)<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the <span class=\"tex-span\"><i>k<\/i><\/span>-th largest number in a <span class=\"tex-span\"><i>n<\/i>\u2009\u00d7\u2009<i>m<\/i><\/span> multiplication table.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 2 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 3 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>1 10 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>5<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>A <span class=\"tex-span\">2\u2009\u00d7\u20093<\/span> multiplication table looks like this:<\/p><pre class=\"verbatim\"><br/>1 2 3<br/>2 4 6<br/><br/><\/pre><\/div><\/div>"}, {"contestId": 1509, "index": "C", "name": "The Sports Festival", "rating": 1800, "solvedCount": 16174, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. The Sports Festival<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>The student council is preparing for the relay race at the sports festival.<\/p><p>The council consists of $$$n$$$ members. They will run one after the other in the race, the speed of member $$$i$$$ is $$$s_i$$$. The <span class=\"tex-font-style-it\">discrepancy<\/span> $$$d_i$$$ of the $$$i$$$-th stage is the difference between the maximum and the minimum running speed among the first $$$i$$$ members who ran. Formally, if $$$a_i$$$ denotes the speed of the $$$i$$$-th member who participated in the race, then $$$d_i = \\max(a_1, a_2, \\dots, a_i) - \\min(a_1, a_2, \\dots, a_i)$$$.<\/p><p>You want to minimize the sum of the discrepancies $$$d_1 + d_2 + \\dots + d_n$$$. To do this, you are allowed to change the order in which the members run. What is the minimum possible sum that can be achieved?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$1 \\le n \\le 2000$$$) \u00a0\u2014 the number of members of the student council.<\/p><p>The second line contains $$$n$$$ integers $$$s_1, s_2, \\dots, s_n$$$ ($$$1 \\le s_i \\le 10^9$$$) \u00a0\u2013 the running speeds of the members.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u00a0\u2014 the minimum possible value of $$$d_1 + d_2 + \\dots + d_n$$$ after choosing the order of the members.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n3 1 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1\n5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n1 6 3 3 6 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n11\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n104 943872923 6589 889921234 1000000000 69\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2833800505\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, we may choose to make the third member run first, followed by the first member, and finally the second. Thus $$$a_1 = 2$$$, $$$a_2 = 3$$$, and $$$a_3 = 1$$$. We have:<\/p><ul> <li> $$$d_1 = \\max(2) - \\min(2) = 2 - 2 = 0$$$. <\/li><li> $$$d_2 = \\max(2, 3) - \\min(2, 3) = 3 - 2 = 1$$$. <\/li><li> $$$d_3 = \\max(2, 3, 1) - \\min(2, 3, 1) = 3 - 1 = 2$$$. <\/li><\/ul><p>The resulting sum is $$$d_1 + d_2 + d_3 = 0 + 1 + 2 = 3$$$. It can be shown that it is impossible to achieve a smaller value.<\/p><p>In the second test case, the only possible rearrangement gives $$$d_1 = 0$$$, so the minimum possible result is $$$0$$$.<\/p><\/div><\/div>"}, {"contestId": 271, "index": "D", "name": "Good Substrings", "rating": 1800, "solvedCount": 14819, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Good Substrings<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>You've got string <span class=\"tex-span\"><i>s<\/i><\/span>, consisting of small English letters. Some of the English letters are <span class=\"tex-font-style-it\">good<\/span>, the rest are <span class=\"tex-font-style-it\">bad<\/span>.<\/p><p>A substring <span class=\"tex-span\"><i>s<\/i>[<i>l<\/i>...<i>r<\/i>]<\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009|<i>s<\/i>|<\/span>) of string <span class=\"tex-span\"><i>s<\/i>\u2009\u2009=\u2009\u2009<i>s<\/i><sub class=\"lower-index\">1<\/sub><i>s<\/i><sub class=\"lower-index\">2<\/sub>...<i>s<\/i><sub class=\"lower-index\">|<i>s<\/i>|<\/sub><\/span> (where <span class=\"tex-span\">|<i>s<\/i>|<\/span> is the length of string <span class=\"tex-span\"><i>s<\/i><\/span>) is string <span class=\"tex-span\">\u2009<i>s<\/i><sub class=\"lower-index\"><i>l<\/i><\/sub><i>s<\/i><sub class=\"lower-index\"><i>l<\/i>\u2009+\u20091<\/sub>...<i>s<\/i><sub class=\"lower-index\"><i>r<\/i><\/sub><\/span>.<\/p><p>The substring <span class=\"tex-span\"><i>s<\/i>[<i>l<\/i>...<i>r<\/i>]<\/span> is <span class=\"tex-font-style-it\">good<\/span>, if among the letters <span class=\"tex-span\">\u2009<i>s<\/i><sub class=\"lower-index\"><i>l<\/i><\/sub>,\u2009<i>s<\/i><sub class=\"lower-index\"><i>l<\/i>\u2009+\u20091<\/sub>,\u2009...,\u2009<i>s<\/i><sub class=\"lower-index\"><i>r<\/i><\/sub><\/span> there are <span class=\"tex-font-style-bf\">at most<\/span> <span class=\"tex-span\"><i>k<\/i><\/span> <span class=\"tex-font-style-bf\">bad<\/span> ones (look at the sample's explanation to understand it more clear).<\/p><p>Your task is to find the number of distinct good substrings of the given string <span class=\"tex-span\"><i>s<\/i><\/span>. Two substrings <span class=\"tex-span\"><i>s<\/i>[<i>x<\/i>...<i>y<\/i>]<\/span> and <span class=\"tex-span\"><i>s<\/i>[<i>p<\/i>...<i>q<\/i>]<\/span> are considered distinct if their content is different, i.e. <span class=\"tex-span\"><i>s<\/i>[<i>x<\/i>...<i>y<\/i>]\u2009\u2260\u2009<i>s<\/i>[<i>p<\/i>...<i>q<\/i>]<\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input is the non-empty string <span class=\"tex-span\"><i>s<\/i><\/span>, consisting of small English letters, the string's length is at most <span class=\"tex-span\">1500<\/span> characters.<\/p><p>The second line of the input is the string of characters \"<span class=\"tex-font-style-tt\">0<\/span>\" and \"<span class=\"tex-font-style-tt\">1<\/span>\", the length is exactly 26 characters. If the <span class=\"tex-span\"><i>i<\/i><\/span>-th character of this string equals \"<span class=\"tex-font-style-tt\">1<\/span>\", then the <span class=\"tex-span\"><i>i<\/i><\/span>-th English letter is good, otherwise it's bad. That is, the first character of this string corresponds to letter \"<span class=\"tex-font-style-tt\">a<\/span>\", the second one corresponds to letter \"<span class=\"tex-font-style-tt\">b<\/span>\" and so on.<\/p><p>The third line of the input consists a single integer <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u2009|<i>s<\/i>|<\/span>) \u2014 the maximum acceptable number of bad characters in a good substring.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u2014 the number of distinct good substrings of string <span class=\"tex-span\"><i>s<\/i><\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>ababab<br/>01000000000000000000000000<br/>1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>5<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>acbacbacaa<br/>00000000000000000000000000<br/>2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>8<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example there are following good substrings: \"<span class=\"tex-font-style-tt\">a<\/span>\", \"<span class=\"tex-font-style-tt\">ab<\/span>\", \"<span class=\"tex-font-style-tt\">b<\/span>\", \"<span class=\"tex-font-style-tt\">ba<\/span>\", \"<span class=\"tex-font-style-tt\">bab<\/span>\".<\/p><p>In the second example there are following good substrings: \"<span class=\"tex-font-style-tt\">a<\/span>\", \"<span class=\"tex-font-style-tt\">aa<\/span>\", \"<span class=\"tex-font-style-tt\">ac<\/span>\", \"<span class=\"tex-font-style-tt\">b<\/span>\", \"<span class=\"tex-font-style-tt\">ba<\/span>\", \"<span class=\"tex-font-style-tt\">c<\/span>\", \"<span class=\"tex-font-style-tt\">ca<\/span>\", \"<span class=\"tex-font-style-tt\">cb<\/span>\".<\/p><\/div><\/div>"}, {"contestId": 1328, "index": "D", "name": "Carousel", "rating": 1800, "solvedCount": 14770, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Carousel<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>The round carousel consists of $$$n$$$ figures of animals. Figures are numbered from $$$1$$$ to $$$n$$$ in order of the carousel moving. Thus, after the $$$n$$$-th figure the figure with the number $$$1$$$ follows. Each figure has its own type \u2014 the type of the animal corresponding to this figure (the horse, the tiger and so on). The type of animal of the $$$i$$$-th figure equals $$$t_i$$$.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/5f0abcb2b32c9fef617aad2d2ebe407b1a413369.png\" style=\"zoom: 65.0%;max-width: 100.0%;max-height: 100.0%;\"/> <span class=\"tex-font-size-small\">The example of the carousel for $$$n=9$$$ and $$$t=[5, 5, 1, 15, 1, 5, 5, 1, 1]$$$<\/span>. <\/center><p>You want to color each figure in one of the colors. You think that it's boring if the carousel contains two different figures (with the distinct types of animals) going one right after another and colored in the same color.<\/p><p>Your task is to color the figures in such a way that the number of distinct colors used is the minimum possible and there are no figures of the different types going one right after another and colored in the same color. If you use exactly $$$k$$$ distinct colors, then the colors of figures should be denoted with integers from $$$1$$$ to $$$k$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The input contains one or more test cases.<\/p><p>The first line contains one integer $$$q$$$ ($$$1 \\le q \\le 10^4$$$) \u2014 the number of test cases in the test. Then $$$q$$$ test cases follow. One test case is given on two lines.<\/p><p>The first line of the test case contains one integer $$$n$$$ ($$$3 \\le n \\le 2 \\cdot 10^5$$$) \u2014 the number of figures in the carousel. Figures are numbered from $$$1$$$ to $$$n$$$ in order of carousel moving. Assume that after the $$$n$$$-th figure the figure $$$1$$$ goes.<\/p><p>The second line of the test case contains $$$n$$$ integers $$$t_1, t_2, \\dots, t_n$$$ ($$$1 \\le t_i \\le 2 \\cdot 10^5$$$), where $$$t_i$$$ is the type of the animal of the $$$i$$$-th figure.<\/p><p>The sum of $$$n$$$ over all test cases does not exceed $$$2\\cdot10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$q$$$ answers, for each test case print two lines.<\/p><p>In the first line print one integer $$$k$$$ \u2014 the minimum possible number of distinct colors of figures.<\/p><p>In the second line print $$$n$$$ integers $$$c_1, c_2, \\dots, c_n$$$ ($$$1 \\le c_i \\le k$$$), where $$$c_i$$$ is the color of the $$$i$$$-th figure. If there are several answers, you can print any.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n5\n1 2 1 2 2\n6\n1 2 2 1 2 2\n5\n1 2 1 2 3\n3\n10 10 10\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n1 2 1 2 2\n2\n2 1 2 1 2 1\n3\n2 3 2 3 1\n1\n1 1 1 \n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 459, "index": "D", "name": "Pashmak and Parmida's problem", "rating": 1800, "solvedCount": 14031, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Pashmak and Parmida's problem<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Parmida is a clever girl and she wants to participate in Olympiads this year. Of course she wants her partner to be clever too (although he's not)! Parmida has prepared the following test problem for Pashmak.<\/p><p>There is a sequence <span class=\"tex-span\"><i>a<\/i><\/span> that consists of <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span>. Let's denote <span class=\"tex-span\"><i>f<\/i>(<i>l<\/i>,\u2009<i>r<\/i>,\u2009<i>x<\/i>)<\/span> the number of indices <span class=\"tex-span\"><i>k<\/i><\/span> such that: <span class=\"tex-span\"><i>l<\/i>\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u2009<i>r<\/i><\/span> and <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>\u2009=\u2009<i>x<\/i><\/span>. His task is to calculate the number of pairs of indicies <span class=\"tex-span\"><i>i<\/i>,\u2009<i>j<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>i<\/i>\u2009&lt;\u2009<i>j<\/i>\u2009\u2264\u2009<i>n<\/i>)<\/span> such that <span class=\"tex-span\"><i>f<\/i>(1,\u2009<i>i<\/i>,\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>)\u2009&gt;\u2009<i>f<\/i>(<i>j<\/i>,\u2009<i>n<\/i>,\u2009<i>a<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>)<\/span>.<\/p><p>Help Pashmak with the test.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains an integer <span class=\"tex-span\"><i>n<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup>)<\/span>. The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> space-separated integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup>)<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u2014 the answer to the problem.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>7<br/>1 2 1 1 2 2 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>8<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>1 1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1 2 3 4 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1324, "index": "F", "name": "Maximum White Subtree", "rating": 1800, "solvedCount": 14030, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Maximum White Subtree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a tree consisting of $$$n$$$ vertices. A tree is a connected undirected graph with $$$n-1$$$ edges. Each vertex $$$v$$$ of this tree has a color assigned to it ($$$a_v = 1$$$ if the vertex $$$v$$$ is white and $$$0$$$ if the vertex $$$v$$$ is black).<\/p><p>You have to solve the following problem for each vertex $$$v$$$: what is the maximum difference between the number of white and the number of black vertices you can obtain if you choose some subtree of the given tree that <span class=\"tex-font-style-bf\">contains<\/span> the vertex $$$v$$$? The subtree of the tree is the connected subgraph of the given tree. More formally, if you choose the subtree that contains $$$cnt_w$$$ white vertices and $$$cnt_b$$$ black vertices, you have to maximize $$$cnt_w - cnt_b$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains one integer $$$n$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$) \u2014 the number of vertices in the tree.<\/p><p>The second line of the input contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$0 \\le a_i \\le 1$$$), where $$$a_i$$$ is the color of the $$$i$$$-th vertex.<\/p><p>Each of the next $$$n-1$$$ lines describes an edge of the tree. Edge $$$i$$$ is denoted by two integers $$$u_i$$$ and $$$v_i$$$, the labels of vertices it connects $$$(1 \\le u_i, v_i \\le n, u_i \\ne v_i$$$).<\/p><p>It is guaranteed that the given edges form a tree.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$n$$$ integers $$$res_1, res_2, \\dots, res_n$$$, where $$$res_i$$$ is the maximum possible difference between the number of white and black vertices in some subtree that contains the vertex $$$i$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n9\n0 1 1 1 0 0 0 0 1\n1 2\n1 3\n3 4\n3 5\n2 6\n4 7\n6 8\n5 9\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2 2 2 2 2 1 1 0 2 \n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n0 0 1 0\n1 2\n1 3\n1 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0 -1 1 -1 \n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The first example is shown below:<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/c9bf2c6663342bfd7b533a049ca2ba27b9f4b4df.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>The black vertices have bold borders.<\/p><p>In the second example, the best subtree for vertices $$$2, 3$$$ and $$$4$$$ are vertices $$$2, 3$$$ and $$$4$$$ correspondingly. And the best subtree for the vertex $$$1$$$ is the subtree consisting of vertices $$$1$$$ and $$$3$$$.<\/p><\/div><\/div>"}, {"contestId": 220, "index": "B", "name": "Little Elephant and Array", "rating": 1800, "solvedCount": 13627, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Little Elephant and Array<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>The Little Elephant loves playing with arrays. He has array <span class=\"tex-span\"><i>a<\/i><\/span>, consisting of <span class=\"tex-span\"><i>n<\/i><\/span> positive integers, indexed from 1 to <span class=\"tex-span\"><i>n<\/i><\/span>. Let's denote the number with index <span class=\"tex-span\"><i>i<\/i><\/span> as <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. <\/p><p>Additionally the Little Elephant has <span class=\"tex-span\"><i>m<\/i><\/span> queries to the array, each query is characterised by a pair of integers <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>l<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>\u2009\u2264\u2009<i>r<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>)<\/span>. For each query <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>,\u2009<i>r<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span> the Little Elephant has to count, how many numbers <span class=\"tex-span\"><i>x<\/i><\/span> exist, such that number <span class=\"tex-span\"><i>x<\/i><\/span> occurs exactly <span class=\"tex-span\"><i>x<\/i><\/span> times among numbers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>l<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\"><i>l<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>\u2009+\u20091<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>r<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/sub><\/span>.<\/p><p>Help the Little Elephant to count the answers to all queries.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two space-separated integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>m<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>)<\/span> \u2014 the size of array <span class=\"tex-span\"><i>a<\/i><\/span> and the number of queries to it. The next line contains <span class=\"tex-span\"><i>n<\/i><\/span> space-separated positive integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub><\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">2<\/sub><\/span>, <span class=\"tex-span\">...<\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup>)<\/span>. Next <span class=\"tex-span\"><i>m<\/i><\/span> lines contain descriptions of queries, one per line. The <span class=\"tex-span\"><i>j<\/i><\/span>-th of these lines contains the description of the <span class=\"tex-span\"><i>j<\/i><\/span>-th query as two space-separated integers <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>l<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>\u2009\u2264\u2009<i>r<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>)<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In <span class=\"tex-span\"><i>m<\/i><\/span> lines print <span class=\"tex-span\"><i>m<\/i><\/span> integers \u2014 the answers to the queries. The <span class=\"tex-span\"><i>j<\/i><\/span>-th line should contain the answer to the <span class=\"tex-span\"><i>j<\/i><\/span>-th query.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>7 2<br/>3 1 2 2 3 3 7<br/>1 7<br/>3 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/>1<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1396, "index": "B", "name": "Stoned Game", "rating": 1800, "solvedCount": 13347, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Stoned Game<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>T is playing a game with his friend, HL.<\/p><p>There are $$$n$$$ piles of stones, the $$$i$$$-th pile initially has $$$a_i$$$ stones. <\/p><p>T and HL will take alternating turns, with T going first. In each turn, a player chooses a non-empty pile and then removes a single stone from it. However, one cannot choose a pile that has been chosen in the previous turn (the pile that was chosen by the other player, or if the current turn is the first turn then the player can choose any non-empty pile). The player who cannot choose a pile in his turn loses, and the game ends.<\/p><p>Assuming both players play optimally, given the starting configuration of $$$t$$$ games, determine the winner of each game.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains a single integer $$$t$$$ $$$(1 \\le t \\le 100)$$$ \u2014 the number of games. The description of the games follows. Each description contains two lines:<\/p><p>The first line contains a single integer $$$n$$$ $$$(1 \\le n \\le 100)$$$ \u2014 the number of piles.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ $$$(1 \\le a_i \\le 100)$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each game, print on a single line the name of the winner, \"<span class=\"tex-font-style-tt\">T<\/span>\" or \"<span class=\"tex-font-style-tt\">HL<\/span>\" (without quotes)<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n1\n2\n2\n1 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nT\nHL\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first game, T removes a single stone from the only pile in his first turn. After that, although the pile still contains $$$1$$$ stone, HL cannot choose from this pile because it has been chosen by T in the previous turn. Therefore, T is the winner.<\/p><\/div><\/div>"}, {"contestId": 706, "index": "D", "name": "Vasiliy's Multiset", "rating": 1800, "solvedCount": 13338, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Vasiliy's Multiset<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Author has gone out of the stories about Vasiliy, so here is just a formal task description.<\/p><p>You are given <span class=\"tex-span\"><i>q<\/i><\/span> queries and a multiset <span class=\"tex-span\"><i>A<\/i><\/span>, initially containing only integer <span class=\"tex-span\">0<\/span>. There are three types of queries:<\/p><ol> <li> \"<span class=\"tex-font-style-tt\">+ x<\/span>\"\u00a0\u2014 add integer <span class=\"tex-span\"><i>x<\/i><\/span> to multiset <span class=\"tex-span\"><i>A<\/i><\/span>.<\/li><li> \"<span class=\"tex-font-style-tt\">- x<\/span>\"\u00a0\u2014 erase one occurrence of integer <span class=\"tex-span\"><i>x<\/i><\/span> from multiset <span class=\"tex-span\"><i>A<\/i><\/span>. It's guaranteed that at least one <span class=\"tex-span\"><i>x<\/i><\/span> is present in the multiset <span class=\"tex-span\"><i>A<\/i><\/span> before this query.<\/li><li> \"<span class=\"tex-font-style-tt\">? x<\/span>\"\u00a0\u2014 you are given integer <span class=\"tex-span\"><i>x<\/i><\/span> and need to compute the value <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/e8f2e13983d6f05b3e4b5b3f51e3fa786849dc1b.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>, i.e. the maximum value of bitwise exclusive OR (also know as XOR) of integer <span class=\"tex-span\"><i>x<\/i><\/span> and some integer <span class=\"tex-span\"><i>y<\/i><\/span> from the multiset <span class=\"tex-span\"><i>A<\/i><\/span>.<\/li><\/ol><p>Multiset is a set, where equal elements are allowed.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains a single integer <span class=\"tex-span\"><i>q<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>q<\/i>\u2009\u2264\u2009200\u2009000<\/span>)\u00a0\u2014 the number of queries Vasiliy has to perform.<\/p><p>Each of the following <span class=\"tex-span\"><i>q<\/i><\/span> lines of the input contains one of three characters '<span class=\"tex-font-style-tt\">+<\/span>', '<span class=\"tex-font-style-tt\">-<\/span>' or '<span class=\"tex-font-style-tt\">?<\/span>' and an integer <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>). It's guaranteed that there is at least one query of the third type.<\/p><p>Note, that the integer <span class=\"tex-span\">0<\/span> will always be present in the set <span class=\"tex-span\"><i>A<\/i><\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query of the type '<span class=\"tex-font-style-tt\">?<\/span>' print one integer\u00a0\u2014 the maximum value of bitwise exclusive OR (XOR) of integer <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and some integer from the multiset <span class=\"tex-span\"><i>A<\/i><\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>10<br/>+ 8<br/>+ 9<br/>+ 11<br/>+ 6<br/>+ 1<br/>? 3<br/>- 8<br/>? 3<br/>? 8<br/>? 11<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>11<br/>10<br/>14<br/>13<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>After first five operations multiset <span class=\"tex-span\"><i>A<\/i><\/span> contains integers <span class=\"tex-span\">0<\/span>, <span class=\"tex-span\">8<\/span>, <span class=\"tex-span\">9<\/span>, <span class=\"tex-span\">11<\/span>, <span class=\"tex-span\">6<\/span> and <span class=\"tex-span\">1<\/span>.<\/p><p>The answer for the sixth query is integer <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/9e2f3d4f1a7c134a5695ba1d548df2b4f9292206.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>\u00a0\u2014 maximum among integers <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/6cb1b5a0f9bbad177b1de700e918187c8fb3e972.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>, <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/7644536d2010111824755b5dd2b6043340b2bf4d.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>, <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/9a437d1611f6c2ae5cd9a275a6ab2df61296988e.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>, <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/4e3eeab99fa495ecdcd103c68de47dd72943016f.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> and <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/97b73b0f3e59862ed9f80fa83527d97e0ed0a084.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>.<\/p><\/div><\/div>"}, {"contestId": 1398, "index": "D", "name": "Colored Rectangles", "rating": 1800, "solvedCount": 12824, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Colored Rectangles<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given three multisets of pairs of colored sticks: <\/p><ul> <li> $$$R$$$ pairs of red sticks, the first pair has length $$$r_1$$$, the second pair has length $$$r_2$$$, $$$\\dots$$$, the $$$R$$$-th pair has length $$$r_R$$$; <\/li><li> $$$G$$$ pairs of green sticks, the first pair has length $$$g_1$$$, the second pair has length $$$g_2$$$, $$$\\dots$$$, the $$$G$$$-th pair has length $$$g_G$$$; <\/li><li> $$$B$$$ pairs of blue sticks, the first pair has length $$$b_1$$$, the second pair has length $$$b_2$$$, $$$\\dots$$$, the $$$B$$$-th pair has length $$$b_B$$$; <\/li><\/ul><p>You are constructing rectangles from these pairs of sticks with the following process: <\/p><ol> <li> take a pair of sticks of one color; <\/li><li> take a pair of sticks of another color different from the first one; <\/li><li> add the area of the resulting rectangle to the total area. <\/li><\/ol><p>Thus, you get such rectangles that their opposite sides are the same color and their adjacent sides are not the same color.<\/p><p>Each pair of sticks can be used at most once, some pairs can be left unused. You are not allowed to split a pair into independent sticks.<\/p><p>What is the maximum area you can achieve?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains three integers $$$R$$$, $$$G$$$, $$$B$$$ ($$$1 \\le R, G, B \\le 200$$$)\u00a0\u2014 the number of pairs of red sticks, the number of pairs of green sticks and the number of pairs of blue sticks.<\/p><p>The second line contains $$$R$$$ integers $$$r_1, r_2, \\dots, r_R$$$ ($$$1 \\le r_i \\le 2000$$$)\u00a0\u2014 the lengths of sticks in each pair of red sticks.<\/p><p>The third line contains $$$G$$$ integers $$$g_1, g_2, \\dots, g_G$$$ ($$$1 \\le g_i \\le 2000$$$)\u00a0\u2014 the lengths of sticks in each pair of green sticks.<\/p><p>The fourth line contains $$$B$$$ integers $$$b_1, b_2, \\dots, b_B$$$ ($$$1 \\le b_i \\le 2000$$$)\u00a0\u2014 the lengths of sticks in each pair of blue sticks.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the maximum possible total area of the constructed rectangles.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1 1 1\n3\n5\n4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n20\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2 1 3\n9 5\n1\n2 8 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n99\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n10 1 1\n11 7 20 15 19 14 2 4 13 14\n8\n11\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n372\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example you can construct one of these rectangles: red and green with sides $$$3$$$ and $$$5$$$, red and blue with sides $$$3$$$ and $$$4$$$ and green and blue with sides $$$5$$$ and $$$4$$$. The best area of them is $$$4 \\times 5 = 20$$$.<\/p><p>In the second example the best rectangles are: red/blue $$$9 \\times 8$$$, red/blue $$$5 \\times 5$$$, green/blue $$$2 \\times 1$$$. So the total area is $$$72 + 25 + 2 = 99$$$.<\/p><p>In the third example the best rectangles are: red/green $$$19 \\times 8$$$ and red/blue $$$20 \\times 11$$$. The total area is $$$152 + 220 = 372$$$. Note that you can't construct more rectangles because you are not allowed to have both pairs taken to be the same color.<\/p><\/div><\/div>"}, {"contestId": 580, "index": "D", "name": "Kefa and Dishes", "rating": 1800, "solvedCount": 12762, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Kefa and Dishes<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>When Kefa came to the restaurant and sat at a table, the waiter immediately brought him the menu. There were <span class=\"tex-span\"><i>n<\/i><\/span> dishes. Kefa knows that he needs exactly <span class=\"tex-span\"><i>m<\/i><\/span> dishes. But at that, he doesn't want to order the same dish twice to taste as many dishes as possible. <\/p><p>Kefa knows that the <span class=\"tex-span\"><i>i<\/i><\/span>-th dish gives him <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> units of satisfaction. But some dishes do not go well together and some dishes go very well together. Kefa set to himself <span class=\"tex-span\"><i>k<\/i><\/span> rules of eating food of the following type \u2014 if he eats dish <span class=\"tex-span\"><i>x<\/i><\/span> exactly before dish <span class=\"tex-span\"><i>y<\/i><\/span> (there should be no other dishes between <span class=\"tex-span\"><i>x<\/i><\/span> and <span class=\"tex-span\"><i>y<\/i><\/span>), then his satisfaction level raises by <span class=\"tex-span\"><i>c<\/i><\/span>. <\/p><p>Of course, our parrot wants to get some maximal possible satisfaction from going to the restaurant. Help him in this hard task!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains three space-separated numbers, <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>m<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200918<\/span>, <span class=\"tex-span\">0\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u2009<i>n<\/i>\u2009*\u2009(<i>n<\/i>\u2009-\u20091)<\/span>) \u2014 the number of dishes on the menu, the number of portions Kefa needs to eat to get full and the number of eating rules.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> space-separated numbers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, (<span class=\"tex-span\">0\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) \u2014 the satisfaction he gets from the <span class=\"tex-span\"><i>i<\/i><\/span>-th dish.<\/p><p>Next <span class=\"tex-span\"><i>k<\/i><\/span> lines contain the rules. The <span class=\"tex-span\"><i>i<\/i><\/span>-th rule is described by the three numbers <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\">0\u2009\u2264\u2009<i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>). That means that if you eat dish <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> right before dish <span class=\"tex-span\"><i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, then the Kefa's satisfaction increases by <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. It is guaranteed that there are no such pairs of indexes <span class=\"tex-span\"><i>i<\/i><\/span> and <span class=\"tex-span\"><i>j<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>i<\/i>\u2009&lt;\u2009<i>j<\/i>\u2009\u2264\u2009<i>k<\/i><\/span>), that <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009=\u2009<i>x<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009=\u2009<i>y<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In the single line of the output print the maximum satisfaction that Kefa can get from going to the restaurant.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 2 1<br/>1 1<br/>2 1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 3 2<br/>1 2 3 4<br/>2 1 5<br/>3 4 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>12<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample it is best to first eat the second dish, then the first one. Then we get one unit of satisfaction for each dish and plus one more for the rule.<\/p><p>In the second test the fitting sequences of choice are 4 2 1 or 2 1 4. In both cases we get satisfaction 7 for dishes and also, if we fulfill rule 1, we get an additional satisfaction 5.<\/p><\/div><\/div>"}, {"contestId": 300, "index": "C", "name": "Beautiful Numbers", "rating": 1800, "solvedCount": 12731, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Beautiful Numbers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Vitaly is a very weird man. He's got two favorite digits <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span>. Vitaly calls a positive integer <span class=\"tex-font-style-it\">good<\/span>, if the decimal representation of this integer only contains digits <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span>. Vitaly calls a good number <span class=\"tex-font-style-it\">excellent<\/span>, if the sum of its digits is a good number.<\/p><p>For example, let's say that Vitaly's favourite digits are <span class=\"tex-span\">1<\/span> and <span class=\"tex-span\">3<\/span>, then number <span class=\"tex-span\">12<\/span> isn't good and numbers <span class=\"tex-span\">13<\/span> or <span class=\"tex-span\">311<\/span> are. Also, number <span class=\"tex-span\">111<\/span> is excellent and number <span class=\"tex-span\">11<\/span> isn't. <\/p><p>Now Vitaly is wondering, how many excellent numbers of length exactly <span class=\"tex-span\"><i>n<\/i><\/span> are there. As this number can be rather large, he asks you to count the remainder after dividing it by <span class=\"tex-span\">1000000007<\/span> <span class=\"tex-span\">(10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097)<\/span>.<\/p><p>A number's length is the number of digits in its decimal representation without leading zeroes.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains three integers: <span class=\"tex-span\"><i>a<\/i><\/span>, <span class=\"tex-span\"><i>b<\/i><\/span>, <span class=\"tex-span\"><i>n<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>a<\/i>\u2009&lt;\u2009<i>b<\/i>\u2009\u2264\u20099,\u20091\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup>)<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u2014 the answer to the problem modulo <span class=\"tex-span\">1000000007<\/span> <span class=\"tex-span\">(10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097)<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>1 3 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 3 10<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>165<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1437, "index": "C", "name": "Chef Monocarp", "rating": 1800, "solvedCount": 12652, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Chef Monocarp<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Chef Monocarp has just put $$$n$$$ dishes into an oven. He knows that the $$$i$$$-th dish has its optimal cooking time equal to $$$t_i$$$ minutes.<\/p><p>At any <span class=\"tex-font-style-bf\">positive integer<\/span> minute $$$T$$$ Monocarp can put <span class=\"tex-font-style-bf\">no more than one<\/span> dish out of the oven. If the $$$i$$$-th dish is put out at some minute $$$T$$$, then its unpleasant value is $$$|T - t_i|$$$\u00a0\u2014 the absolute difference between $$$T$$$ and $$$t_i$$$. Once the dish is out of the oven, it can't go back in.<\/p><p>Monocarp should put all the dishes out of the oven. What is the minimum total unpleasant value Monocarp can obtain?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$q$$$ ($$$1 \\le q \\le 200$$$)\u00a0\u2014 the number of testcases.<\/p><p>Then $$$q$$$ testcases follow.<\/p><p>The first line of the testcase contains a single integer $$$n$$$ ($$$1 \\le n \\le 200$$$)\u00a0\u2014 the number of dishes in the oven.<\/p><p>The second line of the testcase contains $$$n$$$ integers $$$t_1, t_2, \\dots, t_n$$$ ($$$1 \\le t_i \\le n$$$)\u00a0\u2014 the optimal cooking time for each dish.<\/p><p>The sum of $$$n$$$ over all $$$q$$$ testcases doesn't exceed $$$200$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer for each testcase\u00a0\u2014 the minimum total unpleasant value Monocarp can obtain when he puts out all the dishes out of the oven. Remember that Monocarp can only put the dishes out at positive integer minutes and no more than one dish at any minute.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n6\n4 2 4 4 5 2\n7\n7 7 7 7 7 7 7\n1\n1\n5\n5 1 2 4 3\n4\n1 4 4 4\n21\n21 8 1 4 1 5 21 1 8 21 11 21 11 3 12 8 19 15 9 11 13\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n12\n0\n0\n2\n21\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example Monocarp can put out the dishes at minutes $$$3, 1, 5, 4, 6, 2$$$. That way the total unpleasant value will be $$$|4 - 3| + |2 - 1| + |4 - 5| + |4 - 4| + |6 - 5| + |2 - 2| = 4$$$.<\/p><p>In the second example Monocarp can put out the dishes at minutes $$$4, 5, 6, 7, 8, 9, 10$$$.<\/p><p>In the third example Monocarp can put out the dish at minute $$$1$$$.<\/p><p>In the fourth example Monocarp can put out the dishes at minutes $$$5, 1, 2, 4, 3$$$.<\/p><p>In the fifth example Monocarp can put out the dishes at minutes $$$1, 3, 4, 5$$$.<\/p><\/div><\/div>"}, {"contestId": 1355, "index": "C", "name": "Count Triangles", "rating": 1800, "solvedCount": 12393, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Count Triangles<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Like any unknown mathematician, Yuri has favourite numbers: $$$A$$$, $$$B$$$, $$$C$$$, and $$$D$$$, where $$$A \\leq B \\leq C \\leq D$$$. Yuri also likes triangles and once he thought: how many non-degenerate triangles with integer sides $$$x$$$, $$$y$$$, and $$$z$$$ exist, such that $$$A \\leq x \\leq B \\leq y \\leq C \\leq z \\leq D$$$ holds?<\/p><p>Yuri is preparing problems for a new contest now, so he is very busy. That's why he asked you to calculate the number of triangles with described property.<\/p><p>The triangle is called non-degenerate if and only if its vertices are not collinear.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains four integers: $$$A$$$, $$$B$$$, $$$C$$$ and $$$D$$$ ($$$1 \\leq A \\leq B \\leq C \\leq D \\leq 5 \\cdot 10^5$$$)\u00a0\u2014 Yuri's favourite numbers.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the number of non-degenerate triangles with integer sides $$$x$$$, $$$y$$$, and $$$z$$$ such that the inequality $$$A \\leq x \\leq B \\leq y \\leq C \\leq z \\leq D$$$ holds.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1 2 3 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1 2 2 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n500000 500000 500000 500000\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example Yuri can make up triangles with sides $$$(1, 3, 3)$$$, $$$(2, 2, 3)$$$, $$$(2, 3, 3)$$$ and $$$(2, 3, 4)$$$.<\/p><p>In the second example Yuri can make up triangles with sides $$$(1, 2, 2)$$$, $$$(2, 2, 2)$$$ and $$$(2, 2, 3)$$$.<\/p><p>In the third example Yuri can make up only one equilateral triangle with sides equal to $$$5 \\cdot 10^5$$$.<\/p><\/div><\/div>"}, {"contestId": 1326, "index": "D2", "name": "Prefix-Suffix Palindrome (Hard version)", "rating": 1800, "solvedCount": 12273, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D2. Prefix-Suffix Palindrome (Hard version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is the hard version of the problem. The difference is the constraint on the sum of lengths of strings and the number of test cases. You can make hacks only if you solve all versions of this task.<\/span><\/p><p>You are given a string $$$s$$$, consisting of lowercase English letters. Find the longest string, $$$t$$$, which satisfies the following conditions: <\/p><ul> <li> The length of $$$t$$$ does not exceed the length of $$$s$$$. <\/li><li> $$$t$$$ is a palindrome. <\/li><li> There exists two strings $$$a$$$ and $$$b$$$ (possibly empty), such that $$$t = a + b$$$ ( \"<span class=\"tex-font-style-tt\">$$$+$$$<\/span>\" represents concatenation), and $$$a$$$ is prefix of $$$s$$$ while $$$b$$$ is suffix of $$$s$$$. <\/li><\/ul><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The input consists of multiple test cases. The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 10^5$$$), the number of test cases. The next $$$t$$$ lines each describe a test case.<\/p><p>Each test case is a non-empty string $$$s$$$, consisting of lowercase English letters.<\/p><p>It is guaranteed that the sum of lengths of strings over all test cases does not exceed $$$10^6$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print the longest string which satisfies the conditions described above. If there exists multiple possible solutions, print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\na\nabcdfdcecba\nabbaxyzyx\ncodeforces\nacbba\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\na\nabcdfdcba\nxyzyx\nc\nabba\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test, the string $$$s = $$$\"<span class=\"tex-font-style-tt\">a<\/span>\" satisfies all conditions.<\/p><p>In the second test, the string \"<span class=\"tex-font-style-tt\">abcdfdcba<\/span>\" satisfies all conditions, because:<\/p><ul> <li> Its length is $$$9$$$, which does not exceed the length of the string $$$s$$$, which equals $$$11$$$. <\/li><li> It is a palindrome. <\/li><li> \"<span class=\"tex-font-style-tt\">abcdfdcba<\/span>\" $$$=$$$ \"<span class=\"tex-font-style-tt\">abcdfdc<\/span>\" $$$+$$$ \"<span class=\"tex-font-style-tt\">ba<\/span>\", and \"<span class=\"tex-font-style-tt\">abcdfdc<\/span>\" is a prefix of $$$s$$$ while \"<span class=\"tex-font-style-tt\">ba<\/span>\" is a suffix of $$$s$$$. <\/li><\/ul><p>It can be proven that there does not exist a longer string which satisfies the conditions.<\/p><p>In the fourth test, the string \"<span class=\"tex-font-style-tt\">c<\/span>\" is correct, because \"<span class=\"tex-font-style-tt\">c<\/span>\" $$$=$$$ \"<span class=\"tex-font-style-tt\">c<\/span>\" $$$+$$$ \"<span class=\"tex-font-style-tt\"><\/span>\" and $$$a$$$ or $$$b$$$ can be empty. The other possible solution for this test is \"<span class=\"tex-font-style-tt\">s<\/span>\".<\/p><\/div><\/div>"}, {"contestId": 1974, "index": "E", "name": "Money Buys Happiness", "rating": 1800, "solvedCount": 12046, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Money Buys Happiness<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Being a physicist, Charlie likes to plan his life in simple and precise terms. <\/p><p>For the next $$$m$$$ months, starting with no money, Charlie will work hard and earn $$$x$$$ pounds per month. For the $$$i$$$-th month $$$(1 \\le i \\le m)$$$, there'll be a single opportunity of paying cost $$$c_i$$$ pounds to obtain happiness $$$h_i$$$.<\/p><p>Borrowing is not allowed. Money earned in the $$$i$$$-th month can only be spent in a later $$$j$$$-th month ($$$j \\gt i$$$).<\/p><p>Since physicists don't code, help Charlie find the maximum obtainable sum of happiness.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains a single integer $$$t$$$ ($$$1 \\le t \\le 1000$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains two integers, $$$m$$$ and $$$x$$$ ($$$1 \\le m \\le 50$$$, $$$1 \\le x \\le 10^8$$$)\u00a0\u2014 the total number of months and the monthly salary.<\/p><p>The $$$i$$$-th of the following $$$m$$$ lines contains two integers, $$$c_i$$$ and $$$h_i$$$ ($$$0 \\le c_i \\le 10^8$$$, $$$1 \\le h_i \\le 10^3$$$)\u00a0\u2014 the cost and happiness on offer for the $$$i$$$-th month. Note that some happiness may be free ($$$c_i=0$$$ for some $$$i$$$'s).<\/p><p>It is guaranteed that the sum of $$$\\sum_i h_i$$$ over all test cases does not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print a single integer, the maximum sum of happiness Charlie could obtain.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 80<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">0 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">200 100<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 100<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">70 100<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">100 200<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">150 150<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">5 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">2 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">2 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">4 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">5 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">3 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">5 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">3 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">3 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">3 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n10\n200\n15\n1\n9\n9\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, Charlie only gets paid at the end of the month, so is unable to afford anything.<\/p><p>In the second test case, Charlie obtains the free happiness in the first month.<\/p><p>In the third test case, it's optimal for Charlie to buy happiness in the second month. Even with money left at the end, Charlie could not go back in time to obtain the happiness on offer in the first month.<\/p><\/div><\/div>"}, {"contestId": 1548, "index": "B", "name": "Integers Have Friends", "rating": 1800, "solvedCount": 11739, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Integers Have Friends<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>British mathematician John Littlewood once said about Indian mathematician Srinivasa Ramanujan that \"every positive integer was one of his personal friends.\"<\/p><p>It turns out that positive integers can also be friends with each other! You are given an array $$$a$$$ of distinct positive integers. <\/p><p>Define a <span class=\"tex-font-style-bf\">subarray<\/span> $$$a_i, a_{i+1}, \\ldots, a_j$$$ to be a <span class=\"tex-font-style-it\">friend group<\/span> if and only if there exists an integer $$$m \\ge 2$$$ such that $$$a_i \\bmod m = a_{i+1} \\bmod m = \\ldots = a_j \\bmod m$$$, where $$$x \\bmod y$$$ denotes the remainder when $$$x$$$ is divided by $$$y$$$.<\/p><p>Your friend Gregor wants to know the size of the largest friend group in $$$a$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 2\\cdot 10^4$$$). <\/p><p>Each test case begins with a line containing the integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$), the size of the array $$$a$$$.<\/p><p>The next line contains $$$n$$$ positive integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le {10}^{18}$$$), representing the contents of the array $$$a$$$. It is guaranteed that all the numbers in $$$a$$$ are <span class=\"tex-font-style-bf\">distinct<\/span>.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases is less than $$$2\\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Your output should consist of $$$t$$$ lines. Each line should consist of a single integer, the size of the largest friend group in $$$a$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n5\n1 5 2 4 6\n4\n8 2 5 10\n2\n1000 2000\n8\n465 55 3 54 234 12 45 78\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n3\n2\n6\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the array is $$$[1,5,2,4,6]$$$. The largest friend group is $$$[2,4,6]$$$, since all those numbers are congruent to $$$0$$$ modulo $$$2$$$, so $$$m=2$$$.<\/p><p>In the second test case, the array is $$$[8,2,5,10]$$$. The largest friend group is $$$[8,2,5]$$$, since all those numbers are congruent to $$$2$$$ modulo $$$3$$$, so $$$m=3$$$.<\/p><p>In the third case, the largest friend group is $$$[1000,2000]$$$. There are clearly many possible values of $$$m$$$ that work.<\/p><\/div><\/div>"}, {"contestId": 242, "index": "C", "name": "King's Path", "rating": 1800, "solvedCount": 11704, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. King's Path<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>The black king is standing on a chess field consisting of <span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup><\/span> rows and <span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup><\/span> columns. We will consider the rows of the field numbered with integers from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup><\/span> from top to bottom. The columns are similarly numbered with integers from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup><\/span> from left to right. We will denote a cell of the field that is located in the <span class=\"tex-span\"><i>i<\/i><\/span>-th row and <span class=\"tex-span\"><i>j<\/i><\/span>-th column as <span class=\"tex-span\">(<i>i<\/i>,\u2009<i

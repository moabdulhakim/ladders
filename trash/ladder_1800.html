>j<\/i>)<\/span>.<\/p><p>You know that some squares of the given chess field are <span class=\"tex-font-style-it\">allowed<\/span>. All allowed cells of the chess field are given as <span class=\"tex-span\"><i>n<\/i><\/span> segments. Each segment is described by three integers <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\">(<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>)<\/span>, denoting that cells in columns from number <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> to number <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> inclusive in the <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>-th row are allowed.<\/p><p>Your task is to find the minimum number of moves the king needs to get from square <span class=\"tex-span\">(<i>x<\/i><sub class=\"lower-index\">0<\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\">0<\/sub>)<\/span> to square <span class=\"tex-span\">(<i>x<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\">1<\/sub>)<\/span>, provided that he only moves along the allowed cells. In other words, the king can be located only on allowed cells on his way.<\/p><p>Let us remind you that a chess king can move to any of the neighboring cells in one move. Two cells of a chess field are considered neighboring if they share at least one point.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains four space-separated integers <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\">0<\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\">0<\/sub>,\u2009<i>x<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\">1<\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\">0<\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\">0<\/sub>,\u2009<i>x<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\">1<\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup>)<\/span>, denoting the initial and the final positions of the king.<\/p><p>The second line contains a single integer <span class=\"tex-span\"><i>n<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>)<\/span>, denoting the number of segments of allowed cells. Next <span class=\"tex-span\"><i>n<\/i><\/span> lines contain the descriptions of these segments. The <span class=\"tex-span\"><i>i<\/i><\/span>-th line contains three space-separated integers <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup>,\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>)<\/span>, denoting that cells in columns from number <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> to number <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> inclusive in the <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>-th row are allowed. Note that the segments of the allowed cells can intersect and embed arbitrarily.<\/p><p>It is guaranteed that the king's initial and final position are allowed cells. It is guaranteed that the king's initial and the final positions do not coincide. It is guaranteed that the total length of all given segments doesn't exceed <span class=\"tex-span\">10<sup class=\"upper-index\">5<\/sup><\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If there is no path between the initial and final position along allowed cells, print -1.<\/p><p>Otherwise print a single integer \u2014 the minimum number of moves the king needs to get from the initial position to the final one.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 7 6 11<br/>3<br/>5 3 8<br/>6 7 11<br/>5 2 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 4 3 10<br/>3<br/>3 1 4<br/>4 5 9<br/>3 10 10<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>1 1 2 10<br/>2<br/>1 1 3<br/>2 6 10<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>-1<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 584, "index": "D", "name": "Dima and Lisa", "rating": 1800, "solvedCount": 11443, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Dima and Lisa<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Dima loves representing an odd number as the sum of multiple primes, and Lisa loves it when there are at most three primes. Help them to represent the given number as the sum of at most than three primes.<\/p><p>More formally, you are given an <span class=\"tex-font-style-bf\">odd<\/span> numer <span class=\"tex-span\"><i>n<\/i><\/span>. Find a set of numbers <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>k<\/i><\/span>), such that<\/p><ol><li> <span class=\"tex-span\">1\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u20093<\/span><\/li><li> <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is a prime<\/li><li> <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/1e83aef23423bb7914377eba80196ccb244e1b29.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/li><\/ol><p>The numbers <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> do not necessarily have to be distinct. It is guaranteed that at least one possible solution exists.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The single line contains an odd number <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">3\u2009\u2264\u2009<i>n<\/i>\u2009&lt;\u200910<sup class=\"upper-index\">9<\/sup><\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In the first line print <span class=\"tex-span\"><i>k<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u20093)<\/span>, showing how many numbers are in the representation you found.<\/p><p>In the second line print numbers <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> in any order. If there are multiple possible solutions, you can print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>27<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/>5 11 11<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>A prime is an integer strictly larger than one that is divisible only by one and by itself.<\/p><\/div><\/div>"}, {"contestId": 1475, "index": "D", "name": "Cleaning the Phone", "rating": 1800, "solvedCount": 11388, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Cleaning the Phone<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Polycarp often uses his smartphone. He has already installed $$$n$$$ applications on it. Application with number $$$i$$$ takes up $$$a_i$$$ units of memory.<\/p><p>Polycarp wants to free at least $$$m$$$ units of memory (by removing some applications).<\/p><p>Of course, some applications are more important to Polycarp than others. He came up with the following scoring system\u00a0\u2014 he assigned an integer $$$b_i$$$ to each application: <\/p><ul> <li> $$$b_i = 1$$$\u00a0\u2014 regular application; <\/li><li> $$$b_i = 2$$$\u00a0\u2014 important application. <\/li><\/ul><p>According to this rating system, his phone has $$$b_1 + b_2 + \\ldots + b_n$$$ convenience points.<\/p><p>Polycarp believes that if he removes applications with numbers $$$i_1, i_2, \\ldots, i_k$$$, then he will free $$$a_{i_1} + a_{i_2} + \\ldots + a_{i_k}$$$ units of memory and lose $$$b_{i_1} + b_{i_2} + \\ldots + b_{i_k}$$$ convenience points.<\/p><p>For example, if $$$n=5$$$, $$$m=7$$$, $$$a=[5, 3, 2, 1, 4]$$$, $$$b=[2, 1, 1, 2, 1]$$$, then Polycarp can uninstall the following application sets (not all options are listed below): <\/p><ul> <li> applications with numbers $$$1, 4$$$ and $$$5$$$. In this case, it will free $$$a_1+a_4+a_5=10$$$ units of memory and lose $$$b_1+b_4+b_5=5$$$ convenience points; <\/li><li> applications with numbers $$$1$$$ and $$$3$$$. In this case, it will free $$$a_1+a_3=7$$$ units of memory and lose $$$b_1+b_3=3$$$ convenience points. <\/li><li> applications with numbers $$$2$$$ and $$$5$$$. In this case, it will free $$$a_2+a_5=7$$$ memory units and lose $$$b_2+b_5=2$$$ convenience points. <\/li><\/ul><p>Help Polycarp, choose a set of applications, such that if removing them will free at least $$$m$$$ units of memory and lose the minimum number of convenience points, or indicate that such a set does not exist.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases. Then $$$t$$$ test cases follow.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$, $$$1 \\le m \\le 10^9$$$)\u00a0\u2014 the number of applications on Polycarp's phone and the number of memory units to be freed.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$)\u00a0\u2014 the number of memory units used by applications.<\/p><p>The third line of each test case contains $$$n$$$ integers $$$b_1, b_2, \\ldots, b_n$$$ ($$$1 \\le b_i \\le 2$$$)\u00a0\u2014 the convenience points of each application.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output on a separate line: <\/p><ul> <li> <span class=\"tex-font-style-tt\">-1<\/span>, if there is no set of applications, removing which will free at least $$$m$$$ units of memory; <\/li><li> the minimum number of convenience points that Polycarp will lose if such a set exists. <\/li><\/ul><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n5 7\n5 3 2 1 4\n2 1 1 2 1\n1 3\n2\n1\n5 10\n2 3 2 3 2\n1 2 1 2 1\n4 10\n5 1 3 4\n1 2 1 2\n4 5\n3 2 1 2\n2 1 2 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n-1\n6\n4\n3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, it is optimal to remove applications with numbers $$$2$$$ and $$$5$$$, freeing $$$7$$$ units of memory. $$$b_2+b_5=2$$$.<\/p><p>In the second test case, by removing the only application, Polycarp will be able to clear only $$$2$$$ of memory units out of the $$$3$$$ needed.<\/p><p>In the third test case, it is optimal to remove applications with numbers $$$1$$$, $$$2$$$, $$$3$$$ and $$$4$$$, freeing $$$10$$$ units of memory. $$$b_1+b_2+b_3+b_4=6$$$.<\/p><p>In the fourth test case, it is optimal to remove applications with numbers $$$1$$$, $$$3$$$ and $$$4$$$, freeing $$$12$$$ units of memory. $$$b_1+b_3+b_4=4$$$.<\/p><p>In the fifth test case, it is optimal to remove applications with numbers $$$1$$$ and $$$2$$$, freeing $$$5$$$ units of memory. $$$b_1+b_2=3$$$.<\/p><\/div><\/div>"}, {"contestId": 1935, "index": "D", "name": "Exam in MAC", "rating": 1800, "solvedCount": 11233, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Exam in MAC<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>The Master's Assistance Center has announced an entrance exam, which consists of the following.<\/p><p>The candidate is given a set $$$s$$$ of size $$$n$$$ and some strange integer $$$c$$$. For this set, it is needed to calculate the number of pairs of integers $$$(x, y)$$$ such that $$$0 \\leq x \\leq y \\leq c$$$, $$$x + y$$$ <span class=\"tex-font-style-bf\">is not<\/span> contained in the set $$$s$$$, and also $$$y - x$$$ <span class=\"tex-font-style-bf\">is not<\/span> contained in the set $$$s$$$.<\/p><p>Your friend wants to enter the Center. Help him pass the exam!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test consists of multiple test cases. The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 2 \\cdot 10^4$$$) \u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$c$$$ ($$$1 \\leq n \\leq 3 \\cdot 10^5$$$, $$$1 \\leq c \\leq 10^9$$$) \u2014 the size of the set and the strange integer.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$s_1, s_2, \\ldots, s_{n}$$$ ($$$0 \\leq s_1  \\lt  s_2  \\lt  \\ldots  \\lt  s_{n} \\leq c$$$) \u2014 the elements of the set $$$s$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$3 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer \u2014 the number of suitable pairs of integers.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 179<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">57<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0 3 5 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">0 2 4 8 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">5 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">1 3 5 7 9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">4 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">2 4 6 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">3 1000000000<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">228 1337 998244353<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n16139\n10\n2\n33\n36\n35\n499999998999122959\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the following pairs are suitable: $$$(0, 0)$$$, $$$(2, 2)$$$, $$$(3, 3)$$$.<\/p><p>In the third test case, the following pairs are suitable: $$$(0, 1)$$$, $$$(0, 2)$$$, $$$(0, 4)$$$, $$$(1, 3)$$$, $$$(2, 6)$$$, $$$(3, 4)$$$, $$$(3, 5)$$$, $$$(4, 5)$$$, $$$(4, 6)$$$, $$$(5, 6)$$$.<\/p><\/div><\/div>"}, {"contestId": 1525, "index": "D", "name": "Armchairs", "rating": 1800, "solvedCount": 11135, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Armchairs<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are $$$n$$$ armchairs, numbered from $$$1$$$ to $$$n$$$ from left to right. Some armchairs are occupied by people (at most one person per armchair), others are not. The number of occupied armchairs is not greater than $$$\\frac{n}{2}$$$.<\/p><p>For some reason, you would like to tell people to move from their armchairs to some other ones. If the $$$i$$$-th armchair is occupied by someone and the $$$j$$$-th armchair is not, you can tell the person sitting in the $$$i$$$-th armchair to move to the $$$j$$$-th armchair. The time it takes a person to move from the $$$i$$$-th armchair to the $$$j$$$-th one is $$$|i - j|$$$ minutes. You may perform this operation any number of times, but these operations must be done sequentially, i.\u2009e. you cannot tell a person to move until the person you asked to move in the last operation has finished moving to their destination armchair.<\/p><p>You want to achieve the following situation: every seat that was initially occupied must be free. What is the minimum time you need to do it?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$2 \\le n \\le 5000$$$) \u2014 the number of armchairs.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$0 \\le a_i \\le 1$$$). $$$a_i = 1$$$ means that the $$$i$$$-th armchair is initially occupied, $$$a_i = 0$$$ means that it is initially free. The number of occupied armchairs is at most $$$\\frac{n}{2}$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the minimum number of minutes you have to spend to achieve the following situation: every seat that was initially occupied must be free.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7\n1 0 0 1 0 0 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n1 1 1 0 0 0\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n9\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n0 0 0 0 0\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test, you can perform the following sequence:<\/p><ol> <li> ask a person to move from armchair $$$1$$$ to armchair $$$2$$$, it takes $$$1$$$ minute; <\/li><li> ask a person to move from armchair $$$7$$$ to armchair $$$6$$$, it takes $$$1$$$ minute; <\/li><li> ask a person to move from armchair $$$4$$$ to armchair $$$5$$$, it takes $$$1$$$ minute. <\/li><\/ol><p>In the second test, you can perform the following sequence:<\/p><ol> <li> ask a person to move from armchair $$$1$$$ to armchair $$$4$$$, it takes $$$3$$$ minutes; <\/li><li> ask a person to move from armchair $$$2$$$ to armchair $$$6$$$, it takes $$$4$$$ minutes; <\/li><li> ask a person to move from armchair $$$4$$$ to armchair $$$5$$$, it takes $$$1$$$ minute; <\/li><li> ask a person to move from armchair $$$3$$$ to armchair $$$4$$$, it takes $$$1$$$ minute. <\/li><\/ol><p>In the third test, no seat is occupied so your goal is achieved instantly.<\/p><\/div><\/div>"}, {"contestId": 471, "index": "D", "name": "MUH and Cube Walls", "rating": 1800, "solvedCount": 11022, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. MUH and Cube Walls<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Polar bears Menshykov and Uslada from the zoo of St. Petersburg and elephant Horace from the zoo of Kiev got hold of lots of wooden cubes somewhere. They started making cube towers by placing the cubes one on top of the other. They defined multiple towers standing in a line as a wall. A wall can consist of towers of different heights.<\/p><p>Horace was the first to finish making his wall. He called his wall an elephant. The wall consists of <span class=\"tex-span\"><i>w<\/i><\/span> towers. The bears also finished making their wall but they didn't give it a name. Their wall consists of <span class=\"tex-span\"><i>n<\/i><\/span> towers. Horace looked at the bears' tower and wondered: in how many parts of the wall can he \"see an elephant\"? He can \"see an elephant\" on a segment of <span class=\"tex-span\"><i>w<\/i><\/span> contiguous towers if the heights of the towers on the segment match as a sequence the heights of the towers in Horace's wall. In order to see as many elephants as possible, Horace can raise and lower his wall. He even can lower the wall below the ground level (see the pictures to the samples for clarification).<\/p><p>Your task is to count the number of segments where Horace can \"see an elephant\".<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>w<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>w<\/i>\u2009\u2264\u20092\u00b710<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the number of towers in the bears' and the elephant's walls correspondingly. The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) \u2014 the heights of the towers in the bears' wall. The third line contains <span class=\"tex-span\"><i>w<\/i><\/span> integers <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) \u2014 the heights of the towers in the elephant's wall.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the number of segments in the bears' wall where Horace can \"see an elephant\".<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>13 5<br/>2 4 5 5 4 3 2 2 2 3 3 2 1<br/>3 4 4 3 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The picture to the left shows Horace's wall from the sample, the picture to the right shows the bears' wall. The segments where Horace can \"see an elephant\" are in gray.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/40eb596970e9260a3de89c9a18e0ef52759e1e2a.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 1401, "index": "D", "name": "Maximum Distributed Tree", "rating": 1800, "solvedCount": 10850, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Maximum Distributed Tree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a tree that consists of $$$n$$$ nodes. You should label each of its $$$n-1$$$ edges with an integer in such way that satisfies the following conditions: <\/p><ul> <li> each integer must be greater than $$$0$$$; <\/li><li> the product of all $$$n-1$$$ numbers should be equal to $$$k$$$; <\/li><li> the number of $$$1$$$-s among all $$$n-1$$$ integers must be minimum possible. <\/li><\/ul><p>Let's define $$$f(u,v)$$$ as the sum of the numbers on the simple path from node $$$u$$$ to node $$$v$$$. Also, let $$$\\sum\\limits_{i=1}^{n-1} \\sum\\limits_{j=i+1}^n f(i,j)$$$ be a <span class=\"tex-font-style-it\">distribution index<\/span> of the tree.<\/p><p>Find the maximum possible distribution index you can get. Since answer can be too large, print it modulo $$$10^9 + 7$$$.<\/p><p>In this problem, since the number $$$k$$$ can be large, the result of the prime factorization of $$$k$$$ is given instead.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 100$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$2 \\le n \\le 10^5$$$)\u00a0\u2014 the number of nodes in the tree.<\/p><p>Each of the next $$$n-1$$$ lines describes an edge: the $$$i$$$-th line contains two integers $$$u_i$$$ and $$$v_i$$$ ($$$1 \\le u_i, v_i \\le n$$$; $$$u_i \\ne v_i$$$)\u00a0\u2014 indices of vertices connected by the $$$i$$$-th edge.<\/p><p>Next line contains a single integer $$$m$$$ ($$$1 \\le m \\le 6 \\cdot 10^4$$$)\u00a0\u2014 the number of prime factors of $$$k$$$.<\/p><p>Next line contains $$$m$$$ prime numbers $$$p_1, p_2, \\ldots, p_m$$$ ($$$2 \\le p_i  \\lt  6 \\cdot 10^4$$$) such that $$$k = p_1 \\cdot p_2 \\cdot \\ldots \\cdot p_m$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases doesn't exceed $$$10^5$$$, the sum of $$$m$$$ over all test cases doesn't exceed $$$6 \\cdot 10^4$$$, and the given edges for each test cases form a tree.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the maximum distribution index you can get. Since answer can be too large, print it modulo $$$10^9+7$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n4\n1 2\n2 3\n3 4\n2\n2 2\n4\n3 4\n1 3\n3 2\n2\n3 2\n7\n6 1\n2 3\n4 6\n7 3\n5 1\n3 6\n4\n7 5 13 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n17\n18\n286\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p> In the first test case, one of the optimal ways is on the following image:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/47c01cca95f2052b2f4fbc60f42f584214acee21.png\" style=\"zoom: 40.0%;max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p> In this case, $$$f(1,2)=1$$$, $$$f(1,3)=3$$$, $$$f(1,4)=5$$$, $$$f(2,3)=2$$$, $$$f(2,4)=4$$$, $$$f(3,4)=2$$$, so the sum of these $$$6$$$ numbers is $$$17$$$.<\/p><p> In the second test case, one of the optimal ways is on the following image:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/be6fdc6dfcc7940440a13671212239673cd9fdd5.png\" style=\"zoom: 50.0%;max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p> In this case, $$$f(1,2)=3$$$, $$$f(1,3)=1$$$, $$$f(1,4)=4$$$, $$$f(2,3)=2$$$, $$$f(2,4)=5$$$, $$$f(3,4)=3$$$, so the sum of these $$$6$$$ numbers is $$$18$$$.<\/p><\/div><\/div>"}, {"contestId": 1572, "index": "A", "name": "Book", "rating": 1800, "solvedCount": 10755, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. Book<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a book with $$$n$$$ chapters.<\/p><p>Each chapter has a specified list of other chapters that need to be understood in order to understand this chapter. To understand a chapter, you must read it after you understand every chapter on its required list.<\/p><p>Currently you don't understand any of the chapters. You are going to read the book from the beginning till the end repeatedly until you understand the whole book. Note that if you read a chapter at a moment when you don't understand some of the required chapters, you don't understand this chapter.<\/p><p>Determine how many times you will read the book to understand every chapter, or determine that you will never understand every chapter no matter how many times you read the book.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 2\\cdot10^4$$$).<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 2\\cdot10^5$$$) \u2014 number of chapters.<\/p><p>Then $$$n$$$ lines follow. The $$$i$$$-th line begins with an integer $$$k_i$$$ ($$$0 \\le k_i \\le n-1$$$) \u2014 number of chapters required to understand the $$$i$$$-th chapter. Then $$$k_i$$$ integers $$$a_{i,1}, a_{i,2}, \\dots, a_{i, k_i}$$$ ($$$1 \\le a_{i, j} \\le n, a_{i, j} \\ne i, a_{i, j} \\ne a_{i, l}$$$ for $$$j \\ne l$$$) follow \u2014 the chapters required to understand the $$$i$$$-th chapter.<\/p><p>It is guaranteed that the sum of $$$n$$$ and sum of $$$k_i$$$ over all testcases do not exceed $$$2\\cdot10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, if the entire book can be understood, print how many times you will read it, otherwise print $$$-1$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n4\n1 2\n0\n2 1 4\n1 2\n5\n1 5\n1 1\n1 2\n1 3\n1 4\n5\n0\n0\n2 1 2\n1 2\n2 2 1\n4\n2 2 3\n0\n0\n2 3 2\n5\n1 2\n1 3\n1 4\n1 5\n0\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n-1\n1\n2\n5\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, we will understand chapters $$$\\{2, 4\\}$$$ in the first reading and chapters $$$\\{1, 3\\}$$$ in the second reading of the book.<\/p><p>In the second example, every chapter requires the understanding of some other chapter, so it is impossible to understand the book.<\/p><p>In the third example, every chapter requires only chapters that appear earlier in the book, so we can understand everything in one go.<\/p><p>In the fourth example, we will understand chapters $$$\\{2, 3, 4\\}$$$ in the first reading and chapter $$$1$$$ in the second reading of the book.<\/p><p>In the fifth example, we will understand one chapter in every reading from $$$5$$$ to $$$1$$$.<\/p><\/div><\/div>"}, {"contestId": 1709, "index": "C", "name": "Recover an RBS", "rating": 1800, "solvedCount": 10720, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Recover an RBS<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>A bracket sequence is a string containing only characters \"<span class=\"tex-font-style-tt\">(<\/span>\" and \"<span class=\"tex-font-style-tt\">)<\/span>\". A regular bracket sequence (or, shortly, an RBS) is a bracket sequence that can be transformed into a correct arithmetic expression by inserting characters \"<span class=\"tex-font-style-tt\">1<\/span>\" and \"<span class=\"tex-font-style-tt\">+<\/span>\" between the original characters of the sequence. For example:<\/p><ul> <li> bracket sequences \"<span class=\"tex-font-style-tt\">()()<\/span>\" and \"<span class=\"tex-font-style-tt\">(())<\/span>\" are regular (the resulting expressions are: \"<span class=\"tex-font-style-tt\">(1)+(1)<\/span>\" and \"<span class=\"tex-font-style-tt\">((1+1)+1)<\/span>\"); <\/li><li> bracket sequences \"<span class=\"tex-font-style-tt\">)(<\/span>\", \"<span class=\"tex-font-style-tt\">(<\/span>\" and \"<span class=\"tex-font-style-tt\">)<\/span>\" are not. <\/li><\/ul><p>There was an RBS. Some brackets have been replaced with question marks. Is it true that there is a <span class=\"tex-font-style-bf\">unique<\/span> way to replace question marks with brackets, so that the resulting sequence is an RBS?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 5 \\cdot 10^4$$$)\u00a0\u2014 the number of testcases.<\/p><p>The only line of each testcase contains an RBS with some brackets replaced with question marks. Each character is either '<span class=\"tex-font-style-tt\">(<\/span>', '<span class=\"tex-font-style-tt\">)<\/span>' or '<span class=\"tex-font-style-tt\">?<\/span>'. At least one RBS can be recovered from the given sequence.<\/p><p>The total length of the sequences over all testcases doesn't exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each testcase, print \"<span class=\"tex-font-style-tt\">YES<\/span>\" if the way to replace question marks with brackets, so that the resulting sequence is an RBS, is <span class=\"tex-font-style-bf\">unique<\/span>. If there is more than one way, then print \"<span class=\"tex-font-style-tt\">NO<\/span>\".<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">(?))<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">??????<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">()<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">??<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">?(?)()?)<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nNO\nYES\nYES\nNO\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first testcase, the only possible original RBS is \"<span class=\"tex-font-style-tt\">(())<\/span>\".<\/p><p>In the second testcase, there are multiple ways to recover an RBS.<\/p><p>In the third and the fourth testcases, the only possible original RBS is \"<span class=\"tex-font-style-tt\">()<\/span>\".<\/p><p>In the fifth testcase, the original RBS can be either \"<span class=\"tex-font-style-tt\">((()()))<\/span>\" or \"<span class=\"tex-font-style-tt\">(())()()<\/span>\".<\/p><\/div><\/div>"}, {"contestId": 1554, "index": "D", "name": "Diane", "rating": 1800, "solvedCount": 10720, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Diane<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an integer $$$n$$$. Find any string $$$s$$$ of length $$$n$$$ consisting only of English lowercase letters such that each non-empty substring of $$$s$$$ occurs in $$$s$$$ an <span class=\"tex-font-style-bf\">odd<\/span> number of times. If there are multiple such strings, output any. It can be shown that such string always exists under the given constraints.<\/p><p>A string $$$a$$$ is a substring of a string $$$b$$$ if $$$a$$$ can be obtained from $$$b$$$ by deletion of several (possibly, zero or all) characters from the beginning and several (possibly, zero or all) characters from the end.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 500$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 10^5$$$).<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases doesn't exceed $$$3 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print a single line containing the string $$$s$$$. If there are multiple such strings, output any. It can be shown that such string always exists under the given constraints.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n3\n5\n9\n19\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nabc\ndiane\nbbcaabbba\nyouarethecutestuwuu\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, each substring of \"<span class=\"tex-font-style-tt\">abc<\/span>\" occurs exactly once.<\/p><p>In the third test case, each substring of \"<span class=\"tex-font-style-tt\">bbcaabbba<\/span>\" occurs an odd number of times. In particular, \"<span class=\"tex-font-style-tt\">b<\/span>\" occurs $$$5$$$ times, \"<span class=\"tex-font-style-tt\">a<\/span>\" and \"<span class=\"tex-font-style-tt\">bb<\/span>\" occur $$$3$$$ times each, and each of the remaining substrings occurs exactly once.<\/p><\/div><\/div>"}, {"contestId": 1915, "index": "G", "name": "Bicycles", "rating": 1800, "solvedCount": 10697, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. Bicycles<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>All of Slavic's friends are planning to travel from the place where they live to a party using their bikes. And they all have a bike except Slavic. There are $$$n$$$ cities through which they can travel. They all live in the city $$$1$$$ and want to go to the party located in the city $$$n$$$. The map of cities can be seen as an undirected graph with $$$n$$$ nodes and $$$m$$$ edges. Edge $$$i$$$ connects cities $$$u_i$$$ and $$$v_i$$$ and has a length of $$$w_i$$$.<\/p><p>Slavic doesn't have a bike, but what he has is money. Every city has exactly one bike for sale. The bike in the $$$i$$$-th city has a slowness factor of $$$s_{i}$$$. Once Slavic buys a bike, he can use it <span class=\"tex-font-style-bf\">whenever<\/span> to travel from the city he is currently in to any neighboring city, by taking $$$w_i \\cdot s_j$$$ time, considering he is traversing edge $$$i$$$ using a bike $$$j$$$ he owns.<\/p><p>Slavic can buy as many bikes as he wants as money isn't a problem for him. Since Slavic hates traveling by bike, he wants to get from his place to the party in the shortest amount of time possible. And, since his informatics skills are quite rusty, he asks you for help.<\/p><p>What's the shortest amount of time required for Slavic to travel from city $$$1$$$ to city $$$n$$$? Slavic can't travel without a bike. It is guaranteed that it is possible for Slavic to travel from city $$$1$$$ to any other city.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 100$$$)\u00a0\u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains two space-separated integers $$$n$$$ and $$$m$$$ ($$$2 \\leq n \\leq 1000$$$; $$$n - 1 \\leq m \\leq 1000$$$)\u00a0\u2014 the number of cities and the number of roads, respectively.<\/p><p>The $$$i$$$-th of the following $$$m$$$ lines each contain three integers $$$u_i$$$, $$$v_i$$$, $$$w_i$$$ ($$$1 \\le u_i, v_i \\le n$$$, $$$u_i \\neq v_i$$$; $$$1 \\leq w_i \\leq 10^5$$$), denoting that there is a road between cities $$$u_i$$$ and $$$v_i$$$ of length $$$w_i$$$. The same pair of cities can be connected by more than one road.<\/p><p>The next line contains $$$n$$$ integers $$$s_1, \\ldots, s_n$$$ ($$$1 \\leq s_i \\leq 1000$$$)\u00a0\u2014 the slowness factor of each bike.<\/p><p>The sum of $$$n$$$ over all test cases does not exceed $$$1000$$$, and the sum of $$$m$$$ over all test cases does not exceed $$$1000$$$.<\/p><p>Additional constraint on the input: it is possible to travel from city $$$1$$$ to any other city.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer denoting the shortest amount of time Slavic can reach city $$$n$$$ starting from city $$$1$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 4 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 5 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 5 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 2 1 3 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 3 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 4 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 5 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 3 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 4 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 5 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 4 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 5 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 5 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">7 2 8 4 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 2 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 1 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 5 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 6 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 3 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6 4 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6 7 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6 7 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 5 9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 6 5 4 3 2 1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n19\n36\n14\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1295, "index": "D", "name": "Same GCDs", "rating": 1800, "solvedCount": 10639, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Same GCDs<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given two integers $$$a$$$ and $$$m$$$. Calculate the number of integers $$$x$$$ such that $$$0 \\le x  \\lt  m$$$ and $$$\\gcd(a, m) = \\gcd(a + x, m)$$$.<\/p><p>Note: $$$\\gcd(a, b)$$$ is the greatest common divisor of $$$a$$$ and $$$b$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains the single integer $$$T$$$ ($$$1 \\le T \\le 50$$$) \u2014 the number of test cases.<\/p><p>Next $$$T$$$ lines contain test cases \u2014 one per line. Each line contains two integers $$$a$$$ and $$$m$$$ ($$$1 \\le a  \\lt  m \\le 10^{10}$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$T$$$ integers \u2014 one per test case. For each test case print the number of appropriate $$$x$$$-s.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n4 9\n5 10\n42 9999999967\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n1\n9999999966\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case appropriate $$$x$$$-s are $$$[0, 1, 3, 4, 6, 7]$$$.<\/p><p>In the second test case the only appropriate $$$x$$$ is $$$0$$$.<\/p><\/div><\/div>"}, {"contestId": 1225, "index": "D", "name": "Power Products", "rating": 1800, "solvedCount": 10596, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Power Products<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given $$$n$$$ positive integers $$$a_1, \\ldots, a_n$$$, and an integer $$$k \\geq 2$$$. Count the number of pairs $$$i, j$$$ such that $$$1 \\leq i  \\lt  j \\leq n$$$, and there exists an integer $$$x$$$ such that $$$a_i \\cdot a_j = x^k$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$k$$$ ($$$2 \\leq n \\leq 10^5$$$, $$$2 \\leq k \\leq 100$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_1, \\ldots, a_n$$$ ($$$1 \\leq a_i \\leq 10^5$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer\u00a0\u2014 the number of suitable pairs.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 3\n1 3 9 8 24 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the sample case, the suitable pairs are:<\/p><ul><li> $$$a_1 \\cdot a_4 = 8 = 2^3$$$;<\/li><li> $$$a_1 \\cdot a_6 = 1 = 1^3$$$;<\/li><li> $$$a_2 \\cdot a_3 = 27 = 3^3$$$;<\/li><li> $$$a_3 \\cdot a_5 = 216 = 6^3$$$;<\/li><li> $$$a_4 \\cdot a_6 = 8 = 2^3$$$.<\/li><\/ul><\/div><\/div>"}, {"contestId": 1388, "index": "C", "name": "Uncle Bogdan and Country Happiness", "rating": 1800, "solvedCount": 10527, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Uncle Bogdan and Country Happiness<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-it\">Uncle Bogdan is in captain Flint's crew for a long time and sometimes gets nostalgic for his homeland. Today he told you how his country introduced a happiness index.<\/span><\/p><p>There are $$$n$$$ cities and $$$n\u22121$$$ undirected roads connecting pairs of cities. Citizens of any city can reach any other city traveling by these roads. Cities are numbered from $$$1$$$ to $$$n$$$ and the city $$$1$$$ is a capital. In other words, the country has a tree structure.<\/p><p>There are $$$m$$$ citizens living in the country. A $$$p_i$$$ people live in the $$$i$$$-th city but all of them are working in the capital. At evening all citizens return to their home cities using the shortest paths. <\/p><p>Every person has its own mood: somebody leaves his workplace in good mood but somebody are already in bad mood. Moreover any person can ruin his mood on the way to the hometown. <span class=\"tex-font-style-bf\">If person is in bad mood he won't improve it<\/span>.<\/p><p>Happiness detectors are installed in each city to monitor the happiness of <span class=\"tex-font-style-bf\">each<\/span> person who visits the city. The detector in the $$$i$$$-th city calculates a happiness index $$$h_i$$$ as the number of people in good mood minus the number of people in bad mood. Let's say for the simplicity that <span class=\"tex-font-style-it\">mood of a person doesn't change inside the city<\/span>.<\/p><p>Happiness detector is still in development, so there is a probability of a mistake in judging a person's happiness. One late evening, when all citizens successfully returned home, the government asked uncle Bogdan (the best programmer of the country) to check the correctness of the collected happiness indexes.<\/p><p>Uncle Bogdan successfully solved the problem. Can you do the same?<\/p><p>More formally, <span class=\"tex-font-style-it\">You need to check: \"Is it possible that, after all people return home, for each city $$$i$$$ the happiness index will be equal exactly to $$$h_i$$$\".<\/span><\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10000$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\le n \\le 10^5$$$; $$$0 \\le m \\le 10^9$$$)\u00a0\u2014 the number of cities and citizens.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$p_1, p_2, \\ldots, p_{n}$$$ ($$$0 \\le p_i \\le m$$$; $$$p_1 + p_2 + \\ldots + p_{n} = m$$$), where $$$p_i$$$ is the number of people living in the $$$i$$$-th city.<\/p><p>The third line contains $$$n$$$ integers $$$h_1, h_2, \\ldots, h_{n}$$$ ($$$-10^9 \\le h_i \\le 10^9$$$), where $$$h_i$$$ is the calculated happiness index of the $$$i$$$-th city.<\/p><p>Next $$$n \u2212 1$$$ lines contain description of the roads, one per line. Each line contains two integers $$$x_i$$$ and $$$y_i$$$ ($$$1 \\le x_i, y_i \\le n$$$; $$$x_i \\neq y_i$$$), where $$$x_i$$$ and $$$y_i$$$ are cities connected by the $$$i$$$-th road.<\/p><p>It's guaranteed that the sum of $$$n$$$ from all test cases doesn't exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print <span class=\"tex-font-style-tt\">YES<\/span>, if the collected data is correct, or <span class=\"tex-font-style-tt\">NO<\/span>\u00a0\u2014 otherwise. You can print characters in <span class=\"tex-font-style-tt\">YES<\/span> or <span class=\"tex-font-style-tt\">NO<\/span> in any case.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n7 4\n1 0 1 1 0 1 0\n4 0 0 -1 0 -1 0\n1 2\n1 3\n1 4\n3 5\n3 6\n3 7\n5 11\n1 2 5 2 1\n-11 -2 -6 -2 -1\n1 2\n1 3\n1 4\n3 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nYES\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n4 4\n1 1 1 1\n4 1 -3 -1\n1 2\n1 3\n1 4\n3 13\n3 3 7\n13 1 4\n1 2\n1 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nNO\nNO\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Let's look at the first test case of the first sample: <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/46e2e3a800e46e0e1ae840a83e33ba2d3f5e8a40.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>At first, all citizens are in the capital. Let's describe one of possible scenarios: <\/p><ul> <li> a person from city $$$1$$$: he lives in the capital and is in good mood; <\/li><li> a person from city $$$4$$$: he visited cities $$$1$$$ and $$$4$$$, his mood was ruined between cities $$$1$$$ and $$$4$$$; <\/li><li> a person from city $$$3$$$: he visited cities $$$1$$$ and $$$3$$$ in good mood; <\/li><li> a person from city $$$6$$$: he visited cities $$$1$$$, $$$3$$$ and $$$6$$$, his mood was ruined between cities $$$1$$$ and $$$3$$$; <\/li><\/ul> In total, <ul> <li> $$$h_1 = 4 - 0 = 4$$$, <\/li><li> $$$h_2 = 0$$$, <\/li><li> $$$h_3 = 1 - 1 = 0$$$, <\/li><li> $$$h_4 = 0 - 1 = -1$$$, <\/li><li> $$$h_5 = 0$$$, <\/li><li> $$$h_6 = 0 - 1 = -1$$$, <\/li><li> $$$h_7 = 0$$$. <\/li><\/ul><p>The second case of the first test: <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/9bdb0d772b302efb5524b6c5c5d8d98115232857.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>All people have already started in bad mood in the capital\u00a0\u2014 this is the only possible scenario.<\/p><p>The first case of the second test: <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/fd0bd5cc5907947abceabc49d6b36780dcaa3f1d.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>The second case of the second test: <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/3d0e9489f561b76348454f43e49eb22b80963bb4.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>It can be proven that there is no way to achieve given happiness indexes in both cases of the second test. <\/p><\/div><\/div>"}, {"contestId": 1995, "index": "C", "name": "Squaring", "rating": 1800, "solvedCount": 10512, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Squaring<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-tt\">ikrpprpp<\/span> found an array $$$a$$$ consisting of integers. He likes justice, so he wants to make $$$a$$$ fair\u00a0\u2014 that is, make it non-decreasing. To do that, he can perform an <span class=\"tex-font-style-it\">act of justice<\/span> on an index $$$1 \\le i \\le n$$$ of the array, which will replace $$$a_i$$$ with $$$a_i ^ 2$$$ (the element at position $$$i$$$ with its square). For example, if $$$a = [2,4,3,3,5,3]$$$ and <span class=\"tex-font-style-tt\">ikrpprpp<\/span> chooses to perform an act of justice on $$$i = 4$$$, $$$a$$$ becomes $$$[2,4,3,9,5,3]$$$.<\/p><p>What is the minimum number of acts of justice needed to make the array non-decreasing?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>First line contains an integer $$$t$$$ ($$$1 \\le t \\le 1000$$$)\u00a0\u2014 the number of test cases. It is followed by the description of test cases.<\/p><p>For each test case, the first line contains an integer $$$n$$$\u00a0\u2014 size of the array $$$a$$$. The second line contains $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10 ^5$$$) integers $$$a_1, a_2,\\ldots, a_n$$$ ($$$1 \\le a_i \\le 10 ^ 6$$$). <\/p><p>The sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot {10}^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each testcase, print an integer\u00a0\u2014 minimum number of acts of justice required to make the array $$$a$$$ non-decreasing. If it is impossible to do that, print $$$-1$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 1 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 1 2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4 3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">9<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">16 2 4 2 256 2 4 2 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">11<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">10010 10009 10008 10007 10006 10005 10004 10003 10002 10001 10000<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n1\n-1\n0\n3\n15\n55\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, there's no need to perform acts of justice. The array is fair on its own!<\/p><p>In the third test case, it can be proven that the array cannot become non-decreasing.<\/p><p>In the fifth test case, <span class=\"tex-font-style-tt\">ikrpprppp<\/span> can perform an act of justice on index 3, then an act of justice on index 2, and finally yet another act of justice on index 3. After that, $$$a$$$ will become $$$[4, 9, 16]$$$.<\/p><\/div><\/div>"}, {"contestId": 1221, "index": "D", "name": "Make The Fence Great Again", "rating": 1800, "solvedCount": 10488, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Make The Fence Great Again<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You have a fence consisting of $$$n$$$ vertical boards. The width of each board is $$$1$$$. The height of the $$$i$$$-th board is $$$a_i$$$. You think that the fence is <span class=\"tex-font-style-it\">great<\/span> if there is no pair of adjacent boards having the same height. More formally, the fence is great if and only if for all indices from $$$2$$$ to $$$n$$$, the condition $$$a_{i-1} \\neq a_i$$$ holds.<\/p><p>Unfortunately, it is possible that now your fence is not great. But you can change it! You can increase the length of the $$$i$$$-th board by $$$1$$$, but you have to pay $$$b_i$$$ rubles for it. The length of each board can be increased any number of times (possibly, zero).<\/p><p>Calculate the minimum number of rubles you have to spend to make the fence great again!<\/p><p>You have to answer $$$q$$$ independent queries.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$q$$$ ($$$1 \\le q \\le 3 \\cdot 10^5$$$) \u2014 the number of queries.<\/p><p>The first line of each query contains one integers $$$n$$$ ($$$1 \\le n \\le 3 \\cdot 10^5$$$) \u2014 the number of boards in the fence.<\/p><p>The following $$$n$$$ lines of each query contain the descriptions of the boards. The $$$i$$$-th line contains two integers $$$a_i$$$ and $$$b_i$$$ ($$$1 \\le a_i, b_i \\le 10^9$$$) \u2014 the length of the $$$i$$$-th board and the price for increasing it by $$$1$$$, respectively.<\/p><p>It is guaranteed that sum of all $$$n$$$ over all queries not exceed $$$3 \\cdot 10^5$$$.<\/p><p><span class=\"tex-font-style-bf\">It is guaranteed that answer to each query will not exceed $$$10^{18}$$$.<\/span><\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query print one integer \u2014 the minimum number of rubles you have to spend to make the fence great.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n3\n2 4\n2 1\n3 5\n3\n2 3\n2 10\n2 6\n4\n1 7\n3 3\n2 6\n1000000000 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n9\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first query you have to increase the length of second board by $$$2$$$. So your total costs if $$$2 \\cdot b_2 = 2$$$.<\/p><p>In the second query you have to increase the length of first board by $$$1$$$ and the length of third board by $$$1$$$. So your total costs if $$$1 \\cdot b_1 + 1 \\cdot b_3 = 9$$$.<\/p><p>In the third query the fence is great initially, so you don't need to spend rubles.<\/p><\/div><\/div>"}, {"contestId": 1034, "index": "A", "name": "Enlarge GCD", "rating": 1800, "solvedCount": 10260, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. Enlarge GCD<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Mr. F has $$$n$$$ positive integers, $$$a_1, a_2, \\ldots, a_n$$$.<\/p><p>He thinks the greatest common divisor of these integers is too small. So he wants to enlarge it by removing some of the integers.<\/p><p>But this problem is too simple for him, so he does not want to do it by himself. If you help him, he will give you some scores in reward.<\/p><p>Your task is to calculate the minimum number of integers you need to remove so that the greatest common divisor of the remaining integers is bigger than that of all integers.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$n$$$ ($$$2 \\leq n \\leq 3 \\cdot 10^5$$$) \u2014 the number of integers Mr. F has.<\/p><p>The second line contains $$$n$$$ integers, $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\leq a_i \\leq 1.5 \\cdot 10^7$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print an integer\u00a0\u2014 the minimum number of integers you need to remove so that the greatest common divisor of the remaining integers is bigger than that of all integers.<\/p><p>You should not remove all of the integers.<\/p><p>If there is no solution, print \u00ab<span class=\"tex-font-style-tt\">-1<\/span>\u00bb (without quotes).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>1 2 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>6 9 15 30<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>1 1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>-1<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, the greatest common divisor is $$$1$$$ in the beginning. You can remove $$$1$$$ so that the greatest common divisor is enlarged to $$$2$$$. The answer is $$$1$$$.<\/p><p>In the second example, the greatest common divisor is $$$3$$$ in the beginning. You can remove $$$6$$$ and $$$9$$$ so that the greatest common divisor is enlarged to $$$15$$$. There is no solution which removes only one integer. So the answer is $$$2$$$.<\/p><p>In the third example, there is no solution to enlarge the greatest common divisor. So the answer is $$$-1$$$.<\/p><\/div><\/div>"}, {"contestId": 1213, "index": "G", "name": "Path Queries", "rating": 1800, "solvedCount": 10236, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. Path Queries<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a weighted tree consisting of $$$n$$$ vertices. Recall that a tree is a connected graph without cycles. Vertices $$$u_i$$$ and $$$v_i$$$ are connected by an edge with weight $$$w_i$$$.<\/p><p>You are given $$$m$$$ queries. The $$$i$$$-th query is given as an integer $$$q_i$$$. In this query you need to calculate the number of pairs of vertices $$$(u, v)$$$ ($$$u  \\lt  v$$$) such that the maximum weight of an edge on a simple path between $$$u$$$ and $$$v$$$ doesn't exceed $$$q_i$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\le n, m \\le 2 \\cdot 10^5$$$) \u2014 the number of vertices in the tree and the number of queries.<\/p><p>Each of the next $$$n - 1$$$ lines describes an edge of the tree. Edge $$$i$$$ is denoted by three integers $$$u_i$$$, $$$v_i$$$ and $$$w_i$$$ \u2014 the labels of vertices it connects ($$$1 \\le u_i, v_i \\le n$$$, $$$u_i \\ne v_i$$$) and the weight of the edge ($$$1 \\le w_i \\le 2 \\cdot 10^5$$$). It is guaranteed that the given edges form a tree.<\/p><p>The last line of the input contains $$$m$$$ integers $$$q_1, q_2, \\dots, q_m$$$ ($$$1 \\le q_i \\le 2 \\cdot 10^5$$$), where $$$q_i$$$ is the maximum weight of an edge in the $$$i$$$-th query.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$m$$$ integers \u2014 the answers to the queries. The $$$i$$$-th value should be equal to the number of pairs of vertices $$$(u, v)$$$ ($$$u  \\lt  v$$$) such that the maximum weight of an edge on a simple path between $$$u$$$ and $$$v$$$ doesn't exceed $$$q_i$$$.<\/p><p><span class=\"tex-font-style-bf\">Queries are numbered from $$$1$$$ to $$$m$$$ in the order of the input<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7 5\n1 2 1\n3 2 3\n2 4 1\n4 5 2\n5 7 4\n3 6 2\n5 2 3 4 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n21 7 15 21 3 \n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1 2\n1 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0 0 \n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 3\n1 2 1\n2 3 2\n1 3 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 3 3 \n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The picture shows the tree from the first example: <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/72719dd3f66b3e69a28d5278fedfe14cca697350.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><\/div><\/div>"}, {"contestId": 1283, "index": "D", "name": "Christmas Trees", "rating": 1800, "solvedCount": 10202, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Christmas Trees<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are $$$n$$$ Christmas trees on an infinite number line. The $$$i$$$-th tree grows at the position $$$x_i$$$. All $$$x_i$$$ are guaranteed to be distinct.<\/p><p>Each <span class=\"tex-font-style-bf\">integer<\/span> point can be either occupied by the Christmas tree, by the human or not occupied at all. Non-integer points cannot be occupied by anything.<\/p><p>There are $$$m$$$ people who want to celebrate Christmas. Let $$$y_1, y_2, \\dots, y_m$$$ be the positions of people (note that all values $$$x_1, x_2, \\dots, x_n, y_1, y_2, \\dots, y_m$$$ should be <span class=\"tex-font-style-bf\">distinct<\/span> and all $$$y_j$$$ should be <span class=\"tex-font-style-bf\">integer<\/span>). You want to find such an arrangement of people that the value $$$\\sum\\limits_{j=1}^{m}\\min\\limits_{i=1}^{n}|x_i - y_j|$$$ is the minimum possible (in other words, the sum of distances to the nearest Christmas tree for all people should be minimized).<\/p><p>In other words, let $$$d_j$$$ be the distance from the $$$j$$$-th human to the nearest Christmas tree ($$$d_j = \\min\\limits_{i=1}^{n} |y_j - x_i|$$$). Then you need to choose such positions $$$y_1, y_2, \\dots, y_m$$$ that $$$\\sum\\limits_{j=1}^{m} d_j$$$ is the minimum possible.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\le n, m \\le 2 \\cdot 10^5$$$) \u2014 the number of Christmas trees and the number of people.<\/p><p>The second line of the input contains $$$n$$$ integers $$$x_1, x_2, \\dots, x_n$$$ ($$$-10^9 \\le x_i \\le 10^9$$$), where $$$x_i$$$ is the position of the $$$i$$$-th Christmas tree. It is guaranteed that all $$$x_i$$$ are distinct.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In the first line print one integer $$$res$$$ \u2014 the minimum possible value of $$$\\sum\\limits_{j=1}^{m}\\min\\limits_{i=1}^{n}|x_i - y_j|$$$ (in other words, the sum of distances to the nearest Christmas tree for all people).<\/p><p>In the second line print $$$m$$$ integers $$$y_1, y_2, \\dots, y_m$$$ ($$$-2 \\cdot 10^9 \\le y_j \\le 2 \\cdot 10^9$$$), where $$$y_j$$$ is the position of the $$$j$$$-th human. All $$$y_j$$$ should be distinct and all values $$$x_1, x_2, \\dots, x_n, y_1, y_2, \\dots, y_m$$$ should be <span class=\"tex-font-style-bf\">distinct<\/span>.<\/p><p>If there are multiple answers, print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2 6\n1 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n8\n-1 2 6 4 0 3 \n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 5\n0 3 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n7\n5 -2 4 -1 2 \n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1935, "index": "C", "name": "Messenger in MAC", "rating": 1800, "solvedCount": 9989, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Messenger in MAC<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>In the new messenger for the students of the Master's Assistance Center, Keftemerum, an update is planned, in which developers want to optimize the set of messages shown to the user. There are a total of $$$n$$$ messages. Each message is characterized by two integers $$$a_i$$$ and $$$b_i$$$. The time spent reading the set of messages with numbers $$$p_1, p_2, \\ldots, p_k$$$ ($$$1 \\le p_i \\le n$$$, all $$$p_i$$$ are <span class=\"tex-font-style-bf\">distinct<\/span>) is calculated by the formula:<\/p><p>$$$$$$\\Large \\sum_{i=1}^{k} a_{p_i} + \\sum_{i=1}^{k - 1} |b_{p_i} - b_{p_{i+1}}|$$$$$$<\/p><p>Note that the time to read a set of messages consisting of <span class=\"tex-font-style-bf\">one<\/span> message with number $$$p_1$$$ is equal to $$$a_{p_1}$$$. Also, the time to read an empty set of messages is considered to be $$$0$$$.<\/p><p>The user can determine the time $$$l$$$ that he is willing to spend in the messenger. The messenger must inform the user of the maximum possible size of the set of messages, the reading time of which does not exceed $$$l$$$. Note that the maximum size of the set of messages can be equal to $$$0$$$.<\/p><p>The developers of the popular messenger failed to implement this function, so they asked you to solve this problem.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test consists of multiple test cases. The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 5 \\cdot 10^4$$$) \u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$l$$$ ($$$1 \\leq n \\leq 2000$$$, $$$1 \\leq l \\leq 10^9$$$) \u2014 the number of messages and the time the user is willing to spend in the messenger.<\/p><p>The $$$i$$$-th of the next $$$n$$$ lines contains two integers $$$a_i$$$ and $$$b_i$$$ ($$$1 \\le a_i, b_i \\le 10^9$$$) \u2014 characteristics of the $$$i$$$-th message.<\/p><p>It is guaranteed that the sum of $$$n^2$$$ over all test cases does not exceed $$$4 \\cdot 10^6$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer \u2014 the maximum possible size of a set of messages, the reading time of which does not exceed $$$l$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1

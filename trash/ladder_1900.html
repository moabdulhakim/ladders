$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output $$$q$$$ lines, each of which contains the answer to the corresponding query. As an answer, output \"<span class=\"tex-font-style-tt\">YES<\/span>\" if the set is <span class=\"tex-font-style-bf\">passable<\/span>, and \"<span class=\"tex-font-style-tt\">NO<\/span>\" otherwise.<\/p><p>You can output the answer in any case (for example, the strings \"<span class=\"tex-font-style-tt\">yEs<\/span>\", \"<span class=\"tex-font-style-tt\">yes<\/span>\", \"<span class=\"tex-font-style-tt\">Yes<\/span>\" and \"<span class=\"tex-font-style-tt\">YES<\/span>\" will be recognized as a positive answer).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n1 2\n2 3\n2 4\n4 5\n5\n3\n3 2 5\n5\n1 2 3 4 5\n2\n1 4\n3\n1 3 5\n3\n1 5 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nNO\nYES\nNO\nYES\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n1 2\n3 2\n2 4\n5 2\n4\n2\n3 1\n3\n3 4 5\n3\n2 3 5\n1\n1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nNO\nYES\nYES\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1996, "index": "F", "name": "Bomb", "rating": 1900, "solvedCount": 6595, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Bomb<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Sparkle gives you two arrays $$$a$$$ and $$$b$$$ of length $$$n$$$. Initially, your score is $$$0$$$. In one operation, you can choose an integer $$$i$$$ and add $$$a_i$$$ to your score. Then, you must set $$$a_i$$$ = $$$\\max(0, a_i - b_i)$$$.<\/p><p>You only have time to perform $$$k$$$ operations before Sparkle sets off a nuclear bomb! What is the maximum score you can acquire after $$$k$$$ operations?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains $$$t$$$ ($$$1 \\leq t \\leq 1000$$$) \u2014 the number of test cases.<\/p><p>The first line of each test case contains $$$n$$$ and $$$k$$$ ($$$1 \\leq n \\leq 2 \\cdot 10^5, 1 \\leq k \\leq 10^9$$$) \u2014 the length of the arrays and the number of operations you can perform.<\/p><p>The following line contains $$$n$$$ integers $$$a_1, a_2, ... a_n$$$ ($$$1 \\leq a_i \\leq 10^9$$$).<\/p><p>The following line contains $$$n$$$ integers $$$b_1, b_2, ... b_n$$$ ($$$1 \\leq b_i \\leq 10^9$$$).<\/p><p>It is guaranteed that the sum of $$$n$$$ for all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output an integer, the maximum score you can acquire after $$$k$$$ operations.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 6 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 9<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">32 52 68 64 14<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">18 14 53 24 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 1000<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 3 4 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 4 3 2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 1000000<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1000000<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">10 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3 3 5 10 6 8 6 8 7 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">6 1 7 4 1 1 8 9 3 1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n21\n349\n27\n500000500000\n47\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1739, "index": "D", "name": "Reset K Edges", "rating": 1900, "solvedCount": 6588, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Reset K Edges<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a rooted tree, consisting of $$$n$$$ vertices. The vertices are numbered from $$$1$$$ to $$$n$$$, the root is the vertex $$$1$$$.<\/p><p>You can perform the following operation <span class=\"tex-font-style-bf\">at most<\/span> $$$k$$$ times: <\/p><ul> <li> choose an edge $$$(v, u)$$$ of the tree such that $$$v$$$ is a parent of $$$u$$$; <\/li><li> remove the edge $$$(v, u)$$$; <\/li><li> add an edge $$$(1, u)$$$ (i.\u2009e. make $$$u$$$ with its subtree a child of the root). <\/li><\/ul><p><span class=\"tex-font-style-it\">The height<\/span> of a tree is the maximum depth of its vertices, and the depth of a vertex is the number of edges on the path from the root to it. For example, the depth of vertex $$$1$$$ is $$$0$$$, since it's the root, and the depth of all its children is $$$1$$$.<\/p><p>What's the smallest height of the tree that can be achieved?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of testcases.<\/p><p>The first line of each testcase contains two integers $$$n$$$ and $$$k$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$; $$$0 \\le k \\le n - 1$$$)\u00a0\u2014 the number of vertices in the tree and the maximum number of operations you can perform.<\/p><p>The second line contains $$$n-1$$$ integers $$$p_2, p_3, \\dots, p_n$$$ ($$$1 \\le p_i  \\lt  i$$$)\u00a0\u2014 the parent of the $$$i$$$-th vertex. Vertex $$$1$$$ is the root.<\/p><p>The sum of $$$n$$$ over all testcases doesn't exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each testcase, print a single integer\u00a0\u2014 the smallest height of the tree that can achieved by performing <span class=\"tex-font-style-bf\">at most<\/span> $$$k$$$ operations.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1 2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 1 2 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 3 4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 2 3 4 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 1 1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n1\n5\n3\n1\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1436, "index": "D", "name": "Bandit in a City", "rating": 1900, "solvedCount": 6585, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Bandit in a City<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Bandits appeared in the city! One of them is trying to catch as many citizens as he can.<\/p><p>The city consists of $$$n$$$ squares connected by $$$n-1$$$ roads in such a way that it is possible to reach any square from any other square. The square number $$$1$$$ is the main square.<\/p><p>After Sunday walk all the roads were changed to <span class=\"tex-font-style-bf\">one-way<\/span> roads in such a way that it is possible to reach any square from the main square.<\/p><p>At the moment when the bandit appeared on the main square there were $$$a_i$$$ citizens on the $$$i$$$-th square. Now the following process will begin. First, each citizen that is currently on a square with some outgoing one-way roads chooses one of such roads and moves along it to another square. Then the bandit chooses one of the one-way roads outgoing from the square he is located and moves along it. The process is repeated until the bandit is located on a square with no outgoing roads. The bandit catches all the citizens on that square.<\/p><p>The bandit wants to catch as many citizens as possible; the citizens want to minimize the number of caught people. The bandit and the citizens know positions of all citizens at any time, the citizens can cooperate. If both sides act optimally, how many citizens will be caught?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$\u00a0\u2014 the number of squares in the city ($$$2 \\le n \\le 2\\cdot10^5$$$).<\/p><p>The second line contains $$$n-1$$$ integers $$$p_2, p_3 \\dots p_n$$$ meaning that there is a one-way road from the square $$$p_i$$$ to the square $$$i$$$ ($$$1 \\le p_i  \\lt  i$$$). <\/p><p>The third line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$\u00a0\u2014 the number of citizens on each square initially ($$$0 \\le a_i \\le 10^9$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer\u00a0\u2014 the number of citizens the bandit will catch if both sides act optimally.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n1 1\n3 1 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n1 1\n3 1 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example the citizens on the square $$$1$$$ can split into two groups $$$2 + 1$$$, so that the second and on the third squares will have $$$3$$$ citizens each.<\/p><p>In the second example no matter how citizens act the bandit can catch at least $$$4$$$ citizens.<\/p><\/div><\/div>"}, {"contestId": 1492, "index": "D", "name": "Genius's Gambit", "rating": 1900, "solvedCount": 6565, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Genius's Gambit<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given three integers $$$a$$$, $$$b$$$, $$$k$$$.<\/p><p>Find two <span class=\"tex-font-style-it\">binary<\/span> integers $$$x$$$ and $$$y$$$ ($$$x \\ge y$$$) such that <\/p><ol> <li> both $$$x$$$ and $$$y$$$ consist of $$$a$$$ zeroes and $$$b$$$ ones; <\/li><li> $$$x - y$$$ (also written in binary form) has exactly $$$k$$$ ones. <\/li><\/ol> You are <span class=\"tex-font-style-bf\">not allowed to use leading zeros for $$$x$$$ and $$$y$$$<\/span>. <\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line contains three integers $$$a$$$, $$$b$$$, and $$$k$$$ ($$$0 \\leq a$$$; $$$1 \\leq b$$$; $$$0 \\leq k \\leq a + b \\leq 2 \\cdot 10^5$$$)\u00a0\u2014 the number of zeroes, ones, and the number of ones in the result.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If it's possible to find two suitable integers, print \"<span class=\"tex-font-style-tt\">Yes<\/span>\" followed by $$$x$$$ and $$$y$$$ in base-2.<\/p><p>Otherwise print \"<span class=\"tex-font-style-tt\">No<\/span>\".<\/p><p>If there are multiple possible answers, print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 2 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYes\n101000\n100001\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 2 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYes\n10100\n10010\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 2 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nNo\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, $$$x = 101000_2 = 2^5 + 2^3 = 40_{10}$$$, $$$y = 100001_2 = 2^5 + 2^0 = 33_{10}$$$, $$$40_{10} - 33_{10} = 7_{10} = 2^2 + 2^1 + 2^0 = 111_{2}$$$. Hence $$$x-y$$$ has $$$3$$$ ones in base-2.<\/p><p>In the second example, $$$x = 10100_2 = 2^4 + 2^2 = 20_{10}$$$, $$$y = 10010_2 = 2^4 + 2^1 = 18$$$, $$$x - y = 20 - 18 = 2_{10} = 10_{2}$$$. This is precisely one 1.<\/p><p>In the third example, one may show, that it's impossible to find an answer.<\/p><\/div><\/div>"}, {"contestId": 1238, "index": "D", "name": "AB-string", "rating": 1900, "solvedCount": 6551, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. AB-string<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>The string $$$t_1t_2 \\dots t_k$$$ is good if each letter of this string belongs to at least one palindrome of length <span class=\"tex-font-style-bf\">greater<\/span> than <span class=\"tex-font-style-tt\">1<\/span>.<\/p><p>A palindrome is a string that reads the same backward as forward. For example, the strings <span class=\"tex-font-style-tt\">A<\/span>, <span class=\"tex-font-style-tt\">BAB<\/span>, <span class=\"tex-font-style-tt\">ABBA<\/span>, <span class=\"tex-font-style-tt\">BAABBBAAB<\/span> are palindromes, but the strings <span class=\"tex-font-style-tt\">AB<\/span>, <span class=\"tex-font-style-tt\">ABBBAA<\/span>, <span class=\"tex-font-style-tt\">BBBA<\/span> are not.<\/p><p>Here are some examples of good strings: <\/p><ul> <li> $$$t$$$ = <span class=\"tex-font-style-tt\">AABBB<\/span> (letters $$$t_1$$$, $$$t_2$$$ belong to palindrome $$$t_1 \\dots t_2$$$ and letters $$$t_3$$$, $$$t_4$$$, $$$t_5$$$ belong to palindrome $$$t_3 \\dots t_5$$$); <\/li><li> $$$t$$$ = <span class=\"tex-font-style-tt\">ABAA<\/span> (letters $$$t_1$$$, $$$t_2$$$, $$$t_3$$$ belong to palindrome $$$t_1 \\dots t_3$$$ and letter $$$t_4$$$ belongs to palindrome $$$t_3 \\dots t_4$$$); <\/li><li> $$$t$$$ = <span class=\"tex-font-style-tt\">AAAAA<\/span> (all letters belong to palindrome $$$t_1 \\dots t_5$$$); <\/li><\/ul><p>You are given a string $$$s$$$ of length $$$n$$$, consisting of <span class=\"tex-font-style-bf\">only<\/span> letters <span class=\"tex-font-style-tt\">A<\/span> and <span class=\"tex-font-style-tt\">B<\/span>.<\/p><p>You have to calculate the number of good substrings of string $$$s$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$1 \\le n \\le 3 \\cdot 10^5$$$) \u2014 the length of the string $$$s$$$.<\/p><p>The second line contains the string $$$s$$$, consisting of letters <span class=\"tex-font-style-tt\">A<\/span> and <span class=\"tex-font-style-tt\">B<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the number of good substrings of string $$$s$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\nAABBB\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\nAAA\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7\nAAABABB\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n15\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case there are six good substrings: $$$s_1 \\dots s_2$$$, $$$s_1 \\dots s_4$$$, $$$s_1 \\dots s_5$$$, $$$s_3 \\dots s_4$$$, $$$s_3 \\dots s_5$$$ and $$$s_4 \\dots s_5$$$.<\/p><p>In the second test case there are three good substrings: $$$s_1 \\dots s_2$$$, $$$s_1 \\dots s_3$$$ and $$$s_2 \\dots s_3$$$.<\/p><\/div><\/div>"}];
    let currentProblem = null;
    let editor = null;
    const STORAGE_KEY = `cf_ladder_done_1900`;
    let doneSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));

    // Retrieve the template securely from the hidden textarea
    const DEFAULT_TEMPLATE = document.getElementById('cpp-template').value.trim();

    function initEditor() {
        editor = ace.edit("editor");
        editor.setTheme("ace/theme/tomorrow_night_eighties");
        editor.session.setMode("ace/mode/c_cpp");
        editor.setFontSize(15);
        editor.setValue(DEFAULT_TEMPLATE, 1);
    }

    function renderSidebar() {
        const list = document.getElementById('problem-list');
        list.innerHTML = '';
        PROBLEMS.forEach((prob, idx) => {
            const div = document.createElement('div');
            div.className = `problem-item ${currentProblem === prob ? 'active' : ''}`;
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox'; checkbox.className = 'done-checkbox'; checkbox.checked = doneSet.has(prob.name);
            checkbox.onclick = (e) => { e.stopPropagation(); toggleDone(prob.name, checkbox.checked); };
            const title = document.createElement('div');
            title.innerHTML = `<span class="text-xs text-slate-500">#${idx + 1}</span> <span class="font-semibold text-slate-200">${prob.name}</span>`;
            div.appendChild(checkbox); div.appendChild(title); div.onclick = () => loadProblem(prob);
            list.appendChild(div);
        });
        updateProgress();
    }

    function toggleDone(name, isDone) {
        if(isDone) { doneSet.add(name); confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#4ade80', '#38bdf8'] }); } 
        else { doneSet.delete(name); }
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...doneSet]));
        updateProgress();
    }

    function updateProgress() { document.getElementById('progress-text').innerText = `${doneSet.size} / ${PROBLEMS.length} Solved`; }

    function loadProblem(prob) {
        currentProblem = prob; renderSidebar();
        document.getElementById('welcome-screen').style.display = 'none';
        const contentDiv = document.getElementById('problem-content');
        contentDiv.style.display = 'block'; contentDiv.innerHTML = prob.html;
        const titleEl = contentDiv.querySelector('.header .title');
        if(titleEl) {
            const originalText = titleEl.innerText;
            titleEl.innerHTML = `<a href="https://codeforces.com/contest/${prob.contestId}/problem/${prob.index}" target="_blank" title="Open in Codeforces">${originalText} 🔗</a>`;
        }
        contentDiv.querySelectorAll('.sample-tests .input pre').forEach(pre => {
            const btn = document.createElement('button'); btn.innerText = 'Copy'; btn.className = 'copy-btn';
            btn.onclick = () => { navigator.clipboard.writeText(pre.innerText); btn.innerText = 'Copied!'; btn.style.background = '#4ade80'; setTimeout(() => { btn.innerText = 'Copy'; btn.style.background = 'var(--neon-blue)'; }, 2000); };
            pre.parentElement.appendChild(btn);
        });
        if (window.MathJax) { MathJax.typesetPromise([contentDiv]); }
        editor.setValue(DEFAULT_TEMPLATE, 1);
    }

    function toggleSettings() {
        const modal = document.getElementById('settings-modal');
        if(modal.style.display === 'flex') { modal.style.display = 'none'; } 
        else { modal.style.display = 'flex'; document.getElementById('api-key').value = localStorage.getItem('cf_api_key') || ''; document.getElementById('api-secret').value = localStorage.getItem('cf_api_secret') || ''; }
    }

    function saveSettings() {
        localStorage.setItem('cf_api_key', document.getElementById('api-key').value);
        localStorage.setItem('cf_api_secret', document.getElementById('api-secret').value);
        toggleSettings(); alert('API Credentials Saved!');
    }

    async function sha512(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-512', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function submitCode() {
        if(!currentProblem) return alert('Select a problem first!');
        const apiKey = localStorage.getItem('cf_api_key'); const apiSecret = localStorage.getItem('cf_api_secret');
        if(!apiKey || !apiSecret) { alert('Please configure your API Key and Secret first.'); toggleSettings(); return; }
        const code = editor.getValue(); const time = Math.floor(Date.now() / 1000); const rand = Math.floor(Math.random() * 900000) + 100000;
        const params = { apiKey: apiKey, contestId: currentProblem.contestId.toString(), languageId: "54", problemIndex: currentProblem.index, source: code, time: time.toString() };
        const sortedKeys = Object.keys(params).sort();
        let paramString = sortedKeys.map(k => `${k}=${encodeURIComponent(params[k])}`).join('&');
        const sigPlain = `${rand}/problemset.submit?${paramString}#${apiSecret}`;
        const apiSig = `${rand}` + await sha512(sigPlain);
        try {
            const formData = new URLSearchParams();
            for (const key in params) formData.append(key, params[key]);
            formData.append("apiSig", apiSig);
            const res = await fetch("https://codeforces.com/api/problemset.submit", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: formData.toString() });
            const data = await res.json();
            if(data.status === 'OK') { alert('Code submitted successfully! 🎉 Check your Codeforces submissions.'); confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } }); } 
            else { alert('Submission failed: ' + data.comment); }
        } catch (err) { console.error(err); alert('Network error during submission.'); }
    }

    window.onload = () => { initEditor(); renderSidebar(); };
</script>
</body>

on of a weapon class and a metal type can be used any number of times.<\/p><p>What is the maximum total amount of experience you can earn by crafting and melting weapons?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\le n, m \\le 10^6$$$)\u00a0\u2014 the number of weapon classes and metal types.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^6$$$), where $$$a_i$$$ is the number of ingots you need to forge one weapon of the $$$i$$$-th class.<\/p><p>The third line contains $$$n$$$ integers $$$b_1, b_2, \\dots, b_n$$$ ($$$0 \\le b_i  \\lt  a_i$$$), where $$$b_i$$$ is the number of ingots you return by melting one weapon of the $$$i$$$-th class you forged earlier.<\/p><p>The fourth line contains $$$m$$$ integers $$$c_1, c_2, \\dots, c_m$$$ ($$$1 \\le c_j \\le 10^9$$$)\u00a0\u2014 the number of ingots you have of the corresponding metal type.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer\u00a0\u2014 the maximum total experience points you can gain by repeatedly forging and melting weapons.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">9 6 7 5 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">8 4 5 1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">10 4 7<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n12\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">10 20 20<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">0 0 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">9 10 19 20<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n8\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">1 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">1000000000 1000000000 1000000000 1000000000 1000000000<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4999999990\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, you can do the following: <\/p><ol> <li> craft one weapon of the $$$1$$$-st class from the $$$1$$$-st type of metal, spending $$$9$$$ ingots; <\/li><li> melt that weapon, returning $$$8$$$ ingots of the $$$1$$$-st metal type; <\/li><li> again, craft and melt one weapon of the $$$1$$$-st class from the $$$1$$$-st metal type; <\/li><li> craft and melt one weapon of the $$$3$$$-rd class from the $$$1$$$-st metal type; <\/li><li> craft and melt one weapon of the $$$3$$$-rd class from the $$$3$$$-rd metal type; <\/li><li> craft and melt one weapon of the $$$4$$$-th class from the $$$1$$$-st metal type; <\/li><li> craft and melt one weapon of the $$$5$$$-th class from the $$$3$$$-rd metal type; <\/li><\/ol> In the end you'll have $$$c = [2, 4, 2]$$$ ingots left. In total, you've crafted $$$6$$$ weapons and melted $$$6$$$ weapons, gaining $$$12$$$ experience points in total.<\/div><\/div>"}, {"contestId": 1895, "index": "D", "name": "XOR Construction", "rating": 1900, "solvedCount": 7291, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. XOR Construction<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given $$$n-1$$$ integers $$$a_1, a_2, \\dots, a_{n-1}$$$.<\/p><p>Your task is to construct an array $$$b_1, b_2, \\dots, b_n$$$ such that:<\/p><ul> <li> every integer from $$$0$$$ to $$$n-1$$$ appears in $$$b$$$ exactly once; <\/li><li> for every $$$i$$$ from $$$1$$$ to $$$n-1$$$, $$$b_i \\oplus b_{i+1} = a_i$$$ (where $$$\\oplus$$$ denotes the bitwise XOR operator). <\/li><\/ul><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$).<\/p><p>The second line contains $$$n-1$$$ integers $$$a_1, a_2, \\dots, a_{n-1}$$$ ($$$0 \\le a_i \\le 2n$$$).<\/p><p>Additional constraint on the input: it's always possible to construct at least one valid array $$$b$$$ from the given sequence $$$a$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$n$$$ integers $$$b_1, b_2, \\dots, b_n$$$. If there are multiple such arrays, you may print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">2 1 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0 2 3 1 <\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">1 6 1 4 1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2 3 5 4 0 1 <\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1998, "index": "C", "name": "Perform Operations to Maximize Score", "rating": 1900, "solvedCount": 7267, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Perform Operations to Maximize Score<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><div class=\"epigraph\"><div class=\"epigraph-text\"><span class=\"tex-font-style-it\">I see satyam343. I'm shaking. Please more median problems this time. I love those. Please satyam343 we believe in you.<\/span><\/div><div class=\"epigraph-source\">\u2014 satyam343's biggest fan<\/div><\/div><p>You are given an array $$$a$$$ of length $$$n$$$ and an integer $$$k$$$. You are also given a binary array $$$b$$$ of length $$$n$$$. <\/p><p>You can perform the following operation at most $$$k$$$ times: <\/p><ul> <li> Select an index $$$i$$$ ($$$1 \\leq i \\leq n$$$) such that $$$b_i = 1$$$. Set $$$a_i = a_i + 1$$$ (i.e., increase $$$a_i$$$ by $$$1$$$). <\/li><\/ul><p>Your <span class=\"tex-font-style-it\">score<\/span> is defined to be $$$\\max\\limits_{i = 1}^{n} \\left( a_i + \\operatorname{median}(c_i) \\right)$$$, where $$$c_i$$$ denotes the array of length $$$n-1$$$ that you get by deleting $$$a_i$$$ from $$$a$$$. In other words, your score is the maximum value of $$$a_i + \\operatorname{median}(c_i)$$$ over all $$$i$$$ from $$$1$$$ to $$$n$$$.<\/p><p>Find the maximum score that you can achieve if you perform the operations optimally.<\/p><p>For an arbitrary array $$$p$$$, $$$\\operatorname{median}(p)$$$ is defined as the $$$\\left\\lfloor \\frac{|p|+1}{2} \\right\\rfloor$$$-th <span class=\"tex-font-style-bf\">smallest<\/span> element of $$$p$$$. For example, $$$\\operatorname{median} \\left( [3,2,1,3] \\right) = 2$$$ and $$$\\operatorname{median} \\left( [6,2,4,5,1] \\right) = 4$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$t$$$ ($$$1 \\leq t \\leq 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>Each test case begins with two integers $$$n$$$ and $$$k$$$ ($$$2 \\leq n \\leq 2 \\cdot 10^5$$$, $$$0 \\leq k \\leq 10^9$$$)\u00a0\u2014 the length of the $$$a$$$ and the number of operations you can perform.<\/p><p>The following line contains $$$n$$$ space separated integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\leq a_i \\leq 10^9$$$)\u00a0\u2014 denoting the array $$$a$$$.<\/p><p>The following line contains $$$n$$$ space separated integers $$$b_1, b_2, \\ldots, b_n$$$ ($$$b_i$$$ is $$$0$$$ or $$$1$$$)\u00a0\u2014 denoting the array $$$b$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output the maximum value of score you can get on a new line.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 3 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">0 0 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 1 5 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0 1 0 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">7 5 2 5 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">0 0 1 0 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5 15 15 2 11<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 0 0 1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">5 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">10 11 4 10 15<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">1 1 0 1 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">4 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">1 1 2 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">1 1 0 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">2 1000000000<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">1000000000 1000000000<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">1 1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n16\n6\n8\n13\n21\n26\n8\n3000000000\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first test case, it is optimal to perform $$$5$$$ operations on both elements so $$$a = [8,8]$$$. So, the maximum score we can achieve is $$$\\max(8 + \\operatorname{median}[8], 8 + \\operatorname{median}[8]) = 16$$$, as $$$c_1 = [a_2] = [8]$$$. It can be proven that you cannot get a better score.<\/p><p>For the second test case, you are not able to perform operations on any elements, so $$$a$$$ remains $$$[3,3,3]$$$. So, the maximum score we can achieve is $$$3 + \\operatorname{median}[3, 3] = 6$$$, as $$$c_1 = [a_2, a_3] = [3, 3]$$$. It can be proven that you cannot get a better score.<\/p><\/div><\/div>"}, {"contestId": 1214, "index": "D", "name": "Treasure Island", "rating": 1900, "solvedCount": 7221, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Treasure Island<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>All of us love treasures, right? That's why young Vasya is heading for a Treasure Island.<\/p><p>Treasure Island may be represented as a rectangular table $$$n \\times m$$$ which is surrounded by the ocean. Let us number rows of the field with consecutive integers from $$$1$$$ to $$$n$$$ from top to bottom and columns with consecutive integers from $$$1$$$ to $$$m$$$ from left to right. Denote the cell in $$$r$$$-th row and $$$c$$$-th column as $$$(r, c)$$$. Some of the island cells contain impassable forests, and some cells are free and passable. Treasure is hidden in cell $$$(n, m)$$$.<\/p><p>Vasya got off the ship in cell $$$(1, 1)$$$. Now he wants to reach the treasure. He is hurrying up, so he can move only from cell to the cell in next row (downwards) or next column (rightwards), i.e. from cell $$$(x, y)$$$ he can move only to cells $$$(x+1, y)$$$ and $$$(x, y+1)$$$. Of course Vasya can't move through cells with impassable forests.<\/p><p>Evil Witch is aware of Vasya's journey and she is going to prevent him from reaching the treasure. Before Vasya's first move she is able to grow using her evil magic impassable forests in previously free cells. Witch is able to grow a forest in any number of any free cells except cells $$$(1, 1)$$$ where Vasya got off his ship and $$$(n, m)$$$ where the treasure is hidden.<\/p><p>Help Evil Witch by finding out the minimum number of cells she has to turn into impassable forests so that Vasya is no longer able to reach the treasure.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>First line of input contains two positive integers $$$n$$$, $$$m$$$ ($$$3 \\le n \\cdot m \\le 1\\,000\\,000$$$), sizes of the island.<\/p><p>Following $$$n$$$ lines contains strings $$$s_i$$$ of length $$$m$$$ describing the island, $$$j$$$-th character of string $$$s_i$$$ equals \"<span class=\"tex-font-style-tt\">#<\/span>\" if cell $$$(i, j)$$$ contains an impassable forest and \"<span class=\"tex-font-style-tt\">.<\/span>\" if the cell is free and passable. Let us remind you that Vasya gets of his ship at the cell $$$(1, 1)$$$, i.e. the first cell of the first row, and he wants to reach cell $$$(n, m)$$$, i.e. the last cell of the last row.<\/p><p>It's guaranteed, that cells $$$(1, 1)$$$ and $$$(n, m)$$$ are empty.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the only integer $$$k$$$, which is the minimum number of cells Evil Witch has to turn into impassable forest in order to prevent Vasya from reaching the treasure.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2 2\n..\n..\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 4\n....\n#.#.\n....\n.#..\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 4\n....\n.##.\n....\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The following picture illustrates the island in the third example. Blue arrows show possible paths Vasya may use to go from $$$(1, 1)$$$ to $$$(n, m)$$$. Red illustrates one possible set of cells for the Witch to turn into impassable forest to make Vasya's trip from $$$(1, 1)$$$ to $$$(n, m)$$$ impossible.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/5454a270dd417865501665080659e784875f1dda.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 1700, "index": "D", "name": "River Locks", "rating": 1900, "solvedCount": 7204, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. River Locks<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Recently in Divanovo, a huge river locks system was built. There are now $$$n$$$ locks, the $$$i$$$-th of them has the volume of $$$v_i$$$ liters, so that it can contain any amount of water between $$$0$$$ and $$$v_i$$$ liters. Each lock has a pipe attached to it. When the pipe is open, $$$1$$$ liter of water enters the lock every second.<\/p><p>The locks system is built in a way to immediately transfer all water exceeding the volume of the lock $$$i$$$ to the lock $$$i + 1$$$. If the lock $$$i + 1$$$ is also full, water will be transferred further. Water exceeding the volume of the last lock pours out to the river. <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/41308f5a05a3ba666b4f5fb70d3b4e2348b11f17.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"567px\"/> <span class=\"tex-font-size-small\">The picture illustrates $$$5$$$ locks with two open pipes at locks $$$1$$$ and $$$3$$$. Because locks $$$1$$$, $$$3$$$, and $$$4$$$ are already filled, effectively the water goes to locks $$$2$$$ and $$$5$$$.<\/span> <\/center><p>Note that the volume of the $$$i$$$-th lock may be greater than the volume of the $$$i + 1$$$-th lock.<\/p><p>To make all locks work, you need to completely fill each one of them. The mayor of Divanovo is interested in $$$q$$$ independent queries. For each query, suppose that initially all locks are empty and all pipes are closed. Then, some pipes are opened simultaneously. For the $$$j$$$-th query the mayor asks you to calculate the minimum number of pipes to open so that all locks are filled no later than after $$$t_j$$$ seconds.<\/p><p>Please help the mayor to solve this tricky problem and answer his queries. <\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first lines contains one integer $$$n$$$ ($$$1 \\le n \\le 200\\,000$$$)\u00a0\u2014 the number of locks. <\/p><p>The second lines contains $$$n$$$ integers $$$v_1, v_2, \\dots, v_n$$$ ($$$1 \\le v_i \\le 10^9$$$))\u00a0\u2014 volumes of the locks. <\/p><p>The third line contains one integer $$$q$$$ ($$$1 \\le q \\le 200\\,000$$$)\u00a0\u2014 the number of queries. <\/p><p>Each of the next $$$q$$$ lines contains one integer $$$t_j$$$ ($$$1 \\le t_j \\le 10^9$$$)\u00a0\u2014 the number of seconds you have to fill all the locks in the query $$$j$$$. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$q$$$ integers. The $$$j$$$-th of them should be equal to the minimum number of pipes to turn on so that after $$$t_j$$$ seconds all of the locks are filled. If it is impossible to fill all of the locks in given time, print $$$-1$$$. <\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n4 1 5 4 1\n6\n1\n6\n2\n3\n4\n5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n-1\n3\n-1\n-1\n4\n3\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n4 4 4 4 4\n6\n1\n3\n6\n5\n2\n4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n-1\n-1\n4\n4\n-1\n5\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>There are $$$6$$$ queries in the first example test. <\/p><p>In the queries $$$1, 3, 4$$$ the answer is $$$-1$$$. We need to wait $$$4$$$ seconds to fill the first lock even if we open all the pipes. <\/p><p>In the sixth query we can open pipes in locks $$$1$$$, $$$3$$$, and $$$4$$$. After $$$4$$$ seconds the locks $$$1$$$ and $$$4$$$ are full. In the following $$$1$$$ second $$$1$$$ liter of water is transferred to the locks $$$2$$$ and $$$5$$$. The lock $$$3$$$ is filled by its own pipe. <\/p><p>Similarly, in the second query one can open pipes in locks $$$1$$$, $$$3$$$, and $$$4$$$.<\/p><p>In the fifth query one can open pipes $$$1, 2, 3, 4$$$. <\/p><\/div><\/div>"}, {"contestId": 1175, "index": "D", "name": "Array Splitting", "rating": 1900, "solvedCount": 7200, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Array Splitting<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a_1, a_2, \\dots, a_n$$$ and an integer $$$k$$$.<\/p><p>You are asked to divide this array into $$$k$$$ non-empty consecutive subarrays. Every element in the array should be included in exactly one subarray. Let $$$f(i)$$$ be the index of subarray the $$$i$$$-th element belongs to. Subarrays are numbered from left to right and from $$$1$$$ to $$$k$$$.<\/p><p>Let the cost of division be equal to $$$\\sum\\limits_{i=1}^{n} (a_i \\cdot f(i))$$$. For example, if $$$a = [1, -2, -3, 4, -5, 6, -7]$$$ and we divide it into $$$3$$$ subbarays in the following way: $$$[1, -2, -3], [4, -5], [6, -7]$$$, then the cost of division is equal to $$$1 \\cdot 1 - 2 \\cdot 1 - 3 \\cdot 1 + 4 \\cdot 2 - 5 \\cdot 2 + 6 \\cdot 3 - 7 \\cdot 3 = -9$$$.<\/p><p>Calculate the maximum cost you can obtain by dividing the array $$$a$$$ into $$$k$$$ non-empty consecutive subarrays. <\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le k \\le n \\le 3 \\cdot 10^5$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$ |a_i| \\le 10^6$$$). <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the maximum cost you can obtain by dividing the array $$$a$$$ into $$$k$$$ nonempty consecutive subarrays. <\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 2\n-1 -2 5 -4 8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n15\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7 6\n-3 0 -1 -2 -2 -4 -1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n-45\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 1\n3 -1 6 0\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n8\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 455, "index": "B", "name": "A Lot of Games", "rating": 1900, "solvedCount": 7200, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. A Lot of Games<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Andrew, Fedor and Alex are inventive guys. Now they invent the game with strings for two players.<\/p><p>Given a group of <span class=\"tex-span\"><i>n<\/i><\/span> non-empty strings. During the game two players build the word together, initially the word is empty. The players move in turns. On his step player must add a single letter in the end of the word, the resulting word must be prefix of at least one string from the group. A player loses if he cannot move.<\/p><p>Andrew and Alex decided to play this game <span class=\"tex-span\"><i>k<\/i><\/span> times. The player who is the loser of the <span class=\"tex-span\"><i>i<\/i><\/span>-th game makes the first move in the <span class=\"tex-span\">(<i>i<\/i>\u2009+\u20091)<\/span>-th game. Guys decided that the winner of all games is the player who wins the last (<span class=\"tex-span\"><i>k<\/i><\/span>-th) game. Andrew and Alex already started the game. Fedor wants to know who wins the game if both players will play optimally. Help him.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers, <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>; <span class=\"tex-span\">1\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>).<\/p><p>Each of the next <span class=\"tex-span\"><i>n<\/i><\/span> lines contains a single non-empty string from the given group. The total length of all strings from the group doesn't exceed <span class=\"tex-span\">10<sup class=\"upper-index\">5<\/sup><\/span>. Each string of the group consists only of lowercase English letters.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If the player who moves first wins, print \"<span class=\"tex-font-style-tt\">First<\/span>\", otherwise print \"<span class=\"tex-font-style-tt\">Second<\/span>\" (without the quotes).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 3<br/>a<br/>b<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>First<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 1<br/>a<br/>b<br/>c<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>First<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>1 2<br/>ab<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>Second<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1545, "index": "B", "name": "AquaMoon and Chess", "rating": 1900, "solvedCount": 7175, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. AquaMoon and Chess<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Cirno gave AquaMoon a chessboard of size $$$1 \\times n$$$. Its cells are numbered with integers from $$$1$$$ to $$$n$$$ from left to right. In the beginning, some of the cells are occupied with at most one pawn, and other cells are unoccupied.<\/p><p>In each operation, AquaMoon can choose a cell $$$i$$$ with a pawn, and do <span class=\"tex-font-style-bf\">either<\/span> of the following (if possible): <\/p><ul> <li> Move pawn from it to the $$$(i+2)$$$-th cell, if $$$i+2 \\leq n$$$ and the $$$(i+1)$$$-th cell is occupied and the $$$(i+2)$$$-th cell is unoccupied. <\/li><li> Move pawn from it to the $$$(i-2)$$$-th cell, if $$$i-2 \\geq 1$$$ and the $$$(i-1)$$$-th cell is occupied and the $$$(i-2)$$$-th cell is unoccupied. <\/li><\/ul><p>You are given an initial state of the chessboard. AquaMoon wants to count the number of states reachable from the initial state with some sequence of operations. But she is not good at programming. Can you help her? As the answer can be large find it modulo $$$998\\,244\\,353$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The input consists of multiple test cases. The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 10\\,000$$$) \u2014 the number of test cases.<\/p><p>The first line contains a single integer $$$n$$$ ($$$1 \\leq n \\leq 10^5$$$) \u2014 the size of the chessboard.<\/p><p>The second line contains a string of $$$n$$$ characters, consists of characters \"<span class=\"tex-font-style-tt\">0<\/span>\" and \"<span class=\"tex-font-style-tt\">1<\/span>\". If the $$$i$$$-th character is \"<span class=\"tex-font-style-tt\">1<\/span>\", the $$$i$$$-th cell is initially occupied; otherwise, the $$$i$$$-th cell is initially unoccupied.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print the number of states that reachable from the initial state with some sequence of operations modulo $$$998\\,244\\,353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n4\n0110\n6\n011011\n5\n01010\n20\n10001111110110111000\n20\n00110110100110111101\n20\n11101111011000100010\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n6\n1\n1287\n1287\n715\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case the strings \"<span class=\"tex-font-style-tt\">1100<\/span>\", \"<span class=\"tex-font-style-tt\">0110<\/span>\" and \"<span class=\"tex-font-style-tt\">0011<\/span>\" are reachable from the initial state with some sequence of operations.<\/p><\/div><\/div>"}, {"contestId": 597, "index": "C", "name": "Subsequences", "rating": 1900, "solvedCount": 7165, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Subsequences<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>For the given sequence with <span class=\"tex-span\"><i>n<\/i><\/span> different elements find the number of increasing subsequences with <span class=\"tex-span\"><i>k<\/i>\u2009+\u20091<\/span> elements. It is guaranteed that the answer is not greater than <span class=\"tex-span\">8\u00b710<sup class=\"upper-index\">18<\/sup><\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>First line contain two integer values <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>,\u20090\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u200910)<\/span> \u2014 the length of sequence and the number of elements in increasing subsequences.<\/p><p>Next <span class=\"tex-span\"><i>n<\/i><\/span> lines contains one integer <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>) each \u2014 elements of sequence. All values <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> are different.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the answer to the problem.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 2<br/>1<br/>2<br/>3<br/>5<br/>4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>7<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1744, "index": "E2", "name": "Divisible Numbers (hard version)", "rating": 1900, "solvedCount": 7083, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E2. Divisible Numbers (hard version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is an hard version of the problem. The only difference between an easy and a hard version is the constraints on $$$a$$$, $$$b$$$, $$$c$$$ and $$$d$$$.<\/span><\/p><p>You are given $$$4$$$ positive integers $$$a$$$, $$$b$$$, $$$c$$$, $$$d$$$ with $$$a  \\lt  c$$$ and $$$b  \\lt  d$$$. Find any pair of numbers $$$x$$$ and $$$y$$$ that satisfies the following conditions:<\/p><ul><li> $$$a  \\lt  x \\leq c$$$, $$$b  \\lt  y \\leq d$$$,<\/li><li> $$$x \\cdot y$$$ is divisible by $$$a \\cdot b$$$.<\/li><\/ul><p>Note that required $$$x$$$ and $$$y$$$ may not exist.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains a single integer $$$t$$$ $$$(1 \\leq t \\leq 10$$$), the number of test cases.<\/p><p>The descriptions of the test cases follow.<\/p><p>The only line of each test case contains four integers $$$a$$$, $$$b$$$, $$$c$$$ and $$$d$$$ ($$$1 \\leq a  \\lt  c \\leq 10^9$$$, $$$1 \\leq b  \\lt  d \\leq 10^9$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case print a pair of numbers $$$a  \\lt  x \\leq c$$$ and $$$b  \\lt  y \\leq d$$$ such that $$$x \\cdot y$$$ is divisible by $$$a \\cdot b$$$. If there are multiple answers, print any of them. If there is no such pair of numbers, then print <span class=\"tex-font-style-tt\">-1 -1<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1 2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 4 5 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">8 9 15 18<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">12 21 14 24<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">36 60 48 66<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">1024 729 373248 730<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">1024 729 373247 730<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">5040 40320 40319 1000000000<\/div><div class=\"test-example-line test-example-line-odd test-example-line-9\">999999999 999999999 1000000000 1000000000<\/div><div class=\"test-example-line test-example-line-even test-example-line-10\">268435456 268435456 1000000000 1000000000<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2 2\n4 6\n12 12\n-1 -1\n-1 -1\n373248 730\n-1 -1\n15120 53760\n-1 -1\n536870912 536870912\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1922, "index": "D", "name": "Berserk Monsters", "rating": 1900, "solvedCount": 7033, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Berserk Monsters<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Monocarp is playing a computer game (yet again). Guess what is he doing? That's right, killing monsters.<\/p><p>There are $$$n$$$ monsters in a row, numbered from $$$1$$$ to $$$n$$$. The $$$i$$$-th monster has two parameters: attack value equal to $$$a_i$$$ and defense value equal to $$$d_i$$$. In order to kill these monsters, Monocarp put a berserk spell on them, so they're attacking each other instead of Monocarp's character.<\/p><p>The fight consists of $$$n$$$ rounds. Every round, the following happens:<\/p><ul> <li> first, every alive monster $$$i$$$ deals $$$a_i$$$ damage to the <span class=\"tex-font-style-bf\">closest<\/span> alive monster to the left (if it exists) and the <span class=\"tex-font-style-bf\">closest<\/span> alive monster to the right (if it exists); <\/li><li> then, every alive monster $$$j$$$ which received more than $$$d_j$$$ damage <span class=\"tex-font-style-bf\">during this round<\/span> dies. I.\u2009e. the $$$j$$$-th monster dies if and only if its defense value $$$d_j$$$ is <span class=\"tex-font-style-bf\">strictly less<\/span> than the total damage it received <span class=\"tex-font-style-bf\">this round<\/span>. <\/li><\/ul><p>For each round, calculate the number of monsters that will die during that round.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$) \u2014 the number of test cases.<\/p><p>Each test case consists of three lines:<\/p><ul> <li> the first line contains one integer $$$n$$$ ($$$1 \\le n \\le 3 \\cdot 10^5$$$); <\/li><li> the second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$); <\/li><li> the third line contains $$$n$$$ integers $$$d_1, d_2, \\dots, d_n$$$ ($$$1 \\le d_i \\le 10^9$$$). <\/li><\/ul><p>Additional constraint on the input: the sum of $$$n$$$ over all test cases does not exceed $$$3 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print $$$n$$$ integers. The $$$i$$$-th integer should be equal to the number of monsters that die during the $$$i$$$-th round.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 4 7 5 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 9 1 18 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 1 2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 3 4 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3 1 0 0 0 \n0 0 \n1 1 1 0 \n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Explanation for the first test case of the example:<\/p><p>During the first round, the following happens:<\/p><ul> <li> the monster $$$1$$$ deals $$$3$$$ damage to the monster $$$2$$$; <\/li><li> the monster $$$2$$$ deals $$$4$$$ damage to the monster $$$1$$$ and the monster $$$3$$$; <\/li><li> the monster $$$3$$$ deals $$$7$$$ damage to the monster $$$2$$$ and the monster $$$4$$$; <\/li><li> the monster $$$4$$$ deals $$$5$$$ damage to the monster $$$3$$$ and the monster $$$5$$$; <\/li><li> the monster $$$5$$$ deals $$$10$$$ damage to the monster $$$4$$$; <\/li><li> the monster $$$1$$$ does not die, since it received $$$4$$$ damage and its defense is $$$4$$$; <\/li><li> the monster $$$2$$$ dies, since it received $$$10$$$ damage and its defense is $$$9$$$; <\/li><li> the monster $$$3$$$ dies, since it received $$$9$$$ damage and its defense is $$$1$$$; <\/li><li> the monster $$$4$$$ does not die, since it received $$$17$$$ damage and its defense is $$$18$$$; <\/li><li> the monster $$$5$$$ dies, since it received $$$5$$$ damage and its defense is $$$1$$$. <\/li><\/ul><p>After the first round, the monsters $$$1$$$ and $$$4$$$ stay alive.<\/p><p>During the second round, the following happens:<\/p><ul> <li> the monster $$$1$$$ deals $$$3$$$ damage to the monster $$$4$$$; <\/li><li> the monster $$$4$$$ deals $$$5$$$ damage to the monster $$$1$$$; <\/li><li> the monster $$$1$$$ dies, since it received $$$5$$$ damage and its defense is $$$4$$$; <\/li><li> the monster $$$4$$$ does not die, since it received $$$3$$$ damage and its defense is $$$18$$$. <\/li><\/ul><p>During the next three rounds, only the $$$4$$$-th monster is alive, so nothing happens.<\/p><\/div><\/div>"}, {"contestId": 16, "index": "E", "name": "Fish", "rating": 1900, "solvedCount": 7002, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Fish<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>128 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p><span class=\"tex-span\"><i>n<\/i><\/span> fish, numbered from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span>, live in a lake. Every day right one pair of fish meet, and the probability of each other pair meeting is the same. If two fish with indexes i and j meet, the first will eat up the second with the probability <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>ij<\/i><\/sub><\/span>, and the second will eat up the first with the probability <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>ji<\/i><\/sub>\u2009=\u20091\u2009-\u2009<i>a<\/i><sub class=\"lower-index\"><i>ij<\/i><\/sub><\/span>. The described process goes on until there are at least two fish in the lake. For each fish find out the probability that it will survive to be the last in the lake.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200918<\/span>) \u2014 the amount of fish in the lake. Then there follow <span class=\"tex-span\"><i>n<\/i><\/span> lines with <span class=\"tex-span\"><i>n<\/i><\/span> real numbers each \u2014 matrix <span class=\"tex-span\"><i>a<\/i><\/span>. <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>ij<\/i><\/sub><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>ij<\/i><\/sub>\u2009\u2264\u20091<\/span>) \u2014 the probability that fish with index <span class=\"tex-span\"><i>i<\/i><\/span> eats up fish with index <span class=\"tex-span\"><i>j<\/i><\/span>. It's guaranteed that the main diagonal contains zeros only, and for other elements the following is true: <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>ij<\/i><\/sub>\u2009=\u20091\u2009-\u2009<i>a<\/i><sub class=\"lower-index\"><i>ji<\/i><\/sub><\/span>. All real numbers are given with not more than 6 characters after the decimal point.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output <span class=\"tex-span\"><i>n<\/i><\/span> space-separated real numbers accurate to not less than 6 decimal places. Number with index <span class=\"tex-span\"><i>i<\/i><\/span> should be equal to the probability that fish with index <span class=\"tex-span\"><i>i<\/i><\/span> will survive to be the last in the lake.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/>0 0.5<br/>0.5 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0.500000 0.500000 <\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>0 1 1 1 1<br/>0 0 0.5 0.5 0.5<br/>0 0.5 0 0.5 0.5<br/>0 0.5 0.5 0 0.5<br/>0 0.5 0.5 0.5 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1.000000 0.000000 0.000000 0.000000 0.000000 <\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1883, "index": "G2", "name": "Dances (Hard Version)", "rating": 1900, "solvedCount": 6989, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G2. Dances (Hard Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is the hard version of the problem. The only difference is that in this version $$$m \\leq 10^9$$$.<\/span><\/p><p>You are given two arrays of integers $$$a_1, a_2, \\ldots, a_n$$$ and $$$b_1, b_2, \\ldots, b_n$$$. Before applying any operations, you can reorder the elements of each array as you wish. Then, in one operation, you will perform both of the following actions, if the arrays are not empty:<\/p><ul><li> Choose any element from array $$$a$$$ and remove it (all remaining elements are shifted to a new array $$$a$$$),<\/li><li> Choose any element from array $$$b$$$ and remove it (all remaining elements are shifted to a new array $$$b$$$).<\/li><\/ul><p>Let $$$k$$$ be the final size of both arrays. You need to find the minimum number of operations required to satisfy $$$a_i  \\lt  b_i$$$ for all $$$1 \\leq i \\leq k$$$.<\/p><p>This problem was too easy, so the problem author decided to make it more challenging. You are also given a positive integer $$$m$$$. Now, you need to find the sum of answers to the problem for $$$m$$$ pairs of arrays $$$(c[i], b)$$$, where $$$1 \\leq i \\leq m$$$. Array $$$c[i]$$$ is obtained from $$$a$$$ as follows:<\/p><ul><li> $$$c[i]_1 = i$$$,<\/li><li> $$$c[i]_j = a_j$$$, for $$$2 \\leq j \\leq n$$$.<\/li><\/ul><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test consists of multiple test cases. The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 10^4$$$) - the number of sets of input data. This is followed by their description.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$m$$$ ($$$2 \\leq n \\leq 10^5$$$, $$$1 \\leq m \\leq 10^9$$$) - the size of arrays $$$a$$$ and $$$b$$$ and the constraints on the value of element $$$a_1$$$.<\/p><p>The second line of each test case contains $$$n - 1$$$ integers $$$a_2, \\ldots, a_n$$$ ($$$1 \\leq a_i \\leq 10^9$$$).<\/p><p>The third line of each test case contains $$$n$$$ integers $$$b_1, b_2, \\ldots, b_n$$$ ($$$1 \\leq b_i \\leq 10^9$$$).<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output the total number of minimum operations for all pairs of arrays $$$(c_i, b)$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 1 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 8 3 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">8 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 3 3 2 2 1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 1 1 1 3 3 3 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">9 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">9 2 8 3 7 4 6 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 2 3 2 1 4 5 6 5<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n12\n16\n4\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case:<\/p><ul><li> For the pair of arrays $$$([1, 1], [3, 2])$$$, the answer is $$$0$$$. No operations or reordering of elements are needed.<\/li><li> For the pair of arrays $$$([2, 1], [3, 2])$$$, the answer is $$$0$$$. The elements of the first array can be rearranged to obtain $$$[1, 2)$$$. No operations are needed.<\/li><li> For the pair of arrays $$$([3, 1], [3, 2])$$$, the answer is $$$1$$$. The element $$$3$$$ can be removed from the first array and the element $$$2$$$ can be removed from the second array.<\/li><li> For the pair of arrays $$$([4, 1], [3, 2])$$$, the answer is $$$1$$$. The element $$$4$$$ can be removed from the first array and the element $$$3$$$ can be removed from the second array.<\/li><\/ul><\/div><\/div>"}, {"contestId": 1986, "index": "F", "name": "Non-academic Problem", "rating": 1900, "solvedCount": 6961, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Non-academic Problem<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a connected undirected graph, the vertices of which are numbered with integers from $$$1$$$ to $$$n$$$. Your task is to minimize the number of pairs of vertices $$$1 \\leq u  \\lt  v \\leq n$$$ between which there exists a path in this graph. To achieve this, you can remove exactly one edge from the graph.<\/p><p>Find the smallest number of pairs of vertices!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test consists of several sets of input data. The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 10^4$$$)\u00a0\u2014 the number of sets of input data. Then follows their description.<\/p><p>The first line of each set of input data contains two integers $$$n$$$ and $$$m$$$ ($$$2 \\leq n \\leq 10^5$$$, $$$n - 1 \\leq m \\leq \\min(10^5, \\frac{n \\cdot (n - 1)}{2})$$$)\u00a0\u2014 the number of vertices in the graph and the number of edges.<\/p><p>Each of the next $$$m$$$ lines contains two integers $$$u$$$ and $$$v$$$ ($$$1 \\leq u, v \\leq n, u \\neq v$$$), indicating that there is an undirected edge in the graph between vertices $$$u$$$ and $$$v$$$.<\/p><p>It is guaranteed that the given graph is connected and without multiple edges.<\/p><p>It is guaranteed that the sum of $$$n$$$ and the sum of $$$m$$$ over all sets of input data does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each set of input data, output the smallest number of pairs of reachable vertices, if exactly one edge can be removed.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">10 12<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">2 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">5 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">6 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">7 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">3 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">8 9<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">9 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">10 8<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n3\n4\n6\n6\n21\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first set of input data, we will remove the single edge $$$(1, 2)$$$ and the only pair of vertices $$$(1, 2)$$$ will become unreachable from each other.<\/p><p>In the second set of input data, no matter which edge we remove, all vertices will be reachable from each other.<\/p><p>In the fourth set of input data, the graph looks like this initially.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/374872f585ce28149acd3b381875efadf03e3f9f.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>We will remove the edge $$$(3, 4)$$$ and then the only reachable pairs of vertices will be $$$(1, 2)$$$, $$$(1, 3)$$$, $$$(2, 3)$$$, $$$(4, 5)$$$, $$$(4, 6)$$$, $$$(5, 6)$$$.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/adb68230f3dce64b691c34d8c62b1aae1d001832.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>In the sixth set of input data, the graph looks like this initially.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/af198d53b65fc93300eea0a58cf54fbbf3f62159.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>After removing the edge $$$(2, 4)$$$, the graph will look like this. Thus, there will be $$$21$$$ pairs of reachable vertices.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/c6412c8719740b67fbeec45ec0428b1bf6adc5c4.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 2128, "index": "E1", "name": "Submedians (Easy Version)", "rating": 1900, "solvedCount": 6923, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E1. Submedians (Easy Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is the easy version of the problem. The only difference is that in this version, you are asked to find a subarray only for the maximum <span class=\"tex-font-style-it\">submedian<\/span>.<\/span><\/p><p><span class=\"tex-font-style-bf\">You can make hacks only if both versions of the problem are solved.<\/span><\/p><p>An integer $$$v$$$ is a <span class=\"tex-font-style-it\">median<\/span> of an array $$$b$$$ of length $$$m$$$ if and only if: <\/p><ul> <li> $$$v$$$ is greater than or equal to at least $$$\\lceil \\frac{m}{2} \\rceil$$$ elements of the array, and <\/li><li> $$$v$$$ is less than or equal to at least $$$\\lceil \\frac{m}{2} \\rceil$$$ elements of the array. <\/li><\/ul> For instance: <ul> <li> the only <span class=\"tex-font-style-it\">median<\/span> of $$$[9, 3, 7]$$$ is $$$7$$$, <\/li><li> the <span class=\"tex-font-style-it\">medians<\/span> of $$$[5, 3, 7, 9]$$$ are $$$5$$$, $$$6$$$, and $$$7$$$, and <\/li><li> the only <span class=\"tex-font-style-it\">median<\/span> of $$$[2, 2, 2]$$$ is $$$2$$$. <\/li><\/ul><p>You're given an integer $$$k$$$ and an array $$$a_1, \\ldots, a_n$$$ of integers between $$$1$$$ and $$$n$$$.<\/p><p>An integer $$$v$$$ from $$$1$$$ to $$$n$$$ is said to be a <span class=\"tex-font-style-it\">submedian<\/span> if there exists at least one pair of indices $$$(l, r)$$$ such that <\/p><ul> <li> $$$1 \\leq l \\leq r \\leq n$$$, <\/li><li> $$$r - l + 1 \\geq k$$$, <\/li><li> $$$v$$$ is a <span class=\"tex-font-style-it\">median<\/span> of the subarray $$$[a_l, \\ldots, a_r]$$$. <\/li><\/ul><p>It can be proven that there always exists at least one <span class=\"tex-font-style-it\">submedian<\/span>. Find the maximum <span class=\"tex-font-style-it\">submedian<\/span> $$$v_\\max$$$ and any corresponding pair of indices $$$(l, r)$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 50\\,000$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\leq k \\leq n \\leq 300\\,000$$$).<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\leq a_i \\leq n$$$).<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases doesn't exceed $$$300\\,000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output three integers $$$v_\\max$$$, $$$l$$$, and $$$r$$$\u00a0\u2014 the maximum <span class=\"tex-font-style-it\">submedian<\/span> $$$v_\\max$$$ and the bounds of a subarray of length at least $$$k$$$ ($$$r - l + 1 \\geq k$$$) such that $$$v_\\max$$$ is one of its <span class=\"tex-font-style-it\">medians<\/span>.<\/p><p>If there are many solutions, you can print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 1 2 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2 3 2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 3 2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 1 2 5 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">4 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">1 2 1 3<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4 1 4\n3 3 4\n2 2 4\n3 3 5\n1 1 1\n2 1 2\n3 4 4\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the subarrays of length at least $$$k = 3$$$ are <\/p><ul> <li> $$$(l = 1, r = 3)$$$: $$$[4, 1, 2]$$$ whose only <span class=\"tex-font-style-it\">median<\/span> is $$$2$$$, <\/li><li> $$$(l = 2, r = 4)$$$: $$$[1, 2, 4]$$$ whose only <span class=\"tex-font-style-it\">median<\/span> is $$$2$$$, and <\/li><li> $$$(l = 1, r = 4)$$$: $$$[4, 1, 2, 4]$$$ whose <span class=\"tex-font-style-it\">medians<\/span> are $$$2$$$, $$$3$$$, and $$$4$$$. <\/li><\/ul><p>In the second test case, one possible output is $$$(l = 3, r = 4)$$$ whose <span class=\"tex-font-style-it\">medians<\/span> are $$$2$$$ and $$$3$$$.<\/p><p>Note that it can be proven that no subarray of length at least $$$2$$$ admits $$$4$$$ or $$$5$$$ as a <span class=\"tex-font-style-it\">median<\/span>.<\/p><\/div><\/div>"}, {"contestId": 1898, "index": "D", "name": "Absolute Beauty", "rating": 1900, "solvedCount": 6919, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Absolute Beauty<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Kirill has two integer arrays $$$a_1,a_2,\\ldots,a_n$$$ and $$$b_1,b_2,\\ldots,b_n$$$ of length $$$n$$$. He defines the <span class=\"tex-font-style-it\">absolute beauty<\/span> of the array $$$b$$$ as $$$$$$\\sum_{i=1}^{n} |a_i - b_i|.$$$$$$ Here, $$$|x|$$$ denotes the absolute value of $$$x$$$.<\/p><p>Kirill can perform the following operation <span class=\"tex-font-style-bf\">at most once<\/span>: <\/p><ul> <li> select two indices $$$i$$$ and $$$j$$$ ($$$1 \\leq i  \\lt  j \\leq n$$$) and swap the values of $$$b_i$$$ and $$$b_j$$$. <\/li><\/ul><p>Help him find the maximum possible absolute beauty of the array $$$b$$$ after performing <span class=\"tex-font-style-bf\">at most one<\/span> swap.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\leq t \\leq 10\\,000$$$). The description of test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$2\\leq n\\leq 2\\cdot 10^5$$$)\u00a0\u2014 the length of the arrays $$$a$$$ and $$$b$$$.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1\\leq a_i\\leq 10^9$$$)\u00a0\u2014 the array $$$a$$$.<\/p><p>The third line of each test case contains $$$n$$$ integers $$$b_1, b_2, \\ldots, b_n$$$ ($$$1\\leq b_i\\leq 10^9$$$)\u00a0\u2014 the array $$$b$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2\\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output one integer\u00a0\u2014 the maximum possible absolute beauty of the array $$$b$$$ after no more than one swap.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 3 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 3 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 2 3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 6 7 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 8 2 5 3 5 3 1 1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2 9 2 4 8 2 3 5 3 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">47326 6958 358653<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">3587 35863 59474<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n2\n2\n16\n31\n419045\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, each of the possible swaps does not change the array $$$b$$$.<\/p><p>In the second test case, the absolute beauty of the array $$$b$$$ without performing the swap is $$$|1-1| + |2-2| = 0$$$. After swapping the first and the second element in the array $$$b$$$, the absolute beauty becomes $$$|1-2| + |2-1| = 2$$$. These are all the possible outcomes, hence the answer is $$$2$$$.<\/p><p>In the third test case, it is optimal for Kirill to not perform the swap. Similarly to the previous test case, the answer is $$$2$$$.<\/p><p>In the fourth test case, no matter what Kirill does, the absolute beauty of $$$b$$$ remains equal to $$$16$$$.<\/p><\/div><\/div>"}, {"contestId": 1512, "index": "F", "name": "Education", "rating": 1900, "solvedCount": 6912, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Education<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Polycarp is wondering about buying a new computer, which costs $$$c$$$ tugriks. To do this, he wants to get a job as a programmer in a big company.<\/p><p>There are $$$n$$$ positions in Polycarp's company, numbered starting from one. An employee in position $$$i$$$ earns $$$a[i]$$$ tugriks every day. The higher the position number, the more tugriks the employee receives. Initially, Polycarp gets a position with the number $$$1$$$ and has $$$0$$$ tugriks.<\/p><p>Each day Polycarp can do one of two things: <\/p><ul> <li> If Polycarp is in the position of $$$x$$$, then he can earn $$$a[x]$$$ tugriks. <\/li><li> If Polycarp is in the position of $$$x$$$ ($$$x  \\lt  n$$$) and has at least $$$b[x]$$$ tugriks, then he can spend $$$b[x]$$$ tugriks on an online course and move to the position $$$x+1$$$. <\/li><\/ul><p>For example, if $$$n=4$$$, $$$c=15$$$, $$$a=[1, 3, 10, 11]$$$, $$$b=[1, 2, 7]$$$, then Polycarp can act like this: <\/p><ul> <li> On the first day, Polycarp is in the $$$1$$$-st position and earns $$$1$$$ tugrik. Now he has $$$1$$$ tugrik; <\/li><li> On the second day, Polycarp is in the $$$1$$$-st position and move to the $$$2$$$-nd position. Now he has $$$0$$$ tugriks; <\/li><li> On the third day, Polycarp is in the $$$2$$$-nd position and earns $$$3$$$ tugriks. Now he has $$$3$$$ tugriks; <\/li><li> On the fourth day, Polycarp is in the $$$2$$$-nd position and is transferred to the $$$3$$$-rd position. Now he has $$$1$$$ tugriks; <\/li><li> On the fifth day, Polycarp is in the $$$3$$$-rd position and earns $$$10$$$ tugriks. Now he has $$$11$$$ tugriks; <\/li><li> On the sixth day, Polycarp is in the $$$3$$$-rd position and earns $$$10$$$ tugriks. Now he has $$$21$$$ tugriks; <\/li><li> Six days later, Polycarp can buy himself a new computer. <\/li><\/ul><p>Find the minimum number of days after which Polycarp will be able to buy himself a new computer.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$). Then $$$t$$$ test cases follow.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$c$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$, $$$1 \\le c \\le 10^9$$$)\u00a0\u2014 the number of positions in the company and the cost of a new computer.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1 \\le a_2 \\le \\ldots \\le a_n$$$ ($$$1 \\le a_i \\le 10^9$$$).<\/p><p>The third line of each test case contains $$$n - 1$$$ integer $$$b_1, b_2, \\ldots, b_{n-1}$$$ ($$$1 \\le b_i \\le 10^9$$$).<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output the minimum number of days after which Polycarp will be able to buy a new computer.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n4 15\n1 3 10 11\n1 2 7\n4 100\n1 5 10 50\n3 14 12\n2 1000000000\n1 1\n1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n13\n1000000000\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 540, "index": "D", "name": "Bad Luck Island", "rating": 1900, "solvedCount": 6903, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Bad Luck Island<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>The Bad Luck Island is inhabited by three kinds of species: <span class=\"tex-span\"><i>r<\/i><\/span> rocks, <span class=\"tex-span\"><i>s<\/i><\/span> scissors and <span class=\"tex-span\"><i>p<\/i><\/span> papers. At some moments of time two random individuals meet (all pairs of individuals can meet equiprobably), and if they belong to different species, then one individual kills the other one: a rock kills scissors, scissors kill paper, and paper kills a rock. Your task is to determine for each species what is the probability that this species will be the only one to inhabit this island after a long enough period of time.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The single line contains three integers <span class=\"tex-span\"><i>r<\/i><\/span>, <span class=\"tex-span\"><i>s<\/i><\/span> and <span class=\"tex-span\"><i>p<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>r<\/i>,\u2009<i>s<\/i>,\u2009<i>p<\/i>\u2009\u2264\u2009100<\/span>)\u00a0\u2014 the original number of individuals in the species of rock, scissors and paper, respectively.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print three space-separated real numbers: the probabilities, at which the rocks, the scissors and the paper will be the only surviving species, respectively. The answer will be considered correct if the relative or absolute error of each number doesn't exceed <span class=\"tex-span\">10<sup class=\"upper-index\">\u2009-\u20099<\/sup><\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 2 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0.333333333333 0.333333333333 0.333333333333<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 1 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0.150000000000 0.300000000000 0.550000000000<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>1 1 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0.057142857143 0.657142857143 0.285714285714<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1467, "index": "C", "name": "Three Bags", "rating": 1900, "solvedCount": 6869, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Three Bags<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given <span class=\"tex-font-style-bf\">three<\/span> bags. Each bag contains a non-empty multiset of numbers. You can perform a number of operations on these bags. In one operation, you can choose any two non-empty bags, and choose one number from each of the bags. Let's say that you choose number $$$a$$$ from the first bag and number $$$b$$$ from the second bag. Then, you remove $$$b$$$ from the second bag and replace $$$a$$$ with $$$a-b$$$ in the first bag. Note that if there are multiple occurrences of these numbers, then you shall only remove/replace exactly one occurrence.<\/p><p>You have to perform these operations in such a way that you have exactly one number remaining in exactly one of the bags (the other two bags being empty). It can be shown that you can always apply these operations to receive such a configuration in the end. Among all these configurations, find the one which has the maximum number left in the end.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains three space-separated integers $$$n_1$$$, $$$n_2$$$ and $$$n_3$$$ ($$$1 \\le n_1, n_2, n_3 \\le 3\\cdot10^5$$$, $$$1 \\le n_1+n_2+n_3 \\le 3\\cdot10^5$$$) \u2014 the number of numbers in the three bags.<\/p><p>The $$$i$$$-th of the next three lines contain $$$n_i$$$ space-separated integers $$$a_{{i,1}}$$$, $$$a_{{i,2}}$$$, ..., $$$a_{{i,{{n_i}}}}$$$ ($$$1 \\le a_{{i,j}} \\le 10^9$$$) \u2014 the numbers in the $$$i$$$-th bag.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u2014 t

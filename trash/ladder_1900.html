t": 7993, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. MinOr Tree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Recently, Vlad has been carried away by spanning trees, so his friends, without hesitation, gave him a connected weighted undirected graph of $$$n$$$ vertices and $$$m$$$ edges for his birthday.<\/p><p>Vlad defined the <span class=\"tex-font-style-it\">ority<\/span> of a spanning tree as the <a href=\"https://tiny.cc/bitwise_or\">bitwise OR<\/a> of all its weights, and now he is interested in what is the minimum possible <span class=\"tex-font-style-it\">ority<\/span> that can be achieved by choosing a certain spanning tree. A spanning tree is a connected subgraph of a given graph that does not contain cycles.<\/p><p>In other words, you want to keep $$$n-1$$$ edges so that the graph remains connected and the bitwise OR weights of the edges are as small as possible. You have to find the minimum bitwise OR itself.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains an integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$) \u2014 the number of test cases in the input.<\/p><p>An empty line is written in front of each test case.<\/p><p>This is followed by two numbers $$$n$$$ and $$$m$$$ ($$$3 \\le n \\le 2 \\cdot 10^5, n - 1 \\le m \\le 2 \\cdot 10^5$$$) \u2014 the number of vertices and edges of the graph, respectively.<\/p><p>The next $$$m$$$ lines contain the description of the edges. Line $$$i$$$ contains three numbers $$$v_i$$$, $$$u_i$$$ and $$$w_i$$$ ($$$1 \\le v_i, u_i \\le n$$$, $$$1 \\le w_i \\le 10^9$$$, $$$v_i \\neq u_i$$$) \u2014 the vertices that the edge connects and its weight.<\/p><p>It is guaranteed that the sum $$$m$$$ and the sum $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$ and each test case contains a connected graph.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$t$$$ lines, each of which contains the answer to the corresponding set of input data\u00a0\u2014 the minimum possible spanning tree <span class=\"tex-font-style-it\">ority<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\"><br/><\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 3 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\"><br/><\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 2 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 5 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 4 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 4 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\"><br/><\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 3 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 3 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 1 4<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n10\n3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/d64c761b6612e2a4743280f3a053638b4ce5c421.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"340px\"/> <span class=\"tex-font-size-small\">Graph from the first test case.<\/span> <\/center><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/b3f143591c5f396bfcae465a219a07f6977e662d.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"340px\"/> <span class=\"tex-font-size-small\"><span class=\"tex-font-style-it\">Ority<\/span> of this tree equals to <span class=\"tex-font-style-tt\">2 or 2 = 2<\/span> and it's minimal.<\/span> <\/center><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/d81ec086889aab981a460dd83512062fed1c9a20.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"340px\"/> <span class=\"tex-font-size-small\">Without excluding edge with weight $$$1$$$ <span class=\"tex-font-style-it\">ority<\/span> is <span class=\"tex-font-style-tt\">1 or 2 = 3<\/span>.<\/span> <\/center><\/div><\/div>"}, {"contestId": 1303, "index": "D", "name": "Fill The Bag", "rating": 1900, "solvedCount": 7985, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Fill The Bag<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You have a bag of size $$$n$$$. Also you have $$$m$$$ boxes. The size of $$$i$$$-th box is $$$a_i$$$, where each $$$a_i$$$ is an integer non-negative power of two.<\/p><p>You can divide boxes into two parts of equal size. Your goal is to fill the bag completely.<\/p><p>For example, if $$$n = 10$$$ and $$$a = [1, 1, 32]$$$ then you have to divide the box of size $$$32$$$ into two parts of size $$$16$$$, and then divide the box of size $$$16$$$. So you can fill the bag with boxes of size $$$1$$$, $$$1$$$ and $$$8$$$.<\/p><p>Calculate the minimum number of divisions required to fill the bag of size $$$n$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 1000$$$) \u2014 the number of test cases.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\le n \\le 10^{18}, 1 \\le m \\le 10^5$$$) \u2014 the size of bag and the number of boxes, respectively.<\/p><p>The second line of each test case contains $$$m$$$ integers $$$a_1, a_2, \\dots , a_m$$$ ($$$1 \\le a_i \\le 10^9$$$) \u2014 the sizes of boxes. It is guaranteed that each $$$a_i$$$ is a power of two.<\/p><p>It is also guaranteed that sum of all $$$m$$$ over all test cases does not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case print one integer \u2014 the minimum number of divisions required to fill the bag of size $$$n$$$ (or $$$-1$$$, if it is impossible).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n10 3\n1 32 1\n23 4\n16 1 4 1\n20 5\n2 1 16 1 8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n-1\n0\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1353, "index": "E", "name": "K-periodic Garland", "rating": 1900, "solvedCount": 7983, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. K-periodic Garland<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a garland consisting of $$$n$$$ lamps. States of the lamps are represented by the string $$$s$$$ of length $$$n$$$. The $$$i$$$-th character of the string $$$s_i$$$ equals '<span class=\"tex-font-style-tt\">0<\/span>' if the $$$i$$$-th lamp is turned off or '<span class=\"tex-font-style-tt\">1<\/span>' if the $$$i$$$-th lamp is turned on. You are also given a positive integer $$$k$$$.<\/p><p>In one move, you can choose <span class=\"tex-font-style-bf\">one lamp<\/span> and change its state (i.e. turn it on if it is turned off and vice versa).<\/p><p>The garland is called $$$k$$$-periodic if the distance between <span class=\"tex-font-style-bf\">each pair of adjacent turned on lamps<\/span> is <span class=\"tex-font-style-bf\">exactly<\/span> $$$k$$$. Consider the case $$$k=3$$$. Then garlands \"<span class=\"tex-font-style-tt\">00010010<\/span>\", \"<span class=\"tex-font-style-tt\">1001001<\/span>\", \"<span class=\"tex-font-style-tt\">00010<\/span>\" and \"<span class=\"tex-font-style-tt\">0<\/span>\" are good but garlands \"<span class=\"tex-font-style-tt\">00101001<\/span>\", \"<span class=\"tex-font-style-tt\">1000001<\/span>\" and \"<span class=\"tex-font-style-tt\">01001100<\/span>\" are not. Note that <span class=\"tex-font-style-bf\">the garland is not cyclic<\/span>, i.e. the first turned on lamp is not going after the last turned on lamp and vice versa.<\/p><p>Your task is to find the <span class=\"tex-font-style-bf\">minimum<\/span> number of moves you need to make to obtain $$$k$$$-periodic garland from the given one.<\/p><p>You have to answer $$$t$$$ independent test cases.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains one integer $$$t$$$ ($$$1 \\le t \\le 25~ 000$$$) \u2014 the number of test cases. Then $$$t$$$ test cases follow.<\/p><p>The first line of the test case contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le n \\le 10^6; 1 \\le k \\le n$$$) \u2014 the length of $$$s$$$ and the required period. The second line of the test case contains the string $$$s$$$ consisting of $$$n$$$ characters '<span class=\"tex-font-style-tt\">0<\/span>' and '<span class=\"tex-font-style-tt\">1<\/span>'.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$10^6$$$ ($$$\\sum n \\le 10^6$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print the answer \u2014 the <span class=\"tex-font-style-bf\">minimum<\/span> number of moves you need to make to obtain $$$k$$$-periodic garland from the given one.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n9 2\n010001010\n9 3\n111100000\n7 4\n1111111\n10 3\n1001110101\n1 1\n1\n1 1\n0\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n2\n5\n4\n0\n0\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1095, "index": "F", "name": "Make It Connected", "rating": 1900, "solvedCount": 7977, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Make It Connected<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an undirected graph consisting of $$$n$$$ vertices. A number is written on each vertex; the number on vertex $$$i$$$ is $$$a_i$$$. Initially there are no edges in the graph.<\/p><p>You may add some edges to this graph, but you have to pay for them. The cost of adding an edge between vertices $$$x$$$ and $$$y$$$ is $$$a_x + a_y$$$ coins. There are also $$$m$$$ special offers, each of them is denoted by three numbers $$$x$$$, $$$y$$$ and $$$w$$$, and means that you can add an edge connecting vertices $$$x$$$ and $$$y$$$ and pay $$$w$$$ coins for it. You don't have to use special offers: if there is a pair of vertices $$$x$$$ and $$$y$$$ that has a special offer associated with it, you still may connect these two vertices paying $$$a_x + a_y$$$ coins for it.<\/p><p>What is the minimum number of coins you have to spend to make the graph connected? Recall that a graph is connected if it's possible to get from any vertex to any other vertex using only the edges belonging to this graph.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$, $$$0 \\le m \\le 2 \\cdot 10^5$$$) \u2014 the number of vertices in the graph and the number of special offers, respectively.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^{12}$$$) \u2014 the numbers written on the vertices.<\/p><p>Then $$$m$$$ lines follow, each containing three integers $$$x$$$, $$$y$$$ and $$$w$$$ ($$$1 \\le x, y \\le n$$$, $$$1 \\le w \\le 10^{12}$$$, $$$x \\ne y$$$) denoting a special offer: you may add an edge connecting vertex $$$x$$$ and vertex $$$y$$$, and this edge will cost $$$w$$$ coins.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the minimum number of coins you have to pay to make the graph connected.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 2\n1 3 3\n2 3 5\n2 1 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 0\n1 3 3 7\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n16\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 4\n1 2 3 4 5\n1 2 8\n1 3 10\n1 4 7\n1 5 15\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n18\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example it is possible to connect $$$1$$$ to $$$2$$$ using special offer $$$2$$$, and then $$$1$$$ to $$$3$$$ without using any offers.<\/p><p>In next two examples the optimal answer may be achieved without using special offers.<\/p><\/div><\/div>"}, {"contestId": 2133, "index": "D", "name": "Chicken Jockey", "rating": 1900, "solvedCount": 7903, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Chicken Jockey<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p> <\/p><p>Steve made the foolish decision to mine at night, and came across a monstrous creature: the <span class=\"tex-font-style-it\">chicken jockey<\/span>$$$^n$$$!<\/p><p>A chicken jockey$$$^n$$$ consists of $$$n$$$ mobs stacked in order on top of each other, with mob $$$1$$$ at the bottom and mob $$$n$$$ at the top. Mob $$$i$$$ initially has $$$h_i$$$ health.<\/p><p>In one attack, Steve can deal $$$1$$$ damage to any mob. If any mob reaches $$$0$$$ or less health, it dies, and all the mobs on top of it fall down and form a <span class=\"tex-font-style-it\">new<\/span> stack. The <span class=\"tex-font-style-bf\">bottom<\/span> mob in the new stack takes $$$1$$$ fall damage for every mob it was on top of before falling (i.e. the number of mobs below it in the previous stack, including the one that just died). This may kill it as well, in which case all mobs on top of it fall down again and the process repeats.<\/p><p>For example, consider a chicken jockey$$$^6$$$ with initial mob healths $$$[1, 2, 1, 3, 5, 2]$$$. If Steve damages the third mob in the stack, it dies and the mobs with health $$$[3, 5, 2]$$$ fall down in a new stack. The bottom mob takes $$$3$$$ units of fall damage so it also dies, and the mobs with health $$$[5, 2]$$$ fall down in a new stack. The bottom mob takes $$$1$$$ unit of fall damage. As a result, after Steve's first attack, there will be two stacks with healths $$$[1, 2]$$$ and $$$[4, 2]$$$.<\/p><p>Steve's sword's durability is low, so he wishes to know the minimum attacks required to kill all the mobs.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of mobs.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$h_1, h_2,\\ldots, h_n$$$ ($$$1 \\le h_i \\le 10^9$$$)\u00a0\u2014 the initial health of each mob.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer\u00a0\u2014 the minimum attacks required to kill all the mobs.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 1 4 1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 1 1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 1 3 5 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 1 1 3 2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1000000000 1000000000 1000000000<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n7\n1\n7\n5\n2999999998\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the initial stack has mobs with health $$$[3, 1, 4, 1, 2]$$$. Steve can use one attack to damage the second mob in the stack and kill it. The third mob takes $$$2$$$ units of fall damage. There are now two stacks: $$$[3]$$$ and $$$[2, 1, 2]$$$. Now Steve can kill the second mob in the second stack. The third mob in the stack takes $$$2$$$ units of fall damage, killing it. There are now two stacks: $$$[3]$$$ and $$$[2]$$$. Finally, Steve can use five attacks to kill the remaining mobs.<\/p><p>In the second test case, Steve can deal $$$1$$$ damage to the bottom mob in the stack. When it dies, the second mob will take $$$1$$$ unit of fall damage and die; then the third mob will take $$$1$$$ unit of fall damage and die; finally the fourth mob will take $$$1$$$ unit of fall damage and die.<\/p><\/div><\/div>"}, {"contestId": 1992, "index": "F", "name": "Valuable Cards", "rating": 1900, "solvedCount": 7876, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Valuable Cards<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>In his favorite cafe Kmes once again wanted to try the herring under a fur coat. Previously, it would not have been difficult for him to do this, but the cafe recently introduced a new purchasing policy.<\/p><p>Now, in order to make a purchase, Kmes needs to solve the following problem: $$$n$$$ cards with prices for different positions are laid out in front of him, on the $$$i$$$-th card there is an integer $$$a_i$$$, among these prices there is no whole positive integer $$$x$$$.<\/p><p>Kmes is asked to divide these cards into the minimum number of <span class=\"tex-font-style-it\">bad<\/span> segments (so that each card belongs to exactly one segment). A segment is considered <span class=\"tex-font-style-it\">bad<\/span> if it is impossible to select a subset of cards with a product equal to $$$x$$$. All segments, in which Kmes will divide the cards, must be <span class=\"tex-font-style-it\">bad<\/span>.<\/p><p>Formally, the segment $$$(l, r)$$$ is <span class=\"tex-font-style-it\">bad<\/span> if there are no indices $$$i_1  \\lt  i_2  \\lt  \\ldots  \\lt  i_k$$$ such that $$$l \\le i_1, i_k \\le r$$$, and $$$a_{i_1} \\cdot a_{i_2} \\ldots \\cdot a_{i_k} = x$$$.<\/p><p>Help Kmes determine the minimum number of <span class=\"tex-font-style-it\">bad<\/span> segments in order to enjoy his favorite dish.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^3$$$) \u2014 the number of test cases.<\/p><p>The first line of each set of input data gives you $$$2$$$ integers $$$n$$$ and $$$x$$$ ($$$1 \\le n \\le 10^5, 2 \\le x \\le 10^5$$$) \u2014 the number of cards and the integer, respectively.<\/p><p>The second line of each set of input data contains $$$n$$$ integers $$$a_i$$$ ($$$1 \\le a_i \\le 2 \\cdot 10^5, a_i \\neq x$$$) \u2014 the prices on the cards.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all sets of test data does not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each set of input data, output the minimum number of <span class=\"tex-font-style-it\">bad<\/span> segments.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">6 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 3 6 2 1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">9 100000<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">50000 25000 12500 6250 3125 2 4 8 16<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 1 1 1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">8 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 3 4 3 4 3 4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">7 12<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">6 11 1 3 11 10 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">10 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">2 4 4 2 4 4 4 3 1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">7 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">4 6 5 1 2 4 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">8 27<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">3 9 17 26 2 20 9 3<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n2\n1\n1\n2\n1\n3\n3\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1994, "index": "D", "name": "Funny Game", "rating": 1900, "solvedCount": 7861, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Funny Game<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Vanya has a graph with $$$n$$$ vertices (numbered from $$$1$$$ to $$$n$$$) and an array $$$a$$$ of $$$n$$$ integers; initially, there are no edges in the graph. Vanya got bored, and to have fun, he decided to perform $$$n - 1$$$ operations.<\/p><p>Operation number $$$x$$$ (operations are numbered in order starting from $$$1$$$) is as follows:<\/p><ul> <li> Choose $$$2$$$ different numbers $$$1 \\leq u,v \\leq n$$$, such that $$$|a_u - a_v|$$$ is divisible by $$$x$$$. <\/li><li> Add an undirected edge between vertices $$$u$$$ and $$$v$$$ to the graph. <\/li><\/ul><p>Help Vanya get a connected$$$^{\\text{\u2217}}$$$ graph using the $$$n - 1$$$ operations, or determine that it is impossible.<\/p><div class=\"statement-footnote\"><p>$$$^{\\text{\u2217}}$$$A graph is called connected if it is possible to reach any vertex from any other by moving along the edges.<\/p><\/div><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test consists of multiple test cases. The first line contains an integer $$$t$$$ ($$$1 \\le t \\le 10^{3}$$$)\u00a0\u2014 the number of test cases. Then follows the description of the test cases.<\/p><p>The first line of each test case contains the number $$$n$$$ ($$$1 \\leq n \\leq 2000$$$)\u00a0\u2014 the number of vertices in the graph.<\/p><p>The second line of each test case contains $$$n$$$ numbers $$$a_1, a_2, \\cdots a_n$$$ ($$$1 \\leq a_i \\leq 10^9$$$).<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, if there is no solution, then output \"<span class=\"tex-font-style-tt\">No<\/span>\" (without quotes). <\/p><p>Otherwise, output \"<span class=\"tex-font-style-tt\">Yes<\/span>\" (without quotes), and then output $$$n - 1$$$ lines, where in the $$$i$$$-th line, output the numbers $$$u$$$ and $$$v$$$ that need to be chosen for operation $$$i$$$.<\/p><p>You can output each letter in any case (for example, the strings \"<span class=\"tex-font-style-tt\">yEs<\/span>\", \"<span class=\"tex-font-style-tt\">yes<\/span>\", \"<span class=\"tex-font-style-tt\">Yes<\/span>\", and \"<span class=\"tex-font-style-tt\">YES<\/span>\" will be recognized as a positive answer).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">99 7 1 13<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">10 2 31 44 73<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">87 6 81 44 32<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">62 35 33 79 16<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">6 51 31 69 42<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">52 63 25 21 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">12<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">33 40 3 11 31 43 37 8 50 5 12 22<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\n2 1\nYES\n4 1\n2 1\n3 2\nYES\n5 1\n4 1\n3 1\n2 1\nYES\n4 1\n3 1\n2 1\n5 4\nYES\n3 1\n5 1\n2 1\n4 2\nYES\n4 1\n5 1\n2 1\n3 2\nYES\n2 1\n5 2\n3 1\n4 3\nYES\n9 1\n12 9\n11 1\n10 1\n6 1\n7 6\n2 1\n8 2\n5 2\n3 1\n4 1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Let's consider the second test case. <\/p><ul> <li> First operation $$$(x = 1)$$$: we can connect vertices $$$4$$$ and $$$1$$$, since $$$|a_4 - a_1| = |13 - 99| = |-86| = 86$$$, and $$$86$$$ is divisible by $$$1$$$. <\/li><\/ul> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/24b0967a906dec08457b4ca26b1b9f94e4ae11d0.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <ul> <li> Second operation $$$(x = 2)$$$: we can connect vertices $$$2$$$ and $$$1$$$, since $$$|a_2 - a_1| = |7 - 99| = |-92| = 92$$$, and $$$92$$$ is divisible by $$$2$$$. <\/li><\/ul> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/fdb54e80cd5428b2a0b745bfed10e1b4409a4a07.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <ul> <li> Third operation $$$(x = 3)$$$: we can connect vertices $$$3$$$ and $$$2$$$, since $$$|a_3 - a_2| = |1 - 7| = |-6| = 6$$$, and $$$6$$$ is divisible by $$$3$$$. <\/li><\/ul> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/449331c248284a198b0c59042745856fef47c643.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> From the picture, it can be seen that a connected graph is obtained.<\/div><\/div>"}, {"contestId": 2013, "index": "D", "name": "Minimize the Difference", "rating": 1900, "solvedCount": 7698, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Minimize the Difference<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Zhan, tired after the contest, gave the only task that he did not solve during the contest to his friend, Sungat. However, he could not solve it either, so we ask you to try to solve this problem.<\/p><p>You are given an array $$$a_1, a_2, \\ldots, a_n$$$ of length $$$n$$$. We can perform any number (possibly, zero) of operations on the array.<\/p><p>In one operation, we choose a position $$$i$$$ ($$$1 \\leq i \\leq n - 1$$$) and perform the following action: <\/p><ul> <li> $$$a_i := a_i - 1$$$, and $$$a_{i+1} := a_{i+1} + 1$$$. <\/li><\/ul><p>Find the minimum possible value of $$$\\max(a_1, a_2, \\ldots, a_n) - \\min(a_1, a_2, \\ldots, a_n)$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^5$$$). The description of the test cases follows.<\/p><p>The first line of each test case contains an integer $$$n$$$ ($$$1 \\leq n \\leq 2 \\cdot 10^5$$$).<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\leq a_i \\leq 10^{12}$$$).<\/p><p>The sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer: the minimum possible value of $$$\\max(a_1, a_2, \\ldots, a_n) - \\min(a_1, a_2, \\ldots, a_n)$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 1 2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 2 3 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5 14 4 10 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n2\n1\n1\n3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the third testcase, you can perform the operation twice with $$$i = 1$$$.<\/p><p>After that, the array is $$$a = [2, 3, 2, 3]$$$, and $$$\\max(2, 3, 2, 3) - \\min(2, 3, 2, 3) = 3 - 2 = 1$$$.<\/p><\/div><\/div>"}, {"contestId": 1205, "index": "B", "name": "Shortest Cycle", "rating": 1900, "solvedCount": 7663, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Shortest Cycle<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given $$$n$$$ integer numbers $$$a_1, a_2, \\dots, a_n$$$. Consider graph on $$$n$$$ nodes, in which nodes $$$i$$$, $$$j$$$ ($$$i\\neq j$$$) are connected if and only if, $$$a_i$$$ AND $$$a_j\\neq 0$$$, where AND denotes the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#AND\">bitwise AND operation<\/a>.<\/p><p>Find the length of the shortest cycle in this graph or determine that it doesn't have cycles at all.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ $$$(1 \\le n \\le 10^5)$$$\u00a0\u2014 number of numbers.<\/p><p>The second line contains $$$n$$$ integer numbers $$$a_1, a_2, \\dots, a_n$$$ ($$$0 \\le a_i \\le 10^{18}$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If the graph doesn't have any cycles, output $$$-1$$$. Else output the length of the shortest cycle.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n3 6 28 9\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n5 12 9 16 48\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n1 2 4 8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n-1<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, the shortest cycle is $$$(9, 3, 6, 28)$$$.<\/p><p>In the second example, the shortest cycle is $$$(5, 12, 9)$$$.<\/p><p>The graph has no cycles in the third example.<\/p><\/div><\/div>"}, {"contestId": 1656, "index": "D", "name": "K-good", "rating": 1900, "solvedCount": 7661, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. K-good<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>We say that a positive integer $$$n$$$ is $$$k$$$-good for some positive integer $$$k$$$ if $$$n$$$ can be expressed as a sum of $$$k$$$ positive integers which give $$$k$$$ distinct remainders when divided by $$$k$$$.<\/p><p>Given a positive integer $$$n$$$, find some $$$k \\geq 2$$$ so that $$$n$$$ is $$$k$$$-good or tell that such a $$$k$$$ does not exist.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The input consists of multiple test cases. The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 10^5$$$) \u2014 the number of test cases.<\/p><p>Each test case consists of one line with an integer $$$n$$$ ($$$2 \\leq n \\leq 10^{18}$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print a line with a value of $$$k$$$ such that $$$n$$$ is $$$k$$$-good ($$$k \\geq 2$$$), or $$$-1$$$ if $$$n$$$ is not $$$k$$$-good for any $$$k$$$. If there are multiple valid values of $$$k$$$, you can print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n2\n4\n6\n15\n20\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n-1\n-1\n3\n3\n5\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>$$$6$$$ is a $$$3$$$-good number since it can be expressed as a sum of $$$3$$$ numbers which give different remainders when divided by $$$3$$$: $$$6 = 1 + 2 + 3$$$.<\/p><p>$$$15$$$ is also a $$$3$$$-good number since $$$15 = 1 + 5 + 9$$$ and $$$1, 5, 9$$$ give different remainders when divided by $$$3$$$.<\/p><p>$$$20$$$ is a $$$5$$$-good number since $$$20 = 2 + 3 + 4 + 5 + 6$$$ and $$$2,3,4,5,6$$$ give different remainders when divided by $$$5$$$.<\/p><\/div><\/div>"}, {"contestId": 1313, "index": "C2", "name": "Skyscrapers (hard version)", "rating": 1900, "solvedCount": 7602, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C2. Skyscrapers (hard version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-it\">This is a harder version of the problem. In this version $$$n \\le 500\\,000$$$<\/span><\/p><p>The outskirts of the capital are being actively built up in Berland. The company \"Kernel Panic\" manages the construction of a residential complex of skyscrapers in New Berlskva. All skyscrapers are built along the highway. It is known that the company has already bought $$$n$$$ plots along the highway and is preparing to build $$$n$$$ skyscrapers, one skyscraper per plot.<\/p><p>Architects must consider several requirements when planning a skyscraper. Firstly, since the land on each plot has different properties, each skyscraper has a limit on the largest number of floors it can have. Secondly, according to the design code of the city, it is unacceptable for a skyscraper to simultaneously have higher skyscrapers both to the left and to the right of it.<\/p><p>Formally, let's number the plots from $$$1$$$ to $$$n$$$. Then if the skyscraper on the $$$i$$$-th plot has $$$a_i$$$ floors, it must hold that $$$a_i$$$ is at most $$$m_i$$$ ($$$1 \\le a_i \\le m_i$$$). Also there mustn't be integers $$$j$$$ and $$$k$$$ such that $$$j  \\lt  i  \\lt  k$$$ and $$$a_j  \\gt  a_i  \\lt  a_k$$$. Plots $$$j$$$ and $$$k$$$ are <span class=\"tex-font-style-bf\">not<\/span> required to be adjacent to $$$i$$$.<\/p><p>The company wants the total number of floors in the built skyscrapers to be as large as possible. Help it to choose the number of floors for each skyscraper in an optimal way, i.e. in such a way that all requirements are fulfilled, and among all such construction plans choose any plan with the maximum possible total number of floors.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$1 \\leq n \\leq 500\\,000$$$)\u00a0\u2014 the number of plots.<\/p><p>The second line contains the integers $$$m_1, m_2, \\ldots, m_n$$$ ($$$1 \\leq m_i \\leq 10^9$$$)\u00a0\u2014 the limit on the number of floors for every possible number of floors for a skyscraper on each plot.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$n$$$ integers $$$a_i$$$\u00a0\u2014 the number of floors in the plan for each skyscraper, such that all requirements are met, and the total number of floors in all skyscrapers is the maximum possible.<\/p><p>If there are multiple answers possible, print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1 2 3 2 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1 2 3 2 1 <br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>10 6 8<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>10 6 6 <br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, you can build all skyscrapers with the highest possible height.<\/p><p>In the second test example, you cannot give the maximum height to all skyscrapers as this violates the design code restriction. The answer $$$[10, 6, 6]$$$ is optimal. Note that the answer of $$$[6, 6, 8]$$$ also satisfies all restrictions, but is not optimal.<\/p><\/div><\/div>"}, {"contestId": 1307, "index": "D", "name": "Cow and Fields", "rating": 1900, "solvedCount": 7593, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Cow and Fields<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Bessie is out grazing on the farm, which consists of $$$n$$$ fields connected by $$$m$$$ bidirectional roads. She is currently at field $$$1$$$, and will return to her home at field $$$n$$$ at the end of the day.<\/p><p>The Cowfederation of Barns has ordered Farmer John to install one extra bidirectional road. The farm has $$$k$$$ special fields and he has decided to install the road between two different special fields. He may add the road between two special fields that already had a road directly connecting them.<\/p><p>After the road is added, Bessie will return home on the shortest path from field $$$1$$$ to field $$$n$$$. Since Bessie needs more exercise, Farmer John must <span class=\"tex-font-style-bf\">maximize<\/span> the length of this shortest path. Help him!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integers $$$n$$$, $$$m$$$, and $$$k$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$, $$$n-1 \\le m \\le 2 \\cdot 10^5$$$, $$$2 \\le k \\le n$$$) \u00a0\u2014 the number of fields on the farm, the number of roads, and the number of special fields. <\/p><p>The second line contains $$$k$$$ integers $$$a_1, a_2, \\ldots, a_k$$$ ($$$1 \\le a_i \\le n$$$) \u00a0\u2014 the special fields. All $$$a_i$$$ are distinct.<\/p><p>The $$$i$$$-th of the following $$$m$$$ lines contains integers $$$x_i$$$ and $$$y_i$$$ ($$$1 \\le x_i, y_i \\le n$$$, $$$x_i \\ne y_i$$$), representing a bidirectional road between fields $$$x_i$$$ and $$$y_i$$$. <\/p><p>It is guaranteed that one can reach any field from every other field. It is also guaranteed that for any pair of fields there is at most one road connecting them.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output one integer, the <span class=\"tex-font-style-bf\">maximum<\/span> possible length of the shortest path from field $$$1$$$ to $$$n$$$ after Farmer John installs one road optimally.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 5 3\n1 3 5\n1 2\n2 3\n3 4\n3 5\n2 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 4 2\n2 4\n1 2\n2 3\n3 4\n4 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The graph for the first example is shown below. The special fields are denoted by red. It is optimal for Farmer John to add a road between fields $$$3$$$ and $$$5$$$, and the resulting shortest path from $$$1$$$ to $$$5$$$ is length $$$3$$$. <\/p><center> <img class=\"tex-graphics\" height=\"227px\" src=\"https://espresso.codeforces.com/7029f3c3a3910129aa505fc6159d65518e060ad5.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"378px\"/> <\/center><p>The graph for the second example is shown below. Farmer John must add a road between fields $$$2$$$ and $$$4$$$, and the resulting shortest path from $$$1$$$ to $$$5$$$ is length $$$3$$$. <\/p><center> <img class=\"tex-graphics\" height=\"265px\" src=\"https://espresso.codeforces.com/06328a74321e072469311d954753a0f70bde06ca.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"454px\"/> <\/center><\/div><\/div>"}, {"contestId": 505, "index": "C", "name": "Mr. Kitayuta, the Treasure Hunter", "rating": 1900, "solvedCount": 7560, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Mr. Kitayuta, the Treasure Hunter<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div class=\"legend\"><p>The Shuseki Islands are an archipelago of <span class=\"tex-span\">30001<\/span> small islands in the Yutampo Sea. The islands are evenly spaced along a line, numbered from <span class=\"tex-span\">0<\/span> to <span class=\"tex-span\">30000<\/span> from the west to the east. These islands are known to contain many treasures. There are <span class=\"tex-span\"><i>n<\/i><\/span> gems in the Shuseki Islands in total, and the <span class=\"tex-span\"><i>i<\/i><\/span>-th gem is located on island <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>.<\/p><p>Mr. Kitayuta has just arrived at island <span class=\"tex-span\">0<\/span>. With his great jumping ability, he will repeatedly perform jumps between islands to the east according to the following process: <\/p><ul> <li> First, he will jump from island <span class=\"tex-span\">0<\/span> to island <span class=\"tex-span\"><i>d<\/i><\/span>. <\/li><li> After that, he will continue jumping according to the following rule. Let <span class=\"tex-span\"><i>l<\/i><\/span> be the length of the previous jump, that is, if his previous jump was from island <span class=\"tex-span\"><i>prev<\/i><\/span> to island <span class=\"tex-span\"><i>cur<\/i><\/span>, let <span class=\"tex-span\"><i>l<\/i>\u2009=\u2009<i>cur<\/i>\u2009-\u2009<i>prev<\/i><\/span>. He will perform a jump of length <span class=\"tex-span\"><i>l<\/i>\u2009-\u20091<\/span>, <span class=\"tex-span\"><i>l<\/i><\/span> or <span class=\"tex-span\"><i>l<\/i>\u2009+\u20091<\/span> to the east. That is, he will jump to island <span class=\"tex-span\">(<i>cur<\/i>\u2009+\u2009<i>l<\/i>\u2009-\u20091)<\/span>, <span class=\"tex-span\">(<i>cur<\/i>\u2009+\u2009<i>l<\/i>)<\/span> or <span class=\"tex-span\">(<i>cur<\/i>\u2009+\u2009<i>l<\/i>\u2009+\u20091)<\/span> (if they exist). The length of a jump must be positive, that is, he cannot perform a jump of length <span class=\"tex-span\">0<\/span> when <span class=\"tex-span\"><i>l<\/i>\u2009=\u20091<\/span>. If there is no valid destination, he will stop jumping. <\/li><\/ul><p><\/p><p>Mr. Kitayuta will collect the gems on the islands visited during the process. Find the maximum number of gems that he can collect.<\/p><\/div><p><\/p><p><\/p><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p><\/p><p>The first line of the input contains two space-separated integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>d<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>d<\/i>\u2009\u2264\u200930000<\/span>), denoting the number of the gems in the Shuseki Islands and the length of the Mr. Kitayuta's first jump, respectively.<\/p><p>The next <span class=\"tex-span\"><i>n<\/i><\/span> lines describe the location of the gems. The <span class=\"tex-span\"><i>i<\/i><\/span>-th of them (<span class=\"tex-span\">1\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>) contains a integer <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\"><i>d<\/i>\u2009\u2264\u2009<i>p<\/i><sub class=\"lower-index\">1<\/sub>\u2009\u2264\u2009<i>p<\/i><sub class=\"lower-index\">2<\/sub>\u2009\u2264\u2009...\u2009\u2264\u2009<i>p<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub>\u2009\u2264\u200930000<\/span>), denoting the number of the island that contains the <span class=\"tex-span\"><i>i<\/i><\/span>-th gem.<\/p><\/div><p><\/p><p><\/p><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p><\/p><p>Print the maximum number of gems that Mr. Kitayuta can collect.<\/p><\/div><p><\/p><p><\/p><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><p><\/p><p><\/p><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre class=\"content\">4 10<br/>10<br/>21<br/>27<br/>27<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre class=\"content\">3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre class=\"content\">8 8<br/>9<br/>19<br/>28<br/>36<br/>45<br/>55<br/>66<br/>78<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre class=\"content\">6<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre class=\"content\">13 7<br/>8<br/>8<br/>9<br/>16<br/>17<br/>17<br/>18<br/>21<br/>23<br/>24<br/>24<br/>26<br/>30<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre class=\"content\">4<br/><\/pre><\/div><\/div><\/div><p><\/p><p><\/p><div class=\"note\"><div class=\"section-title\">Note<\/div><p><\/p><p>In the first sample, the optimal route is 0 <span class=\"tex-span\">\u2009\u2192\u2009<\/span> 10 (+1 gem) <span class=\"tex-span\">\u2009\u2192\u2009<\/span> 19 <span class=\"tex-span\">\u2009\u2192\u2009<\/span> 27 (+2 gems) <span class=\"tex-span\">\u2009\u2192\u2009...\u0001<\/span><\/p><p>In the second sample, the optimal route is 0 <span class=\"tex-span\">\u2009\u2192\u2009<\/span> 8 <span class=\"tex-span\">\u2009\u2192\u2009<\/span> 15 <span class=\"tex-span\">\u2009\u2192\u2009<\/span> 21<span class=\"tex-span\">\u2009\u2192\u2009<\/span> 28 (+1 gem) <span class=\"tex-span\">\u2009\u2192\u2009<\/span> 36 (+1 gem) <span class=\"tex-span\">\u2009\u2192\u2009<\/span> 45 (+1 gem) <span class=\"tex-span\">\u2009\u2192\u2009<\/span> 55 (+1 gem) <span class=\"tex-span\">\u2009\u2192\u2009<\/span> 66 (+1 gem) <span class=\"tex-span\">\u2009\u2192\u2009<\/span> 78 (+1 gem) <span class=\"tex-span\">\u2009\u2192\u2009...<\/span><\/p><p>In the third sample, the optimal route is 0 <span class=\"tex-span\">\u2009\u2192\u2009<\/span> 7 <span class=\"tex-span\">\u2009\u2192\u2009<\/span> 13 <span class=\"tex-span\">\u2009\u2192\u2009<\/span> 18 (+1 gem) <span class=\"tex-span\">\u2009\u2192\u2009<\/span> 24 (+2 gems) <span class=\"tex-span\">\u2009\u2192\u2009<\/span> 30 (+1 gem) <span class=\"tex-span\">\u2009\u2192\u2009...<\/span><\/p><\/div><\/div>"}, {"contestId": 1479, "index": "B1", "name": "Painting the Array I", "rating": 1900, "solvedCount": 7556, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B1. Painting the Array I<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">The only difference between the two versions is that this version asks the <span class=\"tex-font-style-it\">maximal<\/span> possible answer.<\/span><\/p><p>Homer likes arrays a lot. Today he is painting an array $$$a_1, a_2, \\dots, a_n$$$ with two kinds of colors, <span class=\"tex-font-style-bf\">white<\/span> and <span class=\"tex-font-style-bf\">black<\/span>. A painting assignment for $$$a_1, a_2, \\dots, a_n$$$ is described by an array $$$b_1, b_2, \\dots, b_n$$$ that $$$b_i$$$ indicates the color of $$$a_i$$$ ($$$0$$$ for white and $$$1$$$ for black).<\/p><p>According to a painting assignment $$$b_1, b_2, \\dots, b_n$$$, the array $$$a$$$ is split into two new arrays $$$a^{(0)}$$$ and $$$a^{(1)}$$$, where $$$a^{(0)}$$$ is the sub-sequence of all white elements in $$$a$$$ and $$$a^{(1)}$$$ is the sub-sequence of all black elements in $$$a$$$. For example, if $$$a = [1,2,3,4,5,6]$$$ and $$$b = [0,1,0,1,0,0]$$$, then $$$a^{(0)} = [1,3,5,6]$$$ and $$$a^{(1)} = [2,4]$$$.<\/p><p>The number of segments in an array $$$c_1, c_2, \\dots, c_k$$$, denoted $$$\\mathit{seg}(c)$$$, is the number of elements if we merge all adjacent elements with the same value in $$$c$$$. For example, the number of segments in $$$[1,1,2,2,3,3,3,2]$$$ is $$$4$$$, because the array will become $$$[1,2,3,2]$$$ after merging adjacent elements with the same value. Especially, the number of segments in an empty array is $$$0$$$.<\/p><p>Homer wants to find a painting assignment $$$b$$$, according to which the number of segments in both $$$a^{(0)}$$$ and $$$a^{(1)}$$$, i.e. $$$\\mathit{seg}(a^{(0)})+\\mathit{seg}(a^{(1)})$$$, is as <span class=\"tex-font-style-bf\">large<\/span> as possible. Find this number.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$n$$$ ($$$1 \\leq n \\leq 10^5$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\leq a_i \\leq n$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output a single integer, indicating the <span class=\"tex-font-style-bf\">maximal<\/span> possible total number of segments.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7\n1 1 2 2 3 3 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7\n1 2 3 4 5 6 7\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n7\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, we can choose $$$a^{(0)} = [1,2,3,3]$$$, $$$a^{(1)} = [1,2,3]$$$ and $$$\\mathit{seg}(a^{(0)}) = \\mathit{seg}(a^{(1)}) = 3$$$. So the answer is $$$3+3 = 6$$$.<\/p><p>In the second example, we can choose $$$a^{(0)} = [1,2,3,4,5,6,7]$$$ and $$$a^{(1)}$$$ is empty. We can see that $$$\\mathit{seg}(a^{(0)}) = 7$$$ and $$$\\mathit{seg}(a^{(1)}) = 0$$$. So the answer is $$$7+0 = 7$$$.<\/p><\/div><\/div>"}, {"contestId": 463, "index": "D", "name": "Gargari and Permutations", "rating": 1900, "solvedCount": 7513, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Gargari and Permutations<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Gargari got bored to play with the bishops and now, after solving the problem about them, he is trying to do math homework. In a math book he have found <span class=\"tex-span\"><i>k<\/i><\/span> permutations. Each of them consists of numbers <span class=\"tex-span\">1,\u20092,\u2009...,\u2009<i>n<\/i><\/span> in some order. Now he should find the length of the longest common subsequence of these permutations. Can you help Gargari?<\/p><p>You can read about longest common subsequence there: <span class=\"tex-font-style-tt\">https://en.wikipedia.org/wiki/Longest_common_subsequence_problem<\/span><\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20091000;\u00a02\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u20095)<\/span>. Each of the next <span class=\"tex-span\"><i>k<\/i><\/span> lines contains integers <span class=\"tex-span\">1,\u20092,\u2009...,\u2009<i>n<\/i><\/span> in some order \u2014 description of the current permutation.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the length of the longest common subsequence.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 3<br/>1 4 2 3<br/>4 1 2 3<br/>1 2 4 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The answer for the first test sample is subsequence [1, 2, 3].<\/p><\/div><\/div>"}, {"contestId": 1430, "index": "E", "name": "String Reversal", "rating": 1900, "solvedCount": 7475, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. String Reversal<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a string $$$s$$$. You have to reverse it \u2014 that is, the first letter should become equal to the last letter before the reversal, the second letter should become equal to the second-to-last letter before the reversal \u2014 and so on. For example, if your goal is to reverse the string \"<span class=\"tex-font-style-tt\">abddea<\/span>\", you should get the string \"<span class=\"tex-font-style-tt\">aeddba<\/span>\". To accomplish your goal, you can swap the <span class=\"tex-font-style-bf\">neighboring elements of the string<\/span>. <\/p><p>Your task is to calculate the minimum number of swaps you have to perform to reverse the given string.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$2 \\le n \\le 200\\,000$$$) \u2014 the length of $$$s$$$.<\/p><p>The second line contains $$$s$$$ \u2014 a string consisting of $$$n$$$ lowercase Latin letters.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the minimum number of swaps of neighboring elements you have to perform to reverse the string.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\naaaza\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\ncbaabc\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n9\nicpcsguru\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n30\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, you have to swap the third and the fourth elements, so the string becomes \"<span class=\"tex-font-style-tt\">aazaa<\/span>\". Then you have to swap the second and the third elements, so the string becomes \"<span class=\"tex-font-style-tt\">azaaa<\/span>\". So, it is possible to reverse the string in two swaps.<\/p><p>Since the string in the second example is a palindrome, you don't have to do anything to reverse it.<\/p><\/div><\/div>"}, {"contestId": 1882, "index": "D", "name": "Tree XOR", "rating": 1900, "solvedCount": 7422, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Tree XOR<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a tree with $$$n$$$ vertices labeled from $$$1$$$ to $$$n$$$. An integer $$$a_{i}$$$ is written on vertex $$$i$$$ for $$$i = 1, 2, \\ldots, n$$$. You want to make all $$$a_{i}$$$ equal by performing some (possibly, zero) spells.<\/p><p>Suppose you root the tree at some vertex. On each spell, you can select any vertex $$$v$$$ and any non-negative integer $$$c$$$. Then for all vertices $$$i$$$ in the subtree$$$^{\\dagger}$$$ of $$$v$$$, replace $$$a_{i}$$$ with $$$a_{i} \\oplus c$$$. The cost of this spell is $$$s \\cdot c$$$, where $$$s$$$ is the number of vertices in the subtree. Here $$$\\oplus$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#XOR\">bitwise XOR operation<\/a>.<\/p><p>Let $$$m_r$$$ be the minimum possible total cost required to make all $$$a_i$$$ equal, if vertex $$$r$$$ is chosen as the root of the tree. Find $$$m_{1}, m_{2}, \\ldots, m_{n}$$$.<\/p><p>$$$^{\\dagger}$$$ Suppose vertex $$$r$$$ is chosen as the root of the tree. Then vertex $$$i$$$ belongs to the subtree of $$$v$$$ if the simple path from $$$i$$$ to $$$r$$$ contains $$$v$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^{4}$$$). The description of the test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^{5}$$$).<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$0 \\le a_i  \\lt  2^{20}$$$).<\/p><p>Each of the next $$$n-1$$$ lines contains two integers $$$u$$$ and $$$v$$$ ($$$1 \\le u, v \\le n$$$), denoting that there is an edge connecting two vertices $$$u$$$ and $$$v$$$.<\/p><p>It is guaranteed that the given edges form a tree.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^{5}$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print $$$m_1, m_2, \\ldots, m_n$$$ on a new line.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 2 1 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">100<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n8 6 12 10 \n0 \n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, to find $$$m_1$$$ we root the tree at vertex $$$1$$$. <\/p><ol> <li> In the first spell, choose $$$v=2$$$ and $$$c=1$$$. After performing the spell, $$$a$$$ will become $$$[3, 3, 0, 1]$$$. The cost of this spell is $$$3$$$. <\/li><li> In the second spell, choose $$$v=3$$$ and $$$c=3$$$. After performing the spell, $$$a$$$ will become $$$[3, 3, 3, 1]$$$. The cost of this spell is $$$3$$$. <\/li><li> In the third spell, choose $$$v=4$$$ and $$$c=2$$$. After performing the spell, $$$a$$$ will become $$$[3, 3, 3, 3]$$$. The cost of this spell is $$$2$$$. <\/li><\/ol><p>Now all the values in array $$$a$$$ are equal, and the total cost is $$$3 + 3 + 2 = 8$$$.<\/p><p>The values $$$m_2$$$, $$$m_3$$$, $$$m_4$$$ can be found analogously.<\/p><p>In the second test case, the goal is already achieved because there is only one vertex.<\/p><\/div><\/div>"}, {"contestId": 1547, "index": "F", "name": "Array Stabilization (GCD version)", "rating": 1900, "solvedCount": 7336, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Array Stabilization (GCD version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array of positive integers $$$a = [a_0, a_1, \\dots, a_{n - 1}]$$$ ($$$n \\ge 2$$$).<\/p><p>In one step, the array $$$a$$$ is replaced with another array of length $$$n$$$, in which each element is the <a href=\"https://en.wikipedia.org/wiki/Greatest_common_divisor\">greatest common divisor (GCD)<\/a> of two neighboring elements (the element itself and its right neighbor; consider that the right neighbor of the $$$(n - 1)$$$-th element is the $$$0$$$-th element).<\/p><p>Formally speaking, a new array $$$b = [b_0, b_1, \\dots, b_{n - 1}]$$$ is being built from array $$$a = [a_0, a_1, \\dots, a_{n - 1}]$$$ such that $$$b_i$$$ $$$= \\gcd(a_i, a_{(i + 1) \\mod n})$$$, where $$$\\gcd(x, y)$$$ is the greatest common divisor of $$$x$$$ and $$$y$$$, and $$$x \\mod y$$$ is the remainder of $$$x$$$ dividing by $$$y$$$. In one step the array $$$b$$$ is built and then the array $$$a$$$ is replaced with $$$b$$$ (that is, the assignment $$$a$$$ <span class=\"tex-font-style-tt\">:=<\/span> $$$b$$$ is taking place).<\/p><p>For example, if $$$a = [16, 24, 10, 5]$$$ then $$$b = [\\gcd(16, 24)$$$, $$$\\gcd(24, 10)$$$, $$$\\gcd(10, 5)$$$, $$$\\gcd(5, 16)]$$$ $$$= [8, 2, 5, 1]$$$. Thus, after one step the array $$$a = [16, 24, 10, 5]$$$ will be equal to $$$[8, 2, 5, 1]$$$.<\/p><p>For a given array $$$a$$$, find the minimum number of steps after which all values $$$a_i$$$ become equal (that is, $$$a_0 = a_1 = \\dots = a_{n - 1}$$$). If the original array $$$a$$$ consists of identical elements then consider the number of steps is equal to $$$0$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$). Then $$$t$$$ test cases follow.<\/p><p>Each test case contains two lines. The first line contains an integer $$$n$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$) \u2014 length of the sequence $$$a$$$. The second line contains $$$n$$$ integers $$$a_0, a_1, \\dots, a_{n - 1}$$$ ($$$1 \\le a_i \\le 10^6$$$).<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases doesn't exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$t$$$ numbers \u2014 answers for each test case.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">16 24 10 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">42 42 42 42<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 6 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 2 3 4 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">9 9 27 9 9 63<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n0\n2\n1\n1\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 2000, "index": "F", "name": "Color Rows and Columns", "rating": 1900, "solvedCount": 7293, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Color Rows and Columns<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You have $$$n$$$ rectangles, the $$$i$$$-th of which has a width of $$$a_i$$$ and a height of $$$b_i$$$.<\/p><p>You can perform the following operation an unlimited number of times: choose a rectangle and a cell in it, and then color it.<\/p><p>Each time you completely color any row or column, you earn $$$1$$$ point. Your task is to score at least $$$k$$$ points with as few operations as possible.<\/p><p>Suppose you have a rectangle with a width of $$$6$$$ and a height of $$$3$$$. You can score $$$4$$$ points by coloring all the cells in any $$$4$$$ columns, thus performing $$$12$$$ operations.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$t$$$ ($$$1 \\le t \\le 100$$$) \u2014 the number of test cases. The following are the descriptions of the test cases.<\/p><p>The first line of each test case description contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le n \\le 1000, 1 \\le k \\le 100$$$) \u2014 the number of rectangles in the case and the required number of points.<\/p><p>The next $$$n$$$ lines contain the descriptions of the rectangles. The $$$i$$$-th line contains two integers $$$a_i$$$ and $$$b_i$$$ ($$$1 \\le a_i, b_i \\le 100$$$) \u2014 the width and height of the $$$i$$$-th rectangle.<\/p><p>It is guaranteed that the sum of the values of $$$n$$$ across all test cases does not exceed $$$1000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer \u2014 the minimum number of operations required to score at least $$$k$$$ points. If it is impossible to score at least $$$k$$$ points, output <span class=\"tex-font-style-tt\">-1<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">6 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 100<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3 11<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">3 25<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">9 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">4 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">8 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">4 18<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">5 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">8 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">8 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">6 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n12\n14\n5\n-1\n17\n80\n35\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1989, "index": "D", "name": "Smithing Skill", "rating": 1900, "solvedCount": 7293, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Smithing Skill<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are playing a famous computer game (that just works) where you have various skills you can level up. Today, you focused on the \"Smithing\" skill. Your tactic is obvious: forging weapons from ingots and then melting them back to return the materials partially. For simplicity, every time you create an item, you get $$$1$$$ experience point, and every time you melt an item, you also get $$$1$$$ experience point.<\/p><p>There are $$$n$$$ classes of weapons you can forge and $$$m$$$ types of metal ingots.<\/p><p>You can create one weapon of the $$$i$$$-th class, spending $$$a_i$$$ ingots of metal of <span class=\"tex-font-style-it\">the same type<\/span>. Melting a weapon of the $$$i$$$-th class (which you crafted earlier) returns you $$$b_i$$$ ingots of the type of metal <span class=\"tex-font-style-it\">it was made of<\/span>.<\/p><p>You have $$$c_j$$$ metal ingots of the $$$j$$$-th type, and you know that you can craft a weapon of any class from any metal type. Each combinati

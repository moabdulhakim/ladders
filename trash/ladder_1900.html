<script>
    const PROBLEMS = [{"contestId": 20, "index": "C", "name": "Dijkstra?", "rating": 1900, "solvedCount": 50583, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Dijkstra?<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>64 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>You are given a weighted undirected graph. The vertices are enumerated from 1 to <span class=\"tex-span\"><i>n<\/i><\/span>. Your task is to find the shortest path between the vertex <span class=\"tex-span\">1<\/span> and the vertex <span class=\"tex-span\"><i>n<\/i><\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>,\u20090\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>), where <span class=\"tex-span\"><i>n<\/i><\/span> is the number of vertices and <span class=\"tex-span\"><i>m<\/i><\/span> is the number of edges. Following <span class=\"tex-span\"><i>m<\/i><\/span> lines contain one edge each in form <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>,\u20091\u2009\u2264\u2009<i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup><\/span>), where <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> are edge endpoints and <span class=\"tex-span\"><i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is the length of the edge.<\/p><p>It is possible that the graph has loops and multiple edges between pair of vertices.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Write the only integer <span class=\"tex-font-style-tt\">-1<\/span> in case of no path. Write the shortest path in opposite case. If there are many solutions, print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 6<br/>1 2 2<br/>2 5 5<br/>2 3 4<br/>1 4 1<br/>4 3 3<br/>3 5 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1 4 3 5 <\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 6<br/>1 2 2<br/>2 5 5<br/>2 3 4<br/>1 4 1<br/>4 3 3<br/>3 5 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1 4 3 5 <\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 5, "index": "C", "name": "Longest Regular Bracket Sequence", "rating": 1900, "solvedCount": 19216, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Longest Regular Bracket Sequence<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>This is yet another problem dealing with regular bracket sequences.<\/p><p>We should remind you that a bracket sequence is called regular, if by inserting \u00ab<span class=\"tex-font-style-tt\">+<\/span>\u00bb and \u00ab<span class=\"tex-font-style-tt\">1<\/span>\u00bb into it we can get a correct mathematical expression. For example, sequences \u00ab<span class=\"tex-font-style-tt\">(())()<\/span>\u00bb, \u00ab<span class=\"tex-font-style-tt\">()<\/span>\u00bb and \u00ab<span class=\"tex-font-style-tt\">(()(()))<\/span>\u00bb are regular, while \u00ab<span class=\"tex-font-style-tt\">)(<\/span>\u00bb, \u00ab<span class=\"tex-font-style-tt\">(()<\/span>\u00bb and \u00ab<span class=\"tex-font-style-tt\">(()))(<\/span>\u00bb are not. <\/p><p>You are given a string of \u00ab<span class=\"tex-font-style-tt\">(<\/span>\u00bb and \u00ab<span class=\"tex-font-style-tt\">)<\/span>\u00bb characters. You are to find its longest substring that is a regular bracket sequence. You are to find the number of such substrings as well.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input file contains a non-empty string, consisting of \u00ab<span class=\"tex-font-style-tt\">(<\/span>\u00bb and \u00ab<span class=\"tex-font-style-tt\">)<\/span>\u00bb characters. Its length does not exceed <span class=\"tex-span\">10<sup class=\"upper-index\">6<\/sup><\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the length of the longest substring that is a regular bracket sequence, and the number of such substrings. If there are no such substrings, write the only line containing \"<span class=\"tex-font-style-tt\">0 1<\/span>\".<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>)((())))(()())<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6 2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>))(<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0 1<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 607, "index": "B", "name": "Zuma", "rating": 1900, "solvedCount": 17552, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Zuma<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Genos recently installed the game Zuma on his phone. In Zuma there exists a line of <span class=\"tex-span\"><i>n<\/i><\/span> gemstones, the <span class=\"tex-span\"><i>i<\/i><\/span>-th of which has color <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. The goal of the game is to destroy all the gemstones in the line as quickly as possible.<\/p><p>In one second, Genos is able to choose exactly one continuous substring of colored gemstones that is a palindrome and remove it from the line. After the substring is removed, the remaining gemstones shift to form a solid line again. What is the minimum number of seconds needed to destroy the entire line?<\/p><p>Let us remind, that the string (or substring) is called <span class=\"tex-font-style-it\">palindrome<\/span>, if it reads same backwards or forward. In our case this means the color of the first gemstone is equal to the color of the last one, the color of the second gemstone is equal to the color of the next to last and so on.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains a single integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009500<\/span>)\u00a0\u2014 the number of gemstones.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> space-separated integers, the <span class=\"tex-span\"><i>i<\/i><\/span>-th of which is <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>)\u00a0\u2014 the color of the <span class=\"tex-span\"><i>i<\/i><\/span>-th gemstone in a line.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer\u00a0\u2014 the minimum number of seconds needed to destroy the entire line.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>1 2 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>1 2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>7<br/>1 4 4 2 3 2 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample, Genos can destroy the entire line in one second.<\/p><p>In the second sample, Genos can only destroy one gemstone at a time, so destroying three gemstones takes three seconds.<\/p><p>In the third sample, to achieve the optimal time of two seconds, destroy palindrome <span class=\"tex-font-style-tt\">4 4<\/span> first and then destroy palindrome <span class=\"tex-font-style-tt\">1 2 3 2 1<\/span>.<\/p><\/div><\/div>"}, {"contestId": 25, "index": "D", "name": "Roads not only in Berland", "rating": 1900, "solvedCount": 16822, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Roads not only in Berland<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Berland Government decided to improve relations with neighboring countries. First of all, it was decided to build new roads so that from each city of Berland and neighboring countries it became possible to reach all the others. There are <span class=\"tex-span\"><i>n<\/i><\/span> cities in Berland and neighboring countries in total and exactly <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> two-way roads. Because of the recent financial crisis, the Berland Government is strongly pressed for money, so to build a new road it has to close some of the existing ones. Every day it is possible to close one existing road and immediately build a new one. Your task is to determine how many days would be needed to rebuild roads so that from each city it became possible to reach all the others, and to draw a plan of closure of old roads and building of new ones.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20091000<\/span>) \u2014 amount of cities in Berland and neighboring countries. Next <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> lines contain the description of roads. Each road is described by two space-separated integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>,\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2260\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>) \u2014 pair of cities, which the road connects. It can't be more than one road between a pair of cities. No road connects the city with itself.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output the answer, number <span class=\"tex-span\"><i>t<\/i><\/span> \u2014 what is the least amount of days needed to rebuild roads so that from each city it became possible to reach all the others. Then output <span class=\"tex-span\"><i>t<\/i><\/span> lines \u2014 the plan of closure of old roads and building of new ones. Each line should describe one day in the format <span class=\"tex-font-style-tt\">i j u v<\/span> \u2014 it means that road between cities <span class=\"tex-font-style-tt\">i<\/span> and <span class=\"tex-font-style-tt\">j<\/span> became closed and a new road between cities <span class=\"tex-font-style-tt\">u<\/span> and <span class=\"tex-font-style-tt\">v<\/span> is built. Cities are numbered from 1. If the answer is not unique, output any.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/>1 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>7<br/>1 2<br/>2 3<br/>3 1<br/>4 5<br/>5 6<br/>6 7<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/>3 1 3 7<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 61, "index": "E", "name": "Enemy is weak", "rating": 1900, "solvedCount": 16513, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Enemy is weak<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>The Romans have attacked again. This time they are much more than the Persians but Shapur is ready to defeat them. He says: \"A lion is never afraid of a hundred sheep\". <\/p><p>Nevertheless Shapur has to find weaknesses in the Roman army to defeat them. So he gives the army a weakness number.<\/p><p>In Shapur's opinion the weakness of an army is equal to the number of triplets <span class=\"tex-span\"><i>i<\/i>,\u2009<i>j<\/i>,\u2009<i>k<\/i><\/span> such that <span class=\"tex-span\"><i>i<\/i>\u2009&lt;\u2009<i>j<\/i>\u2009&lt;\u2009<i>k<\/i><\/span> and <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009&gt;\u2009<i>a<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>\u2009&gt;\u2009<i>a<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span> where <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>x<\/i><\/sub><\/span> is the power of man standing at position <span class=\"tex-span\"><i>x<\/i><\/span>. The Roman army has one special trait \u2014 powers of all the people in it are distinct.<\/p><p>Help Shapur find out how weak the Romans are.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains a single number <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">3\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup><\/span>) \u2014 the number of men in Roman army. Next line contains <span class=\"tex-span\"><i>n<\/i><\/span> different positive integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>n<\/i>,\u20091\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) \u2014 powers of men in the Roman army. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>A single integer number, the weakness of the Roman army. <\/p><p>Please, do not use <span class=\"tex-font-style-tt\">%lld<\/span> specificator to read or write 64-bit integers in C++. It is preffered to use <span class=\"tex-font-style-tt\">cout<\/span> (also you may use <span class=\"tex-font-style-tt\">%I64d<\/span>).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>3 2 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>2 3 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>10 8 3 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>1 5 4 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 577, "index": "B", "name": "Modulo Sum", "rating": 1900, "solvedCount": 15945, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Modulo Sum<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a sequence of numbers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span>, and a number <span class=\"tex-span\"><i>m<\/i><\/span>.<\/p><p>Check if it is possible to choose a non-empty subsequence <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/sub><\/span> such that the sum of numbers in this subsequence is divisible by <span class=\"tex-span\"><i>m<\/i><\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two numbers, <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup><\/span>, <span class=\"tex-span\">2\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">3<\/sup><\/span>) \u2014 the size of the original sequence and the number such that sum should be divisible by it.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In the single line print either \"<span class=\"tex-font-style-tt\">YES<\/span>\" (without the quotes) if there exists the sought subsequence, or \"<span class=\"tex-font-style-tt\">NO<\/span>\" (without the quotes), if such subsequence doesn't exist.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 5<br/>1 2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>1 6<br/>5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>NO<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 6<br/>3 1 1 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>6 6<br/>5 5 5 5 5 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample test you can choose numbers <span class=\"tex-span\">2<\/span> and <span class=\"tex-span\">3<\/span>, the sum of which is divisible by <span class=\"tex-span\">5<\/span>.<\/p><p>In the second sample test the single non-empty subsequence of numbers is a single number <span class=\"tex-span\">5<\/span>. Number <span class=\"tex-span\">5<\/span> is not divisible by <span class=\"tex-span\">6<\/span>, that is, the sought subsequence doesn't exist.<\/p><p>In the third sample test you need to choose two numbers <span class=\"tex-span\">3<\/span> on the ends.<\/p><p>In the fourth sample test you can take the whole subsequence.<\/p><\/div><\/div>"}, {"contestId": 1036, "index": "C", "name": "Classy Numbers", "rating": 1900, "solvedCount": 14645, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Classy Numbers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Let's call some positive integer <span class=\"tex-font-style-it\">classy<\/span> if its decimal representation contains no more than $$$3$$$ non-zero digits. For example, numbers $$$4$$$, $$$200000$$$, $$$10203$$$ are <span class=\"tex-font-style-it\">classy<\/span> and numbers $$$4231$$$, $$$102306$$$, $$$7277420000$$$ are not.<\/p><p>You are given a segment $$$[L; R]$$$. Count the number of <span class=\"tex-font-style-it\">classy<\/span> integers $$$x$$$ such that $$$L \\le x \\le R$$$.<\/p><p>Each testcase contains several segments, for each of them you are required to solve the problem separately.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$T$$$ ($$$1 \\le T \\le 10^4$$$) \u2014 the number of segments in a testcase.<\/p><p>Each of the next $$$T$$$ lines contains two integers $$$L_i$$$ and $$$R_i$$$ ($$$1 \\le L_i \\le R_i \\le 10^{18}$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$T$$$ lines \u2014 the $$$i$$$-th line should contain the number of <span class=\"tex-font-style-it\">classy<\/span> integers on a segment $$$[L_i; R_i]$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>1 1000<br/>1024 1024<br/>65536 65536<br/>999999 1000001<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1000<br/>1<br/>0<br/>2<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1328, "index": "E", "name": "Tree Queries", "rating": 1900, "solvedCount": 12725, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Tree Queries<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a rooted tree consisting of $$$n$$$ vertices numbered from $$$1$$$ to $$$n$$$. The root of the tree is a vertex number $$$1$$$.<\/p><p>A tree is a connected undirected graph with $$$n-1$$$ edges.<\/p><p>You are given $$$m$$$ queries. The $$$i$$$-th query consists of the set of $$$k_i$$$ distinct vertices $$$v_i[1], v_i[2], \\dots, v_i[k_i]$$$. Your task is to say if there is a path from the root to some vertex $$$u$$$ such that each of the given $$$k$$$ vertices is either belongs to this path or has the distance $$$1$$$ to some vertex of this path.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains two integers $$$n$$$ and $$$m$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$, $$$1 \\le m \\le 2 \\cdot 10^5$$$) \u2014 the number of vertices in the tree and the number of queries.<\/p><p>Each of the next $$$n-1$$$ lines describes an edge of the tree. Edge $$$i$$$ is denoted by two integers $$$u_i$$$ and $$$v_i$$$, the labels of vertices it connects $$$(1 \\le u_i, v_i \\le n, u_i \\ne v_i$$$).<\/p><p>It is guaranteed that the given edges form a tree.<\/p><p>The next $$$m$$$ lines describe queries. The $$$i$$$-th line describes the $$$i$$$-th query and starts with the integer $$$k_i$$$ ($$$1 \\le k_i \\le n$$$) \u2014 the number of vertices in the current query. Then $$$k_i$$$ integers follow: $$$v_i[1], v_i[2], \\dots, v_i[k_i]$$$ ($$$1 \\le v_i[j] \\le n$$$), where $$$v_i[j]$$$ is the $$$j$$$-th vertex of the $$$i$$$-th query.<\/p><p>It is guaranteed that all vertices in a single query are distinct.<\/p><p>It is guaranteed that the sum of $$$k_i$$$ does not exceed $$$2 \\cdot 10^5$$$ ($$$\\sum\\limits_{i=1}^{m} k_i \\le 2 \\cdot 10^5$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query, print the answer \u2014 \"<span class=\"tex-font-style-tt\">YES<\/span>\", if there is a path from the root to some vertex $$$u$$$ such that each of the given $$$k$$$ vertices is either belongs to this path or has the distance $$$1$$$ to some vertex of this path and \"<span class=\"tex-font-style-tt\">NO<\/span>\" otherwise.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n10 6\n1 2\n1 3\n1 4\n2 5\n2 6\n3 7\n7 8\n7 9\n9 10\n4 3 8 9 10\n3 2 4 6\n3 2 1 5\n3 4 8 2\n2 6 10\n3 5 4 7\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nYES\nYES\nYES\nNO\nNO\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The picture corresponding to the example:<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/b10b83767d16008805c80d59049c9b185a6595cc.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>Consider the queries.<\/p><p>The first query is $$$[3, 8, 9, 10]$$$. The answer is \"<span class=\"tex-font-style-tt\">YES<\/span>\" as you can choose the path from the root $$$1$$$ to the vertex $$$u=10$$$. Then vertices $$$[3, 9, 10]$$$ belong to the path from $$$1$$$ to $$$10$$$ and the vertex $$$8$$$ has distance $$$1$$$ to the vertex $$$7$$$ which also belongs to this path.<\/p><p>The second query is $$$[2, 4, 6]$$$. The answer is \"<span class=\"tex-font-style-tt\">YES<\/span>\" as you can choose the path to the vertex $$$u=2$$$. Then the vertex $$$4$$$ has distance $$$1$$$ to the vertex $$$1$$$ which belongs to this path and the vertex $$$6$$$ has distance $$$1$$$ to the vertex $$$2$$$ which belongs to this path.<\/p><p>The third query is $$$[2, 1, 5]$$$. The answer is \"<span class=\"tex-font-style-tt\">YES<\/span>\" as you can choose the path to the vertex $$$u=5$$$ and all vertices of the query belong to this path.<\/p><p>The fourth query is $$$[4, 8, 2]$$$. The answer is \"<span class=\"tex-font-style-tt\">YES<\/span>\" as you can choose the path to the vertex $$$u=9$$$ so vertices $$$2$$$ and $$$4$$$ both have distance $$$1$$$ to the vertex $$$1$$$ which belongs to this path and the vertex $$$8$$$ has distance $$$1$$$ to the vertex $$$7$$$ which belongs to this path.<\/p><p>The fifth and the sixth queries both have answer \"<span class=\"tex-font-style-tt\">NO<\/span>\" because you cannot choose suitable vertex $$$u$$$.<\/p><\/div><\/div>"}, {"contestId": 1092, "index": "F", "name": "Tree with Maximum Cost", "rating": 1900, "solvedCount": 11774, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Tree with Maximum Cost<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a tree consisting exactly of $$$n$$$ vertices. Tree is a connected undirected graph with $$$n-1$$$ edges. Each vertex $$$v$$$ of this tree has a value $$$a_v$$$ assigned to it.<\/p><p>Let $$$dist(x, y)$$$ be the distance between the vertices $$$x$$$ and $$$y$$$. The distance between the vertices is the number of edges on the simple path between them.<\/p><p>Let's define the cost of the tree as the following value: firstly, let's fix some vertex of the tree. Let it be $$$v$$$. Then the cost of the tree is $$$\\sum\\limits_{i = 1}^{n} dist(i, v) \\cdot a_i$$$.<\/p><p>Your task is to calculate the <span class=\"tex-font-style-bf\">maximum possible cost<\/span> of the tree if you can choose $$$v$$$ arbitrarily.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$, the number of vertices in the tree ($$$1 \\le n \\le 2 \\cdot 10^5$$$).<\/p><p>The second line of the input contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 2 \\cdot 10^5$$$), where $$$a_i$$$ is the value of the vertex $$$i$$$.<\/p><p>Each of the next $$$n - 1$$$ lines describes an edge of the tree. Edge $$$i$$$ is denoted by two integers $$$u_i$$$ and $$$v_i$$$, the labels of vertices it connects ($$$1 \\le u_i, v_i \\le n$$$, $$$u_i \\ne v_i$$$).<\/p><p>It is guaranteed that the given edges form a tree.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the <span class=\"tex-font-style-bf\">maximum possible cost<\/span> of the tree if you can choose any vertex as $$$v$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n8\n9 4 1 7 10 1 6 5\n1 2\n2 3\n1 4\n1 5\n5 6\n5 7\n5 8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n121\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1\n1337\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Picture corresponding to the first example: <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/dc7cad99433f72447843d5976ae7724b2f256d49.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>You can choose the vertex $$$3$$$ as a root, then the answer will be $$$2 \\cdot 9 + 1 \\cdot 4 + 0 \\cdot 1 + 3 \\cdot 7 + 3 \\cdot 10 + 4 \\cdot 1 + 4 \\cdot 6 + 4 \\cdot 5 = 18 + 4 + 0 + 21 + 30 + 4 + 24 + 20 = 121$$$.<\/p><p>In the second example tree consists only of one vertex so the answer is always $$$0$$$.<\/p><\/div><\/div>"}, {"contestId": 547, "index": "B", "name": "Mike and Feet", "rating": 1900, "solvedCount": 11769, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Mike and Feet<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Mike is the president of country What-The-Fatherland. There are <span class=\"tex-span\"><i>n<\/i><\/span> bears living in this country besides Mike. All of them are standing in a line and they are numbered from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span> from left to right. <span class=\"tex-span\"><i>i<\/i><\/span>-th bear is exactly <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> feet high. <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/27d7e1860b6c1911f12fe2fbe1b308493c73903e.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>A group of bears is a non-empty contiguous segment of the line. The <span class=\"tex-font-style-it\">size<\/span> of a group is the number of bears in that group. The <span class=\"tex-font-style-it\">strength<\/span> of a group is the minimum height of the bear in that group.<\/p><p>Mike is a curious to know for each <span class=\"tex-span\"><i>x<\/i><\/span> such that <span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i>\u2009\u2264\u2009<i>n<\/i><\/span> the maximum strength among all groups of size <span class=\"tex-span\"><i>x<\/i><\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20092\u2009\u00d7\u200910<sup class=\"upper-index\">5<\/sup><\/span>), the number of bears.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers separated by space, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>), heights of bears.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>n<\/i><\/span> integers in one line. For each <span class=\"tex-span\"><i>x<\/i><\/span> from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span>, print the maximum strength among all groups of size <span class=\"tex-span\"><i>x<\/i><\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>10<br/>1 2 3 4 5 4 3 2 1 6<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6 4 4 3 3 2 2 1 1 1 <br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1400, "index": "D", "name": "Zigzags", "rating": 1900, "solvedCount": 11580, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Zigzags<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a_1, a_2 \\dots a_n$$$. Calculate the number of tuples $$$(i, j, k, l)$$$ such that: <\/p><ul> <li> $$$1 \\le i  \\lt  j  \\lt  k  \\lt  l \\le n$$$; <\/li><li> $$$a_i = a_k$$$ and $$$a_j = a_l$$$; <\/li><\/ul><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 100$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$4 \\le n \\le 3000$$$)\u00a0\u2014 the size of the array $$$a$$$.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le n$$$)\u00a0\u2014 the array $$$a$$$.<\/p><p>It's guaranteed that the sum of $$$n$$$ in one test doesn't exceed $$$3000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print the number of described tuples.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n5\n2 2 2 2 2\n6\n1 3 3 1 2 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5\n2\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, for any four indices $$$i  \\lt  j  \\lt  k  \\lt  l$$$ are valid, so the answer is the number of tuples.<\/p><p>In the second test case, there are $$$2$$$ valid tuples: <\/p><ul> <li> $$$(1, 2, 4, 6)$$$: $$$a_1 = a_4$$$ and $$$a_2 = a_6$$$; <\/li><li> $$$(1, 3, 4, 6)$$$: $$$a_1 = a_4$$$ and $$$a_3 = a_6$$$. <\/li><\/ul><\/div><\/div>"}, {"contestId": 448, "index": "C", "name": "Painting Fence", "rating": 1900, "solvedCount": 11212, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Painting Fence<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Bizon the Champion isn't just attentive, he also is very hardworking.<\/p><p>Bizon the Champion decided to paint his old fence his favorite color, orange. The fence is represented as <span class=\"tex-span\"><i>n<\/i><\/span> vertical planks, put in a row. Adjacent planks have no gap between them. The planks are numbered from the left to the right starting from one, the <span class=\"tex-span\"><i>i<\/i><\/span>-th plank has the width of <span class=\"tex-span\">1<\/span> meter and the height of <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> meters.<\/p><p>Bizon the Champion bought a brush in the shop, the brush's width is <span class=\"tex-span\">1<\/span> meter. He can make vertical and horizontal strokes with the brush. During a stroke the brush's full surface must touch the fence at all the time (see the samples for the better understanding). What minimum number of strokes should Bizon the Champion do to fully paint the fence? Note that you are allowed to paint the same area of the fence multiple times.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integer <span class=\"tex-span\"><i>n<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20095000)<\/span> \u2014 the number of fence planks. The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> space-separated integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup>)<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u2014 the minimum number of strokes needed to paint the whole fence.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>2 2 1 2 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/>2 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>1<br/>5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample you need to paint the fence in three strokes with the brush: the first stroke goes on height 1 horizontally along all the planks. The second stroke goes on height 2 horizontally and paints the first and second planks and the third stroke (it can be horizontal and vertical) finishes painting the fourth plank.<\/p><p>In the second sample you can paint the fence with two strokes, either two horizontal or two vertical strokes.<\/p><p>In the third sample there is only one plank that can be painted using a single vertical stroke.<\/p><\/div><\/div>"}, {"contestId": 1354, "index": "D", "name": "Multiset", "rating": 1900, "solvedCount": 10704, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Multiset<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>28 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">Note that the memory limit is unusual.<\/span><\/p><p>You are given a multiset consisting of $$$n$$$ integers. You have to process queries of two types:<\/p><ul> <li> add integer $$$k$$$ into the multiset; <\/li><li> find the $$$k$$$-th order statistics in the multiset and remove it. <\/li><\/ul><p>$$$k$$$-th order statistics in the multiset is the $$$k$$$-th element in the sorted list of all elements of the multiset. For example, if the multiset contains elements $$$1$$$, $$$4$$$, $$$2$$$, $$$1$$$, $$$4$$$, $$$5$$$, $$$7$$$, and $$$k = 3$$$, then you have to find the $$$3$$$-rd element in $$$[1, 1, 2, 4, 4, 5, 7]$$$, which is $$$2$$$. If you try to delete an element which occurs multiple times in the multiset, only one occurence is removed. <\/p><p>After processing all queries, print <span class=\"tex-font-style-bf\">any<\/span> number belonging to the multiset, or say that it is empty.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$q$$$ ($$$1 \\le n, q \\le 10^6$$$) \u2014 the number of elements in the initial multiset and the number of queries, respectively.<\/p><p>The second line contains $$$n$$$ integers $$$a_1$$$, $$$a_2$$$, ..., $$$a_n$$$ ($$$1 \\le a_1 \\le a_2 \\le \\dots \\le a_n \\le n$$$) \u2014 the elements of the multiset.<\/p><p>The third line contains $$$q$$$ integers $$$k_1$$$, $$$k_2$$$, ..., $$$k_q$$$, each representing a query: <\/p><ul> <li> if $$$1 \\le k_i \\le n$$$, then the $$$i$$$-th query is \"insert $$$k_i$$$ into the multiset\"; <\/li><li> if $$$k_i  \\lt  0$$$, then the $$$i$$$-th query is \"remove the $$$|k_i|$$$-th order statistics from the multiset\". For this query, it is guaranteed that $$$|k_i|$$$ is not greater than the size of the multiset. <\/li><\/ul><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If the multiset is empty after all queries, print $$$0$$$.<\/p><p>Otherwise, print any integer that belongs to the resulting multiset.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 5\n1 2 3 4 5\n-1 -1 -1 -1 -1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 4\n1 2 3 4 5\n-5 -1 -3 -1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 2\n1 1 1 2 3 4\n5 6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, all elements of the multiset are deleted.<\/p><p>In the second example, the elements $$$5$$$, $$$1$$$, $$$4$$$, $$$2$$$ are deleted (they are listed in chronological order of their removal).<\/p><p>In the third example, $$$6$$$ is not the only answer.<\/p><\/div><\/div>"}, {"contestId": 1245, "index": "D", "name": "Shichikuji and Power Grid", "rating": 1900, "solvedCount": 10362, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Shichikuji and Power Grid<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Shichikuji is the new resident deity of the South Black Snail Temple. Her first job is as follows:<\/p><p>There are $$$n$$$ new cities located in Prefecture X. Cities are numbered from $$$1$$$ to $$$n$$$. City $$$i$$$ is located $$$x_i$$$ km North of the shrine and $$$y_i$$$ km East of the shrine. It is possible that $$$(x_i, y_i) = (x_j, y_j)$$$ even when $$$i \\ne j$$$.<\/p><p>Shichikuji must provide electricity to each city either by building a power station in that city, or by making a connection between that city and another one that already has electricity. So the City has electricity if it has a power station in it or it is connected to a City which has electricity by a direct connection or via a chain of connections.<\/p><ul> <li>   Building a power station in City $$$i$$$ will cost $$$c_i$$$ yen;  <\/li><li>   Making a connection between City $$$i$$$ and City $$$j$$$ will cost $$$k_i + k_j$$$ yen <span class=\"tex-font-style-bf\">per km of wire<\/span> used for the connection. However, wires can only go the cardinal directions (North, South, East, West). Wires can cross each other. Each wire must have both of its endpoints in some cities. If City $$$i$$$ and City $$$j$$$ are connected by a wire, the wire will go through any shortest path from City $$$i$$$ to City $$$j$$$. Thus, the length of the wire if City $$$i$$$ and City $$$j$$$ are connected is $$$|x_i - x_j| + |y_i - y_j|$$$ km. <\/li><\/ul><p>Shichikuji wants to do this job spending as little money as possible, since according to her, there isn't really anything else in the world other than money. However, she died when she was only in fifth grade so she is not smart enough for this. And thus, the new resident deity asks for your help.<\/p><p>And so, you have to provide Shichikuji with the following information: minimum amount of yen needed to provide electricity to all cities, the cities in which power stations will be built, and the connections to be made.<\/p><p>If there are multiple ways to choose the cities and the connections to obtain the construction of minimum price, then print any of them.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>First line of input contains a single integer $$$n$$$ ($$$1 \\leq n \\leq 2000$$$) \u2014 the number of cities.<\/p><p>Then, $$$n$$$ lines follow. The $$$i$$$-th line contains two space-separated integers $$$x_i$$$ ($$$1 \\leq x_i \\leq 10^6$$$) and $$$y_i$$$ ($$$1 \\leq y_i \\leq 10^6$$$) \u2014 the coordinates of the $$$i$$$-th city.<\/p><p>The next line contains $$$n$$$ space-separated integers $$$c_1, c_2, \\dots, c_n$$$ ($$$1 \\leq c_i \\leq 10^9$$$) \u2014 the cost of building a power station in the $$$i$$$-th city.<\/p><p>The last line contains $$$n$$$ space-separated integers $$$k_1, k_2, \\dots, k_n$$$ ($$$1 \\leq k_i \\leq 10^9$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In the first line print a single integer, denoting the minimum amount of yen needed.<\/p><p>Then, print an integer $$$v$$$ \u2014 the number of power stations to be built.<\/p><p>Next, print $$$v$$$ space-separated integers, denoting the indices of cities in which a power station will be built. Each number should be from $$$1$$$ to $$$n$$$ and all numbers should be pairwise distinct. You can print the numbers in arbitrary order.<\/p><p>After that, print an integer $$$e$$$ \u2014 the number of connections to be made.<\/p><p>Finally, print $$$e$$$ pairs of integers $$$a$$$ and $$$b$$$ ($$$1 \\le a, b \\le n$$$, $$$a \\ne b$$$), denoting that a connection between City $$$a$$$ and City $$$b$$$ will be made. Each unordered pair of cities should be included at most once (for each $$$(a, b)$$$ there should be no more $$$(a, b)$$$ or $$$(b, a)$$$ pairs). You can print the pairs in arbitrary order.<\/p><p>If there are multiple ways to choose the cities and the connections to obtain the construction of minimum price, then print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n2 3\n1 1\n3 2\n3 2 3\n3 2 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n8\n3\n1 2 3 \n0\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n2 1\n1 2\n3 3\n23 2 23\n3 2 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n27\n1\n2 \n2\n1 2\n2 3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the answers given in the samples, refer to the following diagrams (cities with power stations are colored green, other cities are colored blue, and wires are colored red):<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/90852f0207479bf2b34b5ab73f94befafb8be3d3.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>For the first example, the cost of building power stations in all cities is $$$3 + 2 + 3 = 8$$$. It can be shown that no configuration costs less than 8 yen.<\/p><p>For the second example, the cost of building a power station in City 2 is 2. The cost of connecting City 1 and City 2 is $$$2 \\cdot (3 + 2) = 10$$$. The cost of connecting City 2 and City 3 is $$$3 \\cdot (2 + 3) = 15$$$. Thus the total cost is $$$2 + 10 + 15 = 27$$$. It can be shown that no configuration costs less than 27 yen.<\/p><\/div><\/div>"}, {"contestId": 1375, "index": "D", "name": "Replace by MEX", "rating": 1900, "solvedCount": 10308, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Replace by MEX<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You're given an array of $$$n$$$ integers between $$$0$$$ and $$$n$$$ inclusive.<\/p><p>In one operation, you can choose any element of the array and replace it by the MEX of the elements of the array (which may change after the operation).<\/p><p>For example, if the current array is $$$[0, 2, 2, 1, 4]$$$, you can choose the second element and replace it by the MEX of the present elements \u00a0\u2014 $$$3$$$. Array will become $$$[0, 3, 2, 1, 4]$$$.<\/p><p>You must make the array non-decreasing, using at most $$$2n$$$ operations.<\/p><p>It can be proven that it is always possible. Please note that you do <span class=\"tex-font-style-bf\">not<\/span> have to minimize the number of operations. If there are many solutions, you can print any of them.<\/p><p>\u00a0\u2013<\/p><p>An array $$$b[1 \\ldots n]$$$ is non-decreasing if and only if $$$b_1 \\le b_2 \\le \\ldots \\le b_n$$$.<\/p><p>The MEX (minimum excluded) of an array is the smallest non-negative integer that does not belong to the array. For instance:<\/p><ul> <li> The MEX of $$$[2, 2, 1]$$$ is $$$0$$$, because $$$0$$$ does not belong to the array. <\/li><li> The MEX of $$$[3, 1, 0, 1]$$$ is $$$2$$$, because $$$0$$$ and $$$1$$$ belong to the array, but $$$2$$$ does not. <\/li><li> The MEX of $$$[0, 3, 1, 2]$$$ is $$$4$$$ because $$$0$$$, $$$1$$$, $$$2$$$ and $$$3$$$ belong to the array, but $$$4$$$ does not. <\/li><\/ul><p>It's worth mentioning that the MEX of an array of length $$$n$$$ is always between $$$0$$$ and $$$n$$$ inclusive.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 200$$$)\u00a0\u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$3 \\le n \\le 1000$$$)\u00a0\u2014 length of the array.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, \\ldots, a_n$$$ ($$$0 \\le a_i \\le n$$$)\u00a0\u2014 elements of the array. Note that they <span class=\"tex-font-style-bf\">don't have to be distinct<\/span>.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases doesn't exceed $$$1000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, you must output two lines:<\/p><p>The first line must contain a single integer $$$k$$$ ($$$0 \\le k \\le 2n$$$) \u00a0\u2014 the number of operations you perform.<\/p><p>The second line must contain $$$k$$$ integers $$$x_1, \\ldots, x_k$$$ ($$$1 \\le x_i \\le n$$$), where $$$x_i$$$ is the index chosen for the $$$i$$$-th operation.<\/p><p>If there are many solutions, you can find any of them. Please remember that it is <span class=\"tex-font-style-bf\">not<\/span> required to minimize $$$k$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n3\n2 2 3\n3\n2 1 0\n7\n0 7 3 1 3 7 7\n9\n2 0 1 1 2 4 4 2 0\n9\n8 4 7 6 1 2 3 0 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n\n2\n3 1\n4\n2 5 5 4\n11\n3 8 9 7 8 5 9 6 4 1 2\n10\n1 8 1 9 5 2 4 6 3 7\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the array is already non-decreasing ($$$2 \\le 2 \\le 3$$$).<\/p><p>Explanation of the second test case (the element modified by each operation is colored in red): <\/p><ul> <li> $$$a = [2, 1, 0]$$$ ; the initial MEX is $$$3$$$. <\/li><li> $$$a = [2, 1, \\color{red}{3}]$$$ ; the new MEX is $$$0$$$. <\/li><li> $$$a = [\\color{red}{0}, 1, 3]$$$ ; the new MEX is $$$2$$$. <\/li><li> The final array is non-decreasing: $$$0 \\le 1 \\le 3$$$. <\/li><\/ul><p>Explanation of the third test case: <\/p><ul> <li> $$$a = [0, 7, 3, 1, 3, 7, 7]$$$ ; the initial MEX is $$$2$$$. <\/li><li> $$$a = [0, \\color{red}{2}, 3, 1, 3, 7, 7]$$$ ; the new MEX is $$$4$$$. <\/li><li> $$$a = [0, 2, 3, 1, \\color{red}{4}, 7, 7]$$$ ; the new MEX is $$$5$$$. <\/li><li> $$$a = [0, 2, 3, 1, \\color{red}{5}, 7, 7]$$$ ; the new MEX is $$$4$$$. <\/li><li> $$$a = [0, 2, 3, \\color{red}{4}, 5, 7, 7]$$$ ; the new MEX is $$$1$$$. <\/li><li> The final array is non-decreasing: $$$0 \\le 2 \\le 3 \\le 4 \\le 5 \\le 7 \\le 7$$$. <\/li><\/ul><\/div><\/div>"}, {"contestId": 1486, "index": "C2", "name": "Guessing the Greatest (hard version)", "rating": 1900, "solvedCount": 10288, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C2. Guessing the Greatest (hard version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">The only difference between the easy and the hard version is the limit to the number of queries<\/span>.<\/p><p><span class=\"tex-font-style-bf\">This is an interactive problem.<\/span><\/p><p>There is an array $$$a$$$ of $$$n$$$ <span class=\"tex-font-style-bf\">different<\/span> numbers. In one query you can ask the position of the second maximum element in a subsegment $$$a[l..r]$$$. Find the position of the maximum element in the array in no more than <span class=\"tex-font-style-bf\">20<\/span> queries.<\/p><p>A subsegment $$$a[l..r]$$$ is all the elements $$$a_l, a_{l + 1}, ..., a_r$$$. After asking this subsegment you will be given the position of the second maximum from this subsegment <span class=\"tex-font-style-bf\">in the whole<\/span> array.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ $$$(2 \\leq n \\leq 10^5)$$$ \u2014 the number of elements in the array.<\/p><\/div><div><div class=\"section-title\">Interaction<\/div><p>You can ask queries by printing \"<span class=\"tex-font-style-tt\">? $$$l$$$ $$$r$$$<\/span>\" $$$(1 \\leq l  \\lt  r \\leq n)$$$. The answer is the index of the second maximum of all elements $$$a_l, a_{l + 1}, ..., a_r$$$. Array $$$a$$$ is fixed beforehand and can't be changed in time of interaction.<\/p><p>You can output the answer by printing \"<span class=\"tex-font-style-tt\">! $$$p$$$<\/span>\", where <span class=\"tex-font-style-tt\">$$$p$$$<\/span> is the index of the maximum element in the array.<\/p><p>You can ask no more than <span class=\"tex-font-style-bf\">20<\/span> queries. <span class=\"tex-font-style-bf\">Printing the answer doesn't count as a query<\/span>.<\/p><p>After printing a query do not forget to output end of line and flush the output. Otherwise, you will get <span class=\"tex-font-style-tt\">Idleness limit exceeded<\/span>. To do this, use:<\/p><ul> <li> <span class=\"tex-font-style-tt\">fflush(stdout)<\/span> or <span class=\"tex-font-style-tt\">cout.flush()<\/span> in C++; <\/li><li> <span class=\"tex-font-style-tt\">System.out.flush()<\/span> in Java; <\/li><li> <span class=\"tex-font-style-tt\">flush(output)<\/span> in Pascal; <\/li><li> <span class=\"tex-font-style-tt\">stdout.flush()<\/span> in Python; <\/li><li> see documentation for other languages <\/li><\/ul><p><span class=\"tex-font-style-bf\"><span class=\"tex-font-style-section\">Hacks<\/span><\/span><\/p><p>To make a hack, use the following test format.<\/p><p>In the first line output a single integer $$$n$$$ $$$(2 \\leq n \\leq 10^5)$$$. In the second line output a permutation of $$$n$$$ integers $$$1$$$ to $$$n$$$. The position of $$$n$$$ in the permutation is the position of the maximum<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n\n3\n\n4\n\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n? 1 5\n\n? 4 5\n\n! 1<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the sample suppose $$$a$$$ is $$$[5, 1, 4, 2, 3]$$$. So after asking the $$$[1..5]$$$ subsegment $$$4$$$ is second to max value, and it's position is $$$3$$$. After asking the $$$[4..5]$$$ subsegment $$$2$$$ is second to max value and it's position in the whole array is $$$4$$$.<\/p><p>Note that there are other arrays $$$a$$$ that would produce the same interaction, and the answer for them might be different. Example output is given in purpose of understanding the interaction.<\/p><\/div><\/div>"}, {"contestId": 1620, "index": "E", "name": "Replace the Numbers", "rating": 1900, "solvedCount": 10095, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Replace the Numbers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You have an array of integers (initially empty).<\/p><p>You have to perform $$$q$$$ queries. Each query is of one of two types: <\/p><ul> <li> \"$$$1$$$ $$$x$$$\"\u00a0\u2014 add the element $$$x$$$ to the end of the array; <\/li><li> \"$$$2$$$ $$$x$$$ $$$y$$$\"\u00a0\u2014 replace all occurrences of $$$x$$$ in the array with $$$y$$$. <\/li><\/ul><p>Find the resulting array after performing all the queries.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$q$$$ ($$$1 \\le q \\le 5 \\cdot 10^5$$$)\u00a0\u2014 the number of queries.<\/p><p>Next $$$q$$$ lines contain queries (one per line). Each query is of one of two types: <\/p><ul> <li> \"$$$1$$$ $$$x$$$\" ($$$1 \\le x \\le 5 \\cdot 10^5$$$); <\/li><li> \"$$$2$$$ $$$x$$$ $$$y$$$\" ($$$1 \\le x, y \\le 5 \\cdot 10^5$$$). <\/li><\/ul><p>It's guaranteed that there is at least one query of the first type.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In a single line, print $$$k$$$ integers\u00a0\u2014 the resulting array after performing all the queries, where $$$k$$$ is the number of queries of the first type.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7\n1 3\n1 1\n2 1 2\n1 2\n1 1\n1 2\n2 1 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3 2 2 3 2 <\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n1 1\n1 2\n1 1\n2 2 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 2 1 <\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n8\n2 1 4\n1 1\n1 4\n1 2\n2 2 4\n2 4 3\n1 2\n2 2 7\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 3 3 7 <\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, the array changes as follows:<\/p><p>$$$[]$$$ $$$\\rightarrow$$$ $$$[3]$$$ $$$\\rightarrow$$$ $$$[3, 1]$$$ $$$\\rightarrow$$$ $$$[3, 2]$$$ $$$\\rightarrow$$$ $$$[3, 2, 2]$$$ $$$\\rightarrow$$$ $$$[3, 2, 2, 1]$$$ $$$\\rightarrow$$$ $$$[3, 2, 2, 1, 2]$$$ $$$\\rightarrow$$$ $$$[3, 2, 2, 3, 2]$$$.<\/p><p>In the second example, the array changes as follows:<\/p><p>$$$[]$$$ $$$\\rightarrow$$$ $$$[1]$$$ $$$\\rightarrow$$$ $$$[1, 2]$$$ $$$\\rightarrow$$$ $$$[1, 2, 1]$$$ $$$\\rightarrow$$$ $$$[1, 2, 1]$$$.<\/p><p>In the third example, the array changes as follows:<\/p><p>$$$[]$$$ $$$\\rightarrow$$$ $$$[]$$$ $$$\\rightarrow$$$ $$$[1]$$$ $$$\\rightarrow$$$ $$$[1, 4]$$$ $$$\\rightarrow$$$ $$$[1, 4, 2]$$$ $$$\\rightarrow$$$ $$$[1, 4, 4]$$$ $$$\\rightarrow$$$ $$$[1, 3, 3]$$$ $$$\\rightarrow$$$ $$$[1, 3, 3, 2]$$$ $$$\\rightarrow$$$ $$$[1, 3, 3, 7]$$$.<\/p><\/div><\/div>"}, {"contestId": 191, "index": "C", "name": "Fools and Roads", "rating": 1900, "solvedCount": 10033, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Fools and Roads<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>They say that Berland has exactly two problems, fools and roads. Besides, Berland has <span class=\"tex-span\"><i>n<\/i><\/span> cities, populated by the fools and connected by the roads. All Berland roads are bidirectional. As there are many fools in Berland, between each pair of cities there is a path (or else the fools would get upset). Also, between each pair of cities there is no more than one simple path (or else the fools would get lost). <\/p><p>But that is not the end of Berland's special features. In this country fools sometimes visit each other and thus spoil the roads. The fools aren't very smart, so they always use only the simple paths.<\/p><p><span class=\"tex-font-style-it\">A simple path<\/span> is the path which goes through every Berland city not more than once.<\/p><p>The Berland government knows the paths which the fools use. Help the government count for each road, how many distinct fools can go on it.<\/p><p>Note how the fools' paths are given in the input.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the number of cities. <\/p><p>Each of the next <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> lines contains two space-separated integers <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2260\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>), that means that there is a road connecting cities <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. <\/p><p>The next line contains integer <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the number of pairs of fools who visit each other. <\/p><p>Next <span class=\"tex-span\"><i>k<\/i><\/span> lines contain two space-separated numbers. The <span class=\"tex-span\"><i>i<\/i><\/span>-th line <span class=\"tex-span\">(<i>i<\/i>\u2009&gt;\u20090)<\/span> contains numbers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>). That means that the fool number <span class=\"tex-span\">2<i>i<\/i>\u2009-\u20091<\/span> lives in city <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and visits the fool number <span class=\"tex-span\">2<i>i<\/i><\/span>, who lives in city <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. The given pairs describe simple paths, because between every pair of cities there is only one simple path.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> integer. The integers should be separated by spaces. The <span class=\"tex-span\"><i>i<\/i><\/span>-th number should equal the number of fools who can go on the <span class=\"tex-span\"><i>i<\/i><\/span>-th road. The roads are numbered starting from one in the order, in which they occur in the input.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1 2<br/>1 3<br/>2 4<br/>2 5<br/>2<br/>1 4<br/>3 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2 1 1 1 <br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>3 4<br/>4 5<br/>1 4<br/>2 4<br/>3<br/>2 3<br/>1 3<br/>3 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3 1 1 1 <br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample the fool number one goes on the first and third road and the fool number 3 goes on the second, first and fourth ones.<\/p><p>In the second sample, the fools number 1, 3 and 5 go on the first road, the fool number 5 will go on the second road, on the third road goes the fool number 3, and on the fourth one goes fool number 1.<\/p><\/div><\/div>"}, {"contestId": 1242, "index": "B", "name": "0-1 MST", "rating": 1900, "solvedCount": 9807, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. 0-1 MST<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Ujan has a lot of useless stuff in his drawers, a considerable part of which are his math notebooks: it is time to sort them out. This time he found an old dusty graph theory notebook with a description of a graph.<\/p><p>It is an undirected weighted graph on $$$n$$$ vertices. It is a complete graph: each pair of vertices is connected by an edge. The weight of each edge is either $$$0$$$ or $$$1$$$; exactly $$$m$$$ edges have weight $$$1$$$, and all others have weight $$$0$$$.<\/p><p>Since Ujan doesn't really want to organize his notes, he decided to find the weight of the minimum spanning tree of the graph. (The weight of a spanning tree is the sum of all its edges.) Can you find the answer for Ujan so he stops procrastinating?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\leq n \\leq 10^5$$$, $$$0 \\leq m \\leq \\min(\\frac{n(n-1)}{2},10^5)$$$), the number of vertices and the number of edges of weight $$$1$$$ in the graph. <\/p><p>The $$$i$$$-th of the next $$$m$$$ lines contains two integers $$$a_i$$$ and $$$b_i$$$ ($$$1 \\leq a_i, b_i \\leq n$$$, $$$a_i \\neq b_i$$$), the endpoints of the $$$i$$$-th edge of weight $$$1$$$.<\/p><p>It is guaranteed that no edge appears twice in the input.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output a single integer, the weight of the minimum spanning tree of the graph.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 11\n1 3\n1 4\n1 5\n1 6\n2 3\n2 4\n2 5\n2 6\n3 4\n3 5\n3 6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 0\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The graph from the first sample is shown below. Dashed edges have weight $$$0$$$, other edges have weight $$$1$$$. One of the minimum spanning trees is highlighted in orange and has total weight $$$2$$$.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/05e0d3c75fdb57ba399b5b1d594a8a2e081d9b61.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>In the second sample, all edges have weight $$$0$$$ so any spanning tree has total weight $$$0$$$.<\/p><\/div><\/div>"}, {"contestId": 1117, "index": "C", "name": "Magic Ship", "rating": 1900, "solvedCount": 9704, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Magic Ship<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You a captain of a ship. Initially you are standing in a point $$$(x_1, y_1)$$$ (obviously, all positions in the sea can be described by cartesian plane) and you want to travel to a point $$$(x_2, y_2)$$$. <\/p><p>You know the weather forecast \u2014 the string $$$s$$$ of length $$$n$$$, consisting only of letters <span class=\"tex-font-style-tt\">U<\/span>, <span class=\"tex-font-style-tt\">D<\/span>, <span class=\"tex-font-style-tt\">L<\/span> and <span class=\"tex-font-style-tt\">R<\/span>. The letter corresponds to a direction of wind. Moreover, the forecast is periodic, e.g. the first day wind blows to the side $$$s_1$$$, the second day \u2014 $$$s_2$$$, the $$$n$$$-th day \u2014 $$$s_n$$$ and $$$(n+1)$$$-th day \u2014 $$$s_1$$$ again and so on. <\/p><p>Ship coordinates change the following way:<\/p><ul> <li> if wind blows the direction <span class=\"tex-font-style-tt\">U<\/span>, then the ship moves from $$$(x, y)$$$ to $$$(x, y + 1)$$$; <\/li><li> if wind blows the direction <span class=\"tex-font-style-tt\">D<\/span>, then the ship moves from $$$(x, y)$$$ to $$$(x, y - 1)$$$; <\/li><li> if wind blows the direction <span class=\"tex-font-style-tt\">L<\/span>, then the ship moves from $$$(x, y)$$$ to $$$(x - 1, y)$$$; <\/li><li> if wind blows the direction <span class=\"tex-font-style-tt\">R<\/span>, then the ship moves from $$$(x, y)$$$ to $$$(x + 1, y)$$$. <\/li><\/ul><p>The ship can also either go one of the four directions or stay in place each day. If it goes then it's exactly 1 unit of distance. Transpositions of the ship and the wind add up. If the ship stays in place, then only the direction of wind counts. For example, if wind blows the direction <span class=\"tex-font-style-tt\">U<\/span> and the ship moves the direction <span class=\"tex-font-style-tt\">L<\/span>, then from point $$$(x, y)$$$ it will move to the point $$$(x - 1, y + 1)$$$, and if it goes the direction <span class=\"tex-font-style-tt\">U<\/span>, then it will move to the point $$$(x, y + 2)$$$.<\/p><p>You task is to determine the minimal number of days required for the ship to reach the point $$$(x_2, y_2)$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$x_1, y_1$$$ ($$$0 \\le x_1, y_1 \\le 10^9$$$) \u2014 the initial coordinates of the ship.<\/p><p>The second line contains two integers $$$x_2, y_2$$$ ($$$0 \\le x_2, y_2 \\le 10^9$$$) \u2014 the coordinates of the destination point.<\/p><p>It is guaranteed that the initial coordinates and destination point coordinates are different.<\/p><p>The third line contains a single integer $$$n$$$ ($$$1 \\le n \\le 10^5$$$) \u2014 the length of the string $$$s$$$.<\/p><p>The fourth line contains the string $$$s$$$ itself, consisting only of letters <span class=\"tex-font-style-tt\">U<\/span>, <span class=\"tex-font-style-tt\">D<\/span>, <span class=\"tex-font-style-tt\">L<\/span> and <span class=\"tex-font-style-tt\">R<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>The only line should contain the minimal number of days required for the ship to reach the point $$$(x_2, y_2)$$$.<\/p><p>If it's impossible then print \"<span class=\"tex-font-style-tt\">-1<\/span>\".<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n0 0\n4 6\n3\nUUU\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n0 3\n0 0\n3\nUDD\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><d

he maximum number which you can achieve in the end.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2 4 1\n1 2\n6 3 4 5\n5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n20<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 2 2\n7 5 4\n2 9\n7 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n29<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example input, let us perform the following operations:<\/p><p>$$$[1, 2], [6, 3, 4, 5], [5]$$$<\/p><p>$$$[-5, 2], [3, 4, 5], [5]$$$ (Applying an operation to $$$(1, 6)$$$)<\/p><p>$$$[-10, 2], [3, 4], [5]$$$ (Applying an operation to $$$(-5, 5)$$$)<\/p><p>$$$[2], [3, 4], [15]$$$ (Applying an operation to $$$(5, -10)$$$)<\/p><p>$$$[-1], [4], [15]$$$ (Applying an operation to $$$(2, 3)$$$)<\/p><p>$$$[-5], [], [15]$$$ (Applying an operation to $$$(-1, 4)$$$)<\/p><p>$$$[], [], [20]$$$ (Applying an operation to $$$(15, -5)$$$)<\/p><p>You can verify that you cannot achieve a bigger number. Hence, the answer is $$$20$$$.<\/p><\/div><\/div>"}, {"contestId": 1444, "index": "B", "name": "Divide and Sum", "rating": 1900, "solvedCount": 6857, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Divide and Sum<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ of length $$$2n$$$. Consider a partition of array $$$a$$$ into two subsequences $$$p$$$ and $$$q$$$ of length $$$n$$$ each (each element of array $$$a$$$ should be in exactly one subsequence: either in $$$p$$$ or in $$$q$$$).<\/p><p>Let's sort $$$p$$$ in non-decreasing order, and $$$q$$$ in non-increasing order, we can denote the sorted versions by $$$x$$$ and $$$y$$$, respectively. Then the <span class=\"tex-font-style-it\">cost<\/span> of a partition is defined as $$$f(p, q) = \\sum_{i = 1}^n |x_i - y_i|$$$.<\/p><p>Find the sum of $$$f(p, q)$$$ over all correct partitions of array $$$a$$$. Since the answer might be too big, print its remainder modulo $$$998244353$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$1 \\leq n \\leq 150\\,000$$$).<\/p><p>The second line contains $$$2n$$$ integers $$$a_1, a_2, \\ldots, a_{2n}$$$ ($$$1 \\leq a_i \\leq 10^9$$$)\u00a0\u2014 elements of array $$$a$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer\u00a0\u2014 the answer to the problem, modulo $$$998244353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1\n1 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n2 1 2 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n12<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n2 2 2 2 2 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n13 8 35 94 9284 34 54 69 123 846\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2588544<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Two partitions of an array are considered different if the sets of indices of elements included in the subsequence $$$p$$$ are different.<\/p><p>In the first example, there are two correct partitions of the array $$$a$$$:<\/p><ol> <li> $$$p = [1]$$$, $$$q = [4]$$$, then $$$x = [1]$$$, $$$y = [4]$$$, $$$f(p, q) = |1 - 4| = 3$$$; <\/li><li> $$$p = [4]$$$, $$$q = [1]$$$, then $$$x = [4]$$$, $$$y = [1]$$$, $$$f(p, q) = |4 - 1| = 3$$$. <\/li><\/ol><p>In the second example, there are six valid partitions of the array $$$a$$$: <\/p><ol> <li> $$$p = [2, 1]$$$, $$$q = [2, 1]$$$ (elements with indices $$$1$$$ and $$$2$$$ in the original array are selected in the subsequence $$$p$$$); <\/li><li> $$$p = [2, 2]$$$, $$$q = [1, 1]$$$; <\/li><li> $$$p = [2, 1]$$$, $$$q = [1, 2]$$$ (elements with indices $$$1$$$ and $$$4$$$ are selected in the subsequence $$$p$$$); <\/li><li> $$$p = [1, 2]$$$, $$$q = [2, 1]$$$; <\/li><li> $$$p = [1, 1]$$$, $$$q = [2, 2]$$$; <\/li><li> $$$p = [2, 1]$$$, $$$q = [2, 1]$$$ (elements with indices $$$3$$$ and $$$4$$$ are selected in the subsequence $$$p$$$). <\/li><\/ol><\/div><\/div>"}, {"contestId": 1560, "index": "F1", "name": "Nearest Beautiful Number (easy version)", "rating": 1900, "solvedCount": 6856, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F1. Nearest Beautiful Number (easy version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-it\">It is a simplified version of problem F2. The difference between them is the constraints (F1: $$$k \\le 2$$$, F2: $$$k \\le 10$$$).<\/span><\/p><p>You are given an integer $$$n$$$. Find the minimum integer $$$x$$$ such that $$$x \\ge n$$$ and the number $$$x$$$ is $$$k$$$-<span class=\"tex-font-style-it\">beautiful<\/span>.<\/p><p>A number is called $$$k$$$-<span class=\"tex-font-style-it\">beautiful<\/span> if its decimal representation having no leading zeroes contains no more than $$$k$$$ different digits. E.g. if $$$k = 2$$$, the numbers $$$3434443$$$, $$$55550$$$, $$$777$$$ and $$$21$$$ are $$$k$$$-<span class=\"tex-font-style-it\">beautiful<\/span> whereas the numbers $$$120$$$, $$$445435$$$ and $$$998244353$$$ are not.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$) \u2014 the number of test cases. Then $$$t$$$ test cases follow.<\/p><p>Each test case consists of one line containing two integers $$$n$$$ and $$$k$$$ ($$$1 \\le n \\le 10^9$$$, $$$1 \\le k \\le 2$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case output on a separate line $$$x$$$ \u2014 the minimum $$$k$$$-<span class=\"tex-font-style-it\">beautiful<\/span> integer such that $$$x \\ge n$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n1 1\n221 2\n177890 2\n998244353 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n221\n181111\n999999999\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1651, "index": "D", "name": "Nearest Excluded Points", "rating": 1900, "solvedCount": 6852, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Nearest Excluded Points<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given $$$n$$$ distinct points on a plane. The coordinates of the $$$i$$$-th point are $$$(x_i, y_i)$$$.<\/p><p>For each point $$$i$$$, find the nearest (in terms of Manhattan distance) point with <span class=\"tex-font-style-bf\">integer coordinates<\/span> that is not among the given $$$n$$$ points. If there are multiple such points \u2014 you can choose any of them.<\/p><p>The Manhattan distance between two points $$$(x_1, y_1)$$$ and $$$(x_2, y_2)$$$ is $$$|x_1 - x_2| + |y_1 - y_2|$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains one integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$) \u2014 the number of points in the set.<\/p><p>The next $$$n$$$ lines describe points. The $$$i$$$-th of them contains two integers $$$x_i$$$ and $$$y_i$$$ ($$$1 \\le x_i, y_i \\le 2 \\cdot 10^5$$$) \u2014 coordinates of the $$$i$$$-th point.<\/p><p>It is guaranteed that all points in the input are distinct.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$n$$$ lines. In the $$$i$$$-th line, print the point with <span class=\"tex-font-style-bf\">integer coordinates<\/span> that is not among the given $$$n$$$ points and is the nearest (in terms of Manhattan distance) to the $$$i$$$-th point from the input.<\/p><p>Output coordinates should be in range $$$[-10^6; 10^6]$$$. It can be shown that any optimal answer meets these constraints.<\/p><p>If there are several answers, you can print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n2 2\n1 2\n2 1\n3 2\n2 3\n5 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 1\n1 1\n2 0\n3 1\n2 4\n5 4\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n8\n4 4\n2 4\n2 2\n2 3\n1 4\n4 2\n1 3\n3 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4 3\n2 5\n2 1\n2 5\n1 5\n4 1\n1 2\n3 2\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1470, "index": "B", "name": "Strange Definition", "rating": 1900, "solvedCount": 6844, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Strange Definition<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Let us call two integers $$$x$$$ and $$$y$$$ <span class=\"tex-font-style-it\">adjacent<\/span> if $$$\\frac{lcm(x, y)}{gcd(x, y)}$$$ is a perfect square. For example, $$$3$$$ and $$$12$$$ are adjacent, but $$$6$$$ and $$$9$$$ are not.<\/p><p>Here $$$gcd(x, y)$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Greatest_common_divisor\">greatest common divisor (GCD)<\/a> of integers $$$x$$$ and $$$y$$$, and $$$lcm(x, y)$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Least_common_multiple\">least common multiple (LCM)<\/a> of integers $$$x$$$ and $$$y$$$.<\/p><p>You are given an array $$$a$$$ of length $$$n$$$. Each second the following happens: each element $$$a_i$$$ of the array is <span class=\"tex-font-style-bf\">replaced<\/span> by the product of all elements of the array (including itself), that are adjacent to the current value. <\/p><p>Let $$$d_i$$$ be the number of adjacent elements to $$$a_i$$$ (including $$$a_i$$$ itself). The <span class=\"tex-font-style-it\">beauty<\/span> of the array is defined as $$$\\max_{1 \\le i \\le n} d_i$$$. <\/p><p>You are given $$$q$$$ queries: each query is described by an integer $$$w$$$, and you have to output the beauty of the array after $$$w$$$ seconds.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first input line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^5)$$$\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 3 \\cdot 10^5$$$)\u00a0\u2014 the length of the array.<\/p><p>The following line contains $$$n$$$ integers $$$a_1, \\ldots, a_n$$$ ($$$1 \\le a_i \\le 10^6$$$)\u00a0\u2014 array elements. <\/p><p>The next line contain a single integer $$$q$$$ ($$$1 \\le q \\le 3 \\cdot 10^5$$$)\u00a0\u2014 the number of queries.<\/p><p>The following $$$q$$$ lines contain a single integer $$$w$$$ each ($$$0 \\le w \\le 10^{18}$$$)\u00a0\u2014 the queries themselves.<\/p><p>It is guaranteed that the sum of values $$$n$$$ over all test cases does not exceed $$$3 \\cdot 10^5$$$, and the sum of values $$$q$$$ over all test cases does not exceed $$$3 \\cdot 10^5$$$<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query output a single integer\u00a0\u2014 the beauty of the array at the corresponding moment.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n4\n6 8 4 2\n1\n0\n6\n12 3 20 5 80 1\n1\n1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the initial array contains elements $$$[6, 8, 4, 2]$$$. Element $$$a_4=2$$$ in this array is adjacent to $$$a_4=2$$$ (since $$$\\frac{lcm(2, 2)}{gcd(2, 2)}=\\frac{2}{2}=1=1^2$$$) and $$$a_2=8$$$ (since $$$\\frac{lcm(8,2)}{gcd(8, 2)}=\\frac{8}{2}=4=2^2$$$). Hence, $$$d_4=2$$$, and this is the maximal possible value $$$d_i$$$ in this array.<\/p><p>In the second test case, the initial array contains elements $$$[12, 3, 20, 5, 80, 1]$$$. The elements adjacent to $$$12$$$ are $$$\\{12, 3\\}$$$, the elements adjacent to $$$3$$$ are $$$\\{12, 3\\}$$$, the elements adjacent to $$$20$$$ are $$$\\{20, 5, 80\\}$$$, the elements adjacent to $$$5$$$ are $$$\\{20, 5, 80\\}$$$, the elements adjacent to $$$80$$$ are $$$\\{20, 5, 80\\}$$$, the elements adjacent to $$$1$$$ are $$$\\{1\\}$$$. After one second, the array is transformed into $$$[36, 36, 8000, 8000, 8000, 1]$$$.<\/p><\/div><\/div>"}, {"contestId": 817, "index": "D", "name": "Imbalanced Array", "rating": 1900, "solvedCount": 6837, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Imbalanced Array<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array <span class=\"tex-span\"><i>a<\/i><\/span> consisting of <span class=\"tex-span\"><i>n<\/i><\/span> elements. The <span class=\"tex-font-style-it\">imbalance value<\/span> of some subsegment of this array is the difference between the maximum and minimum element from this segment. The <span class=\"tex-font-style-it\">imbalance value<\/span> of the array is the sum of <span class=\"tex-font-style-it\">imbalance values<\/span> of all subsegments of this array.<\/p><p>For example, the <span class=\"tex-font-style-it\">imbalance value<\/span> of array <span class=\"tex-span\">[1,\u20094,\u20091]<\/span> is <span class=\"tex-span\">9<\/span>, because there are <span class=\"tex-span\">6<\/span> different subsegments of this array: <\/p><ul> <li> <span class=\"tex-span\">[1]<\/span> (from index <span class=\"tex-span\">1<\/span> to index <span class=\"tex-span\">1<\/span>), <span class=\"tex-font-style-it\">imbalance value<\/span> is <span class=\"tex-span\">0<\/span>; <\/li><li> <span class=\"tex-span\">[1,\u20094]<\/span> (from index <span class=\"tex-span\">1<\/span> to index <span class=\"tex-span\">2<\/span>), <span class=\"tex-font-style-it\">imbalance value<\/span> is <span class=\"tex-span\">3<\/span>; <\/li><li> <span class=\"tex-span\">[1,\u20094,\u20091]<\/span> (from index <span class=\"tex-span\">1<\/span> to index <span class=\"tex-span\">3<\/span>), <span class=\"tex-font-style-it\">imbalance value<\/span> is <span class=\"tex-span\">3<\/span>; <\/li><li> <span class=\"tex-span\">[4]<\/span> (from index <span class=\"tex-span\">2<\/span> to index <span class=\"tex-span\">2<\/span>), <span class=\"tex-font-style-it\">imbalance value<\/span> is <span class=\"tex-span\">0<\/span>; <\/li><li> <span class=\"tex-span\">[4,\u20091]<\/span> (from index <span class=\"tex-span\">2<\/span> to index <span class=\"tex-span\">3<\/span>), <span class=\"tex-font-style-it\">imbalance value<\/span> is <span class=\"tex-span\">3<\/span>; <\/li><li> <span class=\"tex-span\">[1]<\/span> (from index <span class=\"tex-span\">3<\/span> to index <span class=\"tex-span\">3<\/span>), <span class=\"tex-font-style-it\">imbalance value<\/span> is <span class=\"tex-span\">0<\/span>; <\/li><\/ul><p>You have to determine the <span class=\"tex-font-style-it\">imbalance value<\/span> of the array <span class=\"tex-span\"><i>a<\/i><\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup><\/span>) \u2014 size of the array <span class=\"tex-span\"><i>a<\/i><\/span>.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>... <i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup><\/span>) \u2014 elements of the array.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the <span class=\"tex-font-style-it\">imbalance value<\/span> of <span class=\"tex-span\"><i>a<\/i><\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>1 4 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>9<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 2180, "index": "C", "name": "XOR-factorization", "rating": 1900, "solvedCount": 6821, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. XOR-factorization<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p> <\/p><p>Ostad thinks that the usual way of factoring numbers is too mathematical, so he invented a new notion called <span class=\"tex-font-style-it\">XOR-factorization<\/span>, which is more computer-science-like. For a given integer $$$n$$$, a sequence of integers $$$a_1, a_2, \\ldots, a_k$$$ with $$$0 \\le a_i \\le n$$$ for all $$$i$$$ is called a <span class=\"tex-font-style-it\">XOR-factorization<\/span> of $$$n$$$ if and only if $$$$$$ a_1 \\oplus a_2 \\oplus \\cdots \\oplus a_k = n, $$$$$$ where $$$\\oplus$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#XOR\">bitwise XOR operation<\/a>. <\/p><p>You are given integers $$$n$$$ and $$$k$$$. Find a <span class=\"tex-font-style-it\">XOR-factorization<\/span> $$$a_1, a_2, \\ldots, a_k$$$ of $$$n$$$ that maximizes the sum $$$a_1 + a_2 + \\cdots + a_k$$$.<\/p><p>It can be proven that under the problem conditions, a <span class=\"tex-font-style-it\">XOR-factorization<\/span> always exists.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows. <\/p><p>Each of the next $$$t$$$ lines contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le n \\le 10^9$$$, $$$1 \\le k \\le 10^5$$$).<\/p><p>It is guaranteed that the sum of $$$k$$$ over all test cases does not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output $$$k$$$ integers $$$a_1, a_2, \\ldots, a_k$$$ such that $$$0 \\le a_i \\le n$$$.<\/p><p>We can show that an answer always exists. If there are multiple valid answers, you may print any of them in any order.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">8 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n<div class=\"test-example-line test-example-line-odd test-example-line-1\">1 4 5 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 4 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1<\/div><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, we can factor $$$5$$$ as $$$1 \\oplus 4 \\oplus 5 \\oplus 5$$$ with a sum of $$$15$$$, and it can be shown that no other <span class=\"tex-font-style-it\">XOR-factorization<\/span> has a higher sum.<\/p><p>In the second test case, we can factor $$$4$$$ as $$$4 \\oplus 4 \\oplus 4$$$ with a sum of $$$12$$$, which is trivially the maximum possible.<\/p><\/div><\/div>"}, {"contestId": 472, "index": "D", "name": "Design Tutorial: Inverse the Problem", "rating": 1900, "solvedCount": 6819, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Design Tutorial: Inverse the Problem<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>There is an easy way to obtain a new task from an old one called \"Inverse the problem\": we give an output of the original task, and ask to generate an input, such that solution to the original problem will produce the output we provided. The hard task of Topcoder Open 2014 Round 2C, InverseRMQ, is a good example.<\/p><p>Now let's create a task this way. We will use the task: you are given a tree, please calculate the distance between any pair of its nodes. Yes, it is very easy, but the inverse version is a bit harder: you are given an <span class=\"tex-span\"><i>n<\/i>\u2009\u00d7\u2009<i>n<\/i><\/span> distance matrix. Determine if it is the distance matrix of a weighted tree (all weights must be positive integers).<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20092000<\/span>) \u2014 the number of nodes in that graph.<\/p><p>Then next <span class=\"tex-span\"><i>n<\/i><\/span> lines each contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>d<\/i><sub class=\"lower-index\"><i>i<\/i>,\u2009<i>j<\/i><\/sub><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>d<\/i><sub class=\"lower-index\"><i>i<\/i>,\u2009<i>j<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) \u2014 the distance between node <span class=\"tex-span\"><i>i<\/i><\/span> and node <span class=\"tex-span\"><i>j<\/i><\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If there exists such a tree, output \"<span class=\"tex-font-style-tt\">YES<\/span>\", otherwise output \"<span class=\"tex-font-style-tt\">NO<\/span>\".<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>0 2 7<br/>2 0 9<br/>7 9 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>1 2 7<br/>2 0 9<br/>7 9 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>NO<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>0 2 2<br/>7 0 9<br/>7 9 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>NO<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>0 1 1<br/>1 0 1<br/>1 1 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>NO<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/>0 0<br/>0 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>NO<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, the required tree exists. It has one edge between nodes 1 and 2 with weight 2, another edge between nodes 1 and 3 with weight 7.<\/p><p>In the second example, it is impossible because <span class=\"tex-span\"><i>d<\/i><sub class=\"lower-index\">1,\u20091<\/sub><\/span> should be 0, but it is 1.<\/p><p>In the third example, it is impossible because <span class=\"tex-span\"><i>d<\/i><sub class=\"lower-index\">1,\u20092<\/sub><\/span> should equal <span class=\"tex-span\"><i>d<\/i><sub class=\"lower-index\">2,\u20091<\/sub><\/span>.<\/p><\/div><\/div>"}, {"contestId": 2059, "index": "D", "name": "Graph and Graph", "rating": 1900, "solvedCount": 6817, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Graph and Graph<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given two connected undirected graphs with the same number of vertices. In both graphs, there is a token located at some vertex. In the first graph, the token is initially at vertex $$$s_1$$$, and in the second graph, the token is initially at vertex $$$s_2$$$. The following operation is repeated an <span class=\"tex-font-style-bf\">infinite<\/span> number of times:<\/p><ul> <li> Let the token currently be at vertex $$$v_1$$$ in the first graph and at vertex $$$v_2$$$ in the second graph. <\/li><li> A vertex $$$u_1$$$, adjacent to $$$v_1$$$, is chosen in the first graph. <\/li><li> A vertex $$$u_2$$$, adjacent to $$$v_2$$$, is chosen in the second graph. <\/li><li> The tokens are moved to the chosen vertices: in the first graph, the token moves from $$$v_1$$$ to $$$u_1$$$, and in the second graph, from $$$v_2$$$ to $$$u_2$$$. <\/li><li> The cost of such an operation is equal to $$$|u_1 - u_2|$$$. <\/li><\/ul><p>Determine the minimum possible total cost of all operations or report that this value will be infinitely large.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test consists of multiple test cases. The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 500$$$)\u00a0\u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains three integers $$$n$$$, $$$s_1$$$, and $$$s_2$$$ ($$$2 \\le n \\le 1000$$$, $$$1 \\le s_1, s_2 \\le n$$$)\u00a0\u2014 the number of vertices in each graph, the number of the vertex in the first graph where the token is initially located, and the number of the vertex in the second graph where the token is initially located.<\/p><p>The second line of each test case contains one integer $$$m_1$$$ ($$$1 \\le m_1 \\le 1000$$$)\u00a0\u2014 the number of edges in the first graph.<\/p><p>The $$$i$$$-th of the following $$$m_1$$$ lines contains two integers $$$a_i$$$ and $$$b_i$$$ ($$$1 \\le a_i, b_i \\le n$$$, $$$a_i \\ne b_i$$$)\u00a0\u2014 the numbers of the endpoints of the $$$i$$$-th edge in the first graph.<\/p><p>The next line of each test case contains one integer $$$m_2$$$ ($$$1 \\le m_2 \\le 1000$$$)\u00a0\u2014 the number of edges in the second graph.<\/p><p>The $$$j$$$-th of the following $$$m_2$$$ lines contains two integers $$$c_j$$$ and $$$d_j$$$ ($$$1 \\le c_j, d_j \\le n$$$, $$$c_j \\ne d_j$$$)\u00a0\u2014 the numbers of the endpoints of the $$$j$$$-th edge in the second graph.<\/p><p>It is guaranteed that the sum of $$$n$$$, the sum of $$$m_1$$$, and the sum of $$$m_2$$$ over all test cases do not exceed $$$1000$$$.<\/p><p>It is guaranteed that both graphs are connected.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output one integer\u00a0\u2014 the minimum total cost of all operations or $$$-1$$$, if this value will be infinitely large.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 7 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 4<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n<div class=\"test-example-line test-example-line-odd test-example-line-1\">0<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">-1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7<\/div><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, an infinite sequence of transitions can be constructed to the vertices $$$2, 3, 4, 1, 2, 3, 4, 1, \\ldots$$$, along which the token can move in both the first and the second graphs.<\/p><p>In the second test case, it can be proven that the cost of any operation will be greater than $$$0$$$; therefore, the total cost of all operations will be infinitely large.<\/p><\/div><\/div>"}, {"contestId": 1207, "index": "E", "name": "XOR Guessing", "rating": 1900, "solvedCount": 6814, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. XOR Guessing<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is an interactive problem. Remember to flush your output while communicating with the testing program.<\/span> You may use <span class=\"tex-font-style-tt\">fflush(stdout)<\/span> in C++, <span class=\"tex-font-style-tt\">system.out.flush()<\/span> in Java, <span class=\"tex-font-style-tt\">stdout.flush()<\/span> in Python or <span class=\"tex-font-style-tt\">flush(output)<\/span> in Pascal to flush the output. If you use some other programming language, consult its documentation. You may also refer to the guide on interactive problems: <a href=\"https://codeforces.com/blog/entry/45307\">https://codeforces.com/blog/entry/45307<\/a>.<\/p><p>The jury picked an integer $$$x$$$ not less than $$$0$$$ and not greater than $$$2^{14} - 1$$$. You have to guess this integer.<\/p><p>To do so, you may ask no more than $$$2$$$ queries. Each query should consist of $$$100$$$ integer numbers $$$a_1$$$, $$$a_2$$$, ..., $$$a_{100}$$$ (each integer should be not less than $$$0$$$ and not greater than $$$2^{14} - 1$$$). In response to your query, the jury will pick one integer $$$i$$$ ($$$1 \\le i \\le 100$$$) and tell you the value of $$$a_i \\oplus x$$$ (the bitwise XOR of $$$a_i$$$ and $$$x$$$). There is an additional constraint on the queries: all $$$200$$$ integers you use in the queries should be distinct.<\/p><p><span class=\"tex-font-style-bf\">It is guaranteed that the value of $$$x$$$ is fixed beforehand in each test, but the choice of $$$i$$$ in every query may depend on the integers you send.<\/span><\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>To give the answer, your program should print one line $$$!$$$ $$$x$$$ <span class=\"tex-font-style-it\">with a line break in the end<\/span>. After that, it should flush the output and terminate gracefully.<\/p><\/div><div><div class=\"section-title\">Interaction<\/div><p>Before giving the answer, you may submit no more than $$$2$$$ queries. To ask a query, print one line in the following format: $$$?$$$ $$$a_1$$$ $$$a_2$$$ ... $$$a_{100}$$$, where every $$$a_j$$$ should be an integer from the range $$$[0, 2^{14} - 1]$$$. <span class=\"tex-font-style-it\">The line should be ended with a line break character<\/span>. After submitting a query, flush the output and read the answer to your query \u2014 the value of $$$a_i \\oplus x$$$ for some $$$i \\in [1, 100]$$$. <span class=\"tex-font-style-bf\">No integer can be used in queries more than once.<\/span><\/p><p>If you submit an incorrect query (or ask more than $$$2$$$ queries), the answer to it will be one integer $$$-1$$$. After receiving such an answer, your program should terminate immediately \u2014 otherwise you may receive verdict \"Runtime error\", \"Time limit exceeded\" or some other verdict instead of \"Wrong answer\".<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n0\n32<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n? 3 5 6\n? 32 24 37\n! 5<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The example of interaction <span class=\"tex-font-style-bf\">is not correct<\/span> \u2014 you should sumbit <span class=\"tex-font-style-bf\">exactly<\/span> $$$100$$$ integers in each query. Everything else is correct.<\/p><p><span class=\"tex-font-style-bf\">Hacks are forbidden in this problem<\/span>.<\/p><\/div><\/div>"}, {"contestId": 1920, "index": "D", "name": "Array Repetition", "rating": 1900, "solvedCount": 6774, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Array Repetition<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Jayden has an array $$$a$$$ which is initially empty. There are $$$n$$$ operations of two types he must perform in the given order.<\/p><ol> <li> Jayden appends an integer $$$x$$$ ($$$1 \\leq x \\leq n$$$) to the end of array $$$a$$$. <\/li><li> Jayden appends $$$x$$$ copies of array $$$a$$$ to the end of array $$$a$$$. In other words, array $$$a$$$ becomes $$$[a,\\underbrace{a,\\ldots,a}_{x}]$$$. It is guaranteed that he has done at least one operation of the first type before this. <\/li><\/ol><p>Jayden has $$$q$$$ queries. For each query, you must tell him the $$$k$$$-th element of array $$$a$$$. The elements of the array are numbered from $$$1$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test consists of multiple test cases. The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 5000$$$) \u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$q$$$ ($$$1 \\leq n, q \\leq 10^5$$$) \u2014 the number of operations and the number of queries.<\/p><p>The following $$$n$$$ lines describe the operations. Each line contains two integers $$$b$$$ and $$$x$$$ ($$$b \\in \\{1, 2\\}$$$), where $$$b$$$ denotes the type of operation. If $$$b=1$$$, then $$$x$$$ ($$$1 \\leq x \\leq n$$$) is the integer Jayden appends to the end of the array. If $$$b=2$$$, then $$$x$$$ ($$$1 \\leq x \\leq 10^9$$$) is the number of copies Jayden appends to the end of the array. <\/p><p>The next line of each test case contains $$$q$$$ integers $$$k_1, k_2, \\ldots, k_q$$$ ($$$1 \\leq k_i \\leq \\min(10^{18}, c)$$$), which denote the queries, where $$$c$$$ is the size of the array after finishing all $$$n$$$ operations.<\/p><p>It is guaranteed that the sum of $$$n$$$ and the sum of $$$q$$$ over all test cases does not exceed $$$10^5$$$. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output $$$q$$$ integers \u2014 answers to Jayden's queries.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 3 4 5 6 14 15 16 20<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">10 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 15<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 9<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 12<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">32752 25178 3198 3199 2460 2461 31450 33260 9016 4996<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">12 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 11<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 392130334<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 744811750<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 209373780<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 178928984<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 658326464<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 1000000000<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">914576963034536490 640707385283752918 636773368365261971 584126563607944922 1000000000000000000<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 2 1 2 3 1 2 3 1 3\n9 8 1 3 1 3 6 3 8 8\n11 11 11 10 11\n1 2\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case:<\/p><ul><li> After the first operation $$$a = [1]$$$;<\/li><li> After the second operation $$$a = [1, 2]$$$;<\/li><li> After the third operation $$$a = [1, 2, 1, 2]$$$;<\/li><li> After the fourth operation $$$a = [1, 2, 1, 2, 3]$$$;<\/li><li> After the fifth operation $$$a = [1, 2, 1, 2, 3, 1, 2, 1, 2, 3, 1, 2, 1, 2, 3, 1, 2, 1, 2, 3]$$$.<\/li><\/ul><p>In the fourth test case, after all operations $$$a = [1, 2]$$$.<\/p><\/div><\/div>"}, {"contestId": 1251, "index": "D", "name": "Salary Changing", "rating": 1900, "solvedCount": 6756, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Salary Changing<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are the head of a large enterprise. $$$n$$$ people work at you, and $$$n$$$ is odd (i.\u2009e. $$$n$$$ is not divisible by $$$2$$$).<\/p><p>You have to distribute salaries to your employees. Initially, you have $$$s$$$ dollars for it, and the $$$i$$$-th employee should get a salary from $$$l_i$$$ to $$$r_i$$$ dollars. You have to distribute salaries in such a way that the median salary is <span class=\"tex-font-style-it\">maximum possible<\/span>.<\/p><p>To find the median of a sequence of odd length, you have to sort it and take the element in the middle position after sorting. For example:<\/p><ul> <li> the median of the sequence $$$[5, 1, 10, 17, 6]$$$ is $$$6$$$, <\/li><li> the median of the sequence $$$[1, 2, 1]$$$ is $$$1$$$. <\/li><\/ul><p>It is guaranteed that you have enough money to pay the minimum salary, i.e $$$l_1 + l_2 + \\dots + l_n \\le s$$$.<\/p><p><span class=\"tex-font-style-bf\">Note that you don't have to spend all your $$$s$$$ dollars on salaries.<\/span><\/p><p>You have to answer $$$t$$$ test cases.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 2 \\cdot 10^5$$$) \u2014 the number of test cases.<\/p><p>The first line of each query contains two integers $$$n$$$ and $$$s$$$ ($$$1 \\le n  \\lt  2 \\cdot 10^5$$$, $$$1 \\le s \\le 2 \\cdot 10^{14}$$$) \u2014 the number of employees and the amount of money you have. The value $$$n$$$ is not divisible by $$$2$$$.<\/p><p>The following $$$n$$$ lines of each query contain the information about employees. The $$$i$$$-th line contains two integers $$$l_i$$$ and $$$r_i$$$ ($$$1 \\le l_i \\le r_i \\le 10^9$$$).<\/p><p>It is guaranteed that the sum of all $$$n$$$ over all queries does not exceed $$$2 \\cdot 10^5$$$.<\/p><p>It is also guaranteed that you have enough money to pay the minimum salary to each employee, i.\u2009e. $$$\\sum\\limits_{i=1}^{n} l_i \\le s$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case print one integer \u2014 the maximum median salary that you can obtain.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n3 26\n10 12\n1 4\n10 11\n1 1337\n1 1000000000\n5 26\n4 4\n2 4\n6 8\n5 6\n2 7\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n11\n1337\n6\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, you can distribute salaries as follows: $$$sal_1 = 12, sal_2 = 2, sal_3 = 11$$$ ($$$sal_i$$$ is the salary of the $$$i$$$-th employee). Then the median salary is $$$11$$$.<\/p><p>In the second test case, you have to pay $$$1337$$$ dollars to the only employee.<\/p><p>In the third test case, you can distribute salaries as follows: $$$sal_1 = 4, sal_2 = 3, sal_3 = 6, sal_4 = 6, sal_5 = 7$$$. Then the median salary is $$$6$$$.<\/p><\/div><\/div>"}, {"contestId": 1508, "index": "A", "name": "Binary Literature", "rating": 1900, "solvedCount": 6753, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A. Binary Literature<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>A bitstring is a string that contains only the characters <span class=\"tex-font-style-tt\">0<\/span> and <span class=\"tex-font-style-tt\">1<\/span>.<\/p><p>Koyomi Kanou is working hard towards her dream of becoming a writer. To practice, she decided to participate in the <span class=\"tex-font-style-it\">Binary Novel Writing Contest<\/span>. The writing prompt for the contest consists of three bitstrings of length $$$2n$$$. A valid novel for the contest is a bitstring of length at most $$$3n$$$ that contains <span class=\"tex-font-style-bf\">at least two<\/span> of the three given strings as subsequences.<\/p><p>Koyomi has just received the three prompt strings from the contest organizers. Help her write a valid novel for the contest.<\/p><p>A string $$$a$$$ is a subsequence of a string $$$b$$$ if $$$a$$$ can be obtained from $$$b$$$ by deletion of several (possibly, zero) characters.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$) \u2014 the number of test cases.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 10^5$$$).<\/p><p>Each of the following three lines contains a bitstring of length $$$2n$$$. It is guaranteed that these three strings are pairwise distinct.<\/p><p>It is guaranteed that the sum of $$$n$$$ across all test cases does not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print a single line containing a bitstring of length at most $$$3n$$$ that has at least two of the given bitstrings as subsequences.<\/p><p>It can be proven that under the constraints of the problem, such a bitstring always exists.<\/p><p>If there are multiple possible answers, you may output any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n1\n00\n11\n01\n3\n011001\n111010\n010001\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n010\n011001010\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the bitstrings <span class=\"tex-font-style-tt\">00<\/span> and <span class=\"tex-font-style-tt\">01<\/span> are subsequences of the output string: <span class=\"tex-font-style-tt\"><span class=\"tex-font-style-bf\">0<\/span>1<span class=\"tex-font-style-bf\">0<\/span><\/span> and <span class=\"tex-font-style-tt\"><span class=\"tex-font-style-bf\">01<\/span>0<\/span>. Note that <span class=\"tex-font-style-tt\">11<\/span> is not a subsequence of the output string, but this is not required.<\/p><p>In the second test case all three input strings are subsequences of the output string: <span class=\"tex-font-style-tt\"><span class=\"tex-font-style-bf\">011<\/span>0<span class=\"tex-font-style-bf\">0<\/span>1<span class=\"tex-font-style-bf\">01<\/span>0<\/span>, <span class=\"tex-font-style-tt\">0<span class=\"tex-font-style-bf\">11<\/span>00<span class=\"tex-font-style-bf\">1010<\/span><\/span> and <span class=\"tex-font-style-tt\"><span class=\"tex-font-style-bf\">0<\/span>1<span class=\"tex-font-style-bf\">100<\/span>1<span class=\"tex-font-style-bf\">01<\/span>0<\/span>.<\/p><\/div><\/div>"}, {"contestId": 914, "index": "D", "name": "Bash and a Tough Math Puzzle", "rating": 1900, "solvedCount": 6749, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Bash and a Tough Math Puzzle<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Bash likes playing with arrays. He has an array <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009... <i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> of <span class=\"tex-span\"><i>n<\/i><\/span> integers. He likes to guess the greatest common divisor (gcd) of different segments of the array. Of course, sometimes the guess is not correct. However, Bash will be satisfied if his guess is <span class=\"tex-font-style-it\">almost correct<\/span>.<\/p><p>Suppose he guesses that the gcd of the elements in the range <span class=\"tex-span\">[<i>l<\/i>,\u2009<i>r<\/i>]<\/span> of <span class=\"tex-span\"><i>a<\/i><\/span> is <span class=\"tex-span\"><i>x<\/i><\/span>. He considers the guess to be almost correct if he can change <span class=\"tex-font-style-bf\">at most<\/span> one element in the segment such that the gcd of the segment is <span class=\"tex-span\"><i>x<\/i><\/span> after making the change. Note that when he guesses, he doesn't actually change the array \u2014 he just wonders if the gcd of the segment can be made <span class=\"tex-span\"><i>x<\/i><\/span>. Apart from this, he also sometimes makes changes to the array itself.<\/p><p>Since he can't figure it out himself, Bash wants you to tell him which of his guesses are almost correct. Formally, you have to process <span class=\"tex-span\"><i>q<\/i><\/span> queries of one of the following forms:<\/p><ul> <li> <span class=\"tex-span\">1\u2009<i>l<\/i>\u2009<i>r<\/i>\u2009<i>x<\/i><\/span> \u2014 Bash guesses that the gcd of the range <span class=\"tex-span\">[<i>l<\/i>,\u2009<i>r<\/i>]<\/span> is <span class=\"tex-span\"><i>x<\/i><\/span>. Report if this guess is almost correct. <\/li><li> <span class=\"tex-span\">2\u2009<i>i<\/i>\u2009<i>y<\/i><\/span> \u2014 Bash sets <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> to <span class=\"tex-span\"><i>y<\/i><\/span>. <\/li><\/ul><p><span class=\"tex-font-style-bf\">Note:<\/span> The array is <span class=\"tex-span\">1<\/span>-indexed.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20095\u00b710<sup class=\"upper-index\">5<\/sup><\/span>) \u00a0\u2014 the size of the array.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) \u00a0\u2014 the elements of the array.<\/p><p>The third line contains an integer <span class=\"tex-span\"><i>q<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>q<\/i>\u2009\u2264\u20094\u00b710<sup class=\"upper-index\">5<\/sup><\/span>) \u00a0\u2014 the number of queries.<\/p><p>The next <span class=\"tex-span\"><i>q<\/i><\/span> lines describe the queries and may have one of the following forms:<\/p><ul> <li> <span class=\"tex-span\">1\u2009<i>l<\/i>\u2009<i>r<\/i>\u2009<i>x<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009<i>n<\/i>,\u20091\u2009\u2264\u2009<i>x<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>). <\/li><li> <span class=\"tex-span\">2\u2009<i>i<\/i>\u2009<i>y<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>n<\/i>,\u20091\u2009\u2264\u2009<i>y<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup>)<\/span>. <\/li><\/ul><p>Guaranteed, that there is at least one query of first type.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query of first type, output <span class=\"tex-font-style-tt\">\"YES\"<\/span> (without quotes) if Bash's guess is almost correct and <span class=\"tex-font-style-tt\">\"NO\"<\/span> (without quotes) otherwise.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>2 6 3<br/>4<br/>1 1 2 2<br/>1 1 3 3<br/>2 1 9<br/>1 1 3 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/>YES<br/>NO<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1 2 3 4 5<br/>6<br/>1 1 4 2<br/>2 3 6<br/>1 1 4 2<br/>1 1 5 2<br/>2 5 10<br/>1 1 5 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>NO<br/>YES<br/>NO<br/>YES<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample, the array initially is <span class=\"tex-span\">{2,\u20096,\u20093}<\/span>. <\/p><p>For query <span class=\"tex-span\">1<\/span>, the first two numbers already have their gcd as <span class=\"tex-span\">2<\/span>.<\/p><p>For query <span class=\"tex-span\">2<\/span>, we can achieve a gcd of <span class=\"tex-span\">3<\/span> by changing the first element of the array to <span class=\"tex-span\">3<\/span>. Note that the changes made during queries of type <span class=\"tex-span\">1<\/span> are temporary and do not get reflected in the array. <\/p><p>After query <span class=\"tex-span\">3<\/span>, the array is now <span class=\"tex-span\">{9,\u20096,\u20093}<\/span>.<\/p><p> For query <span class=\"tex-span\">4<\/span>, no matter which element you change, you cannot get the gcd of the range to be <span class=\"tex-span\">2<\/span>. <\/p><\/div><\/div>"}, {"contestId": 2001, "index": "D", "name": "Longest Max Min Subsequence", "rating": 1900, "solvedCount": 6690, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Longest Max Min Subsequence<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an integer sequence $$$a_1, a_2, \\ldots, a_n$$$. Let $$$S$$$ be the set of all possible non-empty subsequences of $$$a$$$ without duplicate elements. Your goal is to find the longest sequence in $$$S$$$. If there are multiple of them, find the one that minimizes lexicographical order after multiplying terms at odd positions by $$$-1$$$.<\/p><p>For example, given $$$a = [3, 2, 3, 1]$$$, $$$S = \\{[1], [2], [3], [2, 1], [2, 3], [3, 1], [3, 2], [2, 3, 1], [3, 2, 1]\\}$$$. Then $$$[2, 3, 1]$$$ and $$$[3, 2, 1]$$$ would be the longest, and $$$[3, 2, 1]$$$ would be the answer since $$$[-3, 2, -1]$$$ is lexicographically smaller than $$$[-2, 3, -1]$$$.<\/p><p>A sequence $$$c$$$ is a subsequence of a sequence $$$d$$$ if $$$c$$$ can be obtained from $$$d$$$ by the deletion of several (possibly, zero or all) elements.<\/p><p>A sequence $$$c$$$ is lexicographically smaller than a sequence $$$d$$$ if and only if one of the following holds:<\/p><ul><li> $$$c$$$ is a prefix of $$$d$$$, but $$$c \\ne d$$$;<\/li><li> in the first position where $$$c$$$ and $$$d$$$ differ, the sequence $$$c$$$ has a smaller element than the corresponding element in $$$d$$$.<\/li><\/ul><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 5 \\cdot 10^4$$$). The description of the test cases follows.<\/p><p>The first line of each test case contains an integer $$$n$$$ ($$$1 \\le n \\le 3 \\cdot 10^5$$$) \u2014 the length of $$$a$$$.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le n$$$) \u2014 the sequence $$$a$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$3 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output the answer in the following format:<\/p><p>Output an integer $$$m$$$ in the first line \u2014 the length of $$$b$$$.<\/p><p>Then output $$$m$$$ integers $$$b_1, b_2, \\ldots, b_m$$$ in the second line \u2014 the sequence $$$b$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 2 1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 1 1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 2 1 3 2 1 3 2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n3 2 1\n1\n1\n3\n3 1 2\n1\n1\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">10<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 2 1 7 9 7 2 5 5 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">10<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 2 8 7 7 9 8 1 9 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">9 1 7 5 8 5 6 4 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">3 3 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">1 6 4 4 6 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">6<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">3 4 4 5 3 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-9\">10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-9\">4 1 4 5 4 5 10 1 5 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-10\">7<\/div><div class=\"test-example-line test-example-line-even test-example-line-10\">1 2 1 3 2 4 6<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n1 2\n5\n5 1 9 7 2\n2\n1 2\n6\n2 7 9 8 1 6\n7\n9 1 7 5 8 6 4\n1\n3\n4\n1 4 6 5\n3\n4 5 3\n4\n5 4 10 1\n5\n2 1 3 4 6\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, $$$S = \\{[1], [2], [3], [1, 3], [2, 1], [2, 3], [3, 1], [3, 2], [2, 1, 3], [3, 2, 1]\\}$$$. Among them, $$$[2, 1, 3]$$$ and $$$[3, 2, 1]$$$ are the longest and $$$[-3, 2, -1]$$$ is lexicographical smaller than $$$[-2, 1, -3]$$$, so $$$[3, 2, 1]$$$ is the answer.<\/p><p>In the second example, $$$S = \\{[1]\\}$$$, so $$$[1]$$$ is the answer.<\/p><\/div><\/div>"}, {"contestId": 2165, "index": "B", "name": "Marble Council", "rating": 1900, "solvedCount": 6658, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Marble Council<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p> <\/p><p>You are given a multiset $$$a$$$, which consists of $$$n$$$ integers $$$a_1,a_2,\\ldots,a_n$$$. You would like to generate a new multiset $$$s$$$ through the following procedure:<\/p><ul> <li> Partition $$$a$$$ into any number of non-empty multisets $$$x_1,x_2,\\ldots,x_k$$$, such that each element of $$$a$$$ belongs to exactly one of these multisets. <\/li><li> Initially, $$$s$$$ is empty. From each $$$x_i$$$, choose <span class=\"tex-font-style-bf\">one<\/span> of its <span class=\"tex-font-style-bf\">modes<\/span>$$$^{\\text{\u2217}}$$$ and insert it into $$$s$$$. <\/li><\/ul><p>Please count the number of different multisets $$$s$$$ that can be generated through the procedure, modulo $$$998\\,244\\,353$$$.<\/p><p>Please note that the number of different <span class=\"tex-font-style-bf\">multisets<\/span> is counted, which means that the order of elements does not matter. However, the count of each element does matter, i.e. $$$\\{1,1,2\\},\\{1,2\\},\\{1,1,2,2\\}$$$ are all considered different.<\/p><div class=\"statement-footnote\"><p>$$$^{\\text{\u2217}}$$$The mode of a multiset is defined as the element which appears the most; if several elements are tied as the maximum, then all of them are considered modes.<\/p><\/div><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 5000$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1\\le n\\le5000$$$)\u00a0\u2014 the size of multiset $$$a$$$.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1,a_2,\\ldots,a_n$$$ ($$$1\\le a_i\\le n$$$).<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$5000$$$. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print one line containing a single integer\u00a0\u2014 the number of different multisets you can obtain, modulo $$$998\\,244\\,353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">10<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 1 1 1 2 2 2 3 3 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 1 1 2 2 2 3 3 3 4<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n<div class=\"test-example-line test-example-line-odd test-example-line-1\">7<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">111<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">126<\/div><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, any non-empty subset of $$$\\{1,2,3\\}$$$ can be achieved, for a total of $$$7$$$ multisets.<\/p><p>In the third test case, we can generate $$$4$$$ different multisets:<\/p><ul> <li> Partition the elements into set $$$\\{1,2,2\\}$$$, resulting in multiset $$$\\{2\\}$$$. <\/li><li> Partition the elements into sets $$$\\{1,2\\},\\{2\\}$$$, resulting in multiset $$$\\{2,2\\}$$$. <\/li><li> Partition the elements into sets $$$\\{1\\},\\{2,2\\}$$$, resulting in multiset $$$\\{1,2\\}$$$. <\/li><li> Partition the elements into sets $$$\\{1\\},\\{2\\},\\{2\\}$$$, resulting in multiset $$$\\{1,2,2\\}$$$. <\/li><\/ul><p>It can be proven that no other multisets are possible.<\/p><\/div><\/div>"}, {"contestId": 510, "index": "D", "name": "Fox And Jumping", "rating": 1900, "solvedCount": 6637, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Fox And Jumping<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Fox Ciel is playing a game. In this game there is an infinite long tape with cells indexed by integers (positive, negative and zero). At the beginning she is standing at the cell 0.<\/p><p>There are also <span class=\"tex-span\"><i>n<\/i><\/span> cards, each card has 2 attributes: length <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and cost <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. If she pays <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> dollars then she can apply <span class=\"tex-span\"><i>i<\/i><\/span>-th card. After applying <span class=\"tex-span\"><i>i<\/i><\/span>-th card she becomes able to make jumps of length <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, i. e. from cell <span class=\"tex-span\"><i>x<\/i><\/span> to cell <span class=\"tex-span\">(<i>x<\/i>\u2009-\u2009<i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>)<\/span> or cell <span class=\"tex-span\">(<i>x<\/i>\u2009+\u2009<i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>)<\/span>.<\/p><p>She wants to be able to jump to any cell on the tape (possibly, visiting some intermediate cells). For achieving this goal, she wants to buy some cards, paying as little money as possible. <\/p><p>If this is possible, calculate the minimal cost.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009300<\/span>), number of cards.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> numbers <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>), the jump lengths of cards.<\/p><p>The third line contains <span class=\"tex-span\"><i>n<\/i><\/span> numbers <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>), the costs of cards.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If it is impossible to buy some cards and become able to jump to any cell, output -1. Otherwise output the minimal cost of buying such set of cards.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>100 99 9900<br/>1 1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>10 20 30 40 50<br/>1 1 1 1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>-1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>7<br/>15015 10010 6006 4290 2730 2310 1<br/>1 1 1 1 1 1 10<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>8<br/>4264 4921 6321 6984 2316 8432 6120 1026<br/>4264 4921 6321 6984 2316 8432 6120 1026<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>7237<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In first sample test, buying one card is not enough: for example, if you buy a card with length 100, you can't jump to any cell whose index is not a multiple of 100. The best way is to buy first and second card, that will make you be able to jump to any cell.<\/p><p>In the second sample test, even if you buy all cards, you can't jump to any cell whose index is not a multiple of 10, so you should output -1.<\/p><\/div><\/div>"}, {"contestId": 1702, "index": "G1", "name": "Passable Paths (easy version)", "rating": 1900, "solvedCount": 6607, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G1. Passable Paths (easy version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is an easy version of the problem. The only difference between an easy and a hard version is in the number of queries.<\/span><\/p><p>Polycarp grew a tree from $$$n$$$ vertices. We remind you that a tree of $$$n$$$ vertices is an undirected connected graph of $$$n$$$ vertices and $$$n-1$$$ edges that does not contain cycles.<\/p><p>He calls a set of vertices <span class=\"tex-font-style-it\">passable<\/span> if there is such a path in the tree that passes through each vertex of this set without passing through any edge twice. The path can visit other vertices (not from this set).<\/p><p>In other words, a set of vertices is called <span class=\"tex-font-style-it\">passable<\/span> if there is a simple path that passes through all the vertices of this set (and possibly some other).<\/p><p>For example, for a tree below sets $$$\\{3, 2, 5\\}$$$, $$$\\{1, 5, 4\\}$$$, $$$\\{1, 4\\}$$$ are <span class=\"tex-font-style-it\">passable<\/span>, and $$$\\{1, 3, 5\\}$$$, $$$\\{1, 2, 3, 4, 5\\}$$$ are not.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/cfe93bddddfda002f10c5d044dba57f35d7be253.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"189px\"/> <\/center><p>Polycarp asks you to answer $$$q$$$ queries. Each query is a set of vertices. For each query, you need to determine whether the corresponding set of vertices is <span class=\"tex-font-style-bf\">passable<\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains a single integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$) \u2014 number of vertices.<\/p><p>Following $$$n - 1$$$ lines a description of the tree..<\/p><p>Each line contains two integers $$$u$$$ and $$$v$$$ ($$$1 \\le u, v \\le n$$$, $$$u \\ne v$$$) \u2014 indices of vertices connected by an edge.<\/p><p>Following line contains single integer $$$q$$$ ($$$1 \\le q \\le 5$$$)\u00a0\u2014 number of queries.<\/p><p>The following $$$2 \\cdot q$$$ lines contain descriptions of sets.<\/p><p>The first line of the description contains an integer $$$k$$$ ($$$1 \\le k \\le n$$$) \u2014 the size of the set.<\/p><p>The second line of the description contains $$$k$$$ of distinct integers $$$p_1, p_2, \\dots, p_k$$$ ($$$1 \\le p_i \\le n$$$) \u2014 indices of the vertices of the set.<\/p><p>It is guaranteed that the sum of $$$k$$$ values for all queries does not exceed $$$2 \\cdot 10^5$

iv class=\"input\"><div class=\"title\">Input<\/div><pre>\n0 0\n0 1\n1\nL\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n-1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example the ship should perform the following sequence of moves: \"<span class=\"tex-font-style-tt\">RRRRU<\/span>\". Then its coordinates will change accordingly: $$$(0, 0)$$$ $$$\\rightarrow$$$ $$$(1, 1)$$$ $$$\\rightarrow$$$ $$$(2, 2)$$$ $$$\\rightarrow$$$ $$$(3, 3)$$$ $$$\\rightarrow$$$ $$$(4, 4)$$$ $$$\\rightarrow$$$ $$$(4, 6)$$$.<\/p><p>In the second example the ship should perform the following sequence of moves: \"<span class=\"tex-font-style-tt\">DD<\/span>\" (the third day it should stay in place). Then its coordinates will change accordingly: $$$(0, 3)$$$ $$$\\rightarrow$$$ $$$(0, 3)$$$ $$$\\rightarrow$$$ $$$(0, 1)$$$ $$$\\rightarrow$$$ $$$(0, 0)$$$.<\/p><p>In the third example the ship can never reach the point $$$(0, 1)$$$.<\/p><\/div><\/div>"}, {"contestId": 1627, "index": "D", "name": "Not Adding", "rating": 1900, "solvedCount": 9615, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Not Adding<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You have an array $$$a_1, a_2, \\dots, a_n$$$ consisting of $$$n$$$ <span class=\"tex-font-style-bf\">distinct<\/span> integers. You are allowed to perform the following operation on it:<\/p><ul> <li> Choose two elements from the array $$$a_i$$$ and $$$a_j$$$ ($$$i \\ne j$$$) such that $$$\\gcd(a_i, a_j)$$$ is not present in the array, and add $$$\\gcd(a_i, a_j)$$$ to the end of the array. Here $$$\\gcd(x, y)$$$ denotes <a href=\"https://en.wikipedia.org/wiki/Greatest_common_divisor\">greatest common divisor (GCD)<\/a> of integers $$$x$$$ and $$$y$$$. <\/li><\/ul><p>Note that the array changes after each operation, and the subsequent operations are performed on the new array.<\/p><p>What is the <span class=\"tex-font-style-bf\">maximum<\/span> number of times you can perform the operation on the array?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line consists of a single integer $$$n$$$ ($$$2 \\le n \\le 10^6$$$).<\/p><p>The second line consists of $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\leq a_i \\leq 10^6$$$). All $$$a_i$$$ are <span class=\"tex-font-style-bf\">distinct<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output a single line containing one integer\u00a0\u2014 the maximum number of times the operation can be performed on the given array.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n4 20 1 25 30\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n6 10 15\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, one of the ways to perform maximum number of operations on the array is: <\/p><ul> <li> Pick $$$i = 1, j= 5$$$ and add $$$\\gcd(a_1, a_5) = \\gcd(4, 30) = 2$$$ to the array. <\/li><li> Pick $$$i = 2, j= 4$$$ and add $$$\\gcd(a_2, a_4) = \\gcd(20, 25) = 5$$$ to the array. <\/li><li> Pick $$$i = 2, j= 5$$$ and add $$$\\gcd(a_2, a_5) = \\gcd(20, 30) = 10$$$ to the array. <\/li><\/ul><p>It can be proved that there is no way to perform more than $$$3$$$ operations on the original array.<\/p><p>In the second example one can add $$$3$$$, then $$$1$$$, then $$$5$$$, and $$$2$$$.<\/p><\/div><\/div>"}, {"contestId": 1348, "index": "D", "name": "Phoenix and Science", "rating": 1900, "solvedCount": 9420, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Phoenix and Science<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Phoenix has decided to become a scientist! He is currently investigating the growth of bacteria.<\/p><p>Initially, on day $$$1$$$, there is one bacterium with mass $$$1$$$.<\/p><p>Every day, some number of bacteria will split (possibly zero or all). When a bacterium of mass $$$m$$$ splits, it becomes two bacteria of mass $$$\\frac{m}{2}$$$ each. For example, a bacterium of mass $$$3$$$ can split into two bacteria of mass $$$1.5$$$.<\/p><p>Also, every night, the mass of every bacteria will increase by one.<\/p><p>Phoenix is wondering if it is possible for the total mass of all the bacteria to be exactly $$$n$$$. If it is possible, he is interested in the way to obtain that mass using the minimum possible number of nights. Help him become the best scientist!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The input consists of multiple test cases. The first line contains an integer $$$t$$$ ($$$1 \\le t \\le 1000$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains an integer $$$n$$$ ($$$2 \\le n \\le 10^9$$$)\u00a0\u2014 the sum of bacteria masses that Phoenix is interested in. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, if there is no way for the bacteria to exactly achieve total mass $$$n$$$, print <span class=\"tex-font-style-tt\">-1<\/span>. Otherwise, print two lines.<\/p><p>The first line should contain an integer $$$d$$$ \u00a0\u2014 the minimum number of nights needed.<\/p><p>The next line should contain $$$d$$$ integers, with the $$$i$$$-th integer representing the number of bacteria that should split on the $$$i$$$-th day.<\/p><p>If there are multiple solutions, print any.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n9\n11\n2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n1 0 2 \n3\n1 1 2\n1\n0 <\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the following process results in bacteria with total mass $$$9$$$: <\/p><ul> <li> Day $$$1$$$: The bacterium with mass $$$1$$$ splits. There are now two bacteria with mass $$$0.5$$$ each. <\/li><li> Night $$$1$$$: All bacteria's mass increases by one. There are now two bacteria with mass $$$1.5$$$. <\/li><li> Day $$$2$$$: None split. <\/li><li> Night $$$2$$$: There are now two bacteria with mass $$$2.5$$$. <\/li><li> Day $$$3$$$: Both bacteria split. There are now four bacteria with mass $$$1.25$$$. <\/li><li> Night $$$3$$$: There are now four bacteria with mass $$$2.25$$$. <\/li><\/ul> The total mass is $$$2.25+2.25+2.25+2.25=9$$$. It can be proved that $$$3$$$ is the minimum number of nights needed. There are also other ways to obtain total mass 9 in 3 nights.<p>$$$ $$$<\/p><p>In the second test case, the following process results in bacteria with total mass $$$11$$$: <\/p><ul> <li> Day $$$1$$$: The bacterium with mass $$$1$$$ splits. There are now two bacteria with mass $$$0.5$$$. <\/li><li> Night $$$1$$$: There are now two bacteria with mass $$$1.5$$$. <\/li><li> Day $$$2$$$: One bacterium splits. There are now three bacteria with masses $$$0.75$$$, $$$0.75$$$, and $$$1.5$$$. <\/li><li> Night $$$2$$$: There are now three bacteria with masses $$$1.75$$$, $$$1.75$$$, and $$$2.5$$$. <\/li><li> Day $$$3$$$: The bacteria with mass $$$1.75$$$ and the bacteria with mass $$$2.5$$$ split. There are now five bacteria with masses $$$0.875$$$, $$$0.875$$$, $$$1.25$$$, $$$1.25$$$, and $$$1.75$$$. <\/li><li> Night $$$3$$$: There are now five bacteria with masses $$$1.875$$$, $$$1.875$$$, $$$2.25$$$, $$$2.25$$$, and $$$2.75$$$. <\/li><\/ul> The total mass is $$$1.875+1.875+2.25+2.25+2.75=11$$$. It can be proved that $$$3$$$ is the minimum number of nights needed. There are also other ways to obtain total mass 11 in 3 nights.<p>$$$ $$$<\/p><p>In the third test case, the bacterium does not split on day $$$1$$$, and then grows to mass $$$2$$$ during night $$$1$$$.<\/p><\/div><\/div>"}, {"contestId": 1369, "index": "D", "name": "TediousLee", "rating": 1900, "solvedCount": 9307, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. TediousLee<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-it\">Lee tried so hard to make a good div.2 D problem to balance his recent contest, but it still doesn't feel good at all. Lee invented it so tediously slow that he managed to develop a phobia about div.2 D problem setting instead. And now he is hiding behind the bushes...<\/span><\/p><p>Let's define a <span class=\"tex-font-style-it\">Rooted Dead Bush<\/span> (RDB) of level $$$n$$$ as a rooted tree constructed as described below.<\/p><p>A rooted dead bush of level $$$1$$$ is a single vertex. To construct an RDB of level $$$i$$$ we, at first, construct an RDB of level $$$i-1$$$, then for each vertex $$$u$$$: <\/p><ul> <li> if $$$u$$$ has no children then we will add a single child to it; <\/li><li> if $$$u$$$ has one child then we will add two children to it; <\/li><li> if $$$u$$$ has more than one child, then we will skip it. <\/li><\/ul><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/bc12fd72ff405f3dcf8fe43f587b14f1c73980df.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <span class=\"tex-font-size-small\">Rooted Dead Bushes of level $$$1$$$, $$$2$$$ and $$$3$$$.<\/span> <\/center><p>Let's define a <span class=\"tex-font-style-it\">claw<\/span> as a rooted tree with four vertices: one root vertex (called also as center) with three children. It looks like a claw:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/ff8c77743c7564e79908d96e47ac908de64f2369.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <span class=\"tex-font-size-small\">The center of the claw is the vertex with label $$$1$$$.<\/span> <\/center><p>Lee has a Rooted Dead Bush of level $$$n$$$. Initially, all vertices of his RDB are green.<\/p><p>In one move, he can choose a claw in his RDB, if all vertices in the claw are <span class=\"tex-font-style-it\">green<\/span> and all vertices of the claw are children of its center, then he colors the claw's vertices in yellow.<\/p><p>He'd like to know the maximum number of yellow vertices he can achieve. Since the answer might be very large, print it modulo $$$10^9+7$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>Next $$$t$$$ lines contain test cases\u00a0\u2014 one per line.<\/p><p>The first line of each test case contains one integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^6$$$)\u00a0\u2014 the level of Lee's RDB.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print a single integer\u00a0\u2014 the maximum number of yellow vertices Lee can make modulo $$$10^9 + 7$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7\n1\n2\n3\n4\n5\n100\n2000000\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n0\n4\n4\n12\n990998587\n804665184\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>It's easy to see that the answer for RDB of level $$$1$$$ or $$$2$$$ is $$$0$$$.<\/p><p>The answer for RDB of level $$$3$$$ is $$$4$$$ since there is only one claw we can choose: $$$\\{1, 2, 3, 4\\}$$$.<\/p><p>The answer for RDB of level $$$4$$$ is $$$4$$$ since we can choose either single claw $$$\\{1, 3, 2, 4\\}$$$ or single claw $$$\\{2, 7, 5, 6\\}$$$. There are no other claws in the RDB of level $$$4$$$ (for example, we can't choose $$$\\{2, 1, 7, 6\\}$$$, since $$$1$$$ is not a child of center vertex $$$2$$$).<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/e328eb531653ffb0449ef2ae13f3d80242b3c8af.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <span class=\"tex-font-size-small\">Rooted Dead Bush of level 4.<\/span> <\/center><\/div><\/div>"}, {"contestId": 463, "index": "C", "name": "Gargari and Bishops", "rating": 1900, "solvedCount": 9292, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Gargari and Bishops<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Gargari is jealous that his friend Caisa won the game from the previous problem. He wants to prove that he is a genius.<\/p><p>He has a <span class=\"tex-span\"><i>n<\/i>\u2009\u00d7\u2009<i>n<\/i><\/span> chessboard. Each cell of the chessboard has a number written on it. Gargari wants to place two bishops on the chessboard in such a way that there is no cell that is attacked by both of them. Consider a cell with number <span class=\"tex-span\"><i>x<\/i><\/span> written on it, if this cell is attacked by one of the bishops Gargari will get <span class=\"tex-span\"><i>x<\/i><\/span> dollars for it. Tell Gargari, how to place bishops on the chessboard to get maximum amount of money.<\/p><p>We assume a cell is attacked by a bishop, if the cell is located on the same diagonal with the bishop (the cell, where the bishop is, also considered attacked by it).<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer <span class=\"tex-span\"><i>n<\/i><\/span> <span class=\"tex-span\">(2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20092000)<\/span>. Each of the next <span class=\"tex-span\"><i>n<\/i><\/span> lines contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>ij<\/i><\/sub><\/span> <span class=\"tex-span\">(0\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>ij<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup>)<\/span> \u2014 description of the chessboard.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>On the first line print the maximal number of dollars Gargari will get. On the next line print four integers: <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>x<\/i><sub class=\"lower-index\">2<\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\">2<\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>x<\/i><sub class=\"lower-index\">2<\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\">2<\/sub>\u2009\u2264\u2009<i>n<\/i>)<\/span>, where <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is the number of the row where the <span class=\"tex-span\"><i>i<\/i><\/span>-th bishop should be placed, <span class=\"tex-span\"><i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is the number of the column where the <span class=\"tex-span\"><i>i<\/i><\/span>-th bishop should be placed. Consider rows are numbered from 1 to <span class=\"tex-span\"><i>n<\/i><\/span> from top to bottom, and columns are numbered from 1 to <span class=\"tex-span\"><i>n<\/i><\/span> from left to right.<\/p><p>If there are several optimal solutions, you can print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>1 1 1 1<br/>2 1 1 0<br/>1 1 1 0<br/>1 0 0 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>12<br/>2 2 3 2<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 687, "index": "C", "name": "The Values You Can Make", "rating": 1900, "solvedCount": 9238, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. The Values You Can Make<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Pari wants to buy an expensive chocolate from Arya. She has <span class=\"tex-span\"><i>n<\/i><\/span> coins, the value of the <span class=\"tex-span\"><i>i<\/i><\/span>-th coin is <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. The price of the chocolate is <span class=\"tex-span\"><i>k<\/i><\/span>, so Pari will take a subset of her coins with sum equal to <span class=\"tex-span\"><i>k<\/i><\/span> and give it to Arya.<\/p><p>Looking at her coins, a question came to her mind: after giving the coins to Arya, what values does Arya can make with them? She is jealous and she doesn't want Arya to make a lot of values. So she wants to know all the values <span class=\"tex-span\"><i>x<\/i><\/span>, such that Arya will be able to make <span class=\"tex-span\"><i>x<\/i><\/span> using some subset of coins with the sum <span class=\"tex-span\"><i>k<\/i><\/span>.<\/p><p>Formally, Pari wants to know the values <span class=\"tex-span\"><i>x<\/i><\/span> such that there exists a subset of coins with the sum <span class=\"tex-span\"><i>k<\/i><\/span> such that some subset of this subset has the sum <span class=\"tex-span\"><i>x<\/i><\/span>, i.e. there is exists some way to pay for the chocolate, such that Arya will be able to make the sum <span class=\"tex-span\"><i>x<\/i><\/span> using these coins.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2009\u2264\u2009\u2009<i>n<\/i>,\u2009<i>k<\/i>\u2009\u2009\u2264\u2009\u2009500<\/span>)\u00a0\u2014 the number of coins and the price of the chocolate, respectively.<\/p><p>Next line will contain <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>c<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009500<\/span>)\u00a0\u2014 the values of Pari's coins.<\/p><p>It's guaranteed that one can make value <span class=\"tex-span\"><i>k<\/i><\/span> using these coins.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>First line of the output must contain a single integer <span class=\"tex-span\"><i>q<\/i><\/span>\u2014 the number of suitable values <span class=\"tex-span\"><i>x<\/i><\/span>. Then print <span class=\"tex-span\"><i>q<\/i><\/span> integers in ascending order\u00a0\u2014 the values that Arya can make for some subset of coins of Pari that pays for the chocolate.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>6 18<br/>5 6 1 10 12 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>16<br/>0 1 2 3 5 6 7 8 10 11 12 13 15 16 17 18 <br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 50<br/>25 25 50<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/>0 25 50 <br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1527, "index": "B2", "name": "Palindrome Game (hard version)", "rating": 1900, "solvedCount": 8896, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B2. Palindrome Game (hard version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">The only difference between the easy and hard versions is that the given string $$$s$$$ in the easy version is initially a palindrome, this condition is not always true for the hard version.<\/span><\/p><p>A palindrome is a string that reads the same left to right and right to left. For example, \"<span class=\"tex-font-style-tt\">101101<\/span>\" is a palindrome, while \"<span class=\"tex-font-style-tt\">0101<\/span>\" is not.<\/p><p>Alice and Bob are playing a game on a string $$$s$$$ of length $$$n$$$ consisting of the characters '<span class=\"tex-font-style-tt\">0<\/span>' and '<span class=\"tex-font-style-tt\">1<\/span>'. Both players take alternate turns with Alice going first.<\/p><p>In each turn, the player can perform one of the following operations: <\/p><ol> <li> Choose any $$$i$$$ ($$$1 \\le i \\le n$$$), where $$$s[i] =$$$ '<span class=\"tex-font-style-tt\">0<\/span>' and change $$$s[i]$$$ to '<span class=\"tex-font-style-tt\">1<\/span>'. Pay 1 dollar. <\/li><li> Reverse the whole string, pay 0 dollars. This operation is only allowed if the string is currently <span class=\"tex-font-style-bf\">not<\/span> a palindrome, and the last operation was not reverse. That is, if Alice reverses the string, then Bob can't reverse in the next move, and vice versa. <\/li><\/ol><p>Reversing a string means reordering its letters from the last to the first. For example, \"<span class=\"tex-font-style-tt\">01001<\/span>\" becomes \"<span class=\"tex-font-style-tt\">10010<\/span>\" after reversing.<\/p><p>The game ends when every character of string becomes '<span class=\"tex-font-style-tt\">1<\/span>'. The player who spends minimum dollars till this point wins the game and it is a draw if both spend equal dollars. If both players play optimally, output whether Alice wins, Bob wins, or if it is a draw.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^3$$$). Then $$$t$$$ test cases follow.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 10^3$$$).<\/p><p>The second line of each test case contains the string $$$s$$$ of length $$$n$$$, consisting of the characters '<span class=\"tex-font-style-tt\">0<\/span>' and '<span class=\"tex-font-style-tt\">1<\/span>'. It is guaranteed that the string $$$s$$$ contains at least one '<span class=\"tex-font-style-tt\">0<\/span>'.<\/p><p>Note that there is no limit on the sum of $$$n$$$ over test cases.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case print a single word in a new line: <\/p><ul> <li> \"<span class=\"tex-font-style-tt\">ALICE<\/span>\", if Alice will win the game, <\/li><li> \"<span class=\"tex-font-style-tt\">BOB<\/span>\", if Bob will win the game, <\/li><li> \"<span class=\"tex-font-style-tt\">DRAW<\/span>\", if the game ends in a draw. <\/li><\/ul><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n3\n110\n2\n00\n4\n1010\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nALICE\nBOB\nALICE\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case of example, <\/p><ul> <li> in the $$$1$$$-st move, Alice will use the $$$2$$$-nd operation to reverse the string, since doing the $$$1$$$-st operation will result in her loss anyway. This also forces Bob to use the $$$1$$$-st operation. <\/li><li> in the $$$2$$$-nd move, Bob has to perform the $$$1$$$-st operation, since the $$$2$$$-nd operation cannot be performed twice in a row. All characters of the string are '<span class=\"tex-font-style-tt\">1<\/span>', game over. <\/li><\/ul> Alice spends $$$0$$$ dollars while Bob spends $$$1$$$ dollar. Hence, Alice wins.<p>In the second test case of example, <\/p><ul> <li> in the $$$1$$$-st move Alice has to perform the $$$1$$$-st operation, since the string is currently a palindrome. <\/li><li> in the $$$2$$$-nd move Bob reverses the string. <\/li><li> in the $$$3$$$-rd move Alice again has to perform the $$$1$$$-st operation. All characters of the string are '<span class=\"tex-font-style-tt\">1<\/span>', game over. <\/li><\/ul> Alice spends $$$2$$$ dollars while Bob spends $$$0$$$ dollars. Hence, Bob wins.<\/div><\/div>"}, {"contestId": 1358, "index": "D", "name": "The Best Vacation", "rating": 1900, "solvedCount": 8845, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. The Best Vacation<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You've been in love with Coronavirus-chan for a long time, but you didn't know where she lived until now. And just now you found out that she lives in a faraway place called Naha. <\/p><p>You immediately decided to take a vacation and visit Coronavirus-chan. Your vacation lasts exactly $$$x$$$ days and that's the exact number of days you will spend visiting your friend. You will spend exactly $$$x$$$ consecutive (successive) days visiting Coronavirus-chan.<\/p><p>They use a very unusual calendar in Naha: there are $$$n$$$ months in a year, $$$i$$$-th month lasts exactly $$$d_i$$$ days. Days in the $$$i$$$-th month are numbered from $$$1$$$ to $$$d_i$$$. There are no leap years in Naha.<\/p><p>The mood of Coronavirus-chan (and, accordingly, her desire to hug you) depends on the number of the day in a month. In particular, you get $$$j$$$ hugs if you visit Coronavirus-chan on the $$$j$$$-th day of the month.<\/p><p>You know about this feature of your friend and want to plan your trip to get as many hugs as possible (and then maybe you can win the heart of Coronavirus-chan). <\/p><p>Please note that your trip should <span class=\"tex-font-style-bf\">not necessarily<\/span> begin and end in the same year.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains two integers $$$n$$$ and $$$x$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$) \u2014 the number of months in the year and the number of days you can spend with your friend.<\/p><p>The second line contains $$$n$$$ integers $$$d_1, d_2, \\ldots, d_n$$$, $$$d_i$$$ is the number of days in the $$$i$$$-th month ($$$1 \\le d_i \\le 10^6$$$).<\/p><p>It is guaranteed that $$$1 \\le x \\le d_1 + d_2 + \\ldots + d_n$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the maximum number of hugs that you can get from Coronavirus-chan during the best vacation in your life.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 2\n1 3 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 6\n3 3 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n12<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 6\n4 2 3 1 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n15<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the numbers of the days in a year are (indices of days in a corresponding month) $$$\\{1,1,2,3,1\\}$$$. Coronavirus-chan will hug you the most if you come on the third day of the year: $$$2+3=5$$$ hugs.<\/p><p>In the second test case, the numbers of the days are $$$\\{1,2,3,1,2,3,1,2,3\\}$$$. You will get the most hugs if you arrive on the third day of the year: $$$3+1+2+3+1+2=12$$$ hugs.<\/p><p>In the third test case, the numbers of the days are $$$\\{1,2,3,4,1,2, 1,2,3, 1, 1,2,3\\}$$$. You will get the most hugs if you come on the twelfth day of the year: your friend will hug you $$$2+3+1+2+3+4=15$$$ times. <\/p><\/div><\/div>"}, {"contestId": 1285, "index": "D", "name": "Dr. Evil Underscores", "rating": 1900, "solvedCount": 8822, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Dr. Evil Underscores<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Today, as a friendship gift, Bakry gave Badawy $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ and challenged him to choose an integer $$$X$$$ such that the value $$$\\underset{1 \\leq i \\leq n}{\\max} (a_i \\oplus X)$$$ is minimum possible, where $$$\\oplus$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#XOR\">bitwise XOR operation<\/a>.<\/p><p>As always, Badawy is too lazy, so you decided to help him and find the minimum possible value of $$$\\underset{1 \\leq i \\leq n}{\\max} (a_i \\oplus X)$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integer $$$n$$$ ($$$1\\le n \\le 10^5$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$0 \\le a_i \\le 2^{30}-1$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the minimum possible value of $$$\\underset{1 \\leq i \\leq n}{\\max} (a_i \\oplus X)$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n1 2 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n1 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample, we can choose $$$X = 3$$$.<\/p><p>In the second sample, we can choose $$$X = 5$$$.<\/p><\/div><\/div>"}, {"contestId": 25, "index": "C", "name": "Roads in Berland", "rating": 1900, "solvedCount": 8792, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Roads in Berland<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>There are <span class=\"tex-span\"><i>n<\/i><\/span> cities numbered from 1 to <span class=\"tex-span\"><i>n<\/i><\/span> in Berland. Some of them are connected by two-way roads. Each road has its own length \u2014 an integer number from 1 to 1000. It is known that from each city it is possible to get to any other city by existing roads. Also for each pair of cities it is known the shortest distance between them. Berland Government plans to build <span class=\"tex-span\"><i>k<\/i><\/span> new roads. For each of the planned road it is known its length, and what cities it will connect. To control the correctness of the construction of new roads, after the opening of another road Berland government wants to check the sum of the shortest distances between all pairs of cities. Help them \u2014 for a given matrix of shortest distances on the old roads and plans of all new roads, find out how the sum of the shortest distances between all pairs of cities changes after construction of each road.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009300<\/span>) \u2014 amount of cities in Berland. Then there follow <span class=\"tex-span\"><i>n<\/i><\/span> lines with <span class=\"tex-span\"><i>n<\/i><\/span> integer numbers each \u2014 the matrix of shortest distances. <span class=\"tex-span\"><i>j<\/i><\/span>-th integer in the <span class=\"tex-span\"><i>i<\/i><\/span>-th row \u2014 <span class=\"tex-span\"><i>d<\/i><sub class=\"lower-index\"><i>i<\/i>,\u2009<i>j<\/i><\/sub><\/span>, the shortest distance between cities <span class=\"tex-span\"><i>i<\/i><\/span> and <span class=\"tex-span\"><i>j<\/i><\/span>. It is guaranteed that <span class=\"tex-span\"><i>d<\/i><sub class=\"lower-index\"><i>i<\/i>,\u2009<i>i<\/i><\/sub>\u2009=\u20090,\u2009<i>d<\/i><sub class=\"lower-index\"><i>i<\/i>,\u2009<i>j<\/i><\/sub>\u2009=\u2009<i>d<\/i><sub class=\"lower-index\"><i>j<\/i>,\u2009<i>i<\/i><\/sub><\/span>, and a given matrix is a matrix of shortest distances for some set of two-way roads with integer lengths from 1 to 1000, such that from each city it is possible to get to any other city using these roads.<\/p><p>Next line contains integer <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u2009300<\/span>) \u2014 amount of planned roads. Following <span class=\"tex-span\"><i>k<\/i><\/span> lines contain the description of the planned roads. Each road is described by three space-separated integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>,\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2260\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u20091\u2009\u2264\u2009<i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u20091000<\/span>) \u2014 <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> \u2014 pair of cities, which the road connects, <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> \u2014 the length of the road. It can be several roads between a pair of cities, but no road connects the city with itself.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output <span class=\"tex-span\"><i>k<\/i><\/span> space-separated integers <span class=\"tex-span\"><i>q<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>k<\/i><\/span>). <span class=\"tex-span\"><i>q<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> should be equal to the sum of shortest distances between all pairs of cities after the construction of roads with indexes from 1 to <span class=\"tex-span\"><i>i<\/i><\/span>. Roads are numbered from 1 in the input order. Each pair of cities should be taken into account in the sum exactly once, i. e. we count unordered pairs.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/>0 5<br/>5 0<br/>1<br/>1 2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3 <\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>0 4 5<br/>4 0 9<br/>5 9 0<br/>2<br/>2 3 8<br/>1 2 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>17 12 <\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1365, "index": "E", "name": "Maximum Subsequence Value", "rating": 1900, "solvedCount": 8494, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Maximum Subsequence Value<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Ridhiman challenged Ashish to find the maximum valued subsequence of an array $$$a$$$ of size $$$n$$$ consisting of positive integers. <\/p><p>The value of a non-empty subsequence of $$$k$$$ elements of $$$a$$$ is defined as $$$\\sum 2^i$$$ over all integers $$$i \\ge 0$$$ such that at least $$$\\max(1, k - 2)$$$ elements of the subsequence have the $$$i$$$-th bit set in their binary representation (value $$$x$$$ has the $$$i$$$-th bit set in its binary representation if $$$\\lfloor \\frac{x}{2^i} \\rfloor \\mod 2$$$ is equal to $$$1$$$). <\/p><p>Recall that $$$b$$$ is a subsequence of $$$a$$$, if $$$b$$$ can be obtained by deleting some(possibly zero) elements from $$$a$$$.<\/p><p>Help Ashish find the maximum value he can get by choosing some subsequence of $$$a$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input consists of a single integer $$$n$$$ $$$(1 \\le n \\le 500)$$$\u00a0\u2014 the size of $$$a$$$.<\/p><p>The next line consists of $$$n$$$ space-separated integers\u00a0\u2014 the elements of the array $$$(1 \\le a_i \\le 10^{18})$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer\u00a0\u2014 the maximum value Ashish can get by choosing some subsequence of $$$a$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n2 1 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n3 1 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n7<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1\n1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n7 7 1 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n7<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first test case, Ashish can pick the subsequence $$$\\{{2, 3}\\}$$$ of size $$$2$$$. The binary representation of $$$2$$$ is <span class=\"tex-font-style-tt\">10<\/span> and that of $$$3$$$ is <span class=\"tex-font-style-tt\">11<\/span>. Since $$$\\max(k - 2, 1)$$$ is equal to $$$1$$$, the value of the subsequence is $$$2^0 + 2^1$$$ (both $$$2$$$ and $$$3$$$ have $$$1$$$-st bit set in their binary representation and $$$3$$$ has $$$0$$$-th bit set in its binary representation). Note that he could also pick the subsequence $$$\\{{3\\}}$$$ or $$$\\{{2, 1, 3\\}}$$$.<\/p><p>For the second test case, Ashish can pick the subsequence $$$\\{{3, 4\\}}$$$ with value $$$7$$$.<\/p><p>For the third test case, Ashish can pick the subsequence $$$\\{{1\\}}$$$ with value $$$1$$$.<\/p><p>For the fourth test case, Ashish can pick the subsequence $$$\\{{7, 7\\}}$$$ with value $$$7$$$.<\/p><\/div><\/div>"}, {"contestId": 808, "index": "D", "name": "Array Division", "rating": 1900, "solvedCount": 8476, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Array Division<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Vasya has an array <span class=\"tex-span\"><i>a<\/i><\/span> consisting of positive integer numbers. Vasya wants to divide this array into two non-empty consecutive parts (the prefix and the suffix) so that the sum of all elements in the first part equals to the sum of elements in the second part. It is not always possible, so Vasya will move some element before dividing the array (Vasya will erase some element and insert it into an arbitrary position).<\/p><p><span class=\"tex-font-style-bf\">Inserting an element in the same position he was erased from is also considered moving.<\/span><\/p><p>Can Vasya divide the array after choosing the right element to move and its new position?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains single integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009100000<\/span>) \u2014 the size of the array.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>... <i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) \u2014 the elements of the array.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-font-style-tt\">YES<\/span> if Vasya can divide the array after moving one element. Otherwise print <span class=\"tex-font-style-tt\">NO<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>1 3 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1 2 3 4 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>NO<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>2 2 3 4 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example Vasya can move the second element to the end of the array.<\/p><p>In the second example no move can make the division possible.<\/p><p>In the third example Vasya can move the fourth element by one position to the left.<\/p><\/div><\/div>"}, {"contestId": 1114, "index": "D", "name": "Flood Fill", "rating": 1900, "solvedCount": 8430, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Flood Fill<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a line of $$$n$$$ colored squares in a row, numbered from $$$1$$$ to $$$n$$$ from left to right. The $$$i$$$-th square initially has the color $$$c_i$$$.<\/p><p>Let's say, that two squares $$$i$$$ and $$$j$$$ belong to the same connected component if $$$c_i = c_j$$$, and $$$c_i = c_k$$$ for all $$$k$$$ satisfying $$$i  \\lt  k  \\lt  j$$$. In other words, all squares on the segment from $$$i$$$ to $$$j$$$ should have the same color.<\/p><p>For example, the line $$$[3, 3, 3]$$$ has $$$1$$$ connected component, while the line $$$[5, 2, 4, 4]$$$ has $$$3$$$ connected components.<\/p><p>The game \"flood fill\" is played on the given line as follows: <\/p><ul> <li> At the start of the game you pick any starting square (this is not counted as a turn). <\/li><li> Then, in each game turn, change the color of the connected component containing the starting square to any other color. <\/li><\/ul><p>Find the minimum number of turns needed for the entire line to be changed into a single color.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$1 \\le n \\le 5000$$$)\u00a0\u2014 the number of squares.<\/p><p>The second line contains integers $$$c_1, c_2, \\ldots, c_n$$$ ($$$1 \\le c_i \\le 5000$$$)\u00a0\u2014 the initial colors of the squares.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer\u00a0\u2014 the minimum number of the turns needed.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n5 2 2 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n8\n4 5 2 2 1 3 5 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1\n4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, a possible way to achieve an optimal answer is to pick square with index $$$2$$$ as the starting square and then play as follows:<\/p><ul> <li> $$$[5, 2, 2, 1]$$$ <\/li><li> $$$[5, 5, 5, 1]$$$ <\/li><li> $$$[1, 1, 1, 1]$$$ <\/li><\/ul><p>In the second example, a possible way to achieve an optimal answer is to pick square with index $$$5$$$ as the starting square and then perform recoloring into colors $$$2, 3, 5, 4$$$ in that order.<\/p><p>In the third example, the line already consists of one color only.<\/p><\/div><\/div>"}, {"contestId": 1272, "index": "E", "name": "Nearest Opposite Parity", "rating": 1900, "solvedCount": 8427, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Nearest Opposite Parity<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ consisting of $$$n$$$ integers. In one move, you can jump from the position $$$i$$$ to the position $$$i - a_i$$$ (if $$$1 \\le i - a_i$$$) or to the position $$$i + a_i$$$ (if $$$i + a_i \\le n$$$).<\/p><p>For each position $$$i$$$ from $$$1$$$ to $$$n$$$ you want to know the minimum the number of moves required to reach any position $$$j$$$ such that $$$a_j$$$ has the opposite parity from $$$a_i$$$ (i.e. if $$$a_i$$$ is odd then $$$a_j$$$ has to be even and vice versa).<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains one integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$) \u2014 the number of elements in $$$a$$$.<\/p><p>The second line of the input contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le n$$$), where $$$a_i$$$ is the $$$i$$$-th element of $$$a$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$n$$$ integers $$$d_1, d_2, \\dots, d_n$$$, where $$$d_i$$$ is the minimum the number of moves required to reach any position $$$j$$$ such that $$$a_j$$$ has the opposite parity from $$$a_i$$$ (i.e. if $$$a_i$$$ is odd then $$$a_j$$$ has to be even and vice versa) or <span class=\"tex-font-style-tt\">-1<\/span> if it is impossible to reach such a position.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n10\n4 5 7 6 7 5 4 4 6 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 1 1 2 -1 1 1 3 1 1 \n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1360, "index": "G", "name": "A/B Matrix", "rating": 1900, "solvedCount": 8421, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. A/B Matrix<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given four positive integers $$$n$$$, $$$m$$$, $$$a$$$, $$$b$$$ ($$$1 \\le b \\le n \\le 50$$$; $$$1 \\le a \\le m \\le 50$$$). Find any such rectangular matrix of size $$$n \\times m$$$ that satisfies all of the following conditions:<\/p><ul> <li> each row of the matrix contains exactly $$$a$$$ ones; <\/li><li> each column of the matrix contains exactly $$$b$$$ ones; <\/li><li> all other elements are zeros. <\/li><\/ul><p>If the desired matrix does not exist, indicate this.<\/p><p>For example, for $$$n=3$$$, $$$m=6$$$, $$$a=2$$$, $$$b=1$$$, there exists a matrix satisfying the conditions above:<\/p><p>$$$$$$ \\begin{vmatrix} 0 &amp; 1 &amp; 0 &amp; 0 &amp; 0 &amp; 1 \\\\ 1 &amp; 0 &amp; 0 &amp; 1 &amp; 0 &amp; 0 \\\\ 0 &amp; 0 &amp; 1 &amp; 0 &amp; 1 &amp; 0 \\end{vmatrix} $$$$$$<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$t$$$ ($$$1 \\le t \\le 1000$$$)\u00a0\u2014 the number of test cases. Then $$$t$$$ test cases follow.<\/p><p>Each test case is described by four positive integers $$$n$$$, $$$m$$$, $$$a$$$, $$$b$$$ ($$$1 \\le b \\le n \\le 50$$$; $$$1 \\le a \\le m \\le 50$$$), where $$$n$$$ and $$$m$$$ are the sizes of the matrix, and $$$a$$$ and $$$b$$$ are the number of ones for rows and columns, respectively.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case print:<\/p><ul> <li> \"YES\" (without quotes) and the required matrix (if there are several answers, print any) if it exists, or <\/li><li> \"NO\" (without quotes) if it does not exist. <\/li><\/ul><p>To print the matrix $$$n \\times m$$$, print $$$n$$$ rows, each of which consists of $$$m$$$ numbers $$$0$$$ or $$$1$$$ describing a row of the matrix. Numbers must be printed <span class=\"tex-font-style-bf\">without spaces<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n3 6 2 1\n2 2 2 1\n2 2 2 2\n4 4 2 2\n2 1 1 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\n010001\n100100\n001010\nNO\nYES\n11\n11\nYES\n1100\n1100\n0011\n0011\nYES\n1\n1\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1404, "index": "B", "name": "Tree Tag", "rating": 1900, "solvedCount": 8410, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Tree Tag<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Alice and Bob are playing a fun game of tree tag.<\/p><p>The game is played on a tree of $$$n$$$ vertices numbered from $$$1$$$ to $$$n$$$. Recall that a tree on $$$n$$$ vertices is an undirected, connected graph with $$$n-1$$$ edges.<\/p><p>Initially, Alice is located at vertex $$$a$$$, and Bob at vertex $$$b$$$. They take turns alternately, and Alice makes the first move. In a move, Alice can jump to a vertex with distance <span class=\"tex-font-style-bf\">at most<\/span> $$$da$$$ from the current vertex. And in a move, Bob can jump to a vertex with distance <span class=\"tex-font-style-bf\">at most<\/span> $$$db$$$ from the current vertex. The distance between two vertices is defined as the number of edges on the unique simple path between them. In particular, either player is allowed to stay at the same vertex in a move. Note that when performing a move, a player only occupies the starting and ending vertices of their move, not the vertices between them.<\/p><p>If after at most $$$10^{100}$$$ moves, Alice and Bob occupy the same vertex, then Alice is declared the winner. Otherwise, Bob wins.<\/p><p>Determine the winner if both players play optimally.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). Description of the test cases follows.<\/p><p>The first line of each test case contains five integers $$$n,a,b,da,db$$$ ($$$2\\le n\\le 10^5$$$, $$$1\\le a,b\\le n$$$, $$$a\\ne b$$$, $$$1\\le da,db\\le n-1$$$) \u00a0\u2014 the number of vertices, Alice's vertex, Bob's vertex, Alice's maximum jumping distance, and Bob's maximum jumping distance, respectively.<\/p><p>The following $$$n-1$$$ lines describe the edges of the tree. The $$$i$$$-th of these lines contains two integers $$$u$$$, $$$v$$$ ($$$1\\le u, v\\le n, u\\ne v$$$), denoting an edge between vertices $$$u$$$ and $$$v$$$. It is guaranteed that these edges form a tree structure.<\/p><p>It is guaranteed that the sum of $$$n$$$ across all test cases does not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single line containing the winner of the game: \"<span class=\"tex-font-style-tt\">Alice<\/span>\" or \"<span class=\"tex-font-style-tt\">Bob<\/span>\".<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n4 3 2 1 2\n1 2\n1 3\n1 4\n6 6 1 2 5\n1 2\n6 5\n2 3\n3 4\n4 5\n9 3 9 2 5\n1 2\n1 6\n1 9\n1 3\n9 5\n7 9\n4 8\n4 3\n11 8 11 3 3\n1 2\n11 9\n4 9\n6 5\n2 10\n3 2\n5 9\n8 3\n7 4\n7 10\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nAlice\nBob\nAlice\nAlice\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, Alice can win by moving to vertex $$$1$$$. Then wherever Bob moves next, Alice will be able to move to the same vertex on the next move.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/269c22dac4414bd0a2d4da395d6275012b417659.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>In the second test case, Bob has the following strategy to win. Wherever Alice moves, Bob will always move to whichever of the two vertices $$$1$$$ or $$$6$$$ is farthest from Alice.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/6106622be1c0326442f081d3da499738f41f6066.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 1977, "index": "C", "name": "Nikita and LCM", "rating": 1900, "solvedCount": 8242, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Nikita and LCM<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Nikita is a student passionate about number theory and algorithms. He faces an interesting problem related to an array of numbers.<\/p><p>Suppose Nikita has an array of integers $$$a$$$ of length $$$n$$$. He will call a subsequence$$$^\\dagger$$$ of the array <span class=\"tex-font-style-it\">special<\/span> if its <a href=\"https://en.wikipedia.org/wiki/Least_common_multiple\">least common multiple (LCM)<\/a> is not contained in $$$a$$$. The LCM of an empty subsequence is equal to $$$0$$$.<\/p><p>Nikita wonders: what is the length of the longest <span class=\"tex-font-style-it\">special<\/span> subsequence of $$$a$$$? Help him answer this question!<\/p><p>$$$^\\dagger$$$ A sequence $$$b$$$ is a subsequence of $$$a$$$ if $$$b$$$ can be obtained from $$$a$$$ by the deletion of several (possibly, zero or all) elements, without changing the order of the remaining elements. For example, $$$[5,2,3]$$$ is a subsequence of $$$[1,5,7,8,2,4,3]$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line of input contains a single integer $$$t$$$ ($$$1 \\le t \\le 2000$$$)\u00a0\u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 2000$$$)\u00a0\u2014 the length of the array $$$a$$$.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$)\u00a0\u2014 the elements of the array $$$a$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer\u00a0\u2014 the length of the longest <span class=\"tex-font-style-it\">special<\/span> subsequence of $$$a$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 4 8 16<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 2 10 20 60 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 3 4 6 12 100003 1200036<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">9<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 42 7 3 6 7 7 1 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4 99 57 179 10203 2 11 40812<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n4\n4\n5\n8\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the LCM of any non-empty subsequence is contained in $$$a$$$, so the answer is $$$0$$$.<\/p><p>In the second test case, we can take the subsequence $$$[3, 2, 10, 1]$$$, its LCM is equal to $$$30$$$, which is not contained in $$$a$$$.<\/p><p>In the third test case, we can take the subsequence $$$[2, 3, 6, 100\\,003]$$$, its LCM is equal to $$$600\\,018$$$, which is not contained in $$$a$$$.<\/p><\/div><\/div>"}, {"contestId": 1854, "index": "A2", "name": "Dual (Hard Version)", "rating": 1900, "solvedCount": 8121, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">A2. Dual (Hard Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><div class=\"epigraph\"><div class=\"epigraph-text\"><span class=\"tex-font-style-it\"><a href=\"https://soundcloud.com/popskyy/popskyy-tiasu-dual\">Popskyy &amp; tiasu - Dual<\/a><\/span><\/div><div class=\"epigraph-source\">\u2800<\/div><\/div><p><span class=\"tex-font-style-bf\">The only difference between the two versions of this problem is the constraint on the maximum number of operations. You can make hacks only if all versions of the problem are solved.<\/span><\/p><p>You are given an array $$$a_1, a_2,\\dots, a_n$$$ of integers (positive, negative or $$$0$$$). You can perform multiple operations on the array (possibly $$$0$$$ operations).<\/p><p>In one operation, you choose $$$i, j$$$ ($$$1 \\leq i, j \\leq n$$$, they can be equal) and set $$$a_i := a_i + a_j$$$ (i.e., add $$$a_j$$$ to $$$a_i$$$).<\/p><p>Make the array non-decreasing (i.e., $$$a_i \\leq a_{i+1}$$$ for $$$1 \\leq i \\leq n-1$$$) in at most $$$31$$$ operations. You do not need to minimize the number of operations.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 500$$$). The description of the test cases follows.<\/p><p>The first line contains a single integer $$$n$$$ ($$$1 \\le n \\le 20$$$) \u2014 the length of the array.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$-20 \\le a_i \\le 20$$$) \u2014 the array before performing the operations.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output your operations in the following format.<\/p><p>The first line should contain an integer $$$k$$$ ($$$0 \\le k \\le 31$$$) \u2014 the number of operations.<\/p><p>The next $$$k$$$ lines represent the $$$k$$$ operations in order. Each of these $$$k$$$ lines should contain two integers $$$i$$$ and $$$j$$$ ($$$1 \\leq i, j \\leq n$$$) \u2014 the corresponding operation consists in adding $$$a_j$$$ to $$$a_i$$$.<\/p><p>After all the operations, the array $$$a_1, a_2,\\dots, a_n$$$ must be non-decreasing.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2 -10 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 1 1 1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">8<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">0 0 0 0 0 0 0 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 2 -4 3 -10<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">10<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">11 12 13 14 15 -15 -16 -17 -18 -19<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">1 9 3 -4 -3 -2 -1<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">10 9 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-9\">20<\/div><div class=\"test-example-line test-example-line-odd test-example-line-9\">1 -14 2 -10 6 -5 10 -13 10 7 -14 19 -5 19 1 18 -16 -7 12 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-10\">20<\/div><div class=\"test-example-line test-example-line-even test-example-line-10\">-15 -17 -13 8 14 -13 10 -4 11 -4 -16 -6 15 -4 -2 7 -9 5 -5 17<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n2 1\n3\n4 4\n4 4\n3 4\n4\n2 1\n3 1\n4 1\n5 1\n0\n7\n3 4\n3 4\n5 4\n5 4\n5 4\n5 4\n5 4\n15\n6 1\n6 1\n6 1\n7 2\n7 2\n7 2\n8 3\n8 3\n8 3\n9 4\n9 4\n9 4\n10 5\n10 5\n10 5\n8\n3 4\n3 4\n2 4\n2 4\n2 4\n2 4\n1 4\n1 4\n3\n2 1\n3 1\n3 1\n31\n14 1\n18 7\n13 11\n15 11\n6 4\n5 17\n19 6\n19 12\n10 5\n11 12\n1 17\n15 19\n16 10\n14 2\n16 11\n20 7\n7 6\n9 5\n3 6\n6 14\n17 18\n18 14\n12 3\n17 16\n8 18\n13 16\n9 8\n14 8\n16 2\n11 8\n12 7\n31\n5 12\n19 13\n9 1\n5 17\n18 19\n6 16\n15 8\n6 9\n15 14\n7 10\n19 7\n17 20\n14 4\n15 20\n4 3\n1 8\n16 12\n16 15\n5 6\n12 10\n11 15\n20 3\n20 19\n13 14\n11 14\n18 10\n7 3\n12 17\n4 7\n13 2\n11 13\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, by adding $$$a_1 = 2$$$ to $$$a_2$$$, we get the array $$$[2, 3]$$$ which is non-decreasing.<\/p><p>In the second test case, the array changes as: <\/p><ul> <li> $$$[1, 2, -10, 3]$$$ <\/li><li> $$$[1, 2, -10, 6]$$$ <\/li><li> $$$[1, 2, -10, 12]$$$ <\/li><li> $$$[1, 2, 2, 12]$$$ <\/li><\/ul><p>In the third test case, the final array is $$$[2, 3, 3, 3, 3]$$$.<\/p><\/div><\/div>"}, {"contestId": 1475, "index": "G", "name": "Strange Beauty", "rating": 1900, "solvedCount": 8114, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. Strange Beauty<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Polycarp found on the street an array $$$a$$$ of $$$n$$$ elements.<\/p><p>Polycarp invented his criterion for the beauty of an array. He calls an array $$$a$$$ beautiful if at least one of the following conditions must be met <span class=\"tex-font-style-bf\">for each different pair of indices<\/span> $$$i \\ne j$$$: <\/p><ul> <li> $$$a_i$$$ is divisible by $$$a_j$$$; <\/li><li> or $$$a_j$$$ is divisible by $$$a_i$$$. <\/li><\/ul><p>For example, if: <\/p><ul> <li> $$$n=5$$$ and $$$a=[7, 9, 3, 14, 63]$$$, then the $$$a$$$ array is not beautiful (for $$$i=4$$$ and $$$j=2$$$, none of the conditions above is met); <\/li><li> $$$n=3$$$ and $$$a=[2, 14, 42]$$$, then the $$$a$$$ array is beautiful; <\/li><li> $$$n=4$$$ and $$$a=[45, 9, 3, 18]$$$, then the $$$a$$$ array is not beautiful (for $$$i=1$$$ and $$$j=4$$$ none of the conditions above is met); <\/li><\/ul><p>Ugly arrays upset Polycarp, so he wants to remove some elements from the array $$$a$$$ so that it becomes beautiful. Help Polycarp determine the smallest number of elements to remove to make the array $$$a$$$ beautiful.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\leq t \\leq 10$$$)\u00a0\u2014 the number of test cases. Then $$$t$$$ test cases follow.<\/p><p>The first line of each test case contains one integer $$$n$$$ ($$$1 \\leq n \\leq 2 \\cdot 10^5$$$)\u00a0\u2014 the length of the array $$$a$$$.<\/p><p>The second line of each test case contains $$$n$$$ numbers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le 2 \\cdot 10^5$$$)\u00a0\u2014 elements of the array $$$a$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case output one integer\u00a0\u2014 the minimum number of elements that must be removed to make the array $$$a$$$ beautiful.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n5\n7 9 3 14 63\n3\n2 14 42\n4\n45 9 3 18\n3\n2 2 8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n0\n1\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, removing $$$7$$$ and $$$14$$$ will make array $$$a$$$ beautiful.<\/p><p>In the second test case, the array $$$a$$$ is already beautiful.<\/p><p>In the third test case, removing one of the elements $$$45$$$ or $$$18$$$ will make the array $$$a$$$ beautiful.<\/p><p>In the fourth test case, the array $$$a$$$ is beautiful.<\/p><\/div><\/div>"}, {"contestId": 1991, "index": "D", "name": "Prime XOR Coloring", "rating": 1900, "solvedCount": 8096, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Prime XOR Coloring<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an undirected graph with $$$n$$$ vertices, numbered from $$$1$$$ to $$$n$$$. There is an edge between vertices $$$u$$$ and $$$v$$$ if and only if $$$u \\oplus v$$$ is a <a href=\"https://en.wikipedia.org/wiki/Prime_number\">prime number<\/a>, where $$$\\oplus$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#XOR\">bitwise XOR operator<\/a>.<\/p><p>Color all vertices of the graph using the minimum number of colors, such that no two vertices directly connected by an edge have the same color.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 500$$$). The description of test cases follows.<\/p><p>The only line contains a single integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of vertices in the graph.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output two lines.<\/p><p>The first line should contain a single integer $$$k$$$ ($$$1 \\le k \\le n$$$)\u00a0\u2014 the minimum number of colors required.<\/p><p>The second line should contain $$$n$$$ integers $$$c_1, c_2, \\ldots, c_n$$$ ($$$1 \\le c_i \\le k$$$)\u00a0\u2014 the color of each vertex.<\/p><p>If there are multiple solutions, output any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">6<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n1\n2\n1 2\n2\n1 2 2\n3\n1 2 2 3\n3\n1 2 2 3 3\n4\n1 2 2 3 3 4<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the minimum number of colors is $$$1$$$, because there is only one vertex.<\/p><p>In the second test case, the minimum number of colors is $$$2$$$, because there is an edge connecting $$$1$$$ and $$$2$$$ ($$$1 \\oplus 2 = 3$$$, which is a prime number).<\/p><p>In the third test case, the minimum number of colors is still $$$2$$$, because $$$2$$$ and $$$3$$$ can be colored the same since there is no edge between $$$2$$$ and $$$3$$$ ($$$2 \\oplus 3 = 1$$$, which is not a prime number).<\/p><p>In the fourth test case, it can be shown that the minimum number of colors is $$$3$$$.<\/p><p>In the fifth test case, it can be shown that the minimum number of colors is $$$3$$$.<\/p><p>In the sixth test case, it can be shown that the minimum number of colors is $$$4$$$.<\/p><\/div><\/div>"}, {"contestId": 1155, "index": "D", "name": "Beautiful Array", "rating": 1900, "solvedCount": 7994, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Beautiful Array<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ consisting of $$$n$$$ integers. Beauty of array is the maximum sum of some <span class=\"tex-font-style-bf\">consecutive subarray<\/span> of this array (this subarray may be empty). For example, the beauty of the array <span class=\"tex-font-style-tt\">[10, -5, 10, -4, 1]<\/span> is <span class=\"tex-font-style-tt\">15<\/span>, and the beauty of the array <span class=\"tex-font-style-tt\">[-3, -5, -1]<\/span> is <span class=\"tex-font-style-tt\">0<\/span>.<\/p><p>You may choose <span class=\"tex-font-style-bf\">at most one consecutive subarray<\/span> of $$$a$$$ and multiply all values contained in this subarray by $$$x$$$. You want to maximize the beauty of array after applying at most one such operation.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$x$$$ ($$$1 \\le n \\le 3 \\cdot 10^5, -100 \\le x \\le 100$$$) \u2014 the length of array $$$a$$$ and the integer $$$x$$$ respectively.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$-10^9 \\le a_i \\le 10^9$$$) \u2014 the array $$$a$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the maximum possible beauty of array $$$a$$$ after multiplying all values belonging to some consecutive subarray $$$x$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 -2\n-3 8 -2 1 -6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n22\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n12 -3\n1 3 3 7 1 3 3 7 1 3 3 7\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n42\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 10\n-1 -2 -3 -4 -5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case we need to multiply the subarray <span class=\"tex-font-style-tt\">[-2, 1, -6]<\/span>, and the array becomes <span class=\"tex-font-style-tt\">[-3, 8, 4, -2, 12]<\/span> with beauty <span class=\"tex-font-style-tt\">22<\/span> (<span class=\"tex-font-style-tt\">[-3, <span class=\"tex-font-style-bf\">8, 4, -2, 12<\/span>]<\/span>).<\/p><p>In the second test case we don't need to multiply any subarray at all.<\/p><p>In the third test case no matter which subarray we multiply, the beauty of array will be equal to <span class=\"tex-font-style-tt\">0<\/span>.<\/p><\/div><\/div>"}, {"contestId": 1624, "index": "G", "name": "MinOr Tree", "rating": 1900, "solvedCoun

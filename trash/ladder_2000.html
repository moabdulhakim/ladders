n<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>An army of <span class=\"tex-span\"><i>n<\/i><\/span> droids is lined up in one row. Each droid is described by <span class=\"tex-span\"><i>m<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>m<\/i><\/sub><\/span>, where <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is the number of details of the <span class=\"tex-span\"><i>i<\/i><\/span>-th type in this droid's mechanism. R2-D2 wants to destroy the sequence of consecutive droids of maximum length. He has <span class=\"tex-span\"><i>m<\/i><\/span> weapons, the <span class=\"tex-span\"><i>i<\/i><\/span>-th weapon can affect all the droids in the army by destroying one detail of the <span class=\"tex-span\"><i>i<\/i><\/span>-th type (if the droid doesn't have details of this type, nothing happens to it). <\/p><p>A droid is considered to be destroyed when all of its details are destroyed. R2-D2 can make at most <span class=\"tex-span\"><i>k<\/i><\/span> shots. How many shots from the weapon of what type should R2-D2 make to destroy the sequence of consecutive droids of maximum length?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains three integers <span class=\"tex-span\"><i>n<\/i>,\u2009<i>m<\/i>,\u2009<i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u20095<\/span>, <span class=\"tex-span\">0\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) \u2014 the number of droids, the number of detail types and the number of available shots, respectively.<\/p><p>Next <span class=\"tex-span\"><i>n<\/i><\/span> lines follow describing the droids. Each line contains <span class=\"tex-span\"><i>m<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>m<\/i><\/sub><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">8<\/sup><\/span>), where <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is the number of details of the <span class=\"tex-span\"><i>i<\/i><\/span>-th type for the respective robot.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>m<\/i><\/span> space-separated integers, where the <span class=\"tex-span\"><i>i<\/i><\/span>-th number is the number of shots from the weapon of the <span class=\"tex-span\"><i>i<\/i><\/span>-th type that the robot should make to destroy the subsequence of consecutive droids of the maximum length.<\/p><p>If there are multiple optimal solutions, print any of them. <\/p><p>It is not necessary to make exactly <span class=\"tex-span\"><i>k<\/i><\/span> shots, the number of shots can be less.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 2 4<br/>4 0<br/>1 2<br/>2 1<br/>0 2<br/>1 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2 2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 2 4<br/>1 2<br/>1 3<br/>2 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1 3<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test the second, third and fourth droids will be destroyed. <\/p><p>In the second test the first and second droids will be destroyed.<\/p><\/div><\/div>"}, {"contestId": 1900, "index": "D", "name": "Small GCD", "rating": 2000, "solvedCount": 5701, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Small GCD<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Let $$$a$$$, $$$b$$$, and $$$c$$$ be integers. We define function $$$f(a, b, c)$$$ as follows:<\/p><p>Order the numbers $$$a$$$, $$$b$$$, $$$c$$$ in such a way that $$$a \\le b \\le c$$$. Then return $$$\\gcd(a, b)$$$, where $$$\\gcd(a, b)$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Greatest_common_divisor\">greatest common divisor (GCD)<\/a> of integers $$$a$$$ and $$$b$$$.<\/p><p>So basically, we take the $$$\\gcd$$$ of the $$$2$$$ smaller values and ignore the biggest one. <\/p><p>You are given an array $$$a$$$ of $$$n$$$ elements. Compute the sum of $$$f(a_i, a_j, a_k)$$$ for each $$$i$$$, $$$j$$$, $$$k$$$, such that $$$1 \\le i  \\lt  j  \\lt  k \\le n$$$. <\/p><p>More formally, compute $$$$$$\\sum_{i = 1}^n \\sum_{j = i+1}^n \\sum_{k =j +1}^n f(a_i, a_j, a_k).$$$$$$ <\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10$$$). The description of the test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$3 \\le n \\le 8 \\cdot 10^4$$$)\u00a0\u2014 length of the array $$$a$$$.<\/p><p>The second line of each test case contains $$$n$$$ integers, $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le 10^5$$$)\u00a0\u2014 elements of the array $$$a$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$8 \\cdot 10^4$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single number\u00a0\u2014 the sum from the problem statement.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 3 6 12 17<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">8<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">6 12 8 10 15 12 18 16<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n24\n203\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the values of $$$f$$$ are as follows:<\/p><ul><li> $$$i=1$$$, $$$j=2$$$, $$$k=3$$$, $$$f(a_i,a_j,a_k)=f(2,3,6)=\\gcd(2,3)=1$$$; <\/li><li> $$$i=1$$$, $$$j=2$$$, $$$k=4$$$, $$$f(a_i,a_j,a_k)=f(2,3,12)=\\gcd(2,3)=1$$$; <\/li><li> $$$i=1$$$, $$$j=2$$$, $$$k=5$$$, $$$f(a_i,a_j,a_k)=f(2,3,17)=\\gcd(2,3)=1$$$; <\/li><li> $$$i=1$$$, $$$j=3$$$, $$$k=4$$$, $$$f(a_i,a_j,a_k)=f(2,6,12)=\\gcd(2,6)=2$$$; <\/li><li> $$$i=1$$$, $$$j=3$$$, $$$k=5$$$, $$$f(a_i,a_j,a_k)=f(2,6,17)=\\gcd(2,6)=2$$$; <\/li><li> $$$i=1$$$, $$$j=4$$$, $$$k=5$$$, $$$f(a_i,a_j,a_k)=f(2,12,17)=\\gcd(2,12)=2$$$; <\/li><li> $$$i=2$$$, $$$j=3$$$, $$$k=4$$$, $$$f(a_i,a_j,a_k)=f(3,6,12)=\\gcd(3,6)=3$$$; <\/li><li> $$$i=2$$$, $$$j=3$$$, $$$k=5$$$, $$$f(a_i,a_j,a_k)=f(3,6,17)=\\gcd(3,6)=3$$$; <\/li><li> $$$i=2$$$, $$$j=4$$$, $$$k=5$$$, $$$f(a_i,a_j,a_k)=f(3,12,17)=\\gcd(3,12)=3$$$; <\/li><li> $$$i=3$$$, $$$j=4$$$, $$$k=5$$$, $$$f(a_i,a_j,a_k)=f(6,12,17)=\\gcd(6,12)=6$$$.<\/li><\/ul> The sum over all triples is $$$1+1+1+2+2+2+3+3+3+6=24$$$.<p>In the second test case, there are $$$56$$$ ways to choose values of $$$i$$$, $$$j$$$, $$$k$$$. The sum over all $$$f(a_i,a_j,a_k)$$$ is $$$203$$$.<\/p><\/div><\/div>"}, {"contestId": 2114, "index": "F", "name": "Small Operations", "rating": 2000, "solvedCount": 5680, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Small Operations<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Given an integer $$$x$$$ and an integer $$$k$$$. In one operation, you can perform one of two actions:<\/p><ul> <li> choose an integer $$$1 \\le a \\le k$$$ and assign $$$x = x \\cdot a$$$; <\/li><li> choose an integer $$$1 \\le a \\le k$$$ and assign $$$x = \\frac{x}{a}$$$, where the value of $$$\\frac{x}{a}$$$ must be an integer. <\/li><\/ul><p>Find the minimum number of operations required to make the number $$$x$$$ equal to $$$y$$$, or determine that it is impossible.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains one integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The only line of each test case contains three integers $$$x$$$, $$$y$$$ and $$$k$$$ ($$$1 \\le x, y, k \\le 10^6$$$).<\/p><p>It is guaranteed that the sum of $$$x$$$ and the sum of $$$y$$$ across all test cases does not exceed $$$10^8$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output $$$-1$$$ if it is impossible to achieve $$$x=y$$$ using the given operations, and the minimum number of required operations otherwise.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 6 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 5 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 6 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">10 45 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">780 23 42<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">11 270 23<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">1 982800 13<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">1 6 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n-1\n-1\n3\n3\n3\n6\n-1\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 453, "index": "B", "name": "Little Pony and Harmony Chest", "rating": 2000, "solvedCount": 5658, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Little Pony and Harmony Chest<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Princess Twilight went to Celestia and Luna's old castle to research the chest from the Elements of Harmony.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/a3ef8a52159543f9f492c793d1e8f2d1ade243b7.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>A sequence of positive integers <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is harmony if and only if for every two elements of the sequence their greatest common divisor equals 1. According to an ancient book, the key of the chest is a harmony sequence <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> which minimizes the following expression:<\/p><center class=\"tex-equation\"><img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/5331e97de229b75f7e048dc3743c158557e6dbcc.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/center><p>You are given sequence <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, help Princess Twilight to find the key.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009100<\/span>) \u2014 the number of elements of the sequences <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span>. The next line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200930<\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output the key \u2014 sequence <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> that minimizes the sum described above. If there are multiple optimal sequences, you can output any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1 1 1 1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1 1 1 1 1 <\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1 6 4 2 8<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1 5 3 1 8 <\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1101, "index": "D", "name": "GCD Counting", "rating": 2000, "solvedCount": 5627, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. GCD Counting<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a tree consisting of $$$n$$$ vertices. A number is written on each vertex; the number on vertex $$$i$$$ is equal to $$$a_i$$$.<\/p><p>Let's denote the function $$$g(x, y)$$$ as the greatest common divisor of the numbers written on the vertices belonging to the simple path from vertex $$$x$$$ to vertex $$$y$$$ (including these two vertices). Also let's denote $$$dist(x, y)$$$ as the number of vertices on the simple path between vertices $$$x$$$ and $$$y$$$, including the endpoints. $$$dist(x, x) = 1$$$ for every vertex $$$x$$$.<\/p><p>Your task is calculate the maximum value of $$$dist(x, y)$$$ among such pairs of vertices that $$$g(x, y)  \\gt  1$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ \u2014 the number of vertices $$$(1 \\le n \\le 2 \\cdot 10^5)$$$.<\/p><p>The second line contains $$$n$$$ integers $$$a_1$$$, $$$a_2$$$, ..., $$$a_n$$$ $$$(1 \\le a_i \\le 2 \\cdot 10^5)$$$ \u2014 the numbers written on vertices.<\/p><p>Then $$$n - 1$$$ lines follow, each containing two integers $$$x$$$ and $$$y$$$ $$$(1 \\le x, y \\le n, x \\ne y)$$$ denoting an edge connecting vertex $$$x$$$ with vertex $$$y$$$. It is guaranteed that these edges form a tree.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If there is no pair of vertices $$$x, y$$$ such that $$$g(x, y)  \\gt  1$$$, print $$$0$$$. Otherwise print the maximum value of $$$dist(x, y)$$$ among such pairs.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>2 3 4<br/>1 2<br/>2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>2 3 4<br/>1 3<br/>2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>1 1 1<br/>1 2<br/>2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1451, "index": "E1", "name": "Bitwise Queries (Easy Version)", "rating": 2000, "solvedCount": 5621, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E1. Bitwise Queries (Easy Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">The only difference between the easy and hard versions is the constraints on the number of queries.<\/span><\/p><p><span class=\"tex-font-style-bf\">This is an interactive problem.<\/span><\/p><p>Ridbit has a hidden array $$$a$$$ of $$$n$$$ integers which he wants Ashish to guess. Note that $$$n$$$ is a <span class=\"tex-font-style-bf\">power of two<\/span>. Ashish is allowed to ask three different types of queries. They are of the form <\/p><ul> <li> <span class=\"tex-font-style-tt\">AND<\/span> $$$i$$$ $$$j$$$: ask for the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#AND\">bitwise AND<\/a> of elements $$$a_i$$$ and $$$a_j$$$ $$$(1 \\leq i, j \\le n$$$, $$$i \\neq j)$$$ <\/li><li> <span class=\"tex-font-style-tt\">OR<\/span> $$$i$$$ $$$j$$$: ask for the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#OR\">bitwise OR<\/a> of elements $$$a_i$$$ and $$$a_j$$$ $$$(1 \\leq i, j \\le n$$$, $$$i \\neq j)$$$ <\/li><li> <span class=\"tex-font-style-tt\">XOR<\/span> $$$i$$$ $$$j$$$: ask for the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#XOR\">bitwise XOR<\/a> of elements $$$a_i$$$ and $$$a_j$$$ $$$(1 \\leq i, j \\le n$$$, $$$i \\neq j)$$$ <\/li><\/ul><p>Can you help Ashish guess the elements of the array?<\/p><p><span class=\"tex-font-style-bf\">In this version, each element takes a value in the range $$$[0, n-1]$$$ (inclusive) and Ashish can ask no more than $$$n+2$$$ queries.<\/span><\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains one integer $$$n$$$ $$$(4 \\le n \\le 2^{16})$$$\u00a0\u2014 the length of the array. It is guaranteed that $$$n$$$ is a <span class=\"tex-font-style-bf\">power of two<\/span>.<\/p><\/div><div><div class=\"section-title\">Interaction<\/div><p>To ask a query print a single line containing one of the following (without quotes) <\/p><ul> <li> \"<span class=\"tex-font-style-tt\">AND i j<\/span>\" <\/li><li> \"<span class=\"tex-font-style-tt\">OR i j<\/span>\" <\/li><li> \"<span class=\"tex-font-style-tt\">XOR i j<\/span>\" <\/li><\/ul> where $$$i$$$ and $$$j$$$ $$$(1 \\leq i, j \\le n$$$, $$$i \\neq j)$$$ denote the indices being queried.<p>For each query, you will receive an integer $$$x$$$ whose value depends on the type of query. If the indices queried are invalid or you exceed the number of queries however, you will get $$$x = -1$$$. In this case, you should terminate the program immediately.<\/p><p>When you have guessed the elements of the array, print a single line \"<span class=\"tex-font-style-tt\">!<\/span> \" (without quotes), followed by $$$n$$$ space-separated integers \u00a0\u2014 the elements of the array.<\/p><p>Guessing the array does <span class=\"tex-font-style-bf\">not<\/span> count towards the number of queries asked.<\/p><p><span class=\"tex-font-style-bf\">The interactor is not adaptive.<\/span> The array $$$a$$$ does not change with queries.<\/p><p>After printing a query do not forget to output the end of the line and flush the output. Otherwise, you will get <span class=\"tex-font-style-tt\">Idleness limit exceeded<\/span>. To do this, use:<\/p><ul><li> <span class=\"tex-font-style-tt\">fflush(stdout)<\/span> or <span class=\"tex-font-style-tt\">cout.flush()<\/span> in C++;<\/li><li> <span class=\"tex-font-style-tt\">System.out.flush()<\/span> in Java;<\/li><li> <span class=\"tex-font-style-tt\">flush(output)<\/span> in Pascal;<\/li><li> <span class=\"tex-font-style-tt\">stdout.flush()<\/span> in Python;<\/li><li> see the documentation for other languages.<\/li><\/ul><p><span class=\"tex-font-style-bf\">Hacks<\/span><\/p><p>To hack the solution, use the following test format:<\/p><p>On the first line print a single integer $$$n$$$ $$$(4 \\le n \\le 2^{16})$$$\u00a0\u2014 the length of the array. It <span class=\"tex-font-style-bf\">must<\/span> be a power of 2. The next line should contain $$$n$$$ space-separated integers in the range $$$[0, n-1]$$$\u00a0\u2014 the array $$$a$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n\n0\n\n2\n\n3\n\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nOR 1 2\n\nOR 2 3\n\nXOR 2 4\n\n! 0 0 2 3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The array $$$a$$$ in the example is $$$[0, 0, 2, 3]$$$.<\/p><\/div><\/div>"}, {"contestId": 1796, "index": "D", "name": "Maximum Subarray", "rating": 2000, "solvedCount": 5615, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Maximum Subarray<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a_1, a_2, \\dots, a_n$$$, consisting of $$$n$$$ integers. You are also given two integers $$$k$$$ and $$$x$$$.<\/p><p>You have to perform the following operation exactly once: add $$$x$$$ to the elements on <span class=\"tex-font-style-bf\">exactly<\/span> $$$k$$$ <span class=\"tex-font-style-bf\">distinct<\/span> positions, and subtract $$$x$$$ from all the others.<\/p><p>For example, if $$$a = [2, -1, 2, 3]$$$, $$$k = 1$$$, $$$x = 2$$$, and we have picked the first element, then after the operation the array $$$a = [4, -3, 0, 1]$$$.<\/p><p>Let $$$f(a)$$$ be the maximum possible sum of a subarray of $$$a$$$. The subarray of $$$a$$$ is a contiguous part of the array $$$a$$$, i.\u2009e. the array $$$a_i, a_{i + 1}, \\dots, a_j$$$ for some $$$1 \\le i \\le j \\le n$$$. An empty subarray should also be considered, it has sum $$$0$$$.<\/p><p>Let the array $$$a'$$$ be the array $$$a$$$ after applying the aforementioned operation. Apply the operation in such a way that $$$f(a')$$$ is the maximum possible, and print the maximum possible value of $$$f(a')$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains three integers $$$n$$$, $$$k$$$ and $$$x$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$; $$$0 \\le k \\le \\min(20, n)$$$; $$$-10^9 \\le x \\le 10^9$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$-10^9 \\le a_i \\le 10^9$$$). <\/p><p>The sum of $$$n$$$ over all test cases doesn't exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print one integer\u00a0\u2014 the maximum possible value of $$$f(a')$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 -1 2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">-1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 0 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 2 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 2 -8<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 -1 9 -3 7 -8<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5\n7\n0\n44\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1183, "index": "E", "name": "Subsequences (easy version)", "rating": 2000, "solvedCount": 5602, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Subsequences (easy version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">The only difference between the easy and the hard versions is constraints<\/span>.<\/p><p>A subsequence is a string that can be derived from another string by deleting some or no symbols without changing the order of the remaining symbols. Characters to be deleted are not required to go successively, there can be any gaps between them. For example, for the string \"<span class=\"tex-font-style-tt\">abaca<\/span>\" the following strings are subsequences: \"<span class=\"tex-font-style-tt\">abaca<\/span>\", \"<span class=\"tex-font-style-tt\">aba<\/span>\", \"<span class=\"tex-font-style-tt\">aaa<\/span>\", \"<span class=\"tex-font-style-tt\">a<\/span>\" and \"<span class=\"tex-font-style-tt\"><\/span>\" (empty string). But the following strings are not subsequences: \"<span class=\"tex-font-style-tt\">aabaca<\/span>\", \"<span class=\"tex-font-style-tt\">cb<\/span>\" and \"<span class=\"tex-font-style-tt\">bcaa<\/span>\".<\/p><p>You are given a string $$$s$$$ consisting of $$$n$$$ lowercase Latin letters.<\/p><p>In one move you can take <span class=\"tex-font-style-bf\">any<\/span> subsequence $$$t$$$ of the given string and add it to the set $$$S$$$. The set $$$S$$$ can't contain duplicates. This move costs $$$n - |t|$$$, where $$$|t|$$$ is the length of the added subsequence (i.e. the price equals to the number of the deleted characters).<\/p><p>Your task is to find out the minimum possible total cost to obtain a set $$$S$$$ of size $$$k$$$ or report that it is impossible to do so.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le n, k \\le 100$$$) \u2014 the length of the string and the size of the set, correspondingly.<\/p><p>The second line of the input contains a string $$$s$$$ consisting of $$$n$$$ lowercase Latin letters.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 if it is impossible to obtain the set $$$S$$$ of size $$$k$$$, print <span class=\"tex-font-style-tt\">-1<\/span>. Otherwise, print the minimum possible total cost to do it.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 5\nasdf\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 6\naaaaa\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n15\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 7\naaaaa\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n-1\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n10 100\najihiushda\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n233\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example we can generate $$$S$$$ = { \"<span class=\"tex-font-style-tt\">asdf<\/span>\", \"<span class=\"tex-font-style-tt\">asd<\/span>\", \"<span class=\"tex-font-style-tt\">adf<\/span>\", \"<span class=\"tex-font-style-tt\">asf<\/span>\", \"<span class=\"tex-font-style-tt\">sdf<\/span>\" }. The cost of the first element in $$$S$$$ is $$$0$$$ and the cost of the others is $$$1$$$. So the total cost of $$$S$$$ is $$$4$$$.<\/p><\/div><\/div>"}, {"contestId": 2057, "index": "D", "name": "Gifts Order", "rating": 2000, "solvedCount": 5590, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Gifts Order<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>\"T-Generation\" has decided to purchase gifts for various needs; thus, they have $$$n$$$ different sweaters numbered from $$$1$$$ to $$$n$$$. The $$$i$$$-th sweater has a size of $$$a_i$$$. Now they need to send some subsegment of sweaters to an olympiad. It is necessary that the sweaters fit as many people as possible, but without having to take too many of them.<\/p><p>They need to choose two indices $$$l$$$ and $$$r$$$ ($$$1 \\le l \\le r \\le n$$$) to maximize the <span class=\"tex-font-style-it\">convenience<\/span> equal to $$$$$$\\operatorname{max} (a_l, a_{l + 1}, \\ldots, a_r) - \\operatorname{min} (a_l, a_{l + 1}, \\ldots, a_r) - (r - l),$$$$$$ that is, the range of sizes minus the number of sweaters.<\/p><p>Sometimes the sizes of the sweaters change; it is known that there have been $$$q$$$ changes, in each change, the size of the $$$p$$$-th sweater becomes $$$x$$$. <\/p><p>Help the \"T-Generation\" team and determine the maximum convenience among all possible pairs $$$(l, r)$$$ initially, as well as after each size change.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test consists of several test cases. The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$q$$$ ($$$1 \\le n, q \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of sweaters and the number of size changes.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$)\u00a0\u2014 the sizes of the sweaters.<\/p><p>Each of the following $$$q$$$ lines of each test case contains two integers $$$p$$$ and $$$x$$$ ($$$1 \\le p \\le n$$$, $$$1 \\le x \\le 10^9$$$)\u00a0\u2014 the next size change.<\/p><p>It is guaranteed that the sum of the values of $$$n$$$ and the sum of the values of $$$q$$$ across all test cases do not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output the maximum value of convenience among all possible pairs $$$(l, r)$$$ before any actions, as well as after each size change.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2 3 4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">8 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 4 2 4 8 2 1 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">8 11<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 7<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n8\n0\n7\n0\n4\n4\n4\n5\n3\n6\n6\n9\n7\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Consider the first test case. <\/p><ul> <li> Before any changes, you can take all the sweaters; then the convenience is equal to $$$\\operatorname{max} (a_1, a_2) - \\operatorname{min} (a_1, a_2) - (2 - 1) = 10 - 1 - 1 = 8$$$. <\/li><li> After the first query, the sizes of both sweaters will be equal to $$$10$$$, you can only take the first sweater and the convenience is equal to $$$10 - 10 - 0 = 0$$$. <\/li><li> After the second query, the size of the first sweater will be $$$10$$$, and the second $$$2$$$, you can take all the sweaters and the convenience is equal to $$$\\operatorname{max} (a_1, a_2) - \\operatorname{min} (a_1, a_2) - (2 - 1) = 10 - 2 - 1 = 7$$$. <\/li><\/ul><\/div><\/div>"}, {"contestId": 1296, "index": "E2", "name": "String Coloring (hard version)", "rating": 2000, "solvedCount": 5569, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E2. String Coloring (hard version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is a hard version of the problem. The actual problems are different, but the easy version is almost a subtask of the hard version. Note that the constraints and the output format are different<\/span>.<\/p><p>You are given a string $$$s$$$ consisting of $$$n$$$ lowercase Latin letters.<\/p><p>You have to color <span class=\"tex-font-style-bf\">all<\/span> its characters <span class=\"tex-font-style-bf\">the minimum number of colors<\/span> (each character to exactly one color, the same letters can be colored the same or different colors, i.e. you can choose exactly one color for each index in $$$s$$$).<\/p><p>After coloring, you can swap <span class=\"tex-font-style-bf\">any<\/span> two neighboring characters of the string that are colored <span class=\"tex-font-style-bf\">different<\/span> colors. You can perform such an operation arbitrary (possibly, zero) number of times.<\/p><p>The goal is to make the string sorted, i.e. all characters should be in alphabetical order.<\/p><p>Your task is to find the minimum number of colors which you have to color the given string in so that after coloring it can become sorted by <span class=\"tex-font-style-bf\">some<\/span> sequence of swaps. Note that you have to restore only coloring, not the sequence of swaps.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains one integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$) \u2014 the length of $$$s$$$.<\/p><p>The second line of the input contains the string $$$s$$$ consisting of exactly $$$n$$$ lowercase Latin letters.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In the first line print one integer $$$res$$$ ($$$1 \\le res \\le n$$$) \u2014 the minimum number of colors in which you have to color the given string so that after coloring it can become sorted by <span class=\"tex-font-style-bf\">some<\/span> sequence of swaps.<\/p><p>In the second line print <span class=\"tex-font-style-bf\">any<\/span> possible coloring that can be used to sort the string using some sequence of swaps described in the problem statement. The coloring is the array $$$c$$$ of length $$$n$$$, where $$$1 \\le c_i \\le res$$$ and $$$c_i$$$ means the color of the $$$i$$$-th character.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n9\nabacbecfd\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n1 1 2 1 2 1 2 1 2 \n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n8\naaabbcbb\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n1 2 1 2 1 2 1 1\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7\nabcdedc\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n1 1 1 1 1 2 3 \n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\nabcde\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n1 1 1 1 1 \n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 468, "index": "B", "name": "Two Sets", "rating": 2000, "solvedCount": 5569, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Two Sets<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Little X has <span class=\"tex-span\"><i>n<\/i><\/span> distinct integers: <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>p<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>p<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span>. He wants to divide all of them into two sets <span class=\"tex-span\"><i>A<\/i><\/span> and <span class=\"tex-span\"><i>B<\/i><\/span>. The following two conditions must be satisfied:<\/p><ul> <li> If number <span class=\"tex-span\"><i>x<\/i><\/span> belongs to set <span class=\"tex-span\"><i>A<\/i><\/span>, then number <span class=\"tex-span\"><i>a<\/i>\u2009-\u2009<i>x<\/i><\/span> must also belong to set <span class=\"tex-span\"><i>A<\/i><\/span>. <\/li><li> If number <span class=\"tex-span\"><i>x<\/i><\/span> belongs to set <span class=\"tex-span\"><i>B<\/i><\/span>, then number <span class=\"tex-span\"><i>b<\/i>\u2009-\u2009<i>x<\/i><\/span> must also belong to set <span class=\"tex-span\"><i>B<\/i><\/span>. <\/li><\/ul><p>Help Little X divide the numbers into two sets or determine that it's impossible.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains three space-separated integers <span class=\"tex-span\"><i>n<\/i>,\u2009<i>a<\/i>,\u2009<i>b<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>;\u00a01\u2009\u2264\u2009<i>a<\/i>,\u2009<i>b<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup>)<\/span>. The next line contains <span class=\"tex-span\"><i>n<\/i><\/span> space-separated distinct integers <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>p<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>p<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub>\u00a0(1\u2009\u2264\u2009<i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup>)<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If there is a way to divide the numbers into two sets, then print \"<span class=\"tex-font-style-tt\">YES<\/span>\" in the first line. Then print <span class=\"tex-span\"><i>n<\/i><\/span> integers: <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>b<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> equals either <span class=\"tex-span\">0<\/span>, or <span class=\"tex-span\">1<\/span>), describing the division. If <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> equals to <span class=\"tex-span\">0<\/span>, then <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> belongs to set <span class=\"tex-span\"><i>A<\/i><\/span>, otherwise it belongs to set <span class=\"tex-span\"><i>B<\/i><\/span>.<\/p><p>If it's impossible, print \"<span class=\"tex-font-style-tt\">NO<\/span>\" (without the quotes).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 5 9<br/>2 3 4 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/>0 0 1 1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 3 4<br/>1 2 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>NO<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>It's OK if all the numbers are in the same set, and the other one is empty.<\/p><\/div><\/div>"}, {"contestId": 2085, "index": "D", "name": "Serval and Kaitenzushi Buffet", "rating": 2000, "solvedCount": 5560, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Serval and Kaitenzushi Buffet<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p> <\/p><p>Serval has just found a Kaitenzushi buffet restaurant. Kaitenzushi means that there is a conveyor belt in the restaurant, delivering plates of sushi in front of the customer, Serval.<\/p><p>In this restaurant, each plate contains exactly $$$k$$$ pieces of sushi and the $$$i$$$-th plate has a <span class=\"tex-font-style-it\">deliciousness<\/span> $$$d_i$$$. Serval will have a meal in this restaurant for $$$n$$$ minutes, and within the $$$n$$$ minutes, he must eat up <span class=\"tex-font-style-bf\">all<\/span> the pieces of sushi he took from the belt.<\/p><p>Denote the counter for uneaten taken pieces of sushi as $$$r$$$. Initially, $$$r=0$$$. In the $$$i$$$-th minute ($$$1\\leq i\\leq n$$$), only the $$$i$$$-th plate of sushi will be delivered in front of Serval, and he can do <span class=\"tex-font-style-bf\">one<\/span> of the following:<\/p><ul> <li> Take the $$$i$$$-th plate of sushi (whose <span class=\"tex-font-style-it\">deliciousness<\/span> is $$$d_i$$$) from the belt, and $$$r$$$ will be increased by $$$k$$$; <\/li><li> Eat one uneaten piece of sushi that he took from the belt before, and $$$r$$$ will be decreased by $$$1$$$. Note that you can do this only if $$$r \\gt 0$$$; <\/li><li> Or, do nothing, and $$$r$$$ will remain unchanged. <\/li><\/ul><p>Note that after the $$$n$$$ minutes, the value of $$$r$$$ <span class=\"tex-font-style-bf\">must<\/span> be $$$0$$$.<\/p><p>Serval wants to maximize the sum of the <span class=\"tex-font-style-it\">deliciousnesses<\/span> of all the plates he took. Help him find it out!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$k$$$ ($$$1\\leq k \\lt n\\leq 2\\cdot 10^5$$$) \u2014 the number of minutes of the meal and the number of sushi pieces in each plate.<\/p><p>The second line contains $$$n$$$ integers $$$d_1, d_2, \\ldots, d_n$$$ ($$$1\\leq d_i\\leq 10^9$$$) \u2014 the <span class=\"tex-font-style-it\">deliciousness<\/span> of each plate.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2\\cdot 10^5$$$. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print a single integer \u2014 the maximum possible sum of the <span class=\"tex-font-style-it\">deliciousnesses<\/span> of all the plates Serval took.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 6 4 1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">7 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 1 4 1 5 9 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 3 2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 3 5 2 4 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">6 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1000000000 1 1000000000 1 1000000000 1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n16\n4\n6\n3000000000\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, it can be shown that Serval can eat up at most one plate of sushi. Since the second plate of sushi has the greatest <span class=\"tex-font-style-it\">deliciousness<\/span> $$$6$$$ among all the plates, he will take it from the belt in the second minute, and then eat it up in the following $$$2$$$ minutes.<\/p><center> <table class=\"tex-tabular\"><tbody><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">Minute<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$1$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$2$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$3$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$4$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$5$$$<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">Action<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">\u00a0\u2014\u00a0<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">Take<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">Eat<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">Eat<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">\u00a0\u2014\u00a0<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$r$$$ after action<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$0$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$2$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$1$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$0$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right $3$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$4$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$5$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$6$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$7$$$<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">Action<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">Take<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">Eat<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">Take<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">Eat<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">\u00a0\u2014\u00a0<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">Take<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">Eat<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-ta

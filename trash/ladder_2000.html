of him only if at the $$$t_i$$$-th minute from now you are at the intersection $$$(x_i, y_i)$$$). You are very good at your job, so you are able to take photos instantaneously. You know that $$$t_i  \\lt  t_{i+1}$$$ for any $$$i=1,2,\\ldots, n-1$$$.<\/p><p>Currently you are at your office, which is located at the intersection $$$(1, 1)$$$. If you plan your working day optimally, what is the maximum number of celebrities you can take a photo of?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains two positive integers $$$r, n$$$ ($$$1\\le r\\le 500$$$, $$$1\\le n\\le 100,000$$$) \u2013 the number of south-to-north/west-to-east streets and the number of celebrities.<\/p><p>Then $$$n$$$ lines follow, each describing the appearance of a celebrity. The $$$i$$$-th of these lines contains $$$3$$$ positive integers $$$t_i, x_i, y_i$$$ ($$$1\\le t_i\\le 1,000,000$$$, $$$1\\le x_i, y_i\\le r$$$) \u00a0\u2014 denoting that the $$$i$$$-th celebrity will appear at the intersection $$$(x_i, y_i)$$$ in $$$t_i$$$ minutes from now.<\/p><p>It is guaranteed that $$$t_i \\lt t_{i+1}$$$ for any $$$i=1,2,\\ldots, n-1$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer, the maximum number of celebrities you can take a photo of.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n10 1\n11 6 8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 9\n1 2 6\n7 5 1\n8 5 5\n10 3 1\n12 4 4\n13 6 2\n17 6 6\n20 1 4\n21 5 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n10 4\n1 2 1\n5 10 9\n13 8 8\n15 9 9\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n500 10\n69 477 122\n73 186 235\n341 101 145\n372 77 497\n390 117 440\n494 471 37\n522 300 498\n682 149 379\n821 486 359\n855 157 386\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p><span class=\"tex-font-style-bf\">Explanation of the first testcase:<\/span> There is only one celebrity in the city, and he will be at intersection $$$(6,8)$$$ exactly $$$11$$$ minutes after the beginning of the working day. Since you are initially at $$$(1,1)$$$ and you need $$$|1-6|+|1-8|=5+7=12$$$ minutes to reach $$$(6,8)$$$ you cannot take a photo of the celebrity. Thus you cannot get any photo and the answer is $$$0$$$.<\/p><p><span class=\"tex-font-style-bf\">Explanation of the second testcase:<\/span> One way to take $$$4$$$ photos (which is the maximum possible) is to take photos of celebrities with indexes $$$3, 5, 7, 9$$$ (see the image for a visualization of the strategy): <\/p><ul> <li> To move from the office at $$$(1,1)$$$ to the intersection $$$(5,5)$$$ you need $$$|1-5|+|1-5|=4+4=8$$$ minutes, so you arrive at minute $$$8$$$ and you are just in time to take a photo of celebrity $$$3$$$. <\/li><li> Then, just after you have taken a photo of celebrity $$$3$$$, you move toward the intersection $$$(4,4)$$$. You need $$$|5-4|+|5-4|=1+1=2$$$ minutes to go there, so you arrive at minute $$$8+2=10$$$ and you wait until minute $$$12$$$, when celebrity $$$5$$$ appears. <\/li><li> Then, just after you have taken a photo of celebrity $$$5$$$, you go to the intersection $$$(6,6)$$$. You need $$$|4-6|+|4-6|=2+2=4$$$ minutes to go there, so you arrive at minute $$$12+4=16$$$ and you wait until minute $$$17$$$, when celebrity $$$7$$$ appears. <\/li><li> Then, just after you have taken a photo of celebrity $$$7$$$, you go to the intersection $$$(5,4)$$$. You need $$$|6-5|+|6-4|=1+2=3$$$ minutes to go there, so you arrive at minute $$$17+3=20$$$ and you wait until minute $$$21$$$ to take a photo of celebrity $$$9$$$. <\/li><\/ul><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/49d5d01f8726e61cd1cf2304307fcb9f6bf31af5.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p><span class=\"tex-font-style-bf\">Explanation of the third testcase:<\/span> The only way to take $$$1$$$ photo (which is the maximum possible) is to take a photo of the celebrity with index $$$1$$$ (since $$$|2-1|+|1-1|=1$$$, you can be at intersection $$$(2,1)$$$ after exactly one minute, hence you are just in time to take a photo of celebrity $$$1$$$).<\/p><p><span class=\"tex-font-style-bf\">Explanation of the fourth testcase:<\/span> One way to take $$$3$$$ photos (which is the maximum possible) is to take photos of celebrities with indexes $$$3, 8, 10$$$: <\/p><ul> <li> To move from the office at $$$(1,1)$$$ to the intersection $$$(101,145)$$$ you need $$$|1-101|+|1-145|=100+144=244$$$ minutes, so you can manage to be there when the celebrity $$$3$$$ appears (at minute $$$341$$$). <\/li><li> Then, just after you have taken a photo of celebrity $$$3$$$, you move toward the intersection $$$(149,379)$$$. You need $$$|101-149|+|145-379|=282$$$ minutes to go there, so you arrive at minute $$$341+282=623$$$ and you wait until minute $$$682$$$, when celebrity $$$8$$$ appears. <\/li><li> Then, just after you have taken a photo of celebrity $$$8$$$, you go to the intersection $$$(157,386)$$$. You need $$$|149-157|+|379-386|=8+7=15$$$ minutes to go there, so you arrive at minute $$$682+15=697$$$ and you wait until minute $$$855$$$ to take a photo of celebrity $$$10$$$. <\/li><\/ul><\/div><\/div>"}, {"contestId": 2165, "index": "C", "name": "Binary Wine", "rating": 2000, "solvedCount": 6093, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Binary Wine<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p> <\/p><p>You are given $$$n$$$ integers $$$a_1,a_2,\\ldots,a_n$$$ within the range $$$[0,2^{30})$$$.<\/p><p>You can spend $$$1$$$ coin to increase any $$$a_i$$$ by $$$1$$$. You can perform this operation any number of times.<\/p><p>You need to solve $$$q$$$ queries; for each query, you are given an integer $$$c$$$, also in the range $$$[0,2^{30})$$$. You would like it if there exists a sequence $$$b$$$ of length $$$n$$$ with the following properties: <\/p><ul> <li> For every $$$1\\le i\\le n$$$, $$$0\\le b_i\\le a_i$$$. <\/li><li> $$$b_1\\oplus b_2\\oplus\\ldots\\oplus b_n=c$$$, where $$$\\oplus$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#XOR\">bitwise XOR operation<\/a>.  <\/li><\/ul><p>Please calculate the minimum number of coins you will have to spend, such that there exists a suitable $$$b$$$.<\/p><p>The queries are <span class=\"tex-font-style-bf\">independent<\/span>, meaning that any operations you perform on the sequence $$$a$$$ will not impact future queries.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows. <\/p><p>The first line of each test case consists of two integers $$$n,q$$$ ($$$1\\le n\\le5\\cdot10^5$$$, $$$1\\le q\\le5\\cdot10^4$$$)\u00a0\u2014 the length of sequence $$$a$$$ and the number of queries.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1,a_2,\\ldots,a_n$$$ ($$$0\\le a_i \\lt 2^{30}$$$)\u00a0\u2014 the initial sequence $$$a$$$.<\/p><p>Each of the next $$$q$$$ lines contains a single integer $$$c$$$ ($$$0\\le c \\lt 2^{30}$$$)\u00a0\u2014 the target XOR.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$5\\cdot10^5$$$. <\/p><p>It is guaranteed that the sum of $$$q$$$ over all test cases does not exceed $$$5\\cdot10^4$$$. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query, output a single integer\u00a0\u2014 the minimum coins you will have to spend, such that there exists a suitable $$$b$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">9<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">9 9 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">24<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 1 4 5 1 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">20<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">30<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">40<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">0<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">0<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n<div class=\"test-example-line test-example-line-odd test-example-line-1\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">11<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">16<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">31<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">0<\/div><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, we spend $$$1$$$ coin to increase $$$a_2$$$ by $$$1$$$, resulting in sequence $$$[5,8]$$$. A suitable $$$b$$$ would be $$$[1,8]$$$. It can be shown one cannot spend less than $$$1$$$ coin to achieve the objective.<\/p><p>In the second test case, we can spend $$$7$$$ coins to increase $$$a_1$$$ by $$$7$$$, resulting in sequence $$$[16,9,8]$$$. A suitable $$$b$$$ would be $$$[16,9,1]$$$.<\/p><\/div><\/div>"}, {"contestId": 2075, "index": "D", "name": "Equalization", "rating": 2000, "solvedCount": 6090, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Equalization<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given two non-negative integers $$$x$$$ and $$$y$$$.<\/p><p>You can perform the following operation any number of times (possibly zero): choose a positive integer $$$k$$$ and divide either $$$x$$$ or $$$y$$$ by $$$2^k$$$ rounding down. The cost of this operation is $$$2^k$$$. However, there is an additional constraint: you cannot select the same value of $$$k$$$ more than once.<\/p><p>Your task is to calculate the minimum possible cost in order to make $$$x$$$ equal to $$$y$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^5$$$)\u00a0\u2014 the number of test cases.<\/p><p>The only line of each test case contains two integers $$$x$$$ and $$$y$$$ ($$$0 \\le x, y \\le 10^{17}$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print a single integer\u00a0\u2014 the minimum possible cost in order to make $$$x$$$ equal to $$$y$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">0 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">6 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">13 37<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4238659325782394 12983091057341925<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n6\n0\n26\n32764\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, you can proceed as follows: choose $$$k=1$$$ and divide $$$y$$$ by $$$2$$$. After that, $$$x$$$ and $$$y$$$ are equal to $$$0$$$.<\/p><p>In the second example, you can proceed as follows: choose $$$k=2$$$ and divide $$$x$$$ by $$$4$$$; choose $$$k=1$$$ and divide $$$y$$$ by $$$2$$$. After that, $$$x$$$ and $$$y$$$ are equal to $$$1$$$.<\/p><p>In the third example, numbers already are equal.<\/p><\/div><\/div>"}, {"contestId": 1613, "index": "E", "name": "Crazy Robot", "rating": 2000, "solvedCount": 6042, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Crazy Robot<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There is a grid, consisting of $$$n$$$ rows and $$$m$$$ columns. Each cell of the grid is either free or blocked. One of the free cells contains a lab. All the cells beyond the borders of the grid are also blocked.<\/p><p>A crazy robot has escaped from this lab. It is currently in some free cell of the grid. You can send one of the following commands to the robot: \"move right\", \"move down\", \"move left\" or \"move up\". Each command means moving to a neighbouring cell in the corresponding direction.<\/p><p>However, as the robot is crazy, it will do anything except following the command. Upon receiving a command, it will choose a direction such that it differs from the one in command and the cell in that direction is not blocked. If there is such a direction, then it will move to a neighbouring cell in that direction. Otherwise, it will do nothing.<\/p><p>We want to get the robot to the lab to get it fixed. For each free cell, determine if the robot can be forced to reach the lab starting in this cell. That is, after each step of the robot a command can be sent to a robot such that no matter what different directions the robot chooses, it will end up in a lab.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 1000$$$)\u00a0\u2014 the number of testcases.<\/p><p>The first line of each testcase contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\le n, m \\le 10^6$$$; $$$n \\cdot m \\le 10^6$$$)\u00a0\u2014 the number of rows and the number of columns in the grid.<\/p><p>The $$$i$$$-th of the next $$$n$$$ lines provides a description of the $$$i$$$-th row of the grid. It consists of $$$m$$$ elements of one of three types: <\/p><ul> <li> '.'\u00a0\u2014 the cell is free; <\/li><li> '#'\u00a0\u2014 the cell is blocked; <\/li><li> 'L'\u00a0\u2014 the cell contains a lab. <\/li><\/ul><p>The grid contains exactly one lab. The sum of $$$n \\cdot m$$$ over all testcases doesn't exceed $$$10^6$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each testcase find the free cells that the robot can be forced to reach the lab from. Given the grid, replace the free cells (marked with a dot) with a plus sign ('+') for the cells that the robot can be forced to reach the lab from. Print the resulting grid.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n3 3\n...\n.L.\n...\n4 5\n#....\n..##L\n...#.\n.....\n1 1\nL\n1 9\n....L..#.\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n...\n.L.\n...\n#++++\n..##L\n...#+\n...++\nL\n++++L++#.\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first testcase there is no free cell that the robot can be forced to reach the lab from. Consider a corner cell. Given any direction, it will move to a neighbouring border grid that's not a corner. Now consider a non-corner free cell. No matter what direction you send to the robot, it can choose a different direction such that it ends up in a corner.<\/p><p>In the last testcase, you can keep sending the command that is opposite to the direction to the lab and the robot will have no choice other than move towards the lab.<\/p><\/div><\/div>"}, {"contestId": 797, "index": "E", "name": "Array Queries", "rating": 2000, "solvedCount": 6041, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Array Queries<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-span\"><i>a<\/i><\/span> is an array of <span class=\"tex-span\"><i>n<\/i><\/span> positive integers, all of which are not greater than <span class=\"tex-span\"><i>n<\/i><\/span>.<\/p><p>You have to process <span class=\"tex-span\"><i>q<\/i><\/span> queries to this array. Each query is represented by two numbers <span class=\"tex-span\"><i>p<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span>. Several operations are performed in each query; each operation changes <span class=\"tex-span\"><i>p<\/i><\/span> to <span class=\"tex-span\"><i>p<\/i>\u2009+\u2009<i>a<\/i><sub class=\"lower-index\"><i>p<\/i><\/sub>\u2009+\u2009<i>k<\/i><\/span>. There operations are applied until <span class=\"tex-span\"><i>p<\/i><\/span> becomes greater than <span class=\"tex-span\"><i>n<\/i><\/span>. The answer to the query is the number of performed operations.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer <span class=\"tex-span\"><i>n<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009100000)<\/span>.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers \u2014 elements of <span class=\"tex-span\"><i>a<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span> for each <span class=\"tex-span\"><i>i<\/i><\/span> from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span>).<\/p><p>The third line containts one integer <span class=\"tex-span\"><i>q<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>q<\/i>\u2009\u2264\u2009100000)<\/span>.<\/p><p>Then <span class=\"tex-span\"><i>q<\/i><\/span> lines follow. Each line contains the values of <span class=\"tex-span\"><i>p<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> for corresponding query <span class=\"tex-span\">(1\u2009\u2264\u2009<i>p<\/i>,\u2009<i>k<\/i>\u2009\u2264\u2009<i>n<\/i>)<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>q<\/i><\/span> integers, <span class=\"tex-span\"><i>i<\/i><\/span>th integer must be equal to the answer to <span class=\"tex-span\"><i>i<\/i><\/span>th query.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>1 1 1<br/>3<br/>1 1<br/>2 1<br/>3 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/>1<br/>1<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Consider first example:<\/p><p>In first query after first operation <span class=\"tex-span\"><i>p<\/i>\u2009=\u20093<\/span>, after second operation <span class=\"tex-span\"><i>p<\/i>\u2009=\u20095<\/span>.<\/p><p>In next two queries <span class=\"tex-span\"><i>p<\/i><\/span> is greater than <span class=\"tex-span\"><i>n<\/i><\/span> after the first operation.<\/p><\/div><\/div>"}, {"contestId": 1830, "index": "B", "name": "The BOSS Can Count Pairs", "rating": 2000, "solvedCount": 6027, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. The BOSS Can Count Pairs<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given two arrays $$$a$$$ and $$$b$$$, both of length $$$n$$$.<\/p><p>Your task is to count the number of pairs of integers $$$(i,j)$$$ such that $$$1 \\leq i  \\lt  j \\leq n$$$ and $$$a_i \\cdot a_j = b_i+b_j$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line of input contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases. The description of test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the length of the arrays.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1,a_2,\\ldots,a_n$$$ ($$$1 \\le a_i \\le n$$$)\u00a0\u2014 the elements of array $$$a$$$.<\/p><p>The third line of each test case contains $$$n$$$ integers $$$b_1,b_2,\\ldots,b_n$$$ ($$$1 \\le b_i \\le n$$$)\u00a0\u2014 the elements of array $$$b$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ across all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output the number of good pairs.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 3 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 3 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">8<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 2 8 2 1 2 7 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 5 8 8 1 1 6 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 4 8 8 8 8 8 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">8 8 8 8 8 8 8 8<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n7\n1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample, there are $$$2$$$ good pairs:<\/p><ul> <li> $$$(1,2)$$$, <\/li><li> $$$(1,3)$$$. <\/li><\/ul><p>In the second sample, there are $$$7$$$ good pairs:<\/p><ul> <li> $$$(1,2)$$$, <\/li><li> $$$(1,5)$$$, <\/li><li> $$$(2,8)$$$, <\/li><li> $$$(3,4)$$$, <\/li><li> $$$(4,7)$$$, <\/li><li> $$$(5,6)$$$, <\/li><li> $$$(5,7)$$$. <\/li><\/ul><\/div><\/div>"}, {"contestId": 1976, "index": "D", "name": "Invertible Bracket Sequences", "rating": 2000, "solvedCount": 5980, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Invertible Bracket Sequences<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>A regular bracket sequence is a bracket sequence that can be transformed into a correct arithmetic expression by inserting characters '<span class=\"tex-font-style-tt\">1<\/span>' and '<span class=\"tex-font-style-tt\">+<\/span>' between the original characters of the sequence. For example:<\/p><ul> <li> bracket sequences \"<span class=\"tex-font-style-tt\">()()<\/span>\" and \"<span class=\"tex-font-style-tt\">(())<\/span>\" are regular (the resulting expressions are: \"<span class=\"tex-font-style-tt\">(1)+(1)<\/span>\" and \"<span class=\"tex-font-style-tt\">((1+1)+1)<\/span>\"); <\/li><li> bracket sequences \"<span class=\"tex-font-style-tt\">)(<\/span>\", \"<span class=\"tex-font-style-tt\">(<\/span>\" and \"<span class=\"tex-font-style-tt\">)<\/span>\" are not. <\/li><\/ul><p>Let's define the <span class=\"tex-font-style-it\">inverse<\/span> of the bracket sequence as follows: replace all brackets '<span class=\"tex-font-style-tt\">(<\/span>' with '<span class=\"tex-font-style-tt\">)<\/span>', and vice versa (all brackets '<span class=\"tex-font-style-tt\">)<\/span>' with '<span class=\"tex-font-style-tt\">(<\/span>'). For example, strings \"<span class=\"tex-font-style-tt\">()((<\/span>\" and \"<span class=\"tex-font-style-tt\">)())<\/span>\" are inverses of each other.<\/p><p>You are given a regular bracket sequence $$$s$$$. Calculate the number of pairs of integers $$$(l,r)$$$ ($$$1 \\le l \\le r \\le |s|$$$) such that if you replace the substring of $$$s$$$ from the $$$l$$$-th character to the $$$r$$$-th character (inclusive) with its inverse, $$$s$$$ will still be a regular bracket sequence.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The only line of each test case contains a non-empty regular bracket sequence; it consists only of characters '<span class=\"tex-font-style-tt\">(<\/span>' and/or '<span class=\"tex-font-style-tt\">)<\/span>'.<\/p><p>Additional constraint on the input: the total length of the regular bracket sequences over all test cases doesn't exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print a single integer\u00a0\u2014 the number of pairs $$$(l,r)$$$ meeting the conditions from the statement.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">(())<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">()<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">()()()<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">(()())(())<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n0\n3\n13\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, there is only one pair: <\/p><ul> <li> $$$(2, 3)$$$: <span class=\"tex-font-style-tt\">(())<\/span> $$$\\rightarrow$$$ <span class=\"tex-font-style-tt\">()()<\/span>. <\/li><\/ul><p>In the second example, there are no pairs.<\/p><p>In the third example, there are three pairs: <\/p><ul> <li> $$$(2, 3)$$$: <span class=\"tex-font-style-tt\">()()()<\/span> $$$\\rightarrow$$$ <span class=\"tex-font-style-tt\">(())()<\/span>; <\/li><li> $$$(4, 5)$$$: <span class=\"tex-font-style-tt\">()()()<\/span> $$$\\rightarrow$$$ <span class=\"tex-font-style-tt\">()(())<\/span>; <\/li><li> $$$(2, 5)$$$: <span class=\"tex-font-style-tt\">()()()<\/span> $$$\\rightarrow$$$ <span class=\"tex-font-style-tt\">(()())<\/span>; <\/li><\/ul><\/div><\/div>"}, {"contestId": 545, "index": "E", "name": "Paths and Trees", "rating": 2000, "solvedCount": 5977, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Paths and Trees<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Little girl Susie accidentally found her elder brother's notebook. She has many things to do, more important than solving problems, but she found this problem too interesting, so she wanted to know its solution and decided to ask you about it. So, the problem statement is as follows.<\/p><p>Let's assume that we are given a <span class=\"tex-font-style-bf\">connected<\/span> weighted undirected graph <span class=\"tex-span\"><i>G<\/i>\u2009=\u2009(<i>V<\/i>,\u2009<i>E<\/i>)<\/span> (here <span class=\"tex-span\"><i>V<\/i><\/span> is the set of vertices, <span class=\"tex-span\"><i>E<\/i><\/span> is the set of edges). The shortest-path tree from vertex <span class=\"tex-span\"><i>u<\/i><\/span> is such graph <span class=\"tex-span\"><i>G<\/i><sub class=\"lower-index\">1<\/sub>\u2009=\u2009(<i>V<\/i>,\u2009<i>E<\/i><sub class=\"lower-index\">1<\/sub>)<\/span> that is a tree with the set of edges <span class=\"tex-span\"><i>E<\/i><sub class=\"lower-index\">1<\/sub><\/span> that is the subset of the set of edges of the initial graph <span class=\"tex-span\"><i>E<\/i><\/span>, and the lengths of the shortest paths from <span class=\"tex-span\"><i>u<\/i><\/span> to any vertex to <span class=\"tex-span\"><i>G<\/i><\/span> and to <span class=\"tex-span\"><i>G<\/i><sub class=\"lower-index\">1<\/sub><\/span> are the same. <\/p><p>You are given a <span class=\"tex-font-style-bf\">connected<\/span> weighted undirected graph <span class=\"tex-span\"><i>G<\/i><\/span> and vertex <span class=\"tex-span\"><i>u<\/i><\/span>. Your task is to find the shortest-path tree of the given graph from vertex <span class=\"tex-span\"><i>u<\/i><\/span>, the total weight of whose edges is minimum possible.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two numbers, <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20093\u00b710<sup class=\"upper-index\">5<\/sup><\/span>, <span class=\"tex-span\">0\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u20093\u00b710<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the number of vertices and edges of the graph, respectively.<\/p><p>Next <span class=\"tex-span\"><i>m<\/i><\/span> lines contain three integers each, representing an edge \u2014 <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> \u2014 the numbers of vertices connected by an edge and the weight of the edge (<span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2260\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u20091\u2009\u2264\u2009<i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>). It is guaranteed that graph is connected and that <span class=\"tex-font-style-bf\">there is no more than one edge between any pair of vertices<\/span>.<\/p><p>The last line of the input contains integer <span class=\"tex-span\"><i>u<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>u<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>) \u2014 the number of the start vertex.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In the first line print the minimum total weight of the edges of the tree.<\/p><p>In the next line print the indices of the edges that are included in the tree, separated by spaces. The edges are numbered starting from <span class=\"tex-span\">1<\/span> in the order they follow in the input. You may print the numbers of the edges in any order.<\/p><p>If there are multiple answers, print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 3<br/>1 2 1<br/>2 3 1<br/>1 3 2<br/>3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/>1 2 <br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 4<br/>1 2 1<br/>2 3 1<br/>3 4 1<br/>4 1 2<br/>4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/>2 3 4 <br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample there are two possible shortest path trees:<\/p><ul> <li> with edges <span class=\"tex-span\">1\u2009\u2013\u20093<\/span> and <span class=\"tex-span\">2\u2009\u2013\u20093<\/span> (the total weight is <span class=\"tex-span\">3<\/span>); <\/li><li> with edges <span class=\"tex-span\">1\u2009\u2013\u20092<\/span> and <span class=\"tex-span\">2\u2009\u2013\u20093<\/span> (the total weight is <span class=\"tex-span\">2<\/span>); <\/li><\/ul><p>And, for example, a tree with edges <span class=\"tex-span\">1\u2009\u2013\u20092<\/span> and <span class=\"tex-span\">1\u2009\u2013\u20093<\/span> won't be a shortest path tree for vertex <span class=\"tex-span\">3<\/span>, because the distance from vertex <span class=\"tex-span\">3<\/span> to vertex <span class=\"tex-span\">2<\/span> in this tree equals <span class=\"tex-span\">3<\/span>, and in the original graph it is <span class=\"tex-span\">1<\/span>.<\/p><\/div><\/div>"}, {"contestId": 710, "index": "E", "name": "Generate a String", "rating": 2000, "solvedCount": 5960, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Generate a String<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-tt\">zscoder<\/span> wants to generate an input file for some programming competition problem.<\/p><p>His input is a string consisting of <span class=\"tex-span\"><i>n<\/i><\/span> letters 'a'. He is too lazy to write a generator so he will manually generate the input in a text editor.<\/p><p>Initially, the text editor is empty. It takes him <span class=\"tex-span\"><i>x<\/i><\/span> seconds to insert or delete a letter 'a' from the text file and <span class=\"tex-span\"><i>y<\/i><\/span> seconds to copy the contents of the entire text file, and duplicate it.<\/p><p><span class=\"tex-font-style-tt\">zscoder<\/span> wants to find the minimum amount of time needed for him to create the input file of exactly <span class=\"tex-span\"><i>n<\/i><\/span> letters 'a'. Help him to determine the amount of time needed to generate the input.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line contains three integers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>x<\/i><\/span> and <span class=\"tex-span\"><i>y<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">7<\/sup><\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i>,\u2009<i>y<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) \u2014 the number of letters 'a' in the input file and the parameters from the problem statement.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the only integer <span class=\"tex-span\"><i>t<\/i><\/span> \u2014 the minimum amount of time needed to generate the input file.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>8 1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>8 1 10<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>8<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 359, "index": "D", "name": "Pair of Numbers", "rating": 2000, "solvedCount": 5930, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Pair of Numbers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Simon has an array <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span>, consisting of <span class=\"tex-span\"><i>n<\/i><\/span> positive integers. Today Simon asked you to find a pair of integers <span class=\"tex-span\"><i>l<\/i>,\u2009<i>r<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009<i>n<\/i>)<\/span>, such that the following conditions hold:<\/p><ol> <li> there is integer <span class=\"tex-span\"><i>j<\/i><\/span> (<span class=\"tex-span\"><i>l<\/i>\u2009\u2264\u2009<i>j<\/i>\u2009\u2264\u2009<i>r<\/i><\/span>), such that all integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>l<\/i><\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\"><i>l<\/i>\u2009+\u20091<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>r<\/i><\/sub><\/span> are divisible by <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span>; <\/li><li> value <span class=\"tex-span\"><i>r<\/i>\u2009-\u2009<i>l<\/i><\/span> takes the maximum value among all pairs for which condition <span class=\"tex-span\">1<\/span> is true; <\/li><\/ol><p>Help Simon, find the required pair of numbers <span class=\"tex-span\">(<i>l<\/i>,\u2009<i>r<\/i>)<\/span>. If there are multiple required pairs find all of them.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20093\u00b710<sup class=\"upper-index\">5<\/sup><\/span>).<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> space-separated integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup>)<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print two integers in the first line \u2014 the number of required pairs and the maximum value of <span class=\"tex-span\"><i>r<\/i>\u2009-\u2009<i>l<\/i><\/span>. On the following line print all <span class=\"tex-span\"><i>l<\/i><\/span> values from optimal pairs in increasing order.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>4 6 9 3 6<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1 3<br/>2 <br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1 3 5 7 9<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1 4<br/>1 <br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>2 3 5 7 11<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>5 0<br/>1 2 3 4 5 <br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample the pair of numbers is right, as numbers <span class=\"tex-span\">6,\u20099,\u20093<\/span> are divisible by <span class=\"tex-span\">3<\/span>.<\/p><p>In the second sample all numbers are divisible by number <span class=\"tex-span\">1<\/span>.<\/p><p>In the third sample all numbers are prime, so conditions <span class=\"tex-span\">1<\/span> and <span class=\"tex-span\">2<\/span> are true only for pairs of numbers <span class=\"tex-span\">(1,\u20091)<\/span>, <span class=\"tex-span\">(2,\u20092)<\/span>, <span class=\"tex-span\">(3,\u20093)<\/span>, <span class=\"tex-span\">(4,\u20094)<\/span>, <span class=\"tex-span\">(5,\u20095)<\/span>.<\/p><\/div><\/div>"}, {"contestId": 877, "index": "E", "name": "Danil and a Part-time Job", "rating": 2000, "solvedCount": 5914, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Danil and a Part-time Job<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Danil decided to earn some money, so he had found a part-time job. The interview have went well, so now he is a light switcher.<\/p><p>Danil works in a rooted tree (undirected connected acyclic graph) with <span class=\"tex-span\"><i>n<\/i><\/span> vertices, vertex <span class=\"tex-span\">1<\/span> is the root of the tree. There is a room in each vertex, light can be switched on or off in each room. Danil's duties include switching light in all rooms of the subtree of the vertex. It means that if light is switched on in some room of the subtree, he should switch it off. Otherwise, he should switch it on.<\/p><p>Unfortunately (or fortunately), Danil is very lazy. He knows that his boss is not going to personally check the work. Instead, he will send Danil tasks using <span class=\"tex-font-style-tt\">Workforces<\/span> personal messages.<\/p><p>There are two types of tasks: <\/p><ol><li> <span class=\"tex-font-style-tt\">pow v<\/span> describes a task to switch lights in the subtree of vertex <span class=\"tex-span\"><i>v<\/i><\/span>.<\/li><li> <span class=\"tex-font-style-tt\">get v<\/span> describes a task to count the number of rooms in the subtree of <span class=\"tex-span\"><i>v<\/i><\/span>, in which the light is turned on. Danil should send the answer to his boss using <span class=\"tex-font-style-tt\">Workforces<\/span> messages.<\/li><\/ol><p>A subtree of vertex <span class=\"tex-span\"><i>v<\/i><\/span> is a set of vertices for which the shortest path from them to the root passes through <span class=\"tex-span\"><i>v<\/i><\/span>. In particular, the vertex <span class=\"tex-span\"><i>v<\/i><\/span> is in the subtree of <span class=\"tex-span\"><i>v<\/i><\/span>.<\/p><p>Danil is not going to perform his duties. He asks you to write a program, which answers the boss instead of him.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009200\u2009000<\/span>) \u2014 the number of vertices in the tree.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> space-separated integers <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\">2<\/sub>,\u2009<i>p<\/i><sub class=\"lower-index\">3<\/sub>,\u2009...,\u2009<i>p<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009&lt;\u2009<i>i<\/i><\/span>), where <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is the ancestor of vertex <span class=\"tex-span\"><i>i<\/i><\/span>.<\/p><p>The third line contains <span class=\"tex-span\"><i>n<\/i><\/span> space-separated integers <span class=\"tex-span\"><i>t<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>t<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>t<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>t<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u20091<\/span>), where <span class=\"tex-span\"><i>t<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is <span class=\"tex-span\">1<\/span>, if the light is turned on in vertex <span class=\"tex-span\"><i>i<\/i><\/span> and <span class=\"tex-span\">0<\/span> otherwise.<\/p><p>The fourth line contains a single integer <span class=\"tex-span\"><i>q<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>q<\/i>\u2009\u2264\u2009200\u2009000<\/span>) \u2014 the number of tasks.<\/p><p>The next <span class=\"tex-span\"><i>q<\/i><\/span> lines are <span class=\"tex-font-style-tt\">get v<\/span> or <span class=\"tex-font-style-tt\">pow v<\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>v<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>) \u2014 the tasks described above.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each task <span class=\"tex-font-style-tt\">get v<\/span> print the number of rooms in the subtree of <span class=\"tex-span\"><i>v<\/i><\/span>, in which the light is turned on.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>1 1 1<br/>1 0 0 1<br/>9<br/>get 1<br/>get 2<br/>get 3<br/>get 4<br/>pow 1<br/>get 1<br/>get 2<br/>get 3<br/>get 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/>0<br/>0<br/>1<br/>2<br/>1<br/>1<br/>0<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/d6781a445b05890d8f89b31e73e0a5e630aefabb.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <span class=\"tex-font-size-small\">The tree before the task <span class=\"tex-font-style-tt\">pow 1<\/span>.<\/span><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/b7c3bb7bfafacc24c8a8074f560c2b58f380b399.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <span class=\"tex-font-size-small\">The tree after the task <span class=\"tex-font-style-tt\">pow 1<\/span>.<\/span> <\/p><\/center><\/div><\/div>"}, {"contestId": 1391, "index": "D", "name": "505", "rating": 2000, "solvedCount": 5910, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. 505<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>A binary matrix is called <span class=\"tex-font-style-bf\">good<\/span> if every <span class=\"tex-font-style-bf\">even<\/span> length square sub-matrix has an <span class=\"tex-font-style-bf\">odd<\/span> number of ones. <\/p><p>Given a binary matrix $$$a$$$ consisting of $$$n$$$ rows and $$$m$$$ columns, determine the minimum number of cells you need to change to make it good, or report that there is no way to make it good at all. <\/p><p>All the terms above have their usual meanings\u00a0\u2014 refer to the Notes section for their formal definitions. <\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\leq n \\leq m \\leq 10^6$$$ and $$$n\\cdot m \\leq 10^6$$$) \u00a0\u2014 the number of rows and columns in $$$a$$$, respectively. <\/p><p>The following $$$n$$$ lines each contain $$$m$$$ characters, each of which is one of <span class=\"tex-font-style-tt\">0<\/span> and <span class=\"tex-font-style-tt\">1<\/span>. If the $$$j$$$-th character on the $$$i$$$-th line is <span class=\"tex-font-style-tt\">1<\/span>, then $$$a_{i,j} = 1$$$. Similarly, if the $$$j$$$-th character on the $$$i$$$-th line is <span class=\"tex-font-style-tt\">0<\/span>, then $$$a_{i,j} = 0$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output the minimum number of cells you need to change to make $$$a$$$ good, or output $$$-1$$$ if it's not possible at all.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 3\n101\n001\n110\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7 15\n000100001010010\n100111010110001\n101101111100100\n010000111111010\n111010010100001\n000011001111101\n111111011010011\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n-1<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first case, changing $$$a_{1,1}$$$ to $$$0$$$ and $$$a_{2,2}$$$ to $$$1$$$ is enough. <\/p><p>You can verify that there is no way to make the matrix in the second case good. <\/p><p>Some definitions\u00a0\u2014 <\/p><ul> <li> A binary matrix is one in which every element is either $$$1$$$ or $$$0$$$. <\/li><li> A sub-matrix is described by $$$4$$$ parameters\u00a0\u2014 $$$r_1$$$, $$$r_2$$$, $$$c_1$$$, and $$$c_2$$$; here, $$$1 \\leq r_1 \\leq r_2 \\leq n$$$ and $$$1 \\leq c_1 \\leq c_2 \\leq m$$$. <\/li><li> This sub-matrix contains all elements $$$a_{i,j}$$$ that satisfy both $$$r_1 \\leq i \\leq r_2$$$ and $$$c_1 \\leq j \\leq c_2$$$. <\/li><li> A sub-matrix is, further, called an even length square if $$$r_2-r_1 = c_2-c_1$$$ and $$$r_2-r_1+1$$$ is divisible by $$$2$$$. <\/li><\/ul><\/div><\/div>"}, {"contestId": 2154, "index": "C2", "name": "No Cost Too Great (Hard Version)", "rating": 2000, "solvedCount": 5791, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C2. No Cost Too Great (Hard Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p> <\/p><p><span class=\"tex-font-style-bf\">This is the hard version of the problem. The difference between the versions is that in this version, $$$1 \\le b_i \\le 10^9$$$ for all $$$i$$$ ($$$1 \\le i \\le n$$$). You can hack only if you solved all versions of this problem.<\/span> <\/p><p>You find yourself with two arrays of positive integers $$$a$$$ and $$$b$$$, both of length $$$n$$$. You will perform the following operation any number of times (possibly none):<\/p><ul> <li> select an integer $$$i$$$ ($$$1 \\le i \\le n$$$) and increase $$$a_i$$$ by $$$1$$$. This has a cost of $$$b_i$$$. <\/li><\/ul><p>Determine the minimum total cost to make it so that there exists two integers $$$i, j$$$ where $$$1 \\le i  \\lt  j \\le n$$$ and $$$\\gcd(a_i, a_j)$$$$$$^{\\text{\u2217}}$$$$$$  \\gt  1$$$.<\/p><div class=\"statement-footnote\"><p>$$$^{\\text{\u2217}}$$$$$$\\gcd(x, y)$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Greatest_common_divisor\">greatest common divisor (GCD)<\/a> of integers $$$x$$$ and $$$y$$$. <\/p><\/div><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows. <\/p><p>The first line of each testcase contains an integer $$$n$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the length of the array $$$a$$$.<\/p><p>The second line of each testcase contains $$$n$$$ integers $$$a_1,a_2,\\ldots,a_n$$$ ($$$1 \\le a_i \\le 2 \\cdot 10^5$$$).<\/p><p>The third line of each testcase contains $$$n$$$ integers $$$b_1,b_2,\\ldots,b_n$$$ ($$$\\color{red}{1 \\le b_i \\le 10^9}$$$).<\/p><p>The sum of $$$n$$$ across all testcases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each testcase, output the minimum cost.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">41 67<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 1 727 1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 1 1000 1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 11<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2 7 11<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 6 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">2 7 11<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">100 1 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n<div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">1<\/div><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first testcase we can do the following: $$$[\\color{red}1, 1] \\xrightarrow{x = 1} [2, \\color{red}1] \\xrightarrow{x = 2} [2, 2]$$$, this has cost $$$1 + 2 = 3$$$. Now $$$\\gcd(a_1, a_2) = \\gcd(2, 2) = 2$$$ and so $$$\\gcd(a_1, a_2)  \\gt  1$$$. It can be proven that this is the minimum cost required.<\/p><p>In the second testcase it is already true that $$$\\gcd(a_1, a_2) = 4$$$ and so $$$\\gcd(a_1, a_2)  \\gt  1$$$. So no operations are required.<\/p><\/div><\/div>"}, {"contestId": 2096, "index": "D", "name": "Wonderful Lightbulbs", "rating": 2000, "solvedCount": 5742, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Wonderful Lightbulbs<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are the proud owner of an infinitely large grid of lightbulbs, represented by a <a href=\"https://en.wikipedia.org/wiki/Cartesian_coordinate_system\">Cartesian coordinate system<\/a>. Initially, all of the lightbulbs are turned off, except for one lightbulb, where you buried your proudest treasure.<\/p><p>In order to hide your treasure's position, you perform the following operation an arbitrary number of times (possibly zero):<\/p><ul> <li> Choose two <span class=\"tex-font-style-bf\">integer<\/span> numbers $$$x$$$ and $$$y$$$, and switch the state of the $$$4$$$ lightbulbs at $$$(x, y)$$$, $$$(x, y + 1)$$$, $$$(x + 1, y - 1)$$$, and $$$(x + 1, y)$$$. In other words, for each lightbulb, turn it on if it was off, and turn it off if it was on. Note that there are <span class=\"tex-font-style-bf\">no constraints<\/span> on $$$x$$$ and $$$y$$$. <\/li><\/ul><p>In the end, there are $$$n$$$ lightbulbs turned on at coordinates $$$(x_1, y_1), (x_2, y_2), \\ldots, (x_n, y_n)$$$. Unfortunately, you have already forgotten where you buried your treasure, so now you have to figure out one possible position of the treasure. Good luck!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of lightbulbs that are on.<\/p><p>The $$$i$$$-th of the next $$$n$$$ lines contains two integers $$$x_i$$$ and $$$y_i$$$ ($$$\\color{red}{-10^8} \\le x_i, y_i \\le \\color{red}{10^8}$$$)\u00a0\u2014 the coordinates of the $$$i$$$-th lightbulb. It is guaranteed that all coordinates are distinct.<\/p><p><span class=\"tex-font-style-bf\">Additional constraint<\/span>: There exists at least one position $$$(s, t)$$$ ($$$\\color{red}{-10^9} \\le s, t \\le \\color{red}{10^9}$$$), such that if the lightbulb at position $$$(s, t)$$$ is initially turned on, then after performing an arbitrary number of operations (possibly zero), we will get the given configuration of lightbulbs.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output two integers $$$s$$$ and $$$t$$$ ($$$-10^9 \\le s, t \\le 10^9$$$)\u00a0\u2014 one possible position of the buried treasure. If there are multiple solutions, print any of them.<\/p><p><span class=\"tex-font-style-bf\">For this problem, hacks are disabled.<\/span><\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">-2 -1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">-1 -2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">-1 -3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 26<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6 27<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6 28<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 27<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">8 26<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">8 27<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 28<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">11<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">70 9<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">69 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">69 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">73 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">70 -1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">70 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">71 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">70 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">73 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">71 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">72 3<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2 3\n-2 -2\n7 27\n72 7\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first test case, one possible scenario is that you hid your treasure at position $$$(2, 3)$$$. Then, you did not perform any operations.<\/p><p>In the end, only the lightbulb at $$$(2, 3)$$$ is turned on.<\/p><p>For the second test case, one possible scenario is that you hid your treasure at position $$$(-2, -2)$$$. Then, you performed $$$1$$$ operation with $$$x = -2$$$, $$$y = -2$$$.<\/p><p>The operation switches the state of the $$$4$$$ lightbulbs at $$$(-2, -2)$$$, $$$(-2, -1)$$$, $$$(-1, -3)$$$, and $$$(-1, -2)$$$.<\/p><p>In the end, the lightbulbs at $$$(-2, -1)$$$, $$$(-1, -2)$$$, and $$$(-1, -3)$$$ are turned on.<\/p><\/div><\/div>"}, {"contestId": 1857, "index": "G", "name": "Counting Graphs", "rating": 2000, "solvedCount": 5732, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. Counting Graphs<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Given a tree consisting of $$$n$$$ vertices. A tree is a connected undirected graph without cycles. Each edge of the tree has its weight, $$$w_i$$$.<\/p><p>Your task is to count the number of different graphs that satisfy all four conditions:<\/p><ol> <li> The graph does not have self-loops and multiple edges. <\/li><li> The weights on the edges of the graph are integers and do not exceed $$$S$$$. <\/li><li> The graph has <span class=\"tex-font-style-bf\">exactly one<\/span> <a href=\"http://tiny.cc/30g9vz\">minimum spanning tree<\/a>. <\/li><li> The minimum spanning tree of the graph is the given tree. <\/li><\/ol><p>Two graphs are considered different if their sets of edges are different, taking into account the weights of the edges.<\/p><p>The answer can be large, output it modulo $$$998244353$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$t$$$ ($$$1\\le t\\le 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$S$$$ ($$$2 \\le n \\le 2 \\cdot 10^5, 1\\le S\\le 10^9$$$)\u00a0\u2014 the number of vertices and the upper bound of the weights.<\/p><p>Then follow $$$n-1$$$ lines describing the tree, the $$$i$$$-th line contains three integers $$$u_i$$$, $$$v_i$$$, and $$$w_i$$$ ($$$1\\le u_i,v_i\\le n, u_i \\ne v_i, 1\\le w_i\\le S$$$)\u00a0\u2014 an edge in the tree with weight $$$w_i$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ for all tests does not exceed $$$2\\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test, output the number of different graphs that satisfy the conditions, modulo $$$998244353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 3 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 4 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 5 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">10 200<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 3 33<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 4 200<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 5 132<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 6 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 7 29<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">7 8 187<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">7 9 20<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">7 10 4<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n8\n80\n650867886\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample, there is only one graph, which is the given tree.<\/p><p>In the second samle, the given tree looks like this: <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/e048ef1dbdcea08cd0a4c83d8c8f38316194a03b.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center> All possible graphs for the second sample are shown below, the minimum spanning tree is highlighted in red:<center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/7480b89d2e9417bd9c250df456535e80b5124b56.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 1616, "index": "D", "name": "Keep the Average High", "rating": 2000, "solvedCount": 5727, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Keep the Average High<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array of integers $$$a_1, a_2, \\ldots, a_n$$$ and an integer $$$x$$$.<\/p><p>You need to select the maximum number of elements in the array, such that for every subsegment $$$a_l, a_{l + 1}, \\ldots, a_r$$$ containing strictly more than one element $$$(l  \\lt  r)$$$, either: <\/p><ul> <li> At least one element on this subsegment is <span class=\"tex-font-style-bf\">not<\/span> selected, or <\/li><li> $$$a_l + a_{l+1} + \\ldots + a_r \\geq x \\cdot (r - l + 1)$$$. <\/li><\/ul><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains one integer $$$t$$$ ($$$1 \\leq t \\leq 10$$$): the number of test cases.<\/p><p>The descriptions of $$$t$$$ test cases follow, three lines per test case.<\/p><p>In the first line you are given one integer $$$n$$$ ($$$1 \\leq n \\leq 50\\,000$$$): the number of integers in the array.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$-100\\,000 \\leq a_i \\leq 100\\,000$$$).<\/p><p>The third line contains one integer $$$x$$$ ($$$-100\\,000 \\leq x \\leq 100\\,000$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print one integer: the maximum number of elements that you can select.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n5\n1 2 3 4 5\n2\n10\n2 4 2 4 2 4 2 4 2 4\n3\n3\n-10 -5 -10\n-8\n3\n9 9 -3\n5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n8\n2\n2\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, one valid way to select the elements is $$$[\\underline{1}, 2, \\underline{3}, \\underline{4}, \\underline{5}]$$$. All subsegments satisfy at least one of the criteria. For example, for the subsegment $$$l = 1$$$, $$$r = 2$$$ we have that the element $$$2$$$ is not selected, satisfying the first criterion. For the subsegment $$$l = 3$$$, $$$r = 5$$$ we have $$$3 + 4 + 5 = 12 \\ge 2 \\cdot 3$$$, satisfying the second criterion.<\/p><p>We can't select all elements, because in this case for $$$l = 1$$$, $$$r = 2$$$ all elements are selected and we have $$$a_1 + a_2 = 3  \\lt  2 \\cdot 2$$$. Thus, the maximum number of selected elements is $$$4$$$.<\/p><p>In the second example, one valid solution is $$$[\\underline{2}, \\underline{4}, 2, \\underline{4}, \\underline{2}, \\underline{4}, 2, \\underline{4}, \\underline{2}, \\underline{4}]$$$.<\/p><p>In the third example, one valid solution is $$$[\\underline{-10}, -5, \\underline{-10}]$$$.<\/p><p>In the fourth example, one valid solution is $$$[\\underline{9}, \\underline{9}, -3]$$$.<\/p><\/div><\/div>"}, {"contestId": 1994, "index": "E", "name": "Wooden Game", "rating": 2000, "solvedCount": 5725, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Wooden Game<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a forest of $$$k$$$ rooted trees$$$^{\\text{\u2217}}$$$. Lumberjack Timofey wants to cut down the entire forest by applying the following operation: <\/p><ul> <li> Select a subtree$$$^{\\text{\u2020}}$$$ of any vertex of one of the trees and remove it from the tree. <\/li><\/ul><p>Timofey loves bitwise operations, so he wants the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#OR\">bitwise OR<\/a> of the sizes of the subtrees he removed to be maximum. Help him and find the maximum result he can obtain.<\/p><div class=\"statement-footnote\"><p>$$$^{\\text{\u2217}}$$$ A tree is a connected graph without cycles, loops, or multiple edges. In a rooted tree, a selected vertex is called a root. A forest is a collection of one or more trees.<\/p><p>$$$^{\\text{\u2020}}$$$ The subtree of a vertex $$$v$$$ is the set of vertices for which $$$v$$$ lies on the shortest path from this vertex to the root, including $$$v$$$ itself.<\/p><\/div><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test consists of multiple test cases. The first line contains an integer $$$t$$$ ($$$1 \\leq t \\leq 10^4$$$)\u00a0\u2014 the number of test cases. Then follows the description of the test cases.<\/p><p>The first line of each test case contains a single integer $$$k$$$ ($$$1 \\leq k \\leq 10^6$$$)\u00a0\u2014 the number of trees in the forest.<\/p><p>This is followed by a description of each of the $$$k$$$ trees:<\/p><p>The first line contains a single integer $$$n$$$ ($$$1 \\leq n \\leq 10^6$$$)\u00a0\u2014 the size of the tree. The vertices of the tree are numbered with integers from $$$1$$$ to $$$n$$$. The root of the tree is vertex number $$$1$$$.<\/p><p>The second line contains $$$n - 1$$$ integers $$$p_2, p_3, \\ldots p_n$$$ ($$$1 \\leq p_i  \\lt  i$$$), where $$$p_i$$$\u00a0\u2014 the parent of vertex $$$i$$$.<\/p><p>It is guaranteed that the sum of $$$k$$$ and $$$n$$$ for all sets of input data does not exceed $$$10^6$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer\u00a0\u2014 the maximum result that can be obtained.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\"><br/><\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 1 3 1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 2 1 1 5 7 6 4<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n7\n10\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the second test case, the trees look like this:<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/15fb9cc5074ad4f74fb9b209f518c862d2eb6f70.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>The first operation removes the entire second tree.<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/6f5a9bd039887467d5210d9f11eb6e0b1510cd43.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>The second operation removes vertex $$$4$$$ from the first tree.<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/30ecddcc00a758df892fa8d5727c438e610b6351.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>The third operation removes the first tree. The result is $$$6|1|3 = 7$$$ ($$$|$$$ denotes bitwise OR).<\/p><p>In the third test case, the entire tree needs to be removed.<\/p><\/div><\/div>"}, {"contestId": 514, "index": "D", "name": "R2D2 and Droid Army", "rating": 2000, "solvedCount": 5723, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. R2D2 and Droid Army<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdi

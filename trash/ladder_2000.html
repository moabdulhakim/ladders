order-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$7$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$16$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$16$$$<\/td><\/tr><\/tbody><\/table> <\/center><\/div><\/div>"}, {"contestId": 1753, "index": "C", "name": "Wish I Knew How to Sort", "rating": 2000, "solvedCount": 5521, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Wish I Knew How to Sort<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a binary array $$$a$$$ (all elements of the array are $$$0$$$ or $$$1$$$) of length $$$n$$$. You wish to sort this array, but unfortunately, your algorithms teacher forgot to teach you sorting algorithms. You perform the following operations until $$$a$$$ is sorted:<\/p><ol> <li> Choose two random indices $$$i$$$ and $$$j$$$ such that $$$i  \\lt  j$$$. Indices are chosen equally probable among all pairs of indices $$$(i, j)$$$ such that $$$1 \\le i  \\lt  j \\le n$$$. <\/li><li> If $$$a_i  \\gt  a_j$$$, then swap elements $$$a_i$$$ and $$$a_j$$$. <\/li><\/ol><p>What is the <a href=\"https://en.wikipedia.org/wiki/Expected_value\">expected number<\/a> of such operations you will perform before the array becomes sorted?<\/p><p>It can be shown that the answer can be expressed as an irreducible fraction $$$\\frac{p}{q}$$$, where $$$p$$$ and $$$q$$$ are integers and $$$q \\not \\equiv 0 \\pmod{998\\,244\\,353}$$$. Output the integer equal to $$$p \\cdot q^{-1} \\bmod 998\\,244\\,353$$$. In other words, output such an integer $$$x$$$ that $$$0 \\le x  \\lt  998\\,244\\,353$$$ and $$$x \\cdot q \\equiv p \\pmod{998\\,244\\,353}$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^5$$$). Description of the test cases follows.<\/p><p>The first line of each test case contains an integer $$$n$$$ ($$$1 \\le n \\le 200\\,000$$$)\u00a0\u2014 the number of elements in the binary array.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$a_i \\in \\{0, 1\\}$$$)\u00a0\u2014 elements of the array.<\/p><p>It's guaranteed that sum of $$$n$$$ over all test cases does not exceed $$$200\\,000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case print one integer\u00a0\u2014 the value $$$p \\cdot q^{-1} \\bmod 998\\,244\\,353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">0 1 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">0 0 1 1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 1 1 0 0 1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n0\n249561107\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Consider the first test case. If the pair of indices $$$(2, 3)$$$ will be chosen, these elements will be swapped and array will become sorted. Otherwise, if one of pairs $$$(1, 2)$$$ or $$$(1, 3)$$$ will be selected, nothing will happen. So, the probability that the array will become sorted after one operation is $$$\\frac{1}{3}$$$, the probability that the array will become sorted after two operations is $$$\\frac{2}{3} \\cdot \\frac{1}{3}$$$, the probability that the array will become sorted after three operations is $$$\\frac{2}{3} \\cdot \\frac{2}{3} \\cdot \\frac{1}{3}$$$ and so on. The expected number of operations is $$$\\sum \\limits_{i=1}^{\\infty} \\left(\\frac{2}{3} \\right)^{i - 1} \\cdot \\frac{1}{3} \\cdot i = 3$$$.<\/p><p>In the second test case the array is already sorted so the expected number of operations is zero.<\/p><p>In the third test case the expected number of operations equals to $$$\\frac{75}{4}$$$ so the answer is $$$75 \\cdot 4^{-1} \\equiv 249\\,561\\,107 \\pmod {998\\,244\\,353}$$$.<\/p><\/div><\/div>"}, {"contestId": 2014, "index": "F", "name": "Sheriff's Defense", "rating": 2000, "solvedCount": 5519, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Sheriff's Defense<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><div class=\"epigraph\"><div class=\"epigraph-text\"><span class=\"tex-font-style-it\">\"Why, master,\" quoth Little John, taking the bags and weighing them in his hand, \"here is the chink of gold.\"<\/span><\/div><\/div><p>The folk hero Robin Hood has been troubling Sheriff of Nottingham greatly. Sheriff knows that Robin Hood is about to attack his camps and he wants to be prepared.<\/p><p>Sheriff of Nottingham built the camps with strategy in mind and thus there are exactly $$$n$$$ camps numbered from $$$1$$$ to $$$n$$$ and $$$n-1$$$ trails, each connecting two camps. Any camp can be reached from any other camp. Each camp $$$i$$$ has initially $$$a_i$$$ gold. <\/p><p>As it is now, all camps would be destroyed by Robin. Sheriff can strengthen a camp by subtracting exactly $$$c$$$ gold from <span class=\"tex-font-style-bf\">each of its neighboring camps<\/span> and use it to build better defenses for that camp. Strengthening a camp <span class=\"tex-font-style-bf\">doesn't change<\/span> its gold, only its neighbors' gold. A camp can have negative gold. <\/p><p>After Robin Hood's attack, all camps that have been strengthened survive the attack, all others are destroyed.<\/p><p>What's the maximum gold Sheriff can keep in his surviving camps after Robin Hood's attack if he strengthens his camps optimally? <\/p><p>Camp $$$a$$$ is neighboring camp $$$b$$$ if and only if there exists a trail connecting $$$a$$$ and $$$b$$$. Only strengthened camps count towards the answer, as others are destroyed.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>Each test case begins with two integers $$$n$$$, $$$c$$$ ($$$1 \\le n \\le 2\\cdot10^5, 1 \\le c \\le 10^9$$$)\u00a0\u2014 the number of camps and the gold taken from each neighboring camp for strengthening.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1,a_2,\\dots,a_n$$$ ($$$-10^9 \\le a_i \\le 10^9$$$)\u00a0\u2014 the initial gold of each camp.<\/p><p>Then follow $$$n-1$$$ lines, each with integers $$$u$$$, $$$v$$$ ($$$1 \\le u, v \\le n$$$, $$$u \\ne v$$$)\u00a0\u2014 meaning that there is a trail between $$$u$$$ and $$$v$$$.<\/p><p>The sum of $$$n$$$ over all test cases doesn't exceed $$$2\\cdot10^5$$$.<\/p><p>It is guaranteed that any camp is reachable from any other camp.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output a single integer, the maximum gold Sheriff of Nottingham can keep in his surviving camps after Robin Hood's attack.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 3 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 6 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">-2 -3 -1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 -4 3 6 7 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">8 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3 5 2 7 8 5 -3 -4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">7 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">7 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">8 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2 1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n8\n0\n17\n26\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, it is optimal to strengthen the second base. The final gold at each base is $$$[1,3,0]$$$.<\/p><p>In the second test case, it is optimal to strengthen all bases. The final gold at each base is $$$[2,4,2]$$$.<\/p><p>In the third test case, it is optimal to not strengthen any base.<\/p><\/div><\/div>"}, {"contestId": 1632, "index": "D", "name": "New Year Concert", "rating": 2000, "solvedCount": 5477, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. New Year Concert<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>New Year is just around the corner, which means that in School 179, preparations for the concert are in full swing.<\/p><p>There are $$$n$$$ classes in the school, numbered from $$$1$$$ to $$$n$$$, the $$$i$$$-th class has prepared a scene of length $$$a_i$$$ minutes.<\/p><p>As the main one responsible for holding the concert, Idnar knows that if a concert has $$$k$$$ scenes of lengths $$$b_1$$$, $$$b_2$$$, $$$\\ldots$$$, $$$b_k$$$ minutes, then the audience will get bored if there exist two integers $$$l$$$ and $$$r$$$ such that $$$1 \\le l \\le r \\le k$$$ and $$$\\gcd(b_l, b_{l + 1}, \\ldots, b_{r - 1}, b_r) = r - l + 1$$$, where $$$\\gcd(b_l, b_{l + 1}, \\ldots, b_{r - 1}, b_r)$$$ is equal to the <a href=\"https://en.wikipedia.org/wiki/Greatest_common_divisor\">greatest common divisor (GCD)<\/a> of the numbers $$$b_l$$$, $$$b_{l + 1}$$$, $$$\\ldots$$$, $$$b_{r - 1}$$$, $$$b_r$$$.<\/p><p>To avoid boring the audience, Idnar can ask any number of times (possibly zero) for the $$$t$$$-th class ($$$1 \\le t \\le k$$$) to make a new scene $$$d$$$ minutes in length, where $$$d$$$ can be <span class=\"tex-font-style-bf\">any positive integer<\/span>. Thus, after this operation, $$$b_t$$$ is equal to $$$d$$$. Note that $$$t$$$ and $$$d$$$ can be different for each operation.<\/p><p>For a sequence of scene lengths $$$b_1$$$, $$$b_2$$$, $$$\\ldots$$$, $$$b_{k}$$$, let $$$f(b)$$$ be the minimum number of classes Idnar has to ask to change their scene if he wants to avoid boring the audience.<\/p><p>Idnar hasn't decided which scenes will be allowed for the concert, so he wants to know the value of $$$f$$$ for each non-empty prefix of $$$a$$$. In other words, Idnar wants to know the values of $$$f(a_1)$$$, $$$f(a_1$$$,$$$a_2)$$$, $$$\\ldots$$$, $$$f(a_1$$$,$$$a_2$$$,$$$\\ldots$$$,$$$a_n)$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$) \u2014 the number of classes in the school.<\/p><p>The second line contains $$$n$$$ positive integers $$$a_1$$$, $$$a_2$$$, $$$\\ldots$$$, $$$a_n$$$ ($$$1 \\le a_i \\le 10^9$$$) \u2014 the lengths of the class scenes.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a sequence of $$$n$$$ integers in a single line \u2014 $$$f(a_1)$$$, $$$f(a_1$$$,$$$a_2)$$$, $$$\\ldots$$$, $$$f(a_1$$$,$$$a_2$$$,$$$\\ldots$$$,$$$a_n)$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1\n1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 <\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n1 4 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 1 2 <\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7\n2 12 4 8 18 3 6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0 1 1 1 2 2 2 <\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test we can change $$$1$$$ to $$$2$$$, so the answer is $$$1$$$.<\/p><p>In the second test: <\/p><ul> <li> $$$[1]$$$ can be changed into $$$[2]$$$, <\/li><li> $$$[1, 4]$$$ can be changed into $$$[3, 4]$$$, <\/li><li> $$$[1, 4, 2]$$$ can be changed into $$$[2, 3, 2]$$$. <\/li><\/ul><\/div><\/div>"}, {"contestId": 1923, "index": "E", "name": "Count Paths", "rating": 2000, "solvedCount": 5451, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Count Paths<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a tree, consisting of $$$n$$$ vertices, numbered from $$$1$$$ to $$$n$$$. Every vertex is colored in some color, denoted by an integer from $$$1$$$ to $$$n$$$.<\/p><p>A simple path of the tree is called <span class=\"tex-font-style-it\">beautiful<\/span> if: <\/p><ul> <li> it consists of at least $$$2$$$ vertices; <\/li><li> the first and the last vertices of the path have the same color; <\/li><li> no other vertex on the path has the same color as the first vertex. <\/li><\/ul><p>Count the number of the <span class=\"tex-font-style-it\">beautiful<\/span> simple paths of the tree. Note that paths are considered undirected (i. e. the path from $$$x$$$ to $$$y$$$ is the same as the path from $$$y$$$ to $$$x$$$).<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of testcases.<\/p><p>The first line of each testcase contains a single integer $$$n$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of vertices in the tree.<\/p><p>The second line contains $$$n$$$ integers $$$c_1, c_2, \\dots, c_n$$$ ($$$1 \\le c_i \\le n$$$)\u00a0\u2014 the color of each vertex.<\/p><p>The $$$i$$$-th of the next $$$n - 1$$$ lines contains two integers $$$v_i$$$ and $$$u_i$$$ ($$$1 \\le v_i, u_i \\le n$$$; $$$v_i \\neq u_i$$$)\u00a0\u2014 the $$$i$$$-th edge of the tree.<\/p><p>The given edges form a valid tree. The sum of $$$n$$$ over all testcases doesn't exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each testcase, print a single integer\u00a0\u2014 the number of the <span class=\"tex-font-style-it\">beautiful<\/span> simple paths of the tree.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 1 2 1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 3 4 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 2 2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 4<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n3\n0\n3\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1783, "index": "D", "name": "Different Arrays", "rating": 2000, "solvedCount": 5421, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Different Arrays<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ consisting of $$$n$$$ integers.<\/p><p>You <span class=\"tex-font-style-bf\">have to<\/span> perform the sequence of $$$n-2$$$ operations on this array:<\/p><ul> <li> during the first operation, you either add $$$a_2$$$ to $$$a_1$$$ and subtract $$$a_2$$$ from $$$a_3$$$, or add $$$a_2$$$ to $$$a_3$$$ and subtract $$$a_2$$$ from $$$a_1$$$; <\/li><li> during the second operation, you either add $$$a_3$$$ to $$$a_2$$$ and subtract $$$a_3$$$ from $$$a_4$$$, or add $$$a_3$$$ to $$$a_4$$$ and subtract $$$a_3$$$ from $$$a_2$$$; <\/li><li> ... <\/li><li> during the last operation, you either add $$$a_{n-1}$$$ to $$$a_{n-2}$$$ and subtract $$$a_{n-1}$$$ from $$$a_n$$$, or add $$$a_{n-1}$$$ to $$$a_n$$$ and subtract $$$a_{n-1}$$$ from $$$a_{n-2}$$$. <\/li><\/ul><p>So, during the $$$i$$$-th operation, you add the value of $$$a_{i+1}$$$ to one of its neighbors, and subtract it from the other neighbor.<\/p><p>For example, if you have the array $$$[1, 2, 3, 4, 5]$$$, one of the possible sequences of operations is:<\/p><ul> <li> subtract $$$2$$$ from $$$a_3$$$ and add it to $$$a_1$$$, so the array becomes $$$[3, 2, 1, 4, 5]$$$; <\/li><li> subtract $$$1$$$ from $$$a_2$$$ and add it to $$$a_4$$$, so the array becomes $$$[3, 1, 1, 5, 5]$$$; <\/li><li> subtract $$$5$$$ from $$$a_3$$$ and add it to $$$a_5$$$, so the array becomes $$$[3, 1, -4, 5, 10]$$$. <\/li><\/ul><p>So, the resulting array is $$$[3, 1, -4, 5, 10]$$$.<\/p><p>An array is <span class=\"tex-font-style-it\">reachable<\/span> if it can be obtained by performing the aforementioned sequence of operations on $$$a$$$. You have to calculate the number of reachable arrays, and print it modulo $$$998244353$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$3 \\le n \\le 300$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$0 \\le a_i \\le 300$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the number of reachable arrays. Since the answer can be very large, print its remainder modulo $$$998244353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n1 1 1 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n1 2 3 5 0\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n7\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1841, "index": "D", "name": "Pairs of Segments", "rating": 2000, "solvedCount": 5418, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Pairs of Segments<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Two segments $$$[l_1, r_1]$$$ and $$$[l_2, r_2]$$$ intersect if there exists at least one $$$x$$$ such that $$$l_1 \\le x \\le r_1$$$ and $$$l_2 \\le x \\le r_2$$$.<\/p><p>An array of segments $$$[[l_1, r_1], [l_2, r_2], \\dots, [l_k, r_k]]$$$ is called <span class=\"tex-font-style-bf\">beautiful<\/span> if $$$k$$$ is even, and is possible to split the elements of this array into $$$\\frac{k}{2}$$$ pairs in such a way that:<\/p><ul> <li> every element of the array belongs to exactly one of the pairs; <\/li><li> segments in each pair intersect with each other; <\/li><li> segments in different pairs do not intersect. <\/li><\/ul><p>For example, the array $$$[[2, 4], [9, 12], [2, 4], [7, 7], [10, 13], [6, 8]]$$$ is beautiful, since it is possible to form $$$3$$$ pairs as follows:<\/p><ul> <li> the first element of the array (segment $$$[2, 4]$$$) and the third element of the array (segment $$$[2, 4]$$$); <\/li><li> the second element of the array (segment $$$[9, 12]$$$) and the fifth element of the array (segment $$$[10, 13]$$$); <\/li><li> the fourth element of the array (segment $$$[7, 7]$$$) and the sixth element of the array (segment $$$[6, 8]$$$). <\/li><\/ul><p>As you can see, the segments in each pair intersect, and no segments from different pairs intersect.<\/p><p>You are given an array of $$$n$$$ segments $$$[[l_1, r_1], [l_2, r_2], \\dots, [l_n, r_n]]$$$. You have to remove the minimum possible number of elements from this array so that the resulting array is beautiful.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 1000$$$) \u2014 the number of test cases.<\/p><p>The first line of each test case contains one integer $$$n$$$ ($$$2 \\le n \\le 2000$$$) \u2014 the number of segments in the array. Then, $$$n$$$ lines follow, the $$$i$$$-th of them contains two integers $$$l_i$$$ and $$$r_i$$$ ($$$0 \\le l_i \\le r_i \\le 10^9$$$) denoting the $$$i$$$-th segment.<\/p><p>Additional constraint on the input: the sum of $$$n$$$ over all test cases does not exceed $$$2000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print one integer \u2014 the minimum number of elements you have to remove so that the resulting array is beautiful.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">9 12<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">7 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">10 13<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">6 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">0 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 4<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n3\n4\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case of the example, it is enough to delete the $$$5$$$-th element of the array of segments. Then you get the array $$$[[2, 4], [9, 12], [2, 4], [7, 7], [10, 13], [6, 8]]$$$, which is beautiful.<\/p><p>In the second test case of the example, you can delete the $$$1$$$-st, $$$3$$$-rd and $$$4$$$-th element of the array. Then you get the array $$$[[2, 8], [5, 6]]$$$, which is beautiful.<\/p><p>In the third test case of the example, you have to delete the whole array.<\/p><\/div><\/div>"}, {"contestId": 1657, "index": "D", "name": "For Gamers. By Gamers.", "rating": 2000, "solvedCount": 5391, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. For Gamers. By Gamers.<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Monocarp is playing a strategy game. In the game, he recruits a squad to fight monsters. Before each battle, Monocarp has $$$C$$$ coins to spend on his squad.<\/p><p>Before each battle starts, his squad is empty. Monocarp chooses <span class=\"tex-font-style-bf\">one type of units<\/span> and recruits no more units of that type than he can recruit with $$$C$$$ coins.<\/p><p>There are $$$n$$$ types of units. Every unit type has three parameters: <\/p><ul> <li> $$$c_i$$$\u00a0\u2014 the cost of recruiting one unit of the $$$i$$$-th type; <\/li><li> $$$d_i$$$\u00a0\u2014 the damage that one unit of the $$$i$$$-th type deals in a second; <\/li><li> $$$h_i$$$\u00a0\u2014 the amount of health of one unit of the $$$i$$$-th type. <\/li><\/ul><p>Monocarp has to face $$$m$$$ monsters. Every monster has two parameters: <\/p><ul> <li> $$$D_j$$$\u00a0\u2014 the damage that the $$$j$$$-th monster deals in a second; <\/li><li> $$$H_j$$$\u00a0\u2014 the amount of health the $$$j$$$-th monster has. <\/li><\/ul><p>Monocarp has to fight only the $$$j$$$-th monster during the $$$j$$$-th battle. He wants all his recruited units to stay alive. Both Monocarp's squad and the monster attack continuously (not once per second) and at the same time. Thus, Monocarp wins the battle if and only if his squad kills the monster strictly faster than the monster kills one of his units. The time is compared with no rounding.<\/p><p>For each monster, Monocarp wants to know the minimum amount of coins he has to spend to kill that monster. If this amount is greater than $$$C$$$, then report that it's impossible to kill that monster.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$C$$$ ($$$1 \\le n \\le 3 \\cdot 10^5$$$; $$$1 \\le C \\le 10^6$$$)\u00a0\u2014 the number of types of units and the amount of coins Monocarp has before each battle.<\/p><p>The $$$i$$$-th of the next $$$n$$$ lines contains three integers $$$c_i, d_i$$$ and $$$h_i$$$ ($$$1 \\le c_i \\le C$$$; $$$1 \\le d_i, h_i \\le 10^6$$$).<\/p><p>The next line contains a single integer $$$m$$$ ($$$1 \\le m \\le 3 \\cdot 10^5$$$)\u00a0\u2014 the number of monsters that Monocarp has to face.<\/p><p>The $$$j$$$-th of the next $$$m$$$ lines contains two integers $$$D_j$$$ and $$$H_j$$$ ($$$1 \\le D_j \\le 10^6$$$; $$$1 \\le H_j \\le 10^{12}$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$m$$$ integers. For each monster, print the minimum amount of coins Monocarp has to spend to kill that monster. If this amount is greater than $$$C$$$, then print $$$-1$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 10\n3 4 6\n5 5 5\n10 3 4\n3\n8 3\n5 4\n10 15\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5 3 -1 \n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 15\n14 10 3\n9 2 2\n10 4 3\n7 3 5\n4 3 1\n6\n11 2\n1 1\n4 7\n2 1\n1 14\n3 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n14 4 14 4 7 7 \n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 13\n13 1 9\n6 4 5\n12 18 4\n9 13 2\n5 4 5\n2\n16 3\n6 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n12 5 \n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Consider the first monster of the first example.<\/p><p>Monocarp can't recruit one unit of the first type, because it will take both him and the monster $$$0.75$$$ seconds to kill each other. He can recruit two units for the cost of $$$6$$$ coins and kill the monster in $$$0.375$$$ second.<\/p><p>Monocarp can recruit one unit of the second type, because he kills the monster in $$$0.6$$$ seconds, and the monster kills him in $$$0.625$$$ seconds. The unit is faster. Thus, $$$5$$$ coins is enough.<\/p><p>Monocarp will need at least three units of the third type to kill the first monster, that will cost $$$30$$$ coins.<\/p><p>Monocarp will spend the least coins if he chooses the second type of units and recruits one unit of that type.<\/p><\/div><\/div>"}, {"contestId": 578, "index": "C", "name": "Weakness and Poorness", "rating": 2000, "solvedCount": 5385, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Weakness and Poorness<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a sequence of n integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span>. <\/p><p>Determine a real number <span class=\"tex-span\"><i>x<\/i><\/span> such that the <span class=\"tex-font-style-it\">weakness<\/span> of the sequence <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>\u2009-\u2009<i>x<\/i>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>\u2009-\u2009<i>x<\/i>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub>\u2009-\u2009<i>x<\/i><\/span> is as small as possible.<\/p><p>The <span class=\"tex-font-style-it\">weakness<\/span> of a sequence is defined as the maximum value of the <span class=\"tex-font-style-it\">poorness<\/span> over all segments (contiguous subsequences) of a sequence.<\/p><p>The <span class=\"tex-font-style-it\">poorness<\/span> of a segment is defined as the absolute value of sum of the elements of segment.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009200\u2009000<\/span>), the length of a sequence.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">|<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>|\u2009\u2264\u200910\u2009000<\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output a real number denoting the minimum possible <span class=\"tex-font-style-it\">weakness<\/span> of <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>\u2009-\u2009<i>x<\/i>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>\u2009-\u2009<i>x<\/i>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub>\u2009-\u2009<i>x<\/i><\/span>. Your answer will be considered correct if its relative or absolute error doesn't exceed <span class=\"tex-span\">10<sup class=\"upper-index\">\u2009-\u20096<\/sup><\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>1 2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1.000000000000000<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>1 2 3 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2.000000000000000<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>10<br/>1 10 2 9 3 8 4 7 5 6<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4.500000000000000<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first case, the optimal value of <span class=\"tex-span\"><i>x<\/i><\/span> is <span class=\"tex-span\">2<\/span> so the sequence becomes <span class=\"tex-span\">\u2009-\u20091<\/span>, <span class=\"tex-span\">0<\/span>, <span class=\"tex-span\">1<\/span> and the max poorness occurs at the segment \"-1\" or segment \"1\". The poorness value (answer) equals to <span class=\"tex-span\">1<\/span> in this case. <\/p><p>For the second sample the optimal value of <span class=\"tex-span\"><i>x<\/i><\/span> is <span class=\"tex-span\">2.5<\/span> so the sequence becomes <span class=\"tex-span\">\u2009-\u20091.5,\u2009\u2009-\u20090.5,\u20090.5,\u20091.5<\/span> and the max poorness occurs on segment \"-1.5 -0.5\" or \"0.5 1.5\". The poorness value (answer) equals to <span class=\"tex-span\">2<\/span> in this case.<\/p><\/div><\/div>"}, {"contestId": 1804, "index": "D", "name": "Accommodation", "rating": 2000, "solvedCount": 5374, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Accommodation<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Annie is an amateur photographer. She likes to take pictures of giant residential buildings at night. She just took a picture of a huge rectangular building that can be seen as a table of $$$n \\times m$$$ windows. That means that the building has $$$n$$$ floors and each floor has exactly $$$m$$$ windows. Each window is either dark or bright, meaning there is light turned on in the room behind it.<\/p><p>Annies knows that each apartment in this building is either one-bedroom or two-bedroom. Each one-bedroom apartment has exactly one window representing it on the picture, and each two-bedroom apartment has exactly two <span class=\"tex-font-style-bf\">consecutive<\/span> windows on the same floor. Moreover, the value of $$$m$$$ is guaranteed to be divisible by $$$4$$$ and it is known that each floor has exactly $$$\\frac{m}{4}$$$ two-bedroom apartments and exactly $$$\\frac{m}{2}$$$ one-bedroom apartments. The actual layout of apartments is unknown and can be different for each floor.<\/p><p>Annie considers an apartment to be occupied if <span class=\"tex-font-style-bf\">at least one<\/span> of its windows is bright. She now wonders, what are the minimum and maximum possible number of occupied apartments if judged by the given picture?<\/p><p>Formally, for each of the floors, she comes up with some particular apartments layout with exactly $$$\\frac{m}{4}$$$ two-bedroom apartments (two consecutive windows) and $$$\\frac{m}{2}$$$ one-bedroom apartments (single window). She then counts the total number of apartments that have at least one bright window. What is the minimum and maximum possible number she can get?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains two positive integers $$$n$$$ and $$$m$$$ ($$$1 \\leq n \\cdot m \\leq 5 \\cdot 10^5$$$)\u00a0\u2014 the number of floors in the building and the number of windows per floor, respectively. It is guaranteed that $$$m$$$ is divisible by $$$4$$$.<\/p><p>Then follow $$$n$$$ lines containing $$$m$$$ characters each. The $$$j$$$-th character of the $$$i$$$-th line is \"<span class=\"tex-font-style-tt\">0<\/span>\" if the $$$j$$$-th window on the $$$i$$$-th floor is dark, and is \"<span class=\"tex-font-style-tt\">1<\/span>\" if this window is bright.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print two integers, the minimum possible number of occupied apartments and the maximum possible number of occupied apartments, assuming each floor can have an individual layout of $$$\\frac{m}{4}$$$ two-bedroom and $$$\\frac{m}{2}$$$ one-bedroom apartments.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 4\n0100\n1100\n0110\n1010\n1011\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n7 10\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1 8\n01011100\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3 4\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, each floor consists of one two-bedroom apartment and two one-bedroom apartments.<\/p><p>The following apartment layout achieves the minimum possible number of occupied apartments equal to $$$7$$$. <\/p><pre class=\"verbatim\"><br/>|0 1|0|0|<br/>|1 1|0|0|<br/>|0|1 1|0|<br/>|1|0 1|0|<br/>|1|0|1 1|<br/><\/pre><p>The following apartment layout achieves the maximum possible number of occupied apartments equal to $$$10$$$. <\/p><pre class=\"verbatim\"><br/>|0 1|0|0|<br/>|1|1 0|0|<br/>|0 1|1|0|<br/>|1|0 1|0|<br/>|1 0|1|1|<br/><\/pre><\/div><\/div>"}, {"contestId": 466, "index": "B", "name": "Wonder Room", "rating": 2000, "solvedCount": 5363, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Wonder Room<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>The start of the new academic year brought about the problem of accommodation students into dormitories. One of such dormitories has a <span class=\"tex-span\"><i>a<\/i>\u2009\u00d7\u2009<i>b<\/i><\/span> square meter wonder room. The caretaker wants to accommodate exactly <span class=\"tex-span\"><i>n<\/i><\/span> students there. But the law says that there must be at least 6 square meters per student in a room (that is, the room for <span class=\"tex-span\"><i>n<\/i><\/span> students must have the area of at least <span class=\"tex-span\">6<i>n<\/i><\/span> square meters). The caretaker can enlarge any (possibly both) side of the room by an arbitrary positive integer of meters. Help him change the room so as all <span class=\"tex-span\"><i>n<\/i><\/span> students could live in it and the total area of the room was as small as possible.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains three space-separated integers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>a<\/i>,\u2009<i>b<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) \u2014 the number of students and the sizes of the room.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print three integers <span class=\"tex-span\"><i>s<\/i><\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub><\/span> and <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\">1<\/sub><\/span> <span class=\"tex-span\">(<i>a<\/i>\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\">1<\/sub>;\u00a0<i>b<\/i>\u2009\u2264\u2009<i>b<\/i><sub class=\"lower-index\">1<\/sub>)<\/span> \u2014 the final area of the room and its sizes. If there are multiple optimal solutions, print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 3 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>18<br/>3 6<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 4 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>16<br/>4 4<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1416, "index": "C", "name": "XOR Inverse", "rating": 2000, "solvedCount": 5276, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. XOR Inverse<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ consisting of $$$n$$$ non-negative integers. You have to choose a non-negative integer $$$x$$$ and form a new array $$$b$$$ of size $$$n$$$ according to the following rule: for all $$$i$$$ from $$$1$$$ to $$$n$$$, $$$b_i = a_i \\oplus x$$$ ($$$\\oplus$$$ denotes the operation <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#XOR\">bitwise XOR<\/a>).<\/p><p>An inversion in the $$$b$$$ array is a pair of integers $$$i$$$ and $$$j$$$ such that $$$1 \\le i  \\lt  j \\le n$$$ and $$$b_i  \\gt  b_j$$$.<\/p><p>You should choose $$$x$$$ in such a way that the number of inversions in $$$b$$$ is minimized. If there are several options for $$$x$$$ \u2014 output the smallest one.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>First line contains a single integer $$$n$$$ ($$$1 \\le n \\le 3 \\cdot 10^5$$$) \u2014 the number of elements in $$$a$$$.<\/p><p>Second line contains $$$n$$$ space-separated integers $$$a_1$$$, $$$a_2$$$, ..., $$$a_n$$$ ($$$0 \\le a_i \\le 10^9$$$), where $$$a_i$$$ is the $$$i$$$-th element of $$$a$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output two integers: the minimum possible number of inversions in $$$b$$$, and the minimum possible value of $$$x$$$, which achieves those number of inversions.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n0 1 3 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 0\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n9\n10 7 9 10 7 5 5 3 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4 14\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n8 10 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0 8\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample it is optimal to leave the array as it is by choosing $$$x = 0$$$.<\/p><p>In the second sample the selection of $$$x = 14$$$ results in $$$b$$$: $$$[4, 9, 7, 4, 9, 11, 11, 13, 11]$$$. It has $$$4$$$ inversions:<\/p><ul> <li> $$$i = 2$$$, $$$j = 3$$$; <\/li><li> $$$i = 2$$$, $$$j = 4$$$; <\/li><li> $$$i = 3$$$, $$$j = 4$$$; <\/li><li> $$$i = 8$$$, $$$j = 9$$$. <\/li><\/ul><p>In the third sample the selection of $$$x = 8$$$ results in $$$b$$$: $$$[0, 2, 11]$$$. It has no inversions.<\/p><\/div><\/div>"}, {"contestId": 59, "index": "E", "name": "Shortest Path", "rating": 2000, "solvedCount": 5276, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Shortest Path<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>In Ancient Berland there were <span class=\"tex-span\"><i>n<\/i><\/span> cities and <span class=\"tex-span\"><i>m<\/i><\/span> two-way roads of equal length. The cities are numbered with integers from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span> inclusively. According to an ancient superstition, if a traveller visits three cities <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> in row, without visiting other cities between them, a great disaster awaits him. Overall there are <span class=\"tex-span\"><i>k<\/i><\/span> such city triplets. Each triplet is ordered, which means that, for example, you are allowed to visit the cities in the following order: <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. Vasya wants to get from the city <span class=\"tex-span\">1<\/span> to the city <span class=\"tex-span\"><i>n<\/i><\/span> and not fulfil the superstition. Find out which minimal number of roads he should take. Also you are required to find one of his possible path routes.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains three integers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>m<\/i><\/span>, <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20093000,\u20091\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u200920000,\u20090\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>) which are the number of cities, the number of roads and the number of the forbidden triplets correspondingly. <\/p><p>Then follow <span class=\"tex-span\"><i>m<\/i><\/span> lines each containing two integers <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>) which are the road descriptions. The road is described by the numbers of the cities it joins. No road joins a city with itself, there cannot be more than one road between a pair of cities. <\/p><p>Then follow <span class=\"tex-span\"><i>k<\/i><\/span> lines each containing three integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>) which are the forbidden triplets. Each ordered triplet is listed mo more than one time. All three cities in each triplet are distinct.<\/p><p>City <span class=\"tex-span\"><i>n<\/i><\/span> can be unreachable from city <span class=\"tex-span\">1<\/span> by roads.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If there are no path from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span> print <span class=\"tex-font-style-tt\">-1<\/span>. Otherwise on the first line print the number of roads <span class=\"tex-span\"><i>d<\/i><\/span> along the shortest path from the city <span class=\"tex-span\">1<\/span> to the city <span class=\"tex-span\"><i>n<\/i><\/span>. On the second line print <span class=\"tex-span\"><i>d<\/i>\u2009+\u20091<\/span> numbers \u2014 any of the possible shortest paths for Vasya. The path should start in the city <span class=\"tex-span\">1<\/span> and end in the city <span class=\"tex-span\"><i>n<\/i><\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 4 1<br/>1 2<br/>2 3<br/>3 4<br/>1 3<br/>1 4 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/>1 3 4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 1 0<br/>1 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>-1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 4 2<br/>1 2<br/>2 3<br/>3 4<br/>1 3<br/>1 2 3<br/>1 3 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/>1 3 2 3 4<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 2140, "index": "D", "name": "A Cruel Segment's Thesis", "rating": 2000, "solvedCount": 5251, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. A Cruel Segment's Thesis<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given $$$n$$$ segments on a number line. The $$$i$$$-th segment is represented as $$$[l_i, r_i]$$$. Initially, all the segments are <span class=\"tex-font-style-bf\">unmarked<\/span>.<\/p><p>You perform the following operation repeatedly until there are no unmarked segments left: <\/p><ol> <li> In the $$$k$$$-th operation, if there are at least two unmarked segments, choose any two unmarked segments $$$[l_i, r_i]$$$ and $$$[l_j, r_j]$$$, <span class=\"tex-font-style-bf\">mark both of them<\/span>, and add a <span class=\"tex-font-style-bf\">new marked<\/span> segment $$$[x_k, y_k]$$$ satisfying the following conditions: <ul> <li> $$$l_i \\leq x_k \\leq r_i$$$, <\/li><li> $$$l_j \\leq y_k \\leq r_j$$$, <\/li><li> $$$x_k \\leq y_k$$$. <\/li><\/ul><\/li><li> If there is exactly one unmarked segment remaining, <span class=\"tex-font-style-bf\">mark it<\/span>. <\/li><\/ol><p>Your task is to determine the maximum possible sum of lengths of all the marked segments at the end of the process. Note that the length of a segment $$$([l,r])$$$ is $$$r-l$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\leq n \\leq 2 \\cdot 10^5$$$)\u00a0\u2014 the number of segments.<\/p><p>Each of the next $$$n$$$ lines contains two integers $$$l_i$$$ and $$$r_i$$$ ($$$1 \\leq l_i \\leq r_i \\leq 10^9$$$)\u00a0\u2014 the $$$i$$$-th segment.<\/p><p>It is guaranteed that the sum of $$$n$$$ across all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print a single integer\u00a0\u2014 the maximum possible total length of all marked segments at the end of the process.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1000000000<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1000000000<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 15<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 11<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">15 20<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">11 15<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1000000000 1000000000<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2999999997\n42\n59\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, we choose the given two segments and make the new segment $$$[1, 10^9]$$$.<\/p><p>In the second test case, we choose the segments $$$[1, 10]$$$ and $$$[2, 15]$$$ and make the new segment $$$[1,15]$$$. Now, $$$[3, 9]$$$ is the only segment that is left unmarked, and it will be marked in the next step.<\/p><\/div><\/div>"}, {"contestId": 1712, "index": "D", "name": "Empty Graph", "rating": 2000, "solvedCount": 5212, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Empty Graph<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><div class=\"epigraph\"><div class=\"epigraph-text\"><span class=\"tex-font-style-it\">\u00a0\u2014 Do you have a wish?<\/span><\/div><\/div> <div class=\"epigraph\"><div class=\"epigraph-text\"><span class=\"tex-font-style-it\">\u00a0\u2014 I want people to stop gifting each other arrays.<\/span><\/div><div class=\"epigraph-source\">O_o and Another Young Boy<\/div><\/div><p>An array of $$$n$$$ <span class=\"tex-font-style-bf\">positive<\/span> integers $$$a_1,a_2,\\ldots,a_n$$$ fell down on you from the skies, along with a positive integer $$$k \\le n$$$.<\/p><p>You can apply the following operation at most $$$k$$$ times: <\/p><ul> <li> Choose an index $$$1 \\le i \\le n$$$ and an integer $$$1 \\le x \\le 10^9$$$. Then do $$$a_i := x$$$ (assign $$$x$$$ to $$$a_i$$$). <\/li><\/ul><p>Then build a <a href=\"https://en.wikipedia.org/wiki/Complete_graph\">complete<\/a> undirected <span class=\"tex-font-style-bf\">weighted<\/span> graph with $$$n$$$ vertices numbered with integers from $$$1$$$ to $$$n$$$, where edge $$$(l, r)$$$ ($$$1 \\le l  \\lt  r \\le n$$$) has weight $$$\\min(a_{l},a_{l+1},\\ldots,a_{r})$$$.<\/p><p>You have to find the maximum possible <span class=\"tex-font-style-it\">diameter<\/span> of the resulting graph after performing at most $$$k$$$ operations.<\/p><p>The <span class=\"tex-font-style-it\">diameter<\/span> of a graph is equal to $$$\\max\\limits_{1 \\le u  \\lt  v \\le n}{\\operatorname{d}(u, v)}$$$, where $$$\\operatorname{d}(u, v)$$$ is the length of the shortest path between vertex $$$u$$$ and vertex $$$v$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). Description of the test cases follows.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$k$$$ ($$$2 \\le n \\le 10^5$$$, $$$1 \\le k \\le n$$$).<\/p><p>The second line of each test case contains $$$n$$$ <span class=\"tex-font-style-bf\">positive<\/span> integers $$$a_1,a_2,\\ldots,a_n$$$ ($$$1 \\le a_i \\le 10^9$$$).<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case print one integer\u00a0\u2014 the maximum possible diameter of the graph after performing at most $$$k$$$ operations.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 4 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 9 84<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">10 2 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">179 17 1000000000<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5 9<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">4 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n168\n10\n1000000000\n9\n1000000000\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, one of the optimal arrays is $$$[2,4,5]$$$.<\/p><p>The graph built on this array: <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/6d2b47e301fce5a348018b4ad55654aef3ce6a90.png\" style=\"zoom: 40.0%;max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>$$$\\operatorname{d}(1, 2) = \\operatorname{d}(1, 3) = 2$$$ and $$$\\operatorname{d}(2, 3) = 4$$$, so the <span class=\"tex-font-style-it\">diameter<\/span> is equal to $$$\\max(2,2,4) = 4$$$.<\/p><\/div><\/div>"}, {"contestId": 2063, "index": "D", "name": "Game With Triangles", "rating": 2000, "solvedCount": 5209, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Game With Triangles<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><center> <span class=\"tex-font-size-small\"><span class=\"tex-font-style-it\">Even Little John needs money to buy a house. But he recently lost his job; how will he earn money now? Of course, by playing a game that gives him money as a reward! Oh well, maybe not those kinds of games you are thinking about.<\/span><\/span> <\/center><p>There are $$$n+m$$$ distinct points $$$(a_1,0), (a_2,0), \\ldots, (a_{n},0), (b_1,2), (b_2,2), \\ldots, (b_{m},2)$$$ on the plane. Initially, your score is $$$0$$$. To increase your score, you can perform the following operation:<\/p><ul> <li> Choose three distinct points which are not <a href=\"https://en.wikipedia.org/wiki/Collinearity\">collinear<\/a>; <\/li><li> Increase your score by the area of the triangle formed by these three points; <\/li><li> Then, erase the three points from the plane. <\/li><\/ul><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/5f6a73286fffbc2708f1d388ed58ca5bc0d69d23.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"720px\"/> <span class=\"tex-font-size-small\">An instance of the game, where the operation is performed twice.<\/span> <\/center><p>Let $$$k_{\\max}$$$ be the maximum number of operations that can be performed. For example, if it is impossible to perform any operation, $$$k_\\max$$$ is $$$0$$$. Additionally, define $$$f(k)$$$ as the maximum possible score achievable by performing the operation <span class=\"tex-font-style-bf\">exactly $$$k$$$ times<\/span>. Here, $$$f(k)$$$ is defined for all integers $$$k$$$ such that $$$0 \\le k \\le k_{\\max}$$$.<\/p><p>Find the value of $$$k_{\\max}$$$, and find the values of $$$f(x)$$$ for all integers $$$x=1,2,\\ldots,k_{\\max}$$$ independently.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le {3 \\cdot 10^4}$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\le n,m \\le 2 \\cdot 10^5$$$).<\/p><p>The second line of each test case contains $$$n$$$ pairwise distinct integers $$$a_1,a_2,\\ldots,a_{n}$$$\u00a0\u2014 the points on $$$y=0$$$ ($$$-10^9 \\le a_i \\le 10^9$$$).<\/p><p>The third line of each test case contains $$$m$$$ pairwise distinct integers $$$b_1,b_2,\\ldots,b_{m}$$$\u00a0\u2014 the points on $$$y=2$$$ ($$$-10^9 \\le b_i \\le 10^9$$$).<\/p><p>It is guaranteed that both the sum of $$$n$$$ and the sum of $$$m$$$ over all test cases do not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, given that the maximum number of operations is $$$k_{\\max}$$$, you must output at most two lines:<\/p><ul> <li> The first line contains the value of $$$k_{\\max}$$$; <\/li><li> The second line contains $$$k_{\\max}$$$ integers denoting $$$f(1),f(2),\\ldots,f(k_{\\max})$$$. You are allowed to omit this line if $$$k_{\\max}$$$ is $$$0$$$. <\/li><\/ul><p>Note that under the constraints of this problem, it can be shown that all values of $$$f(x)$$$ are integers no greater than $$$10^{16}$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">0 1 -1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">0 100<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">-100 -50 0 50<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0 1000<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">-100 -50 0 50<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">20 1 27 100 43 42<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">100 84 1 24 22 77<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">8 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">564040265 -509489796 469913620 198872582 -400714529 553177666 131159391 -20796763<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">-1000000000 1000000000<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n2\n2\n150 200\n2\n1000 200\n4\n99 198 260 283\n2\n2000000000 2027422256\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>On the first test case, there are $$$1+3=4$$$ points $$$(0,0),(0,2),(1,2),(-1,2)$$$.<\/p><p>It can be shown that you cannot perform two or more operations. The value of $$$k_{\\max}$$$ is $$$1$$$, and you are only asked for the value of $$$f(1)$$$.<\/p><p>You can choose $$$(0,0)$$$, $$$(-1,2)$$$, and $$$(1,2)$$$ as the three vertices of the triangle. After that, your score is increased by the area of the triangle, which is $$$2$$$. Then, the three points are erased from the plane. It can be shown that the maximum value of your score after performing one operation is $$$2$$$. Therefore, the value of $$$f(1)$$$ is $$$2$$$.<\/p><p>On the fifth test case, there are $$$8+2=10$$$ points.<\/p><p>It can be shown that you cannot perform three or more operations. The value of $$$k_{\\max}$$$ is $$$2$$$, and you are asked for the values $$$f(1)$$$ and $$$f(2)$$$.<\/p><p>To maximize the score with only one operation, you can choose three points $$$(198\\,872\\,582,0)$$$, $$$(-1\\,000\\,000\\,000,2)$$$, and $$$(1\\,000\\,000\\,000,2)$$$. Then, the three points are erased from the plane. It can be shown that the maximum value of your score after performing one operation is $$$2\\,000\\,000\\,000$$$. Therefore, the value of $$$f(1)$$$ is $$$2\\,000\\,000\\,000$$$.<\/p><p>To maximize the score with exactly two operations, you can choose the following sequence of operations.<\/p><ul> <li> Choose three points $$$(-509\\,489\\,796,0)$$$, $$$(553\\,177\\,666,0)$$$, and $$$(-1\\,000\\,000\\,000,2)$$$. The three points are erased. <\/li><li> Choose three points $$$(-400\\,714\\,529,0)$$$, $$$(564\\,040\\,265,0)$$$, and $$$(1\\,000\\,000\\,000,2)$$$. The three points are erased. <\/li><\/ul><p>Then, the score after two operations becomes $$$2\\,027\\,422\\,256$$$. It can be shown that the maximum value of your score after performing exactly two operations is $$$2\\,027\\,422\\,256$$$. Therefore, the value of $$$f(2)$$$ is $$$2\\,027\\,422\\,256$$$.<\/p><\/div><\/div>"}];
    let currentProblem = null;
    let editor = null;
    const STORAGE_KEY = `cf_ladder_done_2000`;
    let doneSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));

    // Retrieve the template securely from the hidden textarea
    const DEFAULT_TEMPLATE = document.getElementById('cpp-template').value.trim();

    function initEditor() {
        editor = ace.edit("editor");
        editor.setTheme("ace/theme/tomorrow_night_eighties");
        editor.session.setMode("ace/mode/c_cpp");
        editor.setFontSize(15);
        editor.setValue(DEFAULT_TEMPLATE, 1);
    }

    function renderSidebar() {
        const list = document.getElementById('problem-list');
        list.innerHTML = '';
        PROBLEMS.forEach((prob, idx) => {
            const div = document.createElement('div');
            div.className = `problem-item ${currentProblem === prob ? 'active' : ''}`;
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox'; checkbox.className = 'done-checkbox'; checkbox.checked = doneSet.has(prob.name);
            checkbox.onclick = (e) => { e.stopPropagation(); toggleDone(prob.name, checkbox.checked); };
            const title = document.createElement('div');
            title.innerHTML = `<span class="text-xs text-slate-500">#${idx + 1}</span> <span class="font-semibold text-slate-200">${prob.name}</span>`;
            div.appendChild(checkbox); div.appendChild(title); div.onclick = () => loadProblem(prob);
            list.appendChild(div);
        });
        updateProgress();
    }

    function toggleDone(name, isDone) {

        localStorage.setItem(STORAGE_KEY, JSON.stringify([...doneSet]));

    function updateProgress() { document.getElementById('progress-text').innerText = `${doneSet.size} / ${PROBLEMS.length} Solved`; }

    function toggleSettings() {

    async function sha512(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-512', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function submitCode() {
        if(!currentProblem) return alert('Select a problem first!');
        const apiKey = localStorage.getItem('cf_api_key'); const apiSecret = localStorage.getItem('cf_api_secret');
        if(!apiKey || !apiSecret) { alert('Please configure your API Key and Secret first.'); toggleSettings(); return; }
        const code = editor.getValue(); const time = Math.floor(Date.now() / 1000); const rand = Math.floor(Math.random() * 900000) + 100000;
        const params = { apiKey: apiKey, contestId: currentProblem.contestId.toString(), languageId: "54", problemIndex: currentProblem.index, source: code, time: time.toString() };
        const sortedKeys = Object.keys(params).sort();
        let paramString = sortedKeys.map(k => `${k}=${encodeURIComponent(params[k])}`).join('&');
        const sigPlain = `${rand}/problemset.submit?${paramString}#${apiSecret}`;
        const apiSig = `${rand}` + await sha512(sigPlain);
        try {
            const formData = new URLSearchParams();
            for (const key in params) formData.append(key, params[key]);
            formData.append("apiSig", apiSig);
            const res = await fetch("https://codeforces.com/api/problemset.submit", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: formData.toString() });
            const data = await res.json();
            if(data.status === 'OK') { alert('Code submitted successfully! 🎉 Check your Codeforces submissions.'); confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } }); } 
            else { alert('Submission failed: ' + data.comment); }
        } catch (err) { console.error(err); alert('Network error during submission.'); }
    }

    window.onload = () => { initEditor(); renderSidebar(); };
</script>

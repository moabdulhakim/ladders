span> and <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\">1<\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>r<\/i><sub class=\"lower-index\">1<\/sub>\u2009\u2264\u2009<i>n<\/i>,\u20091\u2009\u2264\u2009<i>c<\/i><sub class=\"lower-index\">1<\/sub>\u2009\u2264\u2009<i>m<\/i><\/span>)\u00a0\u2014 your initial coordinates. It is guaranteed that the description of the cave contains character '<span class=\"tex-font-style-tt\">X<\/span>' in cell <span class=\"tex-span\">(<i>r<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\">1<\/sub>)<\/span>, that is, the ice on the starting cell is initially cracked.<\/p><p>The next line contains two integers <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\">2<\/sub><\/span> and <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\">2<\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>r<\/i><sub class=\"lower-index\">2<\/sub>\u2009\u2264\u2009<i>n<\/i>,\u20091\u2009\u2264\u2009<i>c<\/i><sub class=\"lower-index\">2<\/sub>\u2009\u2264\u2009<i>m<\/i><\/span>)\u00a0\u2014 the coordinates of the cell through which you need to fall. The final cell may coincide with the starting one.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If you can reach the destination, print '<span class=\"tex-font-style-tt\">YES<\/span>', otherwise print '<span class=\"tex-font-style-tt\">NO<\/span>'.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 6<br/>X...XX<br/>...XX.<br/>.X..X.<br/>......<br/>1 6<br/>2 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 4<br/>.X..<br/>...X<br/>X.X.<br/>....<br/>.XX.<br/>5 3<br/>1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>NO<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 7<br/>..X.XX.<br/>.XX..X.<br/>X...X..<br/>X......<br/>2 2<br/>1 6<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample test one possible path is:<\/p><p><img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/c61f56de718beea14935ccdc85ae2c4ad45c1454.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>After the first visit of cell <span class=\"tex-span\">(2,\u20092)<\/span> the ice on it cracks and when you step there for the second time, your character falls through the ice as intended.<\/p><\/div><\/div>"}, {"contestId": 999, "index": "E", "name": "Reachability from the Capital", "rating": 2000, "solvedCount": 8319, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Reachability from the Capital<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are $$$n$$$ cities and $$$m$$$ roads in Berland. Each road connects a pair of cities. The roads in Berland are one-way.<\/p><p>What is the minimum number of new roads that need to be built to make all the cities reachable from the capital?<\/p><p>New roads will also be one-way.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input consists of three integers $$$n$$$, $$$m$$$ and $$$s$$$ ($$$1 \\le n \\le 5000, 0 \\le m \\le 5000, 1 \\le s \\le n$$$) \u2014 the number of cities, the number of roads and the index of the capital. Cities are indexed from $$$1$$$ to $$$n$$$.<\/p><p>The following $$$m$$$ lines contain roads: road $$$i$$$ is given as a pair of cities $$$u_i$$$, $$$v_i$$$ ($$$1 \\le u_i, v_i \\le n$$$, $$$u_i \\ne v_i$$$). For each pair of cities $$$(u, v)$$$, there can be at most one road from $$$u$$$ to $$$v$$$. Roads in opposite directions between a pair of cities are allowed (i.e. from $$$u$$$ to $$$v$$$ and from $$$v$$$ to $$$u$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the minimum number of extra roads needed to make all the cities reachable from city $$$s$$$. If all the cities are already reachable from $$$s$$$, print <span class=\"tex-font-style-tt\">0<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>9 9 1<br/>1 2<br/>1 3<br/>2 3<br/>1 5<br/>5 6<br/>6 1<br/>1 8<br/>9 8<br/>7 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 4 5<br/>1 2<br/>2 3<br/>3 4<br/>4 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The first example is illustrated by the following:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/ca82fd99eef303ec98f01d9cd1817ce73f8b26e4.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>For example, you can add roads ($$$6, 4$$$), ($$$7, 9$$$), ($$$1, 7$$$) to make all the cities reachable from $$$s = 1$$$.<\/p><p>The second example is illustrated by the following:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/cc217a38f5d6dc7f528e4e6297a6ebc899806c92.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>In this example, you can add any one of the roads ($$$5, 1$$$), ($$$5, 2$$$), ($$$5, 3$$$), ($$$5, 4$$$) to make all the cities reachable from $$$s = 5$$$.<\/p><\/div><\/div>"}, {"contestId": 1763, "index": "C", "name": "Another Array Problem", "rating": 2000, "solvedCount": 8012, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Another Array Problem<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ of $$$n$$$ integers. You are allowed to perform the following operation on it as many times as you want (0 or more times): <\/p><ul> <li> Choose $$$2$$$ indices $$$i$$$,$$$j$$$ where $$$1 \\le i  \\lt  j \\le n$$$ and replace $$$a_k$$$ for all $$$i \\leq k \\leq j$$$ with $$$|a_i - a_j|$$$ <\/li><\/ul><p>Print the maximum sum of all the elements of the final array that you can obtain in such a way.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^5$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the length of the array $$$a$$$.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$)\u00a0\u2014 the elements of array $$$a$$$.<\/p><p>It's guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print the sum of the final array.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">9 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 9 5<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n16\n18\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, it is not possible to achieve a sum $$$ \\gt  3$$$ by using these operations, therefore the maximum sum is $$$3$$$.<\/p><p>In the second test case, it can be shown that the maximum sum achievable is $$$16$$$. By using operation $$$(1,2)$$$ we transform the array from $$$[9,1]$$$ into $$$[8,8]$$$, thus the sum of the final array is $$$16$$$. <\/p><p>In the third test case, it can be shown that it is not possible to achieve a sum $$$ \\gt  18$$$ by using these operations, therefore the maximum sum is $$$18$$$.<\/p><\/div><\/div>"}, {"contestId": 383, "index": "C", "name": "Propagating tree", "rating": 2000, "solvedCount": 7980, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Propagating tree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Iahub likes trees very much. Recently he discovered an interesting tree named propagating tree. The tree consists of <span class=\"tex-span\"><i>n<\/i><\/span> nodes numbered from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span>, each node <span class=\"tex-span\"><i>i<\/i><\/span> having an initial value <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. The root of the tree is node <span class=\"tex-span\">1<\/span>.<\/p><p>This tree has a special property: when a value <span class=\"tex-span\"><i>val<\/i><\/span> is added to a value of node <span class=\"tex-span\"><i>i<\/i><\/span>, the value -<span class=\"tex-span\"><i>val<\/i><\/span> is added to values of all the children of node <span class=\"tex-span\"><i>i<\/i><\/span>. Note that when you add value -<span class=\"tex-span\"><i>val<\/i><\/span> to a child of node <span class=\"tex-span\"><i>i<\/i><\/span>, you also add -(-<span class=\"tex-span\"><i>val<\/i><\/span>) to all children of the child of node <span class=\"tex-span\"><i>i<\/i><\/span> and so on. Look an example explanation to understand better how it works.<\/p><p>This tree supports two types of queries:<\/p><ul> <li> \"<span class=\"tex-span\">1<\/span> <span class=\"tex-span\"><i>x<\/i><\/span> <span class=\"tex-span\"><i>val<\/i><\/span>\" \u2014 <span class=\"tex-span\"><i>val<\/i><\/span> is added to the value of node <span class=\"tex-span\"><i>x<\/i><\/span>; <\/li><li> \"<span class=\"tex-span\">2<\/span> <span class=\"tex-span\"><i>x<\/i><\/span>\" \u2014 print the current value of node <span class=\"tex-span\"><i>x<\/i><\/span>. <\/li><\/ul><p>In order to help Iahub understand the tree better, you must answer <span class=\"tex-span\"><i>m<\/i><\/span> queries of the preceding type.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>m<\/i>\u2009\u2264\u2009200000)<\/span>. The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub><\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">2<\/sub><\/span>, ..., <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u20091000)<\/span>. Each of the next <span class=\"tex-span\"><i>n<\/i>\u20131<\/span> lines contains two integers <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>)<\/span>, meaning that there is an edge between nodes <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>.<\/p><p>Each of the next <span class=\"tex-span\"><i>m<\/i><\/span> lines contains a query in the format described above. It is guaranteed that the following constraints hold for all queries: <span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i>\u2009\u2264\u2009<i>n<\/i>,\u20091\u2009\u2264\u2009<i>val<\/i>\u2009\u2264\u20091000<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query of type two (print the value of node <span class=\"tex-span\"><i>x<\/i><\/span>) you must print the answer to the query on a separate line. The queries must be answered in the order given in the input.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 5<br/>1 2 1 1 2<br/>1 2<br/>1 3<br/>2 4<br/>2 5<br/>1 2 3<br/>1 1 2<br/>2 1<br/>2 2<br/>2 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/>3<br/>0<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The values of the nodes are <span class=\"tex-span\">[1,\u20092,\u20091,\u20091,\u20092]<\/span> at the beginning.<\/p><p>Then value <span class=\"tex-span\">3<\/span> is added to node <span class=\"tex-span\">2<\/span>. It propagates and value -<span class=\"tex-span\">3<\/span> is added to it's sons, node <span class=\"tex-span\">4<\/span> and node <span class=\"tex-span\">5<\/span>. Then it cannot propagate any more. So the values of the nodes are <span class=\"tex-span\">[1,\u20095,\u20091,\u2009\u2009-\u20092,\u2009\u2009-\u20091]<\/span>.<\/p><p>Then value <span class=\"tex-span\">2<\/span> is added to node <span class=\"tex-span\">1<\/span>. It propagates and value -<span class=\"tex-span\">2<\/span> is added to it's sons, node <span class=\"tex-span\">2<\/span> and node <span class=\"tex-span\">3<\/span>. From node <span class=\"tex-span\">2<\/span> it propagates again, adding value <span class=\"tex-span\">2<\/span> to it's sons, node <span class=\"tex-span\">4<\/span> and node <span class=\"tex-span\">5<\/span>. Node <span class=\"tex-span\">3<\/span> has no sons, so it cannot propagate from there. The values of the nodes are <span class=\"tex-span\">[3,\u20093,\u2009\u2009-\u20091,\u20090,\u20091]<\/span>.<\/p><p>You can see all the definitions about the tree at the following link: <span class=\"tex-font-style-tt\">http://en.wikipedia.org/wiki/Tree_(graph_theory)<\/span><\/p><\/div><\/div>"}, {"contestId": 1674, "index": "E", "name": "Breaking the Wall", "rating": 2000, "solvedCount": 7874, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Breaking the Wall<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Monocarp plays \"Rage of Empires II: Definitive Edition\" \u2014 a strategic computer game. Right now he's planning to attack his opponent in the game, but Monocarp's forces cannot enter the opponent's territory since the opponent has built a wall.<\/p><p>The wall consists of $$$n$$$ sections, aligned in a row. The $$$i$$$-th section initially has durability $$$a_i$$$. If durability of some section becomes $$$0$$$ or less, this section is considered broken.<\/p><p>To attack the opponent, Monocarp needs to break at least two sections of the wall (any two sections: possibly adjacent, possibly not). To do this, he plans to use an onager \u2014 a special siege weapon. The onager can be used to shoot any section of the wall; the shot deals $$$2$$$ damage to the target section and $$$1$$$ damage to adjacent sections. In other words, if the onager shoots at the section $$$x$$$, then the durability of the section $$$x$$$ decreases by $$$2$$$, and the durability of the sections $$$x - 1$$$ and $$$x + 1$$$ (if they exist) decreases by $$$1$$$ each. <\/p><p>Monocarp can shoot at any sections any number of times, <span class=\"tex-font-style-bf\">he can even shoot at broken sections<\/span>.<\/p><p>Monocarp wants to calculate the minimum number of onager shots needed to break at least two sections. Help him!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$) \u2014 the number of sections.<\/p><p>The second line contains the sequence of integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^6$$$), where $$$a_i$$$ is the initial durability of the $$$i$$$-th section.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the minimum number of onager shots needed to break at least two sections of the wall.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n20 10 30 10 20\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n10\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n1 8 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n7 6 6 8 5 8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n14 3 8 10 15 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n1 100 100 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n40 10 10\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n7\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, it is possible to break the $$$2$$$-nd and the $$$4$$$-th section in $$$10$$$ shots, for example, by shooting the third section $$$10$$$ times. After that, the durabilities become $$$[20, 0, 10, 0, 20]$$$. Another way of doing it is firing $$$5$$$ shots at the $$$2$$$-nd section, and another $$$5$$$ shots at the $$$4$$$-th section. After that, the durabilities become $$$[15, 0, 20, 0, 15]$$$.<\/p><p>In the second example, it is enough to shoot the $$$2$$$-nd section once. Then the $$$1$$$-st and the $$$3$$$-rd section will be broken.<\/p><p>In the third example, it is enough to shoot the $$$2$$$-nd section twice (then the durabilities become $$$[5, 2, 4, 8, 5, 8]$$$), and then shoot the $$$3$$$-rd section twice (then the durabilities become $$$[5, 0, 0, 6, 5, 8]$$$). So, four shots are enough to break the $$$2$$$-nd and the $$$3$$$-rd section.<\/p><\/div><\/div>"}, {"contestId": 895, "index": "C", "name": "Square Subsets", "rating": 2000, "solvedCount": 7862, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Square Subsets<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Petya was late for the lesson too. The teacher gave him an additional task. For some array <span class=\"tex-span\"><i>a<\/i><\/span> Petya should find the number of different ways to select non-empty subset of elements from it in such a way that their product is equal to a square of some integer.<\/p><p>Two ways are considered different if sets of indexes of elements chosen by these ways are different.<\/p><p>Since the answer can be very large, you should find the answer modulo <span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097<\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>First line contains one integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>)\u00a0\u2014 the number of elements in the array.<\/p><p>Second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200970<\/span>)\u00a0\u2014 the elements of the array.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer\u00a0\u2014 the number of different ways to choose some elements so that their product is a square of a certain integer modulo <span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>1 1 1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>15<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>2 2 2 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>7<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1 2 4 5 8<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>7<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In first sample product of elements chosen by any way is <span class=\"tex-span\">1<\/span> and <span class=\"tex-span\">1\u2009=\u20091<sup class=\"upper-index\">2<\/sup><\/span>. So the answer is <span class=\"tex-span\">2<sup class=\"upper-index\">4<\/sup>\u2009-\u20091\u2009=\u200915<\/span>.<\/p><p>In second sample there are six different ways to choose elements so that their product is <span class=\"tex-span\">4<\/span>, and only one way so that their product is <span class=\"tex-span\">16<\/span>. So the answer is <span class=\"tex-span\">6\u2009+\u20091\u2009=\u20097<\/span>.<\/p><\/div><\/div>"}, {"contestId": 1363, "index": "E", "name": "Tree Shuffling", "rating": 2000, "solvedCount": 7637, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Tree Shuffling<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Ashish has a tree consisting of $$$n$$$ nodes numbered $$$1$$$ to $$$n$$$ rooted at node $$$1$$$. The $$$i$$$-th node in the tree has a cost $$$a_i$$$, and binary digit $$$b_i$$$ is written in it. He wants to have binary digit $$$c_i$$$ written in the $$$i$$$-th node in the end.<\/p><p>To achieve this, he can perform the following operation any number of times: <\/p><ul> <li> Select any $$$k$$$ nodes from the subtree of any node $$$u$$$, and shuffle the digits in these nodes as he wishes, incurring a cost of $$$k \\cdot a_u$$$. Here, he can choose $$$k$$$ ranging from $$$1$$$ to the size of the subtree of $$$u$$$. <\/li><\/ul><p>He wants to perform the operations in such a way that every node finally has the digit corresponding to its target.<\/p><p>Help him find the minimum total cost he needs to spend so that after all the operations, every node $$$u$$$ has digit $$$c_u$$$ written in it, or determine that it is impossible.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>First line contains a single integer $$$n$$$ $$$(1 \\le n \\le 2 \\cdot 10^5)$$$ denoting the number of nodes in the tree.<\/p><p>$$$i$$$-th line of the next $$$n$$$ lines contains 3 space-separated integers $$$a_i$$$, $$$b_i$$$, $$$c_i$$$ $$$(1 \\leq a_i \\leq 10^9, 0 \\leq b_i, c_i \\leq 1)$$$ \u00a0\u2014 the cost of the $$$i$$$-th node, its initial digit and its goal digit.<\/p><p>Each of the next $$$n - 1$$$ lines contain two integers $$$u$$$, $$$v$$$ $$$(1 \\leq u, v \\leq n, \\text{ } u \\ne v)$$$, meaning that there is an edge between nodes $$$u$$$ and $$$v$$$ in the tree.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the minimum total cost to make every node reach its target digit, and $$$-1$$$ if it is impossible.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n1 0 1\n20 1 0\n300 0 1\n4000 0 0\n50000 1 0\n1 2\n2 3\n2 4\n1 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n10000 0 1\n2000 1 0\n300 0 1\n40 0 0\n1 1 0\n1 2\n2 3\n2 4\n1 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n24000<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n109 0 1\n205 0 1\n1 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n-1<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The tree corresponding to samples $$$1$$$ and $$$2$$$ are: <\/p><center><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/02ed56cecf6dea5880ad08c321cf503b04888bd7.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/center><p>In sample $$$1$$$, we can choose node $$$1$$$ and $$$k = 4$$$ for a cost of $$$4 \\cdot 1$$$ = $$$4$$$ and select nodes $$${1, 2, 3, 5}$$$, shuffle their digits and get the desired digits in every node.<\/p><p>In sample $$$2$$$, we can choose node $$$1$$$ and $$$k = 2$$$ for a cost of $$$10000 \\cdot 2$$$, select nodes $$${1, 5}$$$ and exchange their digits, and similarly, choose node $$$2$$$ and $$$k = 2$$$ for a cost of $$$2000 \\cdot 2$$$, select nodes $$${2, 3}$$$ and exchange their digits to get the desired digits in every node.<\/p><p>In sample $$$3$$$, it is impossible to get the desired digits, because there is no node with digit $$$1$$$ initially.<\/p><\/div><\/div>"}, {"contestId": 938, "index": "D", "name": "Buy a Ticket", "rating": 2000, "solvedCount": 7553, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Buy a Ticket<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Musicians of a popular band \"Flayer\" have announced that they are going to \"make their exit\" with a world tour. Of course, they will visit Berland as well.<\/p><p>There are <span class=\"tex-span\"><i>n<\/i><\/span> cities in Berland. People can travel between cities using two-directional train routes; there are exactly <span class=\"tex-span\"><i>m<\/i><\/span> routes, <span class=\"tex-span\"><i>i<\/i><\/span>-th route can be used to go from city <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> to city <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (and from <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> to <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>), and it costs <span class=\"tex-span\"><i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> coins to use this route.<\/p><p>Each city will be visited by \"Flayer\", and the cost of the concert ticket in <span class=\"tex-span\"><i>i<\/i><\/span>-th city is <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> coins.<\/p><p>You have friends in every city of Berland, and they, knowing about your programming skills, asked you to calculate the minimum possible number of coins they have to pay to visit the concert. For every city <span class=\"tex-span\"><i>i<\/i><\/span> you have to compute the minimum number of coins a person from city <span class=\"tex-span\"><i>i<\/i><\/span> has to spend to travel to some city <span class=\"tex-span\"><i>j<\/i><\/span> (or possibly stay in city <span class=\"tex-span\"><i>i<\/i><\/span>), attend a concert there, and return to city <span class=\"tex-span\"><i>i<\/i><\/span> (if <span class=\"tex-span\"><i>j<\/i>\u2009\u2260\u2009<i>i<\/i><\/span>).<\/p><p>Formally, for every <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/29cd41d3b7a01103f80f7f1a061fdf146ffa49b1.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> you have to calculate <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/bf13f50757d9e541885105265d178755c39ad551.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>, where <span class=\"tex-span\"><i>d<\/i>(<i>i<\/i>,\u2009<i>j<\/i>)<\/span> is the minimum number of coins you have to spend to travel from city <span class=\"tex-span\"><i>i<\/i><\/span> to city <span class=\"tex-span\"><i>j<\/i><\/span>. If there is no way to reach city <span class=\"tex-span\"><i>j<\/i><\/span> from city <span class=\"tex-span\"><i>i<\/i><\/span>, then we consider <span class=\"tex-span\"><i>d<\/i>(<i>i<\/i>,\u2009<i>j<\/i>)<\/span> to be infinitely large.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20092\u00b710<sup class=\"upper-index\">5<\/sup><\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u20092\u00b710<sup class=\"upper-index\">5<\/sup><\/span>).<\/p><p>Then <span class=\"tex-span\"><i>m<\/i><\/span> lines follow, <span class=\"tex-span\"><i>i<\/i><\/span>-th contains three integers <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>,\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2260\u2009<i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">12<\/sup><\/span>) denoting <span class=\"tex-span\"><i>i<\/i><\/span>-th train route. There are no multiple train routes connecting the same pair of cities, that is, for each <span class=\"tex-span\">(<i>v<\/i>,\u2009<i>u<\/i>)<\/span> neither extra <span class=\"tex-span\">(<i>v<\/i>,\u2009<i>u<\/i>)<\/span> nor <span class=\"tex-span\">(<i>u<\/i>,\u2009<i>v<\/i>)<\/span> present in input.<\/p><p>The next line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009... <i>a<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">12<\/sup><\/span>) \u2014 price to attend the concert in <span class=\"tex-span\"><i>i<\/i><\/span>-th city.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>n<\/i><\/span> integers. <span class=\"tex-span\"><i>i<\/i><\/span>-th of them must be equal to the minimum number of coins a person from city <span class=\"tex-span\"><i>i<\/i><\/span> has to spend to travel to some city <span class=\"tex-span\"><i>j<\/i><\/span> (or possibly stay in city <span class=\"tex-span\"><i>i<\/i><\/span>), attend a concert there, and return to city <span class=\"tex-span\"><i>i<\/i><\/span> (if <span class=\"tex-span\"><i>j<\/i>\u2009\u2260\u2009<i>i<\/i><\/span>).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 2<br/>1 2 4<br/>2 3 7<br/>6 20 1 25<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6 14 1 25 <br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 3<br/>1 2 1<br/>2 3 1<br/>1 3 1<br/>30 10 20<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>12 10 12 <br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 478, "index": "D", "name": "Red-Green Towers", "rating": 2000, "solvedCount": 7476, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Red-Green Towers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>There are <span class=\"tex-span\"><i>r<\/i><\/span> red and <span class=\"tex-span\"><i>g<\/i><\/span> green blocks for construction of the <span class=\"tex-font-style-it\">red-green<\/span> tower. <span class=\"tex-font-style-it\">Red-green<\/span> tower can be built following next rules:<\/p><ul><p> <\/p><li> Red-green tower is consisting of some number of levels;<p> <\/p><\/li><li> Let the red-green tower consist of <span class=\"tex-span\"><i>n<\/i><\/span> levels, then the first level of this tower should consist of <span class=\"tex-span\"><i>n<\/i><\/span> blocks, second level \u2014 of <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> blocks, the third one \u2014 of <span class=\"tex-span\"><i>n<\/i>\u2009-\u20092<\/span> blocks, and so on \u2014 the last level of such tower should consist of the one block. In other words, each successive level should contain one block less than the previous one;<p> <\/p><\/li><li> Each level of the red-green tower should contain blocks of the same color.<\/li><\/ul><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/f8832fa6ce563690d8fee41a42741636a388d24c.png\" style=\"zoom: 100.0%;max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>Let <span class=\"tex-span\"><i>h<\/i><\/span> be the maximum possible number of levels of red-green tower, that can be built out of <span class=\"tex-span\"><i>r<\/i><\/span> red and <span class=\"tex-span\"><i>g<\/i><\/span> green blocks meeting the rules above. The task is to determine how many different red-green towers having <span class=\"tex-span\"><i>h<\/i><\/span> levels can be built out of the available blocks.<\/p><p>Two red-green towers are considered different if there exists some level, that consists of red blocks in the one tower and consists of green blocks in the other tower.<\/p><p>You are to write a program that will find the number of different red-green towers of height <span class=\"tex-span\"><i>h<\/i><\/span> modulo\u00a0<span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097<\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line of input contains two integers <span class=\"tex-span\"><i>r<\/i><\/span> and <span class=\"tex-span\"><i>g<\/i><\/span>, separated by a single space \u2014 the number of available red and green blocks respectively (<span class=\"tex-span\">0\u2009\u2264\u2009<i>r<\/i>,\u2009<i>g<\/i>\u2009\u2264\u20092\u00b710<sup class=\"upper-index\">5<\/sup><\/span>, <span class=\"tex-span\"><i>r<\/i>\u2009+\u2009<i>g<\/i>\u2009\u2265\u20091<\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output the only integer \u2014 the number of different possible red-green towers of height <span class=\"tex-span\"><i>h<\/i><\/span> modulo\u00a0<span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 6<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>9 7<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The image in the problem statement shows all possible red-green towers for the first sample.<\/p><\/div><\/div>"}, {"contestId": 461, "index": "B", "name": "Appleman and Tree", "rating": 2000, "solvedCount": 7446, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Appleman and Tree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Appleman has a tree with <span class=\"tex-span\"><i>n<\/i><\/span> vertices. Some of the vertices (at least one) are colored black and other vertices are colored white.<\/p><p>Consider a set consisting of <span class=\"tex-span\"><i>k<\/i><\/span> <span class=\"tex-span\">(0\u2009\u2264\u2009<i>k<\/i>\u2009&lt;\u2009<i>n<\/i>)<\/span> edges of Appleman's tree. If Appleman deletes these edges from the tree, then it will split into <span class=\"tex-span\">(<i>k<\/i>\u2009+\u20091)<\/span> parts. Note, that each part will be a tree with colored vertices.<\/p><p>Now Appleman wonders, what is the number of sets splitting the tree in such a way that each resulting part will have exactly one black vertex? Find this number modulo <span class=\"tex-span\">1000000007<\/span> (<span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097<\/span>).<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the number of tree vertices. <\/p><p>The second line contains the description of the tree: <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> integers <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\">0<\/sub>,\u2009<i>p<\/i><sub class=\"lower-index\">1<\/sub>,\u2009...,\u2009<i>p<\/i><sub class=\"lower-index\"><i>n<\/i>\u2009-\u20092<\/sub><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>i<\/i><\/span>). Where <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> means that there is an edge connecting vertex <span class=\"tex-span\">(<i>i<\/i>\u2009+\u20091)<\/span> of the tree and vertex <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. Consider tree vertices are numbered from <span class=\"tex-span\">0<\/span> to <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span>.<\/p><p>The third line contains the description of the colors of the vertices: <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\">0<\/sub>,\u2009<i>x<\/i><sub class=\"lower-index\">1<\/sub>,\u2009...,\u2009<i>x<\/i><sub class=\"lower-index\"><i>n<\/i>\u2009-\u20091<\/sub><\/span> (<span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is either <span class=\"tex-span\">0<\/span> or <span class=\"tex-span\">1<\/span>). If <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is equal to <span class=\"tex-span\">1<\/span>, vertex <span class=\"tex-span\"><i>i<\/i><\/span> is colored black. Otherwise, vertex <span class=\"tex-span\"><i>i<\/i><\/span> is colored white.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output a single integer \u2014 the number of ways to split the tree modulo <span class=\"tex-span\">1000000007<\/span> (<span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097<\/span>).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>0 0<br/>0 1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>6<br/>0 1 1 0 4<br/>1 1 0 0 1 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>10<br/>0 1 2 1 4 4 4 0 8<br/>0 0 0 1 0 1 1 0 0 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>27<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1294, "index": "F", "name": "Three Paths on a Tree", "rating": 2000, "solvedCount": 7309, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Three Paths on a Tree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an unweighted tree with $$$n$$$ vertices. Recall that a tree is a connected undirected graph without cycles.<\/p><p>Your task is to choose <span class=\"tex-font-style-bf\">three distinct<\/span> vertices $$$a, b, c$$$ on this tree such that the number of edges which belong to <span class=\"tex-font-style-bf\">at least<\/span> one of the simple paths between $$$a$$$ and $$$b$$$, $$$b$$$ and $$$c$$$, or $$$a$$$ and $$$c$$$ is the maximum possible. See the notes section for a better understanding.<\/p><p>The simple path is the path that visits each vertex at most once.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer number $$$n$$$ ($$$3 \\le n \\le 2 \\cdot 10^5$$$) \u2014 the number of vertices in the tree. <\/p><p>Next $$$n - 1$$$ lines describe the edges of the tree in form $$$a_i, b_i$$$ ($$$1 \\le a_i$$$, $$$b_i \\le n$$$, $$$a_i \\ne b_i$$$). It is guaranteed that given graph is a tree.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In the first line print one integer $$$res$$$ \u2014 the maximum number of edges which belong to <span class=\"tex-font-style-bf\">at least<\/span> one of the simple paths between $$$a$$$ and $$$b$$$, $$$b$$$ and $$$c$$$, or $$$a$$$ and $$$c$$$.<\/p><p>In the second line print three integers $$$a, b, c$$$ such that $$$1 \\le a, b, c \\le n$$$ and $$$a \\ne, b \\ne c, a \\ne c$$$.<\/p><p>If there are several answers, you can print any.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n8\n1 2\n2 3\n3 4\n4 5\n4 6\n3 7\n3 8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5\n1 8 6\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The picture corresponding to the first example (and <span class=\"tex-font-style-bf\">another one correct answer<\/span>):<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/b2da45545f804a6446ef485575565b90d1955674.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>If you choose vertices $$$1, 5, 6$$$ then the path between $$$1$$$ and $$$5$$$ consists of edges $$$(1, 2), (2, 3), (3, 4), (4, 5)$$$, the path between $$$1$$$ and $$$6$$$ consists of edges $$$(1, 2), (2, 3), (3, 4), (4, 6)$$$ and the path between $$$5$$$ and $$$6$$$ consists of edges $$$(4, 5), (4, 6)$$$. The union of these paths is $$$(1, 2), (2, 3), (3, 4), (4, 5), (4, 6)$$$ so the answer is $$$5$$$. It can be shown that there is no better answer.<\/p><\/div><\/div>"}, {"contestId": 337, "index": "D", "name": "Book of Evil", "rating": 2000, "solvedCount": 7164, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Book of Evil<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Paladin Manao caught the trail of the ancient Book of Evil in a swampy area. This area contains <span class=\"tex-span\"><i>n<\/i><\/span> settlements numbered from 1 to <span class=\"tex-span\"><i>n<\/i><\/span>. Moving through the swamp is very difficult, so people tramped exactly <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> paths. Each of these paths connects some pair of settlements and is bidirectional. Moreover, it is possible to reach any settlement from any other one by traversing one or several paths.<\/p><p>The <span class=\"tex-font-style-it\">distance<\/span> between two settlements is the minimum number of paths that have to be crossed to get from one settlement to the other one. Manao knows that the Book of Evil has got a damage range <span class=\"tex-span\"><i>d<\/i><\/span>. This means that if the Book of Evil is located in some settlement, its damage (for example, emergence of ghosts and werewolves) affects other settlements at distance <span class=\"tex-span\"><i>d<\/i><\/span> or less from the settlement where the Book resides.<\/p><p>Manao has heard of <span class=\"tex-span\"><i>m<\/i><\/span> settlements affected by the Book of Evil. Their numbers are <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>p<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>p<\/i><sub class=\"lower-index\"><i>m<\/i><\/sub><\/span>. Note that the Book may be affecting other settlements as well, but this has not been detected yet. Manao wants to determine which settlements may contain the Book. Help him with this difficult task.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains three space-separated integers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>m<\/i><\/span> and <span class=\"tex-span\"><i>d<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009100000;\u00a00\u2009\u2264\u2009<i>d<\/i>\u2009\u2264\u2009<i>n<\/i>\u2009-\u20091<\/span>). The second line contains <span class=\"tex-span\"><i>m<\/i><\/span> distinct space-separated integers <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>p<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>p<\/i><sub class=\"lower-index\"><i>m<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>). Then <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> lines follow, each line describes a path made in the area. A path is described by a pair of space-separated integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> representing the ends of this path.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single number \u2014 the number of settlements that may contain the Book of Evil. It is possible that Manao received some controversial information and there is no settlement that may contain the Book. In such case, print 0.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>6 2 3<br/>1 2<br/>1 5<br/>2 3<br/>3 4<br/>4 5<br/>5 6<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Sample 1. The damage range of the Book of Evil equals 3 and its effects have been noticed in settlements 1 and 2. Thus, it can be in settlements 3, 4 or 5.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/069017c8e4bebd842664cc76a5bdc5c9d39240a6.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 475, "index": "D", "name": "CGCDSSQ", "rating": 2000, "solvedCount": 7092, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. CGCDSSQ<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Given a sequence of integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>q<\/i><\/span> queries <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\">1<\/sub>,\u2009...,\u2009<i>x<\/i><sub class=\"lower-index\"><i>q<\/i><\/sub><\/span> on it. For each query <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> you have to count the number of pairs <span class=\"tex-span\">(<i>l<\/i>,\u2009<i>r<\/i>)<\/span> such that <span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009<i>n<\/i><\/span> and <span class=\"tex-span\"><i>gcd<\/i>(<i>a<\/i><sub class=\"lower-index\"><i>l<\/i><\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\"><i>l<\/i>\u2009+\u20091<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>r<\/i><\/sub>)\u2009=\u2009<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>.<\/p><p><img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/75eb8cdfd5fad98845289cf9223ba549ce6cc5a4.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> is a greatest common divisor of <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>v<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>v<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span>, that is equal to a largest positive integer that divides all <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains integer <span class=\"tex-span\"><i>n<\/i><\/span>, (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>), denoting the length of the sequence. The next line contains <span class=\"tex-span\"><i>n<\/i><\/span> space separated integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span>, (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>).<\/p><p>The third line of the input contains integer <span class=\"tex-span\"><i>q<\/i><\/span>, (<span class=\"tex-span\">1\u2009\u2264\u2009<i>q<\/i>\u2009\u2264\u20093\u2009\u00d7\u200910<sup class=\"upper-index\">5<\/sup><\/span>), denoting the number of queries. Then follows <span class=\"tex-span\"><i>q<\/i><\/span> lines, each contain an integer <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, (<span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query print the result in a separate line.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>2 6 3<br/>5<br/>1<br/>2<br/>3<br/>4<br/>6<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/>2<br/>2<br/>0<br/>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>7<br/>10 20 3 15 1000 60 16<br/>10<br/>1<br/>2<br/>3<br/>4<br/>5<br/>6<br/>10<br/>20<br/>60<br/>1000<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>14<br/>0<br/>2<br/>2<br/>2<br/>0<br/>2<br/>2<br/>1<br/>1<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1454, "index": "E", "name": "Number of Simple Paths", "rating": 2000, "solvedCount": 7047, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Number of Simple Paths<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an <span class=\"tex-font-style-bf\">undirected<\/span> graph consisting of $$$n$$$ vertices and $$$n$$$ edges. It is guaranteed that the given graph is <span class=\"tex-font-style-bf\">connected<\/span> (i.\u00a0e. it is possible to reach any vertex from any other vertex) and there are no self-loops and multiple edges in the graph.<\/p><p>Your task is to calculate the number of <span class=\"tex-font-style-bf\">simple paths<\/span> of length <span class=\"tex-font-style-bf\">at least<\/span> $$$1$$$ in the given graph. Note that paths that differ only by their direction are considered the same (i.\u00a0e. you have to calculate the number of <span class=\"tex-font-style-it\">undirected<\/span> paths). For example, paths $$$[1, 2, 3]$$$ and $$$[3, 2, 1]$$$ are considered the same.<\/p><p>You have to answer $$$t$$$ independent test cases.<\/p><p>Recall that a path in the graph is a sequence of vertices $$$v_1, v_2, \\ldots, v_k$$$ such that each pair of adjacent (consecutive) vertices in this sequence is connected by an edge. The length of the path is the number of edges in it. A <span class=\"tex-font-style-bf\">simple path<\/span> is such a path that all vertices in it are distinct.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains one integer $$$t$$$ ($$$1 \\le t \\le 2 \\cdot 10^4$$$) \u2014 the number of test cases. Then $$$t$$$ test cases follow.<\/p><p>The first line of the test case contains one integer $$$n$$$ ($$$3 \\le n \\le 2 \\cdot 10^5$$$) \u2014 the number of vertices (and the number of edges) in the graph.<\/p><p>The next $$$n$$$ lines of the test case describe edges: edge $$$i$$$ is given as a pair of vertices $$$u_i$$$, $$$v_i$$$ ($$$1 \\le u_i, v_i \\le n$$$, $$$u_i \\ne v_i$$$), where $$$u_i$$$ and $$$v_i$$$ are vertices the $$$i$$$-th edge connects. For each pair of vertices $$$(u, v)$$$, there is at most one edge between $$$u$$$ and $$$v$$$. There are no edges from the vertex to itself. So, there are no self-loops and multiple edges in the graph. The graph is <span class=\"tex-font-style-bf\">undirected<\/span>, i.\u00a0e. all its edges are bidirectional. The graph is connected, i.\u00a0e. it is possible to reach any vertex from any other vertex by moving along the edges of the graph.<\/p><p>It is guaranteed that the sum of $$$n$$$ does not exceed $$$2 \\cdot 10^5$$$ ($$$\\sum n \\le 2 \\cdot 10^5$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print one integer: the number of <span class=\"tex-font-style-bf\">simple paths<\/span> of length <span class=\"tex-font-style-bf\">at least<\/span> $$$1$$$ in the given graph. Note that paths that differ only by their direction are considered the same (i.\u00a0e. you have to calculate the number of <span class=\"tex-font-style-it\">undirected<\/span> paths).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n3\n1 2\n2 3\n1 3\n4\n1 2\n2 3\n3 4\n4 2\n5\n1 2\n2 3\n1 3\n2 5\n4 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n11\n18\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Consider the second test case of the example. It looks like that:<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/b669198f91cec252fe02a10ecb40a10f0f668e87.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>There are $$$11$$$ different simple paths:<\/p><ol> <li> $$$[1, 2]$$$; <\/li><li> $$$[2, 3]$$$; <\/li><li> $$$[3, 4]$$$; <\/li><li> $$$[2, 4]$$$; <\/li><li> $$$[1, 2, 4]$$$; <\/li><li> $$$[1, 2, 3]$$$; <\/li><li> $$$[2, 3, 4]$$$; <\/li><li> $$$[2, 4, 3]$$$; <\/li><li> $$$[3, 2, 4]$$$; <\/li><li> $$$[1, 2, 3, 4]$$$; <\/li><li> $$$[1, 2, 4, 3]$$$. <\/li><\/ol><\/div><\/div>"}, {"contestId": 1388, "index": "D", "name": "Captain Flint and Treasure", "rating": 2000, "solvedCount": 7005, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Captain Flint and Treasure<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-it\">Captain Fint is involved in another treasure hunt, but have found only one strange problem. The problem may be connected to the treasure's location or may not. That's why captain Flint decided to leave the solving the problem to his crew and offered an absurdly high reward: one day off. The problem itself sounds like this...<\/span><\/p><p>There are two arrays $$$a$$$ and $$$b$$$ of length $$$n$$$. Initially, an $$$ans$$$ is equal to $$$0$$$ and the following operation is defined: <\/p><ol> <li> Choose position $$$i$$$ ($$$1 \\le i \\le n$$$); <\/li><li> Add $$$a_i$$$ to $$$ans$$$; <\/li><li> If $$$b_i \\neq -1$$$ then add $$$a_i$$$ to $$$a_{b_i}$$$. <\/li><\/ol><p>What is the maximum $$$ans$$$ you can get by performing the operation on each $$$i$$$ ($$$1 \\le i \\le n$$$) <span class=\"tex-font-style-it\">exactly once<\/span>?<\/p><p>Uncle Bogdan is eager to get the reward, so he is asking your help to find the optimal order of positions to perform the operation on them.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains the integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the length of arrays $$$a$$$ and $$$b$$$.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$\u221210^6 \\le a_i \\le 10^6$$$).<\/p><p>The third line contains $$$n$$$ integers $$$b_1, b_2, \\ldots, b_n$$$ ($$$1 \\le b_i \\le n$$$ or $$$b_i = -1$$$).<\/p><p><span class=\"tex-font-style-bf\">Additional constraint: it's guaranteed that for any $$$i$$$ ($$$1 \\le i \\le n$$$) the sequence $$$b_i, b_{b_i}, b_{b_{b_i}}, \\ldots$$$ is not cyclic, in other words it will always end with $$$-1$$$.<\/span><\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In the first line, print the maximum $$$ans$$$ you can get.<\/p><p>In the second line, print the order of operations: $$$n$$$ different integers $$$p_1, p_2, \\ldots, p_n$$$ ($$$1 \\le p_i \\le n$$$). The $$$p_i$$$ is the position which should be chosen at the $$$i$$$-th step. If there are multiple orders, print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n1 2 3\n2 3 -1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n10\n1 2 3 \n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n-1 100\n2 -1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n99\n2 1 \n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n10\n-10 -1 2 2 5 -2 -3 -4 2 -6\n-1 -1 2 2 -1 5 5 7 7 9\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n-9\n3 5 6 1 9 4 10 7 8 2\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1244, "index": "E", "name": "Minimizing Difference", "rating": 2000, "solvedCount": 6972, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Minimizing Difference<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a sequence $$$a_1, a_2, \\dots, a_n$$$ consisting of $$$n$$$ integers.<\/p><p>You may perform the following operation on this sequence: choose any element and either increase or decrease it by one.<\/p><p>Calculate the minimum possible difference between the maximum element and the minimum element in the sequence, if you can perform the aforementioned operation <span class=\"tex-font-style-bf\">no more than<\/span> $$$k$$$ times.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$k$$$ $$$(2 \\le n \\le 10^{5}, 1 \\le k \\le 10^{14})$$$ \u2014 the number of elements in the sequence and the maximum number of times you can perform the operation, respectively.<\/p><p>The second line contains a sequence of integers $$$a_1, a_2, \\dots, a_n$$$ $$$(1 \\le a_i \\le 10^{9})$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the minimum possible difference between the maximum element and the minimum element in the sequence, if you can perform the aforementioned operation <span class=\"tex-font-style-bf\">no more than<\/span> $$$k$$$ times.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 5\n3 1 7 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 10\n100 100 100\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n10 9\n4 5 5 7 5 4 5 2 4 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example you can increase the first element twice and decrease the third element twice, so the sequence becomes $$$[3, 3, 5, 5]$$$, and the difference between maximum and minimum is $$$2$$$. You still can perform one operation after that, but it's useless since you can't make the answer less than $$$2$$$.<\/p><p>In the second example all elements are already equal, so you may get $$$0$$$ as the answer even without applying any operations.<\/p><\/div><\/div>"}, {"contestId": 1359, "index": "E", "name": "Modular Stability", "rating": 2000, "solvedCount": 6906, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Modular Stability<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>We define $$$x \\bmod y$$$ as the remainder of division of $$$x$$$ by $$$y$$$ ($$$\\%$$$ operator in C++ or Java, <span class=\"tex-font-style-tt\">mod<\/span> operator in Pascal).<\/p><p>Let's call an array of positive integers $$$[a_1, a_2, \\dots, a_k]$$$ <span class=\"tex-font-style-it\">stable<\/span> if for every permutation $$$p$$$ of integers from $$$1$$$ to $$$k$$$, and for every non-negative integer $$$x$$$, the following condition is met:<\/p><center> $$$ (((x \\bmod a_1) \\bmod a_2) \\dots \\bmod a_{k - 1}) \\bmod a_k = (((x \\bmod a_{p_1}) \\bmod a_{p_2}) \\dots \\bmod a_{p_{k - 1}}) \\bmod a_{p_k} $$$ <\/center><p>That is, for each non-negative integer $$$x$$$, the value of $$$(((x \\bmod a_1) \\bmod a_2) \\dots \\bmod a_{k - 1}) \\bmod a_k$$$ does not change if we reorder the elements of the array $$$a$$$.<\/p><p>For two given integers $$$n$$$ and $$$k$$$, calculate the number of <span class=\"tex-font-style-it\">stable<\/span> arrays $$$[a_1, a_2, \\dots, a_k]$$$ such that $$$1 \\le a_1  \\lt  a_2  \\lt  \\dots  \\lt  a_k \\le n$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le n, k \\le 5 \\cdot 10^5$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the number of <span class=\"tex-font-style-it\">stable<\/span> arrays $$$[a_1, a_2, \\dots, a_k]$$$ such that $$$1 \\le a_1  \\lt  a_2  \\lt  \\dots  \\lt  a_k \\le n$$$. Since the answer may be large, print it modulo $$$998244353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n16\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 7\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1337 42\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n95147305\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n500000 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n500000\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1156, "index": "C", "name": "Match Points", "rating": 2000, "solvedCount": 6895, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Match Points<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a set of points $$$x_1$$$, $$$x_2$$$, ..., $$$x_n$$$ on the number line.<\/p><p>Two points $$$i$$$ and $$$j$$$ can be matched with each other if the following conditions hold:<\/p><ul> <li> neither $$$i$$$ nor $$$j$$$ is matched with any other point; <\/li><li> $$$|x_i - x_j| \\ge z$$$. <\/li><\/ul><p>What is the maximum number of pairs of points you can match with each other?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$z$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$, $$$1 \\le z \\le 10^9$$$) \u2014 the number of points and the constraint on the distance between matched points, respectively.<\/p><p>The second line contains $$$n$$$ integers $$$x_1$$$, $$$x_2$$$, ..., $$$x_n$$$ ($$$1 \\le x_i \\le 10^9$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the maximum number of pairs of points you can match with each other.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 2\n1 3 3 7\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 5\n10 9 5 8 7\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, you may match point $$$1$$$ with point $$$2$$$ ($$$|3 - 1| \\ge 2$$$), and point $$$3$$$ with point $$$4$$$ ($$$|7 - 3| \\ge 2$$$).<\/p><p>In the second example, you may match point $$$1$$$ with point $$$3$$$ ($$$|5 - 10| \\ge 5$$$).<\/p><\/div><\/div>"}, {"contestId": 1513, "index": "D", "name": "GCD and MST", "rating": 2000, "solvedCount": 6866, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. GCD and MST<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ of $$$n$$$ ($$$n \\geq 2$$$) positive integers and an integer $$$p$$$. Consider an undirected weighted graph of $$$n$$$ vertices numbered from $$$1$$$ to $$$n$$$ for which the edges between the vertices $$$i$$$ and $$$j$$$ ($$$i \\lt j$$$) are added in the following manner:<\/p><ul> <li> If $$$gcd(a_i, a_{i+1}, a_{i+2}, \\dots, a_{j}) = min(a_i, a_{i+1}, a_{i+2}, \\dots, a_j)$$$, then there is an edge of weight $$$min(a_i, a_{i+1}, a_{i+2}, \\dots, a_j)$$$ between $$$i$$$ and $$$j$$$. <\/li><li> If $$$i+1=j$$$, then there is an edge of weight $$$p$$$ between $$$i$$$ and $$$j$$$. <\/li><\/ul><p>Here $$$gcd(x, y, \\ldots)$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Greatest_common_divisor\">greatest common divisor (GCD)<\/a> of integers $$$x$$$, $$$y$$$, ....<\/p><p>Note that there could be multiple edges between $$$i$$$ and $$$j$$$ if both of the above conditions are true, and if both the conditions fail for $$$i$$$ and $$$j$$$, then there is no edge between these vertices.<\/p><p>The goal is to find the weight of the <a href=\"https://en.wikipedia.org/wiki/Minimum_spanning_tree\">minimum spanning tree<\/a> of this graph.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains two integers $$$n$$$ ($$$2 \\leq n \\leq 2 \\cdot 10^5$$$) and $$$p$$$ ($$$1 \\leq p \\leq 10^9$$$)\u00a0\u2014 the number of nodes and the parameter $$$p$$$.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, a_3, \\dots, a_n$$$ ($$$1 \\leq a_i \\leq 10^9$$$).<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output $$$t$$$ lines. For each test case print the weight of the corresponding graph.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n2 5\n10 10\n2 5\n3 3\n4 5\n5 2 4 9\n8 8\n5 3 3 6 10 100 9 15\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5\n3\n12\n46\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Here are the graphs for the four test cases of the example (the edges of a possible MST of the graphs are marked pink):<\/p><p><span class=\"tex-font-style-bf\">For test case 1<\/span><\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/fbd5f4536bec34a1dbc98dc3679bdd574a132274.png\" style=\"zoom: 60.0%;max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p><span class=\"tex-font-style-bf\">For test case 2<\/span><\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/f11ee0a476af52f30318753c5e9b66a86aad12dc.png\" style=\"zoom: 60.0%;max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p><span class=\"tex-font-style-bf\">For test case 3<\/span><\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/11ec1f337851b0eab129d6d349a04ca6223504f4.png\" style=\"zoom: 60.0%;max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p><span class=\"tex-font-style-bf\">For test case 4<\/span><\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/9c3e0e1143b65394c8cb776e7bc45b4e12d1b780.png\" style=\"zoom: 100.0%;max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 1082, "index": "E", "name": "Increasing Frequency", "rating": 2000, "solvedCount": 6834, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Increasing Frequency<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given array $$$a$$$ of length $$$n$$$. You can choose one segment $$$[l, r]$$$ ($$$1 \\le l \\le r \\le n$$$) and integer value $$$k$$$ (positive, negative or even zero) and change $$$a_l, a_{l + 1}, \\dots, a_r$$$ by $$$k$$$ each (i.e. $$$a_i := a_i + k$$$ for each $$$l \\le i \\le r$$$).<\/p><p>What is the maximum possible number of elements with value $$$c$$$ that can be obtained after one such operation?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$c$$$ ($$$1 \\le n \\le 5 \\cdot 10^5$$$, $$$1 \\le c \\le 5 \\cdot 10^5$$$) \u2014 the length of array and the value $$$c$$$ to obtain.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 5 \\cdot 10^5$$$) \u2014 array $$$a$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the maximum possible number of elements with value $$$c$$$ which can be obtained after performing operation described above.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 9\n9 9 9 9 9 9\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 2\n6 2 6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example we can choose any segment and $$$k = 0$$$. The array will stay same.<\/p><p>In the second example we can choose segment $$$[1, 3]$$$ and $$$k = -4$$$. The array will become $$$[2, -2, 2]$$$.<\/p><\/div><\/div>"}, {"contestId": 1416, "index": "B", "name": "Make Them Equal", "rating": 2000,

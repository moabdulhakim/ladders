riends to get to the bottom right corner of the grid.<\/p><p>For this, you can give instructions of the following types: <\/p><ul> <li> You select a row $$$x$$$. All friends in this row should move to the next cell in this row. That is, friend from the cell $$$(x, y)$$$ with $$$1 \\leq y  \\lt  2n$$$ will move to the cell $$$(x, y + 1)$$$ and friend from the cell $$$(x, 2n)$$$ will move to the cell $$$(x, 1)$$$. <\/li><li> You select a row $$$x$$$. All friends in this row should move to the previous cell in this row. That is, friend from the cell $$$(x, y)$$$ with $$$1  \\lt  y \\leq 2n$$$ will move to the cell $$$(x, y - 1)$$$ and friend from the cell $$$(x, 1)$$$ will move to the cell $$$(x, 2n)$$$. <\/li><li> You select a column $$$y$$$. All friends in this column should move to the next cell in this column. That is, friend from the cell $$$(x, y)$$$ with $$$1 \\leq x  \\lt  2n$$$ will move to the cell $$$(x + 1, y)$$$ and friend from the cell $$$(2n, y)$$$ will move to the cell $$$(1, y)$$$. <\/li><li> You select a column $$$y$$$. All friends in this column should move to the previous cell in this column. That is, friend from the cell $$$(x, y)$$$ with $$$1  \\lt  x \\leq 2n$$$ will move to the cell $$$(x - 1, y)$$$ and friend from the cell $$$(1, y)$$$ will move to the cell $$$(2n, y)$$$. <\/li><\/ul><p>Note how friends on the grid border behave in these instructions.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/29361c21bb52ccf68c5c51d91aeb14ce1fcf984f.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <span class=\"tex-font-size-small\">Example of applying the third operation to the second column. Here, colorful circles denote your friends and blue cells are covered with snow.<\/span> <\/center><p>You can give such instructions any number of times. You can give instructions of different types. If after any instruction one of your friends is in the cell covered with snow he becomes ill.<\/p><p>In order to save your friends you can remove snow from some cells before giving the first instruction: <\/p><ul> <li> You can select the cell $$$(x, y)$$$ that is covered with snow now and remove snow from this cell for $$$c_{x, y}$$$ coins. <\/li><\/ul><p>You can do this operation any number of times.<\/p><p>You want to spend the minimal number of coins and give some instructions to your friends. After this, all your friends should be in the bottom right corner of the grid and none of them should be ill.<\/p><p>Please, find how many coins you will spend.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 100$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains the single integer $$$n$$$ ($$$1 \\leq n \\leq 250$$$).<\/p><p>Each of the next $$$2n$$$ lines contains $$$2n$$$ integers $$$c_{i, 1}, c_{i, 2}, \\ldots, c_{i, 2n}$$$ ($$$0 \\leq c_{i, j} \\leq 10^9$$$)\u00a0\u2014 costs of removing snow from cells. If $$$c_{i, j} = 0$$$ for some $$$i, j$$$ than there is no snow in cell $$$(i, j)$$$. Otherwise, cell $$$(i, j)$$$ is covered with snow.<\/p><p>It is guaranteed that $$$c_{i, j} = 0$$$ for $$$1 \\leq i, j \\leq n$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases doesn't exceed $$$250$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case output one integer\u00a0\u2014 the minimal number of coins you should spend.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">0 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 99<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">0 0 0 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">0 0 0 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">9 9 2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">9 9 9 9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0 0 4 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0 0 2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 2 4 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 4 2 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">0 0 0 0 0 0 0 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">0 0 0 0 0 0 2 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">0 0 0 0 0 2 0 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">0 0 0 0 2 0 0 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">0 0 0 2 2 0 2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">0 0 2 0 1 6 2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">0 2 0 0 2 4 7 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 0 0 0 2 0 1 6<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n100\n22\n14\n42\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case you can remove snow from the cells $$$(2, 1)$$$ and $$$(2, 2)$$$ for $$$100$$$ coins. Then you can give instructions <\/p><ul> <li> All friends in the first collum should move to the previous cell. After this, your friend will be in the cell $$$(2, 1)$$$. <\/li><li> All friends in the second row should move to the next cell. After this, your friend will be in the cell $$$(2, 2)$$$. <\/li><\/ul><p>In the second test case you can remove all snow from the columns $$$3$$$ and $$$4$$$ for $$$22$$$ coins. Then you can give instructions <\/p><ul> <li> All friends in the first row should move to the next cell. <\/li><li> All friends in the first row should move to the next cell. <\/li><li> All friends in the second row should move to the next cell. <\/li><li> All friends in the second row should move to the next cell. <\/li><li> All friends in the third column should move to the next cell. <\/li><li> All friends in the third column should move to the next cell. <\/li><li> All friends in the fourth column should move to the next cell. <\/li><li> All friends in the fourth column should move to the next cell. <\/li><\/ul><p>It can be shown that none of the friends will become ill and that it is impossible to spend less coins.<\/p><\/div><\/div>"}, {"contestId": 1626, "index": "D", "name": "Martial Arts Tournament", "rating": 2100, "solvedCount": 4446, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Martial Arts Tournament<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Monocarp is planning to host a martial arts tournament. There will be three divisions based on weight: lightweight, middleweight and heavyweight. The winner of each division will be determined by a single elimination system.<\/p><p>In particular, that implies that the number of participants in each division should be a power of two. Additionally, each division should have a non-zero amount of participants.<\/p><p>$$$n$$$ participants have registered for the tournament so far, the $$$i$$$-th of them weighs $$$a_i$$$. To split participants into divisions, Monocarp is going to establish two integer weight boundaries $$$x$$$ and $$$y$$$ ($$$x  \\lt  y$$$). <\/p><p>All participants who weigh strictly less than $$$x$$$ will be considered lightweight. All participants who weigh greater or equal to $$$y$$$ will be considered heavyweight. The remaining participants will be considered middleweight.<\/p><p>It's possible that the distribution doesn't make the number of participants in each division a power of two. It can also lead to empty divisions. To fix the issues, Monocarp can invite an arbitrary number of participants to each division.<\/p><p>Note that Monocarp can't kick out any of the $$$n$$$ participants who have already registered for the tournament.<\/p><p>However, he wants to invite as little extra participants as possible. Help Monocarp to choose $$$x$$$ and $$$y$$$ in such a way that the total amount of extra participants required is as small as possible. Output that amount.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of testcases.<\/p><p>The first line of each testcase contains a single integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of the registered participants.<\/p><p>The second line of each testcase contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le n$$$)\u00a0\u2014 the weights of the registered participants.<\/p><p>The sum of $$$n$$$ over all testcases doesn't exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each testcase, print a single integer\u00a0\u2014 the smallest number of extra participants Monocarp is required to invite after he chooses the weight boundaries $$$x$$$ and $$$y$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 1 2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 2 2 1 1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">8<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 3 6 3 6 3 6 6<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n2\n3\n2\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first testcase of the example, Monocarp can choose $$$x=2$$$ and $$$y=3$$$. Lightweight, middleweight and heavyweight divisions will have $$$2$$$, $$$1$$$ and $$$1$$$ participants, respectively. They all are powers of two, so no extra participants are required.<\/p><p>In the second testcase of the example, regardless of the choice of $$$x$$$ and $$$y$$$, one division will have $$$1$$$ participant, the rest will have $$$0$$$. Thus, Monocarp will have to invite $$$1$$$ participant into both of the remaining divisions.<\/p><p>In the third testcase of the example, Monocarp can choose $$$x=1$$$ and $$$y=2$$$. Lightweight, middleweight and heavyweight divisions will have $$$0$$$, $$$3$$$ and $$$3$$$ participants, respectively. So an extra participant is needed in each division.<\/p><p>In the fourth testcase of the example, Monocarp can choose $$$x=8$$$ and $$$y=9$$$. Lightweight, middleweight and heavyweight divisions will have $$$8$$$, $$$0$$$ and $$$0$$$ participants, respectively. Middleweight and heavyweight division need an extra participant each.<\/p><\/div><\/div>"}, {"contestId": 525, "index": "E", "name": "Anya and Cubes", "rating": 2100, "solvedCount": 4429, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Anya and Cubes<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Anya loves to fold and stick. Today she decided to do just that.<\/p><p>Anya has <span class=\"tex-span\"><i>n<\/i><\/span> cubes lying in a line and numbered from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span> from left to right, with natural numbers written on them. She also has <span class=\"tex-span\"><i>k<\/i><\/span> stickers with exclamation marks. We know that the number of stickers does not exceed the number of cubes.<\/p><p>Anya can stick an exclamation mark on the cube and get the factorial of the number written on the cube. For example, if a cube reads <span class=\"tex-span\">5<\/span>, then after the sticking it reads <span class=\"tex-span\">5!<\/span>, which equals <span class=\"tex-span\">120<\/span>.<\/p><p>You need to help Anya count how many ways there are to choose some of the cubes and stick on some of the chosen cubes at most <span class=\"tex-span\"><i>k<\/i><\/span> exclamation marks so that the sum of the numbers written on the chosen cubes after the sticking becomes equal to <span class=\"tex-span\"><i>S<\/i><\/span>. Anya can stick at most one exclamation mark on each cube. Can you do it?<\/p><p>Two ways are considered the same if they have the same set of chosen cubes and the same set of cubes with exclamation marks.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains three space-separated integers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>k<\/i><\/span> and <span class=\"tex-span\"><i>S<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200925<\/span>, <span class=\"tex-span\">0\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>S<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">16<\/sup><\/span>)\u00a0\u2014\u00a0the number of cubes and the number of stickers that Anya has, and the sum that she needs to get. <\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> positive integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>)\u00a0\u2014\u00a0the numbers, written on the cubes. The cubes in the input are described in the order from left to right, starting from the first one. <\/p><p>Multiple cubes can contain the same numbers.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output the number of ways to choose some number of cubes and stick exclamation marks on some of them so that the sum of the numbers became equal to the given number <span class=\"tex-span\"><i>S<\/i><\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 2 30<br/>4 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 2 7<br/>4 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 1 1<br/>1 1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample the only way is to choose both cubes and stick an exclamation mark on each of them.<\/p><p>In the second sample the only way is to choose both cubes but don't stick an exclamation mark on any of them.<\/p><p>In the third sample it is possible to choose any of the cubes in three ways, and also we may choose to stick or not to stick the exclamation mark on it. So, the total number of ways is six.<\/p><\/div><\/div>"}, {"contestId": 1332, "index": "E", "name": "Height All the Same", "rating": 2100, "solvedCount": 4424, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Height All the Same<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Alice has got addicted to a game called Sirtet recently.<\/p><p>In Sirtet, player is given an $$$n \\times m$$$ grid. Initially $$$a_{i,j}$$$ cubes are stacked up in the cell $$$(i,j)$$$. Two cells are called adjacent if they share a side. Player can perform the following operations: <\/p><ul> <li> stack up one cube in two <span class=\"tex-font-style-bf\">adjacent<\/span> cells; <\/li><li> stack up two cubes in one cell. <\/li><\/ul><p>Cubes mentioned above are identical in height.<\/p><p>Here is an illustration of the game. States on the right are obtained by performing one of the above operations on the state on the left, and grey cubes are added due to the operation.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/bd8574b9be3f621ede621e3db5e94253b8440b0f.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>Player's goal is to <span class=\"tex-font-style-bf\">make the height of all cells the same<\/span> (i.e. so that each cell has the same number of cubes in it) using above operations. <\/p><p>Alice, however, has found out that on some starting grids she may never reach the goal no matter what strategy she uses. Thus, she is wondering the number of initial grids such that <\/p><ul> <li> $$$L \\le a_{i,j} \\le R$$$ for all $$$1 \\le i \\le n$$$, $$$1 \\le j \\le m$$$; <\/li><li> player can reach the goal using above operations. <\/li><\/ul><p>Please help Alice with it. Notice that the answer might be large, please output the desired value modulo $$$998,244,353$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line contains four integers $$$n$$$, $$$m$$$, $$$L$$$ and $$$R$$$ ($$$1\\le n,m,L,R \\le 10^9$$$, $$$L \\le R$$$, $$$n \\cdot m \\ge 2$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output one integer, representing the desired answer modulo $$$998,244,353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2 2 1 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1 2 1 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample, the only initial grid that satisfies the requirements is $$$a_{1,1}=a_{2,1}=a_{1,2}=a_{2,2}=1$$$. Thus the answer should be $$$1$$$.<\/p><p>In the second sample, initial grids that satisfy the requirements are $$$a_{1,1}=a_{1,2}=1$$$ and $$$a_{1,1}=a_{1,2}=2$$$. Thus the answer should be $$$2$$$.<\/p><\/div><\/div>"}, {"contestId": 498, "index": "C", "name": "Array and Operations", "rating": 2100, "solvedCount": 4418, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Array and Operations<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>You have written on a piece of paper an array of <span class=\"tex-span\"><i>n<\/i><\/span> positive integers <span class=\"tex-span\"><i>a<\/i>[1],\u2009<i>a<\/i>[2],\u2009...,\u2009<i>a<\/i>[<i>n<\/i>]<\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> <span class=\"tex-font-style-it\">good<\/span> pairs of integers <span class=\"tex-span\">(<i>i<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>j<\/i><sub class=\"lower-index\">1<\/sub>),\u2009(<i>i<\/i><sub class=\"lower-index\">2<\/sub>,\u2009<i>j<\/i><sub class=\"lower-index\">2<\/sub>),\u2009...,\u2009(<i>i<\/i><sub class=\"lower-index\"><i>m<\/i><\/sub>,\u2009<i>j<\/i><sub class=\"lower-index\"><i>m<\/i><\/sub>)<\/span>. Each <span class=\"tex-font-style-it\">good<\/span> pair <span class=\"tex-span\">(<i>i<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>,\u2009<i>j<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>)<\/span> meets the following conditions: <span class=\"tex-span\"><i>i<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>\u2009+\u2009<i>j<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span> is an odd number and <span class=\"tex-span\">1\u2009\u2264\u2009<i>i<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>\u2009&lt;\u2009<i>j<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>.<\/p><p>In one operation you can perform a sequence of actions: <\/p><ul> <li> take one of the <span class=\"tex-font-style-it\">good<\/span> pairs <span class=\"tex-span\">(<i>i<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>,\u2009<i>j<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>)<\/span> and some integer <span class=\"tex-span\"><i>v<\/i><\/span> (<span class=\"tex-span\"><i>v<\/i>\u2009&gt;\u20091<\/span>), which divides both numbers <span class=\"tex-span\"><i>a<\/i>[<i>i<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>]<\/span> and <span class=\"tex-span\"><i>a<\/i>[<i>j<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>]<\/span>; <\/li><li> divide both numbers by <span class=\"tex-span\"><i>v<\/i><\/span>, i. e. perform the assignments: <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/192b5056ddf57cd3030615790d2a21051c01bc9d.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> and <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/f143c28d601c34862d9b5035284c5bde440a0e3d.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>. <\/li><\/ul><p>Determine the maximum number of operations you can sequentially perform on the given array. Note that one pair may be used several times in the described operations.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two space-separated integers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009100<\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u2009100<\/span>).<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> space-separated integers <span class=\"tex-span\"><i>a<\/i>[1],\u2009<i>a<\/i>[2],\u2009...,\u2009<i>a<\/i>[<i>n<\/i>]<\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i>[<i>i<\/i>]\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) \u2014 the description of the array.<\/p><p>The following <span class=\"tex-span\"><i>m<\/i><\/span> lines contain the description of <span class=\"tex-font-style-it\">good<\/span> pairs. The <span class=\"tex-span\"><i>k<\/i><\/span>-th line contains two space-separated integers <span class=\"tex-span\"><i>i<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>j<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>i<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>\u2009&lt;\u2009<i>j<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\"><i>i<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>\u2009+\u2009<i>j<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span> is an odd number).<\/p><p>It is guaranteed that all the <span class=\"tex-font-style-it\">good<\/span> pairs are distinct.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output the answer for the problem.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 2<br/>8 3 8<br/>1 2<br/>2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 2<br/>8 12 8<br/>1 2<br/>2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 576, "index": "C", "name": "Points on Plane", "rating": 2100, "solvedCount": 4411, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Points on Plane<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>On a plane are <span class=\"tex-span\"><i>n<\/i><\/span> points (<span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>) with integer coordinates between <span class=\"tex-span\">0<\/span> and <span class=\"tex-span\">10<sup class=\"upper-index\">6<\/sup><\/span>. The distance between the two points with numbers <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span> is said to be the following value: <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/03274f8c977ad3feb5d9f6ede91c69bcaef04972.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> (the distance calculated by such formula is called <span class=\"tex-font-style-it\">Manhattan distance<\/span>).<\/p><p>We call a hamiltonian path to be some permutation <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> of numbers from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span>. We say that the length of this path is value <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/2872e932e7cab8f5f7a9c718441f7534261ed638.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>.<\/p><p>Find some hamiltonian path with a length of no more than <span class=\"tex-span\">25\u2009\u00d7\u200910<sup class=\"upper-index\">8<\/sup><\/span>. Note that you do not have to minimize the path length.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup><\/span>).<\/p><p>The <span class=\"tex-span\"><i>i<\/i>\u2009+\u20091<\/span>-th line contains the coordinates of the <span class=\"tex-span\"><i>i<\/i><\/span>-th point: <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup><\/span>).<\/p><p>It is guaranteed that no two points coincide.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the permutation of numbers <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span> \u2014 the sought Hamiltonian path. The permutation must meet the inequality <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/70f9e4aeb31a2c8d58e32efe76501886a9a44af7.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>.<\/p><p>If there are multiple possible answers, print any of them.<\/p><p>It is guaranteed that the answer exists.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>0 7<br/>8 10<br/>3 4<br/>5 0<br/>9 12<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4 3 1 2 5 <br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the sample test the total distance is:<\/p><p><img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/c772e61c616e1c27114e3facb9e6db6c5cf93b82.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p><span class=\"tex-span\">(|5\u2009-\u20093|\u2009+\u2009|0\u2009-\u20094|)\u2009+\u2009(|3\u2009-\u20090|\u2009+\u2009|4\u2009-\u20097|)\u2009+\u2009(|0\u2009-\u20098|\u2009+\u2009|7\u2009-\u200910|)\u2009+\u2009(|8\u2009-\u20099|\u2009+\u2009|10\u2009-\u200912|)\u2009=\u20092\u2009+\u20094\u2009+\u20093\u2009+\u20093\u2009+\u20098\u2009+\u20093\u2009+\u20091\u2009+\u20092\u2009=\u200926<\/span><\/p><\/div><\/div>"}, {"contestId": 689, "index": "D", "name": "Friends and Subsequences", "rating": 2100, "solvedCount": 4406, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Friends and Subsequences<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Mike and !Mike are old childhood rivals, they are opposite in everything they do, except programming. Today they have a problem they cannot solve on their own, but together (with you)\u00a0\u2014 who knows? <\/p><p>Every one of them has an integer sequences <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span> of length <span class=\"tex-span\"><i>n<\/i><\/span>. Being given a query of the form of pair of integers <span class=\"tex-span\">(<i>l<\/i>,\u2009<i>r<\/i>)<\/span>, Mike can instantly tell the value of <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/0920a88f2ac4dba81380b09878666ff7866f884b.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> while !Mike can instantly tell the value of <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/d56dda45a4398472592dffa7a16fe1581d45486a.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>.<\/p><p>Now suppose a robot (you!) asks them all possible different queries of pairs of integers <span class=\"tex-span\">(<i>l<\/i>,\u2009<i>r<\/i>)<\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009<i>n<\/i>)<\/span> (so he will make exactly <span class=\"tex-span\"><i>n<\/i>(<i>n<\/i>\u2009+\u20091)\u2009/\u20092<\/span> queries) and counts how many times their answers coincide, thus for how many pairs <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/2752e2e562831cd694ac00e4396fd36a3a890b8f.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> is satisfied.<\/p><p>How many occasions will the robot count?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains only integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009200\u2009000<\/span>).<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integer numbers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">\u2009-\u200910<sup class=\"upper-index\">9<\/sup>\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>)\u00a0\u2014 the sequence <span class=\"tex-span\"><i>a<\/i><\/span>.<\/p><p>The third line contains <span class=\"tex-span\"><i>n<\/i><\/span> integer numbers <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>b<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">\u2009-\u200910<sup class=\"upper-index\">9<\/sup>\u2009\u2264\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>)\u00a0\u2014 the sequence <span class=\"tex-span\"><i>b<\/i><\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the only integer number\u00a0\u2014 the number of occasions the robot will count, thus for how many pairs <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/2752e2e562831cd694ac00e4396fd36a3a890b8f.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> is satisfied.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>6<br/>1 2 3 2 1 4<br/>6 7 1 2 3 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>3 3 3<br/>1 1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The occasions in the first sample case are:<\/p><p>1.<span class=\"tex-span\"><i>l<\/i>\u2009=\u20094<\/span>,<span class=\"tex-span\"><i>r<\/i>\u2009=\u20094<\/span> since <span class=\"tex-span\"><i>max<\/i>{2}\u2009=\u2009<i>min<\/i>{2}<\/span>.<\/p><p>2.<span class=\"tex-span\"><i>l<\/i>\u2009=\u20094<\/span>,<span class=\"tex-span\"><i>r<\/i>\u2009=\u20095<\/span> since <span class=\"tex-span\"><i>max<\/i>{2,\u20091}\u2009=\u2009<i>min<\/i>{2,\u20093}<\/span>.<\/p><p>There are no occasions in the second sample case since Mike will answer <span class=\"tex-span\">3<\/span> to any query pair, but !Mike will always answer <span class=\"tex-span\">1<\/span>.<\/p><\/div><\/div>"}, {"contestId": 1606, "index": "E", "name": "Arena", "rating": 2100, "solvedCount": 4353, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Arena<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are $$$n$$$ heroes fighting in the arena. Initially, the $$$i$$$-th hero has $$$a_i$$$ health points.<\/p><p>The fight in the arena takes place in several rounds. At the beginning of each round, each alive hero deals $$$1$$$ damage to all other heroes. Hits of all heroes occur simultaneously. Heroes whose health is less than $$$1$$$ at the end of the round are considered killed.<\/p><p>If exactly $$$1$$$ hero remains alive after a certain round, then he is declared the winner. Otherwise, there is no winner.<\/p><p>Your task is to calculate the number of ways to choose the initial health points for each hero $$$a_i$$$, where $$$1 \\le a_i \\le x$$$, so that there is no winner of the fight. The number of ways can be very large, so print it modulo $$$998244353$$$. Two ways are considered different if at least one hero has a different amount of health. For example, $$$[1, 2, 1]$$$ and $$$[2, 1, 1]$$$ are different.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line contains two integers $$$n$$$ and $$$x$$$ ($$$2 \\le n \\le 500; 1 \\le x \\le 500$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer\u00a0\u2014 the number of ways to choose the initial health points for each hero $$$a_i$$$, where $$$1 \\le a_i \\le x$$$, so that there is no winner of the fight, taken modulo $$$998244353$$$. <\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n15\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1024\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n13 37\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n976890680\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1884, "index": "D", "name": "Counting Rhyme", "rating": 2100, "solvedCount": 4339, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Counting Rhyme<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array of integers $$$a_1, a_2, \\ldots, a_n$$$.<\/p><p>A pair of integers $$$(i, j)$$$, such that $$$1 \\le i  \\lt  j \\le n$$$, is called <span class=\"tex-font-style-it\">good<\/span>, if there <span class=\"tex-font-style-bf\">does not exist<\/span> an integer $$$k$$$ ($$$1 \\le k \\le n$$$) such that $$$a_i$$$ is divisible by $$$a_k$$$ and $$$a_j$$$ is divisible by $$$a_k$$$ at the same time.<\/p><p>Please, find the number of good pairs.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 2 \\cdot 10^4$$$). The description of the test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 10^6$$$).<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le n$$$).<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$10^6$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output the number of good pairs.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 4 4 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 3 4 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6 8 9 4 6 8 9 4 9<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">9<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">7 7 4 4 9 9 6 2 9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">18<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">10 18 18 15 14 4 5 6 8 9 10 12 15 16 18 17 13 11<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">21<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">12 19 19 18 18 12 2 18 19 12 12 3 12 12 12 18 19 16 18 19 12<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n3\n26\n26\n124\n82\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, there are no good pairs. <\/p><p>In the second test case, here are all the good pairs: $$$(1, 2)$$$, $$$(2, 3)$$$, and $$$(2, 4)$$$.<\/p><\/div><\/div>"}, {"contestId": 1025, "index": "D", "name": "Recovering BST", "rating": 2100, "solvedCount": 4327, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Recovering BST<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Dima the hamster enjoys nibbling different things: cages, sticks, bad problemsetters and even trees!<\/p><p>Recently he found a binary search tree and instinctively nibbled all of its edges, hence messing up the vertices. Dima knows that if Andrew, who has been thoroughly assembling the tree for a long time, comes home and sees his creation demolished, he'll get extremely upset. <\/p><p>To not let that happen, Dima has to recover the binary search tree. Luckily, he noticed that any two vertices connected by a direct edge had their greatest common divisor value exceed $$$1$$$.<\/p><p>Help Dima construct such a <span class=\"tex-font-style-bf\">binary search tree<\/span> or determine that it's impossible. The definition and properties of a binary search tree can be found <a href=\"https://en.wikipedia.org/wiki/Binary_search_tree\">here.<\/a><\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains the number of vertices $$$n$$$ ($$$2 \\le n \\le 700$$$).<\/p><p>The second line features $$$n$$$ distinct integers $$$a_i$$$ ($$$2 \\le a_i \\le 10^9$$$)\u00a0\u2014 the values of vertices <span class=\"tex-font-style-bf\">in ascending order<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If it is possible to reassemble the binary search tree, such that the greatest common divisor of any two vertices connected by the edge is greater than $$$1$$$, print \"<span class=\"tex-font-style-tt\">Yes<\/span>\" (quotes for clarity).<\/p><p>Otherwise, print \"<span class=\"tex-font-style-tt\">No<\/span>\" (quotes for clarity).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>6<br/>3 6 9 18 36 108<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>Yes<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/>7 17<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>No<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>9<br/>4 8 10 12 15 18 33 44 81<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>Yes<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The picture below illustrates one of the possible trees for the first example.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/0565eb6f41692a42daefd732c8539e0dfa52be65.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>The picture below illustrates one of the possible trees for the third example.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/179a7946d803f25aacfad4df0beda06a0413a3c0.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 1913, "index": "D", "name": "Array Collapse", "rating": 2100, "solvedCount": 4326, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Array Collapse<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$[p_1, p_2, \\dots, p_n]$$$, where all elements are distinct.<\/p><p>You can perform several (possibly zero) operations with it. In one operation, you can choose a <span class=\"tex-font-style-bf\">contiguous subsegment<\/span> of $$$p$$$ and remove <span class=\"tex-font-style-bf\">all<\/span> elements from that subsegment, <span class=\"tex-font-style-bf\">except for<\/span> the minimum element on that subsegment. For example, if $$$p = [3, 1, 4, 7, 5, 2, 6]$$$ and you choose the subsegment from the $$$3$$$-rd element to the $$$6$$$-th element, the resulting array is $$$[3, 1, 2, 6]$$$.<\/p><p>An array $$$a$$$ is called <span class=\"tex-font-style-it\">reachable<\/span> if it can be obtained from $$$p$$$ using several (maybe zero) aforementioned operations. Calculate the number of <span class=\"tex-font-style-it\">reachable<\/span> arrays, and print it modulo $$$998244353$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains one integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$) \u2014 the number of test cases.<\/p><p>Each test case consists of two lines. The first line contains one integer $$$n$$$ ($$$1 \\le n \\le 3 \\cdot 10^5$$$). The second line contains $$$n$$$ <span class=\"tex-font-style-bf\">distinct<\/span> integers $$$p_1, p_2, \\dots, p_n$$$ ($$$1 \\le p_i \\le 10^9$$$).<\/p><p>Additional constraint on the input: the sum of $$$n$$$ over all test cases does not exceed $$$3 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print one integer \u2014 the number of <span class=\"tex-font-style-it\">reachable<\/span> arrays, taken modulo $$$998244353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 4 1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">10 2 6 3 4<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n6\n12\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 985, "index": "E", "name": "Pencils and Boxes", "rating": 2100, "solvedCount": 4315, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Pencils and Boxes<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Mishka received a gift of multicolored pencils for his birthday! Unfortunately he lives in a monochrome world, where everything is of the same color and only saturation differs. This pack can be represented as a sequence <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> of <span class=\"tex-span\"><i>n<\/i><\/span> integer numbers \u2014 saturation of the color of each pencil. Now Mishka wants to put all the mess in the pack in order. He has an infinite number of empty boxes to do this. He would like to fill some boxes in such a way that:<\/p><ul> <li> Each pencil belongs to <span class=\"tex-font-style-bf\">exactly<\/span> one box; <\/li><li> Each non-empty box has at least <span class=\"tex-span\"><i>k<\/i><\/span> pencils in it; <\/li><li> If pencils <span class=\"tex-span\"><i>i<\/i><\/span> and <span class=\"tex-span\"><i>j<\/i><\/span> belong to the same box, then <span class=\"tex-span\">|<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009-\u2009<i>a<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>|\u2009\u2264\u2009<i>d<\/i><\/span>, where <span class=\"tex-span\">|<i>x<\/i>|<\/span> means absolute value of <span class=\"tex-span\"><i>x<\/i><\/span>. Note that the opposite is optional, there can be pencils <span class=\"tex-span\"><i>i<\/i><\/span> and <span class=\"tex-span\"><i>j<\/i><\/span> such that <span class=\"tex-span\">|<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009-\u2009<i>a<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>|\u2009\u2264\u2009<i>d<\/i><\/span> and they belong to different boxes. <\/li><\/ul><p>Help Mishka to determine if it's possible to distribute all the pencils into boxes. Print \"<span class=\"tex-font-style-tt\">YES<\/span>\" if there exists such a distribution. Otherwise print \"<span class=\"tex-font-style-tt\">NO<\/span>\".<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains three integer numbers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>k<\/i><\/span> and <span class=\"tex-span\"><i>d<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20095\u00b710<sup class=\"upper-index\">5<\/sup><\/span>, <span class=\"tex-span\">0\u2009\u2264\u2009<i>d<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) \u2014 the number of pencils, minimal size of any non-empty box and maximal difference in saturation between any pair of pencils in the same box, respectively.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integer numbers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) \u2014 saturation of color of each pencil.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print \"<span class=\"tex-font-style-tt\">YES<\/span>\" if it's possible to distribute all the pencils into boxes and satisfy all the conditions. Otherwise print \"<span class=\"tex-font-style-tt\">NO<\/span>\".<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>6 3 10<br/>7 2 7 7 4 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>6 2 3<br/>4 5 3 13 4 10<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 2 5<br/>10 16 22<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>NO<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example it is possible to distribute pencils into <span class=\"tex-span\">2<\/span> boxes with <span class=\"tex-span\">3<\/span> pencils in each with any distribution. And you also can put all the pencils into the same box, difference of any pair in it won't exceed <span class=\"tex-span\">10<\/span>.<\/p><p>In the second example you can split pencils of saturations <span class=\"tex-span\">[4,\u20095,\u20093,\u20094]<\/span> into <span class=\"tex-span\">2<\/span> boxes of size <span class=\"tex-span\">2<\/span> and put the remaining ones into another box.<\/p><\/div><\/div>"}, {"contestId": 1886, "index": "D", "name": "Monocarp and the Set", "rating": 2100, "solvedCount": 4284, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Monocarp and the Set<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Monocarp has $$$n$$$ numbers $$$1, 2, \\dots, n$$$ and a set (initially empty). He adds his numbers to this set $$$n$$$ times in some order. During each step, he adds a new number (which has not been present in the set before). In other words, the sequence of added numbers is a permutation of length $$$n$$$.<\/p><p>Every time Monocarp adds an element into the set <span class=\"tex-font-style-bf\">except for the first time<\/span>, he writes out a character:<\/p><ul> <li> if the element Monocarp is trying to insert becomes the maximum element in the set, Monocarp writes out the character <span class=\"tex-font-style-tt\">&gt;<\/span>; <\/li><li> if the element Monocarp is trying to insert becomes the minimum element in the set, Monocarp writes out the character <span class=\"tex-font-style-tt\">&lt;<\/span>; <\/li><li> if none of the above, Monocarp writes out the character <span class=\"tex-font-style-tt\">?<\/span>. <\/li><\/ul><p>You are given a string $$$s$$$ of $$$n-1$$$ characters, which represents the characters written out by Monocarp (in the order he wrote them out). You have to process $$$m$$$ queries to the string. Each query has the following format:<\/p><ul> <li> $$$i$$$ $$$c$$$ \u2014 replace $$$s_i$$$ with the character $$$c$$$. <\/li><\/ul><p>Both before processing the queries and after each query, you have to calculate the number of different ways to order the integers $$$1, 2, 3, \\dots, n$$$ such that, if Monocarp inserts the integers into the set in that order, he gets the string $$$s$$$. Since the answers might be large, print them modulo $$$998244353$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$m$$$ ($$$2 \\le n \\le 3 \\cdot 10^5$$$; $$$1 \\le m \\le 3 \\cdot 10^5$$$).<\/p><p>The second line contains the string $$$s$$$, consisting of exactly $$$n-1$$$ characters <span class=\"tex-font-style-tt\">&lt;<\/span>, <span class=\"tex-font-style-tt\">&gt;<\/span> and/or <span class=\"tex-font-style-tt\">?<\/span>.<\/p><p>Then $$$m$$$ lines follow. Each of them represents a query. Each line contains an integer $$$i$$$ and a character $$$c$$$ ($$$1 \\le i \\le n-1$$$; $$$c$$$ is either <span class=\"tex-font-style-tt\">&lt;<\/span>, <span class=\"tex-font-style-tt\">&gt;<\/span>, or <span class=\"tex-font-style-tt\">?<\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Both before processing the queries and after each query, print one integer \u2014 the number of ways to order the integers $$$1, 2, 3, \\dots, n$$$ such that, if Monocarp inserts the integers into the set in that order, he gets the string $$$s$$$. Since the answers might be large, print them modulo $$$998244353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 4\n&lt;?&gt;?&gt;\n1 ?\n4 &lt;\n5 &lt;\n1 &gt;\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n0\n0\n0\n1\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2 2\n&gt;\n1 ?\n1 &lt;\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n0\n1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, there are three possible orderings before all queries: <\/p><ul> <li> $$$3, 1, 2, 5, 4, 6$$$; <\/li><li> $$$4, 1, 2, 5, 3, 6$$$; <\/li><li> $$$4, 1, 3, 5, 2, 6$$$. <\/li><\/ul><p>After the last query, there is only one possible ordering: <\/p><ul> <li> $$$3, 5, 4, 6, 2, 1$$$. <\/li><\/ul><\/div><\/div>"}, {"contestId": 1934, "index": "D1", "name": "XOR Break --- Solo Version", "rating": 2100, "solvedCount": 4279, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D1. XOR Break \u2014 Solo Version<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is the solo version of the problem. Note that the solution of this problem may or may not share ideas with the solution of the game version. You can solve and get points for both versions independently.<\/span><\/p><p><span class=\"tex-font-style-bf\">You can make hacks only if both versions of the problem are solved.<\/span><\/p><p>Given an integer variable $$$x$$$ with the initial value of $$$n$$$. A single break operation consists of the following steps: <\/p><ul> <li> Choose a value $$$y$$$ such that $$$0 \\lt y \\lt x$$$ and $$$0 \\lt (x \\oplus y) \\lt x$$$. <\/li><li> Update $$$x$$$ by either setting $$$x = y$$$ or setting $$$x = x \\oplus y$$$. <\/li><\/ul> Determine whether it is possible to transform $$$x$$$ into $$$m$$$ using a maximum of $$$63$$$ break operations. If it is, provide the sequence of operations required to achieve $$$x = m$$$.<p>You don't need to minimize the number of operations.<\/p><p>Here $$$\\oplus$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#XOR\">bitwise XOR operation<\/a>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one positive integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>Each test case consists of a single line containing two integers $$$n$$$ and $$$m$$$ ($$$1 \\leq m \\lt n \\leq 10^{18}$$$)\u00a0\u2014 the initial value of $$$x$$$ and the target value of $$$x$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output your answer in the following format.<\/p><p>If it is not possible to achieve $$$m$$$ in $$$63$$$ operations, print $$$-1$$$.<\/p><p>Otherwise, <\/p><p>The first line should contain $$$k$$$ ($$$1 \\leq k \\leq 63$$$)\u00a0\u2014 where $$$k$$$ is the number of operations required.<\/p><p>The next line should contain $$$k+1$$$ integers\u00a0\u2014 the sequence where variable $$$x$$$ changes after each break operation. The $$$1$$$-st and $$$k+1$$$-th integers should be $$$n$$$ and $$$m$$$, respectively.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">7 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">481885160128643072 45035996273704960<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n7 3\n-1\n3\n481885160128643072 337769972052787200 49539595901075456 45035996273704960<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case $$$n = 7$$$, for the first operation $$$x = 7$$$ if we choose $$$y = 3$$$ then $$$(7 \\oplus 3) \\lt 7$$$, hence we can update $$$x$$$ with $$$3$$$ which is equal to $$$m$$$.<\/p><p>In the second test case $$$n = 4$$$, for the first operation $$$x = 4$$$.<\/p><p>If we choose: <\/p><ul> <li> $$$y = 1$$$ then $$$(4 \\oplus 1) \\gt 4$$$ <\/li><li> $$$y = 2$$$ then $$$(4 \\oplus 2) \\gt 4$$$ <\/li><li> $$$y = 3$$$ then $$$(4 \\oplus 3) \\gt 4$$$ <\/li><\/ul><p>Hence we can't do the first operation and it is impossible to make $$$x = 2$$$.<\/p><\/div><\/div>"}, {"contestId": 703, "index": "D", "name": "Mishka and Interesting sum", "rating": 2100, "solvedCount": 4258, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Mishka and Interesting sum<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Little Mishka enjoys programming. Since her birthday has just passed, her friends decided to present her with array of non-negative integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> of <span class=\"tex-span\"><i>n<\/i><\/span> elements!<\/p><p>Mishka loved the array and she instantly decided to determine its beauty value, but she is too little and can't process large arrays. Right because of that she invited you to visit her and asked you to process <span class=\"tex-span\"><i>m<\/i><\/span> queries.<\/p><p>Each query is processed in the following way:<\/p><ol> <li> Two integers <span class=\"tex-span\"><i>l<\/i><\/span> and <span class=\"tex-span\"><i>r<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>) are specified\u00a0\u2014 bounds of query segment. <\/li><li> Integers, presented in array segment <span class=\"tex-span\">[<i>l<\/i>,\u2009\u2009<i>r<\/i>]<\/span> (in sequence of integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>l<\/i><\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\"><i>l<\/i>\u2009+\u20091<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>r<\/i><\/sub><\/span>) <span class=\"tex-font-style-bf\">even number of times<\/span>, are written down. <\/li><li> XOR-sum of written down integers is calculated, and this value is the answer for a query. Formally, if integers written down in point 2 are <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>x<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>x<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span>, then Mishka wants to know the value <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/0cc8f248d0d8ba12cd7ce3df549c99209199764b.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>, where <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/c4b7092c0f7ce6535f2574569c98f7b3c2fe2c5f.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>\u00a0\u2014 operator of exclusive bitwise OR. <\/li><\/ol><p>Since only the little bears know the definition of array beauty, all you are to do is to answer each of queries presented.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains single integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20091\u2009000\u2009000<\/span>)\u00a0\u2014 the number of elements in the array.<\/p><p>The second line of the input contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>)\u00a0\u2014 array elements.<\/p><p>The third line of the input contains single integer <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u20091\u2009000\u2009000<\/span>)\u00a0\u2014 the number of queries.<\/p><p>Each of the next <span class=\"tex-span\"><i>m<\/i><\/span> lines describes corresponding query by a pair of integers <span class=\"tex-span\"><i>l<\/i><\/span> and <span class=\"tex-span\"><i>r<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>)\u00a0\u2014 the bounds of query segment.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>m<\/i><\/span> non-negative integers\u00a0\u2014 the answers for the queries in the order they appear in the input.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>3 7 8<br/>1<br/>1 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>7<br/>1 2 1 3 3 2 3<br/>5<br/>4 7<br/>4 5<br/>1 3<br/>1 7<br/>1 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/>3<br/>1<br/>3<br/>2<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the second sample:<\/p><p>There is no integers in the segment of the first query, presented even number of times in the segment\u00a0\u2014 the answer is <span class=\"tex-span\">0<\/span>.<\/p><p>In the second query there is only integer <span class=\"tex-span\">3<\/span> is presented even number of times\u00a0\u2014 the answer is <span class=\"tex-span\">3<\/span>.<\/p><p>In the third query only integer <span class=\"tex-span\">1<\/span> is written down\u00a0\u2014 the answer is <span class=\"tex-span\">1<\/span>.<\/p><p>In the fourth query all array elements are considered. Only <span class=\"tex-span\">1<\/span> and <span class=\"tex-span\">2<\/span> are presented there even number of times. The answer is <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/8f3bf9fdacb25bb19b17c017c532cd102cb4993c.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>.<\/p><p>In the fifth query <span class=\"tex-span\">1<\/span> and <span class=\"tex-span\">3<\/span> are written down. The answer is <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/bfacb216edbf76a77a805a5347ff40d88d70f384.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>.<\/p><\/div><\/div>"}, {"contestId": 1393, "index": "D", "name": "Rarity and New Dress", "rating": 2100, "solvedCount": 4248, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Rarity and New Dress<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Carousel Boutique is busy again! Rarity has decided to visit the pony ball and she surely needs a new dress, because going out in the same dress several times is a sign of bad manners. First of all, she needs a dress pattern, which she is going to cut out from the rectangular piece of the multicolored fabric.<\/p><p>The piece of the multicolored fabric consists of $$$n \\times m$$$ separate square scraps. Since Rarity likes dresses in style, a dress pattern must only include scraps sharing the same color. A dress pattern must be the square, and since Rarity is fond of rhombuses, the sides of a pattern must form a $$$45^{\\circ}$$$ angle with sides of a piece of fabric (that way it will be resembling the traditional picture of a rhombus).<\/p><p>Examples of proper dress patterns: <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/6be2c5bee9dd194e80334734ef9c2002a1dadcef.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> Examples of improper dress patterns: <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/b6a915afc9e44151454945a9e5e49351fef76d3d.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> The first one consists of multi-colored scraps, the second one goes beyond the bounds of the piece of fabric, the third one is not a square with sides forming a $$$45^{\\circ}$$$ angle with sides of the piece of fabric.<\/p><p>Rarity wonders how many ways to cut out a dress pattern that satisfies all the conditions that do exist. Please help her and satisfy her curiosity so she can continue working on her new masterpiece!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\le n, m \\le 2000$$$). Each of the next $$$n$$$ lines contains $$$m$$$ characters: lowercase English letters, the $$$j$$$-th of which corresponds to scrap in the current line and in the $$$j$$$-th column. Scraps having the same letter share the same color, scraps having different letters have different colors.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer: the number of ways to cut out a dress pattern to satisfy all of Rarity's conditions.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 3\naaa\naaa\naaa\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n10\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 4\nabab\nbaba\nabab\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n12\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 5\nzbacg\nbaaac\naaaaa\neaaad\nweadd\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n31\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, all the dress patterns of size $$$1$$$ and one of size $$$2$$$ are satisfactory.<\/p><p>In the second example, only the dress patterns of size $$$1$$$ are satisfactory.<\/p><\/div><\/div>"}, {"contestId": 2135, "index": "D1", "name": "From the Unknown (Easy Version)", "rating": 2100, "solvedCount": 4211, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D1. From the Unknown (Easy Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p> <\/p><p><span class=\"tex-font-style-bf\">This is the easy version of the problem. The difference between the versions is that in this version, there are no constraints on the sum of the lengths of the articles over all queries. You can hack only if you solved all versions of this problem.<\/span> <\/p><p><span class=\"tex-font-style-it\">This is an interactive problem.<\/span> <\/p><p>The RiOI Team has recently developed a text editor named <span class=\"tex-font-style-it\">RiOI Editor<\/span>. The editor works with exactly one integer parameter $$$W$$$ \u2014 the width of each line. It is known that $$$1 \\leq W \\leq 10^5$$$.<\/p><p>As you cannot understand the RiOI Language, from your point of view, words differ from each other only by their length. Hence, an <span class=\"tex-font-style-it\">article<\/span> of length $$$n$$$ is defined as a sequence $$$a$$$ consisting of $$$n$$$ positive integers, where $$$a_i$$$ is the length of the $$$i$$$-th word in the <span class=\"tex-font-style-it\">article<\/span>. The <span class=\"tex-font-style-it\">RiOI Editor<\/span> displays the <span class=\"tex-font-style-it\">article<\/span> $$$[a_1, a_2,\\ldots, a_n]$$$ on screen as follows:<\/p><ul> <li> If $$$\\max(a_1, a_2, \\ldots, a_n)  \\gt  W$$$, the editor is unable to display the <span class=\"tex-font-style-it\">article<\/span>; <\/li><li> Otherwise, the editor is able to display the <span class=\"tex-font-style-it\">article<\/span> by the following process: <ul> <li> Initially, $$$l = 1$$$, and $$$s = 0$$$. During the whole process, $$$l$$$ always denotes the current number of lines in the editor, and $$$s$$$ always denotes the sum of lengths of words in the last line; <\/li><li> Then, for each $$$1\\le i\\le n$$$: <ul> <li> If $$$s + a_i \\leq W$$$, the word is inserted at the end of the current line. Thus, $$$l$$$ remains unchanged, and $$$s$$$ gets increased by $$$a_i$$$. <\/li><li> Otherwise, the word is inserted into a new line. Thus, $$$l$$$ becomes $$$l + 1$$$, and $$$s$$$ becomes $$$a_i$$$. <\/li><\/ul> <\/li><li> The number of lines needed to display the article is the final value of $$$l$$$. <\/li><\/ul> <\/li><\/ul><p>You are very interested in the editor, so you decide to find out the value of $$$W$$$ by inputting some <span class=\"tex-font-style-it\">articles<\/span> into the editor and observing the number of lines needed to display each <span class=\"tex-font-style-it\">article<\/span>. <\/p><p>Formally, you can query the jury <span class=\"tex-font-style-bf\">at most $$$2$$$ times<\/span>. In each query, you input an <span class=\"tex-font-style-it\">article<\/span> $$$[a_1, a_2, \\ldots, a_n]$$$ ($$$1\\leq n \\leq 10^5$$$) to the editor, and the jury will respond to you with:<\/p><ul> <li> The number of lines needed to display the <span class=\"tex-font-style-it\">article<\/span>, if the editor is able to display it; <\/li><li> $$$0$$$, if the editor is unable to display the <span class=\"tex-font-style-it\">article<\/span>. <\/li><\/ul><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10$$$). The description of the test cases follows. <\/p><\/div><div><div class=\"section-title\">Interaction<\/div><p>For each test case, you can make up to $$$2$$$ queries to find out the value of $$$W$$$. It is guaranteed that $$$1\\leq W\\leq 10^5$$$.<\/p><p>To make a query, you should print a new line in the following format:<\/p><ul> <li> $$$\\texttt{? } n\\texttt{ }a_1\\texttt{ }a_2\\texttt{ }\\ldots\\texttt{ }a_n$$$ ($$$1 \\leq n, a_i \\leq 10^5$$$) \u2014 the <span class=\"tex-font-style-it\">article<\/span> you input to the editor. <\/li><\/ul><p>At the end of each query, the jury will print an integer, as described in the statements.<\/p><p>To report that you have found the value of $$$W$$$, print a new line in the following format:<\/p><ul> <li> $$$\\texttt{! } W$$$ \u2014 the parameter of the editor. <\/li><\/ul><p>Printing the answer does not count as one of the $$$2$$$ queries.<\/p><p>After that, proceed to process the next test case or terminate the program if it was the last test case.<\/p><p>After printing each query do not forget to output the end of line and flush$$$^{\\text{\u2217}}$$$ the output. Otherwise, you will get <span class=\"tex-font-style-tt\">Idleness limit exceeded<\/span> verdict.<\/p><p>If, at any interaction step, you read $$$-1$$$ instead of valid data, your solution must exit immediately. This means that your solution will receive <span class=\"tex-font-style-tt\">Wrong answer<\/span> because of an invalid query or any other mistake. Failing to exit can result in an arbitrary verdict because your solution will continue to read from a closed stream. <\/p><p>The interactor in this problem is <span class=\"tex-font-style-bf\">adaptive<\/span>. It means that the value of $$$W$$$ may change during the interaction, but it is guaranteed that there is always at least one integer $$$W$$$ satisfying all the queries.<\/p><p><span class=\"tex-font-style-bf\">Hacks<\/span><\/p><p>To perform a hack, only the following format is available:<\/p><p>The first line of the input contains an integer $$$t$$$ ($$$1 \\leq t \\leq 10$$$) \u2014 the number of test cas

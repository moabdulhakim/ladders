es. Then, output a string \"<span class=\"tex-font-style-tt\">manual<\/span>\" in the same line.<\/p><p>The only line of each test case contains a single integer $$$W$$$ ($$$1\\le W\\le 10^5$$$) \u2014 the parameter of the editor. <\/p><p>The hacking format for the example is as follows.<\/p><pre class=\"lstlisting\"><code class=\"prettyprint\">2 manual<br/>20<br/>1<br/><\/code><\/pre><div class=\"statement-footnote\"><p>$$$^{\\text{\u2217}}$$$To flush, use: <\/p><ul> <li> <span class=\"tex-font-style-tt\">fflush(stdout)<\/span> or <span class=\"tex-font-style-tt\">cout.flush()<\/span> in C++; <\/li><li> <span class=\"tex-font-style-tt\">sys.stdout.flush()<\/span> in Python; <\/li><li> see the documentation for other languages. <\/li><\/ul><\/div><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n\n2\n\n1\n\n\n0\n\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n\n? 5 1 9 4 6 1\n\n? 2 10 10\n\n! 20\n? 1 2\n\n! 1<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case:<\/p><ul> <li> For the first query, the total length of the words is $$$1+9+4+6+1=21$$$, and the <span class=\"tex-font-style-it\">article<\/span> is displayed in two lines, so $$$W \\lt 21$$$; <\/li><li> For the second query, the total length of the words is $$$10+10=20$$$, and the <span class=\"tex-font-style-it\">article<\/span> is displayed in one line, so $$$W\\ge 20$$$. <\/li><\/ul><p>Thus, we have determined $$$W = 20$$$.<\/p><p>In the second test case, the editor cannot display the <span class=\"tex-font-style-it\">article<\/span> in the only query. Thus, $$$W  \\lt  2$$$, so it can only be $$$1$$$.<\/p><\/div><\/div>"}, {"contestId": 1790, "index": "F", "name": "Timofey and Black-White Tree", "rating": 2100, "solvedCount": 4211, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Timofey and Black-White Tree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Timofey came to a famous summer school and found a tree on $$$n$$$ vertices. A tree is a connected undirected graph without cycles.<\/p><p>Every vertex of this tree, except $$$c_0$$$, is colored <span class=\"tex-font-style-bf\">white<\/span>. The vertex $$$c_0$$$ is colored <span class=\"tex-font-style-bf\">black<\/span>.<\/p><p>Timofey wants to color all the vertices of this tree in <span class=\"tex-font-style-bf\">black<\/span>. To do this, he performs $$$n - 1$$$ operations. During the $$$i$$$-th operation, he selects the vertex $$$c_i$$$, which is currently <span class=\"tex-font-style-bf\">white<\/span>, and paints it <span class=\"tex-font-style-bf\">black<\/span>.<\/p><p>Let's call the <span class=\"tex-font-style-it\">positivity<\/span> of tree the minimum distance between all pairs of different <span class=\"tex-font-style-bf\">black<\/span> vertices in it. The distance between the vertices $$$v$$$ and $$$u$$$ is the number of edges on the path from $$$v$$$ to $$$u$$$.<\/p><p>After each operation, Timofey wants to know the <span class=\"tex-font-style-it\">positivity<\/span> of the current tree.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains the integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of testcases.<\/p><p>The first line of each testcase contains the integers $$$n, c_0$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$, $$$1 \\le c_0 \\le n$$$)\u00a0\u2014 the number of vertices in the tree and index of the initial <span class=\"tex-font-style-bf\">black<\/span> vertex.<\/p><p>The second line of each testcase contains $$$n - 1$$$ unique integers $$$c_1, c_2, \\dots, c_{n-1}$$$ ($$$1 \\le c_i \\le n$$$, $$$c_i \\ne c_0$$$), where $$$c_i$$$ is the vertex which is colored <span class=\"tex-font-style-bf\">black<\/span> during the $$$i$$$-th operation.<\/p><p>Each of the next $$$n - 1$$$ row of each testcase contains the integers $$$v_i, u_i$$$ ($$$1 \\le v_i, u_i \\le n$$$)\u00a0\u2014 edges in the tree.<\/p><p>It is guaranteed that the sum of $$$n$$$ for all testcases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each testcase, print $$$n - 1$$$ integer on a separate line.<\/p><p>The integer with index $$$i$$$ must be equal to <span class=\"tex-font-style-it\">positivity<\/span> of the tree obtained by the first $$$i$$$ operations.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">6 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 1 3 5 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">6 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">10 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">10 7 6 5 2 9 8 1 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">8 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">9 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">10 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">7 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">7 5 1 2 4 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">7 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">9 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">9 3 1 4 2 6 8 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">8 9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">7 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">10 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">1 8 5 10 6 9 4 3 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">10 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">7 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">3 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">9 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">7 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">4 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">1 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">7 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">9 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3 2 1 1 1 \n3 1 1 \n3 2 2 2 2 2 1 1 1 \n4 2 2 1 1 1 \n5 1 1 1 1 1 1 1 \n4 3 2 2 1 1 1 1 1 \n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first testcase, after the second operation, the tree looks like this: <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/1cc3127a5912ad989a65fc63774a14fcb8b38bf8.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"332px\"/><\/p><p>The distance between vertices $$$1$$$ and $$$6$$$ is $$$3$$$, the distance between vertices $$$4$$$ and $$$6$$$ is $$$3$$$, the distance between vertices $$$1$$$ and $$$4$$$ is $$$2$$$. The <span class=\"tex-font-style-it\">positivity<\/span> of this tree is equal to the minimum of these distances. It equals $$$2$$$.<\/p><p>In the third testcase, after the fourth operation, the tree looks like this: <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/fcd271a60b70c53c25fe108e5169cca979c6df59.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"465px\"/><\/p><p>The <span class=\"tex-font-style-it\">positivity<\/span> of this tree is $$$2$$$.<\/p><\/div><\/div>"}, {"contestId": 1998, "index": "D", "name": "Determine Winning Islands in Race", "rating": 2100, "solvedCount": 4202, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Determine Winning Islands in Race<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><div class=\"epigraph\"><div class=\"epigraph-text\"><span class=\"tex-font-style-it\">MOOOOOOOOOOOOOOOOO<\/span><\/div><div class=\"epigraph-source\">\u2014 Bessie the Cow, <span class=\"tex-font-style-it\">The Art of Racing on Islands<\/span><\/div><\/div><p>Two of Farmer John's cows, Bessie and Elsie, are planning to race on $$$n$$$ islands. There are $$$n - 1$$$ <span class=\"tex-font-style-it\">main<\/span> bridges, connecting island $$$i$$$ to island $$$i + 1$$$ for all $$$1 \\leq i \\leq n - 1$$$. Additionally, there are $$$m$$$ alternative bridges. Elsie can use <span class=\"tex-font-style-bf\">both<\/span> main and alternative bridges, while Bessie can only use main bridges. All bridges are <span class=\"tex-font-style-bf\">one way<\/span> and can only be used to travel from an island with a lower index to an island with a higher index.<\/p><p>Initially, Elsie starts on island $$$1$$$, and Bessie starts on island $$$s$$$. The cows alternate turns, with Bessie making the first turn. Suppose the cow is on island $$$i$$$. During a cow's turn, if there are any bridges connecting island $$$i$$$ to island $$$j$$$, then the cow can move to island $$$j$$$. Then, island $$$i$$$ collapses, and all bridges connecting to island $$$i$$$ also collapse. Also, note the following:<\/p><ul> <li> If there are no bridges connecting island $$$i$$$ to another island, then island $$$i$$$ collapses, and this cow is eliminated from the race. <\/li><li> If the other cow is also on island $$$i$$$, then after this cow moves to another island, the island collapses, and the other cow is eliminated from the race. <\/li><li> After an island or bridge collapses, no cows may use them. <\/li><li> If a cow is eliminated, their turn is skipped for the rest of the race. <\/li><\/ul><p>The race ends once either cow reaches island $$$n$$$. It can be shown that regardless of the cows' strategies, at least one cow reaches island $$$n$$$. Bessie wins if and only if she reaches island $$$n$$$ first.<\/p><p>For each $$$1 \\leq s \\leq n - 1$$$, determine whether Bessie wins if she starts the race on island $$$s$$$. Assume both cows follow optimal strategies to ensure their own respective victories.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains $$$t$$$ ($$$1 \\leq t \\leq 10^4$$$)\u00a0\u2013 the number of test cases.<\/p><p>The first line of each test case contains $$$n$$$ and $$$m$$$ ($$$2 \\leq n \\leq 2 \\cdot 10^5$$$, $$$0 \\leq m \\leq 2 \\cdot 10^5$$$)\u00a0\u2013 the number of islands and the number of alternative bridges.<\/p><p>The next $$$m$$$ lines of each test case contain $$$u$$$ and $$$v$$$ ($$$1 \\leq u  \\lt  v \\leq n$$$)\u00a0\u2013 the islands that the alternative bridge connects. It is guaranteed all alternative bridges are distinct, and they do not coincide with the main bridges.<\/p><p>It is guaranteed that neither the sum of $$$n$$$ nor the sum of $$$m$$$ over all test cases exceeds $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a binary string of length $$$n - 1$$$ on a new line. The $$$i$$$'th character is $$$1$$$ if it is possible for Bessie to win if she starts on island $$$i$$$. Otherwise, it is $$$0$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">6 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">6 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">10 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">15 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4 9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">8 15<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n11111\n11011\n10011\n100001111\n11000111000111\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, there are no alternative bridges for Elsie to overtake Bessie and reach island $$$n$$$ first, so Bessie will win on all islands because she always moves first.<\/p><p>In the second case, Bessie will lose if she starts on island $$$3$$$ because:<\/p><ul> <li> Bessie's Turn: Take a main bridge from island $$$3$$$ to island $$$4$$$. <\/li><li> Elsie's Turn: Take a main bridge from island $$$1$$$ to island $$$2$$$. <\/li><li> Bessie's Turn: Take a main bridge from island $$$4$$$ to island $$$5$$$. <\/li><li> Elsie's Turn: Take an alternative bridge from island $$$2$$$ to island $$$6$$$. Elsie reaches island $$$n$$$ first. <\/li><\/ul><\/div><\/div>"}, {"contestId": 1446, "index": "C", "name": "Xor Tree", "rating": 2100, "solvedCount": 4201, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Xor Tree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>For a given sequence of <span class=\"tex-font-style-bf\">distinct<\/span> non-negative integers $$$(b_1, b_2, \\dots, b_k)$$$ we determine if it is <span class=\"tex-font-style-bf\">good<\/span> in the following way:<\/p><ul> <li> Consider a graph on $$$k$$$ nodes, with numbers from $$$b_1$$$ to $$$b_k$$$ written on them.<\/li><li> For every $$$i$$$ from $$$1$$$ to $$$k$$$: find such $$$j$$$ ($$$1 \\le j \\le k$$$, $$$j\\neq i$$$), for which $$$(b_i \\oplus b_j)$$$ <span class=\"tex-font-style-bf\">is the smallest<\/span> among all such $$$j$$$, where $$$\\oplus$$$ denotes the operation of bitwise XOR (<a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#XOR\">https://en.wikipedia.org/wiki/Bitwise_operation#XOR<\/a>). Next, draw an <span class=\"tex-font-style-bf\">undirected<\/span> edge between vertices with numbers $$$b_i$$$ and $$$b_j$$$ in this graph.<\/li><li> We say that the sequence is <span class=\"tex-font-style-bf\">good<\/span> if and only if the resulting graph forms a <span class=\"tex-font-style-bf\">tree<\/span> (is connected and doesn't have any simple cycles). <\/li><\/ul><p>It is possible that for some numbers $$$b_i$$$ and $$$b_j$$$, you will try to add the edge between them twice. Nevertheless, you will add this edge only once.<\/p><p>You can find an example below (the picture corresponding to the first test case). <\/p><p>Sequence $$$(0, 1, 5, 2, 6)$$$ <span class=\"tex-font-style-bf\">is not<\/span> good as we <span class=\"tex-font-style-bf\">cannot<\/span> reach $$$1$$$ from $$$5$$$.<\/p><p>However, sequence $$$(0, 1, 5, 2)$$$ <span class=\"tex-font-style-bf\">is<\/span> good. <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/d4a5328470cb773b91ddbc5e425b978c856acbdf.png\" style=\"zoom: 30.0%;max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>You are given a sequence $$$(a_1, a_2, \\dots, a_n)$$$ of <span class=\"tex-font-style-bf\">distinct<\/span> non-negative integers. You would like to remove some of the elements (possibly none) to make the <span class=\"tex-font-style-bf\">remaining<\/span> sequence good. What is the minimum possible number of removals required to achieve this goal?<\/p><p>It can be shown that for any sequence, we can remove some number of elements, leaving at least $$$2$$$, so that the remaining sequence is good.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$2 \\le n \\le 200,000$$$)\u00a0\u2014 length of the sequence.<\/p><p>The second line contains $$$n$$$ <span class=\"tex-font-style-bf\">distinct<\/span> non-negative integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$0 \\le a_i \\le 10^9$$$)\u00a0\u2014 the elements of the sequence.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>You should output exactly one integer\u00a0\u2014 the minimum possible number of elements to remove in order to make the remaining sequence good.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n0 1 5 2 6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7\n6 9 8 7 3 5 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Note that numbers which you remove <span class=\"tex-font-style-bf\">don't<\/span> impact the procedure of telling whether the resulting sequence is good.<\/p><p>It is possible that for some numbers $$$b_i$$$ and $$$b_j$$$, you will try to add the edge between them twice. Nevertheless, you will add this edge only once.<\/p><\/div><\/div>"}, {"contestId": 1333, "index": "D", "name": "Challenges in school \u211641", "rating": 2100, "solvedCount": 4188, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Challenges in school \u211641<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are $$$n$$$ children, who study at the school \u211641. It is well-known that they are good mathematicians. Once at a break, they arranged a challenge for themselves. All children arranged in a row and turned heads either to the left or to the right.<\/p><p>Children can do the following: in one second\u00a0several pairs of neighboring children who are <span class=\"tex-font-style-bf\">looking at each other<\/span> can <span class=\"tex-font-style-bf\">simultaneously<\/span> turn the head in the opposite direction. For instance, the one who was looking at the right neighbor turns left and vice versa for the second child. Moreover, every second <span class=\"tex-font-style-bf\">at least one<\/span> pair of neighboring children performs such action. They are going to finish when there is no pair of neighboring children who are looking at each other. <\/p><p>You are given the number $$$n$$$, the initial arrangement of children and the number $$$k$$$. You have to find a way for the children to act if they want to finish the process in exactly $$$k$$$ seconds. More formally, for each of the $$$k$$$ moves, you need to output the numbers of the children who turn left during this move.<\/p><p>For instance, for the configuration shown below and $$$k = 2$$$ children can do the following steps: <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/dd1dbd65783041831751030ed513a67baba29af3.png\" style=\"zoom: 85.0%;max-width: 100.0%;max-height: 100.0%;\"/> <\/center> At the beginning, two pairs make move: $$$(1, 2)$$$ and $$$(3, 4)$$$. After that, we receive the following configuration: <center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/53489d91c295f99d2574450e544e66b388d374a4.png\" style=\"zoom: 85.0%;max-width: 100.0%;max-height: 100.0%;\"/> <\/center> At the second move pair $$$(2, 3)$$$ makes the move. The final configuration is reached. Good job. <center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/d742bab61a8e90b6986cc81c1167760bbcfcad89.png\" style=\"zoom: 85.0%;max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>It is guaranteed that if the solution exists, it takes not more than $$$n^2$$$ \"headturns\".<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains two integers $$$n$$$ and $$$k$$$ ($$$2 \\le n \\le 3000$$$, $$$1 \\le k \\le 3000000$$$) \u00a0\u2014 the number of children and required number of moves.<\/p><p>The next line contains a string of length $$$n$$$ and consists only of characters <span class=\"tex-font-style-tt\">L<\/span> and <span class=\"tex-font-style-tt\">R<\/span>, where <span class=\"tex-font-style-tt\">L<\/span> means that the child looks to the left and <span class=\"tex-font-style-tt\">R<\/span> means that the child looks to the right. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If there is no solution, print a single line with number $$$-1$$$.<\/p><p>Otherwise, output $$$k$$$ lines. Each line has to start with a number $$$n_i$$$ ($$$1\\le n_i \\le \\frac{n}{2}$$$) \u00a0\u2014 the number of pairs of children, who turn at this move. After that print $$$n_i$$$ <span class=\"tex-font-style-bf\">distinct<\/span> integers \u00a0\u2014 the numbers of the children who will turn left during this move. <\/p><p>After performing all \"headturns\", there can't be a pair of two neighboring children looking at each other.<\/p><p>If there are many solutions, print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2 1\nRL\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 1 \n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2 1\nLR\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n-1<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 2\nRLRL\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2 1 3 \n1 2\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The first sample contains a pair of children who look at each other. After one move, they can finish the process.<\/p><p>In the second sample, children can't make any move. As a result, they can't end in $$$k \\gt 0$$$ moves.<\/p><p>The third configuration is described in the statement.<\/p><\/div><\/div>"}, {"contestId": 1203, "index": "F1", "name": "Complete the Projects (easy version)", "rating": 2100, "solvedCount": 4172, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F1. Complete the Projects (easy version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">The only difference between easy and hard versions is that you should complete all the projects in easy version but this is not necessary in hard version<\/span>.<\/p><p>Polycarp is a very famous freelancer. His current rating is $$$r$$$ units.<\/p><p>Some very rich customers asked him to complete some projects for their companies. To complete the $$$i$$$-th project, Polycarp needs to have at least $$$a_i$$$ units of rating; after he completes this project, his rating will change by $$$b_i$$$ (his rating will increase or decrease by $$$b_i$$$) ($$$b_i$$$ can be positive or negative). Polycarp's rating should not fall below zero because then people won't trust such a low rated freelancer.<\/p><p>Is it possible to complete all the projects? Formally, write a program to check if such an order of the projects exists, that Polycarp has enough rating before starting each project, and he has non-negative rating after completing each project.<\/p><p>In other words, you have to check that there exists such an order of projects in which Polycarp will complete them, so he has enough rating before starting each project, and has non-negative rating after completing each project.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains two integers $$$n$$$ and $$$r$$$ ($$$1 \\le n \\le 100, 1 \\le r \\le 30000$$$) \u2014 the number of projects and the initial rating of Polycarp, respectively.<\/p><p>The next $$$n$$$ lines contain projects, one per line. The $$$i$$$-th project is represented as a pair of integers $$$a_i$$$ and $$$b_i$$$ ($$$1 \\le a_i \\le 30000$$$, $$$-300 \\le b_i \\le 300$$$) \u2014 the rating required to complete the $$$i$$$-th project and the rating change after the project completion.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print \"<span class=\"tex-font-style-tt\">YES<\/span>\" or \"<span class=\"tex-font-style-tt\">NO<\/span>\".<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 4\n4 6\n10 -2\n8 -1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 5\n4 -5\n4 -2\n1 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 4\n5 2\n5 -3\n2 1\n4 -2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 10\n10 0\n10 -10\n30 0\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nNO\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, the possible order is: $$$1, 2, 3$$$.<\/p><p>In the second example, the possible order is: $$$2, 3, 1$$$.<\/p><p>In the third example, the possible order is: $$$3, 1, 4, 2$$$.<\/p><\/div><\/div>"}, {"contestId": 2159, "index": "B", "name": "Rectangles", "rating": 2100, "solvedCount": 4128, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Rectangles<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>1024 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a binary grid$$$^{\\text{\u2217}}$$$ $$$G$$$ of dimensions $$$n \\times m$$$.<\/p><p>Let us define a <span class=\"tex-font-style-it\">rectangle<\/span> as a tuple $$$(u,d,l,r)$$$ that satisfies the following conditions:<\/p><ul> <li> $$$1 \\le \\boldsymbol{u  \\lt  d} \\le n$$$; <\/li><li> $$$1 \\le \\boldsymbol{l  \\lt  r} \\le m$$$; <\/li><li> Cells $$$(u,l)$$$, $$$(u,r)$$$, $$$(d,l)$$$, $$$(d,r)$$$ all contain a $$$1$$$. <\/li><\/ul><p>Then, the <span class=\"tex-font-style-it\">area<\/span> of a rectangle $$$(u,d,l,r)$$$ is defined as $$$(d-u+1) \\cdot (r-l+1)$$$.<\/p><p>For example, consider the following binary grid given below.<\/p><p>$$$$$$\\begin{matrix} 1 &amp; 0 &amp; 1 &amp; 0 &amp; 1 \\\\ 1 &amp; 0 &amp; 1 &amp; 0 &amp; 0 \\\\ 0 &amp; 0 &amp; 1 &amp; 0 &amp; 1 \\end{matrix}$$$$$$<\/p><p>Here, you may see two rectangles $$$(1,2,1,3)$$$ and $$$(1,3,3,5)$$$$$$^{\\text{\u2020}}$$$, each of which has area $$$6$$$ and $$$9$$$, respectively.<\/p><p>For each cell $$$(i,j)$$$, find the <span class=\"tex-font-style-bf\">minimum area<\/span> of any rectangle $$$(u,d,l,r)$$$ such that $$$u \\le i \\le d$$$ and $$$l \\le j \\le r$$$.<\/p><div class=\"statement-footnote\"><p>$$$^{\\text{\u2217}}$$$A binary grid is a grid where each cell contains $$$0$$$ or $$$1$$$. The cell on the $$$j$$$-th column of the $$$i$$$-th row is denoted as cell $$$(i,j)$$$.<\/p><p>$$$^{\\text{\u2020}}$$$Note that these are the only rectangles in the grid; for example, $$$(1,1,1,5)$$$ is <span class=\"tex-font-style-bf\">not<\/span> a rectangle as it does not satisfy $$$u \\lt d$$$.<\/p><\/div><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$m$$$ ($$$2 \\le n,m$$$, $$$n\\cdot m \\le 250\\,000$$$).<\/p><p>Each of the $$$n$$$ following lines contains a string of length $$$m$$$ denoting the $$$i$$$-th row of $$$G$$$ ($$$G_{i,j} \\in \\{0,1\\}$$$).<\/p><p>It is guaranteed that the sum of $$$n\\cdot m$$$ over all test cases does not exceed $$$250\\,000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a grid of $$$n$$$ rows and $$$m$$$ columns. On the $$$j$$$-th column of the $$$i$$$-th row, you should output:<\/p><ul> <li> If there exists a rectangle $$$(u,d,l,r)$$$ such that $$$u \\le i \\le d$$$ and $$$l \\le j \\le r$$$, output the minimum area of any such rectangle; <\/li><li> Otherwise, output $$$0$$$ instead. <\/li><\/ul><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">10101<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">10100<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">00101<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">011101<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">010001<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">100010<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">101110<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">11100<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">10110<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">11111<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">01101<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">00111<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n<div class=\"test-example-line test-example-line-odd test-example-line-1\">6 6 6 9 9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">6 6 6 9 9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">0 0 9 9 9<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">0 10 8 8 10 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">0 10 8 8 10 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">10 10 8 8 10 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">10 10 8 8 10 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6 6 6 0 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6 6 4 4 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6 4 4 4 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0 4 4 6 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0 0 6 6 6<\/div><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The first test case is explained in the statement.<\/p><p>For the third test case, there are six rectangles that cover at least one cell with minimum area:<\/p><ul> <li> $$$(1,3,1,2)$$$, which has area $$$6$$$; <\/li><li> $$$(1,2,1,3)$$$, which has area $$$6$$$; <\/li><li> $$$(3,4,2,3)$$$, which has area $$$4$$$; <\/li><li> $$$(2,3,3,4)$$$, which has area $$$4$$$; <\/li><li> $$$(3,5,4,5)$$$, which has area $$$6$$$; <\/li><li> $$$(4,5,3,5)$$$, which has area $$$6$$$. <\/li><\/ul><\/div><\/div>"}, {"contestId": 1810, "index": "E", "name": "Monsters", "rating": 2100, "solvedCount": 4034, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Monsters<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There is an undirected graph with $$$n$$$ vertices and $$$m$$$ edges. Initially, for each vertex $$$i$$$, there is a monster with danger $$$a_{i}$$$ on that vertex. For a monster with danger $$$a_{i}$$$, you can defeat it if and only if you have defeated at least $$$a_{i}$$$ other monsters before.<\/p><p>Now you want to defeat all the monsters. First, you choose some vertex $$$s$$$ and defeat the monster on that vertex (since you haven't defeated any monsters before, $$$a_{s}$$$ has to be $$$0$$$). Then, you can move through the edges. If you want to move from vertex $$$u$$$ to vertex $$$v$$$, then the following must hold: either the monster on vertex $$$v$$$ has been defeated before, or you can defeat it now. For the second case, you defeat the monster on vertex $$$v$$$ and reach vertex $$$v$$$.<\/p><p>You can pass the vertices and the edges any number of times. Determine whether you can defeat all the monsters or not.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$) \u2014 the number of test cases. Their description follows.<\/p><p>The first line of each test case contains two integers $$$n$$$, $$$m$$$ ($$$1 \\le n, m \\le 2 \\cdot 10^5$$$) \u2014 the number of vertices and edges in the graph respectively. <\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_{1}, a_{2}, \\ldots, a_{n}$$$ ($$$0 \\le a_{i} \\le n$$$) \u2014 the dangers of monsters on corresponding vertices.<\/p><p>For the following $$$m$$$ lines, each line contains two integers $$$u$$$, $$$v$$$ ($$$1 \\le u, v \\le n$$$), describing an edge connecting vertex $$$u$$$ and vertex $$$v$$$. It is guaranteed that there are no multi-edges or self-loops in the graph.<\/p><p>It is guaranteed that both the sum of $$$n$$$ and the sum of $$$m$$$ over all test cases do not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output \"<span class=\"tex-font-style-tt\">YES<\/span>\" if you can defeat all the monsters, or \"<span class=\"tex-font-style-tt\">NO<\/span>\" otherwise.<\/p><p>You can output the answer in any case (upper or lower). For example, the strings \"<span class=\"tex-font-style-tt\">yEs<\/span>\", \"<span class=\"tex-font-style-tt\">yes<\/span>\", \"<span class=\"tex-font-style-tt\">Yes<\/span>\", and \"<span class=\"tex-font-style-tt\">YES<\/span>\" will be recognized as positive responses.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 1 0 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">6 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">0 1 2 3 0 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0 1 2 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 1 1 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">0 1 3 2 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3 5<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nYES\nNO\nYES\nNO\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, you can start at vertex $$$3$$$ and defeat the monster on it, before you go to vertices $$$2$$$, $$$1$$$ in this order, defeating the monsters on them as well. Then you return to vertex $$$3$$$, and go to vertex $$$4$$$, defeating the monster on it.<\/p><p>In the third test case, there is no path to vertex $$$4$$$ if you start at vertex $$$1$$$. Also, there is no path to vertices $$$1$$$, $$$2$$$, and $$$3$$$ if you start at vertex $$$4$$$.<\/p><\/div><\/div>"}, {"contestId": 1482, "index": "E", "name": "Skyline Photo", "rating": 2100, "solvedCount": 3996, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Skyline Photo<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Alice is visiting New York City. To make the trip fun, Alice will take photos of the city skyline and give the set of photos as a present to Bob. However, she wants to find the set of photos with maximum beauty and she needs your help. <\/p><p>There are $$$n$$$ buildings in the city, the $$$i$$$-th of them has positive height $$$h_i$$$. All $$$n$$$ building heights in the city are different. In addition, each building has a beauty value $$$b_i$$$. Note that beauty can be positive or negative, as there are ugly buildings in the city too. <\/p><p>A set of photos consists of one or more photos of the buildings in the skyline. Each photo includes one or more buildings in the skyline that form a contiguous segment of indices. Each building needs to be in <span class=\"tex-font-style-bf\">exactly one<\/span> photo. This means that if a building does not appear in any photo, or if a building appears in more than one photo, the set of pictures is not valid. <\/p><p>The beauty of a photo is equivalent to the beauty $$$b_i$$$ of the shortest building in it. The total beauty of a set of photos is the sum of the beauty of all photos in it. Help Alice to find the maximum beauty a valid set of photos can have. <\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$n$$$ ($$$1 \\le n \\le 3 \\cdot 10^5$$$), the number of buildings on the skyline. <\/p><p>The second line contains $$$n$$$ distinct integers $$$h_1, h_2, \\ldots, h_n$$$ ($$$1 \\le h_i \\le n$$$). The $$$i$$$-th number represents the height of building $$$i$$$.<\/p><p>The third line contains $$$n$$$ integers $$$b_1, b_2, \\ldots, b_n$$$ ($$$-10^9 \\le b_i \\le 10^9$$$). The $$$i$$$-th number represents the beauty of building $$$i$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one number representing the maximum beauty Alice can achieve for a valid set of photos of the skyline. <\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n1 2 3 5 4\n1 5 3 2 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n15\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n1 4 3 2 5\n-3 4 -10 2 7\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n10\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n2 1\n-2 -3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n-3\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n10\n4 7 3 2 5 1 9 10 6 8\n-4 40 -46 -8 -16 4 -10 41 12 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n96\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, Alice can achieve maximum beauty by taking five photos, each one containing one building. <\/p><p>In the second example, Alice can achieve a maximum beauty of $$$10$$$ by taking four pictures: three just containing one building, on buildings $$$1$$$, $$$2$$$ and $$$5$$$, each photo with beauty $$$-3$$$, $$$4$$$ and $$$7$$$ respectively, and another photo containing building $$$3$$$ and $$$4$$$, with beauty $$$2$$$. <\/p><p>In the third example, Alice will just take one picture of the whole city.<\/p><p>In the fourth example, Alice can take the following pictures to achieve maximum beauty: photos with just one building on buildings $$$1$$$, $$$2$$$, $$$8$$$, $$$9$$$, and $$$10$$$, and a single photo of buildings $$$3$$$, $$$4$$$, $$$5$$$, $$$6$$$, and $$$7$$$. <\/p><\/div><\/div>"}, {"contestId": 466, "index": "D", "name": "Increase Sequence", "rating": 2100, "solvedCount": 3995, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Increase Sequence<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Peter has a sequence of integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span>. Peter wants all numbers in the sequence to equal <span class=\"tex-span\"><i>h<\/i><\/span>. He can perform the operation of \"adding one on the segment <span class=\"tex-span\">[<i>l<\/i>,\u2009<i>r<\/i>]<\/span>\": add one to all elements of the sequence with indices from <span class=\"tex-span\"><i>l<\/i><\/span> to <span class=\"tex-span\"><i>r<\/i><\/span> (inclusive). At that, Peter never chooses any element as the beginning of the segment twice. Similarly, Peter never chooses any element as the end of the segment twice. In other words, for any two segments <span class=\"tex-span\">[<i>l<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>r<\/i><sub class=\"lower-index\">1<\/sub>]<\/span> and <span class=\"tex-span\">[<i>l<\/i><sub class=\"lower-index\">2<\/sub>,\u2009<i>r<\/i><sub class=\"lower-index\">2<\/sub>]<\/span>, where Peter added one, the following inequalities hold: <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\">1<\/sub>\u2009\u2260\u2009<i>l<\/i><sub class=\"lower-index\">2<\/sub><\/span> and <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\">1<\/sub>\u2009\u2260\u2009<i>r<\/i><sub class=\"lower-index\">2<\/sub><\/span>.<\/p><p>How many distinct ways are there to make all numbers in the sequence equal <span class=\"tex-span\"><i>h<\/i><\/span>? Print this number of ways modulo <span class=\"tex-span\">1000000007\u00a0(10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097)<\/span>. Two ways are considered distinct if one of them has a segment that isn't in the other way.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i>,\u2009<i>h<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>h<\/i>\u2009\u2264\u20092000)<\/span>. The next line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> <span class=\"tex-span\">(0\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u20092000)<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u2014 the answer to the problem modulo <span class=\"tex-span\">1000000007\u00a0(10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097)<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 2<br/>1 1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 1<br/>1 1 1 1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 3<br/>3 2 1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1775, "index": "E", "name": "The Human Equation", "rating": 2100, "solvedCount": 3988, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. The Human Equation<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Petya and his friend, the robot Petya++, went to BFDMONCON, where the costume contest is taking place today. <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/38a74f03012a8f0d58be351e218832375e2a2a7a.png\" style=\"zoom: 30.0%;max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>While walking through the festival, they came across a scientific stand named after Professor Oak and Golfball, where they were asked to solve an interesting problem.<\/p><p>Given a sequence of numbers $$$a_1, a_2, \\dots, a_n$$$ you can perform several operations on this sequence.<\/p><p>Each operation should look as follows. You choose some subsequence$$$^\\dagger$$$. Then you call all the numbers at odd positions in this subsequence <span class=\"tex-font-style-it\">northern<\/span>, and all the numbers at even positions in this subsequence <span class=\"tex-font-style-it\">southern<\/span>. In this case, only the position of the number in the subsequence is taken into account, not in the original sequence.<\/p><p>For example, consider the sequence $$$1, 4, 2, 8, 5, 7, 3, 6, 9$$$ and its subsequence (shown in bold) $$$1, \\mathbf{4}, \\mathbf{2}, 8, \\mathbf{5}, 7, 3, \\mathbf{6}, 9$$$. Then the numbers $$$4$$$ and $$$5$$$ are <span class=\"tex-font-style-it\">northern<\/span>, and the numbers $$$2$$$ and $$$6$$$ are <span class=\"tex-font-style-it\">southern<\/span>.<\/p><p>After that, you can do one of the following: <\/p><ul> <li> add $$$1$$$ to all northern numbers and subtract $$$1$$$ from all south numbers; or <\/li><li> add $$$1$$$ to all southern numbers and subtract $$$1$$$ from all northern numbers. <\/li><\/ul><p>Thus, from the sequence $$$1, \\mathbf{4}, \\mathbf{2}, 8, \\mathbf{5}, 7, 3, \\mathbf{6}, 9$$$, if you choose the subsequence shown in bold, you can get either $$$1, \\mathbf{5}, \\mathbf{1}, 8, \\mathbf{6}, 7, 3, \\mathbf{5}, 9$$$ or $$$1, \\mathbf{3}, \\mathbf{3}, 8, \\mathbf{4}, 7, 3, \\mathbf{7}, 9$$$.<\/p><p>Then the operation ends. Note also that all operations are independent, i.\u00a0e. the numbers are no longer called <span class=\"tex-font-style-it\">northern<\/span> or <span class=\"tex-font-style-it\">southern<\/span> when one operation ends.<\/p><p>It is necessary to turn all the numbers of the sequence into zeros using the operations described above. Since there is very little time left before the costume contest, the friends want to know, what is the minimum number of operations required for this.<\/p><p>The friends were unable to solve this problem, so can you help them?<\/p><p>$$$^\\dagger$$$ A sequence $$$c$$$ is a subsequence of a sequence $$$d$$$ if $$$c$$$ can be obtained from $$$d$$$ by the deletion of several (possibly, zero or all) elements.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows.<\/p><p>The first line of each test case contains an integer $$$n$$$ ($$$1 \\le n \\le 2\\cdot 10^5$$$)\u00a0\u2014 the length of the sequence.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$-10^9 \\le a_i \\le 10^9$$$)\u00a0\u2014 the description of the sequence itself.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2\\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print one integer in a single line\u00a0\u2014 the minimum number of operations it takes to turn all the numbers into zeros.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 -3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 0 0 -1 -1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 -4 3 -5 4 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 -1 1 -1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">0 0 0 0 0 0 0<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n2\n6\n1\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the sequence of operations is as follows: $$$\\mathbf{1}, 2, \\mathbf{-3} \\longrightarrow 0, \\mathbf{2}, \\mathbf{-2} \\longrightarrow 0, \\mathbf{1}, \\mathbf{-1} \\longrightarrow 0, 0, 0$$$.<\/p><p>In the second test case, the sequence looks like this: $$$\\mathbf{1}, 0, 0, \\mathbf{-1}, -1 \\longrightarrow 0, 0, 0, 0, \\mathbf{-1} \\longrightarrow 0, 0, 0, 0, 0$$$.<\/p><p>In the fourth test case, simply select the entire sequence as a subsequence, then subtract one from the northern numbers and add one to the southern numbers. Thus, the sequence will be nulled in one operation.<\/p><p>In the fifth test case, you don't need to do any operations, since the sequence already consists of zeros.<\/p><\/div><\/div>"}, {"contestId": 1392, "index": "E", "name": "Omkar and Duck", "rating": 2100, "solvedCount": 3955, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Omkar and Duck<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is an interactive problem.<\/span><\/p><p>Omkar has just come across a duck! The duck is walking on a grid with $$$n$$$ rows and $$$n$$$ columns ($$$2 \\leq n \\leq 25$$$) so that the grid contains a total of $$$n^2$$$ cells. Let's denote by $$$(x, y)$$$ the cell in the $$$x$$$-th row from the top and the $$$y$$$-th column from the left. Right now, the duck is at the cell $$$(1, 1)$$$ (the cell in the top left corner) and would like to reach the cell $$$(n, n)$$$ (the cell in the bottom right corner) by moving either down $$$1$$$ cell or to the right $$$1$$$ cell each second.<\/p><p>Since Omkar thinks ducks are fun, he wants to play a game with you based on the movement of the duck. First, for each cell $$$(x, y)$$$ in the grid, you will tell Omkar a nonnegative integer $$$a_{x,y}$$$ not exceeding $$$10^{16}$$$, and Omkar will then put $$$a_{x,y}$$$ uninteresting problems in the cell $$$(x, y)$$$. After that, the duck will start their journey from $$$(1, 1)$$$ to $$$(n, n)$$$. For each cell $$$(x, y)$$$ that the duck crosses during their journey (including the cells $$$(1, 1)$$$ and $$$(n, n)$$$), the duck will eat the $$$a_{x,y}$$$ uninteresting problems in that cell. Once the duck has completed their journey, Omkar will measure their mass to determine the total number $$$k$$$ of uninteresting problems that the duck ate on their journey, and then tell you $$$k$$$.<\/p><p>Your challenge, given $$$k$$$, is to exactly reproduce the duck's path, i. e. to tell Omkar precisely which cells the duck crossed on their journey. To be sure of your mastery of this game, Omkar will have the duck complete $$$q$$$ different journeys ($$$1 \\leq q \\leq 10^3$$$). Note that all journeys are independent: at the beginning of each journey, the cell $$$(x, y)$$$ will still contain $$$a_{x,y}$$$ uninteresting tasks.<\/p><\/div><div><div class=\"section-title\">Interaction<\/div><p>The interaction will begin with a line containing a single integer $$$n$$$ ($$$2 \\leq n \\leq 25$$$), the amount of rows and columns in the grid. Read it.<\/p><p>Your program should then print $$$n$$$ lines. The $$$x$$$-th line should contain $$$n$$$ integers $$$a_{x,1}, a_{x,2}, \\dotsc, a_{x,n}$$$ satisfying $$$0 \\leq a_{x,y} \\leq 10^{16}$$$, where $$$a_{x,y}$$$ is the amount of uninteresting problems Omkar should place in the cell $$$(x, y)$$$.<\/p><p>After that, you will first receive a single integer $$$q$$$, the amount of journeys that the duck will take. $$$q$$$ queries will follow; each query will consist of a single line containing an integer $$$k$$$, the amount of uninteresting problems that the duck ate on that journey. After each query, given that you have determined that the duck visited the cells $$$(x_1, y_1), (x_2, y_2), \\dotsc, (x_{2n - 1}, y_{2n - 1})$$$ in that order (it should always be true that $$$(x_1, y_1) = (1, 1)$$$ and $$$(x_{2n - 1}, y_{2n - 1}) = (n, n)$$$), you should output $$$2n - 1$$$ lines so that the $$$j$$$-th line contains the two integers $$$x_j, y_j$$$.<\/p><p><span class=\"tex-font-style-bf\">Bear in mind that if the sum on your path is $$$k$$$, but your path is different from the actual hidden path, then your solution is still wrong!<\/span><\/p><p>After printing each line do not forget to output end of line and flush the output. Otherwise, you will get <span class=\"tex-font-style-tt\">Idleness limit exceeded<\/span>. To do this, use:<\/p><ul><li> <span class=\"tex-font-style-tt\">fflush(stdout)<\/span> or <span class=\"tex-font-style-tt\">cout.flush()<\/span> in C++;<\/li><li> <span class=\"tex-font-style-tt\">System.out.flush()<\/span> in Java;<\/li><li> <span class=\"tex-font-style-tt\">flush(output)<\/span> in Pascal;<\/li><li> <span class=\"tex-font-style-tt\">stdout.flush()<\/span> in Python;<\/li><li> see documentation for other languages.<\/li><\/ul><p><span class=\"tex-font-style-bf\">Hack Format<\/span><\/p><p>To hack, first output a line containing $$$n$$$ and another line containing $$$q$$$. It must be true that $$$2 \\leq n \\leq 25$$$ and $$$1 \\leq q \\leq 1000$$$. Then, output the $$$q$$$ journeys taken by the duck in the same format as described above: for each journey, given that the duck visited the cells $$$(x_1, y_1), (x_2, y_2), \\dotsc, (x_{2n - 1}, y_{2n - 1})$$$ in that order, you should output $$$2n - 1$$$ lines so that the $$$j$$$-th line contains the two integers $$$x_j, y_j$$$. It must be true that $$$(x_1, y_1) = (1, 1)$$$ and $$$(x_{2n - 1}, y_{2n - 1}) = (n, n)$$$. Additionally, for each $$$j$$$ such that $$$2 \\leq j \\leq 2n - 1$$$, it must be true that $$$1 \\leq x_j, y_j \\leq n$$$ and either $$$(x_j, y_j) = (x_{j - 1} + 1, y_{j - 1})$$$ or $$$(x_j, y_j) = (x_{j - 1}, y_{j - 1} + 1)$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n\n\n\n\n3\n23\n\n\n\n\n\n\n\n26\n\n\n\n\n\n\n\n27\n\n\n\n\n\n\n\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 2 3 6\n4 6 2 10\n9 0 7 3\n2 8 8 2\n\n\n1 1\n1 2\n1 3\n2 3\n2 4\n3 4\n4 4\n\n1 1\n2 1\n3 1\n3 2\n3 3\n3 4\n4 4\n\n1 1\n1 2\n1 3\n1 4\n2 4\n3 4\n4 4\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The duck's three journeys are illustrated below.<\/p><p>$$$1 + 2 + 3 + 2 + 10 + 3 + 2 = 23$$$ <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/b745a4f5aa30fb781c4a61766f88e497e7ba5e41.png\" style=\"zoom: 40.0%;max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>$$$1 + 4 + 9 + 0 + 7 + 3 + 2 = 26$$$ <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/51a62c32428b2281b9792c5262ea1a32cf485943.png\" style=\"zoom: 40.0%;max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>$$$1 + 2 + 3 + 6 + 10 + 3 + 2 = 27$$$ <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/886765d811ec84faf5ba21a905186a032de79b63.png\" style=\"zoom: 40.0%;max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}];
    let currentProblem = null;
    let editor = null;
    const STORAGE_KEY = `cf_ladder_done_2100`;
    let doneSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));

    // Retrieve the template securely from the hidden textarea
    const DEFAULT_TEMPLATE = document.getElementById('cpp-template').value.trim();

    function initEditor() {
        editor = ace.edit("editor");
        editor.setTheme("ace/theme/tomorrow_night_eighties");
        editor.session.setMode("ace/mode/c_cpp");
        editor.setFontSize(15);
        editor.setValue(DEFAULT_TEMPLATE, 1);
    }

    function renderSidebar() {
        const list = document.getElementById('problem-list');
        list.innerHTML = '';
        PROBLEMS.forEach((prob, idx) => {
            const div = document.createElement('div');
            div.className = `problem-item ${currentProblem === prob ? 'active' : ''}`;
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox'; checkbox.className = 'done-checkbox'; checkbox.checked = doneSet.has(prob.name);
            checkbox.onclick = (e) => { e.stopPropagation(); toggleDone(prob.name, checkbox.checked); };
            const title = document.createElement('div');
            title.innerHTML = `<span class="text-xs text-slate-500">#${idx + 1}</span> <span class="font-semibold text-slate-200">${prob.name}</span>`;
            div.appendChild(checkbox); div.appendChild(title); div.onclick = () => loadProblem(prob);
            list.appendChild(div);
        });
        updateProgress();
    }

    function toggleDone(name, isDone) {
        if(isDone) { doneSet.add(name); confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#4ade80', '#38bdf8'] }); } 
        else { doneSet.delete(name); }
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...doneSet]));
        updateProgress();
    }

    function updateProgress() { document.getElementById('progress-text').innerText = `${doneSet.size} / ${PROBLEMS.length} Solved`; }

    function loadProblem(prob) {
        currentProblem = prob; renderSidebar();
        document.getElementById('welcome-screen').style.display = 'none';
        const contentDiv = document.getElementById('problem-content');
        contentDiv.style.display = 'block'; contentDiv.innerHTML = prob.html;
        const titleEl = contentDiv.querySelector('.header .title');
        if(titleEl) {
            const originalText = titleEl.innerText;
            titleEl.innerHTML = `<a href="https://codeforces.com/contest/${prob.contestId}/problem/${prob.index}" target="_blank" title="Open in Codeforces">${originalText} 🔗</a>`;
        }
        contentDiv.querySelectorAll('.sample-tests .input pre').forEach(pre => {
            const btn = document.createElement('button'); btn.innerText = 'Copy'; btn.className = 'copy-btn';
            btn.onclick = () => { navigator.clipboard.writeText(pre.innerText); btn.innerText = 'Copied!'; btn.style.background = '#4ade80'; setTimeout(() => { btn.innerText = 'Copy'; btn.style.background = 'var(--neon-blue)'; }, 2000); };
            pre.parentElement.appendChild(btn);
        });
        if (window.MathJax) { MathJax.typesetPromise([contentDiv]); }
        editor.setValue(DEFAULT_TEMPLATE, 1);
    }

    function toggleSettings() {
        const modal = document.getElementById('settings-modal');
        if(modal.style.display === 'flex') { modal.style.display = 'none'; } 
        else { modal.style.display = 'flex'; document.getElementById('api-key').value = localStorage.getItem('cf_api_key') || ''; document.getElementById('api-secret').value = localStorage.getItem('cf_api_secret') || ''; }
    }

    function saveSettings() {
        localStorage.setItem('cf_api_key', document.getElementById('api-key').value);
        localStorage.setItem('cf_api_secret', document.getElementById('api-secret').value);
        toggleSettings(); alert('API Credentials Saved!');
    }

    async function sha512(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-512', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function submitCode() {
        if(!currentProblem) return alert('Select a problem first!');
        const apiKey = localStorage.getItem('cf_api_key'); const apiSecret = localStorage.getItem('cf_api_secret');
        if(!apiKey || !apiSecret) { alert('Please configure your API Key and Secret first.'); toggleSettings(); return; }
        const code = editor.getValue(); const time = Math.floor(Date.now() / 1000); const rand = Math.floor(Math.random() * 900000) + 100000;
        const params = { apiKey: apiKey, contestId: currentProblem.contestId.toString(), languageId: "54", problemIndex: currentProblem.index, source: code, time: time.toString() };
        const sortedKeys = Object.keys(params).sort();
        let paramString = sortedKeys.map(k => `${k}=${encodeURIComponent(params[k])}`).join('&');
        const sigPlain = `${rand}/problemset.submit?${paramString}#${apiSecret}`;
        const apiSig = `${rand}` + await sha512(sigPlain);
        try {
            const formData = new URLSearchParams();
            for (const key in params) formData.append(key, params[key]);
            formData.append("apiSig", apiSig);
            const res = await fetch("https://codeforces.com/api/problemset.submit", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: formData.toString() });
            const data = await res.json();
            if(data.status === 'OK') { alert('Code submitted successfully! 🎉 Check your Codeforces submissions.'); confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } }); } 
            else { alert('Submission failed: ' + data.comment); }
        } catch (err) { console.error(err); alert('Network error during submission.'); }
    }

    window.onload = () => { initEditor(); renderSidebar(); };
</script>

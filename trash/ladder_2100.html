wer-index\"><i>n<\/i><\/sub>\u2009=\u20090<\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>\u2009&lt;\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>\u2009&lt;\u2009...\u2009&lt;\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\">1<\/sub>\u2009&gt;\u2009<i>b<\/i><sub class=\"lower-index\">2<\/sub>\u2009&gt;\u2009...\u2009&gt;\u2009<i>b<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>The only line of output must contain the minimum cost of cutting all the trees completely.<\/p><p>Please, do not write the <span class=\"tex-font-style-tt\">%lld<\/span> specifier to read or write 64-bit integers in \u0421++. It is preferred to use the <span class=\"tex-font-style-tt\">cin<\/span>, <span class=\"tex-font-style-tt\">cout<\/span> streams or the <span class=\"tex-font-style-tt\">%I64d<\/span> specifier.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1 2 3 4 5<br/>5 4 3 2 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>25<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>6<br/>1 2 3 10 20 30<br/>6 5 4 3 2 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>138<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1433, "index": "F", "name": "Zero Remainder Sum ", "rating": 2100, "solvedCount": 6927, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Zero Remainder Sum <\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a matrix $$$a$$$ of size $$$n \\times m$$$ consisting of integers.<\/p><p>You can choose <span class=\"tex-font-style-bf\">no more than<\/span> $$$\\left\\lfloor\\frac{m}{2}\\right\\rfloor$$$ elements in <span class=\"tex-font-style-bf\">each row<\/span>. Your task is to choose these elements in such a way that their sum is <span class=\"tex-font-style-bf\">divisible by<\/span> $$$k$$$ and this sum is the <span class=\"tex-font-style-bf\">maximum<\/span>.<\/p><p>In other words, you can choose no more than a half (rounded down) of elements in each row, you have to find the maximum sum of these elements divisible by $$$k$$$.<\/p><p>Note that you can choose zero elements (and the sum of such set is $$$0$$$).<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains three integers $$$n$$$, $$$m$$$ and $$$k$$$ ($$$1 \\le n, m, k \\le 70$$$) \u2014 the number of rows in the matrix, the number of columns in the matrix and the value of $$$k$$$. The next $$$n$$$ lines contain $$$m$$$ elements each, where the $$$j$$$-th element of the $$$i$$$-th row is $$$a_{i, j}$$$ ($$$1 \\le a_{i, j} \\le 70$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the maximum sum divisible by $$$k$$$ you can obtain.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 4 3\n1 2 3 4\n5 2 2 2\n7 1 1 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n24\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 5 4\n1 2 4 2 1\n3 5 1 2 4\n1 5 7 1 2\n3 8 7 1 2\n8 4 7 1 6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n56\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, the optimal answer is $$$2$$$ and $$$4$$$ in the first row, $$$5$$$ and $$$2$$$ in the second row and $$$7$$$ and $$$4$$$ in the third row. The total sum is $$$2 + 4 + 5 + 2 + 7 + 4 = 24$$$.<\/p><\/div><\/div>"}, {"contestId": 1, "index": "C", "name": "Ancient Berland Circus", "rating": 2100, "solvedCount": 6717, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Ancient Berland Circus<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>64 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Nowadays all circuses in Berland have a round arena with diameter 13 meters, but in the past things were different.<\/p><p>In Ancient Berland arenas in circuses were shaped as a regular (equiangular) polygon, the size and the number of angles could vary from one circus to another. In each corner of the arena there was a special pillar, and the rope strung between the pillars marked the arena edges.<\/p><p>Recently the scientists from Berland have discovered the remains of the ancient circus arena. They found only three pillars, the others were destroyed by the time.<\/p><p>You are given the coordinates of these three pillars. Find out what is the smallest area that the arena could have.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The input file consists of three lines, each of them contains a pair of numbers \u2013\u2013 coordinates of the pillar. Any coordinate doesn't exceed 1000 by absolute value, and is given with at most six digits after decimal point.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output the smallest possible area of the ancient arena. This number should be accurate to at least 6 digits after the decimal point. It's guaranteed that the number of angles in the optimal polygon is not larger than 100.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>0.000000 0.000000<br/>1.000000 1.000000<br/>0.000000 1.000000<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1.00000000<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 455, "index": "C", "name": "Civilization", "rating": 2100, "solvedCount": 6681, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Civilization<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Andrew plays a game called \"Civilization\". Dima helps him.<\/p><p>The game has <span class=\"tex-span\"><i>n<\/i><\/span> cities and <span class=\"tex-span\"><i>m<\/i><\/span> bidirectional roads. The cities are numbered from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span>. Between any pair of cities there either is a single (unique) path, or there is no path at all. A path is such a sequence of distinct cities <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>v<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>v<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span>, that there is a road between any contiguous cities <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i>\u2009+\u20091<\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>i<\/i>\u2009&lt;\u2009<i>k<\/i><\/span>). The length of the described path equals to <span class=\"tex-span\">(<i>k<\/i>\u2009-\u20091)<\/span>. We assume that two cities lie in the same region if and only if, there is a path connecting these two cities.<\/p><p>During the game events of two types take place:<\/p><ol> <li> Andrew asks Dima about the length of the longest path in the region where city <span class=\"tex-span\"><i>x<\/i><\/span> lies. <\/li><li> Andrew asks Dima to merge the region where city <span class=\"tex-span\"><i>x<\/i><\/span> lies with the region where city <span class=\"tex-span\"><i>y<\/i><\/span> lies. If the cities lie in the same region, then no merging is needed. Otherwise, you need to merge the regions as follows: choose a city from the first region, a city from the second region and connect them by a road so as to minimize the length of the longest path in the resulting region. If there are multiple ways to do so, you are allowed to choose any of them. <\/li><\/ol><p>Dima finds it hard to execute Andrew's queries, so he asks you to help him. Help Dima.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains three integers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>m<\/i><\/span>, <span class=\"tex-span\"><i>q<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20093\u00b710<sup class=\"upper-index\">5<\/sup><\/span>; <span class=\"tex-span\">0\u2009\u2264\u2009<i>m<\/i>\u2009&lt;\u2009<i>n<\/i><\/span>; <span class=\"tex-span\">1\u2009\u2264\u2009<i>q<\/i>\u2009\u2264\u20093\u00b710<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the number of cities, the number of the roads we already have and the number of queries, correspondingly.<\/p><p>Each of the following <span class=\"tex-span\"><i>m<\/i><\/span> lines contains two integers, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2260\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>;<\/span> <span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>). These numbers represent the road between cities <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. There can be at most one road between two cities.<\/p><p>Each of the following <span class=\"tex-span\"><i>q<\/i><\/span> lines contains one of the two events in the following format:<\/p><ul> <li> <span class=\"tex-span\">1<\/span> <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. It is the request Andrew gives to Dima to find the length of the maximum path in the region that contains city <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>). <\/li><li> <span class=\"tex-span\">2<\/span> <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\"><i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. It is the request Andrew gives to Dima to merge the region that contains city <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and the region that contains city <span class=\"tex-span\"><i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>). Note, that <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> can be equal to <span class=\"tex-span\"><i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. <ul><\/ul><\/li><\/ul><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each event of the first type print the answer on a separate line.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>6 0 6<br/>2 1 2<br/>2 3 4<br/>2 5 6<br/>2 3 2<br/>2 5 3<br/>1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1355, "index": "E", "name": "Restorer Distance", "rating": 2100, "solvedCount": 6137, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Restorer Distance<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You have to restore the wall. The wall consists of $$$N$$$ pillars of bricks, the height of the $$$i$$$-th pillar is initially equal to $$$h_{i}$$$, the height is measured in number of bricks. After the restoration all the $$$N$$$ pillars should have equal heights.<\/p><p>You are allowed the following operations:<\/p><ul><li> put a brick on top of one pillar, the cost of this operation is $$$A$$$;<\/li><li> remove a brick from the top of one non-empty pillar, the cost of this operation is $$$R$$$;<\/li><li> move a brick from the top of one non-empty pillar to the top of another pillar, the cost of this operation is $$$M$$$.<\/li><\/ul><p>You cannot create additional pillars or ignore some of pre-existing pillars even if their height becomes $$$0$$$.<\/p><p>What is the minimal total cost of restoration, in other words, what is the minimal total cost to make all the pillars of equal height?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains four integers $$$N$$$, $$$A$$$, $$$R$$$, $$$M$$$ ($$$1 \\le N \\le 10^{5}$$$, $$$0 \\le A, R, M \\le 10^{4}$$$)\u00a0\u2014 the number of pillars and the costs of operations.<\/p><p>The second line contains $$$N$$$ integers $$$h_{i}$$$ ($$$0 \\le h_{i} \\le 10^{9}$$$)\u00a0\u2014 initial heights of pillars.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer\u00a0\u2014 the minimal cost of restoration.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 1 100 100\n1 3 8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n12\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 100 1 100\n1 3 8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n9\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 100 100 1\n1 3 8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 1 2 4\n5 5 3 6 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 1 2 2\n5 5 3 6 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1217, "index": "D", "name": "Coloring Edges", "rating": 2100, "solvedCount": 6127, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Coloring Edges<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a directed graph with $$$n$$$ vertices and $$$m$$$ directed edges without self-loops or multiple edges.<\/p><p>Let's denote the $$$k$$$-coloring of a digraph as following: you color each edge in one of $$$k$$$ colors. The $$$k$$$-coloring is <span class=\"tex-font-style-bf\">good<\/span> if and only if there no cycle formed by edges of same color.<\/p><p>Find a good $$$k$$$-coloring of given digraph with minimum possible $$$k$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$m$$$ ($$$2 \\le n \\le 5000$$$, $$$1 \\le m \\le 5000$$$) \u2014 the number of vertices and edges in the digraph, respectively.<\/p><p>Next $$$m$$$ lines contain description of edges \u2014 one per line. Each edge is a pair of integers $$$u$$$ and $$$v$$$ ($$$1 \\le u, v \\le n$$$, $$$u \\ne v$$$) \u2014 there is directed edge from $$$u$$$ to $$$v$$$ in the graph.<\/p><p>It is guaranteed that each ordered pair $$$(u, v)$$$ appears in the list of edges at most once.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In the first line print single integer $$$k$$$ \u2014 the number of used colors in a good $$$k$$$-coloring of given graph.<\/p><p>In the second line print $$$m$$$ integers $$$c_1, c_2, \\dots, c_m$$$ ($$$1 \\le c_i \\le k$$$), where $$$c_i$$$ is a color of the $$$i$$$-th edge (in order as they are given in the input).<\/p><p>If there are multiple answers print any of them (you still have to minimize $$$k$$$).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 5\n1 2\n1 3\n3 4\n2 4\n1 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n1 1 1 1 1 \n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 3\n1 2\n2 3\n3 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n1 1 2 \n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1450, "index": "C1", "name": "Errich-Tac-Toe (Easy Version)", "rating": 2100, "solvedCount": 6043, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C1. Errich-Tac-Toe (Easy Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">The only difference between the easy and hard versions is that tokens of type <span class=\"tex-font-style-tt\">O<\/span> do not appear in the input of the easy version.<\/span><\/p><p><span class=\"tex-font-style-it\">Errichto gave Monogon the following challenge in order to intimidate him from taking his top contributor spot on Codeforces.<\/span><\/p><p>In a Tic-Tac-Toe grid, there are $$$n$$$ rows and $$$n$$$ columns. Each cell of the grid is either empty or contains a token. There are two types of tokens: <span class=\"tex-font-style-tt\">X<\/span> and <span class=\"tex-font-style-tt\">O<\/span>. If there exist three tokens of the same type consecutive in a row or column, it is a winning configuration. Otherwise, it is a draw configuration.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/bba0760cbab8c91381e0746bd01cc5a4be5b9329.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> The patterns in the first row are winning configurations. The patterns in the second row are draw configurations. <\/center><p>In an operation, you can change an <span class=\"tex-font-style-tt\">X<\/span> to an <span class=\"tex-font-style-tt\">O<\/span>, or an <span class=\"tex-font-style-tt\">O<\/span> to an <span class=\"tex-font-style-tt\">X<\/span>. Let $$$k$$$ denote the total number of tokens in the grid. Your task is to make the grid a <span class=\"tex-font-style-bf\">draw<\/span> in at most $$$\\lfloor \\frac{k}{3}\\rfloor$$$ (rounding down) operations.<\/p><p>You are <span class=\"tex-font-style-bf\">not required<\/span> to minimize the number of operations.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1\\le t\\le 100$$$) \u2014 the number of test cases.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1\\le n\\le 300$$$) \u2014 the size of the grid.<\/p><p>The following $$$n$$$ lines each contain a string of $$$n$$$ characters, denoting the initial grid. The character in the $$$i$$$-th row and $$$j$$$-th column is '<span class=\"tex-font-style-tt\">.<\/span>' if the cell is empty, or it is the type of token in the cell: '<span class=\"tex-font-style-tt\">X<\/span>' or '<span class=\"tex-font-style-tt\">O<\/span>'.<\/p><p>It is guaranteed that not all cells are empty.<\/p><p>In the easy version, the character '<span class=\"tex-font-style-tt\">O<\/span>' does not appear in the input.<\/p><p>The sum of $$$n$$$ across all test cases does not exceed $$$300$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print the state of the grid after applying the operations.<\/p><p>We have proof that a solution always exists. If there are multiple solutions, print any.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n3\n.X.\nXXX\n.X.\n6\nXX.XXX\nXXXXXX\nXXX.XX\nXXXXXX\nXX.X.X\nXXXXXX\n5\nXXX.X\n.X..X\nXXX.X\n..X..\n..X..\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n.X.\nXOX\n.X.\nXX.XXO\nXOXXOX\nOXX.XX\nXOOXXO\nXX.X.X\nOXXOXX\nXOX.X\n.X..X\nXXO.O\n..X..\n..X..\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, there are initially three '<span class=\"tex-font-style-tt\">X<\/span>' consecutive in the second row and the second column. By changing the middle token to '<span class=\"tex-font-style-tt\">O<\/span>' we make the grid a draw, and we only changed $$$1\\le \\lfloor 5/3\\rfloor$$$ token.<\/p><p>In the second test case, we change only $$$9\\le \\lfloor 32/3\\rfloor$$$ tokens, and there does not exist any three '<span class=\"tex-font-style-tt\">X<\/span>' or '<span class=\"tex-font-style-tt\">O<\/span>' consecutive in a row or column, so it is a draw.<\/p><p>In the third test case, we change only $$$3\\le \\lfloor 12/3\\rfloor$$$ tokens, and the resulting grid is a draw.<\/p><\/div><\/div>"}, {"contestId": 1472, "index": "G", "name": "Moving to the Capital", "rating": 2100, "solvedCount": 5968, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. Moving to the Capital<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are $$$n$$$ cities in Berland. The city numbered $$$1$$$ is the capital. Some pairs of cities are connected by a <span class=\"tex-font-style-bf\">one-way<\/span> road of length 1.<\/p><p>Before the trip, Polycarp for each city found out the value of $$$d_i$$$\u00a0\u2014 the shortest distance from the capital (the $$$1$$$-st city) to the $$$i$$$-th city.<\/p><p>Polycarp begins his journey in the city with number $$$s$$$ and, being in the $$$i$$$-th city, chooses one of the following actions: <\/p><ol> <li> Travel from the $$$i$$$-th city to the $$$j$$$-th city if there is a road from the $$$i$$$-th city to the $$$j$$$-th and $$$d_i  \\lt  d_j$$$; <\/li><li> Travel from the $$$i$$$-th city to the $$$j$$$-th city if there is a road from the $$$i$$$-th city to the $$$j$$$-th and $$$d_i \\geq d_j$$$; <\/li><li> Stop traveling. <\/li><\/ol><p>Since the government of Berland does not want all people to come to the capital, so Polycarp <span class=\"tex-font-style-bf\">no more than once<\/span> can take the second action from the list. in other words, he can perform the second action $$$0$$$ or $$$1$$$ time during his journey. Polycarp, on the other hand, wants to be as close to the capital as possible.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/efeb2ded0d8f2e89bc8c6f9808ff144b517b573c.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>For example, if $$$n = 6$$$ and the cities are connected, as in the picture above, then Polycarp could have made the following travels (not all possible options): <\/p><ul> <li> $$$2 \\rightarrow 5 \\rightarrow 1 \\rightarrow 2 \\rightarrow 5$$$; <\/li><li> $$$3 \\rightarrow 6 \\rightarrow 2$$$; <\/li><li> $$$1 \\rightarrow 3 \\rightarrow 6 \\rightarrow 2 \\rightarrow 5$$$. <\/li><\/ul><p>Polycarp wants for each starting city $$$i$$$ to find out how close he can get to the capital. More formally: he wants to find the minimal value of $$$d_j$$$ that Polycarp can get from the city $$$i$$$ to the city $$$j$$$ according to the rules described above.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\leq t \\leq 10^4$$$)\u00a0\u2014 the number of test cases. Then $$$t$$$ test cases follow.<\/p><p>Each test case is preceded by an empty line.<\/p><p>The first line of each test case contains two integers $$$n$$$ ($$$2 \\leq n \\leq 2 \\cdot 10^5$$$) and $$$m$$$ ($$$1 \\leq m \\leq 2 \\cdot 10^5$$$)\u00a0\u2014 number of cities and roads, respectively.<\/p><p>This is followed by $$$m$$$ lines describing the roads. Each road is characterized by two integers $$$u$$$ and $$$v$$$ ($$$1 \\leq u, v \\leq n, u \\ne v$$$)\u00a0\u2014 the numbers of cities connected by a <span class=\"tex-font-style-bf\">one-way<\/span> road.<\/p><p>It is guaranteed that the sums of $$$n$$$ and $$$m$$$ over all test cases do not exceed $$$2 \\cdot 10^5$$$.<\/p><p>It is guaranteed that for each pair of different cities $$$(u, v)$$$ there is at most one road from $$$u$$$ to $$$v$$$ (but a pair of roads from $$$u$$$ to $$$v$$$ and from $$$v$$$ to $$$u$$$\u00a0\u2014 is valid).<\/p><p>It is guaranteed that there is a path from the capital to all cities.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, on a separate line output $$$n$$$ numbers, the $$$i$$$-th of which is equal to the minimum possible distance from the capital to the city where Polycarp ended his journey.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n\n6 7\n1 2\n1 3\n2 5\n2 4\n5 1\n3 6\n6 2\n\n2 2\n1 2\n2 1\n\n6 8\n1 2\n1 5\n2 6\n6 1\n2 3\n3 4\n4 2\n5 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0 0 1 2 0 1 \n0 0 \n0 0 2 1 1 0 \n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1372, "index": "D", "name": "Omkar and Circle", "rating": 2100, "solvedCount": 5949, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Omkar and Circle<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Danny, the local Math Maniac, is fascinated by circles, Omkar's most recent creation. Help him solve this circle problem!<\/p><p>You are given $$$n$$$ nonnegative integers $$$a_1, a_2, \\dots, a_n$$$ arranged in a circle, where $$$n$$$ must be odd (ie. $$$n-1$$$ is divisible by $$$2$$$). Formally, for all $$$i$$$ such that $$$2 \\leq i \\leq n$$$, the elements $$$a_{i - 1}$$$ and $$$a_i$$$ are considered to be adjacent, and $$$a_n$$$ and $$$a_1$$$ are also considered to be adjacent. In one operation, you pick a number on the circle, replace it with the sum of the two elements adjacent to it, and then delete the two adjacent elements from the circle. This is repeated until only one number remains in the circle, which we call the circular value.<\/p><p>Help Danny find the maximum possible circular value after some sequences of operations. <\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one odd integer $$$n$$$ ($$$1 \\leq n  \\lt  2 \\cdot 10^5$$$, $$$n$$$ is odd) \u00a0\u2014 the initial size of the circle.<\/p><p>The second line contains $$$n$$$ integers $$$a_{1},a_{2},\\dots,a_{n}$$$ ($$$0 \\leq a_{i} \\leq 10^9$$$) \u00a0\u2014 the initial numbers in the circle.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output the maximum possible circular value after applying some sequence of operations to the given circle.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n7 10 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n17\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1\n4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first test case, here's how a circular value of $$$17$$$ is obtained:<\/p><p>Pick the number at index $$$3$$$. The sum of adjacent elements equals $$$17$$$. Delete $$$7$$$ and $$$10$$$ from the circle and replace $$$2$$$ with $$$17$$$.<\/p><p>Note that the answer may not fit in a $$$32$$$-bit integer.<\/p><\/div><\/div>"}, {"contestId": 1493, "index": "D", "name": "GCD of an Array", "rating": 2100, "solvedCount": 5935, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. GCD of an Array<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ of length $$$n$$$. You are asked to process $$$q$$$ queries of the following format: given integers $$$i$$$ and $$$x$$$, multiply $$$a_i$$$ by $$$x$$$.<\/p><p>After processing each query you need to output the <a href=\"https://en.wikipedia.org/wiki/Greatest_common_divisor\">greatest common divisor (GCD)<\/a> of all elements of the array $$$a$$$.<\/p><p>Since the answer can be too large, you are asked to output it modulo $$$10^9+7$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers \u2014 $$$n$$$ and $$$q$$$ ($$$1 \\le n, q \\le 2 \\cdot 10^5$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le 2 \\cdot 10^5$$$) \u2014 the elements of the array $$$a$$$ before the changes.<\/p><p>The next $$$q$$$ lines contain queries in the following format: each line contains two integers $$$i$$$ and $$$x$$$ ($$$1 \\le i \\le n$$$, $$$1 \\le x \\le 2 \\cdot 10^5$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$q$$$ lines: after processing each query output the GCD of all elements modulo $$$10^9+7$$$ on a separate line.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 3\n1 6 8 12\n1 12\n2 3\n3 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n2\n6\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>After the first query the array is $$$[12, 6, 8, 12]$$$, $$$\\operatorname{gcd}(12, 6, 8, 12) = 2$$$.<\/p><p>After the second query \u2014 $$$[12, 18, 8, 12]$$$, $$$\\operatorname{gcd}(12, 18, 8, 12) = 2$$$.<\/p><p>After the third query \u2014 $$$[12, 18, 24, 12]$$$, $$$\\operatorname{gcd}(12, 18, 24, 12) = 6$$$.<\/p><p>Here the $$$\\operatorname{gcd}$$$ function denotes the greatest common divisor.<\/p><\/div><\/div>"}, {"contestId": 1343, "index": "E", "name": "Weights Distributing", "rating": 2100, "solvedCount": 5895, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Weights Distributing<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an undirected unweighted graph consisting of $$$n$$$ vertices and $$$m$$$ edges (which represents the map of Bertown) and the array of prices $$$p$$$ of length $$$m$$$. It is guaranteed that there is a path between each pair of vertices (districts).<\/p><p>Mike has planned a trip from the vertex (district) $$$a$$$ to the vertex (district) $$$b$$$ and then from the vertex (district) $$$b$$$ to the vertex (district) $$$c$$$. He can visit the same district twice or more. But there is one issue: authorities of the city want to set a price for using the road so if someone goes along the road then he should pay the price corresponding to this road (<span class=\"tex-font-style-bf\">he pays each time he goes along the road<\/span>). The list of prices that will be used $$$p$$$ is ready and they just want to distribute it between all roads in the town in such a way that each price from the array corresponds to exactly one road.<\/p><p>You are a good friend of Mike (and suddenly a mayor of Bertown) and want to help him to make his trip as cheap as possible. So, your task is to distribute prices between roads in such a way that if Mike chooses the optimal path then the price of the trip is the <span class=\"tex-font-style-bf\">minimum<\/span> possible. <span class=\"tex-font-style-bf\">Note that you cannot rearrange prices after the start of the trip<\/span>.<\/p><p>You have to answer $$$t$$$ independent test cases.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains one integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$) \u2014 the number of test cases. Then $$$t$$$ test cases follow.<\/p><p>The first line of the test case contains five integers $$$n, m, a, b$$$ and $$$c$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$, $$$n-1 \\le m \\le min(\\frac{n(n-1)}{2}, 2 \\cdot 10^5)$$$, $$$1 \\le a, b, c \\le n$$$) \u2014 the number of vertices, the number of edges and districts in Mike's trip.<\/p><p>The second line of the test case contains $$$m$$$ integers $$$p_1, p_2, \\dots, p_m$$$ ($$$1 \\le p_i \\le 10^9$$$), where $$$p_i$$$ is the $$$i$$$-th price from the array.<\/p><p>The following $$$m$$$ lines of the test case denote edges: edge $$$i$$$ is represented by a pair of integers $$$v_i$$$, $$$u_i$$$ ($$$1 \\le v_i, u_i \\le n$$$, $$$u_i \\ne v_i$$$), which are the indices of vertices connected by the edge. There are no loops or multiple edges in the given graph, i.\u2009e. for each pair ($$$v_i, u_i$$$) there are no other pairs ($$$v_i, u_i$$$) or ($$$u_i, v_i$$$) in the array of edges, and for each pair $$$(v_i, u_i)$$$ the condition $$$v_i \\ne u_i$$$ is satisfied. It is guaranteed that the given graph is connected.<\/p><p>It is guaranteed that the sum of $$$n$$$ (as well as the sum of $$$m$$$) does not exceed $$$2 \\cdot 10^5$$$ ($$$\\sum n \\le 2 \\cdot 10^5$$$, $$$\\sum m \\le 2 \\cdot 10^5$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print the answer \u2014 the <span class=\"tex-font-style-bf\">minimum<\/span> possible price of Mike's trip if you distribute prices between edges optimally.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n4 3 2 3 4\n1 2 3\n1 2\n1 3\n1 4\n7 9 1 5 7\n2 10 4 8 5 6 7 3 3\n1 2\n1 3\n1 4\n3 2\n3 5\n4 2\n5 6\n1 7\n6 7\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n7\n12\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>One of the possible solution to the first test case of the example:<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/1ae850055674486fef71bac1a75fd66dd9953464.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>One of the possible solution to the second test case of the example:<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/9de5fe487b4ad21b369e839bfb0c94e7206cc9f9.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><\/div><\/div>"}, {"contestId": 2115, "index": "B", "name": "Gellyfish and Camellia Japonica", "rating": 2100, "solvedCount": 5834, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Gellyfish and Camellia Japonica<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Gellyfish has an array of $$$n$$$ integers $$$c_1, c_2, \\ldots, c_n$$$. In the beginning, $$$c = [a_1, a_2, \\ldots, a_n]$$$.<\/p><p>Gellyfish will make $$$q$$$ modifications to $$$c$$$.<\/p><p>For $$$i = 1,2,\\ldots,q$$$, Gellyfish is given three integers $$$x_i$$$, $$$y_i$$$, and $$$z_i$$$ between $$$1$$$ and $$$n$$$. Then Gellyfish will set $$$c_{z_i} := \\min(c_{x_i}, c_{y_i})$$$.<\/p><p>After the $$$q$$$ modifications, $$$c = [b_1, b_2, \\ldots, b_n]$$$.<\/p><p>Now Flower knows the value of $$$b$$$ and the value of the integers $$$x_i$$$, $$$y_i$$$, and $$$z_i$$$ for all $$$1 \\leq i \\leq q$$$, but she doesn't know the value of $$$a$$$.<\/p><p>Flower wants to find any possible value of the array $$$a$$$ or report that no such $$$a$$$ exists.<\/p><p>If there are multiple possible values of the array $$$a$$$, you may output any of them.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$q$$$ ($$$1 \\leq n, q \\leq 3 \\cdot 10^5$$$)\u00a0\u2014 the size of the array and the number of modifications.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$b_1, b_2, \\ldots, b_n$$$ ($$$1 \\leq b_i \\leq 10^9$$$)\u00a0\u2014 the value of the array $$$c$$$ after the $$$q$$$ modifications.<\/p><p>The following $$$q$$$ lines each contain three integers $$$x_i$$$, $$$y_i$$$, and $$$z_i$$$ ($$$1 \\leq x_i, y_i, z_i \\leq n$$$)\u00a0\u2014 describing the $$$i$$$-th modification.<\/p><p>It is guaranteed that the sum of $$$n$$$ and the sum of $$$q$$$ over all test cases does not exceed $$$3 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, if $$$a$$$ exists, output $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$0 \\leq a_i \\leq 10^9$$$) in a single line. Otherwise, output \"-1\" in a single line.<\/p><p>If there are multiple solutions, print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 2 3 4 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 6 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 5 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 4 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 3 3<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n-1\n1 2 3 \n1 2 3 4 5 5 \n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, based on the given sequence of modifications, we know that $$$b_1 = a_1$$$ and $$$b_2 = \\min(a_1, a_2)$$$. Therefore, it is necessary that $$$b_2 \\leq b_1$$$. However, for the given $$$b$$$, we have $$$b_1 \\lt b_2$$$. Therefore, there is no solution.<\/p><p>In the second test case, we can see that the given $$$c$$$ becomes $$$b$$$ from $$$a$$$ after the given modifications, and $$$c$$$ is not changed at each modification.<\/p><\/div><\/div>"}, {"contestId": 1117, "index": "D", "name": "Magic Gems", "rating": 2100, "solvedCount": 5720, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Magic Gems<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Reziba has many magic gems. Each magic gem can be split into $$$M$$$ normal gems. The amount of space each magic (and normal) gem takes is $$$1$$$ unit. A normal gem cannot be split.<\/p><p>Reziba wants to choose a set of magic gems and split some of them, so the total space occupied by the resulting set of gems is $$$N$$$ units. If a magic gem is chosen and split, it takes $$$M$$$ units of space (since it is split into $$$M$$$ gems); if a magic gem is not split, it takes $$$1$$$ unit.<\/p><p>How many different configurations of the resulting set of gems can Reziba have, such that the total amount of space taken is $$$N$$$ units? Print the answer modulo $$$1000000007$$$ ($$$10^9+7$$$). Two configurations are considered different if the number of magic gems Reziba takes to form them differs, or the indices of gems Reziba has to split differ.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The input contains a single line consisting of $$$2$$$ integers $$$N$$$ and $$$M$$$ ($$$1 \\le N \\le 10^{18}$$$, $$$2 \\le M \\le 100$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer, the total number of configurations of the resulting set of gems, given that the total amount of space taken is $$$N$$$ units. Print the answer modulo $$$1000000007$$$ ($$$10^9+7$$$).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example each magic gem can split into $$$2$$$ normal gems, and we know that the total amount of gems are $$$4$$$.<\/p><p>Let $$$1$$$ denote a magic gem, and $$$0$$$ denote a normal gem.<\/p><p>The total configurations you can have is: <\/p><ul> <li> $$$1 1 1 1$$$ (None of the gems split); <\/li><li> $$$0 0 1 1$$$ (First magic gem splits into $$$2$$$ normal gems); <\/li><li> $$$1 0 0 1$$$ (Second magic gem splits into $$$2$$$ normal gems); <\/li><li> $$$1 1 0 0$$$ (Third magic gem splits into $$$2$$$ normal gems); <\/li><li> $$$0 0 0 0$$$ (First and second magic gems split into total $$$4$$$ normal gems). <\/li><\/ul><p>Hence, answer is $$$5$$$.<\/p><\/div><\/div>"}, {"contestId": 2124, "index": "E", "name": "Make it Zero", "rating": 2100, "solvedCount": 5699, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Make it Zero<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$, consisting of $$$n$$$ positive integers. You are allowed to do the following operation: <\/p><ul> <li> Select an array $$$b$$$ of size $$$n$$$ such that the following properties hold:<ul> <li> $$$0 \\leq b_i \\leq a_i$$$ for each $$$1 \\leq i \\leq n$$$ <\/li><li> There exists an index $$$1\\leq i  \\lt  n$$$ such that $$$b_1+b_2+\\ldots+b_i=b_{i+1}+b_{i+2}+\\ldots+b_n$$$. That is, the sum of the prefix of length $$$i$$$ is equal to the sum of the suffix of length $$$n-i$$$. <\/li><\/ul> <\/li><li> Then, subtract $$$b_i$$$ from $$$a_i$$$ for each $$$1 \\leq i \\leq n$$$. <\/li><\/ul><p>Your task is to change all the elements to $$$0$$$. Find the <span class=\"tex-font-style-bf\">minimum<\/span> number of operations required. <\/p><p>Then, output a way to perform the operations. If it is impossible to change all the elements of $$$a$$$ to $$$0$$$ no matter how many operations are used, print $$$-1$$$ instead. It can be shown that under the constraints of this problem, the smallest number of operations required is at most $$$17$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains an integer $$$n$$$ ($$$2 \\leq n \\leq 5\\cdot 10^4$$$)\u00a0\u2014 the length of the array $$$a$$$.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1,a_2,\\ldots,a_n$$$ ($$$1 \\leq a_i \\leq 10^{12}$$$)\u00a0\u2014 denoting the array $$$a$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$5\\cdot 10^4$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output $$$-1$$$ if there is no solution. <\/p><p>Otherwise, first output an integer $$$s$$$ ($$$1 \\leq s \\leq 17$$$)\u00a0\u2013 the minimum number of operations to change all the elements of $$$a$$$ to $$$0$$$.<\/p><p>Then, in the next $$$s$$$ lines, output $$$n$$$ integers in each line $$$b_1,b_2,\\ldots,b_n (0 \\leq b_i \\leq a_i)$$$\u00a0\u2014 denoting the array $$$b$$$ for each operation.<\/p><p>After performing the operations, all the elements of $$$a$$$ should be changed to $$$0$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 3 1 5<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n1 2 3\n-1\n2\n3 1 1 1\n2 2 0 4\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, we can simply choose $$$b=a$$$ in our operation. This is valid because $$$b_1+b_2=b_3$$$. <\/p><p>In the second test case, it can be proven that it is impossible to change all the elements of $$$a$$$ to $$$0$$$.<\/p><\/div><\/div>"}, {"contestId": 734, "index": "E", "name": "Anton and Tree", "rating": 2100, "solvedCount": 5609, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Anton and Tree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Anton is growing a tree in his garden. In case you forgot, the tree is a connected acyclic undirected graph.<\/p><p>There are <span class=\"tex-span\"><i>n<\/i><\/span> vertices in the tree, each of them is painted black or white. Anton doesn't like multicolored trees, so he wants to change the tree such that all vertices have the same color (black or white).<\/p><p>To change the colors Anton can use only operations of one type. We denote it as <span class=\"tex-span\"><i>paint<\/i>(<i>v<\/i>)<\/span>, where <span class=\"tex-span\"><i>v<\/i><\/span> is some vertex of the tree. This operation changes the color of all vertices <span class=\"tex-span\"><i>u<\/i><\/span> such that all vertices on the shortest path from <span class=\"tex-span\"><i>v<\/i><\/span> to <span class=\"tex-span\"><i>u<\/i><\/span> have the same color (including <span class=\"tex-span\"><i>v<\/i><\/span> and <span class=\"tex-span\"><i>u<\/i><\/span>). For example, consider the tree<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/a61536a42589f4c98c17f33145edb9e979d29fce.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>and apply operation <span class=\"tex-span\"><i>paint<\/i>(3)<\/span> to get the following:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/c63b72d85822234bdf1a1fd962be251afd42e3ba.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>Anton is interested in the minimum number of operation he needs to perform in order to make the colors of all vertices equal.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains a single integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009200\u2009000<\/span>)\u00a0\u2014 the number of vertices in the tree.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>color<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>color<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u20091<\/span>)\u00a0\u2014 colors of the vertices. <span class=\"tex-span\"><i>color<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009=\u20090<\/span> means that the <span class=\"tex-span\"><i>i<\/i><\/span>-th vertex is initially painted white, while <span class=\"tex-span\"><i>color<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009=\u20091<\/span> means it's initially painted black.<\/p><p>Then follow <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> line, each of them contains a pair of integers <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>,\u2009<i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2260\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>)\u00a0\u2014 indices of vertices connected by the corresponding edge. It's guaranteed that all pairs <span class=\"tex-span\">(<i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>)<\/span> are distinct, i.e. there are no multiple edges.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer\u00a0\u2014 the minimum number of operations Anton has to apply in order to make all vertices of the tree black or all vertices of the tree white.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>11<br/>0 0 0 1 1 0 1 0 0 1 1<br/>1 2<br/>1 3<br/>2 4<br/>2 5<br/>5 6<br/>5 7<br/>3 8<br/>3 9<br/>3 10<br/>9 11<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>0 0 0 0<br/>1 2<br/>2 3<br/>3 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample, the tree is the same as on the picture. If we first apply operation <span class=\"tex-span\"><i>paint<\/i>(3)<\/span> and then apply <span class=\"tex-span\"><i>paint<\/i>(6)<\/span>, the tree will become completely black, so the answer is <span class=\"tex-span\">2<\/span>.<\/p><p>In the second sample, the tree is already white, so there is no need to apply any operations and the answer is <span class=\"tex-span\">0<\/span>.<\/p><\/div><\/div>"}, {"contestId": 1538, "index": "G", "name": "Gift Set", "rating": 2100, "solvedCount": 5456, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. Gift Set<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Polycarp has $$$x$$$ of red and $$$y$$$ of blue candies. Using them, he wants to make gift sets. Each gift set contains either $$$a$$$ red candies and $$$b$$$ blue candies, or $$$a$$$ blue candies and $$$b$$$ red candies. Any candy can belong to at most one gift set.<\/p><p>Help Polycarp to find the largest number of gift sets he can create.<\/p><p>For example, if $$$x = 10$$$, $$$y = 12$$$, $$$a = 5$$$, and $$$b = 2$$$, then Polycarp can make three gift sets: <\/p><ul> <li> In the first set there will be $$$5$$$ red candies and $$$2$$$ blue candies; <\/li><li> In the second set there will be $$$5$$$ blue candies and $$$2$$$ red candies; <\/li><li> In the third set will be $$$5$$$ blue candies and $$$2$$$ red candies. <\/li><\/ul><p>Note that in this example there is one red candy that Polycarp does not use in any gift set.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$). Then $$$t$$$ test cases follow.<\/p><p>Each test case consists of a single string containing four integers $$$x$$$, $$$y$$$, $$$a$$$, and $$$b$$$ ($$$1 \\le x, y, a, b \\le 10^9$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output one number\u00a0\u2014 the maximum number of gift sets that Polycarp can make.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n9\n10 12 2 5\n1 1 2 2\n52 311 13 27\n1000000000 1000000000 1 1\n1000000000 1 1 1000000000\n1 1000000000 1000000000 1\n1 2 1 1\n7 8 1 2\n4 1 2 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n0\n4\n1000000000\n1\n1\n1\n5\n0\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1433, "index": "G", "name": "Reducing Delivery Cost", "rating": 2100, "solvedCount": 5433, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. Reducing Delivery Cost<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are a mayor of Berlyatov. There are $$$n$$$ districts and $$$m$$$ two-way roads between them. The $$$i$$$-th road connects districts $$$x_i$$$ and $$$y_i$$$. The cost of travelling along this road is $$$w_i$$$. There is some path between each pair of districts, so the city is connected.<\/p><p>There are $$$k$$$ delivery routes in Berlyatov. The $$$i$$$-th route is going from the district $$$a_i$$$ to the district $$$b_i$$$. There is one courier on each route and the courier will always choose the <span class=\"tex-font-style-bf\">cheapest<\/span> (minimum by total cost) path from the district $$$a_i$$$ to the district $$$b_i$$$ to deliver products.<\/p><p>The route can go from the district to itself, some couriers routes can coincide (<span class=\"tex-font-style-bf\">and you have to count them independently<\/span>).<\/p><p>You can make at most one road to have cost zero (i.e. you choose at most one road and change its cost with $$$0$$$).<\/p><p>Let $$$d(x, y)$$$ be the cheapest cost of travel between districts $$$x$$$ and $$$y$$$.<\/p><p>Your task is to find the minimum total courier routes cost you can achieve, if you optimally select the some road and change its cost with $$$0$$$. In other words, you have to find the minimum possible value of $$$\\sum\\limits_{i = 1}^{k} d(a_i, b_i)$$$ after applying the operation described above optimally.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains three integers $$$n$$$, $$$m$$$ and $$$k$$$ ($$$2 \\le n \\le 1000$$$; $$$n - 1 \\le m \\le min(1000, \\frac{n(n-1)}{2})$$$; $$$1 \\le k \\le 1000$$$) \u2014 the number of districts, the number of roads and the number of courier routes.<\/p><p>The next $$$m$$$ lines describe roads. The $$$i$$$-th road is given as three integers $$$x_i$$$, $$$y_i$$$ and $$$w_i$$$ ($$$1 \\le x_i, y_i \\le n$$$; $$$x_i \\ne y_i$$$; $$$1 \\le w_i \\le 1000$$$), where $$$x_i$$$ and $$$y_i$$$ are districts the $$$i$$$-th road connects and $$$w_i$$$ is its cost. It is guaranteed that there is some path between each pair of districts, so the city is connected. It is also guaranteed that there is at most one road between each pair of districts.<\/p><p>The next $$$k$$$ lines describe courier routes. The $$$i$$$-th route is given as two integers $$$a_i$$$ and $$$b_i$$$ ($$$1 \\le a_i, b_i \\le n$$$) \u2014 the districts of the $$$i$$$-th route. The route can go from the district to itself, some couriers routes can coincide (<span class=\"tex-font-style-bf\">and you have to count them independently<\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the <span class=\"tex-font-style-bf\">minimum<\/span> total courier routes cost you can achieve (i.e. the minimum value $$$\\sum\\limits_{i=1}^{k} d(a_i, b_i)$$$, where $$$d(x, y)$$$ is the cheapest cost of travel between districts $$$x$$$ and $$$y$$$) if you can make some (<span class=\"tex-font-style-bf\">at most one<\/span>) road cost zero.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 5 2\n1 2 5\n2 3 7\n2 4 4\n4 5 2\n4 6 8\n1 6\n5 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n22\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 5 4\n1 2 5\n2 3 4\n1 4 3\n4 3 7\n3 5 2\n1 5\n1 3\n3 3\n1 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n13\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The picture corresponding to the first example:<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/dd6264604ca62d1661d8f99d2f2b1fb9a8cdb6c9.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>There, you can choose either the road $$$(2, 4)$$$ or the road $$$(4, 6)$$$. Both options lead to the total cost $$$22$$$.<\/p><p>The picture corresponding to the second example:<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/0f66480d7e9a87a3883290f099a20828ce429c70.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>There, you can choose the road $$$(3, 4)$$$. This leads to the total cost $$$13$$$.<\/p><\/div><\/div>"}, {"contestId": 1516, "index": "D", "name": "Cut", "rating": 2100, "solvedCount": 5393, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Cut<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>This time Baby Ehab will only cut and not stick. He starts with a piece of paper with an array $$$a$$$ of length $$$n$$$ written on it, and then he does the following:<\/p><ul> <li> he picks a range $$$(l, r)$$$ and cuts the subsegment $$$a_l, a_{l + 1}, \\ldots, a_r$$$ out, removing the rest of the array. <\/li><li> he then cuts this range into multiple subranges. <\/li><li> to add a number theory spice to it, he requires that the elements of every subrange must have their product equal to their <a href=\"https://en.wikipedia.org/wiki/Least_common_multiple\">least common multiple (LCM)<\/a>. <\/li><\/ul><p>Formally, he partitions the elements of $$$a_l, a_{l + 1}, \\ldots, a_r$$$ into contiguous subarrays such that the product of every subarray is equal to its LCM. Now, for $$$q$$$ independent ranges $$$(l, r)$$$, tell Baby Ehab the minimum number of subarrays he needs.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains $$$2$$$ integers $$$n$$$ and $$$q$$$ ($$$1 \\le n,q \\le 10^5$$$)\u00a0\u2014 the length of the array $$$a$$$ and the number of queries.<\/p><p>The next line contains $$$n$$$ integers $$$a_1$$$, $$$a_2$$$, $$$\\ldots$$$, $$$a_n$$$ ($$$1 \\le a_i \\le 10^5$$$)\u00a0\u2014 the elements of the array $$$a$$$.<\/p><p>Each of the next $$$q$$$ lines contains $$$2$$$ integers $$$l$$$ and $$$r$$$ ($$$1 \\le l \\le r \\le n$$$)\u00a0\u2014 the endpoints of this query's interval.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query, print its answer on a new line.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 3\n2 3 10 7 5 14\n1 6\n2 4\n3 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n1\n2\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The first query asks about the whole array. You can partition it into $$$[2]$$$, $$$[3,10,7]$$$, and $$$[5,14]$$$. The first subrange has product and LCM equal to $$$2$$$. The second has product and LCM equal to $$$210$$$. And the third has product and LCM equal to $$$70$$$. Another possible partitioning is $$$[2,3]$$$, $$$[10,7]$$$, and $$$[5,14]$$$.<\/p><p>The second query asks about the range $$$(2,4)$$$. Its product is equal to its LCM, so you don't need to partition it further.<\/p><p>The last query asks about the range $$$(3,5)$$$. You can partition it into $$$[10,7]$$$ and $$$[5]$$$.<\/p><\/div><\/div>"}, {"contestId": 877, "index": "D", "name": "Olya and Energy Drinks", "rating": 2100, "solvedCount": 5320, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Olya and Energy Drinks<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Olya loves energy drinks. She loves them so much that her room is full of empty cans from energy drinks.<\/p><p>Formally, her room can be represented as a field of <span class=\"tex-span\"><i>n<\/i>\u2009\u00d7\u2009<i>m<\/i><\/span> cells, each cell of which is empty or littered with cans.<\/p><p>Olya drank a lot of energy drink, so now she can run <span class=\"tex-span\"><i>k<\/i><\/span> meters per second. Each second she chooses one of the four directions (up, down, left or right) and runs from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>k<\/i><\/span> meters in this direction. Of course, she can only run through empty cells.<\/p><p>Now Olya needs to get from cell <span class=\"tex-span\">(<i>x<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\">1<\/sub>)<\/span> to cell <span class=\"tex-span\">(<i>x<\/i><sub class=\"lower-index\">2<\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\">2<\/sub>)<\/span>. How many seconds will it take her if she moves optimally?<\/p><p>It's guaranteed that cells <span class=\"tex-span\">(<i>x<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\">1<\/sub>)<\/span> and <span class=\"tex-span\">(<i>x<\/i><sub class=\"lower-index\">2<\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\">2<\/sub>)<\/span> are empty. These cells can coincide.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains three integers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>m<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>m<\/i>,\u2009<i>k<\/i>\u2009\u2264\u20091000<\/span>) \u2014 the sizes of the room and Olya's speed.<\/p><p>Then <span class=\"tex-span\"><i>n<\/i><\/span> lines follow containing <span class=\"tex-span\"><i>m<\/i><\/span> characters each, the <span class=\"tex-span\"><i>i<\/i><\/span>-th of them contains on <span class=\"tex-span\"><i>j<\/i><\/span>-th position \"<span class=\"tex-font-style-tt\">#<\/span>\", if the cell <span class=\"tex-span\">(<i>i<\/i>,\u2009<i>j<\/i>)<\/span> is littered with cans, and \"<span class=\"tex-font-style-tt\">.<\/span>\" otherwise.<\/p><p>The last line contains four integers <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>x<\/i><sub class=\"lower-index\">2<\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\">2<\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>x<\/i><sub class=\"lower-index\">2<\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>y<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\">2<\/sub>\u2009\u2264\u2009<i>m<\/i><\/span>) \u2014 the coordinates of the first and the last cells.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u2014 the minimum time it will take Olya to get from <span class=\"tex-span\">(<i>x<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\">1<\/sub>)<\/span> to <span class=\"tex-span\">(<i>x<\/i><sub class=\"lower-index\">2<\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\">2<\/sub>)<\/span>.<\/p><p>If it's impossible to get from <span class=\"tex-span\">(<i>x<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\">1<\/sub>)<\/span> to <span class=\"tex-span\">(<i>x<\/i><sub class=\"lower-index\">2<\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\">2<\/sub>)<\/span>, print <span class=\"tex-font-style-tt\">-1<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 4 4<br/>....<br/>###.<br/>....<br/>1 1 3 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 4 1<br/>....<br/>###.<br/>....<br/>1 1 3 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>8<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 2 1<br/>.#<br/>#.<br/>1 1 2 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>-1<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample Olya should run <span class=\"tex-span\">3<\/span> meters to the right in the first second, <span class=\"tex-span\">2<\/span> meters down in the second second and <span class=\"tex-span\">3<\/span> meters to the left in the third second.<\/p><p>In second sample Olya should run to the right for <span class=\"tex-span\">3<\/span> seconds, then down for <span class=\"tex-span\">2<\/span> seconds and then to the left for <span class=\"tex-span\">3<\/span> seconds.<\/p><p><span class=\"tex-font-style-it\">Olya does not recommend drinking energy drinks and generally believes that this is bad<\/span>.<\/p><\/div><\/div>"}, {"contestId": 1420, "index": "C2", "name": "Pok\u00e9mon Army (hard version)", "rating": 2100, "solvedCount": 5308, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C2. Pok\u00e9mon Army (hard version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is the hard version of the problem. The difference between the versions is that the easy version has no swap operations. You can make hacks only if all versions of the problem are solved.<\/span><\/p><p>Pikachu is a cute and friendly pok\u00e9mon living in the wild pikachu herd.<\/p><p>But it has become known recently that infamous team R wanted to steal all these pok\u00e9mon! Pok\u00e9mon trainer Andrew decided to help Pikachu to build a pok\u00e9mon army to resist.<\/p><p>First, Andrew counted all the pok\u00e9mon\u00a0\u2014 there were exactly $$$n$$$ pikachu. The strength of the $$$i$$$-th pok\u00e9mon is equal to $$$a_i$$$, and all these numbers are distinct.<\/p><p>As an army, Andrew can choose any non-empty subsequence of pokemons. In other words, Andrew chooses some array $$$b$$$ from $$$k$$$ indices such that $$$1 \\le b_1  \\lt  b_2  \\lt  \\dots  \\lt  b_k \\le n$$$, and his army will consist of pok\u00e9mons with forces $$$a_{b_1}, a_{b_2}, \\dots, a_{b_k}$$$.<\/p><p>The strength of the army is equal to the alternating sum of elements of the subsequence; that is, $$$a_{b_1} - a_{b_2} + a_{b_3} - a_{b_4} + \\dots$$$.<\/p><p>Andrew is experimenting with pok\u00e9mon order. He performs $$$q$$$ operations. In $$$i$$$-th operation Andrew swaps $$$l_i$$$-th and $$$r_i$$$-th pok\u00e9mon.<\/p><p>Andrew wants to know the maximal stregth of the army he can achieve with the initial pok\u00e9mon placement. He also needs to know the maximal strength after each operation.<\/p><p>Help Andrew and the pok\u00e9mon, or team R will realize their tricky plan!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases.<\/p><p>The first line contains one positive integer $$$t$$$ ($$$1 \\le t \\le 10^3$$$) denoting the number of test cases. Description of the test cases follows.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$q$$$ ($$$1 \\le n \\le 3 \\cdot 10^5, 0 \\le q \\le 3 \\cdot 10^5$$$) denoting the number of pok\u00e9mon and number of operations respectively.<\/p><p>The second line contains $$$n$$$ distinct positive integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le n$$$) denoting the strengths of the pok\u00e9mon.<\/p><p>$$$i$$$-th of the last $$$q$$$ lines contains two positive integers $$$l_i$$$ and $$$r_i$$$ ($$$1 \\le l_i \\le r_i \\le n$$$) denoting the indices of pok\u00e9mon that were swapped in the $$$i$$$-th operation.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$3 \\cdot 10^5$$$, and the sum of $$$q$$$ over all test cases does not exceed $$$3 \\cdot 10^5$$$. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print $$$q+1$$$ integers: the maximal strength of army before the swaps and after each swap.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n3 1\n1 3 2\n1 2\n2 2\n1 2\n1 2\n1 2\n7 5\n1 2 5 4 3 6 7\n1 2\n6 7\n3 4\n1 2\n2 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n4\n2\n2\n2\n9\n10\n10\n10\n9\n11\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Let's look at the third test case:<\/p><p>Initially we can build an army in such way: [1 2 <span class=\"tex-font-style-bf\">5<\/span> 4 <span class=\"tex-font-style-bf\">3<\/span> 6 <span class=\"tex-font-style-bf\">7<\/span>], its strength will be $$$5-3+7=9$$$.<\/p><p>After first operation we can build an army in such way: [<span class=\"tex-font-style-bf\">2<\/span> <span class=\"tex-font-style-bf\">1<\/span> <span class=\"tex-font-style-bf\">5<\/span> 4 <span class=\"tex-font-style-bf\">3<\/span> 6 <span class=\"tex-font-style-bf\">7<\/span>], its strength will be $$$2-1+5-3+7=10$$$.<\/p><p>After second operation we can build an army in such way: [<span class=\"tex-font-style-bf\">2<\/span> <span class=\"tex-font-style-bf\">1<\/span> <span class=\"tex-font-style-bf\">5<\/span> 4 <span class=\"tex-font-style-bf\">3<\/span> <span class=\"tex-font-style-bf\">7<\/span> 6], its strength will be $$$2-1+5-3+7=10$$$.<\/p><p>After third operation we can build an army in such way: [<span class=\"tex-font-style-bf\">2<\/span> <span class=\"tex-font-style-bf\">1<\/span> 4 <span class=\"tex-font-style-bf\">5<\/span> <span class=\"tex-font-style-bf\">3<\/span> <span class=\"tex-font-style-bf\">7<\/span> 6], its strength will be $$$2-1+5-3+7=10$$$.<\/p><p>After forth operation we can build an army in such way: [1 2 4 <span class=\"tex-font-style-bf\">5<\/span> <span class=\"tex-font-style-bf\">3<\/span> <span class=\"tex-font-style-bf\">7<\/span> 6], its strength will be $$$5-3+7=9$$$.<\/p><p>After all operations we can build an army in such way: [1 <span class=\"tex-font-style-bf\">4<\/span> <span class=\"tex-font-style-bf\">2<\/span> <span class=\"tex-font-style-bf\">5<\/span> <span class=\"tex-font-style-bf\">3<\/span> <span class=\"tex-font-style-bf\">7<\/span> 6], its strength will be $$$4-2+5-3+7=11$$$.<\/p><\/div><\/div>"}, {"contestId": 1370, "index": "E", "name": "Binary Subsequence Rotation", "rating": 2100, "solvedCount": 5307, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Binary Subsequence Rotation<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Naman has two binary strings $$$s$$$ and $$$t$$$ of length $$$n$$$ (a binary string is a string which only consists of the characters \"<span class=\"tex-font-style-tt\">0<\/span>\" and \"<span class=\"tex-font-style-tt\">1<\/span>\"). He wants to convert $$$s$$$ into $$$t$$$ using the following operation as few times as possible.<\/p><p>In one operation, he can choose any subsequence of $$$s$$$ and rotate it clockwise

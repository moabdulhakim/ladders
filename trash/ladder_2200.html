To answer a query:<\/p><p>Assume there are <span class=\"tex-span\"><i>x<\/i><\/span> people living in the cities lying on the path from city <span class=\"tex-span\"><i>v<\/i><\/span> to city <span class=\"tex-span\"><i>u<\/i><\/span>. Assume these people's IDs are <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>p<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>p<\/i><sub class=\"lower-index\"><i>x<\/i><\/sub><\/span> in increasing order. <\/p><p>If <span class=\"tex-span\"><i>k<\/i>\u2009=\u2009<i>min<\/i>(<i>x<\/i>,\u2009<i>a<\/i>)<\/span>, then Duff should tell Malek numbers <span class=\"tex-span\"><i>k<\/i>,\u2009<i>p<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>p<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>p<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span> in this order. In the other words, Malek wants to know <span class=\"tex-span\"><i>a<\/i><\/span> minimums on that path (or less, if there are less than <span class=\"tex-span\"><i>a<\/i><\/span> people).<\/p><p>Duff is very busy at the moment, so she asked you to help her and answer the queries.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains three integers, <span class=\"tex-span\"><i>n<\/i>,\u2009<i>m<\/i><\/span> and <span class=\"tex-span\"><i>q<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>m<\/i>,\u2009<i>q<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>).<\/p><p>The next <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> lines contain the roads. Each line contains two integers <span class=\"tex-span\"><i>v<\/i><\/span> and <span class=\"tex-span\"><i>u<\/i><\/span>, endpoints of a road (<span class=\"tex-span\">1\u2009\u2264\u2009<i>v<\/i>,\u2009<i>u<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\"><i>v<\/i>\u2009\u2260\u2009<i>u<\/i><\/span>).<\/p><p>Next line contains <span class=\"tex-span\"><i>m<\/i><\/span> integers <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>c<\/i><sub class=\"lower-index\"><i>m<\/i><\/sub><\/span> separated by spaces (<span class=\"tex-span\">1\u2009\u2264\u2009<i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span> for each <span class=\"tex-span\">1\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>m<\/i><\/span>).<\/p><p>Next <span class=\"tex-span\"><i>q<\/i><\/span> lines contain the queries. Each of them contains three integers, <span class=\"tex-span\"><i>v<\/i>,\u2009<i>u<\/i><\/span> and <span class=\"tex-span\"><i>a<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>v<\/i>,\u2009<i>u<\/i>\u2009\u2264\u2009<i>n<\/i><\/span> and <span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i>\u2009\u2264\u200910<\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query, print numbers <span class=\"tex-span\"><i>k<\/i>,\u2009<i>p<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>p<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>p<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span> separated by spaces in one line.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 4 5<br/>1 3<br/>1 2<br/>1 4<br/>4 5<br/>2 1 4 3<br/>4 5 6<br/>1 5 2<br/>5 5 10<br/>2 3 3<br/>5 3 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1 3<br/>2 2 3<br/>0<br/>3 1 2 4<br/>1 2<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Graph of Andarz Gu in the sample case is as follows (ID of people in each city are written next to them):<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/30f8362085d89ffe78ae1bf52f4a598c6726cb58.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 1967, "index": "B2", "name": "Reverse Card (Hard Version)", "rating": 2200, "solvedCount": 5004, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B2. Reverse Card (Hard Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">The two versions are different problems. You may want to read both versions. You can make hacks only if both versions are solved.<\/span><\/p><p>You are given two positive integers $$$n$$$, $$$m$$$.<\/p><p>Calculate the number of ordered pairs $$$(a, b)$$$ satisfying the following conditions:<\/p><ul> <li> $$$1\\le a\\le n$$$, $$$1\\le b\\le m$$$; <\/li><li> $$$b \\cdot \\gcd(a,b)$$$ is a multiple of $$$a+b$$$. <\/li><\/ul><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1\\le t\\le 10^4$$$). The description of the test cases follows.<\/p><p>The first line of each test case contains two integers $$$n$$$, $$$m$$$ ($$$1\\le n,m\\le 2 \\cdot 10^6$$$).<\/p><p>It is guaranteed that neither the sum of $$$n$$$ nor the sum of $$$m$$$ over all test cases exceeds $$$2 \\cdot 10^6$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print a single integer: the number of valid pairs.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">10 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">100 1233<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">1000000 1145141<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n<div class=\"test-example-line test-example-line-odd test-example-line-1\">0<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">423<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">5933961<\/div><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, no pair satisfies the conditions.<\/p><p>In the fourth test case, $$$(2,2),(3,6),(4,4),(6,3),(6,6),(8,8)$$$ satisfy the conditions.<\/p><\/div><\/div>"}, {"contestId": 1156, "index": "D", "name": "0-1-Tree", "rating": 2200, "solvedCount": 4955, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. 0-1-Tree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a tree (an undirected connected acyclic graph) consisting of $$$n$$$ vertices and $$$n - 1$$$ edges. A number is written on each edge, each number is either $$$0$$$ (let's call such edges $$$0$$$-edges) or $$$1$$$ (those are $$$1$$$-edges).<\/p><p>Let's call an ordered pair of vertices $$$(x, y)$$$ ($$$x \\ne y$$$) <span class=\"tex-font-style-bf\">valid<\/span> if, while traversing the simple path from $$$x$$$ to $$$y$$$, we never go through a $$$0$$$-edge after going through a $$$1$$$-edge. Your task is to calculate the number of <span class=\"tex-font-style-bf\">valid<\/span> pairs in the tree.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$2 \\le n \\le 200000$$$) \u2014 the number of vertices in the tree.<\/p><p>Then $$$n - 1$$$ lines follow, each denoting an edge of the tree. Each edge is represented by three integers $$$x_i$$$, $$$y_i$$$ and $$$c_i$$$ ($$$1 \\le x_i, y_i \\le n$$$, $$$0 \\le c_i \\le 1$$$, $$$x_i \\ne y_i$$$) \u2014 the vertices connected by this edge and the number written on it, respectively.<\/p><p>It is guaranteed that the given edges form a tree.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the number of <span class=\"tex-font-style-bf\">valid<\/span> pairs of vertices.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7\n2 1 1\n3 2 0\n4 2 1\n5 2 0\n6 7 1\n7 2 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n34\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The picture corresponding to the first example:<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/29a700493765622c28f8a5b127cff8cbd9a08e3d.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><\/div><\/div>"}, {"contestId": 2101, "index": "C", "name": "23 Kingdom", "rating": 2200, "solvedCount": 4930, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. 23 Kingdom<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p> <\/p><p>The <span class=\"tex-font-style-it\">distance<\/span> of a value $$$x$$$ in an array $$$c$$$, denoted as $$$d_x(c)$$$, is defined as the largest gap between any two occurrences of $$$x$$$ in $$$c$$$. <\/p><p>Formally, $$$d_x(c) = \\max(j - i)$$$ over all pairs $$$i  \\lt  j$$$ where $$$c_i = c_j = x$$$. If $$$x$$$ appears only once or not at all in $$$c$$$, then $$$d_x(c) = 0$$$. <\/p><p>The <span class=\"tex-font-style-it\">beauty<\/span> of an array is the sum of the distances of each distinct value in the array. Formally, the beauty of an array $$$c$$$ is equal to $$$\\sum\\limits_{1\\le x\\le n} d_x(c)$$$.<\/p><p>Given an array $$$a$$$ of length $$$n$$$, an array $$$b$$$ is <span class=\"tex-font-style-it\">nice<\/span> if it also has length $$$n$$$ and its elements satisfy $$$1\\le b_i\\le a_i$$$ for all $$$1\\le i\\le n$$$. Your task is to find the maximum possible beauty of any nice array.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1\\le n\\le 2\\cdot10^5$$$)\u00a0\u2014 the length of array $$$a$$$.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1,a_2,\\ldots,a_n$$$ ($$$1\\le a_i\\le n$$$)\u00a0\u2014 the elements of array $$$a$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2\\cdot10^5$$$. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer representing the maximum possible beauty among all nice arrays.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 1 5 1 2 2 1 1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">8<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 5 2 8 4 1 4 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n1\n16\n16\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, if $$$b = [1, 2, 1, 2]$$$, then $$$d_1(b) = 3 - 1 = 2$$$ and $$$d_2(b) = 4 - 2 = 2$$$, resulting in a beauty of $$$2 + 2 = 4$$$. It can be proven that there are no nice arrays with a beauty greater than $$$4$$$.<\/p><p>In the second test case, both $$$b = [1, 1]$$$ and $$$b = [2, 2]$$$ are valid solutions with a beauty of $$$1$$$.<\/p><p>In the third test case, if $$$b = [1, 2, 1, 4, 1, 2, 1, 1, 1, 2]$$$ with $$$d_1(b) = 9 - 1 = 8$$$, $$$d_2(b) = 10 - 2 = 8$$$, and $$$d_4(b) = 0$$$, resulting in a beauty of $$$16$$$.<\/p><\/div><\/div>"}, {"contestId": 1175, "index": "E", "name": "Minimal Segment Cover", "rating": 2200, "solvedCount": 4833, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Minimal Segment Cover<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given $$$n$$$ intervals in form $$$[l; r]$$$ on a number line.<\/p><p>You are also given $$$m$$$ queries in form $$$[x; y]$$$. What is the minimal number of intervals you have to take so that every point (<span class=\"tex-font-style-bf\">not necessarily integer<\/span>) from $$$x$$$ to $$$y$$$ is covered by at least one of them? <\/p><p>If you can't choose intervals so that every point from $$$x$$$ to $$$y$$$ is covered, then print <span class=\"tex-font-style-tt\">-1<\/span> for that query.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\le n, m \\le 2 \\cdot 10^5$$$) \u2014 the number of intervals and the number of queries, respectively.<\/p><p>Each of the next $$$n$$$ lines contains two integer numbers $$$l_i$$$ and $$$r_i$$$ ($$$0 \\le l_i  \\lt  r_i \\le 5 \\cdot 10^5$$$) \u2014 the given intervals.<\/p><p>Each of the next $$$m$$$ lines contains two integer numbers $$$x_i$$$ and $$$y_i$$$ ($$$0 \\le x_i  \\lt  y_i \\le 5 \\cdot 10^5$$$) \u2014 the queries.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$m$$$ integer numbers. The $$$i$$$-th number should be the answer to the $$$i$$$-th query: either the minimal number of intervals you have to take so that every point (<span class=\"tex-font-style-bf\">not necessarily integer<\/span>) from $$$x_i$$$ to $$$y_i$$$ is covered by at least one of them or <span class=\"tex-font-style-tt\">-1<\/span> if you can't choose intervals so that every point from $$$x_i$$$ to $$$y_i$$$ is covered.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2 3\n1 3\n2 4\n1 3\n1 4\n3 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n2\n1\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 4\n1 3\n1 3\n4 5\n1 2\n1 3\n1 4\n1 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n1\n-1\n-1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example there are three queries:<\/p><ol> <li> query $$$[1; 3]$$$ can be covered by interval $$$[1; 3]$$$; <\/li><li> query $$$[1; 4]$$$ can be covered by intervals $$$[1; 3]$$$ and $$$[2; 4]$$$. There is no way to cover $$$[1; 4]$$$ by a single interval; <\/li><li> query $$$[3; 4]$$$ can be covered by interval $$$[2; 4]$$$. It doesn't matter that the other points are covered besides the given query. <\/li><\/ol><p>In the second example there are four queries:<\/p><ol> <li> query $$$[1; 2]$$$ can be covered by interval $$$[1; 3]$$$. Note that you can choose any of the two given intervals $$$[1; 3]$$$; <\/li><li> query $$$[1; 3]$$$ can be covered by interval $$$[1; 3]$$$; <\/li><li> query $$$[1; 4]$$$ can't be covered by any set of intervals; <\/li><li> query $$$[1; 5]$$$ can't be covered by any set of intervals. Note that intervals $$$[1; 3]$$$ and $$$[4; 5]$$$ together don't cover $$$[1; 5]$$$ because even non-integer points should be covered. Here $$$3.5$$$, for example, isn't covered. <\/li><\/ol><\/div><\/div>"}, {"contestId": 7, "index": "D", "name": "Palindrome Degree", "rating": 2200, "solvedCount": 4814, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Palindrome Degree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>String <span class=\"tex-span\"><i>s<\/i><\/span> of length <span class=\"tex-span\"><i>n<\/i><\/span> is called <span class=\"tex-span\"><i>k<\/i><\/span>-palindrome, if it is a palindrome itself, and its prefix and suffix of length <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/baaa1cf00a178570d9b63b0518b73899b9a96307.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> are <span class=\"tex-span\">(<i>k<\/i>\u2009-\u20091)<\/span>-palindromes. By definition, any string (even empty) is 0-palindrome.<\/p><p>Let's call the palindrome degree of string <span class=\"tex-span\"><i>s<\/i><\/span> such a maximum number <span class=\"tex-span\"><i>k<\/i><\/span>, for which <span class=\"tex-span\"><i>s<\/i><\/span> is <span class=\"tex-span\"><i>k<\/i><\/span>-palindrome. For example, \"<span class=\"tex-font-style-tt\">abaaba<\/span>\" has degree equals to <span class=\"tex-span\">3<\/span>.<\/p><p>You are given a string. Your task is to find the sum of the palindrome degrees of all its prefixes.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input data contains a non-empty string, consisting of Latin letters and digits. The length of the string does not exceed <span class=\"tex-span\">5\u00b710<sup class=\"upper-index\">6<\/sup><\/span>. The string is case-sensitive.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output the only number \u2014 the sum of the polindrome degrees of all the string's prefixes.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>a2A<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>abacaba<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 282, "index": "E", "name": "Sausage Maximization", "rating": 2200, "solvedCount": 4762, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Sausage Maximization<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>The Bitlandians are quite weird people. They have their own problems and their own solutions. They have their own thoughts and their own beliefs, they have their own values and their own merits. They have their own dishes and their own sausages!<\/p><p>In Bitland a sausage is an array of integers! A sausage's deliciousness is equal to the bitwise excluding OR (the <span class=\"tex-span\"><i>xor<\/i><\/span> operation) of all integers in that sausage. <\/p><p>One day, when Mr. Bitkoch (the local cook) was going to close his BitRestaurant, BitHaval and BitAryo, the most famous citizens of Bitland, entered the restaurant and each ordered a sausage.<\/p><p>But Mr. Bitkoch had only one sausage left. So he decided to cut a prefix (several, may be zero, first array elements) of the sausage and give it to BitHaval and a postfix (several, may be zero, last array elements) of the sausage and give it to BitAryo. Note that one or both pieces of the sausage can be empty. Of course, the cut pieces mustn't intersect (no array element can occur in both pieces).<\/p><p>The pleasure of BitHaval and BitAryo is equal to the bitwise XOR of their sausages' deliciousness. An empty sausage's deliciousness equals zero.<\/p><p>Find a way to cut a piece of sausage for BitHaval and BitAryo that maximizes the pleasure of these worthy citizens.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>).<\/p><p>The next line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> <span class=\"tex-span\">(0\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">12<\/sup>)<\/span> \u2014 Mr. Bitkoch's sausage.<\/p><p>Please, do not use the <span class=\"tex-font-style-tt\">%lld<\/span> specifier to read or write 64-bit integers in \u0421++. It is preferred to use the <span class=\"tex-font-style-tt\">cin<\/span>, <span class=\"tex-font-style-tt\">cout<\/span> streams or the <span class=\"tex-font-style-tt\">%I64d<\/span> specifier.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u2014 the maximum pleasure BitHaval and BitAryo can get from the dinner.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/>1 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>1 2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/>1000 1000<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1000<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1515, "index": "E", "name": "Phoenix and Computers", "rating": 2200, "solvedCount": 4736, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Phoenix and Computers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are $$$n$$$ computers in a row, all originally off, and Phoenix wants to turn all of them on. He will manually turn on computers one at a time. At any point, if computer $$$i-1$$$ and computer $$$i+1$$$ are both on, computer $$$i$$$ $$$(2 \\le i \\le n-1)$$$ will turn on automatically if it is not already on. Note that Phoenix cannot manually turn on a computer that already turned on automatically.<\/p><p>If we only consider the sequence of computers that Phoenix turns on manually, how many ways can he turn on all the computers? Two sequences are distinct if either the set of computers turned on manually is distinct, or the order of computers turned on manually is distinct. Since this number may be large, please print it modulo $$$M$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$M$$$ ($$$3 \\le n \\le 400$$$; $$$10^8 \\le M \\le 10^9$$$)\u00a0\u2014 the number of computers and the modulo. It is guaranteed that $$$M$$$ is prime.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer\u00a0\u2014 the number of ways to turn on the computers modulo $$$M$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 100000007\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 100000007\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n20\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n400 234567899\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n20914007\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, these are the $$$6$$$ orders in which Phoenix can turn on all computers: <\/p><ul> <li> $$$[1,3]$$$. Turn on computer $$$1$$$, then $$$3$$$. Note that computer $$$2$$$ turns on automatically after computer $$$3$$$ is turned on manually, but we only consider the sequence of computers that are turned on manually. <\/li><li> $$$[3,1]$$$. Turn on computer $$$3$$$, then $$$1$$$. <\/li><li> $$$[1,2,3]$$$. Turn on computer $$$1$$$, $$$2$$$, then $$$3$$$. <\/li><li> $$$[2,1,3]$$$ <\/li><li> $$$[2,3,1]$$$ <\/li><li> $$$[3,2,1]$$$ <\/li><\/ul><\/div><\/div>"}, {"contestId": 1438, "index": "D", "name": "Powerful Ksenia", "rating": 2200, "solvedCount": 4672, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Powerful Ksenia<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Ksenia has an array $$$a$$$ consisting of $$$n$$$ positive integers $$$a_1, a_2, \\ldots, a_n$$$. <\/p><p>In one operation she can do the following: <\/p><ul> <li> choose three distinct indices $$$i$$$, $$$j$$$, $$$k$$$, and then <\/li><li> change all of $$$a_i, a_j, a_k$$$ to $$$a_i \\oplus a_j \\oplus a_k$$$ simultaneously, where $$$\\oplus$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#XOR\">bitwise XOR operation<\/a>. <\/li><\/ul><p>She wants to make all $$$a_i$$$ equal <span class=\"tex-font-style-bf\">in at most $$$n$$$ operations<\/span>, or to determine that it is impossible to do so. She wouldn't ask for your help, but please, help her!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$3 \\leq n \\leq 10^5$$$)\u00a0\u2014 the length of $$$a$$$.<\/p><p>The second line contains $$$n$$$ integers, $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\leq a_i \\leq 10^9$$$)\u00a0\u2014 elements of $$$a$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-font-style-tt\">YES<\/span> or <span class=\"tex-font-style-tt\">NO<\/span> in the first line depending on whether it is possible to make all elements equal in at most $$$n$$$ operations.<\/p><p>If it is possible, print an integer $$$m$$$ ($$$0 \\leq m \\leq n$$$), which denotes the number of operations you do.<\/p><p>In each of the next $$$m$$$ lines, print three distinct integers $$$i, j, k$$$, representing one operation. <\/p><p>If there are many such operation sequences possible, print any. Note that you do <span class=\"tex-font-style-bf\">not<\/span> have to minimize the number of operations.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n4 2 1 7 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\n1\n1 3 4<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n10 4 49 22\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nNO\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, the array becomes $$$[4 \\oplus 1 \\oplus 7, 2, 4 \\oplus 1 \\oplus 7, 4 \\oplus 1 \\oplus 7, 2] = [2, 2, 2, 2, 2]$$$.<\/p><\/div><\/div>"}, {"contestId": 1333, "index": "F", "name": "Kate and imperfection", "rating": 2200, "solvedCount": 4662, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Kate and imperfection<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Kate has a set $$$S$$$ of $$$n$$$ integers $$$\\{1, \\dots, n\\} $$$. <\/p><p>She thinks that <span class=\"tex-font-style-bf\">imperfection<\/span> of a subset $$$M \\subseteq S$$$ is equal to the <span class=\"tex-font-style-bf\">maximum<\/span> of $$$gcd(a, b)$$$ over all pairs $$$(a, b)$$$ such that both $$$a$$$ and $$$b$$$ are in $$$M$$$ and $$$a \\neq b$$$. <\/p><p>Kate is a very neat girl and for each $$$k \\in \\{2, \\dots, n\\}$$$ she wants to find a subset that has the <span class=\"tex-font-style-bf\">smallest imperfection<\/span> among all subsets in $$$S$$$ of size $$$k$$$. There can be more than one subset with the smallest imperfection and the same size, but you don't need to worry about it. Kate wants to find all the subsets herself, but she needs your help to find the smallest possible imperfection for each size $$$k$$$, will name it $$$I_k$$$. <\/p><p>Please, help Kate to find $$$I_2$$$, $$$I_3$$$, ..., $$$I_n$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first and only line in the input consists of only one integer $$$n$$$ ($$$2\\le n \\le 5 \\cdot 10^5$$$) \u00a0\u2014 the size of the given set $$$S$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output contains only one line that includes $$$n - 1$$$ integers: $$$I_2$$$, $$$I_3$$$, ..., $$$I_n$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 <\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 1 <\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>First sample: answer is 1, because $$$gcd(1, 2) = 1$$$.<\/p><p>Second sample: there are subsets of $$$S$$$ with sizes $$$2, 3$$$ with imperfection equal to 1. For example, $$$\\{2,3\\}$$$ and $$$\\{1, 2, 3\\}$$$.<\/p><\/div><\/div>"}, {"contestId": 1993, "index": "D", "name": "Med-imize", "rating": 2200, "solvedCount": 4584, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Med-imize<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Given two positive integers $$$n$$$ and $$$k$$$, and another array $$$a$$$ of $$$n$$$ integers.<\/p><p>In one operation, you can select any subarray of size $$$k$$$ of $$$a$$$, then remove it from the array without changing the order of other elements. More formally, let $$$(l, r)$$$ be an operation on subarray $$$a_l, a_{l+1}, \\ldots, a_r$$$ such that $$$r-l+1=k$$$, then performing this operation means replacing $$$a$$$ with $$$[a_1, \\ldots, a_{l-1}, a_{r+1}, \\ldots, a_n]$$$.<\/p><p>For example, if $$$a=[1,2,3,4,5]$$$ and we perform operation $$$(3,5)$$$ on this array, it will become $$$a=[1,2]$$$. Moreover, operation $$$(2, 4)$$$ results in $$$a=[1,5]$$$, and operation $$$(1,3)$$$ results in $$$a=[4,5]$$$. <\/p><p>You have to repeat the operation while the length of $$$a$$$ is greater than $$$k$$$ (which means $$$|a| \\gt k$$$). What is the largest possible median$$$^\\dagger$$$ of all remaining elements of the array $$$a$$$ after the process?<\/p><p>$$$^\\dagger$$$The median of an array of length $$$n$$$ is the element whose index is $$$\\left \\lfloor (n+1)/2 \\right \\rfloor$$$ after we sort the elements in non-decreasing order. For example: $$$median([2,1,5,4,3]) = 3$$$, $$$median([5]) = 5$$$, and $$$median([6,8,2,4]) = 4$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le n, k \\le 5 \\cdot 10^5$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$)\u00a0\u2014 the array $$$a$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$5 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print a single integer\u00a0\u2014 the largest median possible after performing the operations.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 9 9 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 2 5 6 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 9 2 6 5 4 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">8 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">7 1 2 6 8 3 4 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3 4 5 6<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n4\n9\n6\n4\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, you can select a subarray $$$(l, r)$$$ which can be either $$$(1, 3)$$$ or $$$(2, 4)$$$. Thus, two obtainable final arrays are $$$[3]$$$ and $$$[2]$$$. The former one has the larger median ($$$3  \\gt  2$$$) so the answer is $$$3$$$.<\/p><p>In the second test case, three obtainable final arrays are $$$[6, 4]$$$, $$$[3, 4]$$$, and $$$[3, 2]$$$. Their medians are $$$4$$$, $$$3$$$, and $$$2$$$ respectively. The answer is $$$4$$$.<\/p><p>In the third test case, only one element is left in the final array and it can be any element of the initial array. The largest one among them is $$$9$$$, so the answer is $$$9$$$.<\/p><\/div><\/div>"}, {"contestId": 2013, "index": "E", "name": "Prefix GCD", "rating": 2200, "solvedCount": 4455, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Prefix GCD<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Since Mansur is tired of making legends, there will be no legends for this task.<\/p><p>You are given an array of positive integer numbers $$$a_1, a_2, \\ldots, a_n$$$. The elements of the array can be rearranged in any order. You need to find the smallest possible value of the expression $$$$$$\\gcd(a_1) + \\gcd(a_1, a_2) + \\ldots + \\gcd(a_1, a_2, \\ldots, a_n),$$$$$$ where $$$\\gcd(a_1, a_2, \\ldots, a_n)$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Greatest_common_divisor\">greatest common divisor (GCD)<\/a> of $$$a_1, a_2, \\ldots, a_n$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows.<\/p><p>The first line of each test case contains a single number $$$n$$$ ($$$1 \\le n \\le 10^5$$$)\u00a0\u2014 the size of the array.<\/p><p>The second line of each test case contains $$$n$$$ numbers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le 10^5$$$)\u00a0\u2014 the initial array.<\/p><p>The sum of $$$n$$$ over all test cases does not exceed $$$10^5$$$.<\/p><p>The sum of $$$\\max(a_1, a_2, \\ldots, a_n)$$$ over all test cases does not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single number on a separate line\u00a0\u2014 the answer to the problem.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">6 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">10 15 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 42 12 52 20<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">42 154 231 66<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n6\n9\n14\n51\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the elements can be rearranged as follows: $$$[2, 4, 2]$$$. Then the answer will be $$$\\gcd(2) + \\gcd(2, 4) + \\gcd(2, 4, 2) = 2 + 2 + 2 = 6$$$.<\/p><p>In the third test case, the elements can be rearranged as follows: $$$[6, 10, 15]$$$. Then the answer will be $$$\\gcd(6) + \\gcd(6, 10) + \\gcd(6, 10, 15) = 6 + 2 + 1 = 9$$$.<\/p><\/div><\/div>"}, {"contestId": 1854, "index": "B", "name": "Earn or Unlock", "rating": 2200, "solvedCount": 4439, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Earn or Unlock<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Andrea is playing the game <span class=\"tex-font-style-it\">Tanto Cuore<\/span>.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/7a2848f88de7912c0d901d27d6c7dbe0dceb5592.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p><span class=\"tex-font-style-paragraph\"><\/span><\/p><p>He has a deck of $$$n$$$ cards with values $$$a_1, \\ldots, a_n$$$ from top to bottom. Each card can be either locked or unlocked. Initially, only the topmost card is unlocked. <\/p><p>The game proceeds in turns. In each turn, Andrea chooses an unlocked card in the deck \u2014 the value written on the card is $$$v$$$ \u2014 and performs exactly one of the following two operations: <\/p><ol> <li> Unlock the first $$$v$$$ <span class=\"tex-font-style-bf\">locked<\/span> cards in the deck from the top. If there are less than $$$v$$$ locked cards in the deck, then unlock all the locked cards. <\/li><li> Earn $$$v$$$ <span class=\"tex-font-style-underline\">victory points<\/span>. <\/li><\/ol> In both cases, after performing the operation, he removes the card from the deck.<p>The game ends when all the cards remaining in the deck are locked, or there are no more cards in the deck.<\/p><p>What is the maximum number of victory points Andrea can earn?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$1 \\leq n \\leq 10^5$$$) \u2014 the number of cards in the deck.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, \\ldots, a_n$$$ ($$$0 \\leq a_1, \\ldots, a_n \\leq n$$$) \u2014 the values of the cards in the deck.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output a single integer \u2014 the maximum number of victory points Andrea can earn.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n1 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n2 4 5 0 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n9\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n0 4 4 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample test, the deck starts as [unlocked, locked]. Then, Andrea uses the first card to unlock the second card. Then he uses the second card to earn $$$2$$$ victory points.<\/p><p>In the second sample test, Andrea can use the first card to unlock the second and the third card. Then he uses the second and the third card to earn $$$4+5=9$$$ victory points.<\/p><p>In the third sample test, Andrea can't unlock any cards or gain any victory points with the first card.<\/p><\/div><\/div>"}, {"contestId": 1520, "index": "G", "name": "To Go Or Not To Go?", "rating": 2200, "solvedCount": 4421, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. To Go Or Not To Go?<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Dima overslept the alarm clock, which was supposed to raise him to school.<\/p><p>Dima wonders if he will have time to come to the first lesson. To do this, he needs to know the <span class=\"tex-font-style-bf\">minimum time<\/span> it will take him to get from home to school.<\/p><p>The city where Dima lives is a rectangular field of $$$n \\times m$$$ size. Each cell $$$(i, j)$$$ on this field is denoted by one number $$$a_{ij}$$$:<\/p><ul> <li> The number $$$-1$$$ means that the passage through the cell is prohibited; <\/li><li> The number $$$0$$$ means that the cell is free and Dima can walk though it. <\/li><li> The number $$$x$$$ ($$$1 \\le x \\le 10^9$$$) means that the cell contains a portal with a cost of $$$x$$$. A cell with a portal is also considered free. <\/li><\/ul><p>From any portal, Dima can go to any other portal, while the time of moving from the portal $$$(i, j)$$$ to the portal $$$(x, y)$$$ corresponds to the sum of their costs $$$a_{ij} + a_{xy}$$$.<\/p><p>In addition to moving between portals, Dima can also move between unoccupied cells adjacent to one side in time $$$w$$$. In particular, he can enter a cell with a portal and not use it.<\/p><p>Initially, Dima is in the upper-left cell $$$(1, 1)$$$, and the school is in the lower right cell $$$(n, m)$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains three integers $$$n$$$, $$$m$$$ and $$$w$$$ ($$$2 \\le n, m \\le 2 \\cdot 10^3$$$, $$$1 \\le w \\le 10^9$$$), where $$$n$$$ and $$$m$$$ are city size, $$$w$$$ is time during which Dima moves between unoccupied cells.<\/p><p>The next $$$n$$$ lines each contain $$$m$$$ numbers ($$$-1 \\le a_{ij} \\le 10^9$$$)\u00a0\u2014 descriptions of cells.<\/p><p>It is guaranteed that the cells $$$(1, 1)$$$ and $$$(n, m)$$$ are free.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output the minimum time it will take for Dima to get to school. If he cannot get to school at all, then output \"<span class=\"tex-font-style-tt\">-1<\/span>\".<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 5 1\n0 -1 0 1 -1\n0 20 0 0 -1\n-1 -1 -1 -1 -1\n3 0 0 0 0\n-1 0 0 0 0\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n14<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Explanation for the first sample: <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/bb7999d7d3954fc4c20f52fe6113eaffe2889c3f.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 1428, "index": "E", "name": "Carrots for Rabbits", "rating": 2200, "solvedCount": 4418, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Carrots for Rabbits<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are some rabbits in Singapore Zoo. To feed them, Zookeeper bought $$$n$$$ carrots with lengths $$$a_1, a_2, a_3, \\ldots, a_n$$$. However, rabbits are very fertile and multiply very quickly. Zookeeper now has $$$k$$$ rabbits and does not have enough carrots to feed all of them. To solve this problem, Zookeeper decided to cut the carrots into $$$k$$$ pieces. For some reason, all resulting carrot lengths must be positive integers.<\/p><p>Big carrots are very difficult for rabbits to handle and eat, so the time needed to eat a carrot of size $$$x$$$ is $$$x^2$$$.<\/p><p>Help Zookeeper split his carrots while minimizing the sum of time taken for rabbits to eat the carrots.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$k$$$ $$$(1 \\leq n \\leq k \\leq 10^5)$$$: the initial number of carrots and the number of rabbits.<\/p><p>The next line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ $$$(1 \\leq a_i \\leq 10^6)$$$: lengths of carrots.<\/p><p>It is guaranteed that the sum of $$$a_i$$$ is at least $$$k$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output one integer: the minimum sum of time taken for rabbits to eat carrots.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 6\n5 3 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n15\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1 4\n19\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n91\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first test, the optimal sizes of carrots are $$$\\{1,1,1,2,2,2\\}$$$. The time taken is $$$1^2+1^2+1^2+2^2+2^2+2^2=15$$$<\/p><p>For the second test, the optimal sizes of carrots are $$$\\{4,5,5,5\\}$$$. The time taken is $$$4^2+5^2+5^2+5^2=91$$$.<\/p><\/div><\/div>"}, {"contestId": 1567, "index": "E", "name": "Non-Decreasing Dilemma", "rating": 2200, "solvedCount": 4415, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Non-Decreasing Dilemma<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Alice has recently received an array $$$a_1, a_2, \\dots, a_n$$$ for her birthday! She is very proud of her array, and when she showed her friend Bob the array, he was very happy with her present too!<\/p><p>However, soon Bob became curious, and as any sane friend would do, asked Alice to perform $$$q$$$ operations of two types on her array:<\/p><ul> <li> $$$1$$$ $$$x$$$ $$$y$$$: update the element $$$a_x$$$ to $$$y$$$ (set $$$a_x = y$$$). <\/li><li> $$$2$$$ $$$l$$$ $$$r$$$: calculate how many non-decreasing subarrays exist within the subarray $$$[a_l, a_{l+1}, \\dots, a_r]$$$. More formally, count the number of pairs of integers $$$(p,q)$$$ such that $$$l \\le p \\le q \\le r$$$ and $$$a_p \\le a_{p+1} \\le \\dots \\le a_{q-1} \\le a_q$$$. <\/li><\/ul><p>Help Alice answer Bob's queries!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$q$$$ ($$$1 \\le n, q \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the size of the array, and the number of queries, respectively.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$)\u00a0\u2014 the elements of Alice's array.<\/p><p>The next $$$q$$$ lines consist of three integers each. The first integer of the $$$i$$$-th line is $$$t_i$$$, the operation being performed on the $$$i$$$-th step ($$$t_i = 1$$$ or $$$t_i = 2$$$).<\/p><p>If $$$t_i = 1$$$, the next two integers are $$$x_i$$$ and $$$y_i$$$ ($$$1 \\le x_i \\le n$$$; $$$1 \\le y_i \\le 10^9$$$), updating the element at position $$$x_i$$$ to $$$y_i$$$ (setting $$$a_{x_i} = y_i$$$).<\/p><p>If $$$t_i = 2$$$, the next two integers are $$$l_i$$$ and $$$r_i$$$ ($$$1 \\le l_i \\le r_i \\le n$$$), the two indices Bob asks Alice about for the $$$i$$$-th query.<\/p><p>It's guaranteed that there is at least one operation of the second type.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query of type $$$2$$$, print a single integer, the answer to the query.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 6\n3 1 4 1 5\n2 2 5\n2 1 3\n1 4 4\n2 2 5\n1 2 6\n2 2 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n4\n10\n7\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first query, $$$l = 2$$$ and $$$r = 5$$$, and the non-decreasing subarrays $$$[p,q]$$$ are $$$[2,2]$$$, $$$[3,3]$$$, $$$[4,4]$$$, $$$[5,5]$$$, $$$[2,3]$$$ and $$$[4,5]$$$.<\/p><\/div><\/div>"}, {"contestId": 1474, "index": "D", "name": "Cleaning", "rating": 2200, "solvedCount": 4368, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Cleaning<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>During cleaning the coast, Alice found $$$n$$$ piles of stones. The $$$i$$$-th pile has $$$a_i$$$ stones.<\/p><p>Piles $$$i$$$ and $$$i + 1$$$ are neighbouring for all $$$1 \\leq i \\leq n - 1$$$. If pile $$$i$$$ becomes empty, piles $$$i - 1$$$ and $$$i + 1$$$ <span class=\"tex-font-style-bf\">doesn't<\/span> become neighbouring.<\/p><p>Alice is too lazy to remove these stones, so she asked you to take this duty. She allowed you to do only the following operation: <\/p><ul> <li> Select two <span class=\"tex-font-style-bf\">neighboring<\/span> piles and, if both of them are not empty, remove one stone from each of them. <\/li><\/ul><p>Alice understands that sometimes it's impossible to remove all stones with the given operation, so she allowed you to use the following superability: <\/p><ul> <li> Before the start of cleaning, you can select two <span class=\"tex-font-style-bf\">neighboring<\/span> piles and swap them. <\/li><\/ul><p>Determine, if it is possible to remove all stones using the superability <span class=\"tex-font-style-bf\">not more than once<\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains the single integer $$$n$$$ ($$$2 \\leq n \\leq 2 \\cdot 10^5$$$)\u00a0\u2014 the number of piles.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\leq a_i \\leq 10^9$$$)\u00a0\u2014 the number of stones in each pile.<\/p><p>It is guaranteed that the total sum of $$$n$$$ over all test cases doesn't exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print <span class=\"tex-font-style-tt\">YES<\/span> or <span class=\"tex-font-style-tt\">NO<\/span>\u00a0\u2014 is it possible to remove all stones using the superability <span class=\"tex-font-style-bf\">not more than once<\/span> or not.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n3\n1 2 1\n3\n1 1 2\n5\n2 2 2 1 3\n5\n2100 1900 1600 3000 1600\n2\n2443 2445\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nYES\nYES\nYES\nNO\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, you can remove all stones without using a superability: $$$[1, 2, 1] \\rightarrow [1, 1, 0] \\rightarrow [0, 0, 0]$$$.<\/p><p>In the second test case, you can apply superability to the second and the third piles and then act like in the first testcase.<\/p><p>In the third test case, you can apply superability to the fourth and the fifth piles, thus getting $$$a = [2, 2, 2, 3, 1]$$$.<\/p><p>In the fourth test case, you can apply superability to the first and the second piles, thus getting $$$a = [1900, 2100, 1600, 3000, 1600]$$$.<\/p><\/div><\/div>"}, {"contestId": 1470, "index": "D", "name": "Strange Housing", "rating": 2200, "solvedCount": 4316, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Strange Housing<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Students of Winter Informatics School are going to live in a set of houses connected by underground passages. Teachers are also going to live in some of these houses, but they can not be accommodated randomly. For safety reasons, the following must hold:<\/p><ul> <li> All passages between two houses will be closed, if there are no teachers in both of them. All other passages will stay open. <\/li><li> It should be possible to travel between any two houses using the underground passages that are <span class=\"tex-font-style-bf\">open<\/span>. <\/li><li> Teachers should not live in houses, directly connected by a passage. <\/li><\/ul><p>Please help the organizers to choose the houses where teachers will live to satisfy the safety requirements or determine that it is impossible.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first input line contains a single integer $$$t$$$\u00a0\u2014 the number of test cases ($$$1 \\le t \\le 10^5$$$). <\/p><p>Each test case starts with two integers $$$n$$$ and $$$m$$$ ($$$2 \\le n \\le 3 \\cdot 10^5$$$, $$$0 \\le m \\le 3 \\cdot 10^5$$$)\u00a0\u2014 the number of houses and the number of passages.<\/p><p>Then $$$m$$$ lines follow, each of them contains two integers $$$u$$$ and $$$v$$$ ($$$1 \\le u, v \\le n$$$, $$$u \\neq v$$$), describing a passage between the houses $$$u$$$ and $$$v$$$. It is guaranteed that there are no two passages connecting the same pair of houses.<\/p><p>The sum of values $$$n$$$ over all test cases does not exceed $$$3 \\cdot 10^5$$$, and the sum of values $$$m$$$ over all test cases does not exceed $$$3 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, if there is no way to choose the desired set of houses, output \"<span class=\"tex-font-style-tt\">NO<\/span>\". Otherwise, output \"<span class=\"tex-font-style-tt\">YES<\/span>\", then the total number of houses chosen, and then the indices of the chosen houses in arbitrary order.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n3 2\n3 2\n2 1\n4 2\n1 4\n2 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\n2\n1 3 \nNO\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1\n17 27\n1 8\n2 9\n3 10\n4 11\n5 12\n6 13\n7 14\n8 9\n8 14\n8 15\n9 10\n9 15\n10 11\n10 15\n10 17\n11 12\n11 17\n12 13\n12 16\n12 17\n13 14\n13 16\n14 16\n14 15\n15 16\n15 17\n16 17\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\n8\n1 3 4 5 6 9 14 17 \n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The picture below shows the second example test. <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/8bc47ac983056db9783d48fcd67b939dfef85e80.png\" style=\"zoom: 35.0%;max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 1156, "index": "E", "name": "Special Segments of Permutation", "rating": 2200, "solvedCount": 4288, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Special Segments of Permutation<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a permutation $$$p$$$ of $$$n$$$ integers $$$1$$$, $$$2$$$, ..., $$$n$$$ (a permutation is an array where each element from $$$1$$$ to $$$n$$$ occurs exactly once).<\/p><p>Let's call some subsegment $$$p[l, r]$$$ of this permutation special if $$$p_l + p_r = \\max \\limits_{i = l}^{r} p_i$$$. Please calculate the number of special subsegments.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$3 \\le n \\le 2 \\cdot 10^5$$$).<\/p><p>The second line contains $$$n$$$ integers $$$p_1$$$, $$$p_2$$$, ..., $$$p_n$$$ ($$$1 \\le p_i \\le n$$$). All these integers are pairwise distinct.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the number of special subsegments of the given permutation.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n3 4 1 5 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n1 3 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Special subsegments in the first example are $$$[1, 5]$$$ and $$$[1, 3]$$$.<\/p><p>The only special subsegment in the second example is $$$[1, 3]$$$.<\/p><\/div><\/div>"}, {"contestId": 915, "index": "D", "name": "Almost Acyclic Graph", "rating": 2200, "solvedCount": 4229, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Almost Acyclic Graph<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a <a href=\"https://en.wikipedia.org/wiki/Directed_graph\">directed graph<\/a> consisting of <span class=\"tex-span\"><i>n<\/i><\/span> vertices and <span class=\"tex-span\"><i>m<\/i><\/span> edges (each edge is directed, so it can be traversed in only one direction). You are allowed to remove at most one edge from it.<\/p><p>Can you make this graph <a href=\"https://en.wikipedia.org/wiki/Directed_acyclic_graph\">acyclic<\/a> by removing at most one edge from it? A directed graph is called acyclic iff it doesn't contain any cycle (a non-empty path that starts and ends in the same vertex).<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009500<\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u2009<i>min<\/i>(<i>n<\/i>(<i>n<\/i>\u2009-\u20091),\u2009100000)<\/span>) \u2014 the number of vertices and the number of edges, respectively.<\/p><p>Then <span class=\"tex-span\"><i>m<\/i><\/span> lines follow. Each line contains two integers <span class=\"tex-span\"><i>u<\/i><\/span> and <span class=\"tex-span\"><i>v<\/i><\/span> denoting a directed edge going from vertex <span class=\"tex-span\"><i>u<\/i><\/span> to vertex <span class=\"tex-span\"><i>v<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>u<\/i>,\u2009<i>v<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\"><i>u<\/i>\u2009\u2260\u2009<i>v<\/i><\/span>). Each ordered pair <span class=\"tex-span\">(<i>u<\/i>,\u2009<i>v<\/i>)<\/span> is listed at most once (there is at most one directed edge from <span class=\"tex-span\"><i>u<\/i><\/span> to <span class=\"tex-span\"><i>v<\/i><\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If it is possible to make this graph acyclic by removing at most one edge, print <span class=\"tex-font-style-tt\">YES<\/span>. Otherwise, print <span class=\"tex-font-style-tt\">NO<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 4<br/>1 2<br/>2 3<br/>3 2<br/>3 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 6<br/>1 2<br/>2 3<br/>3 2<br/>3 1<br/>2 1<br/>4 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>NO<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example you can remove edge <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/29f71c065c3536e88b54429c734103ad3604f68b.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>, and the graph becomes acyclic.<\/p><p>In the second example you have to remove at least two edges (for example, <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/420322fe5fba4eb3e3eba6886a2edb31f15762ce.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> and <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/29f71c065c3536e88b54429c734103ad3604f68b.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>) in order to make the graph acyclic.<\/p><\/div><\/div>"}, {"contestId": 1336, "index": "C", "name": "Kaavi and Magic Spell", "rating": 2200, "solvedCount": 4216, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Kaavi and Magic Spell<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Kaavi, the mysterious fortune teller, deeply believes that one's fate is inevitable and unavoidable. Of course, she makes her living by predicting others' future. While doing divination, Kaavi believes that magic spells can provide great power for her to see the future. <\/p><center><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/23b27e5ebf53e66eeea13e9650cdc9950aa0114e.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/center>\u00a0<p>Kaavi has a string $$$T$$$ of length $$$m$$$ and all the strings with the prefix $$$T$$$ are magic spells. Kaavi also has a string $$$S$$$ of length $$$n$$$ and an empty string $$$A$$$.<\/p><p>During the divination, Kaavi needs to perform a sequence of operations. There are two different operations:<\/p><ul><li> Delete the first character of $$$S$$$ and add it at the <span class=\"tex-font-style-bf\">front<\/span> of $$$A$$$.<\/li><li> Delete the first character of $$$S$$$ and add it at the <span class=\"tex-font-style-bf\">back<\/span> of $$$A$$$.<\/li><\/ul><p>Kaavi can perform <span class=\"tex-font-style-bf\">no more than<\/span> $$$n$$$ operations. To finish the divination, she wants to know the number of different operation sequences to make $$$A$$$ a magic spell (i.e. with the prefix $$$T$$$). As her assistant, can you help her? The answer might be huge, so Kaavi only needs to know the answer modulo $$$998\\,244\\,353$$$.<\/p><p>Two operation sequences are considered different if they are different in length or there exists an $$$i$$$ that their $$$i$$$-th operation is different. <\/p><p>A substring is a contiguous sequence of characters within a string. A prefix of a string $$$S$$$ is a substring of $$$S$$$ that occurs at the beginning of $$$S$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a string $$$S$$$ of length $$$n$$$ ($$$1 \\leq n \\leq 3000$$$).<\/p><p>The second line contains a string $$$T$$$ of length $$$m$$$ ($$$1 \\leq m \\leq n$$$).<\/p><p>Both strings contain only lowercase Latin letters.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>The output contains only one integer \u00a0\u2014 the answer modulo $$$998\\,244\\,353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\nabab\nba\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n12<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\ndefineintlonglong\nsignedmain\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\nrotator\nrotator\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\ncacdcdbbbb\nbdcaccdbbb\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n24<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The first test:<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/3a5905716a660bb393c3ce066896e40db3136fe2.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>The red ones are the magic spells. In the first operation, Kaavi can either add the first character \"<span class=\"tex-font-style-tt\">a<\/span>\" at the front or the back of $$$A$$$, although the results are the same, they are considered as different operations. So the answer is $$$6\\times2=12$$$.<\/p><\/div><\/div>"}, {"contestId": 1110, "index": "D", "name": "Jongmah", "rating": 2200, "solvedCount": 4176, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Jongmah<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are playing a game of Jongmah. You don't need to know the rules to solve this problem. You have $$$n$$$ tiles in your hand. Each tile has an integer between $$$1$$$ and $$$m$$$ written on it.<\/p><p>To win the game, you will need to form some number of <span class=\"tex-font-style-it\">triples<\/span>. Each triple consists of three tiles, such that the numbers written on the tiles are either all the same or consecutive. For example, $$$7, 7, 7$$$ is a valid triple, and so is $$$12, 13, 14$$$, but $$$2,2,3$$$ or $$$2,4,6$$$ are not. You can only use the tiles in your hand to form triples. Each tile can be used in at most one triple.<\/p><p>To determine how close you are to the win, you want to know the maximum number of triples you can form from the tiles in your hand.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers integer $$$n$$$ and $$$m$$$ ($$$1 \\le n, m \\le 10^6$$$)\u00a0\u2014 the number of tiles in your hand and the number of tiles types.<\/p><p>The second line contains integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le m$$$), where $$$a_i$$$ denotes the number written on the $$$i$$$-th tile.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer: the maximum number of triples you can form.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>10 6<br/>2 3 3 3 4 4 4 5 5 6<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>12 6<br/>1 5 3 3 3 4 3 5 3 2 3 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>13 5<br/>1 1 5 1 2 3 3 2 4 2 3 4 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, we have tiles $$$2, 3, 3, 3, 4, 4, 4, 5, 5, 6$$$. We can form three triples in the following way: $$$2, 3, 4$$$; $$$3, 4, 5$$$; $$$4, 5, 6$$$. Since there are only $$$10$$$ tiles, there is no way we could form $$$4$$$ triples, so the answer is $$$3$$$.<\/p><p>In the second example, we have tiles $$$1$$$, $$$2$$$, $$$3$$$ ($$$7$$$ times), $$$4$$$, $$$5$$$ ($$$2$$$ times). We can form $$$3$$$ triples as follows: $$$1, 2, 3$$$; $$$3, 3, 3$$$; $$$3, 4, 5$$$. One can show that forming $$$4$$$ triples is not possible.<\/p><\/div><\/div>"}, {"contestId": 551, "index": "C", "name": "GukiZ hates Boxes", "rating": 2200, "solvedCount": 4104, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. GukiZ hates Boxes<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Professor GukiZ is concerned about making his way to school, because massive piles of boxes are blocking his way. <\/p><p>In total there are <span class=\"tex-span\"><i>n<\/i><\/span> piles of boxes, arranged in a line, from left to right, <span class=\"tex-span\"><i>i<\/i><\/span>-th pile (<span class=\"tex-span\">1\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>) containing <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> boxes. Luckily, <span class=\"tex-span\"><i>m<\/i><\/span> students are willing to help GukiZ by removing all the boxes from his way. Students are working simultaneously. At time <span class=\"tex-span\">0<\/span>, all students are located left of the first pile. It takes one second for every student to move from this position to the first pile, and after that, every student must start performing sequence of two possible operations, each taking one second to complete. Possible operations are:<\/p><ol><li> If <span class=\"tex-span\"><i>i<\/i>\u2009\u2260\u2009<i>n<\/i><\/span>, move from pile <span class=\"tex-span\"><i>i<\/i><\/span> to pile <span class=\"tex-span\"><i>i<\/i>\u2009+\u20091<\/span>;<\/li><li> If pile located at the position of student is not empty, remove one box from it.<\/li><\/ol><p>GukiZ's students aren't smart at all, so they need you to tell them how to remove boxes before professor comes (he is very impatient man, and doesn't want to wait). They ask you to calculate minumum time <span class=\"tex-span\"><i>t<\/i><\/span> in seconds for which they can remove all the boxes from GukiZ's way. Note that students can be positioned in any manner after <span class=\"tex-span\"><i>t<\/i><\/span> seconds, but all the boxes must be removed.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>m<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>), the number of piles of boxes and the number of GukiZ's students. <\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009... <i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) where <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>

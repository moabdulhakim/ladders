iv><\/div><div><center> <img class=\"tex-graphics\" height=\"302px\" src=\"https://espresso.codeforces.com/18f827e1ea3e00af03bdf06d535914d40ecb0ca8.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"454px\"/> <\/center><p>William has two arrays $$$a$$$ and $$$b$$$, each consisting of $$$n$$$ items.<\/p><p>For some segments $$$l..r$$$ of these arrays William wants to know if it is possible to equalize the values of items in these segments using a balancing operation. Formally, the values are equalized if for each $$$i$$$ from $$$l$$$ to $$$r$$$ holds $$$a_i = b_i$$$.<\/p><p>To perform a balancing operation an even number of indices must be selected, such that $$$l \\le pos_1  \\lt  pos_2  \\lt  \\dots  \\lt  pos_k \\le r$$$. Next the items of <span class=\"tex-font-style-bf\">array a<\/span> at positions $$$pos_1, pos_3, pos_5, \\dots$$$ get incremented by one and the items of <span class=\"tex-font-style-bf\">array b<\/span> at positions $$$pos_2, pos_4, pos_6, \\dots$$$ get incremented by one.<\/p><p>William wants to find out if it is possible to equalize the values of elements in two arrays for each segment using some number of balancing operations, and what is the minimal number of operations required for that. Note that for each segment the operations are performed independently.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a two integers $$$n$$$ and $$$q$$$ ($$$2 \\le n \\le 10^5$$$, $$$1 \\le q \\le 10^5$$$), the size of arrays $$$a$$$ and $$$b$$$ and the number of segments.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ $$$(0 \\le a_i \\le 10^9)$$$.<\/p><p>The third line contains $$$n$$$ integers $$$b_1, b_2, \\dots, b_n$$$ $$$(0 \\le b_i \\le 10^9)$$$.<\/p><p>Each of the next $$$q$$$ lines contains two integers $$$l_i$$$ and $$$r_i$$$ $$$(1 \\le l_i  \\lt  r_i \\le n)$$$, the edges of segments.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each segment output a single number\u00a0\u2014 the minimal number of balancing operations needed or \"<span class=\"tex-font-style-tt\">-1<\/span>\" if it is impossible to equalize segments of arrays.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n8 5\n0 1 2 9 3 2 7 5\n2 2 1 9 4 1 5 8\n2 6\n1 7\n2 4\n7 8\n5 8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n3\n1\n-1\n-1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first segment from $$$2$$$ to $$$6$$$ you can do one operation with $$$pos = [2, 3, 5, 6]$$$, after this operation the arrays will be: $$$a = [0, 2, 2, 9, 4, 2, 7, 5]$$$, $$$b = [2, 2, 2, 9, 4, 2, 5, 8]$$$. Arrays are equal on a segment from $$$2$$$ to $$$6$$$ after this operation.<\/p><p>For the second segment from $$$1$$$ to $$$7$$$ you can do three following operations: <\/p><ol> <li> $$$pos = [1, 3, 5, 6]$$$ <\/li><li> $$$pos = [1, 7]$$$ <\/li><li> $$$pos = [2, 7]$$$ <\/li><\/ol><p>After these operations, the arrays will be: $$$a = [2, 2, 2, 9, 4, 2, 7, 5]$$$, $$$b = [2, 2, 2, 9, 4, 2, 7, 8]$$$. Arrays are equal on a segment from $$$1$$$ to $$$7$$$ after these operations.<\/p><p>For the third segment from $$$2$$$ to $$$4$$$ you can do one operation with $$$pos = [2, 3]$$$, after the operation arrays will be: $$$a = [0, 2, 2, 9, 3, 2, 7, 5]$$$, $$$b = [2, 2, 2, 9, 4, 1, 5, 8]$$$. Arrays are equal on a segment from $$$2$$$ to $$$4$$$ after this operation.<\/p><p>It is impossible to equalize the fourth and the fifth segment.<\/p><\/div><\/div>"}, {"contestId": 1730, "index": "D", "name": "Prefixes and Suffixes", "rating": 2200, "solvedCount": 3103, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Prefixes and Suffixes<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You have two strings $$$s_1$$$ and $$$s_2$$$ of length $$$n$$$, consisting of lowercase English letters. You can perform the following operation any (possibly zero) number of times: <\/p><ul> <li> Choose a positive integer $$$1 \\leq k \\leq n$$$. <\/li><li> Swap the prefix of the string $$$s_1$$$ and the suffix of the string $$$s_2$$$ of length $$$k$$$. <\/li><\/ul><p>Is it possible to make these two strings equal by doing described operations?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$) \u2014 the number of test cases. Then the test cases follow.<\/p><p>Each test case consists of three lines.<\/p><p>The first line contains a single integer $$$n$$$ ($$$1 \\le n \\le 10^5$$$) \u2014 the length of the strings $$$s_1$$$ and $$$s_2$$$. <\/p><p>The second line contains the string $$$s_1$$$ of length $$$n$$$, consisting of lowercase English letters.<\/p><p>The third line contains the string $$$s_2$$$ of length $$$n$$$, consisting of lowercase English letters.<\/p><p>It is guaranteed that the sum of $$$n$$$ for all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print \"<span class=\"tex-font-style-tt\">YES<\/span>\" if it is possible to make the strings equal, and \"<span class=\"tex-font-style-tt\">NO<\/span>\" otherwise.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">cbc<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">aba<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">abcaa<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">cbabb<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">abcaa<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">cbabz<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">a<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">a<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">a<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">b<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">6<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">abadaa<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">adaaba<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">abcabdaa<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">adabcaba<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nYES\nNO\nYES\nNO\nNO\nYES\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case:<\/p><ul> <li> Initially $$$s_1 = \\mathtt{cbc}$$$, $$$s_2 = \\mathtt{aba}$$$. <\/li><li> Operation with $$$k = 1$$$, after the operation $$$s_1 = \\mathtt{abc}$$$, $$$s_2 = \\mathtt{abc}$$$. <\/li><\/ul><p>In the second test case:<\/p><ul> <li> Initially $$$s_1 = \\mathtt{abcaa}$$$, $$$s_2 = \\mathtt{cbabb}$$$. <\/li><li> Operation with $$$k = 2$$$, after the operation $$$s_1 = \\mathtt{bbcaa}$$$, $$$s_2 = \\mathtt{cbaab}$$$. <\/li><li> Operation with $$$k = 3$$$, after the operation $$$s_1 = \\mathtt{aabaa}$$$, $$$s_2 = \\mathtt{cbbbc}$$$. <\/li><li> Operation with $$$k = 1$$$, after the operation $$$s_1 = \\mathtt{cabaa}$$$, $$$s_2 = \\mathtt{cbbba}$$$. <\/li><li> Operation with $$$k = 2$$$, after the operation $$$s_1 = \\mathtt{babaa}$$$, $$$s_2 = \\mathtt{cbbca}$$$. <\/li><li> Operation with $$$k = 1$$$, after the operation $$$s_1 = \\mathtt{aabaa}$$$, $$$s_2 = \\mathtt{cbbcb}$$$. <\/li><li> Operation with $$$k = 2$$$, after the operation $$$s_1 = \\mathtt{cbbaa}$$$, $$$s_2 = \\mathtt{cbbaa}$$$. <\/li><\/ul><p>In the third test case, it's impossible to make strings equal.<\/p><\/div><\/div>"}, {"contestId": 1220, "index": "E", "name": "Tourism", "rating": 2200, "solvedCount": 3074, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Tourism<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Alex decided to go on a touristic trip over the country.<\/p><p>For simplicity let's assume that the country has $$$n$$$ cities and $$$m$$$ bidirectional roads connecting them. Alex lives in city $$$s$$$ and initially located in it. To compare different cities Alex assigned each city a score $$$w_i$$$ which is as high as interesting city seems to Alex.<\/p><p>Alex believes that his trip will be interesting only if he will not use any road twice in a row. That is if Alex came to city $$$v$$$ from city $$$u$$$, he may choose as the next city in the trip any city connected with $$$v$$$ by the road, except for the city $$$u$$$.<\/p><p>Your task is to help Alex plan his city in a way that maximizes total score over all cities he visited. Note that for each city its score is counted at most once, even if Alex been there several times during his trip.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>First line of input contains two integers $$$n$$$ and $$$m$$$, ($$$1 \\le n \\le 2 \\cdot 10^5$$$, $$$0 \\le m \\le 2 \\cdot 10^5$$$) which are numbers of cities and roads in the country.<\/p><p>Second line contains $$$n$$$ integers $$$w_1, w_2, \\ldots, w_n$$$ ($$$0 \\le w_i \\le 10^9$$$) which are scores of all cities.<\/p><p>The following $$$m$$$ lines contain description of the roads. Each of these $$$m$$$ lines contains two integers $$$u$$$ and $$$v$$$ ($$$1 \\le u, v \\le n$$$) which are cities connected by this road.<\/p><p>It is guaranteed that there is at most one direct road between any two cities, no city is connected to itself by the road and, finally, it is possible to go from any city to any other one using only roads.<\/p><p>The last line contains single integer $$$s$$$ ($$$1 \\le s \\le n$$$), which is the number of the initial city.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output single integer which is the maximum possible sum of scores of visited cities.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 7\n2 2 8 6 9\n1 2\n1 3\n2 4\n3 2\n4 5\n2 5\n1 5\n2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n27\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n10 12\n1 7 1 9 3 3 6 30 1 10\n1 2\n1 3\n3 5\n5 7\n2 3\n5 4\n6 9\n4 6\n3 7\n6 8\n9 4\n9 10\n6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n61\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1059, "index": "D", "name": "Nature Reserve", "rating": 2200, "solvedCount": 3074, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Nature Reserve<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There is a forest that we model as a plane and live $$$n$$$ rare animals. Animal number $$$i$$$ has its lair in the point $$$(x_{i}, y_{i})$$$. In order to protect them, a decision to build a nature reserve has been made.<\/p><p>The reserve must have a form of a circle containing all lairs. There is also a straight river flowing through the forest. All animals drink from this river, therefore it must have at least one common point with the reserve. On the other hand, ships constantly sail along the river, so the reserve must not have more than one common point with the river.<\/p><p>For convenience, scientists have made a transformation of coordinates so that the river is defined by $$$y = 0$$$. Check whether it is possible to build a reserve, and if possible, find the minimum possible radius of such a reserve.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$1 \\le n \\le 10^5$$$) \u2014 the number of animals. <\/p><p>Each of the next $$$n$$$ lines contains two integers $$$x_{i}$$$, $$$y_{i}$$$ ($$$-10^7 \\le x_{i}, y_{i} \\le 10^7$$$) \u2014 the coordinates of the $$$i$$$-th animal's lair. It is guaranteed that $$$y_{i} \\neq 0$$$. No two lairs coincide.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If the reserve cannot be built, print $$$-1$$$. Otherwise print the minimum radius. Your answer will be accepted if absolute or relative error does not exceed $$$10^{-6}$$$.<\/p><p>Formally, let your answer be $$$a$$$, and the jury's answer be $$$b$$$. Your answer is considered correct if $$$\\frac{|a - b|}{\\max{(1, |b|)}} \\le 10^{-6}$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>1<br/>0 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0.5<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>0 1<br/>0 2<br/>0 -3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>-1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/>0 1<br/>1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0.625<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample it is optimal to build the reserve with the radius equal to $$$0.5$$$ and the center in $$$(0,\\ 0.5)$$$.<\/p><p>In the second sample it is impossible to build a reserve.<\/p><p>In the third sample it is optimal to build the reserve with the radius equal to $$$\\frac{5}{8}$$$ and the center in $$$(\\frac{1}{2},\\ \\frac{5}{8})$$$.<\/p><\/div><\/div>"}];
    let currentProblem = null;
    let editor = null;
    const STORAGE_KEY = `cf_ladder_done_2200`;
    let doneSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));

    // Retrieve the template securely from the hidden textarea
    const DEFAULT_TEMPLATE = document.getElementById('cpp-template').value.trim();

    function initEditor() {
        editor = ace.edit("editor");
        editor.setTheme("ace/theme/tomorrow_night_eighties");
        editor.session.setMode("ace/mode/c_cpp");
        editor.setFontSize(15);
        editor.setValue(DEFAULT_TEMPLATE, 1);
    }

    function renderSidebar() {
        const list = document.getElementById('problem-list');
        list.innerHTML = '';
        PROBLEMS.forEach((prob, idx) => {
            const div = document.createElement('div');
            div.className = `problem-item ${currentProblem === prob ? 'active' : ''}`;
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox'; checkbox.className = 'done-checkbox'; checkbox.checked = doneSet.has(prob.name);
            checkbox.onclick = (e) => { e.stopPropagation(); toggleDone(prob.name, checkbox.checked); };
            const title = document.createElement('div');
            title.innerHTML = `<span class="text-xs text-slate-500">#${idx + 1}</span> <span class="font-semibold text-slate-200">${prob.name}</span>`;
            div.appendChild(checkbox); div.appendChild(title); div.onclick = () => loadProblem(prob);
            list.appendChild(div);
        });
        updateProgress();
    }

    function toggleDone(name, isDone) {
        if(isDone) { doneSet.add(name); confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#4ade80', '#38bdf8'] }); } 
        else { doneSet.delete(name); }
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...doneSet]));
        updateProgress();
    }

    function updateProgress() { document.getElementById('progress-text').innerText = `${doneSet.size} / ${PROBLEMS.length} Solved`; }

    function loadProblem(prob) {
        currentProblem = prob; renderSidebar();
        document.getElementById('welcome-screen').style.display = 'none';
        const contentDiv = document.getElementById('problem-content');
        contentDiv.style.display = 'block'; contentDiv.innerHTML = prob.html;
        const titleEl = contentDiv.querySelector('.header .title');
        if(titleEl) {
            const originalText = titleEl.innerText;
            titleEl.innerHTML = `<a href="https://codeforces.com/contest/${prob.contestId}/problem/${prob.index}" target="_blank" title="Open in Codeforces">${originalText} 🔗</a>`;
        }
        contentDiv.querySelectorAll('.sample-tests .input pre').forEach(pre => {
            const btn = document.createElement('button'); btn.innerText = 'Copy'; btn.className = 'copy-btn';
            btn.onclick = () => { navigator.clipboard.writeText(pre.innerText); btn.innerText = 'Copied!'; btn.style.background = '#4ade80'; setTimeout(() => { btn.innerText = 'Copy'; btn.style.background = 'var(--neon-blue)'; }, 2000); };
            pre.parentElement.appendChild(btn);
        });
        if (window.MathJax) { MathJax.typesetPromise([contentDiv]); }
        editor.setValue(DEFAULT_TEMPLATE, 1);
    }

    function toggleSettings() {
        const modal = document.getElementById('settings-modal');
        if(modal.style.display === 'flex') { modal.style.display = 'none'; } 
        else { modal.style.display = 'flex'; document.getElementById('api-key').value = localStorage.getItem('cf_api_key') || ''; document.getElementById('api-secret').value = localStorage.getItem('cf_api_secret') || ''; }
    }

    function saveSettings() {
        localStorage.setItem('cf_api_key', document.getElementById('api-key').value);
        localStorage.setItem('cf_api_secret', document.getElementById('api-secret').value);
        toggleSettings(); alert('API Credentials Saved!');
    }

    async function sha512(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-512', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function submitCode() {
        if(!currentProblem) return alert('Select a problem first!');
        const apiKey = localStorage.getItem('cf_api_key'); const apiSecret = localStorage.getItem('cf_api_secret');
        if(!apiKey || !apiSecret) { alert('Please configure your API Key and Secret first.'); toggleSettings(); return; }
        const code = editor.getValue(); const time = Math.floor(Date.now() / 1000); const rand = Math.floor(Math.random() * 900000) + 100000;
        const params = { apiKey: apiKey, contestId: currentProblem.contestId.toString(), languageId: "54", problemIndex: currentProblem.index, source: code, time: time.toString() };
        const sortedKeys = Object.keys(params).sort();
        let paramString = sortedKeys.map(k => `${k}=${encodeURIComponent(params[k])}`).join('&');
        const sigPlain = `${rand}/problemset.submit?${paramString}#${apiSecret}`;
        const apiSig = `${rand}` + await sha512(sigPlain);
        try {
            const formData = new URLSearchParams();
            for (const key in params) formData.append(key, params[key]);
            formData.append("apiSig", apiSig);
            const res = await fetch("https://codeforces.com/api/problemset.submit", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: formData.toString() });
            const data = await res.json();
            if(data.status === 'OK') { alert('Code submitted successfully! 🎉 Check your Codeforces submissions.'); confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } }); } 
            else { alert('Submission failed: ' + data.comment); }
        } catch (err) { console.error(err); alert('Network error during submission.'); }
    }

    window.onload = () => { initEditor(); renderSidebar(); };
</script>

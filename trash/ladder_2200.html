1 2 2 4 2 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7 5\n3 3 2 1 1 1 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1327, "index": "D", "name": "Infinite Path", "rating": 2200, "solvedCount": 3609, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Infinite Path<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a colored permutation $$$p_1, p_2, \\dots, p_n$$$. The $$$i$$$-th element of the permutation has color $$$c_i$$$.<\/p><p>Let's define an <span class=\"tex-font-style-it\">infinite path<\/span> as infinite sequence $$$i, p[i], p[p[i]], p[p[p[i]]] \\dots$$$ where all elements have <span class=\"tex-font-style-bf\">same color<\/span> ($$$c[i] = c[p[i]] = c[p[p[i]]] = \\dots$$$).<\/p><p>We can also define a multiplication of permutations $$$a$$$ and $$$b$$$ as permutation $$$c = a \\times b$$$ where $$$c[i] = b[a[i]]$$$. Moreover, we can define a power $$$k$$$ of permutation $$$p$$$ as $$$p^k=\\underbrace{p \\times p \\times \\dots \\times p}_{k \\text{ times}}$$$.<\/p><p>Find the minimum $$$k  \\gt  0$$$ such that $$$p^k$$$ has at least one infinite path (i.e. there is a position $$$i$$$ in $$$p^k$$$ such that the sequence starting from $$$i$$$ is an infinite path).<\/p><p>It can be proved that the answer always exists.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains single integer $$$T$$$ ($$$1 \\le T \\le 10^4$$$) \u2014 the number of test cases.<\/p><p>Next $$$3T$$$ lines contain test cases \u2014 one per three lines. The first line contains single integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$) \u2014 the size of the permutation.<\/p><p>The second line contains $$$n$$$ integers $$$p_1, p_2, \\dots, p_n$$$ ($$$1 \\le p_i \\le n$$$, $$$p_i \\neq p_j$$$ for $$$i \\neq j$$$) \u2014 the permutation $$$p$$$.<\/p><p>The third line contains $$$n$$$ integers $$$c_1, c_2, \\dots, c_n$$$ ($$$1 \\le c_i \\le n$$$) \u2014 the colors of elements of the permutation.<\/p><p>It is guaranteed that the total sum of $$$n$$$ doesn't exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$T$$$ integers \u2014 one per test case. For each test case print minimum $$$k  \\gt  0$$$ such that $$$p^k$$$ has at least one infinite path.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n4\n1 3 4 2\n1 2 2 3\n5\n2 3 4 5 1\n1 2 3 4 5\n8\n7 4 5 6 1 8 3 2\n5 3 6 4 7 5 8 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n5\n2\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, $$$p^1 = p = [1, 3, 4, 2]$$$ and the sequence starting from $$$1$$$: $$$1, p[1] = 1, \\dots$$$ is an infinite path.<\/p><p>In the second test case, $$$p^5 = [1, 2, 3, 4, 5]$$$ and it obviously contains several infinite paths.<\/p><p>In the third test case, $$$p^2 = [3, 6, 1, 8, 7, 2, 5, 4]$$$ and the sequence starting from $$$4$$$: $$$4, p^2[4]=8, p^2[8]=4, \\dots$$$ is an infinite path since $$$c_4 = c_8 = 4$$$.<\/p><\/div><\/div>"}, {"contestId": 768, "index": "D", "name": "Jon and Orbs", "rating": 2200, "solvedCount": 3607, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Jon and Orbs<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Jon Snow is on the lookout for some orbs required to defeat the white walkers. There are <span class=\"tex-span\"><i>k<\/i><\/span> different types of orbs and he needs at least one of each. One orb spawns daily at the base of a Weirwood tree north of the wall. The probability of this orb being of any kind is equal. As the north of wall is full of dangers, he wants to know the minimum number of days he should wait before sending a ranger to collect the orbs such that the probability of him getting at least one of each kind of orb is at least <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/eba7f9528c88a90f3ec0c0b5c7b7b6b6b1b68891.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>, where <span class=\"tex-span\">\u03b5\u2009&lt;\u200910<sup class=\"upper-index\">\u2009-\u20097<\/sup><\/span>.<\/p><p>To better prepare himself, he wants to know the answer for <span class=\"tex-span\"><i>q<\/i><\/span> different values of <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. Since he is busy designing the battle strategy with Sam, he asks you for your help.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>First line consists of two space separated integers <span class=\"tex-span\"><i>k<\/i><\/span>, <span class=\"tex-span\"><i>q<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>k<\/i>,\u2009<i>q<\/i>\u2009\u2264\u20091000<\/span>) \u2014 number of different kinds of orbs and number of queries respectively.<\/p><p>Each of the next <span class=\"tex-span\"><i>q<\/i><\/span> lines contain a single integer <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u20091000<\/span>) \u2014 <span class=\"tex-span\"><i>i<\/i><\/span>-th query.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output <span class=\"tex-span\"><i>q<\/i><\/span> lines. On <span class=\"tex-span\"><i>i<\/i><\/span>-th of them output single integer \u2014 answer for <span class=\"tex-span\"><i>i<\/i><\/span>-th query.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>1 1<br/>1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 2<br/>1<br/>2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/>2<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1486, "index": "E", "name": "Paired Payment", "rating": 2200, "solvedCount": 3566, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Paired Payment<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are $$$n$$$ cities and $$$m$$$ bidirectional roads in the country. The roads in the country form an undirected weighted graph. The graph <span class=\"tex-font-style-bf\">is not guaranteed to be connected<\/span>. Each road has it's own parameter $$$w$$$. You can travel through the roads, but the government made a new law: you can only go through two roads at a time (go from city $$$a$$$ to city $$$b$$$ and then from city $$$b$$$ to city $$$c$$$) and you will have to pay $$$(w_{ab} + w_{bc})^2$$$ money to go through those roads. Find out whether it is possible to travel from city $$$1$$$ to every other city $$$t$$$ and what's the minimum amount of money you need to get from $$$1$$$ to $$$t$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>First line contains two integers $$$n$$$, $$$m$$$ ($$$2 \\leq n \\leq 10^5$$$, $$$1 \\leq m \\leq min(\\frac{n \\cdot (n - 1)}{2}, 2 \\cdot 10^5)$$$).<\/p><p>Next $$$m$$$ lines each contain three integers $$$v_i$$$, $$$u_i$$$, $$$w_i$$$ ($$$1 \\leq v_i, u_i \\leq n$$$, $$$1 \\leq w_i \\leq 50$$$, $$$u_i \\neq v_i$$$). It's guaranteed that there are no multiple edges, i.e. for any edge $$$(u_i, v_i)$$$ there are no other edges $$$(u_i, v_i)$$$ or $$$(v_i, u_i)$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For every city $$$t$$$ print one integer. If there is no correct path between $$$1$$$ and $$$t$$$ output $$$-1$$$. Otherwise print out the minimum amount of money needed to travel from $$$1$$$ to $$$t$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 6\n1 2 3\n2 3 4\n3 4 5\n4 5 6\n1 5 1\n2 4 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0 98 49 25 114 <\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 2\n1 2 1\n2 3 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0 -1 9 <\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The graph in the first example looks like this.<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/0f6ea85c20677920788ddf8f117ac8d8b251deca.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>In the second example the path from $$$1$$$ to $$$3$$$ goes through $$$2$$$, so the resulting payment is $$$(1 + 2)^2 = 9$$$.<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/f6d86c0665e5d65381413d035cad13ee0bade386.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><\/div><\/div>"}, {"contestId": 1806, "index": "E", "name": "Tree Master", "rating": 2200, "solvedCount": 3547, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Tree Master<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>1024 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a tree with $$$n$$$ weighted vertices labeled from $$$1$$$ to $$$n$$$ rooted at vertex $$$1$$$. The parent of vertex $$$i$$$ is $$$p_i$$$ and the weight of vertex $$$i$$$ is $$$a_i$$$. For convenience, define $$$p_1=0$$$.<\/p><p>For two vertices $$$x$$$ and $$$y$$$ <span class=\"tex-font-style-bf\">of the same depth$$$^\\dagger$$$<\/span>, define $$$f(x,y)$$$ as follows: <\/p><ul> <li> Initialize $$$\\mathrm{ans}=0$$$. <\/li><li> While both $$$x$$$ and $$$y$$$ are not $$$0$$$: <ul> <li> $$$\\mathrm{ans}\\leftarrow \\mathrm{ans}+a_x\\cdot a_y$$$; <\/li><li> $$$x\\leftarrow p_x$$$; <\/li><li> $$$y\\leftarrow p_y$$$. <\/li><\/ul> <\/li><li> $$$f(x,y)$$$ is the value of $$$\\mathrm{ans}$$$. <\/li><\/ul><p>You will process $$$q$$$ queries. In the $$$i$$$-th query, you are given two integers $$$x_i$$$ and $$$y_i$$$ and you need to calculate $$$f(x_i,y_i)$$$.<\/p><p>$$$^\\dagger$$$ The depth of vertex $$$v$$$ is the number of edges on the unique simple path from the root of the tree to vertex $$$v$$$. <\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$q$$$ ($$$2 \\le n \\le 10^5$$$; $$$1 \\le q \\le 10^5$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le 10^5$$$).<\/p><p>The third line contains $$$n-1$$$ integers $$$p_2, \\ldots, p_n$$$ ($$$1 \\le p_i  \\lt  i$$$).<\/p><p>Each of the next $$$q$$$ lines contains two integers $$$x_i$$$ and $$$y_i$$$ ($$$1\\le x_i,y_i\\le n$$$). It is guaranteed that $$$x_i$$$ and $$$y_i$$$ are of the same depth.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output $$$q$$$ lines, the $$$i$$$-th line contains a single integer, the value of $$$f(x_i,y_i)$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 2\n1 5 2 3 1 1\n1 2 3 3 2\n4 5\n6 6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n33\n27\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n14 8\n3 2 5 3 1 4 2 2 2 5 5 5 2 4\n1 2 3 1 1 4 7 3 3 1 5 3 8\n4 4\n4 10\n13 10\n3 12\n13 9\n3 12\n9 10\n11 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n47\n53\n48\n36\n42\n36\n48\n14\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Consider the first example:<\/p><p>In the first query, the answer is $$$a_4\\cdot a_5+a_3\\cdot a_3+a_2\\cdot a_2+a_1\\cdot a_1=3+4+25+1=33$$$.<\/p><p>In the second query, the answer is $$$a_6\\cdot a_6+a_2\\cdot a_2+a_1\\cdot a_1=1+25+1=27$$$.<\/p><\/div><\/div>"}, {"contestId": 1788, "index": "E", "name": "Sum Over Zero", "rating": 2200, "solvedCount": 3511, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Sum Over Zero<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a_1, a_2, \\ldots, a_n$$$ of $$$n$$$ integers. Consider $$$S$$$ as a set of segments satisfying the following conditions.<\/p><ul> <li> Each element of $$$S$$$ should be in form $$$[x, y]$$$, where $$$x$$$ and $$$y$$$ are integers between $$$1$$$ and $$$n$$$, inclusive, and $$$x \\leq y$$$. <\/li><li> No two segments in $$$S$$$ intersect with each other. Two segments $$$[a, b]$$$ and $$$[c, d]$$$ intersect if and only if there exists an integer $$$x$$$ such that $$$a \\leq x \\leq b$$$ and $$$c \\leq x \\leq d$$$. <\/li><li> For each $$$[x, y]$$$ in $$$S$$$, $$$a_x+a_{x+1}+ \\ldots +a_y \\geq 0$$$. <\/li><\/ul><p>The length of the segment $$$[x, y]$$$ is defined as $$$y-x+1$$$. $$$f(S)$$$ is defined as the sum of the lengths of every element in $$$S$$$. In a formal way, $$$f(S) = \\sum_{[x, y] \\in S} (y - x + 1)$$$. Note that if $$$S$$$ is empty, $$$f(S)$$$ is $$$0$$$.<\/p><p>What is the maximum $$$f(S)$$$ among all possible $$$S$$$?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$1 \\leq n \\leq 2 \\cdot 10^5$$$).<\/p><p>The next line is followed by $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$-10^9 \\leq a_i \\leq 10^9$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer, the maximum $$$f(S)$$$ among every possible $$$S$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n3 -3 -2 5 -4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n10\n5 -2 -4 -6 2 3 -6 5 3 -2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n9<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n-1 -2 -3 -4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, $$$S=\\{[1, 2], [4, 5]\\}$$$ can be a possible $$$S$$$ because $$$a_1+a_2=0$$$ and $$$a_4+a_5=1$$$. $$$S=\\{[1, 4]\\}$$$ can also be a possible solution.<\/p><p>Since there does not exist any $$$S$$$ that satisfies $$$f(S)  \\gt  4$$$, the answer is $$$4$$$.<\/p><p>In the second example, $$$S=\\{[1, 9]\\}$$$ is the only set that satisfies $$$f(S)=9$$$. Since every possible $$$S$$$ satisfies $$$f(S) \\leq 9$$$, the answer is $$$9$$$.<\/p><p>In the third example, $$$S$$$ can only be an empty set, so the answer is $$$0$$$.<\/p><\/div><\/div>"}, {"contestId": 1338, "index": "C", "name": "Perfect Triples", "rating": 2200, "solvedCount": 3502, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Perfect Triples<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Consider the infinite sequence $$$s$$$ of positive integers, created by repeating the following steps:<\/p><ol> <li> Find the lexicographically smallest triple of positive integers $$$(a, b, c)$$$ such that <ul> <li> $$$a \\oplus b \\oplus c = 0$$$, where $$$\\oplus$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#XOR\">bitwise XOR operation<\/a>. <\/li><li> $$$a$$$, $$$b$$$, $$$c$$$ are not in $$$s$$$. <\/li><\/ul> Here triple of integers $$$(a_1, b_1, c_1)$$$ is considered to be lexicographically smaller than triple $$$(a_2, b_2, c_2)$$$ if sequence $$$[a_1, b_1, c_1]$$$ is lexicographically smaller than sequence $$$[a_2, b_2, c_2]$$$. <\/li><li> Append $$$a$$$, $$$b$$$, $$$c$$$ to $$$s$$$ in this order. <\/li><li> Go back to the first step. <\/li><\/ol><p>You have integer $$$n$$$. Find the $$$n$$$-th element of $$$s$$$.<\/p><p>You have to answer $$$t$$$ independent test cases.<\/p><p>A sequence $$$a$$$ is lexicographically smaller than a sequence $$$b$$$ if in the first position where $$$a$$$ and $$$b$$$ differ, the sequence $$$a$$$ has a smaller element than the corresponding element in $$$b$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^5$$$)\u00a0\u2014 the number of test cases.<\/p><p>Each of the next $$$t$$$ lines contains a single integer $$$n$$$ ($$$1\\le n \\le 10^{16}$$$)\u00a0\u2014 the position of the element you want to know.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In each of the $$$t$$$ lines, output the answer to the corresponding test case.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n9\n1\n2\n3\n4\n5\n6\n7\n8\n9\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n2\n3\n4\n8\n12\n5\n10\n15\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The first elements of $$$s$$$ are $$$1, 2, 3, 4, 8, 12, 5, 10, 15, \\dots $$$<\/p><\/div><\/div>"}, {"contestId": 2112, "index": "E", "name": "Tree Colorings", "rating": 2200, "solvedCount": 3489, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Tree Colorings<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Consider a rooted undirected tree. Each vertex can be colored blue, green, or yellow. A coloring is called <span class=\"tex-font-style-it\">beautiful<\/span> if it meets these conditions: <\/p><ul> <li> the root of the tree is green; <\/li><li> if you consider <span class=\"tex-font-style-bf\">all blue and green vertices<\/span>, they are reachable from each other without passing through any <span class=\"tex-font-style-bf\">yellow<\/span> vertices; <\/li><li> if you consider <span class=\"tex-font-style-bf\">all yellow and green vertices<\/span>, they are reachable from each other without passing through any <span class=\"tex-font-style-bf\">blue<\/span> vertices; <\/li><\/ul><p>You are given an integer $$$m$$$. Your task is to calculate the minimum number of vertices in a tree with <span class=\"tex-font-style-bf\">exactly<\/span> $$$m$$$ <span class=\"tex-font-style-it\">beautiful<\/span> colorings.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer ($$$1 \\le t \\le 10^5$$$)\u00a0\u2014 the number of test cases.<\/p><p>The only line of each test case contains a single integer $$$m$$$ ($$$1 \\le m \\le 5 \\cdot 10^5$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print a single integer\u00a0\u2014 the minimum number of vertices in a tree with <span class=\"tex-font-style-bf\">exactly<\/span> $$$m$$$ <span class=\"tex-font-style-it\">beautiful<\/span> colorings. If such a tree does not exist, print $$$-1$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">9<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n2\n3\n4\n3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the following notes, let $$$g$$$ describe green color, $$$b$$$ be blue, and $$$y$$$ be yellow.<\/p><p>In the first example, consider a simple tree with just $$$1$$$ vertex. This tree has exactly $$$1$$$ beautiful coloring: the root is green.<\/p><p>In the second example, consider a simple tree with $$$2$$$ vertices with a root at the $$$1$$$-st vertex. There are exactly $$$3$$$ beautiful colorings: $$$[g, g]$$$, $$$[g, b]$$$ and $$$[g, y]$$$.<\/p><p>In the third example, consider a bamboo tree with $$$3$$$ vertices with a root at the $$$1$$$-st vertex. There are exactly $$$5$$$ beautiful colorings: $$$[g, g, g]$$$, $$$[g, g, b]$$$, $$$[g, g, y]$$$, $$$[g, b, b]$$$ and $$$[g, y, y]$$$.<\/p><p>In the fifth example, consider a tree with $$$3$$$ vertices with a root at the $$$1$$$-st vertex, and the other $$$2$$$ vertices connected to it. There are exactly $$$9$$$ beautiful colorings: $$$[g, g, g]$$$, $$$[g, g, b]$$$, $$$[g, g, y]$$$, $$$[g, b, g]$$$, $$$[g, b, b]$$$, $$$[g, b, y]$$$, $$$[g, y, g]$$$, $$$[g, y, b]$$$ and $$$[g, y, y]$$$.<\/p><\/div><\/div>"}, {"contestId": 25, "index": "E", "name": "Test", "rating": 2200, "solvedCount": 3469, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Test<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Sometimes it is hard to prepare tests for programming problems. Now Bob is preparing tests to new problem about strings \u2014 input data to his problem is one string. Bob has 3 wrong solutions to this problem. The first gives the wrong answer if the input data contains the substring <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\">1<\/sub><\/span>, the second enters an infinite loop if the input data contains the substring <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\">2<\/sub><\/span>, and the third requires too much memory if the input data contains the substring <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\">3<\/sub><\/span>. Bob wants these solutions to fail single test. What is the minimal length of test, which couldn't be passed by all three Bob's solutions?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>There are exactly 3 lines in the input data. The <span class=\"tex-span\"><i>i<\/i><\/span>-th line contains string <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. All the strings are non-empty, consists of lowercase Latin letters, the length of each string doesn't exceed <span class=\"tex-span\">10<sup class=\"upper-index\">5<\/sup><\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output one number \u2014 what is minimal length of the string, containing <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\">1<\/sub><\/span>, <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\">2<\/sub><\/span> and <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\">3<\/sub><\/span> as substrings.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>ab<br/>bc<br/>cd<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>abacaba<br/>abaaba<br/>x<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>11<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1092, "index": "D2", "name": "Great Vova Wall (Version 2)", "rating": 2200, "solvedCount": 3452, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D2. Great Vova Wall (Version 2)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Vova's family is building the Great Vova Wall (named by Vova himself). Vova's parents, grandparents, grand-grandparents contributed to it. Now it's totally up to Vova to put the finishing touches.<\/p><p>The current state of the wall can be respresented by a sequence $$$a$$$ of $$$n$$$ integers, with $$$a_i$$$ being the height of the $$$i$$$-th part of the wall.<\/p><p>Vova can only use $$$2 \\times 1$$$ bricks to put in the wall (he has infinite supply of them, however).<\/p><p>Vova can put bricks <span class=\"tex-font-style-bf\">only horizontally<\/span> on the neighbouring parts of the wall of equal height. It means that if for some $$$i$$$ the current height of part $$$i$$$ is the same as for part $$$i + 1$$$, then Vova can put a brick there and thus increase both heights by 1. Obviously, Vova can't put bricks in such a way that its parts turn out to be off the borders (to the left of part $$$1$$$ of the wall or to the right of part $$$n$$$ of it).<\/p><p><span class=\"tex-font-style-bf\">Note that Vova can't put bricks vertically.<\/span><\/p><p>Vova is a perfectionist, so he considers the wall completed when:<\/p><ul> <li> all parts of the wall has the same height; <\/li><li> the wall has no empty spaces inside it. <\/li><\/ul><p>Can Vova complete the wall using any amount of bricks (possibly zero)?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$) \u2014 the number of parts in the wall.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$) \u2014 the initial heights of the parts of the wall.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print \"<span class=\"tex-font-style-tt\">YES<\/span>\" if Vova can complete the wall using any amount of bricks (possibly zero).<\/p><p>Print \"<span class=\"tex-font-style-tt\">NO<\/span>\" otherwise.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n2 1 1 2 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n4 5 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nNO\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n10 10\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example Vova can put a brick on parts 2 and 3 to make the wall $$$[2, 2, 2, 2, 5]$$$ and then put 3 bricks on parts 1 and 2 and 3 bricks on parts 3 and 4 to make it $$$[5, 5, 5, 5, 5]$$$.<\/p><p>In the second example Vova can put no bricks in the wall.<\/p><p>In the third example the wall is already complete.<\/p><\/div><\/div>"}, {"contestId": 1520, "index": "F2", "name": "Guess the K-th Zero (Hard version)", "rating": 2200, "solvedCount": 3445, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F2. Guess the K-th Zero (Hard version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is an interactive problem.<\/span><\/p><p><span class=\"tex-font-style-bf\">This is a hard version of the problem. The difference from the easy version is that in the hard version $$$1 \\le t \\le \\min(n, 10^4)$$$ and the total number of queries is limited to $$$6 \\cdot 10^4$$$.<\/span><\/p><p>Polycarp is playing a computer game. In this game, an array consisting of zeros and ones is hidden. Polycarp wins if he guesses the position of the $$$k$$$-th zero from the left $$$t$$$ times.<\/p><p>Polycarp can make no more than $$$6 \\cdot 10^4$$$ requests totally of the following type: <\/p><ul> <li> <span class=\"tex-font-style-tt\">?<\/span> $$$l$$$ $$$r$$$\u00a0\u2014 find out the sum of all elements in positions from $$$l$$$ to $$$r$$$ ($$$1 \\le l \\le r \\le n$$$) inclusive. <\/li><\/ul><p>To make the game more interesting, each guessed zero turns into one and the game continues on the changed array. More formally, if the position of the $$$k$$$-th zero was $$$x$$$, then after Polycarp guesses this position, the $$$x$$$-th element of the array will be replaced from $$$0$$$ to $$$1$$$.<\/p><p>Help Polycarp win the game.<\/p><\/div><div><div class=\"section-title\">Interaction<\/div><p>First, your program must read two integers $$$n$$$ and $$$t$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$, $$$1 \\le t \\le \\min(n, 10^4)$$$).<\/p><p>Then $$$t$$$ lines follow, each of which contains one integer $$$k$$$ ($$$1 \\le k \\le n$$$). It is guaranteed that at the moment of the request the array contains at least $$$k$$$ zeros. In order to get the next value of $$$k$$$, you must output the answer for the previous value of $$$k$$$.<\/p><p>After that, you can make no more than $$$6 \\cdot 10^4$$$ requests in total.<\/p><p>Use the following format to output the answer (it is not a request, it doesn't count in $$$6 \\cdot 10^4$$$): <\/p><ul> <li> <span class=\"tex-font-style-tt\">!<\/span> $$$x$$$\u00a0\u2014 position of the $$$k$$$-th zero. <\/li><\/ul><p>Positions in the array are numbered from left to right from $$$1$$$ to $$$n$$$ inclusive.<\/p><p>After printing $$$t$$$ answers, your program should exit immediately.<\/p><p>In this task, the interactor is <span class=\"tex-font-style-bf\">not adaptive<\/span>. This means that within the same test, the hidden array and the queries <span class=\"tex-font-style-bf\">do not change<\/span>.<\/p><p>In case of an incorrect query, <span class=\"tex-font-style-tt\">-1<\/span> will be displayed. When this value is received, your program must immediately exit normally (for example, by calling <span class=\"tex-font-style-tt\">exit(0)<\/span>), otherwise, the testing system may issue an arbitrary verdict.<\/p><p>If the number of requests is exceeded, the verdict <span class=\"tex-font-style-it\">wrong answer<\/span> will be displayed.<\/p><p>Your solution may get the verdict <span class=\"tex-font-style-it\">Idleness limit exceeded<\/span> if you don't print anything or forget to flush the output buffer.<\/p><p>To flush the output buffer, you need to do the following immediately after the query output and the end-of-line character:<\/p><ul> <li> <span class=\"tex-font-style-tt\">fflush(stdout)<\/span> or <span class=\"tex-font-style-tt\">cout.flush()<\/span> in C ++; <\/li><li> <span class=\"tex-font-style-tt\">System.out.flush()<\/span> in Java; <\/li><li> <span class=\"tex-font-style-tt\">flush(output)<\/span> in Pascal; <\/li><li> <span class=\"tex-font-style-tt\">stdout.flush()<\/span> in Python; <\/li><li> see the documentation for other languages. <\/li><\/ul><p><span class=\"tex-font-style-bf\">Hacks<\/span><\/p><p>Use the following format for hacks:<\/p><p>On the first line print the string $$$s$$$ ($$$1 \\le |s| \\le 2 \\cdot 10^5$$$), consisting of zeros and ones, and an integer $$$t$$$ ($$$1 \\le t \\le \\min(|s|, 10^4)$$$)\u00a0\u2014 hidden array and number of requests, respectively. In the next $$$t$$$ lines output the number $$$k$$$ ($$$1 \\le k \\le |s|$$$).<\/p><p>The hacked solution will not have direct access to the hidden array.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 2\n\n2\n\n2\n\n1\n\n1\n\n0\n\n1\n\n0<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n? 4 6\n\n? 1 1\n\n? 1 2\n\n? 5 5\n\n! 5\n\n? 2 2\n\n! 2\n\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test, the array $$$[1, 0, 1, 1, 0, 1]$$$ is hidden. After answering the query $$$k=2$$$, the array changed to $$$[1, 0, 1, 1, 1, 1]$$$.<\/p><\/div><\/div>"}, {"contestId": 1154, "index": "G", "name": "Minimum Possible LCM", "rating": 2200, "solvedCount": 3429, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. Minimum Possible LCM<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>1024 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ consisting of $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$.<\/p><p>Your problem is to find such pair of indices $$$i, j$$$ ($$$1 \\le i  \\lt  j \\le n$$$) that $$$lcm(a_i, a_j)$$$ is minimum possible.<\/p><p>$$$lcm(x, y)$$$ is the least common multiple of $$$x$$$ and $$$y$$$ (minimum positive number such that both $$$x$$$ and $$$y$$$ are divisors of this number).<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains one integer $$$n$$$ ($$$2 \\le n \\le 10^6$$$) \u2014 the number of elements in $$$a$$$.<\/p><p>The second line of the input contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^7$$$), where $$$a_i$$$ is the $$$i$$$-th element of $$$a$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print two integers $$$i$$$ and $$$j$$$ ($$$1 \\le i  \\lt  j \\le n$$$) such that the value of $$$lcm(a_i, a_j)$$$ is minimum among all valid pairs $$$i, j$$$. If there are multiple answers, you can print any.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n2 4 8 3 6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n5 2 11 3 7\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2 4\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n2 5 10 1 10 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 4\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1552, "index": "F", "name": "Telepanting", "rating": 2200, "solvedCount": 3422, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Telepanting<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>An ant moves on the real line with constant speed of $$$1$$$ unit per second. It starts at $$$0$$$ and always moves to the right (so its position increases by $$$1$$$ each second).<\/p><p>There are $$$n$$$ portals, the $$$i$$$-th of which is located at position $$$x_i$$$ and teleports to position $$$y_i  \\lt  x_i$$$. Each portal can be either <span class=\"tex-font-style-it\">active<\/span> or <span class=\"tex-font-style-it\">inactive<\/span>. The initial state of the $$$i$$$-th portal is determined by $$$s_i$$$: if $$$s_i=0$$$ then the $$$i$$$-th portal is initially inactive, if $$$s_i=1$$$ then the $$$i$$$-th portal is initially active. When the ant travels through a portal (i.e., when its position coincides with the position of a portal): <\/p><ul> <li> if the portal is inactive, it becomes active (in this case the path of the ant is not affected); <\/li><li> if the portal is active, it becomes inactive and the ant is instantly teleported to the position $$$y_i$$$, where it keeps on moving as normal. <\/li><\/ul><p>How long (from the instant it starts moving) does it take for the ant to reach the position $$$x_n + 1$$$? It can be shown that this happens in a finite amount of time. Since the answer may be very large, compute it modulo $$$998\\,244\\,353$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains the integer $$$n$$$ ($$$1\\le n\\le 2\\cdot 10^5$$$) \u2014 the number of portals.<\/p><p>The $$$i$$$-th of the next $$$n$$$ lines contains three integers $$$x_i$$$, $$$y_i$$$ and $$$s_i$$$ ($$$1\\le y_i  \\lt  x_i\\le 10^9$$$, $$$s_i\\in\\{0,1\\}$$$) \u2014 the position of the $$$i$$$-th portal, the position where the ant is teleported when it travels through the $$$i$$$-th portal (if it is active), and the initial state of the $$$i$$$-th portal.<\/p><p>The positions of the portals are strictly increasing, that is $$$x_1 \\lt x_2 \\lt \\cdots \\lt x_n$$$. It is guaranteed that the $$$2n$$$ integers $$$x_1, \\, x_2, \\, \\dots, \\, x_n, \\, y_1, \\, y_2, \\, \\dots, \\, y_n$$$ are all distinct.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output the amount of time elapsed, in seconds, from the instant the ant starts moving to the instant it reaches the position $$$x_n+1$$$. Since the answer may be very large, output it modulo $$$998\\,244\\,353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n3 2 0\n6 5 1\n7 4 0\n8 1 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n23\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1\n454971987 406874902 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n503069073\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n243385510 42245605 0\n644426565 574769163 0\n708622105 208990040 0\n786625660 616437691 0\n899754846 382774619 0\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n899754847\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n200000000 100000000 1\n600000000 400000000 0\n800000000 300000000 0\n900000000 700000000 1\n1000000000 500000000 0\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3511295\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p><span class=\"tex-font-style-bf\">Explanation of the first sample:<\/span> The ant moves as follows (a curvy arrow denotes a teleporting, a straight arrow denotes normal movement with speed $$$1$$$ and the time spent during the movement is written above the arrow). $$$$$$ 0 \\stackrel{6}{\\longrightarrow} 6 \\leadsto 5 \\stackrel{3}{\\longrightarrow} 8 \\leadsto 1 \\stackrel{2}{\\longrightarrow} 3 \\leadsto 2 \\stackrel{4}{\\longrightarrow} 6 \\leadsto 5 \\stackrel{2}{\\longrightarrow} 7 \\leadsto 4 \\stackrel{2}{\\longrightarrow} 6 \\leadsto 5 \\stackrel{4}{\\longrightarrow} 9 $$$$$$ Notice that the total time is $$$6+3+2+4+2+2+4=23$$$.<\/p><p><span class=\"tex-font-style-bf\">Explanation of the second sample:<\/span> The ant moves as follows (a curvy arrow denotes a teleporting, a straight arrow denotes normal movement with speed $$$1$$$ and the time spent during the movement is written above the arrow). $$$$$$ 0 \\stackrel{454971987}{\\longrightarrow} 454971987 \\leadsto 406874902 \\stackrel{48097086}{\\longrightarrow} 454971988 $$$$$$ Notice that the total time is $$$454971987+48097086=503069073$$$.<\/p><p><span class=\"tex-font-style-bf\">Explanation of the third sample:<\/span> Since all portals are initially off, the ant will not be teleported and will go straight from $$$0$$$ to $$$x_n+1=899754846+1=899754847$$$.<\/p><\/div><\/div>"}, {"contestId": 1196, "index": "F", "name": "K-th Path", "rating": 2200, "solvedCount": 3415, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. K-th Path<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a connected undirected weighted graph consisting of $$$n$$$ vertices and $$$m$$$ edges.<\/p><p>You need to print the $$$k$$$-th smallest shortest path in this graph (paths from the vertex to itself are not counted, paths from $$$i$$$ to $$$j$$$ and from $$$j$$$ to $$$i$$$ are counted as one).<\/p><p>More formally, if $$$d$$$ is the matrix of shortest paths, where $$$d_{i, j}$$$ is the length of the shortest path between vertices $$$i$$$ and $$$j$$$ ($$$1 \\le i  \\lt  j \\le n$$$), then you need to print the $$$k$$$-th element in the sorted array consisting of all $$$d_{i, j}$$$, where $$$1 \\le i  \\lt  j \\le n$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains three integers $$$n, m$$$ and $$$k$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$, $$$n - 1 \\le m \\le \\min\\Big(\\frac{n(n-1)}{2}, 2 \\cdot 10^5\\Big)$$$, $$$1 \\le k \\le \\min\\Big(\\frac{n(n-1)}{2}, 400\\Big)$$$\u00a0\u2014 the number of vertices in the graph, the number of edges in the graph and the value of $$$k$$$, correspondingly.<\/p><p>Then $$$m$$$ lines follow, each containing three integers $$$x$$$, $$$y$$$ and $$$w$$$ ($$$1 \\le x, y \\le n$$$, $$$1 \\le w \\le 10^9$$$, $$$x \\ne y$$$) denoting an edge between vertices $$$x$$$ and $$$y$$$ of weight $$$w$$$.<\/p><p>It is guaranteed that the given graph is <span class=\"tex-font-style-bf\">connected<\/span> (there is a path between any pair of vertices), there are no self-loops (edges connecting the vertex with itself) and multiple edges (for each pair of vertices $$$x$$$ and $$$y$$$, there is at most one edge between this pair of vertices in the graph).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer\u00a0\u2014 the length of the $$$k$$$-th smallest shortest path in the given graph (paths from the vertex to itself are not counted, paths from $$$i$$$ to $$$j$$$ and from $$$j$$$ to $$$i$$$ are counted as one).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 10 5\n2 5 1\n5 3 9\n6 2 2\n1 3 1\n5 1 8\n6 5 10\n1 6 5\n6 4 6\n3 6 2\n3 4 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7 15 18\n2 6 3\n5 7 4\n6 5 4\n3 6 9\n6 7 7\n1 6 4\n7 1 6\n7 2 1\n4 3 2\n3 2 8\n5 3 6\n2 5 5\n3 7 9\n4 1 8\n2 1 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n9\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1630, "index": "C", "name": "Paint the Middle", "rating": 2200, "solvedCount": 3409, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Paint the Middle<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given $$$n$$$ elements numbered from $$$1$$$ to $$$n$$$, the element $$$i$$$ has value $$$a_i$$$ and color $$$c_i$$$, initially, $$$c_i = 0$$$ for all $$$i$$$.<\/p><p>The following operation can be applied:<\/p><ul> <li> Select three elements $$$i$$$, $$$j$$$ and $$$k$$$ ($$$1 \\leq i  \\lt  j  \\lt  k \\leq n$$$), such that $$$c_i$$$, $$$c_j$$$ and $$$c_k$$$ are all equal to $$$0$$$ and $$$a_i = a_k$$$, then set $$$c_j = 1$$$. <\/li><\/ul><p>Find the maximum value of $$$\\sum\\limits_{i=1}^n{c_i}$$$ that can be obtained after applying the given operation any number of times.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$n$$$ ($$$3 \\leq n \\leq 2 \\cdot 10^5$$$) \u2014 the number of elements.<\/p><p>The second line consists of $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\leq a_i \\leq n$$$), where $$$a_i$$$ is the value of the $$$i$$$-th element.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer in a line \u2014 the maximum value of $$$\\sum\\limits_{i=1}^n{c_i}$$$ that can be obtained after applying the given operation any number of times.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7\n1 2 1 2 7 4 7\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n13\n1 2 3 2 1 3 3 4 5 5 5 4 7\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n7\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test, it is possible to apply the following operations in order:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/75e54064da1ae40845ab071fdff8cbcb18b269d4.png\" style=\"zoom: 100.0%;max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 1303, "index": "E", "name": "Erase Subsequences", "rating": 2200, "solvedCount": 3379, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Erase Subsequences<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a string $$$s$$$. You can build new string $$$p$$$ from $$$s$$$ using the following operation <span class=\"tex-font-style-bf\">no more than two times<\/span>: <\/p><ol> <li> choose any subsequence $$$s_{i_1}, s_{i_2}, \\dots, s_{i_k}$$$ where $$$1 \\le i_1  \\lt  i_2  \\lt  \\dots  \\lt  i_k \\le |s|$$$; <\/li><li> erase the chosen subsequence from $$$s$$$ ($$$s$$$ can become empty); <\/li><li> concatenate chosen subsequence to the right of the string $$$p$$$ (in other words, $$$p = p + s_{i_1}s_{i_2}\\dots s_{i_k}$$$). <\/li><\/ol><p>Of course, initially the string $$$p$$$ is empty. <\/p><p>For example, let $$$s = \\text{ababcd}$$$. At first, let's choose subsequence $$$s_1 s_4 s_5 = \\text{abc}$$$ \u2014 we will get $$$s = \\text{bad}$$$ and $$$p = \\text{abc}$$$. At second, let's choose $$$s_1 s_2 = \\text{ba}$$$ \u2014 we will get $$$s = \\text{d}$$$ and $$$p = \\text{abcba}$$$. So we can build $$$\\text{abcba}$$$ from $$$\\text{ababcd}$$$.<\/p><p>Can you build a given string $$$t$$$ using the algorithm above?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains the single integer $$$T$$$ ($$$1 \\le T \\le 100$$$) \u2014 the number of test cases.<\/p><p>Next $$$2T$$$ lines contain test cases \u2014 two per test case. The first line contains string $$$s$$$ consisting of lowercase Latin letters ($$$1 \\le |s| \\le 400$$$) \u2014 the initial string.<\/p><p>The second line contains string $$$t$$$ consisting of lowercase Latin letters ($$$1 \\le |t| \\le |s|$$$) \u2014 the string you'd like to build.<\/p><p><span class=\"tex-font-style-it\">It's guaranteed that the total length of strings $$$s$$$ doesn't exceed $$$400$$$.<\/span><\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$T$$$ answers \u2014 one per test case. Print <span class=\"tex-font-style-tt\">YES<\/span> (case insensitive) if it's possible to build $$$t$$$ and <span class=\"tex-font-style-tt\">NO<\/span> (case insensitive) otherwise.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\nababcd\nabcba\na\nb\ndefi\nfed\nxyz\nx\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nNO\nNO\nYES\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 813, "index": "E", "name": "Army Creation", "rating": 2200, "solvedCount": 3355, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Army Creation<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>As you might remember from our previous rounds, Vova really likes computer games. Now he is playing a strategy game known as Rage of Empires.<\/p><p>In the game Vova can hire <span class=\"tex-span\"><i>n<\/i><\/span> different warriors; <span class=\"tex-span\"><i>i<\/i><\/span>th warrior has the type <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. Vova wants to create a <span class=\"tex-font-style-it\">balanced<\/span> army hiring some subset of warriors. An army is called <span class=\"tex-font-style-it\">balanced<\/span> if for each type of warrior present in the game there are not more than <span class=\"tex-span\"><i>k<\/i><\/span> warriors of this type in the army. Of course, Vova wants his army to be as large as possible.<\/p><p>To make things more complicated, Vova has to consider <span class=\"tex-span\"><i>q<\/i><\/span> different plans of creating his army. <span class=\"tex-span\"><i>i<\/i><\/span>th plan allows him to hire only warriors whose numbers are not less than <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and not greater than <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>.<\/p><p>Help Vova to determine the largest size of a <span class=\"tex-font-style-it\">balanced<\/span> army for each plan.<\/p><p><span class=\"tex-font-style-bf\">Be aware that the plans are given in a modified way. See input section for details.<\/span><\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>k<\/i>\u2009\u2264\u2009100000<\/span>).<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub><\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">2<\/sub><\/span>, ... <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009100000<\/span>).<\/p><p>The third line contains one integer <span class=\"tex-span\"><i>q<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>q<\/i>\u2009\u2264\u2009100000<\/span>).<\/p><p>Then <span class=\"tex-span\"><i>q<\/i><\/span> lines follow. <span class=\"tex-span\"><i>i<\/i><\/span>th line contains two numbers <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> which represent <span class=\"tex-span\"><i>i<\/i><\/span>th plan (<span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>).<\/p><p>You have to keep track of the answer to the last plan (let's call it <span class=\"tex-span\"><i>last<\/i><\/span>). In the beginning <span class=\"tex-span\"><i>last<\/i>\u2009=\u20090<\/span>. Then to restore values of <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> for the <span class=\"tex-span\"><i>i<\/i><\/span>th plan, you have to do the following:<\/p><ol> <li> <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009=\u2009((<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009+\u2009<i>last<\/i>)\u00a0<i>mod<\/i>\u00a0<i>n<\/i>)\u2009+\u20091<\/span>; <\/li><li> <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009=\u2009((<i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009+\u2009<i>last<\/i>)\u00a0<i>mod<\/i>\u00a0<i>n<\/i>)\u2009+\u20091<\/span>; <\/li><li> If <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009&gt;\u2009<i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, swap <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. <\/li><\/ol><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>q<\/i><\/span> numbers. <span class=\"tex-span\"><i>i<\/i><\/span>th number must be equal to the maximum size of a <span class=\"tex-font-style-it\">balanced<\/span> army when considering <span class=\"tex-span\"><i>i<\/i><\/span>th plan.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>6 2<br/>1 1 1 2 2 2<br/>5<br/>1 6<br/>4 3<br/>1 1<br/>2 6<br/>2 6<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/>4<br/>1<br/>3<br/>2<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example the real plans are: <\/p><ol> <li> <span class=\"tex-span\">1\u00a02<\/span> <\/li><li> <span class=\"tex-span\">1\u00a06<\/span> <\/li><li> <span class=\"tex-span\">6\u00a06<\/span> <\/li><li> <span class=\"tex-span\">2\u00a04<\/span> <\/li><li> <span class=\"tex-span\">4\u00a06<\/span> <\/li><\/ol><\/div><\/div>"}, {"contestId": 1097, "index": "D", "name": "Makoto and a Blackboard", "rating": 2200, "solvedCount": 3354, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Makoto and a Blackboard<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Makoto has a big blackboard with a positive integer $$$n$$$ written on it. He will perform the following action exactly $$$k$$$ times:<\/p><p>Suppose the number currently written on the blackboard is $$$v$$$. He will randomly pick one of the divisors of $$$v$$$ (possibly $$$1$$$ and $$$v$$$) and replace $$$v$$$ with this divisor. As Makoto uses his famous random number generator (RNG) and as he always uses $$$58$$$ as his generator seed, each divisor is guaranteed to be chosen with equal probability.<\/p><p>He now wonders what is the expected value of the number written on the blackboard after $$$k$$$ steps.<\/p><p>It can be shown that this value can be represented as $$$\\frac{P}{Q}$$$ where $$$P$$$ and $$$Q$$$ are coprime integers and $$$Q \\not\\equiv 0 \\pmod{10^9+7}$$$. Print the value of $$$P \\cdot Q^{-1}$$$ modulo $$$10^9+7$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line of the input contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\leq n \\leq 10^{15}$$$, $$$1 \\leq k \\leq 10^4$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u2014 the expected value of the number on the blackboard after $$$k$$$ steps as $$$P \\cdot Q^{-1} \\pmod{10^9+7}$$$ for $$$P$$$, $$$Q$$$ defined above.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n875000008\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n60 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n237178099\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, after one step, the number written on the blackboard is $$$1$$$, $$$2$$$, $$$3$$$ or $$$6$$$ \u2014 each occurring with equal probability. Hence, the answer is $$$\\frac{1+2+3+6}{4}=3$$$.<\/p><p>In the second example, the answer is equal to $$$1 \\cdot \\frac{9}{16}+2 \\cdot \\frac{3}{16}+3 \\cdot \\frac{3}{16}+6 \\cdot \\frac{1}{16}=\\frac{15}{8}$$$.<\/p><\/div><\/div>"}, {"contestId": 1305, "index": "E", "name": "Kuroni and the Score Distribution", "rating": 2200, "solvedCount": 3305, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Kuroni and the Score Distribution<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Kuroni is the coordinator of the next Mathforces round written by the \"Proof by AC\" team. All the preparation has been done, and he is discussing with the team about the score distribution for the round.<\/p><p>The round consists of $$$n$$$ problems, numbered from $$$1$$$ to $$$n$$$. The problems are ordered in increasing order of difficulty, no two problems have the same difficulty. A score distribution for the round can be denoted by an array $$$a_1, a_2, \\dots, a_n$$$, where $$$a_i$$$ is the score of $$$i$$$-th problem. <\/p><p>Kuroni thinks that the score distribution should satisfy the following requirements:<\/p><ul> <li> The score of each problem should be a positive integer not exceeding $$$10^9$$$. <\/li><li> A harder problem should grant a strictly higher score than an easier problem. In other words, $$$1 \\leq a_1  \\lt  a_2  \\lt  \\dots  \\lt  a_n \\leq 10^9$$$. <\/li><li> The <span class=\"tex-font-style-bf\">balance<\/span> of the score distribution, defined as the number of triples $$$(i, j, k)$$$ such that $$$1 \\leq i  \\lt  j  \\lt  k \\leq n$$$ and $$$a_i + a_j = a_k$$$, should be exactly $$$m$$$. <\/li><\/ul><p>Help the team find a score distribution that satisfies Kuroni's requirement. In case such a score distribution does not exist, output $$$-1$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first and single line contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\le n \\le 5000$$$, $$$0 \\leq m \\leq 10^9$$$)\u00a0\u2014 the number of problems and the required balance.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If there is no solution, print a single integer $$$-1$$$.<\/p><p>Otherwise, print a line containing $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$, representing a score distribution that satisfies all the requirements. If there are multiple answers, print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4 5 9 13 18<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n8 0\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n10 11 12 13 14 15 16 17\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 10\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n-1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, there are $$$3$$$ triples $$$(i, j, k)$$$ that contribute to the balance of the score distribution. <\/p><ul> <li> $$$(1, 2, 3)$$$ <\/li><li> $$$(1, 3, 4)$$$ <\/li><li> $$$(2, 4, 5)$$$ <\/li><\/ul><\/div><\/div>"}, {"contestId": 1114, "index": "E", "name": "Arithmetic Progression", "rating": 2200, "solvedCount": 3294, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Arithmetic Progression<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-it\">This is an interactive problem!<\/span><\/p><p>An arithmetic progression or arithmetic sequence is a sequence of integers such that the subtraction of element with its previous element ($$$x_i - x_{i - 1}$$$, where $$$i \\ge 2$$$) is constant\u00a0\u2014 such difference is called a <span class=\"tex-font-style-it\">common difference<\/span> of the sequence.<\/p><p>That is, an arithmetic progression is a sequence of form $$$x_i = x_1 + (i - 1) d$$$, where $$$d$$$ is a common difference of the sequence.<\/p><p>There is a secret list of $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$.<\/p><p>It is guaranteed that all elements $$$a_1, a_2, \\ldots, a_n$$$ are between $$$0$$$ and $$$10^9$$$, inclusive.<\/p><p>This list is special: if sorted in increasing order, it will form an arithmetic progression with positive common difference ($$$d  \\gt  0$$$). For example, the list $$$[14, 24, 9, 19]$$$ satisfies this requirement, after sorting it makes a list $$$[9, 14, 19, 24]$$$, which can be produced as $$$x_n = 9 + 5 \\cdot (n - 1)$$$.<\/p><p>Also you are also given a device, which has a quite discharged battery, thus you can only use it to perform at most $$$60$$$ queries of following two types:<\/p><ul><li> Given a value $$$i$$$ ($$$1 \\le i \\le n$$$), the device will show the value of the $$$a_i$$$.<\/li><li> Given a value $$$x$$$ ($$$0 \\le x \\le 10^9$$$), the device will return $$$1$$$ if an element with a value strictly greater than $$$x$$$ exists, and it will return $$$0$$$ otherwise.<\/li><\/ul><p>Your can use this special device for at most $$$60$$$ queries. Could you please find out the smallest element and the common difference of the sequence? That is, values $$$x_1$$$ and $$$d$$$ in the definition of the arithmetic progression. Note that the array $$$a$$$ is not sorted.<\/p><\/div><div><div class=\"section-title\">Interaction<\/div><p>The interaction starts with a single integer $$$n$$$ ($$$2 \\le n \\le 10^6$$$), the size of the list of integers.<\/p><p>Then you can make queries of two types:<\/p><ul><li> \"<span class=\"tex-font-style-tt\">? i<\/span>\" ($$$1 \\le i \\le n$$$)\u00a0\u2014 to get the value of $$$a_i$$$.<\/li><li> \"<span class=\"tex-font-style-tt\">&gt; x<\/span>\" ($$$0 \\le x \\le 10^9$$$)\u00a0\u2014 to check whether there exists an element greater than $$$x$$$<\/li><\/ul><p>After the query read its result $$$r$$$ as an integer.<\/p><ul> <li> For the first query type, the $$$r$$$ satisfies $$$0 \\le r \\le 10^9$$$. <\/li><li> For the second query type, the $$$r$$$ is either $$$0$$$ or $$$1$$$.<\/li><li> In case you make more than $$$60$$$ queries or violated the number range in the queries, you will get a $$$r = -1$$$.<\/li><li> If you terminate after receiving the <span class=\"tex-font-style-tt\">-1<\/span>, you will get the \"<span class=\"tex-font-style-tt\">Wrong answer<\/span>\" verdict. Otherwise you can get an arbitrary verdict because your solution will continue to read from a closed stream. <\/li><\/ul><p>When you find out what the smallest element $$$x_1$$$ and common difference $$$d$$$, print<\/p><ul> <li> \"<span class=\"tex-font-style-tt\">! $$$x_1$$$ $$$d$$$<\/span>\" <\/li><\/ul><p>And quit after that. This query is not counted towards the $$$60$$$ queries limit.<\/p><p>After printing any query do not forget to output end of line and flush the output. Otherwise you will get <span class=\"tex-font-style-tt\">Idleness limit exceeded<\/span>. To do this, use:<\/p><ul><li> <span class=\"tex-font-style-tt\">fflush(stdout)<\/span> or <span class=\"tex-font-style-tt\">cout.flush()<\/span> in C++;<\/li><li> <span class=\"tex-font-style-tt\">System.out.flush()<\/span> in Java;<\/li><li> <span class=\"tex-font-style-tt\">flush(output)<\/span> in Pascal;<\/li><li> <span class=\"tex-font-style-tt\">stdout.flush()<\/span> in Python;<\/li><li> see documentation for other languages.<\/li><\/ul><p><span class=\"tex-font-style-bf\">Hacks<\/span><\/p><p>For hack, use the following format:<\/p><p>The first line should contain an integer $$$n$$$ ($$$2 \\le n \\le 10^6$$$)\u00a0\u2014 the list's size.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$0 \\le a_i \\le 10^9$$$)\u00a0\u2014 the elements of the list.<\/p><p>Also, after the sorting the list must form an arithmetic progression with positive common difference.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n\n0\n\n1\n\n14\n\n24\n\n9\n\n19\n\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n\n&gt; 25\n\n&gt; 15\n\n? 1\n\n? 2\n\n? 3\n\n? 4\n\n! 9 5<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Note that the example interaction contains extra empty lines so that it's easier to read. The real interaction doesn't contain any empty lines and you shouldn't print any extra empty lines as well.<\/p><p>The list in the example test is $$$[14, 24, 9, 19]$$$.<\/p><\/div><\/div>"}, {"contestId": 429, "index": "D", "name": "Tricky Function", "rating": 2200, "solvedCount": 3292, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Tricky Function<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Iahub and Sorin are the best competitive programmers in their town. However, they can't both qualify to an important contest. The selection will be made with the help of a single problem. Blatnatalag, a friend of Iahub, managed to get hold of the problem before the contest. Because he wants to make sure Iahub will be the one qualified, he tells Iahub the following task.<\/p><p>You're given an (1-based) array <span class=\"tex-span\"><i>a<\/i><\/span> with <span class=\"tex-span\"><i>n<\/i><\/span> elements. Let's define function <span class=\"tex-span\"><i>f<\/i>(<i>i<\/i>,\u2009<i>j<\/i>)<\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>i<\/i>,\u2009<i>j<\/i>\u2009\u2264\u2009<i>n<\/i>)<\/span> as <span class=\"tex-span\">(<i>i<\/i>\u2009-\u2009<i>j<\/i>)<sup class=\"upper-index\">2<\/sup>\u2009+\u2009<i>g<\/i>(<i>i<\/i>,\u2009<i>j<\/i>)<sup class=\"upper-index\">2<\/sup><\/span>. Function g is calculated by the following pseudo-code:<\/p><pre class=\"verbatim\"><br/>int g(int i, int j) {<br/>    int sum = 0;<br/>    for (int k = min(i, j) + 1; k &lt;= max(i, j); k = k + 1)<br/>        sum = sum + a[k];<br/>    return sum;<br/>}<br/><\/pre><p>Find a value <span class=\"tex-span\"><i>min<\/i><sub class=\"lower-index\"><i>i<\/i>\u2009\u2260\u2009<i>j<\/i><\/sub>\u00a0\u00a0<i>f<\/i>(<i>i<\/i>,\u2009<i>j<\/i>)<\/span>.<\/p><p>Probably by now Iahub already figured out the solution to this problem. Can you?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains a single integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009100000<\/span>). Next line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i>[1]<\/span>, <span class=\"tex-span\"><i>a<\/i>[2]<\/span>, ..., <span class=\"tex-span\"><i>a<\/i>[<i>n<\/i>]<\/span> (<span class=\"tex-span\">\u2009-\u200910<sup class=\"upper-index\">4<\/sup>\u2009\u2264\u2009<i>a<\/i>[<i>i<\/i>]\u2009\u2264\u200910<sup class=\"upper-index\">4<\/sup><\/span>). <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output a single integer \u2014 the value of <span class=\"tex-span\"><i>min<\/i><sub class=\"lower-index\"><i>i<\/i>\u2009\u2260\u2009<i>j<\/i><\/sub>\u00a0\u00a0<i>f<\/i>(<i>i<\/i>,\u2009<i>j<\/i>)<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>1 0 0 -1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/>1 -1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1858, "index": "D", "name": "Trees and Segments", "rating": 2200, "solvedCount": 3276, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Trees and Segments<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>The teachers of the Summer Informatics School decided to plant $$$n$$$ trees in a row, and it was decided to plant only oaks and firs. To do this, they made a plan, which can be represented as a binary string $$$s$$$ of length $$$n$$$. If $$$s_i = 0$$$, then the $$$i$$$-th tree in the row should be an oak, and if $$$s_i = 1$$$, then the $$$i$$$-th tree in the row should be a fir.<\/p><p>The day of tree planting is tomorrow, and the day after tomorrow an inspector will come to the School. The inspector loves nature very much, and he will evaluate the beauty of the row as follows:<\/p><ul> <li> First, he will calculate $$$l_0$$$ as the maximum number of consecutive oaks in the row (the maximum substring consisting of zeros in the plan $$$s$$$). If there are no oaks in the row, then $$$l_0 = 0$$$. <\/li><li> Then, he will calculate $$$l_1$$$ as the maximum number of consecutive firs in the row (the maximum substring consisting of ones in the plan $$$s$$$). If there are no firs in the row, then $$$l_1 = 0$$$. <\/li><li> Finally, he will calculate the <span class=\"tex-font-style-it\">beauty<\/span> of the row as $$$a \\cdot l_0 + l_1$$$ for some $$$a$$$\u00a0\u2014 the inspector's favourite number. <\/li><\/ul><p>The teachers know the value of the parameter $$$a$$$, but for security reasons they cannot tell it to you. They only told you that $$$a$$$ is an integer from $$$1$$$ to $$$n$$$.<\/p><p>Since the trees have not yet been planted, the teachers decided to change the type of no more than $$$k$$$ trees to the opposite (i.e., change $$$s_i$$$ from $$$0$$$ to $$$1$$$ or from $$$1$$$ to $$$0$$$ in the plan) in order to maximize the beauty of the row of trees according to the inspector.<\/p><p>For each integer $$$j$$$ from $$$1$$$ to $$$n$$$ answer the following question <span class=\"tex-font-style-bf\">independently<\/span>: <\/p><ul> <li> What is the maximum beauty of the row of trees that the teachers can achieve by changing the type of no more than $$$k$$$ trees if the inspector's favourite number $$$a$$$ is equal to $$$j$$$? <\/li><\/ul><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 1000$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le n \\le 3000$$$, $$$0 \\le k \\le n$$$)\u00a0\u2014 the number of trees in the row and the maximum number of changes.<\/p><p>The second line contains a string $$$s$$$ of length $$$n$$$, consisting of zeros and ones\u00a0\u2014 the plan description.<\/p><p>It is guaranteed that the sum of all $$$n$$$ values for all test cases does not exceed $$$3000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print $$$n$$$ integers, the $$$j$$$-th ($$$1 \\le j \\le n$$$) of which is the maximum beauty of the row of trees after no more than $$$k$$$ changes if $$$a = j$$$ is used to calculate the beauty.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">111<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">0110<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">10000<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">101101<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">7 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">0001101<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3 3 3 \n4 5 7 9 \n5 9 13 17 21 \n6 9 13 17 21 25 \n7 10 13 17 21 25 29 \n<\/pre><\/div><\/div><\/div><div class=\"note\"

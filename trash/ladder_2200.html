<script>
    const PROBLEMS = [{"contestId": 86, "index": "D", "name": "Powerful array", "rating": 2200, "solvedCount": 18000, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Powerful array<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>An array of positive integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> is given. Let us consider its arbitrary subarray <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>l<\/i><\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\"><i>l<\/i>\u2009+\u20091<\/sub>...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>r<\/i><\/sub><\/span>, where <span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>. For every positive integer <span class=\"tex-span\"><i>s<\/i><\/span> denote by <span class=\"tex-span\"><i>K<\/i><sub class=\"lower-index\"><i>s<\/i><\/sub><\/span> the number of occurrences of <span class=\"tex-span\"><i>s<\/i><\/span> into the subarray. We call the <span class=\"tex-font-style-it\">power<\/span> of the subarray the sum of products <span class=\"tex-span\"><i>K<\/i><sub class=\"lower-index\"><i>s<\/i><\/sub>\u00b7<i>K<\/i><sub class=\"lower-index\"><i>s<\/i><\/sub>\u00b7<i>s<\/i><\/span> for every positive integer <span class=\"tex-span\"><i>s<\/i><\/span>. The sum contains only finite number of nonzero summands as the number of different values in the array is indeed finite.<\/p><p>You should calculate the power of <span class=\"tex-span\"><i>t<\/i><\/span> given subarrays.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>First line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>t<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>t<\/i>\u2009\u2264\u2009200000<\/span>) \u2014 the array length and the number of queries correspondingly.<\/p><p>Second line contains <span class=\"tex-span\"><i>n<\/i><\/span> positive integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup><\/span>) \u2014 the elements of the array.<\/p><p>Next <span class=\"tex-span\"><i>t<\/i><\/span> lines contain two positive integers <span class=\"tex-span\"><i>l<\/i><\/span>, <span class=\"tex-span\"><i>r<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>) each \u2014 the indices of the left and the right ends of the corresponding subarray.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output <span class=\"tex-span\"><i>t<\/i><\/span> lines, the <span class=\"tex-span\"><i>i<\/i><\/span>-th line of the output should contain single positive integer \u2014 the power of the <span class=\"tex-span\"><i>i<\/i><\/span>-th query subarray.<\/p><p>Please, do not use <span class=\"tex-font-style-tt\">%lld<\/span> specificator to read or write 64-bit integers in C++. It is preferred to use <span class=\"tex-font-style-tt\">cout<\/span> stream (also you may use <span class=\"tex-font-style-tt\">%I64d<\/span>).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 2<br/>1 2 1<br/>1 2<br/>1 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/>6<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>8 3<br/>1 1 2 2 1 3 1 1<br/>2 7<br/>1 6<br/>2 7<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>20<br/>20<br/>20<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Consider the following array (see the second sample) and its [2, 7] subarray (elements of the subarray are colored): <\/p><center><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/c0d1418a04b13fdf812625d254db5241ce734ac0.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/center> Then <span class=\"tex-span\"><i>K<\/i><sub class=\"lower-index\">1<\/sub>\u2009=\u20093<\/span>, <span class=\"tex-span\"><i>K<\/i><sub class=\"lower-index\">2<\/sub>\u2009=\u20092<\/span>, <span class=\"tex-span\"><i>K<\/i><sub class=\"lower-index\">3<\/sub>\u2009=\u20091<\/span>, so the power is equal to <span class=\"tex-span\">3<sup class=\"upper-index\">2<\/sup>\u00b71\u2009+\u20092<sup class=\"upper-index\">2<\/sup>\u00b72\u2009+\u20091<sup class=\"upper-index\">2<\/sup>\u00b73\u2009=\u200920<\/span>.<\/div><\/div>"}, {"contestId": 52, "index": "C", "name": "Circular RMQ", "rating": 2200, "solvedCount": 12066, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Circular RMQ<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>You are given circular array <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">0<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i>\u2009-\u20091<\/sub><\/span>. There are two types of operations with it: <\/p><ul> <li> <span class=\"tex-span\"><i>inc<\/i>(<i>lf<\/i>,\u2009<i>rg<\/i>,\u2009<i>v<\/i>)<\/span> \u2014 this operation increases each element on the segment <span class=\"tex-span\">[<i>lf<\/i>,\u2009<i>rg<\/i>]<\/span> (inclusively) by <span class=\"tex-span\"><i>v<\/i><\/span>; <\/li><li> <span class=\"tex-span\"><i>rmq<\/i>(<i>lf<\/i>,\u2009<i>rg<\/i>)<\/span> \u2014 this operation returns minimal value on the segment <span class=\"tex-span\">[<i>lf<\/i>,\u2009<i>rg<\/i>]<\/span> (inclusively). <\/li><\/ul><p>Assume segments to be circular, so if <span class=\"tex-span\"><i>n<\/i>\u2009=\u20095<\/span> and <span class=\"tex-span\"><i>lf<\/i>\u2009=\u20093,\u2009<i>rg<\/i>\u2009=\u20091<\/span>, it means the index sequence: <span class=\"tex-span\">3,\u20094,\u20090,\u20091<\/span>.<\/p><p>Write program to process given sequence of operations.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009200000<\/span>). The next line contains initial state of the array: <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">0<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i>\u2009-\u20091<\/sub><\/span> (<span class=\"tex-span\">\u2009-\u200910<sup class=\"upper-index\">6<\/sup>\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup><\/span>), <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> are integer. The third line contains integer <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u2009200000<\/span>), <span class=\"tex-span\"><i>m<\/i><\/span> \u2014 the number of operartons. Next <span class=\"tex-span\"><i>m<\/i><\/span> lines contain one operation each. If line contains two integer <span class=\"tex-span\"><i>lf<\/i>,\u2009<i>rg<\/i><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>lf<\/i>,\u2009<i>rg<\/i>\u2009\u2264\u2009<i>n<\/i>\u2009-\u20091<\/span>) it means <span class=\"tex-span\"><i>rmq<\/i><\/span> operation, it contains three integers <span class=\"tex-span\"><i>lf<\/i>,\u2009<i>rg<\/i>,\u2009<i>v<\/i><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>lf<\/i>,\u2009<i>rg<\/i>\u2009\u2264\u2009<i>n<\/i>\u2009-\u20091;\u2009-\u200910<sup class=\"upper-index\">6<\/sup>\u2009\u2264\u2009<i>v<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup><\/span>) \u2014 <span class=\"tex-span\"><i>inc<\/i><\/span> operation.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each <span class=\"tex-span\"><i>rmq<\/i><\/span> operation write result for it. Please, do not use <span class=\"tex-font-style-tt\">%lld<\/span> specificator to read or write 64-bit integers in C++. It is preffered to use <span class=\"tex-font-style-tt\">cout<\/span> (also you may use <span class=\"tex-font-style-tt\">%I64d<\/span>).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>1 2 3 4<br/>4<br/>3 0<br/>3 0 -1<br/>0 1<br/>2 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/>0<br/>0<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 617, "index": "E", "name": "XOR and Favorite Number", "rating": 2200, "solvedCount": 11232, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. XOR and Favorite Number<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Bob has a favorite number <span class=\"tex-span\"><i>k<\/i><\/span> and <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> of length <span class=\"tex-span\"><i>n<\/i><\/span>. Now he asks you to answer <span class=\"tex-span\"><i>m<\/i><\/span> queries. Each query is given by a pair <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and asks you to count the number of pairs of integers <span class=\"tex-span\"><i>i<\/i><\/span> and <span class=\"tex-span\"><i>j<\/i><\/span>, such that <span class=\"tex-span\"><i>l<\/i>\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>j<\/i>\u2009\u2264\u2009<i>r<\/i><\/span> and the xor of the numbers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i>\u2009+\u20091<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span> is equal to <span class=\"tex-span\"><i>k<\/i><\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains integers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>m<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>m<\/i>\u2009\u2264\u2009100\u2009000<\/span>, <span class=\"tex-span\">0\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u20091\u2009000\u2009000<\/span>)\u00a0\u2014 the length of the array, the number of queries and Bob's favorite number respectively.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u20091\u2009000\u2009000<\/span>)\u00a0\u2014 Bob's array.<\/p><p>Then <span class=\"tex-span\"><i>m<\/i><\/span> lines follow. The <span class=\"tex-span\"><i>i<\/i><\/span>-th line contains integers <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>)\u00a0\u2014 the parameters of the <span class=\"tex-span\"><i>i<\/i><\/span>-th query.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>m<\/i><\/span> lines, answer the queries in the order they appear in the input. <\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>6 2 3<br/>1 2 1 1 0 3<br/>1 6<br/>3 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>7<br/>0<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 3 1<br/>1 1 1 1 1<br/>1 5<br/>2 4<br/>1 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>9<br/>4<br/>4<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample the suitable pairs of <span class=\"tex-span\"><i>i<\/i><\/span> and <span class=\"tex-span\"><i>j<\/i><\/span> for the first query are: (<span class=\"tex-span\">1<\/span>, <span class=\"tex-span\">2<\/span>), (<span class=\"tex-span\">1<\/span>, <span class=\"tex-span\">4<\/span>), (<span class=\"tex-span\">1<\/span>, <span class=\"tex-span\">5<\/span>), (<span class=\"tex-span\">2<\/span>, <span class=\"tex-span\">3<\/span>), (<span class=\"tex-span\">3<\/span>, <span class=\"tex-span\">6<\/span>), (<span class=\"tex-span\">5<\/span>, <span class=\"tex-span\">6<\/span>), (<span class=\"tex-span\">6<\/span>, <span class=\"tex-span\">6<\/span>). Not a single of these pairs is suitable for the second query.<\/p><p>In the second sample xor equals <span class=\"tex-span\">1<\/span> for all subarrays of an odd length.<\/p><\/div><\/div>"}, {"contestId": 165, "index": "E", "name": "Compatible Numbers", "rating": 2200, "solvedCount": 10254, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Compatible Numbers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Two integers <span class=\"tex-span\"><i>x<\/i><\/span> and <span class=\"tex-span\"><i>y<\/i><\/span> are <span class=\"tex-font-style-underline\">compatible<\/span>, if the result of their bitwise \"AND\" equals zero, that is, <span class=\"tex-span\"><i>a<\/i><\/span> <span class=\"tex-span\">&amp;<\/span> <span class=\"tex-span\"><i>b<\/i>\u2009=\u20090<\/span>. For example, numbers <span class=\"tex-span\">90<\/span> <span class=\"tex-span\">(1011010<sub class=\"lower-index\">2<\/sub>)<\/span> and <span class=\"tex-span\">36<\/span> <span class=\"tex-span\">(100100<sub class=\"lower-index\">2<\/sub>)<\/span> are compatible, as <span class=\"tex-span\">1011010<sub class=\"lower-index\">2<\/sub><\/span> <span class=\"tex-span\">&amp;<\/span> <span class=\"tex-span\">100100<sub class=\"lower-index\">2<\/sub>\u2009=\u20090<sub class=\"lower-index\">2<\/sub><\/span>, and numbers <span class=\"tex-span\">3<\/span> <span class=\"tex-span\">(11<sub class=\"lower-index\">2<\/sub>)<\/span> and <span class=\"tex-span\">6<\/span> <span class=\"tex-span\">(110<sub class=\"lower-index\">2<\/sub>)<\/span> are not compatible, as <span class=\"tex-span\">11<sub class=\"lower-index\">2<\/sub><\/span> <span class=\"tex-span\">&amp;<\/span> <span class=\"tex-span\">110<sub class=\"lower-index\">2<\/sub>\u2009=\u200910<sub class=\"lower-index\">2<\/sub><\/span>.<\/p><p>You are given an array of integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span>. Your task is to find the following for each array element: is this element compatible with some other element from the given array? If the answer to this question is positive, then you also should find any suitable element.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup><\/span>) \u2014 the number of elements in the given array. The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> space-separated integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u20094\u00b710<sup class=\"upper-index\">6<\/sup><\/span>) \u2014 the elements of the given array. The numbers in the array can coincide.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>ans<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. If <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> isn't compatible with any other element of the given array <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span>, then <span class=\"tex-span\"><i>ans<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> should be equal to -1. Otherwise <span class=\"tex-span\"><i>ans<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is any such number, that <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\">&amp;<\/span> <span class=\"tex-span\"><i>ans<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009=\u20090<\/span>, and also <span class=\"tex-span\"><i>ans<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> occurs in the array <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/>90 36<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>36 90<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>3 6 3 6<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>-1 -1 -1 -1<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>10 6 9 8 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>-1 8 2 2 8<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 570, "index": "D", "name": "Tree Requests", "rating": 2200, "solvedCount": 9522, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Tree Requests<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Roman planted a tree consisting of <span class=\"tex-span\"><i>n<\/i><\/span> vertices. Each vertex contains a lowercase English letter. Vertex <span class=\"tex-span\">1<\/span> is the root of the tree, each of the <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> remaining vertices has a <span class=\"tex-font-style-it\">parent<\/span> in the tree. Vertex is connected with its parent by an edge. The parent of vertex <span class=\"tex-span\"><i>i<\/i><\/span> is vertex <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, the parent index is always less than the index of the vertex (i.e., <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009&lt;\u2009<i>i<\/i><\/span>).<\/p><p>The <span class=\"tex-font-style-it\">depth<\/span> of the vertex is the number of nodes on the path from the root to <span class=\"tex-span\"><i>v<\/i><\/span> along the edges. In particular, the depth of the root is equal to <span class=\"tex-span\">1<\/span>.<\/p><p>We say that vertex <span class=\"tex-span\"><i>u<\/i><\/span> is in the <span class=\"tex-font-style-it\">subtree<\/span> of vertex <span class=\"tex-span\"><i>v<\/i><\/span>, if we can get from <span class=\"tex-span\"><i>u<\/i><\/span> to <span class=\"tex-span\"><i>v<\/i><\/span>, moving from the vertex to the parent. In particular, vertex <span class=\"tex-span\"><i>v<\/i><\/span> is in its subtree.<\/p><p>Roma gives you <span class=\"tex-span\"><i>m<\/i><\/span> queries, the <span class=\"tex-span\"><i>i<\/i><\/span>-th of which consists of two numbers <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>h<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. Let's consider the vertices in the subtree <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> located at depth <span class=\"tex-span\"><i>h<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. Determine whether you can use the letters written at these vertices to make a string that is a <span class=\"tex-font-style-it\">palindrome<\/span>. The letters that are written in the vertexes, can be rearranged in any order to make a palindrome, but all letters should be used.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>m<\/i>\u2009\u2264\u2009500\u2009000<\/span>) \u2014 the number of nodes in the tree and queries, respectively.<\/p><p>The following line contains <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> integers <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\">2<\/sub>,\u2009<i>p<\/i><sub class=\"lower-index\">3<\/sub>,\u2009...,\u2009<i>p<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> \u2014 the parents of vertices from the second to the <span class=\"tex-span\"><i>n<\/i><\/span>-th (<span class=\"tex-span\">1\u2009\u2264\u2009<i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009&lt;\u2009<i>i<\/i><\/span>).<\/p><p>The next line contains <span class=\"tex-span\"><i>n<\/i><\/span> lowercase English letters, the <span class=\"tex-span\"><i>i<\/i><\/span>-th of these letters is written on vertex <span class=\"tex-span\"><i>i<\/i><\/span>.<\/p><p>Next <span class=\"tex-span\"><i>m<\/i><\/span> lines describe the queries, the <span class=\"tex-span\"><i>i<\/i><\/span>-th line contains two numbers <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>h<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>h<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>) \u2014 the vertex and the depth that appear in the <span class=\"tex-span\"><i>i<\/i><\/span>-th query.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>m<\/i><\/span> lines. In the <span class=\"tex-span\"><i>i<\/i><\/span>-th line print \"<span class=\"tex-font-style-tt\">Yes<\/span>\" (without the quotes), if in the <span class=\"tex-span\"><i>i<\/i><\/span>-th query you can make a palindrome from the letters written on the vertices, otherwise print \"<span class=\"tex-font-style-tt\">No<\/span>\" (without the quotes).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>6 5<br/>1 1 1 3 3<br/>zacccd<br/>1 1<br/>3 3<br/>4 1<br/>6 1<br/>1 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>Yes<br/>No<br/>Yes<br/>Yes<br/>Yes<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>String <span class=\"tex-span\"><i>s<\/i><\/span> is a <span class=\"tex-font-style-it\">palindrome<\/span> if reads the same from left to right and from right to left. In particular, an empty string is a palindrome.<\/p><p>Clarification for the sample test.<\/p><p>In the first query there exists only a vertex 1 satisfying all the conditions, we can form a palindrome \"<span class=\"tex-font-style-tt\">z<\/span>\".<\/p><p>In the second query vertices 5 and 6 satisfy condititions, they contain letters \"<span class=\"tex-font-style-tt\">\u0441<\/span>\" and \"<span class=\"tex-font-style-tt\">d<\/span>\" respectively. It is impossible to form a palindrome of them.<\/p><p>In the third query there exist no vertices at depth 1 and in subtree of 4. We may form an empty palindrome.<\/p><p>In the fourth query there exist no vertices <span class=\"tex-font-style-bf\">in subtree of 6 at depth 1<\/span>. We may form an empty palindrome.<\/p><p>In the fifth query there vertices 2, 3 and 4 satisfying all conditions above, they contain letters \"<span class=\"tex-font-style-tt\">a<\/span>\", \"<span class=\"tex-font-style-tt\">c<\/span>\" and \"<span class=\"tex-font-style-tt\">c<\/span>\". We may form a palindrome \"<span class=\"tex-font-style-tt\">cac<\/span>\".<\/p><\/div><\/div>"}, {"contestId": 628, "index": "D", "name": "Magic Numbers", "rating": 2200, "solvedCount": 9205, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Magic Numbers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Consider the decimal presentation of an integer. Let's call a number <span class=\"tex-font-style-tt\">d-magic<\/span> if digit <span class=\"tex-span\"><i>d<\/i><\/span> appears in decimal presentation of the number on even positions and nowhere else.<\/p><p>For example, the numbers <span class=\"tex-span\">1727374<\/span>, <span class=\"tex-span\">17<\/span>, <span class=\"tex-span\">1<\/span> are <span class=\"tex-font-style-tt\">7-magic<\/span> but <span class=\"tex-span\">77<\/span>, <span class=\"tex-span\">7<\/span>, <span class=\"tex-span\">123<\/span>, <span class=\"tex-span\">34<\/span>, <span class=\"tex-span\">71<\/span> are not <span class=\"tex-font-style-tt\">7-magic<\/span>. On the other hand the number <span class=\"tex-span\">7<\/span> is <span class=\"tex-font-style-tt\">0-magic<\/span>, <span class=\"tex-span\">123<\/span> is <span class=\"tex-font-style-tt\">2-magic<\/span>, <span class=\"tex-span\">34<\/span> is <span class=\"tex-font-style-tt\">4-magic<\/span> and <span class=\"tex-span\">71<\/span> is <span class=\"tex-font-style-tt\">1-magic<\/span>.<\/p><p>Find the number of <span class=\"tex-font-style-tt\">d-magic<\/span> numbers in the segment <span class=\"tex-span\">[<i>a<\/i>,\u2009<i>b<\/i>]<\/span> that are multiple of <span class=\"tex-span\"><i>m<\/i><\/span>. Because the answer can be very huge you should only find its value modulo <span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097<\/span> (so you should find the remainder after dividing by <span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097<\/span>).<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>m<\/i>,\u2009<i>d<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u20092000<\/span>, <span class=\"tex-span\">0\u2009\u2264\u2009<i>d<\/i>\u2009\u2264\u20099<\/span>) \u2014 the parameters from the problem statement.<\/p><p>The second line contains positive integer <span class=\"tex-span\"><i>a<\/i><\/span> in decimal presentation (without leading zeroes).<\/p><p>The third line contains positive integer <span class=\"tex-span\"><i>b<\/i><\/span> in decimal presentation (without leading zeroes).<\/p><p>It is guaranteed that <span class=\"tex-span\"><i>a<\/i>\u2009\u2264\u2009<i>b<\/i><\/span>, the number of digits in <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span> are the same and don't exceed <span class=\"tex-span\">2000<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the only integer <span class=\"tex-span\"><i>a<\/i><\/span> \u2014 the remainder after dividing by <span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097<\/span> of the number of <span class=\"tex-font-style-tt\">d-magic<\/span> numbers in segment <span class=\"tex-span\">[<i>a<\/i>,\u2009<i>b<\/i>]<\/span> that are multiple of <span class=\"tex-span\"><i>m<\/i><\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 6<br/>10<br/>99<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>8<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 0<br/>1<br/>9<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>19 7<br/>1000<br/>9999<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The numbers from the answer of the first example are <span class=\"tex-span\">16<\/span>, <span class=\"tex-span\">26<\/span>, <span class=\"tex-span\">36<\/span>, <span class=\"tex-span\">46<\/span>, <span class=\"tex-span\">56<\/span>, <span class=\"tex-span\">76<\/span>, <span class=\"tex-span\">86<\/span> and <span class=\"tex-span\">96<\/span>.<\/p><p>The numbers from the answer of the second example are <span class=\"tex-span\">2<\/span>, <span class=\"tex-span\">4<\/span>, <span class=\"tex-span\">6<\/span> and <span class=\"tex-span\">8<\/span>.<\/p><p>The numbers from the answer of the third example are <span class=\"tex-span\">1767<\/span>, <span class=\"tex-span\">2717<\/span>, <span class=\"tex-span\">5757<\/span>, <span class=\"tex-span\">6707<\/span>, <span class=\"tex-span\">8797<\/span> and <span class=\"tex-span\">9747<\/span>.<\/p><\/div><\/div>"}, {"contestId": 559, "index": "C", "name": "Gerald and Giant Chess", "rating": 2200, "solvedCount": 8588, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Gerald and Giant Chess<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Giant chess is quite common in Geraldion. We will not delve into the rules of the game, we'll just say that the game takes place on an <span class=\"tex-span\"><i>h<\/i>\u2009\u00d7\u2009<i>w<\/i><\/span> field, and it is painted in two colors, but not like in chess. Almost all cells of the field are white and only some of them are black. Currently Gerald is finishing a game of giant chess against his friend Pollard. Gerald has almost won, and the only thing he needs to win is to bring the pawn from the upper left corner of the board, where it is now standing, to the lower right corner. Gerald is so confident of victory that he became interested, in how many ways can he win?<\/p><p>The pawn, which Gerald has got left can go in two ways: one cell down or one cell to the right. In addition, it can not go to the black cells, otherwise the Gerald still loses. There are no other pawns or pieces left on the field, so that, according to the rules of giant chess Gerald moves his pawn until the game is over, and Pollard is just watching this process.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains three integers: <span class=\"tex-span\"><i>h<\/i>,\u2009<i>w<\/i>,\u2009<i>n<\/i><\/span> \u2014 the sides of the board and the number of black cells (<span class=\"tex-span\">1\u2009\u2264\u2009<i>h<\/i>,\u2009<i>w<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>,\u20091\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20092000<\/span>). <\/p><p>Next <span class=\"tex-span\"><i>n<\/i><\/span> lines contain the description of black cells. The <span class=\"tex-span\"><i>i<\/i><\/span>-th of these lines contains numbers <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>h<\/i>,\u20091\u2009\u2264\u2009<i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>w<\/i><\/span>) \u2014 the number of the row and column of the <span class=\"tex-span\"><i>i<\/i><\/span>-th cell.<\/p><p>It is guaranteed that the upper left and lower right cell are white and all cells in the description are distinct.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single line \u2014 the remainder of the number of ways to move Gerald's pawn from the upper left to the lower right corner modulo <span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 4 2<br/>2 2<br/>2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>100 100 3<br/>15 16<br/>16 15<br/>99 88<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>545732279<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 833, "index": "B", "name": "The Bakery", "rating": 2200, "solvedCount": 7048, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. The Bakery<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/7ed0e4643a5b272d27907c9a1f4628457b3331cf.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>Some time ago Slastyona the Sweetmaid decided to open her own bakery! She bought required ingredients and a wonder-oven which can bake several types of cakes, and opened the bakery.<\/p><p>Soon the expenses started to overcome the income, so Slastyona decided to study the sweets market. She learned it's profitable to pack cakes in boxes, and that the more <span class=\"tex-font-style-bf\">distinct<\/span> cake types a box contains (let's denote this number as the <span class=\"tex-font-style-it\">value<\/span> of the box), the higher price it has.<\/p><p>She needs to change the production technology! The problem is that the oven chooses the cake types on its own and Slastyona can't affect it. However, she knows the types and order of <span class=\"tex-span\"><i>n<\/i><\/span> cakes the oven is going to bake today. Slastyona has to pack exactly <span class=\"tex-span\"><i>k<\/i><\/span> boxes with cakes today, and she has to put in each box several (at least one) cakes the oven produced one <span class=\"tex-font-style-bf\">right after another<\/span> (in other words, she has to put in a box a continuous segment of cakes).<\/p><p>Slastyona wants to maximize the total value of all boxes with cakes. Help her determine this maximum possible total value.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200935000<\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u2009<i>min<\/i>(<i>n<\/i>,\u200950)<\/span>)\u00a0\u2013 the number of cakes and the number of boxes, respectively.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>)\u00a0\u2013 the types of cakes in the order the oven bakes them.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the only integer\u00a0\u2013 the maximum total value of all boxes with cakes.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 1<br/>1 2 2 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>7 2<br/>1 3 3 1 4 4 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>5<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>8 3<br/>7 7 8 7 7 8 1 7<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example Slastyona has only one box. She has to put all cakes in it, so that there are two types of cakes in the box, so the value is equal to <span class=\"tex-span\">2<\/span>.<\/p><p>In the second example it is profitable to put the first two cakes in the first box, and all the rest in the second. There are two distinct types in the first box, and three in the second box then, so the total value is <span class=\"tex-span\">5<\/span>.<\/p><\/div><\/div>"}, {"contestId": 11, "index": "D", "name": "A Simple Task", "rating": 2200, "solvedCount": 6975, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. A Simple Task<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Given a simple graph, output the number of simple cycles in it. A simple cycle is a cycle with no repeated vertices or edges.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200919<\/span>, <span class=\"tex-span\">0\u2009\u2264\u2009<i>m<\/i><\/span>) \u2013 respectively the number of vertices and edges of the graph. Each of the subsequent <span class=\"tex-span\"><i>m<\/i><\/span> lines contains two integers <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span>, (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i>,\u2009<i>b<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\"><i>a<\/i>\u2009\u2260\u2009<i>b<\/i><\/span>) indicating that vertices <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span> are connected by an undirected edge. There is no more than one edge connecting any pair of vertices.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output the number of cycles in the given graph.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 6<br/>1 2<br/>1 3<br/>1 4<br/>2 3<br/>2 4<br/>3 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>7<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The example graph is a clique and contains four cycles of length 3 and three cycles of length 4.<\/p><\/div><\/div>"}, {"contestId": 1400, "index": "E", "name": "Clear the Multiset", "rating": 2200, "solvedCount": 6625, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Clear the Multiset<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You have a multiset containing several integers. Initially, it contains $$$a_1$$$ elements equal to $$$1$$$, $$$a_2$$$ elements equal to $$$2$$$, ..., $$$a_n$$$ elements equal to $$$n$$$.<\/p><p>You may apply two types of operations:<\/p><ul> <li> choose two integers $$$l$$$ and $$$r$$$ ($$$l \\le r$$$), then remove one occurrence of $$$l$$$, one occurrence of $$$l + 1$$$, ..., one occurrence of $$$r$$$ from the multiset. This operation can be applied only if each number from $$$l$$$ to $$$r$$$ occurs at least once in the multiset; <\/li><li> choose two integers $$$i$$$ and $$$x$$$ ($$$x \\ge 1$$$), then remove $$$x$$$ occurrences of $$$i$$$ from the multiset. This operation can be applied only if the multiset contains at least $$$x$$$ occurrences of $$$i$$$. <\/li><\/ul><p>What is the minimum number of operations required to delete all elements from the multiset?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$1 \\le n \\le 5000$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_1$$$, $$$a_2$$$, ..., $$$a_n$$$ ($$$0 \\le a_i \\le 10^9$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the minimum number of operations required to delete all elements from the multiset.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n1 4 1 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n1 0 1 0 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1537, "index": "E2", "name": "Erase and Extend (Hard Version)", "rating": 2200, "solvedCount": 6427, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E2. Erase and Extend (Hard Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is the hard version of the problem. The only difference is the constraints on $$$n$$$ and $$$k$$$. You can make hacks only if all versions of the problem are solved.<\/span><\/p><p>You have a string $$$s$$$, and you can do two types of operations on it: <\/p><ul> <li> Delete the last character of the string. <\/li><li> Duplicate the string: $$$s:=s+s$$$, where $$$+$$$ denotes concatenation. <\/li><\/ul><p>You can use each operation any number of times (possibly none).<\/p><p>Your task is to find the lexicographically smallest string of length exactly $$$k$$$ that can be obtained by doing these operations on string $$$s$$$.<\/p><p>A string $$$a$$$ is lexicographically smaller than a string $$$b$$$ if and only if one of the following holds:<\/p><ul> <li> $$$a$$$ is a prefix of $$$b$$$, but $$$a\\ne b$$$; <\/li><li> In the first position where $$$a$$$ and $$$b$$$ differ, the string $$$a$$$ has a letter that appears earlier in the alphabet than the corresponding letter in $$$b$$$. <\/li><\/ul><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$, $$$k$$$ ($$$1 \\leq n, k \\leq 5\\cdot 10^5$$$) \u2014 the length of the original string $$$s$$$ and the length of the desired string.<\/p><p>The second line contains the string $$$s$$$, consisting of $$$n$$$ lowercase English letters.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the lexicographically smallest string of length $$$k$$$ that can be obtained by doing the operations on string $$$s$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n8 16\ndbcadabc\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\ndbcadabcdbcadabc\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 5\nabcd\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\naaaaa\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test, it is optimal to make one duplication: \"<span class=\"tex-font-style-tt\">dbcadabc<\/span>\" $$$\\to$$$ \"<span class=\"tex-font-style-tt\">dbcadabcdbcadabc<\/span>\".<\/p><p>In the second test it is optimal to delete the last $$$3$$$ characters, then duplicate the string $$$3$$$ times, then delete the last $$$3$$$ characters to make the string have length $$$k$$$.<\/p><p>\"<span class=\"tex-font-style-tt\">abcd<\/span>\" $$$\\to$$$ \"<span class=\"tex-font-style-tt\">abc<\/span>\" $$$\\to$$$ \"<span class=\"tex-font-style-tt\">ab<\/span>\" $$$\\to$$$ \"<span class=\"tex-font-style-tt\">a<\/span>\" $$$\\to$$$ \"<span class=\"tex-font-style-tt\">aa<\/span>\" $$$\\to$$$ \"<span class=\"tex-font-style-tt\">aaaa<\/span>\" $$$\\to$$$ \"<span class=\"tex-font-style-tt\">aaaaaaaa<\/span>\" $$$\\to$$$ \"<span class=\"tex-font-style-tt\">aaaaaaa<\/span>\" $$$\\to$$$ \"<span class=\"tex-font-style-tt\">aaaaaa<\/span>\" $$$\\to$$$ \"<span class=\"tex-font-style-tt\">aaaaa<\/span>\".<\/p><\/div><\/div>"}, {"contestId": 1407, "index": "D", "name": "Discrete Centrifugal Jumps", "rating": 2200, "solvedCount": 6020, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Discrete Centrifugal Jumps<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are $$$n$$$ beautiful skyscrapers in New York, the height of the $$$i$$$-th one is $$$h_i$$$. Today some villains have set on fire first $$$n - 1$$$ of them, and now the only safety building is $$$n$$$-th skyscraper.<\/p><p>Let's call a jump from $$$i$$$-th skyscraper to $$$j$$$-th ($$$i  \\lt  j$$$) <span class=\"tex-font-style-bf\">discrete<\/span>, if all skyscrapers between are strictly lower or higher than both of them. Formally, jump is discrete, if $$$i  \\lt  j$$$ and one of the following conditions satisfied: <\/p><ul> <li> $$$i + 1 = j$$$ <\/li><li> $$$\\max(h_{i + 1}, \\ldots, h_{j - 1})  \\lt  \\min(h_i, h_j)$$$ <\/li><li> $$$\\max(h_i, h_j)  \\lt  \\min(h_{i + 1}, \\ldots, h_{j - 1})$$$. <\/li><\/ul><p>At the moment, Vasya is staying on the first skyscraper and wants to live a little longer, so his goal is to reach $$$n$$$-th skyscraper with minimal count of discrete jumps. Help him with calcualting this number.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$2 \\le n \\le 3 \\cdot 10^5$$$) \u2014 total amount of skyscrapers.<\/p><p>The second line contains $$$n$$$ integers $$$h_1, h_2, \\ldots, h_n$$$ ($$$1 \\le h_i \\le 10^9$$$) \u2014 heights of skyscrapers.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print single number $$$k$$$ \u2014 minimal amount of discrete jumps. We can show that an answer always exists.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n1 3 1 4 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n4 2 2 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n1 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n100 1 100 1 100\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first testcase, Vasya can jump in the following way: $$$1 \\rightarrow 2 \\rightarrow 4 \\rightarrow 5$$$.<\/p><p>In the second and third testcases, we can reach last skyscraper in one jump.<\/p><p>Sequence of jumps in the fourth testcase: $$$1 \\rightarrow 3 \\rightarrow 5$$$.<\/p><\/div><\/div>"}, {"contestId": 1092, "index": "D1", "name": "Great Vova Wall (Version 1)", "rating": 2200, "solvedCount": 5912, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D1. Great Vova Wall (Version 1)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Vova's family is building the Great Vova Wall (named by Vova himself). Vova's parents, grandparents, grand-grandparents contributed to it. Now it's totally up to Vova to put the finishing touches.<\/p><p>The current state of the wall can be respresented by a sequence $$$a$$$ of $$$n$$$ integers, with $$$a_i$$$ being the height of the $$$i$$$-th part of the wall.<\/p><p>Vova can only use $$$2 \\times 1$$$ bricks to put in the wall (he has infinite supply of them, however).<\/p><p>Vova can put bricks <span class=\"tex-font-style-bf\">horizontally<\/span> on the neighboring parts of the wall of equal height. It means that if for some $$$i$$$ the current height of part $$$i$$$ is the same as for part $$$i + 1$$$, then Vova can put a brick there and thus increase both heights by 1. Obviously, Vova can't put bricks in such a way that its parts turn out to be off the borders (to the left of part $$$1$$$ of the wall or to the right of part $$$n$$$ of it).<\/p><p><span class=\"tex-font-style-bf\">The next paragraph is specific to the version 1 of the problem.<\/span><\/p><p>Vova can also put bricks vertically. That means increasing height of any part of the wall by 2.<\/p><p>Vova is a perfectionist, so he considers the wall completed when:<\/p><ul> <li> all parts of the wall has the same height; <\/li><li> the wall has no empty spaces inside it. <\/li><\/ul><p>Can Vova complete the wall using any amount of bricks (possibly zero)?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$) \u2014 the number of parts in the wall.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$) \u2014 the initial heights of the parts of the wall.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print \"<span class=\"tex-font-style-tt\">YES<\/span>\" if Vova can complete the wall using any amount of bricks (possibly zero).<\/p><p>Print \"<span class=\"tex-font-style-tt\">NO<\/span>\" otherwise.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n2 1 1 2 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n4 5 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n10 10\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n1 2 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nNO\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example Vova can put a brick on parts 2 and 3 to make the wall $$$[2, 2, 2, 2, 5]$$$ and then put 3 bricks on parts 1 and 2 and 3 bricks on parts 3 and 4 to make it $$$[5, 5, 5, 5, 5]$$$.<\/p><p>In the second example Vova can put a brick vertically on part 3 to make the wall $$$[4, 5, 5]$$$, then horizontally on parts 2 and 3 to make it $$$[4, 6, 6]$$$ and then vertically on part 1 to make it $$$[6, 6, 6]$$$.<\/p><p>In the third example the wall is already complete.<\/p><\/div><\/div>"}, {"contestId": 1485, "index": "D", "name": "Multiples and Power Differences", "rating": 2200, "solvedCount": 5758, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Multiples and Power Differences<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a matrix $$$a$$$ consisting of positive integers. It has $$$n$$$ rows and $$$m$$$ columns.<\/p><p>Construct a matrix $$$b$$$ consisting of positive integers. It should have the same size as $$$a$$$, and the following conditions should be met: <\/p><ul> <li> $$$1 \\le b_{i,j} \\le 10^6$$$; <\/li><li> $$$b_{i,j}$$$ is a multiple of $$$a_{i,j}$$$; <\/li><li> the absolute value of the difference between numbers in any adjacent pair of cells (two cells that share the same side) in $$$b$$$ is equal to $$$k^4$$$ for some integer $$$k \\ge 1$$$ ($$$k$$$ is not necessarily the same for all pairs, it is own for each pair). <\/li><\/ul><p>We can show that the answer always exists.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$m$$$ ($$$2 \\le n,m \\le 500$$$).<\/p><p>Each of the following $$$n$$$ lines contains $$$m$$$ integers. The $$$j$$$-th integer in the $$$i$$$-th line is $$$a_{i,j}$$$ ($$$1 \\le a_{i,j} \\le 16$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>The output should contain $$$n$$$ lines each containing $$$m$$$ integers. The $$$j$$$-th integer in the $$$i$$$-th line should be $$$b_{i,j}$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2 2\n1 2\n2 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 2\n2 3\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2 3\n16 16 16\n16 16 16\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n16 32 48\n32 48 64\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2 2\n3 11\n12 8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n327 583\n408 664\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, the matrix $$$a$$$ can be used as the matrix $$$b$$$, because the absolute value of the difference between numbers in any adjacent pair of cells is $$$1 = 1^4$$$.<\/p><p>In the third example: <\/p><ul> <li> $$$327$$$ is a multiple of $$$3$$$, $$$583$$$ is a multiple of $$$11$$$, $$$408$$$ is a multiple of $$$12$$$, $$$664$$$ is a multiple of $$$8$$$; <\/li><li> $$$|408 - 327| = 3^4$$$, $$$|583 - 327| = 4^4$$$, $$$|664 - 408| = 4^4$$$, $$$|664 - 583| = 3^4$$$. <\/li><\/ul><\/div><\/div>"}, {"contestId": 13, "index": "C", "name": "Sequence", "rating": 2200, "solvedCount": 5737, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Sequence<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>64 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Little Petya likes to play very much. And most of all he likes to play the following game:<\/p><p>He is given a sequence of <span class=\"tex-span\"><i>N<\/i><\/span> integer numbers. At each step it is allowed to increase the value of any number by <span class=\"tex-span\">1<\/span> or to decrease it by <span class=\"tex-span\">1<\/span>. The goal of the game is to make the sequence non-decreasing with the smallest number of steps. Petya is not good at math, so he asks for your help.<\/p><p>The sequence <span class=\"tex-span\"><i>a<\/i><\/span> is called non-decreasing if <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>\u2009\u2264\u2009...\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>N<\/i><\/sub><\/span> holds, where <span class=\"tex-span\"><i>N<\/i><\/span> is the length of the sequence.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains single integer <span class=\"tex-span\"><i>N<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>N<\/i>\u2009\u2264\u20095000<\/span>) \u2014 the length of the initial sequence. The following <span class=\"tex-span\"><i>N<\/i><\/span> lines contain one integer each \u2014 elements of the sequence. These numbers do not exceed <span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup><\/span> by absolute value.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output one integer \u2014 minimum number of steps required to achieve the goal.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>3 2 -1 2 11<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>2 1 1 1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 280, "index": "C", "name": "Game on Tree", "rating": 2200, "solvedCount": 5589, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Game on Tree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Momiji has got a rooted tree, consisting of <span class=\"tex-span\"><i>n<\/i><\/span> nodes. The tree nodes are numbered by integers from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span>. The root has number <span class=\"tex-span\">1<\/span>. Momiji decided to play a game on this tree.<\/p><p>The game consists of several steps. On each step, Momiji chooses one of the remaining tree nodes (let's denote it by <span class=\"tex-span\"><i>v<\/i><\/span>) and removes all the subtree nodes with the root in node <span class=\"tex-span\"><i>v<\/i><\/span> from the tree. Node <span class=\"tex-span\"><i>v<\/i><\/span> gets deleted as well. The game finishes when the tree has no nodes left. In other words, the game finishes after the step that chooses the node number <span class=\"tex-span\">1<\/span>.<\/p><p>Each time Momiji chooses a new node uniformly among all the remaining nodes. Your task is to find the expectation of the number of steps in the described game.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integer <span class=\"tex-span\"><i>n<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>)<\/span> \u2014 the number of nodes in the tree. The next <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> lines contain the tree edges. The <span class=\"tex-span\"><i>i<\/i><\/span>-th line contains integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>;\u00a0<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2260\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>)<\/span> \u2014 the numbers of the nodes that are connected by the <span class=\"tex-span\"><i>i<\/i><\/span>-th edge.<\/p><p>It is guaranteed that the given graph is a tree.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single real number \u2014 the expectation of the number of steps in the described game.<\/p><p>The answer will be considered correct if the absolute or relative error doesn't exceed <span class=\"tex-span\">10<sup class=\"upper-index\">\u2009-\u20096<\/sup><\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/>1 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1.50000000000000000000<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>1 2<br/>1 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2.00000000000000000000<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample, there are two cases. One is directly remove the root and another is remove the root after one step. Thus the expected steps are: <\/p><center class=\"tex-equation\"><span class=\"tex-span\">1\u2009\u00d7\u2009(1\u2009/\u20092)\u2009+\u20092\u2009\u00d7\u2009(1\u2009/\u20092)\u2009=\u20091.5<\/span><\/center><p>In the second sample, things get more complex. There are two cases that reduce to the first sample, and one case cleaned at once. Thus the expected steps are: <\/p><center class=\"tex-equation\"><span class=\"tex-span\">1\u2009\u00d7\u2009(1\u2009/\u20093)\u2009+\u2009(1\u2009+\u20091.5)\u2009\u00d7\u2009(2\u2009/\u20093)\u2009=\u2009(1\u2009/\u20093)\u2009+\u2009(5\u2009/\u20093)\u2009=\u20092<\/span><\/center><\/div><\/div>"}, {"contestId": 903, "index": "D", "name": "Almost Difference", "rating": 2200, "solvedCount": 5212, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Almost Difference<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Let's denote a function <\/p><p><img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/ccd6b10105ec02e1e62a5b638601921c152f8d05.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>You are given an array <span class=\"tex-span\"><i>a<\/i><\/span> consisting of <span class=\"tex-span\"><i>n<\/i><\/span> integers. You have to calculate the sum of <span class=\"tex-span\"><i>d<\/i>(<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>)<\/span> over all pairs <span class=\"tex-span\">(<i>i<\/i>,\u2009<i>j<\/i>)<\/span> such that <span class=\"tex-span\">1\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>j<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009200000<\/span>) \u2014 the number of elements in <span class=\"tex-span\"><i>a<\/i><\/span>.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub><\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">2<\/sub><\/span>, ..., <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) \u2014 elements of the array. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the sum of <span class=\"tex-span\"><i>d<\/i>(<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>)<\/span> over all pairs <span class=\"tex-span\">(<i>i<\/i>,\u2009<i>j<\/i>)<\/span> such that <span class=\"tex-span\">1\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>j<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1 2 3 1 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>6 6 5 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>6 6 4 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>-8<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example:<\/p><ol> <li> <span class=\"tex-span\"><i>d<\/i>(<i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>)\u2009=\u20090<\/span>; <\/li><li> <span class=\"tex-span\"><i>d<\/i>(<i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">3<\/sub>)\u2009=\u20092<\/span>; <\/li><li> <span class=\"tex-span\"><i>d<\/i>(<i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">4<\/sub>)\u2009=\u20090<\/span>; <\/li><li> <span class=\"tex-span\"><i>d<\/i>(<i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">5<\/sub>)\u2009=\u20092<\/span>; <\/li><li> <span class=\"tex-span\"><i>d<\/i>(<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">3<\/sub>)\u2009=\u20090<\/span>; <\/li><li> <span class=\"tex-span\"><i>d<\/i>(<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">4<\/sub>)\u2009=\u20090<\/span>; <\/li><li> <span class=\"tex-span\"><i>d<\/i>(<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">5<\/sub>)\u2009=\u20090<\/span>; <\/li><li> <span class=\"tex-span\"><i>d<\/i>(<i>a<\/i><sub class=\"lower-index\">3<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">4<\/sub>)\u2009=\u2009\u2009-\u20092<\/span>; <\/li><li> <span class=\"tex-span\"><i>d<\/i>(<i>a<\/i><sub class=\"lower-index\">3<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">5<\/sub>)\u2009=\u20090<\/span>; <\/li><li> <span class=\"tex-span\"><i>d<\/i>(<i>a<\/i><sub class=\"lower-index\">4<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">5<\/sub>)\u2009=\u20092<\/span>. <\/li><\/ol><\/div><\/div>"}, {"contestId": 1110, "index": "E", "name": "Magic Stones", "rating": 2200, "solvedCount": 5138, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Magic Stones<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Grigory has $$$n$$$ magic stones, conveniently numbered from $$$1$$$ to $$$n$$$. The <span class=\"tex-font-style-it\">charge<\/span> of the $$$i$$$-th stone is equal to $$$c_i$$$.<\/p><p>Sometimes Grigory gets bored and selects some <span class=\"tex-font-style-it\">inner<\/span> stone (that is, some stone with index $$$i$$$, where $$$2 \\le i \\le n - 1$$$), and after that <span class=\"tex-font-style-it\">synchronizes<\/span> it with neighboring stones. After that, the chosen stone loses its own charge, but acquires the charges from neighboring stones. In other words, its charge $$$c_i$$$ changes to $$$c_i' = c_{i + 1} + c_{i - 1} - c_i$$$.<\/p><p>Andrew, Grigory's friend, also has $$$n$$$ stones with charges $$$t_i$$$. Grigory is curious, whether there exists a sequence of zero or more <span class=\"tex-font-style-it\">synchronization<\/span> operations, which transforms charges of Grigory's stones into charges of corresponding Andrew's stones, that is, changes $$$c_i$$$ into $$$t_i$$$ for all $$$i$$$?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$2 \\le n \\le 10^5$$$)\u00a0\u2014 the number of magic stones.<\/p><p>The second line contains integers $$$c_1, c_2, \\ldots, c_n$$$ ($$$0 \\le c_i \\le 2 \\cdot 10^9$$$)\u00a0\u2014 the charges of Grigory's stones.<\/p><p>The second line contains integers $$$t_1, t_2, \\ldots, t_n$$$ ($$$0 \\le t_i \\le 2 \\cdot 10^9$$$)\u00a0\u2014 the charges of Andrew's stones.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If there exists a (possibly empty) sequence of <span class=\"tex-font-style-it\">synchronization<\/span> operations, which changes all charges to the required ones, print \"<span class=\"tex-font-style-tt\">Yes<\/span>\".<\/p><p>Otherwise, print \"<span class=\"tex-font-style-tt\">No<\/span>\".<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n7 2 4 12\n7 15 10 12\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYes\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n4 4 4\n1 2 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nNo\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, we can perform the following <span class=\"tex-font-style-it\">synchronizations<\/span> ($$$1$$$-indexed):<\/p><ul> <li> First, <span class=\"tex-font-style-it\">synchronize<\/span> the third stone $$$[7, 2, \\mathbf{4}, 12] \\rightarrow [7, 2, \\mathbf{10}, 12]$$$. <\/li><li> Then <span class=\"tex-font-style-it\">synchronize<\/span> the second stone: $$$[7, \\mathbf{2}, 10, 12] \\rightarrow [7, \\mathbf{15}, 10, 12]$$$. <\/li><\/ul><p>In the second example, any operation with the second stone will not change its charge.<\/p><\/div><\/div>"}, {"contestId": 587, "index": "C", "name": "Duff in the Army", "rating": 2200, "solvedCount": 5048, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Duff in the Army<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Recently Duff has been a soldier in the army. Malek is her commander.<\/p><p>Their country, Andarz Gu has <span class=\"tex-span\"><i>n<\/i><\/span> cities (numbered from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span>) and <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> bidirectional roads. Each road connects two different cities. There exist a unique path between any two cities.<\/p><p>There are also <span class=\"tex-span\"><i>m<\/i><\/span> people living in Andarz Gu (numbered from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>m<\/i><\/span>). Each person has and ID number. ID number of <span class=\"tex-span\"><i>i<\/i>\u2009-\u2009<i>th<\/i><\/span> person is <span class=\"tex-span\"><i>i<\/i><\/span> and he/she lives in city number <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. Note that there may be more than one person in a city, also there may be no people living in the city.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/5852be50a671d2e9035761c8f9faada538984257.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>Malek loves to order. That's why he asks Duff to answer to <span class=\"tex-span\"><i>q<\/i><\/span> queries. In each query, he gives her numbers <span class=\"tex-span\"><i>v<\/i>,\u2009<i>u<\/i><\/span> and <span class=\"tex-span\"><i>a<\/i><\/span>.<\/p><p>

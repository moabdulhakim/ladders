 valid assignments are<\/p><p>$$$0000\\\\ 0000\\\\ 0000$$$<\/p><p>and<\/p><p>$$$0000\\\\ 0010\\\\ 0000$$$<\/p><\/div><\/div>"}, {"contestId": 1943, "index": "C", "name": "Tree Compass", "rating": 2300, "solvedCount": 2763, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Tree Compass<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a tree with $$$n$$$ vertices numbered $$$1, 2, \\ldots, n$$$. Initially, all vertices are colored white.<\/p><p>You can perform the following two-step operation: <\/p><ol> <li> Choose a vertex $$$v$$$ ($$$1 \\leq v \\leq n$$$) and a distance $$$d$$$ ($$$0 \\leq d \\leq n-1$$$). <\/li><li> For all vertices $$$u$$$ ($$$1 \\leq u \\leq n$$$) such that $$$\\text{dist}^\\dagger(u,v)=d$$$, color $$$u$$$ black. <\/li><\/ol><p>Construct a sequence of operations to color all the nodes in the tree black using the minimum possible number of operations. It can be proven that it is always possible to do so using at most $$$n$$$ operations.<\/p><p>$$$^\\dagger$$$ $$$\\text{dist}(x, y)$$$ denotes the number of edges on the (unique) simple path between vertices $$$x$$$ and $$$y$$$ on the tree.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 200$$$)\u00a0\u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^3$$$)\u00a0\u2014 the number of vertices of the tree.<\/p><p>The following $$$n - 1$$$ lines of each test case describe the edges of the tree. The $$$i$$$-th of these lines contains two integers $$$u_i$$$ and $$$v_i$$$ ($$$1 \\le u_i, v_i \\le n$$$, $$$u_i \\neq v_i$$$), the indices of the vertices connected by the $$$i$$$-th edge.<\/p><p>It is guaranteed that the given edges form a tree.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^3$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, first output a single integer $$$op$$$\u00a0$$$(1 \\le op \\le n)$$$, the minimum number of operations needed to color all vertices of the tree black.<\/p><p>Then, output $$$op$$$ lines, each containing $$$2$$$ integers. The $$$i$$$-th line should contain the values of $$$v$$$ and $$$d$$$ chosen for the $$$i$$$-th operation ($$$1 \\le v \\le n$$$, $$$0 \\le d \\le n - 1$$$)<\/p><p>You must guarantee that at the end of $$$op$$$ operations, all vertices are colored black.<\/p><p>If there are multiple solutions, you may output any one of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">7<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 7<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n1 0\n2\n1 1\n2 1\n2\n1 1\n2 1\n3\n6 1\n7 1\n2 1<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, there is only one possible operation, and performing it gives us a valid answer.<\/p><p>In the second test case, the first operation colors vertex $$$2$$$ black, and the second operation colors vertex $$$1$$$ black. It can be shown that it is impossible to color both vertices black in one operation, so the minimum number of operations needed is $$$2$$$. Another possible solution is to use the $$$2$$$ operations: $$$(u, r) = (1, 0)$$$ and $$$(u, r) = (2, 0)$$$.<\/p><p>In the third test case, the first operation colors vertices $$$2$$$, $$$3$$$ and $$$4$$$ black, and the second operation colors vertex $$$1$$$ black. Again, it can be shown that it is impossible to color all vertices black in $$$1$$$ operation, so the minimum number of operations needed is $$$2$$$.<\/p><p>In the fourth test case, the first operation colors vertices $$$4$$$, $$$1$$$ and $$$7$$$ black, the second operation colors vertices $$$2$$$, $$$5$$$ and $$$6$$$ black while the third operation colors vertices $$$3$$$ and $$$7$$$ black. Notice that it is allowed to color vertex $$$7$$$ black twice.<\/p><p>Thus, each node was marked at least once, with node $$$7$$$ marked twice. It can be shown that it is impossible to color all vertices black in fewer than $$$3$$$ moves.<\/p><\/div><\/div>"}, {"contestId": 1916, "index": "E", "name": "Happy Life in University", "rating": 2300, "solvedCount": 2762, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Happy Life in University<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Egor and his friend Arseniy are finishing school this year and will soon enter university. And since they are very responsible guys, they have started preparing for admission already.<\/p><p>First of all, they decided to take care of where they will live for the long four years of study, and after visiting the university's website, they found out that the university dormitory can be represented as a root tree with $$$n$$$ vertices with the root at vertex $$$1$$$. In the tree, each vertex represents a recreation with some type of activity $$$a_i$$$. The friends need to choose $$$2$$$ recreations (not necessarily different) in which they will settle. The guys are convinced that the more the value of the following function $$$f(u, v) = diff(u, lca(u, v)) \\cdot diff(v, lca(u, v))$$$, the more fun their life will be. Help Egor and Arseniy and find the maximum value of $$$f(u, v)$$$ among all pairs of recreations!<\/p><p>$$$^{\\dagger} diff(u, v)$$$\u00a0\u2014 the number of different activities listed on the simple path from vertex $$$u$$$ to vertex $$$v$$$.<\/p><p>$$$^{\\dagger} lca(u, v)$$$\u00a0\u2014 a vertex $$$p$$$ such that it is at the maximum distance from the root and is a parent of both vertex $$$u$$$ and vertex $$$v$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test consists of several test cases. The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^5$$$)\u00a0\u2014 the number of test cases. Then follows the description of the test cases.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 3 \\cdot 10^{5}$$$).<\/p><p>The second line of each test case contains $$${n - 1}$$$ integers $$$p_2, p_3, \\ldots,p_n$$$ ($$$1 \\le p_i \\le i - 1$$$), where $$$p_i$$$\u00a0\u2014 the parent of vertex $$$i$$$.<\/p><p>The third line of each test case contains $$${n}$$$ integers $$$a_1, a_2, \\ldots,a_n$$$ ($$$1 \\le a_i \\le n$$$), where $$$a_i$$$\u00a0\u2014 the number of the activity located at vertex $$$i$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$3 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output the maximum value of $$$f(u, v)$$$ for all pairs of recreations $$$(u, v)$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">7<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 1 2 2 3 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">6 5 2 3 6 5 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">13<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 1 1 2 2 2 3 3 4 5 6 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 2 2 1 4 9 7 2 5 2 1 11 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">12<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 1 1 2 2 3 4 4 7 7 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">11 2 1 11 12 8 5 8 8 5 11 7<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n9\n9\n12\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Consider the fourth test case. The tree has the following structure: <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/947988d0a788becb23c9d8c30448e9c51c38c2f2.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center> All recreations are colored. The same colors mean that the activities in the recreations match. Consider the pair of vertices $$$(11, 12)$$$, $$$lca(11, 12) = 1$$$. Write down all activities on the path from $$$11$$$ to $$$1$$$\u00a0\u2014 $$$[11, 5, 1, 11]$$$, among them there are $$$3$$$ different activities, so $$$diff(11, 1) = 3$$$. Also write down all activities on the path from $$$12$$$ to $$$1$$$\u00a0\u2014 $$$[7, 8, 2, 11]$$$, among them there are $$$4$$$ different activities, so $$$diff(12, 1) = 4$$$. We get that $$$f(11, 12) = diff(12, 1) \\cdot diff(11, 1) = 4 \\cdot 3 = 12$$$, which is the answer for this tree. It can be shown that a better answer is impossible to obtain.<\/div><\/div>"}, {"contestId": 2057, "index": "E1", "name": "Another Exercise on Graphs (Easy Version)", "rating": 2300, "solvedCount": 2715, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E1. Another Exercise on Graphs (Easy Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>1024 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is the easy version of the problem. The difference between the versions is that in this version, there is an additional constraint on $$$m$$$. You can hack only if you solved all versions of this problem.<\/span> <\/p><p>Recently, the instructors of \"T-generation\" needed to create a training contest. They were missing one problem, and there was not a single problem on graphs in the contest, so they came up with the following problem.<\/p><p>You are given a connected weighted undirected graph with $$$n$$$ vertices and $$$m$$$ edges, which does not contain self-loops or multiple edges.<\/p><p>There are $$$q$$$ queries of the form $$$(a, b, k)$$$: among all paths from vertex $$$a$$$ to vertex $$$b$$$, find the smallest $$$k$$$-th maximum weight of edges on the path$$$^{\\dagger}$$$.<\/p><p>The instructors thought that the problem sounded very interesting, but there is one catch. They do not know how to solve it. Help them and solve the problem, as there are only a few hours left until the contest starts.<\/p><p>$$$^{\\dagger}$$$ Let $$$w_1 \\ge w_2 \\ge \\ldots \\ge w_{h}$$$ be the weights of all edges in a path, in non-increasing order. The $$$k$$$-th maximum weight of the edges on this path is $$$w_{k}$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 100$$$)\u00a0\u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each set of test case contains three integers $$$n, m$$$ and $$$q$$$ ($$$2 \\le n \\le 400$$$, $$$n - 1 \\le m \\le \\operatorname{min}(\\mathbf{400}, \\frac{n \\cdot (n - 1)}{2})$$$, $$$1 \\le q \\le 3 \\cdot 10^5$$$)\u00a0\u2014 the number of vertices, the number of edges, and the number of questions, respectively.<\/p><p>Each of the following $$$m$$$ lines of each set of test case contains three integers $$$v, u$$$ and $$$w$$$ ($$$1 \\le v, u \\le n$$$, $$$1 \\le w \\le 10^9$$$)\u00a0\u2014 the ends of the next edge of the graph and its weight, respectively. It is guaranteed that the graph does not contain self-loops and multiple edges.<\/p><p>Each of the following $$$q$$$ lines of each set of test case contains three integers $$$a, b$$$ and $$$k$$$ ($$$1 \\le a, b \\le n$$$, $$$k \\ge 1$$$)\u00a0\u2014 the next question. It is guaranteed that any path from vertex $$$a$$$ to vertex $$$b$$$ contains at least $$$k$$$ edges.<\/p><p>It is guaranteed that the sum of the values of $$$n$$$ across all sets of test cases does not exceed $$$400$$$.<\/p><p>It is guaranteed that the sum of the values of $$$m$$$ across all sets of test cases does not exceed $$$400$$$.<\/p><p>It is guaranteed that the sum of the values of $$$q$$$ across all sets of test cases does not exceed $$$3 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output the answers to all questions.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 4 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 4 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 3 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 4 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 4 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 3 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">6 7 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 3 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 4 9<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 5 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 6 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 4 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 6 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 6 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 6 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 4 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">11 17 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 4 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 3 19<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 2 13<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 5 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 6 11<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 5 9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 6 18<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 7 17<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 8 15<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 10 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6 9 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 10 20<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 8 16<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">8 11 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">9 11 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">10 11 14<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 11 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 11 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 11 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 11 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 11 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">8 2 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">10 4 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 9 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 9 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6 7 3<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 2\n2 9 9\n11 3 11 1 3 10 8 4 11 4\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first set of test cases, one of the optimal paths in the first query is the path $$$1 \\rightarrow 3 \\rightarrow 4$$$; the $$$2$$$-nd maximum weight of the edges on this path is $$$1$$$. In the second query, one of the optimal paths is $$$2 \\rightarrow 4 \\rightarrow 3$$$; $$$1$$$-st maximum weight of the edges is $$$2$$$.<\/p><p>In the second set of input data, one of the optimal paths in the first query is the path $$$1 \\rightarrow 2 \\rightarrow 4 \\rightarrow 5 \\rightarrow 6$$$; the $$$3$$$-rd maximum weight of the edges on this path is $$$2$$$.<\/p><\/div><\/div>"}, {"contestId": 788, "index": "C", "name": "The Great Mixing", "rating": 2300, "solvedCount": 2696, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. The Great Mixing<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Sasha and Kolya decided to get drunk with Coke, again. This time they have <span class=\"tex-span\"><i>k<\/i><\/span> types of Coke. <span class=\"tex-span\"><i>i<\/i><\/span>-th type is characterised by its carbon dioxide concentration <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/7223e2da7cf0d001a3a06ab38023d8f967968d61.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>. Today, on the party in honour of Sergiy of Vancouver they decided to prepare a glass of Coke with carbon dioxide concentration <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/3f84b61691275b2806285c0208e93684ddff5912.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>. The drink should also be tasty, so the glass can contain only integer number of liters of each Coke type (some types can be not presented in the glass). Also, they want to minimize the total volume of Coke in the glass.<\/p><p>Carbon dioxide concentration is defined as the volume of carbone dioxide in the Coke divided by the total volume of Coke. When you mix two Cokes, the volume of carbon dioxide sums up, and the total volume of Coke sums up as well.<\/p><p>Help them, find the minimal natural number of liters needed to create a glass with carbon dioxide concentration <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/3f84b61691275b2806285c0208e93684ddff5912.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>. Assume that the friends have unlimited amount of each Coke type.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20091000<\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup><\/span>)\u00a0\u2014 carbon dioxide concentration the friends want and the number of Coke types.<\/p><p>The second line contains <span class=\"tex-span\"><i>k<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u20091000<\/span>)\u00a0\u2014 carbon dioxide concentration of each type of Coke. Some Coke types can have same concentration.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the minimal natural number of liter needed to prepare a glass with carbon dioxide concentration <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/3f84b61691275b2806285c0208e93684ddff5912.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>, or <span class=\"tex-font-style-tt\">-1<\/span> if it is impossible.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>400 4<br/>100 300 450 500<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>50 2<br/>100 25<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample case, we can achieve concentration <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/bed0f5c3640139492194728ccc3ac55accf16a8e.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> using one liter of Coke of types <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/9b37ab6b0795f08ffcc699d9101a9efb89374478.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> and <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/d82574f3d78c4bd9d8ab9bda103e05a51e1b3161.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>: <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/b23f59a536403f9a2364e971aa0bfc9a3411b366.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>.<\/p><p>In the second case, we can achieve concentration <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/46aa9afb7ee4d932ca2c3f0d6535a9955fc8f0a8.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> using two liters of <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/69b8967d23533c2caada3910f564294509450a59.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> type and one liter of <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/abf5cbf9e8a81a0eff83ff53574dcabb097df44e.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> type: <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/4d2331fc733efc58d37745ff9a495a116ebd7e8a.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>.<\/p><\/div><\/div>"}, {"contestId": 1592, "index": "D", "name": "Hemose in ICPC ?", "rating": 2300, "solvedCount": 2671, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Hemose in ICPC ?<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is an interactive problem!<\/span><\/p><p><span class=\"tex-font-style-it\">In the last regional contest Hemose, ZeyadKhattab and YahiaSherif \u2014 members of the team Carpe Diem \u2014 did not qualify to ICPC because of some <span class=\"tex-font-style-striked\">un<\/span>known reasons. Hemose was very sad and had a bad day after the contest, but ZeyadKhattab is very wise and knows Hemose very well, and does not want to see him sad.<\/span><\/p><p>Zeyad knows that Hemose loves tree problems, so he gave him a tree problem with a very special device.<\/p><p>Hemose has a weighted tree with $$$n$$$ nodes and $$$n-1$$$ edges. Unfortunately, Hemose doesn't remember the weights of edges.<\/p><p>Let's define $$$Dist(u, v)$$$ for $$$u\\neq v$$$ as the greatest common divisor of the weights of all edges on the path from node $$$u$$$ to node $$$v$$$.<\/p><p>Hemose has a special device. Hemose can give the device a set of nodes, and the device will return the largest $$$Dist$$$ between any two nodes from the set. More formally, if Hemose gives the device a set $$$S$$$ of nodes, the device will return the largest value of $$$Dist(u, v)$$$ over all pairs $$$(u, v)$$$ with $$$u$$$, $$$v$$$ $$$\\in$$$ $$$S$$$ and $$$u \\neq v$$$.<\/p><p>Hemose can use this Device <span class=\"tex-font-style-bf\">at most $$$12$$$ times<\/span>, and wants to find any two distinct nodes $$$a$$$, $$$b$$$, such that $$$Dist(a, b)$$$ is maximum possible. Can you help him?<\/p><\/div><div><div class=\"section-title\">Interaction<\/div><p>Begin the interaction from reading a single integer $$$n$$$ ($$$2 \\le n \\le 10^3$$$) \u2014 the number of nodes in the tree.<\/p><p>Next, read $$$n-1$$$ lines. <\/p><p>The $$$i$$$-th of the next $$$n-1$$$ lines contains two integers $$$u_i$$$ and $$$v_i$$$ ($$$1 \\leq u_i, v_i \\leq n$$$, $$$u_i\\neq v_i$$$), which means that there's an edge between nodes $$$u_i$$$ and $$$v_i$$$.<\/p><p><span class=\"tex-font-style-bf\">It's guaranteed that weights of edges were $$$\\leq 10^9$$$<\/span>.<\/p><p>It is guaranteed that the given graph is a tree.<\/p><p>Now you may begin asking queries. To ask a query about a set of $$$k$$$ nodes $$$v_1, v_2, \\ldots, v_k$$$ ($$$2 \\le k \\le n$$$, $$$1 \\le v_i \\le n$$$, all $$$v_i$$$ are distinct), output:<\/p><p> <span class=\"tex-font-style-tt\">?<\/span> $$$k$$$ $$$v_1$$$ $$$v_2$$$ $$$\\ldots$$$ $$$v_k$$$<\/p><p>You will then receive an integer $$$x$$$, the largest $$$Dist(v_i, v_j)$$$ over $$$1 \\le i, j \\le k$$$ with $$$i \\neq j$$$.<\/p><p>When you have found $$$a$$$ and $$$b$$$ ($$$1 \\le a, b \\le n)$$$, $$$a\\neq b$$$) such that $$$Dist(a, b)$$$ is the maximum possible, print the answer in the following format: <\/p><p><span class=\"tex-font-style-tt\">!<\/span> $$$a$$$ $$$b$$$ <\/p><p><span class=\"tex-font-style-bf\">Outputting answer doesn't count towards the limit of $$$12$$$ queries.<\/span><\/p><p>If there are several pairs $$$(a, b)$$$ with the same largest $$$Dist(a, b)$$$, you can output any.<\/p><p>After printing a query do not forget to output the end of line and flush the output. Otherwise, you will get <span class=\"tex-font-style-tt\">Idleness limit exceeded<\/span>. To do this, use:<\/p><ul><li> <span class=\"tex-font-style-tt\">fflush(stdout)<\/span> or <span class=\"tex-font-style-tt\">cout.flush()<\/span> in C++;<\/li><li> <span class=\"tex-font-style-tt\">System.out.flush()<\/span> in Java;<\/li><li> <span class=\"tex-font-style-tt\">flush(output)<\/span> in Pascal;<\/li><li> <span class=\"tex-font-style-tt\">stdout.flush()<\/span> in Python;<\/li><li> see the documentation for other languages.<\/li><\/ul><p><span class=\"tex-font-style-bf\">Hacks<\/span><\/p><p>To hack a solution, use the following format.<\/p><p>The first line should contain a single integer $$$n$$$ $$$(2 \\leq n \\le 10^3)$$$ \u2014 the number of nodes.<\/p><p>The $$$i$$$-th of the next $$$n-1$$$ lines should contain three integers $$$u_i$$$, $$$v_i$$$, $$$w_i$$$ ($$$1 \\le u_i, v_i \\le n$$$, $$$u_i\\ne v_i$$$, $$$1 \\le w \\le 10^9$$$), which means that there's an edge between nodes $$$u_i$$$ and $$$v_i$$$ with weight $$$w_i$$$.<\/p><p>These $$$n-1$$$ edges must form a tree.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n1 2\n2 3\n2 4\n1 5\n5 6\n\n10\n\n2\n\n10<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n? 6 1 2 3 4 5 6\n\n? 3 3 1 5\n\n? 2 1 2\n\n! 1 2<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The tree in the first sample:<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/95034b9f439b1b157cce2e6fa244abba79809d94.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><\/div><\/div>"}, {"contestId": 1251, "index": "E1", "name": "Voting (Easy Version)", "rating": 2300, "solvedCount": 2670, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E1. Voting (Easy Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">The only difference between easy and hard versions is constraints.<\/span><\/p><p>Now elections are held in Berland and you want to win them. More precisely, you want everyone to vote for you.<\/p><p>There are $$$n$$$ voters, and two ways to convince each of them to vote for you. The first way to convince the $$$i$$$-th voter is to pay him $$$p_i$$$ coins. The second way is to make $$$m_i$$$ other voters vote for you, and the $$$i$$$-th voter will vote for free.<\/p><p>Moreover, the process of such voting takes place in several steps. For example, if there are five voters with $$$m_1 = 1$$$, $$$m_2 = 2$$$, $$$m_3 = 2$$$, $$$m_4 = 4$$$, $$$m_5 = 5$$$, then you can buy the vote of the fifth voter, and eventually everyone will vote for you. Set of people voting for you will change as follows: $$${5} \\rightarrow {1, 5} \\rightarrow {1, 2, 3, 5} \\rightarrow {1, 2, 3, 4, 5}$$$.<\/p><p>Calculate the minimum number of coins you have to spend so that everyone votes for you.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 5000$$$) \u2014 the number of test cases.<\/p><p>The first line of each test case contains one integer $$$n$$$ ($$$1 \\le n \\le 5000$$$) \u2014 the number of voters.<\/p><p>The next $$$n$$$ lines contains the description of voters. $$$i$$$-th line contains two integers $$$m_i$$$ and $$$p_i$$$ ($$$1 \\le p_i \\le 10^9, 0 \\le m_i  \\lt  n$$$).<\/p><p>It is guaranteed that the sum of all $$$n$$$ over all test cases does not exceed $$$5000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case print one integer \u2014 the minimum number of coins you have to spend so that everyone votes for you.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n3\n1 5\n2 10\n2 8\n7\n0 1\n3 1\n1 1\n6 1\n1 1\n4 1\n4 1\n6\n2 6\n2 3\n2 8\n2 7\n4 4\n5 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n8\n0\n7\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case you have to buy vote of the third voter. Then the set of people voting for you will change as follows: $$${3} \\rightarrow {1, 3} \\rightarrow {1, 2, 3}$$$.<\/p><p>In the second example you don't need to buy votes. The set of people voting for you will change as follows: $$${1} \\rightarrow {1, 3, 5} \\rightarrow {1, 2, 3, 5} \\rightarrow {1, 2, 3, 5, 6, 7} \\rightarrow {1, 2, 3, 4, 5, 6, 7}$$$.<\/p><p>In the third test case you have to buy votes of the second and the fifth voters. Then the set of people voting for you will change as follows: $$${2, 5} \\rightarrow {1, 2, 3, 4, 5} \\rightarrow {1, 2, 3, 4, 5, 6}$$$.<\/p><\/div><\/div>"}, {"contestId": 1919, "index": "F1", "name": "Wine Factory (Easy Version)", "rating": 2300, "solvedCount": 2667, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F1. Wine Factory (Easy Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is the easy version of the problem. The only difference between the two versions is the constraint on $$$c_i$$$ and $$$z$$$. You can make hacks only if both versions of the problem are solved.<\/span><\/p><p>There are three arrays $$$a$$$, $$$b$$$ and $$$c$$$. $$$a$$$ and $$$b$$$ have length $$$n$$$ and $$$c$$$ has length $$$n-1$$$. Let $$$W(a,b,c)$$$ denote the liters of wine created from the following process.<\/p><p>Create $$$n$$$ water towers. The $$$i$$$-th water tower initially has $$$a_i$$$ liters of water and has a wizard with power $$$b_i$$$ in front of it. Furthermore, for each $$$1 \\le i \\le n - 1$$$, there is a valve connecting water tower $$$i$$$ to $$$i + 1$$$ with capacity $$$c_i$$$.<\/p><p>For each $$$i$$$ from $$$1$$$ to $$$n$$$ in this order, the following happens: <\/p><ol> <li> The wizard in front of water tower $$$i$$$ removes at most $$$b_i$$$ liters of water from the tower and turns the removed water into wine. <\/li><li> If $$$i \\neq n$$$, at most $$$c_i$$$ liters of the remaining water left in water tower $$$i$$$ flows through the valve into water tower $$$i + 1$$$. <\/li><\/ol><p>There are $$$q$$$ updates. In each update, you will be given integers $$$p$$$, $$$x$$$, $$$y$$$ and $$$z$$$ and you will update $$$a_p := x$$$, $$$b_p := y$$$ and $$$c_p := z$$$. After each update, find the value of $$$W(a,b,c)$$$. Note that previous updates to arrays $$$a$$$, $$$b$$$ and $$$c$$$ persist throughout future updates.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$q$$$ ($$$2 \\le n \\le 5\\cdot 10^5$$$, $$$1 \\le q \\le 5\\cdot 10^5$$$)\u00a0\u2014 the number of water towers and the number of updates.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$0 \\le a_i \\le 10^9$$$)\u00a0\u2014 the number of liters of water in water tower $$$i$$$.<\/p><p>The third line contains $$$n$$$ integers $$$b_1, b_2, \\ldots, b_n$$$ ($$$0 \\le b_i \\le 10^9$$$)\u00a0\u2014 the power of the wizard in front of water tower $$$i$$$.<\/p><p>The fourth line contains $$$n - 1$$$ integers $$$c_1, c_2, \\ldots, c_{n - 1}$$$ ($$$c_i \\color{red}{=} 10^{18}$$$)\u00a0\u2014 the capacity of the pipe connecting water tower $$$i$$$ to $$$i + 1$$$.<\/p><p>Each of the next $$$q$$$ lines contains four integers $$$p$$$, $$$x$$$, $$$y$$$ and $$$z$$$ ($$$1 \\le p \\le n$$$, $$$0 \\le x, y \\le 10^9$$$, $$$z \\color{red}{=} 10^{18}$$$)\u00a0\u2014 the updates done to arrays $$$a$$$, $$$b$$$ and $$$c$$$.<\/p><p>Note that $$$c_n$$$ does not exist, so the value of $$$z$$$ does not matter when $$$p = n$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$q$$$ lines, each line containing a single integer representing $$$W(a, b, c)$$$ after each update.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">3 3 3 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">1 4 2 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">1000000000000000000 1000000000000000000 1000000000000000000<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">4 3 8 1000000000000000000<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">2 5 1 1000000000000000000<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">3 0 0 1000000000000000000<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n12\n12\n10\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">10 3 8 9 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">3 4 10 8 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">1000000000000000000 1000000000000000000 1000000000000000000 1000000000000000000<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">5 4 9 1000000000000000000<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">1 1 1 1000000000000000000<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">2 7 4 1000000000000000000<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">4 1 1 1000000000000000000<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">1 8 3 1000000000000000000<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n34\n25\n29\n21\n27\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The first update does not make any modifications to the arrays. <\/p><ul> <li> When $$$i = 1$$$, there are $$$3$$$ liters of water in tower 1 and $$$1$$$ liter of water is turned into wine. The remaining $$$2$$$ liters of water flow into tower 2. <\/li><li> When $$$i = 2$$$, there are $$$5$$$ liters of water in tower 2 and $$$4$$$ liters of water is turned into wine. The remaining $$$1$$$ liter of water flows into tower 3. <\/li><li> When $$$i = 3$$$, there are $$$4$$$ liters of water in tower 3 and $$$2$$$ liters of water is turned into wine. The remaining $$$2$$$ liters of water flows into tower 4. <\/li><li> When $$$i = 4$$$, there are $$$5$$$ liters of water in tower 4. All $$$5$$$ liters of water are turned into wine. <\/li><\/ul><p>Hence, $$$W(a,b,c)=1 + 4 + 2 + 5 = 12$$$ after the first update.<\/p><p>The second update modifies the arrays to $$$a = [3, 5, 3, 3]$$$, $$$b = [1, 1, 2, 8]$$$, and $$$c = [10^{18}, 10^{18}, 10^{18}]$$$.<\/p><ul> <li> When $$$i = 1$$$, there are $$$3$$$ liters of water in tower 1 and $$$1$$$ liter of water is turned into wine. The remaining $$$2$$$ liters of water flow into tower 2. <\/li><li> When $$$i = 2$$$, there are $$$7$$$ liters of water in tower 2 and $$$1$$$ liter of water is turned into wine. The remaining $$$6$$$ liters of water flow into tower 3. <\/li><li> When $$$i = 3$$$, there are $$$9$$$ liters of water in tower 3 and $$$2$$$ liters of water is turned into wine. The remaining $$$7$$$ liters of water flow into tower 4. <\/li><li> When $$$i = 4$$$, there are $$$10$$$ liters of water in tower 4. Only $$$8$$$ liters of water is turned into wine. <\/li><\/ul><p>Hence, $$$W(a,b,c)=1 + 1 + 2 + 8 = 12$$$ after the second update.<\/p><p>The third update modifies the arrays to $$$a = [3, 5, 0, 3]$$$, $$$b = [1, 1, 0, 8]$$$, and $$$c = [10^{18}, 10^{18}, 10^{18}]$$$.<\/p><ul> <li> When $$$i = 1$$$, there are $$$3$$$ liters of water in tower 1 and $$$1$$$ liter of water is turned into wine. The remaining $$$2$$$ liters of water flow into tower 2. <\/li><li> When $$$i = 2$$$, there are $$$7$$$ liters of water in tower 2 and $$$1$$$ liter of water is turned into wine. The remaining $$$6$$$ liters of water flow into tower 3. <\/li><li> When $$$i = 3$$$, there are $$$6$$$ liters of water in tower 3 and $$$0$$$ liters of water is turned into wine. The remaining $$$6$$$ liters of water flow into tower 4. <\/li><li> When $$$i = 4$$$, there are $$$9$$$ liters of water in tower 4. Only $$$8$$$ liters of water is turned into wine. <\/li><\/ul><p>Hence, $$$W(a,b,c)=1 + 1 + 0 + 8 = 10$$$ after the third update.<\/p><\/div><\/div>"}, {"contestId": 893, "index": "F", "name": "Subtree Minimum Query", "rating": 2300, "solvedCount": 2627, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Subtree Minimum Query<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>6 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a rooted tree consisting of <span class=\"tex-span\"><i>n<\/i><\/span> vertices. Each vertex has a number written on it; number <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is written on vertex <span class=\"tex-span\"><i>i<\/i><\/span>.<\/p><p>Let's denote <span class=\"tex-span\"><i>d<\/i>(<i>i<\/i>,\u2009<i>j<\/i>)<\/span> as the distance between vertices <span class=\"tex-span\"><i>i<\/i><\/span> and <span class=\"tex-span\"><i>j<\/i><\/span> in the tree (that is, the number of edges in the shortest path from <span class=\"tex-span\"><i>i<\/i><\/span> to <span class=\"tex-span\"><i>j<\/i><\/span>). Also let's denote the <span class=\"tex-font-style-it\"><span class=\"tex-span\"><i>k<\/i><\/span>-blocked subtree<\/span> of vertex <span class=\"tex-span\"><i>x<\/i><\/span> as the set of vertices <span class=\"tex-span\"><i>y<\/i><\/span> such that both these conditions are met:<\/p><ul> <li> <span class=\"tex-span\"><i>x<\/i><\/span> is an ancestor of <span class=\"tex-span\"><i>y<\/i><\/span> (every vertex is an ancestor of itself); <\/li><li> <span class=\"tex-span\"><i>d<\/i>(<i>x<\/i>,\u2009<i>y<\/i>)\u2009\u2264\u2009<i>k<\/i><\/span>. <\/li><\/ul><p>You are given <span class=\"tex-span\"><i>m<\/i><\/span> queries to the tree. <span class=\"tex-span\"><i>i<\/i><\/span>-th query is represented by two numbers <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>k<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, and the answer to this query is the minimum value of <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span> among such vertices <span class=\"tex-span\"><i>j<\/i><\/span> such that <span class=\"tex-span\"><i>j<\/i><\/span> belongs to <span class=\"tex-span\"><i>k<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>-blocked subtree of <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>.<\/p><p>Write a program that would process these queries quickly!<\/p><p><span class=\"tex-font-style-bf\">Note that the queries are given in a modified way<\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>r<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009100000<\/span>) \u2014 the number of vertices in the tree and the index of the root, respectively.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) \u2014 the numbers written on the vertices.<\/p><p>Then <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> lines follow, each containing two integers <span class=\"tex-span\"><i>x<\/i><\/span> and <span class=\"tex-span\"><i>y<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i>,\u2009<i>y<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>) and representing an edge between vertices <span class=\"tex-span\"><i>x<\/i><\/span> and <span class=\"tex-span\"><i>y<\/i><\/span>. It is guaranteed that these edges form a tree.<\/p><p>Next line contains one integer <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup><\/span>) \u2014 the number of queries to process.<\/p><p>Then <span class=\"tex-span\"><i>m<\/i><\/span> lines follow, <span class=\"tex-span\"><i>i<\/i><\/span>-th line containing two numbers <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>q<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, which can be used to restore <span class=\"tex-span\"><i>i<\/i><\/span>-th query (<span class=\"tex-span\">1\u2009\u2264\u2009<i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>q<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>).<\/p><p><span class=\"tex-span\"><i>i<\/i><\/span>-th query can be restored as follows:<\/p><p>Let <span class=\"tex-span\"><i>last<\/i><\/span> be the answer for previous query (or <span class=\"tex-span\">0<\/span> if <span class=\"tex-span\"><i>i<\/i>\u2009=\u20091<\/span>). Then <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009=\u2009((<i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009+\u2009<i>last<\/i>)\u2009<i>mod<\/i>\u2009<i>n<\/i>)\u2009+\u20091<\/span>, and <span class=\"tex-span\"><i>k<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009=\u2009(<i>q<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009+\u2009<i>last<\/i>)\u2009<i>mod<\/i>\u2009<i>n<\/i><\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>m<\/i><\/span> integers. <span class=\"tex-span\"><i>i<\/i><\/span>-th of them has to be equal to the answer to <span class=\"tex-span\"><i>i<\/i><\/span>-th query.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 2<br/>1 3 2 3 5<br/>2 3<br/>5 1<br/>3 4<br/>4 1<br/>2<br/>1 2<br/>2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/>5<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1553, "index": "F", "name": "Pairwise Modulo", "rating": 2300, "solvedCount": 2625, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Pairwise Modulo<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You have an array $$$a$$$ consisting of $$$n$$$ distinct positive integers, numbered from $$$1$$$ to $$$n$$$. Define $$$p_k$$$ as $$$$$$p_k = \\sum_{1 \\le i, j \\le k} a_i \\bmod a_j,$$$$$$ where $$$x \\bmod y$$$ denotes the remainder when $$$x$$$ is divided by $$$y$$$. You have to find and print $$$p_1, p_2, \\ldots, p_n$$$. <\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains $$$n$$$ \u2014 the length of the array ($$$2 \\le n \\le 2 \\cdot 10^5$$$).<\/p><p>The second line contains $$$n$$$ space-separated distinct integers $$$a_1, \\ldots, a_n$$$ ($$$1 \\le a_i \\le 3 \\cdot 10^5$$$, $$$a_i \\neq a_j$$$ if $$$i \\neq j$$$). <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$n$$$ integers $$$p_1, p_2, \\ldots, p_n$$$. <\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n6 2 7 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0 2 12 22\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n3 2 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0 3 5\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 149, "index": "E", "name": "Martian Strings", "rating": 2300, "solvedCount": 2616, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Martian Strings<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>During the study of the Martians Petya clearly understood that the Martians are absolutely lazy. They like to sleep and don't like to wake up. <\/p><p>Imagine a Martian who has exactly <span class=\"tex-span\"><i>n<\/i><\/span> eyes located in a row and numbered from the left to the right from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span>. When a Martian sleeps, he puts a patch on each eye (so that the Martian morning doesn't wake him up). The inner side of each patch has an uppercase Latin letter. So, when a Martian wakes up and opens all his eyes he sees a string <span class=\"tex-span\"><i>s<\/i><\/span> consisting of uppercase Latin letters. The string's length is <span class=\"tex-span\"><i>n<\/i><\/span>. <\/p><p>\"Ding dong!\" \u2014 the alarm goes off. A Martian has already woken up but he hasn't opened any of his eyes. He feels that today is going to be a hard day, so he wants to open his eyes and see something good. The Martian considers only <span class=\"tex-span\"><i>m<\/i><\/span> Martian words beautiful. Besides, it is hard for him to open all eyes at once so early in the morning. So he opens two non-overlapping segments of consecutive eyes. <span class=\"tex-font-style-bf\">More formally, the Martian chooses four numbers <span class=\"tex-span\"><i>a<\/i><\/span>, <span class=\"tex-span\"><i>b<\/i><\/span>, <span class=\"tex-span\"><i>c<\/i><\/span>, <span class=\"tex-span\"><i>d<\/i><\/span>, (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i>\u2009\u2264\u2009<i>b<\/i>\u2009&lt;\u2009<i>c<\/i>\u2009\u2264\u2009<i>d<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>) and opens all eyes with numbers <span class=\"tex-span\"><i>i<\/i><\/span> such that <span class=\"tex-span\"><i>a<\/i>\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>b<\/i><\/span> or <span class=\"tex-span\"><i>c<\/i>\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>d<\/i><\/span>.<\/span> After the Martian opens the eyes he needs, he reads all the visible characters from the left to the right and thus, he sees some word.<\/p><p>Let's consider all different words the Martian can see in the morning. Your task is to find out how many beautiful words are among them.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a non-empty string <span class=\"tex-span\"><i>s<\/i><\/span> consisting of uppercase Latin letters. The strings' length is <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>). The second line contains an integer <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u2009100<\/span>) \u2014 the number of beautiful words. Next <span class=\"tex-span\"><i>m<\/i><\/span> lines contain the beautiful words <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, consisting of uppercase Latin letters. Their length is from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\">1000<\/span>. All beautiful strings are pairwise different.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the single integer \u2014 the number of different beautiful strings the Martian can see this morning.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>ABCBABA<br/>2<br/>BAAB<br/>ABBA<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Let's consider the sample test. There the Martian can get only the second beautiful string if he opens segments of eyes <span class=\"tex-span\"><i>a<\/i>\u2009=\u20091,\u2009<i>b<\/i>\u2009=\u20092<\/span> and <span class=\"tex-span\"><i>c<\/i>\u2009=\u20094,\u2009<i>d<\/i>\u2009=\u20095<\/span> or of he opens segments of eyes <span class=\"tex-span\"><i>a<\/i>\u2009=\u20091,\u2009<i>b<\/i>\u2009=\u20092<\/span> and <span class=\"tex-span\"><i>c<\/i>\u2009=\u20096,\u2009<i>d<\/i>\u2009=\u20097<\/span>. <\/p><\/div><\/div>"}, {"contestId": 1989, "index": "E", "name": "Distance to Different", "rating": 2300, "solvedCount": 2612, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Distance to Different<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Consider an array $$$a$$$ of $$$n$$$ integers, where every element is from $$$1$$$ to $$$k$$$, and every integer from $$$1$$$ to $$$k$$$ appears <span class=\"tex-font-style-bf\">at least once<\/span>.<\/p><p>Let the array $$$b$$$ be constructed as follows: for the $$$i$$$-th element of $$$a$$$, $$$b_i$$$ is the distance to the closest element in $$$a$$$ which is not equal to $$$a_i$$$. In other words, $$$b_i = \\min \\limits_{j \\in [1, n], a_j \\ne a_i} |i - j|$$$.<\/p><p>For example, if $$$a = [1, 1, 2, 3, 3, 3, 3, 1]$$$, then $$$b = [2, 1, 1, 1, 2, 2, 1, 1]$$$.<\/p><p>Calculate the number of different arrays $$$b$$$ you can obtain if you consider all possible arrays $$$a$$$, and print it modulo $$$998244353$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line of the input contains two integers $$$n$$$ and $$$k$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$; $$$2 \\le k \\le \\min(n, 10)$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the number of different arrays $$$b$$$ you can obtain, taken modulo $$$998244353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">2 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4 3<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n20\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6 5<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">133 7<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n336975971\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 2066, "index": "C", "name": "Bitwise Slides", "rating": 2300, "solvedCount": 2592, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Bitwise Slides<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p> <\/p><p>You are given an array $$$a_1, a_2, \\ldots, a_n$$$. Also, you are given three variables $$$P,Q,R$$$, initially equal to zero.<\/p><p>You need to process all the numbers $$$a_1, a_2, \\ldots, a_n$$$, <span class=\"tex-font-style-bf\">in the order from $$$1$$$ to $$$n$$$<\/span>. When processing the next $$$a_i$$$, you must perform <span class=\"tex-font-style-bf\">exactly<\/span> one of the three actions of your choice:<\/p><ol><li> $$$P := P \\oplus a_i$$$<\/li><li> $$$Q := Q \\oplus a_i$$$<\/li><li> $$$R := R \\oplus a_i$$$<\/li><\/ol><p>$$$\\oplus$$$ denotes the <a>bitwise XOR operation<\/a>. <\/p><p>When performing actions, you must follow the <span class=\"tex-font-style-it\">main rule<\/span>: it is necessary that after each action, all three numbers $$$P,Q,R$$$ are <span class=\"tex-font-style-bf\">not<\/span> pairwise distinct.<\/p><p>There are a total of $$$3^n$$$ ways to perform all $$$n$$$ actions. How many of them do not violate the <span class=\"tex-font-style-it\">main rule<\/span>? Since the answer can be quite large, find it modulo $$$10^9 + 7$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains an integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the length of the array $$$a$$$.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$)\u00a0\u2014 the elements of the array $$$a$$$.<\/p><p>It is guaranteed that the sum of the values of $$$n$$$ for all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output the number of ways to perform all $$$n$$$ actions without violating the <span class=\"tex-font-style-it\">main rule<\/span>, modulo $$$10^9 + 7$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 7 9<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">179 1 1 179<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 3 3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">12<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">8 2 5 3 9 1 8 12 9 9 9 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1000000000<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n9\n39\n123\n3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, there are 3 valid sequences of operations: <span class=\"tex-font-style-tt\"><span class=\"tex-font-style-bf\">PPP<\/span><\/span>, <span class=\"tex-font-style-tt\"><span class=\"tex-font-style-bf\">QQQ<\/span><\/span>, <span class=\"tex-font-style-tt\"><span class=\"tex-font-style-bf\">RRR<\/span><\/span>.<\/p><p>In the second test case, there are 9 valid sequences of operations: <span class=\"tex-font-style-tt\"><span class=\"tex-font-style-bf\">PPPP<\/span><\/span>, <span class=\"tex-font-style-tt\"><span class=\"tex-font-style-bf\">PPPQ<\/span><\/span>, <span class=\"tex-font-style-tt\"><span class=\"tex-font-style-bf\">PPPR<\/span><\/span>, <span class=\"tex-font-style-tt\"><span class=\"tex-font-style-bf\">QQQP<\/span><\/span>, <span class=\"tex-font-style-tt\"><span class=\"tex-font-style-bf\">QQQQ<\/span><\/span>, <span class=\"tex-font-style-tt\"><span class=\"tex-font-style-bf\">QQQR<\/span><\/span>, <span class=\"tex-font-style-tt\"><span class=\"tex-font-style-bf\">RRRP<\/span><\/span>, <span class=\"tex-font-style-tt\"><span class=\"tex-font-style-bf\">RRRQ<\/span><\/span>, <span class=\"tex-font-style-tt\"><span class=\"tex-font-style-bf\">RRRR<\/span><\/span>.<\/p><\/div><\/div>"}, {"contestId": 1983, "index": "E", "name": "I Love Balls", "rating": 2300, "solvedCount": 2587, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. I Love Balls<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Alice and Bob are playing a game. There are $$$n$$$ balls, out of which $$$k$$$ are special. Each ball has a value associated with it. <\/p><p>The players play turn by turn. In each turn, the player randomly picks a ball and adds the value of the ball to their score, which is $$$0$$$ at the beginning of the game. The selected ball is removed from the game. If the ball was special, the same player takes the next turn if at least one ball is remaining. If the ball picked was not special, the next player plays their turn.<\/p><p>They play this game until no balls are remaining in the game. Alice plays first.<\/p><p>Find the expected score that both the players have at the end of the game modulo $$$10^9+7$$$. <\/p><p>Formally, let $$$M = 10^9+7$$$. It can be shown that the answer can be expressed as an irreducible fraction $$$\\frac{p}{q}$$$, where $$$p$$$ and $$$q$$$ are integers and $$$q \\not \\equiv 0 \\pmod{M}$$$. Output the integer equal to $$$p \\cdot q^{-1} \\bmod M$$$. In other words, output such an integer $$$x$$$ that $$$0 \\le x  \\lt  M$$$ and $$$x \\cdot q \\equiv p \\pmod{M}$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>There are multiple test cases. The first line of the input contains an integer $$$t$$$, the number of test cases ($$$1 \\le t \\le 2 \\cdot 10^5$$$).<\/p><p>Each test case description is on a new line. The first line of the test case contains two integers $$$n$$$ and $$$k$$$ in the respective order separated by a space ($$$1 \\le k \\le n \\le 4 \\cdot 10^5$$$).<\/p><p>The second line of the test case contains $$$n$$$ integers: $$$v_1, v_2, \\ldots, v_n$$$, the value for each ball separated by spaces. The first $$$k$$$ balls are special ($$$1 \\le v_i \\le 10^7$$$).<\/p><p>The sum of $$$n$$$ over all test cases does not exceed $$$5 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output two integers per test case in a new line, the expected score of Alice and the expected score of Bob modulo $$$10^9+7$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">10 20 5 15 25<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n45 30\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">732507<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5817860 5398510<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2122894 4951549 2750585 7821535 3214167<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">8 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1405323 5069867 6883092 6972029 328406 2478975 7628890 9973340<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">9662050 3566134 3996473 9872255<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n732507 0\n11216370 0\n810642660 210218077\n722402997 318336932\n349086489 678010430\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1095611 8219204 7773462<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">8176490 2774103<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">9178636 5138057 3367761<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">12 9<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">7597698 6843019 2298534 1522386 4969588 1340345 3967362 9152890 6689668 9986080 4745473 7407325<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">10 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">6986368 2397882 5804127 6980694 3740836 3215836 5195724 3179261 4136769 4544231<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n17088277 0\n6862348 4088245\n677038671 340645790\n36949997 29570371\n725118051 321063684\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, Alice's expected score is $$$45$$$, and Bob's is $$$30$$$ at the end of the game.<\/p><\/div><\/div>"}, {"contestId": 85, "index": "D", "name": "Sum of Medians", "rating": 2300, "solvedCount": 2562, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Sum of Medians<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>In one well-known algorithm of finding the <span class=\"tex-span\"><i>k<\/i><\/span>-th order statistics we should divide all elements into groups of five consecutive elements and find the median of each five. A median is called the middle element of a sorted array (it's the third largest element for a group of five). To increase the algorithm's performance speed on a modern video card, you should be able to find a sum of medians in each five of the array.<\/p><p>A <span class=\"tex-font-style-it\">sum of medians<\/span> of a sorted <span class=\"tex-span\"><i>k<\/i><\/span>-element set <span class=\"tex-span\"><i>S<\/i>\u2009=\u2009{<i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>}<\/span>, where <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>\u2009&lt;\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>\u2009&lt;\u2009<i>a<\/i><sub class=\"lower-index\">3<\/sub>\u2009&lt;\u2009...\u2009&lt;\u2009<i>a<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span>, will be understood by as <\/p><center class=\"tex-equation\"><img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/4bff736b8675515382173f09055bd89086f02279.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/center><p>The <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/e91a39ad64cd7a33e8f1b67cd60e5b40257de950.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> operator stands for taking the remainder, that is <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/1d533a6df05afe2c303e325bb11b740c58acf6da.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> stands for the remainder of dividing <span class=\"tex-span\"><i>x<\/i><\/span> by <span class=\"tex-span\"><i>y<\/i><\/span>.<\/p><p>To organize exercise testing quickly calculating <span class=\"tex-font-style-it\">the sum of medians<\/span> for a changing set was needed.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains number <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>), the number of operations performed.<\/p><p>Then each of <span class=\"tex-span\"><i>n<\/i><\/span> lines contains the description of one of the three operations: <\/p><ul> <li> <span class=\"tex-font-style-tt\">add <span class=\"tex-span\"><i>x<\/i><\/span><\/span>\u00a0\u2014 add the element <span class=\"tex-span\"><i>x<\/i><\/span> to the set; <\/li><li> <span class=\"tex-font-style-tt\">del <span class=\"tex-span\"><i>x<\/i><\/span><\/span>\u00a0\u2014 delete the element <span class=\"tex-span\"><i>x<\/i><\/span> from the set; <\/li><li> <span class=\"tex-font-style-tt\">sum<\/span>\u00a0\u2014 find the <span class=\"tex-font-style-it\">sum of medians<\/span> of the set. <\/li><\/ul><p>For any <span class=\"tex-font-style-tt\">add <span class=\"tex-span\"><i>x<\/i><\/span><\/span> operation it is true that the element <span class=\"tex-span\"><i>x<\/i><\/span> is not included in the set directly before the operation.<\/p><p>For any <span class=\"tex-font-style-tt\">del <span class=\"tex-span\"><i>x<\/i><\/span><\/span> operation it is true that the element <span class=\"tex-span\"><i>x<\/i><\/span> is included in the set directly before the operation.<\/p><p>All the numbers in the input are positive integers, not exceeding <span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup><\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each operation <span class=\"tex-font-style-tt\">sum<\/span> print on the single line <span class=\"tex-font-style-it\">the sum of medians<\/span> of the current set. If the set is empty, print 0.<\/p><p>Please, do not use the <span class=\"tex-font-style-tt\">%lld<\/span> specificator to read or write 64-bit integers in C++. It is preferred to use the <span class=\"tex-font-style-tt\">cin<\/span>, <span class=\"tex-font-style-tt\">cout<\/span> streams (also you may use the <span class=\"tex-font-style-tt\">%I64d<\/span> specificator).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>6<br/>add 4<br/>add 5<br/>add 1<br/>add 2<br/>add 3<br/>sum<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>14<br/>add 1<br/>add 7<br/>add 2<br/>add 5<br/>sum<br/>add 6<br/>add 8<br/>add 9<br/>add 3<br/>add 4<br/>add 10<br/>sum<br/>del 1<br/>sum<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>5<br/>11<br/>13<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1783, "index": "E", "name": "Game of the Year", "rating": 2300, "solvedCount": 2554, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Game of the Year<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Monocarp and Polycarp are playing a computer game. This game features $$$n$$$ bosses for the playing to kill, numbered from $$$1$$$ to $$$n$$$.<\/p><p>They will fight <span class=\"tex-font-style-bf\">each<\/span> boss the following way: <\/p><ul> <li> Monocarp makes $$$k$$$ attempts to kill the boss; <\/li><li> Polycarp makes $$$k$$$ attempts to kill the boss; <\/li><li> Monocarp makes $$$k$$$ attempts to kill the boss; <\/li><li> Polycarp makes $$$k$$$ attempts to kill the boss; <\/li><li> ... <\/li><\/ul><p>Monocarp kills the $$$i$$$-th boss on <span class=\"tex-font-style-bf\">his<\/span> $$$a_i$$$-th attempt. Polycarp kills the $$$i$$$-th boss on <span class=\"tex-font-style-bf\">his<\/span> $$$b_i$$$-th attempt. After one of them kills the $$$i$$$-th boss, they move on to the $$$(i+1)$$$-st boss. The attempt counters reset for both of them. Once one of them kills the $$$n$$$-th boss, the game ends.<\/p><p>Find all values of $$$k$$$ from $$$1$$$ to $$$n$$$ such that Monocarp kills <span class=\"tex-font-style-bf\">all bosses<\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of testcases.<\/p><p>The first line of each testcase contains a single integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of bosses.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le n$$$)\u00a0\u2014 the index of attempt Monocarp kills each boss on.<\/p><p>The third line contains $$$n$$$ integers $$$b_1, b_2, \\dots, b_n$$$ ($$$1 \\le b_i \\le n$$$)\u00a0\u2014 the index of attempt Polycarp kills each boss on.<\/p><p>The sum of $$$n$$$ over all testcases doesn't exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each testcase, print two lines. The first line should contain a single integer $$$\\mathit{cnt}$$$\u00a0\u2014 the number of values of $$$k$$$ from $$$1$$$ to $$$n$$$ such that Monocarp kills <span class=\"tex-font-style-bf\

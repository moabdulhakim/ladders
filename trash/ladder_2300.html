g <span class=\"tex-span\"><i>s<\/i><\/span> with small Latin letters.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>winlose???winl???w??<br/>win<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>5<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>glo?yto?e??an?<br/>or<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>??c?????<br/>abcab<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example the resulting string <span class=\"tex-span\"><i>s<\/i><\/span> is <span class=\"tex-font-style-tt\">\"winlose<span class=\"tex-font-style-bf\">win<\/span>winl<span class=\"tex-font-style-bf\">win<\/span>w<span class=\"tex-font-style-bf\">in<\/span>\"<\/span><\/p><p>In the second example the resulting string <span class=\"tex-span\"><i>s<\/i><\/span> is <span class=\"tex-font-style-tt\">\"glo<span class=\"tex-font-style-bf\">r<\/span>yto<span class=\"tex-font-style-bf\">r<\/span>e<span class=\"tex-font-style-bf\">or<\/span>an<span class=\"tex-font-style-bf\">d<\/span>\"<\/span>. The last letter of the string can be arbitrary.<\/p><p>In the third example occurrences of string <span class=\"tex-span\"><i>t<\/i><\/span> are overlapping. String <span class=\"tex-span\"><i>s<\/i><\/span> with maximal number of occurrences of <span class=\"tex-span\"><i>t<\/i><\/span> is <span class=\"tex-font-style-tt\">\"<span class=\"tex-font-style-bf\">ab<\/span>c<span class=\"tex-font-style-bf\">abcab<\/span>\"<\/span>.<\/p><\/div><\/div>"}, {"contestId": 1706, "index": "E", "name": "Qpwoeirut and Vertices", "rating": 2300, "solvedCount": 4111, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Qpwoeirut and Vertices<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a connected undirected graph with $$$n$$$ vertices and $$$m$$$ edges. Vertices of the graph are numbered by integers from $$$1$$$ to $$$n$$$ and edges of the graph are numbered by integers from $$$1$$$ to $$$m$$$.<\/p><p>Your task is to answer $$$q$$$ queries, each consisting of two integers $$$l$$$ and $$$r$$$. The answer to each query is the smallest non-negative integer $$$k$$$ such that the following condition holds: <\/p><ul> <li> For all pairs of integers $$$(a, b)$$$ such that $$$l\\le a\\le b\\le r$$$, vertices $$$a$$$ and $$$b$$$ are reachable from one another using only the first $$$k$$$ edges (that is, edges $$$1, 2, \\ldots, k$$$). <\/li><\/ul><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1\\le t\\le 1000$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains three integers $$$n$$$, $$$m$$$, and $$$q$$$ ($$$2\\le n\\le 10^5$$$, $$$1\\le m, q\\le 2\\cdot 10^5$$$)\u00a0\u2014 the number of vertices, edges, and queries respectively.<\/p><p>Each of the next $$$m$$$ lines contains two integers $$$u_i$$$ and $$$v_i$$$ ($$$1\\le u_i, v_i\\le n$$$)\u00a0\u2014 ends of the $$$i$$$-th edge.<\/p><p>It is guaranteed that the graph is connected and there are no multiple edges or self-loops.<\/p><p>Each of the next $$$q$$$ lines contains two integers $$$l$$$ and $$$r$$$ ($$$1\\le l\\le r\\le n$$$)\u00a0\u2014 descriptions of the queries.<\/p><p>It is guaranteed that that the sum of $$$n$$$ over all test cases does not exceed $$$10^5$$$, the sum of $$$m$$$ over all test cases does not exceed $$$2\\cdot 10^5$$$, and the sum of $$$q$$$ over all test cases does not exceed $$$2\\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print $$$q$$$ integers\u00a0\u2014 the answers to the queries.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 5 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 3<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0 1 \n3 3 0 5 5 \n2 \n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/403a707656b79f15f0fbe29fbbcf083a4d7f6dc7.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"302px\"/> <span class=\"tex-font-size-small\">Graph from the first test case. The integer near the edge is its number.<\/span> <\/center><p>In the first test case, the graph contains $$$2$$$ vertices and a single edge connecting vertices $$$1$$$ and $$$2$$$.<\/p><p>In the first query, $$$l=1$$$ and $$$r=1$$$. It is possible to reach any vertex from itself, so the answer to this query is $$$0$$$.<\/p><p>In the second query, $$$l=1$$$ and $$$r=2$$$. Vertices $$$1$$$ and $$$2$$$ are reachable from one another using only the first edge, through the path $$$1 \\longleftrightarrow 2$$$. It is impossible to reach vertex $$$2$$$ from vertex $$$1$$$ using only the first $$$0$$$ edges. So, the answer to this query is $$$1$$$.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/f8d9ecb6205471ea5f17411cb7d8beae7898c0b6.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"302px\"/> <span class=\"tex-font-size-small\">Graph from the second test case. The integer near the edge is its number.<\/span> <\/center><p>In the second test case, the graph contains $$$5$$$ vertices and $$$5$$$ edges.<\/p><p>In the first query, $$$l=1$$$ and $$$r=4$$$. It is enough to use the first $$$3$$$ edges to satisfy the condition from the statement: <\/p><ul> <li> Vertices $$$1$$$ and $$$2$$$ are reachable from one another through the path $$$1 \\longleftrightarrow 2$$$ (edge $$$1$$$). <\/li><li> Vertices $$$1$$$ and $$$3$$$ are reachable from one another through the path $$$1 \\longleftrightarrow 3$$$ (edge $$$2$$$). <\/li><li> Vertices $$$1$$$ and $$$4$$$ are reachable from one another through the path $$$1 \\longleftrightarrow 2 \\longleftrightarrow 4$$$ (edges $$$1$$$ and $$$3$$$). <\/li><li> Vertices $$$2$$$ and $$$3$$$ are reachable from one another through the path $$$2 \\longleftrightarrow 1 \\longleftrightarrow 3$$$ (edges $$$1$$$ and $$$2$$$). <\/li><li> Vertices $$$2$$$ and $$$4$$$ are reachable from one another through the path $$$2 \\longleftrightarrow 4$$$ (edge $$$3$$$). <\/li><li> Vertices $$$3$$$ and $$$4$$$ are reachable from one another through the path $$$3 \\longleftrightarrow 1 \\longleftrightarrow 2 \\longleftrightarrow 4$$$ (edges $$$2$$$, $$$1$$$, and $$$3$$$). <\/li><\/ul><p>If we use less than $$$3$$$ of the first edges, then the condition won't be satisfied. For example, it is impossible to reach vertex $$$4$$$ from vertex $$$1$$$ using only the first $$$2$$$ edges. So, the answer to this query is $$$3$$$.<\/p><p>In the second query, $$$l=3$$$ and $$$r=4$$$. Vertices $$$3$$$ and $$$4$$$ are reachable from one another through the path $$$3 \\longleftrightarrow 1 \\longleftrightarrow 2 \\longleftrightarrow 4$$$ (edges $$$2$$$, $$$1$$$, and $$$3$$$). If we use any fewer of the first edges, nodes $$$3$$$ and $$$4$$$ will not be reachable from one another.<\/p><\/div><\/div>"}, {"contestId": 785, "index": "D", "name": "Anton and School - 2", "rating": 2300, "solvedCount": 4017, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Anton and School - 2<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>As you probably know, Anton goes to school. One of the school subjects that Anton studies is Bracketology. On the Bracketology lessons students usually learn different sequences that consist of round brackets (characters \"<span class=\"tex-font-style-tt\">(<\/span>\" and \"<span class=\"tex-font-style-tt\">)<\/span>\" (without quotes)).<\/p><p>On the last lesson Anton learned about the regular simple bracket sequences (RSBS). A bracket sequence <span class=\"tex-span\"><i>s<\/i><\/span> of length <span class=\"tex-span\"><i>n<\/i><\/span> is an RSBS if the following conditions are met:<\/p><ul> <li> It is not empty (that is <span class=\"tex-span\"><i>n<\/i>\u2009\u2260\u20090<\/span>). <\/li><li> The length of the sequence is even. <\/li><li> First <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/a64c1b2df604f8cfa9acf6716a3cc1424488361e.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> charactes of the sequence are equal to \"<span class=\"tex-font-style-tt\">(<\/span>\". <\/li><li> Last <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/a64c1b2df604f8cfa9acf6716a3cc1424488361e.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> charactes of the sequence are equal to \"<span class=\"tex-font-style-tt\">)<\/span>\". <\/li><\/ul><p>For example, the sequence \"<span class=\"tex-font-style-tt\">((()))<\/span>\" is an RSBS but the sequences \"<span class=\"tex-font-style-tt\">((())<\/span>\" and \"<span class=\"tex-font-style-tt\">(()())<\/span>\" are not RSBS.<\/p><p>Elena Ivanovna, Anton's teacher, gave him the following task as a homework. Given a bracket sequence <span class=\"tex-span\"><i>s<\/i><\/span>. Find the number of its distinct subsequences such that they are RSBS. Note that a subsequence of <span class=\"tex-span\"><i>s<\/i><\/span> is a string that can be obtained from <span class=\"tex-span\"><i>s<\/i><\/span> by deleting some of its elements. Two subsequences are considered distinct if distinct sets of positions are deleted.<\/p><p>Because the answer can be very big and Anton's teacher doesn't like big numbers, she asks Anton to find the answer modulo <span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097<\/span>.<\/p><p>Anton thought of this task for a very long time, but he still doesn't know how to solve it. Help Anton to solve this task and write a program that finds the answer for it!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line of the input contains a string <span class=\"tex-span\"><i>s<\/i><\/span>\u00a0\u2014 the bracket sequence given in Anton's homework. The string consists only of characters \"<span class=\"tex-font-style-tt\">(<\/span>\" and \"<span class=\"tex-font-style-tt\">)<\/span>\" (without quotes). It's guaranteed that the string is not empty and its length doesn't exceed <span class=\"tex-span\">200\u2009000<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output one number\u00a0\u2014 the answer for the task modulo <span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>)(()()<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>()()()<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>7<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>)))<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample the following subsequences are possible:<\/p><ul> <li> If we delete characters at the positions <span class=\"tex-span\">1<\/span> and <span class=\"tex-span\">5<\/span> (numbering starts with one), we will get the subsequence \"<span class=\"tex-font-style-tt\">(())<\/span>\". <\/li><li> If we delete characters at the positions <span class=\"tex-span\">1<\/span>, <span class=\"tex-span\">2<\/span>, <span class=\"tex-span\">3<\/span> and <span class=\"tex-span\">4<\/span>, we will get the subsequence \"<span class=\"tex-font-style-tt\">()<\/span>\". <\/li><li> If we delete characters at the positions <span class=\"tex-span\">1<\/span>, <span class=\"tex-span\">2<\/span>, <span class=\"tex-span\">4<\/span> and <span class=\"tex-span\">5<\/span>, we will get the subsequence \"<span class=\"tex-font-style-tt\">()<\/span>\". <\/li><li> If we delete characters at the positions <span class=\"tex-span\">1<\/span>, <span class=\"tex-span\">2<\/span>, <span class=\"tex-span\">5<\/span> and <span class=\"tex-span\">6<\/span>, we will get the subsequence \"<span class=\"tex-font-style-tt\">()<\/span>\". <\/li><li> If we delete characters at the positions <span class=\"tex-span\">1<\/span>, <span class=\"tex-span\">3<\/span>, <span class=\"tex-span\">4<\/span> and <span class=\"tex-span\">5<\/span>, we will get the subsequence \"<span class=\"tex-font-style-tt\">()<\/span>\". <\/li><li> If we delete characters at the positions <span class=\"tex-span\">1<\/span>, <span class=\"tex-span\">3<\/span>, <span class=\"tex-span\">5<\/span> and <span class=\"tex-span\">6<\/span>, we will get the subsequence \"<span class=\"tex-font-style-tt\">()<\/span>\". <\/li><\/ul><p>The rest of the subsequnces are not RSBS. So we got <span class=\"tex-span\">6<\/span> distinct subsequences that are RSBS, so the answer is <span class=\"tex-span\">6<\/span>.<\/p><\/div><\/div>"}, {"contestId": 1451, "index": "E2", "name": "Bitwise Queries (Hard Version)", "rating": 2300, "solvedCount": 3994, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E2. Bitwise Queries (Hard Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">The only difference between the easy and hard versions is the constraints on the number of queries.<\/span><\/p><p><span class=\"tex-font-style-bf\">This is an interactive problem.<\/span><\/p><p>Ridbit has a hidden array $$$a$$$ of $$$n$$$ integers which he wants Ashish to guess. Note that $$$n$$$ is a <span class=\"tex-font-style-bf\">power of two<\/span>. Ashish is allowed to ask three different types of queries. They are of the form <\/p><ul> <li> <span class=\"tex-font-style-tt\">AND<\/span> $$$i$$$ $$$j$$$: ask for the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#AND\">bitwise AND<\/a> of elements $$$a_i$$$ and $$$a_j$$$ $$$(1 \\leq i, j \\le n$$$, $$$i \\neq j)$$$ <\/li><li> <span class=\"tex-font-style-tt\">OR<\/span> $$$i$$$ $$$j$$$: ask for the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#OR\">bitwise OR<\/a> of elements $$$a_i$$$ and $$$a_j$$$ $$$(1 \\leq i, j \\le n$$$, $$$i \\neq j)$$$ <\/li><li> <span class=\"tex-font-style-tt\">XOR<\/span> $$$i$$$ $$$j$$$: ask for the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#XOR\">bitwise XOR<\/a> of elements $$$a_i$$$ and $$$a_j$$$ $$$(1 \\leq i, j \\le n$$$, $$$i \\neq j)$$$ <\/li><\/ul><p>Can you help Ashish guess the elements of the array?<\/p><p><span class=\"tex-font-style-bf\">In this version, each element takes a value in the range $$$[0, n-1]$$$ (inclusive) and Ashish can ask no more than $$$n+1$$$ queries.<\/span><\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains one integer $$$n$$$ $$$(4 \\le n \\le 2^{16})$$$\u00a0\u2014 the length of the array. It is guaranteed that $$$n$$$ is a <span class=\"tex-font-style-bf\">power of two<\/span>.<\/p><\/div><div><div class=\"section-title\">Interaction<\/div><p>To ask a query print a single line containing one of the following (without quotes) <\/p><ul> <li> \"<span class=\"tex-font-style-tt\">AND i j<\/span>\" <\/li><li> \"<span class=\"tex-font-style-tt\">OR i j<\/span>\" <\/li><li> \"<span class=\"tex-font-style-tt\">XOR i j<\/span>\" <\/li><\/ul> where $$$i$$$ and $$$j$$$ $$$(1 \\leq i, j \\le n$$$, $$$i \\neq j)$$$ denote the indices being queried.<p>For each query, you will receive an integer $$$x$$$ whose value depends on the type of query. If the indices queried are invalid or you exceed the number of queries however, you will get $$$x = -1$$$. In this case, you should terminate the program immediately.<\/p><p>When you have guessed the elements of the array, print a single line \"<span class=\"tex-font-style-tt\">!<\/span> \" (without quotes), followed by $$$n$$$ space-separated integers \u00a0\u2014 the elements of the array.<\/p><p>Guessing the array does <span class=\"tex-font-style-bf\">not<\/span> count towards the number of queries asked.<\/p><p><span class=\"tex-font-style-bf\">The interactor is not adaptive.<\/span> The array $$$a$$$ does not change with queries.<\/p><p>After printing a query do not forget to output the end of the line and flush the output. Otherwise, you will get <span class=\"tex-font-style-tt\">Idleness limit exceeded<\/span>. To do this, use:<\/p><ul><li> <span class=\"tex-font-style-tt\">fflush(stdout)<\/span> or <span class=\"tex-font-style-tt\">cout.flush()<\/span> in C++;<\/li><li> <span class=\"tex-font-style-tt\">System.out.flush()<\/span> in Java;<\/li><li> <span class=\"tex-font-style-tt\">flush(output)<\/span> in Pascal;<\/li><li> <span class=\"tex-font-style-tt\">stdout.flush()<\/span> in Python;<\/li><li> see the documentation for other languages.<\/li><\/ul><p><span class=\"tex-font-style-bf\">Hacks<\/span><\/p><p>To hack the solution, use the following test format:<\/p><p>On the first line print a single integer $$$n$$$ $$$(4 \\le n \\le 2^{16})$$$\u00a0\u2014 the length of the array. It <span class=\"tex-font-style-bf\">must<\/span> be a power of 2. The next line should contain $$$n$$$ space-separated integers in the range $$$[0, n-1]$$$\u00a0\u2014 the array $$$a$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n\n0\n\n2\n\n3\n\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nOR 1 2\n\nOR 2 3\n\nXOR 2 4\n\n! 0 0 2 3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The array $$$a$$$ in the example is $$$[0, 0, 2, 3]$$$.<\/p><\/div><\/div>"}, {"contestId": 715, "index": "B", "name": "Complete The Graph", "rating": 2300, "solvedCount": 3907, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Complete The Graph<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>ZS the Coder has drawn an undirected graph of <span class=\"tex-span\"><i>n<\/i><\/span> vertices numbered from <span class=\"tex-span\">0<\/span> to <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> edges between them. Each edge of the graph is weighted, each weight is a <span class=\"tex-font-style-bf\">positive integer<\/span>.<\/p><p>The next day, ZS the Coder realized that some of the weights were erased! So he wants to reassign <span class=\"tex-font-style-bf\">positive integer<\/span> weight to each of the edges which weights were erased, so that the length of the shortest path between vertices <span class=\"tex-span\"><i>s<\/i><\/span> and <span class=\"tex-span\"><i>t<\/i><\/span> in the resulting graph is exactly <span class=\"tex-span\"><i>L<\/i><\/span>. Can you help him?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains five integers <span class=\"tex-span\"><i>n<\/i>,\u2009<i>m<\/i>,\u2009<i>L<\/i>,\u2009<i>s<\/i>,\u2009<i>t<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20091000,\u2009\u20091\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u200910\u2009000,\u2009\u20091\u2009\u2264\u2009<i>L<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup>,\u2009\u20090\u2009\u2264\u2009<i>s<\/i>,\u2009<i>t<\/i>\u2009\u2264\u2009<i>n<\/i>\u2009-\u20091,\u2009\u2009<i>s<\/i>\u2009\u2260\u2009<i>t<\/i><\/span>)\u00a0\u2014 the number of vertices, number of edges, the desired length of shortest path, starting vertex and ending vertex respectively.<\/p><p>Then, <span class=\"tex-span\"><i>m<\/i><\/span> lines describing the edges of the graph follow. <span class=\"tex-span\"><i>i<\/i><\/span>-th of them contains three integers, <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>\u2009-\u20091,\u2009\u2009<i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2260\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009\u20090\u2009\u2264\u2009<i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>). <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> denote the endpoints of the edge and <span class=\"tex-span\"><i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> denotes its weight. If <span class=\"tex-span\"><i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is equal to <span class=\"tex-span\">0<\/span> then the weight of the corresponding edge was erased.<\/p><p>It is guaranteed that there is at most one edge between any pair of vertices.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print \"<span class=\"tex-font-style-tt\">NO<\/span>\" (without quotes) in the only line if it's not possible to assign the weights in a required way.<\/p><p>Otherwise, print \"<span class=\"tex-font-style-tt\">YES<\/span>\" in the first line. Next <span class=\"tex-span\"><i>m<\/i><\/span> lines should contain the edges of the resulting graph, with weights assigned to edges which weights were erased. <span class=\"tex-span\"><i>i<\/i><\/span>-th of them should contain three integers <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, denoting an edge between vertices <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> of weight <span class=\"tex-span\"><i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. The edges of the new graph must coincide with the ones in the graph from the input. The weights that were not erased must remain unchanged whereas the new weights can be any <span class=\"tex-font-style-bf\">positive integer<\/span> not exceeding <span class=\"tex-span\">10<sup class=\"upper-index\">18<\/sup><\/span>. <\/p><p>The order of the edges in the output doesn't matter. The length of the shortest path between <span class=\"tex-span\"><i>s<\/i><\/span> and <span class=\"tex-span\"><i>t<\/i><\/span> must be equal to <span class=\"tex-span\"><i>L<\/i><\/span>.<\/p><p>If there are multiple solutions, print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 5 13 0 4<br/>0 1 5<br/>2 1 2<br/>3 2 3<br/>1 4 0<br/>4 3 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/>0 1 5<br/>2 1 2<br/>3 2 3<br/>1 4 8<br/>4 3 4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 1 123456789 0 1<br/>0 1 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/>0 1 123456789<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 1 999999999 1 0<br/>0 1 1000000000<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>NO<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Here's how the graph in the first sample case looks like :<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/c0ce47e385b7ec9ee4e64f6c8e2728543e8bb39b.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>In the first sample case, there is only one missing edge weight. Placing the weight of <span class=\"tex-span\">8<\/span> gives a shortest path from <span class=\"tex-span\">0<\/span> to <span class=\"tex-span\">4<\/span> of length <span class=\"tex-span\">13<\/span>.<\/p><p>In the second sample case, there is only a single edge. Clearly, the only way is to replace the missing weight with <span class=\"tex-span\">123456789<\/span>.<\/p><p>In the last sample case, there is no weights to assign but the length of the shortest path doesn't match the required value, so the answer is \"<span class=\"tex-font-style-tt\">NO<\/span>\".<\/p><\/div><\/div>"}, {"contestId": 1073, "index": "E", "name": "Segment Sum", "rating": 2300, "solvedCount": 3887, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Segment Sum<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given two integers $$$l$$$ and $$$r$$$ ($$$l \\le r$$$). Your task is to calculate the sum of numbers from $$$l$$$ to $$$r$$$ (including $$$l$$$ and $$$r$$$) such that each number contains <span class=\"tex-font-style-bf\">at most<\/span> $$$k$$$ different digits, and print this sum modulo $$$998244353$$$.<\/p><p>For example, if $$$k = 1$$$ then you have to calculate all numbers from $$$l$$$ to $$$r$$$ such that each number is formed using only one digit. For $$$l = 10, r = 50$$$ the answer is $$$11 + 22 + 33 + 44 = 110$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line of the input contains three integers $$$l$$$, $$$r$$$ and $$$k$$$ ($$$1 \\le l \\le r  \\lt  10^{18}, 1 \\le k \\le 10$$$) \u2014 the borders of the segment and the maximum number of different digits.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the sum of numbers from $$$l$$$ to $$$r$$$ such that each number contains at most $$$k$$$ different digits, modulo $$$998244353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>10 50 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1230<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>1 2345 10<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2750685<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>101 154 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2189<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first example the answer is just the sum of numbers from $$$l$$$ to $$$r$$$ which equals to $$$\\frac{50 \\cdot 51}{2} - \\frac{9 \\cdot 10}{2} = 1230$$$. This example also explained in the problem statement but for $$$k = 1$$$.<\/p><p>For the second example the answer is just the sum of numbers from $$$l$$$ to $$$r$$$ which equals to $$$\\frac{2345 \\cdot 2346}{2} = 2750685$$$.<\/p><p>For the third example the answer is $$$101 + 110 + 111 + 112 + 113 + 114 + 115 + 116 + 117 + 118 + 119 + 121 + 122 + 131 + 133 + 141 + 144 + 151 = 2189$$$.<\/p><\/div><\/div>"}, {"contestId": 1198, "index": "D", "name": "Rectangle Painting 1", "rating": 2300, "solvedCount": 3872, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Rectangle Painting 1<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There is a square grid of size $$$n \\times n$$$. Some cells are colored in black, all others are colored in white. In one operation you can select some rectangle and color all its cells in white. It costs $$$\\max(h, w)$$$ to color a rectangle of size $$$h \\times w$$$. You are to make all cells white for minimum total cost.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$1 \\leq n \\leq 50$$$)\u00a0\u2014 the size of the square grid.<\/p><p>Each of the next $$$n$$$ lines contains a string of length $$$n$$$, consisting of characters '<span class=\"tex-font-style-tt\">.<\/span>' and '<span class=\"tex-font-style-tt\">#<\/span>'. The $$$j$$$-th character of the $$$i$$$-th line is '<span class=\"tex-font-style-tt\">#<\/span>' if the cell with coordinates $$$(i, j)$$$ is black, otherwise it is white.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer\u00a0\u2014 the minimum total cost to paint all cells in white.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n###\n#.#\n###\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n...\n...\n...\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n#...\n....\n....\n#...\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n#...#\n.#.#.\n.....\n.#...\n#....\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The examples and some of optimal solutions are shown on the pictures below.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/6829de67210e447ad4cc62ec111907db87a89422.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 2134, "index": "D", "name": "Sliding Tree", "rating": 2300, "solvedCount": 3800, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Sliding Tree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p> <\/p><p>You are given a tree$$$^{\\text{\u2217}}$$$ with $$$n$$$ vertices numbered from $$$1$$$ to $$$n$$$. You can modify its structure using the following multi-step operation, called a <span class=\"tex-font-style-it\">sliding operation<\/span>:<\/p><ol> <li> Choose three <span class=\"tex-font-style-bf\">distinct<\/span> vertices $$$a$$$, $$$b$$$, and $$$c$$$ such that $$$b$$$ is directly connected to both $$$a$$$ and $$$c$$$. <\/li><li> Then, for every neighbor $$$d$$$ of $$$b$$$ (<span class=\"tex-font-style-bf\">excluding<\/span> $$$a$$$ and $$$c$$$), remove the edge between $$$b$$$ and $$$d$$$, and instead connect $$$d$$$ directly to $$$c$$$. <\/li><\/ol><p>For example, the figure below illustrates this operation with $$$a = 4$$$, $$$b = 3$$$, and $$$c = 5$$$ in the leftmost tree.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/59101a6368e982d48b6b55a69f902e33f52ac325.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>It can be proved that after a sliding operation, the resulting graph is still a tree.<\/p><p>Your task is to find a sequence of sliding operations that transforms the tree into a path graph$$$^{\\text{\u2020}}$$$, while <span class=\"tex-font-style-bf\">minimizing<\/span> the total number of operations. You only need to output the <span class=\"tex-font-style-bf\">first sliding operation<\/span> in an optimal sequence if at least one operation is required. It can be proved that it is possible to transform the tree into a path graph using a finite number of operations.<\/p><div class=\"statement-footnote\"><p>$$$^{\\text{\u2217}}$$$A tree is a connected graph without cycles. <\/p><p>$$$^{\\text{\u2020}}$$$A path graph is a tree where every vertex has a degree of at most $$$2$$$. Note that a graph with only $$$1$$$ vertex and no edges is also a path graph.<\/p><\/div><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of vertices in the tree.<\/p><p>The $$$i$$$-th of the following $$$n-1$$$ lines contains two integers $$$u_i$$$ and $$$v_i$$$ ($$$1 \\le u_i,v_i \\le n$$$, $$$u_i \\neq v_i$$$)\u00a0\u2014 the ends of the $$$i$$$-th edge.<\/p><p>It is guaranteed that the given edges form a tree.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case:<\/p><ul> <li> If no operations are required (that is, the input tree is already a path graph), output $$$-1$$$. <\/li><li> Otherwise, output three <span class=\"tex-font-style-bf\">distinct<\/span> integers $$$a$$$, $$$b$$$, and $$$c$$$ ($$$1 \\le a,b,c \\le n$$$)\u00a0\u2014 the chosen vertices for the first sliding operation in an optimal sequence. <\/li><\/ul><p>If there are multiple valid choices for the first operation, you can output any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 4<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4 3 5\n-1\n-1\n2 4 1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The first test case matches the example provided in the problem statement. It can be proved that we cannot transform the given tree into a path graph using less than $$$2$$$ operations.<\/p><p>However, we can transform the given tree into a path graph using $$$2$$$ operations: Initially, we perform an operation with $$$a=4$$$, $$$b=3$$$, and $$$c=5$$$, as shown in the example. Next, we apply an operation with $$$a=3$$$, $$$b=5$$$, and $$$c=6$$$. After this, the tree becomes a path graph. The second operation is illustrated in the figure below.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/7453806e4578b4777901bda400dbcb5b25b0bec7.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>Thus, we obtain a sequence of sliding operations with the total number of operations minimized. Note, however, that only the first operation must be in the output; the number of operations and the second operation should <span class=\"tex-font-style-bf\">not<\/span> appear in the output.<\/p><p>In the second and third test cases, the tree is already a path graph, so no operations are required.<\/p><\/div><\/div>"}, {"contestId": 1342, "index": "E", "name": "Placing Rooks", "rating": 2300, "solvedCount": 3766, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Placing Rooks<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Calculate the number of ways to place $$$n$$$ rooks on $$$n \\times n$$$ chessboard so that both following conditions are met:<\/p><ul> <li> each empty cell is under attack; <\/li><li> exactly $$$k$$$ pairs of rooks attack each other. <\/li><\/ul><p>An empty cell is under attack if there is at least one rook in the same row or at least one rook in the same column. Two rooks attack each other if they share the same row or column, <span class=\"tex-font-style-it\">and there are no other rooks between them<\/span>. For example, there are only two pairs of rooks that attack each other in the following picture:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/0b202bfb8e33be32b441e87dbfababaa68f4ccbc.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <span class=\"tex-font-size-small\">One of the ways to place the rooks for $$$n = 3$$$ and $$$k = 2$$$<\/span> <\/center><p>Two ways to place the rooks are considered different if there exists at least one cell which is empty in one of the ways but contains a rook in another way.<\/p><p>The answer might be large, so print it modulo $$$998244353$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line of the input contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le n \\le 200000$$$; $$$0 \\le k \\le \\frac{n(n - 1)}{2}$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the number of ways to place the rooks, taken modulo $$$998244353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 0\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n24\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1337 42\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n807905441\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 732, "index": "F", "name": "Tourist Reform", "rating": 2300, "solvedCount": 3727, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Tourist Reform<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Berland is a tourist country! At least, it can become such\u00a0\u2014 the government of Berland is confident about this. <\/p><p>There are <span class=\"tex-span\"><i>n<\/i><\/span> cities in Berland, some pairs of which are connected by two-ways roads. Each road connects two different cities. In Berland there are no roads which connect the same pair of cities. It is possible to get from any city to any other city using given two-ways roads. <\/p><p>According to the reform each road will become one-way. It will be oriented to one of two directions.<\/p><p>To maximize the tourist attraction of Berland, after the reform for each city <span class=\"tex-span\"><i>i<\/i><\/span> the value <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> will be calculated. It will equal to the number of cities <span class=\"tex-span\"><i>x<\/i><\/span> for which there is an oriented path from the city <span class=\"tex-span\"><i>i<\/i><\/span> to the city <span class=\"tex-span\"><i>x<\/i><\/span>. In other words, <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> will equal the number of cities which can be reached from the city <span class=\"tex-span\"><i>i<\/i><\/span> by roads. <\/p><p>The government is sure that tourist's attention will be focused on the minimum value of <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>.<\/p><p>Help the government of Berland make the reform to maximize the minimum of <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i>,\u2009<i>m<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009400\u2009000,\u20091\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u2009400\u2009000<\/span>)\u00a0\u2014 the number of cities and the number of roads. <\/p><p>The next <span class=\"tex-span\"><i>m<\/i><\/span> lines describe roads in Berland: the <span class=\"tex-span\"><i>j<\/i><\/span>-th of them contains two integers <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>u<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>,\u2009<i>v<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>\u2009\u2260\u2009<i>v<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span>), where <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span> are the numbers of cities which are connected by the <span class=\"tex-span\"><i>j<\/i><\/span>-th road.<\/p><p>The cities are numbered from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span>. It is guaranteed that it is possible to get from any city to any other by following two-ways roads. In Berland there are no roads which connect the same pair of cities. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In the first line print single integer\u00a0\u2014 the maximum possible value <span class=\"tex-span\"><i>min<\/i><sub class=\"lower-index\">1\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>n<\/i><\/sub>{<i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>}<\/span> after the orientation of roads. <\/p><p>The next <span class=\"tex-span\"><i>m<\/i><\/span> lines must contain the description of roads after the orientation: the <span class=\"tex-span\"><i>j<\/i><\/span>-th of them must contain two integers <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>,\u2009<i>v<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span>, it means that the <span class=\"tex-span\"><i>j<\/i><\/span>-th road will be directed from the city <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span> to the city <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span>. Print roads in the same order as they are given in the input data. <\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>7 9<br/>4 3<br/>2 6<br/>7 1<br/>4 1<br/>7 3<br/>3 5<br/>7 4<br/>6 5<br/>2 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/>4 3<br/>6 2<br/>7 1<br/>1 4<br/>3 7<br/>5 3<br/>7 4<br/>5 6<br/>2 5<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1228, "index": "E", "name": "Another Filling the Grid", "rating": 2300, "solvedCount": 3725, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Another Filling the Grid<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You have $$$n \\times n$$$ square grid and an integer $$$k$$$. Put an integer in each cell while satisfying the conditions below.<\/p><ul> <li> All numbers in the grid should be between $$$1$$$ and $$$k$$$ inclusive. <\/li><li> Minimum number of the $$$i$$$-th row is $$$1$$$ ($$$1 \\le i \\le n$$$). <\/li><li> Minimum number of the $$$j$$$-th column is $$$1$$$ ($$$1 \\le j \\le n$$$). <\/li><\/ul><p>Find the number of ways to put integers in the grid. Since the answer can be very large, find the answer modulo $$$(10^{9} + 7)$$$.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/e4f61febea2c66bc8c5bd80f505642194e162964.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> These are the examples of valid and invalid grid when $$$n=k=2$$$. <\/center><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le n \\le 250$$$, $$$1 \\le k \\le 10^{9}$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the answer modulo $$$(10^{9} + 7)$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n7\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n123 456789\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n689974806\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, following $$$7$$$ cases are possible.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/25bbfff7b37bb6ee5e4de3fe2f8011aa05c3265c.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>In the second example, make sure you print the answer modulo $$$(10^{9} + 7)$$$.<\/p><\/div><\/div>"}, {"contestId": 1628, "index": "C", "name": "Grid Xor", "rating": 2300, "solvedCount": 3716, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Grid Xor<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Note: The XOR-sum of set $$$\\{s_1,s_2,\\ldots,s_m\\}$$$ is defined as $$$s_1 \\oplus s_2 \\oplus \\ldots \\oplus s_m$$$, where $$$\\oplus$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#XOR\">bitwise XOR operation<\/a>.<\/p><p>After almost winning IOI, Victor bought himself an $$$n\\times n$$$ grid containing integers in each cell. <span class=\"tex-font-style-bf\">$$$n$$$ is an even integer.<\/span> The integer in the cell in the $$$i$$$-th row and $$$j$$$-th column is $$$a_{i,j}$$$.<\/p><p>Sadly, Mihai stole the grid from Victor and told him he would return it with only one condition: Victor has to tell Mihai the XOR-sum of <span class=\"tex-font-style-bf\">all<\/span> the integers in the whole grid.<\/p><p>Victor doesn't remember all the elements of the grid, but he remembers some information about it: For each cell, Victor remembers the XOR-sum of all its neighboring cells.<\/p><p>Two cells are considered neighbors if they share an edge \u2014 in other words, for some integers $$$1 \\le i, j, k, l \\le n$$$, the cell in the $$$i$$$-th row and $$$j$$$-th column is a neighbor of the cell in the $$$k$$$-th row and $$$l$$$-th column if $$$|i - k| = 1$$$ and $$$j = l$$$, or if $$$i = k$$$ and $$$|j - l| = 1$$$.<\/p><p>To get his grid back, Victor is asking you for your help. Can you use the information Victor remembers to find the XOR-sum of the whole grid?<\/p><p>It can be proven that the answer is unique.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains a single integer $$$t$$$ ($$$1 \\le t \\le 100$$$) \u2014 the number of test cases. The description of test cases follows.<\/p><p>The first line of each test case contains a single <span class=\"tex-font-style-bf\">even<\/span> integer $$$n$$$ ($$$2 \\leq n \\leq 1000$$$) \u2014 the size of the grid.<\/p><p>Then follows $$$n$$$ lines, each containing $$$n$$$ integers. The $$$j$$$-th integer in the $$$i$$$-th of these lines represents the XOR-sum of the integers in all the neighbors of the cell in the $$$i$$$-th row and $$$j$$$-th column.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases doesn't exceed $$$1000$$$ and in the original grid $$$0 \\leq a_{i, j} \\leq 2^{30} - 1$$$.<\/p><p><span class=\"tex-font-style-bf\"><span class=\"tex-font-style-sf\">Hack Format<\/span><\/span><\/p><p>To hack a solution, use the following format:<\/p><p>The first line should contain a single integer t ($$$1 \\le t \\le 100$$$) \u2014 the number of test cases.<\/p><p>The first line of each test case should contain a single <span class=\"tex-font-style-bf\">even<\/span> integer $$$n$$$ ($$$2 \\leq n \\leq 1000$$$) \u2014 the size of the grid.<\/p><p>Then $$$n$$$ lines should follow, each containing $$$n$$$ integers. The $$$j$$$-th integer in the $$$i$$$-th of these lines is $$$a_{i,j}$$$ in Victor's <span class=\"tex-font-style-bf\">original<\/span> grid. The values in the grid should be integers in the range $$$[0, 2^{30}-1]$$$<\/p><p>The sum of $$$n$$$ over all test cases must not exceed $$$1000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer \u2014 the XOR-sum of the whole grid.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n2\n1 5\n5 1\n4\n1 14 8 9\n3 1 5 9\n4 13 11 1\n1 15 4 11\n4\n2 4 1 6\n3 7 3 10\n15 9 4 2\n12 7 15 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n9\n5\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first test case, one possibility for Victor's original grid is:<\/p><p><table class=\"tex-tabular\"><tbody><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$1$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$3$$$<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$2$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$4$$$<\/td><\/tr><\/tbody><\/table><\/p><p>For the second test case, one possibility for Victor's original grid is:<\/p><p><table class=\"tex-tabular\"><tbody><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$3$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$8$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$8$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$5$$$<\/td><\/tr><tr><td class=\"tex-tabular-border-left lass=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$4$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$3$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$2$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$1$$$<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$1$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$2$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$3$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$4$$$<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$5$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$6$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$7$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$8$$$<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$8$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$9$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$9$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$1$$$<\/td><\/tr><\/tbody><\/table><\/p><\/div><\/div>"}, {"contestId": 1699, "index": "D", "name": "Almost Triple Deletions", "rating": 2300, "solvedCount": 3646, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Almost Triple Deletions<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an integer $$$n$$$ and an array $$$a_1,a_2,\\ldots,a_n$$$.<\/p><p>In one operation, you can choose an index $$$i$$$ ($$$1 \\le i \\lt n$$$) for which $$$a_i \\neq a_{i+1}$$$ and delete both $$$a_i$$$ and $$$a_{i+1}$$$ from the array. After deleting $$$a_i$$$ and $$$a_{i+1}$$$, the remaining parts of the array are concatenated.<\/p><p>For example, if $$$a=[1,4,3,3,6,2]$$$, then after performing an operation with $$$i=2$$$, the resulting array will be $$$[1,3,6,2]$$$.<\/p><p>What is the maximum possible length of an array of <span class=\"tex-font-style-bf\">equal<\/span> elements obtainable from $$$a$$$ by performing several (perhaps none) of the aforementioned operations?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line of input contains one integer $$$t$$$ ($$$1 \\le t \\le 1000$$$)\u00a0\u2014 the number of test cases. The following lines contain the descriptions of the test cases.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 5000$$$)\u00a0\u2014 the length of array $$$a$$$.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1,a_2,\\ldots,a_n$$$ ($$$1 \\le a_i \\le n$$$)\u00a0\u2014 the elements of array $$$a$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ across all test cases does not exceed $$$10\\,000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each testcase, print a single integer, the maximum possible length of an array of <span class=\"tex-font-style-bf\">equal<\/span> elements obtainable from $$$a$$$ by performing a sequence of operations.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 3 2 1 3 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 1 1 2 2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">8<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 1 2 2 3 3 1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">12<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 5 2 3 3 3 4 4 4 4 3 3<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n1\n0\n4\n2\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first testcase, an optimal sequence of operations would be: $$$[1,2,3,2,1,3,3] \\rightarrow [3,2,1,3,3] \\rightarrow [3,3,3]$$$.<\/p><p>For the second testcase, all elements in the array are already equal.<\/p><p>For the third testcase, the only possible sequence of operations is: $$$[1,1,1,2,2,2] \\rightarrow [1,1,2,2] \\rightarrow [1,2] \\rightarrow []$$$. Note that, according to the statement, the elements deleted at each step must be different.<\/p><p>For the fourth testcase, the optimal sequence of operations is: $$$[1,1,2,2,3,3,1,1] \\rightarrow [1,1,2,3,1,1] \\rightarrow [1,1,1,1]$$$.<\/p><p>For the fifth testcase, one possible reachable array of two equal elements is $$$[4,4]$$$.<\/p><\/div><\/div>"}, {"contestId": 1824, "index": "B2", "name": "LuoTianyi and the Floating Islands (Hard Version)", "rating": 2300, "solvedCount": 3626, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B2. LuoTianyi and the Floating Islands (Hard Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is the hard version of the problem. The only difference is that in this version $$$k\\le n$$$. You can make hacks only if both versions of the problem are solved.<\/span> <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/7f333c9e4caaaeb91bf9e9f4dec7834ac347c99e.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"360px\"/> <span class=\"tex-font-size-small\">Chtholly and the floating islands.<\/span> <\/center><p>LuoTianyi now lives in a world with $$$n$$$ floating islands. The floating islands are connected by $$$n-1$$$ undirected air routes, and any two of them can reach each other by passing the routes. That means, the $$$n$$$ floating islands form a tree.<\/p><p>One day, LuoTianyi wants to meet her friends: Chtholly, Nephren, William, .... Totally, she wants to meet $$$k$$$ people. She doesn't know the exact positions of them, but she knows that they are in <span class=\"tex-font-style-bf\">pairwise distinct<\/span> islands. She define an island is <span class=\"tex-font-style-it\">good<\/span> if and only if the sum of the distances$$$^{\\dagger}$$$ from it to the islands with $$$k$$$ people is the minimal among all the $$$n$$$ islands.<\/p><p>Now, LuoTianyi wants to know that, if the $$$k$$$ people are randomly set in $$$k$$$ distinct of the $$$n$$$ islands, then what is the expect number of the good islands? You just need to tell her the expect number modulo $$$10^9+7$$$.<\/p><p>$$$^{\\dagger}$$$The distance between two islands is the minimum number of air routes you need to take to get from one island to the other.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$k$$$ ($$$1\\le k \\le n \\le 2\\cdot 10^5$$$) \u2014 the number of the islands and people respectively.<\/p><p>Next $$$n\u22121$$$ lines describe the air routes. The $$$i$$$-th of them contains two integers $$$u_i$$$ and $$$v_i$$$ ($$$1 \\le u_i,v_i \\le n, u_i \\neq v_i$$$) \u2014 the islands connected by the $$$i$$$-th air route.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u2014 the expect number of the good islands modulo $$$10^9 + 7$$$.<\/p><p>Formally, let $$$M = 10^9 + 7$$$. It can be shown that the answer can be expressed as an irreducible fraction $$$\\frac{p}{q}$$$, where $$$p$$$ and $$$q$$$ are integers and $$$q \\not \\equiv 0$$$ ($$$\\operatorname{mod} M$$$). Output the integer equal to $$$p \\cdot q^{-1}$$$ $$$\\operatorname{mod} M$$$. In other words, output such an integer $$$x$$$ that $$$0 \\le x  \\lt  M$$$ and $$$x \\cdot q \\equiv p$$$ ($$$\\operatorname{mod} M$$$).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 2\n1 2\n2 3\n3 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n666666674\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 5\n1 2\n2 3\n3 4\n3 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example the air routes form the following tree:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/bd181c06ef8f804b04e74dfb86151820ecf71365.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center> <p>If the people are in the islands $$$1$$$ and $$$2$$$, then islands $$$1$$$ and $$$2$$$ will be good.<\/p><p>The sum of the distances from island $$$1$$$ or $$$2$$$ to all the people is $$$1+0=1$$$, which is the minimal. While the sum of the distances from island $$$3$$$ to all the people is $$$2+1=3$$$, which is greater than $$$1$$$.<\/p><p>Like this, when the people are in island $$$1$$$ and $$$3$$$, then islands $$$1,2$$$ and $$$3$$$ will be good.<\/p><p>When the people are in islands $$$1$$$ and $$$4$$$, then islands $$$1,2,3$$$ and $$$4$$$ will be good.<\/p><p>When the people are in islands $$$2$$$ and $$$3$$$, then islands $$$2$$$ and $$$3$$$ will be good.<\/p><p>When the people are in islands $$$2$$$ and $$$4$$$, then islands $$$2,3$$$ and $$$4$$$ will be good.<\/p><p>When the people are in islands $$$3$$$ and $$$4$$$, then islands $$$3$$$ and $$$4$$$ will be good.<\/p><p>So the expect of the number of the good islands is $$$\\frac{16}{6}$$$, which equals to $$$666666674$$$ modulo $$$10^9+7$$$.<\/p><p>In the second example the air routes form the following tree:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/6506d3d48ec469f47ab870658de54cb6820cf51f.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>We can see that there is one person in each island, and only the island $$$3$$$ is good. So the expect number is $$$1$$$.<\/p><\/div><\/div>"}, {"contestId": 160, "index": "D", "name": "Edges in MST", "rating": 2300, "solvedCount": 3620, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Edges in MST<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>You are given a connected weighted undirected graph without any loops and multiple edges. <\/p><p>Let us remind you that a graph's <span class=\"tex-font-style-underline\">spanning tree<\/span> is defined as an acyclic connected subgraph of the given graph that includes all of the graph's vertexes. The <span class=\"tex-font-style-underline\">weight<\/span> of a tree is defined as the sum of weights of the edges that the given tree contains. The <span class=\"tex-font-style-underline\">minimum spanning tree<\/span> (<span class=\"tex-font-style-bf\">MST<\/span>) of a graph is defined as the graph's spanning tree having the minimum possible weight. For any connected graph obviously exists the minimum spanning tree, but in the general case, a graph's minimum spanning tree is not unique.<\/p><p>Your task is to determine the following for each edge of the given graph: whether it is either included in <span class=\"tex-font-style-bf\">any<\/span> MST, or included <span class=\"tex-font-style-bf\">at least in one<\/span> MST, or <span class=\"tex-font-style-bf\">not included in any<\/span> MST.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>, <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/da07f7f89dfbf6f6c4ee7ebcc66e82f96647327c.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>) \u2014 the number of the graph's vertexes and edges, correspondingly. Then follow <span class=\"tex-span\"><i>m<\/i><\/span> lines, each of them contains three integers \u2014 the description of the graph's edges as \"<span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\"><i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>\" (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>,\u20091\u2009\u2264\u2009<i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup>,\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2260\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>), where <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> are the numbers of vertexes connected by the <span class=\"tex-span\"><i>i<\/i><\/span>-th edge, <span class=\"tex-span\"><i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is the edge's weight. It is guaranteed that the graph is connected and doesn't contain loops or multiple edges.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>m<\/i><\/span> lines \u2014 the answers for all edges. If the <span class=\"tex-span\"><i>i<\/i><\/span>-th edge is included in any MST, print \"<span class=\"tex-font-style-tt\">any<\/span>\"; if the <span class=\"tex-span\"><i>i<\/i><\/span>-th edge is included at least in one MST, print \"<span class=\"tex-font-style-tt\">at least one<\/span>\"; if the <span class=\"tex-span\"><i>i<\/i><\/span>-th edge isn't included in any MST, print \"<span class=\"tex-font-style-tt\">none<\/span>\". Print the answers for the edges in the order in which the edges are specified in the input.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 5<br/>1 2 101<br/>1 3 100<br/>2 3 2<br/>2 4 2<br/>3 4 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>none<br/>any<br/>at least one<br/>at least one<br/>any<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 3<br/>1 2 1<br/>2 3 1<br/>1 3 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>any<br/>any<br/>none<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 3<br/>1 2 1<br/>2 3 1<br/>1 3 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>at least one<br/>at least one<br/>at least one<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the second sample the MST is unique for the given graph: it contains two first edges.<\/p><p>In the third sample any two edges form the MST for the given graph. That means that each edge is included at least in one MST.<\/p><\/div><\/div>"}, {"contestId": 547, "index": "C", "name": "Mike and Foam", "rating": 2300, "solvedCount": 3606, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Mike and Foam<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Mike is a bartender at Rico's bar. At Rico's, they put beer glasses in a special shelf. There are <span class=\"tex-span\"><i>n<\/i><\/span> kinds of beer at Rico's numbered from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span>. <span class=\"tex-span\"><i>i<\/i><\/span>-th kind of beer has <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> milliliters of foam on it.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/5ec617048405647782a1524646109e14e4575918.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>Maxim is Mike's boss. Today he told Mike to perform <span class=\"tex-span\"><i>q<\/i><\/span> queries. Initially the shelf is empty. In each request, Maxim gives him a number <span class=\"tex-span\"><i>x<\/i><\/span>. If beer number <span class=\"tex-span\"><i>x<\/i><\/span> is already in the shelf, then Mike should remove it from the shelf, otherwise he should put it in the shelf.<\/p><p>After each query, Mike should tell him the score of the shelf. Bears are geeks. So they think that the score of a shelf is the number of pairs <span class=\"tex-span\">(<i>i<\/i>,\u2009<i>j<\/i>)<\/span> of glasses in the shelf such that <span class=\"tex-span\"><i>i<\/i>\u2009&lt;\u2009<i>j<\/i><\/span> and <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/bd0cf5d5a7d4ecd9ec873d999a2370481c0fde9d.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> where <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/47ab79f1c5210d5c6156290f6f8e9af1075ae896.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> is the greatest common divisor of numbers <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span>.<\/p><p>Mike is tired. So he asked you to help him in performing these requests.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains numbers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>q<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>q<\/i>\u2009\u2264\u20092\u2009\u00d7\u200910<sup class=\"upper-index\">5<\/sup><\/span>), the number of different kinds of beer and number of queries.<\/p><p>The next line contains <span class=\"tex-span\"><i>n<\/i><\/span> space separated integers, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009... ,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u20095\u2009\u00d7\u200910<sup class=\"upper-index\">5<\/sup><\/span>), the height of foam in top of each kind of beer.<\/p><p>The next <span class=\"tex-span\"><i>q<\/i><\/span> lines contain the queries. Each query consists of a single integer integer <span class=\"tex-span\"><i>x<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>), the index of a beer that should be added or removed from the shelf.<\/p><\/

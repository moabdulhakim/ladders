<script>
    const PROBLEMS = [{"contestId": 600, "index": "E", "name": "Lomsat gelral", "rating": 2300, "solvedCount": 19741, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Lomsat gelral<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a rooted tree with root in vertex <span class=\"tex-span\">1<\/span>. Each vertex is coloured in some colour.<\/p><p>Let's call colour <span class=\"tex-span\"><i>c<\/i><\/span> dominating in the subtree of vertex <span class=\"tex-span\"><i>v<\/i><\/span> if there are no other colours that appear in the subtree of vertex <span class=\"tex-span\"><i>v<\/i><\/span> more times than colour <span class=\"tex-span\"><i>c<\/i><\/span>. So it's possible that two or more colours will be dominating in the subtree of some vertex.<\/p><p>The subtree of vertex <span class=\"tex-span\"><i>v<\/i><\/span> is the vertex <span class=\"tex-span\"><i>v<\/i><\/span> and all other vertices that contains vertex <span class=\"tex-span\"><i>v<\/i><\/span> in each path to the root.<\/p><p>For each vertex <span class=\"tex-span\"><i>v<\/i><\/span> find the sum of all dominating colours in the subtree of vertex <span class=\"tex-span\"><i>v<\/i><\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the number of vertices in the tree.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>), <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> \u2014 the colour of the <span class=\"tex-span\"><i>i<\/i><\/span>-th vertex.<\/p><p>Each of the next <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> lines contains two integers <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>) \u2014 the edge of the tree. The first vertex is the root of the tree.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>n<\/i><\/span> integers \u2014 the sums of dominating colours for each vertex.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>1 2 3 4<br/>1 2<br/>2 3<br/>2 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>10 9 3 4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>15<br/>1 2 3 1 2 3 3 1 1 3 2 2 1 2 3<br/>1 2<br/>1 3<br/>1 4<br/>1 14<br/>1 15<br/>2 5<br/>2 6<br/>2 7<br/>3 8<br/>3 9<br/>3 10<br/>4 11<br/>4 12<br/>4 13<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6 5 4 3 2 3 3 1 1 3 2 2 1 2 3<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 438, "index": "D", "name": "The Child and Sequence", "rating": 2300, "solvedCount": 12640, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. The Child and Sequence<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>At the children's day, the child came to Picks's house, and messed his house up. Picks was angry at him. A lot of important things were lost, in particular the favorite sequence of Picks.<\/p><p>Fortunately, Picks remembers how to repair the sequence. Initially he should create an integer array <span class=\"tex-span\"><i>a<\/i>[1],\u2009<i>a<\/i>[2],\u2009...,\u2009<i>a<\/i>[<i>n<\/i>]<\/span>. Then he should perform a sequence of <span class=\"tex-span\"><i>m<\/i><\/span> operations. An operation can be one of the following:<\/p><ol> <li> Print operation <span class=\"tex-span\"><i>l<\/i>,\u2009<i>r<\/i><\/span>. Picks should write down the value of <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/181f67ef3e318b079dbb2c95d35947d5188179ce.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>. <\/li><li> Modulo operation <span class=\"tex-span\"><i>l<\/i>,\u2009<i>r<\/i>,\u2009<i>x<\/i><\/span>. Picks should perform assignment <span class=\"tex-span\"><i>a<\/i>[<i>i<\/i>]\u2009=\u2009<i>a<\/i>[<i>i<\/i>]\u00a0<i>mod<\/i>\u00a0<i>x<\/i><\/span> for each <span class=\"tex-span\"><i>i<\/i><\/span> <span class=\"tex-span\">(<i>l<\/i>\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>r<\/i>)<\/span>. <\/li><li> Set operation <span class=\"tex-span\"><i>k<\/i>,\u2009<i>x<\/i><\/span>. Picks should set the value of <span class=\"tex-span\"><i>a<\/i>[<i>k<\/i>]<\/span> to <span class=\"tex-span\"><i>x<\/i><\/span> (in other words perform an assignment <span class=\"tex-span\"><i>a<\/i>[<i>k<\/i>]\u2009=\u2009<i>x<\/i><\/span>). <\/li><\/ol><p>Can you help Picks to perform the whole sequence of operations?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains two integer: <span class=\"tex-span\"><i>n<\/i>,\u2009<i>m<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>m<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>)<\/span>. The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers, separated by space: <span class=\"tex-span\"><i>a<\/i>[1],\u2009<i>a<\/i>[2],\u2009...,\u2009<i>a<\/i>[<i>n<\/i>]\u00a0(1\u2009\u2264\u2009<i>a<\/i>[<i>i<\/i>]\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup>)<\/span> \u2014 initial value of array elements.<\/p><p>Each of the next <span class=\"tex-span\"><i>m<\/i><\/span> lines begins with a number <span class=\"tex-span\"><i>type<\/i><\/span> <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/b4a45bf5e1079434406980c012d730913aef22f2.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>. <\/p><ul> <li> If <span class=\"tex-span\"><i>type<\/i>\u2009=\u20091<\/span>, there will be two integers more in the line: <span class=\"tex-span\"><i>l<\/i>,\u2009<i>r<\/i>\u00a0(1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009<i>n<\/i>)<\/span>, which correspond the operation 1. <\/li><li> If <span class=\"tex-span\"><i>type<\/i>\u2009=\u20092<\/span>, there will be three integers more in the line: <span class=\"tex-span\"><i>l<\/i>,\u2009<i>r<\/i>,\u2009<i>x<\/i>\u00a0(1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009<i>n<\/i>;\u00a01\u2009\u2264\u2009<i>x<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup>)<\/span>, which correspond the operation 2. <\/li><li> If <span class=\"tex-span\"><i>type<\/i>\u2009=\u20093<\/span>, there will be two integers more in the line: <span class=\"tex-span\"><i>k<\/i>,\u2009<i>x<\/i>\u00a0(1\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u2009<i>n<\/i>;\u00a01\u2009\u2264\u2009<i>x<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup>)<\/span>, which correspond the operation 3. <\/li><\/ul><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each operation 1, please print a line containing the answer. Notice that the answer may exceed the 32-bit integer.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 5<br/>1 2 3 4 5<br/>2 3 5 4<br/>3 3 5<br/>1 2 5<br/>2 1 3 3<br/>1 1 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>8<br/>5<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>10 10<br/>6 9 6 7 6 1 10 10 9 5<br/>1 3 9<br/>2 7 10 9<br/>2 5 10 8<br/>1 4 7<br/>3 3 7<br/>2 7 9 9<br/>1 2 4<br/>1 6 6<br/>1 5 9<br/>3 1 10<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>49<br/>15<br/>23<br/>1<br/>9<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Consider the first testcase:<\/p><ul> <li> At first, <span class=\"tex-span\"><i>a<\/i>\u2009=\u2009{1,\u20092,\u20093,\u20094,\u20095}<\/span>. <\/li><li> After operation <span class=\"tex-span\">1<\/span>, <span class=\"tex-span\"><i>a<\/i>\u2009=\u2009{1,\u20092,\u20093,\u20090,\u20091}<\/span>. <\/li><li> After operation <span class=\"tex-span\">2<\/span>, <span class=\"tex-span\"><i>a<\/i>\u2009=\u2009{1,\u20092,\u20095,\u20090,\u20091}<\/span>. <\/li><li> At operation <span class=\"tex-span\">3<\/span>, <span class=\"tex-span\">2\u2009+\u20095\u2009+\u20090\u2009+\u20091\u2009=\u20098<\/span>. <\/li><li> After operation <span class=\"tex-span\">4<\/span>, <span class=\"tex-span\"><i>a<\/i>\u2009=\u2009{1,\u20092,\u20092,\u20090,\u20091}<\/span>. <\/li><li> At operation <span class=\"tex-span\">5<\/span>, <span class=\"tex-span\">1\u2009+\u20092\u2009+\u20092\u2009=\u20095<\/span>. <ul><\/ul><\/li><\/ul><\/div><\/div>"}, {"contestId": 786, "index": "B", "name": "Legacy", "rating": 2300, "solvedCount": 8577, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Legacy<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Rick and his co-workers have made a new radioactive formula and a lot of bad guys are after them. So Rick wants to give his legacy to Morty before bad guys catch them. <\/p><p>There are <span class=\"tex-span\"><i>n<\/i><\/span> planets in their universe numbered from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span>. Rick is in planet number <span class=\"tex-span\"><i>s<\/i><\/span> (the earth) and he doesn't know where Morty is. As we all know, Rick owns a portal gun. With this gun he can open one-way portal from a planet he is in to any other planet (including that planet). But there are limits on this gun because he's still using its free trial.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/3e33a87e8ba090af9cf4c5a8e27cb131ebefa1c7.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>By default he can not open any portal by this gun. There are <span class=\"tex-span\"><i>q<\/i><\/span> plans in the website that sells these guns. Every time you purchase a plan you can only use it once but you can purchase it again if you want to use it more.<\/p><p>Plans on the website have three types:<\/p><ol> <li> With a plan of this type you can open a portal from planet <span class=\"tex-span\"><i>v<\/i><\/span> to planet <span class=\"tex-span\"><i>u<\/i><\/span>. <\/li><li> With a plan of this type you can open a portal from planet <span class=\"tex-span\"><i>v<\/i><\/span> to any planet with index in range <span class=\"tex-span\">[<i>l<\/i>,\u2009<i>r<\/i>]<\/span>. <\/li><li> With a plan of this type you can open a portal from any planet with index in range <span class=\"tex-span\">[<i>l<\/i>,\u2009<i>r<\/i>]<\/span> to planet <span class=\"tex-span\"><i>v<\/i><\/span>. <\/li><\/ol><p>Rick doesn't known where Morty is, but Unity is going to inform him and he wants to be prepared for when he finds and start his journey immediately. So for each planet (including earth itself) he wants to know the minimum amount of money he needs to get from earth to that planet.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains three integers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>q<\/i><\/span> and <span class=\"tex-span\"><i>s<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>q<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>s<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>) \u2014 number of planets, number of plans and index of earth respectively.<\/p><p>The next <span class=\"tex-span\"><i>q<\/i><\/span> lines contain the plans. Each line starts with a number <span class=\"tex-span\"><i>t<\/i><\/span>, type of that plan (<span class=\"tex-span\">1\u2009\u2264\u2009<i>t<\/i>\u2009\u2264\u20093<\/span>). If <span class=\"tex-span\"><i>t<\/i>\u2009=\u20091<\/span> then it is followed by three integers <span class=\"tex-span\"><i>v<\/i><\/span>, <span class=\"tex-span\"><i>u<\/i><\/span> and <span class=\"tex-span\"><i>w<\/i><\/span> where <span class=\"tex-span\"><i>w<\/i><\/span> is the cost of that plan (<span class=\"tex-span\">1\u2009\u2264\u2009<i>v<\/i>,\u2009<i>u<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>w<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>). Otherwise it is followed by four integers <span class=\"tex-span\"><i>v<\/i><\/span>, <span class=\"tex-span\"><i>l<\/i><\/span>, <span class=\"tex-span\"><i>r<\/i><\/span> and <span class=\"tex-span\"><i>w<\/i><\/span> where <span class=\"tex-span\"><i>w<\/i><\/span> is the cost of that plan (<span class=\"tex-span\">1\u2009\u2264\u2009<i>v<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>w<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In the first and only line of output print <span class=\"tex-span\"><i>n<\/i><\/span> integers separated by spaces. <span class=\"tex-span\"><i>i<\/i><\/span>-th of them should be minimum money to get from earth to <span class=\"tex-span\"><i>i<\/i><\/span>-th planet, or <span class=\"tex-span\">\u2009-\u20091<\/span> if it's impossible to get to that planet.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 5 1<br/>2 3 2 3 17<br/>2 3 2 2 16<br/>2 2 2 3 3<br/>3 3 1 1 12<br/>1 3 3 17<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0 28 12 <br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 3 1<br/>3 4 1 3 12<br/>2 2 3 4 10<br/>1 2 4 16<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0 -1 -1 12 <br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample testcase, Rick can purchase <span class=\"tex-span\">4<\/span>th plan once and then <span class=\"tex-span\">2<\/span>nd plan in order to get to get to planet number <span class=\"tex-span\">2<\/span>.<\/p><\/div><\/div>"}, {"contestId": 1009, "index": "F", "name": "Dominant Indices", "rating": 2300, "solvedCount": 8404, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Dominant Indices<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a rooted undirected tree consisting of $$$n$$$ vertices. Vertex $$$1$$$ is the root.<\/p><p>Let's denote a <span class=\"tex-font-style-it\">depth array<\/span> of vertex $$$x$$$ as an infinite sequence $$$[d_{x, 0}, d_{x, 1}, d_{x, 2}, \\dots]$$$, where $$$d_{x, i}$$$ is the number of vertices $$$y$$$ such that both conditions hold:<\/p><ul> <li> $$$x$$$ is an ancestor of $$$y$$$; <\/li><li> the simple path from $$$x$$$ to $$$y$$$ traverses exactly $$$i$$$ edges. <\/li><\/ul><p>The <span class=\"tex-font-style-it\">dominant index<\/span> of a <span class=\"tex-font-style-it\">depth array<\/span> of vertex $$$x$$$ (or, shortly, the <span class=\"tex-font-style-it\">dominant index<\/span> of vertex $$$x$$$) is an index $$$j$$$ such that:<\/p><ul> <li> for every $$$k  \\lt  j$$$, $$$d_{x, k}  \\lt  d_{x, j}$$$; <\/li><li> for every $$$k  \\gt  j$$$, $$$d_{x, k} \\le d_{x, j}$$$. <\/li><\/ul><p>For every vertex in the tree calculate its <span class=\"tex-font-style-it\">dominant index<\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$1 \\le n \\le 10^6$$$) \u2014 the number of vertices in a tree.<\/p><p>Then $$$n - 1$$$ lines follow, each containing two integers $$$x$$$ and $$$y$$$ ($$$1 \\le x, y \\le n$$$, $$$x \\ne y$$$). This line denotes an edge of the tree.<\/p><p>It is guaranteed that these edges form a tree.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output $$$n$$$ numbers. $$$i$$$-th number should be equal to the <span class=\"tex-font-style-it\">dominant index<\/span> of vertex $$$i$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>1 2<br/>2 3<br/>3 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/>0<br/>0<br/>0<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>1 2<br/>1 3<br/>1 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/>0<br/>0<br/>0<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>1 2<br/>2 3<br/>2 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/>1<br/>0<br/>0<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 558, "index": "E", "name": "A Simple Task", "rating": 2300, "solvedCount": 7830, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. A Simple Task<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>This task is very simple. Given a string <span class=\"tex-span\"><i>S<\/i><\/span> of length <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>q<\/i><\/span> queries each query is on the format <span class=\"tex-span\"><i>i<\/i><\/span> <span class=\"tex-span\"><i>j<\/i><\/span> <span class=\"tex-span\"><i>k<\/i><\/span> which means sort the substring consisting of the characters from <span class=\"tex-span\"><i>i<\/i><\/span> to <span class=\"tex-span\"><i>j<\/i><\/span> in non-decreasing order if <span class=\"tex-span\"><i>k<\/i>\u2009=\u20091<\/span> or in non-increasing order if <span class=\"tex-span\"><i>k<\/i>\u2009=\u20090<\/span>.<\/p><p>Output the final string after applying the queries.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line will contain two integers <span class=\"tex-span\"><i>n<\/i>,\u2009<i>q<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>, <span class=\"tex-span\">0\u2009\u2264\u2009<i>q<\/i>\u2009\u2264\u200950\u2009000<\/span>), the length of the string and the number of queries respectively. <\/p><p><span class=\"tex-font-style-bf\">Next line contains a string <span class=\"tex-span\"><i>S<\/i><\/span> itself. It contains only lowercase English letters.<\/span><\/p><p>Next <span class=\"tex-span\"><i>q<\/i><\/span> lines will contain three integers each <span class=\"tex-span\"><i>i<\/i>,\u2009<i>j<\/i>,\u2009<i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>j<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>, <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/187c38b0d200dfc5b5249f93c000f8dee9c1180d.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output one line, the string <span class=\"tex-span\"><i>S<\/i><\/span> after applying the queries.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>10 5<br/>abacdabcda<br/>7 10 0<br/>5 8 1<br/>1 4 0<br/>3 6 0<br/>7 10 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>cbcaaaabdd<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>10 1<br/>agjucbvdfk<br/>1 10 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>abcdfgjkuv<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>First sample test explanation:<\/p><p><img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/3ac4e8cc7e335675a4a2b7b4758bfb3865377cea.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p><img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/a90b5b03cf59288d8861f0142ecbdf6b12f69e5c.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p><img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/1f482a91a275b6bce07eaed85312eac0cfcc6ccf.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p><img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/33b1a4a924f4bd562551ba4e40309f180dbe22e0.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p><img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/bddc77fd5b02858eb2ff29819cd16a93dbd241e6.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><\/div><\/div>"}, {"contestId": 713, "index": "C", "name": "Sonya and Problem Wihtout a Legend", "rating": 2300, "solvedCount": 6894, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Sonya and Problem Without a Legend<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Sonya was unable to think of a story for this problem, so here comes the formal description.<\/p><p>You are given the array containing <span class=\"tex-span\"><i>n<\/i><\/span> positive integers. At one turn you can pick any element and increase or decrease it by <span class=\"tex-span\">1<\/span>. The goal is the make the array strictly increasing by making the minimum possible number of operations. You are allowed to change elements in any way, they can become negative or equal to <span class=\"tex-span\">0<\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains a single integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20093000<\/span>)\u00a0\u2014 the length of the array.<\/p><p>Next line contains <span class=\"tex-span\"><i>n<\/i><\/span> integer <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the minimum number of operation required to make the array strictly increasing.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>7<br/>2 1 5 11 5 9 11<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>9<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>5 4 3 2 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>12<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample, the array is going to look as follows:<\/p><p><span class=\"tex-span\">2<\/span> <span class=\"tex-span\">3<\/span> <span class=\"tex-span\">5<\/span> <span class=\"tex-span\">6<\/span> <span class=\"tex-span\">7<\/span> <span class=\"tex-span\">9<\/span> <span class=\"tex-span\">11<\/span><\/p><p><span class=\"tex-span\">|2\u2009-\u20092|\u2009+\u2009|1\u2009-\u20093|\u2009+\u2009|5\u2009-\u20095|\u2009+\u2009|11\u2009-\u20096|\u2009+\u2009|5\u2009-\u20097|\u2009+\u2009|9\u2009-\u20099|\u2009+\u2009|11\u2009-\u200911|\u2009=\u20099<\/span><\/p><p>And for the second sample:<\/p><p><span class=\"tex-span\">1<\/span> <span class=\"tex-span\">2<\/span> <span class=\"tex-span\">3<\/span> <span class=\"tex-span\">4<\/span> <span class=\"tex-span\">5<\/span><\/p><p><span class=\"tex-span\">|5\u2009-\u20091|\u2009+\u2009|4\u2009-\u20092|\u2009+\u2009|3\u2009-\u20093|\u2009+\u2009|2\u2009-\u20094|\u2009+\u2009|1\u2009-\u20095|\u2009=\u200912<\/span><\/p><\/div><\/div>"}, {"contestId": 888, "index": "G", "name": "Xor-MST", "rating": 2300, "solvedCount": 6235, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. Xor-MST<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a complete undirected graph with <span class=\"tex-span\"><i>n<\/i><\/span> vertices. A number <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is assigned to each vertex, and the weight of an edge between vertices <span class=\"tex-span\"><i>i<\/i><\/span> and <span class=\"tex-span\"><i>j<\/i><\/span> is equal to <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009<i>xor<\/i>\u2009<i>a<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span>.<\/p><p>Calculate the weight of the minimum spanning tree in this graph.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009200000<\/span>) \u2014 the number of vertices in the graph.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub><\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">2<\/sub><\/span>, ..., <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009&lt;\u20092<sup class=\"upper-index\">30<\/sup><\/span>) \u2014 the numbers assigned to the vertices.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one number \u2014 the weight of the minimum spanning tree in the graph.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1 2 3 4 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>8<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>1 2 3 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>8<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 915, "index": "E", "name": "Physical Education Lessons", "rating": 2300, "solvedCount": 5957, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Physical Education Lessons<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>This year Alex has finished school, and now he is a first-year student of Berland State University. For him it was a total surprise that even though he studies programming, he still has to attend physical education lessons. The end of the term is very soon, but, unfortunately, Alex still hasn't attended a single lesson!<\/p><p>Since Alex doesn't want to get expelled, he wants to know the number of working days left until the end of the term, so he can attend physical education lessons during these days. But in BSU calculating the number of working days is a complicated matter:<\/p><p>There are <span class=\"tex-span\"><i>n<\/i><\/span> days left before the end of the term (numbered from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span>), and initially all of them are working days. Then the university staff sequentially publishes <span class=\"tex-span\"><i>q<\/i><\/span> orders, one after another. Each order is characterised by three numbers <span class=\"tex-span\"><i>l<\/i><\/span>, <span class=\"tex-span\"><i>r<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span>:<\/p><ul> <li> If <span class=\"tex-span\"><i>k<\/i>\u2009=\u20091<\/span>, then all days from <span class=\"tex-span\"><i>l<\/i><\/span> to <span class=\"tex-span\"><i>r<\/i><\/span> (inclusive) become non-working days. If some of these days are made working days by some previous order, then these days still become non-working days; <\/li><li> If <span class=\"tex-span\"><i>k<\/i>\u2009=\u20092<\/span>, then all days from <span class=\"tex-span\"><i>l<\/i><\/span> to <span class=\"tex-span\"><i>r<\/i><\/span> (inclusive) become working days. If some of these days are made non-working days by some previous order, then these days still become working days. <\/li><\/ul><p>Help Alex to determine the number of working days left after each order!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer <span class=\"tex-span\"><i>n<\/i><\/span>, and the second line \u2014 one integer <span class=\"tex-span\"><i>q<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>q<\/i>\u2009\u2264\u20093\u00b710<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the number of days left before the end of the term, and the number of orders, respectively.<\/p><p>Then <span class=\"tex-span\"><i>q<\/i><\/span> lines follow, <span class=\"tex-span\"><i>i<\/i><\/span>-th line containing three integers <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>k<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> representing <span class=\"tex-span\"><i>i<\/i><\/span>-th order (<span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>k<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u20092<\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>q<\/i><\/span> integers. <span class=\"tex-span\"><i>i<\/i><\/span>-th of them must be equal to the number of working days left until the end of the term after the first <span class=\"tex-span\"><i>i<\/i><\/span> orders are published.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>6<br/>1 2 1<br/>3 4 1<br/>2 3 2<br/>1 3 2<br/>2 4 1<br/>1 4 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/>0<br/>2<br/>3<br/>1<br/>4<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1316, "index": "E", "name": "Team Building", "rating": 2300, "solvedCount": 5922, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Team Building<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Alice, the president of club FCB, wants to build a team for the new volleyball tournament. The team should consist of $$$p$$$ players playing in $$$p$$$ different positions. She also recognizes the importance of audience support, so she wants to select $$$k$$$ people as part of the audience.<\/p><p>There are $$$n$$$ people in Byteland. Alice needs to select exactly $$$p$$$ players, one for each position, and exactly $$$k$$$ members of the audience from this pool of $$$n$$$ people. Her ultimate goal is to maximize the total strength of the club.<\/p><p>The $$$i$$$-th of the $$$n$$$ persons has an integer $$$a_{i}$$$ associated with him\u00a0\u2014 the strength he adds to the club if he is selected as a member of the audience.<\/p><p>For each person $$$i$$$ and for each position $$$j$$$, Alice knows $$$s_{i, j}$$$ \u00a0\u2014 the strength added by the $$$i$$$-th person to the club if he is selected to play in the $$$j$$$-th position.<\/p><p>Each person can be selected at most once as a player or a member of the audience. You have to choose exactly one player for each position.<\/p><p>Since Alice is busy, she needs you to help her find the maximum possible strength of the club that can be achieved by an optimal choice of players and the audience.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains $$$3$$$ integers $$$n,p,k$$$ ($$$2 \\leq n \\leq 10^{5}, 1 \\leq p \\leq 7, 1 \\le k, p+k \\le n$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_{1},a_{2},\\ldots,a_{n}$$$. ($$$1 \\leq a_{i} \\leq 10^{9}$$$).<\/p><p>The $$$i$$$-th of the next $$$n$$$ lines contains $$$p$$$ integers $$$s_{i, 1}, s_{i, 2}, \\dots, s_{i, p}$$$. ($$$1 \\leq s_{i,j} \\leq 10^{9}$$$)<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer $$${res}$$$ \u00a0\u2014 the maximum possible strength of the club.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 1 2\n1 16 10 3\n18\n19\n13\n15\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n44\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 2 3\n78 93 9 17 13 78\n80 97\n30 52\n26 17\n56 68\n60 36\n84 55\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n377\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 2 1\n500 498 564\n100002 3\n422332 2\n232323 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n422899\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample, we can select person $$$1$$$ to play in the $$$1$$$-st position and persons $$$2$$$ and $$$3$$$ as audience members. Then the total strength of the club will be equal to $$$a_{2}+a_{3}+s_{1,1}$$$.<\/p><\/div><\/div>"}, {"contestId": 598, "index": "C", "name": "Nearest vectors", "rating": 2300, "solvedCount": 5633, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Nearest vectors<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given the set of vectors on the plane, each of them starting at the origin. Your task is to find a pair of vectors with the minimal non-oriented angle between them.<\/p><p>Non-oriented angle is non-negative value, minimal between clockwise and counterclockwise direction angles. Non-oriented angle is always between <span class=\"tex-span\">0<\/span> and <span class=\"tex-span\">\u03c0<\/span>. For example, opposite directions vectors have angle equals to <span class=\"tex-span\">\u03c0<\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>First line of the input contains a single integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009100\u2009000<\/span>)\u00a0\u2014 the number of vectors.<\/p><p>The <span class=\"tex-span\"><i>i<\/i><\/span>-th of the following <span class=\"tex-span\"><i>n<\/i><\/span> lines contains two integers <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">|<i>x<\/i>|,\u2009|<i>y<\/i>|\u2009\u2264\u200910\u2009000,\u2009<i>x<\/i><sup class=\"upper-index\">2<\/sup>\u2009+\u2009<i>y<\/i><sup class=\"upper-index\">2<\/sup>\u2009&gt;\u20090<\/span>)\u00a0\u2014 the coordinates of the <span class=\"tex-span\"><i>i<\/i><\/span>-th vector. Vectors are numbered from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span> in order of appearing in the input. It is guaranteed that no two vectors in the input share the same direction (but they still can have opposite directions).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print two integer numbers <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span> (<span class=\"tex-span\"><i>a<\/i>\u2009\u2260\u2009<i>b<\/i><\/span>)\u00a0\u2014 a pair of indices of vectors with the minimal non-oriented angle. You can print the numbers in any order. If there are many possible answers, print any.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>-1 0<br/>0 -1<br/>1 0<br/>1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3 4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>6<br/>-1 0<br/>0 -1<br/>1 0<br/>1 1<br/>-4 -5<br/>-4 -6<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6 5<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1188, "index": "B", "name": "Count Pairs", "rating": 2300, "solvedCount": 5429, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Count Pairs<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a <span class=\"tex-font-style-bf\">prime<\/span> number $$$p$$$, $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$, and an integer $$$k$$$. <\/p><p>Find the number of pairs of indexes $$$(i, j)$$$ ($$$1 \\le i  \\lt  j \\le n$$$) for which $$$(a_i + a_j)(a_i^2 + a_j^2) \\equiv k \\bmod p$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integers $$$n, p, k$$$ ($$$2 \\le n \\le 3 \\cdot 10^5$$$, $$$2 \\le p \\le 10^9$$$, $$$0 \\le k \\le p-1$$$). $$$p$$$ is guaranteed to be prime.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$0 \\le a_i \\le p-1$$$). It is guaranteed that all elements are different.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output a single integer\u00a0\u2014 answer to the problem.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 3 0\n0 1 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 7 2\n1 2 3 4 5 6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example:<\/p><p>$$$(0+1)(0^2 + 1^2) = 1 \\equiv 1 \\bmod 3$$$.<\/p><p>$$$(0+2)(0^2 + 2^2) = 8 \\equiv 2 \\bmod 3$$$.<\/p><p>$$$(1+2)(1^2 + 2^2) = 15 \\equiv 0 \\bmod 3$$$.<\/p><p>So only $$$1$$$ pair satisfies the condition.<\/p><p>In the second example, there are $$$3$$$ such pairs: $$$(1, 5)$$$, $$$(2, 3)$$$, $$$(4, 6)$$$.<\/p><\/div><\/div>"}, {"contestId": 718, "index": "C", "name": "Sasha and Array", "rating": 2300, "solvedCount": 5055, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Sasha and Array<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Sasha has an array of integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span>. You have to perform <span class=\"tex-span\"><i>m<\/i><\/span> queries. There might be queries of two types:<\/p><ol> <li> <span class=\"tex-font-style-tt\">1 l r x<\/span>\u00a0\u2014 increase all integers on the segment from <span class=\"tex-span\"><i>l<\/i><\/span> to <span class=\"tex-span\"><i>r<\/i><\/span> by values <span class=\"tex-span\"><i>x<\/i><\/span>; <\/li><li> <span class=\"tex-font-style-tt\">2 l r<\/span>\u00a0\u2014 find <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/ee0d345d55c139544cd6fc126b63aa5ece538eee.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>, where <span class=\"tex-span\"><i>f<\/i>(<i>x<\/i>)<\/span> is the <span class=\"tex-span\"><i>x<\/i><\/span>-th Fibonacci number. As this number may be large, you only have to find it modulo <span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097<\/span>. <\/li><\/ol><p>In this problem we define Fibonacci numbers as follows: <span class=\"tex-span\"><i>f<\/i>(1)\u2009=\u20091<\/span>, <span class=\"tex-span\"><i>f<\/i>(2)\u2009=\u20091<\/span>, <span class=\"tex-span\"><i>f<\/i>(<i>x<\/i>)\u2009=\u2009<i>f<\/i>(<i>x<\/i>\u2009-\u20091)\u2009+\u2009<i>f<\/i>(<i>x<\/i>\u2009-\u20092)<\/span> for all <span class=\"tex-span\"><i>x<\/i>\u2009&gt;\u20092<\/span>.<\/p><p>Sasha is a very talented boy and he managed to perform all queries in five seconds. Will you be able to write the program that performs as well as Sasha?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009100\u2009000<\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u2009100\u2009000<\/span>)\u00a0\u2014 the number of elements in the array and the number of queries respectively.<\/p><p>The next line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>).<\/p><p>Then follow <span class=\"tex-span\"><i>m<\/i><\/span> lines with queries descriptions. Each of them contains integers <span class=\"tex-span\"><i>tp<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and may be <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>tp<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u20092<\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>). Here <span class=\"tex-span\"><i>tp<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009=\u20091<\/span> corresponds to the queries of the first type and <span class=\"tex-span\"><i>tp<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> corresponds to the queries of the second type.<\/p><p>It's guaranteed that the input will contains at least one query of the second type.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query of the second type print the answer modulo <span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 4<br/>1 1 2 1 1<br/>2 1 5<br/>1 2 4 2<br/>2 2 4<br/>2 1 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>5<br/>7<br/>9<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Initially, array <span class=\"tex-span\"><i>a<\/i><\/span> is equal to <span class=\"tex-span\">1<\/span>, <span class=\"tex-span\">1<\/span>, <span class=\"tex-span\">2<\/span>, <span class=\"tex-span\">1<\/span>, <span class=\"tex-span\">1<\/span>.<\/p><p>The answer for the first query of the second type is <span class=\"tex-span\"><i>f<\/i>(1)\u2009+\u2009<i>f<\/i>(1)\u2009+\u2009<i>f<\/i>(2)\u2009+\u2009<i>f<\/i>(1)\u2009+\u2009<i>f<\/i>(1)\u2009=\u20091\u2009+\u20091\u2009+\u20091\u2009+\u20091\u2009+\u20091\u2009=\u20095<\/span>. <\/p><p>After the query <span class=\"tex-font-style-tt\">1 2 4 2<\/span> array <span class=\"tex-span\"><i>a<\/i><\/span> is equal to <span class=\"tex-span\">1<\/span>, <span class=\"tex-span\">3<\/span>, <span class=\"tex-span\">4<\/span>, <span class=\"tex-span\">3<\/span>, <span class=\"tex-span\">1<\/span>.<\/p><p>The answer for the second query of the second type is <span class=\"tex-span\"><i>f<\/i>(3)\u2009+\u2009<i>f<\/i>(4)\u2009+\u2009<i>f<\/i>(3)\u2009=\u20092\u2009+\u20093\u2009+\u20092\u2009=\u20097<\/span>.<\/p><p>The answer for the third query of the second type is <span class=\"tex-span\"><i>f<\/i>(1)\u2009+\u2009<i>f<\/i>(3)\u2009+\u2009<i>f<\/i>(4)\u2009+\u2009<i>f<\/i>(3)\u2009+\u2009<i>f<\/i>(1)\u2009=\u20091\u2009+\u20092\u2009+\u20093\u2009+\u20092\u2009+\u20091\u2009=\u20099<\/span>.<\/p><\/div><\/div>"}, {"contestId": 451, "index": "E", "name": "Devu and Flowers", "rating": 2300, "solvedCount": 4855, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Devu and Flowers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Devu wants to decorate his garden with flowers. He has purchased <span class=\"tex-span\"><i>n<\/i><\/span> boxes, where the <span class=\"tex-span\"><i>i<\/i><\/span>-th box contains <span class=\"tex-span\"><i>f<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> flowers. All flowers in a single box are of the same color (hence they are indistinguishable). Also, no two boxes have flowers of the same color.<\/p><p>Now Devu wants to select <span class=\"tex-font-style-bf\">exactly<\/span> <span class=\"tex-span\"><i>s<\/i><\/span> flowers from the boxes to decorate his garden. Devu would like to know, in how many different ways can he select the flowers from each box? Since this number may be very large, he asks you to find the number modulo <span class=\"tex-span\">(10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097)<\/span>. <\/p><p>Devu considers two ways different if there is at least one box from which different number of flowers are selected in these two ways.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains two space-separated integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>s<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200920<\/span>, <span class=\"tex-span\">0\u2009\u2264\u2009<i>s<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">14<\/sup><\/span>).<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> space-separated integers <span class=\"tex-span\"><i>f<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>f<\/i><sub class=\"lower-index\">2<\/sub>,\u2009... <i>f<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>f<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">12<\/sup><\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output a single integer \u2014 the number of ways in which Devu can select the flowers modulo <span class=\"tex-span\">(10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097)<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 3<br/>1 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 4<br/>2 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 5<br/>1 3 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Sample 1. There are two ways of selecting <span class=\"tex-span\">3<\/span> flowers: <span class=\"tex-span\">{1,\u20092}<\/span> and <span class=\"tex-span\">{0,\u20093}<\/span>.<\/p><p>Sample 2. There is only one way of selecting <span class=\"tex-span\">4<\/span> flowers: <span class=\"tex-span\">{2,\u20092}<\/span>.<\/p><p>Sample 3. There are three ways of selecting <span class=\"tex-span\">5<\/span> flowers: <span class=\"tex-span\">{1,\u20092,\u20092}<\/span>, <span class=\"tex-span\">{0,\u20093,\u20092}<\/span>, and <span class=\"tex-span\">{1,\u20093,\u20091}<\/span>.<\/p><\/div><\/div>"}, {"contestId": 2164, "index": "E", "name": "Journey", "rating": 2300, "solvedCount": 4773, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Journey<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are on an undirected connected graph of $$$n$$$ vertices and $$$m$$$ weighted edges. The edges are indexed from $$$1$$$ to $$$m$$$. The $$$i$$$-th edge connects vertex $$$u_i$$$ and $$$v_i$$$, and has weight $$$w_i$$$. You decided to take a wonderful journey around the graph.<\/p><p>Suppose you are at vertex $$$x$$$. You can do the following operations any number of times: <\/p><ol> <li> <span class=\"tex-font-style-it\">Mark<\/span> an edge connecting $$$x$$$ and $$$y$$$, take photos along the edge, and move to $$$y$$$, which costs exactly the edge's weight. <\/li><li> <span class=\"tex-font-style-it\">Transfer<\/span> to another arbitrary vertex $$$z \\neq x$$$ by train. You may choose any path $$$x\\leadsto z$$$ (<span class=\"tex-font-style-bf\">not necessarily simple<\/span>), and the cost is <span class=\"tex-font-style-bf\">the weight<\/span> of the edge with <span class=\"tex-font-style-bf\">the maximum index<\/span> on that path. Formally, suppose you choose the path with edge indices $$$e_1, e_2, \\ldots, e_k$$$, such that there exists an array of vertices $$$p_1, p_2, \\ldots, p_{k+1}$$$ where $$$x = p_1$$$, $$$z = p_{k+1}$$$, and for all $$$i$$$ in $$$[1, k]$$$, edge $$$e_i$$$ connects $$$p_{i}$$$ and $$$p_{i+1}$$$, the cost is $$$w_{\\max_{i=1}^k e_i}$$$. <\/li><\/ol><p>You are now at vertex $$$1$$$, and you need to <span class=\"tex-font-style-it\">mark<\/span> every edge at least once and return to vertex $$$1$$$. Calculate the minimum cost.<\/p><p><span class=\"tex-font-style-bf\">Please note the cost for <span class=\"tex-font-style-it\">transferring<\/span> is not the maximum weight on the path, nor the maximum index itself. If you have any questions, refer to the <span class=\"tex-font-style-it\">Note<\/span> section below.<\/span><\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$T$$$ ($$$1 \\le T \\le 10^4$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\le n \\le 10^6$$$, $$$0 \\le m \\le 10^6$$$).<\/p><p>Then $$$m$$$ lines, the $$$i$$$-th line contains three integers $$$u_i, v_i, w_i$$$ ($$$1 \\le u_i, v_i \\le n$$$, $$$1 \\le w \\le 10^9$$$) \u2014 meaning that the edge with index $$$i$$$ is between vertex $$$u_i$$$ and vertex $$$v_i$$$ with weight $$$w_i$$$.<\/p><p>It's guaranteed that the described graph is connected.<\/p><p>Also note that the graph may have <span class=\"tex-font-style-bf\">self-loops<\/span> and <span class=\"tex-font-style-bf\">multiple edges<\/span>.<\/p><p>It is guaranteed that the sums of $$$n$$$ and $$$m$$$ over all test cases do not exceed $$$10^6$$$ each.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case output one integer \u2014 the minimum cost.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 4 15<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 5 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 3 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 3 9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 4 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 4 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 1 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 3 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 3 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 6 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 6 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 5 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 4 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5 1 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">4 3 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2 4 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 4 7<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n<div class=\"test-example-line test-example-line-odd test-example-line-1\">58<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">8<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">71<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">43<\/div><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p><a href=\"https://codeforces.com/assets/contests/2164/E_ooxathoosh9Oob4quoiv.html\">Visualizer link<\/a><\/p><p>Let $$$u \\xrightarrow{e} v$$$ denote going to vertex $$$v$$$ from vertex $$$u$$$ by edge $$$e$$$. <\/p><p>In the first test case, one possible solution is:<\/p><ol> <li> Initially, you are at vertex $$$1$$$. <\/li><li> Mark edge $$$3$$$ and move to vertex $$$3$$$, costs $$$6$$$. <\/li><li> Mark edge $$$6$$$ and move to vertex $$$4$$$, costs $$$7$$$. <\/li><li> Mark edge $$$1$$$ and move to vertex $$$2$$$, costs $$$15$$$. <\/li><li> Mark edge $$$4$$$ and move to vertex $$$3$$$, costs $$$9$$$. <\/li><li> Transfer to vertex $$$5$$$. By choosing path $$$3 \\xrightarrow{6} 4 \\xrightarrow{1} 2 \\xrightarrow{2} 5$$$, we can achieve cost $$$7$$$, since the maximum index among the edges on the path is $$$6$$$, and $$$w_6 = 7$$$. <span class=\"tex-font-style-bf\">Note that we don't care about the maximum weight on the path when using operation 2.<\/span> <\/li><li> Mark edge $$$2$$$ and move to vertex $$$2$$$, costs $$$4$$$. <\/li><li> Mark edge $$$5$$$ and move to vertex $$$1$$$, costs $$$10$$$. <\/li><\/ol><p>The total cost is $$$6+7+15+9+7+4+10=58$$$.<\/p><p>In the second test case, one possible solution is:<\/p><ol> <li> Mark edge $$$1$$$ and move to vertex $$$2$$$, costs $$$3$$$. <\/li><li> Transfer to vertex $$$3$$$ by $$$2 \\xrightarrow{1} 1 \\xrightarrow{3} 4 \\xrightarrow{3} 1 \\xrightarrow{2} 3$$$, costs $$$1$$$. <span class=\"tex-font-style-bf\">Note the path chosen in operation 2 may not be simple.<\/span> <\/li><li> Mark edge $$$2$$$ and move to vertex $$$1$$$, costs $$$2$$$. <\/li><li> Mark edge $$$3$$$ and move to vertex $$$4$$$, costs $$$1$$$. <\/li><li> Transfer to vertex $$$1$$$ by $$$4 \\xrightarrow{3} 1$$$, costs $$$1$$$. <\/li><\/ol><\/div><\/div>"}, {"contestId": 708, "index": "C", "name": "Centroids", "rating": 2300, "solvedCount": 4656, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Centroids<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-it\">Tree<\/span> is a connected acyclic graph. Suppose you are given a tree consisting of <span class=\"tex-span\"><i>n<\/i><\/span> vertices. The vertex of this tree is called <span class=\"tex-font-style-it\">centroid<\/span> if the size of each connected component that appears if this vertex is removed from the tree doesn't exceed <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/a64c1b2df604f8cfa9acf6716a3cc1424488361e.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>.<\/p><p>You are given a tree of size <span class=\"tex-span\"><i>n<\/i><\/span> and can perform no more than one edge replacement. <span class=\"tex-font-style-it\">Edge replacement<\/span> is the operation of removing one edge from the tree (without deleting incident vertices) and inserting one new edge (without adding new vertices) in such a way that the graph remains a tree. For each vertex you have to determine if it's possible to make it centroid by performing no more than one edge replacement.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains an integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009400\u2009000<\/span>)\u00a0\u2014 the number of vertices in the tree. Each of the next <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> lines contains a pair of vertex indices <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>)\u00a0\u2014 endpoints of the corresponding edge.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>n<\/i><\/span> integers. The <span class=\"tex-span\"><i>i<\/i><\/span>-th of them should be equal to <span class=\"tex-span\">1<\/span> if the <span class=\"tex-span\"><i>i<\/i><\/span>-th vertex can be made centroid by replacing no more than one edge, and should be equal to <span class=\"tex-span\">0<\/span> otherwise.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>1 2<br/>2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1 1 1 <br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1 2<br/>1 3<br/>1 4<br/>1 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1 0 0 0 0 <br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample each vertex can be made a centroid. For example, in order to turn vertex <span class=\"tex-span\">1<\/span> to centroid one have to replace the edge <span class=\"tex-span\">(2,\u20093)<\/span> with the edge <span class=\"tex-span\">(1,\u20093)<\/span>.<\/p><\/div><\/div>"}, {"contestId": 825, "index": "E", "name": "Minimal Labels", "rating": 2300, "solvedCount": 4513, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Minimal Labels<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a directed acyclic graph with <span class=\"tex-span\"><i>n<\/i><\/span> vertices and <span class=\"tex-span\"><i>m<\/i><\/span> edges. There are no self-loops or multiple edges between any pair of vertices. Graph can be disconnected.<\/p><p>You should assign labels to all vertices in such a way that:<\/p><ul> <li> Labels form a valid permutation of length <span class=\"tex-span\"><i>n<\/i><\/span> \u2014 an integer sequence such that each integer from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span> appears exactly once in it. <\/li><li> If there exists an edge from vertex <span class=\"tex-span\"><i>v<\/i><\/span> to vertex <span class=\"tex-span\"><i>u<\/i><\/span> then <span class=\"tex-span\"><i>label<\/i><sub class=\"lower-index\"><i>v<\/i><\/sub><\/span> should be smaller than <span class=\"tex-span\"><i>label<\/i><sub class=\"lower-index\"><i>u<\/i><\/sub><\/span>. <\/li><li> Permutation should be lexicographically smallest among all suitable. <\/li><\/ul><p>Find such sequence of labels to satisfy all the conditions.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integer numbers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>,\u20091\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>).<\/p><p>Next <span class=\"tex-span\"><i>m<\/i><\/span> lines contain two integer numbers <span class=\"tex-span\"><i>v<\/i><\/span> and <span class=\"tex-span\"><i>u<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>v<\/i>,\u2009<i>u<\/i>\u2009\u2264\u2009<i>n<\/i>,\u2009<i>v<\/i>\u2009\u2260\u2009<i>u<\/i><\/span>) \u2014 edges of the graph. Edges are directed, graph doesn't contain loops or multiple edges.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>n<\/i><\/span> numbers \u2014 lexicographically smallest correct permutation of labels of vertices.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 3<br/>1 2<br/>1 3<br/>3 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1 3 2 <br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 5<br/>3 1<br/>4 1<br/>2 3<br/>3 4<br/>2 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4 1 2 3 <br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 4<br/>3 1<br/>2 1<br/>2 3<br/>4 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3 1 2 4 5 <br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1450, "index": "C2", "name": "Errich-Tac-Toe (Hard Version)", "rating": 2300, "solvedCount": 4460, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C2. Errich-Tac-Toe (Hard Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">The only difference between the easy and hard versions is that tokens of type <span class=\"tex-font-style-tt\">O<\/span> do not appear in the input of the easy version.<\/span><\/p><p><span class=\"tex-font-style-it\">Errichto gave Monogon the following challenge in order to intimidate him from taking his top contributor spot on Codeforces.<\/span><\/p><p>In a Tic-Tac-Toe grid, there are $$$n$$$ rows and $$$n$$$ columns. Each cell of the grid is either empty or contains a token. There are two types of tokens: <span class=\"tex-font-style-tt\">X<\/span> and <span class=\"tex-font-style-tt\">O<\/span>. If there exist three tokens of the same type consecutive in a row or column, it is a winning configuration. Otherwise, it is a draw configuration.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/bba0760cbab8c91381e0746bd01cc5a4be5b9329.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> The patterns in the first row are winning configurations. The patterns in the second row are draw configurations. <\/center><p>In an operation, you can change an <span class=\"tex-font-style-tt\">X<\/span> to an <span class=\"tex-font-style-tt\">O<\/span>, or an <span class=\"tex-font-style-tt\">O<\/span> to an <span class=\"tex-font-style-tt\">X<\/span>. Let $$$k$$$ denote the total number of tokens in the grid. Your task is to make the grid a <span class=\"tex-font-style-bf\">draw<\/span> in at most $$$\\lfloor \\frac{k}{3}\\rfloor$$$ (rounding down) operations.<\/p><p>You are <span class=\"tex-font-style-bf\">not required<\/span> to minimize the number of operations.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1\\le t\\le 100$$$) \u2014 the number of test cases.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1\\le n\\le 300$$$) \u2014 the size of the grid.<\/p><p>The following $$$n$$$ lines each contain a string of $$$n$$$ characters, denoting the initial grid. The character in the $$$i$$$-th row and $$$j$$$-th column is '<span class=\"tex-font-style-tt\">.<\/span>' if the cell is empty, or it is the type of token in the cell: '<span class=\"tex-font-style-tt\">X<\/span>' or '<span class=\"tex-font-style-tt\">O<\/span>'.<\/p><p>It is guaranteed that not all cells are empty.<\/p><p>The sum of $$$n$$$ across all test cases does not exceed $$$300$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print the state of the grid after applying the operations.<\/p><p>We have proof that a solution always exists. If there are multiple solutions, print any.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n3\n.O.\nOOO\n.O.\n6\nXXXOOO\nXXXOOO\nXX..OO\nOO..XX\nOOOXXX\nOOOXXX\n5\n.OOO.\nOXXXO\nOXXXO\nOXXXO\n.OOO.\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n.O.\nOXO\n.O.\nOXXOOX\nXOXOXO\nXX..OO\nOO..XX\nOXOXOX\nXOOXXO\n.OXO.\nOOXXO\nXXOXX\nOXXOO\n.OXO.<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, there are initially three '<span class=\"tex-font-style-tt\">O<\/span>' consecutive in the second row and the second column. By changing the middle token to '<span class=\"tex-font-style-tt\">X<\/span>' we make the grid a draw, and we only changed $$$1\\le \\lfloor 5/3\\rfloor$$$ token.<\/p><p>In the second test case, the final grid is a draw. We only changed $$$8\\le \\lfloor 32/3\\rfloor$$$ tokens.<\/p><p>In the third test case, the final grid is a draw. We only changed $$$7\\le \\lfloor 21/3\\rfloor$$$ tokens.<\/p><\/div><\/div>"}, {"contestId": 808, "index": "G", "name": "Anthem of Berland", "rating": 2300, "solvedCount": 4141, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. Anthem of Berland<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Berland has a long and glorious history. To increase awareness about it among younger citizens, King of Berland decided to compose an anthem.<\/p><p>Though there are lots and lots of victories in history of Berland, there is the one that stand out the most. King wants to mention it in the anthem as many times as possible.<\/p><p>He has already composed major part of the anthem and now just needs to fill in some letters. King asked you to help him with this work.<\/p><p>The anthem is the string <span class=\"tex-span\"><i>s<\/i><\/span> of no more than <span class=\"tex-span\">10<sup class=\"upper-index\">5<\/sup><\/span> small Latin letters and question marks. The most glorious victory is the string <span class=\"tex-span\"><i>t<\/i><\/span> of no more than <span class=\"tex-span\">10<sup class=\"upper-index\">5<\/sup><\/span> small Latin letters. You should replace all the question marks with small Latin letters in such a way that the number of occurrences of string <span class=\"tex-span\"><i>t<\/i><\/span> in string <span class=\"tex-span\"><i>s<\/i><\/span> is maximal.<\/p><p>Note that the occurrences of string <span class=\"tex-span\"><i>t<\/i><\/span> in <span class=\"tex-span\"><i>s<\/i><\/span> can overlap. Check the third example for clarification.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains string of small Latin letters and question marks <span class=\"tex-span\"><i>s<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009|<i>s<\/i>|\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>).<\/p><p>The second line contains string of small Latin letters <span class=\"tex-span\"><i>t<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009|<i>t<\/i>|\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>).<\/p><p><span class=\"tex-font-style-bf\">Product of lengths of strings <span class=\"tex-span\">|<i>s<\/i>|\u00b7|<i>t<\/i>|<\/span> won't exceed <span class=\"tex-span\">10<sup class=\"upper-index\">7<\/sup><\/span>.<\/span><\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output the maximum number of occurrences of string <span class=\"tex-span\"><i>t<\/i><\/span> you can achieve by replacing all the question marks in strin

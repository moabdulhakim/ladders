-border-bottom\"><span class=\"tex-font-style-tt\">11<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$1$$$<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$3$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">0<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$0$$$<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$1, 3$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">10<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$0$$$<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$2, 3$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">10<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$0$$$<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$1, 2, 3$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">110<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$0$$$<\/td><\/tr><\/tbody><\/table> <\/center><p>Summing up: $$$0+0+1+0+0+0+0 = 1$$$.<\/p><p>After the second modification, we have $$$s = \\texttt{111}$$$. We can compute the sum of scores over all subsequences as follows:<\/p><center> <table class=\"tex-tabular\"><tbody><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-bf\">Indices<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-bf\">Subsequence<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-bf\">Score<\/span><\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$1$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">1<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$0$$$<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$2$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">1<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$0$$$<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$1, 2$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">11<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$1$$$<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$3$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">1<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$0$$$<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$1, 3$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">11<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$1$$$<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$2, 3$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">11<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$1$$$<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$1, 2, 3$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">111<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$2$$$<\/td><\/tr><\/tbody><\/table> <\/center><p>Summing up: $$$0+0+1+0+1+1+2 = 5$$$.<\/p><\/div><\/div>"}, {"contestId": 1245, "index": "F", "name": "Daniel and Spring Cleaning", "rating": 2300, "solvedCount": 2446, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Daniel and Spring Cleaning<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>While doing some spring cleaning, Daniel found an old calculator that he loves so much. However, it seems like it is broken. When he tries to compute $$$1 + 3$$$ using the calculator, he gets $$$2$$$ instead of $$$4$$$. But when he tries computing $$$1 + 4$$$, he gets the correct answer, $$$5$$$. Puzzled by this mystery, he opened up his calculator and found the answer to the riddle: the full adders became half adders! <\/p><p>So, when he tries to compute the sum $$$a + b$$$ using the calculator, he instead gets the xorsum $$$a \\oplus b$$$ (read the definition by the link: <a href=\"https://en.wikipedia.org/wiki/Exclusive_or\">https://en.wikipedia.org/wiki/Exclusive_or<\/a>).<\/p><p>As he saw earlier, the calculator sometimes gives the correct answer. And so, he wonders, given integers $$$l$$$ and $$$r$$$, how many pairs of integers $$$(a, b)$$$ satisfy the following conditions: $$$$$$a + b = a \\oplus b$$$$$$ $$$$$$l \\leq a \\leq r$$$$$$ $$$$$$l \\leq b \\leq r$$$$$$<\/p><p>However, Daniel the Barman is going to the bar and will return in two hours. He tells you to solve the problem before he returns, or else you will have to enjoy being blocked.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 100$$$) \u2014 the number of testcases.<\/p><p>Then, $$$t$$$ lines follow, each containing two space-separated integers $$$l$$$ and $$$r$$$ ($$$0 \\le l \\le r \\le 10^9$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$t$$$ integers, the $$$i$$$-th integer should be the answer to the $$$i$$$-th testcase.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n1 4\n323 323\n1 1000000\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n8\n0\n3439863766\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>$$$a \\oplus b$$$ denotes the bitwise XOR of $$$a$$$ and $$$b$$$.<\/p><p>For the first testcase, the pairs are: $$$(1, 2)$$$, $$$(1, 4)$$$, $$$(2, 1)$$$, $$$(2, 4)$$$, $$$(3, 4)$$$, $$$(4, 1)$$$, $$$(4, 2)$$$, and $$$(4, 3)$$$.<\/p><\/div><\/div>"}, {"contestId": 623, "index": "B", "name": "Array GCD", "rating": 2300, "solvedCount": 2442, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Array GCD<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given array <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> of length <span class=\"tex-span\"><i>n<\/i><\/span>. You may consecutively apply two operations to this array:<\/p><ul> <li> remove some subsegment (continuous subsequence) of length <span class=\"tex-span\"><i>m<\/i>\u2009&lt;\u2009<i>n<\/i><\/span> and pay for it <span class=\"tex-span\"><i>m<\/i>\u00b7<i>a<\/i><\/span> coins; <\/li><li> change some elements of the array by at most <span class=\"tex-span\">1<\/span>, and pay <span class=\"tex-span\"><i>b<\/i><\/span> coins for each change. <\/li><\/ul><p>Please note that each of operations may be applied at most once (and may be not applied at all) so you can remove only one segment and each number may be changed (increased or decreased) by at most <span class=\"tex-span\">1<\/span>. Also note, that you are not allowed to delete the whole array.<\/p><p>Your goal is to calculate the minimum number of coins that you need to spend in order to make the greatest common divisor of the elements of the resulting array be greater than <span class=\"tex-span\">1<\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains integers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20091\u2009000\u2009000,\u20090\u2009\u2264\u2009<i>a<\/i>,\u2009<i>b<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>)\u00a0\u2014 the length of the array, the cost of removing a single element in the first operation and the cost of changing an element, respectively.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>)\u00a0\u2014 elements of the array.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single number\u00a0\u2014 the minimum cost of changes needed to obtain an array, such that the greatest common divisor of all its elements is greater than <span class=\"tex-span\">1<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 1 4<br/>4 2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 3 2<br/>5 17 13 5 6<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>8<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>8 3 4<br/>3 7 5 4 3 12 9 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>13<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample the optimal way is to remove number <span class=\"tex-span\">3<\/span> and pay <span class=\"tex-span\">1<\/span> coin for it.<\/p><p>In the second sample you need to remove a segment <span class=\"tex-span\">[17,\u200913]<\/span> and then decrease number <span class=\"tex-span\">6<\/span>. The cost of these changes is equal to <span class=\"tex-span\">2\u00b73\u2009+\u20092\u2009=\u20098<\/span> coins.<\/p><\/div><\/div>"}, {"contestId": 2063, "index": "E", "name": "Triangle Tree", "rating": 2300, "solvedCount": 2441, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Triangle Tree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p> <\/p><center> <span class=\"tex-font-size-small\"><span class=\"tex-font-style-it\">One day, a giant tree grew in the countryside. Little John, with his childhood eagle, decided to make it his home. Little John will build a structure on the tree with galvanized square steel. However, little did he know, he could not build what is physically impossible.<\/span><\/span> <\/center><p>You are given a rooted tree$$$^{\\text{\u2217}}$$$ containing $$$n$$$ vertices rooted at vertex $$$1$$$. A pair of vertices $$$(u,v)$$$ is called a <span class=\"tex-font-style-it\">good pair<\/span> if $$$u$$$ is not an ancestor$$$^{\\text{\u2020}}$$$ of $$$v$$$ and $$$v$$$ is not an ancestor of $$$u$$$. For any two vertices, $$$\\text{dist}(u,v)$$$ is defined as the number of edges on the unique simple path from $$$u$$$ to $$$v$$$, and $$$\\text{lca}(u,v)$$$ is defined as their <a href=\"https://en.wikipedia.org/wiki/Lowest_common_ancestor\">lowest common ancestor<\/a>.<\/p><p>A function $$$f(u,v)$$$ is defined as follows.<\/p><ul> <li> If $$$(u,v)$$$ is a good pair, $$$f(u,v)$$$ is the number of distinct integer values $$$x$$$ such that there exists a <span class=\"tex-font-style-bf\">non-degenerate triangle<\/span>$$$^{\\text{\u2021}}$$$ formed by side lengths $$$\\text{dist}(u,\\text{lca}(u,v))$$$, $$$\\text{dist}(v,\\text{lca}(u,v))$$$, and $$$x$$$. <\/li><li> Otherwise, $$$f(u,v)$$$ is $$$0$$$. <\/li><\/ul><p>You need to find the following value: $$$$$$\\sum_{i = 1}^{n-1} \\sum_{j = i+1}^n f(i,j).$$$$$$<\/p><div class=\"statement-footnote\"><p>$$$^{\\text{\u2217}}$$$A tree is a connected graph without cycles.  A rooted tree is a tree where one vertex is special and called the root. <\/p><p>$$$^{\\text{\u2020}}$$$An ancestor of vertex $$$v$$$ is any vertex on the simple path from $$$v$$$ to the root, including the root, but not including $$$v$$$. The root has no ancestors. <\/p><p>$$$^{\\text{\u2021}}$$$A triangle with side lengths $$$a$$$, $$$b$$$, $$$c$$$ is non-degenerate when $$$a+b  \\gt  c$$$, $$$a+c  \\gt  b$$$, $$$b+c  \\gt  a$$$.<\/p><\/div><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 3 \\cdot 10^5$$$).<\/p><p>Each of the next $$$n-1$$$ lines contains two integers $$$u_i$$$ and $$$v_i$$$, denoting the two vertices connected by an edge ($$$1 \\le u_i,v_i \\le n$$$, $$$u_i \\neq v_i$$$).<\/p><p>It is guaranteed that the given edges form a tree.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$3 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output the answer on a separate line.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">11<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">8 9<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">7 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">10 11<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n0\n4\n29\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>On the first test case, the only good pair $$$(i,j)$$$ satisfying $$$i \\lt j$$$ is $$$(2,3)$$$. Here, $$$\\text{lca}(2,3)$$$ is $$$1$$$, and the two distances are $$$1$$$ and $$$1$$$.<\/p><p>There is only one value of $$$x$$$ for two side lengths $$$1$$$ and $$$1$$$, which is $$$1$$$. Therefore, the answer for the first test case is $$$1$$$.<\/p><p>On the second test case, there is no good pair. Therefore, the answer for the second test case is $$$0$$$.<\/p><p>On the third test case, the good pairs $$$(i,j)$$$ satisfying $$$i \\lt j$$$ are as follows.<\/p><ul> <li> $$$(2,5)$$$: $$$\\text{lca}(2,5)$$$ is $$$1$$$, distances are $$$1$$$ and $$$1$$$. There is only one possible value of $$$x$$$, which is $$$1$$$. <\/li><li> $$$(3,4)$$$: $$$\\text{lca}(3,4)$$$ is $$$2$$$, distances are $$$1$$$ and $$$1$$$. There is only one possible value of $$$x$$$, which is $$$1$$$. <\/li><li> $$$(3,5)$$$: $$$\\text{lca}(3,5)$$$ is $$$1$$$, distances are $$$2$$$ and $$$1$$$. There is only one possible value of $$$x$$$, which is $$$2$$$. <\/li><li> $$$(4,5)$$$: $$$\\text{lca}(4,5)$$$ is $$$1$$$, distances are $$$2$$$ and $$$1$$$. There is only one possible value of $$$x$$$, which is $$$2$$$. <\/li><\/ul><p>Therefore, the answer for the third test case is $$$1+1+1+1=4$$$.<\/p><\/div><\/div>"}];
    let currentProblem = null;
    let editor = null;
    const STORAGE_KEY = `cf_ladder_done_2300`;
    let doneSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));

    // Retrieve the template securely from the hidden textarea
    const DEFAULT_TEMPLATE = document.getElementById('cpp-template').value.trim();

    function initEditor() {
        editor = ace.edit("editor");
        editor.setTheme("ace/theme/tomorrow_night_eighties");
        editor.session.setMode("ace/mode/c_cpp");
        editor.setFontSize(15);
        editor.setValue(DEFAULT_TEMPLATE, 1);
    }

    function renderSidebar() {
        const list = document.getElementById('problem-list');
        list.innerHTML = '';
        PROBLEMS.forEach((prob, idx) => {
            const div = document.createElement('div');
            div.className = `problem-item ${currentProblem === prob ? 'active' : ''}`;
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox'; checkbox.className = 'done-checkbox'; checkbox.checked = doneSet.has(prob.name);
            checkbox.onclick = (e) => { e.stopPropagation(); toggleDone(prob.name, checkbox.checked); };
            const title = document.createElement('div');
            title.innerHTML = `<span class="text-xs text-slate-500">#${idx + 1}</span> <span class="font-semibold text-slate-200">${prob.name}</span>`;
            div.appendChild(checkbox); div.appendChild(title); div.onclick = () => loadProblem(prob);
            list.appendChild(div);
        });
        updateProgress();
    }

    function toggleDone(name, isDone) {
        if(isDone) { doneSet.add(name); confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#4ade80', '#38bdf8'] }); } 
        else { doneSet.delete(name); }
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...doneSet]));
        updateProgress();
    }

    function updateProgress() { document.getElementById('progress-text').innerText = `${doneSet.size} / ${PROBLEMS.length} Solved`; }

    function loadProblem(prob) {
        currentProblem = prob; renderSidebar();
        document.getElementById('welcome-screen').style.display = 'none';
        const contentDiv = document.getElementById('problem-content');
        contentDiv.style.display = 'block'; contentDiv.innerHTML = prob.html;
        const titleEl = contentDiv.querySelector('.header .title');
        if(titleEl) {
            const originalText = titleEl.innerText;
            titleEl.innerHTML = `<a href="https://codeforces.com/contest/${prob.contestId}/problem/${prob.index}" target="_blank" title="Open in Codeforces">${originalText} 🔗</a>`;
        }
        contentDiv.querySelectorAll('.sample-tests .input pre').forEach(pre => {
            const btn = document.createElement('button'); btn.innerText = 'Copy'; btn.className = 'copy-btn';
            btn.onclick = () => { navigator.clipboard.writeText(pre.innerText); btn.innerText = 'Copied!'; btn.style.background = '#4ade80'; setTimeout(() => { btn.innerText = 'Copy'; btn.style.background = 'var(--neon-blue)'; }, 2000); };
            pre.parentElement.appendChild(btn);
        });
        if (window.MathJax) { MathJax.typesetPromise([contentDiv]); }
        editor.setValue(DEFAULT_TEMPLATE, 1);
    }

    function toggleSettings() {
        const modal = document.getElementById('settings-modal');
        if(modal.style.display === 'flex') { modal.style.display = 'none'; } 
        else { modal.style.display = 'flex'; document.getElementById('api-key').value = localStorage.getItem('cf_api_key') || ''; document.getElementById('api-secret').value = localStorage.getItem('cf_api_secret') || ''; }
    }

    function saveSettings() {
        localStorage.setItem('cf_api_key', document.getElementById('api-key').value);
        localStorage.setItem('cf_api_secret', document.getElementById('api-secret').value);
        toggleSettings(); alert('API Credentials Saved!');
    }

    async function sha512(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-512', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function submitCode() {
        if(!currentProblem) return alert('Select a problem first!');
        const apiKey = localStorage.getItem('cf_api_key'); const apiSecret = localStorage.getItem('cf_api_secret');
        if(!apiKey || !apiSecret) { alert('Please configure your API Key and Secret first.'); toggleSettings(); return; }
        const code = editor.getValue(); const time = Math.floor(Date.now() / 1000); const rand = Math.floor(Math.random() * 900000) + 100000;
        const params = { apiKey: apiKey, contestId: currentProblem.contestId.toString(), languageId: "54", problemIndex: currentProblem.index, source: code, time: time.toString() };
        const sortedKeys = Object.keys(params).sort();
        let paramString = sortedKeys.map(k => `${k}=${encodeURIComponent(params[k])}`).join('&');
        const sigPlain = `${rand}/problemset.submit?${paramString}#${apiSecret}`;
        const apiSig = `${rand}` + await sha512(sigPlain);
        try {
            const formData = new URLSearchParams();
            for (const key in params) formData.append(key, params[key]);
            formData.append("apiSig", apiSig);
            const res = await fetch("https://codeforces.com/api/problemset.submit", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: formData.toString() });
            const data = await res.json();
            if(data.status === 'OK') { alert('Code submitted successfully! 🎉 Check your Codeforces submissions.'); confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } }); } 
            else { alert('Submission failed: ' + data.comment); }
        } catch (err) { console.error(err); alert('Network error during submission.'); }
    }

    window.onload = () => { initEditor(); renderSidebar(); };
</script>

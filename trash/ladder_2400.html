"index": "D", "name": "Turtle and Multiplication", "rating": 2400, "solvedCount": 2250, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Turtle and Multiplication<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Turtle just learned how to multiply two integers in his math class, and he was very excited.<\/p><p>Then Piggy gave him an integer $$$n$$$, and asked him to construct a sequence $$$a_1, a_2, \\ldots, a_n$$$ consisting of integers which satisfied the following conditions:<\/p><ul> <li> For all $$$1 \\le i \\le n$$$, $$$1 \\le a_i \\le 3 \\cdot 10^5$$$. <\/li><li> For all $$$1 \\le i  \\lt  j \\le n - 1$$$, $$$a_i \\cdot a_{i + 1} \\ne a_j \\cdot a_{j + 1}$$$. <\/li><\/ul><p>Of all such sequences, Piggy asked Turtle to find the one with the <span class=\"tex-font-style-bf\">minimum<\/span> number of <span class=\"tex-font-style-bf\">distinct<\/span> elements.<\/p><p>Turtle definitely could not solve the problem, so please help him!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$2 \\le n \\le 10^6$$$) \u2014 the length of the sequence $$$a$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$10^6$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ \u2014 the elements of the sequence $$$a$$$.<\/p><p>If there are multiple answers, print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n114514 114514\n1 2 2\n3 3 4 4\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the third test case, $$$a = [3, 4, 2, 6]$$$ violates the second condition since $$$a_1 \\cdot a_2 = a_3 \\cdot a_4$$$. $$$a = [2, 3, 4, 4]$$$ satisfy the conditions but its number of distinct elements isn't minimum.<\/p><\/div><\/div>"}, {"contestId": 1408, "index": "E", "name": "Avoid Rainbow Cycles", "rating": 2400, "solvedCount": 2245, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Avoid Rainbow Cycles<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given $$$m$$$ sets of integers $$$A_1, A_2, \\ldots, A_m$$$; elements of these sets are integers between $$$1$$$ and $$$n$$$, inclusive.<\/p><p>There are two arrays of positive integers $$$a_1, a_2, \\ldots, a_m$$$ and $$$b_1, b_2, \\ldots, b_n$$$. <\/p><p>In one operation you can delete an element $$$j$$$ from the set $$$A_i$$$ and pay $$$a_i + b_j$$$ coins for that.<\/p><p>You can make several (maybe none) operations (some sets can become empty).<\/p><p>After that, you will make an edge-colored undirected graph consisting of $$$n$$$ vertices. For each set $$$A_i$$$ you will add an edge $$$(x, y)$$$ with color $$$i$$$ for all $$$x, y \\in A_i$$$ and $$$x  \\lt  y$$$. Some pairs of vertices can be connected with more than one edge, but such edges have different colors.<\/p><p>You call a cycle $$$i_1 \\to e_1 \\to i_2 \\to e_2 \\to \\ldots \\to i_k \\to e_k \\to i_1$$$ ($$$e_j$$$ is some edge connecting vertices $$$i_j$$$ and $$$i_{j+1}$$$ in this graph) <span class=\"tex-font-style-it\">rainbow<\/span> if all edges on it have different colors.<\/p><p>Find the minimum number of coins you should pay to get a graph without rainbow cycles.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$m$$$ and $$$n$$$ ($$$1 \\leq m, n \\leq 10^5$$$), the number of sets and the number of vertices in the graph.<\/p><p>The second line contains $$$m$$$ integers $$$a_1, a_2, \\ldots, a_m$$$ ($$$1 \\leq a_i \\leq 10^9$$$).<\/p><p>The third line contains $$$n$$$ integers $$$b_1, b_2, \\ldots, b_n$$$ ($$$1 \\leq b_i \\leq 10^9$$$).<\/p><p>In the each of the next of $$$m$$$ lines there are descriptions of sets. In the $$$i$$$-th line the first integer $$$s_i$$$ ($$$1 \\leq s_i \\leq n$$$) is equal to the size of $$$A_i$$$. Then $$$s_i$$$ integers follow: the elements of the set $$$A_i$$$. These integers are from $$$1$$$ to $$$n$$$ and distinct.<\/p><p>It is guaranteed that the sum of $$$s_i$$$ for all $$$1 \\leq i \\leq m$$$ does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer: the minimum number of coins you should pay for operations to avoid rainbow cycles in the obtained graph.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 2\n1 2 3\n4 5\n2 1 2\n2 1 2\n2 1 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n11\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7 8\n3 6 7 9 10 7 239\n8 1 9 7 10 2 6 239\n3 2 1 3\n2 4 1\n3 1 3 7\n2 4 3\n5 3 4 5 6 7\n2 5 7\n1 8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n66\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test, you can make such operations:<\/p><ul> <li> Delete element $$$1$$$ from set $$$1$$$. You should pay $$$a_1 + b_1 = 5$$$ coins for that. <\/li><li> Delete element $$$1$$$ from set $$$2$$$. You should pay $$$a_2 + b_1 = 6$$$ coins for that. <\/li><\/ul><p>You pay $$$11$$$ coins in total. After these operations, the first and the second sets will be equal to $$$\\{2\\}$$$ and the third set will be equal to $$$\\{1, 2\\}$$$.<\/p><p>So, the graph will consist of one edge $$$(1, 2)$$$ of color $$$3$$$.<\/p><p>In the second test, you can make such operations:<\/p><ul> <li> Delete element $$$1$$$ from set $$$1$$$. You should pay $$$a_1 + b_1 = 11$$$ coins for that. <\/li><li> Delete element $$$4$$$ from set $$$2$$$. You should pay $$$a_2 + b_4 = 13$$$ coins for that. <\/li><li> Delete element $$$7$$$ from set $$$3$$$. You should pay $$$a_3 + b_7 = 13$$$ coins for that. <\/li><li> Delete element $$$4$$$ from set $$$4$$$. You should pay $$$a_4 + b_4 = 16$$$ coins for that. <\/li><li> Delete element $$$7$$$ from set $$$6$$$. You should pay $$$a_6 + b_7 = 13$$$ coins for that. <\/li><\/ul><p>You pay $$$66$$$ coins in total.<\/p><p>After these operations, the sets will be:<\/p><ul> <li> $$$\\{2, 3\\}$$$; <\/li><li> $$$\\{1\\}$$$; <\/li><li> $$$\\{1, 3\\}$$$; <\/li><li> $$$\\{3\\}$$$; <\/li><li> $$$\\{3, 4, 5, 6, 7\\}$$$; <\/li><li> $$$\\{5\\}$$$; <\/li><li> $$$\\{8\\}$$$. <\/li><\/ul><p>We will get the graph:<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/5cf40a2ec741d258c6734584e25a52b6f7b14fd7.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>There are no rainbow cycles in it.<\/p><\/div><\/div>"}, {"contestId": 798, "index": "D", "name": "Mike and distribution", "rating": 2400, "solvedCount": 2239, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Mike and distribution<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Mike has always been thinking about the harshness of social inequality. He's so obsessed with it that sometimes it even affects him while solving problems. At the moment, Mike has two sequences of positive integers <span class=\"tex-span\"><i>A<\/i>\u2009=\u2009[<i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub>]<\/span> and <span class=\"tex-span\"><i>B<\/i>\u2009=\u2009[<i>b<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>b<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub>]<\/span> of length <span class=\"tex-span\"><i>n<\/i><\/span> each which he uses to ask people some quite peculiar questions.<\/p><p>To test you on how good are you at spotting inequality in life, he wants you to find an <span class=\"tex-font-style-it\">\"unfair\"<\/span> subset of the original sequence. To be more precise, he wants you to select <span class=\"tex-span\"><i>k<\/i><\/span> numbers <span class=\"tex-span\"><i>P<\/i>\u2009=\u2009[<i>p<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>p<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>p<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>]<\/span> such that <span class=\"tex-span\">1\u2009\u2264\u2009<i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span> for <span class=\"tex-span\">1\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>k<\/i><\/span> and elements in <span class=\"tex-span\"><i>P<\/i><\/span> are distinct. Sequence <span class=\"tex-span\"><i>P<\/i><\/span> will represent indices of elements that you'll select from both sequences. He calls such a subset <span class=\"tex-span\"><i>P<\/i><\/span> <span class=\"tex-font-style-it\">\"unfair\"<\/span> if and only if the following conditions are satisfied: <span class=\"tex-span\">2\u00b7(<i>a<\/i><sub class=\"lower-index\"><i>p<\/i><sub class=\"lower-index\">1<\/sub><\/sub>\u2009+\u2009...\u2009+\u2009<i>a<\/i><sub class=\"lower-index\"><i>p<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/sub>)<\/span> is <span class=\"tex-font-style-bf\">greater<\/span> than the sum of all elements from sequence <span class=\"tex-span\"><i>A<\/i><\/span>, and <span class=\"tex-span\">2\u00b7(<i>b<\/i><sub class=\"lower-index\"><i>p<\/i><sub class=\"lower-index\">1<\/sub><\/sub>\u2009+\u2009...\u2009+\u2009<i>b<\/i><sub class=\"lower-index\"><i>p<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/sub>)<\/span> is <span class=\"tex-font-style-bf\">greater<\/span> than the sum of all elements from the sequence <span class=\"tex-span\"><i>B<\/i><\/span>. Also, <span class=\"tex-span\"><i>k<\/i><\/span> should be smaller or equal to <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/e70d0af1413d58226605b883a776c3d3115f99a2.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> because it will be to easy to find sequence <span class=\"tex-span\"><i>P<\/i><\/span> if he allowed you to select too many elements!<\/p><p>Mike guarantees you that a solution will always exist given the conditions described above, so please help him satisfy his curiosity!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the number of elements in the sequences. <\/p><p>On the second line there are <span class=\"tex-span\"><i>n<\/i><\/span> space-separated integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) \u2014 elements of sequence <span class=\"tex-span\"><i>A<\/i><\/span>.<\/p><p>On the third line there are also <span class=\"tex-span\"><i>n<\/i><\/span> space-separated integers <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\">1<\/sub>,\u2009...,\u2009<i>b<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) \u2014 elements of sequence <span class=\"tex-span\"><i>B<\/i><\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>On the first line output an integer <span class=\"tex-span\"><i>k<\/i><\/span> which represents the size of the found subset. <span class=\"tex-span\"><i>k<\/i><\/span> should be less or equal to <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/a469312c13fe74770be91238847356d82f74c170.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>.<\/p><p>On the next line print <span class=\"tex-span\"><i>k<\/i><\/span> integers <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>p<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>p<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>) \u2014 the elements of sequence <span class=\"tex-span\"><i>P<\/i><\/span>. You can print the numbers in any order you want. Elements in sequence <span class=\"tex-span\"><i>P<\/i><\/span> should be distinct.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>8 7 4 8 3<br/>4 2 5 3 7<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/>1 4 5<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1761, "index": "E", "name": "Make It Connected", "rating": 2400, "solvedCount": 2230, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Make It Connected<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a simple undirected graph consisting of $$$n$$$ vertices. The graph doesn't contain self-loops, there is at most one edge between each pair of vertices. Your task is simple: make the graph connected.<\/p><p>You can do the following operation any number of times (possibly zero):<\/p><ul> <li> Choose a vertex $$$u$$$ arbitrarily. <\/li><li> For each vertex $$$v$$$ satisfying $$$v\\ne u$$$ in the graph individually, if $$$v$$$ is adjacent to $$$u$$$, remove the edge between $$$u$$$ and $$$v$$$, otherwise add an edge between $$$u$$$ and $$$v$$$. <\/li><\/ul><p>Find the minimum number of operations required to make the graph connected. Also, find any sequence of operations with the minimum length that makes the graph connected.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains a single integer $$$t$$$ ($$$1\\leq t\\leq 800$$$)\u00a0\u2014 the number of test cases. The description of test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$2\\leq n\\leq 4000$$$)\u00a0\u2014 the number of vertices in the graph.<\/p><p>Then $$$n$$$ lines follow. The $$$i$$$-th row contains a binary string $$$s_i$$$ of length $$$n$$$, where $$$s_{i,j}$$$ is '<span class=\"tex-font-style-tt\">1<\/span>' if there is an edge between vertex $$$i$$$ and $$$j$$$ initially, otherwise $$$s_{i,j}$$$ is '<span class=\"tex-font-style-tt\">0<\/span>'.<\/p><p>It is guaranteed that $$$s_{i,i}$$$ is always '<span class=\"tex-font-style-tt\">0<\/span>' and $$$s_{i,j}=s_{j,i}$$$ for $$$1\\leq i,j\\leq n$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$4000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, in the first line, output an integer $$$m$$$ \u00a0\u2014 the minimum number of operations required.<\/p><p>If $$$m$$$ is greater than zero, then print an extra line consisting of $$$m$$$ integers\u00a0\u2014 the vertices chosen in the operations in your solution. If there are multiple solutions with the minimum number of operations, print any.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">011<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">100<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">100<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">000<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">001<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">010<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0100<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1000<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0001<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0010<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">001100<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">000011<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">100100<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">101000<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">010001<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">010010<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n1\n1\n2\n3 4 \n3\n2 5 6 \n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the graph is connected at the beginning, so the answer is $$$0$$$.<\/p><p>In the second test case, if we do the operation with vertex $$$1$$$, we will get the following graph represented by an adjacency matrix:<\/p><p>$$$$$$ \\begin{bmatrix} 0&amp;1&amp;1\\\\ 1&amp;0&amp;1\\\\ 1&amp;1&amp;0 \\end{bmatrix} $$$$$$<\/p><p>It's obvious that the graph above is connected.<\/p><p>In the third test case, if we do the operation with vertex $$$3$$$ and $$$4$$$, we will get the following graph represented by an adjacency matrix:<\/p><p>$$$$$$ \\begin{bmatrix} 0&amp;1&amp;1&amp;1\\\\ 1&amp;0&amp;1&amp;1\\\\ 1&amp;1&amp;0&amp;1\\\\ 1&amp;1&amp;1&amp;0 \\end{bmatrix} $$$$$$<\/p><p>It's obvious that the graph above is connected, and it can be proven that we can't perform less than $$$2$$$ operations to make the graph connected.<\/p><\/div><\/div>"}, {"contestId": 1844, "index": "E", "name": "Great Grids", "rating": 2400, "solvedCount": 2220, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Great Grids<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>An $$$n \\times m$$$ grid of characters is called <span class=\"tex-font-style-it\">great<\/span> if it satisfies these three conditions: <\/p><ul> <li> Each character is either '<span class=\"tex-font-style-tt\">A<\/span>', '<span class=\"tex-font-style-tt\">B<\/span>', or '<span class=\"tex-font-style-tt\">C<\/span>'. <\/li><li> Every $$$2 \\times 2$$$ contiguous subgrid contains all three different letters. <\/li><li> Any two cells that share a common edge contain different letters. <\/li><\/ul><p>Let $$$(x,y)$$$ denote the cell in the $$$x$$$-th row from the top and $$$y$$$-th column from the left.<\/p><p>You want to construct a great grid that satisfies $$$k$$$ constraints. Each constraint consists of two cells, $$$(x_{i,1},y_{i,1})$$$ and $$$(x_{i,2},y_{i,2})$$$, that share exactly one corner. You want your great grid to have the same letter in cells $$$(x_{i,1},y_{i,1})$$$ and $$$(x_{i,2},y_{i,2})$$$.<\/p><p>Determine whether there exists a great grid satisfying all the constraints. <\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^3$$$). The description of the test cases follows.<\/p><p>The first line of each test case contains three integers, $$$n$$$, $$$m$$$, and $$$k$$$ ($$$2 \\le n,m \\le 2 \\cdot 10^3$$$, $$$1 \\le k \\le 4 \\cdot 10^3$$$).<\/p><p>Each of the next $$$k$$$ lines contains four integers, $$$x_{i,1}$$$, $$$y_{i,1}$$$, $$$x_{i,2}$$$, and $$$y_{i,2}$$$ ($$$1 \\le x_{i,1}  \\lt  x_{i,2} \\le n$$$, $$$1 \\le y_{i,1},y_{i,2} \\le m$$$). It is guaranteed that either $$$(x_{i,2},y_{i,2}) = (x_{i,1}+1,y_{i,1}+1)$$$ or $$$(x_{i,2},y_{i,2}) = (x_{i,1}+1,y_{i,1}-1)$$$.<\/p><p>The pairs of cells are pairwise distinct, i.e. for all $$$1 \\le i  \\lt  j \\le k$$$, it is <span class=\"tex-font-style-bf\">not<\/span> true that $$$x_{i,1} = x_{j,1}$$$, $$$y_{i,1} = y_{j,1}$$$, $$$x_{i,2} = x_{j,2}$$$, and $$$y_{i,2} = y_{j,2}$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^3$$$.<\/p><p>It is guaranteed that the sum of $$$m$$$ over all test cases does not exceed $$$2 \\cdot 10^3$$$.<\/p><p>It is guaranteed that the sum of $$$k$$$ over all test cases does not exceed $$$4 \\cdot 10^3$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output \"<span class=\"tex-font-style-tt\">YES<\/span>\" if a great grid satisfying all the constraints exists and \"<span class=\"tex-font-style-tt\">NO<\/span>\" otherwise.<\/p><p>You can output the answer in any case (upper or lower). For example, the strings \"<span class=\"tex-font-style-tt\">yEs<\/span>\", \"<span class=\"tex-font-style-tt\">yes<\/span>\", \"<span class=\"tex-font-style-tt\">Yes<\/span>\", and \"<span class=\"tex-font-style-tt\">YES<\/span>\" will be recognized as positive responses.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 4 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1 2 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 1 3 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 4 2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 3 3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 7 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 1 2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2 2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">8 5 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 5 2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 1 8 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 4 8 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">8 5 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 2 2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 5 2 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">7 1 8 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">7 5 8 4<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nNO\nYES\nNO\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the following great grid satisfies all the constraints: <table class=\"tex-tabular\"><tbody><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">B<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">A<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">B<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">C<\/span><\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">C<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">B<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">C<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">A<\/span><\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">A<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">C<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">A<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">B<\/span><\/td><\/tr><\/tbody><\/table><\/p><p>In the second test case, the two constraints imply that cells $$$(1,1)$$$ and $$$(2,2)$$$ have the same letter and cells $$$(1,2)$$$ and $$$(2,1)$$$ have the same letter, which makes it impossible for the only $$$2 \\times 2$$$ subgrid to contain all three different letters.<\/p><\/div><\/div>"}, {"contestId": 1582, "index": "F2", "name": "Korney Korneevich and XOR (hard version)", "rating": 2400, "solvedCount": 2202, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F2. Korney Korneevich and XOR (hard version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is a harder version of the problem with bigger constraints.<\/span><\/p><p>Korney Korneevich dag up an array $$$a$$$ of length $$$n$$$. Korney Korneevich has recently read about the operation <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#XOR\">bitwise XOR<\/a>, so he wished to experiment with it. For this purpose, he decided to find all integers $$$x \\ge 0$$$ such that there exists an <span class=\"tex-font-style-bf\">increasing<\/span> subsequence of the array $$$a$$$, in which the bitwise XOR of numbers is equal to $$$x$$$.<\/p><p>It didn't take a long time for Korney Korneevich to find all such $$$x$$$, and he wants to check his result. That's why he asked you to solve this problem!<\/p><p>A sequence $$$s$$$ is a subsequence of a sequence $$$b$$$ if $$$s$$$ can be obtained from $$$b$$$ by deletion of several (possibly, zero or all) elements.<\/p><p>A sequence $$$s_1, s_2, \\ldots , s_m$$$ is called increasing if $$$s_1  \\lt  s_2  \\lt  \\ldots  \\lt  s_m$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$1 \\le n \\le 10^6$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$0 \\le a_i \\le 5000$$$) \u2014 the elements of the array $$$a$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In the first line print a single integer $$$k$$$ \u2014 the number of found $$$x$$$ values.<\/p><p>In the second line print $$$k$$$ integers in <span class=\"tex-font-style-bf\">increasing<\/span> order $$$x_1, x_2, \\ldots x_k$$$ ($$$0 \\le x_1  \\lt  \\ldots  \\lt  x_k$$$) \u2014 found $$$x$$$ values.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n4 2 2 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n0 2 4 6 \n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n8\n1 0 1 7 12 5 3 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n12\n0 1 2 3 4 5 6 7 10 11 12 13 \n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case:<\/p><ul> <li> To get value $$$x = 0$$$ it is possible to choose and empty subsequence <\/li><li> To get value $$$x = 2$$$ it is possible to choose a subsequence $$$[2]$$$ <\/li><li> To get value $$$x = 4$$$ it is possible to choose a subsequence $$$[4]$$$ <\/li><li> To get value $$$x = 6$$$ it is possible to choose a subsequence $$$[2, 4]$$$ <\/li><\/ul><\/div><\/div>"}, {"contestId": 1753, "index": "D", "name": "The Beach", "rating": 2400, "solvedCount": 2190, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. The Beach<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Andrew loves the sea. That's why, at the height of the summer season, he decided to go to the beach, taking a sunbed with him to sunbathe.<\/p><p>The beach is a rectangular field with $$$n$$$ rows and $$$m$$$ columns. Some cells of the beach are free, some have roads, stones, shops and other non-movable objects. Some of two adjacent along the side cells can have sunbeds located either horizontally or vertically.<\/p><p>Andrew hopes to put his sunbed somewhere, but that's a bad luck, there may no longer be free places for him! That's why Andrew asked you to help him to find a free place for his sunbed. Andrew's sunbed also should be places on two adjacent cells. <\/p><p>If there are no two adjacent free cells, then in order to free some place for a sunbed, you will have to disturb other tourists. You can do the following actions:<\/p><ul> <li> Come to some sunbed and, after causing $$$p$$$ units of discomfort to its owner, lift the sunbed by one of its sides and rotate it by $$$90$$$ degrees. One half of the sunbed must remain in the same cell and another half of the sunbed must move to the free cell. At the same time, anything could be on the way of a sunbed during the rotation .<center> <table class=\"tex-tabular\"><tbody><tr><td class=\"tex-tabular-text-align-center\"><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/0b99c9c60a4e51d48facd8ce267ea733afdd57c0.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"192px\"/><\/td><td class=\"tex-tabular-text-align-center\"><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/7a26b58202306eeab15d960ba1e13c0d736aa30b.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"96px\"/><\/td><td class=\"tex-tabular-text-align-center\"><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/cf1ccd3d9ea43c21a6c7d044e0e11c9fccdf993d.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"192px\"/><\/td><\/tr><\/tbody><\/table> <span class=\"tex-font-size-small\">Rotation of the sunbed by $$$90$$$ degrees around cell $$$(1, 2)$$$.<\/span> <\/center><\/li><li> Come to some sunbed and, after causing $$$q$$$ units of discomfort to its owner, shift the sunbed along its long side by one cell. One half of the sunbed must move to the place of another, and another\u00a0\u2014 to the free cell.<center> <table class=\"tex-tabular\"><tbody><tr><td class=\"tex-tabular-text-align-center\"><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/0b99c9c60a4e51d48facd8ce267ea733afdd57c0.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"192px\"/><\/td><td class=\"tex-tabular-text-align-center\"><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/7a26b58202306eeab15d960ba1e13c0d736aa30b.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"96px\"/><\/td><td class=\"tex-tabular-text-align-center\"><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/2444008536a396e8a9e35557530527305a8d88c7.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"192px\"/><\/td><\/tr><\/tbody><\/table> <span class=\"tex-font-size-small\">Shift of the sunbed by one cell to the right.<\/span> <\/center><\/li><\/ul><p>In any moment each sunbed occupies two adjacent free cells. You cannot move more than one sunbed at a time.<\/p><p>Help Andrew to free a space for his sunbed, causing the minimum possible number of units of discomfort to other tourists, or detect that it is impossible.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\le n, m \\le 300\\,000$$$, $$$1 \\le n \\cdot m \\le 300\\,000$$$)\u00a0\u2014 the number of rows and columns in rectangle.<\/p><p>The second line contains two integers $$$p$$$ and $$$q$$$ ($$$1 \\le p, q \\le 10^9$$$)\u00a0\u2014 the number of units of discomfort caused by rotation and shift of a sunbed, respectively.<\/p><p>Each of the following $$$n$$$ lines contains $$$m$$$ characters, describing cells of the rectangle. Each lines consists of characters \"<span class=\"tex-font-style-tt\">L<\/span>\", \"<span class=\"tex-font-style-tt\">R<\/span>\", \"<span class=\"tex-font-style-tt\">D<\/span>\", \"<span class=\"tex-font-style-tt\">U<\/span>\", \"<span class=\"tex-font-style-tt\">.<\/span>\" and \"<span class=\"tex-font-style-tt\">#<\/span>\", denoting the type of the cell. Characters \"<span class=\"tex-font-style-tt\">L<\/span>\", \"<span class=\"tex-font-style-tt\">R<\/span>\", \"<span class=\"tex-font-style-tt\">D<\/span>\" and \"<span class=\"tex-font-style-tt\">U<\/span>\" denote a half of a sunbed placed in the cell\u00a0\u2014 left, right, bottom and top half, respectively. Character \"<span class=\"tex-font-style-tt\">.<\/span>\" denotes a free cell and character \"<span class=\"tex-font-style-tt\">#<\/span>\"\u00a0\u2014 a cell, occupied by some non-movable object.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer\u00a0\u2014 the minimum possible number of units of discomfort, caused to other tourists, to free a space for a sunbed. If it is impossible to free a space for a sunbed, print $$$-1$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">2 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">5 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">.LR##<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">##LR.<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">LR.<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">#.#<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n-1\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">10 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">.LR<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">###<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">UU#<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">DD.<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n-1\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">10 7<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">.U##.#<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">#DLR##<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">.##LR.<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n24\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example we can shift upper sunbed to the left and lower sunbed\u00a0\u2014 to the right. Andrew will be able to put his sunbed vertically in the middle of the beach. We well cause $$$2 + 2 = 4$$$ units of discomfort. It is easy to prove that it is an optimal answer. <\/p><center> <table class=\"tex-tabular\"><tbody><tr><td class=\"tex-tabular-text-align-center\"><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/ef8aec374ae9f1a4ab8bf4632a892ea366a15791.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"240px\"/><\/td><td class=\"tex-tabular-text-align-center\"><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/7a26b58202306eeab15d960ba1e13c0d736aa30b.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"96px\"/><\/td><td class=\"tex-tabular-text-align-center\"><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/a82f34c7c0e74583f2756088bba640f78dc48863.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"240px\"/><\/td><\/tr><\/tbody><\/table> <span class=\"tex-font-size-small\">Optimal strategy in the first example (Andrew's sunbed is colored white).<\/span> <\/center> In the second example it is impossible to free a space for Andrew's sunbed. All possible states of the beach after any rotates and shifts are illustrated in the problem statement.<\/div><\/div>"}, {"contestId": 1852, "index": "C", "name": "Ina of the Mountain", "rating": 2400, "solvedCount": 2187, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Ina of the Mountain<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-it\">To prepare her \"Takodachi\" dumbo octopuses for world domination, Ninomae Ina'nis, a.k.a. Ina of the Mountain, orders Hoshimachi Suisei to throw boulders at them. Ina asks you, Kiryu Coco, to help choose where the boulders are thrown.<\/span><\/p><p>There are $$$n$$$ octopuses on a single-file trail on Ina's mountain, numbered $$$1, 2, \\ldots, n$$$. The $$$i$$$-th octopus has a certain initial health value $$$a_i$$$, where $$$1 \\leq a_i \\leq k$$$.<\/p><p>Each boulder crushes consecutive octopuses with indexes $$$l, l+1, \\ldots, r$$$, where $$$1 \\leq l \\leq r \\leq n$$$. You can choose the numbers $$$l$$$ and $$$r$$$ arbitrarily for each boulder.<\/p><p>For each boulder, the health value of each octopus the boulder crushes is reduced by $$$1$$$. However, as octopuses are immortal, once they reach a health value of $$$0$$$, they will immediately regenerate to a health value of $$$k$$$. <\/p><p>Given the octopuses' initial health values, find the <span class=\"tex-font-style-bf\">minimum<\/span> number of boulders that need to be thrown to make the health of all octopuses equal to $$$k$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^5$$$). The description of the test cases follows.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$, $$$1 \\le k \\le 10^9$$$)\u00a0\u2013 the number of octopuses, and the upper bound of a octopus's health value.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le k$$$)\u00a0\u2013 the initial health values of the octopuses.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output the <span class=\"tex-font-style-bf\">minimum<\/span> number of boulders that need to be thrown to make the health values of all octopuses equal to $$$k$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">7 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2 3 1 3 2 1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n4\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the minimum number of boulders thrown is $$$2$$$: <\/p><ul> <li> Throw the first boulder between $$$[l,r] = [1,3]$$$. Then, the octopuses' health values become $$$[3, 1, 3, 3]$$$. <\/li><li> Throw the second boulder between $$$[l,r] = [2,2]$$$. Then, the octopuses' health values become $$$[3, 3, 3, 3]$$$. <\/li><\/ul><p>In the second test case, the minimum number of boulders thrown is $$$4$$$. The $$$[l,r]$$$ ranges are $$$[1,7], [2, 6], [3, 5], [4, 4]$$$.<\/p><\/div><\/div>"}, {"contestId": 1667, "index": "C", "name": "Half Queen Cover", "rating": 2400, "solvedCount": 2182, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Half Queen Cover<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a board with $$$n$$$ rows and $$$n$$$ columns, numbered from $$$1$$$ to $$$n$$$. The intersection of the $$$a$$$-th row and $$$b$$$-th column is denoted by $$$(a, b)$$$.<\/p><p>A half-queen attacks cells in the same row, same column, and on one diagonal. More formally, a half-queen on $$$(a, b)$$$ attacks the cell $$$(c, d)$$$ if $$$a=c$$$ or $$$b=d$$$ or $$$a-b=c-d$$$.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/b80330b5ec2e5eab083ee17cb72ae4c290227a89.png\" style=\"zoom: 40.0%;max-width: 100.0%;max-height: 100.0%;\"/> <span class=\"tex-font-size-small\">The blue cells are under attack.<\/span> <\/center> What is the minimum number of half-queens that can be placed on that board so as to ensure that each square is attacked by at least one half-queen?<p>Construct an optimal solution.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$1 \\le n \\le 10^5$$$) \u2014 the size of the board.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In the first line print a single integer $$$k$$$ \u2014 the minimum number of half-queens.<\/p><p>In each of the next $$$k$$$ lines print two integers $$$a_i$$$, $$$b_i$$$ ($$$1 \\le a_i, b_i \\le n$$$) \u2014 the position of the $$$i$$$-th half-queen.<\/p><p>If there are multiple solutions, print any.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n1 1\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n1 1\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n1 1\n1 2\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Example $$$1$$$: one half-queen is enough. Note: a half-queen on $$$(1, 1)$$$ attacks $$$(1, 1)$$$.<\/p><p>Example $$$2$$$: one half-queen is enough too. $$$(1, 2)$$$ or $$$(2, 1)$$$ would be wrong solutions, because a half-queen on $$$(1, 2)$$$ does not attack the cell $$$(2, 1)$$$ and vice versa. $$$(2, 2)$$$ is also a valid solution.<\/p><p>Example $$$3$$$: it is impossible to cover the board with one half queen. There are multiple solutions for $$$2$$$ half-queens; you can print any of them.<\/p><\/div><\/div>"}, {"contestId": 1749, "index": "E", "name": "Cactus Wall", "rating": 2400, "solvedCount": 2176, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Cactus Wall<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Monocarp is playing Minecraft and wants to build a wall of cacti. He wants to build it on a field of sand of the size of $$$n \\times m$$$ cells. Initially, there are cacti in some cells of the field. <span class=\"tex-font-style-bf\">Note that, in Minecraft, cacti cannot grow on cells adjacent to each other by side \u2014 and the initial field meets this restriction<\/span>. Monocarp can plant new cacti (they must also fulfil the aforementioned condition). He can't chop down any of the cacti that are already growing on the field \u2014 he doesn't have an axe, and the cacti are too prickly for his hands.<\/p><p>Monocarp believes that the wall is complete if there is no path from the top row of the field to the bottom row, such that: <\/p><ul> <li> each two consecutive cells in the path are adjacent by side; <\/li><li> no cell belonging to the path contains a cactus. <\/li><\/ul><p>Your task is to plant the minimum number of cacti to build a wall (or to report that this is impossible).<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^3$$$)\u00a0\u2014 number of test cases.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$m$$$ ($$$2 \\le n, m \\le 2 \\cdot 10^5$$$; $$$n \\times m \\le 4 \\cdot 10^5$$$)\u00a0\u2014 the number of rows and columns, respectively.<\/p><p>Then $$$n$$$ rows follow, $$$i$$$-th row contains a string $$$s_i$$$ of length $$$m$$$, where $$$s_{i, j}$$$ is '<span class=\"tex-font-style-tt\">#<\/span>', if a cactus grows at the intersection of the $$$i$$$-th row and the $$$j$$$-th column. Otherwise, $$$s_{i, j}$$$ is '<span class=\"tex-font-style-tt\">.<\/span>'.<\/p><p>The sum of $$$n \\times m$$$ over all test cases does not exceed $$$4 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print <span class=\"tex-font-style-tt\">NO<\/span> in the first line if it is impossible to build a cactus wall without breaking the rules. Otherwise, print <span class=\"tex-font-style-tt\">YES<\/span> in the first line, then print $$$n$$$ lines of $$$m$$$ characters each\u00a0\u2014 the field itself, where the $$$j$$$-th character of the $$$i$$$-th line is equal to '<span class=\"tex-font-style-tt\">#<\/span>', if there is a cactus on the intersection of the $$$i$$$-th row and the $$$j$$$-th column, otherwise it is '<span class=\"tex-font-style-tt\">.<\/span>'. If there are multiple optimal answers, print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">.#..<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">..#.<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">#.#<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">...<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">.#.<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">.....<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">.....<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">.....<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">.....<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">.....<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">#..<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">.#.<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">#.#<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">...<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\n.#.#\n#.#.\nNO\nYES\n....#\n...#.\n..#..\n.#...\n#....\nYES\n#..\n.#.\n#.#\n...\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1848, "index": "F", "name": "Vika and Wiki", "rating": 2400, "solvedCount": 2156, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Vika and Wiki<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Recently, Vika was studying her favorite internet resource - Wikipedia.<\/p><p>On the expanses of Wikipedia, she read about an interesting mathematical operation <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#XOR\">bitwise XOR<\/a>, denoted by $$$\\oplus$$$. <\/p><p>Vika began to study the properties of this mysterious operation. To do this, she took an array $$$a$$$ consisting of $$$n$$$ non-negative integers and applied the following operation to all its elements at the same time: $$$a_i = a_i \\oplus a_{(i+1) \\bmod n}$$$. Here $$$x \\bmod y$$$ denotes the remainder of dividing $$$x$$$ by $$$y$$$. The elements of the array are numbered starting from $$$0$$$.<\/p><p>Since it is not enough to perform the above actions once for a complete study, Vika repeats them until the array $$$a$$$ becomes all zeros.<\/p><p>Determine how many of the above actions it will take to make all elements of the array $$$a$$$ zero. If this moment never comes, output $$$-1$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$1 \\le n \\le 2^{20}$$$) - the length of the array $$$a$$$.<\/p><p>It is guaranteed that $$$n$$$ can be represented as $$$2^k$$$ for some integer $$$k$$$ ($$$0 \\le k \\le 20$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_0, a_1, a_2, \\dots, a_{n-1}$$$ ($$$0 \\le a_i \\le 10^9$$$) - the elements of the array $$$a$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output a single number - the minimum number of actions required to make all elements of the array $$$a$$$ zero, or $$$-1$$$ if the array $$$a$$$ will never become zero.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n1 2 1 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n0 0\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1\n14\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n8\n0 1 2 3 4 5 6 7\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, after one operation, the array $$$a$$$ will become equal to $$$[3, 3, 3, 3]$$$. After one more operation, it will become equal to $$$[0, 0, 0, 0]$$$.<\/p><p>In the second example, the array $$$a$$$ initially consists only of zeros.<\/p><p>In the third example, after one operation, the array $$$a$$$ will become equal to $$$[0]$$$.<\/p><\/div><\/div>"}, {"contestId": 1096, "index": "G", "name": "Lucky Tickets", "rating": 2400, "solvedCount": 2145, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. Lucky Tickets<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>All bus tickets in Berland have their numbers. A number consists of $$$n$$$ digits ($$$n$$$ is even). Only $$$k$$$ decimal digits $$$d_1, d_2, \\dots, d_k$$$ can be used to form ticket numbers. If $$$0$$$ is among these digits, then numbers may have leading zeroes. For example, if $$$n = 4$$$ and only digits $$$0$$$ and $$$4$$$ can be used, then $$$0000$$$, $$$4004$$$, $$$4440$$$ are valid ticket numbers, and $$$0002$$$, $$$00$$$, $$$44443$$$ are not.<\/p><p>A ticket is lucky if the sum of first $$$n / 2$$$ digits is equal to the sum of remaining $$$n / 2$$$ digits. <\/p><p>Calculate the number of different lucky tickets in Berland. Since the answer may be big, print it modulo $$$998244353$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$k$$$ $$$(2 \\le n \\le 2 \\cdot 10^5, 1 \\le k \\le 10)$$$ \u2014 the number of digits in each ticket number, and the number of different decimal digits that may be used. $$$n$$$ is even.<\/p><p>The second line contains a sequence of <span class=\"tex-font-style-bf\">pairwise distinct<\/span> integers $$$d_1, d_2, \\dots, d_k$$$ $$$(0 \\le d_i \\le 9)$$$ \u2014 the digits that may be used in ticket numbers. The digits are given in arbitrary order.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the number of lucky ticket numbers, taken modulo $$$998244353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 2<br/>1 8<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>20 1<br/>6<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>10 5<br/>6 1 4 0 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>569725<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>1000 7<br/>5 4 0 1 8 3 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>460571165<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example there are $$$6$$$ lucky ticket numbers: $$$1111$$$, $$$1818$$$, $$$1881$$$, $$$8118$$$, $$$8181$$$ and $$$8888$$$.<\/p><p>There is only one ticket number in the second example, it consists of $$$20$$$ digits $$$6$$$. This ticket number is lucky, so the answer is $$$1$$$.<\/p><\/div><\/div>"}, {"contestId": 2143, "index": "E", "name": "Make Good", "rating": 2400, "solvedCount": 2133, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Make Good<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p> <\/p><p>You are given a bracket string $$$s$$$ of length $$$n$$$. You can apply the following operations arbitrary number of times (possibly, zero) and in any order:<\/p><ul> <li> Choose an index $$$1 \\leq i  \\lt  |s|$$$ such that $$$s_i = s_{i+1} = \\texttt{(}$$$, and replace both $$$s_i$$$ and $$$s_{i+1}$$$ with $$$\\texttt{)}$$$. <\/li><li> Choose an index $$$1 \\leq i  \\lt  |s|$$$ such that $$$s_i = s_{i+1} = \\texttt{)}$$$, and replace both $$$s_i$$$ and $$$s_{i+1}$$$ with $$$\\texttt{(}$$$. <\/li><\/ul><p>Find a regular bracket sequence$$$^{\\text{\u2217}}$$$ $$$t$$$ which can be obtained from $$$s$$$ by applying the operations described above, or print $$$-1$$$ if there is no such $$$t$$$.<\/p><div class=\"statement-footnote\"><p>$$$^{\\text{\u2217}}$$$A regular bracket sequence is a bracket sequence that can be transformed into a correct arithmetic expression by inserting characters <span class=\"tex-font-style-tt\">\"1\"<\/span> and <span class=\"tex-font-style-tt\">\"+\"<\/span> between the original characters of the sequence. For example: the bracket sequences <span class=\"tex-font-style-tt\">\"()()\"<\/span> and <span class=\"tex-font-style-tt\">\"(())\"<\/span> are regular (the resulting expressions are: <span class=\"tex-font-style-tt\">\"(1)+(1)\"<\/span> and <span class=\"tex-font-style-tt\">\"((1+1)+1)\")<\/span>; the bracket sequences <span class=\"tex-font-style-tt\">\")(\"<\/span>, <span class=\"tex-font-style-tt\">\"(\"<\/span> and <span class=\"tex-font-style-tt\">\")\"<\/span> are not.<\/p><\/div><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows. <\/p><p>The first line contains one integer $$$n$$$ ($$$1 \\leq n \\leq 2 \\cdot 10^5$$$)\u00a0\u2014 the length of the string.<\/p><p>The second line contains a single string $$$s$$$\u00a0\u2014 a sequence of the characters <span class=\"tex-font-style-tt\">(<\/span> and <span class=\"tex-font-style-tt\">)<\/span> of length $$$n$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case output a regular bracket string $$$t$$$ which can be obtained from $$$s$$$ or print $$$-1$$$ if there is no such $$$t$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n4\n()()\n6\n((())(\n10\n))(())())(\n8\n))))))))\n1\n(\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n()()\n-1\n-1\n(())(())\n-1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first testcase, the string <span class=\"tex-font-style-tt\">\"()()\"<\/span> is already a regular bracket sequence. No changes needed.<\/p><p>In the second and third testcases it's impossible to reach a regular bracket string from $$$s$$$.<\/p><p>In the fourth testcase we can do the following:<\/p><p><span class=\"tex-font-style-tt\">\"))))))))\"<\/span> $$$\\xrightarrow{i = 1}$$$ <span class=\"tex-font-style-tt\">\"(())))))\"<\/span><\/p><p><span class=\"tex-font-style-tt\">\"(())))))\"<\/span> $$$\\xrightarrow{i = 5}$$$ <span class=\"tex-font-style-tt\">\"(())(())\"<\/span>. <\/p><\/div><\/div>"}, {"contestId": 1617, "index": "D2", "name": "Too Many Impostors (hard version)", "rating": 2400, "solvedCount": 2126, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D2. Too Many Impostors (hard version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-it\">This is an interactive problem. The only difference between the easy and hard version is the limit on number of questions.<\/span><\/p><p>There are $$$n$$$ players labelled from $$$1$$$ to $$$n$$$. <span class=\"tex-font-style-bf\">It is guaranteed that $$$n$$$ is a multiple of $$$3$$$.<\/span><\/p><p>Among them, there are $$$k$$$ impostors and $$$n-k$$$ crewmates. The number of impostors, $$$k$$$, is not given to you. <span class=\"tex-font-style-bf\">It is guaranteed that $$$\\frac{n}{3}  \\lt  k  \\lt  \\frac{2n}{3}$$$.<\/span><\/p><p>In each question, you can choose three distinct integers $$$a$$$, $$$b$$$, $$$c$$$ ($$$1 \\le a, b, c \\le n$$$) and ask: \"Among the players labelled $$$a$$$, $$$b$$$ and $$$c$$$, are there more impostors or more crewmates?\" You will be given the integer $$$0$$$ if there are more impostors than crewmates, and $$$1$$$ otherwise.<\/p><p>Find the number of impostors $$$k$$$ and the indices of players that are impostors after asking at most $$$n+6$$$ questions.<\/p><p>The jury is <span class=\"tex-font-style-bf\">adaptive<\/span>, which means the indices of impostors may not be fixed beforehand and can depend on your questions. It is guaranteed that there is at least one set of impostors which fulfills the constraints and the answers to your questions at any time.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 100$$$). Description of the test cases follows.<\/p><p>The first and only line of each test case contains a single integer $$$n$$$ ($$$6 \\le n  \\lt  10^4$$$, $$$n$$$ is a multiple of $$$3$$$)\u00a0\u2014 the number of players.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^4$$$.<\/p><\/div><div><div class=\"section-title\">Interaction<\/div><p>For each test case, the interaction starts with reading $$$n$$$.<\/p><p>Then you are allowed to make at most $$$n+6$$$ questions in the following way:<\/p><p>\"<span class=\"tex-font-style-tt\">? a b c<\/span>\" ($$$1 \\le a, b, c \\le n$$$, $$$a$$$, $$$b$$$ and $$$c$$$ are pairwise distinct).<\/p><p>After each one, you should read an integer $$$r$$$, which is equal to $$$0$$$ if there are more impostors than crewmates among players labelled $$$a$$$, $$$b$$$ and $$$c$$$, and equal to $$$1$$$ otherwise.<\/p><p>Answer $$$-1$$$ instead of $$$0$$$ or $$$1$$$ means that you made an invalid query. Exit immediately after receiving $$$-1$$$ and you will see <span class=\"tex-font-style-tt\">Wrong answer<\/span> verdict. Otherwise you can get an arbitrary verdict because your solution will continue to read from a closed stream.<\/p><p>When you have found the indices of all impostors, print a single line \"<span class=\"tex-font-style-tt\">! <\/span>\" (without quotes), followed by the number of impostors $$$k$$$, followed by $$$k$$$ integers representing the indices of the impostors. Please note that you must print all this information on the same line. <\/p><p>After printing the answer, your program must then continue to solve the remaining test cases, or exit if all test cases have been solved.<\/p><p>After printing the queries and answers do not forget to output end of line and flush the output buffer. Otherwise, you will get the <span class=\"tex-font-style-tt\">Idleness limit exceeded<\/span> verdict. To do flush use:<\/p><ul> <li> <span class=\"tex-font-style-tt\">fflush(stdout)<\/span> or <span class=\"tex-font-style-tt\">cout.flush()<\/span> in C++; <\/li><li> <span class=\"tex-font-style-tt\">System.out.flush()<\/span> in Java; <\/li><li> <span class=\"tex-font-style-tt\">flush(output)<\/span> in Pascal; <\/li><li> <span class=\"tex-font-style-tt\">stdout.flush()<\/span> in Python; <\/li><li> Read documentation for other languages. <\/li><\/ul><p><span class=\"tex-font-style-bf\">Hacks<\/span><\/p><p>You cannot make hacks in this problem.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n6\n\n0\n\n1\n\n9\n\n1<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n? 1 2 3\n\n? 3 4 5\n\n! 3 4 1 2\n\n? 7 1 9\n\n! 4 2 3 6 8<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Explanation for example interaction (note that this example only exists to demonstrate the interaction procedure and does not provide any hint for the solution):<\/p><p>For the first test case:<\/p><p>Question \"<span class=\"tex-font-style-tt\">? 1 2 3<\/span>\" returns $$$0$$$, so there are more impostors than crewmates among players $$$1$$$, $$$2$$$ and $$$3$$$.<\/p><p>Question \"<span class=\"tex-font-style-tt\">? 3 4 5<\/span>\" returns $$$1$$$, so there are more crewmates than impostors among players $$$3$$$, $$$4$$$ and $$$5$$$.<\/p><p>Outputting \"<span class=\"tex-font-style-tt\">! 3 4 1 2<\/span>\" means that one has found all the impostors, by some miracle. There are $$$k = 3$$$ impostors. The players who are impostors are players $$$4$$$, $$$1$$$ and $$$2$$$.<\/p><p>For the second test case:<\/p><p>Question \"<span class=\"tex-font-style-tt\">? 7 1 9<\/span>\" returns $$$1$$$, so there are more crewmates than impostors among players $$$7$$$, $$$1$$$ and $$$9$$$.<\/p><p>Outputting \"<span class=\"tex-font-style-tt\">! 4 2 3 6 8<\/span>\" means that one has found all the impostors, by some miracle. There are $$$k = 4$$$ impostors. The players who are impostors are players $$$2$$$, $$$3$$$, $$$6$$$ and $$$8$$$.<\/p><\/div><\/div>"}, {"contestId": 825, "index": "F", "name": "String Compression", "rating": 2400, "solvedCount": 2124, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. String Compression<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Ivan wants to write a letter to his friend. The letter is a string <span class=\"tex-span\"><i>s<\/i><\/span> consisting of lowercase Latin letters.<\/p><p>Unfortunately, when Ivan started writing the letter, he realised that it is very long and writing the whole letter may take extremely long time. So he wants to write the <span class=\"tex-font-style-it\">compressed version<\/span> of string <span class=\"tex-span\"><i>s<\/i><\/span> instead of the string itself.<\/p><p>The <span class=\"tex-font-style-it\">compressed version<\/span> of string <span class=\"tex-span\"><i>s<\/i><\/span> is a sequence of strings <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>s<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\">2<\/sub>,\u2009<i>s<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>c<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>,\u2009<i>s<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span>, where <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is the decimal representation of number <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (without any leading zeroes) and <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is some string consisting of lowercase Latin letters. If Ivan writes string <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\">1<\/sub><\/span> exactly <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub><\/span> times, then string <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\">2<\/sub><\/span> exactly <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">2<\/sub><\/span> times, and so on, the result will be string <span class=\"tex-span\"><i>s<\/i><\/span>.<\/p><p>The length of a <span class=\"tex-font-style-it\">compressed version<\/span> is <span class=\"tex-span\">|<i>c<\/i><sub class=\"lower-index\">1<\/sub>|\u2009+\u2009|<i>s<\/i><sub class=\"lower-index\">1<\/sub>|\u2009+\u2009|<i>c<\/i><sub class=\"lower-index\">2<\/sub>|\u2009+\u2009|<i>s<\/i><sub class=\"lower-index\">2<\/sub>|... |<i>c<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>|\u2009+\u2009|<i>s<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>|<\/span>. Among all <span class=\"tex-font-style-it\">compressed versions<\/span> Ivan wants to choose a version such that its length is minimum possible. Help Ivan to determine minimum possible length.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line of input contains one string <span class=\"tex-span\"><i>s<\/i><\/span> consisting of lowercase Latin letters (<span class=\"tex-span\">1\u2009\u2264\u2009|<i>s<\/i>|\u2009\u2264\u20098000<\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output one integer number \u2014 the minimum possible length of a <span class=\"tex-font-style-it\">compressed version<\/span> of <span class=\"tex-span\"><i>s<\/i><\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>aaaaaaaaaa<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>abcab<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>cczabababab<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>7<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example Ivan will choose this compressed version: <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\">1<\/sub><\/span> is <span class=\"tex-font-style-tt\">10<\/span>, <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\">1<\/sub><\/span> is <span class=\"tex-font-style-tt\">a<\/span>.<\/p><p>In the second example Ivan will choose this compressed version: <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\">1<\/sub><\/span> is <span class=\"tex-font-style-tt\">1<\/span>, <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\">1<\/sub><\/span> is <span class=\"tex-font-style-tt\">abcab<\/span>.<\/p><p>In the third example Ivan will choose this compressed version: <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\">1<\/sub><\/span> is <span class=\"tex-font-style-tt\">2<\/span>, <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\">1<\/sub><\/span> is <span class=\"tex-font-style-tt\">c<\/span>, <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\">2<\/sub><\/span> is <span class=\"tex-font-style-tt\">1<\/span>, <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\">2<\/sub><\/span> is <span class=\"tex-font-style-tt\">z<\/span>, <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\">3<\/sub><\/span> is <span class=\"tex-font-style-tt\">4<\/span>, <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\">3<\/sub><\/span> is <span class=\"tex-font-style-tt\">ab<\/span>.<\/p><\/div><\/div>"}, {"contestId": 1290, "index": "C", "name": "Prefix Enlightenment", "rating": 2400, "solvedCount": 2120, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Prefix Enlightenment<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are $$$n$$$ lamps on a line, numbered from $$$1$$$ to $$$n$$$. Each one has an initial state off ($$$0$$$) or on ($$$1$$$).<\/p><p>You're given $$$k$$$ subsets $$$A_1, \\ldots, A_k$$$ of $$$\\{1, 2, \\dots, n\\}$$$, such that the intersection of any three subsets is empty. In other words, for all $$$1 \\le i_1  \\lt  i_2  \\lt  i_3 \\le k$$$, $$$A_{i_1} \\cap A_{i_2} \\cap A_{i_3} = \\varnothing$$$.<\/p><p>In one operation, you can choose one of these $$$k$$$ subsets and switch the state of all lamps in it. It is guaranteed that, with the given subsets, it's possible to make all lamps be simultaneously on using this type of operation.<\/p><p>Let $$$m_i$$$ be the minimum number of operations you have to do in order to make the $$$i$$$ first lamps be simultaneously on. Note that there is no condition upon the state of other lamps (between $$$i+1$$$ and $$$n$$$), they can be either off or on.<\/p><p>You have to compute $$$m_i$$$ for all $$$1 \\le i \\le n$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le n, k \\le 3 \

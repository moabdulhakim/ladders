 class=\"tex-span\"><i>i<\/i><\/span> at first. It is colorful enough, but we still consider that the colorfulness of each unit is <span class=\"tex-span\">0<\/span> at first.<\/p><p>DZY loves painting, we know. He takes up a paintbrush with color <span class=\"tex-span\"><i>x<\/i><\/span> and uses it to draw a line on the ribbon. In such a case some contiguous units are painted. Imagine that the color of unit <span class=\"tex-span\"><i>i<\/i><\/span> currently is <span class=\"tex-span\"><i>y<\/i><\/span>. When it is painted by this paintbrush, the color of the unit becomes <span class=\"tex-span\"><i>x<\/i><\/span>, and the colorfulness of the unit increases by <span class=\"tex-span\">|<i>x<\/i>\u2009-\u2009<i>y<\/i>|<\/span>.<\/p><p>DZY wants to perform <span class=\"tex-span\"><i>m<\/i><\/span> operations, each operation can be one of the following:<\/p><ol> <li> Paint all the units with numbers between <span class=\"tex-span\"><i>l<\/i><\/span> and <span class=\"tex-span\"><i>r<\/i><\/span> (both inclusive) with color <span class=\"tex-span\"><i>x<\/i><\/span>. <\/li><li> Ask the sum of colorfulness of the units between <span class=\"tex-span\"><i>l<\/i><\/span> and <span class=\"tex-span\"><i>r<\/i><\/span> (both inclusive). <\/li><\/ol><p>Can you help DZY?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two space-separated integers <span class=\"tex-span\"><i>n<\/i>,\u2009<i>m<\/i>\u00a0(1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>m<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>)<\/span>.<\/p><p>Each of the next <span class=\"tex-span\"><i>m<\/i><\/span> lines begins with a integer <span class=\"tex-span\"><i>type<\/i>\u00a0(1\u2009\u2264\u2009<i>type<\/i>\u2009\u2264\u20092)<\/span>, which represents the type of this operation.<\/p><p>If <span class=\"tex-span\"><i>type<\/i>\u2009=\u20091<\/span>, there will be <span class=\"tex-span\">3<\/span> more integers <span class=\"tex-span\"><i>l<\/i>,\u2009<i>r<\/i>,\u2009<i>x<\/i>\u00a0(1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009<i>n<\/i>;\u00a01\u2009\u2264\u2009<i>x<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">8<\/sup>)<\/span> in this line, describing an operation <span class=\"tex-span\">1<\/span>.<\/p><p>If <span class=\"tex-span\"><i>type<\/i>\u2009=\u20092<\/span>, there will be <span class=\"tex-span\">2<\/span> more integers <span class=\"tex-span\"><i>l<\/i>,\u2009<i>r<\/i>\u00a0(1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009<i>n<\/i>)<\/span> in this line, describing an operation <span class=\"tex-span\">2<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each operation <span class=\"tex-span\">2<\/span>, print a line containing the answer \u2014 sum of colorfulness.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 3<br/>1 1 2 4<br/>1 2 3 5<br/>2 1 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>8<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 4<br/>1 1 3 4<br/>2 1 1<br/>2 2 2<br/>2 3 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/>2<br/>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>10 6<br/>1 1 5 3<br/>1 2 7 9<br/>1 10 10 11<br/>1 3 8 12<br/>1 1 10 3<br/>2 1 10<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>129<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample, the color of each unit is initially <span class=\"tex-span\">[1,\u20092,\u20093]<\/span>, and the colorfulness is <span class=\"tex-span\">[0,\u20090,\u20090]<\/span>.<\/p><p>After the first operation, colors become <span class=\"tex-span\">[4,\u20094,\u20093]<\/span>, colorfulness become <span class=\"tex-span\">[3,\u20092,\u20090]<\/span>.<\/p><p>After the second operation, colors become <span class=\"tex-span\">[4,\u20095,\u20095]<\/span>, colorfulness become <span class=\"tex-span\">[3,\u20093,\u20092]<\/span>.<\/p><p>So the answer to the only operation of type <span class=\"tex-span\">2<\/span> is <span class=\"tex-span\">8<\/span>.<\/p><\/div><\/div>"}, {"contestId": 915, "index": "F", "name": "Imbalance Value of a Tree", "rating": 2400, "solvedCount": 3325, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Imbalance Value of a Tree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a tree <span class=\"tex-span\"><i>T<\/i><\/span> consisting of <span class=\"tex-span\"><i>n<\/i><\/span> vertices. A number is written on each vertex; the number written on vertex <span class=\"tex-span\"><i>i<\/i><\/span> is <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. Let's denote the function <span class=\"tex-span\"><i>I<\/i>(<i>x<\/i>,\u2009<i>y<\/i>)<\/span> as the difference between maximum and minimum value of <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> on a simple path connecting vertices <span class=\"tex-span\"><i>x<\/i><\/span> and <span class=\"tex-span\"><i>y<\/i><\/span>.<\/p><p>Your task is to calculate <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/2b2fc7ff51621678325e8c2a1ce966fd46d01a68.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer number <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup><\/span>) \u2014 the number of vertices in the tree.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integer numbers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub><\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">2<\/sub><\/span>, ..., <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup><\/span>) \u2014 the numbers written on the vertices.<\/p><p>Then <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> lines follow. Each line contains two integers <span class=\"tex-span\"><i>x<\/i><\/span> and <span class=\"tex-span\"><i>y<\/i><\/span> denoting an edge connecting vertex <span class=\"tex-span\"><i>x<\/i><\/span> and vertex <span class=\"tex-span\"><i>y<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i>,\u2009<i>y<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\"><i>x<\/i>\u2009\u2260\u2009<i>y<\/i><\/span>). It is guaranteed that these edges denote a tree.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one number equal to <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/2b2fc7ff51621678325e8c2a1ce966fd46d01a68.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>2 2 3 1<br/>1 2<br/>1 3<br/>1 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 484, "index": "D", "name": "Kindergarten", "rating": 2400, "solvedCount": 3134, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Kindergarten<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>In a kindergarten, the children are being divided into groups. The teacher put the children in a line and associated each child with his or her integer charisma value. Each child should go to exactly one group. Each group should be a nonempty segment of consecutive children of a line. A group's <span class=\"tex-font-style-underline\">sociability<\/span> is the maximum difference of charisma of two children in the group (in particular, if the group consists of one child, its sociability equals a zero). <\/p><p>The teacher wants to divide the children into some number of groups in such way that the total <span class=\"tex-font-style-underline\">sociability<\/span> of the groups is maximum. Help him find this value.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integer <span class=\"tex-span\"><i>n<\/i><\/span>\u00a0\u2014 the number of children in the line (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup><\/span>).<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>\u00a0\u2014 the charisma of the <span class=\"tex-span\"><i>i<\/i><\/span>-th child (<span class=\"tex-span\">\u2009-\u200910<sup class=\"upper-index\">9<\/sup>\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the maximum possible total sociability of all groups.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1 2 3 1 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>3 3 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test sample one of the possible variants of an division is following: the first three children form a group with sociability 2, and the two remaining children form a group with sociability 1.<\/p><p>In the second test sample any division leads to the same result, the sociability will be equal to 0 in each group.<\/p><\/div><\/div>"}, {"contestId": 1251, "index": "E2", "name": "Voting (Hard Version)", "rating": 2400, "solvedCount": 3115, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E2. Voting (Hard Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">The only difference between easy and hard versions is constraints.<\/span><\/p><p>Now elections are held in Berland and you want to win them. More precisely, you want everyone to vote for you.<\/p><p>There are $$$n$$$ voters, and two ways to convince each of them to vote for you. The first way to convince the $$$i$$$-th voter is to pay him $$$p_i$$$ coins. The second way is to make $$$m_i$$$ other voters vote for you, and the $$$i$$$-th voter will vote for free.<\/p><p>Moreover, the process of such voting takes place in several steps. For example, if there are five voters with $$$m_1 = 1$$$, $$$m_2 = 2$$$, $$$m_3 = 2$$$, $$$m_4 = 4$$$, $$$m_5 = 5$$$, then you can buy the vote of the fifth voter, and eventually everyone will vote for you. Set of people voting for you will change as follows: $$${5} \\rightarrow {1, 5} \\rightarrow {1, 2, 3, 5} \\rightarrow {1, 2, 3, 4, 5}$$$.<\/p><p>Calculate the minimum number of coins you have to spend so that everyone votes for you.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 2 \\cdot 10^5$$$) \u2014 the number of test cases.<\/p><p>The first line of each test case contains one integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$) \u2014 the number of voters.<\/p><p>The next $$$n$$$ lines contains the description of voters. $$$i$$$-th line contains two integers $$$m_i$$$ and $$$p_i$$$ ($$$1 \\le p_i \\le 10^9, 0 \\le m_i  \\lt  n$$$).<\/p><p>It is guaranteed that the sum of all $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case print one integer \u2014 the minimum number of coins you have to spend so that everyone votes for you.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n3\n1 5\n2 10\n2 8\n7\n0 1\n3 1\n1 1\n6 1\n1 1\n4 1\n4 1\n6\n2 6\n2 3\n2 8\n2 7\n4 4\n5 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n8\n0\n7\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case you have to buy vote of the third voter. Then the set of people voting for you will change as follows: $$${3} \\rightarrow {1, 3} \\rightarrow {1, 2, 3}$$$.<\/p><p>In the second example you don't need to buy votes. The set of people voting for you will change as follows: $$${1} \\rightarrow {1, 3, 5} \\rightarrow {1, 2, 3, 5} \\rightarrow {1, 2, 3, 5, 6, 7} \\rightarrow {1, 2, 3, 4, 5, 6, 7}$$$.<\/p><p>In the third test case you have to buy votes of the second and the fifth voters. Then the set of people voting for you will change as follows: $$${2, 5} \\rightarrow {1, 2, 3, 4, 5} \\rightarrow {1, 2, 3, 4, 5, 6}$$$.<\/p><\/div><\/div>"}, {"contestId": 12, "index": "D", "name": "Ball", "rating": 2400, "solvedCount": 3103, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Ball<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p><span class=\"tex-span\"><i>N<\/i><\/span> ladies attend the ball in the King's palace. Every lady can be described with three values: beauty, intellect and richness. King's Master of Ceremonies knows that ladies are very special creatures. If some lady understands that there is other lady at the ball which is more beautiful, smarter and more rich, she can jump out of the window. He knows values of all ladies and wants to find out how many probable self-murderers will be on the ball. Lets denote beauty of the <span class=\"tex-span\"><i>i<\/i><\/span>-th lady by <span class=\"tex-span\"><i>B<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, her intellect by <span class=\"tex-span\"><i>I<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and her richness by <span class=\"tex-span\"><i>R<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. Then <span class=\"tex-span\"><i>i<\/i><\/span>-th lady is a probable self-murderer if there is some <span class=\"tex-span\"><i>j<\/i><\/span>-th lady that <span class=\"tex-span\"><i>B<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009&lt;\u2009<i>B<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>,\u2009<i>I<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009&lt;\u2009<i>I<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>,\u2009<i>R<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009&lt;\u2009<i>R<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span>. Find the number of probable self-murderers.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer <span class=\"tex-span\"><i>N<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>N<\/i>\u2009\u2264\u2009500000<\/span>). The second line contains <span class=\"tex-span\"><i>N<\/i><\/span> integer numbers <span class=\"tex-span\"><i>B<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, separated by single spaces. The third and the fourth lines contain sequences <span class=\"tex-span\"><i>I<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>R<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> in the same format. It is guaranteed that <span class=\"tex-span\">0\u2009\u2264\u2009<i>B<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>I<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>R<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output the answer to the problem.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>1 4 2<br/>4 3 2<br/>2 5 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1187, "index": "D", "name": "Subarray Sorting", "rating": 2400, "solvedCount": 3096, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Subarray Sorting<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a_1, a_2, \\dots, a_n$$$ and an array $$$b_1, b_2, \\dots, b_n$$$.<\/p><p>For one operation you can sort in non-decreasing order any subarray $$$a[l \\dots r]$$$ of the array $$$a$$$.<\/p><p>For example, if $$$a = [4, 2, 2, 1, 3, 1]$$$ and you choose subbarray $$$a[2 \\dots 5]$$$, then the array turns into $$$[4, 1, 2, 2, 3, 1]$$$. <\/p><p>You are asked to determine whether it is possible to obtain the array $$$b$$$ by applying this operation any number of times (possibly zero) to the array $$$a$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 3 \\cdot 10^5$$$) \u2014 the number of queries.<\/p><p>The first line of each query contains one integer $$$n$$$ ($$$1 \\le n \\le 3 \\cdot 10^5$$$).<\/p><p>The second line of each query contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le n$$$).<\/p><p>The third line of each query contains $$$n$$$ integers $$$b_1, b_2, \\dots, b_n$$$ ($$$1 \\le b_i \\le n$$$).<\/p><p>It is guaranteed that $$$\\sum n \\le 3 \\cdot 10^5$$$ over all queries in a test.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query print <span class=\"tex-font-style-tt\">YES<\/span> (in any letter case) if it is possible to obtain an array $$$b$$$ and <span class=\"tex-font-style-tt\">NO<\/span> (in any letter case) otherwise.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n7\n1 7 1 4 4 5 6\n1 1 4 4 5 7 6\n5\n1 1 3 3 5\n1 1 3 3 5\n2\n1 1\n1 2\n3\n1 2 3\n3 2 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nYES\nNO\nNO\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In first test case the can sort subarray $$$a_1 \\dots a_5$$$, then $$$a$$$ will turn into $$$[1, 1, 4, 4, 7, 5, 6]$$$, and then sort subarray $$$a_5 \\dots a_6$$$.<\/p><\/div><\/div>"}, {"contestId": 2122, "index": "D", "name": "Traffic Lights", "rating": 2400, "solvedCount": 3075, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Traffic Lights<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p> <\/p><p>You are given a simple undirected connected graph of $$$n$$$ vertices and $$$m$$$ edges.<\/p><p>There is a token in vertex $$$1$$$. We consider the initial time to be at $$$0$$$ seconds. After $$$t$$$ seconds, if the token is in vertex $$$u$$$, you must do exactly one of the following:<\/p><ul> <li> wait one second, <\/li><li> move the token through the $$$(t \\bmod \\mathrm{deg}(u) + 1)$$$$$$^{\\text{\u2217}}$$$-th edge of $$$u$$$, which takes one second. <\/li><\/ul><p>The order of edges of a vertex is the order that they appear in the input.<\/p><p>Calculate the minimum time required to move the token from vertex $$$1$$$ to vertex $$$n$$$, and the minimum time spent waiting that can be achieved while minimizing the total time.<\/p><div class=\"statement-footnote\"><p>$$$^{\\text{\u2217}}$$$$$$x \\bmod y$$$ denotes the remainder from dividing $$$x$$$ by $$$y$$$. <\/p><\/div><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 1000$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains two integers $$$n$$$, $$$m$$$ ($$$2 \\leq n \\leq 5000$$$, $$$n - 1 \\leq m \\leq \\frac{n(n - 1)}{2}$$$)\u00a0\u2014 the number of vertices and edges in the graph, respectively.<\/p><p>Then $$$m$$$ lines follow, the $$$i$$$-th line containing two integers $$$u_i$$$ and $$$v_i$$$ ($$$1 \\leq u_i, v_i \\leq n$$$)\u00a0\u2014 the vertices of the $$$i$$$-th edge.<\/p><p>It is guaranteed that the graph is connected and simple.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$5000$$$, and the sum of $$$m$$$ over all test cases does not exceed $$$5\\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single line containing two integers\u00a0\u2014 the minimum total time and the minimum waiting time that minimizes the total time, respectively.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">6 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 4<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4 2\n3 0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, an optimal strategy is to do the following: <\/p><ul> <li> at time $$$0$$$, wait one second, <\/li><li> at time $$$1$$$, move the token from vertex $$$1$$$ to vertex $$$5$$$, <\/li><li> at time $$$2$$$, wait one second, <\/li><li> at time $$$3$$$, move the token from vertex $$$5$$$ to vertex $$$6$$$. <\/li><\/ul><p>In the second test case, an optimal strategy is to do the following: <\/p><ul> <li> at time $$$0$$$, move the token from vertex $$$1$$$ to vertex $$$2$$$, <\/li><li> at time $$$1$$$, move the token from vertex $$$2$$$ to vertex $$$1$$$, <\/li><li> at time $$$2$$$, move the token from vertex $$$1$$$ to vertex $$$4$$$. <\/li><\/ul><\/div><\/div>"}, {"contestId": 959, "index": "F", "name": "Mahmoud and Ehab and yet another xor task", "rating": 2400, "solvedCount": 3010, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Mahmoud and Ehab and yet another xor task<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Ehab has an array <span class=\"tex-span\"><i>a<\/i><\/span> of <span class=\"tex-span\"><i>n<\/i><\/span> integers. He likes the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#XOR\">bitwise-xor operation<\/a> and he likes to bother Mahmoud so he came up with a problem. He gave Mahmoud <span class=\"tex-span\"><i>q<\/i><\/span> queries. In each of them, he gave Mahmoud 2 integers <span class=\"tex-span\"><i>l<\/i><\/span> and <span class=\"tex-span\"><i>x<\/i><\/span>, and asked him to find the number of subsequences of the first <span class=\"tex-span\"><i>l<\/i><\/span> elements of the array such that their bitwise-xor sum is <span class=\"tex-span\"><i>x<\/i><\/span>. Can you help Mahmoud answer the queries?<\/p><p>A subsequence can contain elements that are not neighboring.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>q<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>q<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>)<\/span>, the number of elements in the array and the number of queries.<\/p><p>The next line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub><\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">2<\/sub><\/span>, <span class=\"tex-span\">...<\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> <span class=\"tex-span\">(0\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009&lt;\u20092<sup class=\"upper-index\">20<\/sup>)<\/span>, the elements of the array.<\/p><p>The next <span class=\"tex-span\"><i>q<\/i><\/span> lines, each contains integers <span class=\"tex-span\"><i>l<\/i><\/span> and <span class=\"tex-span\"><i>x<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\">0\u2009\u2264\u2009<i>x<\/i>\u2009&lt;\u20092<sup class=\"upper-index\">20<\/sup>)<\/span>, representing the queries.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query, output its answer modulo <span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097<\/span> in a newline.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 5<br/>0 1 2 3 4<br/>4 3<br/>2 0<br/>3 7<br/>5 7<br/>5 8<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/>2<br/>0<br/>4<br/>0<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 2<br/>1 1 1<br/>3 1<br/>2 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/>2<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The bitwise-xor sum of the empty set is 0 and the bitwise-xor sum of a set containing one element is that element itself.<\/p><\/div><\/div>"}, {"contestId": 1436, "index": "E", "name": "Complicated Computations", "rating": 2400, "solvedCount": 3005, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Complicated Computations<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>In this problem MEX of a certain array is the smallest <span class=\"tex-font-style-bf\">positive<\/span> integer not contained in this array.<\/p><p>Everyone knows this definition, including Lesha. But Lesha loves MEX, so he comes up with a new problem involving MEX every day, including today.<\/p><p>You are given an array $$$a$$$ of length $$$n$$$. Lesha considers all the <span class=\"tex-font-style-bf\">non-empty<\/span> subarrays of the initial array and computes MEX for each of them. Then Lesha computes MEX of the obtained numbers.<\/p><p>An array $$$b$$$ is a subarray of an array $$$a$$$, if $$$b$$$ can be obtained from $$$a$$$ by deletion of several (possible none or all) elements from the beginning and several (possibly none or all) elements from the end. In particular, an array is a subarray of itself.<\/p><p>Lesha understands that the problem is very interesting this time, but he doesn't know how to solve it. Help him and find the MEX of MEXes of all the subarrays!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$1 \\le n \\le 10^5$$$)\u00a0\u2014 the length of the array. <\/p><p>The next line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le n$$$)\u00a0\u2014 the elements of the array.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer\u00a0\u2014 the MEX of MEXes of all subarrays.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n1 3 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n1 4 3 1 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1107, "index": "E", "name": "Vasya and Binary String", "rating": 2400, "solvedCount": 2975, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Vasya and Binary String<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Vasya has a string $$$s$$$ of length $$$n$$$ consisting only of digits <span class=\"tex-font-style-tt\">0<\/span> and <span class=\"tex-font-style-tt\">1<\/span>. Also he has an array $$$a$$$ of length $$$n$$$. <\/p><p>Vasya performs the following operation until the string becomes empty: choose some <span class=\"tex-font-style-bf\">consecutive<\/span> substring of <span class=\"tex-font-style-bf\">equal characters<\/span>, erase it from the string and glue together the remaining parts (any of them can be empty). For example, if he erases substring <span class=\"tex-font-style-tt\">111<\/span> from string <span class=\"tex-font-style-tt\">1<span class=\"tex-font-style-bf\">111<\/span>10<\/span> he will get the string <span class=\"tex-font-style-tt\">110<\/span>. Vasya gets $$$a_x$$$ points for erasing substring of length $$$x$$$.<\/p><p>Vasya wants to maximize his total points, so help him with this! <\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$1 \\le n \\le 100$$$) \u2014 the length of string $$$s$$$.<\/p><p>The second line contains string $$$s$$$, consisting only of digits <span class=\"tex-font-style-tt\">0<\/span> and <span class=\"tex-font-style-tt\">1<\/span>.<\/p><p>The third line contains $$$n$$$ integers $$$a_1, a_2, \\dots a_n$$$ ($$$1 \\le a_i \\le 10^9$$$), where $$$a_i$$$ is the number of points for erasing the substring of length $$$i$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the maximum total points Vasya can get.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7\n1101001\n3 4 9 100 1 2 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n109\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n10101\n3 10 15 15 15\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n23\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example the optimal sequence of erasings is: <span class=\"tex-font-style-tt\">11<span class=\"tex-font-style-bf\">0<\/span>1001<\/span> $$$\\rightarrow$$$ <span class=\"tex-font-style-tt\">1110<span class=\"tex-font-style-bf\">0<\/span>1<\/span> $$$\\rightarrow$$$ <span class=\"tex-font-style-tt\">111<span class=\"tex-font-style-bf\">0<\/span>1<\/span> $$$\\rightarrow$$$ <span class=\"tex-font-style-tt\"><span class=\"tex-font-style-bf\">1111<\/span><\/span> $$$\\rightarrow$$$ $$$\\varnothing$$$.<\/p><p>In the second example the optimal sequence of erasings is: <span class=\"tex-font-style-tt\">10<span class=\"tex-font-style-bf\">1<\/span>01<\/span> $$$\\rightarrow$$$ <span class=\"tex-font-style-tt\">1<span class=\"tex-font-style-bf\">00<\/span>1<\/span> $$$\\rightarrow$$$ <span class=\"tex-font-style-tt\"><span class=\"tex-font-style-bf\">11<\/span><\/span> $$$\\rightarrow$$$ $$$\\varnothing$$$.<\/p><\/div><\/div>"}, {"contestId": 1202, "index": "E", "name": "You Are Given Some Strings...", "rating": 2400, "solvedCount": 2954, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. You Are Given Some Strings...<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a string $$$t$$$ and $$$n$$$ strings $$$s_1, s_2, \\dots, s_n$$$. All strings consist of lowercase Latin letters.<\/p><p>Let $$$f(t, s)$$$ be the number of occurences of string $$$s$$$ in string $$$t$$$. For example, $$$f('\\text{aaabacaa}', '\\text{aa}') = 3$$$, and $$$f('\\text{ababa}', '\\text{aba}') = 2$$$.<\/p><p>Calculate the value of $$$\\sum\\limits_{i=1}^{n} \\sum\\limits_{j=1}^{n} f(t, s_i + s_j)$$$, where $$$s + t$$$ is the concatenation of strings $$$s$$$ and $$$t$$$. Note that if there are two pairs $$$i_1$$$, $$$j_1$$$ and $$$i_2$$$, $$$j_2$$$ such that $$$s_{i_1} + s_{j_1} = s_{i_2} + s_{j_2}$$$, you should include both $$$f(t, s_{i_1} + s_{j_1})$$$ and $$$f(t, s_{i_2} + s_{j_2})$$$ in answer.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains string $$$t$$$ ($$$1 \\le |t| \\le 2 \\cdot 10^5$$$).<\/p><p>The second line contains integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$).<\/p><p>Each of next $$$n$$$ lines contains string $$$s_i$$$ ($$$1 \\le |s_i| \\le 2 \\cdot 10^5$$$).<\/p><p>It is guaranteed that $$$\\sum\\limits_{i=1}^{n} |s_i| \\le 2 \\cdot 10^5$$$. All strings consist of lowercase English letters.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the value of $$$\\sum\\limits_{i=1}^{n} \\sum\\limits_{j=1}^{n} f(t, s_i + s_j)$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\naaabacaa\n2\na\naa\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\naaabacaa\n4\na\na\na\nb\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n33\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1082, "index": "G", "name": "Petya and Graph", "rating": 2400, "solvedCount": 2879, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. Petya and Graph<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Petya has a simple graph (that is, a graph without loops or multiple edges) consisting of $$$n$$$ vertices and $$$m$$$ edges.<\/p><p>The weight of the $$$i$$$-th vertex is $$$a_i$$$.<\/p><p>The weight of the $$$i$$$-th edge is $$$w_i$$$.<\/p><p>A subgraph of a graph is some set of the graph vertices and some set of the graph edges. The set of edges must meet the condition: both ends of each edge from the set must belong to the chosen set of vertices. <\/p><p>The weight of a subgraph is the sum of the weights of its edges, minus the sum of the weights of its vertices. You need to find the maximum weight of subgraph of given graph. <span class=\"tex-font-style-bf\">The given graph does not contain loops and multiple edges<\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two numbers $$$n$$$ and $$$m$$$ ($$$1 \\le n \\le 10^3, 0 \\le m \\le 10^3$$$) - the number of vertices and edges in the graph, respectively.<\/p><p>The next line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$) - the weights of the vertices of the graph.<\/p><p>The following $$$m$$$ lines contain edges: the $$$i$$$-e edge is defined by a triple of integers $$$v_i, u_i, w_i$$$ ($$$1 \\le v_i, u_i \\le n, 1 \\le w_i \\le 10^9, v_i \\neq u_i$$$). This triple means that between the vertices $$$v_i$$$ and $$$u_i$$$ there is an edge of weight $$$w_i$$$. It is guaranteed that the graph does not contain loops and multiple edges.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the maximum weight of the subgraph of the given graph.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 5\n1 5 2 2\n1 3 4\n1 4 4\n3 4 5\n3 2 2\n4 2 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n8\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 3\n9 7 8\n1 2 1\n2 3 2\n1 3 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test example, the optimal subgraph consists of the vertices $$${1, 3, 4}$$$ and has weight $$$4 + 4 + 5 - (1 + 2 + 2) = 8$$$. In the second test case, the optimal subgraph is empty.<\/p><\/div><\/div>"}, {"contestId": 24, "index": "D", "name": "Broken robot", "rating": 2400, "solvedCount": 2862, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Broken robot<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>You received as a gift a very clever robot walking on a rectangular board. Unfortunately, you understood that it is broken and behaves rather strangely (randomly). The board consists of <span class=\"tex-span\"><i>N<\/i><\/span> rows and <span class=\"tex-span\"><i>M<\/i><\/span> columns of cells. The robot is initially at some cell on the <span class=\"tex-span\"><i>i<\/i><\/span>-th row and the <span class=\"tex-span\"><i>j<\/i><\/span>-th column. Then at every step the robot could go to some another cell. The aim is to go to the bottommost (<span class=\"tex-span\"><i>N<\/i><\/span>-th) row. The robot can stay at it's current cell, move to the left, move to the right, or move to the cell below the current. If the robot is in the leftmost column it cannot move to the left, and if it is in the rightmost column it cannot move to the right. At every step all possible moves are equally probable. Return the expected number of step to reach the bottommost row.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>On the first line you will be given two space separated integers <span class=\"tex-span\"><i>N<\/i><\/span> and <span class=\"tex-span\"><i>M<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>N<\/i>,\u2009<i>M<\/i>\u2009\u2264\u20091000<\/span>). On the second line you will be given another two space separated integers <span class=\"tex-span\"><i>i<\/i><\/span> and <span class=\"tex-span\"><i>j<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>N<\/i>,\u20091\u2009\u2264\u2009<i>j<\/i>\u2009\u2264\u2009<i>M<\/i><\/span>) \u2014 the number of the initial row and the number of the initial column. Note that, <span class=\"tex-span\">(1,\u20091)<\/span> is the upper left corner of the board and <span class=\"tex-span\">(<i>N<\/i>,\u2009<i>M<\/i>)<\/span> is the bottom right corner.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output the expected number of steps on a line of itself with at least <span class=\"tex-span\">4<\/span> digits after the decimal point.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>10 10<br/>10 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0.0000000000<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>10 14<br/>5 14<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>18.0038068653<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 379, "index": "F", "name": "New Year Tree", "rating": 2400, "solvedCount": 2844, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. New Year Tree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>You are a programmer and you have a New Year Tree (not the traditional fur tree, though) \u2014 a tree of four vertices: one vertex of degree three (has number 1), connected with three leaves (their numbers are from 2 to 4).<\/p><p>On the New Year, programmers usually have fun. You decided to have fun as well by adding vertices to the tree. One adding operation looks as follows:<\/p><ul> <li> First we choose some leaf of the tree with number <span class=\"tex-span\"><i>v<\/i><\/span>. <\/li><li> Let's mark the number of vertices on the tree at this moment by variable <span class=\"tex-span\"><i>n<\/i><\/span>, then two vertexes are added to the tree, their numbers are <span class=\"tex-span\"><i>n<\/i>\u2009+\u20091<\/span> and <span class=\"tex-span\"><i>n<\/i>\u2009+\u20092<\/span>, also you get new edges, one between vertices <span class=\"tex-span\"><i>v<\/i><\/span> and <span class=\"tex-span\"><i>n<\/i>\u2009+\u20091<\/span> and one between vertices <span class=\"tex-span\"><i>v<\/i><\/span> and <span class=\"tex-span\"><i>n<\/i>\u2009+\u20092<\/span>. <\/li><\/ul><p>Your task is not just to model the process of adding vertices to the tree, but after each adding operation print the diameter of the current tree. Come on, let's solve the New Year problem!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integer <span class=\"tex-span\"><i>q<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>q<\/i>\u2009\u2264\u20095\u00b710<sup class=\"upper-index\">5<\/sup>)<\/span> \u2014 the number of operations. Each of the next <span class=\"tex-span\"><i>q<\/i><\/span> lines contains integer <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>)<\/span> \u2014 the operation of adding leaves to vertex <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. Variable <span class=\"tex-span\"><i>n<\/i><\/span> represents the number of vertices in the current tree.<\/p><p>It is guaranteed that all given operations are correct.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>q<\/i><\/span> integers \u2014 the diameter of the current tree after each operation.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>2<br/>3<br/>4<br/>8<br/>5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/>4<br/>4<br/>5<br/>6<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1239, "index": "D", "name": "Catowice City", "rating": 2400, "solvedCount": 2795, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Catowice City<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>In the Catowice city next weekend the cat contest will be held. However, the jury members and the contestants haven't been selected yet. There are $$$n$$$ residents and $$$n$$$ cats in the Catowice, and each resident has exactly one cat living in his house. The residents and cats are numbered with integers from $$$1$$$ to $$$n$$$, where the $$$i$$$-th cat is living in the house of $$$i$$$-th resident.<\/p><p>Each Catowice resident is in friendship with several cats, including the one living in his house. In order to conduct a contest, at least one jury member is needed and at least one cat contestant is needed. Of course, every jury member should know none of the contestants. For the contest to be successful, it's also needed that the number of jury members plus the number of contestants is equal to $$$n$$$.<\/p><p>Please help Catowice residents to select the jury and the contestants for the upcoming competition, or determine that it's impossible to do.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$t$$$ ($$$1 \\le t \\le 100\\,000$$$), the number of test cases. Then description of $$$t$$$ test cases follow, where each description is as follows:<\/p><p>The first line contains integers $$$n$$$ and $$$m$$$ ($$$1 \\le n \\le m \\le 10^6$$$), the number of Catowice residents and the number of friendship pairs between residents and cats.<\/p><p>Each of the next $$$m$$$ lines contains integers $$$a_i$$$ and $$$b_i$$$ ($$$1 \\le a_i, b_i \\le n$$$), denoting that $$$a_i$$$-th resident is acquaintances with $$$b_i$$$-th cat. It's guaranteed that each pair of some resident and some cat is listed at most once.<\/p><p>It's guaranteed, that for every $$$i$$$ there exists a pair between $$$i$$$-th resident and $$$i$$$-th cat.<\/p><p>Different test cases are separated with an empty line.<\/p><p>It's guaranteed, that the sum of $$$n$$$ over all test cases is at most $$$10^6$$$ and that the sum of $$$m$$$ over all test cases is at most $$$10^6$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For every test case print:<\/p><ul> <li> \"<span class=\"tex-font-style-tt\">No<\/span>\", if it's impossible to select the jury and contestants. <\/li><li> Otherwise print \"<span class=\"tex-font-style-tt\">Yes<\/span>\".<p>In the second line print two integers $$$j$$$ and $$$p$$$ ($$$1 \\le j$$$, $$$1 \\le p$$$, $$$j + p = n$$$)\u00a0\u2014 the number of jury members and the number of contest participants.<\/p><p>In the third line print $$$j$$$ distinct integers from $$$1$$$ to $$$n$$$, the indices of the residents forming a jury.<\/p><p>In the fourth line print $$$p$$$ distinct integers from $$$1$$$ to $$$n$$$, the indices of the cats, which will participate in the contest.<\/p><p>In case there are several correct answers, print any of them. <\/p><\/li><\/ul><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n3 4\n1 1\n2 2\n3 3\n1 3\n\n3 7\n1 1\n1 2\n1 3\n2 2\n3 1\n3 2\n3 3\n\n1 1\n1 1\n\n2 4\n1 1\n1 2\n2 1\n2 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYes\n2 1\n1 3 \n2 \nYes\n1 2\n2 \n1 3 \nNo\nNo\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, we can select the first and the third resident as a jury. Both of them are not acquaintances with a second cat, so we can select it as a contestant.<\/p><p>In the second test case, we can select the second resident as a jury. He is not an acquaintances with a first and a third cat, so they can be selected as contestants.<\/p><p>In the third test case, the only resident is acquaintances with the only cat, so they can't be in the contest together. So it's not possible to make a contest with at least one jury and at least one cat.<\/p><p>In the fourth test case, each resident is acquaintances with every cat, so it's again not possible to make a contest with at least one jury and at least one cat.<\/p><\/div><\/div>"}, {"contestId": 1837, "index": "F", "name": "Editorial for Two", "rating": 2400, "solvedCount": 2760, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Editorial for Two<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Berland Intercollegiate Contest has just finished. Monocarp and Polycarp, as the jury, are going to conduct an editorial. Unfortunately, the time is limited, since they have to finish before the closing ceremony.<\/p><p>There were $$$n$$$ problems in the contest. The problems are numbered from $$$1$$$ to $$$n$$$. The editorial for the $$$i$$$-th problem takes $$$a_i$$$ minutes. Monocarp and Polycarp are going to conduct an editorial for exactly $$$k$$$ of the problems.<\/p><p>The editorial goes as follows. They have a full problemset of $$$n$$$ problems before them, in order. They remove $$$n - k$$$ problems without changing the order of the remaining $$$k$$$ problems. Then, Monocarp takes some prefix of these $$$k$$$ problems (possibly, an empty one or all problems). Polycarp takes the remaining suffix of them. After that, they go to different rooms and conduct editorials for their problems in parallel. So, the editorial takes as much time as the longer of these two does.<\/p><p>Please, help Monocarp and Polycarp to choose the problems and the split in such a way that the editorial finishes as early as possible. Print the duration of the editorial.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of testcases.<\/p><p>The first line of each testcase contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le k \\le n \\le 3 \\cdot 10^5$$$)\u00a0\u2014 the number of problems in the full problemset and the number of problems Monocarp and Polycarp are going to conduct an editorial for.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$)\u00a0\u2014 the time each editorial takes.<\/p><p>The sum of $$$n$$$ over all testcases doesn't exceed $$$3 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each testcase, print a single integer\u00a0\u2014 the smallest amount of time the editorial takes, if Monocarp and Polycarp can choose which $$$k$$$ of $$$n$$$ problems to conduct an editorial for and how to split them among themselves.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 10 1 1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 20 5 15 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 20 3 15 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">10 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">10 8 20 14 3 8 6 4 16 11<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">10 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">9 9 2 13 15 19 4 9 13 12<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n6\n5\n21\n18\n1\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 710, "index": "F", "name": "String Set Queries", "rating": 2400, "solvedCount": 2747, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. String Set Queries<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>768 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You should process <span class=\"tex-span\"><i>m<\/i><\/span> queries over a set <span class=\"tex-span\"><i>D<\/i><\/span> of strings. Each query is one of three kinds:<\/p><ol> <li> Add a string <span class=\"tex-span\"><i>s<\/i><\/span> to the set <span class=\"tex-span\"><i>D<\/i><\/span>. It is guaranteed that the string <span class=\"tex-span\"><i>s<\/i><\/span> was not added before. <\/li><li> Delete a string <span class=\"tex-span\"><i>s<\/i><\/span> from the set <span class=\"tex-span\"><i>D<\/i><\/span>. It is guaranteed that the string <span class=\"tex-span\"><i>s<\/i><\/span> is in the set <span class=\"tex-span\"><i>D<\/i><\/span>. <\/li><li> For the given string <span class=\"tex-span\"><i>s<\/i><\/span> find the number of occurrences of the strings from the set <span class=\"tex-span\"><i>D<\/i><\/span>. If some string <span class=\"tex-span\"><i>p<\/i><\/span> from <span class=\"tex-span\"><i>D<\/i><\/span> has several occurrences in <span class=\"tex-span\"><i>s<\/i><\/span> you should count all of them. <\/li><\/ol><p>Note that you should solve the problem in <span class=\"tex-font-style-tt\">online<\/span> mode. It means that you can't read the whole input at once. You can read each query only after writing the answer for the last query of the third type. Use functions <span class=\"tex-font-style-tt\">fflush<\/span> in <span class=\"tex-font-style-tt\">C++<\/span> and <span class=\"tex-font-style-tt\">BufferedWriter.flush<\/span> in <span class=\"tex-font-style-tt\">Java<\/span> languages after each writing in your program.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integer <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u20093\u00b710<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the number of queries.<\/p><p>Each of the next <span class=\"tex-span\"><i>m<\/i><\/span> lines contains integer <span class=\"tex-span\"><i>t<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>t<\/i>\u2009\u2264\u20093<\/span>) and nonempty string <span class=\"tex-span\"><i>s<\/i><\/span> \u2014 the kind of the query and the string to process. All strings consist of only lowercase English letters.<\/p><p>The sum of lengths of all strings in the input will not exceed <span class=\"tex-span\">3\u00b710<sup class=\"upper-index\">5<\/sup><\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query of the third kind print the only integer <span class=\"tex-span\"><i>c<\/i><\/span> \u2014 the desired number of occurrences in the string <span class=\"tex-span\"><i>s<\/i><\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1 abc<br/>3 abcabc<br/>2 abc<br/>1 aba<br/>3 abababc<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>10<br/>1 abc<br/>1 bcd<br/>1 abcd<br/>3 abcd<br/>2 abcd<br/>3 abcd<br/>2 bcd<br/>3 abcd<br/>2 abc<br/>3 abcd<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/>2<br/>1<br/>0<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1628, "index": "D2", "name": "Game on Sum (Hard Version)", "rating": 2400, "solvedCount": 2718, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D2. Game on Sum (Hard Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is the hard version of the problem. The difference is the constraints on $$$n$$$, $$$m$$$ and $$$t$$$. You can make hacks only if all versions of the problem are solved.<\/span><\/p><p>Alice and Bob are given the numbers $$$n$$$, $$$m$$$ and $$$k$$$, and play a game as follows:<\/p><p>The game has a score that Alice tries to maximize, and Bob tries to minimize. The score is initially $$$0$$$. The game consists of $$$n$$$ turns. Each turn, Alice picks a <span class=\"tex-font-style-bf\">real<\/span> number from $$$0$$$ to $$$k$$$ (inclusive) which Bob either adds to or subtracts from the score of the game. But throughout the game, Bob has to choose to add at least $$$m$$$ out of the $$$n$$$ turns.<\/p><p>Bob gets to know which number Alice picked before deciding whether to add or subtract the number from the score, and Alice gets to know whether Bob added or subtracted the number for the previous turn before picking the number for the current turn (except on the first turn since there was no previous turn).<\/p><p>If Alice and Bob play optimally, what will the final score of the game be?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^5$$$) \u2014 the number of test cases. The description of test cases follows.<\/p><p>Each test case consists of a single line containing the three integers, $$$n$$$, $$$m$$$, and $$$k$$$ ($$$1 \\le m \\le n \\le 10^6, 0 \\le k  \\lt  10^9 + 7$$$) \u2014 the number of turns, how many of those turns Bob <span class=\"tex-font-style-it\">has to<\/span> add, and the biggest number Alice can choose, respectively.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$10^6$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case output a single <span class=\"tex-font-style-bf\">integer<\/span> number \u2014 the score of the optimal game modulo $$$10^9 + 7$$$.<\/p><p>Formally, let $$$M = 10^9 + 7$$$. It can be shown that the answer can be expressed as an irreducible fraction $$$\\frac{p}{q}$$$, where $$$p$$$ and $$$q$$$ are integers and $$$q \\not \\equiv 0 \\pmod{M}$$$. Output the integer equal to $$$p \\cdot q^{-1} \\bmod M$$$. In other words, output such an integer $$$x$$$ that $$$0 \\le x  \\lt  M$$$ and $$$x \\cdot q \\equiv p \\pmod{M}$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 1 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6 3 10<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 4 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">100 1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">4 4 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">69 4 20<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n5\n375000012\n500000026\n958557139\n0\n49735962\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the entire game has $$$3$$$ turns, and since $$$m = 3$$$, Bob has to add in each of them. Therefore Alice should pick the biggest number she can, which is $$$k = 2$$$, every turn.<\/p><p>In the third test case, Alice has a strategy to guarantee a score of $$$\\frac{75}{8} \\equiv 375000012 \\pmod{10^9 + 7}$$$.<\/p><p>In the fourth test case, Alice has a strategy to guarantee a score of $$$\\frac{45}{2} \\equiv 500000026 \\pmod{10^9 + 7}$$$.<\/p><\/div><\/div>"}, {"contestId": 1392, "index": "F", "name": "Omkar and Landslide", "rating": 2400, "solvedCount": 2707, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Omkar and Landslide<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Omkar is standing at the foot of Celeste mountain. The summit is $$$n$$$ meters away from him, and he can see all of the mountains up to the summit, so for all $$$1 \\leq j \\leq n$$$ he knows that the height of the mountain at the point $$$j$$$ meters away from himself is $$$h_j$$$ meters. It turns out that for all $$$j$$$ satisfying $$$1 \\leq j \\leq n - 1$$$, $$$h_j  \\lt  h_{j + 1}$$$ (meaning that heights are strictly increasing).<\/p><p>Suddenly, a landslide occurs! While the landslide is occurring, the following occurs: every minute, if $$$h_j + 2 \\leq h_{j + 1}$$$, then one square meter of dirt will slide from position $$$j + 1$$$ to position $$$j$$$, so that $$$h_{j + 1}$$$ is decreased by $$$1$$$ and $$$h_j$$$ is increased by $$$1$$$. These changes occur simultaneously, so for example, if $$$h_j + 2 \\leq h_{j + 1}$$$ and $$$h_{j + 1} + 2 \\leq h_{j + 2}$$$ for some $$$j$$$, then $$$h_j$$$ will be increased by $$$1$$$, $$$h_{j + 2}$$$ will be decreased by $$$1$$$, and $$$h_{j + 1}$$$ will be both increased and decreased by $$$1$$$, meaning that in effect $$$h_{j + 1}$$$ is unchanged during that minute.<\/p><p>The landslide ends when there is no $$$j$$$ such that $$$h_j + 2 \\leq h_{j + 1}$$$. Help Omkar figure out what the values of $$$h_1, \\dots, h_n$$$ will be after the landslide ends. It can be proven that under the given constraints, the landslide will always end in finitely many minutes.<\/p><p>Note that because of the large amount of input, it is recommended that your code uses fast IO.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$1 \\leq n \\leq 10^6$$$). <\/p><p>The second line contains $$$n$$$ integers $$$h_1, h_2, \\dots, h_n$$$ satisfying $$$0 \\leq h_1  \\lt  h_2  \\lt  \\dots  \\lt  h_n \\leq 10^{12}$$$\u00a0\u2014 the heights.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output $$$n$$$ integers, where the $$$j$$$-th integer is the value of $$$h_j$$$ after the landslide has stopped.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n2 6 7 8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5 5 6 7\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Initially, the mountain has heights $$$2, 6, 7, 8$$$.<\/p><p>In the first minute, we have $$$2 + 2 \\leq 6$$$, so $$$2$$$ increases to $$$3$$$ and $$$6$$$ decreases to $$$5$$$, leaving $$$3, 5, 7, 8$$$.<\/p><p>In the second minute, we have $$$3 + 2 \\leq 5$$$ and $$$5 + 2 \\leq 7$$$, so $$$3$$$ increases to $$$4$$$, $$$5$$$ is unchanged, and $$$7$$$ decreases to $$$6$$$, leaving $$$4, 5, 6, 8$$$.<\/p><p>In the third minute, we have $$$6 + 2 \\leq 8$$$, so $$$6$$$ increases to $$$7$$$ and $$$8$$$ decreases to $$$7$$$, leaving $$$4, 5, 7, 7$$$.<\/p><p>In the fourth minute, we have $$$5 + 2 \\leq 7$$$, so $$$5$$$ increases to $$$6$$$ and $$$7$$$ decreases to $$$6$$$, leaving $$$4, 6, 6, 7$$$.<\/p><p>In the fifth minute, we have $$$4 + 2 \\leq 6$$$, so $$$4$$$ increases to $$$5$$$ and $$$6$$$ decreases to $$$5$$$, leaving $$$5, 5, 6, 7$$$.<\/p><p>In the sixth minute, nothing else can change so the landslide stops and our answer is $$$5, 5, 6, 7$$$.<\/p><\/div><\/div>"}, {"contestId": 1401, "index": "E", "name": "Divide Square", "rating": 2400, "solvedCount": 2695, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Divide Square<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>384 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There is a square of size $$$10^6 \\times 10^6$$$ on the coordinate plane with four points $$$(0, 0)$$$, $$$(0, 10^6)$$$, $$$(10^6, 0)$$$, and $$$(10^6, 10^6)$$$ as its vertices.<\/p><p>You are going to draw segments on the plane. All segments are either horizontal or vertical and <span class=\"tex-font-style-it\">intersect with at least one side of the square<\/span>.<\/p><p>Now you are wondering how many pieces this square divides into after drawing all segments. Write a program calculating the number of pieces of the square.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$m$$$ ($$$0 \\le n, m \\le 10^5$$$)\u00a0\u2014 the number of horizontal segments and the number of vertical segments.<\/p><p>The next $$$n$$$ lines contain descriptions of the horizontal segments. The $$$i$$$-th line contains three integers $$$y_i$$$, $$$lx_i$$$ and $$$rx_i$$$ ($$$0  \\lt  y_i  \\lt  10^6$$$; $$$0 \\le lx_i  \\lt  rx_i \\le 10^6$$$), which means the segment connects $$$(lx_i, y_i)$$$ and $$$(rx_i, y_i)$$$.<\/p><p>The next $$$m$$$ lines contain descriptions of the vertical segments. The $$$i$$$-th line contains three integers $$$x_i$$$, $$$ly_i$$$ and $$$ry_i$$$ ($$$0  \\lt  x_i  \\lt  10^6$$$; $$$0 \\le ly_i  \\lt  ry_i \\le 10^6$$$), which means the segment connects $$$(x_i, ly_i)$$$ and $$$(x_i, ry_i)$$$.<\/p><p>It's guaranteed that <span class=\"tex-font-style-bf\">there are no two segments on the same line<\/span>, and each segment intersects with at least one of square's sides.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the number of pieces the square is divided into after drawing all the segments.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 3\n2 3 1000000\n4 0 4\n3 0 1000000\n4 0 1\n2 0 5\n3 1 1000000\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n7<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p> The sample is like this:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/07f840fba360ed58fd5834765cfd1eaf80ef761d.png\" style=\"zoom: 100.0%;max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 1428, "index": "F", "name": "Fruit Sequences", "rating": 2400, "solvedCount": 2666, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Fruit Sequences<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Zookeeper is buying a carton of fruit to feed his pet wabbit. The fruits are a sequence of apples and oranges, which is represented by a binary string $$$s_1s_2\\ldots s_n$$$ of length $$$n$$$. $$$1$$$ represents an apple and $$$0$$$ represents an orange.<\/p><p>Since wabbit is allergic to eating oranges, Zookeeper would like to find the longest <span class=\"tex-font-style-bf\">contiguous<\/span> sequence of apples. Let $$$f(l,r)$$$ be the longest <span class=\"tex-font-style-bf\">contiguous<\/span> sequence of apples in the substring $$$s_{l}s_{l+1}\\ldots s_{r}$$$. <\/p><p>Help Zookeeper find $$$\\sum_{l=1}^{n} \\sum_{r=l}^{n} f(l,r)$$$, or the sum of $$$f$$$ across all substrings.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ $$$(1 \\leq n \\leq 5 \\cdot 10^5)$$$.<\/p><p> The next line contains a binary string $$$s$$$ of length $$$n$$$ $$$(s_i \\in \\{0,1\\})$$$ <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer: $$$\\sum_{l=1}^{n} \\sum_{r=l}^{n} f(l,r)$$$. <\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n0110\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n12\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7\n1101001\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n30\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n12\n011100011100\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n156\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test, there are ten substrings. The list of them (we let $$$[l,r]$$$ be the substring $$$s_l s_{l+1} \\ldots s_r$$$):<\/p><ul> <li> $$$[1,1]$$$: 0 <\/li><li> $$$[1,2]$$$: 01 <\/li><li> $$$[1,3]$$$: 011 <\/li><li> $$$[1,4]$$$: 0110 <\/li><li> $$$[2,2]$$$: 1 <\/li><li> $$$[2,3]$$$: 11 <\/li><li> $$$[2,4]$$$: 110 <\/li><li> $$$[3,3]$$$: 1 <\/li><li> $$$[3,4]$$$: 10 <\/li><li> $$$[4,4]$$$: 0 <\/li><\/ul><p>The lengths of the longest contiguous sequence of ones in each of these ten substrings are $$$0,1,2,2,1,2,2,1,1,0$$$ respectively. Hence, the answer is $$$0+1+2+2+1+2+2+1+1+0 = 12$$$.<\/p><\/div><\/div>"}, {"contestId": 5, "index": "E", "name": "Bindian Signalizing", "rating": 2400, "solvedCount": 2631, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Bindian Signalizing<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Everyone knows that long ago on the territory of present-day Berland there lived Bindian tribes. Their capital was surrounded by <span class=\"tex-span\"><i>n<\/i><\/span> hills, forming a circle. On each hill there was a watchman, who watched the neighbourhood day and night.<\/p><p>In case of any danger the watchman could make a fire on the hill. One watchman could see the signal of another watchman, if on the circle arc connecting the two hills there was no hill higher than any of the two. As for any two hills there are two different circle arcs connecting them, the signal was seen if the above mentioned condition was satisfied on at least one of the arcs. For example, for any two neighbouring watchmen it is true that the signal of one will be seen by the other.<\/p><p>An important characteristics of this watch system was the amount of pairs of watchmen able to see each other's signals. You are to find this amount by the given heights of the hills.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input data contains an integer number <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">3\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup><\/span>), <span class=\"tex-span\"><i>n<\/i><\/span> \u2014 the amount of hills around the capital. The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> numbers \u2014 heights of the hills in clockwise order. All height numbers are integer and lie between 1 and <span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup><\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the required amount of pairs.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1 2 4 5 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>7<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 506, "index": "D", "name": "Mr. Kitayuta's Colorful Graph", "rating": 2400, "solvedCount": 2624, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Mr. Kitayuta's Colorful Graph<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Mr. Kitayuta has just bought an undirected graph with <span class=\"tex-span\"><i>n<\/i><\/span> vertices and <span class=\"tex-span\"><i>m<\/i><\/span> e

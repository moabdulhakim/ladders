<script>
    const PROBLEMS = [{"contestId": 342, "index": "E", "name": "Xenia and Tree", "rating": 2400, "solvedCount": 11549, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Xenia and Tree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Xenia the programmer has a tree consisting of <span class=\"tex-span\"><i>n<\/i><\/span> nodes. We will consider the tree nodes indexed from 1 to <span class=\"tex-span\"><i>n<\/i><\/span>. We will also consider the first node to be initially painted red, and the other nodes \u2014 to be painted blue.<\/p><p>The <span class=\"tex-font-style-it\">distance<\/span> between two tree nodes <span class=\"tex-span\"><i>v<\/i><\/span> and <span class=\"tex-span\"><i>u<\/i><\/span> is the number of edges in the shortest path between <span class=\"tex-span\"><i>v<\/i><\/span> and <span class=\"tex-span\"><i>u<\/i><\/span>.<\/p><p>Xenia needs to learn how to quickly execute queries of two types:<\/p><ol> <li> paint a specified blue node in red; <\/li><li> calculate which red node is the closest to the given one and print the shortest distance to the closest red node. <\/li><\/ol><p>Your task is to write a program which will execute the described queries.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> <span class=\"tex-span\">(2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>,\u20091\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>)<\/span> \u2014 the number of nodes in the tree and the number of queries. Next <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> lines contain the tree edges, the <span class=\"tex-span\"><i>i<\/i><\/span>-th line contains a pair of integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>,\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2260\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>)<\/span> \u2014 an edge of the tree.<\/p><p>Next <span class=\"tex-span\"><i>m<\/i><\/span> lines contain queries. Each query is specified as a pair of integers <span class=\"tex-span\"><i>t<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>t<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u20092,\u20091\u2009\u2264\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>)<\/span>. If <span class=\"tex-span\"><i>t<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009=\u20091<\/span>, then as a reply to the query we need to paint a blue node <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> in red. If <span class=\"tex-span\"><i>t<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009=\u20092<\/span>, then we should reply to the query by printing the shortest distance from some red node to node <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>.<\/p><p>It is guaranteed that the given graph is a tree and that all queries are correct.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each second type query print the reply in a single line.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 4<br/>1 2<br/>2 3<br/>2 4<br/>4 5<br/>2 1<br/>2 5<br/>1 2<br/>2 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/>3<br/>2<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 375, "index": "D", "name": "Tree and Queries", "rating": 2400, "solvedCount": 9614, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Tree and Queries<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>You have a rooted tree consisting of <span class=\"tex-span\"><i>n<\/i><\/span> vertices. Each vertex of the tree has some color. We will assume that the tree vertices are numbered by integers from 1 to <span class=\"tex-span\"><i>n<\/i><\/span>. Then we represent the color of vertex <span class=\"tex-span\"><i>v<\/i><\/span> as <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\"><i>v<\/i><\/sub><\/span>. The tree root is a vertex with number 1.<\/p><p>In this problem you need to answer to <span class=\"tex-span\"><i>m<\/i><\/span> queries. Each query is described by two integers <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>,\u2009<i>k<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span>. The answer to query <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>,\u2009<i>k<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span> is the number of such colors of vertices <span class=\"tex-span\"><i>x<\/i><\/span>, that the subtree of vertex <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span> contains at least <span class=\"tex-span\"><i>k<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span> vertices of color <span class=\"tex-span\"><i>x<\/i><\/span>.<\/p><p>You can find the definition of a rooted tree by the following link: <span class=\"tex-font-style-tt\">http://en.wikipedia.org/wiki/Tree_(graph_theory)<\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> <span class=\"tex-span\">(2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>;\u00a01\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>)<\/span>. The next line contains a sequence of integers <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>c<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>)<\/span>. The next <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> lines contain the edges of the tree. The <span class=\"tex-span\"><i>i<\/i><\/span>-th line contains the numbers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>;\u00a0<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2260\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>)<\/span> \u2014 the vertices connected by an edge of the tree.<\/p><p>Next <span class=\"tex-span\"><i>m<\/i><\/span> lines contain the queries. The <span class=\"tex-span\"><i>j<\/i><\/span>-th line contains two integers <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>,\u2009<i>k<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>v<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>;\u00a01\u2009\u2264\u2009<i>k<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>)<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>m<\/i><\/span> integers \u2014 the answers to the queries in the order the queries appear in the input.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>8 5<br/>1 2 2 3 3 2 3 3<br/>1 2<br/>1 5<br/>2 3<br/>2 4<br/>5 6<br/>5 7<br/>5 8<br/>1 2<br/>1 3<br/>1 4<br/>2 3<br/>5 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/>2<br/>1<br/>0<br/>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 1<br/>1 2 3 4<br/>1 2<br/>2 3<br/>3 4<br/>1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>A subtree of vertex <span class=\"tex-span\"><i>v<\/i><\/span> in a rooted tree with root <span class=\"tex-span\"><i>r<\/i><\/span> is a set of vertices <span class=\"tex-span\">{<i>u<\/i>\u00a0:\u2009<i>dist<\/i>(<i>r<\/i>,\u2009<i>v<\/i>)\u2009+\u2009<i>dist<\/i>(<i>v<\/i>,\u2009<i>u<\/i>)\u2009=\u2009<i>dist<\/i>(<i>r<\/i>,\u2009<i>u<\/i>)}<\/span>. Where <span class=\"tex-span\"><i>dist<\/i>(<i>x<\/i>,\u2009<i>y<\/i>)<\/span> is the length (in edges) of the shortest path between vertices <span class=\"tex-span\"><i>x<\/i><\/span> and <span class=\"tex-span\"><i>y<\/i><\/span>.<\/p><\/div><\/div>"}, {"contestId": 865, "index": "D", "name": "Buy Low Sell High", "rating": 2400, "solvedCount": 8833, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Buy Low Sell High<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You can perfectly predict the price of a certain stock for the next <span class=\"tex-span\"><i>N<\/i><\/span> days. You would like to profit on this knowledge, but only want to transact one share of stock per day. That is, each day you will either buy one share, sell one share, or do nothing. Initially you own zero shares, and you cannot sell shares when you don't own any. At the end of the <span class=\"tex-span\"><i>N<\/i><\/span> days you would like to again own zero shares, but want to have as much money as possible.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Input begins with an integer <span class=\"tex-span\"><i>N<\/i><\/span> <span class=\"tex-span\">(2\u2009\u2264\u2009<i>N<\/i>\u2009\u2264\u20093\u00b710<sup class=\"upper-index\">5<\/sup>)<\/span>, the number of days.<\/p><p>Following this is a line with exactly <span class=\"tex-span\"><i>N<\/i><\/span> integers <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>p<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>p<\/i><sub class=\"lower-index\"><i>N<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup>)<\/span>. The price of one share of stock on the <span class=\"tex-span\"><i>i<\/i><\/span>-th day is given by <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the maximum amount of money you can end up with at the end of <span class=\"tex-span\"><i>N<\/i><\/span> days.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>9<br/>10 5 4 7 9 12 6 2 10<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>20<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>20<br/>3 1 4 1 5 9 2 6 5 3 5 8 9 7 9 3 2 3 8 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>41<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, buy a share at <span class=\"tex-span\">5<\/span>, buy another at <span class=\"tex-span\">4<\/span>, sell one at <span class=\"tex-span\">9<\/span> and another at <span class=\"tex-span\">12<\/span>. Then buy at <span class=\"tex-span\">2<\/span> and sell at <span class=\"tex-span\">10<\/span>. The total profit is <span class=\"tex-span\">\u2009-\u20095\u2009-\u20094\u2009+\u20099\u2009+\u200912\u2009-\u20092\u2009+\u200910\u2009=\u200920<\/span>.<\/p><\/div><\/div>"}, {"contestId": 449, "index": "D", "name": "Jzzhu and Numbers", "rating": 2400, "solvedCount": 6628, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Jzzhu and Numbers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Jzzhu have <span class=\"tex-span\"><i>n<\/i><\/span> non-negative integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span>. We will call a sequence of indexes <span class=\"tex-span\"><i>i<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>i<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>i<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>i<\/i><sub class=\"lower-index\">1<\/sub>\u2009&lt;\u2009<i>i<\/i><sub class=\"lower-index\">2<\/sub>\u2009&lt;\u2009...\u2009&lt;\u2009<i>i<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>)<\/span> a group of size <span class=\"tex-span\"><i>k<\/i><\/span>. <\/p><p>Jzzhu wonders, how many groups exists such that <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><sub class=\"lower-index\">1<\/sub><\/sub><\/span> &amp; <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><sub class=\"lower-index\">2<\/sub><\/sub><\/span> &amp; ... &amp; <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/sub>\u2009=\u20090<\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u2009<i>n<\/i>)<\/span>? Help him and print this number modulo <span class=\"tex-span\">1000000007<\/span> <span class=\"tex-span\">(10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097)<\/span>. Operation <span class=\"tex-span\"><i>x<\/i><\/span> &amp; <span class=\"tex-span\"><i>y<\/i><\/span> denotes bitwise AND operation of two numbers.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer <span class=\"tex-span\"><i>n<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup>)<\/span>. The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> <span class=\"tex-span\">(0\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup>)<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output a single integer representing the number of required groups modulo <span class=\"tex-span\">1000000007<\/span> <span class=\"tex-span\">(10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097)<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>2 3 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>0 1 2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>10<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>6<br/>5 2 0 5 2 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>53<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1083, "index": "E", "name": "The Fair Nut and Rectangles", "rating": 2400, "solvedCount": 6038, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. The Fair Nut and Rectangles<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>The Fair Nut got stacked in planar world. He should solve this task to get out.<\/p><p>You are given $$$n$$$ rectangles with vertexes in $$$(0, 0)$$$, $$$(x_i, 0)$$$, $$$(x_i, y_i)$$$, $$$(0, y_i)$$$. For each rectangle, you are also given a number $$$a_i$$$. Choose some of them that the area of union minus sum of $$$a_i$$$ of the chosen ones is maximum.<\/p><p>It is guaranteed that there are no nested rectangles.<\/p><p>Nut has no idea how to find the answer, so he asked for your help.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$1 \\leq n \\leq 10^6$$$)\u00a0\u2014 the number of rectangles.<\/p><p>Each of the next $$$n$$$ lines contains three integers $$$x_i$$$, $$$y_i$$$ and $$$a_i$$$ ($$$1 \\leq x_i, y_i \\leq 10^9$$$, $$$0 \\leq a_i \\leq x_i \\cdot y_i$$$).<\/p><p>It is guaranteed that there are no nested rectangles.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In a single line print the answer to the problem\u00a0\u2014 the maximum value which you can achieve.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n4 4 8\n1 5 0\n5 2 10\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n9<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n6 2 4\n1 6 2\n2 4 3\n5 3 8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n10<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, the right answer can be achieved by choosing the first and the second rectangles.<\/p><p>In the second example, the right answer can also be achieved by choosing the first and the second rectangles.<\/p><\/div><\/div>"}, {"contestId": 1000, "index": "F", "name": "One Occurrence", "rating": 2400, "solvedCount": 5195, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. One Occurrence<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>768 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ consisting of $$$n$$$ integers, and $$$q$$$ queries to it. $$$i$$$-th query is denoted by two integers $$$l_i$$$ and $$$r_i$$$. For each query, you have to find <span class=\"tex-font-style-bf\">any<\/span> integer that occurs <span class=\"tex-font-style-bf\">exactly once<\/span> in the subarray of $$$a$$$ from index $$$l_i$$$ to index $$$r_i$$$ (a subarray is a contiguous subsegment of an array). For example, if $$$a = [1, 1, 2, 3, 2, 4]$$$, then for query $$$(l_i = 2, r_i = 6)$$$ the subarray we are interested in is $$$[1, 2, 3, 2, 4]$$$, and possible answers are $$$1$$$, $$$3$$$ and $$$4$$$; for query $$$(l_i = 1, r_i = 2)$$$ the subarray we are interested in is $$$[1, 1]$$$, and there is no such element that occurs exactly once.<\/p><p>Can you answer all of the queries?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$1 \\le n \\le 5 \\cdot 10^5$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 5 \\cdot 10^5$$$).<\/p><p>The third line contains one integer $$$q$$$ ($$$1 \\le q \\le 5 \\cdot 10^5$$$).<\/p><p>Then $$$q$$$ lines follow, $$$i$$$-th line containing two integers $$$l_i$$$ and $$$r_i$$$ representing $$$i$$$-th query ($$$1 \\le l_i \\le r_i \\le n$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Answer the queries as follows:<\/p><p>If there is no integer such that it occurs in the subarray from index $$$l_i$$$ to index $$$r_i$$$ exactly once, print $$$0$$$. Otherwise print any such integer.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>6<br/>1 1 2 3 2 4<br/>2<br/>2 6<br/>1 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/>0<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1473, "index": "E", "name": "Minimum Path", "rating": 2400, "solvedCount": 5121, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Minimum Path<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a weighted undirected connected graph consisting of $$$n$$$ vertices and $$$m$$$ edges. It is guaranteed that there are no self-loops or multiple edges in the given graph.<\/p><p>Let's define the weight of the path consisting of $$$k$$$ edges with indices $$$e_1, e_2, \\dots, e_k$$$ as $$$\\sum\\limits_{i=1}^{k}{w_{e_i}} - \\max\\limits_{i=1}^{k}{w_{e_i}} + \\min\\limits_{i=1}^{k}{w_{e_i}}$$$, where $$$w_i$$$ \u2014 weight of the $$$i$$$-th edge in the graph.<\/p><p>Your task is to find the minimum weight of the path from the $$$1$$$-st vertex to the $$$i$$$-th vertex for each $$$i$$$ ($$$2 \\le i \\le n$$$).<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$m$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$; $$$1 \\le m \\le 2 \\cdot 10^5$$$) \u2014 the number of vertices and the number of edges in the graph.<\/p><p>Following $$$m$$$ lines contains three integers $$$v_i, u_i, w_i$$$ ($$$1 \\le v_i, u_i \\le n$$$; $$$1 \\le w_i \\le 10^9$$$; $$$v_i \\neq u_i$$$) \u2014 endpoints of the $$$i$$$-th edge and its weight respectively.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$n-1$$$ integers \u2014 the minimum weight of the path from $$$1$$$-st vertex to the $$$i$$$-th vertex for each $$$i$$$ ($$$2 \\le i \\le n$$$).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 4\n5 3 4\n2 1 1\n3 2 2\n2 4 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 2 2 4 \n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 8\n3 1 1\n3 6 2\n5 4 2\n4 2 2\n6 1 1\n5 2 1\n3 2 3\n1 5 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2 1 4 3 1 \n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7 10\n7 5 5\n2 3 3\n4 7 1\n5 3 6\n2 7 6\n6 2 6\n3 7 6\n4 2 1\n3 1 4\n1 7 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3 4 2 7 7 3 \n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 246, "index": "E", "name": "Blood Cousins Return", "rating": 2400, "solvedCount": 4873, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Blood Cousins Return<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Polycarpus got hold of a family tree. The found tree describes the family relations of <span class=\"tex-span\"><i>n<\/i><\/span> people, numbered from 1 to <span class=\"tex-span\"><i>n<\/i><\/span>. Every person in this tree has at most one direct ancestor. Also, each person in the tree has a name, the names are not necessarily unique.<\/p><p>We call the man with a number <span class=\"tex-span\"><i>a<\/i><\/span> a 1-ancestor of the man with a number <span class=\"tex-span\"><i>b<\/i><\/span>, if the man with a number <span class=\"tex-span\"><i>a<\/i><\/span> is a direct ancestor of the man with a number <span class=\"tex-span\"><i>b<\/i><\/span>.<\/p><p>We call the man with a number <span class=\"tex-span\"><i>a<\/i><\/span> a <span class=\"tex-span\"><i>k<\/i><\/span>-ancestor <span class=\"tex-span\">(<i>k<\/i>\u2009&gt;\u20091)<\/span> of the man with a number <span class=\"tex-span\"><i>b<\/i><\/span>, if the man with a number <span class=\"tex-span\"><i>b<\/i><\/span> has a 1-ancestor, and the man with a number <span class=\"tex-span\"><i>a<\/i><\/span> is a <span class=\"tex-span\">(<i>k<\/i>\u2009-\u20091)<\/span>-ancestor of the 1-ancestor of the man with a number <span class=\"tex-span\"><i>b<\/i><\/span>.<\/p><p>In the tree the family ties do not form cycles. In other words there isn't a person who is his own direct or indirect ancestor (that is, who is an <span class=\"tex-span\"><i>x<\/i><\/span>-ancestor of himself, for some <span class=\"tex-span\"><i>x<\/i><\/span>, <span class=\"tex-span\"><i>x<\/i>\u2009&gt;\u20090<\/span>).<\/p><p>We call a man with a number <span class=\"tex-span\"><i>a<\/i><\/span> the <span class=\"tex-span\"><i>k<\/i><\/span>-son of the man with a number <span class=\"tex-span\"><i>b<\/i><\/span>, if the man with a number <span class=\"tex-span\"><i>b<\/i><\/span> is a <span class=\"tex-span\"><i>k<\/i><\/span>-ancestor of the man with a number <span class=\"tex-span\"><i>a<\/i><\/span>.<\/p><p>Polycarpus is very much interested in how many sons and which sons each person has. He took a piece of paper and wrote <span class=\"tex-span\"><i>m<\/i><\/span> pairs of numbers <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>k<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. Help him to learn for each pair <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>k<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> the number of distinct names among all names of the <span class=\"tex-span\"><i>k<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>-sons of the man with number <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains a single integer <span class=\"tex-span\"><i>n<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>)<\/span> \u2014 the number of people in the tree. Next <span class=\"tex-span\"><i>n<\/i><\/span> lines contain the description of people in the tree. The <span class=\"tex-span\"><i>i<\/i><\/span>-th line contains space-separated string <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and integer <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\">(0\u2009\u2264\u2009<i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>)<\/span>, where <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is the name of the man with a number <span class=\"tex-span\"><i>i<\/i><\/span>, and <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is either the number of the direct ancestor of the man with a number <span class=\"tex-span\"><i>i<\/i><\/span> or <span class=\"tex-font-style-tt\">0<\/span>, if the man with a number <span class=\"tex-span\"><i>i<\/i><\/span> has no direct ancestor. <\/p><p>The next line contains a single integer <span class=\"tex-span\"><i>m<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>)<\/span> \u2014 the number of Polycarpus's records. Next <span class=\"tex-span\"><i>m<\/i><\/span> lines contain space-separated pairs of integers. The <span class=\"tex-span\"><i>i<\/i><\/span>-th line contains integers <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>k<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>k<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>)<\/span>.<\/p><p>It is guaranteed that the family relationships do not form cycles. The names of all people are non-empty strings, consisting of no more than 20 lowercase English letters.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>m<\/i><\/span> whitespace-separated integers \u2014 the answers to Polycarpus's records. Print the answers to the records in the order, in which the records occur in the input.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>6<br/>pasha 0<br/>gerald 1<br/>gerald 1<br/>valera 2<br/>igor 3<br/>olesya 1<br/>5<br/>1 1<br/>1 2<br/>1 3<br/>3 1<br/>6 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/>2<br/>0<br/>1<br/>0<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>6<br/>valera 0<br/>valera 1<br/>valera 1<br/>gerald 0<br/>valera 4<br/>kolya 4<br/>7<br/>1 1<br/>1 2<br/>2 1<br/>2 2<br/>4 1<br/>5 1<br/>6 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/>0<br/>0<br/>0<br/>2<br/>0<br/>0<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 311, "index": "B", "name": "Cats Transport", "rating": 2400, "solvedCount": 4534, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Cats Transport<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Zxr960115 is owner of a large farm. He feeds <span class=\"tex-span\"><i>m<\/i><\/span> cute cats and employs <span class=\"tex-span\"><i>p<\/i><\/span> feeders. There's a straight road across the farm and <span class=\"tex-span\"><i>n<\/i><\/span> hills along the road, numbered from 1 to <span class=\"tex-span\"><i>n<\/i><\/span> from left to right. The distance between hill <span class=\"tex-span\"><i>i<\/i><\/span> and <span class=\"tex-span\">(<i>i<\/i>\u2009-\u20091)<\/span> is <span class=\"tex-span\"><i>d<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> meters. The feeders live in hill 1.<\/p><p>One day, the cats went out to play. Cat <span class=\"tex-span\"><i>i<\/i><\/span> went on a trip to hill <span class=\"tex-span\"><i>h<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, finished its trip at time <span class=\"tex-span\"><i>t<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, and then waited at hill <span class=\"tex-span\"><i>h<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> for a feeder. The feeders must take all the cats. Each feeder goes straightly from hill 1 to <span class=\"tex-span\"><i>n<\/i><\/span> without waiting at a hill and takes all the <span class=\"tex-font-style-bf\">waiting<\/span> cats at each hill away. Feeders walk at a speed of 1 meter per unit time and are strong enough to take as many cats as they want.<\/p><p>For example, suppose we have two hills <span class=\"tex-span\">(<i>d<\/i><sub class=\"lower-index\">2<\/sub>\u2009=\u20091)<\/span> and one cat that finished its trip at time 3 at hill 2 <span class=\"tex-span\">(<i>h<\/i><sub class=\"lower-index\">1<\/sub>\u2009=\u20092)<\/span>. Then if the feeder leaves hill 1 at time 2 or at time 3, he can take this cat, but if he leaves hill 1 at time 1 he can't take it. If the feeder leaves hill 1 at time 2, the cat waits him for 0 time units, if the feeder leaves hill 1 at time 3, the cat waits him for 1 time units.<\/p><p>Your task is to schedule the time leaving from hill 1 for each feeder so that the sum of the waiting time of all cats is minimized.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains three integers <span class=\"tex-span\"><i>n<\/i>,\u2009<i>m<\/i>,\u2009<i>p<\/i><\/span> <span class=\"tex-span\">(2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>,\u20091\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>,\u20091\u2009\u2264\u2009<i>p<\/i>\u2009\u2264\u2009100)<\/span>.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> positive integers <span class=\"tex-span\"><i>d<\/i><sub class=\"lower-index\">2<\/sub>,\u2009<i>d<\/i><sub class=\"lower-index\">3<\/sub>,\u2009...,\u2009<i>d<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>d<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009&lt;\u200910<sup class=\"upper-index\">4<\/sup>)<\/span>.<\/p><p>Each of the next <span class=\"tex-span\"><i>m<\/i><\/span> lines contains two integers <span class=\"tex-span\"><i>h<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>t<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>h<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>,\u20090\u2009\u2264\u2009<i>t<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup>)<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output an integer, the minimum sum of waiting time of all cats.<\/p><p>Please, do not write the <span class=\"tex-font-style-tt\">%lld<\/span> specifier to read or write 64-bit integers in \u0421++. It is preferred to use the <span class=\"tex-font-style-tt\">cin<\/span>, <span class=\"tex-font-style-tt\">cout<\/span> streams or the <span class=\"tex-font-style-tt\">%I64d<\/span> specifier.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 6 2<br/>1 3 5<br/>1 0<br/>2 1<br/>4 9<br/>1 10<br/>2 10<br/>3 12<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1709, "index": "E", "name": "XOR Tree", "rating": 2400, "solvedCount": 4360, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. XOR Tree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a tree consisting of $$$n$$$ vertices. A number is written on each vertex; the number on vertex $$$i$$$ is equal to $$$a_i$$$.<\/p><p>Recall that a simple path is a path that visits each vertex at most once. Let the <span class=\"tex-font-style-it\">weight<\/span> of the path be the bitwise XOR of the values written on vertices it consists of. Let's say that a tree is <span class=\"tex-font-style-it\">good<\/span> if no simple path has weight $$$0$$$.<\/p><p>You can apply the following operation any number of times (possibly, zero): select a vertex of the tree and replace the value written on it with an arbitrary positive integer. What is the minimum number of times you have to apply this operation in order to make the tree <span class=\"tex-font-style-it\">good<\/span>?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of vertices.<\/p><p>The second line contains $$$n$$$ integers $$$a_1$$$, $$$a_2$$$, ..., $$$a_n$$$ ($$$1 \\le a_i  \\lt  2^{30}$$$)\u00a0\u2014 the numbers written on vertices.<\/p><p>Then $$$n - 1$$$ lines follow, each containing two integers $$$x$$$ and $$$y$$$ ($$$1 \\le x, y \\le n; x \\ne y$$$) denoting an edge connecting vertex $$$x$$$ with vertex $$$y$$$. It is guaranteed that these edges form a tree.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer\u00a0\u2014 the minimum number of times you have to apply the operation in order to make the tree <span class=\"tex-font-style-it\">good<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n3 2 1 3 2 1\n4 5\n3 4\n1 4\n2 1\n6 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n2 1 1 1\n1 2\n1 3\n1 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n2 2 2 2 2\n1 2\n2 3\n3 4\n4 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, it is enough to replace the value on the vertex $$$1$$$ with $$$13$$$, and the value on the vertex $$$4$$$ with $$$42$$$.<\/p><\/div><\/div>"}, {"contestId": 145, "index": "E", "name": "Lucky Queries", "rating": 2400, "solvedCount": 4232, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Lucky Queries<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p><span class=\"tex-font-style-underline\">Petya loves lucky numbers very much. Everybody knows that lucky numbers are positive integers whose decimal record contains only the lucky digits <span class=\"tex-font-style-bf\">4<\/span> and <span class=\"tex-font-style-bf\">7<\/span>. For example, numbers <span class=\"tex-font-style-bf\">47<\/span>, <span class=\"tex-font-style-bf\">744<\/span>, <span class=\"tex-font-style-bf\">4<\/span> are lucky and <span class=\"tex-font-style-bf\">5<\/span>, <span class=\"tex-font-style-bf\">17<\/span>, <span class=\"tex-font-style-bf\">467<\/span> are not.<\/span><\/p><p>Petya brought home string <span class=\"tex-span\"><i>s<\/i><\/span> with the length of <span class=\"tex-span\"><i>n<\/i><\/span>. The string only consists of lucky digits. The digits are numbered from the left to the right starting with <span class=\"tex-span\">1<\/span>. Now Petya should execute <span class=\"tex-span\"><i>m<\/i><\/span> queries of the following form:<\/p><ul> <li> <span class=\"tex-font-style-underline\">switch <span class=\"tex-span\"><i>l<\/i><\/span> <span class=\"tex-span\"><i>r<\/i><\/span><\/span> \u2014 \"switch\" digits (i.e. replace them with their opposites) at all positions with indexes from <span class=\"tex-span\"><i>l<\/i><\/span> to <span class=\"tex-span\"><i>r<\/i><\/span>, inclusive: each digit <span class=\"tex-span\">4<\/span> is replaced with <span class=\"tex-span\">7<\/span> and each digit <span class=\"tex-span\">7<\/span> is replaced with <span class=\"tex-span\">4<\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009<i>n<\/i>)<\/span>; <\/li><li> <span class=\"tex-font-style-underline\">count<\/span> \u2014 find and print on the screen the length of the longest non-decreasing subsequence of string <span class=\"tex-span\"><i>s<\/i><\/span>. <\/li><\/ul><p>Subsequence of a string <span class=\"tex-span\"><i>s<\/i><\/span> is a string that can be obtained from <span class=\"tex-span\"><i>s<\/i><\/span> by removing zero or more of its elements. A string is called non-decreasing if each successive digit is not less than the previous one.<\/p><p>Help Petya process the requests.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup>,\u20091\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u20093\u00b710<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the length of the string <span class=\"tex-span\"><i>s<\/i><\/span> and the number of queries correspondingly. The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> lucky digits without spaces \u2014 Petya's initial string. Next <span class=\"tex-span\"><i>m<\/i><\/span> lines contain queries in the form described in the statement.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query <span class=\"tex-font-style-underline\">count<\/span> print an answer on a single line.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 3<br/>47<br/>count<br/>switch 1 2<br/>count<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 5<br/>747<br/>count<br/>switch 1 1<br/>count<br/>switch 1 3<br/>count<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/>3<br/>2<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample the chronology of string <span class=\"tex-span\"><i>s<\/i><\/span> after some operations are fulfilled is as follows (the sought maximum subsequence is marked with <span class=\"tex-font-style-bf\">bold<\/span>): <\/p><ol> <li> <span class=\"tex-font-style-bf\">47<\/span> <\/li><li> 74 <\/li><li> <span class=\"tex-font-style-bf\">7<\/span>4 <\/li><\/ol> In the second sample: <ol> <li> 7<span class=\"tex-font-style-bf\">47<\/span> <\/li><li> 447 <\/li><li> <span class=\"tex-font-style-bf\">447<\/span> <\/li><li> 774 <\/li><li> <span class=\"tex-font-style-bf\">77<\/span>4 <\/li><\/ol><\/div><\/div>"}, {"contestId": 446, "index": "C", "name": "DZY Loves Fibonacci Numbers", "rating": 2400, "solvedCount": 4115, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. DZY Loves Fibonacci Numbers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>In mathematical terms, the sequence <span class=\"tex-span\"><i>F<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> of Fibonacci numbers is defined by the recurrence relation <\/p><center class=\"tex-equation\"><span class=\"tex-span\"><i>F<\/i><sub class=\"lower-index\">1<\/sub>\u2009=\u20091;\u00a0<i>F<\/i><sub class=\"lower-index\">2<\/sub>\u2009=\u20091;\u00a0<i>F<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub>\u2009=\u2009<i>F<\/i><sub class=\"lower-index\"><i>n<\/i>\u2009-\u20091<\/sub>\u2009+\u2009<i>F<\/i><sub class=\"lower-index\"><i>n<\/i>\u2009-\u20092<\/sub>\u00a0(<i>n<\/i>\u2009&gt;\u20092).<\/span><\/center><p>DZY loves Fibonacci numbers very much. Today DZY gives you an array consisting of <span class=\"tex-span\"><i>n<\/i><\/span> integers: <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span>. Moreover, there are <span class=\"tex-span\"><i>m<\/i><\/span> queries, each query has one of the two types:<\/p><ol> <li> Format of the query \"<span class=\"tex-span\">1 <i>l<\/i> <i>r<\/i><\/span>\". In reply to the query, you need to add <span class=\"tex-span\"><i>F<\/i><sub class=\"lower-index\"><i>i<\/i>\u2009-\u2009<i>l<\/i>\u2009+\u20091<\/sub><\/span> to each element <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, where <span class=\"tex-span\"><i>l<\/i>\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>r<\/i><\/span>. <\/li><li> Format of the query \"<span class=\"tex-span\">2 <i>l<\/i> <i>r<\/i><\/span>\". In reply to the query you should output the value of <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/b32147a7ee6ec016b9964a8e2c44d9b0058ec6e8.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> modulo <span class=\"tex-span\">1000000009\u00a0(10<sup class=\"upper-index\">9<\/sup>\u2009+\u20099)<\/span>. <\/li><\/ol><p>Help DZY reply to all the queries.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>m<\/i>\u2009\u2264\u2009300000<\/span>). The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub>\u00a0(1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup>)<\/span> \u2014 initial array <span class=\"tex-span\"><i>a<\/i><\/span>.<\/p><p>Then, <span class=\"tex-span\"><i>m<\/i><\/span> lines follow. A single line describes a single query in the format given in the statement. It is guaranteed that for each query inequality <span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009<i>n<\/i><\/span> holds.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query of the second type, print the value of the sum on a single line.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 4<br/>1 2 3 4<br/>1 1 4<br/>2 1 4<br/>1 2 4<br/>2 1 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>17<br/>12<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>After the first query, <span class=\"tex-span\"><i>a<\/i>\u2009=\u2009[2,\u20093,\u20095,\u20097]<\/span>.<\/p><p>For the second query, <span class=\"tex-span\"><i>sum<\/i>\u2009=\u20092\u2009+\u20093\u2009+\u20095\u2009+\u20097\u2009=\u200917<\/span>.<\/p><p>After the third query, <span class=\"tex-span\"><i>a<\/i>\u2009=\u2009[2,\u20094,\u20096,\u20099]<\/span>.<\/p><p>For the fourth query, <span class=\"tex-span\"><i>sum<\/i>\u2009=\u20092\u2009+\u20094\u2009+\u20096\u2009=\u200912<\/span>.<\/p><\/div><\/div>"}, {"contestId": 786, "index": "C", "name": "Till I Collapse", "rating": 2400, "solvedCount": 3995, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Till I Collapse<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Rick and Morty want to find MR. PBH and they can't do it alone. So they need of Mr. Meeseeks. They Have generated <span class=\"tex-span\"><i>n<\/i><\/span> Mr. Meeseeks, standing in a line numbered from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span>. Each of them has his own color. <span class=\"tex-span\"><i>i<\/i><\/span>-th Mr. Meeseeks' color is <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. <\/p><p>Rick and Morty are gathering their army and they want to divide Mr. Meeseeks into some squads. They don't want their squads to be too colorful, so each squad should have Mr. Meeseeks of at most <span class=\"tex-span\"><i>k<\/i><\/span> different colors. Also each squad should be a continuous subarray of Mr. Meeseeks in the line. Meaning that for each <span class=\"tex-span\">1\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>e<\/i>\u2009\u2264\u2009<i>j<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>, if Mr. Meeseeks number <span class=\"tex-span\"><i>i<\/i><\/span> and Mr. Meeseeks number <span class=\"tex-span\"><i>j<\/i><\/span> are in the same squad then Mr. Meeseeks number <span class=\"tex-span\"><i>e<\/i><\/span> should be in that same squad.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/ddccfa4d4cd81e14f5522d6b4bd93043f50e0e84.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>Also, each squad needs its own presidio, and building a presidio needs money, so they want the total number of squads to be minimized.<\/p><p>Rick and Morty haven't finalized the exact value of <span class=\"tex-span\"><i>k<\/i><\/span>, so in order to choose it, for each <span class=\"tex-span\"><i>k<\/i><\/span> between <span class=\"tex-span\">1<\/span> and <span class=\"tex-span\"><i>n<\/i><\/span> (inclusive) need to know the minimum number of presidios needed.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains a single integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 number of Mr. Meeseeks.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> separated by spaces (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>) \u2014 colors of Mr. Meeseeks in order they standing in a line.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In the first and only line of input print <span class=\"tex-span\"><i>n<\/i><\/span> integers separated by spaces. <span class=\"tex-span\"><i>i<\/i><\/span>-th integer should be the minimum number of presidios needed if the value of <span class=\"tex-span\"><i>k<\/i><\/span> is <span class=\"tex-span\"><i>i<\/i><\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1 3 4 3 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4 2 1 1 1 <br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>8<br/>1 5 7 8 1 7 6 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>8 4 3 2 1 1 1 1 <br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first sample testcase, some optimal ways of dividing army into squads for each <span class=\"tex-span\"><i>k<\/i><\/span> are:<\/p><ol> <li> <span class=\"tex-span\">[1],\u2009[3],\u2009[4],\u2009[3,\u20093]<\/span> <\/li><li> <span class=\"tex-span\">[1],\u2009[3,\u20094,\u20093,\u20093]<\/span> <\/li><li> <span class=\"tex-span\">[1,\u20093,\u20094,\u20093,\u20093]<\/span> <\/li><li> <span class=\"tex-span\">[1,\u20093,\u20094,\u20093,\u20093]<\/span> <\/li><li> <span class=\"tex-span\">[1,\u20093,\u20094,\u20093,\u20093]<\/span> <\/li><\/ol><p>For the second testcase, some optimal ways of dividing army into squads for each <span class=\"tex-span\"><i>k<\/i><\/span> are:<\/p><ol> <li> <span class=\"tex-span\">[1],\u2009[5],\u2009[7],\u2009[8],\u2009[1],\u2009[7],\u2009[6],\u2009[1]<\/span> <\/li><li> <span class=\"tex-span\">[1,\u20095],\u2009[7,\u20098],\u2009[1,\u20097],\u2009[6,\u20091]<\/span> <\/li><li> <span class=\"tex-span\">[1,\u20095,\u20097],\u2009[8],\u2009[1,\u20097,\u20096,\u20091]<\/span> <\/li><li> <span class=\"tex-span\">[1,\u20095,\u20097,\u20098],\u2009[1,\u20097,\u20096,\u20091]<\/span> <\/li><li> <span class=\"tex-span\">[1,\u20095,\u20097,\u20098,\u20091,\u20097,\u20096,\u20091]<\/span> <\/li><li> <span class=\"tex-span\">[1,\u20095,\u20097,\u20098,\u20091,\u20097,\u20096,\u20091]<\/span> <\/li><li> <span class=\"tex-span\">[1,\u20095,\u20097,\u20098,\u20091,\u20097,\u20096,\u20091]<\/span> <\/li><li> <span class=\"tex-span\">[1,\u20095,\u20097,\u20098,\u20091,\u20097,\u20096,\u20091]<\/span> <\/li><\/ol><\/div><\/div>"}, {"contestId": 1051, "index": "F", "name": "The Shortest Statement", "rating": 2400, "solvedCount": 3948, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. The Shortest Statement<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a weighed undirected <span class=\"tex-font-style-bf\">connected<\/span> graph, consisting of $$$n$$$ vertices and $$$m$$$ edges.<\/p><p>You should answer $$$q$$$ queries, the $$$i$$$-th query is to find the shortest distance between vertices $$$u_i$$$ and $$$v_i$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$m~(1 \\le n, m \\le 10^5, m - n \\le 20)$$$ \u2014 the number of vertices and edges in the graph.<\/p><p>Next $$$m$$$ lines contain the edges: the $$$i$$$-th edge is a triple of integers $$$v_i, u_i, d_i~(1 \\le u_i, v_i \\le n, 1 \\le d_i \\le 10^9, u_i \\neq v_i)$$$. This triple means that there is an edge between vertices $$$u_i$$$ and $$$v_i$$$ of weight $$$d_i$$$. It is guaranteed that graph contains no self-loops and multiple edges.<\/p><p>The next line contains a single integer $$$q~(1 \\le q \\le 10^5)$$$ \u2014 the number of queries.<\/p><p>Each of the next $$$q$$$ lines contains two integers $$$u_i$$$ and $$$v_i~(1 \\le u_i, v_i \\le n)$$$ \u2014 descriptions of the queries.<\/p><p><span class=\"tex-font-style-bf\">Pay attention to the restriction $$$m - n ~ \\le ~ 20$$$.<\/span><\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$q$$$ lines.<\/p><p>The $$$i$$$-th line should contain the answer to the $$$i$$$-th query \u2014 the shortest distance between vertices $$$u_i$$$ and $$$v_i$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 3<br/>1 2 3<br/>2 3 1<br/>3 1 5<br/>3<br/>1 2<br/>1 3<br/>2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/>4<br/>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>8 13<br/>1 2 4<br/>2 3 6<br/>3 4 1<br/>4 5 12<br/>5 6 3<br/>6 7 8<br/>7 8 7<br/>1 4 1<br/>1 8 3<br/>2 6 9<br/>2 7 1<br/>4 6 3<br/>6 8 2<br/>8<br/>1 5<br/>1 7<br/>2 3<br/>2 8<br/>3 7<br/>3 4<br/>6 8<br/>7 8<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>7<br/>5<br/>6<br/>7<br/>7<br/>1<br/>2<br/>7<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 626, "index": "F", "name": "Group Projects", "rating": 2400, "solvedCount": 3847, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Group Projects<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are <span class=\"tex-span\"><i>n<\/i><\/span> students in a class working on group projects. The students will divide into groups (some students may be in groups alone), work on their independent pieces, and then discuss the results together. It takes the <span class=\"tex-span\"><i>i<\/i><\/span>-th student <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> minutes to finish his/her independent piece.<\/p><p>If students work at different paces, it can be frustrating for the faster students and stressful for the slower ones. In particular, the <span class=\"tex-font-style-it\">imbalance<\/span> of a group is defined as the maximum <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> in the group minus the minimum <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> in the group. Note that a group containing a single student has an imbalance of <span class=\"tex-span\">0<\/span>. How many ways are there for the students to divide into groups so that the total imbalance of all groups is at most <span class=\"tex-span\"><i>k<\/i><\/span>?<\/p><p>Two divisions are considered distinct if there exists a pair of students who work in the same group in one division but different groups in the other.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two space-separated integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009200<\/span>, <span class=\"tex-span\">0\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u20091000<\/span>)\u00a0\u2014 the number of students and the maximum total imbalance allowed, respectively.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> space-separated integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009500<\/span>)\u00a0\u2014 the time it takes the <span class=\"tex-span\"><i>i<\/i><\/span>-th student to complete his/her independent piece of work.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer, the number of ways the students can form groups. As the answer may be large, print its value modulo <span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 2<br/>2 4 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 3<br/>7 8 9 10<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>13<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 0<br/>5 10 20 21<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample, we have three options: <\/p><ul> <li> The first and second students form a group, and the third student forms a group. Total imbalance is <span class=\"tex-span\">2\u2009+\u20090\u2009=\u20092<\/span>. <\/li><li> The first student forms a group, and the second and third students form a group. Total imbalance is <span class=\"tex-span\">0\u2009+\u20091\u2009=\u20091<\/span>. <\/li><li> All three students form their own groups. Total imbalance is <span class=\"tex-span\">0<\/span>. <\/li><\/ul><p>In the third sample, the total imbalance must be <span class=\"tex-span\">0<\/span>, so each student must work individually.<\/p><\/div><\/div>"}, {"contestId": 632, "index": "E", "name": "Thief in a Shop", "rating": 2400, "solvedCount": 3768, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Thief in a Shop<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>A thief made his way to a shop.<\/p><p>As usual he has his lucky knapsack with him. The knapsack can contain <span class=\"tex-span\"><i>k<\/i><\/span> objects. There are <span class=\"tex-span\"><i>n<\/i><\/span> kinds of products in the shop and an infinite number of products of each kind. The cost of one product of kind <span class=\"tex-span\"><i>i<\/i><\/span> is <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>.<\/p><p>The thief is greedy, so he will take exactly <span class=\"tex-span\"><i>k<\/i><\/span> products (it's possible for some kinds to take several products of that kind).<\/p><p>Find all the possible total costs of products the thief can nick into his knapsack.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>k<\/i>\u2009\u2264\u20091000<\/span>) \u2014 the number of kinds of products and the number of products the thief will take.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u20091000<\/span>) \u2014 the costs of products for kinds from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the only line with all the possible total costs of stolen products, separated by a space. The numbers should be printed in the ascending order.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 2<br/>1 2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2 3 4 5 6<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 5<br/>1 1 1 1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>5<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 3<br/>3 5 11<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>9 11 13 15 17 19 21 25 27 33<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 932, "index": "E", "name": "Team Work", "rating": 2400, "solvedCount": 3652, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Team Work<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You have a team of <span class=\"tex-span\"><i>N<\/i><\/span> people. For a particular task, you can pick any non-empty subset of people. The cost of having <span class=\"tex-span\"><i>x<\/i><\/span> people for the task is <span class=\"tex-span\"><i>x<\/i><sup class=\"upper-index\"><i>k<\/i><\/sup><\/span>. <\/p><p>Output the sum of costs over all non-empty subsets of people.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Only line of input contains two integers <span class=\"tex-span\"><i>N<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>N<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup>)<\/span> representing total number of people and <span class=\"tex-span\"><i>k<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u20095000)<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output the sum of costs for all non empty subsets modulo <span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>24<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, there is only one non-empty subset <span class=\"tex-span\">{1}<\/span> with cost <span class=\"tex-span\">1<sup class=\"upper-index\">1<\/sup>\u2009=\u20091<\/span>.<\/p><p>In the second example, there are seven non-empty subsets.<\/p><p>- <span class=\"tex-span\">{1}<\/span> with cost <span class=\"tex-span\">1<sup class=\"upper-index\">2<\/sup>\u2009=\u20091<\/span><\/p><p>- <span class=\"tex-span\">{2}<\/span> with cost <span class=\"tex-span\">1<sup class=\"upper-index\">2<\/sup>\u2009=\u20091<\/span><\/p><p>- <span class=\"tex-span\">{1,\u20092}<\/span> with cost <span class=\"tex-span\">2<sup class=\"upper-index\">2<\/sup>\u2009=\u20094<\/span><\/p><p>- <span class=\"tex-span\">{3}<\/span> with cost <span class=\"tex-span\">1<sup class=\"upper-index\">2<\/sup>\u2009=\u20091<\/span><\/p><p>- <span class=\"tex-span\">{1,\u20093}<\/span> with cost <span class=\"tex-span\">2<sup class=\"upper-index\">2<\/sup>\u2009=\u20094<\/span><\/p><p>- <span class=\"tex-span\">{2,\u20093}<\/span> with cost <span class=\"tex-span\">2<sup class=\"upper-index\">2<\/sup>\u2009=\u20094<\/span><\/p><p>- <span class=\"tex-span\">{1,\u20092,\u20093}<\/span> with cost <span class=\"tex-span\">3<sup class=\"upper-index\">2<\/sup>\u2009=\u20099<\/span><\/p><p>The total cost is <span class=\"tex-span\">1\u2009+\u20091\u2009+\u20094\u2009+\u20091\u2009+\u20094\u2009+\u20094\u2009+\u20099\u2009=\u200924<\/span>.<\/p><\/div><\/div>"}, {"contestId": 815, "index": "C", "name": "Karen and Supermarket", "rating": 2400, "solvedCount": 3516, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Karen and Supermarket<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>On the way home, Karen decided to stop by the supermarket to buy some groceries.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/b46fa3ae5b56c53378373ef8f1873c50c8c7c64f.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>She needs to buy a lot of goods, but since she is a student her budget is still quite limited. In fact, she can only spend up to <span class=\"tex-span\"><i>b<\/i><\/span> dollars.<\/p><p>The supermarket sells <span class=\"tex-span\"><i>n<\/i><\/span> goods. The <span class=\"tex-span\"><i>i<\/i><\/span>-th good can be bought for <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> dollars. Of course, each good can only be bought once.<\/p><p>Lately, the supermarket has been trying to increase its business. Karen, being a loyal customer, was given <span class=\"tex-span\"><i>n<\/i><\/span> coupons. If Karen purchases the <span class=\"tex-span\"><i>i<\/i><\/span>-th good, she can use the <span class=\"tex-span\"><i>i<\/i><\/span>-th coupon to decrease its price by <span class=\"tex-span\"><i>d<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. Of course, a coupon cannot be used without buying the corresponding good.<\/p><p>There is, however, a constraint with the coupons. For all <span class=\"tex-span\"><i>i<\/i>\u2009\u2265\u20092<\/span>, in order to use the <span class=\"tex-span\"><i>i<\/i><\/span>-th coupon, Karen must also use the <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>-th coupon (which may mean using even more coupons to satisfy the requirement for that coupon).<\/p><p>Karen wants to know the following. What is the maximum number of goods she can buy, without exceeding her budget <span class=\"tex-span\"><i>b<\/i><\/span>?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20095000<\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>b<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>), the number of goods in the store and the amount of money Karen has, respectively.<\/p><p>The next <span class=\"tex-span\"><i>n<\/i><\/span> lines describe the items. Specifically:<\/p><ul> <li> The <span class=\"tex-span\"><i>i<\/i><\/span>-th line among these starts with two integers, <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>d<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>d<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009&lt;\u2009<i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>), the price of the <span class=\"tex-span\"><i>i<\/i><\/span>-th good and the discount when using the coupon for the <span class=\"tex-span\"><i>i<\/i><\/span>-th good, respectively. <\/li><li> If <span class=\"tex-span\"><i>i<\/i>\u2009\u2265\u20092<\/span>, this is followed by another integer, <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009&lt;\u2009<i>i<\/i><\/span>), denoting that the <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>-th coupon must also be used before this coupon can be used. <\/li><\/ul><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output a single integer on a line by itself, the number of different goods Karen can buy, without exceeding her budget.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>6 16<br/>10 9<br/>10 5 1<br/>12 2 1<br/>20 18 3<br/>10 2 3<br/>2 1 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 10<br/>3 1<br/>3 1 1<br/>3 1 2<br/>3 1 3<br/>3 1 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>5<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, Karen can purchase the following <span class=\"tex-span\">4<\/span> items:<\/p><ul> <li> Use the first coupon to buy the first item for <span class=\"tex-span\">10\u2009-\u20099\u2009=\u20091<\/span> dollar. <\/li><li> Use the third coupon to buy the third item for <span class=\"tex-span\">12\u2009-\u20092\u2009=\u200910<\/span> dollars. <\/li><li> Use the fourth coupon to buy the fourth item for <span class=\"tex-span\">20\u2009-\u200918\u2009=\u20092<\/span> dollars. <\/li><li> Buy the sixth item for <span class=\"tex-span\">2<\/span> dollars. <\/li><\/ul><p>The total cost of these goods is <span class=\"tex-span\">15<\/span>, which falls within her budget. Note, for example, that she cannot use the coupon on the sixth item, because then she should have also used the fifth coupon to buy the fifth item, which she did not do here.<\/p><p>In the second test case, Karen has enough money to use all the coupons and purchase everything.<\/p><\/div><\/div>"}, {"contestId": 444, "index": "C", "name": "DZY Loves Colors", "rating": 2400, "solvedCount": 3504, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. DZY Loves Colors<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p><span class=\"tex-font-style-it\">DZY loves colors, and he enjoys painting.<\/span><\/p><p>On a colorful day, DZY gets a colorful ribbon, which consists of <span class=\"tex-span\"><i>n<\/i><\/span> units (they are numbered from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span> from left to right). The color of the <span class=\"tex-span\"><i>i<\/i><\/span>-th unit of the ribbon is <span

 beauty over all subarrays of array $$$a$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">6 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 10 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 8 7 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">9 8 2 4 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">12<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2 6 13 3 15 5 10 8 16 9 11 18<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n2\n8\n16\n232\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case: <\/p><ul> <li> The subarray $$$[6]$$$ is already sorted, so its beauty is $$$0$$$. <\/li><li> The subarray $$$[4]$$$ is already sorted, so its beauty is $$$0$$$. <\/li><li> You can sort the subarray $$$[6, 4]$$$ in one operation by choosing $$$l = 1$$$ and $$$r = 2$$$. Its beauty is equal to $$$1$$$. <\/li><\/ul> The sum of beauty over all subarrays of the given array is equal to $$$0 + 0 + 1 = 1$$$.<p>In the second test case: <\/p><ul> <li> The subarray $$$[3]$$$ is already sorted, so its beauty is $$$0$$$. <\/li><li> The subarray $$$[10]$$$ is already sorted, so its beauty is $$$0$$$. <\/li><li> The subarray $$$[6]$$$ is already sorted, so its beauty is $$$0$$$. <\/li><li> The subarray $$$[3, 10]$$$ is already sorted, so its beauty is $$$0$$$. <\/li><li> You can sort the subarray $$$[10, 6]$$$ in one operation by choosing $$$l = 1$$$ and $$$r = 2$$$. Its beauty is equal to $$$2 - 1 = 1$$$. <\/li><li> You can sort the subarray $$$[3, 10, 6]$$$ in one operation by choosing $$$l = 2$$$ and $$$r = 3$$$. Its beauty is equal to $$$3 - 2 = 1$$$. <\/li><\/ul> The sum of beauty over all subarrays of the given array is equal to $$$0 + 0 + 0 + 0 + 1 + 1 = 2$$$.<\/div><\/div>"}, {"contestId": 1485, "index": "F", "name": "Copy or Prefix Sum", "rating": 2400, "solvedCount": 2412, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Copy or Prefix Sum<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array of integers $$$b_1, b_2, \\ldots, b_n$$$.<\/p><p>An array $$$a_1, a_2, \\ldots, a_n$$$ of integers is <span class=\"tex-font-style-bf\">hybrid<\/span> if for each $$$i$$$ ($$$1 \\leq i \\leq n$$$) at least one of these conditions is true: <\/p><ul> <li> $$$b_i = a_i$$$, or <\/li><li> $$$b_i = \\sum_{j=1}^{i} a_j$$$. <\/li><\/ul><p>Find the number of hybrid arrays $$$a_1, a_2, \\ldots, a_n$$$. As the result can be very large, you should print the answer modulo $$$10^9 + 7$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$) \u2014 the number of test cases.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$).<\/p><p>The second line of each test case contains $$$n$$$ integers $$$b_1, b_2, \\ldots, b_n$$$ ($$$-10^9 \\le b_i \\le 10^9$$$).<\/p><p>It is guaranteed that the sum of $$$n$$$ for all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print a single integer: the number of hybrid arrays $$$a_1, a_2, \\ldots, a_n$$$ modulo $$$10^9 + 7$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n3\n1 -1 1\n4\n1 2 3 4\n10\n2 -1 1 -2 2 3 -5 0 2 -1\n4\n0 0 0 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n8\n223\n1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the hybrid arrays are $$$[1, -2, 1]$$$, $$$[1, -2, 2]$$$, $$$[1, -1, 1]$$$.<\/p><p>In the second test case, the hybrid arrays are $$$[1, 1, 1, 1]$$$, $$$[1, 1, 1, 4]$$$, $$$[1, 1, 3, -1]$$$, $$$[1, 1, 3, 4]$$$, $$$[1, 2, 0, 1]$$$, $$$[1, 2, 0, 4]$$$, $$$[1, 2, 3, -2]$$$, $$$[1, 2, 3, 4]$$$.<\/p><p>In the fourth test case, the only hybrid array is $$$[0, 0, 0, 1]$$$.<\/p><\/div><\/div>"}, {"contestId": 869, "index": "E", "name": "The Untended Antiquity", "rating": 2400, "solvedCount": 2411, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. The Untended Antiquity<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-it\">Adieu l'ami.<\/span><\/p><p>Koyomi is helping Oshino, an acquaintance of his, to take care of an open space around the abandoned Eikou Cram School building, Oshino's makeshift residence.<\/p><p>The space is represented by a rectangular grid of <span class=\"tex-span\"><i>n<\/i>\u2009\u00d7\u2009<i>m<\/i><\/span> cells, arranged into <span class=\"tex-span\"><i>n<\/i><\/span> rows and <span class=\"tex-span\"><i>m<\/i><\/span> columns. The <span class=\"tex-span\"><i>c<\/i><\/span>-th cell in the <span class=\"tex-span\"><i>r<\/i><\/span>-th row is denoted by <span class=\"tex-span\">(<i>r<\/i>,\u2009<i>c<\/i>)<\/span>.<\/p><p>Oshino places and removes barriers <span class=\"tex-font-style-bf\">around<\/span> rectangular areas of cells. Specifically, an action denoted by \"<span class=\"tex-span\">1 <i>r<\/i><sub class=\"lower-index\">1<\/sub> <i>c<\/i><sub class=\"lower-index\">1<\/sub> <i>r<\/i><sub class=\"lower-index\">2<\/sub> <i>c<\/i><sub class=\"lower-index\">2<\/sub><\/span>\" means Oshino's placing barriers around a rectangle with two corners being <span class=\"tex-span\">(<i>r<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\">1<\/sub>)<\/span> and <span class=\"tex-span\">(<i>r<\/i><sub class=\"lower-index\">2<\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\">2<\/sub>)<\/span> and sides parallel to squares sides. Similarly, \"<span class=\"tex-span\">2 <i>r<\/i><sub class=\"lower-index\">1<\/sub> <i>c<\/i><sub class=\"lower-index\">1<\/sub> <i>r<\/i><sub class=\"lower-index\">2<\/sub> <i>c<\/i><sub class=\"lower-index\">2<\/sub><\/span>\" means Oshino's removing barriers around the rectangle. <span class=\"tex-font-style-bf\">Oshino ensures that no barriers staying on the ground share any common points, nor do they intersect with boundaries of the <span class=\"tex-span\"><i>n<\/i>\u2009\u00d7\u2009<i>m<\/i><\/span> area.<\/span><\/p><p>Sometimes Koyomi tries to walk from one cell to another carefully without striding over barriers, in order to avoid damaging various items on the ground. \"<span class=\"tex-span\">3 <i>r<\/i><sub class=\"lower-index\">1<\/sub> <i>c<\/i><sub class=\"lower-index\">1<\/sub> <i>r<\/i><sub class=\"lower-index\">2<\/sub> <i>c<\/i><sub class=\"lower-index\">2<\/sub><\/span>\" means that Koyomi tries to walk from <span class=\"tex-span\">(<i>r<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\">1<\/sub>)<\/span> to <span class=\"tex-span\">(<i>r<\/i><sub class=\"lower-index\">2<\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\">2<\/sub>)<\/span> without crossing barriers.<\/p><p>And you're here to tell Koyomi the feasibility of each of his attempts.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains three space-separated integers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>m<\/i><\/span> and <span class=\"tex-span\"><i>q<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>m<\/i>\u2009\u2264\u20092\u2009500<\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>q<\/i>\u2009\u2264\u2009100\u2009000<\/span>) \u2014 the number of rows and columns in the grid, and the total number of Oshino and Koyomi's actions, respectively.<\/p><p>The following <span class=\"tex-span\"><i>q<\/i><\/span> lines each describes an action, containing five space-separated integers <span class=\"tex-span\"><i>t<\/i><\/span>, <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\">1<\/sub><\/span>, <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\">1<\/sub><\/span>, <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\">2<\/sub><\/span>, <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\">2<\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>t<\/i>\u2009\u2264\u20093<\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>r<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>r<\/i><sub class=\"lower-index\">2<\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>c<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\">2<\/sub>\u2009\u2264\u2009<i>m<\/i><\/span>) \u2014 the type and two coordinates of an action. Additionally, the following holds depending on the value of <span class=\"tex-span\"><i>t<\/i><\/span>: <\/p><ul> <li> If <span class=\"tex-span\"><i>t<\/i>\u2009=\u20091<\/span>: <span class=\"tex-span\">2\u2009\u2264\u2009<i>r<\/i><sub class=\"lower-index\">1<\/sub>\u2009\u2264\u2009<i>r<\/i><sub class=\"lower-index\">2<\/sub>\u2009\u2264\u2009<i>n<\/i>\u2009-\u20091<\/span>, <span class=\"tex-span\">2\u2009\u2264\u2009<i>c<\/i><sub class=\"lower-index\">1<\/sub>\u2009\u2264\u2009<i>c<\/i><sub class=\"lower-index\">2<\/sub>\u2009\u2264\u2009<i>m<\/i>\u2009-\u20091<\/span>; <\/li><li> If <span class=\"tex-span\"><i>t<\/i>\u2009=\u20092<\/span>: <span class=\"tex-span\">2\u2009\u2264\u2009<i>r<\/i><sub class=\"lower-index\">1<\/sub>\u2009\u2264\u2009<i>r<\/i><sub class=\"lower-index\">2<\/sub>\u2009\u2264\u2009<i>n<\/i>\u2009-\u20091<\/span>, <span class=\"tex-span\">2\u2009\u2264\u2009<i>c<\/i><sub class=\"lower-index\">1<\/sub>\u2009\u2264\u2009<i>c<\/i><sub class=\"lower-index\">2<\/sub>\u2009\u2264\u2009<i>m<\/i>\u2009-\u20091<\/span>, the specified group of barriers exist on the ground before the removal. <\/li><li> If <span class=\"tex-span\"><i>t<\/i>\u2009=\u20093<\/span>: no extra restrictions. <\/li><\/ul><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each of Koyomi's attempts (actions with <span class=\"tex-span\"><i>t<\/i>\u2009=\u20093<\/span>), output one line \u2014 containing \"<span class=\"tex-font-style-tt\">Yes<\/span>\" (without quotes) if it's feasible, and \"<span class=\"tex-font-style-tt\">No<\/span>\" (without quotes) otherwise.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 6 5<br/>1 2 2 4 5<br/>1 3 3 3 3<br/>3 4 4 1 1<br/>2 2 2 4 5<br/>3 1 1 4 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>No<br/>Yes<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2500 2500 8<br/>1 549 1279 1263 2189<br/>1 303 795 1888 2432<br/>1 2227 622 2418 1161<br/>3 771 2492 1335 1433<br/>1 2017 2100 2408 2160<br/>3 48 60 798 729<br/>1 347 708 1868 792<br/>3 1940 2080 377 1546<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>No<br/>Yes<br/>No<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first example, the situations of Koyomi's actions are illustrated below.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/fb439c428436e7e2fa680b135339e7954dc8c350.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 1418, "index": "E", "name": "Expected Damage", "rating": 2400, "solvedCount": 2402, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Expected Damage<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are playing a computer game. In this game, you have to fight $$$n$$$ monsters.<\/p><p>To defend from monsters, you need a shield. Each shield has two parameters: its current durability $$$a$$$ and its defence rating $$$b$$$. Each monster has only one parameter: its strength $$$d$$$.<\/p><p>When you fight a monster with strength $$$d$$$ while having a shield with current durability $$$a$$$ and defence $$$b$$$, there are three possible outcomes:<\/p><ul> <li> if $$$a = 0$$$, then you receive $$$d$$$ damage; <\/li><li> if $$$a  \\gt  0$$$ and $$$d \\ge b$$$, you receive no damage, but the current durability of the shield decreases by $$$1$$$; <\/li><li> if $$$a  \\gt  0$$$ and $$$d  \\lt  b$$$, nothing happens. <\/li><\/ul><p>The $$$i$$$-th monster has strength $$$d_i$$$, and you will fight each of the monsters exactly once, in some random order (all $$$n!$$$ orders are equiprobable). You have to consider $$$m$$$ different shields, the $$$i$$$-th shield has initial durability $$$a_i$$$ and defence rating $$$b_i$$$. For each shield, calculate the expected amount of damage you will receive if you take this shield and fight the given $$$n$$$ monsters in random order.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\le n, m \\le 2 \\cdot 10^5$$$) \u2014 the number of monsters and the number of shields, respectively.<\/p><p>The second line contains $$$n$$$ integers $$$d_1$$$, $$$d_2$$$, ..., $$$d_n$$$ ($$$1 \\le d_i \\le 10^9$$$), where $$$d_i$$$ is the strength of the $$$i$$$-th monster.<\/p><p>Then $$$m$$$ lines follow, the $$$i$$$-th of them contains two integers $$$a_i$$$ and $$$b_i$$$ ($$$1 \\le a_i \\le n$$$; $$$1 \\le b_i \\le 10^9$$$) \u2014 the description of the $$$i$$$-th shield.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$m$$$ integers, where the $$$i$$$-th integer represents the expected damage you receive with the $$$i$$$-th shield as follows: it can be proven that, for each shield, the expected damage is an irreducible fraction $$$\\dfrac{x}{y}$$$, where $$$y$$$ is coprime with $$$998244353$$$. You have to print the value of $$$x \\cdot y^{-1} \\bmod 998244353$$$, where $$$y^{-1}$$$ is the inverse element for $$$y$$$ ($$$y \\cdot y^{-1} \\bmod 998244353 = 1$$$).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 2\n1 3 1\n2 1\n1 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n665496237\n1\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 3\n4 2 6\n3 1\n1 2\n2 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n8\n665496236\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1144, "index": "G", "name": "Two Merged Sequences", "rating": 2400, "solvedCount": 2388, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. Two Merged Sequences<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Two integer sequences existed initially, one of them was <span class=\"tex-font-style-bf\">strictly<\/span> increasing, and another one \u2014 <span class=\"tex-font-style-bf\">strictly<\/span> decreasing.<\/p><p>Strictly increasing sequence is a sequence of integers $$$[x_1  \\lt  x_2  \\lt  \\dots  \\lt  x_k]$$$. And strictly decreasing sequence is a sequence of integers $$$[y_1  \\gt  y_2  \\gt  \\dots  \\gt  y_l]$$$. Note that the empty sequence and the sequence consisting of one element can be considered as increasing or decreasing.<\/p><p>Elements of increasing sequence were inserted between elements of the decreasing one (and, possibly, before its first element and after its last element) <span class=\"tex-font-style-bf\">without changing the order<\/span>. For example, sequences $$$[1, 3, 4]$$$ and $$$[10, 4, 2]$$$ can produce the following resulting sequences: $$$[10, \\textbf{1}, \\textbf{3}, 4, 2, \\textbf{4}]$$$, $$$[\\textbf{1}, \\textbf{3}, \\textbf{4}, 10, 4, 2]$$$. The following sequence cannot be the result of these insertions: $$$[\\textbf{1}, 10, \\textbf{4}, 4, \\textbf{3}, 2]$$$ because the order of elements in the increasing sequence was changed.<\/p><p>Let the obtained sequence be $$$a$$$. This sequence $$$a$$$ is given in the input. Your task is to find <span class=\"tex-font-style-bf\">any<\/span> two suitable initial sequences. One of them should be <span class=\"tex-font-style-bf\">strictly<\/span> increasing, and another one \u2014 <span class=\"tex-font-style-bf\">strictly<\/span> decreasing. <span class=\"tex-font-style-bf\">Note that the empty sequence and the sequence consisting of one element can be considered as increasing or decreasing.<\/span><\/p><p>If there is a contradiction in the input and it is impossible to split the given sequence $$$a$$$ into one increasing sequence and one decreasing sequence, print \"<span class=\"tex-font-style-tt\">NO<\/span>\".<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains one integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$) \u2014 the number of elements in $$$a$$$.<\/p><p>The second line of the input contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$0 \\le a_i \\le 2 \\cdot 10^5$$$), where $$$a_i$$$ is the $$$i$$$-th element of $$$a$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If there is a contradiction in the input and it is impossible to split the given sequence $$$a$$$ into one increasing sequence and one decreasing sequence, print \"<span class=\"tex-font-style-tt\">NO<\/span>\" in the first line.<\/p><p>Otherwise print \"<span class=\"tex-font-style-tt\">YES<\/span>\" in the first line. In the second line, print a sequence of $$$n$$$ integers $$$res_1, res_2, \\dots, res_n$$$, where $$$res_i$$$ should be either $$$0$$$ or $$$1$$$ for each $$$i$$$ from $$$1$$$ to $$$n$$$. The $$$i$$$-th element of this sequence should be $$$0$$$ if the $$$i$$$-th element of $$$a$$$ belongs to the increasing sequence, and $$$1$$$ otherwise. <span class=\"tex-font-style-bf\">Note that the empty sequence and the sequence consisting of one element can be considered as increasing or decreasing.<\/span><\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n9\n5 1 3 6 8 2 9 0 10\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\n1 0 0 0 0 1 0 1 0 \n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n1 2 4 0 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nNO\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1887, "index": "C", "name": "Minimum Array", "rating": 2400, "solvedCount": 2364, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Minimum Array<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Given an array $$$a$$$ of length $$$n$$$ consisting of integers. Then the following operation is sequentially applied to it $$$q$$$ times:<\/p><ul><li> Choose indices $$$l$$$ and $$$r$$$ ($$$1 \\le l \\le r \\le n$$$) and an integer $$$x$$$;<\/li><li> Add $$$x$$$ to all elements of the array $$$a$$$ in the segment $$$[l, r]$$$. More formally, assign $$$a_i := a_i + x$$$ for all $$$l \\le i \\le r$$$.<\/li><\/ul><p>Let $$$b_j$$$ be the array $$$a$$$ obtained after applying the first $$$j$$$ operations ($$$0 \\le j \\le q$$$). Note that $$$b_0$$$ is the array $$$a$$$ before applying any operations.<\/p><p>You need to find the lexicographically minimum$$$^{\\dagger}$$$ array among all arrays $$$b_j$$$.<\/p><p>$$$^{\\dagger}$$$An array $$$x$$$ is lexicographically smaller than array $$$y$$$ if there is an index $$$i$$$ such that $$$x_i  \\lt  y_i$$$, and $$$x_j = y_j$$$ for all $$$j  \\lt  i$$$. In other words, for the first index $$$i$$$ where the arrays differ, $$$x_i  \\lt  y_i$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test consists of multiple test cases. The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 5 \\cdot 10^5$$$) \u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 5 \\cdot 10^5$$$) \u2014 the length of array $$$a$$$.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$-10^9 \\le a_i \\le 10^9$$$) \u2014 the elements of array $$$a$$$.<\/p><p>The third line of each test case contains a single integer $$$q$$$ ($$$0 \\le q \\le 5 \\cdot 10^5$$$) \u2014 the number of operations on the array.<\/p><p>In each of the next $$$q$$$ lines, there are three integers $$$l_j$$$, $$$r_j$$$, and $$$x_j$$$ $$$(1 \\le l_j \\le r_j \\le n, -10^9 \\le x_j \\le 10^9)$$$ \u2014 the description of each operation. The operations are given in the order they are applied.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases and the sum of $$$q$$$ over all test cases do not exceed $$$5 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output the lexicographically minimum array among all arrays $$$b_j$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 3 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 4 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 3 -100<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 1 2 5 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 4 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 5 -2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 3 1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n-99 -98 -97 4 \n2 1 2 5 4 \n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case:<\/p><ul><li> $$$b_0 = [1,2,3,4]$$$;<\/li><li> $$$b_1 = [1,2,3,4]$$$;<\/li><li> $$$b_2 = [-99,-98,-97,4]$$$.<\/li><\/ul><p>Thus, the lexicographically minimum array is $$$b_2$$$.<\/p><p>In the second test case, the lexicographically minimum array is $$$b_0$$$.<\/p><\/div><\/div>"}, {"contestId": 1527, "index": "D", "name": "MEX Tree", "rating": 2400, "solvedCount": 2362, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. MEX Tree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a tree with $$$n$$$ nodes, numerated from $$$0$$$ to $$$n-1$$$. For each $$$k$$$ between $$$0$$$ and $$$n$$$, inclusive, you have to count the number of unordered pairs $$$(u,v)$$$, $$$u \\neq v$$$, such that the <span class=\"tex-font-style-bf\">MEX<\/span> of all the node labels in the shortest path from $$$u$$$ to $$$v$$$ (including end points) is $$$k$$$.<\/p><p>The <span class=\"tex-font-style-bf\">MEX<\/span> of a sequence of integers is the smallest non-negative integer that does not belong to the sequence.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$) \u2014 the number of test cases. <\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$2 \\le n \\le 2 \\cdot 10^{5}$$$).<\/p><p>The next $$$n-1$$$ lines of each test case describe the tree that has to be constructed. These lines contain two integers $$$u$$$ and $$$v$$$ ($$$0 \\le u,v \\le n-1$$$) denoting an edge between $$$u$$$ and $$$v$$$ ($$$u \\neq v$$$).<\/p><p>It is guaranteed that the given edges form a tree.<\/p><p>It is also guaranteed that the sum of $$$n$$$ for all test cases does not exceed $$$2 \\cdot 10^{5}$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print $$$n+1$$$ integers: the number of paths in the tree, such that the MEX of all the node labels in that path is $$$k$$$ for each $$$k$$$ from $$$0$$$ to $$$n$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n4\n0 1\n0 2\n2 3\n2\n1 0\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 2 1 1 1 \n0 0 1 \n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><ol> <li> In example case $$$1$$$, <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/a86d333a88eb81c4003aaba7a2c3a948c1c4b5ba.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <ul> <li> For $$$k = 0$$$, there is $$$1$$$ path that is from $$$2$$$ to $$$3$$$ as $$$MEX([2, 3]) = 0$$$. <\/li><li> For $$$k = 1$$$, there are $$$2$$$ paths that is from $$$0$$$ to $$$2$$$ as $$$MEX([0, 2]) = 1$$$ and $$$0$$$ to $$$3$$$ as $$$MEX([0, 2, 3]) = 1$$$. <\/li><li> For $$$k = 2$$$, there is $$$1$$$ path that is from $$$0$$$ to $$$1$$$ as $$$MEX([0, 1]) = 2$$$. <\/li><li> For $$$k = 3$$$, there is $$$1$$$ path that is from $$$1$$$ to $$$2$$$ as $$$MEX([1, 0, 2]) = 3$$$ <\/li><li> For $$$k = 4$$$, there is $$$1$$$ path that is from $$$1$$$ to $$$3$$$ as $$$MEX([1, 0, 2, 3]) = 4$$$. <\/li><\/ul> <\/li><li> In example case $$$2$$$, <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/1fb5b24629def3c864862ee94df8f7bbff630e67.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <ul> <li> For $$$k = 0$$$, there are no such paths. <\/li><li> For $$$k = 1$$$, there are no such paths. <\/li><li> For $$$k = 2$$$, there is $$$1$$$ path that is from $$$0$$$ to $$$1$$$ as $$$MEX([0, 1]) = 2$$$. <\/li><\/ul> <\/li><\/ol><\/div><\/div>"}, {"contestId": 1830, "index": "C", "name": "Hyperregular Bracket Strings", "rating": 2400, "solvedCount": 2359, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Hyperregular Bracket Strings<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an integer $$$n$$$ and $$$k$$$ intervals. The $$$i$$$-th interval is $$$[l_i,r_i]$$$ where $$$1 \\leq l_i \\leq r_i \\leq n$$$.<\/p><p>Let us call a <span class=\"tex-font-style-bf\">regular<\/span> bracket sequence$$$^{\\dagger,\\ddagger}$$$ of length $$$n$$$ <span class=\"tex-font-style-it\">hyperregular<\/span> if for each $$$i$$$ such that $$$1 \\leq i \\leq k$$$, the substring $$$\\overline{s_{l_i} s_{l_{i}+1} \\ldots s_{r_i}}$$$ is also a regular bracket sequence.<\/p><p>Your task is to count the number of hyperregular bracket sequences. Since this number can be really large, you are only required to find it modulo $$$998\\,244\\,353$$$.<\/p><p>$$$^\\dagger$$$ A bracket sequence is a string containing only the characters \"<span class=\"tex-font-style-tt\">(<\/span>\" and \"<span class=\"tex-font-style-tt\">)<\/span>\".<\/p><p>$$$^\\ddagger$$$ A bracket sequence is called regular if one can turn it into a valid math expression by adding characters <span class=\"tex-font-style-tt\">+<\/span> and <span class=\"tex-font-style-tt\">1<\/span>. For example, sequences <span class=\"tex-font-style-tt\">(())()<\/span>, <span class=\"tex-font-style-tt\">()<\/span>, <span class=\"tex-font-style-tt\">(()(()))<\/span> and the empty string are regular, while <span class=\"tex-font-style-tt\">)(<\/span>, <span class=\"tex-font-style-tt\">(()<\/span>, and <span class=\"tex-font-style-tt\">(()))(<\/span> are not.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line of input contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^5$$$)\u00a0\u2014 the number of test cases. The description of test cases follows.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le n \\le 3 \\cdot 10^5$$$, $$$0 \\le k \\le 3 \\cdot 10^5$$$) \u2014 the length of the hyperregular bracket sequences and the number of intervals respectively.<\/p><p>The following $$$k$$$ lines of each test case contains two integers $$$l_i$$$ and $$$r_i$$$ ($$$1 \\le l \\le r \\le n$$$).<\/p><p>It is guaranteed that the sum of $$$n$$$ across all test cases does not exceed $$$3 \\cdot 10^5$$$ and the sum of $$$k$$$ across all test cases does not exceed $$$3 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output the number of hyperregular bracket sequences modulo $$$998\\,244\\,353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">6 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">8 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">10 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1000 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">100 701<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">200 801<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">300 901<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">28 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">1 12<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">3 20<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">11 14<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">4 9<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">18 19<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">1 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">1 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">1 4<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5\n0\n0\n4\n839415253\n140\n2\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><ul> <li> For the first testcase, the $$$5$$$ <span class=\"tex-font-style-it\">hyperregular bracket strings<\/span> of length $$$6$$$ are: <span class=\"tex-font-style-tt\">((()))<\/span>, <span class=\"tex-font-style-tt\">(()())<\/span>, <span class=\"tex-font-style-tt\">(())()<\/span>, <span class=\"tex-font-style-tt\">()(())<\/span> and <span class=\"tex-font-style-tt\">()()()<\/span>.<\/li><li> For the second testcase, there are no regular bracket strings of length $$$5$$$, and consequently, there are no <span class=\"tex-font-style-it\">hyperregular bracket strings<\/span> of length $$$5$$$.<\/li><li> For the third testcase, there are no hyperregular bracket strings of length $$$8$$$ for which the substring $$$[1 \\ldots 3]$$$ is a regular bracket string.<\/li><li> For the fourth testcase, there $$$4$$$ <span class=\"tex-font-style-it\">hyperregular bracket strings<\/span> are: <span class=\"tex-font-style-tt\">((())(()))<\/span>, <span class=\"tex-font-style-tt\">((())()())<\/span>, <span class=\"tex-font-style-tt\">()()((()))<\/span> and <span class=\"tex-font-style-tt\">()()(()())<\/span> <\/li><\/ul><\/div><\/div>"}, {"contestId": 1973, "index": "D", "name": "Cat, Fox and Maximum Array Split", "rating": 2400, "solvedCount": 2351, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Cat, Fox and Maximum Array Split<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-it\">This is an interactive problem.<\/span><\/p><p>Fox gave Cat two positive integers $$$n$$$ and $$$k$$$. She has a hidden array $$$a_1, \\ldots , a_n$$$ of length $$$n$$$, such that $$$1 \\leq a_i \\leq n$$$ for every $$$i$$$. Now they are going to play the following game:<\/p><p>For any two integers $$$l, r$$$ such that $$$1 \\leq l \\leq r \\leq n$$$, define $$$f(l, r) = (r - l + 1) \\cdot \\max\\limits_{x=l}^r a_x$$$. In other words, $$$f(l, r)$$$ is equal to the maximum of the subarray $$$a_l, \\ldots, a_r$$$ multiplied by its size.<\/p><p>Cat can ask Fox at most $$$2 n$$$ questions about the array. He will tell her two integers $$$l$$$ and $$$x$$$ ($$$1 \\leq l \\leq n, 1 \\leq x \\leq 10^9$$$), and she will tell him one integer $$$p$$$ as the answer \u2014 the smallest positive integer $$$r$$$ such that $$$f(l, r) = x$$$, or $$$n+1$$$ if no such $$$r$$$ exists.<\/p><p>Now, Cat needs to find the largest value $$$m$$$ such that there exists a sequence $$$c_1, \\ldots, c_{k-1}$$$ such that $$$1 \\leq c_1  \\lt  \\ldots  \\lt  c_{k-1}  \\lt  n$$$ and $$$f(1, c_1) = f(c_1 + 1, c_2) = \\ldots = f(c_{k-1}+1, n) = m$$$. If no such $$$m$$$ exists, he should indicate this and take $$$-1$$$ as the answer. Note that for $$$k = 1$$$, $$$m$$$ is always equal to $$$f(1, n)$$$.<\/p><p>In other words, the goal is to find the largest $$$m$$$ such that you can split the array into exactly $$$k$$$ subarrays ($$$k$$$ is the constant given to you in the beginning of the interaction) so that all the subarrays have the product of their length and their maximum equal to $$$m$$$, or determine that no such $$$m$$$ exists. Every element should belong in exactly one of the subarrays.<\/p><p>Cat doesn't know what he should do, so he asked you to play the game for him.<\/p><\/div><div><div class=\"section-title\">Interaction<\/div><p>Each test contains multiple test cases. The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 10^3$$$) \u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains two positive integers $$$n$$$ and $$$k$$$ ($$$1 \\leq k \\leq n \\leq 10^4$$$) \u2014 the length of the hidden array and the number of subarrays in the desired split.<\/p><p>Now you are allowed to make queries in the following way \u2014 print one line of the form \"$$$\\mathtt{?} \\ l \\ x$$$\" (it must hold that $$$1 \\leq l \\leq n$$$, $$$1 \\leq x \\leq 10^9$$$) and you will receive the smallest integer $$$r$$$ such that $$$l \\leq r \\leq n$$$ and $$$f(l, r) = x$$$, or $$$n + 1$$$ if no such $$$r$$$ exists. <\/p><p>If you want to print the answer, output \"$$$\\mathtt{!} \\ m$$$\" and you will recieve $$$1$$$ if your answer is correct and $$$-1$$$ otherwise. In the first case, the interaction continues with the next test case. Note that printing the answer doesn't count towards the number of queries made. <span class=\"tex-font-style-bf\">Please note that you don't receive the values for the next test case immediately, you will first have to read whether your answer to the last test case was correct.<\/span> <\/p><p>If you receive the integer $$$-1$$$ at any moment, it means your program has made an invalid query, exceeded the query limit, or gave an incorrect answer. Your program must terminate immediately to receive a <span class=\"tex-font-style-tt\">Wrong Answer<\/span> verdict. Otherwise, you can get an arbitrary verdict because your solution will continue to read from a closed stream. <\/p><p>After printing a query, do not forget to output end of line and flush the output. Otherwise, you will get <span class=\"tex-font-style-tt\">Idleness limit exceeded<\/span>. To do this, use:<\/p><ul> <li> <span class=\"tex-font-style-tt\">fflush(stdout)<\/span> or <span class=\"tex-font-style-tt\">cout.flush()<\/span> in C++; <\/li><li> <span class=\"tex-font-style-tt\">System.out.flush()<\/span> in Java; <\/li><li> <span class=\"tex-font-style-tt\">flush(output)<\/span> in Pascal; <\/li><li> <span class=\"tex-font-style-tt\">stdout.flush()<\/span> in Python; <\/li><li> see documentation for other languages. <\/li><\/ul><p>It is guaranteed that the total sum of $$$n$$$ over the test cases won't exceed $$$10^4$$$.<\/p><p><span class=\"tex-font-style-bf\">Hacks<\/span><\/p><p>The format of the hacks should be the following: the first line should contain one integer $$$t$$$ ($$$1 \\leq t \\leq 10^3$$$) \u2014 the number of test cases. The description of the test cases should follow.<\/p><p>The first line of each test case should contain two integers $$$n$$$ and $$$k$$$ ($$$1 \\leq k \\leq n \\leq 10^4$$$) \u2014 the length of the array $$$a$$$ and the number of subarrays you want to split it into.<\/p><p>The second line should contain $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n $$$ ($$$1 \\leq a_i \\leq n $$$). <\/p><p>The sum of $$$n$$$ over all test cases should not exceed $$$10^4$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n1 1\n\n1\n2 2\n\n1\n\n3\n\n1\n6 3\n\n7\n\n2\n\n3\n\n6\n\n1<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n! 1\n\n\n? 1 1\n\n? 2 1\n\n! -1\n\n\n? 1 9\n\n? 1 6\n\n? 3 6\n\n? 4 6\n\n! 6<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The hidden arrays in the three testcases are $$$[1]$$$, $$$[1, 2]$$$ and $$$[1, 3, 6, 1, 2, 1]$$$. In the second testcase, no split satisfies the constraints, so the answer is $$$-1$$$. <\/p><p>The answer for the first query of the third testcase is $$$7$$$ since no valid $$$r$$$ exists. For the second query of the third testcase, since $$$2 \\cdot \\max(1, 3) = 6$$$, we will get $$$2$$$ as the answer, since $$$r = 1$$$ doesn't satisfy the constraint.<\/p><p>The sample interaction guessed all three answers ($$$1, -1$$$ and $$$6$$$) correctly, so it received $$$1$$$ after each answer.<\/p><\/div><\/div>"}, {"contestId": 525, "index": "D", "name": "Arthur and Walls", "rating": 2400, "solvedCount": 2327, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Arthur and Walls<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Finally it is a day when Arthur has enough money for buying an apartment. He found a great option close to the center of the city with a nice price.<\/p><p>Plan of the apartment found by Arthur looks like a rectangle <span class=\"tex-span\"><i>n<\/i>\u2009\u00d7\u2009<i>m<\/i><\/span> consisting of squares of size <span class=\"tex-span\">1\u2009\u00d7\u20091<\/span>. Each of those squares contains either a wall (such square is denoted by a symbol \"<span class=\"tex-font-style-tt\">*<\/span>\" on the plan) or a free space (such square is denoted on the plan by a symbol \"<span class=\"tex-font-style-tt\">.<\/span>\").<\/p><p>Room in an apartment is a maximal connected area consisting of free squares. Squares are considered adjacent if they share a common side.<\/p><p>The old Arthur dream is to live in an apartment where all rooms are rectangles. He asks you to calculate minimum number of walls you need to remove in order to achieve this goal. After removing a wall from a square it becomes a free square. While removing the walls it is possible that some rooms unite into a single one.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains two integers <span class=\"tex-span\"><i>n<\/i>,\u2009<i>m<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>m<\/i>\u2009\u2264\u20092000<\/span>) denoting the size of the Arthur apartments.<\/p><p>Following <span class=\"tex-span\"><i>n<\/i><\/span> lines each contain <span class=\"tex-span\"><i>m<\/i><\/span> symbols \u2014 the plan of the apartment.<\/p><p>If the cell is denoted by a symbol \"<span class=\"tex-font-style-tt\">*<\/span>\" then it contains a wall.<\/p><p>If the cell is denoted by a symbol \"<span class=\"tex-font-style-tt\">.<\/span>\" then it this cell is free from walls and also this cell is contained in some of the rooms.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output <span class=\"tex-span\"><i>n<\/i><\/span> rows each consisting of <span class=\"tex-span\"><i>m<\/i><\/span> symbols that show how the Arthur apartment plan should look like after deleting the minimum number of walls in order to make each room (maximum connected area free from walls) be a rectangle. <\/p><p>If there are several possible answers, output any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 5<br/>.*.*.<br/>*****<br/>.*.*.<br/>*****<br/>.*.*.<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>.*.*.<br/>*****<br/>.*.*.<br/>*****<br/>.*.*.<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>6 7<br/>***.*.*<br/>..*.*.*<br/>*.*.*.*<br/>*.*.*.*<br/>..*...*<br/>*******<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>***...*<br/>..*...*<br/>..*...*<br/>..*...*<br/>..*...*<br/>*******<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 5<br/>.....<br/>.....<br/>..***<br/>..*..<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>.....<br/>.....<br/>.....<br/>.....<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1634, "index": "E", "name": "Fair Share", "rating": 2400, "solvedCount": 2325, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Fair Share<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><div class=\"epigraph\"><div class=\"epigraph-text\">Even a cat has things it can do that AI cannot.<\/div><div class=\"epigraph-source\">\u2014 Fei-Fei Li<\/div><\/div><p>You are given $$$m$$$ arrays of positive integers. Each array is of even length.<\/p><p>You need to split all these integers into two <span class=\"tex-font-style-bf\">equal<\/span> multisets $$$L$$$ and $$$R$$$, that is, each element of each array should go into one of two multisets (but not both). Additionally, for each of the $$$m$$$ arrays, <span class=\"tex-font-style-bf\">exactly half<\/span> of its elements should go into $$$L$$$, and the rest should go into $$$R$$$.<\/p><p>Give an example of such a division or determine that no such division exists.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$m$$$ ($$$1 \\le m \\le 10 ^ 5$$$)\u00a0\u2014 the number of arrays.<\/p><p>The next $$$2 \\cdot m$$$ lines contain descriptions of the arrays.<\/p><p>For each array, the first line contains an even integer $$$n$$$ ($$$2 \\le n \\le 2 \\cdot 10 ^ 5$$$)\u00a0\u2014 the length of the array. The second line consists of $$$n$$$ space-separated integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10 ^ 9$$$)\u00a0\u2014 array elements.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all arrays does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If the answer exists, print \"YES\", and then print $$$m$$$ lines.<\/p><p>On each line, for each element, print the letter \"L\" or \"R\" (capitalized, without spaces), depending on which multiset the element should go into.<\/p><p>If there is no answer, print \"NO\" on the only line.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n2\n1 2\n4\n1 2 3 3\n6\n1 1 2 2 3 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nRL\nLRLR\nRLLRRL\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first array, we add the first element to $$$R$$$ and the second to $$$L$$$. Now $$$L = \\{2\\}$$$, and $$$R = \\{1\\}$$$.<\/p><p>In the second array, we add the first and third elements to $$$L$$$ and the rest to $$$R$$$. Now $$$L = \\{1, 2, 3\\}$$$ and $$$R = \\{1, 2, 3\\}$$$.<\/p><p>In the third array, we add elements 2, 3, and 6 to $$$L$$$, and others\u00a0\u2014 to $$$R$$$. As a result, $$$L = R = \\{1, 1, 2, 2, 3, 3\\}$$$.<\/p><\/div><\/div>"}, {"contestId": 1720, "index": "D2", "name": "Xor-Subsequence (hard version)", "rating": 2400, "solvedCount": 2305, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D2. Xor-Subsequence (hard version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">It is the hard version of the problem. The only difference is that in this version $$$a_i \\le 10^9$$$.<\/span><\/p><p>You are given an array of $$$n$$$ integers $$$a_0, a_1, a_2, \\ldots a_{n - 1}$$$. Bryap wants to find the longest <span class=\"tex-font-style-bf\">beautiful<\/span> subsequence in the array.<\/p><p>An array $$$b = [b_0, b_1, \\ldots, b_{m-1}]$$$, where $$$0 \\le b_0  \\lt  b_1  \\lt  \\ldots  \\lt  b_{m - 1}  \\lt  n$$$, is a subsequence of length $$$m$$$ of the array $$$a$$$.<\/p><p>Subsequence $$$b = [b_0, b_1, \\ldots, b_{m-1}]$$$ of length $$$m$$$ is called <span class=\"tex-font-style-bf\">beautiful<\/span>, if the following condition holds: <\/p><ul> <li> For any $$$p$$$ ($$$0 \\le p  \\lt  m - 1$$$) holds: $$$a_{b_p} \\oplus b_{p+1}  \\lt  a_{b_{p+1}} \\oplus b_p$$$. <\/li><\/ul><p>Here $$$a \\oplus b$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#XOR\">bitwise XOR<\/a> of $$$a$$$ and $$$b$$$. For example, $$$2 \\oplus 4 = 6$$$ and $$$3 \\oplus 1=2$$$.<\/p><p>Bryap is a simple person so he only wants to know the length of the longest such subsequence. Help Bryap and find the answer to his question.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 10^5$$$) \u00a0\u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$2 \\leq n \\leq 3 \\cdot 10^5$$$) \u2014 the length of the array.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_0,a_1,...,a_{n-1}$$$ ($$$0 \\leq a_i \\leq 10^9$$$) \u2014 the elements of the array.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$3 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case print a single integer \u2014 the length of the longest <span class=\"tex-font-style-bf\">beautiful<\/span> subsequence.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 2 4 3 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 8 8 2 9 1 6 2 8 3<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n3\n6\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, we can pick the whole array as a beautiful subsequence because $$$1 \\oplus 1  \\lt  2 \\oplus 0$$$.<\/p><p>In the second test case, we can pick elements with indexes $$$1$$$, $$$2$$$ and $$$4$$$ (in $$$0$$$ indexation). For this elements holds: $$$2 \\oplus 2  \\lt  4 \\oplus 1$$$ and $$$4 \\oplus 4  \\lt  1 \\oplus 2$$$.<\/p><\/div><\/div>"}, {"contestId": 1137, "index": "D", "name": "Cooperative Game", "rating": 2400, "solvedCount": 2284, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Cooperative Game<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-it\">This is an interactive problem.<\/span><\/p><p>Misha likes to play cooperative games with incomplete information. Today he suggested ten his friends to play a cooperative game \"Lake\".<\/p><p>Misha has already come up with a field for the upcoming game. The field for this game is a directed graph consisting of two parts. The first part is a road along the coast of the lake which is a cycle of $$$c$$$ vertices. The second part is a path from home to the lake which is a chain of $$$t$$$ vertices, and there is an edge from the last vertex of this chain to the vertex of the road along the coast which has the most beautiful view of the lake, also known as the finish vertex. Misha decided to keep the field secret, so nobody knows neither $$$t$$$ nor $$$c$$$.<\/p><center> <img class=\"tex-graphics\" height=\"189px\" src=\"https://espresso.codeforces.com/af92f1219aedcbc53b754b15118dfe4ce5a1be84.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"408px\"/> <\/center><p>Note that each vertex of the field has exactly one outgoing edge and all the vertices except the home vertex and the finish vertex have exactly one ingoing edge. The home vertex has no incoming edges, the finish vertex has two incoming edges.<\/p><p>At the beginning of the game pieces of all the ten players, indexed with consecutive integers from $$$0$$$ to $$$9$$$, are at the home vertex. After that on each turn some of the players can ask Misha to simultaneously move their pieces along the corresponding edges. Misha will not answer more than $$$q$$$ such queries. After each move Misha will tell players whose pieces are at the same vertices and whose pieces are at different vertices.<\/p><p>The goal of the game is to move all the pieces to the finish vertex. Misha's friends have no idea how to win in such a game without knowledge of $$$c$$$, $$$t$$$ and $$$q$$$, but luckily they are your friends. Help them: coordinate their actions to win the game. <\/p><p>Misha has drawn such a field that $$$1 \\le t, c$$$, $$$(t+c) \\leq 1000$$$ and $$$q = 3 \\cdot (t+c)$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>There is no input\u00a0\u2014 go to the interaction part straight away.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>After all friends gather at the finish vertex, print \"<span class=\"tex-font-style-tt\">done<\/span>\" and terminate your program.<\/p><\/div><div><div class=\"section-title\">Interaction<\/div><p>To give a command to move the friends, print \"<span class=\"tex-font-style-tt\">next<\/span>\" and then space-separated indices of the friends you want to move. For example, to give the command to move the friends with indices $$$0$$$, $$$2$$$, $$$5$$$ and $$$9$$$ print \"<span class=\"tex-font-style-tt\">next 0 2 5 9<\/span>\". At each turn, you must move at least one of your friends.<\/p><p>As an answer, first read an integer $$$k$$$, and then $$$10$$$ digits divided into $$$k$$$ space-separated groups. The friends that correspond to the indices in the same group are in the same vertex. The friends that correspond to indices in different groups are in different vertices. The indices in each group follow in ascending order.<\/p><p>For example, the answer \"<span class=\"tex-font-style-tt\">2 05 12346789<\/span>\" means that the friends with indices $$$0$$$ and $$$5$$$ are in one vertex, and all other friends are in the same but different vertex. The answer \"<span class=\"tex-font-style-tt\">4 01 567 234 89<\/span>\" means that Misha's friends are in four different vertices: the friends with indices $$$0$$$ and $$$1$$$ are in the first, the friends with indices $$$5$$$, $$$6$$$ and $$$7$$$ are in the second, the friends with indices $$$2$$$, $$$3$$$ and $$$4$$$ are in the third, and the friends with indices $$$8$$$ and $$$9$$$ are in the fourth.<\/p><p>After printing a query do not forget to output end of line and flush the output. Otherwise you will get <span class=\"tex-font-style-tt\">Idleness limit exceeded<\/span>. To do this, use:<\/p><ul> <li> <span class=\"tex-font-style-tt\">fflush(stdout)<\/span> or <span class=\"tex-font-style-tt\">cout.flush()<\/span> in C++; <\/li><li> <span class=\"tex-font-style-tt\">System.out.flush()<\/span> in Java; <\/li><li> <span class=\"tex-font-style-tt\">flush(output)<\/span> in Pascal; <\/li><li> <span class=\"tex-font-style-tt\">stdout.flush()<\/span> in Python; <\/li><li> see documentation for other languages. <\/li><\/ul><p>Answer \"<span class=\"tex-font-style-tt\">stop<\/span>\" instead of a valid one means that you made an invalid query. Exit immediately after receiving \"<span class=\"tex-font-style-tt\">stop<\/span>\" and you will see <span class=\"tex-font-style-tt\">Wrong answer<\/span> verdict. Otherwise you can get an arbitrary verdict because your solution will continue to read from a closed stream.<\/p><p><span class=\"tex-font-style-bf\">Hacks<\/span><\/p><p>In order to hack, print two integers $$$t$$$ and $$$c$$$ in a single line ($$$1 \\le t, c$$$, $$$(t+c) \\leq 1000$$$).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2 05 12346789\n\n3 246789 135 0\n\n3 246789 0 135\n\n3 246789 0 135\n\n2 135 0246789\n\n1 0123456789\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nnext 0 5\n\nnext 0 1 3\n\nnext 2 3 0 1 4 5 6 7 8 9\n\nnext 9 8 7 6 5 4 3 2 1 0\n\nnext 0 1 3 5\n\nnext 1 3 5\n\ndone<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the sample input and output values are aligned only for simplicity of interpreting them chronologically. In real interaction no \"extra\" line breaks should appear.<\/p><p>In the example, the friends move as follows:<\/p><center> <img class=\"tex-graphics\" height=\"287px\" src=\"https://espresso.codeforces.com/5e7369269b460f4d6497aee10638d37077d49e30.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"756px\"/> <\/center><\/div><\/div>"}, {"contestId": 121, "index": "E", "name": "Lucky Array", "rating": 2400, "solvedCount": 2274, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Lucky Array<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p><span class=\"tex-font-style-underline\">Petya loves lucky numbers. Everybody knows that lucky numbers are positive integers whose decimal representation contains only the lucky digits <span class=\"tex-font-style-bf\">4<\/span> and <span class=\"tex-font-style-bf\">7<\/span>. For example, numbers <span class=\"tex-font-style-bf\">47<\/span>, <span class=\"tex-font-style-bf\">744<\/span>, <span class=\"tex-font-style-bf\">4<\/span> are lucky and <span class=\"tex-font-style-bf\">5<\/span>, <span class=\"tex-font-style-bf\">17<\/span>, <span class=\"tex-font-style-bf\">467<\/span> are not.<\/span><\/p><p>Petya has an array consisting of <span class=\"tex-span\"><i>n<\/i><\/span> numbers. He wants to perform <span class=\"tex-span\"><i>m<\/i><\/span> operations of two types: <\/p><ul> <li> <span class=\"tex-font-style-underline\">add <span class=\"tex-span\"><i>l<\/i><\/span> <span class=\"tex-span\"><i>r<\/i><\/span> <span class=\"tex-span\"><i>d<\/i><\/span><\/span> \u2014 add an integer <span class=\"tex-span\"><i>d<\/i><\/span> to all elements whose indexes belong to the interval from <span class=\"tex-span\"><i>l<\/i><\/span> to <span class=\"tex-span\"><i>r<\/i><\/span>, inclusive <span class=\"tex-span\">(1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009<i>n<\/i>,\u20091\u2009\u2264\u2009<i>d<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">4<\/sup>)<\/span>; <\/li><li> <span class=\"tex-font-style-underline\">count <span class=\"tex-span\"><i>l<\/i><\/span> <span class=\"tex-span\"><i>r<\/i><\/span><\/span> \u2014 find and print on the screen how many lucky numbers there are among elements with indexes that belong to the interval from <span class=\"tex-span\"><i>l<\/i><\/span> to <span class=\"tex-span\"><i>r<\/i><\/span> inclusive <span class=\"tex-span\">(1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009<i>n<\/i>)<\/span>. Each lucky number should be counted as many times as it appears in the interval. <\/li><\/ul><p>Petya has a list of all operations. The operations are such that after all additions the array won't have numbers that would exceed <span class=\"tex-span\">10<sup class=\"upper-index\">4<\/sup><\/span>. Help Petya write a program that would perform these operations.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>m<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the number of numbers in the array and the number of operations correspondingly. The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> positive integers, none of which exceeds <span class=\"tex-span\">10<sup class=\"upper-index\">4<\/sup><\/span> \u2014 those are the array numbers. Next <span class=\"tex-span\"><i>m<\/i><\/span> lines contain operations, one per line. They correspond to the description given in the statement.<\/p><p>It is guaranteed that after all operations are fulfilled each number in the array will not exceed <span class=\"tex-span\">10<sup class=\"upper-index\">4<\/sup><\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each operation of the second type print the single number on the single line \u2014 the number of lucky numbers in the corresponding interval.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 6<br/>2 3 4<br/>count 1 3<br/>count 1 2<br/>add 1 3 2<br/>count 1 3<br/>add 2 3 3<br/>count 1 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/>0<br/>1<br/>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 5<br/>4 4 4 4<br/>count 1 4<br/>add 1 4 3<br/>count 1 4<br/>add 2 3 40<br/>count 1 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/>4<br/>4<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample after the first addition the array will look in the following manner:<\/p><p><span class=\"tex-font-style-tt\">4 5 6<\/span><\/p><p>After the second addition:<\/p><p><span class=\"tex-font-style-tt\">4 8 9<\/span><\/p><p>The second sample after the first addition:<\/p><p><span class=\"tex-font-style-tt\">7 7 7 7<\/span><\/p><p>After the second addition:<\/p><p><span class=\"tex-font-style-tt\">7 47 47 7<\/span><\/p><\/div><\/div>"}, {"contestId": 912, "index": "E", "name": "Prime Gift", "rating": 2400, "solvedCount": 2264, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Prime Gift<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Opposite to Grisha's nice behavior, Oleg, though he has an entire year at his disposal, didn't manage to learn how to solve number theory problems in the past year. That's why instead of Ded Moroz he was visited by his teammate Andrew, who solemnly presented him with a set of <span class=\"tex-span\"><i>n<\/i><\/span> <span class=\"tex-font-style-bf\">distinct prime<\/span> numbers alongside with a simple task: Oleg is to find the <span class=\"tex-span\"><i>k<\/i><\/span>-th smallest integer, such that <span class=\"tex-font-style-bf\">all<\/span> its prime divisors are in this set. <\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200916<\/span>).<\/p><p>The next line lists <span class=\"tex-span\"><i>n<\/i><\/span> distinct prime numbers <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>p<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>p<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009100<\/span>) in ascending order.<\/p><p>The last line gives a single integer <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>k<\/i><\/span>). It is guaranteed that the <span class=\"tex-span\"><i>k<\/i><\/span>-th smallest integer such that all its prime divisors are in this set does not exceed <span class=\"tex-span\">10<sup class=\"upper-index\">18<\/sup><\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single line featuring the <span class=\"tex-span\"><i>k<\/i><\/span>-th smallest integer. It's guaranteed that the answer doesn't exceed <span class=\"tex-span\">10<sup class=\"upper-index\">18<\/sup><\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>2 3 5<br/>7<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>8<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>3 7 11 13 31<br/>17<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>93<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The list of numbers with all prime divisors inside <span class=\"tex-span\">{2,\u20093,\u20095}<\/span> begins as follows:<\/p><p><span class=\"tex-span\">(1,\u20092,\u20093,\u20094,\u20095,\u20096,\u20098,\u2009...)<\/span><\/p><p>The seventh number in this list (<span class=\"tex-span\">1<\/span>-indexed) is eight.<\/p><\/div><\/div>"}, {"contestId": 1469, "index": "E", "name": "A Bit Similar", "rating": 2400, "solvedCount": 2259, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. A Bit Similar<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>1024 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Let's call two strings $$$a$$$ and $$$b$$$ (both of length $$$k$$$) <span class=\"tex-font-style-it\">a bit similar<\/span> if they have the same character in some position, i.\u00a0e. there exists at least one $$$i \\in [1, k]$$$ such that $$$a_i = b_i$$$.<\/p><p>You are given a binary string $$$s$$$ of length $$$n$$$ (a string of $$$n$$$ characters <span class=\"tex-font-style-tt\">0<\/span> and/or <span class=\"tex-font-style-tt\">1<\/span>) and an integer $$$k$$$. Let's denote the string $$$s[i..j]$$$ as the substring of $$$s$$$ starting from the $$$i$$$-th character and ending with the $$$j$$$-th character (that is, $$$s[i..j] = s_i s_{i + 1} s_{i + 2} \\dots s_{j - 1} s_j$$$).<\/p><p>Let's call a binary string $$$t$$$ of length $$$k$$$ <span class=\"tex-font-style-it\">beautiful<\/span> if it is <span class=\"tex-font-style-it\">a bit similar<\/span> to all substrings of $$$s$$$ having length exactly $$$k$$$; that is, it is <span class=\"tex-font-style-it\">a bit similar<\/span> to $$$s[1..k], s[2..k+1], \\dots, s[n-k+1..n]$$$.<\/p><p>Your goal is to find the <span class=\"tex-font-style-bf\">lexicographically<\/span> smallest string $$$t$$$ that is <span class=\"tex-font-style-it\">beautiful<\/span>, or report that no such string exists. String $$$x$$$ is lexicographically less than string $$$y$$$ if either $$$x$$$ is a prefix of $$$y$$$ (and $$$x \\ne y$$$), or there exists such $$$i$$$ ($$$1 \\le i \\le \\min(|x|, |y|)$$$), that $$$x_i  \\lt  y_i$$$, and for any $$$j$$$ ($$$1 \\le j  \\lt  i$$$) $$$x_j = y_j$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$q$$$ ($$$1 \\le q \\le 10000$$$) \u2014 the number of test cases. Each test case consists of two lines.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le k \\le n \\le 10^6$$$). The second line contains the string $$$s$$$, consisting of $$$n$$$ characters (each character is either <span class=\"tex-font-style-tt\">0<\/span> or <span class=\"tex-font-style-tt\">1<\/span>).<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$10^6$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print the answer as follows:<\/p><ul> <li> if it is impossible to construct a <span class=\"tex-font-style-it\">beautiful<\/span> string, print one line containing the string <span class=\"tex-font-style-tt\">NO<\/span> (note: <span class=\"tex-font-style-bf\">exactly in upper case<\/span>, you can't print <span class=\"tex-font-style-tt\">No<\/span>, for example); <\/li><li> otherwise, print two lines. The first line should contain the string <span class=\"tex-font-style-tt\">YES<\/span> (exactly in upper case as well); the second line \u2014 the lexicographically smallest <span class=\"tex-font-style-it\">beautiful<\/span> string, consisting of $$$k$$$ characters <span class=\"tex-font-style-tt\">0<\/span> and/or <span class=\"tex-font-style-tt\">1<\/span>. <\/li><\/ul><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7\n4 2\n0110\n4 2\n1001\n9 3\n010001110\n9 3\n101110001\n10 3\n0101110001\n10 10\n1111111111\n11 10\n11111111110\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\n11\nYES\n00\nYES\n010\nYES\n101\nNO\nYES\n0000000001\nYES\n0000000010\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 916, "index": "E", "name": "Jamie and Tree", "rating": 2400, "solvedCount": 2255, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Jamie and Tree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-it\">To your surprise, Jamie is the final boss! Ehehehe.<\/span><\/p><p>Jamie has given you a tree with <span class=\"tex-span\"><i>n<\/i><\/span> vertices, numbered from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span>. Initially, the root of the tree is the vertex with number <span class=\"tex-span\">1<\/span>. Also, each vertex has a value on it.<\/p><p>Jamie also gives you three types of queries on the tree:<\/p><p><span class=\"tex-span\">1 <i>v<\/i><\/span>\u00a0\u2014 Change the tree's root to vertex with number <span class=\"tex-span\"><i>v<\/i><\/span>.<\/p><p><span class=\"tex-span\">2 <i>u<\/i> <i>v<\/i> <i>x<\/i><\/span>\u00a0\u2014 For each vertex in the subtree of smallest size that contains <span class=\"tex-span\"><i>u<\/i><\/span> and <span class=\"tex-span\"><i>v<\/i><\/span>, add <span class=\"tex-span\"><i>x<\/i><\/span> to its value.<\/p><p><span class=\"tex-span\">3 <i>v<\/i><\/span>\u00a0\u2014 Find sum of values of vertices in the subtree of vertex with number <span class=\"tex-span\"><i>v<\/i><\/span>.<\/p><p>A subtree of vertex <span class=\"tex-span\"><i>v<\/i><\/span> is a set of vertices such that <span class=\"tex-span\"><i>v<\/i><\/span> lies on shortest path from this vertex to root of the tree. Pay attention that subtree of a vertex can change after changing the tree's root.<\/p><p>Show your strength in programming to Jamie by performing the queries accurately!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains two space-separated integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>q<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>,\u20091\u2009\u2264\u2009<i>q<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>)\u00a0\u2014 the number of vertices in the tree and the number of queries to process respectively.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> space-separated integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">\u2009-\u200910<sup class=\"upper-index\">8<\/sup>\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">8<\/sup><\/span>)\u00a0\u2014 initial values of the vertices.<\/p><p>Next <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> lines contains two space-separated integers <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>) describing edge between vertices <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> in the tree.<\/p><p>The following <span class=\"tex-span\"><i>q<\/i><\/span> lines describe the queries.<\/p><p>Each query has one of following formats depending on its type:<\/p><p><span class=\"tex-span\">1 <i>v<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>v<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>) for queries of the first type.<\/p><p><span class=\"tex-span\">2 <i>u<\/i> <i>v<\/i> <i>x<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>u<\/i>,\u2009<i>v<\/i>\u2009\u2264\u2009<i>n<\/i>,\u2009\u2009-\u200910<sup class=\"upper-index\">8<\/sup>\u2009\u2264\u2009<i>x<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">8<\/sup><\/span>) for queries of the second type.<\/p><p><span class=\"tex-span\">3 <i>v<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>v<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>) for queries of the third type.<\/p><p>All numbers in queries' descriptions are integers.<\/p><p>The queries must be carried out in the given order. It is guaranteed that the tree is valid.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query of the third type, output the required answer. It is guaranteed that at least one query of the third type is given by Jamie.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>6 7<br/>1 4 2 8 5 7<br/>1 2<br/>3 1<br/>4 3<br/>4 5<br/>3 6<br/>3 1<br/>2 4 6 3<br/>3 4<br/>1 6<br/>2 2 4 -5<br/>1 4<br/>3 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>27<br/>19<br/>5<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 6<br/>4 3 5 6<br/>1 2<br/>2 3<br/>3 4<br/>3 1<br/>1 3<br/>2 2 4 3<br/>1 1<br/>2 2 4 -3<br/>3 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>18<br/>21<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The following picture shows how the tree varies after the queries in the first sample. <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/6ec243c9d34a8b628cfad6c9cf4d01e24b1219f1.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 1981,

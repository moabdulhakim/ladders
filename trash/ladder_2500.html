<script>
    const PROBLEMS = [{"contestId": 868, "index": "F", "name": "Yet Another Minimization Problem", "rating": 2500, "solvedCount": 5591, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Yet Another Minimization Problem<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array of <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>... <i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span>. The cost of a subsegment is the number of unordered pairs of distinct indices within the subsegment that contain equal elements. Split the given array into <span class=\"tex-span\"><i>k<\/i><\/span> non-intersecting non-empty subsegments so that the sum of their costs is minimum possible. Each element should be present in exactly one subsegment.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>, <span class=\"tex-span\">2\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u2009<i>min<\/i> (<i>n<\/i>,\u200920))<\/span> \u00a0\u2014 the length of the array and the number of segments you need to split the array into.<\/p><p>The next line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>)\u00a0\u2014 the elements of the array.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print single integer: the minimum possible total cost of resulting subsegments.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>7 3<br/>1 1 3 3 3 2 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>10 2<br/>1 2 1 2 1 2 1 2 1 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>8<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>13 3<br/>1 2 2 2 1 2 1 1 1 2 2 1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>9<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example it's optimal to split the sequence into the following three subsegments: <span class=\"tex-span\">[1]<\/span>, <span class=\"tex-span\">[1,\u20093]<\/span>, <span class=\"tex-span\">[3,\u20093,\u20092,\u20091]<\/span>. The costs are <span class=\"tex-span\">0<\/span>, <span class=\"tex-span\">0<\/span> and <span class=\"tex-span\">1<\/span>, thus the answer is <span class=\"tex-span\">1<\/span>.<\/p><p>In the second example it's optimal to split the sequence in two equal halves. The cost for each half is <span class=\"tex-span\">4<\/span>.<\/p><p>In the third example it's optimal to split the sequence in the following way: <span class=\"tex-span\">[1,\u20092,\u20092,\u20092,\u20091]<\/span>, <span class=\"tex-span\">[2,\u20091,\u20091,\u20091,\u20092]<\/span>, <span class=\"tex-span\">[2,\u20091,\u20091]<\/span>. The costs are <span class=\"tex-span\">4<\/span>, <span class=\"tex-span\">4<\/span>, <span class=\"tex-span\">1<\/span>.<\/p><\/div><\/div>"}, {"contestId": 55, "index": "D", "name": "Beautiful numbers", "rating": 2500, "solvedCount": 4939, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Beautiful numbers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Volodya is an odd boy and his taste is strange as well. It seems to him that a positive integer number is <span class=\"tex-font-style-it\">beautiful<\/span> if and only if it is divisible by each of its nonzero digits. We will not argue with this and just count the quantity of beautiful numbers in given ranges.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains the number of cases <span class=\"tex-span\"><i>t<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>t<\/i>\u2009\u2264\u200910<\/span>). Each of the next <span class=\"tex-span\"><i>t<\/i><\/span> lines contains two natural numbers <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u20099\u2009\u00b710<sup class=\"upper-index\">18<\/sup><\/span>).<\/p><p>Please, do not use <span class=\"tex-font-style-tt\">%lld<\/span> specificator to read or write 64-bit integers in C++. It is preffered to use <span class=\"tex-font-style-tt\">cin<\/span> (also you may use <span class=\"tex-font-style-tt\">%I64d<\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output should contain <span class=\"tex-span\"><i>t<\/i><\/span> numbers \u2014 answers to the queries, one number per line \u2014 quantities of beautiful numbers in given intervals (from <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> to <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, inclusively).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>1<br/>1 9<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>9<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>1<br/>12 15<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 508, "index": "D", "name": "Tanya and Password", "rating": 2500, "solvedCount": 4565, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Tanya and Password<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>While dad was at work, a little girl Tanya decided to play with dad's password to his secret database. Dad's password is a string consisting of <span class=\"tex-span\"><i>n<\/i>\u2009+\u20092<\/span> characters. She has written all the possible <span class=\"tex-span\"><i>n<\/i><\/span> three-letter continuous substrings of the password on pieces of paper, one for each piece of paper, and threw the password out. Each three-letter substring was written the number of times it occurred in the password. Thus, Tanya ended up with <span class=\"tex-span\"><i>n<\/i><\/span> pieces of paper.<\/p><p>Then Tanya realized that dad will be upset to learn about her game and decided to restore the password or at least any string corresponding to the final set of three-letter strings. You have to help her in this difficult task. We know that dad's password consisted of lowercase and uppercase letters of the Latin alphabet and digits. Uppercase and lowercase letters of the Latin alphabet are considered distinct.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20092\u00b710<sup class=\"upper-index\">5<\/sup><\/span>), the number of three-letter substrings Tanya got. <\/p><p>Next <span class=\"tex-span\"><i>n<\/i><\/span> lines contain three letters each, forming the substring of dad's password. Each character in the input is a lowercase or uppercase Latin letter or a digit.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If Tanya made a mistake somewhere during the game and the strings that correspond to the given set of substrings don't exist, print \"<span class=\"tex-font-style-tt\">NO<\/span>\". <\/p><p>If it is possible to restore the string that corresponds to given set of substrings, print \"<span class=\"tex-font-style-tt\">YES<\/span>\", and then print any suitable password option.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>aca<br/>aba<br/>aba<br/>cab<br/>bac<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/>abacaba<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>abc<br/>bCb<br/>cb1<br/>b13<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>NO<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>7<br/>aaa<br/>aaa<br/>aaa<br/>aaa<br/>aaa<br/>aaa<br/>aaa<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/>aaaaaaaaa<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 840, "index": "D", "name": "Destiny", "rating": 2500, "solvedCount": 4247, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Destiny<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Once, Leha found in the left pocket an array consisting of <span class=\"tex-span\"><i>n<\/i><\/span> integers, and in the right pocket <span class=\"tex-span\"><i>q<\/i><\/span> queries of the form <span class=\"tex-span\"><i>l<\/i><\/span> <span class=\"tex-span\"><i>r<\/i><\/span> <span class=\"tex-span\"><i>k<\/i><\/span>. If there are queries, then they must be answered. Answer for the query is minimal <span class=\"tex-span\"><i>x<\/i><\/span> such that <span class=\"tex-span\"><i>x<\/i><\/span> occurs in the interval <span class=\"tex-span\"><i>l<\/i><\/span> <span class=\"tex-span\"><i>r<\/i><\/span> strictly more than <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/1813bf6490bb8f36c4f992c566679ba42af3f072.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> times or <span class=\"tex-span\">\u2009-\u20091<\/span> if there is no such number. Help Leha with such a difficult task.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>First line of input data contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>q<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>q<\/i>\u2009\u2264\u20093\u00b710<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 number of elements in the array and number of queries respectively.<\/p><p>Next line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>) \u2014 Leha's array.<\/p><p>Each of next <span class=\"tex-span\"><i>q<\/i><\/span> lines contains three integers <span class=\"tex-span\"><i>l<\/i><\/span>, <span class=\"tex-span\"><i>r<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009<i>n<\/i>,\u20092\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u20095<\/span>) \u2014 description of the queries.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output answer for each query in new line.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 2<br/>1 1 2 2<br/>1 3 2<br/>1 4 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/>-1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 3<br/>1 2 1 3 2<br/>2 5 3<br/>1 2 3<br/>5 5 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/>1<br/>2<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 911, "index": "G", "name": "Mass Change Queries", "rating": 2500, "solvedCount": 4052, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. Mass Change Queries<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array <span class=\"tex-span\"><i>a<\/i><\/span> consisting of <span class=\"tex-span\"><i>n<\/i><\/span> integers. You have to process <span class=\"tex-span\"><i>q<\/i><\/span> queries to this array; each query is given as four numbers <span class=\"tex-span\"><i>l<\/i><\/span>, <span class=\"tex-span\"><i>r<\/i><\/span>, <span class=\"tex-span\"><i>x<\/i><\/span> and <span class=\"tex-span\"><i>y<\/i><\/span>, denoting that for every <span class=\"tex-span\"><i>i<\/i><\/span> such that <span class=\"tex-span\"><i>l<\/i>\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>r<\/i><\/span> and <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009=\u2009<i>x<\/i><\/span> you have to set <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> equal to <span class=\"tex-span\"><i>y<\/i><\/span>.<\/p><p>Print the array after all queries are processed.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009200000<\/span>) \u2014 the size of array <span class=\"tex-span\"><i>a<\/i><\/span>.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub><\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">2<\/sub><\/span>, ..., <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009100<\/span>) \u2014 the elements of array <span class=\"tex-span\"><i>a<\/i><\/span>.<\/p><p>The third line contains one integer <span class=\"tex-span\"><i>q<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>q<\/i>\u2009\u2264\u2009200000<\/span>) \u2014 the number of queries you have to process.<\/p><p>Then <span class=\"tex-span\"><i>q<\/i><\/span> lines follow. <span class=\"tex-span\"><i>i<\/i><\/span>-th line contains four integers <span class=\"tex-span\"><i>l<\/i><\/span>, <span class=\"tex-span\"><i>r<\/i><\/span>, <span class=\"tex-span\"><i>x<\/i><\/span> and <span class=\"tex-span\"><i>y<\/i><\/span> denoting <span class=\"tex-span\"><i>i<\/i><\/span>-th query (<span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i>,\u2009<i>y<\/i>\u2009\u2264\u2009100<\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>n<\/i><\/span> integers \u2014 elements of array <span class=\"tex-span\"><i>a<\/i><\/span> after all changes are made.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1 2 3 4 5<br/>3<br/>3 5 3 5<br/>1 5 5 1<br/>1 5 1 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>5 2 5 4 5 <\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1100, "index": "F", "name": "Ivan and Burgers", "rating": 2500, "solvedCount": 4026, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Ivan and Burgers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Ivan loves burgers and spending money. There are $$$n$$$ burger joints on the street where Ivan lives. Ivan has $$$q$$$ friends, and the $$$i$$$-th friend suggested to meet at the joint $$$l_i$$$ and walk to the joint $$$r_i$$$ $$$(l_i \\leq r_i)$$$. While strolling with the $$$i$$$-th friend Ivan can visit all joints $$$x$$$ which satisfy $$$l_i \\leq x \\leq r_i$$$.<\/p><p>For each joint Ivan knows the cost of the most expensive burger in it, it costs $$$c_i$$$ burles. Ivan wants to visit some subset of joints on his way, in each of them he will buy the most expensive burger and spend the most money. But there is a small issue: his card broke and instead of charging him for purchases, the amount of money on it changes as follows.<\/p><p>If Ivan had $$$d$$$ burles before the purchase and he spent $$$c$$$ burles at the joint, then after the purchase he would have $$$d \\oplus c$$$ burles, where $$$\\oplus$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#XOR\">bitwise XOR operation<\/a>.<\/p><p>Currently Ivan has $$$2^{2^{100}} - 1$$$ burles and he wants to go out for a walk. Help him to determine the maximal amount of burles he can spend if he goes for a walk with the friend $$$i$$$. The amount of burles he spends is defined as the difference between the initial amount on his account and the final account.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$1 \\leq n \\leq 500\\,000$$$) \u2014 the number of burger shops.<\/p><p>The next line contains $$$n$$$ integers $$$c_1, c_2, \\ldots, c_n$$$ ($$$0 \\leq c_i \\leq 10^6$$$), where $$$c_i$$$ \u2014 the cost of the most expensive burger in the burger joint $$$i$$$.<\/p><p>The third line contains one integer $$$q$$$ ($$$1 \\leq q \\leq 500\\,000$$$) \u2014 the number of Ivan's friends.<\/p><p>Each of the next $$$q$$$ lines contain two integers $$$l_i$$$ and $$$r_i$$$ ($$$1 \\leq l_i \\leq r_i \\leq n$$$) \u2014 pairs of numbers of burger shops between which Ivan will walk. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output $$$q$$$ lines, $$$i$$$-th of which containing the maximum amount of money Ivan can spend with the friend $$$i$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>7 2 3 4<br/>3<br/>1 4<br/>2 3<br/>1 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>7<br/>3<br/>7<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>12 14 23 13 7<br/>15<br/>1 1<br/>1 2<br/>1 3<br/>1 4<br/>1 5<br/>2 2<br/>2 3<br/>2 4<br/>2 5<br/>3 3<br/>3 4<br/>3 5<br/>4 4<br/>4 5<br/>5 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>12<br/>14<br/>27<br/>27<br/>31<br/>14<br/>25<br/>26<br/>30<br/>23<br/>26<br/>29<br/>13<br/>13<br/>7<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test, in order to spend the maximum amount of money with the first and third friends, Ivan just needs to go into the first burger. With a second friend, Ivan just go to the third burger.<\/p><p>In the second test for a third friend (who is going to walk from the first to the third burger), there are only 8 options to spend money \u2014 $$$0$$$, $$$12$$$, $$$14$$$, $$$23$$$, $$$12 \\oplus 14 = 2$$$, $$$14 \\oplus 23 = 25$$$, $$$12 \\oplus 23 = 27$$$, $$$12 \\oplus 14 \\oplus 23 = 20$$$. The maximum amount of money it turns out to spend, if you go to the first and third burger \u2014 $$$12 \\oplus 23 = 27$$$.<\/p><\/div><\/div>"}, {"contestId": 2152, "index": "F", "name": "Triple Attack", "rating": 2500, "solvedCount": 3928, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Triple Attack<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>1024 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p> <\/p><p>Zeus is analyzing a replay of the fight to understand his opponent's attack patterns. The opponent has a special ability: if they land three attacks on a target within a time frame of $$$z$$$, their third attack becomes a powerful, boosted attack.<\/p><p>To outplay his opponent, Zeus should not let his opponent trigger their boosted attack. Let $$$Y = \\{y_1, y_2, \\ldots, y_m\\}$$$ be the multiset of $$$m$$$ timestamps, where each $$$y_i$$$ represents the time when the opponent's attack landed. We call $$$Y$$$ to be <span class=\"tex-font-style-bf\">safe<\/span> if for every three timestamps $$$\\{y_i, y_j, y_k\\}$$$ such that $$$1 \\le i  \\lt  j  \\lt  k \\le m$$$, it holds that $$$\\max(y_i, y_j, y_k) - \\min(y_i, y_j, y_k)  \\gt  z$$$, where $$$z$$$ is the duration of the time frame that is given to you as an input.<\/p><p>Zeus has a log of $$$n$$$ timestamps, $$$x_1, x_2, \\ldots, x_n$$$, representing when the opponent's attacks landed. The timestamps are <span class=\"tex-font-style-bf\">sorted in nondecreasing order<\/span> of occurrence. In other words, $$$x_i \\le x_{i+1}$$$ for all $$$1 \\le i  \\lt  n$$$. <\/p><p>Zeus has $$$q$$$ intervals of interest, denoted as two integers $$$1 \\le l \\le r \\le n$$$. For each interval, Zeus wants to find the maximum number of attacks among $$$[x_l, x_{l+1}, \\ldots, x_r]$$$ that he could have let through: In other words, Zeus wants to find a maximum size subset of the multiset $$$\\{x_l, x_{l+1}, \\ldots, x_r\\}$$$ such that the subset is <span class=\"tex-font-style-bf\">safe<\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 20\\,000$$$). The description of the test cases follows. <\/p><p>The first line contains two integers $$$n$$$ and $$$z$$$ ($$$1 \\le n \\le 250\\,000$$$, $$$1 \\le z \\le 10^9$$$).<\/p><p>The second line contains $$$n$$$ integers $$$x_1, x_2, \\ldots, x_n$$$ ($$$1 \\le x_i \\le 10^9$$$)\u00a0\u2014 the timestamps of the opponent's attacks. It is guaranteed that the array $$$x$$$ is sorted, i.e., $$$x_i \\le x_{i+1}$$$ for all $$$1 \\le i  \\lt  n$$$.<\/p><p>The third line contains a single integer $$$q$$$ ($$$1 \\le q \\le 250\\,000$$$).<\/p><p>The next $$$q$$$ lines each contain two integers $$$l$$$ and $$$r$$$ ($$$1 \\le l \\le r \\le n$$$)\u00a0\u2014 the endpoints of the interval.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$250\\,000$$$. <\/p><p>It is guaranteed that the sum of $$$q$$$ over all test cases does not exceed $$$250\\,000$$$. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each of the $$$q$$$ queries, print a single integer\u00a0\u2014 the maximum size of a safe subset of attack timestamps in the given interval.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">6 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 5 7 8 11 12<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">6 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 1 1 3 3 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">12 15<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 5 15 24 27 32 36 39 40 46 48 48<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">20<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 12<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 11<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">8 12<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">11 12<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">9 12<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">9 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 12<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 12<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 12<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">10 11<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n<div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2<\/div><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first query of the first test case, we consider the timestamps $$$\\{1, 5, 7, 8, 11, 12\\}$$$ with $$$z=10$$$. The subset $$$\\{1, 5, 12\\}$$$ is safe because its only triplet satisfies $$$12 - 1 = 11  \\gt  10$$$. It's impossible to form a safe subset of size $$$4$$$, hence the answer to this query is $$$3$$$.<\/p><p>In the first query of the second test case, we consider the timestamps $$$\\{1\\}$$$ with $$$z=1$$$. The entire set $$$\\{1\\}$$$ is safe because there are no triplets. Hence the answer to this query is $$$1$$$.<\/p><p>In the second query of the second test case, we consider the timestamps $$$\\{1,1,1,3,3,3\\}$$$ with $$$z=1$$$.<\/p><p>The subset $$$S = \\{1,1,3,3\\}$$$ is safe because: <\/p><ul> <li> For the triple $$$(i,j,k) = (1,2,3)$$$, $$$\\max(1,1,3) - \\min(1,1,3) = 2  \\gt  1$$$. <\/li><li> For the triple $$$(i,j,k) = (1,2,4)$$$, $$$\\max(1,1,3) - \\min(1,1,3) = 2  \\gt  1$$$. <\/li><li> For the triple $$$(i,j,k) = (1,3,4)$$$, $$$\\max(1,3,3) - \\min(1,3,3) = 2  \\gt  1$$$. <\/li><li> For the triple $$$(i,j,k) = (2,3,4)$$$, $$$\\max(1,3,3) - \\min(1,3,3) = 2  \\gt  1$$$. <\/li><\/ul><p>It's impossible to form a safe subset of size $$$5$$$, hence the answer to this query is $$$4$$$.<\/p><\/div><\/div>"}, {"contestId": 1375, "index": "E", "name": "Inversion SwapSort", "rating": 2500, "solvedCount": 3531, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Inversion SwapSort<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Madeline has an array $$$a$$$ of $$$n$$$ integers. A pair $$$(u, v)$$$ of integers forms an inversion in $$$a$$$ if:<\/p><ul> <li> $$$1 \\le u  \\lt  v \\le n$$$. <\/li><li> $$$a_u  \\gt  a_v$$$. <\/li><\/ul><p>Madeline recently found a magical paper, which allows her to write two indices $$$u$$$ and $$$v$$$ and swap the values $$$a_u$$$ and $$$a_v$$$. Being bored, she decided to write a list of pairs $$$(u_i, v_i)$$$ with the following conditions:<\/p><ul> <li> all the pairs in the list are distinct and form an inversion in $$$a$$$. <\/li><li> all the pairs that form an inversion in $$$a$$$ are in the list. <\/li><li> Starting from the given array, if you swap the values at indices $$$u_1$$$ and $$$v_1$$$, then the values at indices $$$u_2$$$ and $$$v_2$$$ and so on, then after all pairs are processed, the array $$$a$$$ will be sorted in <span class=\"tex-font-style-bf\">non-decreasing order<\/span>. <\/li><\/ul><p>Construct such a list or determine that no such list exists. If there are multiple possible answers, you may find any of them.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains a single integer $$$n$$$ ($$$1 \\le n \\le 1000$$$) \u2014 the length of the array.<\/p><p>Next line contains $$$n$$$ integers $$$a_1,a_2,...,a_n$$$ $$$(1 \\le a_i \\le 10^9)$$$ \u00a0\u2014 elements of the array.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-font-style-tt\">-1<\/span> if no such list exists. Otherwise in the first line you should print a single integer $$$m$$$ ($$$0 \\le m \\le \\dfrac{n(n-1)}{2}$$$) \u2014 number of pairs in the list.<\/p><p>The $$$i$$$-th of the following $$$m$$$ lines should contain two integers $$$u_i, v_i$$$ ($$$1 \\le u_i  \\lt  v_i\\le n$$$).<\/p><p>If there are multiple possible answers, you may find any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n3 1 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n1 3\n1 2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n1 8 1 6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n2 4\n2 3\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n1 1 1 2 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample test case the array will change in this order $$$[3,1,2] \\rightarrow [2,1,3] \\rightarrow [1,2,3]$$$.<\/p><p>In the second sample test case it will be $$$[1,8,1,6] \\rightarrow [1,6,1,8] \\rightarrow [1,1,6,8]$$$.<\/p><p>In the third sample test case the array is already sorted.<\/p><\/div><\/div>"}, {"contestId": 1305, "index": "F", "name": "Kuroni and the Punishment", "rating": 2500, "solvedCount": 3422, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Kuroni and the Punishment<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Kuroni is very angry at the other setters for using him as a theme! As a punishment, he forced them to solve the following problem:<\/p><p>You have an array $$$a$$$ consisting of $$$n$$$ positive integers. An operation consists of choosing an element and either adding $$$1$$$ to it or subtracting $$$1$$$ from it, such that the element remains positive. We say the array is <span class=\"tex-font-style-bf\">good<\/span> if the greatest common divisor of all its elements is not $$$1$$$. Find the minimum number of operations needed to make the array good.<\/p><p>Unable to match Kuroni's intellect, the setters failed to solve the problem. Help them escape from Kuroni's punishment!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$n$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$) \u00a0\u2014 the number of elements in the array.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$. ($$$1 \\le a_i \\le 10^{12}$$$) \u00a0\u2014 the elements of the array.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u00a0\u2014 the minimum number of operations required to make the array good.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n6 2 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n9 8 7 3 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, the first array is already good, since the greatest common divisor of all the elements is $$$2$$$.<\/p><p>In the second example, we may apply the following operations:<\/p><ol> <li> Add $$$1$$$ to the second element, making it equal to $$$9$$$. <\/li><li> Subtract $$$1$$$ from the third element, making it equal to $$$6$$$. <\/li><li> Add $$$1$$$ to the fifth element, making it equal to $$$2$$$. <\/li><li> Add $$$1$$$ to the fifth element again, making it equal to $$$3$$$. <\/li><\/ol><p>The greatest common divisor of all elements will then be equal to $$$3$$$, so the array will be good. It can be shown that no sequence of three or less operations can make the array good.<\/p><\/div><\/div>"}, {"contestId": 484, "index": "E", "name": "Sign on Fence", "rating": 2500, "solvedCount": 3281, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Sign on Fence<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Bizon the Champion has recently finished painting his wood fence. The fence consists of a sequence of <span class=\"tex-span\"><i>n<\/i><\/span> panels of <span class=\"tex-span\">1<\/span> meter width and of arbitrary height. The <span class=\"tex-span\"><i>i<\/i><\/span>-th panel's height is <span class=\"tex-span\"><i>h<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> meters. The adjacent planks follow without a gap between them.<\/p><p>After Bizon painted the fence he decided to put a \"for sale\" sign on it. The sign will be drawn on a rectangular piece of paper and placed on the fence so that the sides of the sign are parallel to the fence panels and are also aligned with the edges of some panels. Bizon the Champion introduced the following constraints for the sign position:<\/p><ol> <li> The width of the sign should be exactly <span class=\"tex-span\"><i>w<\/i><\/span> meters. <\/li><li> The sign must fit into the segment of the fence from the <span class=\"tex-span\"><i>l<\/i><\/span>-th to the <span class=\"tex-span\"><i>r<\/i><\/span>-th panels, inclusive (also, it can't exceed the fence's bound in vertical direction). <\/li><\/ol><p>The sign will be really pretty, So Bizon the Champion wants the sign's height to be as large as possible.<\/p><p>You are given the description of the fence and several queries for placing sign. For each query print the maximum possible height of the sign that can be placed on the corresponding segment of the fence with the given fixed width of the sign.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains integer <span class=\"tex-span\"><i>n<\/i><\/span>\u00a0\u2014 the number of panels in the fence (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>). <\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> space-separated integers <span class=\"tex-span\"><i>h<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>,\u00a0\u2014 the heights of the panels (<span class=\"tex-span\">1\u2009\u2264\u2009<i>h<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>). <\/p><p>The third line contains an integer <span class=\"tex-span\"><i>m<\/i><\/span>\u00a0\u2014 the number of the queries (<span class=\"tex-span\">1\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>). <\/p><p>The next <span class=\"tex-span\"><i>m<\/i><\/span> lines contain the descriptions of the queries, each query is represented by three integers <span class=\"tex-span\"><i>l<\/i><\/span>, <span class=\"tex-span\"><i>r<\/i><\/span> and <span class=\"tex-span\"><i>w<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>w<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009-\u2009<i>l<\/i>\u2009+\u20091<\/span>)\u00a0\u2014 the segment of the fence and the width of the sign respectively.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query print the answer on a separate line\u00a0\u2014 the maximum height of the sign that can be put in the corresponding segment of the fence with all the conditions being satisfied.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1 2 2 3 3<br/>3<br/>2 5 3<br/>2 5 2<br/>1 5 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/>3<br/>1<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The fence described in the sample looks as follows: <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/95e26c67764185b2a88a1c4bc31c4a4b2c0c130f.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>The possible positions for the signs for all queries are given below.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/d4c89707509b1a85141adf18f615009799093f5b.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> The optimal position of the sign for the first query. <\/center><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/a4f44ecc26b79bf468a8c6a56730ad44bb0b58d6.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> The optimal position of the sign for the second query. <\/center><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/c76ae0ded93ba823f22e4d1267b2be2103022439.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> The optimal position of the sign for the third query. <\/center><\/div><\/div>"}, {"contestId": 1559, "index": "D2", "name": "Mocha and Diana (Hard Version)", "rating": 2500, "solvedCount": 3260, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D2. Mocha and Diana (Hard Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is the hard version of the problem. The only difference between the two versions is the constraint on $$$n$$$. You can make hacks only if all versions of the problem are solved.<\/span><\/p><p>A forest is an undirected graph without cycles (not necessarily connected).<\/p><p>Mocha and Diana are friends in Zhijiang, both of them have a forest with nodes numbered from $$$1$$$ to $$$n$$$, and they would like to add edges to their forests such that: <\/p><ul> <li> After adding edges, both of their graphs are still forests. <\/li><li> They add the same edges. That is, if an edge $$$(u, v)$$$ is added to Mocha's forest, then an edge $$$(u, v)$$$ is added to Diana's forest, and vice versa. <\/li><\/ul><p>Mocha and Diana want to know the maximum number of edges they can add, and which edges to add.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains three integers $$$n$$$, $$$m_1$$$ and $$$m_2$$$ ($$$1 \\le n \\le 10^5$$$, $$$0 \\le m_1, m_2  \\lt  n$$$) \u2014 the number of nodes and the number of initial edges in Mocha's forest and Diana's forest.<\/p><p>Each of the next $$$m_1$$$ lines contains two integers $$$u$$$ and $$$v$$$ ($$$1 \\le u, v \\le n$$$, $$$u \\neq v$$$) \u2014 the edges in Mocha's forest.<\/p><p>Each of the next $$$m_2$$$ lines contains two integers $$$u$$$ and $$$v$$$ ($$$1 \\le u, v \\le n$$$, $$$u \\neq v$$$) \u2014 the edges in Diana's forest.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>The first line contains only one integer $$$h$$$, the maximum number of edges Mocha and Diana can add.<\/p><p>Each of the next $$$h$$$ lines contains two integers $$$u$$$ and $$$v$$$ ($$$1 \\le u, v \\le n$$$, $$$u \\neq v$$$) \u2014 the edge you add each time.<\/p><p>If there are multiple correct answers, you can print any one of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 2 2\n1 2\n2 3\n1 2\n1 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 3 2\n5 4\n2 1\n4 3\n4 3\n1 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n2 4\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n8 1 2\n1 7\n2 6\n1 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5\n5 2\n2 3\n3 4\n4 7\n6 8\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, we cannot add any edge.<\/p><p>In the second example, the initial forests are as follows.<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/45bf5e3cb797d3297f192b72d636672e36927915.png\" style=\"zoom: 50.0%;max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>We can add an edge $$$(2, 4)$$$.<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/6381c3c8fea706ce0dd2912abf0d052da6f55f46.png\" style=\"zoom: 50.0%;max-width: 100.0%;max-height: 100.0%;\"/><\/p><\/div><\/div>"}, {"contestId": 1043, "index": "F", "name": "Make It One", "rating": 2500, "solvedCount": 3220, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Make It One<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Janusz is a businessman. He owns a company \"Januszex\", which produces games for teenagers. Last hit of Januszex was a cool one-person game \"Make it one\". The player is given a sequence of $$$n$$$ integers $$$a_i$$$.<\/p><p>It is allowed to select any subset of them, and the score is equal to the greatest common divisor of selected elements. The goal is to take as little elements as it is possible, getting the score $$$1$$$. Now Janusz wonders, for given sequence, how much elements should the player choose?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an only integer $$$n$$$ ($$$1 \\le n \\le 300\\,000$$$)\u00a0\u2014 the number of integers in the sequence.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le 300\\,000$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If there is no subset of the given sequence with gcd equal to $$$1$$$, output <span class=\"tex-font-style-tt\">-1<\/span>.<\/p><p>Otherwise, output exactly one integer\u00a0\u2014 the size of the smallest subset with gcd equal to $$$1$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>10 6 15<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>2 4 6<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>-1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>7<br/>30 60 21 42 70 15 30<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, selecting a subset of all numbers gives a gcd of $$$1$$$ and for all smaller subsets the gcd is greater than $$$1$$$.<\/p><p>In the second example, for all subsets of numbers the gcd is at least $$$2$$$. <\/p><\/div><\/div>"}, {"contestId": 1527, "index": "E", "name": "Partition Game", "rating": 2500, "solvedCount": 3118, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Partition Game<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ of $$$n$$$ integers. Define the cost of some array $$$t$$$ as follows:<\/p><p>$$$$$$cost(t) = \\sum_{x \\in set(t) } last(x) - first(x),$$$$$$ <\/p><p>where $$$set(t)$$$ is the set of all values in $$$t$$$ without repetitions, $$$first(x)$$$, and $$$last(x)$$$ are the indices of the first and last occurrence of $$$x$$$ in $$$t$$$, respectively. In other words, we compute the distance between the first and last occurrences for each distinct element and sum them up.<\/p><p>You need to split the array $$$a$$$ into $$$k$$$ consecutive segments such that each element of $$$a$$$ belongs to exactly one segment and the sum of the cost of individual segments is minimum.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$, $$$k$$$ ($$$1 \\le n \\le 35\\,000$$$, $$$1 \\le k \\le \\min(n,100)$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le n$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output the minimum sum of the cost of individual segments.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7 2\n1 6 6 4 6 6 6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7 4\n5 5 5 5 2 3 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, we can divide the array into $$$[1,6,6,4]$$$ and $$$[6,6,6]$$$. Cost of $$$[1,6,6,4]$$$ will be $$$(1-1) + (3 - 2) + (4-4) = 1$$$ and cost of $$$[6,6,6]$$$ will be $$$3-1 = 2$$$. Total cost would be $$$1 + 2 = 3$$$.<\/p><p>In the second example, divide the array into $$$[5,5],[5],[5,2,3]$$$ and $$$[3]$$$. Total Cost would be $$$1 + 0 + 0 + 0 = 1$$$.<\/p><\/div><\/div>"}, {"contestId": 528, "index": "D", "name": "Fuzzy Search", "rating": 2500, "solvedCount": 3023, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Fuzzy Search<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Leonid works for a small and promising start-up that works on decoding the human genome. His duties include solving complex problems of finding certain patterns in long strings consisting of letters '<span class=\"tex-font-style-tt\">A<\/span>', '<span class=\"tex-font-style-tt\">T<\/span>', '<span class=\"tex-font-style-tt\">G<\/span>' and '<span class=\"tex-font-style-tt\">C<\/span>'.<\/p><p>Let's consider the following scenario. There is a fragment of a human DNA chain, recorded as a string <span class=\"tex-span\"><i>S<\/i><\/span>. To analyze the fragment, you need to find all occurrences of string <span class=\"tex-span\"><i>T<\/i><\/span> in a string <span class=\"tex-span\"><i>S<\/i><\/span>. However, the matter is complicated by the fact that the original chain fragment could contain minor mutations, which, however, complicate the task of finding a fragment. Leonid proposed the following approach to solve this problem.<\/p><p>Let's write down integer <span class=\"tex-span\"><i>k<\/i>\u2009\u2265\u20090<\/span> \u2014 the error threshold. We will say that string <span class=\"tex-span\"><i>T<\/i><\/span> occurs in string <span class=\"tex-span\"><i>S<\/i><\/span> on position <span class=\"tex-span\"><i>i<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009|<i>S<\/i>|\u2009-\u2009|<i>T<\/i>|\u2009+\u20091<\/span>), if after putting string <span class=\"tex-span\"><i>T<\/i><\/span> along with this position, each character of string <span class=\"tex-span\"><i>T<\/i><\/span> corresponds to the some character of the same value in string <span class=\"tex-span\"><i>S<\/i><\/span> at the distance of at most <span class=\"tex-span\"><i>k<\/i><\/span>. More formally, for any <span class=\"tex-span\"><i>j<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>j<\/i>\u2009\u2264\u2009|<i>T<\/i>|<\/span>) there must exist such <span class=\"tex-span\"><i>p<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>p<\/i>\u2009\u2264\u2009|<i>S<\/i>|<\/span>), that <span class=\"tex-span\">|(<i>i<\/i>\u2009+\u2009<i>j<\/i>\u2009-\u20091)\u2009-\u2009<i>p<\/i>|\u2009\u2264\u2009<i>k<\/i><\/span> and <span class=\"tex-span\"><i>S<\/i>[<i>p<\/i>]\u2009=\u2009<i>T<\/i>[<i>j<\/i>]<\/span>.<\/p><p>For example, corresponding to the given definition, string \"<span class=\"tex-font-style-tt\">ACAT<\/span>\" occurs in string \"<span class=\"tex-font-style-tt\">AGCAATTCAT<\/span>\" in positions <span class=\"tex-span\">2<\/span>, <span class=\"tex-span\">3<\/span> and <span class=\"tex-span\">6<\/span>.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/c6bac791756cc9638747fed191c6a9b4fc6921b5.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>Note that at <span class=\"tex-span\"><i>k<\/i>\u2009=\u20090<\/span> the given definition transforms to a simple definition of the occurrence of a string in a string.<\/p><p>Help Leonid by calculating in how many positions the given string <span class=\"tex-span\"><i>T<\/i><\/span> occurs in the given string <span class=\"tex-span\"><i>S<\/i><\/span> with the given error threshold.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains three integers <span class=\"tex-span\">|<i>S<\/i>|,\u2009|<i>T<\/i>|,\u2009<i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009|<i>T<\/i>|\u2009\u2264\u2009|<i>S<\/i>|\u2009\u2264\u2009200\u2009000<\/span>, <span class=\"tex-span\">0\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u2009200\u2009000<\/span>) \u2014 the lengths of strings <span class=\"tex-span\"><i>S<\/i><\/span> and <span class=\"tex-span\"><i>T<\/i><\/span> and the error threshold.<\/p><p>The second line contains string <span class=\"tex-span\"><i>S<\/i><\/span>.<\/p><p>The third line contains string <span class=\"tex-span\"><i>T<\/i><\/span>.<\/p><p>Both strings consist only of uppercase letters '<span class=\"tex-font-style-tt\">A<\/span>', '<span class=\"tex-font-style-tt\">T<\/span>', '<span class=\"tex-font-style-tt\">G<\/span>' and '<span class=\"tex-font-style-tt\">C<\/span>'.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single number \u2014 the number of occurrences of <span class=\"tex-span\"><i>T<\/i><\/span> in <span class=\"tex-span\"><i>S<\/i><\/span> with the error threshold <span class=\"tex-span\"><i>k<\/i><\/span> by the given definition.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>10 4 1<br/>AGCAATTCAT<br/>ACAT<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>If you happen to know about the structure of the human genome a little more than the author of the problem, and you are not impressed with Leonid's original approach, do not take everything described above seriously.<\/p><\/div><\/div>"}, {"contestId": 1418, "index": "G", "name": "Three Occurrences", "rating": 2500, "solvedCount": 3017, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. Three Occurrences<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ consisting of $$$n$$$ integers. We denote the subarray $$$a[l..r]$$$ as the array $$$[a_l, a_{l + 1}, \\dots, a_r]$$$ ($$$1 \\le l \\le r \\le n$$$).<\/p><p>A subarray is considered <span class=\"tex-font-style-it\">good<\/span> if every integer that occurs in this subarray occurs there <span class=\"tex-font-style-bf\">exactly thrice<\/span>. For example, the array $$$[1, 2, 2, 2, 1, 1, 2, 2, 2]$$$ has three good subarrays:<\/p><ul> <li> $$$a[1..6] = [1, 2, 2, 2, 1, 1]$$$; <\/li><li> $$$a[2..4] = [2, 2, 2]$$$; <\/li><li> $$$a[7..9] = [2, 2, 2]$$$. <\/li><\/ul><p>Calculate the number of good subarrays of the given array $$$a$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$1 \\le n \\le 5 \\cdot 10^5$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_1$$$, $$$a_2$$$, ..., $$$a_n$$$ ($$$1 \\le a_i \\le n$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the number of good subarrays of the array $$$a$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n9\n1 2 2 2 1 1 2 2 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n10\n1 2 3 4 1 2 3 1 2 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n12\n1 2 3 4 3 4 2 1 3 4 2 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 963, "index": "D", "name": "Frequency of String", "rating": 2500, "solvedCount": 2964, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Frequency of String<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a string $$$s$$$. You should answer $$$n$$$ queries. The $$$i$$$-th query consists of integer $$$k_i$$$ and string $$$m_i$$$. The answer for this query is the minimum length of such a string $$$t$$$ that $$$t$$$ is a substring of $$$s$$$ and $$$m_i$$$ has at least $$$k_i$$$ occurrences as a substring in $$$t$$$.<\/p><p>A substring of a string is a continuous segment of characters of the string.<\/p><p>It is guaranteed that for any two queries the strings $$$m_i$$$ from these queries are different. <\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains string $$$s$$$ $$$(1 \\leq \\left | s \\right | \\leq 10^{5})$$$.<\/p><p>The second line contains an integer $$$n$$$ ($$$1 \\leq n \\leq 10^5$$$).<\/p><p>Each of next $$$n$$$ lines contains an integer $$$k_i$$$ $$$(1 \\leq k_i \\leq |s|)$$$ and a non-empty string $$$m_i$$$\u00a0\u2014 parameters of the query with number $$$i$$$, in this order.<\/p><p>All strings in input consists of lowercase English letters. Sum of length of all strings in input doesn't exceed $$$10^5$$$. All $$$m_i$$$ are distinct.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query output the answer for it in a separate line.<\/p><p>If a string $$$m_{i}$$$ occurs in $$$s$$$ less that $$$k_{i}$$$ times, output <span class=\"tex-font-style-tt\">-1<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>aaaaa<br/>5<br/>3 a<br/>3 aa<br/>2 aaa<br/>3 aaaa<br/>1 aaaaa<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/>4<br/>4<br/>-1<br/>5<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>abbb<br/>7<br/>4 b<br/>1 ab<br/>3 bb<br/>1 abb<br/>2 bbb<br/>1 a<br/>2 abbb<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>-1<br/>2<br/>-1<br/>3<br/>-1<br/>1<br/>-1<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1175, "index": "F", "name": "The Number of Subpermutations", "rating": 2500, "solvedCount": 2959, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. The Number of Subpermutations<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You have an array $$$a_1, a_2, \\dots, a_n$$$. <\/p><p>Let's call some subarray $$$a_l, a_{l + 1}, \\dots , a_r$$$ of this array a <span class=\"tex-font-style-it\">subpermutation<\/span> if it contains all integers from $$$1$$$ to $$$r-l+1$$$ exactly once. For example, array $$$a = [2, 2, 1, 3, 2, 3, 1]$$$ contains $$$6$$$ subarrays which are subpermutations: $$$[a_2 \\dots a_3]$$$, $$$[a_2 \\dots a_4]$$$, $$$[a_3 \\dots a_3]$$$, $$$[a_3 \\dots a_5]$$$, $$$[a_5 \\dots a_7]$$$, $$$[a_7 \\dots a_7]$$$.<\/p><p>You are asked to calculate the number of subpermutations.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$1 \\le n \\le 3 \\cdot 10^5$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots , a_n$$$ ($$$1 \\le a_i \\le n$$$). <\/p><p><span class=\"tex-font-style-bf\">This array can contain the same integers.<\/span><\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the number of subpermutations of the array $$$a$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n8\n2 4 1 3 4 2 1 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n7\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n1 1 2 1 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>There are $$$7$$$ subpermutations in the first test case. Their segments of indices are $$$[1, 4]$$$, $$$[3, 3]$$$, $$$[3, 6]$$$, $$$[4, 7]$$$, $$$[6, 7]$$$, $$$[7, 7]$$$ and $$$[7, 8]$$$.<\/p><p>In the second test case $$$6$$$ subpermutations exist: $$$[1, 1]$$$, $$$[2, 2]$$$, $$$[2, 3]$$$, $$$[3, 4]$$$, $$$[4, 4]$$$ and $$$[4, 5]$$$.<\/p><\/div><\/div>"}, {"contestId": 348, "index": "C", "name": "Subset Sums", "rating": 2500, "solvedCount": 2938, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Subset Sums<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>You are given an array <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> sets <span class=\"tex-span\"><i>S<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>S<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>S<\/i><sub class=\"lower-index\"><i>m<\/i><\/sub><\/span> of indices of elements of this array. Let's denote <span class=\"tex-span\"><i>S<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>\u2009=\u2009{<i>S<\/i><sub class=\"lower-index\"><i>k<\/i>,\u2009<i>i<\/i><\/sub>}\u00a0(1\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009|<i>S<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>|)<\/span>. In other words, <span class=\"tex-span\"><i>S<\/i><sub class=\"lower-index\"><i>k<\/i>,\u2009<i>i<\/i><\/sub><\/span> is some element from set <span class=\"tex-span\"><i>S<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span>.<\/p><p>In this problem you have to answer <span class=\"tex-span\"><i>q<\/i><\/span> queries of the two types:<\/p><ol> <li> Find the sum of elements with indices from set <span class=\"tex-span\"><i>S<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span>: <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/6d0c103912105915deadec2dfbf3e852cfbce1fd.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>. The query format is \"<span class=\"tex-font-style-tt\">? k<\/span>\". <\/li><li> Add number <span class=\"tex-span\"><i>x<\/i><\/span> to all elements at indices from set <span class=\"tex-span\"><i>S<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span>: <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>S<\/i><sub class=\"lower-index\"><i>k<\/i>,\u2009<i>i<\/i><\/sub><\/sub><\/span> is replaced by <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>S<\/i><sub class=\"lower-index\"><i>k<\/i>,\u2009<i>i<\/i><\/sub><\/sub>\u2009+\u2009<i>x<\/i><\/span> for all <span class=\"tex-span\"><i>i<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009|<i>S<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>|)<\/span>. The query format is \"<span class=\"tex-font-style-tt\">+ k x<\/span>\". <\/li><\/ol><p>After each first type query print the required sum.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integers <span class=\"tex-span\"><i>n<\/i>,\u2009<i>m<\/i>,\u2009<i>q<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>m<\/i>,\u2009<i>q<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>)<\/span>. The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> <span class=\"tex-span\">(|<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>|\u2009\u2264\u200910<sup class=\"upper-index\">8<\/sup>)<\/span> \u2014 elements of array <span class=\"tex-span\"><i>a<\/i><\/span>. <\/p><p>Each of the following <span class=\"tex-span\"><i>m<\/i><\/span> lines describes one set of indices. The <span class=\"tex-span\"><i>k<\/i><\/span>-th line first contains a positive integer, representing the number of elements in set (<span class=\"tex-span\">|<i>S<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>|<\/span>), then follow <span class=\"tex-span\">|<i>S<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>|<\/span> distinct integers <span class=\"tex-span\"><i>S<\/i><sub class=\"lower-index\"><i>k<\/i>,\u20091<\/sub>,\u2009<i>S<\/i><sub class=\"lower-index\"><i>k<\/i>,\u20092<\/sub>,\u2009...,\u2009<i>S<\/i><sub class=\"lower-index\"><i>k<\/i>,\u2009|<i>S<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>|<\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>S<\/i><sub class=\"lower-index\"><i>k<\/i>,\u2009<i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>)<\/span> \u2014 elements of set <span class=\"tex-span\"><i>S<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span>.<\/p><p>The next <span class=\"tex-span\"><i>q<\/i><\/span> lines contain queries. Each query looks like either \"<span class=\"tex-font-style-tt\">? k<\/span>\" or \"<span class=\"tex-font-style-tt\">+ k x<\/span>\" and sits on a single line. For all queries the following limits are held: <span class=\"tex-span\">1\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u2009<i>m<\/i><\/span>, <span class=\"tex-span\">|<i>x<\/i>|\u2009\u2264\u200910<sup class=\"upper-index\">8<\/sup><\/span>. The queries are given in order they need to be answered.<\/p><p>It is guaranteed that the sum of sizes of all sets <span class=\"tex-span\"><i>S<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span> doesn't exceed <span class=\"tex-span\">10<sup class=\"upper-index\">5<\/sup><\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>After each first type query print the required sum on a single line.<\/p><p>Please, do not write the <span class=\"tex-font-style-tt\">%lld<\/span> specifier to read or write 64-bit integers in \u0421++. It is preferred to use the <span class=\"tex-font-style-tt\">cin<\/span>, <span class=\"tex-font-style-tt\">cout<\/span> streams or the <span class=\"tex-font-style-tt\">%I64d<\/span> specifier.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 3 5<br/>5 -5 5 1 -4<br/>2 1 2<br/>4 2 1 4 5<br/>2 2 5<br/>? 2<br/>+ 3 4<br/>? 1<br/>+ 2 1<br/>? 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>-3<br/>4<br/>9<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 468, "index": "C", "name": "Hack it!", "rating": 2500, "solvedCount": 2841, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Hack it!<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Little X has met the following problem recently. <\/p><p>Let's define <span class=\"tex-span\"><i>f<\/i>(<i>x<\/i>)<\/span> as the sum of digits in decimal representation of number <span class=\"tex-span\"><i>x<\/i><\/span> (for example, <span class=\"tex-span\"><i>f<\/i>(1234)\u2009=\u20091\u2009+\u20092\u2009+\u20093\u2009+\u20094<\/span>). You are to calculate <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/3544ececd2159fbc9d8edc9ba99dbbfa79739157.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>Of course Little X has solved this problem quickly, has locked it, and then has tried to hack others. He has seen the following C++ code: <\/p><pre class=\"verbatim\"><br/>    ans = solve(l, r) % a;<br/>    if (ans &lt;= 0)<br/>      ans += a;<br/><br/><\/pre> This code will fail only on the test with <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/4b3d0d465d72291386b3afa4fd8af81c1a6a1a6e.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>. You are given number <span class=\"tex-span\"><i>a<\/i><\/span>, help Little X to find a proper test for hack.<\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer <span class=\"tex-span\"><i>a<\/i>\u00a0(1\u2009\u2264\u2009<i>a<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">18<\/sup>)<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print two integers: <span class=\"tex-span\"><i>l<\/i>,\u2009<i>r<\/i>\u00a0(1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009&lt;\u200910<sup class=\"upper-index\">200<\/sup>)<\/span> \u2014 the required test data. Leading zeros aren't allowed. It's guaranteed that the solution exists.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>46<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1 10<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>126444381000032<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2333333 2333333333333<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 986, "index": "C", "name": "AND Graph", "rating": 2500, "solvedCount": 2816, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. AND Graph<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>2

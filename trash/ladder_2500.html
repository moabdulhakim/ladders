56 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a set of size $$$m$$$ with integer elements between $$$0$$$ and $$$2^{n}-1$$$ inclusive. Let's build an undirected graph on these integers in the following way: connect two integers $$$x$$$ and $$$y$$$ with an edge if and only if $$$x \\&amp; y = 0$$$. Here $$$\\&amp;$$$ is the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#AND\">bitwise AND operation<\/a>. Count the number of connected components in that graph.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>In the first line of input there are two integers $$$n$$$ and $$$m$$$ ($$$0 \\le n \\le 22$$$, $$$1 \\le m \\le 2^{n}$$$).<\/p><p>In the second line there are $$$m$$$ integers $$$a_1, a_2, \\ldots, a_m$$$ ($$$0 \\le a_{i}  \\lt  2^{n}$$$)\u00a0\u2014 the elements of the set. All $$$a_{i}$$$ are distinct.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the number of connected components.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 3<br/>1 2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 5<br/>5 19 10 20 12<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Graph from first sample:<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/2ae9959ec95b178e60e27e28f5d62c1099bb9ef1.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>Graph from second sample:<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/9f9eee8f2409bbd78cce726875915c405af8a07e.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><\/div><\/div>"}, {"contestId": 580, "index": "E", "name": "Kefa and Watch", "rating": 2500, "solvedCount": 2739, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Kefa and Watch<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>One day Kefa the parrot was walking down the street as he was on the way home from the restaurant when he saw something glittering by the road. As he came nearer he understood that it was a watch. He decided to take it to the pawnbroker to earn some money. <\/p><p>The pawnbroker said that each watch contains a serial number represented by a string of digits from <span class=\"tex-span\">0<\/span> to <span class=\"tex-span\">9<\/span>, and the more quality checks this number passes, the higher is the value of the watch. The check is defined by three positive integers <span class=\"tex-span\"><i>l<\/i><\/span>, <span class=\"tex-span\"><i>r<\/i><\/span> and <span class=\"tex-span\"><i>d<\/i><\/span>. The watches pass a check if a substring of the serial number from <span class=\"tex-span\"><i>l<\/i><\/span> to <span class=\"tex-span\"><i>r<\/i><\/span> has period <span class=\"tex-span\"><i>d<\/i><\/span>. Sometimes the pawnbroker gets distracted and Kefa changes in some substring of the serial number all digits to <span class=\"tex-span\"><i>c<\/i><\/span> in order to increase profit from the watch. <\/p><p>The seller has a lot of things to do to begin with and with Kefa messing about, he gave you a task: to write a program that determines the value of the watch.<\/p><p>Let us remind you that number <span class=\"tex-span\"><i>x<\/i><\/span> is called a period of string <span class=\"tex-span\"><i>s<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i>\u2009\u2264\u2009|<i>s<\/i>|<\/span>), if <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2009=\u2009\u2009<i>s<\/i><sub class=\"lower-index\"><i>i<\/i>\u2009+\u2009<i>x<\/i><\/sub><\/span> for all <span class=\"tex-span\"><i>i<\/i><\/span> from 1 to <span class=\"tex-span\">|<i>s<\/i>|\u2009\u2009-\u2009\u2009<i>x<\/i><\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains three positive integers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>m<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>m<\/i>\u2009+\u2009<i>k<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the length of the serial number, the number of change made by Kefa and the number of quality checks.<\/p><p>The second line contains a serial number consisting of <span class=\"tex-span\"><i>n<\/i><\/span> digits.<\/p><p>Then <span class=\"tex-span\"><i>m<\/i>\u2009+\u2009<i>k<\/i><\/span> lines follow, containing either checks or changes. <\/p><p>The changes are given as 1 <span class=\"tex-span\"><i>l<\/i><\/span> <span class=\"tex-span\"><i>r<\/i><\/span> <span class=\"tex-span\"><i>c<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\">0\u2009\u2264\u2009<i>c<\/i>\u2009\u2264\u20099<\/span>). That means that Kefa changed all the digits from the <span class=\"tex-span\"><i>l<\/i><\/span>-th to the <span class=\"tex-span\"><i>r<\/i><\/span>-th to be <span class=\"tex-span\"><i>c<\/i><\/span>. <\/p><p>The checks are given as 2 <span class=\"tex-span\"><i>l<\/i><\/span> <span class=\"tex-span\"><i>r<\/i><\/span> <span class=\"tex-span\"><i>d<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>d<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009-\u2009<i>l<\/i>\u2009+\u20091<\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each check on a single line print \"<span class=\"tex-font-style-tt\">YES<\/span>\" if the watch passed it, otherwise print \"<span class=\"tex-font-style-tt\">NO<\/span>\".<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 1 2<br/>112<br/>2 2 3 1<br/>1 1 3 8<br/>2 1 2 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>NO<br/>YES<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>6 2 3<br/>334934<br/>2 2 5 2<br/>1 4 4 3<br/>2 1 6 3<br/>1 2 3 8<br/>2 3 6 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>NO<br/>YES<br/>NO<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample test two checks will be made. In the first one substring \"12\" is checked on whether or not it has period 1, so the answer is \"<span class=\"tex-font-style-tt\">NO<\/span>\". In the second one substring \"88\", is checked on whether or not it has period 1, and it has this period, so the answer is \"<span class=\"tex-font-style-tt\">YES<\/span>\".<\/p><p>In the second statement test three checks will be made. The first check processes substring \"3493\", which doesn't have period 2. Before the second check the string looks as \"334334\", so the answer to it is \"<span class=\"tex-font-style-tt\">YES<\/span>\". And finally, the third check processes substring \"8334\", which does not have period 1.<\/p><\/div><\/div>"}, {"contestId": 449, "index": "C", "name": "Jzzhu and Apples", "rating": 2500, "solvedCount": 2643, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Jzzhu and Apples<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Jzzhu has picked <span class=\"tex-span\"><i>n<\/i><\/span> apples from his big apple tree. All the apples are numbered from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span>. Now he wants to sell them to an apple store. <\/p><p>Jzzhu will pack his apples into groups and then sell them. Each group must contain two apples, and the greatest common divisor of numbers of the apples in each group must be greater than 1. Of course, each apple can be part of at most one group.<\/p><p>Jzzhu wonders how to get the maximum possible number of groups. Can you help him?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>A single integer <span class=\"tex-span\"><i>n<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>)<\/span>, the number of the apples.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>The first line must contain a single integer <span class=\"tex-span\"><i>m<\/i><\/span>, representing the maximum number of groups he can get. Each of the next <span class=\"tex-span\"><i>m<\/i><\/span> lines must contain two integers \u2014 the numbers of apples in the current group.<\/p><p>If there are several optimal answers you can print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>6<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/>6 3<br/>2 4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>9<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/>9 3<br/>2 4<br/>6 8<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 660, "index": "F", "name": "Bear and Bowling 4", "rating": 2500, "solvedCount": 2514, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Bear and Bowling 4<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Limak is an old brown bear. He often goes bowling with his friends. Today he feels really good and tries to beat his own record!<\/p><p>For rolling a ball one gets a score \u2014 an integer (maybe negative) number of points. Score for the <span class=\"tex-span\"><i>i<\/i><\/span>-th roll is multiplied by <span class=\"tex-span\"><i>i<\/i><\/span> and scores are summed up. So, for <span class=\"tex-span\"><i>k<\/i><\/span> rolls with scores <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>s<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>s<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span>, the total score is <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/c8a1cac733e2c38459a7a155ea158ee99d347e49.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>. The total score is <span class=\"tex-span\">0<\/span> if there were no rolls.<\/p><p>Limak made <span class=\"tex-span\"><i>n<\/i><\/span> rolls and got score <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> for the <span class=\"tex-span\"><i>i<\/i><\/span>-th of them. He wants to maximize his total score and he came up with an interesting idea. He can say that some first rolls were only a warm-up, and that he wasn't focused during the last rolls. More formally, he can cancel any prefix and any suffix of the sequence <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span>. It is allowed to cancel all rolls, or to cancel none of them.<\/p><p>The total score is calculated as if there were only non-canceled rolls. So, the first non-canceled roll has score multiplied by <span class=\"tex-span\">1<\/span>, the second one has score multiplied by <span class=\"tex-span\">2<\/span>, and so on, till the last non-canceled roll.<\/p><p>What maximum total score can Limak get?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20092\u00b710<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the total number of rolls made by Limak.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">|<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>|\u2009\u2264\u200910<sup class=\"upper-index\">7<\/sup>)<\/span> \u2014 scores for Limak's rolls.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the maximum possible total score after cancelling rolls.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>6<br/>5 -1000 1 -3 7 -8<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>16<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1000 1000 1001 1000 1000<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>15003<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>-60 -70 -80<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample test, Limak should cancel the first two rolls, and one last roll. He will be left with rolls <span class=\"tex-span\">1,\u2009\u2009-\u20093,\u20097<\/span> what gives him the total score <span class=\"tex-span\">1\u00b71\u2009+\u20092\u00b7(\u2009-\u20093)\u2009+\u20093\u00b77\u2009=\u20091\u2009-\u20096\u2009+\u200921\u2009=\u200916<\/span>.<\/p><\/div><\/div>"}, {"contestId": 1481, "index": "E", "name": "Sorting Books", "rating": 2500, "solvedCount": 2504, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Sorting Books<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>One day you wanted to read something, so you went to your bookshelf to grab some book. But when you saw how messy the bookshelf was you decided to clean it up first.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/ce50d55e950ca4596ba832ceb07494b1f13600c4.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>There are $$$n$$$ books standing in a row on the shelf, the $$$i$$$-th book has color $$$a_i$$$.<\/p><p>You'd like to rearrange the books to make the shelf look beautiful. The shelf is considered <span class=\"tex-font-style-it\">beautiful<\/span> if all books of the same color are next to each other.<\/p><p>In one operation you can take one book from any position on the shelf and move it to the right end of the shelf.<\/p><p>What is the minimum number of operations you need to make the shelf beautiful?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$1 \\le n \\le 5 \\cdot 10^5$$$)\u00a0\u2014 the number of books.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le n$$$)\u00a0\u2014 the book colors.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output the minimum number of operations to make the shelf beautiful.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n1 2 2 1 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n1 2 2 1 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, we have the bookshelf $$$[1, 2, 2, 1, 3]$$$ and can, for example: <\/p><ol> <li> take a book on position $$$4$$$ and move to the right end: we'll get $$$[1, 2, 2, 3, 1]$$$; <\/li><li> take a book on position $$$1$$$ and move to the right end: we'll get $$$[2, 2, 3, 1, 1]$$$. <\/li><\/ol><p>In the second example, we can move the first book to the end of the bookshelf and get $$$[2,2,1,1,1]$$$.<\/p><\/div><\/div>"}, {"contestId": 1325, "index": "F", "name": "Ehab's Last Theorem", "rating": 2500, "solvedCount": 2483, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Ehab's Last Theorem<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>It's the year 5555. You have a graph, and you want to find a long cycle and a huge independent set, just because you can. But for now, let's just stick with finding either.<\/p><p>Given a connected graph with $$$n$$$ vertices, you can choose to either:<\/p><ul> <li> find an independent set that has <span class=\"tex-font-style-bf\">exactly<\/span> $$$\\lceil\\sqrt{n}\\rceil$$$ vertices.<\/li><li> find a <span class=\"tex-font-style-bf\">simple<\/span> cycle of length <span class=\"tex-font-style-bf\">at least<\/span> $$$\\lceil\\sqrt{n}\\rceil$$$. <\/li><\/ul><p>An independent set is a set of vertices such that no two of them are connected by an edge. A simple cycle is a cycle that doesn't contain any vertex twice. I have a proof you can always solve one of these problems, but it's too long to fit this margin.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$m$$$ ($$$5 \\le n \\le 10^5$$$, $$$n-1 \\le m \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of vertices and edges in the graph.<\/p><p>Each of the next $$$m$$$ lines contains two space-separated integers $$$u$$$ and $$$v$$$ ($$$1 \\le u,v \\le n$$$) that mean there's an edge between vertices $$$u$$$ and $$$v$$$. It's guaranteed that the graph is connected and doesn't contain any self-loops or multiple edges.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If you choose to solve the first problem, then on the first line print \"1\", followed by a line containing $$$\\lceil\\sqrt{n}\\rceil$$$ distinct integers not exceeding $$$n$$$, the vertices in the desired independent set.<\/p><p>If you, however, choose to solve the second problem, then on the first line print \"2\", followed by a line containing one integer, $$$c$$$, representing the length of the found cycle, followed by a line containing $$$c$$$ distinct integers integers not exceeding $$$n$$$, the vertices in the desired cycle, <span class=\"tex-font-style-bf\">in the order they appear in the cycle<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 6\n1 3\n3 4\n4 2\n2 6\n5 6\n5 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n1 6 4<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 8\n1 3\n3 4\n4 2\n2 6\n5 6\n5 1\n1 4\n2 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n4\n1 5 2 4<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 4\n1 2\n1 3\n2 4\n2 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n3 4 5 <\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample:<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/64cdb4f94713ef3f85fed23b45e96ac7b168ce63.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>Notice that you can solve either problem, so printing the cycle $$$2-4-3-1-5-6$$$ is also acceptable.<\/p><p>In the second sample:<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/198f1db2cc5176e2707516b52a98b61dcc5462cc.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>Notice that if there are multiple answers you can print any, so printing the cycle $$$2-5-6$$$, for example, is acceptable.<\/p><p>In the third sample:<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/b58d7aaccc6d23d08528b3ce4f40f4e8bca8e13e.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><\/div><\/div>"}, {"contestId": 997, "index": "C", "name": "Sky Full of Stars", "rating": 2500, "solvedCount": 2479, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Sky Full of Stars<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>On one of the planets of Solar system, in Atmosphere University, many students are fans of bingo game.<\/p><p>It is well known that one month on this planet consists of $$$n^2$$$ days, so calendars, represented as square matrix $$$n$$$ by $$$n$$$ are extremely popular.<\/p><p>Weather conditions are even more unusual. Due to the unique composition of the atmosphere, when interacting with sunlight, every day sky takes one of three colors: blue, green or red.<\/p><p>To play the bingo, you need to observe the sky for one month\u00a0\u2014 after each day, its cell is painted with the color of the sky in that day, that is, blue, green or red.<\/p><p>At the end of the month, students examine the calendar. If at least one row or column contains only cells of one color, that month is called lucky.<\/p><p>Let's call two colorings of calendar different, if at least one cell has different colors in them. It is easy to see that there are $$$3^{n \\cdot n}$$$ different colorings. How much of them are lucky? Since this number can be quite large, print it modulo $$$998244353$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first and only line of input contains a single integer $$$n$$$ ($$$1 \\le n \\le 1000\\,000$$$)\u00a0\u2014 the number of rows and columns in the calendar.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one number\u00a0\u2014 number of lucky colorings of the calendar modulo $$$998244353$$$<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>63<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>9933<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample any coloring is lucky, since the only column contains cells of only one color.<\/p><p>In the second sample, there are a lot of lucky colorings, in particular, the following colorings are lucky:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/0b3b95494fedde7de6c36a5ff89abcf1da16026a.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>While these colorings are not lucky:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/548e65dd41f7f774a35a4cf310a56d3ae4148e80.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 1209, "index": "E2", "name": "Rotate Columns (hard version)", "rating": 2500, "solvedCount": 2445, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E2. Rotate Columns (hard version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-it\">This is a harder version of the problem. The difference is only in constraints<\/span>.<\/p><p>You are given a rectangular $$$n \\times m$$$ matrix $$$a$$$. In one move you can choose any column and cyclically shift elements in this column. You can perform this operation as many times as you want (possibly zero). You can perform this operation to a column multiple times.<\/p><p>After you are done with cyclical shifts, you compute for every row the maximal value in it. Suppose that for $$$i$$$-th row it is equal $$$r_i$$$. What is the maximal possible value of $$$r_1+r_2+\\ldots+r_n$$$?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$t$$$ ($$$1 \\le t \\le 40$$$), the number of test cases in the input.<\/p><p>The first line of each test case contains integers $$$n$$$ and $$$m$$$ ($$$1 \\le n \\le 12$$$, $$$1 \\le m \\le 2000$$$) \u2014 the number of rows and the number of columns in the given matrix $$$a$$$. <\/p><p>Each of the following $$$n$$$ lines contains $$$m$$$ integers, the elements of $$$a$$$ ($$$1 \\le a_{i, j} \\le 10^5$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$t$$$ integers: answers for all test cases in the order they are given in the input.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n2 3\n2 5 7\n4 2 4\n3 6\n4 1 5 2 10 4\n8 6 6 4 9 10\n5 4 9 5 8 7\n3 3\n9 9 9\n1 1 1\n1 1 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n12\n29\n27\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case you can shift the third column down by one, this way there will be $$$r_1 = 5$$$ and $$$r_2 = 7$$$.<\/p><p>In the second case you can don't rotate anything at all, this way there will be $$$r_1 = r_2 = 10$$$ and $$$r_3 = 9$$$.<\/p><\/div><\/div>"}, {"contestId": 1368, "index": "E", "name": "Ski Accidents", "rating": 2500, "solvedCount": 2441, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Ski Accidents<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Arthur owns a ski resort on a mountain. There are $$$n$$$ landing spots on the mountain numbered from $$$1$$$ to $$$n$$$ from the top to the foot of the mountain. The spots are connected with one-directional ski tracks. All tracks go towards the foot of the mountain, so there are <span class=\"tex-font-style-bf\">no directed cycles<\/span> formed by the tracks. There are <span class=\"tex-font-style-bf\">at most two tracks leaving each spot<\/span>, but many tracks may enter the same spot.<\/p><p>A skier can start skiing from one spot and stop in another spot if there is a sequence of tracks that lead from the starting spot and end in the ending spot. Unfortunately, recently there were many accidents, because the structure of the resort allows a skier to go through dangerous paths, by reaching high speed and endangering himself and the other customers. Here, a path is called dangerous, if it consists of at least two tracks.<\/p><p>Arthur wants to secure his customers by closing some of the spots in a way that there are no dangerous paths in the resort. When a spot is closed, all tracks entering and leaving that spot become unusable. <\/p><p>Formally, after closing some of the spots, <span class=\"tex-font-style-bf\">there should not be a path that consists of two or more tracks<\/span>.<\/p><p>Arthur doesn't want to close too many spots. He will be happy to find any way to close <span class=\"tex-font-style-bf\">at most $$$\\frac{4}{7}n$$$ spots<\/span> so that the remaining part is safe. Help him find any suitable way to do so.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single positive integer $$$T$$$\u00a0\u2014 the number of test cases. $$$T$$$ test case description follows.<\/p><p>The first line of each description contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\leq n \\leq 2 \\cdot 10^5$$$)\u00a0\u2014 the number of landing spots and tracks respectively.<\/p><p>The following $$$m$$$ lines describe the tracks. Each of these lines contains two integers $$$x$$$ and $$$y$$$ ($$$1 \\leq x  \\lt  y \\leq n$$$)\u00a0\u2014 indices of the starting and finishing spots for the respective track. It is guaranteed that at most two tracks start at each spot. There may be tracks in which starting and finishing spots both coincide.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print a single integer $$$k$$$ ($$$0 \\leq k \\leq \\frac{4}{7}n$$$)\u00a0\u2014 the number of spots to be closed. In the next line, print $$$k$$$ distinct integers\u00a0\u2014 indices of all spots to be closed, in any order.<\/p><p>If there are several answers, you may output any of them. Note that you <span class=\"tex-font-style-bf\">don't have to minimize $$$k$$$<\/span>. It can be shown that a suitable answer always exists.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n4 6\n1 2\n1 3\n2 3\n2 4\n3 4\n3 4\n7 6\n1 2\n1 3\n2 4\n2 5\n3 6\n3 7\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n3 4 \n4\n4 5 6 7 \n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample case, closing any two spots is suitable.<\/p><p>In the second sample case, closing only the spot $$$1$$$ is also suitable.<\/p><\/div><\/div>"}, {"contestId": 1253, "index": "F", "name": "Cheap Robot", "rating": 2500, "solvedCount": 2439, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Cheap Robot<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You're given a simple, undirected, connected, weighted graph with $$$n$$$ nodes and $$$m$$$ edges.<\/p><p>Nodes are numbered from $$$1$$$ to $$$n$$$. There are exactly $$$k$$$ <span class=\"tex-font-style-it\">centrals<\/span> (recharge points), which are nodes $$$1, 2, \\ldots, k$$$.<\/p><p>We consider a robot moving into this graph, with a battery of capacity $$$c$$$, not fixed by the constructor yet. At any time, the battery contains an integer amount $$$x$$$ of energy between $$$0$$$ and $$$c$$$ inclusive.<\/p><p>Traversing an edge of weight $$$w_i$$$ is possible only if $$$x \\ge w_i$$$, and costs $$$w_i$$$ energy points ($$$x := x - w_i$$$).<\/p><p>Moreover, when the robot reaches a central, its battery is entirely recharged ($$$x := c$$$).<\/p><p>You're given $$$q$$$ <span class=\"tex-font-style-underline\">independent<\/span> missions, the $$$i$$$-th mission requires to move the robot from <span class=\"tex-font-style-underline\">central<\/span> $$$a_i$$$ to <span class=\"tex-font-style-underline\">central<\/span> $$$b_i$$$.<\/p><p>For each mission, you should tell the minimum capacity required to acheive it.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains four integers $$$n$$$, $$$m$$$, $$$k$$$ and $$$q$$$ ($$$2 \\le k \\le n \\le 10^5$$$ and $$$1 \\le m, q \\le 3 \\cdot 10^5$$$).<\/p><p>The $$$i$$$-th of the next $$$m$$$ lines contains three integers $$$u_i$$$, $$$v_i$$$ and $$$w_i$$$ ($$$1 \\le u_i, v_i \\le n$$$, $$$u_i \\neq v_i$$$, $$$1 \\le w_i \\le 10^9$$$), that mean that there's an edge between nodes $$$u$$$ and $$$v$$$, with a weight $$$w_i$$$.<\/p><p>It is guaranteed that the given graph is simple (there is no self-loop, and there is at most one edge between every pair of nodes) and connected.<\/p><p>The $$$i$$$-th of the next $$$q$$$ lines contains two integers $$$a_i$$$ and $$$b_i$$$ ($$$1 \\le a_i, b_i \\le k$$$, $$$a_i \\neq b_i$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>You have to output $$$q$$$ lines, where the $$$i$$$-th line contains a single integer : the minimum capacity required to acheive the $$$i$$$-th mission.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n10 9 3 1\n10 9 11\n9 2 37\n2 4 4\n4 1 8\n1 5 2\n5 7 3\n7 3 2\n3 8 4\n8 6 13\n2 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n12\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n9 11 3 2\n1 3 99\n1 4 5\n4 5 3\n5 6 3\n6 4 11\n6 7 21\n7 2 6\n7 8 4\n8 9 3\n9 2 57\n9 3 2\n3 1\n2 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n38\n15\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, the graph is the chain $$$10 - 9 - 2^C - 4 - 1^C - 5 - 7 - 3^C - 8 - 6$$$, where centrals are nodes $$$1$$$, $$$2$$$ and $$$3$$$.<\/p><p>For the mission $$$(2, 3)$$$, there is only one simple path possible. Here is a simulation of this mission when the capacity is $$$12$$$.<\/p><ul> <li> The robot begins on the node $$$2$$$, with $$$c = 12$$$ energy points. <\/li><li> The robot uses an edge of weight $$$4$$$.<\/li><li> The robot reaches the node $$$4$$$, with $$$12 - 4 = 8$$$ energy points. <\/li><li> The robot uses an edge of weight $$$8$$$.<\/li><li> The robot reaches the node $$$1$$$ with $$$8 - 8 = 0$$$ energy points. <\/li><li> The robot is on a central, so its battery is recharged. He has now $$$c = 12$$$ energy points. <\/li><li> The robot uses an edge of weight $$$2$$$.<\/li><li> The robot is on the node $$$5$$$, with $$$12 - 2 = 10$$$ energy points. <\/li><li> The robot uses an edge of weight $$$3$$$.<\/li><li> The robot is on the node $$$7$$$, with $$$10 - 3 = 7$$$ energy points. <\/li><li> The robot uses an edge of weight $$$2$$$.<\/li><li> The robot is on the node $$$3$$$, with $$$7 - 2 = 5$$$ energy points. <\/li><li> The robot is on a central, so its battery is recharged. He has now $$$c = 12$$$ energy points. <\/li><li> End of the simulation. <\/li><\/ul><p>Note that if value of $$$c$$$ was lower than $$$12$$$, we would have less than $$$8$$$ energy points on node $$$4$$$, and we would be unable to use the edge $$$4 \\leftrightarrow 1$$$ of weight $$$8$$$. Hence $$$12$$$ is the minimum capacity required to acheive the mission.<\/p><p>\u2014<\/p><p>The graph of the second example is described here (centrals are red nodes):<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/36b7ae1abbf910743c9e98719c20051c22066fd6.png\" style=\"zoom: 80.0%;max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>The robot can acheive the mission $$$(3, 1)$$$ with a battery of capacity $$$c = 38$$$, using the path $$$3 \\rightarrow 9 \\rightarrow 8 \\rightarrow 7 \\rightarrow 2 \\rightarrow 7 \\rightarrow 6 \\rightarrow 5 \\rightarrow 4 \\rightarrow 1$$$<\/p><p>The robot can acheive the mission $$$(2, 3)$$$ with a battery of capacity $$$c = 15$$$, using the path $$$2 \\rightarrow 7 \\rightarrow 8 \\rightarrow 9 \\rightarrow 3$$$<\/p><\/div><\/div>"}, {"contestId": 1521, "index": "D", "name": "Nastia Plays with a Tree", "rating": 2500, "solvedCount": 2413, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Nastia Plays with a Tree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-it\">Nastia has an unweighted tree with $$$n$$$ vertices and wants to play with it!<\/span><\/p><p>The girl will perform the following operation with her tree, as long as she needs:<\/p><ol> <li> Remove any existing edge. <\/li><li> Add an edge between any pair of vertices. <\/li><\/ol><p>What is the <span class=\"tex-font-style-bf\">minimum<\/span> number of operations Nastia needs to get a bamboo from a tree? A bamboo is a tree in which no node has a degree greater than $$$2$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10\\,000$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$2 \\le n \\le 10^5$$$)\u00a0\u2014 the number of vertices in the tree.<\/p><p>Next $$$n - 1$$$ lines of each test cases describe the edges of the tree in form $$$a_i$$$, $$$b_i$$$ ($$$1 \\le a_i, b_i \\le n$$$, $$$a_i \\neq b_i$$$).<\/p><p>It's guaranteed the given graph is a tree and the sum of $$$n$$$ in one test doesn't exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case in the first line print a single integer $$$k$$$\u00a0\u2014 the minimum number of operations required to obtain a bamboo from the initial tree.<\/p><p>In the next $$$k$$$ lines print $$$4$$$ integers $$$x_1$$$, $$$y_1$$$, $$$x_2$$$, $$$y_2$$$ ($$$1 \\le x_1, y_1, x_2, y_{2} \\le n$$$, $$$x_1 \\neq y_1$$$, $$$x_2 \\neq y_2$$$)\u00a0\u2014 this way you remove the edge $$$(x_1, y_1)$$$ and add an undirected edge $$$(x_2, y_2)$$$.<\/p><p>Note that the edge $$$(x_1, y_1)$$$ must be present in the graph at the moment of removing.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n7\n1 2\n1 3\n2 4\n2 5\n3 6\n3 7\n4\n1 2\n1 3\n3 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n2 5 6 7\n3 6 4 5\n0<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Note the graph can be <span class=\"tex-font-style-bf\">unconnected<\/span> after a certain operation.<\/p><p>Consider the first test case of the example: <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/73847897ba4242f545a8475599d7b29981efc736.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center> The red edges are removed, and the green ones are added.<\/div><\/div>"}, {"contestId": 348, "index": "D", "name": "Turtles", "rating": 2500, "solvedCount": 2350, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Turtles<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>You've got a table of size <span class=\"tex-span\"><i>n<\/i>\u2009\u00d7\u2009<i>m<\/i><\/span>. We'll consider the table rows numbered from top to bottom 1 through <span class=\"tex-span\"><i>n<\/i><\/span>, and the columns numbered from left to right 1 through <span class=\"tex-span\"><i>m<\/i><\/span>. Then we'll denote the cell in row <span class=\"tex-span\"><i>x<\/i><\/span> and column <span class=\"tex-span\"><i>y<\/i><\/span> as <span class=\"tex-span\">(<i>x<\/i>,\u2009<i>y<\/i>)<\/span>.<\/p><p>Initially cell <span class=\"tex-span\">(1,\u20091)<\/span> contains two similar turtles. Both turtles want to get to cell <span class=\"tex-span\">(<i>n<\/i>,\u2009<i>m<\/i>)<\/span>. Some cells of the table have obstacles but it is guaranteed that there aren't any obstacles in the upper left and lower right corner. A turtle (one or the other) can go from cell <span class=\"tex-span\">(<i>x<\/i>,\u2009<i>y<\/i>)<\/span> to one of two cells <span class=\"tex-span\">(<i>x<\/i>\u2009+\u20091,\u2009<i>y<\/i>)<\/span> and <span class=\"tex-span\">(<i>x<\/i>,\u2009<i>y<\/i>\u2009+\u20091)<\/span>, as long as the required cell doesn't contain an obstacle. The turtles have had an argument so they don't want to have any chance of meeting each other along the way. Help them find the number of ways in which they can go from cell <span class=\"tex-span\">(1,\u20091)<\/span> to cell <span class=\"tex-span\">(<i>n<\/i>,\u2009<i>m<\/i>)<\/span>.<\/p><p>More formally, find the number of pairs of non-intersecting ways from cell <span class=\"tex-span\">(1,\u20091)<\/span> to cell <span class=\"tex-span\">(<i>n<\/i>,\u2009<i>m<\/i>)<\/span> modulo <span class=\"tex-span\">1000000007<\/span> <span class=\"tex-span\">(10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097)<\/span>. Two ways are called non-intersecting if they have exactly two common points \u2014 the starting point and the final point.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i>,\u2009<i>m<\/i><\/span> <span class=\"tex-span\">(2\u2009\u2264\u2009<i>n<\/i>,\u2009<i>m<\/i>\u2009\u2264\u20093000)<\/span>. Each of the following <span class=\"tex-span\"><i>n<\/i><\/span> lines contains <span class=\"tex-span\"><i>m<\/i><\/span> characters describing the table. The empty cells are marked by characters \"<span class=\"tex-font-style-tt\">.<\/span>\", the cells with obstacles are marked by \"<span class=\"tex-font-style-tt\">#<\/span>\".<\/p><p>It is guaranteed that the upper left and the lower right cells are empty.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In a single line print a single integer \u2014 the number of pairs of non-intersecting paths from cell <span class=\"tex-span\">(1,\u20091)<\/span> to cell <span class=\"tex-span\">(<i>n<\/i>,\u2009<i>m<\/i>)<\/span> modulo <span class=\"tex-span\">1000000007<\/span> <span class=\"tex-span\">(10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097)<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 5<br/>.....<br/>.###.<br/>.###.<br/>.....<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 3<br/>...<br/>...<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 2159, "index": "D1", "name": "Inverse Minimum Partition (Easy Version)", "rating": 2500, "solvedCount": 2286, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D1. Inverse Minimum Partition (Easy Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>1024 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p> <\/p><p><span class=\"tex-font-style-bf\">This is the easy version of the problem. The difference between the versions is that in this version, you are only asked to find $$$f(a)$$$. You can hack only if you solved all versions of this problem.<\/span> <\/p><p>For some sequence $$$b$$$ of $$$k$$$ positive integers, the cost of the sequence is defined as follows$$$^{\\text{\u2217}}$$$:<\/p><p>$$$$$$\\mathtt{cost}(b)=\\left\\lceil{\\frac{b_k}{\\min(b_1,b_2,\\ldots,b_k)}}\\right\\rceil$$$$$$<\/p><p>Assume that you partition a sequence $$$c$$$ into one or more sequences, so that the sequences become $$$c$$$ when concatenated. For example, when the sequence $$$c$$$ is $$$[3,1,4,1,5]$$$, a few valid ways to partition the sequence are $$$[[3,1],[4,1,5]]$$$, $$$[[3],[1,4,1],[5]]$$$, $$$[[3,1,4,1,5]]$$$. On the other hand, $$$[[3,1],[1,5]]$$$ and $$$[[3,4,1],[1,5]]$$$ are not valid ways to partition the sequence. <\/p><p>For a partition of a sequence $$$c$$$ of positive integers, the total cost of the partition is defined as the sum of the costs of each sequence in the partition. Then, let us define $$$f(c)$$$ as the minimum total cost to partition the sequence $$$c$$$.<\/p><p>Given a sequence $$$a$$$ of $$$n$$$ positive integers, you must compute the value of $$$f(a)$$$.<\/p><div class=\"statement-footnote\"><p>$$$^{\\text{\u2217}}$$$Given a real value $$$x$$$, $$$\\left\\lceil{x}\\right\\rceil$$$ is defined as the smallest integer no less than $$$x$$$. For example, the value of $$$\\left\\lceil{3.14}\\right\\rceil$$$ is $$$4$$$.<\/p><\/div><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 4\\cdot 10^5$$$).<\/p><p>The second line of each test case contains $$$a_1,a_2,\\ldots,a_n$$$ ($$$1 \\le a_i \\le 10^{18}$$$). <\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$4\\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output the answer to the problem on a separate line.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 1 4 1 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">10<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">9 2 6 5 3 5 8 9 7 9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 2 3 4 5 6 7 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 1000000000000000000<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n<div class=\"test-example-line test-example-line-odd test-example-line-1\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2<\/div><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first test case, the partition $$$[[3,1,4,1],[5]]$$$ gives a total cost of $$$1+1=2$$$.<\/p><p>For the second test case, the partition $$$[[9,2,6,5,3],[5,8,9,7,9]]$$$ gives a total cost of $$$2+2=4$$$.<\/p><p>For the third test case, the partition $$$[[1],[2,3,4],[5,6,7,8]]$$$ gives a total cost of $$$1+2+2=5$$$.<\/p><p>For the fourth test case, the partition $$$[[1],[1\\,000\\,000\\,000\\,000\\,000\\,000]]$$$ gives a total cost of $$$1+1=2$$$.<\/p><\/div><\/div>"}, {"contestId": 1548, "index": "C", "name": "The Three Little Pigs", "rating": 2500, "solvedCount": 2285, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. The Three Little Pigs<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Three little pigs from all over the world are meeting for a convention! Every minute, a triple of 3 new pigs arrives on the convention floor. After the $$$n$$$-th minute, the convention ends.<\/p><p>The big bad wolf has learned about this convention, and he has an attack plan. At some minute in the convention, he will arrive and eat exactly $$$x$$$ pigs. Then he will get away.<\/p><p>The wolf wants Gregor to help him figure out the number of possible attack plans that involve eating exactly $$$x$$$ pigs for various values of $$$x$$$ ($$$1 \\le x \\le 3n$$$). Two attack plans are considered different, if they occur at different times or if the sets of little pigs to eat are different.<\/p><p>Note that all queries are independent, that is, the wolf does not eat the little pigs, he only makes plans!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains two integers $$$n$$$ and $$$q$$$ ($$$1 \\le n \\le 10^6$$$, $$$1 \\le q \\le 2\\cdot 10^5$$$), the number of minutes the convention lasts and the number of queries the wolf asks.<\/p><p>Each of the next $$$q$$$ lines contains a single integer $$$x_i$$$ ($$$1 \\le x_i \\le 3n$$$), the number of pigs the wolf will eat in the $$$i$$$-th query.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>You should print $$$q$$$ lines, with line $$$i$$$ representing the number of attack plans if the wolf wants to eat $$$x_i$$$ pigs. Since each query answer can be large, output each answer modulo $$$10^9+7$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2 3\n1\n5\n6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n9\n6\n1\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 4\n2\n4\n6\n8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n225\n2001\n6014\n6939\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the example test, $$$n=2$$$. Thus, there are $$$3$$$ pigs at minute $$$1$$$, and $$$6$$$ pigs at minute $$$2$$$. There are three queries: $$$x=1$$$, $$$x=5$$$, and $$$x=6$$$.<\/p><p>If the wolf wants to eat $$$1$$$ pig, he can do so in $$$3+6=9$$$ possible attack plans, depending on whether he arrives at minute $$$1$$$ or $$$2$$$.<\/p><p>If the wolf wants to eat $$$5$$$ pigs, the wolf cannot arrive at minute $$$1$$$, since there aren't enough pigs at that time. Therefore, the wolf has to arrive at minute $$$2$$$, and there are $$$6$$$ possible attack plans.<\/p><p>If the wolf wants to eat $$$6$$$ pigs, his only plan is to arrive at the end of the convention and devour everybody.<\/p><p>Remember to output your answers modulo $$$10^9+7$$$!<\/p><\/div><\/div>"}, {"contestId": 1572, "index": "B", "name": "Xor of 3", "rating": 2500, "solvedCount": 2276, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Xor of 3<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a sequence $$$a$$$ of length $$$n$$$ consisting of $$$0$$$s and $$$1$$$s.<\/p><p>You can perform the following operation on this sequence: <\/p><ul> <li> Pick an index $$$i$$$ from $$$1$$$ to $$$n-2$$$ (inclusive). <\/li><li> Change all of $$$a_{i}$$$, $$$a_{i+1}$$$, $$$a_{i+2}$$$ to $$$a_{i} \\oplus a_{i+1} \\oplus a_{i+2}$$$ simultaneously, where $$$\\oplus$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#XOR\">bitwise XOR operation<\/a> <\/li><\/ul> Find a sequence of <span class=\"tex-font-style-bf\">at most<\/span> $$$n$$$ operations that changes all elements of $$$a$$$ to $$$0$$$s or report that it's impossible.<p>We can prove that if there exists a sequence of operations of any length that changes all elements of $$$a$$$ to $$$0$$$s, then there is also such a sequence of length not greater than $$$n$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$).<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$3 \\le n \\le 2\\cdot10^5$$$) \u2014 the length of $$$a$$$.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$a_i = 0$$$ or $$$a_i = 1$$$) \u2014 elements of $$$a$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2\\cdot10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, do the following: <\/p><ul> <li> if there is no way of making all the elements of $$$a$$$ equal to $$$0$$$ after performing the above operation some number of times, print \"<span class=\"tex-font-style-tt\">NO<\/span>\". <\/li><li> otherwise, in the first line print \"<span class=\"tex-font-style-tt\">YES<\/span>\", in the second line print $$$k$$$ ($$$0 \\le k \\le n$$$) \u2014 the number of operations that you want to perform on $$$a$$$, and in the third line print a sequence $$$b_1, b_2, \\dots, b_k$$$ ($$$1 \\le b_i \\le n - 2$$$) \u2014 the indices on which the operation should be applied. <\/li><\/ul><p>If there are multiple solutions, you may print any.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n3\n0 0 0\n5\n1 1 1 1 0\n4\n1 0 0 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\n0\nYES\n2\n3 1\nNO\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, the sequence contains only $$$0$$$s so we don't need to change anything.<\/p><p>In the second example, we can transform $$$[1, 1, 1, 1, 0]$$$ to $$$[1, 1, 0, 0, 0]$$$ and then to $$$[0, 0, 0, 0, 0]$$$ by performing the operation on the third element of $$$a$$$ and then on the first element of $$$a$$$.<\/p><p>In the third example, no matter whether we first perform the operation on the first or on the second element of $$$a$$$ we will get $$$[1, 1, 1, 1]$$$, which cannot be transformed to $$$[0, 0, 0, 0]$$$.<\/p><\/div><\/div>"}, {"contestId": 704, "index": "B", "name": "Ant Man", "rating": 2500, "solvedCount": 2274, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Ant Man<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Scott Lang is at war with Darren Cross. There are <span class=\"tex-span\"><i>n<\/i><\/span> chairs in a hall where they are, numbered with <span class=\"tex-span\">1,\u20092,\u2009...,\u2009<i>n<\/i><\/span> from left to right. The <span class=\"tex-span\"><i>i<\/i><\/span>-th chair is located at coordinate <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. Scott is on chair number <span class=\"tex-span\"><i>s<\/i><\/span> and Cross is on chair number <span class=\"tex-span\"><i>e<\/i><\/span>. Scott can jump to all other chairs (not only neighboring chairs). He wants to start at his position (chair number <span class=\"tex-span\"><i>s<\/i><\/span>), visit each chair <span class=\"tex-font-style-bf\">exactly once<\/span> and end up on chair number <span class=\"tex-span\"><i>e<\/i><\/span> with Cross. <\/p><p>As we all know, Scott can shrink or grow big (grow big only to his normal size), so at any moment of time he can be either small or large (normal). The thing is, he can only shrink or grow big while being on a chair (not in the air while jumping to another chair). Jumping takes time, but shrinking and growing big takes no time. Jumping from chair number <span class=\"tex-span\"><i>i<\/i><\/span> to chair number <span class=\"tex-span\"><i>j<\/i><\/span> takes <span class=\"tex-span\">|<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009-\u2009<i>x<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>|<\/span> seconds. Also, jumping off a chair and landing on a chair takes extra amount of time. <\/p><p>If Scott wants to jump to a chair on his left, he can only be small, and if he wants to jump to a chair on his right he should be large.<\/p><p>Jumping off the <span class=\"tex-span\"><i>i<\/i><\/span>-th chair takes:<\/p><ul> <li> <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> extra seconds if he's small. <\/li><li> <span class=\"tex-span\"><i>d<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> extra seconds otherwise (he's large). <\/li><\/ul><p>Also, landing on <span class=\"tex-span\"><i>i<\/i><\/span>-th chair takes:<\/p><ul> <li> <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> extra seconds if he's small. <\/li><li> <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> extra seconds otherwise (he's large). <\/li><\/ul><p>In simpler words, jumping from <span class=\"tex-span\"><i>i<\/i><\/span>-th chair to <span class=\"tex-span\"><i>j<\/i><\/span>-th chair takes exactly:<\/p><ul> <li> <span class=\"tex-span\">|<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009-\u2009<i>x<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>|\u2009+\u2009<i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009+\u2009<i>b<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span> seconds if <span class=\"tex-span\"><i>j<\/i>\u2009&lt;\u2009<i>i<\/i><\/span>. <\/li><li> <span class=\"tex-span\">|<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009-\u2009<i>x<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>|\u2009+\u2009<i>d<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009+\u2009<i>a<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span> seconds otherwise (<span class=\"tex-span\"><i>j<\/i>\u2009&gt;\u2009<i>i<\/i><\/span>). <\/li><\/ul><p>Given values of <span class=\"tex-span\"><i>x<\/i><\/span>, <span class=\"tex-span\"><i>a<\/i><\/span>, <span class=\"tex-span\"><i>b<\/i><\/span>, <span class=\"tex-span\"><i>c<\/i><\/span>, <span class=\"tex-span\"><i>d<\/i><\/span> find the minimum time Scott can get to Cross, assuming he wants to visit each chair exactly once.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains three integers <span class=\"tex-span\"><i>n<\/i>,\u2009<i>s<\/i><\/span> and <span class=\"tex-span\"><i>e<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20095000,\u20091\u2009\u2264\u2009<i>s<\/i>,\u2009<i>e<\/i>\u2009\u2264\u2009<i>n<\/i>,\u2009<i>s<\/i>\u2009\u2260\u2009<i>e<\/i><\/span>)\u00a0\u2014 the total number of chairs, starting and ending positions of Scott.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>x<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>x<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\">1<\/sub>\u2009&lt;\u2009<i>x<\/i><sub class=\"lower-index\">2<\/sub>\u2009&lt;\u2009...\u2009&lt;\u2009<i>x<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>).<\/p><p>The third line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>).<\/p><p>The fourth line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>b<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>b<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>b<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>).<\/p><p>The fifth line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>c<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>c<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>c<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>).<\/p><p>The sixth line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>d<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>d<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>d<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>d<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>d<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>d<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the minimum amount of time Scott needs to get to the Cross while visiting each chair exactly once.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>7 4 3<br/>8 11 12 16 17 18 20<br/>17 16 20 2 20 5 13<br/>17 8 8 16 12 15 13<br/>12 4 16 4 15 7 6<br/>8 14 2 11 17 12 8<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>139<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the sample testcase, an optimal solution would be <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/5bbd3e094ffa5a72e263dfaec7aeaff795bc22a3.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>. Spent time would be <span class=\"tex-span\">17\u2009+\u200924\u2009+\u200923\u2009+\u200920\u2009+\u200933\u2009+\u200922\u2009=\u2009139<\/span>.<\/p><\/div><\/div>"}, {"contestId": 551, "index": "E", "name": "GukiZ and GukiZiana", "rating": 2500, "solvedCount": 2266, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. GukiZ and GukiZiana<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>10 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Professor GukiZ was playing with arrays again and accidentally discovered new function, which he called <span class=\"tex-span\"><i>GukiZiana<\/i><\/span>. For given array <span class=\"tex-span\"><i>a<\/i><\/span>, indexed with integers from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span>, and number <span class=\"tex-span\"><i>y<\/i><\/span>, <span class=\"tex-span\"><i>GukiZiana<\/i>(<i>a<\/i>,\u2009<i>y<\/i>)<\/span> represents maximum value of <span class=\"tex-span\"><i>j<\/i>\u2009-\u2009<i>i<\/i><\/span>, such that <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub>\u2009=\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009=\u2009<i>y<\/i><\/span>. If there is no <span class=\"tex-span\"><i>y<\/i><\/span> as an element in <span class=\"tex-span\"><i>a<\/i><\/span>, then <span class=\"tex-span\"><i>GukiZiana<\/i>(<i>a<\/i>,\u2009<i>y<\/i>)<\/span> is equal to <span class=\"tex-span\">\u2009-\u20091<\/span>. GukiZ also prepared a problem for you. This time, you have two types of queries: <\/p><ol> <li> First type has form <span class=\"tex-span\">1<\/span> <span class=\"tex-span\"><i>l<\/i><\/span> <span class=\"tex-span\"><i>r<\/i><\/span> <span class=\"tex-span\"><i>x<\/i><\/span> and asks you to increase values of all <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> such that <span class=\"tex-span\"><i>l<\/i>\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>r<\/i><\/span> by the non-negative integer <span class=\"tex-span\"><i>x<\/i><\/span>. <\/li><li> Second type has form <span class=\"tex-span\">2<\/span> <span class=\"tex-span\"><i>y<\/i><\/span> and asks you to find value of <span class=\"tex-span\"><i>GukiZiana<\/i>(<i>a<\/i>,\u2009<i>y<\/i>)<\/span>. <\/li><\/ol><p>For each query of type <span class=\"tex-span\">2<\/span>, print the answer and make GukiZ happy!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>q<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20095\u2009*\u200910<sup class=\"upper-index\">5<\/sup>,\u20091\u2009\u2264\u2009<i>q<\/i>\u2009\u2264\u20095\u2009*\u200910<sup class=\"upper-index\">4<\/sup><\/span>), size of array <span class=\"tex-span\"><i>a<\/i><\/span>, and the number of queries. <\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009... <i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>), forming an array <span class=\"tex-span\"><i>a<\/i><\/span>. <\/p><p>Each of next <span class=\"tex-span\"><i>q<\/i><\/span> lines contain either four or two numbers, as described in statement:<\/p><p>If line starts with <span class=\"tex-span\">1<\/span>, then the query looks like <span class=\"tex-span\">1<\/span> <span class=\"tex-span\"><i>l<\/i><\/span> <span class=\"tex-span\"><i>r<\/i><\/span> <span class=\"tex-span\"><i>x<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\">0\u2009\u2264\u2009<i>x<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>), first type query.<\/p><p>If line starts with <span class=\"tex-span\">2<\/span>, then th query looks like <span class=\"tex-span\">2<\/span> <span class=\"tex-span\"><i>y<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>y<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>), second type query.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query of type <span class=\"tex-span\">2<\/span>, print the value of <span class=\"tex-span\"><i>GukiZiana<\/i>(<i>a<\/i>,\u2009<i>y<\/i>)<\/span>, for <span class=\"tex-span\"><i>y<\/i><\/span> value for that query.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 3<br/>1 2 3 4<br/>1 1 2 1<br/>1 1 1 1<br/>2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 3<br/>1 2<br/>1 2 2 1<br/>2 3<br/>2 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/>-1<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 2101, "index": "D", "name": "Mani and Segments", "rating": 2500, "solvedCount": 2243, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Mani and Segments<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p> <\/p><p>An array $$$b$$$ of length $$$|b|$$$ is <span class=\"tex-font-style-it\">cute<\/span> if the sum of the length of its Longest Increasing Subsequence (LIS) and the length of its Longest Decreasing Subsequence (LDS)$$$^{\\text{\u2217}}$$$ is <span class=\"tex-font-style-bf\">exactly<\/span> one more than the length of the array. More formally, the array $$$b$$$ is cute if $$$\\operatorname{LIS}(b) + \\operatorname{LDS}(b) = |b| + 1$$$.<\/p><p>You are given a permutation $$$a$$$ of length $$$n$$$$$$^{\\text{\u2020}}$$$. Your task is to count the number of non-empty subarrays$$$^{\\text{\u2021}}$$$ of permutation $$$a$$$ that are cute.<\/p><div class=\"statement-footnote\"><p>$$$^{\\text{\u2217}}$$$A sequence $$$x$$$ is a subsequence of a sequence $$$y$$$ if $$$x$$$ can be obtained from $$$y$$$ by the deletion of several (possibly, zero or all) element from arbitrary positions. <\/p><p>The longest increasing (decreasing) subsequence of an array is the longest subsequence such that its elements are ordered in strictly increasing (decreasing) order.<\/p><p>$$$^{\\text{\u2020}}$$$A permutation of length $$$n$$$ is an array consisting of $$$n$$$ distinct integers from $$$1$$$ to $$$n$$$ in arbitrary order. For example, $$$[2,3,1,5,4]$$$ is a permutation, but $$$[1,2,2]$$$ is not a permutation ($$$2$$$ appears twice in the array), and $$$[1,3,4]$$$ is also not a permutation ($$$n=3$$$ but there is $$$4$$$ in the array). <\/p><p>$$$^{\\text{\u2021}}$$$An array $$$x$$$ is a subarray of an array $$$y$$$ if $$$x$$$ can be obtained from $$$y$$$ by the deletion of several (possibly, zero or all) elements from the beginning and several (possibly, zero or all) elements from the end. <\/p><\/div><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1\\le n\\le 2 \\cdot 10^5 $$$)\u00a0\u2014 the length of permutation $$$a$$$.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le n$$$)\u00a0\u2014 the elements of permutation $$$a$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output the number of cute non-empty subarrays of permutation $$$a$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 3 4 5 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 4 1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">7<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 2 3 4 5 6 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">7 8 2 4 5 10 1 3 6 9<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n15\n9\n28\n36\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, all of the $$$6$$$ non-empty subarrays are cute:<\/p><ul><li> $$$[3]$$$: $$$\\operatorname{LIS}([3]) + \\operatorname{LDS}([3]) = 1 + 1 = 2$$$.<\/li><li> $$$[1]$$$: $$$\\operatorname{LIS}([1]) + \\operatorname{LDS}([1]) = 1 + 1 = 2$$$.<\/li><li> $$$[2]$$$: $$$\\operatorname{LIS}([2]) + \\operatorname{LDS}([2]) = 1 + 1 = 2$$$.<\/li><li> $$$[3, 1]$$$: $$$\\operatorname{LIS}([3, 1]) + \\operatorname{LDS}([3, 1]) = 1 + 2 = 3$$$.<\/li><li> $$$[1, 2]$$$: $$$\\operatorname{LIS}([1, 2]) + \\operatorname{LDS}([1, 2]) = 2 + 1 = 3$$$.<\/li><li> $$$[3, 1, 2]$$$: $$$\\operatorname{LIS}([3, 1, 2]) + \\operatorname{LDS}([3, 1, 2]) = 2 + 2 = 4$$$.<\/li><\/ul><p>In the second test case, one of the cute subarrays is $$$[2, 3, 4, 5, 1]$$$ as $$$\\operatorname{LIS}([2, 3, 4, 5, 1]) = 4$$$ and $$$\\operatorname{LDS}([2, 3, 4, 5, 1]) = 2$$$, which satisfies $$$4 + 2 = 5 + 1$$$.<\/p><\/div><\/div>"}, {"contestId": 1188, "index": "C", "name": "Array Beauty", "rating": 2500, "solvedCount": 2236, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Array Beauty<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Let's call beauty of an array $$$b_1, b_2, \\ldots, b_n$$$ ($$$n  \\gt  1$$$) \u00a0\u2014 $$$\\min\\limits_{1 \\leq i  \\lt  j \\leq n} |b_i - b_j|$$$.<\/p><p>You're given an array $$$a_1, a_2, \\ldots a_n$$$ and a number $$$k$$$. Calculate the sum of beauty over all subsequences of the array of length exactly $$$k$$$. As this number can be very large, output it modulo $$$998244353$$$.<\/p><p>A sequence $$$a$$$ is a subsequence of an array $$$b$$$ if $$$a$$$ can be obtained from $$$b$$$ by deletion of several (possibly, zero or all) elements.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integers $$$n, k$$$ ($$$2 \\le k \\le n \\le 1000$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ld

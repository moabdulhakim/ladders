all edges.<\/p><p>For all $$$k$$$ such that $$$0 \\leq k \\leq n$$$, Tenzing wants to know the maximum value of the tree when $$$k$$$ vertices are painted black and $$$n-k$$$ vertices are painted white.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains a single integer $$$n$$$ ($$$1\\leq n\\leq 5000$$$)\u00a0\u2014 the number of vertices.<\/p><p>The following $$$n-1$$$ lines of the input contains $$$2$$$ integers $$$u_i$$$ and $$$v_i$$$ ($$$1 \\leq u_i, v_i \\leq n, u_i \\neq v_i$$$)\u00a0\u2014 indicating an edge between vertices $$$u_i$$$ and $$$v_i$$$. It is guaranteed that the given edges form a tree.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output $$$n+1$$$ numbers. The $$$i$$$-th number is the answer of $$$k=i-1$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n1 2\n3 2\n2 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0 3 4 5 6 \n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0 0 \n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Consider the first example. When $$$k=2$$$, Tenzing can paint vertices $$$1$$$ and $$$2$$$ black then the value of edge $$$(1,2)$$$ is 0, and the values of other edges are all equal to $$$2$$$. So the value of that tree is $$$4$$$.<\/p><\/div><\/div>"}, {"contestId": 416, "index": "E", "name": "President's Path", "rating": 2500, "solvedCount": 1931, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. President's Path<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Good old Berland has <span class=\"tex-span\"><i>n<\/i><\/span> cities and <span class=\"tex-span\"><i>m<\/i><\/span> roads. Each road connects a pair of distinct cities and is bidirectional. Between any pair of cities, there is at most one road. For each road, we know its length.<\/p><p>We also know that the President will soon ride along the Berland roads from city <span class=\"tex-span\"><i>s<\/i><\/span> to city <span class=\"tex-span\"><i>t<\/i><\/span>. Naturally, he will choose one of the shortest paths from <span class=\"tex-span\"><i>s<\/i><\/span> to <span class=\"tex-span\"><i>t<\/i><\/span>, but nobody can say for sure which path he will choose.<\/p><p>The Minister for Transport is really afraid that the President might get upset by the state of the roads in the country. That is the reason he is planning to repair the roads in the possible President's path.<\/p><p>Making the budget for such an event is not an easy task. For all possible distinct pairs <span class=\"tex-span\"><i>s<\/i>,\u2009<i>t<\/i><\/span> (<span class=\"tex-span\"><i>s<\/i>\u2009&lt;\u2009<i>t<\/i><\/span>) find the number of roads that lie on at least one shortest path from <span class=\"tex-span\"><i>s<\/i><\/span> to <span class=\"tex-span\"><i>t<\/i><\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains integers <span class=\"tex-span\"><i>n<\/i>,\u2009<i>m<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009500<\/span>, <span class=\"tex-span\">0\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u2009<i>n<\/i>\u00b7(<i>n<\/i>\u2009-\u20091)\u2009/\u20092<\/span>) \u2014 the number of cities and roads, correspondingly. Then <span class=\"tex-span\"><i>m<\/i><\/span> lines follow, containing the road descriptions, one description per line. Each description contains three integers <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>,\u2009<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2260\u2009<i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u20091\u2009\u2264\u2009<i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup><\/span>), where <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> are the numbers of the cities connected by the <span class=\"tex-span\"><i>i<\/i><\/span>-th road and <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is its length.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the sequence of <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/c37fde31a098626cbb7d832c868254ecd5d67d42.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> integers <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\">12<\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\">13<\/sub>,\u2009...,\u2009<i>c<\/i><sub class=\"lower-index\">1<i>n<\/i><\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\">23<\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\">24<\/sub>,\u2009...,\u2009<i>c<\/i><sub class=\"lower-index\">2<i>n<\/i><\/sub>,\u2009...,\u2009<i>c<\/i><sub class=\"lower-index\"><i>n<\/i>\u2009-\u20091,\u2009<i>n<\/i><\/sub><\/span>, where <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\"><i>st<\/i><\/sub><\/span> is the number of roads that can lie on the shortest path from <span class=\"tex-span\"><i>s<\/i><\/span> to <span class=\"tex-span\"><i>t<\/i><\/span>. Print the elements of sequence <span class=\"tex-span\"><i>c<\/i><\/span> in the described order. If the pair of cities <span class=\"tex-span\"><i>s<\/i><\/span> and <span class=\"tex-span\"><i>t<\/i><\/span> don't have a path between them, then <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\"><i>st<\/i><\/sub>\u2009=\u20090<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 6<br/>1 2 1<br/>2 3 1<br/>3 4 1<br/>4 1 1<br/>2 4 2<br/>4 5 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1 4 1 2 1 5 6 1 2 1 <\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 813, "index": "F", "name": "Bipartite Checking", "rating": 2500, "solvedCount": 1885, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Bipartite Checking<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>6 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an undirected graph consisting of <span class=\"tex-span\"><i>n<\/i><\/span> vertices. Initially there are no edges in the graph. Also you are given <span class=\"tex-span\"><i>q<\/i><\/span> queries, each query either adds one undirected edge to the graph or removes it. After each query you have to check if the resulting graph is bipartite (that is, you can paint all vertices of the graph into two colors so that there is no edge connecting two vertices of the same color).<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>q<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>,\u2009<i>q<\/i>\u2009\u2264\u2009100000<\/span>).<\/p><p>Then <span class=\"tex-span\"><i>q<\/i><\/span> lines follow. <span class=\"tex-span\"><i>i<\/i><\/span>th line contains two numbers <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009&lt;\u2009<i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>). These numbers describe <span class=\"tex-span\"><i>i<\/i><\/span>th query: if there is an edge between vertices <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, then remove it, otherwise add it.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>q<\/i><\/span> lines. <span class=\"tex-span\"><i>i<\/i><\/span>th line must contain <span class=\"tex-font-style-tt\">YES<\/span> if the graph is bipartite after <span class=\"tex-span\"><i>i<\/i><\/span>th query, and <span class=\"tex-font-style-tt\">NO<\/span> otherwise.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 5<br/>2 3<br/>1 3<br/>1 2<br/>1 2<br/>1 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/>YES<br/>NO<br/>YES<br/>NO<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1665, "index": "E", "name": "MinimizOR", "rating": 2500, "solvedCount": 1869, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. MinimizOR<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ of $$$n$$$ non-negative integers, numbered from $$$1$$$ to $$$n$$$.<\/p><p>Let's define the <span class=\"tex-font-style-it\">cost<\/span> of the array $$$a$$$ as $$$\\displaystyle \\min_{i \\neq j} a_i | a_j$$$, where $$$|$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#OR\">bitwise OR operation<\/a>.<\/p><p>There are $$$q$$$ queries. For each query you are given two integers $$$l$$$ and $$$r$$$ ($$$l  \\lt  r$$$). For each query you should find the cost of the subarray $$$a_{l}, a_{l + 1}, \\ldots, a_{r}$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test case consists of several test cases. The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 10^4$$$)\u00a0\u2014 the number of test cases.<\/p><p>The first line of each test case contains an integer $$$n$$$ ($$$2 \\le n \\le 10^5$$$)\u00a0\u2014 the length array $$$a$$$.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$0 \\le a_i  \\lt  2^{30}$$$)\u00a0\u2014 the elements of $$$a$$$.<\/p><p>The third line of each test case contains an integer $$$q$$$ ($$$1 \\le q \\le 10^5$$$)\u00a0\u2014 the number of queries.<\/p><p>Each of the next $$$q$$$ lines contains two integers $$$l_j$$$, $$$r_j$$$ ($$$1 \\le l_j  \\lt  r_j \\le n$$$)\u00a0\u2014 the description of the $$$j$$$-th query.<\/p><p>It is guaranteed that the sum of $$$n$$$ and the sum of $$$q$$$ over all test cases do not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case print $$$q$$$ numbers, where the $$$j$$$-th number is the cost of array $$$a_{l_j}, a_{l_j + 1}, \\ldots, a_{r_j}$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">6 1 3 2 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">0 2 1 1073741823<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 4<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n7\n3\n3\n1\n2\n3\n1\n1073741823\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case the array $$$a$$$ is<\/p><p>$$$110_2, 001_2, 011_2, 010_2, 001_2$$$.<\/p><p>That's why the answers for the queries are:<\/p><ul> <li> $$$[1; 2]$$$: $$$a_1 | a_2 = 110_2 | 001_2 = 111_2 = 7$$$; <\/li><li> $$$[2; 3]$$$: $$$a_2 | a_3 = 001_2 | 011_2 = 011_2 = 3$$$; <\/li><li> $$$[2; 4]$$$: $$$a_2 | a_3 = a_3 | a_4 = a_2 | a_4 = 011_2 = 3$$$; <\/li><li> $$$[2; 5]$$$: $$$a_2 | a_5 = 001_2 = 1$$$. <\/li><\/ul><p>In the second test case the array $$$a$$$ is<\/p><p>$$$00_2, 10_2, 01_2, \\underbrace{11\\ldots 1_2}_{30}$$$ ($$$a_4 = 2^{30} - 1$$$).<\/p><p>That's why the answers for the queries are:<\/p><ul> <li> $$$[1; 2]$$$: $$$a_1 | a_2 = 10_2 = 2$$$; <\/li><li> $$$[2; 3]$$$: $$$a_2 | a_3 = 11_2 = 3$$$; <\/li><li> $$$[1; 3]$$$: $$$a_1 | a_3 = 01_2 = 1$$$; <\/li><li> $$$[3; 4]$$$: $$$a_3 | a_4 = 01_2 | \\underbrace{11\\ldots 1_2}_{30} = 2^{30} - 1 = 1073741823$$$. <\/li><\/ul><\/div><\/div>"}, {"contestId": 1467, "index": "E", "name": "Distinctive Roots in a Tree", "rating": 2500, "solvedCount": 1860, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Distinctive Roots in a Tree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a tree with $$$n$$$ vertices. Each vertex $$$i$$$ has a value $$$a_i$$$ associated with it.<\/p><p>Let us root the tree at some vertex $$$v$$$. The vertex $$$v$$$ is called a <span class=\"tex-font-style-it\">distinctive root<\/span> if the following holds: in all paths that start at $$$v$$$ and end at some other node, all the values encountered are distinct. Two different paths may have values in common but a single path must have all distinct values.<\/p><p>Find the number of <span class=\"tex-font-style-it\">distinctive roots<\/span> in the tree.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains a single integer $$$n$$$ ($$$1 \\le n \\le 2\\cdot10^5$$$) \u2014 the number of vertices in the tree.<\/p><p>The next line contains $$$n$$$ space-separated integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$).<\/p><p>The following $$$n-1$$$ lines each contain two space-separated integers $$$u$$$ and $$$v$$$ ($$$1 \\le u$$$, $$$v \\le n$$$), denoting an edge from $$$u$$$ to $$$v$$$.<\/p><p>It is guaranteed that the edges form a tree.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u2014 the number of <span class=\"tex-font-style-it\">distinctive roots<\/span> in the tree.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n2 5 1 1 4\n1 2\n1 3\n2 4\n2 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n2 1 1 1 4\n1 2\n1 3\n2 4\n2 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, $$$1$$$, $$$2$$$ and $$$5$$$ are <span class=\"tex-font-style-it\">distinctive roots<\/span>.<\/p><\/div><\/div>"}, {"contestId": 1174, "index": "E", "name": "Ehab and the Expected GCD Problem", "rating": 2500, "solvedCount": 1857, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Ehab and the Expected GCD Problem<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Let's define a function $$$f(p)$$$ on a permutation $$$p$$$ as follows. Let $$$g_i$$$ be the <a href=\"https://en.wikipedia.org/wiki/Greatest_common_divisor\">greatest common divisor (GCD)<\/a> of elements $$$p_1$$$, $$$p_2$$$, ..., $$$p_i$$$ (in other words, it is the GCD of the prefix of length $$$i$$$). Then $$$f(p)$$$ is the number of <span class=\"tex-font-style-bf\">distinct<\/span> elements among $$$g_1$$$, $$$g_2$$$, ..., $$$g_n$$$.<\/p><p>Let $$$f_{max}(n)$$$ be the maximum value of $$$f(p)$$$ among all permutations $$$p$$$ of integers $$$1$$$, $$$2$$$, ..., $$$n$$$.<\/p><p>Given an integers $$$n$$$, count the number of permutations $$$p$$$ of integers $$$1$$$, $$$2$$$, ..., $$$n$$$, such that $$$f(p)$$$ is equal to $$$f_{max}(n)$$$. Since the answer may be large, print the remainder of its division by $$$1000\\,000\\,007 = 10^9 + 7$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line contains the integer $$$n$$$ ($$$2 \\le n \\le 10^6$$$)\u00a0\u2014 the length of the permutations.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>The only line should contain your answer modulo $$$10^9+7$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n120<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Consider the second example: these are the permutations of length $$$3$$$:<\/p><ul> <li> $$$[1,2,3]$$$, $$$f(p)=1$$$. <\/li><li> $$$[1,3,2]$$$, $$$f(p)=1$$$. <\/li><li> $$$[2,1,3]$$$, $$$f(p)=2$$$. <\/li><li> $$$[2,3,1]$$$, $$$f(p)=2$$$. <\/li><li> $$$[3,1,2]$$$, $$$f(p)=2$$$. <\/li><li> $$$[3,2,1]$$$, $$$f(p)=2$$$. <\/li><\/ul><p>The maximum value $$$f_{max}(3) = 2$$$, and there are $$$4$$$ permutations $$$p$$$ such that $$$f(p)=2$$$.<\/p><\/div><\/div>"}, {"contestId": 1746, "index": "E1", "name": "Joking (Easy Version)", "rating": 2500, "solvedCount": 1849, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E1. Joking (Easy Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-it\">The only difference between this problem and the hard version is the maximum number of questions.<\/span><\/p><p><span class=\"tex-font-style-it\">This is an interactive problem.<\/span><\/p><p>There is a hidden integer $$$1 \\le x \\le n$$$ which you have to find. In order to find it you can ask at most $$$\\mathbf{82}$$$ questions.<\/p><p>In each question you can choose a non-empty integer set $$$S$$$ and ask if $$$x$$$ belongs to $$$S$$$ or not, after each question, if $$$x$$$ belongs to $$$S$$$, you'll receive \"<span class=\"tex-font-style-tt\">YES<\/span>\", otherwise \"<span class=\"tex-font-style-tt\">NO<\/span>\".<\/p><p>But the problem is that not all answers are necessarily true (some of them are joking), it's just guaranteed that for each two consecutive questions, at least one of them is answered correctly.<\/p><p>Additionally to the questions, you can make at most $$$2$$$ guesses for the answer $$$x$$$. Each time you make a guess, if you guess $$$x$$$ correctly, you receive \"<span class=\"tex-font-style-tt\">:)<\/span>\" and your program should terminate, otherwise you'll receive \"<span class=\"tex-font-style-tt\">:(<\/span>\".<\/p><p>As a part of the joking, we will <span class=\"tex-font-style-bf\">not<\/span> fix the value of $$$x$$$ in the beginning. Instead, it can change throughout the interaction as long as all the previous responses are valid as described above.<\/p><p>Note that your answer guesses are always answered correctly. If you ask a question before and after a guess, at least one of these two questions is answered correctly, as normal.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line of the input contains a single integer $$$n$$$ ($$$1 \\le n \\le 10^5$$$), the maximum possible value of $$$x$$$.<\/p><\/div><div><div class=\"section-title\">Interaction<\/div><p>For each question, if you want to ask about a set $$$S$$$, first print the character '<span class=\"tex-font-style-tt\">?<\/span>', then print the size of $$$S$$$ and then print the elements of $$$S$$$ one by one. Each element should be an integer between $$$1$$$ and $$$n$$$, the elements must be distinct. After each question, read a string \"<span class=\"tex-font-style-tt\">YES<\/span>\" or \"<span class=\"tex-font-style-tt\">NO<\/span>\", as explained in the statement. You can make at most $$$82$$$ such questions.<\/p><p>If you want to guess for $$$x$$$, first print the character '<span class=\"tex-font-style-tt\">!<\/span>' and then print your guess. After each guess, read \"<span class=\"tex-font-style-tt\">:)<\/span>\" or \"<span class=\"tex-font-style-tt\">:(<\/span>\". If you guess $$$x$$$ correctly, the answer is \"<span class=\"tex-font-style-tt\">:)<\/span>\" and your program should terminate immediately, otherwise you'll receive \":(\". You can make at most $$$2$$$ such guesses.<\/p><p>After printing a query do not forget to output end of line and flush the output. Otherwise, you will get <span class=\"tex-font-style-tt\">Idleness limit exceeded<\/span>. To do this, use: <\/p><ul> <li> <span class=\"tex-font-style-tt\">fflush(stdout)<\/span> or <span class=\"tex-font-style-tt\">cout.flush()<\/span> in C++; <\/li><li> <span class=\"tex-font-style-tt\">System.out.flush()<\/span> in Java; <\/li><li> <span class=\"tex-font-style-tt\">flush(output)<\/span> in Pascal; <\/li><li> <span class=\"tex-font-style-tt\">stdout.flush()<\/span> in Python; <\/li><li> see documentation for other languages. <\/li><\/ul><p><span class=\"tex-font-style-bf\">Hacking is not allowed in this problem.<\/span><\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>6<br/><br/>NO<br/><br/>:(<br/><br/>NO<br/><br/>:)<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>? 5 1 2 5 4 3<br/><br/>! 6<br/><br/>? 4 1 2 3 4<br/><br/>! 5<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>If the answer of the first question were correct, then $$$x$$$ would have been equal to $$$6$$$, but as we can see in the first guess, $$$6$$$ is not the answer.<\/p><p>So the answer of the first question is joking. As we know, the answer of at least one of our two questions is correct, since the answer of the first question was joking, the answer of the second question should be correct.<\/p><p>So we will understand that $$$x$$$ is not equal to $$$1, 2, 3$$$ or $$$4$$$, and we also knew that $$$x$$$ is not equal to $$$6$$$ either. Hence $$$x$$$ should be equal to $$$5$$$.<\/p><\/div><\/div>"}, {"contestId": 1120, "index": "D", "name": "Power Tree", "rating": 2500, "solvedCount": 1841, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Power Tree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a rooted tree with $$$n$$$ vertices, the root of the tree is the vertex $$$1$$$. Each vertex has some non-negative price. A leaf of the tree is a non-root vertex that has degree $$$1$$$.<\/p><p>Arkady and Vasily play a strange game on the tree. The game consists of three stages. On the first stage Arkady buys some non-empty set of vertices of the tree. On the second stage Vasily puts some integers into all leaves of the tree. On the third stage Arkady can perform several (possibly none) operations of the following kind: choose some vertex $$$v$$$ he bought on the first stage and some integer $$$x$$$, and then add $$$x$$$ to all integers in the leaves in the subtree of $$$v$$$. The integer $$$x$$$ can be positive, negative of zero.<\/p><p>A leaf $$$a$$$ is in the subtree of a vertex $$$b$$$ if and only if the simple path between $$$a$$$ and the root goes through $$$b$$$.<\/p><p>Arkady's task is to make all integers in the leaves equal to zero. What is the minimum total cost $$$s$$$ he has to pay on the first stage to guarantee his own win independently of the integers Vasily puts on the second stage? Also, we ask you to find all such vertices that there is an optimal (i.e. with cost $$$s$$$) set of vertices containing this one such that Arkady can guarantee his own win buying this set on the first stage.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$2 \\le n \\le 200\\,000$$$)\u00a0\u2014 the number of vertices in the tree.<\/p><p>The second line contains $$$n$$$ integers $$$c_1, c_2, \\ldots, c_n$$$ ($$$0 \\le c_i \\le 10^9$$$), where $$$c_i$$$ is the price of the $$$i$$$-th vertex.<\/p><p>Each of the next $$$n - 1$$$ lines contains two integers $$$a$$$ and $$$b$$$ ($$$1 \\le a, b \\le n$$$), denoting an edge of the tree.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In the first line print two integers: the minimum possible cost $$$s$$$ Arkady has to pay to guarantee his own win, and the number of vertices $$$k$$$ that belong to at least one optimal set.<\/p><p>In the second line print $$$k$$$ distinct integers <span class=\"tex-font-style-bf\">in increasing order<\/span> the indices of the vertices that belong to at least one optimal set.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n5 1 3 2 1\n1 2\n2 3\n2 4\n1 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4 3\n2 4 5 \n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n1 1 1\n1 2\n1 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2 3\n1 2 3 \n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the second example all sets of two vertices are optimal. So, each vertex is in at least one optimal set.<\/p><\/div><\/div>"}, {"contestId": 992, "index": "E", "name": "Nastya and King-Shamans", "rating": 2500, "solvedCount": 1840, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Nastya and King-Shamans<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Nastya likes reading and even spends whole days in a library sometimes. Today she found a chronicle of Byteland in the library, and it stated that there lived shamans long time ago. It is known that at every moment there was exactly one shaman in Byteland, and there were <span class=\"tex-span\"><i>n<\/i><\/span> shamans in total enumerated with integers from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span> in the order they lived. Also, each shaman had a magic power which can now be expressed as an integer.<\/p><p>The chronicle includes a list of powers of the <span class=\"tex-span\"><i>n<\/i><\/span> shamans. Also, some shamans can be king-shamans, if they gathered all the power of their predecessors, i.e. their power is exactly the sum of powers of all previous shamans. Nastya is interested in whether there was at least one king-shaman in Byteland.<\/p><p>Unfortunately many of the powers are unreadable in the list, so Nastya is doing the following:<\/p><ul> <li> Initially she supposes some power for each shaman. <\/li><li> After that she changes the power of some shaman <span class=\"tex-span\"><i>q<\/i><\/span> times (the shamans can differ) and after that wants to check if there is at least one king-shaman in the list. If yes, she wants to know the index of any king-shaman. <\/li><\/ul><p>Unfortunately the list is too large and Nastya wants you to help her.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>q<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>q<\/i>\u2009\u2264\u20092\u00b710<sup class=\"upper-index\">5<\/sup><\/span>).<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>), where <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is the magic power of the <span class=\"tex-span\"><i>i<\/i><\/span>-th shaman.<\/p><p>After that <span class=\"tex-span\"><i>q<\/i><\/span> lines follow, the <span class=\"tex-span\"><i>i<\/i><\/span>-th of them contains two integers <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\">0\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) that mean that the new power of the <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>-th shaman is <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>q<\/i><\/span> lines, the <span class=\"tex-span\"><i>i<\/i><\/span>-th of them should contain <span class=\"tex-span\">\u2009-\u20091<\/span>, if after the <span class=\"tex-span\"><i>i<\/i><\/span>-th change there are no shaman-kings, and otherwise a single integer <span class=\"tex-span\"><i>j<\/i><\/span>, where <span class=\"tex-span\"><i>j<\/i><\/span> is an index of some king-shaman after the <span class=\"tex-span\"><i>i<\/i><\/span>-th change.<\/p><p>If there are multiple king-shamans after each change, print the index of any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 1<br/>1 3<br/>1 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>-1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 4<br/>2 2 3<br/>1 1<br/>1 2<br/>2 4<br/>3 6<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/>2<br/>-1<br/>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>10 7<br/>0 3 1 4 6 2 7 8 10 1<br/>2 5<br/>1 3<br/>9 36<br/>4 10<br/>4 9<br/>1 2<br/>1 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/>-1<br/>9<br/>-1<br/>4<br/>-1<br/>1<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example powers of shamans after the first change are equal to <span class=\"tex-span\">(2,\u20093)<\/span>. The answer equals <span class=\"tex-span\">\u2009-\u20091<\/span>, because the sum of powers of shamans before the first shaman is equal to <span class=\"tex-span\">0<\/span>, and before the second is equal to <span class=\"tex-span\">2<\/span>.<\/p><p>In the second example after the first change the powers are equal to <span class=\"tex-span\">(1,\u20092,\u20093)<\/span>. The answer is equal to <span class=\"tex-span\">3<\/span>, because the power of the third shaman is equal to <span class=\"tex-span\">3<\/span>, and the sum of powers of the first and the second shaman is also <span class=\"tex-span\">1\u2009+\u20092\u2009=\u20093<\/span>. After the second change the powers become equal to <span class=\"tex-span\">(2,\u20092,\u20093)<\/span>, where the answer equals <span class=\"tex-span\">2<\/span>. After the third change the powers become equal to <span class=\"tex-span\">(2,\u20094,\u20093)<\/span>, where the answer equals <span class=\"tex-span\">\u2009-\u20091<\/span>. After the fourth change the powers become equal to <span class=\"tex-span\">(2,\u20094,\u20096)<\/span>, where the answer equals <span class=\"tex-span\">3<\/span>.<\/p><\/div><\/div>"}, {"contestId": 1508, "index": "C", "name": "Complete the MST", "rating": 2500, "solvedCount": 1820, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Complete the MST<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>As a teacher, Riko Hakozaki often needs to help her students with problems from various subjects. Today, she is asked a programming task which goes as follows.<\/p><p>You are given an undirected complete graph with $$$n$$$ nodes, where some edges are pre-assigned with a positive weight while the rest aren't. You need to assign all unassigned edges with <span class=\"tex-font-style-bf\">non-negative weights<\/span> so that in the resulting fully-assigned complete graph the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#XOR\">XOR<\/a> sum of all weights would be equal to $$$0$$$.<\/p><p>Define the <span class=\"tex-font-style-it\">ugliness<\/span> of a fully-assigned complete graph the weight of its <a href=\"https://en.wikipedia.org/wiki/Minimum_spanning_tree\">minimum spanning tree<\/a>, where the weight of a spanning tree equals the sum of weights of its edges. You need to assign the weights so that the ugliness of the resulting graph is as small as possible.<\/p><p>As a reminder, an undirected complete graph with $$$n$$$ nodes contains all edges $$$(u, v)$$$ with $$$1 \\le u  \\lt  v \\le n$$$; such a graph has $$$\\frac{n(n-1)}{2}$$$ edges.<\/p><p>She is not sure how to solve this problem, so she asks you to solve it for her.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$m$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$, $$$0 \\le m \\le \\min(2 \\cdot 10^5, \\frac{n(n-1)}{2} - 1)$$$) \u00a0\u2014 the number of nodes and the number of pre-assigned edges. The inputs are given so that there is at least one unassigned edge.<\/p><p>The $$$i$$$-th of the following $$$m$$$ lines contains three integers $$$u_i$$$, $$$v_i$$$, and $$$w_i$$$ ($$$1 \\le u_i, v_i \\le n$$$, $$$u \\ne v$$$, $$$1 \\le w_i  \\lt  2^{30}$$$), representing the edge from $$$u_i$$$ to $$$v_i$$$ has been pre-assigned with the weight $$$w_i$$$. No edge appears in the input more than once.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print on one line one integer \u00a0\u2014 the minimum ugliness among all weight assignments with XOR sum equal to $$$0$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 4\n2 1 14\n1 4 14\n3 2 15\n4 3 8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n15\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 6\n3 6 4\n2 4 1\n4 5 7\n3 4 10\n3 5 1\n5 2 15\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 6\n2 3 11\n5 3 7\n1 4 10\n2 4 14\n4 3 8\n2 5 6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The following image showcases the first test case. The black weights are pre-assigned from the statement, the red weights are assigned by us, and the minimum spanning tree is denoted by the blue edges.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/a7a280c2f88b120ff0839966d25330c968719a1c.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 23, "index": "C", "name": "Oranges and Apples", "rating": 2500, "solvedCount": 1812, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Oranges and Apples<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>In <span class=\"tex-span\">2<i>N<\/i>\u2009-\u20091<\/span> boxes there are apples and oranges. Your task is to choose <span class=\"tex-span\"><i>N<\/i><\/span> boxes so, that they will contain not less than half of all the apples and not less than half of all the oranges.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first input line contains one number <span class=\"tex-span\"><i>T<\/i><\/span> \u2014 amount of tests. The description of each test starts with a natural number <span class=\"tex-span\"><i>N<\/i><\/span> \u2014 amount of boxes. Each of the following <span class=\"tex-span\">2<i>N<\/i>\u2009-\u20091<\/span> lines contains numbers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>o<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> \u2014 amount of apples and oranges in the <span class=\"tex-span\"><i>i<\/i><\/span>-th box (<span class=\"tex-span\">0\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>o<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>). The sum of <span class=\"tex-span\"><i>N<\/i><\/span> in all the tests in the input doesn't exceed <span class=\"tex-span\">10<sup class=\"upper-index\">5<\/sup><\/span>. All the input numbers are integer.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test output two lines. In the first line output <span class=\"tex-font-style-tt\">YES<\/span>, if it's possible to choose <span class=\"tex-span\"><i>N<\/i><\/span> boxes, or <span class=\"tex-font-style-tt\">NO<\/span> otherwise. If the answer is positive output in the second line <span class=\"tex-span\"><i>N<\/i><\/span> numbers \u2014 indexes of the chosen boxes. Boxes are numbered from 1 in the input order. Otherwise leave the second line empty. Separate the numbers with one space.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/>2<br/>10 15<br/>5 7<br/>20 18<br/>1<br/>0 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/>1 3<br/>YES<br/>1<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1922, "index": "F", "name": "Replace on Segment", "rating": 2500, "solvedCount": 1810, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Replace on Segment<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a_1, a_2, \\dots, a_n$$$, where each element is an integer from $$$1$$$ to $$$x$$$.<\/p><p>You can perform the following operation with it any number of times:<\/p><ul> <li> choose three integers $$$l$$$, $$$r$$$ and $$$k$$$ such that $$$1 \\le l \\le r \\le n$$$, $$$1 \\le k \\le x$$$ and <span class=\"tex-font-style-bf\">each<\/span> element $$$a_i$$$ such that $$$l \\le i \\le r$$$ is different from $$$k$$$. Then, for each $$$i \\in [l, r]$$$, replace $$$a_i$$$ with $$$k$$$. <\/li><\/ul><p>In other words, you choose a subsegment of the array and an integer from $$$1$$$ to $$$x$$$ which does not appear in that subsegment, and replace every element in the subsegment with that chosen integer.<\/p><p>Your goal is to make all elements in the array equal. What is the minimum number of operations that you have to perform?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$t$$$ ($$$1 \\le t \\le 100$$$) \u2014 the number of test cases.<\/p><p>Each test case consists of two lines:<\/p><ul> <li> the first line contains two integers $$$n$$$ and $$$x$$$ ($$$1 \\le x \\le n \\le 100$$$); <\/li><li> the second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le x$$$). <\/li><\/ul><p>Additional constraint on the input: the sum of $$$n$$$ over all test cases does not exceed $$$500$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print one integer \u2014 the minimum number of operations you have to perform.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">6 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2 3 1 2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">12 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 1 3 1 2 1 1 2 3 1 1 3<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n2\n2\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 2133, "index": "E", "name": "I Yearned For The Mines", "rating": 2500, "solvedCount": 1809, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. I Yearned For The Mines<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p> <\/p><p>As a child, Steve yearned for the mines! His mine can be represented as a tree$$$^{\\text{\u2217}}$$$ of $$$n$$$ nodes.<\/p><p>Unfortunately, Steve's mine has been infiltrated by his greatest nemesis, Herobrine! At any time, Herobrine is hiding in exactly one node; initially, he may be in any of them. Steve can perform the following operations:<\/p><ul> <li> $$$1\\,\\,x$$$\u00a0\u2014 Check if Herobrine is currently in node $$$x$$$. If he is, Steve catches him. Otherwise, Herobrine may or may not move to any adjacent node (<span class=\"tex-font-style-bf\">except<\/span> the one you just checked). <\/li><li> $$$2\\,\\,x$$$\u00a0\u2014 Destroy all edges connected to node $$$x$$$; Herobrine will no longer be able to use them. Afterwards, Herobrine may or may not move to any adjacent node. <\/li><\/ul><p>Find a sequence of at most $$$\\left\\lfloor \\frac{5}{4} \\cdot n \\right\\rfloor$$$ operations that will guarantee Steve catches Herobrine, regardless of Herobrine's initial location and moves. We have a proof that, under the given constraints, this is always possible.<\/p><div class=\"statement-footnote\"><p>$$$^{\\text{\u2217}}$$$A tree is a connected graph without cycles. <\/p><\/div><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of nodes.<\/p><p>Each of the next $$$n \u2212 1$$$ lines contains two integers $$$u$$$ and $$$v$$$ ($$$1 \\le u, v \\le n$$$), describing an edge between nodes $$$u$$$ and $$$v$$$.<\/p><p>It is guaranteed that the given edges form a tree.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, first output a single integer $$$k$$$ ($$$1 \\le k \\le \\left\\lfloor \\frac{5}{4} \\cdot n \\right\\rfloor$$$)\u00a0\u2014 the number of operations you wish to perform.<\/p><p>Then output $$$k$$$ lines. Line $$$i$$$ ($$$1 \\le i \\le k$$$) should contain two integers $$$t_i$$$ and $$$x_i$$$ ($$$1 \\le t_i \\le 2$$$, $$$1 \\le x_i \\le n$$$), indicating that the $$$i$$$-th operation you wish to perform is operation $$$t_i$$$ on node $$$x_i$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n1 1\n1 2\n5\n1 2\n2 2\n1 1\n1 3\n1 4<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the tree is as follows:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/de595a0f81c5ffcd8aba48f59af0dd34051cb8b1.png\" style=\"zoom: 75.0%;max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>Initially, Herobrine may be in either of the nodes. After the first operation, which checks node $$$1$$$, if Herobrine was in node $$$1$$$, he would be caught, so the only possible node he could be in after the operation is node $$$2$$$ (he cannot move to node $$$1$$$ since it was just checked). Therefore, after the second operation, which checks node $$$2$$$, he must have been caught.<\/p><p>In the second test case, the tree is as follows:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/ed9f9e328607bf9686a6fead2b113692187b6dd2.png\" style=\"zoom: 50.0%;max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>Initially, Herobrine may be in any of the nodes $$$[1, 2, 3, 4]$$$. After the first operation, Herobrine can only be in nodes $$$[1, 3, 4]$$$. The second operation destroys all edges adjacent to node $$$2$$$. Since all the edges connected to nodes $$$1$$$, $$$3$$$, and $$$4$$$ are now destroyed, Herobrine is unable to move any more no matter where he is located. So after checking those three nodes in operations $$$3$$$, $$$4$$$, and $$$5$$$, he is guaranteed to have been caught.<\/p><\/div><\/div>"}, {"contestId": 739, "index": "C", "name": "Alyona and towers", "rating": 2500, "solvedCount": 1802, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Alyona and towers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Alyona has built <span class=\"tex-span\"><i>n<\/i><\/span> towers by putting small cubes some on the top of others. Each cube has size <span class=\"tex-span\">1\u2009\u00d7\u20091\u2009\u00d7\u20091<\/span>. A tower is a non-zero amount of cubes standing on the top of each other. The towers are next to each other, forming a row.<\/p><p>Sometimes Alyona chooses some segment towers, and put on the top of each tower several cubes. Formally, Alyouna chooses some segment of towers from <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> to <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and adds <span class=\"tex-span\"><i>d<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> cubes on the top of them.<\/p><p>Let the sequence <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> be the heights of the towers from left to right. Let's call as a segment of towers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>l<\/i><\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\"><i>l<\/i>\u2009+\u20091<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>r<\/i><\/sub><\/span> a hill if the following condition holds: there is integer <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\"><i>l<\/i>\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u2009<i>r<\/i><\/span>) such that <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>l<\/i><\/sub>\u2009&lt;\u2009<i>a<\/i><sub class=\"lower-index\"><i>l<\/i>\u2009+\u20091<\/sub>\u2009&lt;\u2009<i>a<\/i><sub class=\"lower-index\"><i>l<\/i>\u2009+\u20092<\/sub>\u2009&lt;\u2009...\u2009&lt;\u2009<i>a<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>\u2009&gt;\u2009<i>a<\/i><sub class=\"lower-index\"><i>k<\/i>\u2009+\u20091<\/sub>\u2009&gt;\u2009<i>a<\/i><sub class=\"lower-index\"><i>k<\/i>\u2009+\u20092<\/sub>\u2009&gt;\u2009...\u2009&gt;\u2009<i>a<\/i><sub class=\"lower-index\"><i>r<\/i><\/sub><\/span>.<\/p><p>After each addition of <span class=\"tex-span\"><i>d<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> cubes on the top of the towers from <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> to <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, Alyona wants to know the maximum width among all hills. The width of a hill is the number of towers in it.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contain single integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20093\u00b710<sup class=\"upper-index\">5<\/sup><\/span>)\u00a0\u2014 the number of towers.<\/p><p>The second line contain <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>)\u00a0\u2014 the number of cubes in each tower. <\/p><p>The third line contain single integer <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u20093\u00b710<sup class=\"upper-index\">5<\/sup><\/span>)\u00a0\u2014 the number of additions.<\/p><p>The next <span class=\"tex-span\"><i>m<\/i><\/span> lines contain <span class=\"tex-span\">3<\/span> integers each. The <span class=\"tex-span\"><i>i<\/i><\/span>-th of these lines contains integers <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>d<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>d<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>), that mean that Alyona puts <span class=\"tex-span\"><i>d<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> cubes on the tio of each of the towers from <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> to <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>m<\/i><\/span> lines. In <span class=\"tex-span\"><i>i<\/i><\/span>-th line print the maximum width of the hills after the <span class=\"tex-span\"><i>i<\/i><\/span>-th addition.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>5 5 5 5 5<br/>3<br/>1 3 2<br/>2 2 1<br/>4 4 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/>4<br/>5<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The first sample is as follows:<\/p><p>After addition of <span class=\"tex-span\">2<\/span> cubes on the top of each towers from the first to the third, the number of cubes in the towers become equal to <span class=\"tex-span\">[7,\u20097,\u20097,\u20095,\u20095]<\/span>. The hill with maximum width is <span class=\"tex-span\">[7,\u20095]<\/span>, thus the maximum width is <span class=\"tex-span\">2<\/span>.<\/p><p>After addition of <span class=\"tex-span\">1<\/span> cube on the second tower, the number of cubes in the towers become equal to <span class=\"tex-span\">[7,\u20098,\u20097,\u20095,\u20095]<\/span>. The hill with maximum width is now <span class=\"tex-span\">[7,\u20098,\u20097,\u20095]<\/span>, thus the maximum width is <span class=\"tex-span\">4<\/span>.<\/p><p>After addition of <span class=\"tex-span\">1<\/span> cube on the fourth tower, the number of cubes in the towers become equal to <span class=\"tex-span\">[7,\u20098,\u20097,\u20096,\u20095]<\/span>. The hill with maximum width is now <span class=\"tex-span\">[7,\u20098,\u20097,\u20096,\u20095]<\/span>, thus the maximum width is <span class=\"tex-span\">5<\/span>.<\/p><\/div><\/div>"}, {"contestId": 1497, "index": "D", "name": "Genius", "rating": 2500, "solvedCount": 1798, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Genius<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>32 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">Please note the non-standard memory limit.<\/span><\/p><p>There are $$$n$$$ problems numbered with integers from $$$1$$$ to $$$n$$$. $$$i$$$-th problem has the complexity $$$c_i = 2^i$$$, tag $$$tag_i$$$ and score $$$s_i$$$.<\/p><p>After solving the problem $$$i$$$ it's allowed to solve problem $$$j$$$ if and only if $$$\\text{IQ}  \\lt  |c_i - c_j|$$$ and $$$tag_i \\neq tag_j$$$. After solving it your $$$\\text{IQ}$$$ changes and becomes $$$\\text{IQ} = |c_i - c_j|$$$ and you gain $$$|s_i - s_j|$$$ points.<\/p><p>Any problem can be the first. You can solve problems in any order and as many times as you want.<\/p><p>Initially your $$$\\text{IQ} = 0$$$. Find the maximum number of points that can be earned.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ $$$(1 \\le t \\le 100)$$$ \u00a0\u2014 the number of test cases. <\/p><p>The first line of each test case contains an integer $$$n$$$ $$$(1 \\le n \\le 5000)$$$ \u00a0\u2014 the number of problems.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$tag_1, tag_2, \\ldots, tag_n$$$ $$$(1 \\le tag_i \\le n)$$$ \u00a0\u2014 tags of the problems.<\/p><p>The third line of each test case contains $$$n$$$ integers $$$s_1, s_2, \\ldots, s_n$$$ $$$(1 \\le s_i \\le 10^9)$$$ \u00a0\u2014 scores of the problems.<\/p><p>It's guaranteed that sum of $$$n$$$ over all test cases does not exceed $$$5000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case print a single integer \u00a0\u2014 the maximum number of points that can be earned.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n4\n1 2 3 4\n5 10 15 20\n4\n1 2 1 2\n5 10 15 20\n4\n2 2 4 1\n2 8 19 1\n2\n1 1\n6 9\n1\n1\n666\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n35\n30\n42\n0\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case optimal sequence of solving problems is as follows: <\/p><ol> <li> $$$1 \\rightarrow 2$$$, after that total score is $$$5$$$ and $$$\\text{IQ} = 2$$$ <\/li><li> $$$2 \\rightarrow 3$$$, after that total score is $$$10$$$ and $$$\\text{IQ} = 4$$$ <\/li><li> $$$3 \\rightarrow 1$$$, after that total score is $$$20$$$ and $$$\\text{IQ} = 6$$$ <\/li><li> $$$1 \\rightarrow 4$$$, after that total score is $$$35$$$ and $$$\\text{IQ} = 14$$$ <\/li><\/ol><p>In the second test case optimal sequence of solving problems is as follows: <\/p><ol> <li> $$$1 \\rightarrow 2$$$, after that total score is $$$5$$$ and $$$\\text{IQ} = 2$$$ <\/li><li> $$$2 \\rightarrow 3$$$, after that total score is $$$10$$$ and $$$\\text{IQ} = 4$$$ <\/li><li> $$$3 \\rightarrow 4$$$, after that total score is $$$15$$$ and $$$\\text{IQ} = 8$$$ <\/li><li> $$$4 \\rightarrow 1$$$, after that total score is $$$35$$$ and $$$\\text{IQ} = 14$$$ <\/li><\/ol><p>In the third test case optimal sequence of solving problems is as follows: <\/p><ol> <li> $$$1 \\rightarrow 3$$$, after that total score is $$$17$$$ and $$$\\text{IQ} = 6$$$ <\/li><li> $$$3 \\rightarrow 4$$$, after that total score is $$$35$$$ and $$$\\text{IQ} = 8$$$ <\/li><li> $$$4 \\rightarrow 2$$$, after that total score is $$$42$$$ and $$$\\text{IQ} = 12$$$ <\/li><\/ol><\/div><\/div>"}, {"contestId": 1528, "index": "D", "name": "It's a bird! No, it's a plane! No, it's AaParsa!", "rating": 2500, "solvedCount": 1796, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. It's a bird! No, it's a plane! No, it's AaParsa!<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are $$$n$$$ cities in Shaazzzland, numbered from $$$0$$$ to $$$n-1$$$. Ghaazzzland, the immortal enemy of Shaazzzland, is ruled by AaParsa.<\/p><p>As the head of the Ghaazzzland's intelligence agency, AaParsa is carrying out the most important spying mission in Ghaazzzland's history on Shaazzzland.<\/p><p>AaParsa has planted $$$m$$$ transport cannons in the cities of Shaazzzland. The $$$i$$$-th cannon is planted in the city $$$a_i$$$ and is initially pointing at city $$$b_i$$$.<\/p><p>It is guaranteed that each of the $$$n$$$ cities has <span class=\"tex-font-style-bf\">at least one<\/span> transport cannon planted inside it, and that no two cannons from the same city are initially pointing at the same city (that is, all pairs $$$(a_i, b_i)$$$ are distinct).<\/p><p>AaParsa used very advanced technology to build the cannons, the cannons rotate every second. In other words, if the $$$i$$$-th cannon is pointing towards the city $$$x$$$ at some second, it will target the city $$$(x + 1) \\mod n$$$ at the next second.<\/p><p>As their name suggests, transport cannons are for transportation, specifically for human transport. If you use the $$$i$$$-th cannon to launch yourself towards the city that it's currently pointing at, you'll be airborne for $$$c_i$$$ seconds before reaching your target destination.<\/p><p>If you still don't get it, using the $$$i$$$-th cannon at the $$$s$$$-th second (using which is only possible if you are currently in the city $$$a_i$$$) will shoot you to the city $$$(b_i + s) \\mod n$$$ and you'll land in there after $$$c_i$$$ seconds (so you'll be there in the $$$(s + c_i)$$$-th second). Also note the cannon that you initially launched from will rotate every second but you obviously won't change direction while you are airborne. <\/p><p>AaParsa wants to use the cannons for travelling between Shaazzzland's cities in his grand plan, and he can start travelling at second $$$0$$$. For him to fully utilize them, he needs to know the minimum number of seconds required to reach city $$$u$$$ from city $$$v$$$ using the cannons for every pair of cities $$$(u, v)$$$.<\/p><p><span class=\"tex-font-style-bf\">Note that AaParsa can stay in a city for as long as he wants<\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$m$$$ $$$(2 \\le n \\le 600 , n \\le m \\le n^2)$$$ \u2014 the number of cities and cannons correspondingly.<\/p><p>The $$$i$$$-th line of the following $$$m$$$ lines contains three integers $$$a_i$$$, $$$b_i$$$ and $$$c_i$$$ $$$( 0 \\le a_i , b_i \\le n-1 , 1 \\le c_i \\le 10^9)$$$, denoting the cannon in the city $$$a_i$$$, which is initially pointing to $$$b_i$$$ and travelling by which takes $$$c_i$$$ seconds.<\/p><p>It is guaranteed that each of the $$$n$$$ cities has <span class=\"tex-font-style-bf\">at least one<\/span> transport cannon planted inside it, and that no two cannons from the same city are initially pointing at the same city (that is, all pairs $$$(a_i, b_i)$$$ are distinct).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$n$$$ lines, each line should contain $$$n$$$ integers.<\/p><p>The $$$j$$$-th integer in the $$$i$$$-th line should be equal to the minimum time required to reach city $$$j$$$ from city $$$i$$$. <\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 4\n0 1 1\n0 2 3\n1 0 1\n2 0 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0 1 2 \n1 0 2 \n1 2 0 \n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 6\n0 0 1\n1 1 1\n2 2 1\n3 3 1\n4 4 1\n5 5 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0 2 3 3 4 4 \n4 0 2 3 3 4 \n4 4 0 2 3 3 \n3 4 4 0 2 3 \n3 3 4 4 0 2 \n2 3 3 4 4 0 \n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 5\n0 1 1\n1 3 2\n2 2 10\n3 0 1\n0 0 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0 1 2 3 \n3 0 3 2 \n12 13 0 11 \n1 2 2 0 \n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example one possible path for going from $$$0$$$ to $$$2$$$ would be: <\/p><ol> <li> Stay inside $$$0$$$ and do nothing for $$$1$$$ second. <\/li><li> Use the first cannon and land at $$$2$$$ after $$$1$$$ second. <\/li><\/ol> <span class=\"tex-font-style-bf\">Note that:<\/span> we could have used the second cannon in $$$0$$$-th second but it would have taken us $$$3$$$ seconds to reach city $$$2$$$ in that case.<\/div><\/div>"}, {"contestId": 1452, "index": "E", "name": "Two Editorials", "rating": 2500, "solvedCount": 1767, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Two Editorials<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Berland regional ICPC contest has just ended. There were $$$m$$$ participants numbered from $$$1$$$ to $$$m$$$, who competed on a problemset of $$$n$$$ problems numbered from $$$1$$$ to $$$n$$$.<\/p><p>Now the editorial is about to take place. There are two problem authors, each of them is going to tell the tutorial to <span class=\"tex-font-style-bf\">exactly $$$k$$$ consecutive tasks<\/span> of the problemset. The authors choose the segment of $$$k$$$ consecutive tasks for themselves independently of each other. The segments can coincide, intersect or not intersect at all.<\/p><p>The $$$i$$$-th participant is interested in listening to the tutorial of all consecutive tasks from $$$l_i$$$ to $$$r_i$$$. Each participant always chooses to listen to only the problem author that tells the tutorials to the maximum number of tasks he is interested in. Let this maximum number be $$$a_i$$$. No participant can listen to both of the authors, even if their segments don't intersect.<\/p><p>The authors want to choose the segments of $$$k$$$ consecutive tasks for themselves in such a way that the sum of $$$a_i$$$ over all participants is maximized.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains three integers $$$n, m$$$ and $$$k$$$ ($$$1 \\le n, m \\le 2000$$$, $$$1 \\le k \\le n$$$)\u00a0\u2014 the number of problems, the number of participants and the length of the segment of tasks each of the problem authors plans to tell the tutorial to.<\/p><p>The $$$i$$$-th of the next $$$m$$$ lines contains two integers $$$l_i$$$ and $$$r_i$$$ ($$$1 \\le l_i \\le r_i \\le n$$$)\u00a0\u2014 the segment of tasks the $$$i$$$-th participant is interested in listening to the tutorial to.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer\u00a0\u2014 the maximum sum of $$$a_i$$$ over all participants.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n10 5 3\n1 3\n2 4\n6 9\n6 9\n1 8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n14\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n10 3 3\n2 4\n4 6\n3 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n8\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 4 1\n3 3\n1 1\n2 2\n4 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 4 5\n1 2\n2 3\n3 4\n4 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n8\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example the first author can tell the tutorial to problems from $$$1$$$ to $$$3$$$ and the second one\u00a0\u2014 from $$$6$$$ to $$$8$$$. That way the sequence of $$$a_i$$$ will be $$$[3, 2, 3, 3, 3]$$$. Notice that the last participant can't listen to both author, he only chooses the one that tells the maximum number of problems he's interested in.<\/p><p>In the second example the first one can tell problems $$$2$$$ to $$$4$$$, the second one\u00a0\u2014 $$$4$$$ to $$$6$$$.<\/p><p>In the third example the first one can tell problems $$$1$$$ to $$$1$$$, the second one\u00a0\u2014 $$$2$$$ to $$$2$$$. Or $$$4$$$ to $$$4$$$ and $$$3$$$ to $$$3$$$. Every pair of different problems will get the same sum of $$$2$$$.<\/p><p>In the fourth example the first one can tell problems $$$1$$$ to $$$5$$$, the second one\u00a0\u2014 $$$1$$$ to $$$5$$$ as well.<\/p><\/div><\/div>"}, {"contestId": 1824, "index": "C", "name": "LuoTianyi and XOR-Tree", "rating": 2500, "solvedCount": 1756, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. LuoTianyi and XOR-Tree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>LuoTianyi gives you a tree with values in its vertices, and the root of the tree is vertex $$$1$$$.<\/p><p>In one operation, you can change the value in one vertex to any non-negative integer.<\/p><p>Now you need to find the minimum number of operations you need to perform to make each path from the root to leaf$$$^{\\dagger}$$$ has a <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#XOR\">bitwise XOR<\/a> value of zero.<\/p><p>$$$^{\\dagger}$$$A leaf in a rooted tree is a vertex that has exactly one neighbor and is not a root.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$2 \\le n \\le 10^5$$$) \u2014 the number of vertices in the tree.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$), the $$$i$$$-th number represents the value in the $$$i$$$-th vertex.<\/p><p>Next $$$n\u22121$$$ lines describe the edges of the tree. The $$$i$$$-th line contains two integers $$$u_i$$$ and $$$v_i$$$ ($$$1 \\le u_i,v_i \\le n, u_i \\neq v_i$$$) \u2014 the vertices connected by an edge of the tree. It's guaranteed that the given edges form a tree.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u2014 the minimum number of operations.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n3 5 7 5 8 4\n1 2\n1 3\n1 4\n3 5\n4 6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n8\n7 10 7 16 19 9 16 11\n1 5\n4 2\n6 5\n5 2\n7 2\n2 3\n3 8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n1 2 1 2\n1 2\n2 3\n4 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n9\n4 3 6 1 5 5 5 2 7\n1 2\n2 3\n4 1\n4 5\n4 6\n4 7\n8 1\n8 9\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The tree in the first example:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/106872fad85e7d7967170d76532640ffd495613a.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center> <p>If we change the value in the vertex $$$2$$$ to $$$3$$$, the value in the vertex $$$5$$$ to $$$4$$$, and the value in the vertex $$$6$$$ to $$$6$$$, then the tree will be ok.<\/p><p>The bitwise XOR from the root to the leaf $$$2$$$ will be $$$3 \\oplus 3=0$$$.<\/p><p>The bitwise XOR from the root to the leaf $$$5$$$ will be $$$4 \\oplus 7 \\oplus 3=0$$$.<\/p><p>The bitwise XOR from the root to the leaf $$$6$$$ will be $$$6 \\oplus 5 \\oplus 3=0$$$.<\/p><p>The tree in the second example:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/b3c27b4d05c409d8ff458ce36aeae111fa49a71c.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center> <p>If we change the value in the vertex $$$2$$$ to $$$4$$$, the value in the vertex $$$3$$$ to $$$27$$$, and the value in the vertex $$$6$$$ to $$$20$$$, then the tree will be ok.<\/p><p>The bitwise XOR from the root to the leaf $$$6$$$ will be $$$20 \\oplus 19 \\oplus 7=0$$$.<\/p><p>The bitwise XOR from the root to the leaf $$$8$$$ will be $$$11 \\oplus 27 \\oplus 4 \\oplus 19 \\oplus 7=0$$$.<\/p><p>The bitwise XOR from the root to the leaf $$$4$$$ will be $$$16 \\oplus 4 \\oplus 19 \\oplus 7=0$$$.<\/p><p>The bitwise XOR from the root to the leaf $$$7$$$ will be $$$16 \\oplus 4 \\oplus 19 \\oplus 7=0$$$.<\/p><p>In the third example, the only leaf is the vertex $$$4$$$ and the bitwise XOR on the path to it is $$$1 \\oplus 2 \\oplus 1 \\oplus 2 = 0$$$, so we don't need to change values.<\/p><p>In the fourth example, we can change the value in the vertex $$$1$$$ to $$$5$$$, and the value in the vertex $$$4$$$ to $$$0$$$.<\/p><p>Here $$$\\oplus$$$ denotes the bitwise XOR operation.<\/p><\/div><\/div>"}, {"contestId": 1381, "index": "C", "name": "Mastermind", "rating": 2500, "solvedCount": 1753, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Mastermind<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>In the game of Mastermind, there are two players \u00a0\u2014 Alice and Bob. Alice has a secret code, which Bob tries to guess. Here, a code is defined as a sequence of $$$n$$$ colors. There are exactly $$$n+1$$$ colors in the entire universe, numbered from $$$1$$$ to $$$n+1$$$ inclusive.<\/p><p>When Bob guesses a code, Alice tells him some information about how good of a guess it is, in the form of two integers $$$x$$$ and $$$y$$$.<\/p><p>The first integer $$$x$$$ is the number of indices where Bob's guess correctly matches Alice's code. The second integer $$$y$$$ is the size of the intersection of the two codes as multisets. That is, if Bob were to change the order of the colors in his guess, $$$y$$$ is the maximum number of indices he could get correct.<\/p><p>For example, suppose $$$n=5$$$, Alice's code is $$$[3,1,6,1,2]$$$, and Bob's guess is $$$[3,1,1,2,5]$$$. At indices $$$1$$$ and $$$2$$$ colors are equal, while in the other indices they are not equal. So $$$x=2$$$. And the two codes have the four colors $$$1,1,2,3$$$ in common, so $$$y=4$$$.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.co

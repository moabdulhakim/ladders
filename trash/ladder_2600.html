<script>
    const PROBLEMS = [{"contestId": 321, "index": "E", "name": "Ciel and Gondolas", "rating": 2600, "solvedCount": 6722, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Ciel and Gondolas<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Fox Ciel is in the Amusement Park. And now she is in a queue in front of the Ferris wheel. There are <span class=\"tex-span\"><i>n<\/i><\/span> people (or foxes more precisely) in the queue: we use first people to refer one at the head of the queue, and <span class=\"tex-span\"><i>n<\/i><\/span>-th people to refer the last one in the queue.<\/p><p>There will be <span class=\"tex-span\"><i>k<\/i><\/span> gondolas, and the way we allocate gondolas looks like this:<\/p><ul> <li> When the first gondolas come, the <span class=\"tex-span\"><i>q<\/i><sub class=\"lower-index\">1<\/sub><\/span> people in head of the queue go into the gondolas. <\/li><li> Then when the second gondolas come, the <span class=\"tex-span\"><i>q<\/i><sub class=\"lower-index\">2<\/sub><\/span> people in head of the remain queue go into the gondolas.<p>\u00a0\u00a0\u00a0\u00a0...<\/p><\/li><li> The remain <span class=\"tex-span\"><i>q<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span> people go into the last (<span class=\"tex-span\"><i>k<\/i><\/span>-th) gondolas. <\/li><\/ul><p>Note that <span class=\"tex-span\"><i>q<\/i><sub class=\"lower-index\">1<\/sub><\/span>, <span class=\"tex-span\"><i>q<\/i><sub class=\"lower-index\">2<\/sub><\/span>, ..., <span class=\"tex-span\"><i>q<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span> must be positive. You can get from the statement that <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/b76b1f8d5dc2e846c56d60430a1dc5db92759eb9.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> and <span class=\"tex-span\"><i>q<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009&gt;\u20090<\/span>.<\/p><p>You know, people don't want to stay with strangers in the gondolas, so your task is to find an optimal allocation way (that is find an optimal sequence <span class=\"tex-span\"><i>q<\/i><\/span>) to make people happy. For every pair of people <span class=\"tex-span\"><i>i<\/i><\/span> and <span class=\"tex-span\"><i>j<\/i><\/span>, there exists a value <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>ij<\/i><\/sub><\/span> denotes a level of unfamiliar. You can assume <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>ij<\/i><\/sub>\u2009=\u2009<i>u<\/i><sub class=\"lower-index\"><i>ji<\/i><\/sub><\/span> for all <span class=\"tex-span\"><i>i<\/i>,\u2009<i>j<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>i<\/i>,\u2009<i>j<\/i>\u2009\u2264\u2009<i>n<\/i>)<\/span> and <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>ii<\/i><\/sub>\u2009=\u20090<\/span> for all <span class=\"tex-span\"><i>i<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>n<\/i>)<\/span>. Then an unfamiliar value of a gondolas is the sum of the levels of unfamiliar between any pair of people that is into the gondolas.<\/p><p>A total unfamiliar value is the sum of unfamiliar values for all gondolas. Help Fox Ciel to find the minimal possible total unfamiliar value for some optimal allocation.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20094000<\/span> and <span class=\"tex-span\">1\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u2009<i>min<\/i>(<i>n<\/i>,\u2009800)<\/span>) \u2014 the number of people in the queue and the number of gondolas. Each of the following <span class=\"tex-span\"><i>n<\/i><\/span> lines contains <span class=\"tex-span\"><i>n<\/i><\/span> integers \u2014 matrix <span class=\"tex-span\"><i>u<\/i><\/span>, (<span class=\"tex-span\">0\u2009\u2264\u2009<i>u<\/i><sub class=\"lower-index\"><i>ij<\/i><\/sub>\u2009\u2264\u20099<\/span>, <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>ij<\/i><\/sub>\u2009=\u2009<i>u<\/i><sub class=\"lower-index\"><i>ji<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>ii<\/i><\/sub>\u2009=\u20090<\/span>).<\/p><p>Please, use fast input methods (for example, please use BufferedReader instead of Scanner for Java).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print an integer \u2014 the minimal possible total unfamiliar value.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 2<br/>0 0 1 1 1<br/>0 0 1 1 1<br/>1 1 0 0 0<br/>1 1 0 0 0<br/>1 1 0 0 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>8 3<br/>0 1 1 1 1 1 1 1<br/>1 0 1 1 1 1 1 1<br/>1 1 0 1 1 1 1 1<br/>1 1 1 0 1 1 1 1<br/>1 1 1 1 0 1 1 1<br/>1 1 1 1 1 0 1 1<br/>1 1 1 1 1 1 0 1<br/>1 1 1 1 1 1 1 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>7<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 2<br/>0 2 0<br/>2 0 3<br/>0 3 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, we can allocate people like this: {1, 2} goes into a gondolas, {3, 4, 5} goes into another gondolas.<\/p><p>In the second example, an optimal solution is : {1, 2, 3} | {4, 5, 6} | {7, 8}.<\/p><\/div><\/div>"}, {"contestId": 622, "index": "F", "name": "The Sum of the k-th Powers", "rating": 2600, "solvedCount": 5199, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. The Sum of the k-th Powers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are well-known formulas: <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/5391ac5117a06bc4bd7abe8e188ccda9e2478758.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>, <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/a851dad95e7e4aa94bef8930988d272774a2601c.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>, <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/f3889d7d5f09f3428aeddd86bfda56c7e162121a.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>. Also mathematicians found similar formulas for higher degrees.<\/p><p>Find the value of the sum <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/22622446a1c46d96c309737feb64ab8fed90c030.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> modulo <span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097<\/span> (so you should find the remainder after dividing the answer by the value <span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097<\/span>).<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line contains two integers <span class=\"tex-span\"><i>n<\/i>,\u2009<i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup>,\u20090\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup><\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the only integer <span class=\"tex-span\"><i>a<\/i><\/span> \u2014 the remainder after dividing the value of the sum by the value <span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>10<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>30<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>100<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 896, "index": "C", "name": "Willem, Chtholly and Seniorious", "rating": 2600, "solvedCount": 4695, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Willem, Chtholly and Seniorious<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><div class=\"epigraph\"><div class=\"epigraph-text\"><span class=\"tex-font-style-it\"><p>\u2014 Willem...<\/p><p>\u2014 What's the matter?<\/p><p>\u2014 It seems that there's something wrong with Seniorious...<\/p><p>\u2014 I'll have a look...<\/p><\/span><\/div><\/div><center><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/f0c1a165961ac7b1495e448614d25cba032c5952.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><\/center><p>Seniorious is made by linking special talismans in particular order.<\/p><p>After over 500 years, the carillon is now in bad condition, so Willem decides to examine it thoroughly.<\/p><p>Seniorious has <span class=\"tex-span\"><i>n<\/i><\/span> pieces of talisman. Willem puts them in a line, the <span class=\"tex-span\"><i>i<\/i><\/span>-th of which is an integer <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>.<\/p><p>In order to maintain it, Willem needs to perform <span class=\"tex-span\"><i>m<\/i><\/span> operations.<\/p><p>There are four types of operations:<\/p><ul><li> <span class=\"tex-span\">1 <i>l<\/i> <i>r<\/i> <i>x<\/i><\/span>: For each <span class=\"tex-span\"><i>i<\/i><\/span> such that <span class=\"tex-span\"><i>l<\/i>\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>r<\/i><\/span>, assign <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009+\u2009<i>x<\/i><\/span> to <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>.<\/li><li> <span class=\"tex-span\">2 <i>l<\/i> <i>r<\/i> <i>x<\/i><\/span>: For each <span class=\"tex-span\"><i>i<\/i><\/span> such that <span class=\"tex-span\"><i>l<\/i>\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>r<\/i><\/span>, assign <span class=\"tex-span\"><i>x<\/i><\/span> to <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>.<\/li><li> <span class=\"tex-span\">3 <i>l<\/i> <i>r<\/i> <i>x<\/i><\/span>: Print the <span class=\"tex-span\"><i>x<\/i><\/span>-th smallest number in the index range <span class=\"tex-span\">[<i>l<\/i>,\u2009<i>r<\/i>]<\/span>, i.e. the element at the <span class=\"tex-span\"><i>x<\/i><\/span>-th position if all the elements <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> such that <span class=\"tex-span\"><i>l<\/i>\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>r<\/i><\/span> are taken and sorted into an array of non-decreasing integers. It's guaranteed that <span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009-\u2009<i>l<\/i>\u2009+\u20091<\/span>.<\/li><li> <span class=\"tex-span\">4 <i>l<\/i> <i>r<\/i> <i>x<\/i> <i>y<\/i><\/span>: Print the sum of the <span class=\"tex-span\"><i>x<\/i><\/span>-th power of <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> such that <span class=\"tex-span\"><i>l<\/i>\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>r<\/i><\/span>, modulo <span class=\"tex-span\"><i>y<\/i><\/span>, i.e. <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/bb452ebe2c68ca0f9c697357e053ba4e4b93c89e.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>.<\/li><\/ul><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line contains four integers <span class=\"tex-span\"><i>n<\/i>,\u2009<i>m<\/i>,\u2009<i>seed<\/i>,\u2009<i>v<\/i><sub class=\"lower-index\"><i>max<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>m<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>,\u20090\u2009\u2264\u2009<i>seed<\/i>\u2009&lt;\u200910<sup class=\"upper-index\">9<\/sup>\u2009+\u20097,\u20091\u2009\u2264\u2009<i>vmax<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>).<\/p><p>The initial values and operations are generated using following pseudo code:<\/p><pre class=\"verbatim\"><br/>def rnd():<br/><br/>    ret = seed<br/>    seed = (seed * 7 + 13) mod 1000000007<br/>    return ret<br/><br/>for i = 1 to n:<br/><br/>    a[i] = (rnd() mod vmax) + 1<br/><br/>for i = 1 to m:<br/><br/>    op = (rnd() mod 4) + 1<br/>    l = (rnd() mod n) + 1<br/>    r = (rnd() mod n) + 1<br/><br/>    if (l &gt; r): <br/>         swap(l, r)<br/><br/>    if (op == 3):<br/>        x = (rnd() mod (r - l + 1)) + 1<br/>    else:<br/>        x = (rnd() mod vmax) + 1<br/><br/>    if (op == 4):<br/>        y = (rnd() mod vmax) + 1<br/><br/><\/pre><p>Here <span class=\"tex-span\"><i>op<\/i><\/span> is the type of the operation mentioned in the legend.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each operation of types <span class=\"tex-span\">3<\/span> or <span class=\"tex-span\">4<\/span>, output a line containing the answer.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>10 10 7 9<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/>1<br/>0<br/>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>10 10 9 9<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/>1<br/>3<br/>3<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, the initial array is <span class=\"tex-span\">{8,\u20099,\u20097,\u20092,\u20093,\u20091,\u20095,\u20096,\u20094,\u20098}<\/span>.<\/p><p>The operations are:<\/p><ul> <li> <span class=\"tex-span\">2 6 7 9<\/span> <\/li><li> <span class=\"tex-span\">1 3 10 8<\/span> <\/li><li> <span class=\"tex-span\">4 4 6 2 4<\/span> <\/li><li> <span class=\"tex-span\">1 4 5 8<\/span> <\/li><li> <span class=\"tex-span\">2 1 7 1<\/span> <\/li><li> <span class=\"tex-span\">4 7 9 4 4<\/span> <\/li><li> <span class=\"tex-span\">1 2 7 9<\/span> <\/li><li> <span class=\"tex-span\">4 5 8 1 1<\/span> <\/li><li> <span class=\"tex-span\">2 5 7 5<\/span> <\/li><li> <span class=\"tex-span\">4 3 10 8 5<\/span> <\/li><\/ul><\/div><\/div>"}, {"contestId": 3, "index": "D", "name": "Least Cost Bracket Sequence", "rating": 2600, "solvedCount": 4384, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Least Cost Bracket Sequence<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>64 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>This is yet another problem on regular bracket sequences.<\/p><p>A bracket sequence is called regular, if by inserting \"<span class=\"tex-font-style-tt\">+<\/span>\" and \"<span class=\"tex-font-style-tt\">1<\/span>\" into it we get a correct mathematical expression. For example, sequences \"<span class=\"tex-font-style-tt\">(())()<\/span>\", \"<span class=\"tex-font-style-tt\">()<\/span>\" and \"<span class=\"tex-font-style-tt\">(()(()))<\/span>\" are regular, while \"<span class=\"tex-font-style-tt\">)(<\/span>\", \"<span class=\"tex-font-style-tt\">(()<\/span>\" and \"<span class=\"tex-font-style-tt\">(()))(<\/span>\" are not. You have a pattern of a bracket sequence that consists of characters \"<span class=\"tex-font-style-tt\">(<\/span>\", \"<span class=\"tex-font-style-tt\">)<\/span>\" and \"<span class=\"tex-font-style-tt\">?<\/span>\". You have to replace each character \"<span class=\"tex-font-style-tt\">?<\/span>\" with a bracket so, that you get a regular bracket sequence.<\/p><p>For each character \"<span class=\"tex-font-style-tt\">?<\/span>\" the cost of its replacement with \"<span class=\"tex-font-style-tt\">(<\/span>\" and \"<span class=\"tex-font-style-tt\">)<\/span>\" is given. Among all the possible variants your should choose the cheapest.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a non-empty pattern of even length, consisting of characters \"<span class=\"tex-font-style-tt\">(<\/span>\", \"<span class=\"tex-font-style-tt\">)<\/span>\" and \"<span class=\"tex-font-style-tt\">?<\/span>\". Its length doesn't exceed <span class=\"tex-span\">5\u00b710<sup class=\"upper-index\">4<\/sup><\/span>. Then there follow <span class=\"tex-span\"><i>m<\/i><\/span> lines, where <span class=\"tex-span\"><i>m<\/i><\/span> is the number of characters \"<span class=\"tex-font-style-tt\">?<\/span>\" in the pattern. Each line contains two integer numbers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup><\/span>), where <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is the cost of replacing the <span class=\"tex-span\"><i>i<\/i><\/span>-th character \"<span class=\"tex-font-style-tt\">?<\/span>\" with an opening bracket, and <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> \u2014 with a closing one.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the cost of the optimal regular bracket sequence in the first line, and the required sequence in the second.<\/p><p>Print <span class=\"tex-font-style-tt\">-1<\/span>, if there is no answer. If the answer is not unique, print any of them. <\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>(??)<br/>1 2<br/>2 8<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/>()()<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 940, "index": "F", "name": "Machine Learning", "rating": 2600, "solvedCount": 3667, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Machine Learning<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-it\">You come home and fell some unpleasant smell. Where is it coming from?<\/span><\/p><p>You are given an array <span class=\"tex-span\"><i>a<\/i><\/span>. You have to answer the following queries: <\/p><ol> <li> You are given two integers <span class=\"tex-span\"><i>l<\/i><\/span> and <span class=\"tex-span\"><i>r<\/i><\/span>. Let <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> be the number of occurrences of <span class=\"tex-span\"><i>i<\/i><\/span> in <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>l<\/i>:\u2009<i>r<\/i><\/sub><\/span>, where <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>l<\/i>:\u2009<i>r<\/i><\/sub><\/span> is the subarray of <span class=\"tex-span\"><i>a<\/i><\/span> from <span class=\"tex-span\"><i>l<\/i><\/span>-th element to <span class=\"tex-span\"><i>r<\/i><\/span>-th inclusive. Find the <span class=\"tex-font-style-bf\">Mex<\/span> of <span class=\"tex-span\">{<i>c<\/i><sub class=\"lower-index\">0<\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\">1<\/sub>,\u2009...,\u2009<i>c<\/i><sub class=\"lower-index\">10<sup class=\"upper-index\">9<\/sup><\/sub>}<\/span> <\/li><li> You are given two integers <span class=\"tex-span\"><i>p<\/i><\/span> to <span class=\"tex-span\"><i>x<\/i><\/span>. Change <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>p<\/i><\/sub><\/span> to <span class=\"tex-span\"><i>x<\/i><\/span>. <\/li><\/ol><p>The <span class=\"tex-font-style-bf\">Mex<\/span> of a multiset of numbers is the smallest non-negative integer <span class=\"tex-font-style-bf\">not in<\/span> the set.<\/p><p>Note that in this problem all elements of <span class=\"tex-span\"><i>a<\/i><\/span> are positive, which means that <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\">0<\/sub><\/span> = 0 and <span class=\"tex-span\">0<\/span> is never the answer for the query of the second type.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>q<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>q<\/i>\u2009\u2264\u2009100\u2009000<\/span>)\u00a0\u2014 the length of the array and the number of queries respectively.<\/p><p>The second line of input contains <span class=\"tex-span\"><i>n<\/i><\/span> integers\u00a0\u2014 <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub><\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">2<\/sub><\/span>, <span class=\"tex-span\">...<\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>).<\/p><p>Each of the next <span class=\"tex-span\"><i>q<\/i><\/span> lines describes a single query.<\/p><p>The first type of query is described by three integers <span class=\"tex-span\"><i>t<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009=\u20091<\/span>, <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, where <span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>\u00a0\u2014 the bounds of the subarray.<\/p><p>The second type of query is described by three integers <span class=\"tex-span\"><i>t<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009=\u20092<\/span>, <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, where <span class=\"tex-span\">1\u2009\u2264\u2009<i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span> is the index of the element, which must be changed and <span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span> is the new value.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query of the first type output a single integer \u00a0\u2014 the <span class=\"tex-font-style-bf\">Mex<\/span> of <span class=\"tex-span\">{<i>c<\/i><sub class=\"lower-index\">0<\/sub>,\u2009<i>c<\/i><sub class=\"lower-index\">1<\/sub>,\u2009...,\u2009<i>c<\/i><sub class=\"lower-index\">10<sup class=\"upper-index\">9<\/sup><\/sub>}<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>10 4<br/>1 2 3 1 1 2 2 2 9 9<br/>1 1 1<br/>1 2 8<br/>2 7 1<br/>1 2 8<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/>3<br/>2<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The subarray of the first query consists of the single element\u00a0\u2014 <span class=\"tex-span\">1<\/span>. <\/p><p>The subarray of the second query consists of four <span class=\"tex-span\">2<\/span>s, one <span class=\"tex-span\">3<\/span> and two <span class=\"tex-span\">1<\/span>s.<\/p><p>The subarray of the fourth query consists of three <span class=\"tex-span\">1<\/span>s, three <span class=\"tex-span\">2<\/span>s and one <span class=\"tex-span\">3<\/span>.<\/p><\/div><\/div>"}, {"contestId": 2129, "index": "D", "name": "Permutation Blackhole", "rating": 2600, "solvedCount": 3657, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Permutation Blackhole<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>For a permutation $$$p_1, p_2, \\ldots, p_n$$$ of length $$$n$$$, the corresponding coloring sequence $$$s$$$ can be obtained by the following coloring process:<\/p><ul> <li> Initially, there are $$$n$$$ white cells indexed from $$$1$$$ to $$$n$$$ from left to right. At second $$$0$$$, the score of each cell is $$$0$$$. <\/li><li> At second $$$i$$$ ($$$1 \\le i \\le n$$$), <ul> <li> If $$$i  \\gt  1$$$, find the nearest black cell to the cell $$$p_i$$$, and increase the score of that cell by $$$1$$$. In case there are multiple nearest black cells, choose the cell with the lowest index. Cell $$$y$$$ is called the nearest black cell to cell $$$x$$$ only if cell $$$y$$$ is black and there is no black cell $$$z$$$ satisfying $$$|x-z| \\lt |x-y|$$$. <\/li><li> Color the cell $$$p_i$$$ black. <\/li><\/ul> <\/li><\/ul><p>After all cells are colored black, denoting $$$s_i$$$ as the score of cell $$$i$$$ ($$$1 \\le i \\le n$$$), we get the coloring sequence $$$s$$$.<\/p><p>You might want to read the notes for a better understanding.<\/p><p>You are given an incomplete coloring sequence $$$s$$$, where some $$$s_i$$$ are already fixed, while others are not yet determined. Count how many different permutations $$$p$$$ can produce this coloring sequence. Since the answer may be large, you need to output it modulo $$$998\\,244\\,353$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^3$$$). The description of the test cases follows. <\/p><p>For each test case, the first line contains an integer $$$n$$$ ($$$2 \\leq n \\leq 100$$$).<\/p><p>The second line contains $$$n$$$ integers $$$s_1, s_2, \\ldots, s_n$$$ ($$$-1 \\leq s_i \\leq n-1$$$). Here, $$$s_i=-1$$$ means $$$s_i$$$ has not been determined. And $$$s_i \\neq -1$$$ means $$$s_i$$$ has already been fixed.<\/p><p>It is guaranteed that the sum of $$$n^2$$$ over all test cases does not exceed $$$10^4$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output the total of different permutations $$$p_1, p_2, \\ldots, p_n$$$ that can produce the coloring sequence, modulo $$$998\\,244\\,353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">9<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">-1 -1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">-1 -1 -1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">-1 2 -1 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">-1 0 1 -1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">-1 3 -1 0 -1<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">5<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">4 4 4 4 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">1 0 1 2 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">6<\/div><div class=\"test-example-line test-example-line-even test-example-line-8\">-1 1 -1 -1 3 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-9\">13<\/div><div class=\"test-example-line test-example-line-odd test-example-line-9\">-1 -1 -1 -1 -1 -1 2 -1 -1 -1 -1 -1 -1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n6\n4\n3\n8\n0\n4\n10\n867303072\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, $$$p=[3,1,2]$$$ and $$$p=[3,2,1]$$$ can produce the coloring sequence $$$s=[-1,-1,1]$$$.<\/p><p>For $$$p=[3,1,2]$$$, the coloring process is shown as the following picture.<\/p><center> <table class=\"tex-tabular\"><tbody><tr><td class=\"tex-tabular-text-align-center\"><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/26efaccea13cb1b0cea714b08dfdc0ac71a96b85.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/td><td class=\"tex-tabular-text-align-center\"><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/bdd07d7a497ef2e639ca122e46586048c77853ac.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/td><td><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/e7cbbc909a8c1f66e77eb10a021d79bae4673c82.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/td><td><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/059ff6b5a11674aa3a45d3fed2d15884b5d57da4.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/td><td><\/td><\/tr><\/tbody><\/table> <span class=\"tex-font-size-small\">The grid at seconds $$$0$$$, $$$1$$$, $$$2$$$, and $$$3$$$ respectively when $$$p=[3,1,2]$$$.<\/span> <\/center><p>For $$$p=[3,2,1]$$$, the coloring process is shown as the following picture.<\/p><center> <table class=\"tex-tabular\"><tbody><tr><td class=\"tex-tabular-text-align-center\"><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/26efaccea13cb1b0cea714b08dfdc0ac71a96b85.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/td><td class=\"tex-tabular-text-align-center\"><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/bdd07d7a497ef2e639ca122e46586048c77853ac.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/td><td><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/552c55326775e1fa2bf69f0e4d8a046c6d3abea9.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/td><td><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/c8295c674ce2876ecbb6926a02ba211fdcdfe904.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/td><td><\/td><\/tr><\/tbody><\/table> <span class=\"tex-font-size-small\">The grid at seconds $$$0$$$, $$$1$$$, $$$2$$$, and $$$3$$$ respectively when $$$p=[3,2,1]$$$.<\/span> <\/center><\/div><\/div>"}, {"contestId": 1208, "index": "F", "name": "Bits And Pieces", "rating": 2600, "solvedCount": 3643, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Bits And Pieces<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ of $$$n$$$ integers.<\/p><p>You need to find the maximum value of $$$a_{i} | ( a_{j} \\&amp; a_{k} )$$$ over all triplets $$$(i,j,k)$$$ such that $$$i  \\lt  j  \\lt  k$$$.<\/p><p>Here $$$\\&amp;$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#AND\">bitwise AND operation<\/a>, and $$$|$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#OR\">bitwise OR operation<\/a>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains the integer $$$n$$$ ($$$3 \\le n \\le 10^{6}$$$), the size of the array $$$a$$$.<\/p><p>Next line contains $$$n$$$ space separated integers $$$a_1$$$, $$$a_2$$$, ..., $$$a_n$$$ ($$$0 \\le a_{i} \\le 2 \\cdot 10^{6}$$$), representing the elements of the array $$$a$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output a single integer, the maximum value of the expression given in the statement. <\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n2 4 6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n2 8 4 7\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n12\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, the only possible triplet is $$$(1, 2, 3)$$$. Hence, the answer is $$$2 | (4 \\&amp; 6) = 6$$$.<\/p><p>In the second example, there are $$$4$$$ possible triplets: <\/p><ol> <li> $$$(1, 2, 3)$$$, value of which is $$$2|(8\\&amp;4) = 2$$$. <\/li><li> $$$(1, 2, 4)$$$, value of which is $$$2|(8\\&amp;7) = 2$$$. <\/li><li> $$$(1, 3, 4)$$$, value of which is $$$2|(4\\&amp;7) = 6$$$. <\/li><li> $$$(2, 3, 4)$$$, value of which is $$$8|(4\\&amp;7) = 12$$$. <\/li><\/ol><p>The maximum value hence is $$$12$$$.<\/p><\/div><\/div>"}, {"contestId": 631, "index": "E", "name": "Product Sum", "rating": 2600, "solvedCount": 3404, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Product Sum<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Blake is the boss of Kris, however, this doesn't spoil their friendship. They often gather at the bar to talk about intriguing problems about maximising some values. This time the problem is really special.<\/p><p>You are given an array <span class=\"tex-span\"><i>a<\/i><\/span> of length <span class=\"tex-span\"><i>n<\/i><\/span>. The <span class=\"tex-font-style-it\">characteristic<\/span> of this array is the value <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/2e111bb14e07b268a6efbbdc554cdbef6e466ad0.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>\u00a0\u2014 the sum of the products of the values <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> by <span class=\"tex-span\"><i>i<\/i><\/span>. One may perform the following operation <span class=\"tex-font-style-bf\">exactly once<\/span>: pick some element of the array and move to any position. In particular, it's allowed to move the element to the beginning or to the end of the array. Also, it's allowed to put it back to the initial position. The goal is to get the array with the maximum possible value of characteristic.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/ee6910d0beff42e1b8295737a466e4b98a622d57.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains a single integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009200\u2009000<\/span>)\u00a0\u2014 the size of the array <span class=\"tex-span\"><i>a<\/i><\/span>.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\">|<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>|\u2009\u2264\u20091\u2009000\u2009000<\/span>)\u00a0\u2014 the elements of the array <span class=\"tex-span\"><i>a<\/i><\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u2014 the maximum possible value of characteristic of <span class=\"tex-span\"><i>a<\/i><\/span> that can be obtained by performing no more than one move.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>4 3 2 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>39<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1 1 2 7 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>49<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>1 1 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>9<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample, one may pick the first element and place it before the third (before <span class=\"tex-span\">5<\/span>). Thus, the answer will be <span class=\"tex-span\">3\u00b71\u2009+\u20092\u00b72\u2009+\u20094\u00b73\u2009+\u20095\u00b74\u2009=\u200939<\/span>.<\/p><p>In the second sample, one may pick the fifth element of the array and place it before the third. The answer will be <span class=\"tex-span\">1\u00b71\u2009+\u20091\u00b72\u2009+\u20091\u00b73\u2009+\u20092\u00b74\u2009+\u20097\u00b75\u2009=\u200949<\/span>.<\/p><\/div><\/div>"}, {"contestId": 2109, "index": "C3", "name": "Hacking Numbers (Hard Version)", "rating": 2600, "solvedCount": 3378, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C3. Hacking Numbers (Hard Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is the hard version of the problem. In this version, the limit of commands you can send is described in the statement. You can make hacks only if all versions of the problem are solved.<\/span><\/p><p><span class=\"tex-font-style-it\">This is an interactive problem.<\/span><\/p><p>Welcome, Duelists! In this interactive challenge, there is an unknown integer $$$x$$$ ($$$1 \\le x \\le 10^9$$$). You must make it equal to a given integer in the input $$$n$$$. By harnessing the power of \"Mathmech\" monsters, you can send a command to do one of the following:<\/p><center> <table class=\"tex-tabular\"><tbody><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-bf\">Command<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-bf\">Constraint<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-bf\">Result<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-left tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-bf\">Case<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-left tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-bf\">Update<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-bf\">Jury's response<\/span><\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\" rowspan=\"2\"><span class=\"tex-font-style-tt\">\"add $$$y$$$\"<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\" rowspan=\"2\">$$$-10^{18} \\le y \\le 10^{18}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\" rowspan=\"2\">$$$\\mathrm{res} = x + y$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-left tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\text{if } 1 \\le \\mathrm{res} \\le 10^{18}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-left tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$x \\leftarrow \\mathrm{res}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">\"1\"<\/span><\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-left tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\mathrm{else}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-left tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$x \\leftarrow x$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">\"0\"<\/span><\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\" rowspan=\"2\"><span class=\"tex-font-style-tt\">\"mul $$$y$$$\"<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\" rowspan=\"2\">$$$1 \\le y \\le 10^{18}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\" rowspan=\"2\">$$$\\mathrm{res} = x \\cdot y$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-left tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\text{if } 1 \\le \\mathrm{res} \\le 10^{18}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-left tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$x \\leftarrow \\mathrm{res}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">\"1\"<\/span><\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-left tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\mathrm{else}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-left tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$x \\leftarrow x$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">\"0\"<\/span><\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\" rowspan=\"2\"><span class=\"tex-font-style-tt\">\"div $$$y$$$\"<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\" rowspan=\"2\">$$$1 \\le y \\le 10^{18}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\" rowspan=\"2\">$$$\\mathrm{res} = x/y$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-left tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\text{if } y$$$ divides $$$x$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-left tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$x \\leftarrow \\mathrm{res}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">\"1\"<\/span><\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-left tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\mathrm{else}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-left tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$x \\leftarrow x$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">\"0\"<\/span><\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">\"digit\"<\/span><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">\u2014<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\mathrm{res} = S(x)$$$$$$^{\\text{\u2217}}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-left tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">\u2014<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-left tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$x \\leftarrow \\mathrm{res}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><span class=\"tex-font-style-tt\">\"1\"<\/span><\/td><\/tr><\/tbody><\/table> <\/center><p>Let $$$f(n)$$$ be the minimum integer such that there is a sequence of $$$f(n)$$$ commands that transforms $$$x$$$ into $$$n$$$ for all $$$x(1 \\le x \\le 10^9)$$$. You do not know the value of $$$x$$$ in advance. Find $$$f(n)$$$ such that, no matter what $$$x$$$ is, you can always transform it into $$$n$$$ using at most $$$f(n)$$$ commands.<\/p><p>Your task is to change $$$x$$$ into $$$n$$$ using <span class=\"tex-font-style-bf\">at most<\/span> $$$f(n)$$$ commands.<\/p><div class=\"statement-footnote\"><p>$$$^{\\text{\u2217}}$$$$$$S(n)$$$ is a function that returns the sum of all the individual digits of a non-negative integer $$$n$$$. For example, $$$S(123) = 1 + 2 + 3 = 6$$$<\/p><\/div><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 5000$$$). The description of the test cases follows. <\/p><p>The first and only line of each test case contains one integer $$$n$$$ ($$$1 \\le n \\le 10^9$$$).<\/p><\/div><div><div class=\"section-title\">Interaction<\/div><p>The interaction for each test case begins by reading the integer $$$n$$$.<\/p><p>To send a command, output a line in the following format:<\/p><ul> <li> <span class=\"tex-font-style-tt\">\"add $$$y$$$\"<\/span> Add some integer $$$y$$$ ($$$-10^{18} \\le y \\le 10^{18}$$$) to $$$x$$$.<p> The jury will output <span class=\"tex-font-style-tt\">\"1\"<\/span> if $$$x + y$$$ is within $$$[1, 10^{18}]$$$ (<span class=\"tex-font-style-bf\">successful<\/span>), and <span class=\"tex-font-style-tt\">\"0\"<\/span> otherwise. If successful, update $$$x \\leftarrow x + y$$$.<\/p><\/li><li> <span class=\"tex-font-style-tt\">\"mul $$$y$$$\"<\/span> Multiply $$$x$$$ by a positive integer $$$y$$$ ($$$1 \\le y \\le 10^{18}$$$).<p> The jury will output <span class=\"tex-font-style-tt\">\"1\"<\/span> if $$$x \\cdot y$$$ is within $$$[1, 10^{18}]$$$ (<span class=\"tex-font-style-bf\">successful<\/span>), and <span class=\"tex-font-style-tt\">\"0\"<\/span> otherwise. If successful, update $$$x \\leftarrow x \\cdot y$$$.<\/p><\/li><li> <span class=\"tex-font-style-tt\">\"div $$$y$$$\"<\/span> Divide $$$x$$$ by a positive integer $$$y$$$ ($$$1 \\le y \\le 10^{18}$$$).<p> The jury will output <span class=\"tex-font-style-tt\">\"1\"<\/span> if $$$y$$$ is a divisor of $$$x$$$ (<span class=\"tex-font-style-bf\">successful<\/span>), and <span class=\"tex-font-style-tt\">\"0\"<\/span> otherwise. If successful, update $$$x \\leftarrow \\frac{x}{y}$$$.<\/p><\/li><li> <span class=\"tex-font-style-tt\">\"digit\"<\/span> Make $$$x$$$ equal to the sum of its digits.<p> The jury will always output <span class=\"tex-font-style-tt\">\"1\"<\/span> and update $$$x \\leftarrow S(x)$$$.<\/p><\/li><\/ul><p>Note that commands are <span class=\"tex-font-style-bf\">case sensitive<\/span>. <\/p><p>When you have determined that $$$x$$$ is equal to $$$n$$$, output a line in the following format:<\/p><ul> <li> <span class=\"tex-font-style-tt\">\"!\"<\/span> \u2014 where the jury will output a <span class=\"tex-font-style-tt\">\"1\"<\/span> if $$$n$$$ is equal to $$$x$$$, and <span class=\"tex-font-style-tt\">\"-1\"<\/span> otherwise. <\/li><\/ul><p>Note that answering <span class=\"tex-font-style-bf\">does not count<\/span> toward your limit of commands.<\/p><p>If your program makes more than $$$f(n)$$$ commands ($$$f(n)$$$ is described above) for one test case, or makes an invalid command, then the response to the command will be <span class=\"tex-font-style-tt\">\"-1\"<\/span>. After receiving such a response, your program should immediately terminate to receive the verdict <span class=\"tex-font-style-bf\">Wrong Answer<\/span>. Otherwise, it may receive any other verdict.<\/p><p>After printing a command, do not forget to output the end of the line and flush the output. Otherwise, you will get <span class=\"tex-font-style-tt\">Idleness limit exceeded<\/span>. To do this, use:<\/p><ul> <li> <span class=\"tex-font-style-tt\">fflush(stdout)<\/span> or <span class=\"tex-font-style-tt\">cout.flush()<\/span> in C++; <\/li><li> <span class=\"tex-font-style-tt\">System.out.flush()<\/span> in Java; <\/li><li> <span class=\"tex-font-style-tt\">sys.stdout.flush()<\/span> in Python; <\/li><li> <span class=\"tex-font-style-tt\">std::io::stdout().flush()<\/span> in Rust; <\/li><li> see the documentation for other languages. <\/li><\/ul><p>The interactor is <span class=\"tex-font-style-bf\">non-adaptive<\/span>. The unknown integer $$$x$$$ <span class=\"tex-font-style-bf\">does not change<\/span> during the interaction.<\/p><p><span class=\"tex-font-style-bf\">Hacks<\/span><\/p><p>To hack, use the following format.<\/p><p>The first line should contain a single integer $$$t$$$ ($$$1 \\leq t \\leq 5000$$$) \u2014 the number of test cases.<\/p><p>The first line of each test case should contain two positive integers $$$n$$$ and $$$x$$$ ($$$1 \\leq n,x \\leq 10^9$$$) \u2014 denoting the unknown integer and the target value to which it should be made equal, respectively.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n100\n\n0\n\n1\n\n1\n\n1\n\n5\n\n1\n\n1\n\n1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n\nadd -10\n\nadd 1\n\nmul 10\n\n!\n\ndigit\n\ndiv 2\n\n!\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><center> <table class=\"tex-tabular\"><tbody><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">Solution<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">Jury<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">Explanation<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\texttt{2}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">There are 2 test cases.<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\texttt{100}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">In the first test case, the unknown integer $$$x = 9$$$ and we have to make it equal to $$$n = 100$$$.<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\texttt{add -10}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\texttt{0}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">The answer to <span class=\"tex-font-style-tt\">\"add -10\"<\/span> is <span class=\"tex-font-style-tt\">\"0\"<\/span>. This means that the addition command was not successful as $$$x + y = 9 + (-10) \\le 0$$$, and $$$x$$$ remains $$$9$$$ after the command<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\texttt{add 1}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\texttt{1}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">The answer to <span class=\"tex-font-style-tt\">\"add 1\"<\/span> is <span class=\"tex-font-style-tt\">\"1\"<\/span>. This means that the addition command was successful as $$$x + y = 9 + 1 = 10$$$, and $$$x$$$ changes to $$$10$$$ after the command.<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\texttt{mul 10}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\texttt{1}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">The answer to <span class=\"tex-font-style-tt\">\"mul 10\"<\/span> is <span class=\"tex-font-style-tt\">\"1\"<\/span>. This means that the multiplication command was successful as $$$x \\cdot y = 10 \\cdot 10 = 100$$$, and $$$x$$$ changes to $$$100$$$ after the command.<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\texttt{!}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\texttt{1}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">The answer to <span class=\"tex-font-style-tt\">\"!\"<\/span> is <span class=\"tex-font-style-tt\">\"1\"<\/span>. This means you have determined that $$$x$$$ equals $$$n$$$.<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\"><\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\texttt{5}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">In the second test case, the unknown integer $$$x = 1234$$$ and we have to make it equal to $$$n = 5$$$.<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\texttt{digit}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\texttt{1}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">The answer to <span class=\"tex-font-style-tt\">\"digit\"<\/span> is <span class=\"tex-font-style-tt\">\"1\"<\/span>. This means that $$$x$$$ turned into the sum of its digits $$$1 + 2 + 3 + 4 = 10$$$, and $$$x$$$ changes to $$$10$$$ after the command.<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\texttt{div 2}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\texttt{1}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">The answer to <span class=\"tex-font-style-tt\">\"div 2\"<\/span> is <span class=\"tex-font-style-tt\">\"1\"<\/span>. This means that the division command was successful as $$$y = 2$$$ is a divisor of $$$x = 10$$$, and $$$x$$$ changes to $$$\\frac{x}{y} = \\frac{10}{2} = 5$$$ after the command.<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\texttt{!}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">$$$\\texttt{1}$$$<\/td><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top tex-tabular-border-bottom\">The answer to <span class=\"tex-font-style-tt\">\"!\"<\/span> is <span class=\"tex-font-style-tt\">\"1\"<\/span>. This means you have determined that $$$x$$$ equals $$$n$$$.<\/td><\/tr><\/tbody><\/table> <\/center><p>Note that the empty lines in the example input and output are for the sake of clarity, and do not occur in the real interaction.<\/p><\/div><\/div>"}, {"contestId": 547, "index": "D", "name": "Mike and Fish", "rating": 2600, "solvedCount": 3368, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Mike and Fish<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>As everyone knows, bears love fish. But Mike is a strange bear; He hates fish! The even more strange thing about him is he has an infinite number of blue and red fish. <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/705d9d6abec5d0560af74523fe91344f11dd4e16.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>He has marked <span class=\"tex-span\"><i>n<\/i><\/span> distinct points in the plane. <span class=\"tex-span\"><i>i<\/i><\/span>-th point is point <span class=\"tex-span\">(<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>)<\/span>. He wants to put exactly one fish in each of these points such that the difference between the number of red fish and the blue fish on each horizontal or vertical line is at most 1.<\/p><p>He can't find a way to perform that! Please help him.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20092\u2009\u00d7\u200910<sup class=\"upper-index\">5<\/sup><\/span>).<\/p><p>The next <span class=\"tex-span\"><i>n<\/i><\/span> lines contain the information about the points, <span class=\"tex-span\"><i>i<\/i><\/span>-th line contains two integers <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u20092\u2009\u00d7\u200910<sup class=\"upper-index\">5<\/sup><\/span>), the <span class=\"tex-span\"><i>i<\/i><\/span>-th point coordinates.<\/p><p>It is guaranteed that there is at least one valid answer.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the answer as a sequence of <span class=\"tex-span\"><i>n<\/i><\/span> characters 'r' (for red) or 'b' (for blue) where <span class=\"tex-span\"><i>i<\/i><\/span>-th character denotes the color of the fish in the <span class=\"tex-span\"><i>i<\/i><\/span>-th point.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>1 1<br/>1 2<br/>2 1<br/>2 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>brrb<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>1 1<br/>1 2<br/>2 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>brr<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 741, "index": "C", "name": "Arpa\u2019s overnight party and Mehrdad\u2019s silent entering", "rating": 2600, "solvedCount": 3342, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Arpa\u2019s overnight party and Mehrdad\u2019s silent entering<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-it\">Note that girls in Arpa\u2019s land are really attractive.<\/span><\/p><p>Arpa loves overnight parties. In the middle of one of these parties Mehrdad suddenly appeared. He saw <span class=\"tex-span\"><i>n<\/i><\/span> pairs of friends sitting around a table. <span class=\"tex-span\"><i>i<\/i><\/span>-th pair consisted of a boy, sitting on the <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>-th chair, and his girlfriend, sitting on the <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>-th chair. The chairs were numbered <span class=\"tex-span\">1<\/span> through <span class=\"tex-span\">2<i>n<\/i><\/span> in clockwise direction. There was exactly one person sitting on each chair.<\/p><center> <img class=\"tex-graphics\" height=\"222px\" src=\"https://espresso.codeforces.com/04bcea95f25c850d6caf7e8b61d565c842217e0d.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"213px\"/> <\/center><p>There were two types of food: Kooft and Zahre-mar. Now Mehrdad wonders, was there any way to serve food for the guests such that: <\/p><ul> <li> Each person had exactly one type of food, <\/li><li> No boy had the same type of food as his girlfriend, <\/li><li> Among any three guests sitting on consecutive chairs, there was two of them who had different type of food. Note that chairs <span class=\"tex-span\">2<i>n<\/i><\/span> and <span class=\"tex-span\">1<\/span> are considered consecutive. <\/li><\/ul><p>Find the answer for the Mehrdad question. If it was possible, find some arrangement of food types that satisfies the conditions.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2009\u2264\u2009\u2009<i>n<\/i>\u2009\u2009\u2264\u2009\u200910<sup class=\"upper-index\">5<\/sup><\/span>)\u00a0\u2014 the number of pairs of guests.<\/p><p>The <span class=\"tex-span\"><i>i<\/i><\/span>-th of the next <span class=\"tex-span\"><i>n<\/i><\/span> lines contains a pair of integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009\u20092<i>n<\/i><\/span>)\u00a0\u2014 the number of chair on which the boy in the <span class=\"tex-span\"><i>i<\/i><\/span>-th pair was sitting and the number of chair on which his girlfriend was sitting. It's guaranteed that there was exactly one person sitting on each chair. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If there is no solution, print <span class=\"tex-font-style-tt\">-1<\/span>.<\/p><p>Otherwise print <span class=\"tex-span\"><i>n<\/i><\/span> lines, the <span class=\"tex-span\"><i>i<\/i><\/span>-th of them should contain two integers which represent the type of food for the <span class=\"tex-span\"><i>i<\/i><\/span>-th pair. The first integer in the line is the type of food the boy had, and the second integer is the type of food the girl had. If someone had Kooft, print <span class=\"tex-span\">1<\/span>, otherwise print <span class=\"tex-span\">2<\/span>.<\/p><p>If there are multiple solutions, print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>1 4<br/>2 5<br/>3 6<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1 2<br/>2 1<br/>1 2<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1416, "index": "D", "name": "Graph and Queries", "rating": 2600, "solvedCount": 2945, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Graph and Queries<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an undirected graph consisting of $$$n$$$ vertices and $$$m$$$ edges. Initially there is a single integer written on every vertex: the vertex $$$i$$$ has $$$p_i$$$ written on it. All $$$p_i$$$ are distinct integers from $$$1$$$ to $$$n$$$.<\/p><p>You have to process $$$q$$$ queries of two types:<\/p><ul> <li> $$$1$$$ $$$v$$$ \u2014 among all vertices reachable from the vertex $$$v$$$ using the edges of the graph (including the vertex $$$v$$$ itself), find a vertex $$$u$$$ with the largest number $$$p_u$$$ written on it, print $$$p_u$$$ and replace $$$p_u$$$ with $$$0$$$; <\/li><li> $$$2$$$ $$$i$$$ \u2014 delete the $$$i$$$-th edge from the graph. <\/li><\/ul> <p>Note that, in a query of the first type, it is possible that all vertices reachable from $$$v$$$ have $$$0$$$ written on them. In this case, $$$u$$$ is not explicitly defined, but since the selection of $$$u$$$ does not affect anything, you can choose any vertex reachable from $$$v$$$ and print its value (which is $$$0$$$). <\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains three integers $$$n$$$, $$$m$$$ and $$$q$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$; $$$1 \\le m \\le 3 \\cdot 10^5$$$; $$$1 \\le q \\le 5 \\cdot 10^5$$$).<\/p><p>The second line contains $$$n$$$ distinct integers $$$p_1$$$, $$$p_2$$$, ..., $$$p_n$$$, where $$$p_i$$$ is the number initially written on vertex $$$i$$$ ($$$1 \\le p_i \\le n$$$).<\/p><p>Then $$$m$$$ lines follow, the $$$i$$$-th of them contains two integers $$$a_i$$$ and $$$b_i$$$ ($$$1 \\le a_i, b_i \\le n$$$, $$$a_i \\ne b_i$$$) and means that the $$$i$$$-th edge connects vertices $$$a_i$$$ and $$$b_i$$$. It is guaranteed that the graph does not contain multi-edges.<\/p><p>Then $$$q$$$ lines follow, which describe the queries. Each line is given by one of the following formats:<\/p><ul> <li> $$$1$$$ $$$v$$$ \u2014 denotes a query of the first type with a vertex $$$v$$$ ($$$1 \\le v \\le n$$$). <\/li><li> $$$2$$$ $$$i$$$ \u2014 denotes a query of the second type with an edge $$$i$$$ ($$$1 \\le i \\le m$$$). For each query of the second type, it is guaranteed that the corresponding edge is not deleted from the graph yet. <\/li><\/ul><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For every query of the first type, print the value of $$$p_u$$$ written on the chosen vertex $$$u$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 4 6\n1 2 5 4 3\n1 2\n2 3\n1 3\n4 5\n1 1\n2 1\n2 3\n1 1\n1 2\n1 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5\n1\n2\n0\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 2122, "index": "E", "name": "Greedy Grid Counting", "rating": 2600, "solvedCount": 2935, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Greedy Grid Counting<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>A path in a grid is called <span class=\"tex-font-style-it\">greedy<\/span> if it starts at the top-left cell and moves only to the right or downward, always moving to its neighbor with the greater value (or either if the values are equal).<\/p><p>The <span class=\"tex-font-style-it\">value<\/span> of a path is the sum of the values of the cells it visits, including the start and end.<\/p><p>Given a partially filled $$$2 \\times n$$$ grid of integers between $$$1$$$ and $$$k$$$, count the number of ways to fill the empty cells such that <span class=\"tex-font-style-bf\">in every subgrid<\/span>$$$^{\\text{\u2217}}$$$, there exists a greedy path that achieves the maximum value out of all down/right paths. Since the answer may be large, calculate it modulo $$$998\\,244\\,353$$$.<\/p><div class=\"statement-footnote\"><p>$$$^{\\text{\u2217}}$$$ A subgrid of a $$$2 \\times n$$$ grid $$$a_{i,j}$$$ is a grid formed from all cells $$$a_{x,y}$$$ such that $$$l_x \\leq x \\leq r_x$$$, $$$l_y \\leq y \\leq r_y$$$ for some $$$1 \\leq l_x \\leq r_x \\leq 2$$$, $$$1 \\leq l_y \\leq r_y \\leq n$$$. <\/p><\/div><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 500$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\leq n, k \\leq 500$$$)\u00a0\u2014 the number of columns and the range of integers in the grid, respectively.<\/p><p>Then two lines follow, the $$$i$$$-th line containing $$$n$$$ integers $$$a_{i,1}, a_{i,2}, \\ldots, a_{i,n}$$$ ($$$-1 \\leq a_{i,j} \\leq k$$$, $$$a_{i,j} \\neq 0$$$)\u00a0\u2014 the values of cells in the $$$i$$$-th row of the grid, where $$$-1$$$ represents an empty cell.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$500$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer\u00a0\u2014 the number of ways to fill the grid that satisfy the above conditions, modulo $$$998\\,244\\,353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 1 -1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 -1 1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 3 -1 4 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">-1 3 4 2 -1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">10 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">-1 -1 -1 -1 -1 -1 -1 -1 -

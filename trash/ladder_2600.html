ex-span\"><i>n<\/i><\/span> consisting of only '<span class=\"tex-font-style-tt\">(<\/span>' and '<span class=\"tex-font-style-tt\">)<\/span>'.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the number of <span class=\"tex-font-style-bf\">distinct<\/span> non-empty correct sequences that occur in <span class=\"tex-span\"><i>s<\/i><\/span> as substring.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>10<br/>()()()()()<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>5<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>7<br/>)(())()<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample, there are <span class=\"tex-span\">5<\/span> distinct substrings we should count: \"<span class=\"tex-font-style-tt\">()<\/span>\", \"<span class=\"tex-font-style-tt\">()()<\/span>\", \"<span class=\"tex-font-style-tt\">()()()<\/span>\", \"<span class=\"tex-font-style-tt\">()()()()<\/span>\" and \"<span class=\"tex-font-style-tt\">()()()()()<\/span>\".<\/p><p>In the second sample, there are <span class=\"tex-span\">3<\/span> distinct substrings we should count: \"<span class=\"tex-font-style-tt\">()<\/span>\", \"<span class=\"tex-font-style-tt\">(())<\/span>\" and \"<span class=\"tex-font-style-tt\">(())()<\/span>\".<\/p><\/div><\/div>"}, {"contestId": 2081, "index": "D", "name": "MST in Modulo Graph", "rating": 2600, "solvedCount": 1252, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. MST in Modulo Graph<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a complete graph with $$$n$$$ vertices, where the $$$i$$$-th vertex has a weight $$$p_i$$$. The weight of the edge connecting vertex $$$x$$$ and vertex $$$y$$$ is equal to $$$\\operatorname{max}(p_x, p_y) \\bmod \\operatorname{min}(p_x, p_y)$$$.<\/p><p>Find the smallest total weight of a set of $$$n - 1$$$ edges that connect all $$$n$$$ vertices in this graph.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows. <\/p><p>The first line of each test contains an integer $$$n$$$ ($$$1 \\le n \\le 5 \\cdot 10^5$$$).<\/p><p>The next line of each test contains $$$n$$$ integers $$$p_1, p_2, \\ldots, p_n$$$ ($$$1 \\le p_i \\le 5 \\cdot 10^5$$$).<\/p><p>The sum of $$$n$$$ over all test cases does not exceed $$$5 \\cdot 10^5$$$.<\/p><p>The sum of $$$\\max(p_1,p_2,\\ldots,p_n)$$$ over all test cases does not exceed $$$5 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single integer\u00a0\u2014 the weight of the minimum spanning tree.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 3 3 4 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">10<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 10 3 2 9 9 4 6 4 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">12<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">33 56 48 41 89 73 99 150 55 100 111 130<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">7<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">11 45 14 19 19 8 10<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n0\n44\n10\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, one of the possible ways to connect the edges is to draw the edges $$$(1, 2)$$$, $$$(1, 4)$$$, $$$(1, 5)$$$, $$$(2, 3)$$$. The weight of the first edge is $$$\\operatorname{max}(p_1, p_2) \\bmod \\operatorname{min}(p_1, p_2)=4 \\bmod 3 = 1$$$, and the weights of all other edges are $$$0$$$.<\/p><\/div><\/div>"}, {"contestId": 1684, "index": "F", "name": "Diverse Segments", "rating": 2600, "solvedCount": 1245, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Diverse Segments<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$ of $$$n$$$ integers. Also you are given $$$m$$$ subsegments of that array. The left and the right endpoints of the $$$j$$$-th segment are $$$l_j$$$ and $$$r_j$$$ respectively.<\/p><p>You are allowed to make <span class=\"tex-font-style-bf\">no more than one<\/span> operation. In that operation you choose any subsegment of the array $$$a$$$ and replace each value on this segment with any integer (you are also allowed to keep elements the same).<\/p><p>You have to apply this operation so that for the given $$$m$$$ segments, the elements on each segment are distinct. More formally, for each $$$1 \\le j \\le m$$$ all elements $$$a_{l_{j}}, a_{l_{j}+1}, \\ldots, a_{r_{j}-1}, a_{r_{j}}$$$ should be distinct.<\/p><p>You don't want to use the operation on a big segment, so you have to find the smallest length of a segment, so that you can apply the operation to this segment and meet the above-mentioned conditions. If it is not needed to use this operation, the answer is $$$0$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The input consists of multiple test cases. The first line contains a single integer $$$t$$$ ($$$1 \\le t \\le 100$$$)\u00a0\u2014 the number of test cases. Description of the test cases follows.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\le n, m \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the size of the array and the number of segments respectively.<\/p><p>The next line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le 10^9$$$)\u00a0\u2014 the elements of $$$a$$$.<\/p><p>Each of the next $$$m$$$ lines contains two integers $$$l_j$$$, $$$r_j$$$ ($$$1 \\le l_j \\le r_j \\le n$$$)\u00a0\u2014 the left and the right endpoints of the $$$j$$$-th segment.<\/p><p>It's guaranteed that the sum of $$$n$$$ and the sum of $$$m$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case output a single integer\u00a0\u2014 the smallest length of a segment you can apply an operation on making the elements on all given segments distinct. If it is not needed to use the operation, output $$$0$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">7 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1 2 1 3 3 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">10 1 6 14 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 7 5 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">7 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 2 2 7 8 2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">123<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n0\n1\n0\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case you can perform the operation on the segment $$$[1, 2]$$$ and make $$$a = [5, 6, 2, 1, 3, 3, 5]$$$. Then the elements on each segment are distinct.<\/p><ul> <li> On the segment $$$[1, 4]$$$ there are $$$[5, 6, 2, 1]$$$. <\/li><li> On the segment $$$[4, 5]$$$ there are $$$[1, 3]$$$. <\/li><li> On the segment $$$[2, 4]$$$ there are $$$[6, 2, 1, 3]$$$. <\/li><\/ul><p>This way on each of the given segments all elements are distinct. Also, it is impossible to change any single integer to make elements distinct on each segment. That is why the answer is $$$2$$$.<\/p><p>In the second test case the elements on each segment are already distinct, so we should not perform the operation.<\/p><p>In the third test case we can replace the first $$$5$$$ by $$$1$$$. This way we will get $$$[1, 7, 5, 6]$$$ where all elements are distinct so on each given segment all elements are distinct.<\/p><\/div><\/div>"}, {"contestId": 1889, "index": "C2", "name": "Doremy's Drying Plan (Hard Version)", "rating": 2600, "solvedCount": 1235, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C2. Doremy's Drying Plan (Hard Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>1024 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">The only differences between the two versions of this problem are the constraint on $$$k$$$, the time limit and the memory limit. You can make hacks only if all versions of the problem are solved.<\/span><\/p><p>Doremy lives in a rainy country consisting of $$$n$$$ cities numbered from $$$1$$$ to $$$n$$$.<\/p><p>The weather broadcast predicted the distribution of rain in the next $$$m$$$ days. In the $$$i$$$-th day, it will rain in the cities in the interval $$$[l_i, r_i]$$$. A city is called dry if it will never rain in that city in the next $$$m$$$ days.<\/p><p>It turns out that Doremy has a special power. She can choose $$$k$$$ days, and during these days it will not rain. Doremy wants to calculate the maximum number of dry cities after using the special power.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The input consists of multiple test cases. The first line contains a single integer $$$t$$$ ($$$1\\le t\\le 10^4$$$)\u00a0\u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line contains three integers $$$n$$$, $$$m$$$ and $$$k$$$ ($$$1\\le n\\le 2\\cdot 10^5$$$, $$$2 \\le m \\le 2\\cdot 10^5$$$, $$$2 \\le k \\le \\min(10, m)$$$)\u00a0\u2014 the number of cities, the number of days, and the number of days of rain that Doremy can prevent.<\/p><p>Then, $$$m$$$ lines follow. The $$$i$$$-th line contains two integers $$$l_i$$$, $$$r_i$$$ ($$$1\\le l_i\\le r_i\\le n$$$)\u00a0\u2014 the rain coverage on day $$$i$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ and the sum of $$$m$$$ over all test cases do not exceed $$$2\\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output one integer\u00a0\u2014 the maximum number of dry cities.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 3 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">10 6 4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">100 6 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 100<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 100<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 100<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 100<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 100<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 100<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1000 2 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">20 5 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">9 20<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">3 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">10 11<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">11 13<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">6 18<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n2\n6\n0\n1000\n17\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, if Doremy prevents<\/p><ul> <li> rain $$$1,2$$$, then city $$$2$$$ will be dry; <\/li><li> rain $$$2,3$$$, then no city will be dry; <\/li><li> rain $$$1,3$$$, then no city will be dry; <\/li><\/ul><p>So there is at most $$$1$$$ dry city.<\/p><p>In the second test case, if Doremy prevents<\/p><ul> <li> rain $$$1,2$$$, then city $$$1,2$$$ will be dry; <\/li><li> rain $$$2,3$$$, then city $$$4,5$$$ will be dry; <\/li><li> rain $$$1,3$$$, then city $$$1,5$$$ will be dry. <\/li><\/ul><p>So there are at most $$$2$$$ dry cities.<\/p><p>In the third test case, it is optimal to prevent rain $$$1,2,4,5$$$.<\/p><p>In the forth test case, there is always a day of rain that wets all the cities and cannot be prevented.<\/p><\/div><\/div>"}, {"contestId": 1400, "index": "G", "name": "Mercenaries", "rating": 2600, "solvedCount": 1232, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. Mercenaries<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>7 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Polycarp plays a (yet another!) strategic computer game. In this game, he leads an army of mercenaries.<\/p><p>Polycarp wants to gather his army for a quest. There are $$$n$$$ mercenaries for hire, and the army should consist of some subset of them.<\/p><p>The $$$i$$$-th mercenary can be chosen if the <span class=\"tex-font-style-bf\">resulting<\/span> number of chosen mercenaries is not less than $$$l_i$$$ (otherwise he deems the quest to be doomed) and not greater than $$$r_i$$$ (he doesn't want to share the trophies with too many other mercenaries). Furthermore, $$$m$$$ pairs of mercenaries hate each other and cannot be chosen for the same quest. <\/p><p>How many <span class=\"tex-font-style-bf\">non-empty<\/span> subsets does Polycarp need to consider? In other words, calculate the number of non-empty subsets of mercenaries such that the size of this subset belongs to $$$[l_i, r_i]$$$ for each chosen mercenary, and there are no two mercenaries in the subset that hate each other.<\/p><p>The answer may be large, so calculate it modulo $$$998244353$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\le n \\le 3 \\cdot 10^5$$$, $$$0 \\le m \\le \\min(20, \\dfrac{n(n-1)}{2})$$$) \u2014 the number of mercenaries and the number of pairs of mercenaries that hate each other.<\/p><p>Then $$$n$$$ lines follow, the $$$i$$$-th of them contains two integers $$$l_i$$$ and $$$r_i$$$ ($$$1 \\le l_i \\le r_i \\le n$$$).<\/p><p>Then $$$m$$$ lines follow, the $$$i$$$-th of them contains two integers $$$a_i$$$ and $$$b_i$$$ ($$$1 \\le a_i  \\lt  b_i \\le n$$$) denoting that the mercenaries $$$a_i$$$ and $$$b_i$$$ hate each other. There are no two equal pairs in this list.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the number of non-empty subsets meeting the constraints, taken modulo $$$998244353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 0\n1 1\n2 3\n1 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 1\n1 1\n2 3\n1 3\n2 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 338, "index": "E", "name": "Optimize!", "rating": 2600, "solvedCount": 1232, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Optimize!<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Manao is solving a problem with the following statement:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/2f5ae5ed6b3cd94354e5c592ef8f2b25721b1141.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>He came up with a solution that produces the correct answers but is too slow. You are given the pseudocode of his solution, where the function getAnswer calculates the answer to the problem:<\/p><pre class=\"verbatim\"><br/>getAnswer(a[1..n], b[1..len], h)<br/>  answer = 0<br/>  for i = 1 to n-len+1<br/>    answer = answer + f(a[i..i+len-1], b, h, 1)<br/>  return answer<br/><br/>f(s[1..len], b[1..len], h, index)<br/>  if index = len+1 then<br/>    return 1<br/>  for i = 1 to len<br/>    if s[index] + b[i] &gt;= h<br/>      mem = b[i]<br/>      b[i] = 0<br/>      res = f(s, b, h, index + 1)<br/>      b[i] = mem<br/>      if res &gt; 0<br/>        return 1<br/>  return 0<br/><\/pre><p>Your task is to help Manao optimize his algorithm.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains space-separated integers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>len<\/i><\/span> and <span class=\"tex-span\"><i>h<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>len<\/i>\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009150000;\u00a01\u2009\u2264\u2009<i>h<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>). The second line contains <span class=\"tex-span\"><i>len<\/i><\/span> space-separated integers <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>b<\/i><sub class=\"lower-index\"><i>len<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>). The third line contains <span class=\"tex-span\"><i>n<\/i><\/span> space-separated integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single number \u2014 the answer to Manao's problem.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 2 10<br/>5 3<br/>1 8 5 5 7<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1990, "index": "E2", "name": "Catch the Mole(Hard Version)", "rating": 2600, "solvedCount": 1231, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E2. Catch the Mole(Hard Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is the hard version of the problem. The only difference is the limit on the number of queries.<\/span><\/p><p><span class=\"tex-font-style-bf\">This is an interactive problem.<\/span><\/p><p>You are given a tree of $$$n$$$ nodes with node $$$1$$$ as its root node.<\/p><p>There is a hidden mole in one of the nodes. To find its position, you can pick an integer $$$x$$$ ($$$1 \\le x \\le n$$$) to make an inquiry to the jury. Next, the jury will return $$$1$$$ when the mole is in subtree $$$x$$$. Otherwise, the judge will return $$$0$$$. If the judge returns $$$0$$$ and the mole is not in root node $$$1$$$, the mole will move to the parent node of the node it is currently on.<\/p><p>Use at most $$$160$$$ operations to find the <span class=\"tex-font-style-bf\">current<\/span> node where the mole is located.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 100$$$). The description of the test cases follows.<\/p><\/div><div><div class=\"section-title\">Interaction<\/div><p>The first line of each test case contains one integer $$$n$$$ ($$$2 \\le n \\le 5000$$$). <\/p><p>The following $$$n-1$$$ lines describe the edges of the tree. Each line contains two space-separated integers $$$u_i$$$ and $$$v_i$$$ ($$$1 \\le u_i, v_i \\le n$$$), indicating an edge between nodes $$$u_i$$$ and $$$v_i$$$.<\/p><p>It is guaranteed that the input data represents a tree.<\/p><p>The interactor in this task is <span class=\"tex-font-style-bf\">not adaptive<\/span>. In other words, the node where the mole is located at first is fixed in every test case and does not change during the interaction.<\/p><p>To ask a query, you need to pick a vertex $$$x$$$ ($$$1 \\le x \\le n$$$) and print the line of the following form:<\/p><ul> <li> \"<span class=\"tex-font-style-tt\">? x<\/span>\" <\/li><\/ul><p>After that, you receive:<\/p><ul> <li> $$$0$$$ if the mole is not in subtree $$$x$$$; <\/li><li> $$$1$$$ if the mole is in subtree $$$x$$$. <\/li><\/ul><p>You can make at most $$$160$$$ queries of this form for each test case.<\/p><p>Next, if your program has found the <span class=\"tex-font-style-bf\">current<\/span> node where the mole is located, print the line of the following form:<\/p><ul> <li> \"<span class=\"tex-font-style-tt\">! x<\/span>\" <\/li><\/ul><p>Note that this line is <span class=\"tex-font-style-bf\">not<\/span> considered a query and is <span class=\"tex-font-style-bf\">not<\/span> taken into account when counting the number of queries asked.<\/p><p>After this, proceed to the next test case.<\/p><p>If you make more than $$$160$$$ queries during an interaction, your program must terminate immediately, and you will receive the <span class=\"tex-font-style-tt\">Wrong Answer<\/span> verdict. Otherwise, you can get an arbitrary verdict because your solution will continue to read from a closed stream.<\/p><p>After printing a query or the answer for a test case, do not forget to output the end of line and flush the output. Otherwise, you will get the verdict <span class=\"tex-font-style-tt\">Idleness Limit Exceeded<\/span>. To do this, use:<\/p><ul> <li> <span class=\"tex-font-style-tt\">fflush(stdout)<\/span> or <span class=\"tex-font-style-tt\">cout.flush()<\/span> in C++; <\/li><li> <span class=\"tex-font-style-tt\">System.out.flush()<\/span> in Java; <\/li><li> <span class=\"tex-font-style-tt\">flush(output)<\/span> in Pascal; <\/li><li> <span class=\"tex-font-style-tt\">stdout.flush()<\/span> in Python; <\/li><li> see the documentation for other languages. <\/li><\/ul><p><span class=\"tex-font-style-bf\">Hacks<\/span><\/p><p>To hack, follow the test format below.<\/p><p>The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 100$$$). The description of the test cases follows.<\/p><p>The first line of each test case contains one integer $$$n$$$ and $$$x$$$ ($$$2 \\le n \\le 5000$$$, $$$1 \\le x \\le n$$$)\u00a0\u2014 the size of the tree and the initial position of the mole.<\/p><p>The following $$$n-1$$$ lines describe the edges of the tree. Each line contains two space-separated integers $$$u_i$$$ and $$$v_i$$$ ($$$1 \\le u_i, v_i \\le n$$$), indicating an edge between nodes $$$u_i$$$ and $$$v_i$$$.<\/p><p>The input data must represent a tree.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n2\n1 2\n\n1\n\n6\n1 2\n1 3\n1 4\n4 5\n5 6\n\n0\n\n0\n\n1<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n\n\n\n? 2\n\n! 2\n\n\n\n\n\n\n? 2\n\n? 6\n\n? 4\n\n! 4\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the mole is in node $$$2$$$ initially.<\/p><p>For the query \"<span class=\"tex-font-style-tt\">? 2<\/span>\", the jury returns $$$1$$$ because the mole is in subtree $$$2$$$. After this query, the mole does not move.<\/p><p>The answer $$$2$$$ is the <span class=\"tex-font-style-bf\">current<\/span> node where the mole is located, so the answer is considered correct.<\/p><p>In the second test case, the mole is in node $$$6$$$ initially.<\/p><p>For the query \"<span class=\"tex-font-style-tt\">? 2<\/span>\", the jury returns $$$0$$$ because the mole is not in subtree $$$2$$$. After this query, the mole moves from node $$$6$$$ to node $$$5$$$.<\/p><p>For the query \"<span class=\"tex-font-style-tt\">? 6<\/span>\", the jury returns $$$0$$$ because the mole is not in subtree $$$6$$$. After this query, the mole moves from node $$$5$$$ to node $$$4$$$.<\/p><p>For the query \"<span class=\"tex-font-style-tt\">? 4<\/span>\", the jury returns $$$1$$$ because the mole is in subtree $$$4$$$. After this query, the mole does not move.<\/p><p>The answer $$$4$$$ is the <span class=\"tex-font-style-bf\">current<\/span> node where the mole is located, so the answer is considered correct.<\/p><p>Please note that the example is only for understanding the statement, and the queries in the example do <span class=\"tex-font-style-bf\">not<\/span> guarantee to determine the unique position of the mole.<\/p><\/div><\/div>"}, {"contestId": 1536, "index": "F", "name": "Omkar and Akmar", "rating": 2600, "solvedCount": 1222, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Omkar and Akmar<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Omkar and Akmar are playing a game on a circular board with $$$n$$$ ($$$2 \\leq n \\leq 10^6$$$) cells. The cells are numbered from $$$1$$$ to $$$n$$$ so that for each $$$i$$$ ($$$1 \\leq i \\leq n-1$$$) cell $$$i$$$ is adjacent to cell $$$i+1$$$ and cell $$$1$$$ is adjacent to cell $$$n$$$. Initially, each cell is empty.<\/p><p>Omkar and Akmar take turns placing either an A or a B on the board, with Akmar going first. The letter must be placed on an empty cell. In addition, the letter cannot be placed adjacent to a cell containing the same letter. <\/p><p>A player loses when it is their turn and there are no more valid moves.<\/p><p>Output the number of possible distinct games where both players play optimally modulo $$$10^9+7$$$. Note that we only consider games where some player has lost and there are no more valid moves.<\/p><p>Two games are considered distinct if the number of turns is different or for some turn, the letter or cell number that the letter is placed on were different.<\/p><p>A move is considered optimal if the move maximizes the player's chance of winning, assuming the other player plays optimally as well. More formally, if the player who has to move has a winning strategy, they have to make a move after which they will still have a winning strategy. If they do not, they can make any move.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line will contain an integer $$$n$$$ ($$$2 \\leq n \\leq 10^6$$$) \u2014 the number of cells on the board.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output a single integer \u2014 the number of possible distinct games where both players play optimally modulo $$$10^9+7$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n69420\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n629909355\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n42069\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n675837193\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first sample case, the first player has $$$4$$$ possible moves. No matter what the first player plays, the second player only has $$$1$$$ possible move, so there are $$$4$$$ possible games.<\/p><\/div><\/div>"}, {"contestId": 1592, "index": "F1", "name": "Alice and Recoloring 1", "rating": 2600, "solvedCount": 1217, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F1. Alice and Recoloring 1<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">The difference between the versions is in the costs of operations. Solution for one version won't work for another!<\/span><\/p><p>Alice has a grid of size $$$n \\times m$$$, <span class=\"tex-font-style-bf\">initially all its cells are colored white<\/span>. The cell on the intersection of $$$i$$$-th row and $$$j$$$-th column is denoted as $$$(i, j)$$$. Alice can do the following operations with this grid:<\/p><ul><li><p>Choose any subrectangle containing cell $$$(1, 1)$$$, and flip the colors of all its cells. (Flipping means changing its color from white to black or from black to white). <\/p><p><span class=\"tex-font-style-bf\">This operation costs $$$1$$$ coin.<\/span><\/p><\/li><li><p>Choose any subrectangle containing cell $$$(n, 1)$$$, and flip the colors of all its cells. <\/p><p><span class=\"tex-font-style-bf\">This operation costs $$$2$$$ coins.<\/span><\/p><\/li><li><p>Choose any subrectangle containing cell $$$(1, m)$$$, and flip the colors of all its cells. <\/p><p><span class=\"tex-font-style-bf\">This operation costs $$$4$$$ coins.<\/span><\/p><\/li><li><p>Choose any subrectangle containing cell $$$(n, m)$$$, and flip the colors of all its cells. <\/p><p><span class=\"tex-font-style-bf\">This operation costs $$$3$$$ coins.<\/span><\/p><\/li><\/ul> <p><span class=\"tex-font-style-bf\">As a reminder, subrectangle is a set of all cells $$$(x, y)$$$ with $$$x_1 \\le x \\le x_2$$$, $$$y_1 \\le y \\le y_2$$$ for some $$$1 \\le x_1 \\le x_2 \\le n$$$, $$$1 \\le y_1 \\le y_2 \\le m$$$<\/span>.<\/p><p>Alice wants to obtain her favorite coloring with these operations. What's the smallest number of coins that she would have to spend? It can be shown that it's always possible to transform the initial grid into any other.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains $$$2$$$ integers $$$n, m$$$ ($$$1 \\le n, m \\le 500$$$) \u2014 the dimensions of the grid.<\/p><p>The $$$i$$$-th of the next $$$n$$$ lines contains a string $$$s_i$$$ of length $$$m$$$, consisting of letters <span class=\"tex-font-style-tt\">W<\/span> and <span class=\"tex-font-style-tt\">B<\/span>. The $$$j$$$-th character of string $$$s_i$$$ is <span class=\"tex-font-style-tt\">W<\/span> if the cell $$$(i, j)$$$ is colored white in the favorite coloring of Alice, and <span class=\"tex-font-style-tt\">B<\/span> if it's colored black.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output the smallest number of coins Alice would have to spend to achieve her favorite coloring.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 3\nWWW\nWBB\nWBB\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n10 15\nWWWBBBWBBBBBWWW\nBBBBWWWBBWWWBBB\nBBBWWBWBBBWWWBB\nBBWBWBBWWWBBWBW\nBBBBWWWBBBWWWBB\nBWBBWWBBBBBBWWW\nWBWWBBBBWWBBBWW\nWWBWWWWBBWWBWWW\nBWBWWBWWWWWWBWB\nBBBWBWBWBBBWWBW\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n74\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample, it's optimal to just apply the fourth operation once to the rectangle containing cells $$$(2, 2), (2, 3), (3, 2), (3, 3)$$$. This would cost $$$3$$$ coins.<\/p><\/div><\/div>"}, {"contestId": 1835, "index": "C", "name": "Twin Clusters", "rating": 2600, "solvedCount": 1215, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Twin Clusters<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Famous worldwide astrophysicist Mleil waGrasse Tysok recently read about the existence of <span class=\"tex-font-style-it\">twin galaxy clusters<\/span>. Before he shares this knowledge with the broader audience in his podcast called <span class=\"tex-font-style-it\">S.tarT-ok<\/span>, he wants to prove their presence on his own. Mleil is aware that the vastness of the universe is astounding (almost as astounding as his observation skills) and decides to try his luck and find some new pair of twin clusters.<\/p><p>To do so, he used his TLEscope to observe a part of the night sky that was not yet examined by humanity in which there are exactly $$$2^{k + 1}$$$ galaxies in a row. $$$i$$$-th of them consist of exactly $$$0 \\le g_i  \\lt  4^k$$$ stars.<\/p><p>A galaxy cluster is any non-empty contiguous segment of galaxies. Moreover, its' <span class=\"tex-font-style-it\">trait<\/span> is said to be equal to the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#XOR\">bitwise XOR<\/a> of all values $$$g_i$$$ within this range.<\/p><p>Two galaxy clusters are considered twins if and only if they have the same traits and their corresponding segments are <span class=\"tex-font-style-bf\">disjoint<\/span>.<\/p><p>Write a program that, for many scenarios, will read a description of a night sky part observed by Mleil and outputs a location of two intervals belonging to some twin clusters pair, or a single value $$$-1$$$ if no such pair exists.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$, denoting the number of test cases that the program has to handle. The following lines contain test case descriptions, each containing exactly two lines.<\/p><p>The first of them contains a single integer $$$k$$$ ($$$0 \\le k \\le 17$$$).<\/p><p>The second line contains $$$2^{k + 1}$$$ integers $$$g_1, g_2, \\ldots, g_{2^{k+1}}$$$ ($$$0 \\le g_i  \\lt  4^k$$$).<\/p><p>We guarantee that the sum of values $$$2^{k + 1}$$$ over all test cases does not exceed $$$2^{18}$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Answers for all test cases should be present in separate lines. If there exist a pair of twin galaxies, then output four integers $$$a$$$, $$$b$$$, $$$c$$$, and $$$d$$$ denoting their inclusive ranges $$$[a, b]$$$ and $$$[c, d]$$$ (the first interval does not need to start before the second one, but they have to be disjoint). If no pair of such galaxies exist, output a single value $$$-1$$$ instead.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 15 0 7 11 8 3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">0 1 2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">15 63 57 39 61 25 42 61 50 41 27 41 56 23 17 27<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2 4 6 6\n2 2 3 4\n1 1 2 2\n1 1 4 10\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case we pick intervals $$$[2, 4]$$$ and $$$[6, 6]$$$ as our twin clusters. The trait of the first interval equals $$$15 \\oplus 0 \\oplus 7 = 8$$$, and the trait of the second interval equals $$$8$$$, so these galaxy clusters are indeed twins.<\/p><\/div><\/div>"}, {"contestId": 813, "index": "D", "name": "Two Melodies", "rating": 2600, "solvedCount": 1215, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Two Melodies<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Alice is a beginner composer and now she is ready to create another masterpiece. And not even the single one but two at the same time! <\/p><p>Alice has a sheet with <span class=\"tex-span\"><i>n<\/i><\/span> notes written on it. She wants to take two such non-empty non-intersecting subsequences that both of them form a <span class=\"tex-font-style-it\">melody<\/span> and sum of their lengths is maximal.<\/p><p><span class=\"tex-font-style-it\">Subsequence is a sequence that can be derived from another sequence by deleting some elements without changing the order of the remaining elements.<\/span><\/p><p>Subsequence forms a melody when each two adjacent notes either differs by <span class=\"tex-font-style-tt\">1<\/span> or are congruent modulo <span class=\"tex-font-style-tt\">7<\/span>.<\/p><p>You should write a program which will calculate maximum sum of lengths of such two non-empty non-intersecting subsequences that both of them form a melody.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer number <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20095000<\/span>).<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integer numbers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 notes written on a sheet.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print maximum sum of lengths of such two non-empty non-intersecting subsequences that both of them form a melody.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>1 2 4 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>6<br/>62 22 60 61 48 49<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>5<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example subsequences <span class=\"tex-span\">[1,\u20092]<\/span> and <span class=\"tex-span\">[4,\u20095]<\/span> give length <span class=\"tex-font-style-tt\">4<\/span> in total.<\/p><p>In the second example subsequences <span class=\"tex-span\">[62,\u200948,\u200949]<\/span> and <span class=\"tex-span\">[60,\u200961]<\/span> give length <span class=\"tex-font-style-tt\">5<\/span> in total. If you choose subsequence <span class=\"tex-span\">[62,\u200961]<\/span> in the first place then the second melody will have maximum length <span class=\"tex-font-style-tt\">2<\/span>, that gives the result of <span class=\"tex-font-style-tt\">4<\/span>, which is not maximal.<\/p><\/div><\/div>"}, {"contestId": 1530, "index": "F", "name": "Bingo", "rating": 2600, "solvedCount": 1212, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Bingo<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>7 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Getting ready for VK Fest 2021, you prepared a table with $$$n$$$ rows and $$$n$$$ columns, and filled each cell of this table with some event related with the festival that could either happen or not: for example, whether you will win a prize on the festival, or whether it will rain.<\/p><p>Forecasting algorithms used in VK have already estimated the probability for each event to happen. Event in row $$$i$$$ and column $$$j$$$ will happen with probability $$$a_{i, j} \\cdot 10^{-4}$$$. All of the events are mutually independent.<\/p><p>Let's call the table <span class=\"tex-font-style-it\">winning<\/span> if there exists a line such that all $$$n$$$ events on it happen. The line could be any horizontal line (cells $$$(i, 1), (i, 2), \\ldots, (i, n)$$$ for some $$$i$$$), any vertical line (cells $$$(1, j), (2, j), \\ldots, (n, j)$$$ for some $$$j$$$), the main diagonal (cells $$$(1, 1), (2, 2), \\ldots, (n, n)$$$), or the antidiagonal (cells $$$(1, n), (2, n - 1), \\ldots, (n, 1)$$$).<\/p><p>Find the probability of your table to be winning, and output it modulo $$$31\\,607$$$ (see Output section).<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$\u00a0($$$2 \\le n \\le 21$$$)\u00a0\u2014 the dimensions of the table.<\/p><p>The $$$i$$$-th of the next $$$n$$$ lines contains $$$n$$$ integers $$$a_{i, 1}, a_{i, 2}, \\ldots, a_{i, n}$$$ ($$$0  \\lt  a_{i, j}  \\lt  10^4$$$). The probability of event in cell $$$(i, j)$$$ to happen is $$$a_{i, j} \\cdot 10^{-4}$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the probability that your table will be winning, modulo $$$31\\,607$$$.<\/p><p>Formally, let $$$M = 31\\,607$$$. It can be shown that the answer can be expressed as an irreducible fraction $$$\\frac{p}{q}$$$, where $$$p$$$ and $$$q$$$ are integers and $$$q \\not \\equiv 0 \\pmod{M}$$$. Output the integer equal to $$$p \\cdot q^{-1} \\bmod M$$$. In other words, output such an integer $$$x$$$ that $$$0 \\le x  \\lt  M$$$ and $$$x \\cdot q \\equiv p \\pmod{M}$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n5000 5000\n5000 5000\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5927\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n2500 6000\n3000 4000\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n24812\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n1000 2000 3000\n4000 5000 6000\n7000 8000 9000\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n25267\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, any two events form a line, and the table will be winning if any two events happen. The probability of this is $$$\\frac{11}{16}$$$, and $$$5927 \\cdot 16 \\equiv 11 \\pmod{31\\,607}$$$.<\/p><\/div><\/div>"}, {"contestId": 1584, "index": "F", "name": "Strange LCS", "rating": 2600, "solvedCount": 1198, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Strange LCS<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given $$$n$$$ strings $$$s_1, s_2, \\ldots, s_n$$$, each consisting of lowercase and uppercase English letters. In addition, it's guaranteed that each character occurs in each string <span class=\"tex-font-style-bf\">at most twice<\/span>. Find the longest common subsequence of these strings.<\/p><p>A string $$$t$$$ is a subsequence of a string $$$s$$$ if $$$t$$$ can be obtained from $$$s$$$ by deletion of several (possibly, zero or all) symbols.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test consists of multiple test cases. The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 5$$$) \u2014 the number of test cases. Description of the test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$2 \\leq n \\leq 10$$$) \u2014 the number of strings.<\/p><p>Each of the next $$$n$$$ lines contains the corresponding string $$$s_i$$$. Each $$$s_i$$$ is non-empty, consists only of uppercase and lowercase English letters, and no character appears more than twice in each string.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case print the answer in two lines:<\/p><p>In the first line print the length of the longest common subsequence. <\/p><p>In the second line print the longest common subsequence. If there are multiple such subsequences, print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n2\nABC\nCBA\n2\nbacab\ndefed\n3\nabcde\naBcDe\nace\n2\ncodeforces\ntechnocup\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\nA\n0\n\n3\nace\n3\ncoc\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the longest common subsequence is \"<span class=\"tex-font-style-tt\">A<\/span>\". There are no common subsequences of length $$$2$$$.<\/p><p>In the second test case, sets of characters of strings don't intersect, so any non-empty string can't be a common subsequence.<\/p><\/div><\/div>"}, {"contestId": 372, "index": "D", "name": "Choosing Subtree is Fun", "rating": 2600, "solvedCount": 1197, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Choosing Subtree is Fun<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>There is a tree consisting of <span class=\"tex-span\"><i>n<\/i><\/span> vertices. The vertices are numbered from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span>.<\/p><p>Let's define the length of an interval <span class=\"tex-span\">[<i>l<\/i>,\u2009<i>r<\/i>]<\/span> as the value <span class=\"tex-span\"><i>r<\/i>\u2009-\u2009<i>l<\/i>\u2009+\u20091<\/span>. The score of a subtree of this tree is the maximum length of such an interval <span class=\"tex-span\">[<i>l<\/i>,\u2009<i>r<\/i>]<\/span> that, the vertices with numbers <span class=\"tex-span\"><i>l<\/i>,\u2009<i>l<\/i>\u2009+\u20091,\u2009...,\u2009<i>r<\/i><\/span> belong to the subtree.<\/p><p>Considering all subtrees of the tree whose size is at most <span class=\"tex-span\"><i>k<\/i><\/span>, return the maximum score of the subtree. Note, that in this problem tree is not rooted, so a subtree \u2014 is an arbitrary connected subgraph of the tree.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>There are two integers in the first line, <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>). Each of the next <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> lines contains integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i>,\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2260\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>). That means <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> are connected by a tree edge.<\/p><p>It is guaranteed that the input represents a tree.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output should contain a single integer \u2014 the maximum possible score.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>10 6<br/>4 10<br/>10 6<br/>2 9<br/>9 6<br/>8 5<br/>7 1<br/>4 7<br/>7 3<br/>1 8<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>16 7<br/>13 11<br/>12 11<br/>2 14<br/>8 6<br/>9 15<br/>16 11<br/>5 14<br/>6 15<br/>4 3<br/>11 15<br/>15 14<br/>10 1<br/>3 14<br/>14 7<br/>1 7<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first case, there is some subtree whose size is at most <span class=\"tex-span\">6<\/span>, including <span class=\"tex-span\">3<\/span> consecutive numbers of vertices. For example, the subtree that consists of <span class=\"tex-span\">{1,\u20093,\u20094,\u20095,\u20097,\u20098}<\/span> or of <span class=\"tex-span\">{1,\u20094,\u20096,\u20097,\u20098,\u200910}<\/span> includes <span class=\"tex-span\">3<\/span> consecutive numbers of vertices. But there is no subtree whose size is at most <span class=\"tex-span\">6<\/span>, which includes <span class=\"tex-span\">4<\/span> or more consecutive numbers of vertices.<\/p><\/div><\/div>"}, {"contestId": 1237, "index": "F", "name": "Balanced Domino Placements", "rating": 2600, "solvedCount": 1192, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Balanced Domino Placements<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Consider a square grid with $$$h$$$ rows and $$$w$$$ columns with some dominoes on it. Each domino covers exactly two cells of the grid that share a common side. Every cell is covered by at most one domino.<\/p><p>Let's call a placement of dominoes on the grid <span class=\"tex-font-style-it\">perfectly balanced<\/span> if no row and no column contains a pair of cells covered by two different dominoes. In other words, every row and column may contain no covered cells, one covered cell, or two covered cells that belong to the same domino.<\/p><p>You are given a perfectly balanced placement of dominoes on a grid. Find the number of ways to place zero or more extra dominoes on this grid to keep the placement perfectly balanced. Output this number modulo $$$998\\,244\\,353$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains three integers $$$h$$$, $$$w$$$, and $$$n$$$ ($$$1 \\le h, w \\le 3600$$$; $$$0 \\le n \\le 2400$$$), denoting the dimensions of the grid and the number of already placed dominoes. The rows are numbered from $$$1$$$ to $$$h$$$, and the columns are numbered from $$$1$$$ to $$$w$$$.<\/p><p>Each of the next $$$n$$$ lines contains four integers $$$r_{i, 1}, c_{i, 1}, r_{i, 2}, c_{i, 2}$$$ ($$$1 \\le r_{i, 1} \\le r_{i, 2} \\le h$$$; $$$1 \\le c_{i, 1} \\le c_{i, 2} \\le w$$$), denoting the row id and the column id of the cells covered by the $$$i$$$-th domino. Cells $$$(r_{i, 1}, c_{i, 1})$$$ and $$$(r_{i, 2}, c_{i, 2})$$$ are distinct and share a common side.<\/p><p>The given domino placement is perfectly balanced.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output the number of ways to place zero or more extra dominoes on the grid to keep the placement perfectly balanced, modulo $$$998\\,244\\,353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 7 2\n3 1 3 2\n4 4 4 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n8\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 4 2\n1 2 2 2\n4 3 4 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n23 42 0\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n102848351\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, the initial grid looks like this:<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/17a05eb288e817191d7f59557b5fec7941f8efa1.png\" style=\"zoom: 10.0%;max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>Here are $$$8$$$ ways to place zero or more extra dominoes to keep the placement perfectly balanced:<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/a8d1963f63606b39044805c34beec793b98f3810.png\" style=\"zoom: 40.0%;max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>In the second example, the initial grid looks like this:<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/55e8f4cb3b0439753e722c33987ea6f368826c44.png\" style=\"zoom: 40.0%;max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>No extra dominoes can be placed here.<\/p><\/div><\/div>"}];
    let currentProblem = null;
    let editor = null;
    const STORAGE_KEY = `cf_ladder_done_2600`;
    let doneSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));

    // Retrieve the template securely from the hidden textarea
    const DEFAULT_TEMPLATE = document.getElementById('cpp-template').value.trim();

    function initEditor() {
        editor = ace.edit("editor");
        editor.setTheme("ace/theme/tomorrow_night_eighties");
        editor.session.setMode("ace/mode/c_cpp");
        editor.setFontSize(15);
        editor.setValue(DEFAULT_TEMPLATE, 1);
    }

    function renderSidebar() {
        const list = document.getElementById('problem-list');
        list.innerHTML = '';
        PROBLEMS.forEach((prob, idx) => {
            const div = document.createElement('div');
            div.className = `problem-item ${currentProblem === prob ? 'active' : ''}`;
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox'; checkbox.className = 'done-checkbox'; checkbox.checked = doneSet.has(prob.name);
            checkbox.onclick = (e) => { e.stopPropagation(); toggleDone(prob.name, checkbox.checked); };
            const title = document.createElement('div');
            title.innerHTML = `<span class="text-xs text-slate-500">#${idx + 1}</span> <span class="font-semibold text-slate-200">${prob.name}</span>`;
            div.appendChild(checkbox); div.appendChild(title); div.onclick = () => loadProblem(prob);
            list.appendChild(div);
        });
        updateProgress();
    }

    function toggleDone(name, isDone) {
        if(isDone) { doneSet.add(name); confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#4ade80', '#38bdf8'] }); } 
        else { doneSet.delete(name); }
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...doneSet]));
        updateProgress();
    }

    function updateProgress() { document.getElementById('progress-text').innerText = `${doneSet.size} / ${PROBLEMS.length} Solved`; }

    function loadProblem(prob) {
        currentProblem = prob; renderSidebar();
        document.getElementById('welcome-screen').style.display = 'none';
        const contentDiv = document.getElementById('problem-content');
        contentDiv.style.display = 'block'; contentDiv.innerHTML = prob.html;
        const titleEl = contentDiv.querySelector('.header .title');
        if(titleEl) {
            const originalText = titleEl.innerText;
            titleEl.innerHTML = `<a href="https://codeforces.com/contest/${prob.contestId}/problem/${prob.index}" target="_blank" title="Open in Codeforces">${originalText} 🔗</a>`;
        }
        contentDiv.querySelectorAll('.sample-tests .input pre').forEach(pre => {
            const btn = document.createElement('button'); btn.innerText = 'Copy'; btn.className = 'copy-btn';
            btn.onclick = () => { navigator.clipboard.writeText(pre.innerText); btn.innerText = 'Copied!'; btn.style.background = '#4ade80'; setTimeout(() => { btn.innerText = 'Copy'; btn.style.background = 'var(--neon-blue)'; }, 2000); };
            pre.parentElement.appendChild(btn);
        });
        if (window.MathJax) { MathJax.typesetPromise([contentDiv]); }
        editor.setValue(DEFAULT_TEMPLATE, 1);
    }

    function toggleSettings() {
        const modal = document.getElementById('settings-modal');
        if(modal.style.display === 'flex') { modal.style.display = 'none'; } 
        else { modal.style.display = 'flex'; document.getElementById('api-key').value = localStorage.getItem('cf_api_key') || ''; document.getElementById('api-secret').value = localStorage.getItem('cf_api_secret') || ''; }
    }

    function saveSettings() {
        localStorage.setItem('cf_api_key', document.getElementById('api-key').value);
        localStorage.setItem('cf_api_secret', document.getElementById('api-secret').value);
        toggleSettings(); alert('API Credentials Saved!');
    }

    async function sha512(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-512', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function submitCode() {
        if(!currentProblem) return alert('Select a problem first!');
        const apiKey = localStorage.getItem('cf_api_key'); const apiSecret = localStorage.getItem('cf_api_secret');
        if(!apiKey || !apiSecret) { alert('Please configure your API Key and Secret first.'); toggleSettings(); return; }
        const code = editor.getValue(); const time = Math.floor(Date.now() / 1000); const rand = Math.floor(Math.random() * 900000) + 100000;
        const params = { apiKey: apiKey, contestId: currentProblem.contestId.toString(), languageId: "54", problemIndex: currentProblem.index, source: code, time: time.toString() };
        const sortedKeys = Object.keys(params).sort();
        let paramString = sortedKeys.map(k => `${k}=${encodeURIComponent(params[k])}`).join('&');
        const sigPlain = `${rand}/problemset.submit?${paramString}#${apiSecret}`;
        const apiSig = `${rand}` + await sha512(sigPlain);
        try {
            const formData = new URLSearchParams();
            for (const key in params) formData.append(key, params[key]);
            formData.append("apiSig", apiSig);
            const res = await fetch("https://codeforces.com/api/problemset.submit", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: formData.toString() });
            const data = await res.json();
            if(data.status === 'OK') { alert('Code submitted successfully! 🎉 Check your Codeforces submissions.'); confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } }); } 
            else { alert('Submission failed: ' + data.comment); }
        } catch (err) { console.error(err); alert('Network error during submission.'); }
    }

    window.onload = () => { initEditor(); renderSidebar(); };
</script>

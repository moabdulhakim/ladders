the number of contenders who can win.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 2<br/>1 5<br/>5 1<br/>10 10<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/>2<br/>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 2<br/>2 2<br/>3 3<br/>1 10<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/>1<br/>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 2<br/>2 3<br/>1 1<br/>3 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/>1<br/>2<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample:<\/p><p>In the first tournament there is only one sportsman, and he is the winner.<\/p><p>In the second tournament, there are two sportsmen, and everyone can defeat another, depending on kind of sports.<\/p><p>In the third tournament, the third sportsman in the strongest in both kinds of sports, so he is the winner regardless of the scheme.<\/p><\/div><\/div>"}, {"contestId": 1292, "index": "D", "name": "Chaotic V.", "rating": 2700, "solvedCount": 1070, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Chaotic V.<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><div class=\"epigraph\"><div class=\"epigraph-text\"><a href=\"https://soundcloud.com/kivawu/aesir-chaos\"><span class=\"tex-font-style-it\">\u00c6sir - CHAOS<\/span><\/a><\/div><\/div> <div class=\"epigraph\"><div class=\"epigraph-text\"><a href=\"https://soundcloud.com/kivawu/aesir-v\"><span class=\"tex-font-style-it\">\u00c6sir - V.<\/span><\/a><\/div><\/div><p><span class=\"tex-font-style-it\">\"Everything has been planned out. No more hidden concerns. The condition of Cytus is also perfect.<\/span><\/p><p><span class=\"tex-font-style-it\">The time right now...... 00:01:12......<\/span><\/p><p><span class=\"tex-font-style-it\">It's time.\"<\/span><\/p><p>The emotion samples are now sufficient. After almost 3 years, it's time for Ivy to awake her bonded sister, Vanessa.<\/p><p>The system inside A.R.C.'s Library core can be considered as an undirected graph with infinite number of processing nodes, numbered with all positive integers ($$$1, 2, 3, \\ldots$$$). The node with a number $$$x$$$ ($$$x  \\gt  1$$$), is directly connected with a node with number $$$\\frac{x}{f(x)}$$$, with $$$f(x)$$$ being the lowest prime divisor of $$$x$$$.<\/p><p>Vanessa's mind is divided into $$$n$$$ fragments. Due to more than 500 years of coma, the fragments have been scattered: the $$$i$$$-th fragment is now located at the node with a number $$$k_i!$$$ (a factorial of $$$k_i$$$).<\/p><p>To maximize the chance of successful awakening, Ivy decides to place the samples in a node $$$P$$$, so that the total length of paths from each fragment to $$$P$$$ is smallest possible. If there are multiple fragments located at the same node, the path from that node to $$$P$$$ needs to be counted multiple times.<\/p><p>In the world of zeros and ones, such a requirement is very simple for Ivy. Not longer than a second later, she has already figured out such a node.<\/p><p>But for a mere human like you, is this still possible?<\/p><p>For simplicity, please answer the minimal sum of paths' lengths from every fragment to the emotion samples' assembly node $$$P$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer $$$n$$$ ($$$1 \\le n \\le 10^6$$$)\u00a0\u2014 number of fragments of Vanessa's mind.<\/p><p>The second line contains $$$n$$$ integers: $$$k_1, k_2, \\ldots, k_n$$$ ($$$0 \\le k_i \\le 5000$$$), denoting the nodes where fragments of Vanessa's mind are located: the $$$i$$$-th fragment is at the node with a number $$$k_i!$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer, denoting the minimal sum of path from every fragment to the node with the emotion samples (a.k.a. node $$$P$$$).<\/p><p>As a reminder, if there are multiple fragments at the same node, the distance from that node to $$$P$$$ needs to be counted multiple times as well.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n2 1 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n3 1 4 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n3 1 4 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n3 1 4 1 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n11\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Considering the first $$$24$$$ nodes of the system, the node network will look as follows (the nodes $$$1!$$$, $$$2!$$$, $$$3!$$$, $$$4!$$$ are drawn bold):<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/043302b7f3870a8689d82fdc00b8b7beb0fada68.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>For the first example, Ivy will place the emotion samples at the node $$$1$$$. From here:<\/p><ul> <li> The distance from Vanessa's first fragment to the node $$$1$$$ is $$$1$$$. <\/li><li> The distance from Vanessa's second fragment to the node $$$1$$$ is $$$0$$$. <\/li><li> The distance from Vanessa's third fragment to the node $$$1$$$ is $$$4$$$. <\/li><\/ul><p>The total length is $$$5$$$.<\/p><p>For the second example, the assembly node will be $$$6$$$. From here:<\/p><ul> <li> The distance from Vanessa's first fragment to the node $$$6$$$ is $$$0$$$. <\/li><li> The distance from Vanessa's second fragment to the node $$$6$$$ is $$$2$$$. <\/li><li> The distance from Vanessa's third fragment to the node $$$6$$$ is $$$2$$$. <\/li><li> The distance from Vanessa's fourth fragment to the node $$$6$$$ is again $$$2$$$. <\/li><\/ul><p>The total path length is $$$6$$$.<\/p><\/div><\/div>"}, {"contestId": 487, "index": "D", "name": "Conveyor Belts", "rating": 2700, "solvedCount": 1069, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Conveyor Belts<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Automatic Bakery of Cyberland (ABC) recently bought an <span class=\"tex-span\"><i>n<\/i>\u2009\u00d7\u2009<i>m<\/i><\/span> rectangle table. To serve the diners, ABC placed seats around the table. The size of each seat is equal to a unit square, so there are <span class=\"tex-span\">2(<i>n<\/i>\u2009+\u2009<i>m<\/i>)<\/span> seats in total.<\/p><p>ABC placed conveyor belts on each unit square on the table. There are three types of conveyor belts: \"<span class=\"tex-font-style-tt\">^<\/span>\", \"<span class=\"tex-font-style-tt\">&lt;<\/span>\" and \"<span class=\"tex-font-style-tt\">&gt;<\/span>\". A \"<span class=\"tex-font-style-tt\">^<\/span>\" belt can bring things upwards. \"<span class=\"tex-font-style-tt\">&lt;<\/span>\" can bring leftwards and \"<span class=\"tex-font-style-tt\">&gt;<\/span>\" can bring rightwards.<\/p><p>Let's number the rows with <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span> from top to bottom, the columns with <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>m<\/i><\/span> from left to right. We consider the seats above and below the top of the table are rows <span class=\"tex-span\">0<\/span> and <span class=\"tex-span\"><i>n<\/i>\u2009+\u20091<\/span> respectively. Also we define seats to the left of the table and to the right of the table to be column <span class=\"tex-span\">0<\/span> and <span class=\"tex-span\"><i>m<\/i>\u2009+\u20091<\/span>. Due to the conveyor belts direction restriction there are currently no way for a diner sitting in the row <span class=\"tex-span\"><i>n<\/i>\u2009+\u20091<\/span> to be served.<\/p><p>Given the initial table, there will be <span class=\"tex-span\"><i>q<\/i><\/span> events in order. There are two types of events:<\/p><ul> <li> \"A <span class=\"tex-span\"><i>x<\/i><\/span> <span class=\"tex-span\"><i>y<\/i><\/span>\" means, a piece of bread will appear at row <span class=\"tex-span\"><i>x<\/i><\/span> and column <span class=\"tex-span\"><i>y<\/i><\/span> (we will denote such position as <span class=\"tex-span\">(<i>x<\/i>,\u2009<i>y<\/i>)<\/span>). The bread will follow the conveyor belt, until arriving at a seat of a diner. It is possible that the bread gets stuck in an infinite loop. Your task is to simulate the process, and output the final position of the bread, or determine that there will be an infinite loop. <\/li><li> \"C <span class=\"tex-span\"><i>x<\/i><\/span> <span class=\"tex-span\"><i>y<\/i><\/span> <span class=\"tex-span\"><i>c<\/i><\/span>\" means that the type of the conveyor belt at <span class=\"tex-span\">(<i>x<\/i>,\u2009<i>y<\/i>)<\/span> is changed to <span class=\"tex-span\"><i>c<\/i><\/span>. <\/li><\/ul><p>Queries are performed separately meaning that even if the bread got stuck in an infinite loop, it won't affect further queries.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains three integers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>m<\/i><\/span> and <span class=\"tex-span\"><i>q<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>,\u20091\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u200910,\u20091\u2009\u2264\u2009<i>q<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>), separated by a space.<\/p><p>Next <span class=\"tex-span\"><i>n<\/i><\/span> lines, each line contains <span class=\"tex-span\"><i>m<\/i><\/span> characters, describing the table. The characters can only be one of \"<span class=\"tex-font-style-tt\">&lt;^&gt;<\/span>\".<\/p><p>Next <span class=\"tex-span\"><i>q<\/i><\/span> lines, each line describes an event. The format is \"<span class=\"tex-font-style-tt\">C x y c<\/span>\" or \"<span class=\"tex-font-style-tt\">A x y<\/span>\" (Consecutive elements are separated by a space). It's guaranteed that <span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i>\u2009\u2264\u2009<i>n<\/i>,\u20091\u2009\u2264\u2009<i>y<\/i>\u2009\u2264\u2009<i>m<\/i><\/span>. <span class=\"tex-span\"><i>c<\/i><\/span> is a character from the set \"<span class=\"tex-font-style-tt\">&lt;^&gt;<\/span>\".<\/p><p>There are at most <span class=\"tex-span\">10000<\/span> queries of \"C\" type.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each event of type \"A\", output two integers <span class=\"tex-span\"><i>tx<\/i><\/span>, <span class=\"tex-span\"><i>ty<\/i><\/span> in a line, separated by a space, denoting the destination of <span class=\"tex-span\">(<i>x<\/i>,\u2009<i>y<\/i>)<\/span> is <span class=\"tex-span\">(<i>tx<\/i>,\u2009<i>ty<\/i>)<\/span>.<\/p><p>If there is an infinite loop, you should output <span class=\"tex-span\"><i>tx<\/i>\u2009=\u2009<i>ty<\/i>\u2009=\u2009\u2009-\u20091<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 2 3<br/>&gt;&gt;<br/>^^<br/>A 2 1<br/>C 1 2 &lt;<br/>A 2 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1 3<br/>-1 -1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 5 7<br/>&gt;&lt;&lt;^&lt;<br/>^&lt;^^&gt;<br/>&gt;&gt;&gt;^&gt;<br/>&gt;^&gt;&gt;^<br/>A 3 1<br/>A 2 2<br/>C 1 4 &lt;<br/>A 3 1<br/>C 1 2 ^<br/>A 3 1<br/>A 2 2<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0 4<br/>-1 -1<br/>-1 -1<br/>0 2<br/>0 2<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first sample:<\/p><p>If the bread goes from <span class=\"tex-span\">(2,\u20091)<\/span>, it will go out of the table at <span class=\"tex-span\">(1,\u20093)<\/span>.<\/p><p>After changing the conveyor belt of <span class=\"tex-span\">(1,\u20092)<\/span> to \"<span class=\"tex-font-style-tt\">&lt;<\/span>\", when the bread goes from <span class=\"tex-span\">(2,\u20091)<\/span> again, it will get stuck at \"<span class=\"tex-font-style-tt\">&gt;&lt;<\/span>\", so output is <span class=\"tex-span\">(\u2009-\u20091,\u2009\u2009-\u20091)<\/span>.<\/p><\/div><\/div>"}, {"contestId": 839, "index": "E", "name": "Mother of Dragons", "rating": 2700, "solvedCount": 1068, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Mother of Dragons<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are <span class=\"tex-span\"><i>n<\/i><\/span> castles in the Lannister's Kingdom and some walls connect two castles, no two castles are connected by more than one wall, no wall connects a castle to itself. <\/p><p>Sir Jaime Lannister has discovered that Daenerys Targaryen is going to attack his kingdom soon. Therefore he wants to defend his kingdom. He has <span class=\"tex-span\"><i>k<\/i><\/span> liters of a strange liquid. He wants to distribute that liquid among the castles, so each castle may contain some liquid (possibly zero or non-integer number of liters). After that the stability of a wall is defined as follows: if the wall connects two castles <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span>, and they contain <span class=\"tex-span\"><i>x<\/i><\/span> and <span class=\"tex-span\"><i>y<\/i><\/span> liters of that liquid, respectively, then the strength of that wall is <span class=\"tex-span\"><i>x<\/i>\u00b7<i>y<\/i><\/span>.<\/p><p>Your task is to print the maximum possible sum of stabilities of the walls that Sir Jaime Lannister can achieve.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200940<\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u20091000<\/span>).<\/p><p>Then <span class=\"tex-span\"><i>n<\/i><\/span> lines follows. The <span class=\"tex-span\"><i>i<\/i><\/span>-th of these lines contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i>,\u20091<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i>,\u20092<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i>,\u2009<i>n<\/i><\/sub><\/span> (<img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/ec278d042b998ad173414d9a64a4289322f5b6d0.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>). If castles <span class=\"tex-span\"><i>i<\/i><\/span> and <span class=\"tex-span\"><i>j<\/i><\/span> are connected by a wall, then <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i>,\u2009<i>j<\/i><\/sub>\u2009=\u20091<\/span>. Otherwise it is equal to <span class=\"tex-span\">0<\/span>.<\/p><p>It is guaranteed that <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i>,\u2009<i>j<\/i><\/sub>\u2009=\u2009<i>a<\/i><sub class=\"lower-index\"><i>j<\/i>,\u2009<i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i>,\u2009<i>i<\/i><\/sub>\u2009=\u20090<\/span> for all <span class=\"tex-span\">1\u2009\u2264\u2009<i>i<\/i>,\u2009<i>j<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the maximum possible sum of stabilities of the walls that Sir Jaime Lannister can achieve.<\/p><p>Your answer will be considered correct if its absolute or relative error does not exceed <span class=\"tex-span\">10<sup class=\"upper-index\">\u2009-\u20096<\/sup><\/span>.<\/p><p>Namely: let's assume that your answer is <span class=\"tex-span\"><i>a<\/i><\/span>, and the answer of the jury is <span class=\"tex-span\"><i>b<\/i><\/span>. The checker program will consider your answer correct, if <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/cf9a7a80dafa0f6b2f4d2f115f2c4acade6b8b94.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 1<br/>0 1 0<br/>1 0 0<br/>0 0 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0.250000000000<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 4<br/>0 1 0 1<br/>1 0 1 0<br/>0 1 0 1<br/>1 0 1 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4.000000000000<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample, we can assign <span class=\"tex-span\">0.5,\u20090.5,\u20090<\/span> liters of liquid to castles <span class=\"tex-span\">1,\u20092,\u20093<\/span>, respectively, to get the maximum sum (<span class=\"tex-span\">0.25<\/span>).<\/p><p>In the second sample, we can assign <span class=\"tex-span\">1.0,\u20091.0,\u20091.0,\u20091.0<\/span> liters of liquid to castles <span class=\"tex-span\">1,\u20092,\u20093,\u20094<\/span>, respectively, to get the maximum sum (<span class=\"tex-span\">4.0<\/span>)<\/p><\/div><\/div>"}, {"contestId": 1817, "index": "D", "name": "Toy Machine", "rating": 2700, "solvedCount": 1059, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Toy Machine<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There is a toy machine with toys arranged in two rows of $$$n$$$ cells each ($$$n$$$ is odd).<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/c1143eba8847e35207c4d3bb74d66b736b0464a1.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"567px\"/> <span class=\"tex-font-style-it\">Initial state for $$$n=9$$$.<\/span> <\/center><p>Initially, $$$n-2$$$ toys are placed in the non-corner cells of the top row. The bottom row is initially empty, and its leftmost, rightmost, and central cells are blocked. There are $$$4$$$ buttons to control the toy machine: left, right, up, and down marked by the letters <span class=\"tex-font-style-tt\">L<\/span>, <span class=\"tex-font-style-tt\">R<\/span>, <span class=\"tex-font-style-tt\">U<\/span>, and <span class=\"tex-font-style-tt\">D<\/span> correspondingly.<\/p><p>When pressing <span class=\"tex-font-style-tt\">L<\/span>, <span class=\"tex-font-style-tt\">R<\/span>, <span class=\"tex-font-style-tt\">U<\/span>, or <span class=\"tex-font-style-tt\">D<\/span>, all the toys will be moved simultaneously in the corresponding direction and will only stop if they push into another toy, the wall or a blocked cell. Your goal is to move the $$$k$$$-th toy into the leftmost cell of the top row. The toys are numbered from $$$1$$$ to $$$n-2$$$ from left to right. Given $$$n$$$ and $$$k$$$, find a solution that uses at most $$$1\\,000\\,000$$$ button presses.<\/p><p>To test out the toy machine, a <a href=\"https://assets.codeforces.com/files/56ff21637146a30d/game.html\"><span class=\"tex-font-style-bf\">web page<\/span><\/a> is available that lets you play the game in real time. <\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first and only line contains two integers, $$$n$$$ and $$$k$$$ ($$$5 \\le n \\le 100\\,000$$$, $$$n$$$ is odd, $$$1 \\le k \\le n-2$$$)\u00a0\u2014 the number of cells in a row, and the index of the toy that has to be moved to the leftmost cell of the top row.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>On a single line, output a description of the button presses as a string of at most $$$1\\,000\\,000$$$ characters. The string should only contain the characters <span class=\"tex-font-style-tt\">L<\/span>, <span class=\"tex-font-style-tt\">R<\/span>, <span class=\"tex-font-style-tt\">U<\/span>, and <span class=\"tex-font-style-tt\">D<\/span>. The $$$i$$$-th character in the string is the $$$i$$$-th button that is pressed. After all the button presses are performed, the $$$k$$$-th toy should be in the leftmost cell of the top row.<\/p><p>If there are multiple solutions, print any. The number of button presses does not have to be minimized.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nRDL\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nRDL\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, there will be $$$5-2 = 3$$$ toys. The first toy needs to end up in the leftmost cell of the top row. The moves <span class=\"tex-font-style-tt\">RDL<\/span> will achieve this, see the picture for a better understanding. Another possible solution would be to do one button press <span class=\"tex-font-style-tt\">L<\/span>.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/6ab1d996d2eb9c9791fdd72c300dc8bf53d7b83b.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"567px\"/> <span class=\"tex-font-style-it\">Visualization of the moves for the first example.<\/span> <\/center><\/div><\/div>"}, {"contestId": 1792, "index": "F1", "name": "Graph Coloring (easy version)", "rating": 2700, "solvedCount": 1056, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F1. Graph Coloring (easy version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>5.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">The only difference between the easy and the hard version is the constraint on $$$n$$$.<\/span><\/p><p>You are given an undirected complete graph on $$$n$$$ vertices. A complete graph is a graph where each pair of vertices is connected by an edge. You have to paint the edges of the graph into two colors, red and blue (each edge will have one color).<\/p><p>A set of vertices $$$S$$$ is <span class=\"tex-font-style-bf\">red-connected<\/span> if, for every pair of vertices $$$(v_1, v_2)$$$ such that $$$v_1 \\in S$$$ and $$$v_2 \\in S$$$, there exists a path from $$$v_1$$$ to $$$v_2$$$ that goes only through red edges and vertices from $$$S$$$. Similarly, a set of vertices $$$S$$$ is <span class=\"tex-font-style-bf\">blue-connected<\/span> if, for every pair of vertices $$$(v_1, v_2)$$$ such that $$$v_1 \\in S$$$ and $$$v_2 \\in S$$$, there exists a path from $$$v_1$$$ to $$$v_2$$$ that goes only through blue edges and vertices from $$$S$$$.<\/p><p>You have to paint the graph in such a way that:<\/p><ul> <li> there is at least one red edge; <\/li><li> there is at least one blue edge; <\/li><li> for each set of vertices $$$S$$$ such that $$$|S| \\ge 2$$$, $$$S$$$ is either red-connected or blue-connected, but <span class=\"tex-font-style-bf\">not both<\/span>. <\/li><\/ul><p>Calculate the number of ways to paint the graph, and print it modulo $$$998244353$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first (and only) line contains one integer $$$n$$$ ($$$3 \\le n \\le 5 \\cdot 10^3$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the number of ways to paint the graph, taken modulo $$$998244353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n50\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n100\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n878752271\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1337\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n520628749\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 241, "index": "B", "name": "Friends", "rating": 2700, "solvedCount": 1056, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Friends<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>6 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>You have <span class=\"tex-span\"><i>n<\/i><\/span> friends and you want to take <span class=\"tex-span\"><i>m<\/i><\/span> pictures of them. Exactly two of your friends should appear in each picture and no two pictures should contain the same pair of your friends. So if you have <span class=\"tex-span\"><i>n<\/i>\u2009=\u20093<\/span> friends you can take <span class=\"tex-span\">3<\/span> different pictures, each containing a pair of your friends.<\/p><p>Each of your friends has an attractiveness level which is specified by the integer number <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> for the <span class=\"tex-span\"><i>i<\/i><\/span>-th friend. You know that the attractiveness of a picture containing the <span class=\"tex-span\"><i>i<\/i><\/span>-th and the <span class=\"tex-span\"><i>j<\/i><\/span>-th friends is equal to the exclusive-or (<span class=\"tex-span\"><i>xor<\/i><\/span> operation) of integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>j<\/i><\/sub><\/span>.<\/p><p>You want to take pictures in a way that the total sum of attractiveness of your pictures is maximized. You have to calculate this value. Since the result may not fit in a 32-bit integer number, print it modulo <span class=\"tex-span\">1000000007<\/span> <span class=\"tex-span\">(10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097)<\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/5ed658819150aa010aa64e83d8b715a8fd224263.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> \u2014 the number of friends and the number of pictures that you want to take. <\/p><p>Next line contains <span class=\"tex-span\"><i>n<\/i><\/span> space-separated integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> (<span class=\"tex-span\">0\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) \u2014 the values of attractiveness of the friends.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>The only line of output should contain an integer \u2014 the optimal total sum of attractiveness of your pictures.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 1<br/>1 2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 2<br/>1 2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>5<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 3<br/>1 2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1814, "index": "F", "name": "Communication Towers", "rating": 2700, "solvedCount": 1047, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Communication Towers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are $$$n$$$ communication towers, numbered from $$$1$$$ to $$$n$$$, and $$$m$$$ bidirectional wires between them. Each tower has a certain set of frequencies that it accepts, the $$$i$$$-th of them accepts frequencies from $$$l_i$$$ to $$$r_i$$$.<\/p><p>Let's say that a tower $$$b$$$ is accessible from a tower $$$a$$$, if there exists a frequency $$$x$$$ and a sequence of towers $$$a=v_1, v_2, \\dots, v_k=b$$$, where consecutive towers in the sequence are directly connected by a wire, and each of them accepts frequency $$$x$$$. Note that accessibility is not transitive, i.\u2009e if $$$b$$$ is accessible from $$$a$$$ and $$$c$$$ is accessible from $$$b$$$, then $$$c$$$ may not be accessible from $$$a$$$.<\/p><p>Your task is to determine the towers that are accessible from the $$$1$$$-st tower.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$; $$$0 \\le m \\le 4 \\cdot 10^5$$$)\u00a0\u2014 the number of communication towers and the number of wires, respectively.<\/p><p>Then $$$n$$$ lines follows, the $$$i$$$-th of them contains two integers $$$l_i$$$ and $$$r_i$$$ ($$$1 \\le l_i \\le r_i \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the boundaries of the acceptable frequencies for the $$$i$$$-th tower.<\/p><p>Then $$$m$$$ lines follows, the $$$i$$$-th of them contains two integers $$$v_i$$$ and $$$u_i$$$ ($$$1 \\le v_i, u_i \\le n$$$; $$$v_i \\ne u_i$$$)\u00a0\u2014 the $$$i$$$-th wire that connects towers $$$v_i$$$ and $$$u_i$$$. There are no two wires connecting the same pair of towers.<\/p><p> <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In a single line, print distinct integers from $$$1$$$ to $$$n$$$ in ascending order\u00a0\u2014 the indices of the communication towers that are accessible from the $$$1$$$-st tower.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 5\n3 5\n1 2\n2 4\n2 3\n3 3\n4 6\n1 3\n6 1\n3 5\n3 6\n2 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 3 5 6 <\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 1\n2 3\n1 4\n1 1\n1 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 <\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 5\n1 3\n2 3\n2 2\n3 5\n2 4\n1 2\n2 3\n3 4\n4 1\n4 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 2 3 4 5 <\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 213, "index": "E", "name": "Two Permutations", "rating": 2700, "solvedCount": 1040, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Two Permutations<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Rubik is very keen on number permutations. <\/p><p>A <span class=\"tex-font-style-it\">permutation<\/span> <span class=\"tex-span\"><i>a<\/i><\/span> with length <span class=\"tex-span\"><i>n<\/i><\/span> is a sequence, consisting of <span class=\"tex-span\"><i>n<\/i><\/span> different numbers from 1 to <span class=\"tex-span\"><i>n<\/i><\/span>. Element number <span class=\"tex-span\"><i>i<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>i<\/i>\u2009\u2264\u2009<i>n<\/i>)<\/span> of this permutation will be denoted as <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>.<\/p><p>Furik decided to make a present to Rubik and came up with a new problem on permutations. Furik tells Rubik two number permutations: permutation <span class=\"tex-span\"><i>a<\/i><\/span> with length <span class=\"tex-span\"><i>n<\/i><\/span> and permutation <span class=\"tex-span\"><i>b<\/i><\/span> with length <span class=\"tex-span\"><i>m<\/i><\/span>. Rubik must give an answer to the problem: how many distinct integers <span class=\"tex-span\"><i>d<\/i><\/span> exist, such that sequence <span class=\"tex-span\"><i>c<\/i><\/span> <span class=\"tex-span\">(<i>c<\/i><sub class=\"lower-index\">1<\/sub>\u2009=\u2009<i>a<\/i><sub class=\"lower-index\">1<\/sub>\u2009+\u2009<i>d<\/i>,\u2009<i>c<\/i><sub class=\"lower-index\">2<\/sub>\u2009=\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>\u2009+\u2009<i>d<\/i>,\u2009...,\u2009<i>c<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub>\u2009=\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub>\u2009+\u2009<i>d<\/i>)<\/span> of length <span class=\"tex-span\"><i>n<\/i><\/span> is a subsequence of <span class=\"tex-span\"><i>b<\/i><\/span>.<\/p><p>Sequence <span class=\"tex-span\"><i>a<\/i><\/span> is a <span class=\"tex-font-style-it\">subsequence<\/span> of sequence <span class=\"tex-span\"><i>b<\/i><\/span>, if there are such indices <span class=\"tex-span\"><i>i<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>i<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>i<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>i<\/i><sub class=\"lower-index\">1<\/sub>\u2009&lt;\u2009<i>i<\/i><sub class=\"lower-index\">2<\/sub>\u2009&lt;\u2009...\u2009&lt;\u2009<i>i<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub>\u2009\u2264\u2009<i>m<\/i>)<\/span>, that <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>\u2009=\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><sub class=\"lower-index\">1<\/sub><\/sub><\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">2<\/sub>\u2009=\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><sub class=\"lower-index\">2<\/sub><\/sub><\/span>, <span class=\"tex-span\">...<\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub>\u2009=\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/sub><\/span>, where <span class=\"tex-span\"><i>n<\/i><\/span> is the length of sequence <span class=\"tex-span\"><i>a<\/i><\/span>, and <span class=\"tex-span\"><i>m<\/i><\/span> is the length of sequence <span class=\"tex-span\"><i>b<\/i><\/span>. <\/p><p>You are given permutations <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span>, help Rubik solve the given problem.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u2009200000)<\/span> \u2014 the sizes of the given permutations. The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> distinct integers \u2014 permutation <span class=\"tex-span\"><i>a<\/i><\/span>, the third line contains <span class=\"tex-span\"><i>m<\/i><\/span> distinct integers \u2014 permutation <span class=\"tex-span\"><i>b<\/i><\/span>. Numbers on the lines are separated by spaces.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>On a single line print the answer to the problem. <\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>1 1<br/>1<br/>1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>1 2<br/>1<br/>2 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 3<br/>2 3 1<br/>1 2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1421, "index": "E", "name": "Swedish Heroes", "rating": 2700, "solvedCount": 1039, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Swedish Heroes<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>While playing yet another strategy game, Mans has recruited $$$n$$$ <a href=\"https://www.youtube.com/watch?v=5sGOwFVUU0I\">Swedish heroes<\/a>, whose powers which can be represented as an array $$$a$$$.<\/p><p>Unfortunately, not all of those mighty heroes were created as capable as he wanted, so that he decided to do something about it. In order to accomplish his goal, he can pick two consecutive heroes, with powers $$$a_i$$$ and $$$a_{i+1}$$$, remove them and insert a hero with power $$$-(a_i+a_{i+1})$$$ back in the same position. <\/p><p>For example if the array contains the elements $$$[5, 6, 7, 8]$$$, he can pick $$$6$$$ and $$$7$$$ and get $$$[5, -(6+7), 8] = [5, -13, 8]$$$.<\/p><p>After he will perform this operation $$$n-1$$$ times, Mans will end up having only one hero. He wants his power to be as big as possible. What's the largest possible power he can achieve?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$1 \\le n \\le 200000$$$).<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$-10^9 \\le a_i \\le 10^9$$$)\u00a0\u2014 powers of the heroes.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the largest possible power he can achieve after $$$n-1$$$ operations.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n5 6 7 8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n26\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n4 -5 9 -2 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n15\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Suitable list of operations for the first sample:<\/p><p>$$$[5, 6, 7, 8] \\rightarrow [-11, 7, 8] \\rightarrow [-11, -15] \\rightarrow [26]$$$<\/p><\/div><\/div>"}, {"contestId": 1789, "index": "F", "name": "Serval and Brain Power", "rating": 2700, "solvedCount": 1037, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Serval and Brain Power<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Serval loves Brain Power and his brain power problem.<\/p><p>Serval defines that a string $$$T$$$ is <span class=\"tex-font-style-it\">powerful<\/span> iff $$$T$$$ can be obtained by concatenating some string $$$T'$$$ multiple times. Formally speaking, $$$T$$$ is powerful iff there exist a string $$$T'$$$ and an integer $$$k\\geq 2$$$ such that $$$$$$T=\\underbrace{T'+T'+\\dots+T'}_{k\\text{ times}}$$$$$$<\/p><p>For example, <span class=\"tex-font-style-tt\">gogogo<\/span> is powerful because it can be obtained by concatenating <span class=\"tex-font-style-tt\">go<\/span> three times, but <span class=\"tex-font-style-tt\">power<\/span> is not powerful.<\/p><p>Serval has a string $$$S$$$ consists of lowercase English letters. He is curious about the longest powerful subsequence of $$$S$$$, and he only needs you to find out the length of it. If all the non-empty subsequences of $$$S$$$ is not powerful, the answer is considered to be $$$0$$$.<\/p><p>A string $$$a$$$ is a subsequence of a string $$$b$$$ if $$$a$$$ can be obtained from $$$b$$$ by the deletion of several (possibly, zero or all) characters.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single string $$$S$$$ ($$$|S|\\leq 80$$$) consisting of lowercase English letters.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u2014 the length of the longest powerful subsequence of $$$S$$$. If all the non-empty subsequences of $$$S$$$ is not powerful, print $$$0$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\nbuaa\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\ncodeforcesround\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\noooooooooooaaaaeaaiaujooooooooooooo\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n24\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\nzero\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first sample, all of the non-empty subsequences of <span class=\"tex-font-style-tt\">buaa<\/span> are listed below:<\/p><ul> <li> <span class=\"tex-font-style-tt\">b<\/span> <\/li><li> <span class=\"tex-font-style-tt\">u<\/span> <\/li><li> <span class=\"tex-font-style-tt\">a<\/span> (occurred twice, <span class=\"tex-font-style-tt\">bu<span class=\"tex-font-style-underline\">a<\/span>a<\/span> and <span class=\"tex-font-style-tt\">bua<span class=\"tex-font-style-underline\">a<\/span><\/span>) <\/li><li> <span class=\"tex-font-style-tt\">bu<\/span> <\/li><li> <span class=\"tex-font-style-tt\">ba<\/span> (occurred twice, <span class=\"tex-font-style-tt\"><span class=\"tex-font-style-underline\">b<\/span>u<span class=\"tex-font-style-underline\">a<\/span>a<\/span> and <span class=\"tex-font-style-tt\"><span class=\"tex-font-style-underline\">b<\/span>ua<span class=\"tex-font-style-underline\">a<\/span><\/span>) <\/li><li> <span class=\"tex-font-style-tt\">ua<\/span> (occurred twice, <span class=\"tex-font-style-tt\">b<span class=\"tex-font-style-underline\">ua<\/span>a<\/span> and <span class=\"tex-font-style-tt\">b<span class=\"tex-font-style-underline\">u<\/span>a<span class=\"tex-font-style-underline\">a<\/span><\/span>) <\/li><li> <span class=\"tex-font-style-tt\">aa<\/span> <\/li><li> <span class=\"tex-font-style-tt\">bua<\/span> (occurred twice, <span class=\"tex-font-style-tt\"><span class=\"tex-font-style-underline\">bua<\/span>a<\/span> and <span class=\"tex-font-style-tt\"><span class=\"tex-font-style-underline\">bu<\/span>a<span class=\"tex-font-style-underline\">a<\/span><\/span> ) <\/li><li> <span class=\"tex-font-style-tt\">baa<\/span> <\/li><li> <span class=\"tex-font-style-tt\">uaa<\/span> <\/li><li> <span class=\"tex-font-style-tt\">buaa<\/span> <\/li><\/ul><p>Since $$$\\texttt{aa} = \\texttt{a} + \\texttt{a}$$$, <span class=\"tex-font-style-tt\">aa<\/span> is a powerful subsequence. It can be shown that <span class=\"tex-font-style-tt\">aa<\/span> is the only powerful subsequence among them. So the answer is $$$2$$$.<\/p><p>For the second sample, the longest powerful subsequence is <span class=\"tex-font-style-tt\">codcod<\/span> from <span class=\"tex-font-style-tt\"><span class=\"tex-font-style-underline\">cod<\/span>efor<span class=\"tex-font-style-underline\">c<\/span>esr<span class=\"tex-font-style-underline\">o<\/span>un<span class=\"tex-font-style-underline\">d<\/span><\/span>. So the answer is $$$6$$$.<\/p><\/div><\/div>"}, {"contestId": 1103, "index": "C", "name": "Johnny Solving", "rating": 2700, "solvedCount": 1018, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Johnny Solving<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Today is tuesday, that means there is a dispute in JOHNNY SOLVING team again: they try to understand who is Johnny and who is Solving. That's why guys asked Umnik to help them. Umnik gave guys a connected graph with $$$n$$$ vertices without loops and multiedges, such that a degree of any vertex is at least $$$3$$$, and also he gave a number $$$1 \\leq k \\leq n$$$. Because Johnny is not too smart, he promised to find a simple path with length at least $$$\\frac{n}{k}$$$ in the graph. In reply, Solving promised to find $$$k$$$ simple by vertices cycles with representatives, such that: <\/p><ul> <li> Length of each cycle is at least $$$3$$$. <\/li><li> Length of each cycle is not divisible by $$$3$$$. <\/li><li> In each cycle must be a representative - vertex, which belongs only to this cycle among all <span class=\"tex-font-style-bf\">printed<\/span> cycles. <\/li><\/ul><p>You need to help guys resolve the dispute, for that you need to find a solution for Johnny: a simple path with length at least $$$\\frac{n}{k}$$$ ($$$n$$$ is not necessarily divided by $$$k$$$), or solution for Solving: $$$k$$$ cycles that satisfy all the conditions above. If there is no any solution - print $$$-1$$$. <\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains three integers $$$n$$$, $$$m$$$ and $$$k$$$ ($$$1 \\leq k \\leq n \\leq 2.5 \\cdot 10^5, 1 \\leq m \\leq 5 \\cdot 10^5$$$)<\/p><p>Next $$$m$$$ lines describe edges of the graph in format $$$v$$$, $$$u$$$ ($$$1 \\leq v, u \\leq n$$$). It's guaranteed that $$$v \\neq u$$$ and all $$$m$$$ pairs are distinct.<\/p><p>It's guaranteed that a degree of each vertex is at least $$$3$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print PATH in the first line, if you solve problem for Johnny. In the second line print the number of vertices in the path $$$c$$$ ($$$c \\geq \\frac{n}{k}$$$). And in the third line print vertices describing the path in route order.<\/p><p>Print CYCLES in the first line, if you solve problem for Solving. In the following lines describe <span class=\"tex-font-style-bf\">exactly<\/span> $$$k$$$ cycles in the following format: in the first line print the size of the cycle $$$c$$$ ($$$c \\geq 3$$$). In the second line print the cycle in route order. Also, the first vertex in the cycle must be a <span class=\"tex-font-style-bf\">representative<\/span>.<\/p><p>Print $$$-1$$$ if there is no any solution. The total amount of printed numbers in the output must be at most $$$10^6$$$. It's guaranteed, that if exists any solution then there is a correct output satisfies this restriction.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 6 2\n1 2\n1 3\n1 4\n2 3\n2 4\n3 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nPATH\n4\n1 2 3 4 <\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n10 18 2\n1 2\n1 3\n1 4\n1 5\n1 6\n1 7\n1 8\n1 9\n1 10\n2 3\n3 4\n2 4\n5 6\n6 7\n5 7\n8 9\n9 10\n8 10\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nCYCLES\n4\n4 1 2 3 \n4\n7 1 5 6 \n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1658, "index": "F", "name": "Juju and Binary String", "rating": 2700, "solvedCount": 1014, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Juju and Binary String<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>The <span class=\"tex-font-style-it\">cuteness<\/span> of a binary string is the number of $$$\\texttt{1}$$$s divided by the length of the string. For example, the <span class=\"tex-font-style-it\">cuteness<\/span> of $$$\\texttt{01101}$$$ is $$$\\frac{3}{5}$$$.<\/p><p>Juju has a binary string $$$s$$$ of length $$$n$$$. She wants to choose some non-intersecting subsegments of $$$s$$$ such that their concatenation has length $$$m$$$ and it has the same <span class=\"tex-font-style-it\">cuteness<\/span> as the string $$$s$$$. <\/p><p>More specifically, she wants to find two arrays $$$l$$$ and $$$r$$$ of equal length $$$k$$$ such that $$$1 \\leq l_1 \\leq r_1  \\lt  l_2 \\leq r_2  \\lt  \\ldots  \\lt  l_k \\leq r_k \\leq n$$$, and also:<\/p><ul> <li> $$$\\sum\\limits_{i=1}^k (r_i - l_i + 1) = m$$$; <\/li><li> The <span class=\"tex-font-style-it\">cuteness<\/span> of $$$s[l_1,r_1]+s[l_2,r_2]+\\ldots+s[l_k,r_k]$$$ is equal to the <span class=\"tex-font-style-it\">cuteness<\/span> of $$$s$$$, where $$$s[x, y]$$$ denotes the subsegment $$$s_x s_{x+1} \\ldots s_y$$$, and $$$+$$$ denotes string concatenation. <\/li><\/ul><p>Juju does not like splitting the string into many parts, so she also wants to <span class=\"tex-font-style-bf\">minimize<\/span> the value of $$$k$$$. Find the minimum value of $$$k$$$ such that there exist $$$l$$$ and $$$r$$$ that satisfy the constraints above or determine that it is impossible to find such $$$l$$$ and $$$r$$$ for any $$$k$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 10^4$$$) \u2014 the number of test cases.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\leq m \\leq n \\leq 2 \\cdot 10^5$$$).<\/p><p>The second line of each test case contains a binary string $$$s$$$ of length $$$n$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, if there is no valid pair of $$$l$$$ and $$$r$$$, print $$$-1$$$. <\/p><p>Otherwise, print $$$k + 1$$$ lines.<\/p><p>In the first line, print a number $$$k$$$ ($$$1 \\leq k \\leq m$$$) \u2014 the minimum number of subsegments required.<\/p><p>Then print $$$k$$$ lines, the $$$i$$$-th should contain $$$l_i$$$ and $$$r_i$$$ ($$$1 \\leq l_i \\leq r_i \\leq n$$$) \u2014 the range of the $$$i$$$-th subsegment. Note that you should output the subsegments such that the inequality $$$l_1 \\leq r_1  \\lt  l_2 \\leq r_2  \\lt  \\ldots  \\lt  l_k \\leq r_k$$$ is true.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">4 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">0011<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">8 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">11000011<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0101<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">5 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">11111<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n2 3\n2\n2 3\n5 8\n-1\n1\n1 5\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, the <span class=\"tex-font-style-it\">cuteness<\/span> of $$$\\texttt{0011}$$$ is the same as the <span class=\"tex-font-style-it\">cuteness<\/span> of $$$\\texttt{01}$$$.<\/p><p>In the second example, the <span class=\"tex-font-style-it\">cuteness<\/span> of $$$\\texttt{11000011}$$$ is $$$\\frac{1}{2}$$$ and there is no subsegment of size $$$6$$$ with the same cuteness. So we must use $$$2$$$ disjoint subsegments $$$\\texttt{10}$$$ and $$$\\texttt{0011}$$$.<\/p><p>In the third example, there are $$$8$$$ ways to split the string such that $$$\\sum\\limits_{i=1}^k (r_i - l_i + 1) = 3$$$ but none of them has the same <span class=\"tex-font-style-it\">cuteness<\/span> as $$$\\texttt{0101}$$$.<\/p><p>In the last example, we don't have to split the string.<\/p><\/div><\/div>"}, {"contestId": 1942, "index": "F", "name": "Farmer John's Favorite Function", "rating": 2700, "solvedCount": 1013, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Farmer John's Favorite Function<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><div class=\"epigraph\"><div class=\"epigraph-text\"><span class=\"tex-font-style-it\"><a href=\"https://soundcloud.com/user-838515264/camellia-parts-ooparts\">\u03a9\u03a9PARTS - Camellia<\/a><\/span><\/div><div class=\"epigraph-source\">\u2800<\/div><\/div><p>Farmer John has an array $$$a$$$ of length $$$n$$$. He also has a function $$$f$$$ with the following recurrence: <\/p><ul> <li> $$$f(1) = \\sqrt{a_1}$$$; <\/li><li> For all $$$i  \\gt  1$$$, $$$f(i) = \\sqrt{f(i-1)+a_i}$$$. <\/li><\/ul><p>Note that $$$f(i)$$$ is not necessarily an integer.<\/p><p>He plans to do $$$q$$$ updates to the array. Each update, he gives you two integers $$$k$$$ and $$$x$$$ and he wants you to set $$$a_k = x$$$. After each update, he wants to know $$$\\lfloor f(n) \\rfloor$$$, where $$$\\lfloor t \\rfloor$$$ denotes the value of $$$t$$$ rounded down to the nearest integer.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains $$$n$$$ and $$$q$$$ ($$$1 \\leq n, q \\leq 2 \\cdot 10^5$$$), the length of $$$a$$$ and the number of updates he will perform.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$0 \\leq a_i \\leq 10^{18}$$$).<\/p><p>The next $$$q$$$ lines each contain two integers $$$k$$$ and $$$x$$$ ($$$1 \\leq k \\leq n$$$, $$$0 \\leq x \\leq 10^{18}$$$), the index of the update and the element he will replace $$$a_k$$$ with.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each update, output an integer, $$$\\lfloor f(n) \\rfloor$$$, on a new line.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">0 14 0 7 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">1 4<\/div><div class=\"test- v><pre>\n370643829\n370643830\n370643829\n1000000000\n1000000000\n1000000000\n1000000000\n1000000000\n1000000000\n1000000000\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the array after the first update is $$$[4, 14, 0, 7, 6]$$$. The values of $$$f$$$ are:<\/p><ul> <li> $$$f(1)=2$$$; <\/li><li> $$$f(2)=4$$$; <\/li><li> $$$f(3)=2$$$; <\/li><li> $$$f(4)=3$$$; <\/li><li> $$$f(5)=3$$$. <\/li><\/ul><p>Since $$$\\lfloor f(5) \\rfloor = 3$$$, we output $$$3$$$.<\/p><p>The array after the second update is $$$[3, 14, 0, 7, 6]$$$. The values of $$$f$$$, rounded to $$$6$$$ decimal places, are:<\/p><ul> <li> $$$f(1)\\approx 1.732051$$$; <\/li><li> $$$f(2)\\approx 3.966365$$$; <\/li><li> $$$f(3)\\approx 1.991573$$$; <\/li><li> $$$f(4)\\approx 2.998595$$$; <\/li><li> $$$f(5)\\approx 2.999766$$$. <\/li><\/ul><p>Since $$$\\lfloor f(5) \\rfloor = 2$$$, we output $$$2$$$.<\/p><\/div><\/div>"}, {"contestId": 578, "index": "D", "name": "LCS Again", "rating": 2700, "solvedCount": 1013, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. LCS Again<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a string <span class=\"tex-span\"><i>S<\/i><\/span> of length <span class=\"tex-span\"><i>n<\/i><\/span> with each character being one of the first <span class=\"tex-span\"><i>m<\/i><\/span> lowercase English letters. <\/p><p>Calculate how many different strings <span class=\"tex-span\"><i>T<\/i><\/span> of length <span class=\"tex-span\"><i>n<\/i><\/span> composed from the first <span class=\"tex-span\"><i>m<\/i><\/span> lowercase English letters exist such that the length of LCS (longest common subsequence) between <span class=\"tex-span\"><i>S<\/i><\/span> and <span class=\"tex-span\"><i>T<\/i><\/span> is <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span>.<\/p><p>Recall that LCS of two strings <span class=\"tex-span\"><i>S<\/i><\/span> and <span class=\"tex-span\"><i>T<\/i><\/span> is the longest string <span class=\"tex-span\"><i>C<\/i><\/span> such that <span class=\"tex-span\"><i>C<\/i><\/span> both in <span class=\"tex-span\"><i>S<\/i><\/span> and <span class=\"tex-span\"><i>T<\/i><\/span> as a subsequence.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two numbers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> denoting the length of string <span class=\"tex-span\"><i>S<\/i><\/span> and number of first English lowercase characters forming the character set for strings (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009100\u2009000<\/span>, <span class=\"tex-span\">2\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u200926<\/span>).<\/p><p>The second line contains string <span class=\"tex-span\"><i>S<\/i><\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the only line containing the answer.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 3<br/>aaa<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 3<br/>aab<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>11<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>1 2<br/>a<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>10 9<br/>abacadefgh<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>789<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first sample, the <span class=\"tex-span\">6<\/span> possible strings <span class=\"tex-span\"><i>T<\/i><\/span> are: <span class=\"tex-font-style-tt\">aab<\/span>, <span class=\"tex-font-style-tt\">aac<\/span>, <span class=\"tex-font-style-tt\">aba<\/span>, <span class=\"tex-font-style-tt\">aca<\/span>, <span class=\"tex-font-style-tt\">baa<\/span>, <span class=\"tex-font-style-tt\">caa<\/span>. <\/p><p>For the second sample, the <span class=\"tex-span\">11<\/span> possible strings <span class=\"tex-span\"><i>T<\/i><\/span> are: <span class=\"tex-font-style-tt\">aaa<\/span>, <span class=\"tex-font-style-tt\">aac<\/span>, <span class=\"tex-font-style-tt\">aba<\/span>, <span class=\"tex-font-style-tt\">abb<\/span>, <span class=\"tex-font-style-tt\">abc<\/span>, <span class=\"tex-font-style-tt\">aca<\/span>, <span class=\"tex-font-style-tt\">acb<\/span>, <span class=\"tex-font-style-tt\">baa<\/span>, <span class=\"tex-font-style-tt\">bab<\/span>, <span class=\"tex-font-style-tt\">caa<\/span>, <span class=\"tex-font-style-tt\">cab<\/span>.<\/p><p>For the third sample, the only possible string <span class=\"tex-span\"><i>T<\/i><\/span> is <span class=\"tex-font-style-tt\">b<\/span>.<\/p><\/div><\/div>"}, {"contestId": 293, "index": "B", "name": "Distinct Paths", "rating": 2700, "solvedCount": 1011, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">B. Distinct Paths<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>You have a rectangular <span class=\"tex-span\"><i>n<\/i>\u2009\u00d7\u2009<i>m<\/i><\/span>-cell board. Some cells are already painted some of <span class=\"tex-span\"><i>k<\/i><\/span> colors. You need to paint each uncolored cell one of the <span class=\"tex-span\"><i>k<\/i><\/span> colors so that any path from the upper left square to the lower right one doesn't contain any two cells of the same color. The path can go only along side-adjacent cells and can only go down or right.<\/p><p>Print the number of possible paintings modulo <span class=\"tex-span\">1000000007<\/span> <span class=\"tex-span\">(10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097)<\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains three integers <span class=\"tex-span\"><i>n<\/i>,\u2009<i>m<\/i>,\u2009<i>k<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>m<\/i>\u2009\u2264\u20091000,\u20091\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u200910)<\/span>. The next <span class=\"tex-span\"><i>n<\/i><\/span> lines contain <span class=\"tex-span\"><i>m<\/i><\/span> integers each \u2014 the board. The first of them contains <span class=\"tex-span\"><i>m<\/i><\/span> uppermost cells of the board from the left to the right and the second one contains <span class=\"tex-span\"><i>m<\/i><\/span> cells from the second uppermost row and so on. If a number in a line equals 0, then the corresponding cell isn't painted. Otherwise, this number represents the initial color of the board cell \u2014 an integer from 1 to <span class=\"tex-span\"><i>k<\/i><\/span>.<\/p><p>Consider all colors numbered from 1 to <span class=\"tex-span\"><i>k<\/i><\/span> in some manner.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the number of possible paintings modulo <span class=\"tex-span\">1000000007<\/span> <span class=\"tex-span\">(10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097)<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 2 4<br/>0 0<br/>0 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>48<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 2 4<br/>1 2<br/>2 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 6 10<br/>0 0 0 0 0 0<br/>0 0 0 0 0 0<br/>0 0 0 0 0 0<br/>0 0 0 0 0 0<br/>0 0 0 0 0 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3628800<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 6 10<br/>1 2 3 4 5 6<br/>0 0 0 0 0 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4096<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1264, "index": "E", "name": "Beautiful League", "rating": 2700, "solvedCount": 1006, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Beautiful League<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>A football league has recently begun in Beautiful land. There are $$$n$$$ teams participating in the league. Let's enumerate them with integers from $$$1$$$ to $$$n$$$.<\/p><p>There will be played exactly $$$\\frac{n(n-1)}{2}$$$ matches: each team will play against all other teams exactly once. In each match, there is always a winner and loser and there is no draw.<\/p><p>After all matches are played, the organizers will count the number of <span class=\"tex-font-style-it\">beautiful triples<\/span>. Let's call a triple of three teams $$$(A, B, C)$$$ beautiful if a team $$$A$$$ win against a team $$$B$$$, a team $$$B$$$ win against a team $$$C$$$ and a team $$$C$$$ win against a team $$$A$$$. We look only to a triples of different teams and the order of teams in the triple is important.<\/p><p>The beauty of the league is the number of beautiful triples.<\/p><p>At the moment, $$$m$$$ matches were played and their results are known.<\/p><p>What is the maximum beauty of the league that can be, after playing all remaining matches? Also find a possible results for all remaining $$$\\frac{n(n-1)}{2} - m$$$ matches, so that the league has this maximum beauty.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n, m$$$ ($$$3 \\leq n \\leq 50, 0 \\leq m \\leq \\frac{n(n-1)}{2}$$$)\u00a0\u2014 the number of teams in the football league and the number of matches that were played.<\/p><p>Each of $$$m$$$ following lines contains two integers $$$u$$$ and $$$v$$$ ($$$1 \\leq u, v \\leq n$$$, $$$u \\neq v$$$) denoting that the $$$u$$$-th team won against the $$$v$$$-th team. It is guaranteed that each unordered pair of teams appears at most once.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$n$$$ lines, each line having a string of exactly $$$n$$$ characters. Each character must be either $$$0$$$ or $$$1$$$.<\/p><p>Let $$$a_{ij}$$$ be the $$$j$$$-th number in the $$$i$$$-th line. For all $$$1 \\leq i \\leq n$$$ it should be true, that $$$a_{ii} = 0$$$. For all pairs of teams $$$i \\neq j$$$ the number $$$a_{ij}$$$ indicates the result of the match between the $$$i$$$-th team and the $$$j$$$-th team:<\/p><ul> <li> If $$$a_{ij}$$$ is $$$1$$$, the $$$i$$$-th team wins against the $$$j$$$-th team; <\/li><li> Otherwise the $$$j$$$-th team wins against the $$$i$$$-th team; <\/li><li> Also, it should be true, that $$$a_{ij} + a_{ji} = 1$$$. <\/li><\/ul><p>Also note that the results of the $$$m$$$ matches that were already played cannot be changed in your league.<\/p><p>The beauty of the league in the output should be maximum possible. If there are multiple possible answers with maximum beauty, you can print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 1\n1 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n010\n001\n100\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 2\n1 2\n1 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0110\n0001\n0100\n1010\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The beauty of league in the first test case is equal to $$$3$$$ because there exists three beautiful triples: $$$(1, 2, 3)$$$, $$$(2, 3, 1)$$$, $$$(3, 1, 2)$$$.<\/p><p>The beauty of league in the second test is equal to $$$6$$$ because there exists six beautiful triples: $$$(1, 2, 4)$$$, $$$(2, 4, 1)$$$, $$$(4, 1, 2)$$$, $$$(2, 4, 3)$$$, $$$(4, 3, 2)$$$, $$$(3, 2, 4)$$$.<\/p><\/div><\/div>"}, {"contestId": 961, "index": "F", "name": "k-substrings", "rating": 2700, "solvedCount": 1006, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. k-substrings<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a string <span class=\"tex-span\"><i>s<\/i><\/span> consisting of <span class=\"tex-span\"><i>n<\/i><\/span> lowercase Latin letters.<\/p><p>Let's denote <span class=\"tex-span\"><i>k<\/i><\/span>-substring of <span class=\"tex-span\"><i>s<\/i><\/span> as a string <span class=\"tex-span\"><i>subs<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>\u2009=\u2009<i>s<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><i>s<\/i><sub class=\"lower-index\"><i>k<\/i>\u2009+\u20091<\/sub>..<i>s<\/i><sub class=\"lower-index\"><i>n<\/i>\u2009+\u20091\u2009-\u2009<i>k<\/i><\/sub><\/span>. Obviously, <span class=\"tex-span\"><i>subs<\/i><sub class=\"lower-index\">1<\/sub>\u2009=\u2009<i>s<\/i><\/span>, and there are exactly <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/ddb3724dfe86122a90456ba01b63e009b59027a6.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> such substrings.<\/p><p>Let's call some string <span class=\"tex-span\"><i>t<\/i><\/span> an <span class=\"tex-font-style-bf\">odd proper suprefix<\/span> of a string <span class=\"tex-span\"><i>T<\/i><\/span> iff the following conditions are met:<\/p><ul><li> <span class=\"tex-span\">|<i>T<\/i>|\u2009&gt;\u2009|<i>t<\/i>|<\/span>; <\/li><li> <span class=\"tex-span\">|<i>t<\/i>|<\/span> is an odd number; <\/li><li> <span class=\"tex-span\"><i>t<\/i><\/span> is simultaneously a prefix and a suffix of <span class=\"tex-span\"><i>T<\/i><\/span>.<\/li><\/ul><p>For evey <span class=\"tex-span\"><i>k<\/i><\/span>-substring (<img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/1f03c2de835b1dede9b9b40ac102a9527a138cde.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>) of <span class=\"tex-span\"><i>s<\/i><\/span> you have to calculate the maximum length of its odd proper suprefix.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer <span class=\"tex-span\"><i>n<\/i><\/span> <span class=\"tex-span\">(2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup>)<\/span> \u2014 the length <span class=\"tex-span\"><i>s<\/i><\/span>.<\/p><p>The second line contains the string <span class=\"tex-span\"><i>s<\/i><\/span> consisting of <span class=\"tex-span\"><i>n<\/i><\/span> lowercase Latin letters.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/ddb3724dfe86122a90456ba01b63e009b59027a6.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> integers. <span class=\"tex-span\"><i>i<\/i><\/span>-th of them should be equal to maximum length of an odd proper suprefix of <span class=\"tex-span\"><i>i<\/i><\/span>-substring of <span class=\"tex-span\"><i>s<\/i><\/span> (or <span class=\"tex-span\">\u2009-\u20091<\/span>, if there is no such string that is an odd proper suprefix of <span class=\"tex-span\"><i>i<\/i><\/span>-substring).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>15<br/>bcabcabcabcabca<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>9 7 5 3 1 -1 -1 -1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>24<br/>abaaabaaaabaaabaaaabaaab<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>15 13 11 9 7 5 3 1 1 -1 -1 1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>19<br/>cabcabbcabcabbcabca<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>5 3 1 -1 -1 1 1 -1 -1 -1<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The answer for first sample test is folowing: <\/p><ul> <li> 1-substring: <span class=\"tex-font-style-underline\">bcabca<span class=\"tex-font-style-bf\">bca<\/span><\/span><span class=\"tex-font-style-bf\">bcabca<\/span> <\/li><li> 2-substring: <span class=\"tex-font-style-underline\">cabcab<span class=\"tex-font-style-bf\">c<\/span><\/span><span class=\"tex-font-style-bf\">abcabc<\/span> <\/li><li> 3-substring: <span class=\"tex-font-style-underline\">abcab<\/span>c<span class=\"tex-font-style-bf\">abcab<\/span> <\/li><li> 4-substring: <span class=\"tex-font-style-underline\">bca<\/span>bca<span class=\"tex-font-style-bf\">bca<\/span> <\/li><li> 5-substring: <span class=\"tex-font-style-underline\">c<\/span>abcab<span class=\"tex-font-style-bf\">c<\/span> <\/li><li> 6-substring: abcab <\/li><li> 7-substring: bca <\/li><li> 8-substring: c <\/li><\/ul><\/div><\/div>"}, {"contestId": 1720, "index": "E", "name": "Misha and Paintings", "rating": 2700, "solvedCount": 1004, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Misha and Paintings<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Misha has a <span class=\"tex-font-style-bf\">square<\/span> $$$n \\times n$$$ matrix, where the number in row $$$i$$$ and column $$$j$$$ is equal to $$$a_{i, j}$$$. Misha wants to modify the matrix to contain <span class=\"tex-font-style-bf\">exactly<\/span> $$$k$$$ distinct integers. To achieve this goal, Misha can perform the following operation zero or more times:<\/p><ol> <li> choose any <span class=\"tex-font-style-bf\">square<\/span> submatrix of the matrix (you choose $$$(x_1,y_1)$$$, $$$(x_2,y_2)$$$, such that $$$x_1 \\leq x_2$$$, $$$y_

1 \\leq y_2$$$, $$$x_2 - x_1 = y_2 - y_1$$$, then submatrix is a set of cells with coordinates $$$(x, y)$$$, such that $$$x_1 \\leq x \\leq x_2$$$, $$$y_1 \\leq y \\leq y_2$$$), <\/li><li> choose an integer $$$k$$$, where $$$1 \\leq k \\leq n^2$$$, <\/li><li> replace all integers in the submatrix with $$$k$$$. <\/li><\/ol><p>Please find the minimum number of operations that Misha needs to achieve his goal.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first input line contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\leq n \\leq 500, 1 \\leq k \\leq n^2$$$) \u00a0\u2014 the size of the matrix and the desired amount of distinct elements in the matrix.<\/p><p>Then $$$n$$$ lines follows. The $$$i$$$-th of them contains $$$n$$$ integers $$$a_{i, 1}, a_{i, 2}, \\ldots, a_{i, n}$$$ ($$$1 \\leq a_{i,j} \\leq n^2$$$) \u2014 the elements of the $$$i$$$-th row of the matrix.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output one integer \u2014 the minimum number of operations required.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 4\n1 1 1\n1 1 2\n3 4 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 2\n2 1 3\n2 1 1\n3 1 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 3\n1 1 1\n1 1 2\n2 2 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 2\n1 1 1\n1 2 1\n2 2 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case the answer is $$$1$$$, because one can change the value in the bottom right corner of the matrix to $$$1$$$. The resulting matrix can be found below:<\/p><center> <table class=\"tex-tabular\"><tbody><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-top\">1<\/td><td class=\"tex-tabular-text-align-center tex-tabular-border-top\">1<\/td><td class=\"tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top\">1<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center\">1<\/td><td class=\"tex-tabular-text-align-center\">1<\/td><td class=\"tex-tabular-text-align-center tex-tabular-border-right\">2<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-bottom\">3<\/td><td class=\"tex-tabular-text-align-center tex-tabular-border-bottom\">4<\/td><td class=\"tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-bottom\">1<\/td><\/tr><\/tbody><\/table> <\/center><p>In the second test case the answer is $$$2$$$. First, one can change the entire matrix to contain only $$$1$$$s, and the change the value of any single cell to $$$2$$$. One of the possible resulting matrices is displayed below:<\/p><center> <table class=\"tex-tabular\"><tbody><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-top\">1<\/td><td class=\"tex-tabular-text-align-center tex-tabular-border-top\">1<\/td><td class=\"tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-top\">1<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center\">1<\/td><td class=\"tex-tabular-text-align-center\">1<\/td><td class=\"tex-tabular-text-align-center tex-tabular-border-right\">1<\/td><\/tr><tr><td class=\"tex-tabular-border-left tex-tabular-text-align-center tex-tabular-border-bottom\">1<\/td><td class=\"tex-tabular-text-align-center tex-tabular-border-bottom\">1<\/td><td class=\"tex-tabular-text-align-center tex-tabular-border-right tex-tabular-border-bottom\">2<\/td><\/tr><\/tbody><\/table> <\/center><\/div><\/div>"}, {"contestId": 995, "index": "E", "name": "Number Clicker", "rating": 2700, "solvedCount": 997, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Number Clicker<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Allen is playing Number Clicker on his phone.<\/p><p>He starts with an integer $$$u$$$ on the screen. Every second, he can press one of 3 buttons.<\/p><ol> <li> Turn $$$u \\to u+1 \\pmod{p}$$$. <\/li><li> Turn $$$u \\to u+p-1 \\pmod{p}$$$. <\/li><li> Turn $$$u \\to u^{p-2} \\pmod{p}$$$. <\/li><\/ol><p>Allen wants to press at most 200 buttons and end up with $$$v$$$ on the screen. Help him!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains 3 positive integers: $$$u, v, p$$$ ($$$0 \\le u, v \\le p-1$$$, $$$3 \\le p \\le 10^9 + 9$$$). $$$p$$$ is guaranteed to be prime.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>On the first line, print a single integer $$$\\ell$$$, the number of button presses. On the second line, print integers $$$c_1, \\dots, c_\\ell$$$, the button presses. For $$$1 \\le i \\le \\ell$$$, $$$1 \\le c_i \\le 3$$$.<\/p><p>We can show that the answer always exists.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>1 3 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/>1 1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 2 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/>3<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example the integer on the screen changes as $$$1 \\to 2 \\to 3$$$.<\/p><p>In the second example the integer on the screen changes as $$$3 \\to 2$$$. <\/p><\/div><\/div>"}, {"contestId": 1511, "index": "G", "name": "Chips on a Board", "rating": 2700, "solvedCount": 995, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. Chips on a Board<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Alice and Bob have a rectangular board consisting of $$$n$$$ rows and $$$m$$$ columns. <span class=\"tex-font-style-bf\">Each row contains exactly one chip.<\/span><\/p><p>Alice and Bob play the following game. They choose two integers $$$l$$$ and $$$r$$$ such that $$$1 \\le l \\le r \\le m$$$ and cut the board in such a way that only the part of it between column $$$l$$$ and column $$$r$$$ (inclusive) remains. So, all columns to the left of column $$$l$$$ and all columns to the right of column $$$r$$$ no longer belong to the board.<\/p><p>After cutting the board, they move chips on the remaining part of the board (the part from column $$$l$$$ to column $$$r$$$). They make alternating moves, and the player which cannot make a move loses the game. The first move is made by Alice, the second \u2014 by Bob, the third \u2014 by Alice, and so on. During their move, the player must choose one of the chips from the board and move it any positive number of cells to the left (so, if the chip was in column $$$i$$$, it can move to any column $$$j  \\lt  i$$$, and the chips in the leftmost column cannot be chosen).<\/p><p>Alice and Bob have $$$q$$$ pairs of numbers $$$L_i$$$ and $$$R_i$$$. For each such pair, they want to determine who will be the winner of the game if $$$l = L_i$$$ and $$$r = R_i$$$. Note that these games should be considered independently (they don't affect the state of the board for the next games), and both Alice and Bob play optimally.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\le n, m \\le 2 \\cdot 10^5$$$) \u2014 the number of rows and columns on the board, respectively.<\/p><p>The second line contains $$$n$$$ integers $$$c_1, c_2, \\dots, c_n$$$ ($$$1 \\le c_i \\le m$$$), where $$$c_i$$$ is the index of the column where the chip in the $$$i$$$-th row is located (so, the chip in the $$$i$$$-th row is in the $$$c_i$$$-th column).<\/p><p>The third line contains one integer $$$q$$$ ($$$1 \\le q \\le 2 \\cdot 10^5$$$).<\/p><p>Then $$$q$$$ lines follow, the $$$i$$$-th of them contains two integers $$$L_i$$$ and $$$R_i$$$ ($$$1 \\le L_i \\le R_i \\le m$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a string of $$$q$$$ characters. The $$$i$$$-th character should be <span class=\"tex-font-style-tt\">A<\/span> if Alice wins the game with $$$l = L_i$$$ and $$$r = R_i$$$, or <span class=\"tex-font-style-tt\">B<\/span> if Bob wins it.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n8 10\n1 3 3 7 4 2 6 9\n7\n2 3\n1 3\n1 4\n1 10\n5 10\n8 10\n9 10\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nBAAAAAB<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1930, "index": "F", "name": "Maximize the Difference", "rating": 2700, "solvedCount": 985, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Maximize the Difference<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>For an array $$$b$$$ of $$$m$$$ non-negative integers, define $$$f(b)$$$ as the <span class=\"tex-font-style-bf\">maximum<\/span> value of $$$\\max\\limits_{i = 1}^{m} (b_i | x) - \\min\\limits_{i = 1}^{m} (b_i | x)$$$ over all possible non-negative integers $$$x$$$, where $$$|$$$ is <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#OR\">bitwise OR operation<\/a>.<\/p><p>You are given integers $$$n$$$ and $$$q$$$. You start with an empty array $$$a$$$. Process the following $$$q$$$ queries:<\/p><ul> <li> $$$v$$$: append $$$v$$$ to the back of $$$a$$$ and then output $$$f(a)$$$. It is guaranteed that $$$0 \\leq v  \\lt  n$$$. <\/li><\/ul><p><span class=\"tex-font-style-bf\">The queries are given in a modified way.<\/span><\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 2 \\cdot 10^5$$$)\u00a0\u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case contains two integers $$$n$$$ and $$$q$$$ ($$$1 \\leq n \\leq 2^{22}$$$, $$$1 \\leq q \\leq 10^6$$$)\u00a0\u2014 the number of queries.<\/p><p>The second line of each test case contains $$$q$$$ space-separated integers $$$e_1,e_2,\\ldots,e_q$$$ ($$$0 \\leq e_i  \\lt  n$$$)\u00a0\u2014 the encrypted values of $$$v$$$.<\/p><p>Let $$$\\mathrm{last}_i$$$ equal the output of the $$$(i-1)$$$-th query for $$$i\\geq 2$$$ and $$$\\mathrm{last}_i=0$$$ for $$$i=1$$$. Then the value of $$$v$$$ for the $$$i$$$-th query is ($$$e_i + \\mathrm{last}_i$$$) modulo $$$n$$$. <\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2^{22}$$$ and the sum of $$$q$$$ over all test cases does not exceed $$$10^6$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print $$$q$$$ integers. The $$$i$$$-th integer is the output of the $$$i$$$-th query.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">5 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">7 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 1 5 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0 2\n0 2 3 5\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the final $$$a=[1,2]$$$. For $$$i=1$$$, the answer is always $$$0$$$, irrespective of $$$x$$$. For $$$i=2$$$, we can select $$$x=5$$$.<\/p><p>In the second test case, the final $$$a=[3,1,0,5]$$$.<\/p><\/div><\/div>"}, {"contestId": 113, "index": "D", "name": "Museum", "rating": 2700, "solvedCount": 979, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Museum<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>One day as Petya and his friend Vasya were having one of their numerous trips, they decided to visit a museum castle. The museum has a specific shape: it consists of <span class=\"tex-span\"><i>n<\/i><\/span> rooms connected with <span class=\"tex-span\"><i>m<\/i><\/span> corridors so that one can access any room from any other one.<\/p><p>After the two friends had a little walk around the museum, they decided to split and watch the pieces of art each of them found interesting. They agreed to meet in one of the rooms at six p.m. However, they forgot one quite essential thing: they didn't specify the place to meet and when the time came, they started to rush about the museum looking for each other (they couldn't call each other as roaming made a call's cost skyrocket).<\/p><p>Yet, even despite the whole rush, they couldn't get enough of the pieces of art, that's why each of them has the following strategy: each minute he make a decision where to go \u2014 with probability <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> he doesn't move to any other place during this minute (i.e. he stays in the room). With probability <span class=\"tex-span\">1\u2009-\u2009<i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> he equiprobably choose one of the adjacent rooms and went there along the corridor. Here <span class=\"tex-span\"><i>i<\/i><\/span> is the ordinal number of the current room. Building was expensive in ancient times, that's why each corridor connected two different rooms, and any two rooms had no more than one corridor between them. <\/p><p>The boys act simultaneously. As the corridors are dark, it is impossible to meet there; however, one can walk along the corridors in both directions (besides, the two boys can be going through the same corridor simultaneously without meeting). The boys act like that until they meet each other. More formally, the two friends meet when at some moment of time both of them decided to appear in the same room.<\/p><p>For each room find the probability that the boys will meet there considering that at 6 p.m. they are positioned in rooms <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span> correspondingly.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains four integers: <span class=\"tex-span\"><i>n<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200922)<\/span>, representing the numbers of rooms; <span class=\"tex-span\"><i>m<\/i><\/span> <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/804d9dca6153f530af22eae603bcec6481d466fe.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>, representing the number of corridors; <span class=\"tex-span\"><i>a<\/i>,\u2009<i>b<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>a<\/i>,\u2009<i>b<\/i>\u2009\u2264\u2009<i>n<\/i>)<\/span>, representing the numbers of Petya's and Vasya's starting rooms correspondingly.<\/p><p>Next <span class=\"tex-span\"><i>m<\/i><\/span> lines contain pairs of numbers \u2014 the numbers of rooms connected by a corridor. Next <span class=\"tex-span\"><i>n<\/i><\/span> lines contain probabilities <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\">(0.01\u2009\u2264\u2009<i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u20090.99)<\/span> with the accuracy of up to four digits after the decimal point \u2014 the probability to stay in room <span class=\"tex-span\"><i>i<\/i><\/span>.<\/p><p>It is guaranteed that every room can be reached from every other room by corridors.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In the only line print <span class=\"tex-span\"><i>n<\/i><\/span> space-separated numbers, the <span class=\"tex-span\"><i>i<\/i><\/span>-th number should represent the probability that the friends meet in the <span class=\"tex-span\"><i>i<\/i><\/span>-th room with absolute or relative error of no more than <span class=\"tex-span\">10<sup class=\"upper-index\">\u2009-\u20096<\/sup><\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 1 1 2<br/>1 2<br/>0.5<br/>0.5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0.5000000000 0.5000000000 <\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 4 1 2<br/>1 2<br/>2 3<br/>3 4<br/>4 1<br/>0.5<br/>0.5<br/>0.5<br/>0.5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0.3333333333 0.3333333333 0.1666666667 0.1666666667 <\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample the museum is symmetric. That means the probabilities to meet in rooms 1 and 2 are equal. And their sum equals to one. So, each probability equals <span class=\"tex-span\">0.5<\/span>.<\/p><\/div><\/div>"}, {"contestId": 1550, "index": "F", "name": "Jumping Around", "rating": 2700, "solvedCount": 977, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Jumping Around<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There is an infinite pond that can be represented with a number line. There are $$$n$$$ rocks in the pond, numbered from $$$1$$$ to $$$n$$$. The $$$i$$$-th rock is located at an integer coordinate $$$a_i$$$. The coordinates of the rocks are pairwise distinct. The rocks are numbered in the increasing order of the coordinate, so $$$a_1  \\lt  a_2  \\lt  \\dots  \\lt  a_n$$$.<\/p><p>A robot frog sits on the rock number $$$s$$$. The frog is programmable. It has a base jumping distance parameter $$$d$$$. There also is a setting for the jumping distance range. If the jumping distance range is set to some integer $$$k$$$, then the frog can jump from some rock to any rock at a distance from $$$d - k$$$ to $$$d + k$$$ inclusive in any direction. The distance between two rocks is an absolute difference between their coordinates.<\/p><p>You are assigned a task to implement a feature for the frog. Given two integers $$$i$$$ and $$$k$$$ determine if the frog can reach a rock number $$$i$$$ from a rock number $$$s$$$ performing a sequence of jumps with the jumping distance range set to $$$k$$$. The sequence can be arbitrarily long or empty.<\/p><p>You will be given $$$q$$$ testcases for that feature, the $$$j$$$-th testcase consists of two integers $$$i$$$ and $$$k$$$. Print \"<span class=\"tex-font-style-tt\">Yes<\/span>\" if the $$$i$$$-th rock is reachable and \"<span class=\"tex-font-style-tt\">No<\/span>\" otherwise.<\/p><p>You can output \"<span class=\"tex-font-style-tt\">YES<\/span>\" and \"<span class=\"tex-font-style-tt\">NO<\/span>\" in any case (for example, strings \"<span class=\"tex-font-style-tt\">yEs<\/span>\", \"<span class=\"tex-font-style-tt\">yes<\/span>\", \"<span class=\"tex-font-style-tt\">Yes<\/span>\" and '<span class=\"tex-font-style-tt\">YES<\/span>\"' will be recognized as a positive answer).<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains four integers $$$n$$$, $$$q$$$, $$$s$$$ and $$$d$$$ ($$$1 \\le n, q \\le 2 \\cdot 10^5$$$; $$$1 \\le s \\le n$$$; $$$1 \\le d \\le 10^6$$$)\u00a0\u2014 the number of rocks, the number of testcases, the starting rock and the base jumping distance parameter.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$1 \\le a_i \\le 10^6$$$)\u00a0\u2014 the coordinates of the rocks. The coordinates of the rocks are pairwise distinct. The rocks are numbered in the increasing order of distance from the land, so $$$a_1  \\lt  a_2  \\lt  \\dots  \\lt  a_n$$$.<\/p><p>Each of the next $$$q$$$ lines contains two integers $$$i$$$ and $$$k$$$ ($$$1 \\le i \\le n$$$; $$$1 \\le k \\le 10^6$$$)\u00a0\u2014 the parameters to the testcase.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each of the testcases print an answer. If there is a sequence of jumps from a rock number $$$s$$$ to a rock number $$$i$$$ with the jumping distance range set to $$$k$$$, then print \"<span class=\"tex-font-style-tt\">Yes<\/span>\". Otherwise, print \"<span class=\"tex-font-style-tt\">No<\/span>\".<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7 4 4 5\n1 5 10 13 20 22 28\n4 1\n7 2\n7 3\n3 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYes\nNo\nYes\nYes\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n10 8 6 11\n1 2 4 7 8 9 11 13 19 20\n2 13\n5 8\n8 1\n6 15\n1 15\n2 7\n7 6\n8 9\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYes\nYes\nNo\nYes\nYes\nYes\nYes\nYes\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 9 6 6\n1 2 4 9 18 19\n2 17\n1 18\n5 4\n2 11\n5 17\n6 8\n4 3\n3 3\n6 6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYes\nYes\nYes\nYes\nYes\nYes\nNo\nNo\nYes\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 1 1 10\n1 8 10 19\n2 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYes\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Explanation of the first example:<\/p><p>In the first testcase the destination rock is the same as the starting rock, thus no jumps are required to reach it.<\/p><p>In the second testcase the frog can jump any distance in the range $$$[5 - 2; 5 + 2]$$$. Thus, it can reach rock number $$$5$$$ (by jumping $$$7$$$ to the right) and rock number $$$3$$$ (by jumping $$$3$$$ to the left). From rock number $$$3$$$ it can reach rock number $$$2$$$ (by jumping $$$5$$$ to the left). From rock number $$$2$$$ it can reach rock number $$$1$$$ (by jumping $$$4$$$ to the left). However, there is no way to reach rock number $$$7$$$.<\/p><p>In the third testcase the frog can jump any distance in the range $$$[5 - 3; 5 + 3]$$$. Thus, it can reach rock number $$$7$$$ by jumping to rock $$$5$$$ first and to $$$7$$$ afterwards.<\/p><p>The fourth testcase is shown in the explanation for the second testcase.<\/p><\/div><\/div>"}, {"contestId": 1519, "index": "E", "name": "Off by One", "rating": 2700, "solvedCount": 973, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Off by One<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are $$$n$$$ points on an infinite plane. The $$$i$$$-th point has coordinates $$$(x_i, y_i)$$$ such that $$$x_i  \\gt  0$$$ and $$$y_i  \\gt  0$$$. The coordinates are not necessarily integer.<\/p><p>In one move you perform the following operations: <\/p><ul> <li> choose two points $$$a$$$ and $$$b$$$ ($$$a \\neq b$$$); <\/li><li> move point $$$a$$$ from $$$(x_a, y_a)$$$ to either $$$(x_a + 1, y_a)$$$ or $$$(x_a, y_a + 1)$$$; <\/li><li> move point $$$b$$$ from $$$(x_b, y_b)$$$ to either $$$(x_b + 1, y_b)$$$ or $$$(x_b, y_b + 1)$$$; <\/li><li> remove points $$$a$$$ and $$$b$$$. <\/li><\/ul><p><span class=\"tex-font-style-bf\">However, the move can only be performed if there exists a line that passes through the new coordinates of $$$a$$$, new coordinates of $$$b$$$ and $$$(0, 0)$$$.<\/span> <\/p><p>Otherwise, the move can't be performed and the points stay at their original coordinates $$$(x_a, y_a)$$$ and $$$(x_b, y_b)$$$, respectively.<\/p><p>The numeration of points <span class=\"tex-font-style-bf\">does not change<\/span> after some points are removed. Once the points are removed, they can't be chosen in any later moves. Note that you have to move both points during the move, you can't leave them at their original coordinates.<\/p><p>What is the maximum number of moves you can perform? What are these moves?<\/p><p>If there are multiple answers, you can print any of them.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$1 \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of points.<\/p><p>The $$$i$$$-th of the next $$$n$$$ lines contains four integers $$$a_i, b_i, c_i, d_i$$$ ($$$1 \\le a_i, b_i, c_i, d_i \\le 10^9$$$). The coordinates of the $$$i$$$-th point are $$$x_i = \\frac{a_i}{b_i}$$$ and $$$y_i = \\frac{c_i}{d_i}$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In the first line print a single integer $$$c$$$\u00a0\u2014 the maximum number of moves you can perform.<\/p><p>Each of the next $$$c$$$ lines should contain a description of a move: two integers $$$a$$$ and $$$b$$$ ($$$1 \\le a, b \\le n$$$, $$$a \\neq b$$$)\u00a0\u2014 the points that are removed during the current move. There should be a way to move points $$$a$$$ and $$$b$$$ according to the statement so that there's a line that passes through the new coordinates of $$$a$$$, the new coordinates of $$$b$$$ and $$$(0, 0)$$$. No removed point can be chosen in a later move.<\/p><p>If there are multiple answers, you can print any of them. You can print the moves and the points in the move in the arbitrary order.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7\n4 1 5 1\n1 1 1 1\n3 3 3 3\n1 1 4 1\n6 1 1 1\n5 1 4 1\n6 1 1 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n1 6\n2 4\n5 7\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n2 1 1 1\n1 1 2 1\n2 1 1 2\n1 2 1 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n1 2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n182 168 60 96\n78 72 45 72\n69 21 144 63\n148 12 105 6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n2 4\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Here are the points and the moves for the ones that get chosen for the moves from the first example:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/c9d35ba61aa4d104de2b87c27d3f8835421878a5.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 1411, "index": "G", "name": "No Game No Life", "rating": 2700, "solvedCount": 962, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. No Game No Life<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Let's consider the following game of Alice and Bob on a directed acyclic graph. Each vertex may contain an arbitrary number of chips. Alice and Bob make turns alternating. Alice goes first. In one turn player can move exactly one chip along any edge outgoing from the vertex that contains this chip to the end of this edge. The one who cannot make a turn loses. Both players play optimally.<\/p><p>Consider the following process that takes place every second on a given graph with $$$n$$$ vertices: <\/p><ol> <li> An integer $$$v$$$ is chosen equiprobably from $$$[1, n + 1]$$$. <\/li><li> If $$$v \\leq n$$$, we add a chip to the $$$v$$$-th vertex and go back to step 1. <\/li><li> If $$$v = n + 1$$$, Alice and Bob play the game with the current arrangement of chips and the winner is determined. After that, the process is terminated. <\/li><\/ol><p>Find the probability that Alice will win the game. It can be shown that the answer can be represented as $$$\\frac{P}{Q}$$$, where $$$P$$$ and $$$Q$$$ are coprime integers and $$$Q \\not\\equiv 0 \\pmod{998\\,244\\,353}$$$. Print the value of $$$P \\cdot Q^{-1} \\bmod 998\\,244\\,353$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$m$$$\u00a0\u2014 the number of vertices and edges of the graph ($$$1 \\leq n \\leq 10^5$$$, $$$0 \\leq m \\leq 10^5$$$).<\/p><p>The following $$$m$$$ lines contain edges description. The $$$i$$$-th of them contains two integers $$$u_i$$$ and $$$v_i$$$\u00a0\u2014 the beginning and the end vertices of the $$$i$$$-th edge ($$$1 \\leq u_i, v_i \\leq n$$$). It's guaranteed that the graph is acyclic.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output a single integer\u00a0\u2014 the probability of Alice victory modulo $$$998\\,244\\,353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1 0\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2 1\n1 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n332748118\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 5\n1 4\n5 2\n4 3\n1 5\n5 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n931694730\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 2063, "index": "F2", "name": "Counting Is Not Fun (Hard Version)", "rating": 2700, "solvedCount": 956, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F2. Counting Is Not Fun (Hard Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p> <\/p><p><span class=\"tex-font-style-bf\">This is the hard version of the problem. The difference between the versions is that in this version, the limits on $$$t$$$ and $$$n$$$ are bigger. You can hack only if you solved all versions of this problem.<\/span> <\/p><center> <span class=\"tex-font-size-small\"><span class=\"tex-font-style-it\">Now Little John is rich, and so he finally buys a house big enough to fit himself and his favorite bracket sequence. But somehow, he ended up with a lot of brackets! Frustrated, he penetrates through the ceiling with the \"buddha palm\".<\/span><\/span> <\/center><p>A bracket sequence is called <span class=\"tex-font-style-it\">balanced<\/span> if it can be constructed by the following formal grammar. <\/p><ol> <li> The empty sequence $$$\\varnothing$$$ is balanced. <\/li><li> If the bracket sequence $$$A$$$ is balanced, then $$$\\mathtt{(}A\\mathtt{)}$$$ is also balanced. <\/li><li> If the bracket sequences $$$A$$$ and $$$B$$$ are balanced, then the concatenated sequence $$$A B$$$ is also balanced. <\/li><\/ol><p>For example, the sequences \"<span class=\"tex-font-style-tt\">(())()<\/span>\", \"<span class=\"tex-font-style-tt\">()<\/span>\", \"<span class=\"tex-font-style-tt\">(()(()))<\/span>\", and the empty sequence are balanced, while \"<span class=\"tex-font-style-tt\">(()<\/span>\" and \"<span class=\"tex-font-style-tt\">(()))(<\/span>\" are not.<\/p><p>Given a balanced bracket sequence $$$s$$$, a pair of indices $$$(i,j)$$$ ($$$i \\lt j$$$) is called a <span class=\"tex-font-style-it\">good pair<\/span> if $$$s_i$$$ is '<span class=\"tex-font-style-tt\">(<\/span>', $$$s_j$$$ is '<span class=\"tex-font-style-tt\">)<\/span>', and the two brackets are added simultaneously with respect to Rule 2 while constructing the sequence $$$s$$$. For example, the sequence \"<span class=\"tex-font-style-tt\">(())()<\/span>\" has three different good pairs, which are $$$(1,4)$$$, $$$(2,3)$$$, and $$$(5,6)$$$. One can show that any balanced bracket sequence of $$$2n$$$ brackets contains exactly $$$n$$$ different good pairs, and using any order of rules to construct the same bracket sequence will yield the same set of good pairs.<\/p><p>Emily will play a bracket guessing game with John. The game is played as follows.<\/p><p>Initially, John has a balanced bracket sequence $$$s$$$ containing $$$n$$$ different good pairs, which is not known to Emily. John tells Emily the value of $$$n$$$ and asks Emily to guess the sequence.<\/p><p>Throughout $$$n$$$ turns, John gives Emily the following kind of clue on each turn.<\/p><ul> <li> $$$l\\;r$$$: The sequence $$$s$$$ contains a good pair $$$(l,r)$$$. <\/li><\/ul><p>The clues that John gives Emily are pairwise distinct and do not contradict each other.<\/p><p>At a certain point, Emily can be certain that the balanced bracket sequence satisfying the clues given so far is unique. For example, assume Emily knows that $$$s$$$ has $$$3$$$ good pairs, and it contains the good pair $$$(2,5)$$$. Out of $$$5$$$ balanced bracket sequences with $$$3$$$ good pairs, there exists only one such sequence \"<span class=\"tex-font-style-tt\">((()))<\/span>\" with the good pair $$$(2,5)$$$. Therefore, one can see that Emily does not always need $$$n$$$ turns to guess $$$s$$$.<\/p><p>To find out the content of $$$s$$$ as early as possible, Emily wants to know the number of different balanced bracket sequences that match the clues after each turn. Surely, this is not an easy job for Emily, especially when she is given so many good pairs. Now it is your turn to help Emily. Given the clues, you must find the answer before and after each turn. As the answers may be huge, you need to find them modulo $$$998\\,244\\,353$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains one integer $$$n$$$ ($$$2 \\le n \\le 3 \\cdot 10^5$$$)\u00a0\u2014 the number of good pairs.<\/p><p>Then, each of the $$$n$$$ following lines contains two integers $$$l_i$$$ and $$$r_i$$$ representing the $$$i$$$-th clue ($$$1 \\le l_i  \\lt  r_i \\le 2n$$$).<\/p><p>The clues in one test case are pairwise distinct and do not contradict each other.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$3 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output $$$n+1$$$ integers on a separate line: <\/p><ul> <li> The first integer is the answer before all clues, modulo $$$998\\,244\\,353$$$. <\/li><li> For all $$$i \\ge 1$$$, the $$$i+1$$$-th integer is the answer after the $$$i$$$-th clue, modulo $$$998\\,244\\,353$$$. <\/li><\/ul><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">7 8<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">4 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">7 8<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">9 12<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">10 11<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4 5<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5 1 1 1\n14 2 2 1 1\n132 42 5 2 1 1 1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The first test case of the example is explained in the problem description.<\/p><p>The third test case of the example is explained as follows. It can be shown that there are $$$132$$$ balanced bracket sequences with $$$6$$$ good pairs. The answers after each clue are given as follows:<\/p><ol> <li> You are given the good pair $$$(2,3)$$$. There are $$$42$$$ balanced bracket sequences having the good pair $$$(2,3)$$$. <\/li><li> You are given the good pair $$$(1,6)$$$. There are $$$5$$$ balanced bracket sequences having good pairs $$$(2,3)$$$, $$$(1,6)$$$. <\/li><li> You are given the good pair $$$(7,8)$$$. There are $$$2$$$ balanced bracket sequences having the three good pairs. The strings are \"<span class=\"tex-font-style-tt\">(()())()(())<\/span>\" and \"<span class=\"tex-font-style-tt\">(()())()()()<\/span>\", respectively. <\/li><li> You are given the good pair $$$(9,12)$$$. There is only one balanced bracket sequence having the four good pairs. The content of $$$s$$$ is therefore the only string, which is \"<span class=\"tex-font-style-tt\">(()())()(())<\/span>\". <\/li><\/ol><p>Then, the number of bracket sequences after the fifth and the sixth clue are both $$$1$$$ as you already know the content of $$$s$$$.<\/p><\/div><\/div>"}, {"contestId": 1025, "index": "F", "name": "Disjoint Triangles", "rating": 2700, "solvedCount": 956, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Disjoint Triangles<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>A point <span class=\"tex-font-style-it\">belongs<\/span> to a triangle if it lies inside the triangle or on one of its sides. Two triangles are <span class=\"tex-font-style-it\">disjoint<\/span> if there is no point on the plane that belongs to both triangles.<\/p><p>You are given $$$n$$$ points on the plane. No two points coincide and no three points are collinear.<\/p><p>Find the number of different ways to choose two disjoint triangles with vertices in the given points. Two ways which differ only in order of triangles or in order of vertices inside triangles are considered equal.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains an integer $$$n$$$ ($$$6 \\le n \\le 2000$$$) \u2013 the number of points.<\/p><p>Each of the next $$$n$$$ lines contains two integers $$$x_i$$$ and $$$y_i$$$ ($$$|x_i|, |y_i| \\le 10^9$$$) \u2013 the coordinates of a point.<\/p><p>No two points coincide and no three points are collinear.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2013 the number of ways to choose two disjoint triangles.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>6<br/>1 1<br/>2 2<br/>4 6<br/>4 5<br/>7 2<br/>5 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>7<br/>0 -1000000000<br/>-5 -5<br/>5 -5<br/>-5 0<br/>5 0<br/>-2 2<br/>2 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>21<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example there are six pairs of disjoint triangles, they are shown on the picture below.<\/p><center> <img class=\"tex-graphics\" height=\"302px\" src=\"https://espresso.codeforces.com/52cd4121e68d9af086bf6dae99167b17720344bc.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"529px\"/> <\/center><p>All other pairs of triangles are not disjoint, for example the following pair:<\/p><center> <img class=\"tex-graphics\" height=\"125px\" src=\"https://espresso.codeforces.com/2a0ebd7fb7f5c07f791dcf28da627bdf8406dab3.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"147px\"/> <\/center><\/div><\/div>"}, {"contestId": 1366, "index": "F", "name": "Jog Around The Graph", "rating": 2700, "solvedCount": 948, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Jog Around The Graph<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a simple weighted connected undirected graph, consisting of $$$n$$$ vertices and $$$m$$$ edges.<\/p><p>A path in the graph of length $$$k$$$ is a sequence of $$$k+1$$$ vertices $$$v_1, v_2, \\dots, v_{k+1}$$$ such that for each $$$i$$$ $$$(1 \\le i \\le k)$$$ the edge $$$(v_i, v_{i+1})$$$ is present in the graph. A path from some vertex $$$v$$$ also has vertex $$$v_1=v$$$. Note that edges and vertices are allowed to be included in the path multiple times.<\/p><p>The weight of the path is the total weight of edges in it.<\/p><p>For each $$$i$$$ from $$$1$$$ to $$$q$$$ consider a path from vertex $$$1$$$ of length $$$i$$$ of the maximum weight. What is the sum of weights of these $$$q$$$ paths?<\/p><p>Answer can be quite large, so print it modulo $$$10^9+7$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a three integers $$$n$$$, $$$m$$$, $$$q$$$ ($$$2 \\le n \\le 2000$$$; $$$n - 1 \\le m \\le 2000$$$; $$$m \\le q \\le 10^9$$$)\u00a0\u2014 the number of vertices in the graph, the number of edges in the graph and the number of lengths that should be included in the answer.<\/p><p>Each of the next $$$m$$$ lines contains a description of an edge: three integers $$$v$$$, $$$u$$$, $$$w$$$ ($$$1 \\le v, u \\le n$$$; $$$1 \\le w \\le 10^6$$$)\u00a0\u2014 two vertices $$$v$$$ and $$$u$$$ are connected by an undirected edge with weight $$$w$$$. The graph contains no loops and no multiple edges. It is guaranteed that the given edges form a connected graph.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer\u00a0\u2014 the sum of the weights of the paths from vertex $$$1$$$ of maximum weights of lengths $$$1, 2, \\dots, q$$$ modulo $$$10^9+7$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n7 8 25\n1 2 1\n2 3 10\n3 4 2\n1 5 2\n5 6 7\n6 4 15\n5 3 1\n1 7 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4361\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2 1 5\n1 2 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n60\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n15 15 23\n13 10 12\n11 14 12\n2 15 5\n4 10 8\n10 2 4\n10 7 5\n3 10 1\n5 6 11\n1 13 8\n9 15 4\n4 2 9\n11 15 1\n11 12 14\n10 8 12\n3 6 11\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3250\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 10 10000000\n2 4 798\n1 5 824\n5 2 558\n4 1 288\n3 4 1890\n3 1 134\n2 3 1485\n4 5 284\n3 5 1025\n1 2 649\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n768500592\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Here is the graph for the first example:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/85d6c74ffac7c6ba761d939509106dc3f7740041.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>Some maximum weight paths are: <\/p><ul> <li> length $$$1$$$: edges $$$(1, 7)$$$\u00a0\u2014 weight $$$3$$$; <\/li><li> length $$$2$$$: edges $$$(1, 2), (2, 3)$$$\u00a0\u2014 weight $$$1+10=11$$$; <\/li><li> length $$$3$$$: edges $$$(1, 5), (5, 6), (6, 4)$$$\u00a0\u2014 weight $$$2+7+15=24$$$; <\/li><li> length $$$4$$$: edges $$$(1, 5), (5, 6), (6, 4), (6, 4)$$$\u00a0\u2014 weight $$$2+7+15+15=39$$$; <\/li><li> $$$\\dots$$$ <\/li><\/ul><p>So the answer is the sum of $$$25$$$ terms: $$$3+11+24+39+\\dots$$$<\/p><p>In the second example the maximum weight paths have weights $$$4$$$, $$$8$$$, $$$12$$$, $$$16$$$ and $$$20$$$.<\/p><\/div><\/div>"}, {"contestId": 1774, "index": "F2", "name": "Magician and Pigs (Hard Version)", "rating": 2700, "solvedCount": 943, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F2. Magician and Pigs (Hard Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is the hard version of the problem. The only difference between the two versions is the constraint on $$$n$$$ and $$$x$$$. You can make hacks only if both versions of the problem are solved.<\/span><\/p><p>Little09 has been interested in magic for a long time, and it's so lucky that he meets a magician! The magician will perform $$$n$$$ operations, each of them is one of the following three:<\/p><ul><li> $$$1\\ x$$$: Create a pig with $$$x$$$ Health Points. <\/li><li> $$$2\\ x$$$: Reduce the Health Point of all living pigs by $$$x$$$. <\/li><li> $$$3$$$: Repeat all previous operations. Formally, assuming that this is the $$$i$$$-th operation in the operation sequence, perform the first $$$i-1$$$ operations (including \"Repeat\" operations involved) in turn.<\/li><\/ul><p>A pig will die when its Health Point is less than or equal to $$$0$$$. <\/p><p>Little09 wants to know how many living pigs there are after all the operations. Please, print the answer modulo $$$998\\,244\\,353$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$1\\leq n\\leq 8\\cdot 10^5$$$) \u00a0\u2014 the number of operations.<\/p><p>Each of the following $$$n$$$ lines contains an operation given in the form described in the problem statement. It's guaranteed that $$$1\\leq x\\leq 10^9$$$ in operations of the first two types.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u00a0\u2014 the number of living pigs after all the operations, modulo $$$998\\,244\\,353$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n1 8\n2 3\n3\n3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n1 5\n1 6\n2 2\n3\n1 4\n3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n12\n2 1\n1 15\n1 9\n3\n1 12\n2 2\n1 13\n3\n2 1\n1 9\n1 8\n3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n17<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, the operations are equivalent to repeating four times: create a pig with $$$8$$$ Health Points and then reduce the Health Points of all living pigs by $$$3$$$. It is easy to find that there are two living pigs in the end with $$$2$$$ and $$$5$$$ Health Points.<\/p><\/div><\/div>"}, {"contestId": 2043, "index": "F", "name": "Nim", "rating": 2700, "solvedCount": 931, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Nim<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>6 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Recall the rules of the game \"Nim\". There are $$$n$$$ piles of stones, where the $$$i$$$-th pile initially contains some number of stones. Two players take turns choosing a non-empty pile and removing any positive (strictly greater than $$$0$$$) number of stones from it. The player unable to make a move loses the game.<\/p><p>You are given an array $$$a$$$, consisting of $$$n$$$ integers. Artem and Ruslan decided to play Nim on segments of this array. Each of the $$$q$$$ rounds is defined by a segment $$$(l_i, r_i)$$$, where the elements $$$a_{l_i}, a_{l_i+1}, \\dots, a_{r_i}$$$ represent the sizes of the piles of stones.<\/p><p>Before the game starts, Ruslan can remove any number of piles from the chosen segment. However, at least <span class=\"tex-font-style-bf\">one pile must remain<\/span>, so in a single round he can remove at most $$$(r_i - l_i)$$$ piles. He is allowed to remove $$$0$$$ piles. After the removal, the game is played on the remaining piles within the segment.<\/p><p><span class=\"tex-font-style-bf\">All rounds are independent<\/span>: the changes made in one round do not affect the original array or any other rounds.<\/p><p>Ruslan wants to remove as many piles as possible so that Artem, who always makes the first move, loses.<\/p><p>For each round, determine: <\/p><ol> <li> the maximum number of piles Ruslan can remove; <\/li><li> the number of ways to choose the <span class=\"tex-font-style-bf\">maximum<\/span> number of piles for removal. <\/li><\/ol><p>Two ways are considered different if there exists an index $$$i$$$ such that the pile at index $$$i$$$ is removed in one way but not in the other. Since the number of ways can be large, output it modulo $$$998\\,244\\,353$$$.<\/p><p>If Ruslan cannot ensure Artem's loss in a particular round, output <span class=\"tex-font-style-tt\">-1<\/span> for that round.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains two integers $$$n$$$ and $$$q$$$ ($$$1 \\le n, q \\le 10^5$$$)\u00a0\u2014 the size of the array and the number of segments for which the answers need to be calculated.<\/p><p>The second line of input contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$0 \\le a_i \\le 50$$$)\u00a0\u2014 the elements of the initial array.<\/p><p>The $$$i$$$-th of the next $$$q$$$ lines contains two integers $$$l_i, r_i$$$ ($$$1 \\le l_i \\le r_i \\le n$$$)\u00a0\u2014 the bounds of the segment on which the boys want to play the game during the $$$i$$$-th round.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each round: <\/p><ul> <li> if Ruslan can win, print two integers\u00a0\u2014 the maximum number of piles that can be removed, and the number of ways to remove the maximum number of piles, taken modulo $$$998\\,244\\,353$$$; <\/li><li> otherwise print <span class=\"tex-font-style-tt\">-1<\/span>. <\/li><\/ul><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">9 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">0 1 2 1 3 4 5 6 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">1 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">2 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">3 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">4 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">1 9<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4 1\n2 1\n0 1\n-1\n8 2\n<\/pre><\/div><\/div><\/div><\/div>"}];
    let currentProblem = null;
    let editor = null;
    const STORAGE_KEY = `cf_ladder_done_2700`;
    let doneSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));

    // Retrieve the template securely from the hidden textarea
    const DEFAULT_TEMPLATE = document.getElementById('cpp-template').value.trim();

    function initEditor() {
        editor = ace.edit("editor");
        editor.setTheme("ace/theme/tomorrow_night_eighties");
        editor.session.setMode("ace/mode/c_cpp");
        editor.setFontSize(15);
        editor.setValue(DEFAULT_TEMPLATE, 1);
    }

    function renderSidebar() {
        const list = document.getElementById('problem-list');
        list.innerHTML = '';
        PROBLEMS.forEach((prob, idx) => {
            const div = document.createElement('div');
            div.className = `problem-item ${currentProblem === prob ? 'active' : ''}`;
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox'; checkbox.className = 'done-checkbox'; checkbox.checked = doneSet.has(prob.name);
            checkbox.onclick = (e) => { e.stopPropagation(); toggleDone(prob.name, checkbox.checked); };
            const title = document.createElement('div');
            title.innerHTML = `<span class="text-xs text-slate-500">#${idx + 1}</span> <span class="font-semibold text-slate-200">${prob.name}</span>`;
            div.appendChild(checkbox); div.appendChild(title); div.onclick = () => loadProblem(prob);
            list.appendChild(div);
        });
        updateProgress();
    }

    function toggleDone(name, isDone) {
        if(isDone) { doneSet.add(name); confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#4ade80', '#38bdf8'] }); } 
        else { doneSet.delete(name); }
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...doneSet]));
        updateProgress();
    }

    function updateProgress() { document.getElementById('progress-text').innerText = `${doneSet.size} / ${PROBLEMS.length} Solved`; }

    function loadProblem(prob) {
        currentProblem = prob; renderSidebar();
        document.getElementById('welcome-screen').style.display = 'none';
        const contentDiv = document.getElementById('problem-content');
        contentDiv.style.display = 'block'; contentDiv.innerHTML = prob.html;
        const titleEl = contentDiv.querySelector('.header .title');
        if(titleEl) {
            const originalText = titleEl.innerText;
            titleEl.innerHTML = `<a href="https://codeforces.com/contest/${prob.contestId}/problem/${prob.index}" target="_blank" title="Open in Codeforces">${originalText} 🔗</a>`;
        }
        contentDiv.querySelectorAll('.sample-tests .input pre').forEach(pre => {
            const btn = document.createElement('button'); btn.innerText = 'Copy'; btn.className = 'copy-btn';
            btn.onclick = () => { navigator.clipboard.writeText(pre.innerText); btn.innerText = 'Copied!'; btn.style.background = '#4ade80'; setTimeout(() => { btn.innerText = 'Copy'; btn.style.background = 'var(--neon-blue)'; }, 2000); };
            pre.parentElement.appendChild(btn);
        });
        if (window.MathJax) { MathJax.typesetPromise([contentDiv]); }
        editor.setValue(DEFAULT_TEMPLATE, 1);
    }

    function toggleSettings() {
        const modal = document.getElementById('settings-modal');
        if(modal.style.display === 'flex') { modal.style.display = 'none'; } 
        else { modal.style.display = 'flex'; document.getElementById('api-key').value = localStorage.getItem('cf_api_key') || ''; document.getElementById('api-secret').value = localStorage.getItem('cf_api_secret') || ''; }
    }

    function saveSettings() {
        localStorage.setItem('cf_api_key', document.getElementById('api-key').value);
        localStorage.setItem('cf_api_secret', document.getElementById('api-secret').value);
        toggleSettings(); alert('API Credentials Saved!');
    }

    async function sha512(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-512', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function submitCode() {
        if(!currentProblem) return alert('Select a problem first!');
        const apiKey = localStorage.getItem('cf_api_key'); const apiSecret = localStorage.getItem('cf_api_secret');
        if(!apiKey || !apiSecret) { alert('Please configure your API Key and Secret first.'); toggleSettings(); return; }
        const code = editor.getValue(); const time = Math.floor(Date.now() / 1000); const rand = Math.floor(Math.random() * 900000) + 100000;
        const params = { apiKey: apiKey, contestId: currentProblem.contestId.toString(), languageId: "54", problemIndex: currentProblem.index, source: code, time: time.toString() };
        const sortedKeys = Object.keys(params).sort();
        let paramString = sortedKeys.map(k => `${k}=${encodeURIComponent(params[k])}`).join('&');
        const sigPlain = `${rand}/problemset.submit?${paramString}#${apiSecret}`;
        const apiSig = `${rand}` + await sha512(sigPlain);
        try {
            const formData = new URLSearchParams();
            for (const key in params) formData.append(key, params[key]);
            formData.append("apiSig", apiSig);
            const res = await fetch("https://codeforces.com/api/problemset.submit", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: formData.toString() });
            const data = await res.json();
            if(data.status === 'OK') { alert('Code submitted successfully! 🎉 Check your Codeforces submissions.'); confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } }); } 
            else { alert('Submission failed: ' + data.comment); }
        } catch (err) { console.error(err); alert('Network error during submission.'); }
    }

    window.onload = () => { initEditor(); renderSidebar(); };
</script>

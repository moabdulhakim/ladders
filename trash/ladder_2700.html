r the object with mask $$$151$$$. <\/p><p>So their total sum will change its sign: initially $$$24$$$, after modifications\u00a0\u2014 $$$-28$$$.<\/p><p>In the second test sample the only object will change its price. So the total sum will change its sign. <\/p><\/div><\/div>"}, {"contestId": 1491, "index": "F", "name": "Magnets", "rating": 2700, "solvedCount": 1182, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Magnets<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-it\">This is an interactive problem.<\/span><\/p><p>Kochiya Sanae is playing with magnets. Realizing that some of those magnets are demagnetized, she is curious to find them out.<\/p><p>There are $$$n$$$ magnets, which can be of the following $$$3$$$ types:<\/p><ul><li> <span class=\"tex-font-style-tt\">N<\/span> <\/li><li> <span class=\"tex-font-style-tt\">S<\/span> <\/li><li> <span class=\"tex-font-style-tt\">-<\/span> \u2014 these magnets are demagnetized.<\/li><\/ul> <p>Note that <span class=\"tex-font-style-bf\">you don't know<\/span> the types of these magnets beforehand.<\/p><p>You have a machine which can measure the force between the magnets, and you can use it <span class=\"tex-font-style-bf\">at most<\/span> $$$n+\\lfloor \\log_2n\\rfloor$$$ times.<\/p><p>You can put some magnets to the left part of the machine and some to the right part of the machine, and launch the machine. Obviously, you can put one magnet to at most one side (you don't have to put all magnets). You can put the same magnet in different queries.<\/p><p>Then the machine will tell the force these magnets produce. Formally, let $$$n_1,s_1$$$ be the number of <span class=\"tex-font-style-tt\">N<\/span> and <span class=\"tex-font-style-tt\">S<\/span> magnets correspondently on the left and $$$n_2,s_2$$$ \u2014 on the right. Then the force between them would be $$$n_1n_2+s_1s_2-n_1s_2-n_2s_1$$$. Please note that the force is a <span class=\"tex-font-style-bf\">signed<\/span> value.<\/p><p>However, when the <span class=\"tex-font-style-bf\">absolute<\/span> value of the force is <span class=\"tex-font-style-bf\">strictly larger than<\/span> $$$n$$$, the machine will crash into pieces.<\/p><p>You need to find <span class=\"tex-font-style-bf\">all<\/span> magnets of type <span class=\"tex-font-style-tt\">-<\/span> (all demagnetized ones), <span class=\"tex-font-style-bf\">without breaking the machine<\/span>.<\/p><p><span class=\"tex-font-style-bf\">Note that the interactor is not adaptive<\/span>. The types of the magnets are fixed before the start of the interaction and do not change with queries.<\/p><p>It is guaranteed that there are <span class=\"tex-font-style-bf\">at least<\/span> $$$2$$$ magnets whose type is not <span class=\"tex-font-style-tt\">-<\/span>, and <span class=\"tex-font-style-bf\">at least<\/span> $$$1$$$ magnet of type <span class=\"tex-font-style-tt\">-<\/span>.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 100$$$) \u2014 the number of test cases.<\/p><\/div><div><div class=\"section-title\">Interaction<\/div><p>For each test case you should start by reading an integer $$$n$$$ ($$$3 \\leq n \\leq 2000$$$) \u2014 the number of the magnets. <\/p><p>It is guaranteed that the total sum of all $$$n$$$ over all test cases doesn't exceed $$$2000$$$.<\/p><p>After that you can put some magnets into the machine and make a query from the statement.<\/p><p>You have to print each query in three lines:<\/p><ul><li> In the first line print \"<span class=\"tex-font-style-tt\">? l r<\/span>\" (without quotes) where $$$l$$$ and $$$r$$$ ($$$1 \\leq l,r  \\lt  n$$$, $$$l+r \\leq n$$$) respectively denote the number of the magnets you put to left and right.<\/li><li> In the second line print $$$l$$$ integers $$$a_1, \\dots, a_l$$$ ($$$1 \\leq a_i \\leq n$$$, $$$a_i \\neq a_j$$$ if $$$i \\neq j$$$) \u2014 the indices of the magnets you put to left.<\/li><li> In the third line print $$$r$$$ integers $$$b_1, \\dots, b_r$$$ ($$$1 \\leq b_i \\leq n$$$, $$$b_i \\neq b_j$$$ if $$$i \\neq j$$$) \u2014 the indices of the magnets you put to right.<\/li><li> The same magnet can't be put to both sides <span class=\"tex-font-style-bf\">in the same query<\/span>. Formally, you should guarantee that $$$a_i \\neq b_j$$$ for any $$$i$$$ and $$$j$$$. However, you may leave some magnets unused.<\/li><\/ul><p>After printing a query do not forget to <span class=\"tex-font-style-bf\">output end of line and flush the output<\/span>. To do this, use:<\/p><ul><li> <span class=\"tex-font-style-tt\">fflush(stdout)<\/span> or <span class=\"tex-font-style-tt\">cout.flush()<\/span> in C++;<\/li><li> <span class=\"tex-font-style-tt\">System.out.flush()<\/span> in Java;<\/li><li> <span class=\"tex-font-style-tt\">flush(output)<\/span> in Pascal;<\/li><li> <span class=\"tex-font-style-tt\">stdout.flush()<\/span> in Python;<\/li><li> see documentation for other languages.<\/li><\/ul><p>After this, you should read an integer $$$F$$$ \u2014 the force these magnets produce.<\/p><p>Note that if your query is invalid(either the query limit exceeds, the machine crashes or the arguments are invalid), <span class=\"tex-font-style-bf\">the interactor will terminate immediately<\/span>. In this case terminate your program to receive verdict <span class=\"tex-font-style-tt\">Wrong Answer<\/span> instead of arbitrary verdicts.<\/p><p>If you are confident about your answer, use the following format to report it:<\/p><ul><li> \"<span class=\"tex-font-style-tt\">! k A<\/span>\", where $$$k$$$ is the number of magnets you found, and $$$A$$$ is an array consisting of $$$k$$$ different integers from $$$1$$$ to $$$n$$$ denoting the indices of the magnets of type <span class=\"tex-font-style-tt\">-<\/span> that you found. You may print elements of $$$A$$$ in <span class=\"tex-font-style-bf\">arbitrary order<\/span>.<\/li><li> After that, if this is the last test case, you have to terminate your program; otherwise you should immediately continue to deal with the next test case.<\/li><\/ul><p><span class=\"tex-font-style-bf\">Note that the interactor is not adaptive<\/span>. The types of the magnets are fixed before the start of interaction and do not change with queries.<\/p><p><span class=\"tex-font-style-bf\">Hacks<\/span><\/p><p>To hack a solution, use the following format:<\/p><p>The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 100$$$) \u2014 the number of test cases in your hack.<\/p><p>Then follow the descriptions of the $$$t$$$ test cases, each printed in two lines:<\/p><ul><li> The first line contains a single integer $$$n$$$ ($$$3 \\leq n \\leq 2000$$$) \u2014 the number of magnets.<\/li><li> The second line contains a string $$$S$$$ of length $$$n$$$ consisting of only <span class=\"tex-font-style-tt\">N<\/span>, <span class=\"tex-font-style-tt\">S<\/span> and <span class=\"tex-font-style-tt\">-<\/span>, denoting the magnets' types.<\/li><li> Each of your test case should guarantee that there are <span class=\"tex-font-style-bf\">at least<\/span> $$$2$$$ magnets whose type is not <span class=\"tex-font-style-tt\">-<\/span>, and <span class=\"tex-font-style-bf\">at least<\/span> $$$1$$$ magnet of type <span class=\"tex-font-style-tt\">-<\/span>. Meanwhile, the total sum of $$$n$$$ in all test cases should not exceed $$$2000$$$.<\/li><\/ul><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1\n4\n\n\n\n0\n\n\n\n1\n\n\n\n0\n\n\n\n0\n\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n\n\n? 1 1\n3\n4\n\n? 1 2\n1\n2 3\n\n? 1 1\n1\n4\n\n? 1 1\n1\n3\n\n! 2 3 4\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The empty lines in the sample are just for you to better understand the interaction process. <span class=\"tex-font-style-bf\">You're not required to print them<\/span>.<\/p><p>In the sample, the types of the magnets are <span class=\"tex-font-style-tt\">NN<\/span><span class=\"tex-font-style-tt\">-<\/span><span class=\"tex-font-style-tt\">-<\/span>.<\/p><p>At first, you put the third magnet on the left and the fourth one on the right. Both of them have type <span class=\"tex-font-style-tt\">-<\/span>, thus no force is produced.<\/p><p>Then you put the first magnet on the left and the second and third one on the right. The third magnet has type <span class=\"tex-font-style-tt\">-<\/span>, while the other two magnets are of type <span class=\"tex-font-style-tt\">N<\/span>, so the force produced is $$$1$$$.<\/p><p>In the following two queries, the force is $$$0$$$ since there is only a magnet with property <span class=\"tex-font-style-tt\">-<\/span> on the right.<\/p><p>Then we can determine that the magnets of type <span class=\"tex-font-style-tt\">-<\/span> are the third and the fourth one, so we should print <span class=\"tex-font-style-tt\">! 2 3 4<\/span> and exit.<\/p><\/div><\/div>"}, {"contestId": 70, "index": "D", "name": "Professor's task", "rating": 2700, "solvedCount": 1176, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Professor's task<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Once a walrus professor Plato asked his programming students to perform the following practical task. <\/p><p>The students had to implement such a data structure that would support a convex hull on some set of points <span class=\"tex-span\"><i>S<\/i><\/span>. The input to the program had <span class=\"tex-span\"><i>q<\/i><\/span> queries of two types: <\/p><p>1. Add a point with coordinates <span class=\"tex-span\">(<i>x<\/i>,\u2009<i>y<\/i>)<\/span> into the set <span class=\"tex-span\"><i>S<\/i><\/span>. Note that in this case the convex hull of <span class=\"tex-span\"><i>S<\/i><\/span> could have changed, and could have remained the same. <\/p><p>2. Say whether a point with coordinates <span class=\"tex-span\">(<i>x<\/i>,\u2009<i>y<\/i>)<\/span> belongs to an area limited by the convex hull, including the border. <\/p><p>All the students coped with the task. What about you?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains an integer <span class=\"tex-span\"><i>q<\/i><\/span> (<span class=\"tex-span\">4\u2009\u2264\u2009<i>q<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>). <\/p><p>Then follow <span class=\"tex-span\"><i>q<\/i><\/span> lines in the following way: \"<span class=\"tex-span\"><i>t<\/i><\/span> <span class=\"tex-span\"><i>x<\/i><\/span> <span class=\"tex-span\"><i>y<\/i><\/span>\", where <span class=\"tex-span\"><i>t<\/i><\/span> is the query type (1 or 2), and <span class=\"tex-span\">(<i>x<\/i>,\u2009<i>y<\/i>)<\/span> are the coordinates of the point (<span class=\"tex-span\">\u2009-\u200910<sup class=\"upper-index\">6<\/sup>\u2009\u2264\u2009<i>x<\/i>,\u2009<i>y<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">6<\/sup><\/span>, <span class=\"tex-span\"><i>x<\/i><\/span> and <span class=\"tex-span\"><i>y<\/i><\/span> are integers). <\/p><p>There is at least one query of type 2.<\/p><p>It is guaranteed that the three queries of the first type follow first and the points given in the queries form a non-degenerative triangle. Also all the points added in <span class=\"tex-span\"><i>S<\/i><\/span> are distinct.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query of the second type print one string containing \"<span class=\"tex-font-style-tt\">YES<\/span>\", if the point lies inside the convex hull or on its border. Otherwise, print \"<span class=\"tex-font-style-tt\">NO<\/span>\".<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>8<br/>1 0 0<br/>1 2 0<br/>1 2 2<br/>2 1 0<br/>1 0 2<br/>2 1 1<br/>2 2 1<br/>2 20 -1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/>YES<br/>YES<br/>NO<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1672, "index": "H", "name": "Zigu Zagu", "rating": 2700, "solvedCount": 1175, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">H. Zigu Zagu<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You have a binary string $$$a$$$ of length $$$n$$$ consisting only of digits $$$0$$$ and $$$1$$$. <\/p><p>You are given $$$q$$$ queries. In the $$$i$$$-th query, you are given two indices $$$l$$$ and $$$r$$$ such that $$$1 \\le l \\le r \\le n$$$. <\/p><p>Let $$$s=a[l,r]$$$. You are allowed to do the following operation on $$$s$$$:<\/p><ol> <li> Choose two indices $$$x$$$ and $$$y$$$ such that $$$1 \\le x \\le y \\le |s|$$$. Let $$$t$$$ be the substring $$$t = s[x, y]$$$. Then for all $$$1 \\le i \\le |t| - 1$$$, the condition $$$t_i \\neq t_{i+1}$$$ has to hold. Note that $$$x = y$$$ is always a valid substring. <\/li><li> Delete the substring $$$s[x, y]$$$ from $$$s$$$. <\/li><\/ol><p>For each of the $$$q$$$ queries, find the minimum number of operations needed to make $$$s$$$ an empty string.<\/p><p>Note that for a string $$$s$$$, $$$s[l,r]$$$ denotes the subsegment $$$s_l,s_{l+1},\\ldots,s_r$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$q$$$ ($$$1 \\le n, q \\le 2 \\cdot 10 ^ 5$$$) \u00a0\u2014 the length of the binary string $$$a$$$ and the number of queries respectively.<\/p><p>The second line contains a binary string $$$a$$$ of length $$$n$$$ ($$$a_i \\in \\{0, 1\\}$$$).<\/p><p>Each of the next $$$q$$$ lines contains two integers $$$l$$$ and $$$r$$$ ($$$1 \\le l \\le r \\le n$$$) \u00a0\u2014 representing the substring of each query.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$q$$$ lines, the $$$i$$$-th line representing the minimum number of operations needed for the $$$i$$$-th query.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 3\n11011\n2 4\n1 5\n3 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n3\n2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n10 3\n1001110110\n1 10\n2 5\n5 10\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n2\n3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, <\/p><ol> <li> The substring is $$$\\texttt{101}$$$, so we can do one operation to make the substring empty. <\/li><li> The substring is $$$\\texttt{11011}$$$, so we can do one operation on $$$s[2, 4]$$$ to make $$$\\texttt{11}$$$, then use two more operations to make the substring empty. <\/li><li> The substring is $$$\\texttt{011}$$$, so we can do one operation on $$$s[1, 2]$$$ to make $$$\\texttt{1}$$$, then use one more operation to make the substring empty. <\/li><\/ol><\/div><\/div>"}, {"contestId": 1338, "index": "D", "name": "Nested Rubber Bands", "rating": 2700, "solvedCount": 1165, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Nested Rubber Bands<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You have a tree of $$$n$$$ vertices. You are going to convert this tree into $$$n$$$ rubber bands on infinitely large plane. Conversion rule follows:<\/p><ul> <li> For every pair of vertices $$$a$$$ and $$$b$$$, rubber bands $$$a$$$ and $$$b$$$ should intersect if and only if there is an edge exists between $$$a$$$ and $$$b$$$ in the tree. <\/li><li> Shape of rubber bands must be a simple loop. In other words, rubber band is a loop which doesn't self-intersect. <\/li><\/ul><p>Now let's define following things: <\/p><ul> <li> Rubber band $$$a$$$ <span class=\"tex-font-style-bf\">includes<\/span> rubber band $$$b$$$, if and only if rubber band $$$b$$$ is in rubber band $$$a$$$'s area, and they don't intersect each other. <\/li><li> Sequence of rubber bands $$$a_{1}, a_{2}, \\ldots, a_{k}$$$ ($$$k \\ge 2$$$) are <span class=\"tex-font-style-bf\">nested<\/span>, if and only if for all $$$i$$$ ($$$2 \\le i \\le k$$$), $$$a_{i-1}$$$ includes $$$a_{i}$$$. <\/li><\/ul><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/f08ff873c8f5e206ec63648edfc4056a9acc01fc.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> This is an example of conversion. Note that rubber bands $$$5$$$ and $$$6$$$ are nested. <\/center><p>It can be proved that is it possible to make a conversion and sequence of nested rubber bands under given constraints.<\/p><p>What is the maximum length of sequence of nested rubber bands can be obtained from given tree? Find and print it.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integer $$$n$$$ ($$$3 \\le n \\le 10^{5}$$$)\u00a0\u2014 the number of vertices in tree.<\/p><p>The $$$i$$$-th of the next $$$n-1$$$ lines contains two integers $$$a_{i}$$$ and $$$b_{i}$$$ ($$$1 \\le a_{i} \\lt b_{i} \\le n$$$)\u00a0\u2014 it means there is an edge between $$$a_{i}$$$ and $$$b_{i}$$$. It is guaranteed that given graph forms tree of $$$n$$$ vertices.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the answer.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n1 3\n2 3\n3 4\n4 5\n4 6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n1 2\n2 3\n3 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample, you can obtain a nested sequence of $$$4$$$ rubber bands($$$1$$$, $$$2$$$, $$$5$$$, and $$$6$$$) by the conversion shown below. Of course, there are other conversions exist to make a nested sequence of $$$4$$$ rubber bands. However, you cannot make sequence of $$$5$$$ or more nested rubber bands with given tree.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/d023fa51706587542cf5d7766315a4f8e33b37f9.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>You can see one of the possible conversions for the second sample below.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/ad30164b69693246194be7812ed47d8b7c1decfb.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 356, "index": "D", "name": "Bags and Coins", "rating": 2700, "solvedCount": 1159, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Bags and Coins<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>When you were a child you must have been told a puzzle of bags and coins. Anyway, here's one of its versions: <\/p><p><span class=\"tex-font-style-it\">A horse has three bags. The first bag has one coin, the second bag has one coin and the third bag has three coins. In total, the horse has three coins in the bags. How is that possible?<\/span> <\/p><p>The answer is quite simple. The third bag contains a coin and two other bags. <\/p><p>This problem is a generalization of the childhood puzzle. You have <span class=\"tex-span\"><i>n<\/i><\/span> bags. You know that the first bag contains <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub><\/span> coins, the second bag contains <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">2<\/sub><\/span> coins, ..., the <span class=\"tex-span\"><i>n<\/i><\/span>-th bag contains <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> coins. In total, there are <span class=\"tex-span\"><i>s<\/i><\/span> coins. Find the way to arrange the bags and coins so that they match the described scenario or else state that it is impossible to do.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>s<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>s<\/i>\u2009\u2264\u200970000)<\/span> \u2014 the number of bags and the total number of coins. The next line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200970000)<\/span>, where <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> shows the number of coins in the <span class=\"tex-span\"><i>i<\/i><\/span>-th bag.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If the answer doesn't exist, print <span class=\"tex-font-style-tt\">-1<\/span>. <\/p><p>Otherwise, print <span class=\"tex-span\"><i>n<\/i><\/span> lines, on the <span class=\"tex-span\"><i>i<\/i><\/span>-th line print the contents of the <span class=\"tex-span\"><i>i<\/i><\/span>-th bag. The first number in the line, <span class=\"tex-span\"><i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\">(0\u2009\u2264\u2009<i>c<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>)<\/span>, must represent the number of coins lying directly in the <span class=\"tex-span\"><i>i<\/i><\/span>-th bag (the coins in the bags that are in the <span class=\"tex-span\"><i>i<\/i><\/span>-th bag are not taken into consideration). The second number in the line, <span class=\"tex-span\"><i>k<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\">(0\u2009\u2264\u2009<i>k<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009&lt;\u2009<i>n<\/i>)<\/span> must represent the number of bags that lie directly in the <span class=\"tex-span\"><i>i<\/i><\/span>-th bag (the bags that are inside the bags lying in the <span class=\"tex-span\"><i>i<\/i><\/span>-th bag are not taken into consideration). Next, the line must contain <span class=\"tex-span\"><i>k<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> integers \u2014 the numbers of the bags that are lying directly in the <span class=\"tex-span\"><i>i<\/i><\/span>-th bag.<\/p><p>The total number of coins in the solution must equal <span class=\"tex-span\"><i>s<\/i><\/span>. If we count the total number of coins the <span class=\"tex-span\"><i>i<\/i><\/span>-th bag in the solution has, we should get <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. <\/p><p>No bag can directly lie in more than one bag. The bags can be nested in more than one level (see the second test case). If there are multiple correct answers, you can print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 3<br/>1 3 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1 0<br/>1 2 3 1<br/>1 0<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 3<br/>1 3 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1 0<br/>2 1 3<br/>0 1 1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>1 2<br/>1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>-1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>8 10<br/>2 7 3 4 1 3 1 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2 0<br/>1 2 1 4<br/>0 2 7 8<br/>0 2 5 6<br/>1 0<br/>3 0<br/>1 0<br/>2 0<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The pictures below show two possible ways to solve one test case from the statement. The left picture corresponds to the first test case, the right picture corresponds to the second one.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/7cff2ea9e29b147645657d9f20592a38b94cf3c4.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 1034, "index": "C", "name": "Region Separation", "rating": 2700, "solvedCount": 1152, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Region Separation<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There are $$$n$$$ cities in the Kingdom of Autumn, numbered from $$$1$$$ to $$$n$$$. People can travel between any two cities using $$$n-1$$$ two-directional roads.<\/p><p>This year, the government decides to separate the kingdom. There will be regions of different levels. The whole kingdom will be the region of level $$$1$$$. Each region of $$$i$$$-th level should be separated into several (at least two) regions of $$$i+1$$$-th level, unless $$$i$$$-th level is the last level. Each city should belong to exactly one region of each level and for any two cities in the same region, it should be possible to travel between them passing the cities in the same region only.<\/p><p>According to research, for each city $$$i$$$, there is a value $$$a_i$$$, which describes the importance of this city. All regions of the same level should have an equal sum of city importances.<\/p><p>Your task is to find how many plans there are to determine the separation of the regions that all the conditions are satisfied. Two plans are considered different if and only if their numbers of levels are different or there exist two cities in the same region of one level in one plan but in different regions of this level in the other plan. Since the answer may be very large, output it modulo $$$10^9+7$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$1 \\leq n \\leq 10^6$$$) \u2014 the number of the cities.<\/p><p>The second line contains $$$n$$$ integers, the $$$i$$$-th of which is $$$a_i$$$ ($$$1 \\leq a_i \\leq 10^9$$$) \u2014 the value of each city.<\/p><p>The third line contains $$$n-1$$$ integers, $$$p_1, p_2, \\ldots, p_{n-1}$$$; $$$p_i$$$ ($$$p_i \\leq i$$$) describes a road between cities $$$p_i$$$ and $$$i+1$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the number of different plans modulo $$$10^9+7$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>1 1 1 1<br/>1 2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>1 1 1 1<br/>1 2 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>1 2 1 2<br/>1 1 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first example, there are $$$4$$$ different plans:<\/p><p>Plan $$$1$$$: Level-$$$1$$$: $$$\\{1,2,3,4\\}$$$.<\/p><p>Plan $$$2$$$: Level-$$$1$$$: $$$\\{1,2,3,4\\}$$$, Level-$$$2$$$: $$$\\{1,2\\}$$$,$$$\\{3,4\\}$$$.<\/p><p>Plan $$$3$$$: Level-$$$1$$$: $$$\\{1,2,3,4\\}$$$, Level-$$$2$$$: $$$\\{1\\}$$$,$$$\\{2\\}$$$,$$$\\{3\\}$$$,$$$\\{4\\}$$$.<\/p><p>Plan $$$4$$$: Level-$$$1$$$: $$$\\{1,2,3,4\\}$$$, Level-$$$2$$$: $$$\\{1,2\\}$$$,$$$\\{3,4\\}$$$, Level-$$$3$$$: $$$\\{1\\}$$$,$$$\\{2\\}$$$,$$$\\{3\\}$$$,$$$\\{4\\}$$$.<\/p><p>For the second example, there are $$$2$$$ different plans:<\/p><p>Plan $$$1$$$: Level-$$$1$$$: $$$\\{1,2,3,4\\}$$$.<\/p><p>Plan $$$2$$$: Level-$$$1$$$: $$$\\{1,2,3,4\\}$$$, Level-$$$2$$$: $$$\\{1\\}$$$,$$$\\{2\\}$$$,$$$\\{3\\}$$$,$$$\\{4\\}$$$.<\/p><p>For the third example, there are $$$3$$$ different plans:<\/p><p>Plan $$$1$$$: Level-$$$1$$$: $$$\\{1,2,3,4\\}$$$.<\/p><p>Plan $$$2$$$: Level-$$$1$$$: $$$\\{1,2,3,4\\}$$$, Level-$$$2$$$: $$$\\{1,2\\}$$$,$$$\\{3,4\\}$$$.<\/p><p>Plan $$$3$$$: Level-$$$1$$$: $$$\\{1,2,3,4\\}$$$, Level-$$$2$$$: $$$\\{1,3\\}$$$,$$$\\{2\\}$$$,$$$\\{4\\}$$$.<\/p><\/div><\/div>"}, {"contestId": 1555, "index": "F", "name": "Good Graph", "rating": 2700, "solvedCount": 1151, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Good Graph<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You have an undirected graph consisting of $$$n$$$ vertices with weighted edges.<\/p><p>A simple cycle is a cycle of the graph without repeated vertices. Let the <span class=\"tex-font-style-it\">weight<\/span> of the cycle be the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#XOR\">XOR<\/a> of weights of edges it consists of.<\/p><p>Let's say the graph is <span class=\"tex-font-style-it\">good<\/span> if all its <span class=\"tex-font-style-it\">simple<\/span> cycles have weight $$$1$$$. A graph is bad if it's not good.<\/p><p>Initially, the graph is empty. Then $$$q$$$ queries follow. Each query has the next type: <\/p><ul> <li> $$$u$$$ $$$v$$$ $$$x$$$\u00a0\u2014 add edge between vertices $$$u$$$ and $$$v$$$ of weight $$$x$$$ if it doesn't make the graph bad. <\/li><\/ul><p>For each query print, was the edge added or not.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$q$$$ ($$$3 \\le n \\le 3 \\cdot 10^5$$$; $$$1 \\le q \\le 5 \\cdot 10^5$$$)\u00a0\u2014 the number of vertices and queries.<\/p><p>Next $$$q$$$ lines contain queries\u00a0\u2014 one per line. Each query contains three integers $$$u$$$, $$$v$$$ and $$$x$$$ ($$$1 \\le u, v \\le n$$$; $$$u \\neq v$$$; $$$0 \\le x \\le 1$$$)\u00a0\u2014 the vertices of the edge and its weight.<\/p><p><span class=\"tex-font-style-bf\">It's guaranteed that there are no multiple edges in the input.<\/span><\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query, print <span class=\"tex-font-style-tt\">YES<\/span> if the edge was added to the graph, or <span class=\"tex-font-style-tt\">NO<\/span> otherwise (both case-insensitive).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n9 12\n6 1 0\n1 3 1\n3 6 0\n6 2 0\n6 4 1\n3 4 1\n2 4 0\n2 5 0\n4 5 0\n7 8 1\n8 9 1\n9 7 0\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nYES\nYES\nYES\nYES\nNO\nYES\nYES\nNO\nYES\nYES\nNO\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1303, "index": "G", "name": "Sum of Prefix Sums", "rating": 2700, "solvedCount": 1151, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. Sum of Prefix Sums<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>6 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>We define the <span class=\"tex-font-style-it\">sum of prefix sums<\/span> of an array $$$[s_1, s_2, \\dots, s_k]$$$ as $$$s_1 + (s_1 + s_2) + (s_1 + s_2 + s_3) + \\dots + (s_1 + s_2 + \\dots + s_k)$$$.<\/p><p>You are given a tree consisting of $$$n$$$ vertices. Each vertex $$$i$$$ has an integer $$$a_i$$$ written on it. We define the value of the <span class=\"tex-font-style-it\">simple<\/span> path from vertex $$$u$$$ to vertex $$$v$$$ as follows: consider all vertices appearing on the path from $$$u$$$ to $$$v$$$, write down all the numbers written on these vertices in the order they appear on the path, and compute the <span class=\"tex-font-style-it\">sum of prefix sums<\/span> of the resulting sequence.<\/p><p>Your task is to calculate the maximum value over all paths in the tree.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$2 \\le n \\le 150000$$$) \u2014 the number of vertices in the tree.<\/p><p>Then $$$n - 1$$$ lines follow, representing the edges of the tree. Each line contains two integers $$$u_i$$$ and $$$v_i$$$ ($$$1 \\le u_i, v_i \\le n$$$, $$$u_i \\ne v_i$$$), denoting an edge between vertices $$$u_i$$$ and $$$v_i$$$. It is guaranteed that these edges form a tree.<\/p><p>The last line contains $$$n$$$ integers $$$a_1$$$, $$$a_2$$$, ..., $$$a_n$$$ ($$$1 \\le a_i \\le 10^6$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the maximum value over all paths in the tree.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n4 2\n3 2\n4 1\n1 3 3 7\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n36\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The best path in the first example is from vertex $$$3$$$ to vertex $$$1$$$. It gives the sequence $$$[3, 3, 7, 1]$$$, and the sum of prefix sums is $$$36$$$.<\/p><\/div><\/div>"}, {"contestId": 1956, "index": "E2", "name": "Nene vs. Monsters (Hard Version)", "rating": 2700, "solvedCount": 1149, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E2. Nene vs. Monsters (Hard Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-it\">This is the hard version of the problem. The only difference between the versions is the constraints on $$$a_i$$$. You can make hacks only if both versions of the problem are solved.<\/span><\/p><p>Nene is fighting with $$$n$$$ monsters, located in a circle. These monsters are numbered from $$$1$$$ to $$$n$$$, and the $$$i$$$-th ($$$1 \\le i \\le n$$$) monster's current energy level is $$$a_i$$$.<\/p><p>Since the monsters are too strong, Nene decided to fight with them using the <span class=\"tex-font-style-tt\">Attack Your Neighbour<\/span> spell. When Nene uses this spell, the following actions happen in the following order <span class=\"tex-font-style-bf\">one by one<\/span>: <\/p><ul> <li> The $$$1$$$-st monster attacks the $$$2$$$-nd monster; <\/li><li> The $$$2$$$-nd monster attacks the $$$3$$$-rd monster; <\/li><li> $$$\\ldots$$$ <\/li><li> The $$$(n-1)$$$-th monster attacks the $$$n$$$-th monster; <\/li><li> The $$$n$$$-th monster attacks the $$$1$$$-st monster. <\/li><\/ul><p>When the monster with energy level $$$x$$$ attacks the monster with the energy level $$$y$$$, the energy level of the defending monster becomes $$$\\max(0, y-x)$$$ (the energy level of the attacking monster remains equal to $$$x$$$).<\/p><p>Nene is going to use this spell $$$10^{100}$$$ times and deal with the monsters that will still have a non-zero energy level herself. She wants you to determine which monsters will have a non-zero energy level once she will use the described spell $$$10^{100}$$$ times.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^4$$$). The description of test cases follows.<\/p><p>The first line contains a single integer $$$n$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of monsters.<\/p><p>The second line contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$0 \\le a_i \\le 10^9$$$)\u00a0\u2014 the current energy levels of monsters.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$2 \\cdot 10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, <\/p><ul> <li> in the first line output an integer $$$m$$$\u00a0\u2014 the number of monsters with non-zero energy level after $$$10^{100}$$$ uses of the spell; <\/li><li> in the second line of output $$$m$$$ integers $$$i_1,i_2,\\ldots,i_m$$$ ($$$1 \\le i_1  \\lt  i_2  \\lt  \\ldots  \\lt  i_m \\le n$$$)\u00a0\u2014 the indices of these monsters in the increasing order. <\/li><\/ul><p>If $$$m=0$$$, you may either output an empty line or don't output it.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 5 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">0 0<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 5 7 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">4 2 1 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">13<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 1 4 5 1 4 1 9 1 9 8 1 0<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n1 \n0\n\n1\n1 \n2\n1 3 \n6\n1 3 6 8 10 12 \n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the following actions happen during the first $$$3$$$ uses of the spell in this order:<\/p><ul> <li> Nene uses the <span class=\"tex-font-style-tt\">Attack Your Neighbour<\/span> spell for the first time; <\/li><li> the $$$1$$$-st monster attacks the $$$2$$$-nd monster, after the attack the energy level of the $$$2$$$-nd monster becomes equal to $$$\\max(0, 5-2)=3$$$; <\/li><li> the $$$2$$$-nd monster attacks the $$$3$$$-rd monster, after the attack the energy level of the $$$3$$$-rd monster becomes equal to $$$\\max(0, 3-3)=0$$$; <\/li><li> the $$$3$$$-rd monster attacks the $$$1$$$-st monster, after the attack the energy level of the $$$1$$$-st monster becomes equal to $$$\\max(0, 2-0)=2$$$; <\/li><li> Nene uses the <span class=\"tex-font-style-tt\">Attack Your Neighbour<\/span> spell for the second time; <\/li><li> the $$$1$$$-st monster attacks the $$$2$$$-nd monster, after the attack the energy level of the $$$2$$$-nd monster becomes equal to $$$\\max(0, 3-2)=1$$$; <\/li><li> the $$$2$$$-nd monster attacks the $$$3$$$-rd monster, after the attack the energy level of the $$$3$$$-rd monster becomes equal to $$$\\max(0, 0-1)=0$$$; <\/li><li> the $$$3$$$-rd monster attacks the $$$1$$$-st monster, after the attack the energy level of the $$$1$$$-st monster becomes equal to $$$\\max(0, 2-0)=2$$$; <\/li><li> Nene uses the <span class=\"tex-font-style-tt\">Attack Your Neighbour<\/span> spell for the third time; <\/li><li> the $$$1$$$-st monster attacks the $$$2$$$-nd monster, after the attack the energy level of the $$$2$$$-nd monster becomes equal to $$$\\max(0, 1-2)=0$$$; <\/li><li> the $$$2$$$-nd monster attacks the $$$3$$$-rd monster, after the attack the energy level of the $$$3$$$-rd monster becomes equal to $$$\\max(0, 0-0)=0$$$; <\/li><li> the $$$3$$$-rd monster attacks the $$$1$$$-st monster, after the attack the energy level of the $$$1$$$-st monster becomes equal to $$$\\max(0, 2-0)=2$$$. <\/li><\/ul><p>After each of the next uses of the spell, energy levels of monsters do not change. Thus, only the $$$1$$$-st monster has a non-zero energy level in the end.<\/p><p>In the second test case, both monsters initially have zero energy level.<\/p><\/div><\/div>"}, {"contestId": 1146, "index": "G", "name": "Zoning Restrictions", "rating": 2700, "solvedCount": 1139, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. Zoning Restrictions<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are planning to build housing on a street. There are $$$n$$$ spots available on the street on which you can build a house. The spots are labeled from $$$1$$$ to $$$n$$$ from left to right. In each spot, you can build a house with an integer height between $$$0$$$ and $$$h$$$.<\/p><p>In each spot, if a house has height $$$a$$$, you can gain $$$a^2$$$ dollars from it.<\/p><p>The city has $$$m$$$ zoning restrictions though. The $$$i$$$-th restriction says that if the tallest house from spots $$$l_i$$$ to $$$r_i$$$ is strictly more than $$$x_i$$$, you must pay a fine of $$$c_i$$$.<\/p><p>You would like to build houses to maximize your profit (sum of dollars gained minus fines). Determine the maximum profit possible.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains three integers $$$n,h,m$$$ ($$$1 \\leq n,h,m \\leq 50$$$)\u00a0\u2014 the number of spots, the maximum height, and the number of restrictions, respectively.<\/p><p>Each of the next $$$m$$$ lines contains four integers $$$l_i, r_i, x_i, c_i$$$ ($$$1 \\leq l_i \\leq r_i \\leq n$$$, $$$0 \\leq x_i \\leq h$$$, $$$1 \\leq c_i \\leq 5\\,000$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer denoting the maximum profit you can make.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 3 3\n1 1 1 1000\n2 2 3 1000\n3 3 2 1000\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n14\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 10 2\n2 3 8 76\n3 4 7 39\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n289\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, it's optimal to build houses with heights $$$[1, 3, 2]$$$. We get a gain of $$$1^2+3^2+2^2 = 14$$$. We don't violate any restrictions, so there are no fees, so the total profit is $$$14 - 0 = 14$$$.<\/p><p>In the second example, it's optimal to build houses with heights $$$[10, 8, 8, 10]$$$. We get a gain of $$$10^2+8^2+8^2+10^2 = 328$$$, and we violate the second restriction for a fee of $$$39$$$, thus the total profit is $$$328-39 = 289$$$. Note that even though there isn't a restriction on building $$$1$$$, we must still limit its height to be at most $$$10$$$.<\/p><\/div><\/div>"}, {"contestId": 2144, "index": "F", "name": "Bracket Groups", "rating": 2700, "solvedCount": 1120, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Bracket Groups<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>A regular bracket sequence is a bracket sequence that can be transformed into a correct arithmetic sequence. For example: <\/p><ul> <li> bracket sequences \"<span class=\"tex-font-style-tt\">()()<\/span>\" and \"<span class=\"tex-font-style-tt\">(())<\/span>\" are regular (the resulting expressions are: \"<span class=\"tex-font-style-tt\">(1)+(1)<\/span>\" and \"<span class=\"tex-font-style-tt\">((1+1)+1)<\/span>\"); <\/li><li> bracket sequences \"<span class=\"tex-font-style-tt\">)(<\/span>\", \"<span class=\"tex-font-style-tt\">(<\/span>\" and \"<span class=\"tex-font-style-tt\">)<\/span>\" are not. <\/li><\/ul><p>You are given $$$n$$$ bracket sequences $$$s_1, s_2, \\dots, s_n$$$ (not necessarily regular) and an even integer $$$k$$$. Your task is to split all of them into groups in such a way that: <\/p><ul> <li> every bracket sequence belongs to exactly one group; <\/li><li> for each group, there exists a <span class=\"tex-font-style-bf\">regular<\/span> bracket sequence of length exactly $$$k$$$ such that every bracket sequence assigned to this group is <span class=\"tex-font-style-bf\">not a substring<\/span> of it. <\/li><\/ul><p>What is the smallest number of groups that this can be achieved for? If it's impossible to do for any number of groups, report so. Otherwise, print the groups and any valid regular bracket sequence for each group. If there are multiple answers with the smallest number of groups, print any of them.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$k$$$ ($$$1 \\le n \\le 50$$$; $$$2 \\le k \\le 50$$$; $$$k$$$ is even).<\/p><p>The $$$i$$$-th of the next $$$n$$$ lines contains a bracket sequence $$$s_i$$$ ($$$2 \\le |s_i| \\le k$$$). It consists only of characters '<span class=\"tex-font-style-tt\">(<\/span>' and '<span class=\"tex-font-style-tt\">)<\/span>'.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>If it's impossible to split all bracket sequences into groups according to the rules, then print $$$-1$$$.<\/p><p>Otherwise, print the smallest possible number of groups $$$m$$$ in the first line. Then, $$$m$$$ blocks of data should follow: <\/p><ul> <li> The first line of each block should contain a regular bracket sequence of length $$$k$$$. <\/li><li> The second line should contain a single integer $$$g$$$\u00a0\u2014 the number of bracket sequences in the current group. <\/li><li> The third line should contain $$$g$$$ integers from $$$1$$$ to $$$n$$$\u00a0\u2014 the indices of the bracket sequences that belong to the current group. <\/li><\/ul><p>None of these bracket sequences should be a substring of the chosen regular bracket sequence. Each index from $$$1$$$ to $$$n$$$ should belong to exactly one group.<\/p><p>If there are multiple answers with the smallest $$$m$$$, print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">)))<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">(((<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">(())<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n(()())\n3\n1 2 3\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">(()<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">()(<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">())<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">((((((<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n(())()\n1\n2\n()()()\n3\n1 4 3\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">2 6<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">()<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">)(<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n-1\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1799, "index": "F", "name": "Halve or Subtract", "rating": 2700, "solvedCount": 1120, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Halve or Subtract<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You have an array of positive integers $$$a_1, a_2, \\ldots, a_n$$$, of length $$$n$$$. You are also given a positive integer $$$b$$$.<\/p><p>You are allowed to perform the following operations (possibly several) times in any order: <\/p><ol> <li> Choose some $$$1 \\le i \\le n$$$, and replace $$$a_i$$$ with $$$\\lceil \\frac{a_i}{2} \\rceil$$$. Here, $$$\\lceil x \\rceil$$$ denotes the smallest integer not less than $$$x$$$. <\/li><li> Choose some $$$1 \\le i \\le n$$$, and replace $$$a_i$$$ with $$$\\max(a_i - b, 0)$$$. <\/li><\/ol><p>However, you must also follow these rules: <\/p><ul> <li> You can perform at most $$$k_1$$$ operations of type 1 in total. <\/li><li> You can perform at most $$$k_2$$$ operations of type 2 in total. <\/li><li> For all $$$1 \\le i \\le n$$$, you can perform at most $$$1$$$ operation of type 1 on element $$$a_i$$$. <\/li><li> For all $$$1 \\le i \\le n$$$, you can perform at most $$$1$$$ operation of type 2 on element $$$a_i$$$. <\/li><\/ul><p>The <span class=\"tex-font-style-it\">cost<\/span> of an array is the sum of its elements. Find the minimum cost of $$$a$$$ you can achieve by performing these operations.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Input consists of multiple test cases. The first line contains a single integer $$$t$$$, the number of test cases ($$$1 \\le t \\le 5000$$$).<\/p><p>The first line of each test case contains $$$n$$$, $$$b$$$, $$$k_1$$$, and $$$k_2$$$ ($$$1 \\le n \\le 5000$$$, $$$1 \\le b \\le 10^9$$$, $$$0 \\le k_1, k_2 \\le n$$$).<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ describing the array $$$a$$$ ($$$1 \\le a_i \\le 10^9$$$).<\/p><p>It is guaranteed the sum of $$$n$$$ over all test cases does not exceed $$$5000$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print the minimum cost of $$$a$$$ you can achieve by performing the operations.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">7<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">3 2 1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">9 3 5<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 1 2 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">1000000000 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">5 3 1 1<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">2 8 3 19 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">6 9 4 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">1 2 3 4 5 6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">3 10 3 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">1 2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">5 1 0 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">999999999 999999999 999999999 999999999 999999999<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">5 5 4 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-7\">5 9 10 7 4<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n11\n500000001\n23\n6\n0\n4999999995\n6\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, you can do the following: <\/p><ul> <li> Perform operation 2 on element $$$a_3$$$. It changes from $$$5$$$ to $$$3$$$. <\/li><li> Perform operation 1 on element $$$a_1$$$. It changes from $$$9$$$ to $$$5$$$. <\/li><\/ul><p>After these operations, the array is $$$a = [5, 3, 3]$$$ has a cost $$$5 + 3 + 3 = 11$$$. We can show that this is the minimum achievable cost.<\/p><p>In the second test case, note that we are not allowed to perform operation 1 more than once on $$$a_1$$$. So it is optimal to apply operation 1 once to each $$$a_1$$$ and $$$a_2$$$. Alternatively we could apply operation 1 only once to $$$a_1$$$, since it has no effect on $$$a_2$$$.<\/p><p>In the third test case, here is one way to achieve a cost of $$$23$$$: <\/p><ul> <li> Apply operation 1 to $$$a_4$$$. It changes from $$$19$$$ to $$$10$$$. <\/li><li> Apply operation 2 to $$$a_4$$$. It changes from $$$10$$$ to $$$7$$$. <\/li><\/ul><p>After these operations, $$$a = [2, 8, 3, 7, 3]$$$. The cost of $$$a$$$ is $$$2 + 8 + 3 + 7 + 3 = 23$$$. We can show that this is the minimum achievable cost.<\/p><\/div><\/div>"}, {"contestId": 2025, "index": "F", "name": "Choose Your Queries", "rating": 2700, "solvedCount": 1095, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Choose Your Queries<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given an array $$$a$$$, consisting of $$$n$$$ integers (numbered from $$$1$$$ to $$$n$$$). Initially, they are all zeroes.<\/p><p>You have to process $$$q$$$ queries. The $$$i$$$-th query consists of two different integers $$$x_i$$$ and $$$y_i$$$. During the $$$i$$$-th query, you have to choose an integer $$$p$$$ (which is either $$$x_i$$$ or $$$y_i$$$) and an integer $$$d$$$ (which is either $$$1$$$ or $$$-1$$$), and assign $$$a_p = a_p + d$$$.<\/p><p>After each query, every element of $$$a$$$ should be a non-negative integer.<\/p><p>Process all queries in such a way that the sum of all elements of $$$a$$$ after the last query is the minimum possible.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$q$$$ ($$$2 \\le n \\le 3 \\cdot 10^5$$$; $$$1 \\le q \\le 3 \\cdot 10^5$$$) \u2014 the number of elements in $$$a$$$ and the number of queries, respectively.<\/p><p>Then $$$q$$$ lines follow. The $$$i$$$-th of these lines contains two integers $$$x_i$$$ and $$$y_i$$$ ($$$1 \\le x_i, y_i \\le n$$$; $$$x_i \\ne y_i$$$) \u2014 the description of the $$$i$$$-th query.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query, print a line containing two characters:<\/p><ul> <li> the first character should be <span class=\"tex-font-style-tt\">x<\/span> if you choose $$$p=x_i$$$, or <span class=\"tex-font-style-tt\">y<\/span> if you choose $$$p=y_i$$$; <\/li><li> the second character should be <span class=\"tex-font-style-tt\">+<\/span> if you choose $$$d=1$$$, or <span class=\"tex-font-style-tt\">-<\/span> if you choose $$$d=-1$$$. <\/li><\/ul><p>If there are multiple answers, print any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">3 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">3 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">1 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\ny+\nx+\nx-\ny-\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">1 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">2 3<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">3 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">3 2<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\ny+\ny+\nx-\ny-\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">2 1<\/div><div class=\"test-example-line test-example-line-even test-example-line-0\">4 3<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\ny+\nx+\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1542, "index": "E2", "name": "Abnormal Permutation Pairs (hard version)", "rating": 2700, "solvedCount": 1095, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E2. Abnormal Permutation Pairs (hard version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is the hard version of the problem. The only difference between the easy version and the hard version is the constraints on $$$n$$$. You can only make hacks if both versions are solved.<\/span><\/p><p>A permutation of $$$1, 2, \\ldots, n$$$ is a sequence of $$$n$$$ integers, where each integer from $$$1$$$ to $$$n$$$ appears exactly once. For example, $$$[2,3,1,4]$$$ is a permutation of $$$1, 2, 3, 4$$$, but $$$[1,4,2,2]$$$ isn't because $$$2$$$ appears twice in it.<\/p><p>Recall that the number of inversions in a permutation $$$a_1, a_2, \\ldots, a_n$$$ is the number of pairs of indices $$$(i, j)$$$ such that $$$i  \\lt  j$$$ and $$$a_i  \\gt  a_j$$$.<\/p><p>Let $$$p$$$ and $$$q$$$ be two permutations of $$$1, 2, \\ldots, n$$$. Find the number of permutation pairs $$$(p,q)$$$ that satisfy the following conditions:<\/p><ul> <li> $$$p$$$ is lexicographically smaller than $$$q$$$. <\/li><li> the number of inversions in $$$p$$$ is greater than the number of inversions in $$$q$$$. <\/li><\/ul><p>Print the number of such pairs modulo $$$mod$$$. Note that $$$mod$$$ may not be a prime.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line contains two integers $$$n$$$ and $$$mod$$$ ($$$1\\le n\\le 500$$$, $$$1\\le mod\\le 10^9$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer, which is the answer modulo $$$mod$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 403458273\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n17<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The following are all valid pairs $$$(p,q)$$$ when $$$n=4$$$.<\/p><ul> <li> $$$p=[1,3,4,2]$$$, $$$q=[2,1,3,4]$$$, <\/li><li> $$$p=[1,4,2,3]$$$, $$$q=[2,1,3,4]$$$, <\/li><li> $$$p=[1,4,3,2]$$$, $$$q=[2,1,3,4]$$$, <\/li><li> $$$p=[1,4,3,2]$$$, $$$q=[2,1,4,3]$$$, <\/li><li> $$$p=[1,4,3,2]$$$, $$$q=[2,3,1,4]$$$, <\/li><li> $$$p=[1,4,3,2]$$$, $$$q=[3,1,2,4]$$$, <\/li><li> $$$p=[2,3,4,1]$$$, $$$q=[3,1,2,4]$$$, <\/li><li> $$$p=[2,4,1,3]$$$, $$$q=[3,1,2,4]$$$, <\/li><li> $$$p=[2,4,3,1]$$$, $$$q=[3,1,2,4]$$$, <\/li><li> $$$p=[2,4,3,1]$$$, $$$q=[3,1,4,2]$$$, <\/li><li> $$$p=[2,4,3,1]$$$, $$$q=[3,2,1,4]$$$, <\/li><li> $$$p=[2,4,3,1]$$$, $$$q=[4,1,2,3]$$$, <\/li><li> $$$p=[3,2,4,1]$$$, $$$q=[4,1,2,3]$$$, <\/li><li> $$$p=[3,4,1,2]$$$, $$$q=[4,1,2,3]$$$, <\/li><li> $$$p=[3,4,2,1]$$$, $$$q=[4,1,2,3]$$$, <\/li><li> $$$p=[3,4,2,1]$$$, $$$q=[4,1,3,2]$$$, <\/li><li> $$$p=[3,4,2,1]$$$, $$$q=[4,2,1,3]$$$. <\/li><\/ul><\/div><\/div>"}, {"contestId": 1179, "index": "D", "name": "Fedor Runs for President", "rating": 2700, "solvedCount": 1092, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Fedor Runs for President<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Fedor runs for president of Byteland! In the debates, he will be asked how to solve Byteland's transport problem. It's a really hard problem because of Byteland's transport system is now a tree (connected graph without cycles). Fedor's team has found out in the ministry of transport of Byteland that there is money in the budget only for one additional road. In the debates, he is going to say that he will build this road as a way to maximize the number of distinct simple paths in the country. A simple path is a path which goes through every vertex no more than once. Two simple paths are named distinct if sets of their edges are distinct. <\/p><p>But Byteland's science is deteriorated, so Fedor's team hasn't succeeded to find any scientists to answer how many distinct simple paths they can achieve after adding exactly one edge on the transport system?<\/p><p>Help Fedor to solve it.<\/p><p>An edge can be added between vertices that are already connected, but it can't be a loop.<\/p><p>In this problem, we consider only simple paths of length at least two.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$2 \\leq n \\leq 500\\ 000$$$)\u00a0\u2014 number of vertices in Byteland's transport system.<\/p><p>Each of the following $$$n - 1$$$ lines contains two integers $$$v_i$$$ and $$$u_i$$$ ($$$1 \\leq v_i, u_i \\leq n$$$). It's guaranteed that the graph is tree.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print exactly one integer\u00a0\u2014 a maximal number of simple paths that can be achieved after adding one edge.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n1 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n1 2\n1 3\n1 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n11\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n1 2\n1 3\n3 4\n3 5\n4 6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n29\n<\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1453, "index": "F", "name": "Even Harder", "rating": 2700, "solvedCount": 1085, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Even Harder<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Gildong is now developing a puzzle game. The puzzle consists of $$$n$$$ platforms numbered from $$$1$$$ to $$$n$$$. The player plays the game as a character that can stand on each platform and the goal of the game is to move the character from the $$$1$$$-st platform to the $$$n$$$-th platform.<\/p><p>The $$$i$$$-th platform is labeled with an integer $$$a_i$$$ ($$$0 \\le a_i \\le n-i$$$). When the character is standing on the $$$i$$$-th platform, the player can move the character to any of the $$$j$$$-th platforms where $$$i+1 \\le j \\le i+a_i$$$. If the character is on the $$$i$$$-th platform where $$$a_i=0$$$ and $$$i \\ne n$$$, the player loses the game.<\/p><p>Since Gildong thinks the current game is not hard enough, he wants to make it even harder. He wants to change some (possibly zero) labels to $$$0$$$ so that there remains exactly one way to win. He wants to modify the game as little as possible, so he's asking you to find the <span class=\"tex-font-style-bf\">minimum<\/span> number of platforms that should have their labels changed. Two ways are different if and only if there exists a platform the character gets to in one way but not in the other way.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains one or more test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 500$$$).<\/p><p>Each test case contains two lines. The first line of each test case consists of an integer $$$n$$$ ($$$2 \\le n \\le 3000$$$) \u2014 the number of platforms of the game.<\/p><p>The second line of each test case contains $$$n$$$ integers. The $$$i$$$-th integer is $$$a_i$$$ ($$$0 \\le a_i \\le n-i$$$) \u2014 the integer of the $$$i$$$-th platform.<\/p><p>It is guaranteed that: <\/p><ul> <li> For each test case, there is at least one way to win initially. <\/li><li> The sum of $$$n$$$ in all test cases doesn't exceed $$$3000$$$. <\/li><\/ul><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print one integer \u2014 the minimum number of different labels that should be changed to $$$0$$$ so that there remains exactly one way to win.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n4\n1 1 1 0\n5\n4 3 2 1 0\n9\n4 1 4 2 1 0 2 1 0\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n3\n2\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first case, the player can only move to the next platform until they get to the $$$4$$$-th platform. Since there is already only one way to win, the answer is zero.<\/p><p>In the second case, Gildong can change $$$a_2$$$, $$$a_3$$$, and $$$a_4$$$ to $$$0$$$ so that the game becomes $$$4$$$ $$$0$$$ $$$0$$$ $$$0$$$ $$$0$$$. Now the only way the player can win is to move directly from the $$$1$$$-st platform to the $$$5$$$-th platform.<\/p><p>In the third case, Gildong can change $$$a_2$$$ and $$$a_8$$$ to $$$0$$$, then the only way to win is to move in the following way: $$$1$$$ \u2013 $$$3$$$ \u2013 $$$7$$$ \u2013 $$$9$$$.<\/p><\/div><\/div>"}, {"contestId": 1617, "index": "E", "name": "Christmas Chocolates", "rating": 2700, "solvedCount": 1081, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Christmas Chocolates<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Christmas is coming, Icy has just received a box of chocolates from her grandparents! The box contains $$$n$$$ chocolates. The $$$i$$$-th chocolate has a non-negative integer type $$$a_i$$$.<\/p><p>Icy believes that good things come in pairs. Unfortunately, all types of chocolates are distinct (all $$$a_i$$$ are <span class=\"tex-font-style-bf\">distinct<\/span>). Icy wants to make at least one pair of chocolates the same type. <\/p><p>As a result, she asks her grandparents to perform some <span class=\"tex-font-style-it\">chocolate exchanges<\/span>. <span class=\"tex-font-style-bf\">Before performing any chocolate exchanges<\/span>, Icy chooses two chocolates with indices $$$x$$$ and $$$y$$$ ($$$1 \\le x, y \\le n$$$, $$$x \\ne y$$$).<\/p><p>In a <span class=\"tex-font-style-it\">chocolate exchange<\/span>, Icy's grandparents choose a non-negative integer $$$k$$$, such that $$$2^k \\ge a_x$$$, and change the type of the chocolate $$$x$$$ from $$$a_x$$$ to $$$2^k - a_x$$$ (that is, perform $$$a_x := 2^k - a_x$$$).<\/p><p>The chocolate exchanges will be stopped only when $$$a_x = a_y$$$. <span class=\"tex-font-style-bf\">Note that other pairs of equal chocolate types do not stop the procedure.<\/span><\/p><p>Icy's grandparents are smart, so they would choose the sequence of chocolate exchanges that <span class=\"tex-font-style-bf\">minimizes<\/span> the number of exchanges needed. Since Icy likes causing trouble, she wants to <span class=\"tex-font-style-bf\">maximize<\/span> the minimum number of exchanges needed by choosing $$$x$$$ and $$$y$$$ appropriately. She wonders what is the optimal pair $$$(x, y)$$$ such that the minimum number of exchanges needed is maximized across all possible choices of $$$(x, y)$$$.<\/p><p>Since Icy is not good at math, she hopes that you can help her solve the problem.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains a single integer $$$n$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of chocolates.<\/p><p>The second line of the input contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$0 \\le a_i \\le 10^9$$$).<\/p><p>It is guaranteed that all $$$a_i$$$ are distinct.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output three integers $$$x$$$, $$$y$$$, and $$$m$$$.<\/p><p>$$$x$$$ and $$$y$$$ are indices of the optimal chocolates to perform exchanges on. Your output must satisfy $$$1 \\le x, y \\le n$$$, $$$x \\ne y$$$.<\/p><p>$$$m$$$ is the number of exchanges needed to obtain $$$a_x = a_y$$$. We can show that $$$m \\le 10^9$$$ for any pair of chocolates.<\/p><p>If there are multiple solutions, output any.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n5 6 7 8 9\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2 5 5\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n4 8\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1 2 2<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, the minimum number of exchanges needed to exchange a chocolate of type $$$6$$$ to a chocolate of type $$$9$$$ is $$$5$$$. The sequence of exchanges is as follows: $$$6 \\rightarrow 2 \\rightarrow 0 \\rightarrow 1 \\rightarrow 7 \\rightarrow 9$$$.<\/p><p>In the second test case, the minimum number of exchanges needed to exchange a chocolate of type $$$4$$$ to a chocolate of type $$$8$$$ is $$$2$$$. The sequence of exchanges is as follows: $$$4 \\rightarrow 0 \\rightarrow 8$$$.<\/p><\/div><\/div>"}, {"contestId": 878, "index": "C", "name": "Tournament", "rating": 2700, "solvedCount": 1076, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Tournament<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Recently a tournament in <span class=\"tex-span\"><i>k<\/i><\/span> kinds of sports has begun in Berland. Vasya wants to make money on the bets.<\/p><p>The scheme of the tournament is very mysterious and not fully disclosed. Competitions are held back to back, each of them involves two sportsmen who have not left the tournament yet. Each match can be held in any of the <span class=\"tex-span\"><i>k<\/i><\/span> kinds of sport. Loser leaves the tournament. The last remaining sportsman becomes the winner. Apart of this, the scheme can be arbitrary, it is not disclosed in advance.<\/p><p>Vasya knows powers of sportsmen in each kind of sport. He believes that the sportsmen with higher power always wins.<\/p><p>The tournament is held every year, and each year one new participant joins it. In the first tournament, only one sportsman has participated, in the second there were two sportsmen, and so on. Vasya has been watching the tournament for the last <span class=\"tex-span\"><i>n<\/i><\/span> years. Help him to find the number of possible winners for each of the <span class=\"tex-span\"><i>n<\/i><\/span> tournaments.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20095\u00b710<sup class=\"upper-index\">4<\/sup><\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u200910<\/span>) \u2014 the number of tournaments and the number of kinds of sport, respectively.<\/p><p>Each of the next <span class=\"tex-span\"><i>n<\/i><\/span> lines contains <span class=\"tex-span\"><i>k<\/i><\/span> integers <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\"><i>i<\/i>1<\/sub>,\u2009<i>s<\/i><sub class=\"lower-index\"><i>i<\/i>2<\/sub>,\u2009...,\u2009<i>s<\/i><sub class=\"lower-index\"><i>ik<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>s<\/i><sub class=\"lower-index\"><i>ij<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>), where <span class=\"tex-span\"><i>s<\/i><sub class=\"lower-index\"><i>ij<\/i><\/sub><\/span> is the power of the <span class=\"tex-span\"><i>i<\/i><\/span>-th sportsman in the <span class=\"tex-span\"><i>j<\/i><\/span>-th kind of sport. The sportsman with higher powers always wins. It's guaranteed that for any kind of sport all of these powers are distinct.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each of the <span class=\"tex-span\"><i>n<\/i><\/span> tournaments output

<script>
    const PROBLEMS = [{"contestId": 13, "index": "E", "name": "Holes", "rating": 2700, "solvedCount": 8653, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Holes<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>64 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Little Petya likes to play a lot. Most of all he likes to play a game \u00abHoles\u00bb. This is a game for one person with following rules:<\/p><p>There are <span class=\"tex-span\"><i>N<\/i><\/span> holes located in a single row and numbered from left to right with numbers from 1 to <span class=\"tex-span\"><i>N<\/i><\/span>. Each hole has it's own power (hole number <span class=\"tex-span\"><i>i<\/i><\/span> has the power <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>). If you throw a ball into hole <span class=\"tex-span\"><i>i<\/i><\/span> it will immediately jump to hole <span class=\"tex-span\"><i>i<\/i>\u2009+\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, then it will jump out of it and so on. If there is no hole with such number, the ball will just jump out of the row. On each of the <span class=\"tex-span\"><i>M<\/i><\/span> moves the player can perform one of two actions: <\/p><ul> <li> Set the power of the hole <span class=\"tex-span\"><i>a<\/i><\/span> to value <span class=\"tex-span\"><i>b<\/i><\/span>. <\/li><li> Throw a ball into the hole <span class=\"tex-span\"><i>a<\/i><\/span> and count the number of jumps of a ball before it jump out of the row and also write down the number of the hole from which it jumped out just before leaving the row. <\/li><\/ul><p>Petya is not good at math, so, as you have already guessed, you are to perform all computations.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>N<\/i><\/span> and <span class=\"tex-span\"><i>M<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>N<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>M<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the number of holes in a row and the number of moves. The second line contains <span class=\"tex-span\"><i>N<\/i><\/span> positive integers not exceeding <span class=\"tex-span\"><i>N<\/i><\/span> \u2014 initial values of holes power. The following <span class=\"tex-span\"><i>M<\/i><\/span> lines describe moves made by Petya. Each of these line can be one of the two types: <\/p><ul> <li> <span class=\"tex-span\">0<\/span> <span class=\"tex-span\"><i>a<\/i><\/span> <span class=\"tex-span\"><i>b<\/i><\/span> <\/li><li> <span class=\"tex-span\">1<\/span> <span class=\"tex-span\"><i>a<\/i><\/span> <\/li><\/ul> Type <span class=\"tex-span\">0<\/span> means that it is required to set the power of hole <span class=\"tex-span\"><i>a<\/i><\/span> to <span class=\"tex-span\"><i>b<\/i><\/span>, and type <span class=\"tex-span\">1<\/span> means that it is required to throw a ball into the <span class=\"tex-span\"><i>a<\/i><\/span>-th hole. Numbers <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span> are positive integers do not exceeding <span class=\"tex-span\"><i>N<\/i><\/span>.<\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each move of the type <span class=\"tex-span\">1<\/span> output two space-separated numbers on a separate line \u2014 the number of the last hole the ball visited before leaving the row and the number of jumps it made.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>8 5<br/>1 1 1 1 1 2 8 2<br/>1 1<br/>0 1 3<br/>1 1<br/>0 3 4<br/>1 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>8 7<br/>8 5<br/>7 3<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 383, "index": "E", "name": "Vowels", "rating": 2700, "solvedCount": 4754, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Vowels<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Iahubina is tired of so many complicated languages, so she decided to invent a new, simple language. She already made a dictionary consisting of <span class=\"tex-span\"><i>n<\/i><\/span> 3-words. A 3-word is a sequence of exactly <span class=\"tex-span\">3<\/span> lowercase letters of the first 24 letters of the English alphabet (<span class=\"tex-span\"><i>a<\/i><\/span> to <span class=\"tex-span\"><i>x<\/i><\/span>). She decided that some of the letters are vowels, and all the others are consonants. The whole language is based on a simple rule: any word that contains at least one vowel is <span class=\"tex-font-style-it\">correct<\/span>.<\/p><p>Iahubina forgot which letters are the vowels, and wants to find some possible correct sets of vowels. She asks Iahub questions. In each question, she will give Iahub a set of letters considered vowels (in this question). For each question she wants to know how many words of the dictionary are correct, considering the given set of vowels.<\/p><p>Iahubina wants to know the <span class=\"tex-span\"><i>xor<\/i><\/span> of the squared answers to all the possible questions. There are <span class=\"tex-span\">2<sup class=\"upper-index\">24<\/sup><\/span> different questions, they are all subsets of the set of the first 24 letters of the English alphabet. Help Iahub find that number.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer, <span class=\"tex-span\"><i>n<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">4<\/sup>)<\/span>. Each of the next <span class=\"tex-span\"><i>n<\/i><\/span> lines contains a 3-word consisting of <span class=\"tex-span\">3<\/span> lowercase letters. There will be no two identical 3-words.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one number, the <span class=\"tex-span\"><i>xor<\/i><\/span> of the squared answers to the queries.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>abc<br/>aaa<br/>ada<br/>bcd<br/>def<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>0<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 932, "index": "F", "name": "Escape Through Leaf", "rating": 2700, "solvedCount": 4415, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Escape Through Leaf<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a tree with <span class=\"tex-span\"><i>n<\/i><\/span> nodes (numbered from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span>) rooted at node <span class=\"tex-span\">1<\/span>. Also, each node has two values associated with it. The values for <span class=\"tex-span\"><i>i<\/i><\/span>-th node are <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>.<\/p><p>You can jump from a node to any node in its subtree. The cost of one jump from node <span class=\"tex-span\"><i>x<\/i><\/span> to node <span class=\"tex-span\"><i>y<\/i><\/span> is the product of <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>x<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>y<\/i><\/sub><\/span>. The total cost of a path formed by one or more jumps is sum of costs of individual jumps. For every node, calculate the minimum total cost to reach any leaf from that node. Pay attention, that root can never be leaf, even if it has degree <span class=\"tex-span\">1<\/span>.<\/p><p>Note that you cannot jump from a node to itself.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of input contains an integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>)\u00a0\u2014 the number of nodes in the tree.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> space-separated integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>,\u2009\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009\u2009...,\u2009\u2009<i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub>(\u2009-\u200910<sup class=\"upper-index\">5<\/sup>\u2009\u2009\u2264\u2009\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2009\u2264\u2009\u200910<sup class=\"upper-index\">5<\/sup>)<\/span>.<\/p><p>The third line contains <span class=\"tex-span\"><i>n<\/i><\/span> space-separated integers <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\">1<\/sub>,\u2009\u2009<i>b<\/i><sub class=\"lower-index\">2<\/sub>,\u2009\u2009...,\u2009\u2009<i>b<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub>(\u2009-\u200910<sup class=\"upper-index\">5<\/sup>\u2009\u2009\u2264\u2009\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2009\u2264\u2009\u200910<sup class=\"upper-index\">5<\/sup>)<\/span>.<\/p><p>Next <span class=\"tex-span\"><i>n<\/i>\u2009\u2009-\u2009\u20091<\/span> lines contains two space-separated integers <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009\u2009<i>n<\/i><\/span>) describing edge between nodes <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> in the tree.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output <span class=\"tex-span\"><i>n<\/i><\/span> space-separated integers, <span class=\"tex-span\"><i>i<\/i><\/span>-th of which denotes the minimum cost of a path from node <span class=\"tex-span\"><i>i<\/i><\/span> to reach any leaf.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>2 10 -1<br/>7 -7 5<br/>2 3<br/>2 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>10 50 0 <\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>5 -10 5 7<br/>-8 -80 -3 -10<br/>2 1<br/>2 4<br/>1 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>-300 100 0 0 <\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, node <span class=\"tex-span\">3<\/span> is already a leaf, so the cost is <span class=\"tex-span\">0<\/span>. For node <span class=\"tex-span\">2<\/span>, jump to node <span class=\"tex-span\">3<\/span> with cost <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">2<\/sub>\u2009\u00d7\u2009<i>b<\/i><sub class=\"lower-index\">3<\/sub>\u2009=\u200950<\/span>. For node <span class=\"tex-span\">1<\/span>, jump directly to node <span class=\"tex-span\">3<\/span> with cost <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>\u2009\u00d7\u2009<i>b<\/i><sub class=\"lower-index\">3<\/sub>\u2009=\u200910<\/span>.<\/p><p>In the second example, node <span class=\"tex-span\">3<\/span> and node <span class=\"tex-span\">4<\/span> are leaves, so the cost is <span class=\"tex-span\">0<\/span>. For node <span class=\"tex-span\">2<\/span>, jump to node <span class=\"tex-span\">4<\/span> with cost <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">2<\/sub>\u2009\u00d7\u2009<i>b<\/i><sub class=\"lower-index\">4<\/sub>\u2009=\u2009100<\/span>. For node <span class=\"tex-span\">1<\/span>, jump to node <span class=\"tex-span\">2<\/span> with cost <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>\u2009\u00d7\u2009<i>b<\/i><sub class=\"lower-index\">2<\/sub>\u2009=\u2009\u2009-\u2009400<\/span> followed by a jump from <span class=\"tex-span\">2<\/span> to <span class=\"tex-span\">4<\/span> with cost <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">2<\/sub>\u2009\u00d7\u2009<i>b<\/i><sub class=\"lower-index\">4<\/sub>\u2009=\u2009100<\/span>.<\/p><\/div><\/div>"}, {"contestId": 455, "index": "D", "name": "Serega and Fun", "rating": 2700, "solvedCount": 3939, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Serega and Fun<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Serega loves fun. However, everyone has fun in the unique manner. Serega has fun by solving query problems. One day Fedor came up with such a problem.<\/p><p>You are given an array <span class=\"tex-span\"><i>a<\/i><\/span> consisting of <span class=\"tex-span\"><i>n<\/i><\/span> positive integers and queries to it. The queries can be of two types:<\/p><ol> <li> Make a unit cyclic shift to the right on the segment from <span class=\"tex-span\"><i>l<\/i><\/span> to <span class=\"tex-span\"><i>r<\/i><\/span> (both borders inclusive). That is rearrange elements of the array in the following manner:<center class=\"tex-equation\"><span class=\"tex-span\"><i>a<\/i>[<i>l<\/i>],\u2009<i>a<\/i>[<i>l<\/i>\u2009+\u20091],\u2009...,\u2009<i>a<\/i>[<i>r<\/i>\u2009-\u20091],\u2009<i>a<\/i>[<i>r<\/i>]\u2009\u2192\u2009<i>a<\/i>[<i>r<\/i>],\u2009<i>a<\/i>[<i>l<\/i>],\u2009<i>a<\/i>[<i>l<\/i>\u2009+\u20091],\u2009...,\u2009<i>a<\/i>[<i>r<\/i>\u2009-\u20091].<\/span><\/center><\/li><li> Count how many numbers equal to <span class=\"tex-span\"><i>k<\/i><\/span> are on the segment from <span class=\"tex-span\"><i>l<\/i><\/span> to <span class=\"tex-span\"><i>r<\/i><\/span> (both borders inclusive). <\/li><\/ol><p>Fedor hurried to see Serega enjoy the problem and Serega solved it really quickly. Let's see, can you solve it?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the number of elements of the array. The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i>[1],\u2009<i>a<\/i>[2],\u2009...,\u2009<i>a<\/i>[<i>n<\/i>]<\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i>[<i>i<\/i>]\u2009\u2264\u2009<i>n<\/i><\/span>).<\/p><p>The third line contains a single integer <span class=\"tex-span\"><i>q<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>q<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the number of queries. The next <span class=\"tex-span\"><i>q<\/i><\/span> lines contain the queries.<\/p><p>As you need to respond to the queries online, the queries will be <span class=\"tex-font-style-bf\">encoded<\/span>. A query of the first type will be given in format: <span class=\"tex-span\">1<\/span> <span class=\"tex-span\"><i>l<\/i>'<sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\"><i>r<\/i>'<sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. A query of the second type will be given in format: <span class=\"tex-span\">2<\/span> <span class=\"tex-span\"><i>l<\/i>'<sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\"><i>r<\/i>'<sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\"><i>k<\/i>'<sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. All the number in input are integer. They satisfy the constraints: <span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i>'<sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>r<\/i>'<sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>k<\/i>'<sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>.<\/p><p>To decode the queries from the data given in input, you need to perform the following transformations:<\/p><center class=\"tex-equation\"><span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009=\u2009((<i>l<\/i>'<sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009+\u2009<i>lastans<\/i>\u2009-\u20091)\u00a0<i>mod<\/i>\u00a0<i>n<\/i>)\u2009+\u20091;\u00a0<i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009=\u2009((<i>r<\/i>'<sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009+\u2009<i>lastans<\/i>\u2009-\u20091)\u00a0<i>mod<\/i>\u00a0<i>n<\/i>)\u2009+\u20091;\u00a0<i>k<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009=\u2009((<i>k<\/i>'<sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009+\u2009<i>lastans<\/i>\u2009-\u20091)\u00a0<i>mod<\/i>\u00a0<i>n<\/i>)\u2009+\u20091.<\/span><\/center><p>Where <span class=\"tex-span\"><i>lastans<\/i><\/span> is the last reply to the query of the 2-nd type (initially, <span class=\"tex-span\"><i>lastans<\/i>\u2009=\u20090<\/span>). If after transformation <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is greater than <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, you must swap these values.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query of the 2-nd type print the answer on a single line.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>7<br/>6 6 2 7 4 2 5<br/>7<br/>1 3 6<br/>2 2 4 2<br/>2 2 4 7<br/>2 2 2 5<br/>1 2 6<br/>1 1 4<br/>2 1 7 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/>1<br/>0<br/>0<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>8<br/>8 4 2 2 7 7 8 8<br/>8<br/>1 8 8<br/>2 8 1 7<br/>1 8 1<br/>1 7 3<br/>2 8 8 3<br/>1 1 4<br/>1 2 7<br/>1 4 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/>0<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1270, "index": "G", "name": "Subset with Zero Sum", "rating": 2700, "solvedCount": 3227, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. Subset with Zero Sum<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$, such that for each $$$1\\le i \\le n$$$ holds $$$i-n\\le a_i\\le i-1$$$.<\/p><p>Find some nonempty subset of these integers, whose sum is equal to $$$0$$$. It can be shown that such a subset exists under given constraints. If there are several possible subsets with zero-sum, you can find any of them.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^6$$$). The description of the test cases follows.<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1\\le n \\le 10^6$$$).<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\dots, a_n$$$ ($$$i-n \\le a_i \\le i-1$$$).<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$10^6$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output two lines.<\/p><p>In the first line, output $$$s$$$ ($$$1\\le s \\le n$$$)\u00a0\u2014 the number of elements in your subset.<\/p><p>In the second line, output $$$s$$$ integers $$$i_1, i_2, \\dots, i_s$$$ ($$$1\\le i_k \\le n$$$). All integers have to be pairwise different, and $$$a_{i_1} + a_{i_2} + \\dots + a_{i_s}$$$ has to be equal to $$$0$$$. If there are several possible subsets with zero-sum, you can find any of them.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n5\n0 1 2 3 4\n4\n-3 1 1 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n1 \n4\n1 4 3 2 \n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, we get sum is $$$a_1 = 0$$$.<\/p><p>In the second example, we get sum is $$$a_1 + a_4 + a_3 + a_2 = 0$$$.<\/p><\/div><\/div>"}, {"contestId": 906, "index": "D", "name": "Power Tower", "rating": 2700, "solvedCount": 2872, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Power Tower<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4.5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Priests of the Quetzalcoatl cult want to build a tower to represent a power of their god. Tower is usually made of power-charged rocks. It is built with the help of rare magic by levitating the current top of tower and adding rocks at its bottom. If top, which is built from <span class=\"tex-span\"><i>k<\/i>\u2009-\u20091<\/span> rocks, possesses power <span class=\"tex-span\"><i>p<\/i><\/span> and we want to add the rock charged with power <span class=\"tex-span\"><i>w<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span> then value of power of a new tower will be <span class=\"tex-span\">{<i>w<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>}<sup class=\"upper-index\"><i>p<\/i><\/sup><\/span>. <\/p><p>Rocks are added from the last to the first. That is for sequence <span class=\"tex-span\"><i>w<\/i><sub class=\"lower-index\">1<\/sub>,\u2009...,\u2009<i>w<\/i><sub class=\"lower-index\"><i>m<\/i><\/sub><\/span> value of power will be<\/p><center class=\"tex-equation\"><img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/d4ef378778da9b60d06657e4d0d62af081aedc49.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/center><p>After tower is built, its power may be extremely large. But still priests want to get some information about it, namely they want to know a number called cumulative power which is the true value of power taken modulo <span class=\"tex-span\"><i>m<\/i><\/span>. Priests have <span class=\"tex-span\"><i>n<\/i><\/span> rocks numbered from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span>. They ask you to calculate which value of cumulative power will the tower possess if they will build it from rocks numbered <span class=\"tex-span\"><i>l<\/i>,\u2009<i>l<\/i>\u2009+\u20091,\u2009...,\u2009<i>r<\/i><\/span>. <\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>First line of input contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>) and <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>).<\/p><p>Second line of input contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>w<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>w<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) which is the power of rocks that priests have.<\/p><p>Third line of input contains single integer <span class=\"tex-span\"><i>q<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>q<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>) which is amount of queries from priests to you.<\/p><p><span class=\"tex-span\"><i>k<\/i><sup class=\"upper-index\"><i>th<\/i><\/sup><\/span> of next <span class=\"tex-span\"><i>q<\/i><\/span> lines contains two integers <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>r<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>l<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>\u2009\u2264\u2009<i>r<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>). <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output <span class=\"tex-span\"><i>q<\/i><\/span> integers. <span class=\"tex-span\"><i>k<\/i><\/span>-th of them must be the amount of cumulative power the tower will have if is built from rocks <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>,\u2009<i>l<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>\u2009+\u20091,\u2009...,\u2009<i>r<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub><\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>6 1000000000<br/>1 2 2 3 3 3<br/>8<br/>1 1<br/>1 6<br/>2 2<br/>2 3<br/>2 4<br/>4 4<br/>4 5<br/>4 6<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/>1<br/>2<br/>4<br/>256<br/>3<br/>27<br/>597484987<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p><span class=\"tex-span\">3<sup class=\"upper-index\">27<\/sup>\u2009=\u20097625597484987<\/span><\/p><\/div><\/div>"}, {"contestId": 715, "index": "C", "name": "Digit Tree", "rating": 2700, "solvedCount": 2825, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Digit Tree<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>ZS the Coder has a large tree. It can be represented as an undirected connected graph of <span class=\"tex-span\"><i>n<\/i><\/span> vertices numbered from <span class=\"tex-span\">0<\/span> to <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> and <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> edges between them. There is a single <span class=\"tex-font-style-bf\">nonzero<\/span> digit written on each edge.<\/p><p>One day, ZS the Coder was bored and decided to investigate some properties of the tree. He chose a positive integer <span class=\"tex-span\"><i>M<\/i><\/span>, which is <span class=\"tex-font-style-bf\">coprime<\/span> to <span class=\"tex-span\">10<\/span>, i.e. <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/fa46c78ff9ecabee5b4e74c357a3aee84f6f4f54.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>.<\/p><p>ZS consider an <span class=\"tex-font-style-bf\">ordered pair<\/span> of distinct vertices <span class=\"tex-span\">(<i>u<\/i>,\u2009<i>v<\/i>)<\/span> <span class=\"tex-font-style-it\">interesting<\/span> when if he would follow the shortest path from vertex <span class=\"tex-span\"><i>u<\/i><\/span> to vertex <span class=\"tex-span\"><i>v<\/i><\/span> and write down all the digits he encounters on his path in the same order, he will get a decimal representaion of an integer divisible by <span class=\"tex-span\"><i>M<\/i><\/span>.<\/p><p>Formally, ZS consider an ordered pair of distinct vertices <span class=\"tex-span\">(<i>u<\/i>,\u2009<i>v<\/i>)<\/span> interesting if the following states true:<\/p><ul> <li> Let <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub>\u2009=\u2009<i>u<\/i>,\u2009<i>a<\/i><sub class=\"lower-index\">2<\/sub>,\u2009...,\u2009<i>a<\/i><sub class=\"lower-index\"><i>k<\/i><\/sub>\u2009=\u2009<i>v<\/i><\/span> be the sequence of vertices on the shortest path from <span class=\"tex-span\"><i>u<\/i><\/span> to <span class=\"tex-span\"><i>v<\/i><\/span> in the order of encountering them; <\/li><li> Let <span class=\"tex-span\"><i>d<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>i<\/i>\u2009&lt;\u2009<i>k<\/i><\/span>) be the digit written on the edge between vertices <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i>\u2009+\u20091<\/sub><\/span>; <\/li><li> The integer <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/190a896ddf6cde6da388fdc81f0ddc179ba13787.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> is divisible by <span class=\"tex-span\"><i>M<\/i><\/span>. <\/li><\/ul><p>Help ZS the Coder find the number of interesting pairs!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains two integers, <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>M<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009100\u2009000<\/span>,<span class=\"tex-span\">\u20091\u2009\u2264\u2009<i>M<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>, <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/04163f181aee6ea0709922af5a3f8cc700b28f61.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>)\u00a0\u2014 the number of vertices and the number ZS has chosen respectively.<\/p><p>The next <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> lines contain three integers each. <span class=\"tex-span\"><i>i<\/i><\/span>-th of them contains <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, denoting an edge between vertices <span class=\"tex-span\"><i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and <span class=\"tex-span\"><i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> with digit <span class=\"tex-span\"><i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> written on it (<span class=\"tex-span\">0\u2009\u2264\u2009<i>u<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>v<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009&lt;\u2009<i>n<\/i>,\u2009\u20091\u2009\u2264\u2009<i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u20099<\/span>).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer\u00a0\u2014 the number of interesting (by ZS the Coder's consideration) pairs.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>6 7<br/>0 1 2<br/>4 2 4<br/>2 0 1<br/>3 0 9<br/>2 5 7<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>7<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 11<br/>1 2 3<br/>2 0 3<br/>3 0 3<br/>4 3 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>8<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample case, the interesting pairs are <span class=\"tex-span\">(0,\u20094),\u2009(1,\u20092),\u2009(1,\u20095),\u2009(3,\u20092),\u2009(2,\u20095),\u2009(5,\u20092),\u2009(3,\u20095)<\/span>. The numbers that are formed by these pairs are <span class=\"tex-span\">14,\u200921,\u2009217,\u200991,\u20097,\u20097,\u2009917<\/span> respectively, which are all multiples of <span class=\"tex-span\">7<\/span>. Note that <span class=\"tex-span\">(2,\u20095)<\/span> and <span class=\"tex-span\">(5,\u20092)<\/span> are considered different. <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/6a2fbbeb0bf87381288fdd784d6fa2b5e356e9b0.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>In the second sample case, the interesting pairs are <span class=\"tex-span\">(4,\u20090),\u2009(0,\u20094),\u2009(3,\u20092),\u2009(2,\u20093),\u2009(0,\u20091),\u2009(1,\u20090),\u2009(4,\u20091),\u2009(1,\u20094)<\/span>, and <span class=\"tex-span\">6<\/span> of these pairs give the number <span class=\"tex-span\">33<\/span> while <span class=\"tex-span\">2<\/span> of them give the number <span class=\"tex-span\">3333<\/span>, which are all multiples of <span class=\"tex-span\">11<\/span>.<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/b7e4311b56cf89412696c183ad12eb9272db4d95.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 235, "index": "C", "name": "Cyclical Quest", "rating": 2700, "solvedCount": 2596, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Cyclical Quest<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Some days ago, WJMZBMR learned how to answer the query \"how many times does a string <span class=\"tex-span\"><i>x<\/i><\/span> occur in a string <span class=\"tex-span\"><i>s<\/i><\/span>\" quickly by preprocessing the string <span class=\"tex-span\"><i>s<\/i><\/span>. But now he wants to make it harder.<\/p><p>So he wants to ask \"how many consecutive substrings of <span class=\"tex-span\"><i>s<\/i><\/span> are cyclical isomorphic to a given string <span class=\"tex-span\"><i>x<\/i><\/span>\". You are given string <span class=\"tex-span\"><i>s<\/i><\/span> and <span class=\"tex-span\"><i>n<\/i><\/span> strings <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, for each string <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> find, how many consecutive substrings of <span class=\"tex-span\"><i>s<\/i><\/span> are cyclical isomorphic to <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>.<\/p><p>Two strings are called <span class=\"tex-font-style-it\">cyclical isomorphic<\/span> if one can rotate one string to get the other one. 'Rotate' here means 'to take some consecutive chars (maybe none) from the beginning of a string and put them back at the end of the string in the same order'. For example, string \"<span class=\"tex-font-style-tt\">abcde<\/span>\" can be rotated to string \"<span class=\"tex-font-style-tt\">deabc<\/span>\". We can take characters \"<span class=\"tex-font-style-tt\">abc<\/span>\" from the beginning and put them at the end of \"<span class=\"tex-font-style-tt\">de<\/span>\".<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a non-empty string <span class=\"tex-span\"><i>s<\/i><\/span>. The length of string <span class=\"tex-span\"><i>s<\/i><\/span> is not greater than <span class=\"tex-span\">10<sup class=\"upper-index\">6<\/sup><\/span> characters.<\/p><p>The second line contains an integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the number of queries. Then <span class=\"tex-span\"><i>n<\/i><\/span> lines follow: the <span class=\"tex-span\"><i>i<\/i><\/span>-th line contains the string <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> \u2014 the string for the <span class=\"tex-span\"><i>i<\/i><\/span>-th query. The total length of <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> is less than or equal to <span class=\"tex-span\">10<sup class=\"upper-index\">6<\/sup><\/span> characters.<\/p><p>In this problem, strings only consist of lowercase English letters.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each query <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> print a single integer that shows how many consecutive substrings of <span class=\"tex-span\"><i>s<\/i><\/span> are cyclical isomorphic to <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. Print the answers to the queries in the order they are given in the input.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>baabaabaaa<br/>5<br/>a<br/>ba<br/>baa<br/>aabaa<br/>aaba<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>7<br/>5<br/>7<br/>3<br/>5<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>aabbaa<br/>3<br/>aa<br/>aabb<br/>abba<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/>3<br/>3<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 293, "index": "E", "name": "Close Vertices", "rating": 2700, "solvedCount": 2167, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Close Vertices<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>You've got a weighted tree, consisting of <span class=\"tex-span\"><i>n<\/i><\/span> vertices. Each edge has a non-negative weight. The length of the path between any two vertices of the tree is the number of edges in the path. The weight of the path is the total weight of all edges it contains. <\/p><p>Two vertices are close if there exists a path of length at most <span class=\"tex-span\"><i>l<\/i><\/span> between them and a path of weight at most <span class=\"tex-span\"><i>w<\/i><\/span> between them. Count the number of pairs of vertices <span class=\"tex-span\"><i>v<\/i>,\u2009<i>u<\/i><\/span> <span class=\"tex-span\">(<i>v<\/i>\u2009&lt;\u2009<i>u<\/i>)<\/span>, such that vertices <span class=\"tex-span\"><i>v<\/i><\/span> and <span class=\"tex-span\"><i>u<\/i><\/span> are close.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains three integers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>l<\/i><\/span> and <span class=\"tex-span\"><i>w<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">5<\/sup>,\u20091\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>n<\/i>,\u20090\u2009\u2264\u2009<i>w<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup>)<\/span>. The next <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091<\/span> lines contain the descriptions of the tree edges. The <span class=\"tex-span\"><i>i<\/i><\/span>-th line contains two integers <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009&lt;\u2009(<i>i<\/i>\u2009+\u20091),\u20090\u2009\u2264\u2009<i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">4<\/sup>)<\/span>, that mean that the <span class=\"tex-span\"><i>i<\/i><\/span>-th edge connects vertex <span class=\"tex-span\">(<i>i<\/i>\u2009+\u20091)<\/span> and <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> and has weight <span class=\"tex-span\"><i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>.<\/p><p>Consider the tree vertices indexed from 1 to <span class=\"tex-span\"><i>n<\/i><\/span> in some way.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single integer \u2014 the number of close pairs.<\/p><p>Please, do not use the <span class=\"tex-font-style-tt\">%lld<\/span> specifier to read or write 64-bit integers in \u0421++. It is preferred to use the <span class=\"tex-font-style-tt\">cin<\/span>, <span class=\"tex-font-style-tt\">cout<\/span> streams or the <span class=\"tex-font-style-tt\">%I64d<\/span> specifier.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 4 6<br/>1 3<br/>1 4<br/>1 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>4<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>6 2 17<br/>1 3<br/>2 5<br/>2 13<br/>1 6<br/>5 9<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>9<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1601, "index": "D", "name": "Difficult Mountain", "rating": 2700, "solvedCount": 2076, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Difficult Mountain<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>A group of $$$n$$$ alpinists has just reached the foot of the mountain. The initial difficulty of climbing this mountain can be described as an integer $$$d$$$.<\/p><p>Each alpinist can be described by two integers $$$s$$$ and $$$a$$$, where $$$s$$$ is his skill of climbing mountains and $$$a$$$ is his neatness.<\/p><p>An alpinist of skill level $$$s$$$ is able to climb a mountain of difficulty $$$p$$$ only if $$$p \\leq s$$$. As an alpinist climbs a mountain, they affect the path and thus may change mountain difficulty. Specifically, if an alpinist of neatness $$$a$$$ climbs a mountain of difficulty $$$p$$$ the difficulty of this mountain becomes $$$\\max(p, a)$$$. <\/p><p>Alpinists will climb the mountain one by one. And before the start, they wonder, what is the maximum number of alpinists who will be able to climb the mountain if they choose the right order. As you are the only person in the group who does programming, you are to answer the question.<\/p><p>Note that after the order is chosen, each alpinist who can climb the mountain, must climb the mountain at that time. <\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$d$$$ ($$$1 \\leq n \\leq 500\\,000$$$; $$$0 \\leq d \\leq 10^9$$$)\u00a0\u2014 the number of alpinists and the initial difficulty of the mountain.<\/p><p>Each of the next $$$n$$$ lines contains two integers $$$s_i$$$ and $$$a_i$$$ ($$$0 \\leq s_i, a_i \\leq 10^9$$$) that define the skill of climbing and the neatness of the $$$i$$$-th alpinist.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer equal to the maximum number of alpinists who can climb the mountain if they choose the right order to do so.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 2\n2 6\n3 5\n5 7\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 3\n2 4\n6 4\n4 6\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 0\n1 5\n4 8\n2 7\n7 6\n3 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, alpinists $$$2$$$ and $$$3$$$ can climb the mountain if they go in this order. There is no other way to achieve the answer of $$$2$$$.<\/p><p>In the second example, alpinist $$$1$$$ is not able to climb because of the initial difficulty of the mountain, while alpinists $$$2$$$ and $$$3$$$ can go up in any order.<\/p><p>In the third example, the mountain can be climbed by alpinists $$$5$$$, $$$3$$$ and $$$4$$$ in this particular order. There is no other way to achieve optimal answer.<\/p><\/div><\/div>"}, {"contestId": 1634, "index": "F", "name": "Fibonacci Additions", "rating": 2700, "solvedCount": 2005, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Fibonacci Additions<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><div class=\"epigraph\"><div class=\"epigraph-text\">One of my most productive days was throwing away 1,000 lines of code.<\/div><div class=\"epigraph-source\">\u2014 Ken Thompson<\/div><\/div><p><span class=\"tex-font-style-bf\">Fibonacci addition<\/span> is an operation on an array $$$X$$$ of integers, parametrized by indices $$$l$$$ and $$$r$$$. Fibonacci addition increases $$$X_l$$$ by $$$F_1$$$, increases $$$X_{l + 1}$$$ by $$$F_2$$$, and so on up to $$$X_r$$$ which is increased by $$$F_{r - l + 1}$$$.<\/p><p>$$$F_i$$$ denotes the $$$i$$$-th Fibonacci number ($$$F_1 = 1$$$, $$$F_2 = 1$$$, $$$F_{i} = F_{i - 1} + F_{i - 2}$$$ for $$$i  \\gt  2$$$), and <span class=\"tex-font-style-bf\">all operations are performed modulo $$$MOD$$$<\/span>.<\/p><p>You are given two arrays $$$A$$$ and $$$B$$$ of the same length. We will ask you to perform several Fibonacci additions on these arrays with different parameters, and after each operation you have to report whether arrays $$$A$$$ and $$$B$$$ are equal modulo $$$MOD$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains 3 numbers $$$n$$$, $$$q$$$ and $$$MOD$$$ ($$$1 \\le n, q \\le 3\\cdot 10^5, 1 \\le MOD \\le 10^9+7$$$)\u00a0\u2014 the length of the arrays, the number of operations, and the number modulo which all operations are performed.<\/p><p>The second line contains $$$n$$$ numbers\u00a0\u2014 array $$$A$$$ ($$$0 \\le A_i  \\lt  MOD$$$).<\/p><p>The third line also contains $$$n$$$ numbers\u00a0\u2014 array $$$B$$$ ($$$0 \\le B_i  \\lt  MOD$$$).<\/p><p>The next $$$q$$$ lines contain character $$$c$$$ and two numbers $$$l$$$ and $$$r$$$ ($$$1 \\le l \\le r \\le n$$$)\u00a0\u2014 operation parameters. If $$$c$$$ is \"A\", Fibonacci addition is to be performed on array $$$A$$$, and if it is is \"B\", the operation is to be performed on $$$B$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>After each operation, print \"YES\" (without quotes) if the arrays are equal and \"NO\" otherwise. Letter case does not matter.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3 5 3\n2 2 1\n0 0 0\nA 1 3\nA 1 3\nB 1 1\nB 2 2\nA 3 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nNO\nNO\nNO\nYES\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 3 10\n2 5 0 3 5\n3 5 8 2 5\nB 2 3\nB 3 4\nA 1 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nNO\nNO\nYES\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Explanation of the test from the condition:<\/p><ul><li> Initially $$$A=[2,2,1]$$$, $$$B=[0,0,0]$$$.<\/li><li> After operation \"A 1 3\": $$$A=[0,0,0]$$$, $$$B=[0,0,0]$$$ (addition is modulo 3).<\/li><li> After operation \"A 1 3\": $$$A=[1,1,2]$$$, $$$B=[0,0,0]$$$.<\/li><li> After operation \"B 1 1\": $$$A=[1,1,2]$$$, $$$B=[1,0,0]$$$.<\/li><li> After operation \"B 2 2\": $$$A=[1,1,2]$$$, $$$B=[1,1,0]$$$.<\/li><li> After operation \"A 3 3\": $$$A=[1,1,0]$$$, $$$B=[1,1,0]$$$.<\/li><\/ul><\/div><\/div>"}, {"contestId": 2115, "index": "C", "name": "Gellyfish and Eternal Violet", "rating": 2700, "solvedCount": 1990, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Gellyfish and Eternal Violet<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>1024 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p> <\/p><p>There are $$$n$$$ monsters, numbered from $$$1$$$ to $$$n$$$, in front of Gellyfish. The HP of the $$$i$$$-th monster is $$$h_i$$$.<\/p><p>Gellyfish doesn't want to kill them, but she wants to keep these monsters from being a threat to her. So she wants to reduce the HP of all the monsters to exactly $$$1$$$.<\/p><p>Now, Gellyfish, with The Sword Sharpened with Tears, is going to attack the monsters for $$$m$$$ rounds. For each round:<\/p><ol> <li> The Sword Sharpened with Tears shines with a probability of $$$p$$$. <\/li><li> Gellyfish can choose whether to attack: <ul> <li> If Gellyfish doesn't attack, nothing happens. <\/li><li> If Gellyfish chooses to attack and The Sword Sharpened with Tears shines, the HP of all the monsters will be reduced by $$$1$$$. <\/li><li> If Gellyfish chooses to attack and The Sword Sharpened with Tears does not shine, Gellyfish can choose one of the monsters and reduce its HP by $$$1$$$. <\/li><\/ul> <\/li><\/ol><p>Please note that before Gellyfish decides whether or not to attack, she will know whether the sword shines or not. Also, when the sword shines, Gellyfish can only make attacks on all the monsters and cannot make an attack on only one monster.<\/p><p>Now, Gellyfish wants to know what the probability is that she will reach her goal if she makes choices optimally during the battle.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 100$$$). The description of the test cases follows. <\/p><p>The first line of each test case contains three integers $$$n$$$, $$$m$$$, and $$$p'$$$ ($$$1 \\leq n \\leq 20$$$, $$$1 \\leq m \\leq 4000$$$, $$$0 \\leq p' \\leq 100$$$)\u00a0\u2014 the number of monsters, the number of rounds of attacks, and an integer representing the probability $$$p = \\frac {p'} {100}$$$ that the Sword Sharpened with Tears shines.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$h_1,h_2,\\ldots,h_n$$$ ($$$1 \\leq h_i \\leq 400$$$)\u00a0\u2014 the HP of the monsters.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$100$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, output a single real number representing the probability that Gellyfish will reach her goal.<\/p><p>Your answer is considered correct if its absolute or relative error does not exceed $$$10^{-6}$$$.<\/p><p>Formally, let your answer be $$$a$$$, and the jury's answer be $$$b$$$. Your answer is accepted if and only if $$$\\frac{|a - b|}{\\max{(1, |b|)}} \\le 10^{-6}$$$. <\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">4<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 2 10<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 5 20<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">2 2 2 2 2<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">6 20 50<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">1 1 4 5 1 4<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">9 50 33<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">9 9 8 2 4 4 3 5 3<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0.910000\n0.672320\n0.588099\n0.931474\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test case, Gellyfish will always attack whether the sword shines or not in the first round.<\/p><p>If the sword shines in the first round, then Gellyfish can reach her goal after the attack in the first round.<\/p><p>Otherwise, if the sword does not shine in the first round, she will attack monster $$$1$$$ in the first round. For the second round:<\/p><ul> <li> If the sword shines, since monster $$$1$$$ was attacked in the first round, Gellyfish can't reach her goal. <\/li><li> Otherwise, Gellyfish can attack monster $$$2$$$, allowing her to reach her goal. <\/li><\/ul><p>Therefore, the probability that Gellyfish can reach her goal is $$$10\\% + (90\\% \\cdot 90\\%) = 91\\%$$$.<\/p><p>In the second test case, Gellyfish will only attack in the first round where the sword shines. It can be observed that the only way Gellyfish can't reach her goal is if the sword never shines in all $$$5$$$ rounds. The probability that Gellyfish can reach her goal is $$$100\\% - (80\\%)^5 = 67.232\\%$$$.<\/p><\/div><\/div>"}, {"contestId": 452, "index": "F", "name": "Permutation", "rating": 2700, "solvedCount": 1883, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Permutation<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>You are given a permutation of numbers from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span>. Determine whether there's a pair of integers <span class=\"tex-span\"><i>a<\/i>,\u2009<i>b<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>a<\/i>,\u2009<i>b<\/i>\u2009\u2264\u2009<i>n<\/i>;\u00a0<i>a<\/i>\u2009\u2260\u2009<i>b<\/i>)<\/span> such that the element <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/aabb4af85f7a005b3d8f709b94c17f8474d72c3b.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> (note, that it is usual division, not integer one) is between <span class=\"tex-span\"><i>a<\/i><\/span> and <span class=\"tex-span\"><i>b<\/i><\/span> in this permutation.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>First line consists of a single integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009300000<\/span>) \u2014 the size of permutation.<\/p><p>Second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers \u2014 the permutation itself.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print \"<span class=\"tex-font-style-tt\">YES<\/span>\", if such a pair exists, \"<span class=\"tex-font-style-tt\">NO<\/span>\" otherwise (in both cases without quotes, the answer is case insensitive).<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4<br/>1 3 4 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>NO<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5<br/>1 5 2 4 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>YES<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the second example <span class=\"tex-span\">2<\/span> is between <span class=\"tex-span\">1<\/span> and <span class=\"tex-span\">3<\/span>. Additionally <span class=\"tex-span\">4<\/span> is between <span class=\"tex-span\">3<\/span> and <span class=\"tex-span\">5<\/span>.<\/p><\/div><\/div>"}, {"contestId": 995, "index": "F", "name": "Cowmpany Cowmpensation", "rating": 2700, "solvedCount": 1863, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Cowmpany Cowmpensation<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Allen, having graduated from the MOO Institute of Techcowlogy (MIT), has started a startup! Allen is the president of his startup. He also hires $$$n-1$$$ other employees, each of which is assigned a direct superior. If $$$u$$$ is a superior of $$$v$$$ and $$$v$$$ is a superior of $$$w$$$ then also $$$u$$$ is a superior of $$$w$$$. Additionally, there are no $$$u$$$ and $$$v$$$ such that $$$u$$$ is the superior of $$$v$$$ and $$$v$$$ is the superior of $$$u$$$. Allen himself has no superior. Allen is employee number $$$1$$$, and the others are employee numbers $$$2$$$ through $$$n$$$.<\/p><p>Finally, Allen must assign salaries to each employee in the company including himself. Due to budget constraints, each employee's salary is an integer between $$$1$$$ and $$$D$$$. Additionally, no employee can make strictly more than his superior.<\/p><p>Help Allen find the number of ways to assign salaries. As this number may be large, output it modulo $$$10^9 + 7$$$.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains two integers $$$n$$$ and $$$D$$$ ($$$1 \\le n \\le 3000$$$, $$$1 \\le D \\le 10^9$$$).<\/p><p>The remaining $$$n-1$$$ lines each contain a single positive integer, where the $$$i$$$-th line contains the integer $$$p_i$$$ ($$$1 \\le p_i \\le i$$$). $$$p_i$$$ denotes the direct superior of employee $$$i+1$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output a single integer: the number of ways to assign salaries modulo $$$10^9 + 7$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 2<br/>1<br/>1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>5<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 3<br/>1<br/>2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>10<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 5<br/>1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>15<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample case, employee 2 and 3 report directly to Allen. The three salaries, in order, can be $$$(1,1,1)$$$, $$$(2,1,1)$$$, $$$(2,1,2)$$$, $$$(2,2,1)$$$ or $$$(2,2,2)$$$.<\/p><p>In the second sample case, employee 2 reports to Allen and employee 3 reports to employee 2. In order, the possible salaries are $$$(1,1,1)$$$, $$$(2,1,1)$$$, $$$(2,2,1)$$$, $$$(2,2,2)$$$, $$$(3,1,1)$$$, $$$(3,2,1)$$$, $$$(3,2,2)$$$, $$$(3,3,1)$$$, $$$(3,3,2)$$$, $$$(3,3,3)$$$.<\/p><\/div><\/div>"}, {"contestId": 1856, "index": "E2", "name": "PermuTree (hard version)", "rating": 2700, "solvedCount": 1841, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E2. PermuTree (hard version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is the hard version of the problem. The differences between the two versions are the constraint on $$$n$$$ and the time limit. You can make hacks only if both versions of the problem are solved.<\/span><\/p><p>You are given a tree with $$$n$$$ vertices rooted at vertex $$$1$$$.<\/p><p>For some permutation$$$^\\dagger$$$ $$$a$$$ of length $$$n$$$, let $$$f(a)$$$ be the number of pairs of vertices $$$(u, v)$$$ such that $$$a_u  \\lt  a_{\\operatorname{lca}(u, v)}  \\lt  a_v$$$. Here, $$$\\operatorname{lca}(u,v)$$$ denotes the <a href=\"https://en.wikipedia.org/wiki/Lowest_common_ancestor\">lowest common ancestor<\/a> of vertices $$$u$$$ and $$$v$$$.<\/p><p>Find the maximum possible value of $$$f(a)$$$ over all permutations $$$a$$$ of length $$$n$$$.<\/p><p>$$$^\\dagger$$$ A permutation of length $$$n$$$ is an array consisting of $$$n$$$ distinct integers from $$$1$$$ to $$$n$$$ in arbitrary order. For example, $$$[2,3,1,5,4]$$$ is a permutation, but $$$[1,2,2]$$$ is not a permutation ($$$2$$$ appears twice in the array), and $$$[1,3,4]$$$ is also not a permutation ($$$n=3$$$ but there is $$$4$$$ in the array).<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$2 \\le n \\le 10^6$$$).<\/p><p>The second line contains $$$n - 1$$$ integers $$$p_2,p_3,\\ldots,p_n$$$ ($$$1 \\le p_i  \\lt  i$$$) indicating that there is an edge between vertices $$$i$$$ and $$$p_i$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output the maximum value of $$$f(a)$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n1 1 3 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n0\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6\n1 2 2 1 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n7\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4\n1 1 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The tree in the first test: <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/1f10963ce42748594dc364ee332507d7b0f4b423.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>One possible optimal permutation $$$a$$$ is $$$[2, 1, 4, 5, 3]$$$ with $$$4$$$ suitable pairs of vertices: <\/p><ul> <li> $$$(2, 3)$$$, since $$$\\operatorname{lca}(2, 3) = 1$$$ and $$$1  \\lt  2  \\lt  4$$$, <\/li><li> $$$(2, 4)$$$, since $$$\\operatorname{lca}(2, 4) = 1$$$ and $$$1  \\lt  2  \\lt  5$$$, <\/li><li> $$$(2, 5)$$$, since $$$\\operatorname{lca}(2, 5) = 1$$$ and $$$1  \\lt  2  \\lt  3$$$, <\/li><li> $$$(5, 4)$$$, since $$$\\operatorname{lca}(5, 4) = 3$$$ and $$$3  \\lt  4  \\lt  5$$$. <\/li><\/ul><p>The tree in the third test: <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/f8bdd46040c270d8b7d6e369b44cd6d4c758603c.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>The tree in the fourth test: <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/d27b9a173bfc9e92877bcfb0c431235b23681931.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 961, "index": "G", "name": "Partitions", "rating": 2700, "solvedCount": 1840, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. Partitions<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a set of <span class=\"tex-span\"><i>n<\/i><\/span> elements indexed from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span>. The weight of <span class=\"tex-span\"><i>i<\/i><\/span>-th element is <span class=\"tex-span\"><i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. The weight of some subset of a given set is denoted as <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/dab8d9210e9882924b03a521d4eb19fed5b2bc74.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>. The weight of some partition <span class=\"tex-span\"><i>R<\/i><\/span> of a given set into <span class=\"tex-span\"><i>k<\/i><\/span> subsets is <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/d79871cc5728032baa39fd4a9461918c62d2ac58.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> (recall that a partition of a given set is a set of its subsets such that every element of the given set belongs to exactly one subset in partition).<\/p><p>Calculate the sum of weights of all partitions of a given set into exactly <span class=\"tex-span\"><i>k<\/i><\/span> <span class=\"tex-font-style-bf\">non-empty<\/span> subsets, and print it modulo <span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097<\/span>. Two partitions are considered different iff there exist two elements <span class=\"tex-span\"><i>x<\/i><\/span> and <span class=\"tex-span\"><i>y<\/i><\/span> such that they belong to the same set in one of the partitions, and to different sets in another partition.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>k<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>k<\/i>\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20092\u00b710<sup class=\"upper-index\">5<\/sup><\/span>) \u2014 the number of elements and the number of subsets in each partition, respectively.<\/p><p>The second line contains <span class=\"tex-span\"><i>n<\/i><\/span> integers <span class=\"tex-span\"><i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>w<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>)\u2014 weights of elements of the set.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print one integer \u2014 the sum of weights of all partitions of a given set into <span class=\"tex-span\"><i>k<\/i><\/span> <span class=\"tex-font-style-bf\">non-empty<\/span> subsets, taken modulo <span class=\"tex-span\">10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 2<br/>2 3 2 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>160<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>5 2<br/>1 2 3 4 5<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>645<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Possible partitions in the first sample:<\/p><ol> <li> <span class=\"tex-span\">{{1,\u20092,\u20093},\u2009{4}}<\/span>, <span class=\"tex-span\"><i>W<\/i>(<i>R<\/i>)\u2009=\u20093\u00b7(<i>w<\/i><sub class=\"lower-index\">1<\/sub>\u2009+\u2009<i>w<\/i><sub class=\"lower-index\">2<\/sub>\u2009+\u2009<i>w<\/i><sub class=\"lower-index\">3<\/sub>)\u2009+\u20091\u00b7<i>w<\/i><sub class=\"lower-index\">4<\/sub>\u2009=\u200924<\/span>; <\/li><li> <span class=\"tex-span\">{{1,\u20092,\u20094},\u2009{3}}<\/span>, <span class=\"tex-span\"><i>W<\/i>(<i>R<\/i>)\u2009=\u200926<\/span>; <\/li><li> <span class=\"tex-span\">{{1,\u20093,\u20094},\u2009{2}}<\/span>, <span class=\"tex-span\"><i>W<\/i>(<i>R<\/i>)\u2009=\u200924<\/span>; <\/li><li> <span class=\"tex-span\">{{1,\u20092},\u2009{3,\u20094}}<\/span>, <span class=\"tex-span\"><i>W<\/i>(<i>R<\/i>)\u2009=\u20092\u00b7(<i>w<\/i><sub class=\"lower-index\">1<\/sub>\u2009+\u2009<i>w<\/i><sub class=\"lower-index\">2<\/sub>)\u2009+\u20092\u00b7(<i>w<\/i><sub class=\"lower-index\">3<\/sub>\u2009+\u2009<i>w<\/i><sub class=\"lower-index\">4<\/sub>)\u2009=\u200920<\/span>; <\/li><li> <span class=\"tex-span\">{{1,\u20093},\u2009{2,\u20094}}<\/span>, <span class=\"tex-span\"><i>W<\/i>(<i>R<\/i>)\u2009=\u200920<\/span>; <\/li><li> <span class=\"tex-span\">{{1,\u20094},\u2009{2,\u20093}}<\/span>, <span class=\"tex-span\"><i>W<\/i>(<i>R<\/i>)\u2009=\u200920<\/span>; <\/li><li> <span class=\"tex-span\">{{1},\u2009{2,\u20093,\u20094}}<\/span>, <span class=\"tex-span\"><i>W<\/i>(<i>R<\/i>)\u2009=\u200926<\/span>; <\/li><\/ol><p>Possible partitions in the second sample:<\/p><ol> <li> <span class=\"tex-span\">{{1,\u20092,\u20093,\u20094},\u2009{5}}<\/span>, <span class=\"tex-span\"><i>W<\/i>(<i>R<\/i>)\u2009=\u200945<\/span>; <\/li><li> <span class=\"tex-span\">{{1,\u20092,\u20093,\u20095},\u2009{4}}<\/span>, <span class=\"tex-span\"><i>W<\/i>(<i>R<\/i>)\u2009=\u200948<\/span>; <\/li><li> <span class=\"tex-span\">{{1,\u20092,\u20094,\u20095},\u2009{3}}<\/span>, <span class=\"tex-span\"><i>W<\/i>(<i>R<\/i>)\u2009=\u200951<\/span>; <\/li><li> <span class=\"tex-span\">{{1,\u20093,\u20094,\u20095},\u2009{2}}<\/span>, <span class=\"tex-span\"><i>W<\/i>(<i>R<\/i>)\u2009=\u200954<\/span>; <\/li><li> <span class=\"tex-span\">{{2,\u20093,\u20094,\u20095},\u2009{1}}<\/span>, <span class=\"tex-span\"><i>W<\/i>(<i>R<\/i>)\u2009=\u200957<\/span>; <\/li><li> <span class=\"tex-span\">{{1,\u20092,\u20093},\u2009{4,\u20095}}<\/span>, <span class=\"tex-span\"><i>W<\/i>(<i>R<\/i>)\u2009=\u200936<\/span>; <\/li><li> <span class=\"tex-span\">{{1,\u20092,\u20094},\u2009{3,\u20095}}<\/span>, <span class=\"tex-span\"><i>W<\/i>(<i>R<\/i>)\u2009=\u200937<\/span>; <\/li><li> <span class=\"tex-span\">{{1,\u20092,\u20095},\u2009{3,\u20094}}<\/span>, <span class=\"tex-span\"><i>W<\/i>(<i>R<\/i>)\u2009=\u200938<\/span>; <\/li><li> <span class=\"tex-span\">{{1,\u20093,\u20094},\u2009{2,\u20095}}<\/span>, <span class=\"tex-span\"><i>W<\/i>(<i>R<\/i>)\u2009=\u200938<\/span>; <\/li><li> <span class=\"tex-span\">{{1,\u20093,\u20095},\u2009{2,\u20094}}<\/span>, <span class=\"tex-span\"><i>W<\/i>(<i>R<\/i>)\u2009=\u200939<\/span>; <\/li><li> <span class=\"tex-span\">{{1,\u20094,\u20095},\u2009{2,\u20093}}<\/span>, <span class=\"tex-span\"><i>W<\/i>(<i>R<\/i>)\u2009=\u200940<\/span>; <\/li><li> <span class=\"tex-span\">{{2,\u20093,\u20094},\u2009{1,\u20095}}<\/span>, <span class=\"tex-span\"><i>W<\/i>(<i>R<\/i>)\u2009=\u200939<\/span>; <\/li><li> <span class=\"tex-span\">{{2,\u20093,\u20095},\u2009{1,\u20094}}<\/span>, <span class=\"tex-span\"><i>W<\/i>(<i>R<\/i>)\u2009=\u200940<\/span>; <\/li><li> <span class=\"tex-span\">{{2,\u20094,\u20095},\u2009{1,\u20093}}<\/span>, <span class=\"tex-span\"><i>W<\/i>(<i>R<\/i>)\u2009=\u200941<\/span>; <\/li><li> <span class=\"tex-span\">{{3,\u20094,\u20095},\u2009{1,\u20092}}<\/span>, <span class=\"tex-span\"><i>W<\/i>(<i>R<\/i>)\u2009=\u200942<\/span>. <\/li><\/ol><\/div><\/div>"}, {"contestId": 1458, "index": "C", "name": "Latin Square", "rating": 2700, "solvedCount": 1801, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Latin Square<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a square matrix of size $$$n$$$. Every row and every column of this matrix is a permutation of $$$1$$$, $$$2$$$, $$$\\ldots$$$, $$$n$$$. Let $$$a_{i, j}$$$ be the element at the intersection of $$$i$$$-th row and $$$j$$$-th column for every $$$1 \\leq i, j \\leq n$$$. Rows are numbered $$$1, \\ldots, n$$$ top to bottom, and columns are numbered $$$1, \\ldots, n$$$ left to right.<\/p><p>There are six types of operations: <\/p><ul> <li> <span class=\"tex-font-style-tt\">R<\/span>: cyclically shift all columns to the right, formally, set the value of each $$$a_{i, j}$$$ to $$$a_{i, ((j - 2)\\bmod n) + 1}$$$; <\/li><li> <span class=\"tex-font-style-tt\">L<\/span>: cyclically shift all columns to the left, formally, set the value of each $$$a_{i, j}$$$ to $$$a_{i, (j\\bmod n) + 1}$$$; <\/li><li> <span class=\"tex-font-style-tt\">D<\/span>: cyclically shift all rows down, formally, set the value of each $$$a_{i, j}$$$ to $$$a_{((i - 2)\\bmod n) + 1, j}$$$; <\/li><li> <span class=\"tex-font-style-tt\">U<\/span>: cyclically shift all rows up, formally, set the value of each $$$a_{i, j}$$$ to $$$a_{(i\\bmod n) + 1, j}$$$; <\/li><li> <span class=\"tex-font-style-tt\">I<\/span>: replace the permutation read left to right in each row with its inverse. <\/li><li> <span class=\"tex-font-style-tt\">C<\/span>: replace the permutation read top to bottom in each column with its inverse. <\/li><\/ul> Inverse of a permutation $$$p_1$$$, $$$p_2$$$, $$$\\ldots$$$, $$$p_n$$$ is a permutation $$$q_1$$$, $$$q_2$$$, $$$\\ldots$$$, $$$q_n$$$, such that $$$p_{q_i} = i$$$ for every $$$1 \\leq i \\leq n$$$.<p>One can see that after any sequence of operations every row and every column of the matrix will still be a permutation of $$$1, 2, \\ldots, n$$$.<\/p><p>Given the initial matrix description, you sh

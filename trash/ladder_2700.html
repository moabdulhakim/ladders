ould process $$$m$$$ operations and output the final matrix.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ ($$$1 \\leq t \\leq 1000$$$) \u2014 number of test cases. $$$t$$$ test case descriptions follow.<\/p><p>The first line of each test case description contains two integers $$$n$$$ and $$$m$$$ ($$$1 \\leq n \\leq 1000, 1 \\leq m \\leq 10^5$$$) \u2014 size of the matrix and number of operations.<\/p><p>Each of the next $$$n$$$ lines contains $$$n$$$ integers separated by single spaces \u2014 description of the matrix $$$a$$$ ($$$1 \\leq a_{i, j} \\leq n$$$).<\/p><p>The last line of the description contains a string of $$$m$$$ characters describing the operations in order, according to the format above.<\/p><p>The sum of $$$n$$$ does not exceed $$$1000$$$, and the sum of $$$m$$$ does not exceed $$$10^5$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print $$$n$$$ lines with $$$n$$$ integers each\u00a0\u2014 the final matrix after $$$m$$$ operations.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5\n3 2\n1 2 3\n2 3 1\n3 1 2\nDR\n3 2\n1 2 3\n2 3 1\n3 1 2\nLU\n3 1\n1 2 3\n2 3 1\n3 1 2\nI\n3 1\n1 2 3\n2 3 1\n3 1 2\nC\n3 16\n1 2 3\n2 3 1\n3 1 2\nLDICRUCILDICRUCI\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2 3 1 \n3 1 2 \n1 2 3 \n\n3 1 2 \n1 2 3 \n2 3 1 \n\n1 2 3 \n3 1 2 \n2 3 1 \n\n1 3 2 \n2 1 3 \n3 2 1 \n\n2 3 1 \n3 1 2 \n1 2 3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Line breaks between sample test case answers are only for clarity, and don't have to be printed.<\/p><\/div><\/div>"}, {"contestId": 1572, "index": "C", "name": "Paint", "rating": 2700, "solvedCount": 1792, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Paint<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a $$$1$$$ by $$$n$$$ pixel image. The $$$i$$$-th pixel of the image has color $$$a_i$$$. For each color, the number of pixels of that color is <span class=\"tex-font-style-bf\">at most<\/span> $$$20$$$.<\/p><p>You can perform the following operation, which works like the bucket tool in paint programs, on this image: <\/p><ul> <li> pick a color \u2014 an integer from $$$1$$$ to $$$n$$$; <\/li><li> choose a pixel in the image; <\/li><li> for all pixels connected to the selected pixel, change their colors to the selected color (two pixels of the same color are considered connected if all the pixels between them have the same color as those two pixels). <\/li><\/ul><p>Compute the minimum number of operations needed to make all the pixels in the image have the same color.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 10^3$$$).<\/p><p>The first line of each test case contains a single integer $$$n$$$ ($$$1 \\le n \\le 3\\cdot10^3$$$) \u2014 the number of pixels in the image.<\/p><p>The second line of each test case contains $$$n$$$ integers $$$a_1, a_2, \\ldots, a_n$$$ ($$$1 \\le a_i \\le n$$$) \u2014 the colors of the pixels in the image.<\/p><p>Note: for each color, the number of pixels of that color is <span class=\"tex-font-style-bf\">at most<\/span> $$$20$$$.<\/p><p>It is guaranteed that the sum of $$$n$$$ over all test cases does not exceed $$$3\\cdot10^3$$$.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print one integer: the minimum number of operations needed to make all the pixels in the image have the same color.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n5\n1 2 3 2 1\n4\n1 1 2 2\n5\n1 2 1 4 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n1\n3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first example, the optimal solution is to apply the operation on the third pixel changing its color to $$$2$$$ and then to apply the operation on any pixel that has color $$$2$$$ changing its color and the color of all pixels connected to it to $$$1$$$. The sequence of operations is then: $$$[1, 2, 3, 2, 1] \\to [1, 2, 2, 2, 1] \\to [1, 1, 1, 1, 1]$$$.<\/p><p>In the second example, we can either change the $$$1$$$s to $$$2$$$s in one operation or change the $$$2$$$s to $$$1$$$s also in one operation.<\/p><p>In the third example, one possible way to make all the pixels have the same color is to apply the operation on the first, third and the fourth pixel each time changing its color to $$$2$$$.<\/p><\/div><\/div>"}, {"contestId": 1149, "index": "C", "name": "Tree Generator\u2122", "rating": 2700, "solvedCount": 1757, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">C. Tree Generator\u2122<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Owl Pacino has always been into trees \u2014 unweighted rooted trees in particular. He loves determining the <span class=\"tex-font-style-it\">diameter<\/span> of every tree he sees \u2014 that is, the maximum length of any simple path in the tree.<\/p><p>Owl Pacino's owl friends decided to present him the Tree Generator\u2122 \u2014 a powerful machine creating rooted trees from their <span class=\"tex-font-style-it\">descriptions<\/span>. An $$$n$$$-vertex rooted tree can be <span class=\"tex-font-style-it\">described<\/span> by a bracket sequence of length $$$2(n - 1)$$$ in the following way: find any walk starting and finishing in the root that traverses each edge exactly twice \u2014 once down the tree, and later up the tree. Then follow the path and write down \"<span class=\"tex-font-style-tt\">(<\/span>\" (an opening parenthesis) if an edge is followed down the tree, and \"<span class=\"tex-font-style-tt\">)<\/span>\" (a closing parenthesis) otherwise.<\/p><p>The following figure shows sample rooted trees and their descriptions:<\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/e25f5fd08a44098a2472daab185f08129103dd0e.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><p>Owl wrote down the description of an $$$n$$$-vertex rooted tree. Then, he rewrote the description $$$q$$$ times. However, each time he wrote a new description, he picked two different characters in the description he wrote the last time, swapped them and wrote down the resulting string. He always made sure that each written string was the description of a rooted tree.<\/p><p>Pacino then used Tree Generator\u2122 for each description he wrote down. What is the diameter of each constructed tree?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains two integers $$$n, q$$$ ($$$3 \\le n \\le 100\\,000$$$, $$$1 \\le q \\le 100\\,000$$$) \u2014 the number of vertices in the tree and the number of changes to the tree description. The following line contains a description of the initial tree \u2014 a string of length $$$2(n-1)$$$ consisting of opening and closing parentheses.<\/p><p>Each of the following $$$q$$$ lines describes a single change to the description and contains two space-separated integers $$$a_i, b_i$$$ ($$$2 \\leq a_i, b_i \\leq 2n-3$$$) which identify the indices of two brackets to be swapped. You can assume that the description will change after each query, and that after each change a tree can be constructed from the description.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Output $$$q + 1$$$ integers \u2014 the diameter of each constructed tree, in the order their descriptions have been written down.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 5\n(((())))\n4 5\n3 4\n5 6\n3 6\n2 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n3\n3\n2\n4\n4\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 4\n(((())()))\n6 7\n5 4\n6 4\n7 4\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n4\n4\n4\n5\n3\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The following figure shows each constructed tree and its description in the first example test: <\/p><center> <img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/f5fbe9a5fa1a0caa9b7efc01addd2f2c65e74c97.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/> <\/center><\/div><\/div>"}, {"contestId": 1370, "index": "F2", "name": "The Hidden Pair (Hard Version)", "rating": 2700, "solvedCount": 1749, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F2. The Hidden Pair (Hard Version)<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">Note that the only difference between the easy and hard version is the constraint on the number of queries. You can make hacks only if all versions of the problem are solved.<\/span><\/p><p><span class=\"tex-font-style-bf\">This is an interactive problem.<\/span><\/p><p>You are given a tree consisting of $$$n$$$ nodes numbered with integers from $$$1$$$ to $$$n$$$. Ayush and Ashish chose two secret distinct nodes in the tree. You need to find out both the nodes. You can make the following query: <\/p><ul> <li> Provide a list of nodes and you will receive a node from that list whose sum of distances to both the hidden nodes is minimal (if there are multiple such nodes in the list, you will receive any one of them). You will also get the sum of distances of that node to the hidden nodes. <\/li><\/ul><p>Recall that a tree is a connected graph without cycles. The distance between two nodes is defined as the number of edges in the simple path between them.<\/p><p>More formally, let's define two hidden nodes as $$$s$$$ and $$$f$$$. In one query you can provide the set of nodes $$$\\{a_1, a_2, \\ldots, a_c\\}$$$ of the tree. As a result, you will get two numbers $$$a_i$$$ and $$$dist(a_i, s) + dist(a_i, f)$$$. The node $$$a_i$$$ is any node from the provided set, for which the number $$$dist(a_i, s) + dist(a_i, f)$$$ is minimal.<\/p><p><span class=\"tex-font-style-bf\">You can ask no more than $$$11$$$ queries.<\/span><\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$t$$$ $$$(1 \\leq t \\leq 10)$$$\u00a0\u2014 the number of test cases. <span class=\"tex-font-style-bf\">Please note, how the interaction process is organized.<\/span><\/p><p>The first line of each test case consists of a single integer $$$n$$$ $$$(2 \\le n \\le 1000)$$$\u00a0\u2014 the number of nodes in the tree.<\/p><p>The next $$$n - 1$$$ lines consist of two integers $$$u$$$, $$$v$$$ $$$(1 \\le u, v \\le n, u \\ne v)$$$\u00a0\u2014 the edges of the tree.<\/p><\/div><div><div class=\"section-title\">Interaction<\/div><p>To ask a query print a single line: <\/p><ul> <li> In the beginning print \"<span class=\"tex-font-style-tt\">? c<\/span> \" (without quotes) where $$$c$$$ $$$(1 \\leq c \\leq n)$$$ denotes the number of nodes being queried, followed by $$$c$$$ <span class=\"tex-font-style-bf\">distinct<\/span> integers in the range $$$[1, n]$$$ \u00a0\u2014 the indices of nodes from the list. <\/li><\/ul><p>For each query, you will receive two integers $$$x$$$, $$$d$$$\u00a0\u2014 the node (among the queried nodes) with the minimum sum of distances to the hidden nodes and the sum of distances from that node to the hidden nodes. If the subset of nodes queried is invalid or you exceeded the number of queries then you will get $$$x = d = -1$$$. In this case, you should terminate the program immediately.<\/p><p>When you have guessed the hidden nodes, print a single line \"<span class=\"tex-font-style-tt\">!<\/span> \" (without quotes), followed by two integers in the range $$$[1, n]$$$ \u00a0\u2014 the hidden nodes. You can output the hidden nodes in any order.<\/p><p><span class=\"tex-font-style-bf\">After this, you should read a string.<\/span> If you guess the nodes correctly, you will receive the string \"<span class=\"tex-font-style-tt\">Correct<\/span>\". In this case, you should continue solving the remaining test cases or terminate the program, if all test cases were solved. Otherwise, you will receive the string \"<span class=\"tex-font-style-tt\">Incorrect<\/span>\". In this case, you should terminate the program immediately.<\/p><p>Guessing the hidden nodes does <span class=\"tex-font-style-bf\">not<\/span> count towards the number of queries asked.<\/p><p><span class=\"tex-font-style-bf\">The interactor is not adaptive.<\/span> The hidden nodes do not change with queries.<\/p><p><span class=\"tex-font-style-bf\">Do not forget<\/span> to read the string \"<span class=\"tex-font-style-tt\">Correct<\/span>\" / \"<span class=\"tex-font-style-tt\">Incorrect<\/span>\" after guessing the hidden nodes.<\/p><p>You need to solve each test case before receiving the input for the next test case.<\/p><p><span class=\"tex-font-style-bf\">The limit of $$$11$$$ queries applies to each test case and not to the entire input.<\/span><\/p><p>After printing a query do not forget to output the end of the line and flush the output. Otherwise, you will get <span class=\"tex-font-style-tt\">Idleness limit exceeded<\/span>. To do this, use:<\/p><ul><li> <span class=\"tex-font-style-tt\">fflush(stdout)<\/span> or <span class=\"tex-font-style-tt\">cout.flush()<\/span> in C++;<\/li><li> <span class=\"tex-font-style-tt\">System.out.flush()<\/span> in Java;<\/li><li> <span class=\"tex-font-style-tt\">flush(output)<\/span> in Pascal;<\/li><li> <span class=\"tex-font-style-tt\">stdout.flush()<\/span> in Python;<\/li><li> see the documentation for other languages.<\/li><\/ul><p><span class=\"tex-font-style-bf\">Hacks<\/span><\/p><p>To hack the solution, use the following test format:<\/p><p>The first line should contain a single integer $$$t$$$ $$$(1 \\leq t \\leq 10)$$$\u00a0\u2014 the number of test cases. The description of the test cases follows.<\/p><p>The first line of each test case should contain a single integer $$$n$$$ $$$(2 \\le n \\le 1000)$$$\u00a0\u2014 the number of nodes in the tree. The second line should contain two distinct integers in the range $$$[1, n]$$$ \u00a0\u2014 the hidden nodes. The next $$$n - 1$$$ lines should contain two integers $$$u$$$, $$$v$$$ $$$(1 \\le u, v \\le n, u \\ne v)$$$ \u00a0\u2014 the edges of the tree.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1\n3\n1 2\n1 3\n\n1 1\n\n2 3\n\n3 1\n\n3 1\n\nCorrect<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n? 1 1\n\n? 1 2\n\n? 1 3\n\n? 2 2 3\n\n! 1 3<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The tree from the first test is shown below, and the hidden nodes are $$$1$$$ and $$$3$$$.<\/p><center><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/bcbd6776c018650322ba173e0c6ba8ca885688ab.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/><\/center><\/div><\/div>"}, {"contestId": 1254, "index": "D", "name": "Tree Queries", "rating": 2700, "solvedCount": 1748, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Tree Queries<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Hanh is a famous biologist. He loves growing trees and doing experiments on his own garden.<\/p><p>One day, he got a tree consisting of $$$n$$$ vertices. Vertices are numbered from $$$1$$$ to $$$n$$$. A tree with $$$n$$$ vertices is an undirected connected graph with $$$n-1$$$ edges. Initially, Hanh sets the value of every vertex to $$$0$$$.<\/p><p>Now, Hanh performs $$$q$$$ operations, each is either of the following types: <\/p><ul> <li> Type $$$1$$$: Hanh selects a vertex $$$v$$$ and an integer $$$d$$$. Then he chooses some vertex $$$r$$$ <span class=\"tex-font-style-bf\">uniformly at random<\/span>, lists all vertices $$$u$$$ such that the path from $$$r$$$ to $$$u$$$ passes through $$$v$$$. Hanh then increases the value of all such vertices $$$u$$$ by $$$d$$$. <\/li><li> Type $$$2$$$: Hanh selects a vertex $$$v$$$ and calculates the expected value of $$$v$$$. <\/li><\/ul><p>Since Hanh is good at biology but not math, he needs your help on these operations.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$ and $$$q$$$ ($$$1 \\leq n, q \\leq 150\\,000$$$)\u00a0\u2014 the number of vertices on Hanh's tree and the number of operations he performs.<\/p><p>Each of the next $$$n - 1$$$ lines contains two integers $$$u$$$ and $$$v$$$ ($$$1 \\leq u, v \\leq n$$$), denoting that there is an edge connecting two vertices $$$u$$$ and $$$v$$$. It is guaranteed that these $$$n - 1$$$ edges form a tree.<\/p><p>Each of the last $$$q$$$ lines describes an operation in either formats: <\/p><ul> <li> $$$1$$$ $$$v$$$ $$$d$$$ ($$$1 \\leq v \\leq n, 0 \\leq d \\leq 10^7$$$), representing a first-type operation. <\/li><li> $$$2$$$ $$$v$$$ ($$$1 \\leq v \\leq n$$$), representing a second-type operation. <\/li><\/ul><p>It is guaranteed that there is at least one query of the second type.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each operation of the second type, write the expected value on a single line. <\/p><p>Let $$$M = 998244353$$$, it can be shown that the expected value can be expressed as an irreducible fraction $$$\\frac{p}{q}$$$, where $$$p$$$ and $$$q$$$ are integers and $$$q \\not \\equiv 0 \\pmod{M}$$$. Output the integer equal to $$$p \\cdot q^{-1} \\bmod M$$$. In other words, output such an integer $$$x$$$ that $$$0 \\le x  \\lt  M$$$ and $$$x \\cdot q \\equiv p \\pmod{M}$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n5 12\n1 2\n1 3\n2 4\n2 5\n1 1 1\n2 1\n2 2\n2 3\n2 4\n2 5\n1 2 2\n2 1\n2 2\n2 3\n2 4\n2 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n199648871\n399297742\n199648871\n199648871\n598946614\n199648873\n2\n2\n2\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The image below shows the tree in the example:<\/p><center> <img class=\"tex-graphics\" height=\"265px\" src=\"https://espresso.codeforces.com/29beef9ccf36e5728fb015dfcdbaa66cfb5511b3.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"265px\"/> <\/center><p>For the first query, where $$$v = 1$$$ and $$$d = 1$$$: <\/p><ul> <li> If $$$r = 1$$$, the values of all vertices get increased. <\/li><li> If $$$r = 2$$$, the values of vertices $$$1$$$ and $$$3$$$ get increased. <\/li><li> If $$$r = 3$$$, the values of vertices $$$1$$$, $$$2$$$, $$$4$$$ and $$$5$$$ get increased. <\/li><li> If $$$r = 4$$$, the values of vertices $$$1$$$ and $$$3$$$ get increased. <\/li><li> If $$$r = 5$$$, the values of vertices $$$1$$$ and $$$3$$$ get increased. <\/li><\/ul><p>Hence, the expected values of all vertices after this query are ($$$1, 0.4, 0.8, 0.4, 0.4$$$).<\/p><p>For the second query, where $$$v = 2$$$ and $$$d = 2$$$: <\/p><ul> <li> If $$$r = 1$$$, the values of vertices $$$2$$$, $$$4$$$ and $$$5$$$ get increased. <\/li><li> If $$$r = 2$$$, the values of all vertices get increased. <\/li><li> If $$$r = 3$$$, the values of vertices $$$2$$$, $$$4$$$ and $$$5$$$ get increased. <\/li><li> If $$$r = 4$$$, the values of vertices $$$1$$$, $$$2$$$, $$$3$$$ and $$$5$$$ get increased. <\/li><li> If $$$r = 5$$$, the values of vertices $$$1$$$, $$$2$$$, $$$3$$$ and $$$4$$$ get increased. <\/li><\/ul><p>Hence, the expected values of all vertices after this query are ($$$2.2, 2.4, 2, 2, 2$$$).<\/p><\/div><\/div>"}, {"contestId": 1364, "index": "E", "name": "X-OR", "rating": 2700, "solvedCount": 1698, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. X-OR<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p><span class=\"tex-font-style-bf\">This is an interactive problem!<\/span><\/p><p>Ehab has a hidden permutation $$$p$$$ of length $$$n$$$ consisting of the elements from $$$0$$$ to $$$n-1$$$. You, for some reason, want to figure out the permutation. To do that, you can give Ehab $$$2$$$ <span class=\"tex-font-style-bf\">different<\/span> indices $$$i$$$ and $$$j$$$, and he'll reply with $$$(p_i|p_j)$$$ where $$$|$$$ is the <a href=\"https://en.wikipedia.org/wiki/Bitwise_operation#OR\">bitwise-or<\/a> operation.<\/p><p>Ehab has just enough free time to answer $$$4269$$$ questions, and while he's OK with answering that many questions, he's too lazy to play your silly games, so he'll fix the permutation beforehand and will <span class=\"tex-font-style-bf\">not<\/span> change it depending on your queries. Can you guess the permutation?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The only line contains the integer $$$n$$$ $$$(3 \\le n \\le 2048)$$$\u00a0\u2014 the length of the permutation.<\/p><\/div><div><div class=\"section-title\">Interaction<\/div><p>To ask a question, print \"<span class=\"tex-font-style-tt\">? $$$i$$$ $$$j$$$<\/span>\" (without quotes, $$$i \\neq j$$$) Then, you should read the answer, which will be $$$(p_i|p_j)$$$.<\/p><p>If we answer with $$$-1$$$ instead of a valid answer, that means you exceeded the number of queries or made an invalid query.<\/p><p>Exit immediately after receiving $$$-1$$$ and you will see <span class=\"tex-font-style-tt\">wrong answer<\/span> verdict. Otherwise, you can get an arbitrary verdict because your solution will continue to read from a closed stream.<\/p><p>To print the answer, print \"<span class=\"tex-font-style-tt\">! $$$p_1$$$ $$$p_2$$$ $$$\\ldots$$$ $$$p_n$$$<\/span>\" (without quotes). <span class=\"tex-font-style-bf\">Note that answering doesn't count as one of the $$$4269$$$ queries<\/span>.<\/p><p>After printing a query or printing the answer, do not forget to output end of line and flush the output. Otherwise, you will get <span class=\"tex-font-style-tt\">idleness limit exceeded<\/span>. To do this, use:<\/p><ul><li> <span class=\"tex-font-style-tt\">fflush(stdout)<\/span> or <span class=\"tex-font-style-tt\">cout.flush()<\/span> in C++;<\/li><li> <span class=\"tex-font-style-tt\">System.out.flush()<\/span> in Java;<\/li><li> <span class=\"tex-font-style-tt\">flush(output)<\/span> in Pascal;<\/li><li> <span class=\"tex-font-style-tt\">stdout.flush()<\/span> in Python;<\/li><li> See the documentation for other languages.<\/li><\/ul><p><span class=\"tex-font-style-bf\">Hacks:<\/span><\/p><p>The first line should contain the integer $$$n$$$ ($$$3 \\le n \\le 2^{11}$$$)\u00a0\u2014 the length of the permutation $$$p$$$.<\/p><p>The second line should contain $$$n$$$ space-separated integers $$$p_1$$$, $$$p_2$$$, $$$\\ldots$$$, $$$p_n$$$ ($$$0 \\le p_i  \\lt  n$$$)\u00a0\u2014 the elements of the permutation $$$p$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n1\n3\n2<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n? 1 2\n? 1 3\n? 2 3\n! 1 0 2<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first sample, the permutation is $$$[1,0,2]$$$. You start by asking about $$$p_1|p_2$$$ and Ehab replies with $$$1$$$. You then ask about $$$p_1|p_3$$$ and Ehab replies with $$$3$$$. Finally, you ask about $$$p_2|p_3$$$ and Ehab replies with $$$2$$$. You then guess the permutation.<\/p><\/div><\/div>"}, {"contestId": 576, "index": "D", "name": "Flights for Regular Customers", "rating": 2700, "solvedCount": 1689, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Flights for Regular Customers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>4 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>In the country there are exactly <span class=\"tex-span\"><i>n<\/i><\/span> cities numbered with positive integers from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span>. In each city there is an airport is located.<\/p><p>Also, there is the only one airline, which makes <span class=\"tex-span\"><i>m<\/i><\/span> flights. Unfortunately, to use them, you need to be a regular customer of this company, namely, you have the opportunity to enjoy flight <span class=\"tex-span\"><i>i<\/i><\/span> from city <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> to city <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> only if you have already made at least <span class=\"tex-span\"><i>d<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> flights before that.<\/p><p>Please note that flight <span class=\"tex-span\"><i>i<\/i><\/span> flies exactly from city <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> to city <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. It can not be used to fly from city <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> to city <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>. An interesting fact is that there may possibly be recreational flights with a beautiful view of the sky, which begin and end in the same city.<\/p><p>You need to get from city <span class=\"tex-span\">1<\/span> to city <span class=\"tex-span\"><i>n<\/i><\/span>. Unfortunately, you've never traveled by plane before. What minimum number of flights you have to perform in order to get to city <span class=\"tex-span\"><i>n<\/i><\/span>?<\/p><p>Note that the same flight can be used multiple times.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers, <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u2009150<\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u2009150<\/span>) \u2014 the number of cities in the country and the number of flights the company provides.<\/p><p>Next <span class=\"tex-span\"><i>m<\/i><\/span> lines contain numbers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>d<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>,\u2009<i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\">0\u2009\u2264\u2009<i>d<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>), representing flight number <span class=\"tex-span\"><i>i<\/i><\/span> from city <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> to city <span class=\"tex-span\"><i>b<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span>, accessible to only the clients who have made at least <span class=\"tex-span\"><i>d<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub><\/span> flights. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print \"<span class=\"tex-font-style-tt\">Impossible<\/span>\" (without the quotes), if it is impossible to get from city <span class=\"tex-span\">1<\/span> to city <span class=\"tex-span\"><i>n<\/i><\/span> using the airways.<\/p><p>But if there is at least one way, print a single integer \u2014 the minimum number of flights you need to make to get to the destination point.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 2<br/>1 2 0<br/>2 3 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 1<br/>1 2 100500<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>Impossible<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 3<br/>2 1 0<br/>2 3 6<br/>1 2 0<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>8<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1733, "index": "E", "name": "Conveyor", "rating": 2700, "solvedCount": 1684, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Conveyor<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>There is a conveyor with $$$120$$$ rows and $$$120$$$ columns. Each row and column is numbered from $$$0$$$ to $$$119$$$, and the cell in $$$i$$$-th row and $$$j$$$-th column is denoted as $$$(i, j)$$$. The top leftmost cell is $$$(0, 0)$$$. Each cell has a belt, and all belts are initially facing to the right.<\/p><p>Initially, a slime ball is on the belt of $$$(0, 0)$$$, and other belts are empty. Every second, the state of the conveyor changes as follows: <\/p><ul> <li> All slime balls on the conveyor move one cell in the direction of the belt at the same time. If there is no cell in the moved position, the slime gets out of the conveyor, and if two slime balls move to the same cell, they merge into one. <\/li><li> All belts with slime ball in the previous second change direction at the same time: belts facing to the right become facing to the down, and vice versa. <\/li><li> A new slime ball is placed on cell $$$(0, 0)$$$. <\/li><\/ul><p>There are $$$q$$$ queries, each being three integers $$$t$$$, $$$x$$$, and $$$y$$$. You have to find out if there is a slime at the cell $$$(x, y)$$$ after $$$t$$$ seconds from the start. Can you do it?<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$q$$$ ($$$1 \\le q \\le 10^4$$$) \u2014 the number of queries.<\/p><p>The only line of each query contains three integers $$$t$$$, $$$x$$$, and $$$y$$$ ($$$0 \\le t \\le 10^{18}$$$, $$$0 \\le x, y  \\lt  120$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the answer for each test case, one per line. If there is a slime ball in the cell $$$(x, y)$$$ after $$$t$$$ seconds from the initial state, print \"<span class=\"tex-font-style-tt\">YES<\/span>\". Otherwise, print \"<span class=\"tex-font-style-tt\">NO<\/span>\".<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">6<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">1 1 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">5 1 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">0 0 0<\/div><div class=\"test-example-line test-example-line-even test-example-line-4\">2 4 5<\/div><div class=\"test-example-line test-example-line-odd test-example-line-5\">2 0 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-6\">1547748756 100 111<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nNO\nYES\nYES\nNO\nYES\nYES\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The state of conveyor with $$$t = 0$$$. Red arrow represents the direction of each belt, and blue figure represents slime.<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/2d99909bad49d9fec1a0b68205da1240b8d01d56.png\" style=\"zoom: 40.0%;max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>The state of conveyor with $$$t = 1$$$.<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/e895b000f232bb189538ace79f8c62919801ae4b.png\" style=\"zoom: 40.0%;max-width: 100.0%;max-height: 100.0%;\"/><\/p><p>The state of conveyor with $$$t = 2$$$.<\/p><p><img class=\"tex-graphics\" src=\"https://espresso.codeforces.com/11f5b32cc9aac8385a03b22efb4c77823b84ccb7.png\" style=\"zoom: 40.0%;max-width: 100.0%;max-height: 100.0%;\"/><\/p><\/div><\/div>"}, {"contestId": 605, "index": "E", "name": "Intergalaxy Trips", "rating": 2700, "solvedCount": 1638, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Intergalaxy Trips<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>The scientists have recently discovered wormholes\u00a0\u2014 objects in space that allow to travel very long distances between galaxies and star systems. <\/p><p>The scientists know that there are <span class=\"tex-span\"><i>n<\/i><\/span> galaxies within reach. You are in the galaxy number <span class=\"tex-span\">1<\/span> and you need to get to the galaxy number <span class=\"tex-span\"><i>n<\/i><\/span>. To get from galaxy <span class=\"tex-span\"><i>i<\/i><\/span> to galaxy <span class=\"tex-span\"><i>j<\/i><\/span>, you need to fly onto a wormhole <span class=\"tex-span\">(<i>i<\/i>,\u2009<i>j<\/i>)<\/span> and in exactly one galaxy day you will find yourself in galaxy <span class=\"tex-span\"><i>j<\/i><\/span>. <\/p><p>Unfortunately, the required wormhole is not always available. Every galaxy day they disappear and appear at random. However, the state of wormholes does not change within one galaxy day. A wormhole from galaxy <span class=\"tex-span\"><i>i<\/i><\/span> to galaxy <span class=\"tex-span\"><i>j<\/i><\/span> exists during each galaxy day taken separately with probability <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>ij<\/i><\/sub><\/span>. You can always find out what wormholes exist at the given moment. At each moment you can either travel to another galaxy through one of wormholes that exist at this moment or you can simply wait for one galaxy day to see which wormholes will lead from your current position at the next day.<\/p><p>Your task is to find the expected value of time needed to travel from galaxy <span class=\"tex-span\">1<\/span> to galaxy <span class=\"tex-span\"><i>n<\/i><\/span>, if you act in the optimal way. It is guaranteed that this expected value exists.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains a single integer <span class=\"tex-span\"><i>n<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20091000<\/span>)\u00a0\u2014 the number of galaxies within reach.<\/p><p>Then follows a matrix of <span class=\"tex-span\"><i>n<\/i><\/span> rows and <span class=\"tex-span\"><i>n<\/i><\/span> columns. Each element <span class=\"tex-span\"><i>p<\/i><sub class=\"lower-index\"><i>ij<\/i><\/sub><\/span> represents the probability that there is a wormhole from galaxy <span class=\"tex-span\"><i>i<\/i><\/span> to galaxy <span class=\"tex-span\"><i>j<\/i><\/span>. All the probabilities are given in percents and are integers. It is guaranteed that all the elements on the main diagonal are equal to <span class=\"tex-span\">100<\/span>.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single real value\u00a0\u2014 the expected value of the time needed to travel from galaxy <span class=\"tex-span\">1<\/span> to galaxy <span class=\"tex-span\"><i>n<\/i><\/span> if one acts in an optimal way. Your answer will be considered correct if its absolute or relative error does not exceed <span class=\"tex-span\">10<sup class=\"upper-index\">\u2009-\u20096<\/sup><\/span>. <\/p><p>Namely: let's assume that your answer is <span class=\"tex-span\"><i>a<\/i><\/span>, and the answer of the jury is <span class=\"tex-span\"><i>b<\/i><\/span>. The checker program will consider your answer correct, if <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/c97ba2000ebfad962bff7ffd8d043594f5ae1086.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3<br/>100 50 50<br/>0 100 80<br/>0 0 100<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1.750000000000000<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2<br/>100 30<br/>40 100<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>3.333333333333333<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the second sample the wormhole from galaxy <span class=\"tex-span\">1<\/span> to galaxy <span class=\"tex-span\">2<\/span> appears every day with probability equal to <span class=\"tex-span\">0.3<\/span>. The expected value of days one needs to wait before this event occurs is <img align=\"middle\" class=\"tex-formula\" src=\"https://espresso.codeforces.com/af1e8c68b44c3e2e8dc07919e5f90699f09c9dc1.png\" style=\"max-width: 100.0%;max-height: 100.0%;\"/>.<\/p><\/div><\/div>"}, {"contestId": 1450, "index": "E", "name": "Capitalism", "rating": 2700, "solvedCount": 1596, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Capitalism<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>A society can be represented by a connected, undirected graph of $$$n$$$ vertices and $$$m$$$ edges. The vertices represent people, and an edge $$$(i,j)$$$ represents a friendship between people $$$i$$$ and $$$j$$$.<\/p><p>In society, the $$$i$$$-th person has an income $$$a_i$$$. A person $$$i$$$ is envious of person $$$j$$$ if $$$a_j=a_i+1$$$. That is if person $$$j$$$ has exactly $$$1$$$ more unit of income than person $$$i$$$.<\/p><p>The society is called <span class=\"tex-font-style-bf\">capitalist<\/span> if for every pair of friends one is envious of the other. For some friendships, you know which friend is envious of the other. For the remaining friendships, you do not know the direction of envy.<\/p><p>The <span class=\"tex-font-style-bf\">income inequality<\/span> of society is defined as $$$\\max\\limits_{1 \\leq i \\leq n} a_i - \\min\\limits_{1 \\leq i \\leq n} a_i$$$.<\/p><p>You only know the friendships and not the incomes. If it is impossible for this society to be capitalist with the given knowledge, you should report about it. Otherwise, you should find an assignment of incomes in which the society is capitalist, and the income inequality is maximized.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$, $$$m$$$ ($$$1\\le n\\le 200$$$, $$$n-1\\le m\\le 2000$$$) \u2014 the number of people and friendships, respectively.<\/p><p>The following $$$m$$$ lines describe the friendships. Each friendship is described by three integers $$$i$$$, $$$j$$$, $$$b$$$ ($$$1\\le i, j\\le n, i\\ne j, 0\\le b\\le 1$$$). This denotes that people $$$i$$$ and $$$j$$$ are friends. If $$$b=1$$$, we require that person $$$i$$$ is envious of person $$$j$$$. If $$$b=0$$$, one friend should be envious of the other in either direction.<\/p><p>There is at most one friendship between each pair of people. It is guaranteed that if we consider the friendships as undirected edges, the graph is connected.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print \"<span class=\"tex-font-style-tt\">YES<\/span>\" if it is possible that the society is capitalist, or \"<span class=\"tex-font-style-tt\">NO<\/span>\" otherwise. You can print characters in any case (upper or lower).<\/p><p>If the answer is \"<span class=\"tex-font-style-tt\">YES<\/span>\", you should print two additional lines. In the first line, print the maximum possible income inequality. On the next line you should print $$$n$$$ integers $$$a_1,\\ldots, a_n$$$ ($$$0\\le a_i\\le 10^6$$$), where $$$a_i$$$ denotes the income of the $$$i$$$-th person.<\/p><p>We can prove that if there exists a solution, there exists one where $$$0\\le a_i\\le 10^6$$$ for all $$$i$$$.<\/p><p>If there exist multiple solutions, print any.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n6 6\n1 2 0\n3 2 0\n2 5 0\n6 5 1\n6 3 0\n2 4 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\n3\n3 2 1 3 1 0 \n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 4\n1 2 1\n2 3 0\n3 4 1\n4 1 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nNO\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n1 0\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\n0\n0 \n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test, we can show that an income inequality greater than $$$3$$$ is impossible for the given society. In the given answer with income inequality equal to $$$3$$$:<\/p><ul> <li> Person $$$2$$$ is envious of person $$$1$$$. <\/li><li> Person $$$3$$$ is envious of person $$$2$$$. <\/li><li> Person $$$5$$$ is envious of person $$$2$$$. <\/li><li> Person $$$6$$$ is envious of person $$$5$$$ (the required direction is satisfied). <\/li><li> Person $$$6$$$ is envious of person $$$3$$$. <\/li><li> Person $$$2$$$ is envious of person $$$4$$$ (the required direction is satisfied). <\/li><\/ul><p>In the second test, we can show that there is no way to assign incomes to satisfy all requirements.<\/p><\/div><\/div>"}, {"contestId": 1295, "index": "F", "name": "Good Contest", "rating": 2700, "solvedCount": 1586, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Good Contest<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>An online contest will soon be held on ForceCoders, a large competitive programming platform. The authors have prepared $$$n$$$ problems; and since the platform is very popular, $$$998244351$$$ coder from all over the world is going to solve them.<\/p><p>For each problem, the authors estimated the number of people who would solve it: for the $$$i$$$-th problem, the number of accepted solutions will be between $$$l_i$$$ and $$$r_i$$$, inclusive.<\/p><p>The creator of ForceCoders uses different criteria to determine if the contest is good or bad. One of these criteria is the number of inversions in the problem order. An inversion is a pair of problems $$$(x, y)$$$ such that $$$x$$$ is located earlier in the contest ($$$x  \\lt  y$$$), but the number of accepted solutions for $$$y$$$ is <span class=\"tex-font-style-bf\">strictly<\/span> greater.<\/p><p>Obviously, both the creator of ForceCoders and the authors of the contest want the contest to be good. Now they want to calculate the probability that there will be <span class=\"tex-font-style-bf\">no<\/span> inversions in the problem order, assuming that for each problem $$$i$$$, any <span class=\"tex-font-style-bf\">integral<\/span> number of accepted solutions for it (between $$$l_i$$$ and $$$r_i$$$) is equally probable, and all these numbers are independent.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains one integer $$$n$$$ ($$$2 \\le n \\le 50$$$) \u2014 the number of problems in the contest.<\/p><p>Then $$$n$$$ lines follow, the $$$i$$$-th line contains two integers $$$l_i$$$ and $$$r_i$$$ ($$$0 \\le l_i \\le r_i \\le 998244351$$$) \u2014 the minimum and maximum number of accepted solutions for the $$$i$$$-th problem, respectively.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>The probability that there will be no inversions in the contest can be expressed as an irreducible fraction $$$\\frac{x}{y}$$$, where $$$y$$$ is coprime with $$$998244353$$$. Print one integer \u2014 the value of $$$xy^{-1}$$$, taken modulo $$$998244353$$$, where $$$y^{-1}$$$ is an integer such that $$$yy^{-1} \\equiv 1$$$ $$$(mod$$$ $$$998244353)$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n1 2\n1 2\n1 2\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n499122177\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n42 1337\n13 420\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n578894053\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n1 1\n0 0\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n2\n1 1\n1 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The real answer in the first test is $$$\\frac{1}{2}$$$.<\/p><\/div><\/div>"}, {"contestId": 1641, "index": "D", "name": "Two Arrays", "rating": 2700, "solvedCount": 1564, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Two Arrays<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Sam changed his school and on the first biology lesson he got a very interesting task about genes.<\/p><p>You are given $$$n$$$ arrays, the $$$i$$$-th of them contains $$$m$$$ different integers \u2014 $$$a_{i,1}, a_{i,2},\\ldots,a_{i,m}$$$. Also you are given an array of integers $$$w$$$ of length $$$n$$$.<\/p><p>Find the minimum value of $$$w_i + w_j$$$ among all pairs of integers $$$(i, j)$$$ ($$$1 \\le i, j \\le n$$$), such that the numbers $$$a_{i,1}, a_{i,2},\\ldots,a_{i,m}, a_{j,1}, a_{j,2},\\ldots,a_{j,m}$$$ are distinct.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers $$$n$$$, $$$m$$$ ($$$2 \\leq n \\leq 10^5$$$, $$$1 \\le m \\le 5$$$).<\/p><p>The $$$i$$$-th of the next $$$n$$$ lines starts with $$$m$$$ distinct integers $$$a_{i,1}, a_{i,2}, \\ldots, a_{i,m}$$$ and then $$$w_i$$$ follows ($$$1\\leq a_{i,j} \\leq 10^9$$$, $$$1 \\leq w_{i} \\leq 10^9$$$).<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print a single number \u2014 the answer to the problem. <\/p><p>If there are no suitable pairs $$$(i, j)$$$, print $$$-1$$$.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 2\n1 2 5\n4 3 1\n2 3 2\n4 5 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n5\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 3\n1 2 3 5\n2 3 4 2\n3 4 5 3\n1 3 10 10\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n-1\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In the first test the minimum value is $$$5 = w_3 + w_4$$$, because numbers $$$\\{2, 3, 4, 5\\}$$$ are distinct.<\/p><p>In the second test case, there are no suitable pair $$$(i, j)$$$.<\/p><\/div><\/div>"}, {"contestId": 1924, "index": "D", "name": "Balanced Subsequences", "rating": 2700, "solvedCount": 1562, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Balanced Subsequences<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>A sequence of brackets is called balanced if one can turn it into a valid math expression by adding characters <span class=\"tex-font-style-tt\">'+'<\/span> and <span class=\"tex-font-style-tt\">'1'<\/span>. For example, sequences <span class=\"tex-font-style-tt\">'(())()', '()',<\/span> and <span class=\"tex-font-style-tt\">'(()(()))'<\/span> are balanced, while <span class=\"tex-font-style-tt\">')(', '(()',<\/span> and <span class=\"tex-font-style-tt\">'(()))('<\/span> are not.<\/p><p>A subsequence is a sequence that can be derived from the given sequence by deleting zero or more elements without changing the order of the remaining elements.<\/p><p>You are given three integers $$$n$$$, $$$m$$$ and $$$k$$$. Find the number of sequences consisting of $$$n$$$ <span class=\"tex-font-style-tt\">'('<\/span> and $$$m$$$ <span class=\"tex-font-style-tt\">')'<\/span>, such that the longest balanced subsequence is of length $$$2 \\cdot k$$$. Since the answer can be large calculate it modulo $$$1\\,000\\,000\\,007$$$ ($$$10^9 + 7$$$).<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>Each test contains multiple test cases. The first line contains the number of test cases $$$t$$$ ($$$1 \\le t \\le 3 \\cdot 10^3$$$). Description of the test cases follows.<\/p><p>The first line of each test case contains three integers $$$n$$$, $$$m$$$ and $$$k$$$ ($$$1 \\le n, m, k \\le 2 \\cdot 10^3$$$)<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>For each test case, print one integer \u2014 the answer to the problem.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n<div class=\"test-example-line test-example-line-even test-example-line-0\">3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-1\">2 2 2<\/div><div class=\"test-example-line test-example-line-even test-example-line-2\">3 2 3<\/div><div class=\"test-example-line test-example-line-odd test-example-line-3\">3 2 1<\/div><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n2\n0\n4\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>For the first test case <span class=\"tex-font-style-tt\">\"()()\", \"(())\"<\/span> are the $$$2$$$ sequences<\/p><p>For the second test case no sequence is possible.<\/p><p>For the third test case <span class=\"tex-font-style-tt\">\")((()\", \")(()(\", \")()((\", \"())((\"<\/span> are the $$$4$$$ sequences.<\/p><\/div><\/div>"}, {"contestId": 827, "index": "D", "name": "Best Edge Weight", "rating": 2700, "solvedCount": 1530, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Best Edge Weight<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>You are given a connected weighted graph with <span class=\"tex-span\"><i>n<\/i><\/span> vertices and <span class=\"tex-span\"><i>m<\/i><\/span> edges. The graph doesn't contain loops nor multiple edges. Consider some edge with id <span class=\"tex-span\"><i>i<\/i><\/span>. Let's determine for this edge the maximum integer weight we can give to it so that it is contained in all minimum spanning trees of the graph if we don't change the other weights.<\/p><p>You are to determine this maximum weight described above for each edge. You should calculate the answer for each edge independently, it means there can't be two edges with changed weights at the same time.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">2\u2009\u2264\u2009<i>n<\/i>\u2009\u2264\u20092\u00b710<sup class=\"upper-index\">5<\/sup><\/span>, <span class=\"tex-span\"><i>n<\/i>\u2009-\u20091\u2009\u2264\u2009<i>m<\/i>\u2009\u2264\u20092\u00b710<sup class=\"upper-index\">5<\/sup><\/span>), where <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> are the number of vertices and the number of edges in the graph, respectively.<\/p><p>Each of the next <span class=\"tex-span\"><i>m<\/i><\/span> lines contains three integers <span class=\"tex-span\"><i>u<\/i><\/span>, <span class=\"tex-span\"><i>v<\/i><\/span> and <span class=\"tex-span\"><i>c<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>v<\/i>,\u2009<i>u<\/i>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\"><i>v<\/i>\u2009\u2260\u2009<i>u<\/i><\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>c<\/i>\u2009\u2264\u200910<sup class=\"upper-index\">9<\/sup><\/span>) meaning that there is an edge between vertices <span class=\"tex-span\"><i>u<\/i><\/span> and <span class=\"tex-span\"><i>v<\/i><\/span> with weight <span class=\"tex-span\"><i>c<\/i><\/span>. <\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print the answer for each edge in the order the edges are given in the input. If an edge is contained in every minimum spanning tree with any weight, print <span class=\"tex-font-style-tt\">-1<\/span> as the answer.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 4<br/>1 2 2<br/>2 3 2<br/>3 4 2<br/>4 1 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>2 2 2 1 <\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>4 3<br/>1 2 2<br/>2 3 2<br/>3 4 2<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>-1 -1 -1 <\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 367, "index": "E", "name": "Sereja and Intervals", "rating": 2700, "solvedCount": 1455, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">E. Sereja and Intervals<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>1 second<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Sereja is interested in intervals of numbers, so he has prepared a problem about intervals for you. An interval of numbers is a pair of integers <span class=\"tex-span\">[<i>l<\/i>,\u2009<i>r<\/i>]<\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>l<\/i>\u2009\u2264\u2009<i>r<\/i>\u2009\u2264\u2009<i>m<\/i>)<\/span>. Interval <span class=\"tex-span\">[<i>l<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>r<\/i><sub class=\"lower-index\">1<\/sub>]<\/span> belongs to interval <span class=\"tex-span\">[<i>l<\/i><sub class=\"lower-index\">2<\/sub>,\u2009<i>r<\/i><sub class=\"lower-index\">2<\/sub>]<\/span> if the following condition is met: <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\">2<\/sub>\u2009\u2264\u2009<i>l<\/i><sub class=\"lower-index\">1<\/sub>\u2009\u2264\u2009<i>r<\/i><sub class=\"lower-index\">1<\/sub>\u2009\u2264\u2009<i>r<\/i><sub class=\"lower-index\">2<\/sub><\/span>.<\/p><p>Sereja wants to write out a sequence of <span class=\"tex-span\"><i>n<\/i><\/span> intervals <span class=\"tex-span\">[<i>l<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>r<\/i><sub class=\"lower-index\">1<\/sub>]<\/span>, <span class=\"tex-span\">[<i>l<\/i><sub class=\"lower-index\">2<\/sub>,\u2009<i>r<\/i><sub class=\"lower-index\">2<\/sub>]<\/span>, <span class=\"tex-span\">...<\/span>, <span class=\"tex-span\">[<i>l<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub>,\u2009<i>r<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub>]<\/span> on a piece of paper. At that, no interval in the sequence can belong to some other interval of the sequence. Also, Sereja loves number <span class=\"tex-span\"><i>x<\/i><\/span> very much and he wants some (at least one) interval in the sequence to have <span class=\"tex-span\"><i>l<\/i><sub class=\"lower-index\"><i>i<\/i><\/sub>\u2009=\u2009<i>x<\/i><\/span>. Sereja wonders, how many distinct ways to write such intervals are there?<\/p><p>Help Sereja and find the required number of ways modulo <span class=\"tex-span\">1000000007<\/span> <span class=\"tex-span\">(10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097)<\/span>.<\/p><p>Two ways are considered distinct if there is such <span class=\"tex-span\"><i>j<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>j<\/i>\u2009\u2264\u2009<i>n<\/i>)<\/span>, that the <span class=\"tex-span\"><i>j<\/i><\/span>-th intervals in two corresponding sequences are not equal.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains integers <span class=\"tex-span\"><i>n<\/i><\/span>, <span class=\"tex-span\"><i>m<\/i><\/span>, <span class=\"tex-span\"><i>x<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>n<\/i>\u00b7<i>m<\/i>\u2009\u2264\u2009100000,\u20091\u2009\u2264\u2009<i>x<\/i>\u2009\u2264\u2009<i>m<\/i>)<\/span> \u2014 the number of segments in the sequence, the constraints on the numbers in segments and Sereja's favourite number.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>In a single line print the answer modulo <span class=\"tex-span\">1000000007<\/span> <span class=\"tex-span\">(10<sup class=\"upper-index\">9<\/sup>\u2009+\u20097)<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>1 1 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 5 1<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>240<br/><\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>2 3 3<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>6<br/><\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>In third example next sequences will be correct: <span class=\"tex-span\">{[1,\u20091],\u2009[3,\u20093]}<\/span>, <span class=\"tex-span\">{[1,\u20092],\u2009[3,\u20093]}<\/span>, <span class=\"tex-span\">{[2,\u20092],\u2009[3,\u20093]}<\/span>, <span class=\"tex-span\">{[3,\u20093],\u2009[1,\u20091]}<\/span>, <span class=\"tex-span\">{[3,\u20093],\u2009[2,\u20092]}<\/span>, <span class=\"tex-span\">{[3,\u20093],\u2009[1,\u20092]}<\/span>.<\/p><\/div><\/div>"}, {"contestId": 713, "index": "D", "name": "Animals and Puzzle", "rating": 2700, "solvedCount": 1454, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Animals and Puzzle<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>5 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Owl Sonya gave a huge lake puzzle of size <span class=\"tex-span\"><i>n<\/i>\u2009\u00d7\u2009<i>m<\/i><\/span> to hedgehog Filya as a birthday present. Friends immediately started to assemble the puzzle, but some parts of it turned out to be empty\u00a0\u2014 there was no picture on them. Parts with picture on it are denoted by <span class=\"tex-span\">1<\/span>, while empty parts are denoted by <span class=\"tex-span\">0<\/span>. Rows of the puzzle are numbered from top to bottom with integers from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>n<\/i><\/span>, while columns are numbered from left to right with integers from <span class=\"tex-span\">1<\/span> to <span class=\"tex-span\"><i>m<\/i><\/span>.<\/p><p>Animals decided to complete the picture and play with it, as it might be even more fun! Owl and hedgehog ask each other some queries. Each query is provided by four integers <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\">1<\/sub><\/span>, <span class=\"tex-span\"><i>y<\/i><sub class=\"lower-index\">1<\/sub><\/span>, <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\">2<\/sub><\/span>, <span class=\"tex-span\"><i>y<\/i><sub class=\"lower-index\">2<\/sub><\/span> which define the rectangle, where <span class=\"tex-span\">(<i>x<\/i><sub class=\"lower-index\">1<\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\">1<\/sub>)<\/span> stands for the coordinates of the up left cell of the rectangle, while <span class=\"tex-span\">(<i>x<\/i><sub class=\"lower-index\">2<\/sub>,\u2009<i>y<\/i><sub class=\"lower-index\">2<\/sub>)<\/span> stands for the coordinates of the bottom right cell. The answer to the query is the size of the maximum <span class=\"tex-font-style-bf\">square<\/span> consisting of picture parts only (only parts denoted by <span class=\"tex-span\">1<\/span>) and located fully inside the query rectangle.<\/p><p>Help Sonya and Filya answer <span class=\"tex-span\"><i>t<\/i><\/span> queries.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains two integers <span class=\"tex-span\"><i>n<\/i><\/span> and <span class=\"tex-span\"><i>m<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>n<\/i>,\u2009<i>m<\/i>\u2009\u2264\u20091000<\/span>)\u00a0\u2014 sizes of the puzzle.<\/p><p>Each of the following <span class=\"tex-span\"><i>n<\/i><\/span> lines contains <span class=\"tex-span\"><i>m<\/i><\/span> integers <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>ij<\/i><\/sub><\/span>. Each of them is equal to <span class=\"tex-span\">1<\/span> if the corresponding cell contains a picture and <span class=\"tex-span\">0<\/span> if it's empty.<\/p><p>Next line contains an integer <span class=\"tex-span\"><i>t<\/i><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>t<\/i>\u2009\u2264\u20091\u2009000\u2009000<\/span>)\u00a0\u2014 the number of queries.<\/p><p>Then follow <span class=\"tex-span\"><i>t<\/i><\/span> lines with queries' descriptions. Each of them contains four integers <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\">1<\/sub><\/span>, <span class=\"tex-span\"><i>y<\/i><sub class=\"lower-index\">1<\/sub><\/span>, <span class=\"tex-span\"><i>x<\/i><sub class=\"lower-index\">2<\/sub><\/span>, <span class=\"tex-span\"><i>y<\/i><sub class=\"lower-index\">2<\/sub><\/span> (<span class=\"tex-span\">1\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\">1<\/sub>\u2009\u2264\u2009<i>x<\/i><sub class=\"lower-index\">2<\/sub>\u2009\u2264\u2009<i>n<\/i><\/span>, <span class=\"tex-span\">1\u2009\u2264\u2009<i>y<\/i><sub class=\"lower-index\">1<\/sub>\u2009\u2264\u2009<i>y<\/i><sub class=\"lower-index\">2<\/sub>\u2009\u2264\u2009<i>m<\/i><\/span>)\u00a0\u2014 coordinates of the up left and bottom right cells of the query rectangle.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print <span class=\"tex-span\"><i>t<\/i><\/span> lines. The <span class=\"tex-span\"><i>i<\/i><\/span>-th of them should contain the maximum size of the square consisting of <span class=\"tex-span\">1<\/span>-s and lying fully inside the query rectangle.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>3 4<br/>1 1 0 1<br/>0 1 1 0<br/>0 1 1 0<br/>5<br/>1 1 2 3<br/>2 1 3 2<br/>3 2 3 4<br/>1 1 3 4<br/>1 2 3 4<br/><\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>1<br/>1<br/>1<br/>2<br/>2<br/><\/pre><\/div><\/div><\/div><\/div>"}, {"contestId": 1422, "index": "F", "name": "Boring Queries", "rating": 2700, "solvedCount": 1442, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">F. Boring Queries<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>512 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>Yura owns a quite ordinary and boring array $$$a$$$ of length $$$n$$$. You think there is nothing more boring than that, but Vladik doesn't agree!<\/p><p>In order to make Yura's array even more boring, Vladik makes $$$q$$$ boring queries. Each query consists of two integers $$$x$$$ and $$$y$$$. Before answering a query, the bounds $$$l$$$ and $$$r$$$ for this query are calculated: $$$l = (last + x) \\bmod n + 1$$$, $$$r = (last + y) \\bmod n + 1$$$, where $$$last$$$ is the answer on the previous query (zero initially), and $$$\\bmod$$$ is the remainder operation. Whenever $$$l  \\gt  r$$$, they are swapped.<\/p><p>After Vladik computes $$$l$$$ and $$$r$$$ for a query, he is to compute the least common multiple (LCM) on the segment $$$[l; r]$$$ of the initial array $$$a$$$ modulo $$$10^9 + 7$$$. LCM of a multiset of integers is the smallest positive integer that is divisible by all the elements of the multiset. The obtained LCM is the answer for this query.<\/p><p>Help Vladik and compute the answer for each query!<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line contains a single integer $$$n$$$ ($$$1 \\le n \\le 10^5$$$) \u2014 the length of the array.<\/p><p>The second line contains $$$n$$$ integers $$$a_i$$$ ($$$1 \\le a_i \\le 2 \\cdot 10^5$$$) \u2014 the elements of the array.<\/p><p>The third line contains a single integer $$$q$$$ ($$$1 \\le q \\le 10^5$$$) \u2014 the number of queries.<\/p><p>The next $$$q$$$ lines contain two integers $$$x$$$ and $$$y$$$ each ($$$1 \\le x, y \\le n$$$) \u2014 the description of the corresponding query.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$q$$$ integers\u00a0\u2014 the answers for the queries.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Example<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n3\n2 3 5\n4\n1 3\n3 3\n2 3\n2 3\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\n6\n2\n15\n30\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>Consider the example:<\/p><ul> <li> boundaries for first query are $$$(0 + 1) \\bmod 3 + 1 = 2$$$ and $$$(0 + 3) \\bmod 3 + 1 = 1$$$. LCM for segment $$$[1, 2]$$$ is equal to $$$6$$$; <\/li><li> boundaries for second query are $$$(6 + 3) \\bmod 3 + 1 = 1$$$ and $$$(6 + 3) \\bmod 3 + 1 = 1$$$. LCM for segment $$$[1, 1]$$$ is equal to $$$2$$$; <\/li><li> boundaries for third query are $$$(2 + 2) \\bmod 3 + 1 = 2$$$ and $$$(2 + 3) \\bmod 3 + 1 = 3$$$. LCM for segment $$$[2, 3]$$$ is equal to $$$15$$$; <\/li><li> boundaries for fourth query are $$$(15 + 2) \\bmod 3 + 1 = 3$$$ and $$$(15 + 3) \\bmod 3 + 1 = 1$$$. LCM for segment $$$[1, 3]$$$ is equal to $$$30$$$. <\/li><\/ul><\/div><\/div>"}, {"contestId": 1515, "index": "G", "name": "Phoenix and Odometers", "rating": 2700, "solvedCount": 1435, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">G. Phoenix and Odometers<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>2 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>standard input<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>standard output<\/div><\/div><div><p>In Fire City, there are $$$n$$$ intersections and $$$m$$$ one-way roads. The $$$i$$$-th road goes from intersection $$$a_i$$$ to $$$b_i$$$ and has length $$$l_i$$$ miles. <\/p><p>There are $$$q$$$ cars that may only drive along those roads. The $$$i$$$-th car starts at intersection $$$v_i$$$ and has an odometer that begins at $$$s_i$$$, increments for each mile driven, and resets to $$$0$$$ whenever it reaches $$$t_i$$$. Phoenix has been tasked to drive cars along some roads (possibly none) and <span class=\"tex-font-style-bf\">return them to their initial intersection<\/span> with the odometer showing $$$0$$$.<\/p><p>For each car, please find if this is possible. <\/p><p>A car may visit the same road or intersection an arbitrary number of times. The odometers don't stop counting the distance after resetting, so odometers may also be reset an arbitrary number of times.<\/p><\/div><div class=\"input-specification\"><div class=\"section-title\">Input<\/div><p>The first line of the input contains two integers $$$n$$$ and $$$m$$$ ($$$2 \\le n \\le 2 \\cdot 10^5$$$; $$$1 \\le m \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of intersections and the number of roads, respectively.<\/p><p>Each of the next $$$m$$$ lines contain three integers $$$a_i$$$, $$$b_i$$$, and $$$l_i$$$ ($$$1 \\le a_i, b_i \\le n$$$; $$$a_i \\neq b_i$$$; $$$1 \\le l_i \\le 10^9$$$)\u00a0\u2014 the information about the $$$i$$$-th road. The graph is not necessarily connected. It is guaranteed that between any two intersections, there is at most one road for each direction.<\/p><p>The next line contains an integer $$$q$$$ ($$$1 \\le q \\le 2 \\cdot 10^5$$$)\u00a0\u2014 the number of cars.<\/p><p>Each of the next $$$q$$$ lines contains three integers $$$v_i$$$, $$$s_i$$$, and $$$t_i$$$ ($$$1 \\le v_i \\le n$$$; $$$0 \\le s_i  \\lt  t_i \\le 10^9$$$)\u00a0\u2014 the initial intersection of the $$$i$$$-th car, the initial number on the $$$i$$$-th odometer, and the number at which the $$$i$$$-th odometer resets, respectively.<\/p><\/div><div class=\"output-specification\"><div class=\"section-title\">Output<\/div><p>Print $$$q$$$ answers. If the $$$i$$$-th car's odometer may be reset to $$$0$$$ by driving through some roads (possibly none) and returning to its starting intersection $$$v_i$$$, print <span class=\"tex-font-style-tt\">YES<\/span>. Otherwise, print <span class=\"tex-font-style-tt\">NO<\/span>.<\/p><\/div><div class=\"sample-tests\"><div class=\"section-title\">Examples<\/div><div class=\"sample-test\"><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 4\n1 2 1\n2 3 1\n3 1 2\n1 4 3\n3\n1 1 3\n1 2 4\n4 0 1\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nNO\nYES\n<\/pre><\/div><div class=\"input\"><div class=\"title\">Input<\/div><pre>\n4 5\n1 2 1\n2 3 1\n3 1 2\n1 4 1\n4 3 2\n2\n1 2 4\n4 3 5\n<\/pre><\/div><div class=\"output\"><div class=\"title\">Output<\/div><pre>\nYES\nYES\n<\/pre><\/div><\/div><\/div><div class=\"note\"><div class=\"section-title\">Note<\/div><p>The illustration for the first example is below:<\/p><center> <img class=\"tex-graphics\" height=\"265px\" src=\"https://espresso.codeforces.com/6ec87e33890a583e4163dea8dd15ffb684c189b6.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"416px\"/> <\/center><p>In the first query, Phoenix can drive through the following cities: $$$1$$$ $$$\\rightarrow$$$ $$$2$$$ $$$\\rightarrow$$$ $$$3$$$ $$$\\rightarrow$$$ $$$1$$$ $$$\\rightarrow$$$ $$$2$$$ $$$\\rightarrow$$$ $$$3$$$ $$$\\rightarrow$$$ $$$1$$$. The odometer will have reset $$$3$$$ times, but it displays $$$0$$$ at the end.<\/p><p>In the second query, we can show that there is no way to reset the odometer to $$$0$$$ and return to intersection $$$1$$$.<\/p><p>In the third query, the odometer already displays $$$0$$$, so there is no need to drive through any roads.<\/p><p>Below is the illustration for the second example: <\/p><center> <img class=\"tex-graphics\" height=\"265px\" src=\"https://espresso.codeforces.com/63b6b182cfbd5cdae8074f48985c6395652e8114.png\" style=\"max-width: 100.0%;max-height: 100.0%;\" width=\"378px\"/> <\/center><\/div><\/div>"}, {"contestId": 351, "index": "D", "name": "Jeff and Removing Periods", "rating": 2700, "solvedCount": 1431, "html": "<div class=\"problem-statement\"><div class=\"header\"><div class=\"title\">D. Jeff and Removing Periods<\/div><div class=\"time-limit\"><div class=\"property-title\">time limit per test<\/div>3 seconds<\/div><div class=\"memory-limit\"><div class=\"property-title\">memory limit per test<\/div>256 megabytes<\/div><div class=\"input-file input-standard\"><div class=\"property-title\">input<\/div>stdin<\/div><div class=\"output-file output-standard\"><div class=\"property-title\">output<\/div>stdout<\/div><\/div><div><p>Cosider a sequence, consisting of <span class=\"tex-span\"><i>n<\/i><\/span> integers: <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">1<\/sub><\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\">2<\/sub><\/span>, <span class=\"tex-span\">...<\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>n<\/i><\/sub><\/span>. Jeff can perform the following operation on sequence <span class=\"tex-span\"><i>a<\/i><\/span>:<\/p><ul> <li> take three integers <span class=\"tex-span\"><i>v<\/i><\/span>, <span class=\"tex-span\"><i>t<\/i><\/span>, <span class=\"tex-span\"><i>k<\/i><\/span> <span class=\"tex-span\">(1\u2009\u2264\u2009<i>v<\/i>,\u2009<i>t<\/i>\u2009\u2264\u2009<i>n<\/i>;\u00a00\u2009\u2264\u2009<i>k<\/i>;\u00a0<i>v<\/i>\u2009+\u2009<i>tk<\/i>\u2009\u2264\u2009<i>n<\/i>)<\/span>, such that <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>v<\/i><\/sub><\/span> = <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>v<\/i>\u2009+\u2009<i>t<\/i><\/sub><\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>v<\/i>\u2009+\u2009<i>t<\/i><\/sub><\/span> = <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>v<\/i>\u2009+\u20092<i>t<\/i><\/sub><\/span>, <span class=\"tex-span\">...<\/span>, <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>v<\/i>\u2009+\u2009<i>t<\/i>(<i>k<\/i>\u2009-\u20091)<\/sub><\/span> = <span class=\"tex-span\"><i>a<\/i><sub class=\"lower-index\"><i>v<\/i>\u2009+\u2009<i>tk<\/i><\/sub><\/span>; <\/li><li> remove elements <span class=\"tex-span\"><i>a
